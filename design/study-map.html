<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Map</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8ECF0;--face:#F7F9FA;--ink:#17212B;--muted:#55647A;--rule:#C6D0DA;--accent:#1F5C9E;--star:#A8461A;
  --app:#1F5C9E;--tra:#23794A;--int:#A8461A;--lnk:#6E4526;--host:#4E5D70;--none:#8593A3;
  --focus:#1F5C9E;--on-ink:#F7F9FA;--sel:#DCE6F2;
  --head:"Bahnschrift","DIN Alternate","Roboto Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111922;--face:#19242F;--ink:#E2E9F0;--muted:#98A8B9;--rule:#2E3D4C;--accent:#6AA5EA;--star:#F0874A;
    --app:#6AA5EA;--tra:#4DBB7F;--int:#F0874A;--lnk:#C08B63;--host:#A3B1C2;--none:#6F7F90;
    --focus:#8CC4F2;--on-ink:#111922;--sel:#22344A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111922;--face:#19242F;--ink:#E2E9F0;--muted:#98A8B9;--rule:#2E3D4C;--accent:#6AA5EA;--star:#F0874A;
  --app:#6AA5EA;--tra:#4DBB7F;--int:#F0874A;--lnk:#C08B63;--host:#A3B1C2;--none:#6F7F90;
  --focus:#8CC4F2;--on-ink:#111922;--sel:#22344A;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
a{color:var(--accent);text-underline-offset:2px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:.5rem;z-index:9;padding:.5rem .8rem;border-radius:6px;background:var(--face);color:var(--ink)}
.skip:focus{left:.5rem}
.wrap{max-width:74rem;margin:0 auto;padding:0 1rem 1.2rem}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem 1.2rem;padding:1.4rem 0 .6rem}
h1{margin:0;font:700 clamp(2rem,6vw,2.6rem)/1 var(--head)}
.lede{flex:1 1 22rem;margin:0;color:var(--muted)}
.star{color:var(--star);font-weight:700}
#app{display:none}
.js #app{display:block}
.js #all{display:none}
.search input{width:100%;padding:.65rem .85rem;border:2px solid var(--rule);border-radius:8px;background:var(--face);font-size:1.05rem}
.search input:focus{border-color:var(--focus);outline:none}
.search input::placeholder{color:var(--muted);opacity:1}
.tabs{display:flex;gap:.15rem;margin:.6rem 0 0;border-bottom:2px solid var(--rule);overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;margin-bottom:-2px;padding:.55rem .8rem;border:0;border-bottom:3px solid transparent;background:none;font:700 1rem var(--head);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{border-bottom-color:var(--ink);color:var(--ink)}
.panes{display:grid;gap:1rem;margin-top:.8rem}
.side,.detail{min-width:0}
.detail{display:none}
@media screen and (min-width:900px){
  .js .wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-bottom:.4rem}
  .js .top{padding:1rem 0 .5rem}
  .js #app{display:flex;flex-direction:column;flex:1;min-height:0}
  .panes{flex:1;min-height:0;grid-template-columns:minmax(17rem,23rem) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .side,.detail{height:100%;overflow:auto;overscroll-behavior:contain}
  .side{padding-right:.4rem}
  .detail{display:block;padding:1rem 1.2rem;border:1px solid var(--rule);border-radius:8px;background:var(--face)}
  .js .foot{flex:none;margin-top:.5rem;padding-top:.4rem;font-size:.8rem}
  .js .foot p{margin:0}
}
.status{margin:.2rem 0 .5rem;font-size:.93rem;color:var(--muted)}
.linkish{margin-left:.5rem;padding:0;border:0;background:none;color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 .6rem}
.pill{min-height:2.2rem;padding:.3rem .85rem;border:1.5px solid var(--rule);border-radius:999px;background:var(--face);font-weight:600;font-size:.92rem;cursor:pointer}
.pill[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.gh{margin:.9rem 0 .3rem;font:700 1.02rem/1.2 var(--head)}
.gh:first-child{margin-top:.2rem}
.gs{margin:.55rem 0 .2rem;font:600 .9rem/1.25 var(--head);color:var(--muted)}
.items{margin:0;padding:0;list-style:none}
.it{display:flex;align-items:center;gap:.45rem;width:100%;min-height:2.4rem;padding:.35rem .55rem;border:0;border-left:4px solid var(--gc,var(--rule));border-radius:4px;background:none;text-align:left;cursor:pointer;line-height:1.25}
.it:hover{background:var(--face)}
.it[aria-current="true"]{background:var(--sel);font-weight:650}
.it .t{flex:1}
.it .tg{flex:none;font:600 .78rem var(--head);color:var(--muted);white-space:nowrap}
.rt{flex:none;width:.75rem;height:.75rem;border:2px solid var(--muted);border-radius:50%}
.rt-shaky{background:linear-gradient(90deg,var(--muted) 50%,transparent 50%)}
.rt-solid{background:var(--muted)}
.inline{margin:.2rem 0 .7rem .3rem;padding:.8rem .9rem;border:1px solid var(--rule);border-radius:8px;background:var(--face)}
.stack{display:grid;grid-template-columns:minmax(0,1fr) 5.6rem;gap:3px 5px;margin:0 0 .4rem}
.ly{grid-column:1;display:grid;grid-template-columns:1.8rem minmax(0,1fr) auto;align-items:center;min-height:2.3rem;padding:0 .6rem 0 0;border:0;border-left:6px solid var(--gc);border-radius:4px;background:color-mix(in srgb,var(--gc) 13%,var(--face));text-align:left;cursor:pointer}
.ly .n{font:700 .95rem var(--head);text-align:center;color:var(--gc)}
.nm{font:600 .95rem/1.15 var(--head)}
.ct{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ly.zero .nm,.ly.zero .ct{opacity:.55}
.br{grid-column:2;display:flex;align-items:center;justify-content:center;padding:0 .3rem;border:0;border-right:6px solid var(--gc);border-radius:4px;background:color-mix(in srgb,var(--gc) 8%,transparent);font:600 .84rem/1.1 var(--head);color:var(--gc);text-align:center;cursor:pointer}
.ly[aria-pressed="true"],.br[aria-pressed="true"]{background:color-mix(in srgb,var(--gc) 30%,var(--face));box-shadow:inset 0 0 0 2px var(--gc)}
.host{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:2.3rem;margin-top:4px;padding:0 .6rem;border:2px dashed var(--host);border-radius:6px;background:transparent;text-align:left;cursor:pointer}
.host[aria-pressed="true"]{border-style:solid;background:color-mix(in srgb,var(--host) 16%,var(--face))}
.stack-note{margin:0 0 .5rem;font-size:.86rem;color:var(--muted)}
.g-app{--gc:var(--app)}.g-tra{--gc:var(--tra)}.g-int{--gc:var(--int)}.g-lnk{--gc:var(--lnk)}.g-host{--gc:var(--host)}.g-none{--gc:var(--none)}
.d h2{margin:0;font:700 1.45rem/1.15 var(--head)}
.d .meta{margin:.25rem 0 .6rem;font-size:.9rem;color:var(--muted)}
.d h3{margin:1rem 0 .35rem;font:700 1rem var(--head)}
.d ul{margin:0;padding-left:1.1rem}
.d li{margin:.15rem 0}
.parts{list-style:none;padding:0!important}
.parts li{margin:0 0 .45rem}
.parts b{font-weight:650}
.k{margin-left:.35rem;padding:.12rem .4rem;border:1px solid var(--muted);border-radius:3px;font:600 .74rem/1 var(--head);color:var(--muted);white-space:nowrap}
.k-lab{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.k-build,.k-fix{border-color:var(--ink);color:var(--ink)}
.w{display:block;font-size:.88rem;color:var(--muted)}
.sys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.3rem .7rem;margin:0}
.sys dt{font:700 .86rem/1.6 var(--head);color:var(--muted)}
.sys dd{margin:0}
code{font:.84rem var(--mono);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.2rem 0}
.chip{display:inline-block;padding:.2rem .65rem;border:1px solid var(--rule);border-radius:999px;background:var(--bg);color:var(--ink);font-size:.88rem;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.src{margin-left:.4rem;font-size:.8rem;color:var(--muted)}
.none,.empty{color:var(--muted)}
.empty{padding:.9rem;border:1px dashed var(--rule);border-radius:8px;background:var(--face)}
.empty p{margin:0 0 .6rem}.empty p:last-child{margin:0}
.rate{margin:1.1rem 0 0;padding:0;border:0}
.rate legend{margin-bottom:.4rem;padding:0;font:700 1rem var(--head)}
.share{margin:.9rem 0 0}
.cpy{width:100%;padding:.4rem .5rem;border:1px solid var(--rule);border-radius:3px;background:var(--face);font:.86rem var(--mono)}
.tally{margin:.2rem 0 .6rem;color:var(--muted);font-size:.93rem}
.nx{display:block;font-size:.86rem;color:var(--muted)}
.legend{margin:.8rem 0 0;font-size:.9rem;color:var(--muted)}
.legend dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .6rem;align-items:center;margin:.4rem 0 0}
.legend dd{margin:0}
.foot{margin-top:1.4rem;padding-top:.8rem;border-top:1px solid var(--rule);font-size:.86rem;color:var(--muted)}
.foot p{margin:0 0 .4rem}
/* static listing: printing, and browsers without JavaScript */
#all h2{margin:2rem 0 .4rem;font:700 1.6rem/1.1 var(--head)}
#all h3{margin:1.5rem 0 .5rem;font:700 1.2rem/1.2 var(--head)}
#all .note{margin:.3rem 0;color:var(--muted);font-size:.95rem}
#all .c{margin:0 0 .6rem;padding:.7rem .85rem;border:1px solid var(--rule);border-radius:6px;background:var(--face)}
#all .c h4{margin:0;font-size:1.05rem;line-height:1.3}
#all .c .meta{margin:.15rem 0 .45rem;font-size:.86rem;color:var(--muted)}
#all .c dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.3rem .7rem;margin:0}
#all .c dt{font:700 .86rem/1.6 var(--head);color:var(--muted)}
#all .c dd{margin:0}
#all .c ul{margin:0;padding-left:1.05rem}
#all .k{margin-left:.3rem;padding:0;border:0;font:600 .75rem var(--head);color:var(--muted)}
#all .gap{color:var(--muted);font-style:italic}
#all .list{margin:.3rem 0 .9rem;padding-left:1.1rem}
#all .toc{columns:2 14rem;margin:.6rem 0 0;padding-left:1.1rem}
@media print{
  #app,.skip{display:none!important}
  #all{display:block!important}
  body{background:#fff}
  #all .c{break-inside:avoid}
}
@media (prefers-reduced-motion:no-preference){.it{transition:background .1s}}
</style>
</head>
<body>
<a class="skip" href="#q">Skip to search</a>
<div class="wrap">
<header class="top">
  <h1>Study Map</h1>
  <p class="lede">Every concept in the course: where to learn it and where to practice it. <span class="star">&#9733;</span> marks what every track needs.</p>
</header>
<div id="app">
  <div class="search"><label class="vh" for="q">Search concepts</label><input id="q" type="search" placeholder="Search: OSI, VLAN, lockout, sudo, net accounts" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <div class="tabs" role="tablist" aria-label="Browse by">
    <button class="tab" type="button" role="tab" id="t-topic" data-tab="topic" aria-selected="true">Topic</button>
    <button class="tab" type="button" role="tab" id="t-track" data-tab="track" aria-selected="false">Track</button>
    <button class="tab" type="button" role="tab" id="t-grade" data-tab="grade" aria-selected="false">Grade</button>
    <button class="tab" type="button" role="tab" id="t-layer" data-tab="layer" aria-selected="false">Layer</button>
    <button class="tab" type="button" role="tab" id="t-app" data-tab="app" aria-selected="false">App</button>
    <button class="tab" type="button" role="tab" id="t-path" data-tab="path" aria-selected="false">My path<span id="t-path-n"></span></button>
  </div>
  <div class="panes">
    <section class="side" id="side" role="tabpanel" aria-labelledby="t-topic">
      <div id="filters"></div>
      <p class="status" id="status" aria-live="polite"></p>
      <div id="list"></div>
    </section>
    <section class="detail" id="detail" aria-label="Details" tabindex="-1"></section>
  </div>
</div>
<script type="application/json" id="sm-data">{"study_map":"no data yet"}</script>
<script>
(function () {
  'use strict';
  function $(s) { return document.querySelector(s); }
  function el(tag, props, kids) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') e.textContent = v;
      else if (k === 'cls') e.className = v;
      else e.setAttribute(k, v);
    });
    if (kids) kids.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

  var D = null;
  try { D = JSON.parse($('#sm-data').textContent); } catch (err) { D = null; }
  if (!D || !Array.isArray(D.concepts)) return;
  document.documentElement.classList.add('js');

  var KIND = {lab: 'Lab', build: 'Build', fix: 'Troubleshoot', drill: 'Drill'};
  var LAYERS = [
    {id: '7', name: 'Application', g: 'app'}, {id: '6', name: 'Presentation', g: 'app'}, {id: '5', name: 'Session', g: 'app'},
    {id: '4', name: 'Transport', g: 'tra'}, {id: '3', name: 'Network', g: 'int'},
    {id: '2', name: 'Data link', g: 'lnk'}, {id: '1', name: 'Physical', g: 'lnk'}
  ];
  var GROUPS = [
    {id: 'app', name: 'Application', layers: ['7', '6', '5'], row: '1 / 4'},
    {id: 'tra', name: 'Transport', layers: ['4'], row: '4 / 5'},
    {id: 'int', name: 'Internet', layers: ['3'], row: '5 / 6'},
    {id: 'lnk', name: 'Link', layers: ['2', '1'], row: '6 / 8'}
  ];
  var BANDS = ['freshman', 'sophomore', 'junior', 'senior'];
  var BAND_TAG = {freshman: 'Fr', sophomore: 'So', junior: 'Jr', senior: 'Sr'};
  var RATE = {'new': 'New', shaky: 'Shaky', solid: 'Solid'};
  var TABS = ['topic', 'track', 'grade', 'layer', 'app', 'path'];
  var KR = 't4t.study-map.ratings', KP = 't4t.study-map.prefs';
  var store = {
    get: function (k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable: keep going */ } }
  };
  var ratings = store.get(KR);
  if (!ratings || typeof ratings !== 'object') ratings = {};
  var prefs = store.get(KP) || {};
  var trackIds = D.tracks.map(function (t) { return t[0]; });
  var S = {
    tab: TABS.indexOf(prefs.tab) >= 0 ? prefs.tab : 'topic',
    track: trackIds.indexOf(prefs.track) >= 0 ? prefs.track : 'all',
    q: '', layer: null, sel: null, app: null
  };
  var wide = window.matchMedia('(min-width: 900px)');

  var byId = {}, topo = {}, seq = 0;
  D.concepts.forEach(function (c) { byId[c.id] = c; c.next = []; });
  D.concepts.forEach(function (c) { c.prereqs.forEach(function (p) { if (byId[p]) byId[p].next.push(c.id); }); });
  function walk(c) {
    if (c.seen) return;
    c.seen = true;
    c.prereqs.forEach(function (p) { if (byId[p]) walk(byId[p]); });
    topo[c.id] = seq++;
  }
  D.concepts.forEach(walk);
  function norm(s) { return String(s).toLowerCase().replace(/[‘’]/g, "'").replace(/\s+/g, ' ').trim(); }
  function groupOf(c) {
    var nums = c.layers.filter(function (x) { return x !== 'host'; }).map(Number).sort(function (a, b) { return a - b; });
    var first = nums.length ? String(nums[0]) : null;
    if (!first) return c.layers.length ? 'host' : 'none';
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].layers.indexOf(first) >= 0) return GROUPS[i].id;
    return 'none';
  }
  function layerTag(c) {
    var net = c.layers.filter(function (x) { return x !== 'host'; }).map(Number).sort(function (a, b) { return a - b; });
    var t = net.length ? 'L' + net[0] + (net.length > 1 ? '–' + net[net.length - 1] : '') : '';
    if (c.layers.indexOf('host') >= 0) t = t ? t + ', host' : 'Host';
    return t;
  }
  var groupTitle = {};
  D.groups.forEach(function (g) { groupTitle[g.id] = g.title; });
  D.concepts.forEach(function (c) {
    var lw = c.layers.map(function (x) {
      if (x === 'host') return 'host';
      var L = LAYERS.filter(function (y) { return y.id === x; })[0], g = GROUPS.filter(function (y) { return y.layers.indexOf(x) >= 0; })[0];
      return 'layer ' + x + ' l' + x + ' ' + (L ? L.name : '') + ' ' + (g ? g.name : '');
    });
    var bits = [c.name, c.aka.join(' '), groupTitle[c.group] || '', c.band, lw.join(' ')];
    c.parts.forEach(function (p) { bits.push(p.name, p.summary); });
    Object.keys(c.impl).forEach(function (k) { bits.push(c.impl[k]); });
    c.practice.forEach(function (p) { var t = D.tools[p.tool]; if (t) bits.push(t.name); bits.push(p.where.join(' ')); });
    c.learn.concat(c.check, c.drill).forEach(function (a) { bits.push(D.units[a] || ''); });
    c.hay = norm(bits.join(' '));
    c.g = groupOf(c);
  });

  var site = String(D.site || '').replace(/\/+$/, '');
  var HOSTS = ['freeapp4that.store', 'tool4that.github.io', 'localhost', '127.0.0.1'];
  var relative = location.protocol !== 'file:' && HOSTS.indexOf(location.hostname) >= 0;
  function href(path) { return (relative ? '../' : site + '/') + path; }
  function dlHref(anchor) { return href('defense-ladder/' + (D.deep ? '#' + anchor : '')); }

  var qmemo = {q: null, phrase: false};
  function queryOk(c) {
    var q = norm(S.q);
    if (!q) return true;
    if (qmemo.q !== q) qmemo = {q: q, phrase: D.concepts.some(function (x) { return x.hay.indexOf(q) >= 0; })};
    if (qmemo.phrase) return c.hay.indexOf(q) >= 0;
    return q.split(' ').every(function (w) { return c.hay.indexOf(w) >= 0; });
  }
  function onTrack(c, t) { return t === 'all' ? c.star : (c.star || c.tracks.indexOf(t) >= 0); }
  function layerOk(c, layer) {
    if (layer === undefined) layer = S.layer;
    if (!layer) return true;
    if (layer === 'host') return c.layers.indexOf('host') >= 0;
    if (layer === 'none') return !c.layers.length;
    var g = GROUPS.filter(function (x) { return x.id === layer; })[0];
    if (g) return c.layers.some(function (x) { return g.layers.indexOf(x) >= 0; });
    return c.layers.indexOf(layer) >= 0;
  }
  function layerPhrase(layer) {
    if (layer === 'host') return 'on the host';
    if (layer === 'none') return 'not tied to a layer';
    var g = GROUPS.filter(function (x) { return x.id === layer; })[0];
    if (g) return 'in the TCP/IP ' + g.name + ' layer';
    var L = LAYERS.filter(function (x) { return x.id === layer; })[0];
    return L ? 'at layer ' + L.id + ', ' + L.name : '';
  }
  function mark(h) {
    try { history.replaceState(null, '', location.pathname + location.search + (h ? '#' + h : '')); } catch (e) { /* not allowed here */ }
  }
  function refocus(sel) { var x = document.querySelector(sel); if (x) x.focus({preventScroll: true}); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* ---------- concept details ---------- */
  function linkList(anchors, suffix) {
    return el('ul', null, anchors.map(function (a) {
      return el('li', null, [el('a', {href: dlHref(a), text: 'Defense Ladder › ' + (D.units[a] || a)}), suffix ? el('span', {cls: 'k', text: suffix}) : null]);
    }));
  }
  function practiceList(c) {
    var items = c.drill.map(function (a) {
      return el('li', null, [el('a', {href: dlHref(a), text: 'Defense Ladder › ' + (D.units[a] || a)}), el('span', {cls: 'k', text: 'Drill'})]);
    });
    c.practice.forEach(function (p) {
      var t = D.tools[p.tool] || {name: p.tool};

    var j = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1 : (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? (i - 1 + n) % n : (i + 1) % n;
    e.preventDefault();
    items[j].focus();
    items[j].click();
  });
  $('#q').addEventListener('input', function (e) {
    S.q = e.target.value.trim();
    if (S.tab === 'app' || S.tab === 'path') S.tab = 'topic';
    render();
  });
  if (wide.addEventListener) wide.addEventListener('change', render);
  window.addEventListener('hashchange', route);
  route();
})();
</script>

<!-- static listing -->
</div>
<footer class="foot">
<!-- footer -->
</footer>
</div>
</body>
