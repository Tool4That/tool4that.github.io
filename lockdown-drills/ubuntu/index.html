  const rows=items.map(i=>'<div class="chk '+(R.done[i.id]!=null?'done':'')+'"><input type="checkbox" data-done="'+i.id+'" '+(R.done[i.id]!=null?'checked':'')+' aria-label="Done: '+esc(i.title)+'"><div><div class="t"><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span>'+(R.done[i.id]!=null?'<span class="stamp">'+fmt(R.done[i.id])+'</span>':'')+'<button class="btn small" data-show="'+i.id+'">Commands</button></div><div id="show-'+i.id+'"'+(OPEN.has(i.id)?'':' hidden')+'>'+termBlock(i.cmds,true)+'</div><input class="note" data-note="'+i.id+'" placeholder="Change: what you changed and why" value="'+esc(R.notes[i.id]||'')+'" aria-label="Change for '+esc(i.id)+'"><input class="note" data-undo="'+i.id+'" placeholder="Undo: how to put it back" value="'+esc(R.undo[i.id]||'')+'" aria-label="Undo for '+esc(i.id)+'"><input class="note" data-verify="'+i.id+'" placeholder="Verified with: the command or screen that proved it" value="'+esc(R.verify[i.id]||'')+'" aria-label="Verified with, for '+esc(i.id)+'"></div></div>').join('');
  return '<h2>Run the checklist on your VM</h2><p class="lead">Set the clock, work the list top to bottom, tick each item once you have verified it on the machine, and write the change, how to undo it, and what you verified it with. The log is what lets you undo a change that broke something in thirty seconds.</p>'
   +'<div class="timer"><div class="clock" aria-live="off">'+fmt(remain)+'</div><select data-mins>'+[20,45,60,90,120].map(m=>'<option value="'+m+'" '+(m===R.mins?'selected':'')+'>'+m+' min</option>').join('')+'</select><button class="btn primary" data-act="timer">'+(tick?'Pause':'Start')+'</button><button class="btn" data-act="resetclock">Reset clock</button><label class="toggle"><input type="checkbox" data-lower '+(R.lower?'checked':'')+'> include lower levels</label></div>'
   +'<div class="nav" style="margin:0 0 10px"><button class="btn small" data-act="copylog">Copy change log</button><button class="btn small" data-act="dlog">Download change log</button><button class="btn small" data-act="clearrun">Clear this run</button></div>'
   +rows;
}
function changeLog(){const R=S.run;const lines=allItems.filter(i=>R.done[i.id]!=null||R.notes[i.id]||R.undo[i.id]||R.verify[i.id]).sort((a,b)=>(R.done[a.id]??1e9)-(R.done[b.id]??1e9)).map(i=>'['+(R.done[i.id]!=null?fmt(R.done[i.id]):'--:--')+'] '+APP.os+' | '+i.id+' '+i.title+' | change: '+(R.notes[i.id]||'-')+' | undo: '+(R.undo[i.id]||'-')+' | verified: '+(R.verify[i.id]||'-'));
  return '# Change log - '+APP.os+' - '+new Date().toLocaleString()+'\n# [time] machine | item | change | undo | verified\n'+(lines.join('\n')||'(nothing logged yet)')+'\n';}
function startTimer(){if(tick)return;tick=setInterval(()=>{S.run.elapsed++;if(S.run.elapsed%5===0)save();const c=document.querySelector('.clock');if(c)c.textContent=fmt(Math.max(0,S.run.mins*60-S.run.elapsed));if(S.run.elapsed>=S.run.mins*60){stopTimer();render();}},1000);}
function stopTimer(){clearInterval(tick);tick=null;save();}
/* games */
let G={tab:'imposter',sc:0,picks:{},checked:false,jq:null,streak:0,jfb:null};
function renderGames(){
  const tabs='<div class="tabs"><button class="btn '+(G.tab==='imposter'?'primary':'')+'" data-gtab="imposter">Who is the imposter?</button><button class="btn '+(G.tab==='judge'?'primary':'')+'" data-gtab="judge">Fix or break?</button></div>';
  if(G.tab==='imposter'){const sc=APP.imposter[G.sc];
    const rows=sc.accounts.map((a,i)=>{const p=G.picks[i]||'keep';const cls=G.checked?(p===a.truth?'ok':'bad'):'';return '<div class="acct '+cls+'"><div class="n">'+esc(a.name)+'<small>'+esc(a.info)+'</small></div><div class="seg">'+['keep','remove'].concat(a.admin?['demote']:[]).map(k=>'<button data-pick="'+i+'" data-val="'+k+'" class="'+(p===k?'on':'')+'" '+(G.checked?'disabled':'')+'>'+({keep:'Keep',remove:'Remove',demote:'Demote'})[k]+'</button>').join('')+'</div></div>'+(G.checked&&p!==a.truth?'<div class="fb bad">'+esc(a.why)+'</div>':'');}).join('');
    const right=G.checked?sc.accounts.filter((a,i)=>(G.picks[i]||'keep')===a.truth).length:0;
    return tabs+'<h2>'+esc(sc.title)+'</h2><p class="lead">Read the scenario brief, then decide for every account: keep it, remove it, or demote it from admin. The brief is the documented source of truth; when it is unclear, ask the system owner before you delete anything.</p><div class="brief"><b>Scenario brief</b><ul>'+sc.brief.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>'+termBlock(sc.output,false)+rows
      +(G.checked?'<div class="fb '+(right===sc.accounts.length?'ok':'bad')+'" style="max-width:720px">'+right+' of '+sc.accounts.length+' correct. '+esc(sc.debrief)+'</div>':'')+'<div class="nav"><button class="btn primary" data-act="'+(G.checked?'nextsc':'checksc')+'">'+(G.checked?'Next scenario':'Check my calls')+'</button></div>';
  }
  if(!G.jq){G.jq=shuffle(APP.judge.slice());}const j=G.jq[0];
  const fb=G.jfb?'<div class="fb '+(G.jfb.ok?'ok':'bad')+'"><b>'+(G.jfb.ok?'Right.':'Not this time.')+'</b> '+esc(j.why)+'</div><button class="btn primary" data-act="jnext">Next</button>':'';
  return tabs+'<div class="q"><div class="streak">streak '+G.streak+'</div><h2>Fix or break?</h2><div class="brief"><b>Scenario brief says:</b> '+esc(j.brief)+'</div><p><b>You do this:</b> '+esc(j.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-jopt="'+k+'" class="'+(G.jfb?(k===j.answer?'ok':(G.jfb.pick===k?'bad':'')):'')+'" '+(G.jfb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>'+fb+'</div>';
}
/* report */
function explainBlock(){const ex=allItems.filter(i=>(S.explain[i.id]||'').trim());if(!ex.length)return '';return '<details class="ex"><summary>Your explanations ('+ex.length+')</summary><dl>'+ex.map(i=>'<dt>'+esc(i.id)+' · '+esc(i.title)+'</dt><dd>'+esc(S.explain[i.id])+'</dd>').join('')+'</dl></details>';}
function renderReport(){
  const lv=APP.levels.map((L,i)=>{const b=badge(i);return '<div class="lv"><div class="row"><span>'+(b.earned?L.badge+' ':'')+esc(L.name)+'</span><span class="mono">'+b.learned+'/'+b.total+' learned · best '+(b.best||0)+'%</span></div><div class="bar2 '+(b.earned?'earned':'')+'"><i style="width:'+Math.round(100*b.learned/b.total)+'%"></i></div></div>';}).join('');
  const rows=allItems.map(i=>{const st=status(i);const isDue=due(i)&&st!=='mastered';const g=isDue?'⟳':{mastered:'✓',learned:'◐',drilled:'◔',none:'·'}[st];return '<div class="rr '+st+'" data-rr="'+i.id+'"><span class="g'+(isDue?' due':'')+'" title="'+(isDue?'Due: answer it right on a second day':'')+'">'+g+'</span><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span><span class="pt">'+itemScore(i)+'</span></div>';}).join('');
  return '<h2>Progress report</h2>'+lv+'<p style="font-size:.8rem;color:var(--muted)">✓ explained, and right on two different days · ◐ explained · ◔ right once · ⟳ due: right on a second day</p>'+rows+explainBlock()+'<div class="total"><span>Total</span><span>'+score()+' / '+maxScore+'</span></div>';
}
function renderFoot(){$('#foot').innerHTML=esc(APP.footer||'Training tool for virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist.')+' <button data-act="reset">Reset my progress</button>';}
function render(){
  if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches)S.mode='learn';
  renderHeader();
  const v=$('#view');const m=S.mode;
  v.innerHTML=m==='learn'?renderLearn():m==='drill'?renderDrill():m==='run'?renderRun():m==='games'?renderGames():'';
  $('#report').innerHTML=renderReport();renderFoot();
  if(m==='drill'&&Q&&!Q.finished&&!Q.fb){const t=v.querySelector('.typein');if(t)t.focus();}
  if(m==='learn'){const on=v.querySelector('.list button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
}
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.level!=null){S.level=+d.level;if(S.mode==='drill'&&Q&&Q.li!==S.level)Q=null;save();render();return;}
  if(d.mode){S.mode=d.mode;save();render();return;}
  if(d.modeGo){S.mode=d.modeGo;save();render();return;}
  if(d.learnjump){const it=byId[d.learnjump];if(it){S.level=it.li;S.sel[it.li]=it.id;S.mode='learn';Q=null;save();render();}return;}
  if(d.sel){S.sel[S.level]=d.sel;save();render();return;}
  if(d.step){const L=APP.levels[S.level];const cur=S.sel[S.level]||L.items[0].id;const i=L.items.findIndex(x=>x.id===cur)+(+d.step);if(L.items[i]){S.sel[S.level]=L.items[i].id;save();render();}return;}
  if(d.act==='copy'){const term=b.closest('.term');const lines=[...term.querySelectorAll('.ln:not(.c)')].map(n=>n.textContent.replace(PRE,'')).filter(l=>l.trim()).join('\n');copyText(lines,b);return;}
  if(d.act==='startq'){Q=makeQuiz(S.level);render();return;}
  if(d.opt!=null&&S.mode==='drill'&&Q&&!Q.fb){answer(+d.opt);render();return;}
  if(d.act==='check'){const t=$('.typein');answer(null,t?t.value:'');render();return;}
  if(d.act==='skip'){answer(null,'');render();return;}
  if(d.act==='next'){if(Q.i===Q.qs.length-1){$('#view').innerHTML=finishQuiz();renderHeader();$('#report').innerHTML=renderReport();}else{Q.i++;Q.fb=null;render();}return;}
  if(d.act==='timer'){tick?stopTimer():startTimer();render();return;}
  if(d.act==='resetclock'){stopTimer();S.run.elapsed=0;save();render();return;}
  if(d.act==='clearrun'){if(confirm('Clear all ticks, timestamps and notes for this run?')){stopTimer();S.run.done={};S.run.notes={};S.run.undo={};S.run.verify={};S.run.elapsed=0;save();render();}return;}
  if(d.act==='copylog'){copyText(changeLog(),b);return;}
  if(d.act==='dlog'){const blob=new Blob([changeLog()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='change-log-'+APP.key+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}
  if(d.show){const el=document.getElementById('show-'+d.show);if(el){el.hidden=!el.hidden;if(el.hidden)OPEN.delete(d.show);else OPEN.add(d.show);}return;}
  if(d.gtab){G.tab=d.gtab;G.jfb=null;render();return;}
  if(d.pick!=null&&!G.checked){G.picks[d.pick]=d.val;render();return;}
  if(d.act==='checksc'){G.checked=true;render();return;}
  if(d.act==='nextsc'){G.sc=(G.sc+1)%APP.imposter.length;G.picks={};G.checked=false;render();return;}
  if(d.jopt&&!G.jfb){const j=G.jq[0];const ok=d.jopt===j.answer;G.streak=ok?G.streak+1:0;G.jfb={ok,pick:d.jopt};render();return;}
  if(d.act==='jnext'){G.jq.push(G.jq.shift());G.jfb=null;render();return;}
  if(d.act==='reset'){if(confirm('Erase all progress for this trainer on this browser?')){stopTimer();S=defaults();save();Q=null;render();}return;}
  if(b.id==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();renderHeader();return;}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.learn){const was=status(byId[d.learn]);S.learned[d.learn]=e.target.checked;if(!e.target.checked)delete S.learned[d.learn];save();render();const now=status(byId[d.learn]);if(now==='mastered'&&was!=='mastered'){const r=document.querySelector('[data-rr="'+d.learn+'"]');if(r)r.classList.add('flip');}return;}
  if(d.done){if(e.target.checked&&!(S.run.verify[d.done]||'').trim()){e.target.checked=false;const row=e.target.closest('.chk');const v=row&&row.querySelector('[data-verify]');if(v){v.placeholder='Verified with: fill this in first, then tick';v.focus();}return;}
    if(e.target.checked)S.run.done[d.done]=S.run.elapsed;else delete S.run.done[d.done];save();render();return;}
  if(d.mins!=null){S.run.mins=+e.target.value;S.run.elapsed=0;save();render();return;}
  if(d.lower!=null){S.run.lower=e.target.checked;save();render();return;}
});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.explain){S.explain[d.explain]=e.target.value;save();return;}
  if(d.note){S.run.notes[d.note]=e.target.value;save();return;}
  if(d.undo){S.run.undo[d.undo]=e.target.value;save();return;}
  if(d.verify){S.run.verify[d.verify]=e.target.value;save();return;}
});
window.addEventListener('resize',()=>{if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches){S.mode='learn';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('typein')&&Q&&!Q.fb){answer(null,e.target.value);render();}});
render();
})();
</script>

  const themeBtn=$('#sbTheme');
  if(themeBtn){
    const apply=t=>{if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');themeBtn.textContent='Theme: '+(t||'auto');};
    let t=lsGet(C.key+'-theme');if(t!=='light'&&t!=='dark')t='';apply(t);
    themeBtn.addEventListener('click',()=>{t=t===''?'light':t==='light'?'dark':'';if(t)lsSet(C.key+'-theme',t);else lsDel(C.key+'-theme');apply(t);});
  }
  /* text size: Default, Large, Larger; the root font size scales rem text, and the body rule scales px text */
  const textBtn=$('#sbText');
  if(textBtn){
    const SIZES=[['default','Default'],['large','Large'],['larger','Larger']];
    const apply=v=>{const s=SIZES.find(x=>x[0]===v)||SIZES[0];if(s[0]==='default')document.documentElement.removeAttribute('data-text');else document.documentElement.setAttribute('data-text',s[0]);textBtn.textContent='Text: '+s[1];textBtn.title='Text size: '+s[1]+'. Press for the next size.';};
    let v=lsGet(C.key+'-text');if(!SIZES.some(s=>s[0]===v))v='default';apply(v);
    textBtn.addEventListener('click',()=>{const i=SIZES.findIndex(s=>s[0]===v);v=SIZES[(i+1)%SIZES.length][0];lsSet(C.key+'-text',v);apply(v);});
  }
  /* read aloud: the selection when there is one, else the first visible main region */
  const readBtn=$('#sbRead');
  if(readBtn){
    if(!('speechSynthesis' in window)){readBtn.hidden=true;}
    else{
      const visible=el=>!!(el&&el.offsetParent!==null&&!el.hidden);
      const region=()=>{for(const sel of C.read){const el=document.querySelector(sel);if(visible(el)&&el.textContent.trim())return el;}return document.body;};
      let speaking=false;
      const stop=()=>{speechSynthesis.cancel();speaking=false;readBtn.textContent='Read aloud';readBtn.setAttribute('aria-pressed','false');};
      readBtn.setAttribute('aria-pressed','false');
      readBtn.addEventListener('click',()=>{
        if(speaking){stop();return;}
        const sel=String(window.getSelection&&window.getSelection()||'').trim();
        const text=(sel||region().innerText||'').replace(/\s+/g,' ').trim().slice(0,6000);
        if(!text)return;
        const u=new SpeechSynthesisUtterance(text);u.lang=document.documentElement.lang||'en';u.rate=1;
        u.onend=stop;u.onerror=stop;
        speechSynthesis.cancel();speechSynthesis.speak(u);speaking=true;readBtn.textContent='Stop reading';readBtn.setAttribute('aria-pressed','true');
      });
      window.addEventListener('pagehide',()=>{if(speaking)speechSynthesis.cancel();});
    }
  }
  /* terms: the Defense Ladder glossary terms this page uses, plus Define selection */
  const termsBtn=$('#sbTerms'),box=$('#termsbox');
  if(termsBtn&&box){
    const list=$('#termsList'),q=$('#termsQ'),def=$('#termsDef'),defBtn=$('#termsDefine'),close=$('#termsClose');
    const G=C.gloss;
    const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 .\-\/+]/g,' ').replace(/\s+/g,' ').trim();
    const draw=f=>{list.textContent='';const ff=norm(f);let n=0;for(const [t,d] of G){if(ff&&norm(t).indexOf(ff)<0&&norm(d).indexOf(ff)<0)continue;const dt=document.createElement('dt');dt.textContent=t;const dd=document.createElement('dd');dd.textContent=d;list.append(dt,dd);n++;}if(!n){const dd=document.createElement('dd');dd.textContent='No term matches. Try a shorter word.';list.append(dd);}};
    const open=o=>{box.hidden=!o;termsBtn.setAttribute('aria-expanded',o?'true':'false');termsBtn.textContent=o?'Close terms':'Terms';if(o){draw(q.value);q.focus();}else termsBtn.focus();};
    termsBtn.setAttribute('aria-expanded','false');
    termsBtn.addEventListener('click',()=>open(box.hidden));
    close.addEventListener('click',()=>open(false));
    q.addEventListener('input',()=>draw(q.value));
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!box.hidden)open(false);});
    defBtn.addEventListener('click',()=>{
      const sel=norm(String(window.getSelection&&window.getSelection()||'')).replace(/[.,;:!?]+$/,'');
      if(!sel){def.textContent='Select a word or phrase on the page first, then press Define selection.';return;}
      const hit=G.find(([t])=>norm(t)===sel)||G.find(([t])=>norm(t)===sel.replace(/s$/,''))||G.find(([t])=>norm(t).indexOf(sel)===0)||G.find(([t])=>sel.indexOf(norm(t))>=0&&norm(t).length>3);
      def.textContent=hit?hit[0]+': '+hit[1]:'"'+sel+'" is outside this page\u2019s glossary. The Defense Ladder glossary holds every course term.';
    });
    draw('');
  }
  /* Drills: a return after 30 minutes or more on a browser that holds progress */
  if(C.progressKey){
    const seenKey=C.progressKey+'-seen';const now=Date.now();const last=parseInt(lsGet(seenKey)||'0',10)||0;
    let has=false;try{const o=JSON.parse(lsGet(C.progressKey)||'null');has=!!(o&&((o.learned&&Object.keys(o.learned).length)||(o.drilled&&Object.keys(o.drilled).length)||(o.best&&Object.keys(o.best).length)||(o.run&&o.run.done&&Object.keys(o.run.done).length)));}catch(e){}
    if(has&&last&&now-last>=30*60*1000){
      const mins=Math.round((now-last)/60000);const when=mins<120?mins+' minutes':Math.round(mins/60)+' hours';
      const bar=document.createElement('div');bar.className='sharebar';bar.setAttribute('role','region');bar.setAttribute('aria-label','Saved progress');
      const span=document.createElement('span');span.textContent='This browser last showed this trainer '+when+' ago and holds saved progress. On a shared computer it may be someone else\u2019s.';
      const keep=document.createElement('button');keep.type='button';keep.textContent='Keep my progress';keep.addEventListener('click',()=>bar.remove());
      const fresh=document.createElement('button');fresh.type='button';fresh.textContent='Start fresh';fresh.addEventListener('click',()=>{lsDel(C.progressKey);lsSet(seenKey,String(Date.now()));location.reload();});
      bar.append(span,keep,fresh);document.body.insertBefore(bar,document.body.firstChild);
    }
    const stamp=()=>lsSet(seenKey,String(Date.now()));stamp();setInterval(stamp,60000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')stamp();});window.addEventListener('pagehide',stamp);
  }
})();
</script>
