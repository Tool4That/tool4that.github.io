<style>
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#16212D; --muted:#5F6E7E; --line:#CFD7E0; --soft:#F4F6F9;

  --ok:#1C8A57; --okbg:#E3F5EB; --bad:#C03A3A; --badbg:#FBE7E7; --warn:#A8690F; --warnbg:#FBF0DA; --focus:#FFB300;

  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; } }
:root[data-theme="dark"]{ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) 16px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.brand{font-weight:800;letter-spacing:-.01em;font-size:1.15rem;line-height:1.1}
.brand span{display:block;font-weight:500;color:var(--muted);font-size:.85rem;letter-spacing:0}
.levels{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.levels button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.levels button.on{background:var(--accent);color:var(--accent-ink)}
.levels button .b{font-size:1rem}
.score{font-family:var(--mono);font-size:.95rem;white-space:nowrap}
.score b{font-size:1.2rem}
.theme{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.85rem}
.modes{display:flex;gap:2px;overflow-x:auto}
.modes button{border:0;background:transparent;padding:8px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.modes button.on{color:var(--ink);border-bottom-color:var(--accent)}
.series{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 0 8px;font-size:.82rem;color:var(--muted)}
.series a{color:var(--muted);text-decoration:none}.series a:hover{text-decoration:underline}.series b{color:var(--ink)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 110px)}

aside.report{border-left:1px solid var(--line);background:var(--panel);padding:16px}
footer{padding:14px 16px 30px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);background:var(--panel)}
footer button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.85rem;margin-left:8px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lead{color:var(--muted);max-width:70ch;margin-bottom:16px}.learnit{color:var(--muted);font-size:.9rem;max-width:70ch;margin:-8px 0 14px}.item .meta a{color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
/* learn */
.learn{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:grid;grid-template-columns:18px 54px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;line-height:1.25}
.list button.on{background:var(--soft)}
.list button .id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.learned{background:var(--accent)}.dot.drilled{background:var(--warn)}.dot.mastered{background:var(--ok)}
.item .meta{font-family:var(--mono);color:var(--muted);font-size:.85rem;margin-bottom:2px}
.term{background:var(--term);color:var(--termink);font-family:var(--mono);font-size:.86rem;line-height:1.5;border-radius:10px;padding:8px 14px 12px;margin:12px 0;overflow-x:auto}
.term .tb{display:flex;justify-content:flex-end;min-height:22px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding-left:1.4em;text-indent:-1.4em;margin:2px 0}
.term .p{color:var(--prompt)}
.term .ln.c{color:#9DB0C6;font-style:italic}
.term .copy{border:1px solid #2E4158;background:#17283D;color:var(--termink);border-radius:6px;padding:2px 9px;font:600 .75rem var(--sans)}
.term .copy.done{border-color:var(--ok);color:#8BE0B4}
.run-in b{font-weight:700}
.explain{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--soft)}
.explain textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);resize:vertical}
.explain label{display:flex;gap:10px;align-items:center;margin-top:8px;font-weight:600}
.explain input{width:20px;height:20px;accent-color:var(--ok)}
.nav{display:flex;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
/* drill */
.q{max-width:720px}
.q .count{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;line-height:1.35}
.opts button.cmd{font-family:var(--mono);font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.opts button.ok{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.typein{width:100%;max-width:560px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);background:var(--panel)}
.result{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:560px}
.result .big{font-size:2.4rem;font-weight:800;font-family:var(--mono)}
/* run */
.timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.timer .clock{font-family:var(--mono);font-size:2rem;font-weight:700;min-width:120px}
.timer select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.chk input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--ok)}
.chk .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chk .t .id{font-family:var(--mono);color:var(--muted);font-size:.8rem}
.chk .note{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;background:var(--panel);font-size:.9rem}
.chk.done .t{color:var(--muted);text-decoration:line-through}
.chk .stamp{font-family:var(--mono);font-size:.8rem;color:var(--ok)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
/* games */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.brief{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0 14px;max-width:720px}
.brief ul{margin:4px 0 0 18px;padding:0}
.acct{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);max-width:720px}
.acct .n{font-family:var(--mono)}
.acct .n small{color:var(--muted);font-family:var(--sans);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.acct.ok .n{color:var(--ok)}.acct.bad .n{color:var(--bad)}
.streak{font-family:var(--mono);color:var(--muted);font-size:.9rem}
/* report */
.report h2{font-size:1.05rem;margin-bottom:10px}
.lv{margin:10px 0 14px}
.lv .row{display:flex;justify-content:space-between;font-size:.9rem}
.lv .bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.lv .bar2 i{display:block;height:100%;background:var(--accent)}
.lv .bar2.earned i{background:var(--ok)}
.rr{display:grid;grid-template-columns:18px 52px 1fr 26px;gap:6px;align-items:center;font-size:.85rem;padding:3px 0;border-top:1px solid var(--line)}
.rr .id{font-family:var(--mono);color:var(--muted);font-size:.78rem}
.rr .pt{font-family:var(--mono);text-align:right;color:var(--muted)}
.rr.mastered .g{color:var(--ok);font-weight:800}.rr.mastered .pt{color:var(--ok)}
.rr.learned .g{color:var(--accent);font-weight:800}
.rr.drilled .g{color:var(--warn);font-weight:800}
.rr .g{text-align:center}
.rr.flip{animation:flip .35s ease-out}
@keyframes flip{0%{background:var(--okbg)}100%{background:transparent}}
.total{display:flex;justify-content:space-between;font-family:var(--mono);margin-top:10px;padding-top:8px;border-top:2px solid var(--ink)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted);margin-left:6px}
.empty{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion:reduce){ .rr.flip{animation:none} }
@media (max-width:1100px){ .wrap{grid-template-columns:1fr} aside.report{display:none;border-left:0;border-top:1px solid var(--line)} body[data-mode="report"] aside.report{display:block} body[data-mode="report"] main{display:none} .modes .rep{display:inline-block} }
@media (min-width:1101px){ .modes .rep{display:none} }
@media (max-width:760px){ header.top{position:static} .learn{grid-template-columns:1fr} .list{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px} .list button{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line)} .list button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .list button .ttl{display:none} .levels{margin-left:0} .score{margin-left:auto} }
.picked{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:.92rem}.missed{display:grid;gap:6px;margin:10px 0}.miss{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.9rem;text-align:left}.small{font-size:.85rem;color:var(--muted)}.rr .g.due{color:var(--muted)}.report .ex{margin-top:10px;font-size:.85rem}.report .ex dt{font-family:var(--mono);color:var(--muted);margin-top:6px}.report .ex dd{margin:0}

/* reading support (panel review): text size, support bar, terms panel, banner, contrast, forced colours, print */
:root[data-text="large"]{font-size:112.5%}:root[data-text="larger"]{font-size:125%}
:root[data-text="large"] body{font-size:18px}:root[data-text="larger"] body{font-size:20px}
.sbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 14px;max-width:100%;font-size:.85rem}
.sbar button,.theme.sb{font:inherit;font-size:.8rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line,var(--rule,#8a97a5));background:var(--panel,var(--face,#fff));color:var(--ink);cursor:pointer;white-space:nowrap}
.termsbox{position:fixed;right:12px;bottom:12px;width:min(420px,calc(100vw - 24px));max-height:min(60vh,520px);overflow:auto;background:var(--panel,var(--face,#fff));color:var(--ink);border:1px solid var(--line,var(--rule,#8a97a5));border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:50;font-size:.92rem}
.termsbox h2{margin:0 0 6px;font-size:1rem}.termsbox .trow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.termsbox input{flex:1;min-width:120px;font:inherit;padding:5px 8px;border:1px solid var(--line,var(--rule,#8a97a5));border-radius:8px;background:var(--panel,var(--face,#fff));color:var(--ink)}
.termsbox button{font:inherit;font-size:.8rem;padding:4px 9px;border-radius:8px;border:1px solid var(--line,var(--rule,#8a97a5));background:var(--panel,var(--face,#fff));color:var(--ink);cursor:pointer}
.termsbox dl{margin:6px 0 0}.termsbox dt{font-weight:600;margin-top:6px}.termsbox dd{margin:0}.termsbox .tdef{margin:4px 0;padding:6px 8px;border-left:3px solid currentColor;min-height:1.2em}
.sharebar{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;padding:.6rem .9rem;background:var(--soft,var(--face,#eef3f7));color:var(--ink);border-bottom:1px solid var(--line,var(--rule,#8a97a5));font-size:.92rem;max-width:100%}
.sharebar button{font:inherit;font-size:.85rem;padding:.25rem .7rem;border-radius:6px;border:1px solid var(--line,var(--rule,#8a97a5));background:var(--panel,var(--face,#fff));color:var(--ink);cursor:pointer}
@media (prefers-contrast:more){:root{--line:currentColor;--rule:currentColor}button,.btn,.opts button,.list button,.chk,.card,.ticket{border:1px solid currentColor}}
@media (forced-colors:active){button,.btn,.opts button,.list button{border:1px solid ButtonText}.bar2 i,.fill{background:Highlight}}
@media print{.sbar,.termsbox,.sharebar,header .levels,header .modes,header .theme,nav.series,aside.report,footer,.nav,button{display:none !important}.wrap{display:block}.list{flex-direction:column}.list button{display:grid !important;border:none}#view,.learn{display:block}body{background:#fff;color:#000}}
</style>

<script>
const APP = {"key": "cisco", "os": "Cisco IOS / Packet Tracer", "accent": "#B8690E", "footer": "Training tool for Packet Tracer and lab gear you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial practice; not affiliated with or endorsed by Cisco.", "levels": [{"name": "Doorman", "badge": "🚪", "blurb": "Lock the doors. Hostname, enable secret, console and VTY logins, idle timeouts, password encryption, legal banners, and save. The basics every device needs.", "learn": {"label": "Defense Ladder, Sophomore s5, Cisco: configure a switch and a router", "href": "https://freeapp4that.store/defense-ladder/#sophomore/s5"}, "tip": {"text": "Evidence first: answer any investigation question before you change a device.", "label": "Defense Ladder, Freshman f1, How hands-on defense practice works", "href": "https://freeapp4that.store/defense-ladder/#freshman/f1"}, "items": [{"id": "B-01", "title": "Name the device and lock privileged mode", "cmds": ["Router> enable", "Router# configure terminal", "Router(config)# hostname RtrA", "RtrA(config)# no ip domain-lookup", "RtrA(config)# enable secret Str0ng-Enable-2026!", "RtrA(config)# no enable password", "RtrA(config)# do show running-config | include enable", "RtrA(config)# end", "RtrA# disable", "RtrA> enable"], "why": "enable secret stores a hash. enable password stores plaintext or Type 7, which reverses in seconds, so enable secret is the one to use.", "task": "set the privileged-mode password (hashed) to Str0ng-Enable-2026!", "t": "enable secret Str0ng-Enable-2026!", "note": "Plain enable secret yields an MD5 (Type 5) hash on older IOS releases. Where supported, enable algorithm-type scrypt secret stores a Type 9 hash, which the Cisco hardening guide recommends.", "also": "no ip domain-lookup keeps a mistyped command from hanging while IOS tries to resolve it as a hostname. no enable password clears a leftover enable password: the secret wins while both exist, yet the old password still sits in the config and in every backup of it. do runs a privileged EXEC command, such as show running-config, without leaving configuration mode. disable drops back to user EXEC (RtrA>), and the next enable asks for the new secret.", "area": "access", "ex": ["B-03", "A-06"]}, {"id": "B-02", "title": "Console and VTY lines: require login, time out idle sessions", "cmds": ["RtrA(config)# line console 0", "RtrA(config-line)# password C0nsole-2026!", "RtrA(config-line)# login", "RtrA(config-line)# exec-timeout 5 0", "RtrA(config-line)# logging synchronous", "RtrA(config-line)# exit", "RtrA(config)# line vty 0 4", "RtrA(config-line)# password Vty-2026!", "RtrA(config-line)# login", "RtrA(config-line)# exec-timeout 5 0", "RtrA(config-line)# exit", "RtrA(config)# line aux 0", "RtrA(config-line)# no exec", "RtrA(config-line)# exit"], "why": "login enforces each line's password; without it, anyone walks in. exec-timeout 5 0 ends any session idle for five minutes. logging synchronous keeps log output separate from your typing.", "note": "These passwords are placeholders: give every line and secret a unique passphrase. Switches with 16 VTY lines use line vty 0 15. exec-timeout 5 equals 5 0: minutes, then seconds. A 2911 router also has an AUX port. When it sits unused, no exec under line aux 0 stops it from starting a session; when it is in use, secure it like the console.", "also": "At the Watchman level, local usernames and SSH replace these line passwords.", "task": "log out idle sessions after 5 minutes (line command)", "t": "exec-timeout 5 0", "area": "access", "ta": ["exec-timeout 5", "exec-time 5 0", "exec-time 5"], "ex": ["I-01"]}, {"id": "B-03", "title": "Hide passwords in the config", "cmds": ["RtrA(config)# service password-encryption"], "why": "Encodes line and username passwords (Type 7). Weak, but it beats plaintext in show run over someone's shoulder. Use secret wherever a command offers it.", "task": "obscure the plaintext passwords in the running config", "t": "service password-encryption", "area": "config", "ex": ["B-01", "A-06"]}, {"id": "B-04", "title": "Legal banners: MOTD and login", "cmds": ["RtrA(config)# banner motd #Unauthorized access is prohibited and monitored.#", "RtrA(config)# banner login #Authorized users only. Activity is logged.#"], "why": "The banner tells anyone connecting that access is restricted and monitored, with wording legal counsel has reviewed. Leave out device name, model, software, and owner; Welcome reads as an invitation.", "note": "Pick a delimiter the text lacks; its next use ends the banner. Console order: MOTD, login banner, login prompt. SSH version 2's pre-authentication login banner carries the notice too.", "task": "set a message-of-the-day banner with # as the delimiter", "t": "banner motd #Unauthorized access is prohibited and monitored.#", "ta": ["banner motd #unauthorized access is prohibited#", "banner motd #unauthorized access prohibited#"], "area": "config"}, {"id": "B-05", "title": "Save the config", "cmds": ["RtrA# copy running-config startup-config", "RtrA# write memory", "RtrA# show startup-config", "RtrA# show running-config | include enable|password|hostname|banner|exec-timeout", "RtrA# copy running-config flash:pre-audit.cfg"], "why": "A reload discards every unsaved fix. Save after every block.", "note": "show running-config is what runs now; show startup-config is what survives a reload. Before an audit, copy running-config flash:pre-audit.cfg keeps the starting config as a file in flash (press Enter at the Destination filename prompt), so every later change has a copy to compare against.", "task": "save the running config so it survives a reload", "t": "copy running-config startup-config", "ta": ["write memory", "wr", "copy run start", "write", "write mem", "wr mem", "copy run startup-config"], "area": "config", "ex": ["A-06"]}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. Local user accounts, SSH version 2 only, unneeded services off, port security, user VLANs and a hardened trunk, VLAN versus SVI, login attack protection, logging and time, and reading a switch's ports, neighbors, and MAC table.", "learn": {"label": "Defense Ladder, Junior j4, Cisco: VLANs, routing, and ACLs", "href": "https://freeapp4that.store/defense-ladder/#junior/j4"}, "items": [{"id": "I-01", "title": "Local user accounts and login local", "cmds": ["RtrA(config)# username netadmin privilege 15 secret Adm1n-Secret-2026!", "RtrA(config)# line console 0", "RtrA(config-line)# login local", "RtrA(config-line)# exit", "RtrA(config)# line vty 0 4", "RtrA(config-line)# login local", "RtrA(config-line)# exit", "RtrA(config)# no username olduser"], "why": "Named accounts give accountability and per-user removal; secret hashes the password. Remove every username the brief leaves off its list.", "task": "make the VTY lines authenticate against the local user database (line command)", "t": "login local", "note": "Where supported, username netadmin privilege 15 algorithm-type scrypt secret <password> stores a Type 9 hash instead of Type 5.", "area": "acct", "ex": ["B-02", "A-05"]}, {"id": "I-02", "title": "SSH version 2 only, Telnet gone", "cmds": ["RtrA(config)# ip domain-name school.lan", "RtrA(config)# crypto key generate rsa general-keys modulus 2048", "RtrA(config)# ip ssh version 2", "RtrA(config)# ip ssh time-out 60", "RtrA(config)# ip ssh authentication-retries 3", "RtrA(config)# line vty 0 4", "RtrA(config-line)# transport input ssh", "RtrA(config-line)# transport output ssh", "RtrA(config-line)# exit", "RtrA# show ip ssh", "RtrA# show crypto key mypubkey rsa"], "why": "Telnet sends passwords in cleartext and SSHv1 is broken. Key generation requires a hostname and domain name first, the classic lab trap.", "task": "allow only SSH on the VTY lines (line command)", "t": "transport input ssh", "area": "access", "note": "Order matters: hostname, then ip domain-name, then the RSA key (2048 bits here; SSH version 2 needs at least 768), then ip ssh version 2. transport output ssh limits the sessions a user opens from a VTY session to SSH; sessions arriving here follow transport input.", "ex": ["I-03", "I-06", "A-01"]}, {"id": "I-03", "title": "Disable unneeded services", "cmds": ["RtrA(config)# no ip http server", "RtrA(config)# no ip http secure-server", "RtrA(config)# no cdp run", "RtrA(config)# no lldp run", "RtrA(config)# no service tcp-small-servers", "RtrA(config)# no service udp-small-servers", "RtrA(config)# no ip source-route", "RtrA(config)# no ip finger", "RtrA(config)# no ip bootp server", "RtrA(config)# no service pad", "RtrA(config)# end", "RtrA# show cdp", "RtrA# show lldp neighbors", "  When the brief keeps CDP and LLDP on links to your own devices, skip no cdp run and no lldp run, and quiet the ISP port instead:", "RtrA(config)# interface gigabitEthernet 0/1", "RtrA(config-if)# no cdp enable", "RtrA(config-if)# no lldp transmit", "RtrA(config-if)# no lldp receive", "RtrA(config-if)# exit", "  When the brief needs browser management, keep HTTPS only, with sign-ins checked against the local usernames:", "RtrA(config)# ip http secure-server", "RtrA(config)# ip http authentication local"], "why": "Each one is a listening service or an information leak. CDP tells an attacker the IOS version and IP of every neighbor.", "note": "Packet Tracer support for these varies by version; real IOS takes them all, so know them anyway. Keep ip http secure-server only if the brief needs web management.", "also": "With CDP and LLDP off, show cdp answers % CDP is not enabled and show lldp neighbors answers % LLDP is not enabled. no service pad turns off PAD, a leftover from X.25 networks. no cdp enable, no lldp transmit, and no lldp receive work on one port, for a brief that keeps discovery on links between your own devices. ip http authentication local makes web sign-ins check the local usernames.", "task": "turn off the HTTP management server", "t": "no ip http server", "area": "config", "ex": ["I-02", "A-03", "A-05"]}, {"id": "I-04", "title": "Switch port security and shut unused ports", "cmds": ["SwA(config)# interface range fastEthernet 0/5 - 24", "SwA(config-if-range)# shutdown", "SwA(config-if-range)# switchport mode access", "SwA(config-if-range)# switchport access vlan 999", "SwA(config-if-range)# exit", "SwA(config)# interface fastEthernet 0/1", "SwA(config-if)# switchport mode access", "SwA(config-if)# switchport port-security", "SwA(config-if)# switchport port-security maximum 2", "SwA(config-if)# switchport port-security mac-address sticky", "SwA(config-if)# switchport port-security violation shutdown", "SwA(config-if)# exit", "SwA# show port-security interface fastEthernet 0/1", "SwA# show interfaces status err-disabled", "  After an approved PC swap, forget the old MAC address:", "SwA# clear port-security sticky interface fastEthernet 0/1"], "why": "An open port means plug in and you are on the LAN. Port security pins MAC addresses; shutting unused ports is the cheapest control there is.", "task": "turn on port security on the current interface", "t": "switchport port-security", "area": "config", "note": "VLAN 999 is PARKING: unused ports wait there, shut down, in a VLAN separate from the native VLAN (99). show interfaces status err-disabled lists each port a violation shut down, with its reason. After an approved PC swap, clear port-security sticky interface fastEthernet 0/1 forgets the old PC's MAC address, and shutdown then no shutdown on the port brings it back.", "ex": ["A-03", "A-04"]}, {"id": "I-05", "title": "User VLANs above 1 and a hardened trunk", "cmds": ["SwA(config)# vlan 10", "SwA(config-vlan)# name STUDENTS", "SwA(config-vlan)# vlan 20", "SwA(config-vlan)# name TEACHERS", "SwA(config-vlan)# vlan 30", "SwA(config-vlan)# name PRINCIPALS", "SwA(config-vlan)# vlan 99", "SwA(config-vlan)# name NATIVE", "SwA(config-vlan)# vlan 999", "SwA(config-vlan)# name PARKING", "SwA(config-vlan)# exit", "SwA(config)# vtp mode transparent", "SwA(config)# vtp domain school.lan", "SwA(config)# interface gigabitEthernet 0/1", "SwA(config-if)# description Trunk to RtrA G0/0", "SwA(config-if)# switchport mode trunk", "SwA(config-if)# switchport trunk native vlan 99", "SwA(config-if)# switchport trunk allowed vlan 10,20,30,99", "SwA(config-if)# switchport nonegotiate", "SwA(config-if)# end", "SwA# show vlan brief", "SwA# show vtp status", "SwA# show interfaces trunk", "  If the school adds IP phones, give them VLAN 40 on the trunk and on each phone port:", "SwA(config)# vlan 40", "SwA(config-vlan)# name VOICE", "SwA(config-vlan)# exit", "SwA(config)# interface gigabitEthernet 0/1", "SwA(config-if)# switchport trunk allowed vlan add 40", "SwA(config-if)# interface fastEthernet 0/4", "SwA(config-if)# switchport voice vlan 40", "SwA(config-if)# end"], "why": "User VLANs above 1 keep hosts off the default VLAN unconfigured ports join. Double tagging works when an attacker's access VLAN equals the trunk's native VLAN; VLAN 1 is only the default case, so a host-free native VLAN closes it. DTP lets an attacker negotiate a trunk; switchport nonegotiate turns it off, and show interfaces trunk confirms.", "task": "set the trunk's native VLAN to 99 (interface command)", "t": "switchport trunk native vlan 99", "area": "config", "note": "The router end uses encapsulation dot1Q 99 native (Hunter A-08), so both ends agree on native 99. Between switches a mismatch logs %CDP-4-NATIVE_VLAN_MISMATCH; toward the router, a mismatch that lands on a host VLAN shows as that VLAN's hosts losing their gateway, so compare show interfaces trunk on SwA with the g0/0.99 subinterface in RtrA's running config. VLAN 99 runs without hosts or an IP; VLAN 999 PARKING holds shut ports. A multilayer switch such as a 3560 needs switchport trunk encapsulation dot1q before switchport mode trunk; a 2960 speaks 802.1Q only and goes without that line.", "also": "vtp mode transparent keeps this switch's own VLAN list: it ignores the VLAN changes in advertisements and passes them along, and show vtp status then reads Transparent with Configuration Revision 0. vtp mode off also stops passing them, on images with VTP version 3. description names the far end of a link, and show interfaces status lists it under Name. A bare allowed list replaces the whole list; switchport trunk allowed vlan add 40 appends one VLAN, and remove takes one away. On the phone port, the phone tags VLAN 40 and the PC behind it stays untagged in the port's access VLAN. On a switch whose show vtp status reads Client, set vtp mode transparent before the vlan lines: a client refuses local VLAN changes. The phones reach their gateway through a g0/0.40 subinterface on RtrA.", "ex": ["I-08", "A-03", "A-04", "A-08"]}, {"id": "I-06", "title": "Login attack protection and minimum password length", "cmds": ["RtrA(config)# security passwords min-length 10", "RtrA(config)# login block-for 120 attempts 3 within 60", "RtrA(config)# login on-failure log"], "why": "Lockout for brute force; min-length enforces the password policy at the moment a password is set.", "task": "block logins for 120 seconds after 3 failures within 60 seconds", "t": "login block-for 120 attempts 3 within 60", "area": "acct", "ex": ["I-02", "A-01"]}, {"id": "I-07", "title": "Logging and time", "cmds": ["RtrA(config)# service timestamps log datetime msec", "RtrA(config)# logging buffered 16384", "RtrA(config)# logging host 10.1.20.50", "RtrA(config)# ntp server 10.1.20.50", "RtrA(config)# clock timezone UTC 0", "RtrA# show clock", "RtrA# show ntp associations", "RtrA# show ntp status", "RtrA# show logging", "  On a busy device, keep log messages off the console line:", "RtrA(config)# no logging console", "  To feed a traffic sensor, copy the SwA uplink to Fa0/24 (a SPAN session):", "SwA(config)# no monitor session 1", "SwA(config)# interface fastEthernet 0/24", "SwA(config-if)# no shutdown", "SwA(config-if)# exit", "SwA(config)# monitor session 1 source interface gigabitEthernet 0/1 both", "SwA(config)# monitor session 1 destination interface fastEthernet 0/24", "SwA(config)# end", "SwA# show monitor session 1"], "why": "Correct, synchronized time is what lets logs from every device line up in an investigation.", "task": "send log messages to the syslog server 10.1.20.50", "t": "logging host 10.1.20.50", "ta": ["logging 10.1.20.50"], "area": "audit", "note": "10.1.20.50 stands for a log and time server on the Teachers (management) VLAN. UTC keeps Site A and Site B on one clock.", "also": "show clock puts a * before the time until the clock syncs; show ntp associations marks the server in use with a *, and show ntp status reads Clock is synchronized once it locks on. Log messages reach the console by default; no logging console keeps them off a busy console line while logging buffered and logging host keep copies. For the SPAN session, Fa0/24 leaves the parked set: no shutdown brings it up, and as the destination it only sends copies to the sensor. One session takes ports or VLANs, so no monitor session 1 clears any old session first."}, {"id": "I-08", "title": "Give the switch an SVI in VLAN 20 (a VLAN and an SVI differ)", "cmds": ["SwA(config)# interface vlan 20", "SwA(config-if)# ip address 10.1.20.2 255.255.255.0", "SwA(config-if)# no shutdown", "SwA(config-if)# exit", "SwA(config)# vlan 20", "SwA(config-vlan)# name TEACHERS", "SwA(config-vlan)# exit", "SwA(config)# ip default-gateway 10.1.20.1", "SwA(config)# interface vlan 1", "SwA(config-if)# shutdown", "SwA(config-if)# end", "SwA# show ip interface brief", "SwA# show vlan brief"], "why": "Ports join VLANs, layer-2 broadcast domains; the SVI (interface vlan 20) is the switch's layer-3 management interface. ip default-gateway lets the layer-2 switch reply across subnets, like Site B Teachers.", "note": "Vlan20 is down/down until VLAN 20 exists in the VLAN database. Autostate then holds it up/down until any VLAN 20 port (access, or a trunk allowing it) forwards in STP.", "also": "Larger networks give management its own VLAN; here management shares the Teachers subnet and its Teachers-only ACL. Shutting interface vlan 1 leaves the default VLAN devoid of an address.", "task": "create the switch virtual interface for VLAN 20 (global command)", "t": "interface vlan 20", "ta": ["int vlan 20", "int vlan20", "interface vlan20"], "area": "config", "ex": ["I-05"], "learn": {"label": "Defense Ladder, Freshman f7, A VLAN and an SVI", "href": "https://freeapp4that.store/defense-ladder/#freshman/f7"}}, {"id": "I-09", "title": "Read the switch: port status, neighbors, and learned MACs", "cmds": ["SwA# show interfaces status", "SwA# show interfaces status err-disabled", "SwA# show mac address-table", "SwA# show mac address-table interface fastEthernet 0/3", "SwA# show cdp neighbors", "SwA# show cdp neighbors detail", "  Fa0/3 reads a-half because its PC is set by hand to 100 Mb/s full duplex, so match it:", "SwA(config)# interface fastEthernet 0/3", "SwA(config-if)# speed 100", "SwA(config-if)# duplex full", "SwA(config-if)# end"], "why": "show interfaces status lists every port with its state, VLAN, duplex, and speed on one screen, so a port left up or a half-duplex link stands out. show mac address-table shows which MAC address each port has learned, and show cdp neighbors names the device at the far end of each link.", "note": "Give both ends of a link the same speed and duplex, or leave both on auto; speed auto and duplex auto are the defaults. Set speed first, then duplex. In show interfaces status, a-full and a-100 are negotiated values, and plain full and 100 were set by hand. show cdp neighbors lists only devices that still run CDP, so RtrA drops off the list after its no cdp run in I-03.", "task": "list each port with its status, VLAN, duplex, and speed", "t": "show interfaces status", "ta": ["show int status", "sh int status", "show interface status"], "area": "config", "ex": ["I-04", "I-05", "A-07"], "learn": {"label": "Defense Ladder, Sophomore s5, Cisco: configure a switch and a router", "href": "https://freeapp4that.store/defense-ladder/#sophomore/s5"}}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. A Teachers-only VTY ACL, edge ACLs, interface hardening, layer-2 attack defenses, SNMP and AAA, protecting the config itself, auditing a config fast, router-on-a-stick, a host route shared through OSPF, and DHCP on the gateway.", "learn": {"label": "Defense Ladder, Senior se6, Cisco: audit and extend the two-site network", "href": "https://freeapp4that.store/defense-ladder/#senior/se6"}, "items": [{"id": "A-01", "title": "Teachers-only VTY access", "cmds": ["RtrA(config)# access-list 20 remark TEACHERS-ONLY", "RtrA(config)# access-list 20 permit 10.1.20.0 0.0.0.255", "RtrA(config)# access-list 20 permit 10.2.20.0 0.0.0.255", "RtrA(config)# access-list 20 deny any log", "RtrA(config)# line vty 0 4", "RtrA(config-line)# access-class 20 in", "RtrA(config-line)# line vty 5 15", "RtrA(config-line)# access-class 20 in", "RtrA(config-line)# exit", "SwA(config)# access-list 20 permit 10.1.20.0 0.0.0.255", "SwA(config)# access-list 20 permit 10.2.20.0 0.0.0.255", "SwA(config)# line vty 0 15", "SwA(config-line)# access-class 20 in", "SwA(config-line)# exit", "RtrA# show access-lists 20", "RtrA(config)# ip access-list standard 20", "RtrA(config-std-nacl)# no 20", "RtrA(config-std-nacl)# 20 permit 10.2.20.0 0.0.0.255"], "why": "SSH encrypts; access-class admits only Teachers subnets (Site A and Site B); a standard (source-only) ACL suffices. Confirm: SSH from Students PCs ends with % Connection refused by remote host.", "note": "Apply access-class to every VTY range listed (show running-config | section line vty). A 2960's line vty 0 15 covers both 0 4 and 5 15. Wildcards invert subnet masks.", "also": "A 2911 (Packet Tracer and IOS 15) lists only line vty 0 4 until someone creates line vty 5 15. The example adds that range with the ACL already applied. Edit one entry and keep the rest: show access-lists 20 numbers the entries 10, 20, and 30, ip access-list standard 20 opens the list by those numbers, no 20 removes the Site B line, and 20 permit puts it back in the same place. A named list works the same way: ip access-list standard MGMT-ONLY, a permit line for the one admin address, then access-class MGMT-ONLY in.", "task": "apply standard ACL 20 to inbound VTY connections (line command)", "t": "access-class 20 in", "area": "access", "ex": ["I-02", "I-06", "A-02"]}, {"id": "A-02", "title": "Extended ACL on an interface: allow only what the scenario needs", "cmds": ["RtrA(config)# ip access-list extended OUTSIDE-IN", "RtrA(config-ext-nacl)# permit tcp any host 203.0.113.2 eq 443", "RtrA(config-ext-nacl)# permit tcp any host 203.0.113.2 eq 80", "RtrA(config-ext-nacl)# permit icmp any any echo-reply", "RtrA(config-ext-nacl)# permit tcp any any established", "RtrA(config-ext-nacl)# permit udp host 8.8.8.8 eq domain any", "RtrA(config-ext-nacl)# deny ip any any log", "RtrA(config-ext-nacl)# exit", "RtrA(config)# interface gigabitEthernet 0/1", "RtrA(config-if)# ip access-group OUTSIDE-IN in", "RtrA(config-if)# exit", "RtrA# show access-lists"], "why": "The ACL drops traffic arriving from the ISP on G0/1 unless a line permits it. The deny log line records what the implicit deny hides; confirm with show access-lists counters.", "note": "Permit 203.0.113.2, RtrA's public ISP-facing address: IOS checks inbound ACLs before translating. Static NAT forwards web traffic: ip nat inside source static tcp <server> 443 203.0.113.2 443, same for 80.", "also": "Stateless interface ACLs need reply permits: established matches TCP replies (ACK or RST set); the domain line admits 8.8.8.8 DNS replies. Stateful IOS zone-based policy firewalls track sessions more precisely.", "task": "apply the OUTSIDE-IN ACL to inbound traffic on the current interface", "t": "ip access-group OUTSIDE-IN in", "area": "config", "ex": ["A-01", "A-03"]}, {"id": "A-03", "title": "Interface-level hardening", "cmds": ["RtrA(config)# interface gigabitEthernet 0/1", "RtrA(config-if)# no ip redirects", "RtrA(config-if)# no ip proxy-arp", "RtrA(config-if)# no ip directed-broadcast", "RtrA(config-if)# no ip unreachables", "RtrA(config-if)# no ip mask-reply", "RtrA(config-if)# exit"], "why": "Proxy ARP and directed broadcasts enable spoofing and amplification (Smurf). Redirects and unreachables leak topology. G0/1 faces the ISP, so it gets the full set.", "note": "no ip unreachables is optional; it can interfere with path MTU discovery. Shut every router port the design leaves unused; on this 2911, G0/0, G0/1, and G0/2 all carry traffic.", "task": "stop the interface from answering ARP on behalf of other hosts", "t": "no ip proxy-arp", "area": "config", "ex": ["I-03", "I-04", "I-05", "A-02", "A-04"]}, {"id": "A-04", "title": "Layer-2 attack defenses", "cmds": ["SwA(config)# ip dhcp snooping", "SwA(config)# ip dhcp snooping vlan 10", "SwA(config)# interface gigabitEthernet 0/1", "SwA(config-if)# ip dhcp snooping trust", "SwA(config-if)# ip arp inspection trust", "SwA(config-if)# exit", "SwA(config)# ip arp inspection vlan 10", "SwA(config)# interface range fastEthernet 0/1 - 4", "SwA(config-if-range)# spanning-tree portfast", "SwA(config-if-range)# spanning-tree bpduguard enable", "SwA(config-if-range)# storm-control broadcast level 20", "SwA(config-if-range)# exit", "SwA(config)# spanning-tree portfast bpduguard default", "SwA(config)# spanning-tree mode rapid-pvst", "SwA(config)# spanning-tree vlan 10,20,30,99 root primary", "SwA(config)# interface gigabitEthernet 0/2", "SwA(config-if)# no shutdown", "SwA(config-if)# spanning-tree guard root", "SwA(config-if)# end", "SwA# show ip dhcp snooping", "SwA# show ip dhcp snooping binding", "SwA# show spanning-tree inconsistentports"], "why": "Snooping stops rogue DHCP servers; dynamic ARP inspection checks ARP against the snooping table and stops poisoning; BPDU guard stops a rogue switch taking the STP root; storm control caps broadcast storms. G0/1 is trusted because DHCP replies and the router-on-a-stick gateway ARP arrive there. PortFast skips about 30 s of listening and learning, so it belongs on edge ports only; on a trunk or switch link a temporary loop forwards before STP blocks it.", "note": "Packet Tracer support for DAI and storm control varies by version. A host with a static address in VLAN 10 needs a static binding or an ARP ACL, because DAI drops ARP it cannot match. When the router serves or relays DHCP, add no ip dhcp snooping information option on the switch; the router drops requests that carry the switch's option 82 with an empty relay address.", "also": "Rapid PVST+ (spanning-tree mode rapid-pvst) recovers from a failed link in a few seconds, where PVST+, the 2960 default, takes 30 to 50. spanning-tree vlan 10,20,30,99 root primary makes SwA the root bridge on purpose. On a downlink to a second classroom switch (here G0/2, brought up for that switch), spanning-tree guard root keeps SwA the root: a superior BPDU there blocks the port, and show spanning-tree inconsistentports lists it. show ip dhcp snooping lists the snooped VLANs and the trusted ports, and show ip dhcp snooping binding lists the leases snooping has recorded.", "task": "trust DHCP replies on the current uplink interface", "t": "ip dhcp snooping trust", "area": "config", "ex": ["I-04", "I-05", "A-03"]}, {"id": "A-05", "title": "SNMP and AAA", "cmds": ["RtrA(config)# no snmp-server community public", "RtrA(config)# no snmp-server community private", "RtrA(config)# snmp-server group ADMINS v3 priv", "RtrA(config)# snmp-server user noc ADMINS v3 auth sha AuthPass-2026 priv aes 128 PrivPass-2026", "RtrA(config)# aaa new-model", "RtrA(config)# aaa authentication login default local"], "why": "SNMP v1 and v2c with public or private community strings let anyone read, or write, the whole config. v3 adds authentication and encryption. AAA centralizes accounts.", "note": "After aaa new-model, lines use the default method list. Create a local user first so a way back in always exists.", "task": "remove the public SNMP community string", "t": "no snmp-server community public", "area": "access", "ex": ["I-01", "I-03"]}, {"id": "A-06", "title": "Protect the config itself", "cmds": ["RtrA(config)# service tcp-keepalives-in", "RtrA(config)# service tcp-keepalives-out", "RtrA(config)# no boot network", "RtrA(config)# no service config", "RtrA(config)# secure boot-image", "RtrA(config)# secure boot-config", "RtrA(config)# archive", "RtrA(config-archive)# log config", "RtrA(config-archive-log-cfg)# logging enable", "RtrA(config-archive-log-cfg)# hidekeys", "RtrA(config-archive-log-cfg)# end", "RtrA# show version | include image|register", "RtrA(config)# config-register 0x2102"], "why": "Keepalives drop dead sessions and free VTY lines. Resilient configuration stops an attacker from erasing the IOS image or startup config. The archive log records who changed what.", "note": "Several of these run on real devices only, outside Packet Tracer; know them anyway.", "also": "show version | include image|register shows the boot image and the configuration register. 0x2102 boots IOS from flash with the saved startup-config. A router left at 0x2142, the password-recovery setting, skips the startup-config at its next reload and comes up with an empty config.", "task": "keep a tamper-resistant archive of the running config (resilient configuration)", "t": "secure boot-config", "area": "config", "ex": ["B-01", "B-03", "B-05"]}, {"id": "A-07", "title": "Audit a given config fast", "cmds": ["RtrA# show running-config | include password|secret", "RtrA# show running-config | section line vty", "RtrA# show running-config | include http|cdp|snmp|small", "RtrA# show ip interface brief", "SwA# show port-security", "SwA# show vlan brief", "SwA# show interfaces trunk", "SwA# show interfaces switchport", "SwA# show interfaces fa0/1 switchport", "RtrA# show access-lists", "RtrA# show ip ssh", "RtrA# show ip route", "RtrA# ping 10.2.20.1 source 10.1.20.1", "RtrA# show users"], "why": "Flag plaintext passwords, VTY lacking login local or SSH, open services, and missing routes. Ping 10.2.20.1 source 10.1.20.1 (Site B's Teachers gateway from Site A's); success proves two-way Teachers routing.", "note": "Flag VLAN 1 anywhere, including a trunk's native VLAN, and any trunk missing a VLAN. Flag unused ports left up as well.", "task": "show only the VTY line section of the running config", "t": "show running-config | section line vty", "ta": ["show run | section line vty", "show run | section vty", "show running-config | section vty"]}, {"id": "A-08", "title": "Router-on-a-stick with a native subinterface", "cmds": ["RtrA(config)# interface gigabitEthernet 0/0.10", "RtrA(config-subif)# encapsulation dot1Q 10", "RtrA(config-subif)# ip address 10.1.10.1 255.255.255.0", "RtrA(config-subif)# interface gigabitEthernet 0/0.20", "RtrA(config-subif)# encapsulation dot1Q 20", "RtrA(config-subif)# ip address 10.1.20.1 255.255.255.0", "RtrA(config-subif)# interface gigabitEthernet 0/0.30", "RtrA(config-subif)# encapsulation dot1Q 30", "RtrA(config-subif)# ip address 10.1.30.1 255.255.255.0", "RtrA(config-subif)# interface gigabitEthernet 0/0.99", "RtrA(config-subif)# encapsulation dot1Q 99 native", "RtrA(config-subif)# interface gigabitEthernet 0/0", "RtrA(config-if)# description Trunk to SwA G0/1", "RtrA(config-if)# no shutdown", "RtrA(config-if)# end", "RtrA# show ip interface brief"], "why": "One trunk carries Students, Teachers, and Principals to RtrA. Each subinterface takes one tag and becomes that VLAN's .1 gateway, so the three VLANs route to each other through RtrA.", "note": "Subinterfaces follow the physical port: no shutdown goes on G0/0, which stays unaddressed. An ISR 4000 (IOS XE) names it GigabitEthernet0/0/0; subinterface commands match.", "also": "encapsulation dot1Q 99 native matches the switch's native VLAN 99, so untagged frames land on a subinterface without an IP or hosts. Watchman I-05 builds the switch-side trunk. A multilayer switch replaces router-on-a-stick: ip routing, then one SVI per VLAN as its gateway (interface vlan 10, ip address 10.1.10.1 255.255.255.0).", "task": "tag the current subinterface for VLAN 10 (subinterface command)", "t": "encapsulation dot1q 10", "ta": ["encap dot1q 10", "enc dot1q 10"], "area": "config", "ex": ["I-05"]}, {"id": "A-09", "title": "Host route to 8.8.8.8, shared through OSPF (concept)", "cmds": ["RtrA(config)# ip route 8.8.8.8 255.255.255.255 203.0.113.1", "RtrA(config)# router ospf 1", "RtrA(config-router)# router-id 1.1.1.1", "RtrA(config-router)# network 10.0.0.0 0.0.0.3 area 0", "RtrA(config-router)# network 10.1.0.0 0.0.255.255 area 0", "RtrA(config-router)# passive-interface default", "RtrA(config-router)# no passive-interface gigabitEthernet 0/2", "RtrA(config-router)# redistribute static subnets", "RtrA(config-router)# end", "RtrA# clear ip ospf process", "RtrA# show ip ospf neighbor", "RtrA# show ip protocols", "RtrA# show ip route 8.8.8.8", "RtrA# show ip route ospf"], "why": "The /32 host route sends only 8.8.8.8 to this site's ISP; redistribute static subnets shares it with RtrB as an OSPF external route (O E2, metric 20). Each router prefers its own static route (administrative distance 1) over the neighbor's O E2 copy (110), so the neighbor's route takes over when the local uplink fails. On classic IOS the subnets keyword lets a /32 through; without it, IOS redistributes classful networks only. passive-interface keeps hellos off the user VLANs and still advertises their subnets; only G0/2 forms a neighbor.", "note": "OSPF stays at concept level here. show ip route 8.8.8.8 on RtrA reports Known via \"static\", distance 1, metric 0; with RtrA's uplink down it reports Known via \"ospf 1\", distance 110, metric 20, type extern 2, with the last update from 10.0.0.2. In the full show ip route table the same entries read S 8.8.8.8 [1/0] via 203.0.113.1 and O E2 8.8.8.8 [110/20] via 10.0.0.2, under the header 8.0.0.0/32 is subnetted, 1 subnets. RtrB runs the same commands with 198.51.100.1 and 10.2.0.0. IOS XE 16 and later adds subnets automatically.", "also": "router-id 1.1.1.1 names RtrA in OSPF (RtrB uses 2.2.2.2). When OSPF already runs, IOS applies a new ID only after clear ip ospf process: answer yes at Reset ALL OSPF processes?, and each neighbor drops for a moment. show ip ospf neighbor then lists 2.2.2.2 in state FULL on GigabitEthernet0/2, and show ip protocols shows the router ID, networks, passive interfaces, and redistribution in one view. default-information originate, under router ospf, shares a default route (0.0.0.0/0) once the router holds one; this RtrA holds the /32 host route in place of a default route.", "task": "send traffic for 8.8.8.8 alone (a host route) to the Site A ISP at 203.0.113.1", "t": "ip route 8.8.8.8 255.255.255.255 203.0.113.1", "area": "config"}, {"id": "A-10", "title": "DHCP on the gateway, or a relay to a central server", "cmds": ["RtrA(config)# ip dhcp excluded-address 10.1.10.1 10.1.10.9", "RtrA(config)# ip dhcp pool STUDENTS", "RtrA(dhcp-config)# network 10.1.10.0 255.255.255.0", "RtrA(dhcp-config)# default-router 10.1.10.1", "RtrA(dhcp-config)# dns-server 10.1.20.50", "RtrA(dhcp-config)# exit", "SwA(config)# no ip dhcp snooping information option", "RtrA# show ip dhcp binding", "  With a central DHCP server instead, the Students gateway relays each request to it:", "RtrA(config)# interface gigabitEthernet 0/0.10", "RtrA(config-subif)# ip helper-address 10.1.20.50", "RtrA(config-subif)# exit"], "why": "Excluded addresses keep the gateway and fixed hosts out of the pool, so every lease DHCP hands out is a free address; a relay lets one central server answer every VLAN.", "note": "Each pool line becomes one setting on the client: network sets the subnet, default-router the gateway, and dns-server the name server. With DHCP snooping on SwA (A-04), the switch adds option 82 to each request, which can make RtrA ignore the requests; no ip dhcp snooping information option on SwA fixes that. show ip dhcp binding then lists each lease by IP address and MAC address.", "also": "ip helper-address goes on the client-facing gateway, here g0/0.10, and names the server's address. The central server then holds one pool for each subnet it serves.", "task": "keep the gateway and the fixed addresses .1 to .9 out of the Students pool", "t": "ip dhcp excluded-address 10.1.10.1 10.1.10.9", "ta": ["ip dhcp excl 10.1.10.1 10.1.10.9"], "area": "config", "ex": ["A-04", "A-08"], "learn": {"label": "Defense Ladder, Junior j4, Cisco: VLANs, routing, and ACLs", "href": "https://freeapp4that.store/defense-ladder/#junior/j4"}}]}], "spot": [{"lvl": 0, "ask": "Lines from show running-config. Tap the finding.", "lines": ["hostname RtrA", "enable password cisco123", "service password-encryption", "banner motd ^CUnauthorized access prohibited^C"], "finding": 1, "why": "enable password is reversible Type 7 at best. Replace it with enable secret."}, {"lvl": 0, "ask": "The vty section of show running-config. Tap the finding.", "lines": ["line vty 0 4", " password Vty-2026!", " no login", " exec-timeout 5 0"], "finding": 2, "why": "no login means the line skips the password check entirely. Set login (or login local)."}, {"lvl": 1, "ask": "The vty section of show running-config. Tap the finding.", "lines": ["line vty 0 4", " login local", " transport input telnet ssh", " exec-timeout 5 0"], "finding": 2, "why": "Telnet is still allowed. transport input ssh removes the cleartext path."}, {"lvl": 1, "ask": "Global config lines. Tap the finding.", "lines": ["ip ssh version 2", "ip http server", "no cdp run", "login block-for 120 attempts 3 within 60"], "finding": 1, "why": "The HTTP management server is on. no ip http server (and no ip http secure-server unless required)."}, {"lvl": 1, "ask": "Output of show ip interface brief on a switch where only Fa0/1 to Fa0/4 are in use. Tap the finding.", "lines": ["Interface              IP-Address      OK? Method Status                Protocol", "FastEthernet0/1        unassigned      YES unset  up                    up", "FastEthernet0/4        unassigned      YES unset  up                    up", "FastEthernet0/12       unassigned      YES unset  up                    up", "FastEthernet0/24       unassigned      YES unset  administratively down down"], "finding": 3, "why": "An unused port that is up is an open door. Shut it and park it in VLAN 999 (PARKING)."}, {"lvl": 2, "ask": "Global config lines. Tap the finding.", "lines": ["snmp-server community public RW", "service tcp-keepalives-in", "no ip source-route", "ntp server 10.1.20.50"], "finding": 0, "why": "A public read-write community string lets anyone rewrite the config. Remove it; use SNMPv3 if monitoring is required."}, {"lvl": 2, "ask": "Trunk interface config. Tap the finding.", "lines": ["interface GigabitEthernet0/1", " switchport mode trunk", " switchport trunk native vlan 1", " switchport nonegotiate"], "finding": 2, "why": "Native VLAN 1 is the default, and every unconfigured access port sits in VLAN 1, so double tagging works out of the box. Move the native VLAN to a host-free VLAN such as 99 on both ends."}, {"lvl": 2, "ask": "SwA G0/1, the trunk to RtrA. This network keeps PortFast on Fa edge ports only. Tap the finding.", "lines": ["interface GigabitEthernet0/1", " switchport trunk native vlan 99", " switchport trunk allowed vlan 10,20,30,99", " switchport mode trunk", " switchport nonegotiate", " spanning-tree portfast trunk"], "finding": 5, "why": "PortFast belongs on edge ports. On a trunk it skips listening and learning, so if the far end is ever a switch, a temporary loop forwards before STP blocks it. Remove it with no spanning-tree portfast trunk."}, {"lvl": 2, "ask": "RtrA ACL and vty lines. The brief: only Teachers at either site manage the devices. Tap the finding.", "lines": ["access-list 20 permit 10.1.20.0 0.0.0.255", "access-list 20 permit 10.2.20.0 0.0.0.255", "access-list 20 permit 10.1.10.0 0.0.0.255", "line vty 0 4", " access-class 20 in", " transport input ssh"], "finding": 2, "why": "10.1.10.0/24 is the Students subnet, so Students reach the VTY prompt. Remove just that entry: ip access-list standard 20, then no 30 (its sequence number in show access-lists). no access-list 20 permit 10.1.10.0 0.0.0.255 deletes the whole list."}], "judge": [{"lvl": 0, "brief": "Authorized network admin accounts: netadmin, techlead. Management over SSH only.", "action": "Run no username guest after seeing username guest privilege 15 in the config.", "answer": "fix", "why": "An unlisted privilege-15 account is an admin backdoor. Remove it."}, {"lvl": 1, "brief": "The web server, published at RtrA's public address 203.0.113.2, must stay reachable from the internet on ports 80 and 443.", "action": "Apply an inbound ACL on the outside interface with only deny ip any any.", "answer": "breaks", "why": "That breaks the required service. Permit 80 and 443 to that address, plus the return traffic inside hosts need, then deny everything else."}, {"lvl": 0, "brief": "Management over SSH only.", "action": "Configure transport input telnet ssh on the vty lines so the helpdesk's old client still works.", "answer": "breaks", "why": "The brief says SSH only. transport input ssh."}, {"lvl": 1, "brief": "The school uses CDP for its IP phones on the access switch.", "action": "Run no cdp run on the access switch.", "answer": "breaks", "why": "CDP is required there. Disable it per port on non-phone edge ports (no cdp enable) or on the router instead."}, {"lvl": 1, "brief": "Ports Fa0/1 to Fa0/4 are in use; the rest are spare.", "action": "interface range Fa0/5 - 24, shutdown, switchport access vlan 999.", "answer": "fix", "why": "Unused ports shut and parked in VLAN 999 (PARKING). Cheapest control on the switch."}, {"lvl": 1, "brief": "An investigation question asks which VLAN was the native VLAN on the trunk before any changes were made.", "action": "Change the native VLAN to 99 first, then answer the question from the new config.", "answer": "check", "why": "Answer from the original config first. Evidence before changes."}, {"lvl": 2, "brief": "The monitoring server at 10.1.20.60 polls the router with SNMP.", "action": "Run no snmp-server to remove SNMP completely.", "answer": "breaks", "why": "Monitoring is required. Remove public and private community strings and configure SNMPv3 instead."}, {"lvl": 2, "brief": "Management comes only from the Teachers subnets, 10.1.20.0/24 and 10.2.20.0/24.", "action": "access-list 20 permit 10.1.20.0 0.0.0.255 and access-list 20 permit 10.2.20.0 0.0.0.255, then access-class 20 in on every vty range RtrA lists.", "answer": "fix", "why": "Exactly what access-class is for: the Teachers subnets at both sites reach the prompt, and everyone else is refused."}, {"lvl": 2, "brief": "Nothing in the brief mentions AAA.", "action": "Run aaa new-model before any username exists in the config.", "answer": "check", "why": "With no local user, aaa new-model can lock you out of the device. Create the local user first, then enable AAA."}, {"lvl": 1, "brief": "Students keep internet access.", "action": "Set switchport trunk native vlan 10 on SwA G0/1.", "answer": "breaks", "why": "Native VLAN 10 sends Students traffic untagged, so RtrA files them under its native subinterface g0/0.99 and Students lose their gateway. It also puts a host VLAN where double tagging works. Keep native 99 on both ends."}, {"lvl": 2, "brief": "Only Teachers at either site may manage SwA.", "action": "Copy RtrA's line vty 0 4 / access-class 20 in onto SwA, whose show running-config lists line vty 0 4 and line vty 5 15.", "answer": "breaks", "why": "vty 0 4 alone leaves lines 5 to 15 reachable from every subnet, which breaks 'Only Teachers at either site may manage SwA'. Apply access-class 20 in to line vty 0 15."}, {"lvl": 1, "brief": "Management over SSH only.", "action": "Keep ip http server and add ip http port 8080 so scanners miss the page.", "answer": "breaks", "why": "The web page still answers on port 8080, a port that scans of common ports check, so it stays reachable and breaks SSH only. no ip http server and no ip http secure-server turn the web server off. ip http secure-port moves HTTPS the same way, with the same result."}], "imposter": [{"title": "Who is the imposter? Router RtrA", "brief": ["Authorized admin accounts: netadmin, techlead (both privilege 15)", "Authorized read-only operator: noc (privilege 1)"], "output": ["RtrA# show running-config | include username", "username netadmin privilege 15 secret 5 $1$...", "username techlead privilege 15 secret 5 $1$...", "username noc privilege 15 password 7 0822455D0A16", "username backup privilege 15 secret 5 $1$..."], "accounts": [{"name": "netadmin", "info": "privilege 15, secret", "admin": true, "truth": "keep", "why": "Listed admin."}, {"name": "techlead", "info": "privilege 15, secret", "admin": true, "truth": "keep", "why": "Listed admin."}, {"name": "noc", "info": "privilege 15, password 7", "admin": true, "truth": "demote", "why": "Authorized as privilege 1 only, and it uses password instead of secret. Set privilege 1 and a secret."}, {"name": "backup", "info": "privilege 15, missing from the brief", "admin": true, "truth": "remove", "why": "Unlisted admin account. no username backup."}], "debrief": "Privilege level is the admin flag on IOS. password 7 is a second finding on the same line."}, {"title": "Who is the imposter? Switch SwA", "brief": ["Authorized admin accounts: netadmin", "Authorized operator: helpdesk (privilege 5 for show commands)"], "output": ["SwA# show running-config | include username", "username netadmin privilege 15 secret 9 $9$...", "username helpdesk privilege 15 secret 9 $9$...", "username cisco privilege 15 password 0 cisco", "username netadmin2 privilege 15 secret 9 $9$..."], "accounts": [{"name": "netadmin", "info": "privilege 15", "admin": true, "truth": "keep", "why": "Listed admin."}, {"name": "helpdesk", "info": "privilege 15", "admin": true, "truth": "demote", "why": "Authorized at privilege 5. Set privilege 5."}, {"name": "cisco", "info": "privilege 15, plaintext password cisco", "admin": true, "truth": "remove", "why": "Default-style vendor account with a plaintext password. Remove it."}, {"name": "netadmin2", "info": "privilege 15, missing from the brief", "admin": true, "truth": "remove", "why": "Lookalike of netadmin. Remove it."}], "debrief": "cisco/cisco style accounts are the first thing an attacker tries. Lookalikes are planted on purpose. A custom level such as 5 starts with only the level 1 commands. Lines such as privilege exec level 5 show running-config move the show commands the brief has in mind down to level 5. One catch: at level 5, show running-config lists only the lines that level may configure."}], "slug": "cisco-ios"};

function dlLink(l,text){return '<a href="'+esc(l.href)+'" target="_blank" rel="noopener"'+(text?' title="'+esc(l.label)+'"':'')+'>'+esc(text||l.label)+'</a>';}
function learnWhy(it){return it.why+(it.learn?' Learn it: '+it.learn.label+'.':'');}
const allItems=APP.levels.flatMap((L,li)=>L.items.map(it=>Object.assign({li},it)));
const byId=Object.fromEntries(allItems.map(i=>[i.id,i]));
const maxScore=allItems.reduce((a,i)=>a+LEVEL_PTS[i.li],0);
function defaults(){return {learned:{},explain:{},drilled:{},days:{},best:{},run:{done:{},notes:{},undo:{},verify:{},elapsed:0,mins:20,lower:true},level:0,mode:'learn',sel:{},theme:'auto'};}
let S=defaults();
try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);S=Object.assign(defaults(),o);S.run=Object.assign(defaults().run,o.run||{});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const PRE=/^(PS>|CMD>|GUI:|\$|#)\s?|^[A-Za-z0-9]+(\([\w\-]+\))?[#>]\s?/;
function splitCmd(c){const m=c.match(PRE);return m?[m[0].trim(),c.slice(m[0].length)]:['',c];}
function stripped(c){return splitCmd(c)[1];}
function firstCmd(it){return (it.cmds||[]).find(c=>!/^GUI:/.test(c)&&PRE.test(c))||(it.cmds||[])[0]||'';}
function keyCmd(it){if(it.t){const k=norm(it.t);return (it.cmds||[]).find(c=>norm(stripped(c))===k)||it.t;}return firstCmd(it);}
function today(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function days(it){const a=S.days&&S.days[it.id];if(a&&a.length)return a;return (S.drilled[it.id]||0)>0?[0]:[];}
function due(it){const a=days(it);return a.length===1&&a[0]!==today();}
/* mastered: explained, and answered right on two different days */
function status(it){const l=!!S.learned[it.id],n=days(it).length;return l&&n>=2?'mastered':l?'learned':n?'drilled':'none';}
function itemScore(it){const st=status(it);return st==='mastered'?LEVEL_PTS[it.li]:st==='none'?0:1;}
function score(){return allItems.reduce((a,i)=>a+itemScore(i),0);}
function badge(li){const L=APP.levels[li];const learned=L.items.filter(i=>S.learned[i.id]).length;const best=S.best[li]||0;return {learned,total:L.items.length,best,earned:best>=80&&learned>=Math.ceil(L.items.length*.8)};}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return String(s).toLowerCase().replace(/["'`]/g,'').replace(/\s+/g,' ').trim();}
/* termBlock: with Copy, a comment line that follows a command opens its own block (an option for a different brief), so each Copy button copies one path */
function termBlock(lines,withCopy){
  const ln=c=>{if(/^GUI:/.test(c))return '<div class="ln c">'+esc(c)+'</div>';const [p,r]=splitCmd(c);return '<div class="ln'+(p?'':' c')+'">'+(p?'<span class="p">'+esc(p)+'</span> ':'')+esc(r)+'</div>';};
  const box=ls=>'<div class="term">'+(withCopy?'<div class="tb"><button class="copy" data-act="copy">Copy</button></div>':'')+ls.map(ln).join('')+'</div>';
  if(!withCopy)return box(lines);
  const parts=[[]];lines.forEach(c=>{const cur=parts[parts.length-1];if(!PRE.test(c)&&cur.some(x=>PRE.test(x)&&!/^GUI:/.test(x)))parts.push([c]);else cur.push(c);});
  return parts.map(box).join('');
}
function copyText(t,btn){const done=()=>{if(btn){btn.textContent='Copied';btn.classList.add('done');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('done');},1400);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback());}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}}
/* header */
function renderHeader(){
  $('#brand').innerHTML='Lockdown Drills <span>'+esc(APP.os)+' hardening trainer</span>';
  $('#levels').innerHTML=APP.levels.map((L,i)=>{const b=badge(i);return '<button role="tab" data-level="'+i+'" class="'+(i===S.level?'on':'')+'" aria-selected="'+(i===S.level)+'" title="'+esc(L.blurb)+'"><span class="b">'+(b.earned?L.badge:'')+'</span>'+esc(L.name)+'</button>';}).join('');
  $('#score').innerHTML='<b>'+score()+'</b> / '+maxScore+' pts';
  $('#modes').innerHTML=MODES.map(([k,n])=>'<button data-mode="'+k+'" class="'+(k===S.mode?'on':'')+(k==='report'?' rep':'')+'">'+n+'</button>').join('');
  const ser=$('#series');if(location.protocol!=='file:'&&APP.slug){ser.hidden=false;ser.innerHTML='<span>Lockdown Drills series</span>'+SERIES.map(([sl,n])=>sl===APP.slug?'<b>'+esc(n)+'</b>':'<a href="../'+sl+'/">'+esc(n)+'</a>').join('');}
  document.body.dataset.mode=S.mode;
  document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme;
  $('#theme').textContent='Theme: '+S.theme;
}
/* learn */
function renderLearn(){
  const L=APP.levels[S.level];const sel=S.sel[S.level]||L.items[0].id;const it=byId[sel]||L.items[0];
  const list='<div class="list" role="tablist">'+L.items.map(i=>'<button role="tab" data-sel="'+i.id+'" class="'+(i.id===it.id?'on':'')+'"><span class="dot '+status(i)+'"></span><span class="id">'+esc(i.id)+'</span><span class="ttl">'+esc(i.title)+'</span></button>').join('')+'</div>';
  const idx=L.items.indexOf(it);
  const detail='<div class="item"><div class="meta">'+esc(L.name)+' · '+esc(it.id)+(it.area&&AREAS[it.area]?' · '+dlLink(AREAS_DL,AREAS[it.area]):'')+'</div><h2>'+esc(it.title)+'</h2>'
    +termBlock(it.cmds,true)
    +(it.gui?'<p class="run-in"><b>In the GUI.</b> '+esc(it.gui)+'</p>':'')
    +'<p class="run-in"><b>Why it matters.</b> '+esc(it.why)+'</p>'
    +(it.note?'<p class="run-in"><b>Watch out.</b> '+esc(it.note)+'</p>':'')
    +(it.also?'<p class="run-in"><b>Also.</b> '+esc(it.also)+'</p>':'')
    +(it.learn?'<p class="run-in"><b>Learn it.</b> '+dlLink(it.learn)+'</p>':'')
    +'<div class="explain"><div><b>Explain it in one sentence, no jargon.</b> If you can say why, you own it.</div><textarea data-explain="'+esc(it.id)+'" placeholder="Example: this stops someone from guessing passwords all day">'+esc(S.explain[it.id]||'')+'</textarea><label><input type="checkbox" data-learn="'+esc(it.id)+'" '+(S.learned[it.id]?'checked':'')+'> I can explain this</label></div>'
    +'<div class="nav"><button class="btn" data-step="-1" '+(idx===0?'disabled':'')+'>Previous</button><button class="btn" data-step="1" '+(idx===L.items.length-1?'disabled':'')+'>Next</button></div></div>';
  const learn=(L.learn?'<p class="learnit">Learn it first: '+dlLink(L.learn)+'</p>':'')+(L.tip?'<p class="learnit">'+esc(L.tip.text)+' Learn it: '+dlLink(L.tip)+'</p>':'')+'<p class="learnit">The six areas and their CIS Controls: '+dlLink({label:'Defense Ladder, Sophomore s1',href:AREAS_DL.href})+'</p>';
  return '<p class="lead">'+esc(L.blurb)+'</p>'+learn+'<div class="learn">'+list+detail+'</div>';
}
/* drill */
let Q=null;
/* distract: n wrong options from other items. it.ex lists items whose key command also fits this item's title (and the reverse), so neither shows up as a wrong option for the other. */
function distract(it,fn,n){const own=fn(it);return shuffle(allItems.filter(o=>o.id!==it.id&&!(it.ex||[]).includes(o.id)&&!(o.ex||[]).includes(it.id)).map(fn)).filter((v,i,a)=>v&&v!==own&&a.indexOf(v)===i).slice(0,n);}
function makeQuiz(li){
  const L=APP.levels[li];const rank=it=>due(it)?0:days(it).length?2:1;
  const items=shuffle(L.items.slice()).sort((a,b)=>rank(a)-rank(b));
  const pool=allItems.filter(o=>o.li<=li);const qs=[];
  const distract=(it,fn,n)=>{const own=fn(it);const seen=new Set([own]);return shuffle(pool.filter(o=>o.id!==it.id&&!(it.ex||[]).includes(o.id)&&!(o.ex||[]).includes(it.id))).filter(o=>{const v=fn(o);if(!v||seen.has(v))return false;seen.add(v);return true;}).slice(0,n).map(o=>({t:fn(o),ok:false,src:o.id}));};
  const cmdOf=it=>stripped(keyCmd(it));
  items.slice(0,4).forEach(it=>{const c=cmdOf(it);const opts=shuffle([{t:c,ok:true,src:it.id},...distract(it,cmdOf,3)]);qs.push({type:'which',item:it,prompt:'Which command does this?  '+it.title,opts,cmd:true});});
  items.slice(4,6).forEach(it=>{const opts=shuffle([{t:it.title,ok:true,src:it.id},...distract(it,o=>o.title,3)]);qs.push({type:'what',item:it,prompt:'What does this command do?',block:[firstCmd(it)],opts});});
  const typed=items.slice(6).concat(items.slice(0,4),items.slice(4,6)).filter(i=>i.t).slice(0,2);typed.forEach(it=>qs.push({type:'type',item:it,prompt:'Type the command: '+(it.task||it.title)}));
  const sp=shuffle((APP.spot||[]).filter(s=>(s.lvl==null?0:s.lvl)<=li));if(sp.length)qs.push(Object.assign({type:'spot'},sp[0]));
  const jd=shuffle((APP.judge||[]).filter(s=>(s.lvl==null?0:s.lvl)<=li));jd.slice(0,2).forEach(j=>qs.push(Object.assign({type:'judge'},j)));
  return {li,qs:shuffle(qs).slice(0,10),i:0,correct:0,done:false,fb:null,res:[]};
}
function renderDrill(){
  const L=APP.levels[S.level];
  if(!Q||Q.li!==S.level||Q.finished){const b=badge(S.level);return '<div class="q"><h2>'+esc(L.name)+' drill</h2><p class="lead">Ten questions pulled from this level: pick the command, read a command, type one from memory, spot the finding in real output, and call fix or break. 80% earns the '+esc(L.name)+' badge once you have learned '+Math.ceil(L.items.length*.8)+' of '+L.items.length+' items.</p><p>Best so far: <b class="mono">'+(b.best||0)+'%</b>'+(b.earned?' <span class="chip">badge earned '+L.badge+'</span>':'')+'</p><button class="btn primary" data-act="startq">Start the drill</button></div>';}
  const q=Q.qs[Q.i];let body='';
  if(q.type==='which'||q.type==='what'){body=(q.block?termBlock(q.block,false):'')+'<div class="opts">'+q.opts.map((o,i)=>'<button data-opt="'+i+'" class="'+(q.cmd?'cmd ':'')+(Q.fb?(o.ok?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+esc(o.t)+'</button>').join('')+'</div>';}
  else if(q.type==='type'){body='<input class="typein" data-type="1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type it here" '+(Q.fb?'disabled value="'+esc(Q.fb.given)+'"':'')+'>'+(Q.fb?'':'<div class="nav"><button class="btn primary" data-act="check">Check</button><button class="btn" data-act="skip">Show me</button></div>');}
  else if(q.type==='spot'){body='<p>'+esc(q.ask||'Tap the line that is the finding.')+'</p><div class="opts">'+q.lines.map((l,i)=>'<button data-opt="'+i+'" class="cmd '+(Q.fb?(i===q.finding?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+esc(l)+'</button>').join('')+'</div>';}
  else if(q.type==='judge'){body='<div class="brief"><b>Scenario brief says:</b> '+esc(q.brief)+'</div><p><b>You do this:</b> '+esc(q.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-opt="'+i+'" class="'+(Q.fb?(k===q.answer?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>';}
  const fb=Q.fb?'<div class="fb '+(Q.fb.ok?'ok':'bad')+'" aria-live="polite"><b>'+(Q.fb.ok?'Right.':'Not this time.')+'</b> '+esc(Q.fb.text)+(Q.fb.chosen?'<div class="picked">'+esc(Q.fb.chosen)+'</div>':'')+'</div><button class="btn primary" data-act="next">'+(Q.i===Q.qs.length-1?'See results':'Next question')+'</button>':'';
  return '<div class="q"><div class="count">Question '+(Q.i+1)+' of '+Q.qs.length+' · '+Q.correct+' correct</div><h2>'+esc(q.prompt||(q.type==='spot'?'Spot the finding':'Fix or break?'))+'</h2>'+body+fb+'</div>';
}
function pickWhy(q,pick){
  if(q.type==='which'||q.type==='what'){const o=q.opts[pick];const s=o&&o.src&&byId[o.src];if(!s)return '';return q.type==='which'?'What you picked, '+stripped(firstCmd(s))+', is "'+s.title+'": '+s.why:'What you picked, "'+s.title+'", is what '+stripped(firstCmd(s))+' does.';}
  if(q.type==='spot')return 'Line '+(pick+1)+' is ordinary output here. The finding is line '+(q.finding+1)+'.';
  if(q.type==='judge')return ({fix:'You called it a fix.',breaks:'You said it breaks a requirement.',check:'You chose to check first.'})[['fix','breaks','check'][pick]]||'';
  return '';
}
function answer(pick,given){
  const q=Q.qs[Q.i];let ok=false,text='';const why=q.item?learnWhy(q.item):'';
  if(q.type==='which'||q.type==='what'){ok=q.opts[pick].ok;text=why;}
  else if(q.type==='spot'){ok=pick===q.finding;text=q.why;}
  else if(q.type==='judge'){ok=['fix','breaks','check'][pick]===q.answer;text=q.why;}
  else if(q.type==='type'){const g=norm(given);const acc=[q.item.t].concat(q.item.ta||[]).map(norm);ok=acc.includes(g);text=(ok?'':'Answer: '+q.item.t+'. ')+why;}
  const chosen=ok?'':pickWhy(q,pick);
  if(ok&&q.item){const id=q.item.id,t=today();const a=S.days[id]=S.days[id]||((S.drilled[id]||0)>0?[0]:[]);if(!a.includes(t))a.push(t);S.drilled[id]=(S.drilled[id]||0)+1;}
  if(ok)Q.correct++;Q.res.push({q,ok,pick});save();
  Q.fb={ok,text,chosen,pick,given:given||''};
}
function finishQuiz(){const pct=Math.round(100*Q.correct/Q.qs.length);S.best[Q.li]=Math.max(S.best[Q.li]||0,pct);save();Q.finished=true;const b=badge(Q.li);const L=APP.levels[Q.li];
  const missed=Q.res.filter(r=>!r.ok);const mastered=L.items.filter(i=>status(i)==='mastered').length;const dueN=L.items.filter(due).length;
  const list=missed.length?'<h3>Worth another look</h3><div class="missed">'+missed.map(r=>{const it=r.q.item;const label=it?it.id+' · '+it.title:(r.q.type==='spot'?'Spot the finding':'Fix or break: '+r.q.action);return '<div class="miss"><span>'+esc(label)+'</span>'+(it?'<button class="btn small" data-learnjump="'+esc(it.id)+'">Open in Learn</button>':'')+'</div>';}).join('')+'</div>':'<p>Every question right.</p>';
  return '<div class="result"><div class="big">'+pct+'%</div><p>'+Q.correct+' of '+Q.qs.length+' right. '+(b.earned?'The '+esc(L.name)+' badge is yours: '+L.badge:(pct>=80?'The drill is there; learn '+(Math.ceil(L.items.length*.8)-b.learned)+' more items for the badge.':'Open each miss in Learn, then run it again.'))+'</p>'
   +'<p class="small">'+mastered+' of '+L.items.length+' items mastered: right on two different days.'+(dueN?' '+dueN+' due for a second day.':'')+'</p>'+list
   +'<div class="nav"><button class="btn primary" data-act="startq">Run it again</button><button class="btn" data-mode-go="learn">Back to Learn</button></div></div>';}
/* run */
let tick=null;const OPEN=new Set();
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function renderRun(){
  const R=S.run;const items=allItems.filter(i=>i.li===S.level||(R.lower&&i.li<S.level));
  const remain=Math.max(0,R.mins*60-R.elapsed);
  const rows=items.map(i=>'<div class="chk '+(R.done[i.id]!=null?'done':'')+'"><input type="checkbox" data-done="'+i.id+'" '+(R.done[i.id]!=null?'checked':'')+' aria-label="Done: '+esc(i.title)+'"><div><div class="t"><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span>'+(R.done[i.id]!=null?'<span class="stamp">'+fmt(R.done[i.id])+'</span>':'')+'<button class="btn small" data-show="'+i.id+'">Commands</button></div><div id="show-'+i.id+'"'+(OPEN.has(i.id)?'':' hidden')+'>'+termBlock(i.cmds,true)+'</div><input class="note" data-note="'+i.id+'" placeholder="Change: what you changed and why" value="'+esc(R.notes[i.id]||'')+'" aria-label="Change for '+esc(i.id)+'"><input class="note" data-undo="'+i.id+'" placeholder="Undo: how to put it back" value="'+esc(R.undo[i.id]||'')+'" aria-label="Undo for '+esc(i.id)+'"><input class="note" data-verify="'+i.id+'" placeholder="Verified with: the command or screen that proved it" value="'+esc(R.verify[i.id]||'')+'" aria-label="Verified with, for '+esc(i.id)+'"></div></div>').join('');
  return '<h2>Run the checklist on your VM</h2><p class="lead">Set the clock, work the list top to bottom, tick each item once you have verified it on the machine, and write the change, how to undo it, and what you verified it with. The log is what lets you undo a change that broke something in thirty seconds.</p>'
   +'<div class="timer"><div class="clock" aria-live="off">'+fmt(remain)+'</div><select data-mins>'+[20,45,60,90,120].map(m=>'<option value="'+m+'" '+(m===R.mins?'selected':'')+'>'+m+' min</option>').join('')+'</select><button class="btn primary" data-act="timer">'+(tick?'Pause':'Start')+'</button><button class="btn" data-act="resetclock">Reset clock</button><label class="toggle"><input type="checkbox" data-lower '+(R.lower?'checked':'')+'> include lower levels</label></div>'
   +'<div class="nav" style="margin:0 0 10px"><button class="btn small" data-act="copylog">Copy change log</button><button class="btn small" data-act="dlog">Download change log</button><button class="btn small" data-act="clearrun">Clear this run</button></div>'
   +rows;
}
function changeLog(){const R=S.run;const lines=allItems.filter(i=>R.done[i.id]!=null||R.notes[i.id]||R.undo[i.id]||R.verify[i.id]).sort((a,b)=>(R.done[a.id]??1e9)-(R.done[b.id]??1e9)).map(i=>'['+(R.done[i.id]!=null?fmt(R.done[i.id]):'--:--')+'] '+APP.os+' | '+i.id+' '+i.title+' | change: '+(R.notes[i.id]||'-')+' | undo: '+(R.undo[i.id]||'-')+' | verified: '+(R.verify[i.id]||'-'));
  return '# Change log - '+APP.os+' - '+new Date().toLocaleString()+'\n# [time] machine | item | change | undo | verified\n'+(lines.join('\n')||'(nothing logged yet)')+'\n';}
function startTimer(){if(tick)return;tick=setInterval(()=>{S.run.elapsed++;if(S.run.elapsed%5===0)save();const c=document.querySelector('.clock');if(c)c.textContent=fmt(Math.max(0,S.run.mins*60-S.run.elapsed));if(S.run.elapsed>=S.run.mins*60){stopTimer();render();}},1000);}
function stopTimer(){clearInterval(tick);tick=null;save();}
/* games */
let G={tab:'imposter',sc:0,picks:{},checked:false,jq:null,streak:0,jfb:null};
function renderGames(){
  const tabs='<div class="tabs"><button class="btn '+(G.tab==='imposter'?'primary':'')+'" data-gtab="imposter">Who is the imposter?</button><button class="btn '+(G.tab==='judge'?'primary':'')+'" data-gtab="judge">Fix or break?</button></div>';

  }
