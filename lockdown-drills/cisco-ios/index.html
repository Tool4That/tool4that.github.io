<style>
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#16212D; --muted:#5F6E7E; --line:#CFD7E0; --soft:#F4F6F9;
  --term:#0E1A2B; --termink:#D9E4F1; --prompt:#7FA6D6; --accent:#B8690E; --accent-ink:#FFFFFF;
  --ok:#1C8A57; --okbg:#E3F5EB; --bad:#C03A3A; --badbg:#FBE7E7; --warn:#A8690F; --warnbg:#FBF0DA; --focus:#FFB300;
  --sans:"Segoe UI Variable Text","Segoe UI","Avenir Next",Avenir,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; } }
:root[data-theme="dark"]{ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) 16px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.brand{font-weight:800;letter-spacing:-.01em;font-size:1.15rem;line-height:1.1}
.brand span{display:block;font-weight:500;color:var(--muted);font-size:.85rem;letter-spacing:0}
.levels{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.levels button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.levels button.on{background:var(--accent);color:var(--accent-ink)}
.levels button .b{font-size:1rem}
.score{font-family:var(--mono);font-size:.95rem;white-space:nowrap}
.score b{font-size:1.2rem}
.theme{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.85rem}
.modes{display:flex;gap:2px;overflow-x:auto}
.modes button{border:0;background:transparent;padding:8px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.modes button.on{color:var(--ink);border-bottom-color:var(--accent)}
.series{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 0 8px;font-size:.82rem;color:var(--muted)}
.series a{color:var(--muted);text-decoration:none}.series a:hover{text-decoration:underline}.series b{color:var(--ink)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 110px)}
main{padding:18px 16px 40px;min-width:0}
aside.report{border-left:1px solid var(--line);background:var(--panel);padding:16px}
footer{padding:14px 16px 30px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);background:var(--panel)}
footer button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.85rem;margin-left:8px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lead{color:var(--muted);max-width:70ch;margin-bottom:16px}.learnit{color:var(--muted);font-size:.9rem;max-width:70ch;margin:-8px 0 14px}.item .meta a{color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
/* learn */
.learn{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:grid;grid-template-columns:18px 54px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;line-height:1.25}
.list button.on{background:var(--soft)}
.list button .id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.learned{background:var(--accent)}.dot.drilled{background:var(--warn)}.dot.mastered{background:var(--ok)}
.item .meta{font-family:var(--mono);color:var(--muted);font-size:.85rem;margin-bottom:2px}
.term{background:var(--term);color:var(--termink);font-family:var(--mono);font-size:.86rem;line-height:1.5;border-radius:10px;padding:8px 14px 12px;margin:12px 0;overflow-x:auto}
.term .tb{display:flex;justify-content:flex-end;min-height:22px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding-left:1.4em;text-indent:-1.4em;margin:2px 0}
.term .p{color:var(--prompt)}
.term .ln.c{color:#9DB0C6;font-style:italic}
.term .copy{border:1px solid #2E4158;background:#17283D;color:var(--termink);border-radius:6px;padding:2px 9px;font:600 .75rem var(--sans)}
.term .copy.done{border-color:var(--ok);color:#8BE0B4}
.run-in b{font-weight:700}
.explain{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--soft)}
.explain textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);resize:vertical}
.explain label{display:flex;gap:10px;align-items:center;margin-top:8px;font-weight:600}
.explain input{width:20px;height:20px;accent-color:var(--ok)}
.nav{display:flex;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
/* drill */
.q{max-width:720px}
.q .count{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;line-height:1.35}
.opts button.cmd{font-family:var(--mono);font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.opts button.ok{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.typein{width:100%;max-width:560px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);background:var(--panel)}
.result{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:560px}
.result .big{font-size:2.4rem;font-weight:800;font-family:var(--mono)}
/* run */
.timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.timer .clock{font-family:var(--mono);font-size:2rem;font-weight:700;min-width:120px}
.timer select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.chk input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--ok)}
.chk .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chk .t .id{font-family:var(--mono);color:var(--muted);font-size:.8rem}
.chk .note{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;background:var(--panel);font-size:.9rem}
.chk.done .t{color:var(--muted);text-decoration:line-through}
.chk .stamp{font-family:var(--mono);font-size:.8rem;color:var(--ok)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
/* games */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.brief{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0 14px;max-width:720px}
.brief ul{margin:4px 0 0 18px;padding:0}
.acct{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);max-width:720px}
.acct .n{font-family:var(--mono)}
.acct .n small{color:var(--muted);font-family:var(--sans);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.acct.ok .n{color:var(--ok)}.acct.bad .n{color:var(--bad)}
.streak{font-family:var(--mono);color:var(--muted);font-size:.9rem}
/* report */
.report h2{font-size:1.05rem;margin-bottom:10px}
.lv{margin:10px 0 14px}
.lv .row{display:flex;justify-content:space-between;font-size:.9rem}
.lv .bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.lv .bar2 i{display:block;height:100%;background:var(--accent)}
.lv .bar2.earned i{background:var(--ok)}
.rr{display:grid;grid-template-columns:18px 52px 1fr 26px;gap:6px;align-items:center;font-size:.85rem;padding:3px 0;border-top:1px solid var(--line)}
.rr .id{font-family:var(--mono);color:var(--muted);font-size:.78rem}
.rr .pt{font-family:var(--mono);text-align:right;color:var(--muted)}
.rr.mastered .g{color:var(--ok);font-weight:800}.rr.mastered .pt{color:var(--ok)}
.rr.learned .g{color:var(--accent);font-weight:800}
.rr.drilled .g{color:var(--warn);font-weight:800}
.rr .g{text-align:center}
.rr.flip{animation:flip .35s ease-out}
@keyframes flip{0%{background:var(--okbg)}100%{background:transparent}}
.total{display:flex;justify-content:space-between;font-family:var(--mono);margin-top:10px;padding-top:8px;border-top:2px solid var(--ink)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted);margin-left:6px}
.empty{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion:reduce){ .rr.flip{animation:none} }
@media (max-width:1100px){ .wrap{grid-template-columns:1fr} aside.report{display:none;border-left:0;border-top:1px solid var(--line)} body[data-mode="report"] aside.report{display:block} body[data-mode="report"] main{display:none} .modes .rep{display:inline-block} }
@media (min-width:1101px){ .modes .rep{display:none} }
@media (max-width:760px){ header.top{position:static} .learn{grid-template-columns:1fr} .list{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px} .list button{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line)} .list button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .list button .ttl{display:none} .levels{margin-left:0} .score{margin-left:auto} }
</style>
</head>

  <div class="bar">
    <div class="brand" id="brand"></div>

</header>
<div class="wrap">

</div>
<footer id="foot"></footer>
<script>
const APP = {"key": "cisco", "os": "Cisco IOS / Packet Tracer", "accent": "#B8690E", "footer": "Training tool for Packet Tracer and lab gear you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial practice; not affiliated with or endorsed by Cisco.", "levels": [{"name": "Doorman", "badge": "🚪", "blurb": "Lock the doors. Hostname, enable secret, console and VTY logins, idle timeouts, password encryption, legal banners, and save. The basics every device needs.", "learn": {"label": "Defense Ladder, Sophomore s5, Cisco: configure a switch and a router", "href": "https://freeapp4that.store/defense-ladder/#sophomore/s5"}, "tip": {"text": "Evidence first: answer any investigation question before you change a device.", "label": "Defense Ladder, Freshman f1, How hands-on defense practice works", "href": "https://freeapp4that.store/defense-ladder/#freshman/f1"}, "items": [{"id": "B-01", "title": "Name the device and lock privileged mode", "cmds": ["Router> enable", "Router# configure terminal", "Router(config)# hostname RtrA", "RtrA(config)# enable secret Str0ng-Enable-2026!"], "why": "enable secret stores a hash. enable password stores plaintext or Type 7, which reverses in seconds, so enable secret is the one to use.", "task": "set the privileged-mode password (hashed) to Str0ng-Enable-2026!", "t": "enable secret Str0ng-Enable-2026!", "note": "On older IOS releases enable secret stores an MD5 (Type 5) hash. Where the release supports it, enable algorithm-type scrypt secret stores a Type 9 hash, which the Cisco hardening guide recommends.", "area": "access", "ex": ["B-03", "A-06"]}, {"id": "B-02", "title": "Console and VTY lines: require login, time out idle sessions", "cmds": ["RtrA(config)# line console 0", "RtrA(config-line)# password C0nsole-2026!", "RtrA(config-line)# login", "RtrA(config-line)# exec-timeout 5 0", "RtrA(config-line)# logging synchronous", "RtrA(config-line)# exit", "RtrA(config)# line vty 0 4", "RtrA(config-line)# password Vty-2026!", "RtrA(config-line)# login", "RtrA(config-line)# exec-timeout 5 0", "RtrA(config-line)# exit"], "why": "login is what makes a line ask for its password; a line without it lets anyone straight in. exec-timeout 5 0 logs out an unattended console after five idle minutes. logging synchronous keeps log lines from mangling what you type.", "note": "Watchman replaces line passwords with local usernames and SSH. Switches with 16 VTY lines use line vty 0 15. The passwords here are placeholders; give every line and secret its own unique passphrase. exec-timeout 5 sets the same five minutes; the second number adds seconds.", "task": "log out idle sessions after 5 minutes (line command)", "t": "exec-timeout 5 0", "area": "access", "ta": ["exec-timeout 5", "exec-time 5 0", "exec-time 5"], "ex": ["I-01"]}, {"id": "B-03", "title": "Hide passwords in the config", "cmds": ["RtrA(config)# service password-encryption"], "why": "Encodes line and username passwords (Type 7). Weak, but it beats plaintext in show run over someone's shoulder. Use secret wherever a command offers it.", "task": "obscure the plaintext passwords in the running config", "t": "service password-encryption", "area": "config", "ex": ["B-01", "A-06"]}, {"id": "B-04", "title": "Legal banners: MOTD and login", "cmds": ["RtrA(config)# banner motd #Unauthorized access is prohibited and monitored.#", "RtrA(config)# banner login #Authorized users only. Activity is logged.#"], "why": "A legal notice that access is restricted and monitored. Have the wording reviewed by legal counsel, and leave out the device name, model, software, and owner. Skip Welcome, which reads as an invitation.", "note": "Pick a delimiter character that stays out of the text itself. On the console the MOTD shows first, then the login banner, then the login prompt. Over SSH version 2 the login banner appears before authentication, so it carries the legal notice too.", "task": "set a message-of-the-day banner with # as the delimiter", "t": "banner motd #Unauthorized access is prohibited and monitored.#", "ta": ["banner motd #unauthorized access is prohibited#", "banner motd #unauthorized access prohibited#"], "area": "config"}, {"id": "B-05", "title": "Save the config", "cmds": ["RtrA# copy running-config startup-config", "RtrA# write memory", "RtrA# show running-config | include enable|password|hostname|banner|exec-timeout"], "why": "A reload discards every unsaved fix. Save after every block.", "task": "save the running config so it survives a reload", "t": "copy running-config startup-config", "ta": ["write memory", "wr", "copy run start", "write", "write mem", "wr mem", "copy run startup-config"], "area": "config", "ex": ["A-06"]}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. Local user accounts, SSH version 2 only, unneeded services off, port security, user VLANs and a hardened trunk, VLAN versus SVI, login attack protection, logging, and time.", "learn": {"label": "Defense Ladder, Junior j4, Cisco: VLANs, routing, and ACLs", "href": "https://freeapp4that.store/defense-ladder/#junior/j4"}, "items": [{"id": "I-01", "title": "Local user accounts and login local", "cmds": ["RtrA(config)# username netadmin privilege 15 secret Adm1n-Secret-2026!", "RtrA(config)# line console 0", "RtrA(config-line)# login local", "RtrA(config-line)# exit", "RtrA(config)# line vty 0 4", "RtrA(config-line)# login local", "RtrA(config-line)# exit", "RtrA(config)# no username olduser"], "why": "Named accounts give accountability and per-user removal; secret hashes the password. Remove every username the brief leaves off its list.", "task": "make the VTY lines authenticate against the local user database (line command)", "t": "login local", "note": "Where supported, username netadmin privilege 15 algorithm-type scrypt secret <password> stores a Type 9 hash instead of Type 5.", "area": "acct", "ex": ["B-02", "A-05"]}, {"id": "I-02", "title": "SSH version 2 only, Telnet gone", "cmds": ["RtrA(config)# ip domain-name school.lan", "RtrA(config)# crypto key generate rsa general-keys modulus 2048", "RtrA(config)# ip ssh version 2", "RtrA(config)# ip ssh time-out 60", "RtrA(config)# ip ssh authentication-retries 3", "RtrA(config)# line vty 0 4", "RtrA(config-line)# transport input ssh", "RtrA(config-line)# exit", "RtrA# show ip ssh", "RtrA# show crypto key mypubkey rsa"], "why": "Telnet sends passwords in cleartext and SSHv1 is broken. Key generation requires a hostname and domain name first, the classic lab trap.", "task": "allow only SSH on the VTY lines (line command)", "t": "transport input ssh", "area": "access", "note": "Order matters: hostname, then ip domain-name, then the RSA key (2048 bits here; SSH version 2 needs at least 768), then ip ssh version 2.", "ex": ["I-03", "I-06", "A-01"]}, {"id": "I-03", "title": "Disable unneeded services", "cmds": ["RtrA(config)# no ip http server", "RtrA(config)# no ip http secure-server", "RtrA(config)# no cdp run", "RtrA(config)# no lldp run", "RtrA(config)# no service tcp-small-servers", "RtrA(config)# no service udp-small-servers", "RtrA(config)# no ip source-route", "RtrA(config)# no ip finger", "RtrA(config)# no ip bootp server"], "why": "Each one is a listening service or an information leak. CDP tells an attacker the IOS version and IP of every neighbor.", "note": "Packet Tracer support for these varies by version; real IOS takes them all, so know them anyway. Keep ip http secure-server only if the brief needs web management.", "task": "turn off the HTTP management server", "t": "no ip http server", "area": "config", "ex": ["I-02", "A-03", "A-05"]}, {"id": "I-04", "title": "Switch port security and shut unused ports", "cmds": ["SwA(config)# interface range fastEthernet 0/5 - 24", "SwA(config-if-range)# shutdown", "SwA(config-if-range)# switchport mode access", "SwA(config-if-range)# switchport access vlan 999", "SwA(config-if-range)# exit", "SwA(config)# interface fastEthernet 0/1", "SwA(config-if)# switchport mode access", "SwA(config-if)# switchport port-security", "SwA(config-if)# switchport port-security maximum 2", "SwA(config-if)# switchport port-security mac-address sticky", "SwA(config-if)# switchport port-security violation shutdown", "SwA(config-if)# exit", "SwA# show port-security interface fastEthernet 0/1"], "why": "An open port means plug in and you are on the LAN. Port security pins MAC addresses; shutting unused ports is the cheapest control there is.", "task": "turn on port security on the current interface", "t": "switchport port-security", "area": "config", "note": "VLAN 999 is PARKING: unused ports wait there, shut down, in a VLAN separate from the native VLAN (99).", "ex": ["A-03", "A-04"]}, {"id": "I-05", "title": "User VLANs above 1 and a hardened trunk", "cmds": ["SwA(config)# vlan 10", "SwA(config-vlan)# name STUDENTS", "SwA(config-vlan)# vlan 20", "SwA(config-vlan)# name TEACHERS", "SwA(config-vlan)# vlan 30", "SwA(config-vlan)# name PRINCIPALS", "SwA(config-vlan)# vlan 99", "SwA(config-vlan)# name NATIVE", "SwA(config-vlan)# vlan 999", "SwA(config-vlan)# name PARKING", "SwA(config-vlan)# exit", "SwA(config)# interface gigabitEthernet 0/1", "SwA(config-if)# switchport mode trunk", "SwA(config-if)# switchport trunk native vlan 99", "SwA(config-if)# switchport trunk allowed vlan 10,20,30,99", "SwA(config-if)# switchport nonegotiate", "SwA(config-if)# end", "SwA# show vlan brief", "SwA# show interfaces trunk"], "why": "User VLANs use numbers above 1, which keeps people apart from the default VLAN every unconfigured port joins. Double tagging works when an attacker's access VLAN equals the trunk's native VLAN; VLAN 1 is only the default case, so a host-free native VLAN closes it. DTP lets an attacker negotiate a trunk; switchport nonegotiate turns it off.", "task": "set the trunk's native VLAN to 99 (interface command)", "t": "switchport trunk native vlan 99", "area": "config", "note": "The router end uses encapsulation dot1Q 99 native (Hunter A-08), so both ends agree on native 99. Between two switches a mismatch logs %CDP-4-NATIVE_VLAN_MISMATCH; toward the router, a mismatch that lands on a host VLAN shows up as that VLAN's hosts losing their gateway, so compare show interfaces trunk on SwA with the g0/0.99 subinterface in RtrA's running config. VLAN 99 carries no hosts and no IP, and VLAN 999 PARKING stays separate for shut ports. A multilayer switch such as a 3560 needs switchport trunk encapsulation dot1q before switchport mode trunk; a 2960 speaks 802.1Q only and goes without that line.", "ex": ["I-08", "A-03", "A-04", "A-08"]}, {"id": "I-06", "title": "Login attack protection and minimum password length", "cmds": ["RtrA(config)# security passwords min-length 10", "RtrA(config)# login block-for 120 attempts 3 within 60", "RtrA(config)# login on-failure log"], "why": "Lockout for brute force; min-length enforces the password policy at the moment a password is set.", "task": "block logins for 120 seconds after 3 failures within 60 seconds", "t": "login block-for 120 attempts 3 within 60", "area": "acct", "ex": ["I-02", "A-01"]}, {"id": "I-07", "title": "Logging and time", "cmds": ["RtrA(config)# service timestamps log datetime msec", "RtrA(config)# logging buffered 16384", "RtrA(config)# logging host 10.1.20.50", "RtrA(config)# ntp server 10.1.20.50", "RtrA(config)# clock timezone UTC 0", "RtrA# show logging"], "why": "Correct, synchronized time is what lets logs from every device line up in an investigation.", "task": "send log messages to the syslog server 10.1.20.50", "t": "logging host 10.1.20.50", "ta": ["logging 10.1.20.50"], "area": "audit", "note": "10.1.20.50 stands for a log and time server on the Teachers (management) VLAN. UTC keeps Site A and Site B on one clock."}, {"id": "I-08", "title": "Give the switch an SVI in VLAN 20 (a VLAN and an SVI differ)", "cmds": ["SwA(config)# interface vlan 20", "SwA(config-if)# ip address 10.1.20.2 255.255.255.0", "SwA(config-if)# no shutdown", "SwA(config-if)# exit", "SwA(config)# vlan 20", "SwA(config-vlan)# name TEACHERS", "SwA(config-vlan)# exit", "SwA(config)# ip default-gateway 10.1.20.1", "SwA(config)# interface vlan 1", "SwA(config-if)# shutdown", "SwA(config-if)# end", "SwA# show ip interface brief", "SwA# show vlan brief"], "why": "A VLAN is a layer-2 broadcast domain: a number and a name in the VLAN database that ports join. An SVI (interface vlan 20) is a layer-3 interface inside that VLAN that gives the switch its own management address. ip default-gateway lets the layer-2 switch reply to hosts on other subnets, such as Teachers at Site B.", "note": "Vlan20 shows down/down while VLAN 20 is missing from the VLAN database, then up/down until at least one port in VLAN 20 (an access port, or a trunk that allows it) is up and forwarding in STP; that rule is called autostate. Larger networks give management its own dedicated VLAN; this network keeps it on Teachers so the Teachers-only ACL and the management subnet are one and the same. Shutting interface vlan 1 leaves the default VLAN devoid of an address.", "task": "create the switch virtual interface for VLAN 20 (global command)", "t": "interface vlan 20", "ta": ["int vlan 20", "int vlan20", "interface vlan20"], "area": "config", "ex": ["I-05"], "learn": {"label": "Defense Ladder, Freshman f7, A VLAN and an SVI", "href": "https://freeapp4that.store/defense-ladder/#freshman/f7"}}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. A Teachers-only VTY ACL, edge ACLs, interface hardening, layer-2 attack defenses, SNMP and AAA, protecting the config itself, auditing a config fast, router-on-a-stick, and a host route shared through OSPF.", "learn": {"label": "Defense Ladder, Senior se6, Cisco: audit and extend the two-site network", "href": "https://freeapp4that.store/defense-ladder/#senior/se6"}, "items": [{"id": "A-01", "title": "Teachers-only VTY access", "cmds": ["RtrA(config)# access-list 20 remark TEACHERS-ONLY", "RtrA(config)# access-list 20 permit 10.1.20.0 0.0.0.255", "RtrA(config)# access-list 20 permit 10.2.20.0 0.0.0.255", "RtrA(config)# access-list 20 deny any log", "RtrA(config)# line vty 0 4", "RtrA(config-line)# access-class 20 in", "RtrA(config-line)# line vty 5 15", "RtrA(config-line)# access-class 20 in", "RtrA(config-line)# exit", "SwA(config)# access-list 20 permit 10.1.20.0 0.0.0.255", "SwA(config)# access-list 20 permit 10.2.20.0 0.0.0.255", "SwA(config)# line vty 0 15", "SwA(config-line)# access-class 20 in", "SwA(config-line)# exit"], "why": "Even with SSH, anyone on any subnet could try to log in. access-class limits who reaches the prompt at all: here, the Teachers subnets at Site A and Site B. A standard ACL matches the source address, which is all a VTY filter needs, and the wildcard mask is the inverse of the subnet mask.", "task": "apply standard ACL 20 to inbound VTY connections (line command)", "t": "access-class 20 in", "area": "access", "note": "Apply it to every VTY range the device lists (show running-config | section line vty). A 2960 lists line vty 0 4 and line vty 5 15; line vty 0 15 configures both at once. A 2911 lists line vty 0 4 by default, both in Packet Tracer and on real IOS 15; line vty 5 15 appears once someone creates it, so the example adds that range with the ACL already applied. SSH from a Students PC then ends with % Connection refused by remote host.", "ex": ["I-02", "I-06", "A-02"]}, {"id": "A-02", "title": "Extended ACL on an interface: allow only what the scenario needs", "cmds": ["RtrA(config)# ip access-list extended OUTSIDE-IN", "RtrA(config-ext-nacl)# permit tcp any host 203.0.113.2 eq 443", "RtrA(config-ext-nacl)# permit tcp any host 203.0.113.2 eq 80", "RtrA(config-ext-nacl)# permit icmp any any echo-reply", "RtrA(config-ext-nacl)# permit tcp any any established", "RtrA(config-ext-nacl)# permit udp host 8.8.8.8 eq domain any", "RtrA(config-ext-nacl)# deny ip any any log", "RtrA(config-ext-nacl)# exit", "RtrA(config)# interface gigabitEthernet 0/1", "RtrA(config-if)# ip access-group OUTSIDE-IN in", "RtrA(config-if)# exit", "RtrA# show access-lists"], "why": "Default deny at the edge. The implicit deny exists anyway, but an explicit deny with log gives visibility. Direction is relative to the router: in on G0/1 means traffic arriving from the ISP.", "task": "apply the OUTSIDE-IN ACL to inbound traffic on the current interface", "t": "ip access-group OUTSIDE-IN in", "area": "config", "note": "203.0.113.2 is RtrA's ISP-facing address; static NAT port forwarding (ip nat inside source static tcp <server> 443 203.0.113.2 443, and the same for 80) carries web traffic to the server. An inbound ACL on the outside interface sees that public address, because IOS checks the ACL before it translates. An interface ACL is stateless, so return traffic for sessions started inside needs its own permits: established matches TCP replies (ACK or RST set), and the domain line admits DNS replies from 8.8.8.8. A stateful firewall, such as the IOS zone-based policy firewall, tracks sessions and does this job more precisely.", "ex": ["A-01", "A-03"]}, {"id": "A-03", "title": "Interface-level hardening", "cmds": ["RtrA(config)# interface gigabitEthernet 0/1", "RtrA(config-if)# no ip redirects", "RtrA(config-if)# no ip proxy-arp", "RtrA(config-if)# no ip directed-broadcast", "RtrA(config-if)# no ip unreachables", "RtrA(config-if)# no ip mask-reply", "RtrA(config-if)# exit"], "why": "Proxy ARP and directed broadcasts enable spoofing and amplification (Smurf). Redirects and unreachables leak topology. G0/1 faces the ISP, so it gets the full set.", "note": "no ip unreachables is optional; it can interfere with path MTU discovery. Shut every router port the design leaves unused; on this 2911, G0/0, G0/1, and G0/2 all carry traffic.", "task": "stop the interface from answering ARP on behalf of other hosts", "t": "no ip proxy-arp", "area": "config", "ex": ["I-03", "I-04", "I-05", "A-02", "A-04"]}, {"id": "A-04", "title": "Layer-2 attack defenses", "cmds": ["SwA(config)# ip dhcp snooping", "SwA(config)# ip dhcp snooping vlan 10", "SwA(config)# interface gigabitEthernet 0/1", "SwA(config-if)# ip dhcp snooping trust", "SwA(config-if)# ip arp inspection trust", "SwA(config-if)# exit", "SwA(config)# ip arp inspection vlan 10", "SwA(config)# interface range fastEthernet 0/1 - 4", "SwA(config-if-range)# spanning-tree portfast", "SwA(config-if-range)# spanning-tree bpduguard enable", "SwA(config-if-range)# storm-control broadcast level 20", "SwA(config-if-range)# exit", "SwA(config)# spanning-tree portfast bpduguard default"], "why": "Rogue DHCP servers (snooping), ARP poisoning (dynamic ARP inspection, which checks ARP against the snooping table), rogue switches taking over the STP root (BPDU guard), and broadcast storms (storm control). G0/1 trusts DHCP and ARP because DHCP replies and the router-on-a-stick gateway ARP arrive there. PortFast skips about 30 s of listening and learning, so it belongs on edge ports only; on a trunk or switch link a temporary loop forwards before STP blocks it.", "note": "Packet Tracer support for DAI and storm control varies by version. A host with a static address in VLAN 10 needs a static binding or an ARP ACL, because DAI drops ARP it cannot match. When the router serves or relays DHCP, add no ip dhcp snooping information option on the switch; the router drops requests that carry the switch's option 82 with an empty relay address.", "task": "trust DHCP replies on the current uplink interface", "t": "ip dhcp snooping trust", "area": "config", "ex": ["I-04", "I-05", "A-03"]}, {"id": "A-05", "title": "SNMP and AAA", "cmds": ["RtrA(config)# no snmp-server community public", "RtrA(config)# no snmp-server community private", "RtrA(config)# snmp-server group ADMINS v3 priv", "RtrA(config)# snmp-server user noc ADMINS v3 auth sha AuthPass-2026 priv aes 128 PrivPass-2026", "RtrA(config)# aaa new-model", "RtrA(config)# aaa authentication login default local"], "why": "SNMP v1 and v2c with public or private community strings let anyone read, or write, the whole config. v3 adds authentication and encryption. AAA centralizes accounts.", "note": "After aaa new-model, lines use the default method list. Create a local user first so a way back in always exists.", "task": "remove the public SNMP community string", "t": "no snmp-server community public", "area": "access", "ex": ["I-01", "I-03"]}, {"id": "A-06", "title": "Protect the config itself", "cmds": ["RtrA(config)# service tcp-keepalives-in", "RtrA(config)# service tcp-keepalives-out", "RtrA(config)# no boot network", "RtrA(config)# no service config", "RtrA(config)# secure boot-image", "RtrA(config)# secure boot-config", "RtrA(config)# archive", "RtrA(config-archive)# log config", "RtrA(config-archive-log-cfg)# logging enable", "RtrA(config-archive-log-cfg)# hidekeys"], "why": "Keepalives drop dead sessions and free VTY lines. Resilient configuration stops an attacker from erasing the IOS image or startup config. The archive log records who changed what.", "note": "Several of these run on real devices only, outside Packet Tracer; know them anyway.", "task": "keep a tamper-resistant archive of the running config (resilient configuration)", "t": "secure boot-config", "area": "config", "ex": ["B-01", "B-03", "B-05"]}, {"id": "A-07", "title": "Audit a given config fast", "cmds": ["RtrA# show running-config | include password|secret", "RtrA# show running-config | section line vty", "RtrA# show running-config | include http|cdp|snmp|small", "RtrA# show ip interface brief", "SwA# show port-security", "SwA# show vlan brief", "SwA# show interfaces trunk", "SwA# show interfaces switchport", "RtrA# show access-lists", "RtrA# show ip ssh", "RtrA# show ip route", "RtrA# ping 10.2.20.1 source 10.1.20.1", "RtrA# show users"], "why": "The common config faults are nearly always visible in these outputs: plaintext passwords, VTY lines without login local or SSH, services still on, unused ports up, VLAN 1 in use, a trunk on native VLAN 1 or missing a VLAN, and a missing route. The ping to 10.2.20.1, the Site B Teachers gateway, sourced from the Site A Teachers gateway, proves both sites route to each other's Teachers subnet.", "task": "show only the VTY line section of the running config", "t": "show running-config | section line vty", "ta": ["show run | section line vty", "show run | section vty", "show running-config | section vty"]}, {"id": "A-08", "title": "Router-on-a-stick with a native subinterface", "cmds": ["RtrA(config)# interface gigabitEthernet 0/0.10", "RtrA(config-subif)# encapsulation dot1Q 10", "RtrA(config-subif)# ip address 10.1.10.1 255.255.255.0", "RtrA(config-subif)# interface gigabitEthernet 0/0.20", "RtrA(config-subif)# encapsulation dot1Q 20", "RtrA(config-subif)# ip address 10.1.20.1 255.255.255.0", "RtrA(config-subif)# interface gigabitEthernet 0/0.30", "RtrA(config-subif)# encapsulation dot1Q 30", "RtrA(config-subif)# ip address 10.1.30.1 255.255.255.0", "RtrA(config-subif)# interface gigabitEthernet 0/0.99", "RtrA(config-subif)# encapsulation dot1Q 99 native", "RtrA(config-subif)# interface gigabitEthernet 0/0", "RtrA(config-if)# no shutdown", "RtrA(config-if)# end", "RtrA# show ip interface brief"], "why": "One trunk carries Students, Teachers, and Principals to the router. Each subinterface takes one tag and becomes that VLAN's gateway (.1), so the three VLANs route to each other through RtrA. encapsulation dot1Q 99 native matches the switch's native VLAN 99, so untagged frames land on a subinterface that carries no IP and no hosts.", "note": "Subinterfaces follow the physical port, so no shutdown goes on G0/0 itself, and G0/0 stays without an IP address. The switch end is the trunk from Watchman I-05. On an ISR 4000 running IOS XE the port is GigabitEthernet0/0/0; the subinterface commands are the same.", "task": "tag the current subinterface for VLAN 10 (subinterface command)", "t": "encapsulation dot1q 10", "ta": ["encap dot1q 10", "enc dot1q 10"], "area": "config", "ex": ["I-05"]}, {"id": "A-09", "title": "Host route to 8.8.8.8, shared through OSPF (concept)", "cmds": ["RtrA(config)# ip route 8.8.8.8 255.255.255.255 203.0.113.1", "RtrA(config)# router ospf 1", "RtrA(config-router)# network 10.0.0.0 0.0.0.3 area 0", "RtrA(config-router)# network 10.1.0.0 0.0.255.255 area 0", "RtrA(config-router)# passive-interface default", "RtrA(config-router)# no passive-interface gigabitEthernet 0/2", "RtrA(config-router)# redistribute static subnets", "RtrA(config-router)# end", "RtrA# show ip route 8.8.8.8", "RtrA# show ip route ospf"], "why": "The /32 host route sends only 8.8.8.8 to this site's ISP. redistribute static subnets shares it with RtrB as an OSPF external route (O E2, metric 20). Each router prefers its own static route (administrative distance 1) over its neighbor's O E2 copy (110), so the neighbor's route takes over when the local uplink fails. On classic IOS the subnets keyword is what lets a /32 through; without it, IOS redistributes classful networks only. passive-interface keeps OSPF hellos off the user VLANs and still advertises their subnets; only the inter-site link G0/2 forms a neighbor.", "note": "OSPF stays at concept level here. show ip route 8.8.8.8 on RtrA reports Known via \"static\", distance 1, metric 0; with RtrA's uplink down it reports Known via \"ospf 1\", distance 110, metric 20, type extern 2, with the last update from 10.0.0.2. In the full show ip route table the same entries read S 8.8.8.8 [1/0] via 203.0.113.1 and O E2 8.8.8.8 [110/20] via 10.0.0.2, under the header 8.0.0.0/32 is subnetted, 1 subnets. RtrB runs the same commands with 198.51.100.1 and 10.2.0.0. IOS XE 16 and later adds subnets automatically.", "task": "send traffic for 8.8.8.8 alone (a host route) to the Site A ISP at 203.0.113.1", "t": "ip route 8.8.8.8 255.255.255.255 203.0.113.1", "area": "config"}]}], "spot": [{"lvl": 0, "ask": "Lines from show running-config. Tap the finding.", "lines": ["hostname RtrA", "enable password cisco123", "service password-encryption", "banner motd ^CUnauthorized access prohibited^C"], "finding": 1, "why": "enable password is reversible Type 7 at best. Replace it with enable secret."}, {"lvl": 0, "ask": "The vty section of show running-config. Tap the finding.", "lines": ["line vty 0 4", " password Vty-2026!", " no login", " exec-timeout 5 0"], "finding": 2, "why": "no login means the line skips the password check entirely. Set login (or login local)."}, {"lvl": 1, "ask": "The vty section of show running-config. Tap the finding.", "lines": ["line vty 0 4", " login local", " transport input telnet ssh", " exec-timeout 5 0"], "finding": 2, "why": "Telnet is still allowed. transport input ssh removes the cleartext path."}, {"lvl": 1, "ask": "Global config lines. Tap the finding.", "lines": ["ip ssh version 2", "ip http server", "no cdp run", "login block-for 120 attempts 3 within 60"], "finding": 1, "why": "The HTTP management server is on. no ip http server (and no ip http secure-server unless required)."}, {"lvl": 1, "ask": "Output of show ip interface brief on a switch where only Fa0/1 to Fa0/4 are in use. Tap the finding.", "lines": ["Interface              IP-Address      OK? Method Status                Protocol", "FastEthernet0/1        unassigned      YES unset  up                    up", "FastEthernet0/4        unassigned      YES unset  up                    up", "FastEthernet0/12       unassigned      YES unset  up                    up", "FastEthernet0/24       unassigned      YES unset  administratively down down"], "finding": 3, "why": "An unused port that is up is an open door. Shut it and park it in VLAN 999 (PARKING)."}, {"lvl": 2, "ask": "Global config lines. Tap the finding.", "lines": ["snmp-server community public RW", "service tcp-keepalives-in", "no ip source-route", "ntp server 10.1.20.50"], "finding": 0, "why": "A public read-write community string lets anyone rewrite the config. Remove i   else if(q.type==='judge'){ok=['fix','breaks','check'][pick]===q.answer;text=q.why;}
  else if(q.type==='type'){const g=norm(given);const acc=[q.item.t].concat(q.item.ta||[]).map(norm);ok=acc.includes(g);text=(ok?'':'Answer: '+q.item.t+'. ')+learnWhy(q.item);}
  if(ok){Q.correct++;if(q.item){S.drilled[q.item.id]=(S.drilled[q.item.id]||0)+1;save();}}
  Q.fb={ok,text,pick,given:given||''};
}
function finishQuiz(){const pct=Math.round(100*Q.correct/Q.qs.length);S.best[Q.li]=Math.max(S.best[Q.li]||0,pct);save();Q.finished=true;const b=badge(Q.li);const L=APP.levels[Q.li];
  return '<div class="result"><div class="big">'+pct+'%</div><p>'+Q.correct+' of '+Q.qs.length+' right. '+(b.earned?'The '+esc(L.name)+' badge is yours: '+L.badge:(pct>=80?'Score is there; learn '+(Math.ceil(L.items.length*.8)-b.learned)+' more items for the badge.':'Reread the misses in Learn and run it again.'))+'</p><div class="nav"><button class="btn primary" data-act="startq">Run it again</button><button class="btn" data-mode-go="learn">Back to Learn</button></div></div>';}
/* run */
let tick=null;const OPEN=new Set();
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function renderRun(){
  const R=S.run;const items=allItems.filter(i=>i.li===S.level||(R.lower&&i.li<S.level));
  const remain=Math.max(0,R.mins*60-R.elapsed);
  const rows=items.map(i=>'<div class="chk '+(R.done[i.id]!=null?'done':'')+'"><input type="checkbox" data-done="'+i.id+'" '+(R.done[i.id]!=null?'checked':'')+' aria-label="Done: '+esc(i.title)+'"><div><div class="t"><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span>'+(R.done[i.id]!=null?'<span class="stamp">'+fmt(R.done[i.id])+'</span>':'')+'<button class="btn small" data-show="'+i.id+'">Commands</button></div><div id="show-'+i.id+'"'+(OPEN.has(i.id)?'':' hidden')+'>'+termBlock(i.cmds,true)+'</div><input class="note" data-note="'+i.id+'" placeholder="Change log: what you changed and why" value="'+esc(R.notes[i.id]||'')+'"></div></div>').join('');
  return '<h2>Run the checklist on your VM</h2><p class="lead">Set the clock, work the list top to bottom, tick each item when it is actually done on the machine, and write a one-line change log. The log is what lets you undo a change that broke something in thirty seconds.</p>'
   +'<div class="timer"><div class="clock" aria-live="off">'+fmt(remain)+'</div><select data-mins>'+[20,45,60,90,120].map(m=>'<option value="'+m+'" '+(m===R.mins?'selected':'')+'>'+m+' min</option>').join('')+'</select><button class="btn primary" data-act="timer">'+(tick?'Pause':'Start')+'</button><button class="btn" data-act="resetclock">Reset clock</button><label class="toggle"><input type="checkbox" data-lower '+(R.lower?'checked':'')+'> include lower levels</label></div>'
   +'<div class="nav" style="margin:0 0 10px"><button class="btn small" data-act="copylog">Copy change log</button><button class="btn small" data-act="dlog">Download change log</button><button class="btn small" data-act="clearrun">Clear this run</button></div>'
   +rows;
}
function changeLog(){const R=S.run;const lines=allItems.filter(i=>R.done[i.id]!=null||R.notes[i.id]).sort((a,b)=>(R.done[a.id]??1e9)-(R.done[b.id]??1e9)).map(i=>'['+(R.done[i.id]!=null?fmt(R.done[i.id]):'--:--')+'] '+i.id+' '+i.title+(R.notes[i.id]?' -- '+R.notes[i.id]:''));
  return '# Change log - '+APP.os+' - '+new Date().toLocaleString()+'\n'+(lines.join('\n')||'(nothing logged yet)')+'\n';}
function startTimer(){if(tick)return;tick=setInterval(()=>{S.run.elapsed++;if(S.run.elapsed%5===0)save();const c=document.querySelector('.clock');if(c)c.textContent=fmt(Math.max(0,S.run.mins*60-S.run.elapsed));if(S.run.elapsed>=S.run.mins*60){stopTimer();render();}},1000);}
function stopTimer(){clearInterval(tick);tick=null;save();}
/* games */
let G={tab:'imposter',sc:0,picks:{},checked:false,jq:null,streak:0,jfb:null};
function renderGames(){
  const tabs='<div class="tabs"><button class="btn '+(G.tab==='imposter'?'primary':'')+'" data-gtab="imposter">Who is the imposter?</button><button class="btn '+(G.tab==='judge'?'primary':'')+'" data-gtab="judge">Fix or break?</button></div>';
  if(G.tab==='imposter'){const sc=APP.imposter[G.sc];
    const rows=sc.accounts.map((a,i)=>{const p=G.picks[i]||'keep';const cls=G.checked?(p===a.truth?'ok':'bad'):'';return '<div class="acct '+cls+'"><div class="n">'+esc(a.name)+'<small>'+esc(a.info)+'</small></div><div class="seg">'+['keep','remove'].concat(a.admin?['demote']:[]).map(k=>'<button data-pick="'+i+'" data-val="'+k+'" class="'+(p===k?'on':'')+'" '+(G.checked?'disabled':'')+'>'+({keep:'Keep',remove:'Remove',demote:'Demote'})[k]+'</button>').join('')+'</div></div>'+(G.checked&&p!==a.truth?'<div class="fb bad">'+esc(a.why)+'</div>':'');}).join('');
    const right=G.checked?sc.accounts.filter((a,i)=>(G.picks[i]||'keep')===a.truth).length:0;
    return tabs+'<h2>'+esc(sc.title)+'</h2><p class="lead">Read the scenario brief, then decide for every account: keep it, remove it, or demote it from admin. The brief is the documented source of truth; when it is unclear, ask the system owner before you delete anything.</p><div class="brief"><b>Scenario brief</b><ul>'+sc.brief.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>'+termBlock(sc.output,false)+rows
      +(G.checked?'<div class="fb '+(right===sc.accounts.length?'ok':'bad')+'" style="max-width:720px">'+right+' of '+sc.accounts.length+' correct. '+esc(sc.debrief)+'</div>':'')+'<div class="nav"><button class="btn primary" data-act="'+(G.checked?'nextsc':'checksc')+'">'+(G.checked?'Next scenario':'Check my calls')+'</button></div>';
  }
  if(!G.jq){G.jq=shuffle(APP.judge.slice());}const j=G.jq[0];
  const fb=G.jfb?'<div class="fb '+(G.jfb.ok?'ok':'bad')+'"><b>'+(G.jfb.ok?'Right.':'Not this time.')+'</b> '+esc(j.why)+'</div><button class="btn primary" data-act="jnext">Next</button>':'';
  return tabs+'<div class="q"><div class="streak">streak '+G.streak+'</div><h2>Fix or break?</h2><div class="brief"><b>Scenario brief says:</b> '+esc(j.brief)+'</div><p><b>You do this:</b> '+esc(j.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-jopt="'+k+'" class="'+(G.jfb?(k===j.answer?'ok':(G.jfb.pick===k?'bad':'')):'')+'" '+(G.jfb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>'+fb+'</div>';
}
/* report */
function renderReport(){
  const lv=APP.levels.map((L,i)=>{const b=badge(i);return '<div class="lv"><div class="row"><span>'+(b.earned?L.badge+' ':'')+esc(L.name)+'</span><span class="mono">'+b.learned+'/'+b.total+' learned · best '+(b.best||0)+'%</span></div><div class="bar2 '+(b.earned?'earned':'')+'"><i style="width:'+Math.round(100*b.learned/b.total)+'%"></i></div></div>';}).join('');
  const rows=allItems.map(i=>{const st=status(i);const g={mastered:'✓',learned:'◐',drilled:'◔',none:'·'}[st];return '<div class="rr '+st+'" data-rr="'+i.id+'"><span class="g">'+g+'</span><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span><span class="pt">'+itemScore(i)+'</span></div>';}).join('');
  return '<h2>Progress report</h2>'+lv+'<p style="font-size:.8rem;color:var(--muted)">✓ learned and drilled · ◐ learned · ◔ drilled only</p>'+rows+'<div class="total"><span>Total</span><span>'+score()+' / '+maxScore+'</span></div>';
}
function renderFoot(){$('#foot').innerHTML=esc(APP.footer||'Training tool for virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist.')+' <button data-act="reset">Reset my progress</button>';}
function render(){
  if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches)S.mode='learn';
  renderHeader();
  const v=$('#view');const m=S.mode;
  v.innerHTML=m==='learn'?renderLearn():m==='drill'?renderDrill():m==='run'?renderRun():m==='games'?renderGames():'';
  $('#report').innerHTML=renderReport();renderFoot();
  if(m==='drill'&&Q&&!Q.finished&&!Q.fb){const t=v.querySelector('.typein');if(t)t.focus();}
  if(m==='learn'){const on=v.querySelector('.list button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
}
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.level!=null){S.level=+d.level;if(S.mode==='drill'&&Q&&Q.li!==S.level)Q=null;save();render();return;}
  if(d.mode){S.mode=d.mode;save();render();return;}
  if(d.modeGo){S.mode=d.modeGo;save();render();return;}
  if(d.sel){S.sel[S.level]=d.sel;save();render();return;}
  if(d.step){const L=APP.levels[S.level];const cur=S.sel[S.level]||L.items[0].id;const i=L.items.findIndex(x=>x.id===cur)+(+d.step);if(L.items[i]){S.sel[S.level]=L.items[i].id;save();render();}return;}
  if(d.act==='copy'){const term=b.closest('.term');const lines=[...term.querySelectorAll('.ln:not(.c)')].map(n=>n.textContent.replace(PRE,'')).filter(l=>l.trim()).join('\n');copyText(lines,b);return;}
  if(d.act==='startq'){Q=makeQuiz(S.level);render();return;}
  if(d.opt!=null&&S.mode==='drill'&&Q&&!Q.fb){answer(+d.opt);render();return;}
  if(d.act==='check'){const t=$('.typein');answer(null,t?t.value:'');render();return;}
  if(d.act==='skip'){answer(null,'');render();return;}
  if(d.act==='next'){if(Q.i===Q.qs.length-1){$('#view').innerHTML=finishQuiz();renderHeader();$('#report').innerHTML=renderReport();}else{Q.i++;Q.fb=null;render();}return;}
  if(d.act==='timer'){tick?stopTimer():startTimer();render();return;}
  if(d.act==='resetclock'){stopTimer();S.run.elapsed=0;save();render();return;}
  if(d.act==='clearrun'){if(confirm('Clear all ticks, timestamps and notes for this run?')){stopTimer();S.run.done={};S.run.notes={};S.run.elapsed=0;save();render();}return;}
  if(d.act==='copylog'){copyText(changeLog(),b);return;}
  if(d.act==='dlog'){const blob=new Blob([changeLog()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='change-log-'+APP.key+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}
  if(d.show){const el=document.getElementById('show-'+d.show);if(el){el.hidden=!el.hidden;if(el.hidden)OPEN.delete(d.show);else OPEN.add(d.show);}return;}
  if(d.gtab){G.tab=d.gtab;G.jfb=null;render();return;}
  if(d.pick!=null&&!G.checked){G.picks[d.pick]=d.val;render();return;}
  if(d.act==='checksc'){G.checked=true;render();return;}
  if(d.act==='nextsc'){G.sc=(G.sc+1)%APP.imposter.length;G.picks={};G.checked=false;render();return;}
  if(d.jopt&&!G.jfb){const j=G.jq[0];const ok=d.jopt===j.answer;G.streak=ok?G.streak+1:0;G.jfb={ok,pick:d.jopt};render();return;}
  if(d.act==='jnext'){G.jq.push(G.jq.shift());G.jfb=null;render();return;}
  if(d.act==='reset'){if(confirm('Erase all progress for this trainer on this browser?')){stopTimer();S=defaults();save();Q=null;render();}return;}
  if(b.id==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();renderHeader();return;}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.learn){const was=status(byId[d.learn]);S.learned[d.learn]=e.target.checked;if(!e.target.checked)delete S.learned[d.learn];save();render();const now=status(byId[d.learn]);if(now==='mastered'&&was!=='mastered'){const r=document.querySelector('[data-rr="'+d.learn+'"]');if(r)r.classList.add('flip');}return;}
  if(d.done){if(e.target.checked)S.run.done[d.done]=S.run.elapsed;else delete S.run.done[d.done];save();render();return;}
  if(d.mins!=null){S.run.mins=+e.target.value;S.run.elapsed=0;save();render();return;}
  if(d.lower!=null){S.run.lower=e.target.checked;save();render();return;}
});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.explain){S.explain[d.explain]=e.target.value;save();return;}
  if(d.note){S.run.notes[d.note]=e.target.value;save();return;}
});
window.addEventListener('resize',()=>{if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches){S.mode='learn';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('typein')&&Q&&!Q.fb){answer(null,e.target.value);render();}});
render();
})();
</script>
