const APP = {"key": "windows11", "os": "Windows 11 26H2 (Pro / Enterprise)", "accent": "#1F4FD8", "footer": "Training tool for Windows 11 virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial practice; not affiliated with or endorsed by Microsoft.", "legend": "PS> runs in an elevated PowerShell and CMD> in an elevated Command Prompt. Type what follows the prefix, and replace each <name> with a real value. GUI: lines walk through a window, and indented lines show values to set or read.", "levels": [{"name": "Doorman", "badge": "🚪", "blurb": "Lock the doors. These are the fixes that are safe on almost any machine and close the most common gaps: users, admins, passwords, firewall, updates, Defender, and unapproved software. Learn it first: Defense Ladder s2, \"Windows 11 hardening.\"", "items": [{"id": "B-00", "title": "Scenario brief and evidence first", "cmds": ["GUI: open the scenario brief (the documented requirements for this machine) and write down authorized users, admins, required services, and anything forbidden", "CMD> dsregcmd /status   (AzureAdJoined and DomainJoined show who else can push settings to this PC)"], "why": "Removing a user, role, or service the business needs is an availability failure. Read the brief, then answer the investigation questions before any change (Defense Ladder f1).", "note": "Unfamiliar software is distinct from unauthorized software: trace it, and ask the owner before removing an agent (Defense Ladder s1).", "task": "", "t": "", "area": "inv"}, {"id": "B-01", "title": "List local users", "cmds": ["PS> Get-LocalUser | Select-Object Name,Enabled,PasswordRequired,LastLogon", "CMD> net user", "PS> Get-Command *LocalUser*   (finds the account cmdlets this item uses)", "PS> Get-LocalUser | Get-Member   (lists every property you can select, such as Enabled)", "PS> Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion' | Select-Object EditionID,CurrentBuild", "GUI: Win+R, lusrmgr.msc (not available on Home)"], "why": "Unauthorized accounts are backdoors: compare the list to the brief's authorized users. Set and require passwords on enabled, authorized accounts: net user <name> * /passwordreq:yes.", "note": "PasswordRequired False only permits blank passwords; Windows Setup accounts often show False with a password set. Confirm passwords in Control Panel, User Accounts, Manage another account: look for Password protected.", "also": "EditionID Core means Home; ProductName can still say Windows 10. Home leaves out lusrmgr.msc and secpol.msc: use Settings, Accounts, Other users, or netplwiz.", "task": "list local users (cmd)", "t": "net user", "ta": ["get-localuser"], "area": "acct"}, {"id": "B-02", "title": "Remove an unauthorized user", "cmds": ["PS> Get-ScheduledTask | Where-Object { $_.Principal.UserId -like '*baduser' } | Select-Object TaskPath,TaskName", "PS> Get-CimInstance Win32_Service | Where-Object StartName -like '*baduser' | Select-Object Name,StartName,PathName", "PS> Remove-LocalUser -Name \"baduser\"", "CMD> net user baduser /delete", "CMD> net user baduser /active:no", "PS> Disable-LocalUser -Name \"baduser\"", "PS> Enable-LocalUser -Name keola   (undo a disable once the brief confirms the account belongs)"], "why": "Deleting removes the login path and the profile's persistence hooks. Remove only accounts the brief leaves out; when the brief is unclear, disable first (/active:no) and ask the owner.", "note": "Answer every investigation question that names the account. Handle each scheduled task or service running as that account; the first two commands find them.", "also": "Deleting keeps C:\\Users\\baduser: search it for evidence before removing the folder.", "task": "delete the local user baduser (cmd)", "t": "net user baduser /delete", "ta": ["remove-localuser -name baduser", "remove-localuser baduser"], "area": "acct"}, {"id": "B-03", "title": "Audit the Administrators group", "cmds": ["PS> Get-LocalGroupMember -Group Administrators", "PS> Get-Help Get-LocalGroupMember -Examples   (worked examples; run Update-Help once, online, for the full text)", "CMD> net localgroup Administrators", "CMD> net localgroup \"Backup Operators\"", "CMD> net localgroup Administrators baduser /delete", "PS> Remove-LocalGroupMember -Group Administrators -Member baduser", "CMD> net localgroup Administrators alice /add"], "why": "An admin can switch off every other control. Least privilege is the single highest-value idea in system hardening. Demote users the brief calls standard; promote only its listed admins.", "note": "A signed-in demoted user keeps admin rights until signing out: Task Manager, Users, Sign out.", "also": "Backup Operators, Remote Desktop Users, and Remote Management Users also grant power where they exist; compare each with the brief (Get-LocalGroup lists every group).", "task": "show who is in the Administrators group (cmd)", "t": "net localgroup Administrators", "ta": ["get-localgroupmember administrators", "get-localgroupmember -group administrators"], "area": "acct"}, {"id": "B-04", "title": "Disable Guest and the built-in Administrator", "cmds": ["PS> Get-LocalUser | Where-Object { $_.SID -like '*-50[01]' } | Select-Object Name,Enabled,SID", "CMD> whoami /user", "CMD> net user Guest /active:no", "PS> Disable-LocalUser -Name Guest", "CMD> net user Administrator /active:no"], "why": "Attackers brute-force well-known accounts by name, and Guest allows anonymous-style access. The built-in Administrator's SID ends in -500 and Guest's in -501, so a SID match finds both despite renames.", "note": "If the brief says you sign in as Administrator, keep it enabled with a strong password. If whoami /user ends in -500, this session is that account.", "also": "Rename only when the brief or policy asks, and last (Rename-LocalUser -Name Administrator -NewName <new name>). The SID stays, so disabling and a strong password carry the protection.", "task": "disable the Guest account", "t": "net user Guest /active:no", "area": "acct"}, {"id": "B-05", "title": "Strong passwords for every user", "cmds": ["PS> Get-LocalUser | Select-Object Name,Enabled,PasswordLastSet,PasswordExpires", "CMD> net user alice *", "PS> Get-LocalUser | Where-Object { $_.Enabled -and $_.Name -ne $env:USERNAME } | Set-LocalUser -PasswordNeverExpires $false", "CMD> net user alice /logonpasswordchg:yes"], "why": "Weak, shared, or blank passwords are the top way in. Password never expires defeats the aging policy: clear it first, then ask for a change at next logon. The * makes net user prompt, hiding the password from screen and history.", "note": "Set the password policy first (B-06, B-07) so each new password must meet it. Give the account a fresh password before clearing Password never expires: clearing it on an old password expires it at once, and a service or task that signs in with it needs the new one too. Change your own sign-in password only when the brief says so. An administrator reset locks the user out of files they encrypted and of saved passwords. Record every changed password somewhere safe (on paper, in a lab).", "task": "force alice to change the account's password at next logon", "t": "net user alice /logonpasswordchg:yes", "area": "acct"}, {"id": "B-06", "title": "Password policy", "cmds": ["CMD> net accounts /minpwlen:12 /maxpwage:60 /minpwage:1 /uniquepw:24", "CMD> net accounts"], "gui": "secpol.msc, Account Policies, Password Policy. Turn on 'Password must meet complexity requirements' and keep 'Store passwords using reversible encryption' off.", "why": "Length matters most. A minimum age keeps users from cycling through the 24-password history. Reversible encryption is disguised plaintext; turning it off protects only new passwords, so reset older ones.", "note": "The brief overrides these samples. The CIS Benchmark recommends 14+ characters, a 24-password history, a 1–365-day maximum age, and a 1-day minimum. net accounts stops at 14 and skips complexity.", "also": "Past 14, enable Relax minimum password length limits under Password Policy (secpol.msc or secedit), then set the length. Set secedit's PasswordComplexity = 1 on any edition, Home included (Hunter A-01).", "task": "set min password length 12, max age 60, min age 1, history 24 (cmd)", "t": "net accounts /minpwlen:12 /maxpwage:60 /minpwage:1 /uniquepw:24", "area": "acct"}, {"id": "B-07", "title": "Account lockout policy", "cmds": ["CMD> net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30"], "why": "Turns an online brute force from thousands of guesses a minute into five per half hour. The scenario brief sets the numbers; that rate reflects one sample brief.", "note": "The CIS Benchmark recommends a duration and reset window of 15 minutes or more. Its threshold is 5 or fewer and above 0 (0 never locks, which is a finding).", "also": "The built-in Administrator locks only with Allow Administrator account lockout Enabled (secedit template: AllowAdministratorLockout = 1, Hunter A-01), and only for network sign-ins like Remote Desktop. Console sign-in stays available.", "task": "lock accounts after 5 bad tries for 30 minutes (cmd)", "t": "net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30", "area": "acct"}, {"id": "B-08", "title": "Firewall on for all profiles", "cmds": ["PS> Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True", "PS> Get-NetFirewallProfile -PolicyStore ActiveStore | Select-Object Name,Enabled,DefaultInboundAction", "CMD> netsh advfirewall set allprofiles state on", "CMD> netsh advfirewall show allprofiles"], "gui": "Settings, Privacy and security, Windows Security, Firewall and network protection.", "why": "Default-deny inbound covers the service you have not found yet. Misconfigured machines often have exactly one profile off, usually Public.", "note": "DefaultInboundAction should be Block. ActiveStore shows values in force, Group Policy included; the plain view reads NotConfigured for values left at default (Block inbound). Watchman covers allow rules.", "task": "turn the firewall on for every profile (cmd)", "t": "netsh advfirewall set allprofiles state on", "ta": ["set-netfirewallprofile -profile domain,public,private -enabled true", "set-netfirewallprofile -all -enabled true"], "area": "config"}, {"id": "B-09", "title": "Windows Update: run it and automate it", "cmds": ["GUI: Win+R, ms-settings:windowsupdate (Settings, Windows Update): Resume updates if paused, then Check for updates; Advanced options: receive updates for other Microsoft products", "PS> Get-Service wuauserv,BITS,UsoSvc | Select-Object Name,Status,StartType", "PS> Set-Service -Name wuauserv -StartupType Automatic; Start-Service wuauserv", "CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate /s", "PS> Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 5", "PS> winget upgrade", "PS> winget upgrade --all --silent --accept-package-agreements --accept-source-agreements", "CMD> shutdown /r /t 0   (restart to finish installing updates, after you save your work)"], "why": "Patching closes the holes scanners find. Confirm Get-HotFix shows a recent install date and automatic updates stay on; I-18 covers policy values that stop them while the service runs.", "note": "Run updates first in the background; recheck after each restart until up to date. wuauserv ships as Manual (starts on demand); Disabled is the finding. Save work before any reboot.", "also": "Windows Update patches Windows and Microsoft apps; browsers and others use winget or their own updater. Remove prohibited apps (B-11) before winget upgrade --all, so it updates only what stays.", "area": "patch"}, {"id": "B-10", "title": "Defender: real-time on, definitions current, scan", "cmds": ["PS> Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated", "PS> Set-MpPreference -DisableRealtimeMonitoring $false", "PS> Update-MpSignature", "PS> Start-MpScan -ScanType QuickScan", "PS> Start-MpScan -ScanType CustomScan -ScanPath C:\\Users", "PS> Get-MpThreatDetection | Select-Object InitialDetectionTime,ProcessName,Resources"], "gui": "Win+R, windowsdefender: (Windows Security), Virus and threat protection, Manage settings: Real-time protection and Tamper Protection On.", "why": "Real-time protection is the baseline malware control. Neglected or compromised machines have it off, or carry exclusions that hide malware. Get-MpComputerStatus confirms RealTimeProtectionEnabled is True.", "note": "Answer the investigation questions before any scan, because a scan can quarantine the file a question asks about. If Tamper Protection blocks Set-MpPreference, switch real-time protection on in the GUI.", "also": "In Get-MpThreatDetection, Resources names each detected file: record that path. Then remove the program that dropped the file when the brief leaves that program out.", "task": "update Defender signatures", "t": "Update-MpSignature", "area": "malware"}, {"id": "B-11", "title": "Remove unapproved software", "cmds": ["PS> Get-ItemProperty HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*, HKLM:\\Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*, Registry::HKEY_USERS\\*\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\* -ErrorAction SilentlyContinue | Select-Object DisplayName,DisplayVersion,Publisher,UninstallString | Sort-Object DisplayName", "GUI: Settings, Apps, Installed apps (or appwiz.cpl)", "PS> winget list", "PS> winget uninstall --id WiresharkFoundation.Wireshark --exact", "PS> Get-AppxPackage -AllUsers | Select-Object Name | Sort-Object Name", "PS> Get-AppxPackage -AllUsers *xbox* | Remove-AppxPackage -AllUsers"], "why": "Hacking tools, games, torrent clients, and remote-access tools are acceptable-use violations and attack surface.", "note": "Software the brief requires stays. The registry listing is instant; Win32_Product is slow and can trigger repairs. Store apps need Get-AppxPackage instead; portable tools need a file search (B-12, A-06).", "also": "HKEY_USERS adds signed-in users' own apps. Remove Npcap, a separate capture-tool install, when the brief omits packet capture. After removing remote-access tools, seek leftover services (I-04) and firewall rules (I-12).", "area": "software"}, {"id": "B-12", "title": "Find unapproved media and loose executables", "cmds": ["PS> Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.mp3,*.mp4,*.wav,*.avi,*.mkv,*.flac,*.mov,*.m4a,*.mpg,*.mpeg,*.ogg,*.flv,*.wma,*.aac -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\|^C:\\\\Users\\\\(All Users|Default User)\\\\' | Select-Object FullName", "CMD> dir /s /a /b C:\\Users\\*.mp3 C:\\Users\\*.mp4", "CMD> del /s /a C:\\Users\\*.mp3 C:\\Users\\*.mp4   (after dir /s /a /b lists the same files and the brief bans them; del also reaches AppData, where apps keep their own sounds, so check that list for AppData paths first)", "CMD> rd /s /q \"C:\\Users\\<user>\\Music\\<folder>\"   (a folder of banned files, after dir lists it: rd removes the folder and everything in it)", "PS> Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.mp3,*.mp4 -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\' | Remove-Item -Force   (after the list above is reviewed and any file a question names is hashed)", "PS> Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.exe,*.bat,*.cmd,*.ps1,*.vbs,*.hta,*.py,*.jar,*.zip,*.7z,*.rar -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\Local\\\\(Microsoft|Packages)\\\\|^C:\\\\Users\\\\(All Users|Default User)\\\\' | Select-Object FullName,LastWriteTime", "PS> Get-Item 'C:\\Users\\<user>\\Downloads\\<file>' -Stream * | Select-Object Stream,Length", "PS> Get-Content 'C:\\Users\\<user>\\Downloads\\<file>' -Stream Zone.Identifier   (ZoneId=3 marks a file downloaded from the internet)", "PS> Unblock-File -Path 'C:\\Users\\<user>\\Downloads\\<file>'   (only for an expected file from a trusted source: it removes the downloaded-from-the-internet mark)", "CMD> tar -tf \"C:\\Users\\<user>\\Downloads\\<archive>.zip\""], "why": "Many acceptable-use policies ban personal media on work machines, and scripts sitting in user folders are often the planted backdoor. Confirm each file against the brief before deleting.", "note": "First answer every investigation question naming a file and record its hash (B-14); then delete it and log the path. tar -tf lists a .zip's contents before you delete it.", "also": "Search C:\\ too, beyond C:\\Users. -Force shows hidden files; the filters skip AppData caches and the All Users and Default User links. Keep Python and other runtimes the brief needs.", "area": "data"}, {"id": "B-13", "title": "Stop obviously unsafe services", "cmds": ["PS> Get-Service -Name ftpsvc,TermService,RemoteRegistry,SNMP -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType", "PS> Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server' -Name fDenyTSConnections -Value 1", "PS> Get-NetFirewallRule -Group '@FirewallAPI.dll,-28752' -ErrorAction SilentlyContinue | Disable-NetFirewallRule", "CMD> reg query \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\" /v fDenyTSConnections", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Remote Assistance' -Name fAllowToGetHelp -Value 0", "GUI: Win+R, SystemPropertiesRemote: clear Allow Remote Assistance connections to this computer when the brief rules out remote help", "PS> Get-NetFirewallRule -Group '@FirewallAPI.dll,-33002' -ErrorAction SilentlyContinue | Disable-NetFirewallRule", "PS> Get-NetTCPConnection -State Listen -LocalPort 21,3389 -ErrorAction SilentlyContinue"], "why": "Telnet and FTP send cleartext credentials; Remote Registry accepts network edits. RDP draws brute force; Remote Assistance, allowed by default on Windows 11, hands an invited helper the desktop.", "note": "If the brief requires RDP, FTP, or SSH, harden it (I-11) rather than stop it. Turning Remote Desktop off takes the setting plus its firewall group. The @FirewallAPI names work in any display language. Home lacks the Remote Desktop group, so that line returns quietly there. fDenyTSConnections under the Terminal Services policy key is Group Policy and beats the Settings switch. A value of 0 there forces Remote Desktop back on, so a missing-value error is the good result. The last line returns empty once FTP and Remote Desktop stop listening.", "task": "stop Remote Registry and disable its startup", "t": "Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "gui": "Settings, System, Remote Desktop: Off unless the brief requires it. services.msc for the rest: set Startup type to Disabled.", "area": "config"}, {"id": "B-14", "title": "Hash a file for an investigation question", "cmds": ["PS> Get-FileHash -LiteralPath 'C:\\Users\\<user>\\Desktop\\<file>' -Algorithm SHA256 | Format-List", "CMD> certutil -hashfile \"C:\\Users\\<user>\\Desktop\\<file>\" SHA256", "PS> Format-Hex -Path 'C:\\Users\\<user>\\Desktop\\<file>' | Select-Object -First 1   (the first bytes name the real type: 4D 5A is an .exe, 25 50 44 46 is a PDF; PowerShell 7 adds -Count 8)", "PS> Get-MpThreatDetection | Select-Object InitialDetectionTime,Resources"], "why": "Answer with the named algorithm's exact hex string, which repeats on every run. Hash before any Defender scan, cleanup, or move: changed or quarantined, the file answers differently or vanishes.", "note": "Check each hash's length: MD5 32 hex characters, SHA1 40, SHA256 64. certutil defaults to SHA1, so name the algorithm. -LiteralPath reads names with [ ] that -Path skips.", "also": "Quotes keep paths with spaces whole. If opening the file reports a virus, Defender already quarantined it: Get-MpThreatDetection and Windows Security, Protection history show the path and time to record.", "task": "print the SHA256 hash of C:\\Users\\Public\\notes.txt", "t": "Get-FileHash -Algorithm SHA256 C:\\Users\\Public\\notes.txt", "ta": ["get-filehash c:\\users\\public\\notes.txt -algorithm sha256", "get-filehash -path c:\\users\\public\\notes.txt -algorithm sha256", "get-filehash -literalpath c:\\users\\public\\notes.txt -algorithm sha256", "certutil -hashfile c:\\users\\public\\notes.txt sha256"], "area": "inv"}, {"id": "B-15", "title": "Create the users and groups the brief lists", "cmds": ["PS> New-LocalUser -Name 'kekoa' -Password (Read-Host -AsSecureString 'Password')", "CMD> net user kekoa * /add", "PS> New-LocalGroup -Name Accounting", "CMD> net localgroup Accounting /add", "CMD> net localgroup Accounting kekoa /add", "PS> Add-LocalGroupMember -Group Accounting -Member kekoa", "PS> Get-LocalGroupMember -Group Accounting"], "why": "A listed user or group missing from the machine locks someone out of sign-in and the job's files. Create exactly that set; the brief is the source of truth.", "note": "net user /add places the account in Users only; add the groups the brief names, then read the membership back. Security event 4720 records each new account.", "task": "create the local user kekoa and prompt for the password (cmd)", "t": "net user kekoa * /add", "area": "acct"}, {"id": "B-16", "title": "Find files that store passwords", "cmds": ["PS> Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.txt,*.csv,*.ini,*.xml,*.log,*.ps1,*.bat -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\Local\\\\|^C:\\\\Users\\\\(All Users|Default User)\\\\' | Select-String -Pattern 'passw(or)?d|pwd|credential' -List | Select-Object Path,LineNumber,Line", "CMD> findstr /s /i /m /c:\"password\" C:\\Users\\*.txt C:\\Users\\*.csv C:\\Users\\*.ini", "PS> Get-ChildItem -Path C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\PSReadLine\\ConsoleHost_history.txt -Force -ErrorAction SilentlyContinue | Select-String -Pattern 'net user|ConvertTo-SecureString|passw' | Select-Object Path,Line", "PS> Get-ChildItem -Path C:\\Windows\\Panther\\Unattend.xml,C:\\Windows\\Panther\\Unattend\\Unattend.xml,C:\\Windows\\System32\\Sysprep\\unattend.xml -Force -ErrorAction SilentlyContinue | Select-String -Pattern '<Password>|AdministratorPassword' | Select-Object Path,LineNumber", "CMD> cmdkey /list"], "why": "Passwords in notes, scripts, PowerShell history, or Windows Setup answer files expose accounts. Hidden answer-file passwords are only encoded: treat them as plaintext. Content search finds them under any name.", "note": "First answer any investigation question that names the file and record its hash (B-14). Then remove or move it where the brief says, and log the path.", "also": "Review each hit: license and app files match too. cmdkey /list shows only the signed-in user's saved passwords, like TERMSRV/<host> for Remote Desktop; cmdkey /delete:<target> removes one the brief omits.", "task": "list the .txt files under C:\\Users that contain the word password (cmd)", "t": "findstr /s /i /m password C:\\Users\\*.txt", "ta": ["findstr /s /i /m /c:password c:\\users\\*.txt", "findstr /i /s /m password c:\\users\\*.txt", "findstr /s /m /i password c:\\users\\*.txt"], "area": "data"}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. Policy, services, shares, scheduled tasks, startup items, hosts file, listening ports, and logs. This is where the hidden stuff lives. Learn it first: Defense Ladder j2, \"Group Policy.\"", "items": [{"id": "I-01", "title": "Audit policy: turn the lights on", "cmds": ["CMD> wevtutil sl Security /ms:201326592", "CMD> wevtutil gl Security   (maxSize shows the new limit)", "CMD> auditpol /backup /file:C:\\Windows\\Temp\\audit-before.csv", "CMD> auditpol /set /category:* /success:enable /failure:enable", "CMD> auditpol /get /category:*"], "why": "Without auditing, Event Viewer has nothing to tell you or an investigator. Logon, account management, and policy change are the key ones.", "note": "Mixing auditpol with secpol's basic Audit Policy gives unexpected results. Use auditpol here or Advanced Audit Policy Configuration in Group Policy, leave the basic node unset, and trust auditpol /get.", "also": "wevtutil grows the Security log to 192 MB first, so the extra events keep older evidence. auditpol /restore /file:C:\\Windows\\Temp\\audit-before.csv undoes the audit change. Subcategories, and trimming the noisiest, are A-08.", "task": "enable success and failure auditing for every category", "t": "auditpol /set /category:* /success:enable /failure:enable", "area": "audit"}, {"id": "I-02", "title": "Security Options in secpol.msc", "cmds": ["GUI: secpol.msc, Local Policies, Security Options", "  Accounts: Limit local account use of blank passwords to console logon only = Enabled", "  Devices: Prevent users from installing printer drivers = Enabled", "  Interactive logon: Don't display last signed-in = Enabled (older label: Do not display last user name)", "  Interactive logon: Do not require CTRL+ALT+DEL = Disabled", "  Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled", "  Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM & NTLM", "  Microsoft network client and server: Digitally sign communications (always) = Enabled", "  Shutdown: Allow system to be shut down without having to log on = Disabled", "  User Account Control: Run all administrators in Admin Approval Mode = Enabled"], "why": "Classic CIS and STIG level-one settings. Each blocks a named attack: blank-password remote logon, username harvesting, LM and NTLMv1 cracking or relay, SMB relay, shutdown before sign-in, and UAC bypass.", "note": "With Do not require CTRL+ALT+DEL Disabled, a VM takes the sequence from its window menu or shortcut (Ctrl+Alt+End in Hyper-V and Remote Desktop). Command-line forms: registry (A-02) or secedit (A-01).", "also": "Releases older than Windows 11 24H2 and Windows Server 2025 still accept NTLMv1: check the LAN Manager authentication level there and in mixed domains.", "area": "config"}, {"id": "I-03", "title": "UAC to Always notify", "cmds": ["GUI: Win+R, UserAccountControlSettings: move the slider to the top, Always notify", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name ConsentPromptBehaviorAdmin -Value 2 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name PromptOnSecureDesktop -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name FilterAdministratorToken -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name ConsentPromptBehaviorUser -Value 0 -Type DWord"], "gui": "Control Panel, User Accounts, Change User Account Control settings, slider to the top.", "why": "UAC off silently hands admin processes full rights. ConsentPromptBehaviorAdmin 2 prompts on the secure desktop for every elevation; default 5 auto-elevates Windows programs. FilterAdministratorToken 1 covers the built-in Administrator.", "note": "ConsentPromptBehaviorUser 0 refuses standard-user elevation, so admins elevate from their own sessions; keep 3 (ask for credentials) where the brief has helpdesk staff type admin passwords. Reboot after changing EnableLUA.", "also": "A Security Options UAC policy replaces the slider at the next refresh; gpresult /scope computer /v shows it. With Administrator protection on (TypeOfAdminApprovalMode 2, Version notes), ConsentPromptBehaviorEnhancedAdmin decides the prompt.", "area": "config"}, {"id": "I-04", "title": "Service audit: what runs, from where", "cmds": ["PS> Get-CimInstance Win32_Service | Select-Object Name,State,StartMode,PathName | Sort-Object Name", "PS> Get-Service | Where-Object Status -eq Running | Sort-Object DisplayName", "PS> Get-Service -Name EventLog,mpssvc,WinDefend | Select-Object Name,Status,StartType", "PS> Get-Alias sc   (in Windows PowerShell 5.1, sc runs Set-Content: type sc.exe for the service tool)", "CMD> sc.exe query state= all", "CMD> sc.exe qc <name>", "CMD> sc.exe qtriggerinfo RemoteRegistry   (events that can start a Manual service)", "CMD> sc.exe stop <name>", "CMD> sc.exe config <name> start= disabled", "CMD> sc.exe start <name>   (only a service the brief requires)", "CMD> sc.exe delete <name>   (a planted service only, after it is stopped and its file is reviewed; PowerShell 7 adds Remove-Service, and Windows PowerShell 5.1 uses sc.exe delete)", "PS> Get-ItemProperty 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\SNMP\\Parameters\\ValidCommunities' -ErrorAction SilentlyContinue", "PS> Stop-Service -Name <name>; Set-Service -Name <name> -StartupType Disabled"], "why": "Flag Telnet, FTP, SNMP, SSDP and UPnP, Remote Registry, Xbox services, odd names, and any PathName under C:\\Users or C:\\Temp (planted). SNMP on 161/udp answers whoever guesses public or private.", "note": "Required services (IIS, DNS, DHCP, OpenSSH, MySQL, Apache) stay running; harden their configs instead. Event log, firewall (mpssvc), and Defender (WinDefend) stay Running and Automatic; Stopped or Disabled on any of them is a finding, except WinDefend when the brief names another antivirus. Unlisted SNMP: Remove-WindowsCapability -Online -Name SNMP.Client~~~~0.0.1.0.", "area": "config"}, {"id": "I-05", "title": "Optional features: SMBv1, Telnet client, TFTP, IIS", "cmds": ["PS> Get-WindowsOptionalFeature -Online | Where-Object State -eq Enabled | Select-Object FeatureName", "PS> Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart", "PS> Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force", "PS> Disable-WindowsOptionalFeature -Online -FeatureName TelnetClient -NoRestart", "PS> Disable-WindowsOptionalFeature -Online -FeatureName SimpleTCP,Printing-Foundation-LPDPrintService -NoRestart", "PS> Disable-WindowsOptionalFeature -Online -FeatureName IIS-FTPServer -NoRestart"], "why": "SMBv1 is the EternalBlue and WannaCry hole; Telnet and TFTP clients send cleartext. Simple TCP/IP (echo, daytime, chargen) answers anyone and reflects traffic; LPD takes print jobs on 515.", "note": "Remove IIS and its FTP server only when the brief leaves out a web or FTP server. -NoRestart lets you batch the restart with the others.", "task": "turn SMBv1 off in the SMB server configuration", "t": "Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force", "area": "config"}, {"id": "I-06", "title": "Shares", "cmds": ["PS> Get-SmbShare", "CMD> net share", "PS> Get-SmbShare | Where-Object { $_.Name -notmatch '^(ADMIN|IPC|PRINT|FAX)\\$$' -and -not ($_.Name -match '^[A-Z]\\$$' -and $_.Path -eq ($_.Name.Substring(0,1) + ':\\')) } | Select-Object Name,Path,Description", "PS> Remove-SmbShare -Name \"badshare\" -Force", "CMD> auditpol /set /subcategory:\"File Share\" /success:enable /failure:enable"], "why": "An unexpected share is a data exfiltration path. Check the ACLs on the shares you must keep. Event 5142 names who added a share once File Share auditing is on.", "note": "ADMIN$, C$, and IPC$ are defaults; leave them. The filter line lists only added shares; a trailing $ merely hides one from browsing. A share under C:\\Users exposes profile files.", "task": "list the shares (cmd)", "t": "net share", "ta": ["get-smbshare"], "area": "access"}, {"id": "I-07", "title": "Scheduled tasks", "cmds": ["GUI: taskschd.msc, Task Scheduler Library: open each task's Triggers and Actions tabs; disable or delete a task the brief leaves unexplained", "PS> Get-ScheduledTask | Where-Object State -ne Disabled | Select-Object TaskPath,TaskName,State,Author,@{n='Run';e={($_.Actions | ForEach-Object { \"$($_.Execute) $($_.Arguments)\" }) -join '; '}},@{n='RunAs';e={$_.Principal.UserId}} | Format-Table -AutoSize -Wrap", "PS> (Get-ScheduledTask -TaskName \"<name>\").Actions | Select-Object Execute,Arguments", "PS> Export-ScheduledTask -TaskPath '\\' -TaskName '<name>' | Out-File -FilePath \"$env:USERPROFILE\\Desktop\\<name>.xml\"", "PS> Disable-ScheduledTask -TaskName \"<name>\" -TaskPath \"\\\"", "PS> Unregister-ScheduledTask -TaskName \"<name>\" -Confirm:$false", "CMD> schtasks /query /fo LIST /v", "  A task action such as powershell.exe -ExecutionPolicy Bypass -File C:\\Users\\Public\\x.ps1 or powershell -EncodedCommand <base64> hides what it runs: read the script or decode the Base64 to text, then remove the task", "CMD> auditpol /set /subcategory:\"Other Object Access Events\" /success:enable /failure:enable", "PS> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4698} | Format-List TimeCreated,Message", "PS> [Text.Encoding]::Unicode.GetString([Convert]::FromBase64String('<the text after -EncodedCommand>'))   (reads an encoded command without running it)"], "why": "Planted tasks re-add users, reopen ports, or run user-folder scripts every five minutes. Event 4698 logs each new task's XML and creator once Other Object Access Events auditing is on.", "note": "Tasks under \\Microsoft\\Windows are mostly stock; judge each root-path task by its program, since vendor updaters live there too. Export before removing: the XML keeps action, account, and author.", "area": "malware"}, {"id": "I-08", "title": "Startup items and Run keys", "cmds": ["PS> Get-CimInstance Win32_StartupCommand | Select-Object Name,Command,Location,User", "PS> Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Get-ItemProperty 'HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run' -Name \"<evil>\"", "GUI: Win+R, shell:startup (your Startup folder) and shell:common startup (every user's): remove shortcuts the brief leaves unexplained"], "gui": "Task Manager, Startup apps.", "why": "Anything that auto-runs survives a reboot. Attackers hide here with innocent names like Windows Update Helper.", "note": "Also check the RunOnce keys and the shell:startup folders.", "area": "malware"}, {"id": "I-09", "title": "Hosts file", "cmds": ["PS> Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "GUI: notepad as admin, open the hosts file, and delete every non-comment line except localhost and the entries the brief names", "CMD> nslookup <update or antivirus domain>   (asks the DNS server directly, past the hosts file; compare it with ping, which reads the hosts file first)"], "why": "Malware points update and antivirus domains at 127.0.0.1 or an attacker IP, so Defender and Windows Update silently fail.", "task": "print the hosts file", "t": "Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "ta": ["type c:\\windows\\system32\\drivers\\etc\\hosts", "cat c:\\windows\\system32\\drivers\\etc\\hosts"], "area": "config"}, {"id": "I-10", "title": "Listening ports to process", "cmds": ["CMD> netstat -abno", "PS> Get-NetTCPConnection -State Listen | Select-Object LocalAddress,LocalPort,OwningProcess,@{n='Path';e={(Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).Path}} | Sort-Object LocalPort", "PS> Get-NetUDPEndpoint | Select-Object LocalAddress,LocalPort,OwningProcess | Sort-Object LocalPort", "PS> Get-Process -Id <pid> | Select-Object Name,Path", "PS> Stop-Process -Id <pid> -Force   (after you disable what starts it, so it stays stopped)", "CMD> tasklist /svc", "CMD> netsh http show servicestate   (names the program behind a port that netstat pins on PID 4, System)"], "why": "A port you cannot explain is a backdoor; nc.exe listeners are the classic. Map port to PID to binary path to the service or task that starts it.", "note": "PID 4 is System: file sharing (445) and HTTP.sys web ports show it. netsh http show servicestate names the program behind an HTTP.sys port.", "also": "Before ending a listener, find and disable its starter (service, task, or Run key), or it returns at the next trigger.", "task": "show listening ports with their executables (cmd)", "t": "netstat -abno", "ta": ["netstat -ano", "netstat -abn"], "area": "config"}, {"id": "I-11", "title": "Remote Desktop hardening when RDP is required", "cmds": ["PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication -Value 1", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name SecurityLayer -Value 2", "PS> $ts='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services'; if (-not (Test-Path $ts)) { New-Item -Path $ts -Force | Out-Null }", "PS> foreach ($n in 'fDisableCdm','fDisablePNPRedir','fPromptForPassword','fEncryptRPCTraffic') { Set-ItemProperty -Path $ts -Name $n -Value 1 -Type DWord }", "PS> Get-CimInstance -Namespace root\\cimv2\\TerminalServices -ClassName Win32_TSGeneralSetting | Select-Object TerminalName,UserAuthenticationRequired,PolicySourceUserAuthenticationRequired", "CMD> net localgroup \"Remote Desktop Users\"", "PS> Add-LocalGroupMember -Group \"Remote Desktop Users\" -Member keola   (only a user the brief names for remote access)", "PS> Get-LocalGroupMember -SID S-1-5-32-555", "PS> Set-NetFirewallRule -DisplayGroup \"Remote Desktop\" -RemoteAddress <admin subnet>", "CMD> mstsc /v:<server> /remoteGuard   (Remote Credential Guard keeps your credentials on your own PC; it needs Kerberos inside a domain)"], "why": "Network Level Authentication forces a login before a session exists, which kills pre-auth exploits, and the TLS security layer (SecurityLayer 2) proves the server is the real one before anyone types a password. Blocking drive and device redirection keeps a session from reading or dropping files on the connecting PC, and prompting at every connection defeats a password saved in an .rdp file. Administrators connect whenever RDP is on, so the Remote Desktop Users group is the list of non-admins the brief names; audit it. Remote Assistance stays off (B-13). Scope the Remote Desktop firewall rule to the admin subnet that the brief names, so only those addresses reach the port.", "area": "access", "note": "The redirector service (UmRdpService) stays at Manual while RDP is in use; the policy values do the blocking. PolicySource 1 in the read-back means Group Policy decides NLA. SecurityLayer 2 uses a self-signed certificate unless the brief supplies one, so the first connection shows a certificate prompt. -SID S-1-5-32-555 names Remote Desktop Users in any display language."}, {"id": "I-12", "title": "Firewall allow-rule review", "cmds": ["GUI: wf.msc, Inbound Rules: sort by Group, then disable or delete an Allow rule the brief leaves unexplained", "PS> Get-NetFirewallRule -PolicyStore ActiveStore | Where-Object {$_.Enabled -eq 'True' -and $_.Direction -eq 'Inbound' -and $_.Action -eq 'Allow'} | Select-Object DisplayName,Profile | Sort-Object DisplayName", "PS> Get-NetFirewallRule -PolicyStore ActiveStore -Direction Outbound -Action Block -Enabled True | Select-Object DisplayName,Profile", "PS> Get-NetFirewallRule -DisplayName '<rule>' | Get-NetFirewallPortFilter", "CMD> netsh advfirewall firewall show rule name=all dir=in", "PS> Remove-NetFirewallRule -DisplayName \"<suspicious rule>\"", "CMD> netsh advfirewall firewall delete rule name=\"<suspicious rule>\"", "PS> New-NetFirewallRule -Name 'Allow-HTTP-In' -DisplayName 'Allow HTTP (TCP 80) in' -Direction Inbound -Protocol TCP -LocalPort 80 -Action Allow -RemoteAddress <brief subnet>", "CMD> netsh advfirewall firewall add rule name=\"HTTP from the brief subnet\" dir=in action=allow protocol=TCP localport=80 remoteip=<brief subnet>", "PS> Set-NetFirewallProfile -All -DefaultInboundAction Block -NotifyOnListen True -LogBlocked True"], "why": "A rule that admits the whole internet to 4444/tcp undoes the firewall; an outbound block on Defender or Windows Update stops protection quietly. Scope required ports to the brief's subnet.", "area": "config", "note": "ActiveStore lists the rules in force, Group Policy rules included. -Name gives a new rule a stable handle for Remove-NetFirewallRule -Name later."}, {"id": "I-13", "title": "Local Group Policy quick wins", "cmds": ["GUI: gpedit.msc, Computer Configuration, Administrative Templates", "  Windows Components, Windows Update, Manage end user experience: Configure Automatic Updates = Enabled (4)", "  Windows Components, AutoPlay Policies: Turn off AutoPlay = Enabled, All drives", "  Windows Components, Microsoft Defender Antivirus: Turn off Microsoft Defender Antivirus = Disabled", "CMD> reg query HKLM\\SOFTWARE\\Policies /s", "CMD> gpupdate /force"], "why": "Policy beats settings. A policy that turns Defender off re-disables it after you click it on in the GUI. When a setting will not stick, check policy.", "task": "apply group policy changes now", "t": "gpupdate /force", "area": "config", "note": "An absent value means Not Configured. reg query HKLM\\SOFTWARE\\Policies /s lists every machine policy value at once; DisableAntiSpyware 1 under Windows Defender is the Turn off Microsoft Defender Antivirus policy."}, {"id": "I-14", "title": "Event Viewer for investigations", "cmds": ["GUI: eventvwr.msc, Windows Logs, Security", "PS> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4720} | Format-List TimeCreated,Message", "  4624 logon OK, 4625 logon failed, 4720 user created, 4726 user deleted, 4732 added to local group, 4672 admin logon, 1102 log cleared, 7045 new service (System log), 4697 service installed (Security log, names the installer once A-08 turns it on)", "  Logon type 9 (NewCredentials) in event 4624 comes from runas /netonly /user:<domain>\\<user> <program>: borrowed credentials used for network access only"], "why": "Questions like who created the account on 3 October take one filter if you know a handful of event IDs.", "area": "inv"}, {"id": "I-15", "title": "Screen lock and sign-in requirements", "cmds": ["GUI: Settings, Accounts, Sign-in options: If you've been away, when should Windows require you to sign in again = When PC wakes up from sleep", "CMD> powercfg /setacvalueindex SCHEME_CURRENT SUB_NONE CONSOLELOCK 1", "CMD> powercfg /setdcvalueindex SCHEME_CURRENT SUB_NONE CONSOLELOCK 1", "CMD> powercfg /setactive SCHEME_CURRENT", "PS> New-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name SCRNSAVE.EXE -PropertyType String -Value 'C:\\Windows\\System32\\scrnsave.scr' -Force", "PS> New-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaveActive -PropertyType String -Value '1' -Force", "PS> New-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaverIsSecure -PropertyType String -Value '1' -Force", "PS> New-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaveTimeOut -PropertyType String -Value '600' -Force", "PS> Get-CimInstance Win32_Desktop | Select-Object Name,ScreenSaverActive,ScreenSaverSecure,ScreenSaverTimeout", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name InactivityTimeoutSecs -Value 600 -Type DWord", "GUI: gpedit.msc, User Configuration, Administrative Templates, Control Panel, Personalization: Enable screen saver, Password protect the screen saver, Screen saver timeout 600"], "why": "An unlocked, unattended desktop is physical access, and physical access is everything. Ten minutes with a password is the usual policy; Win32_Desktop reads back each profile to confirm it.", "note": "Desktop values are text (REG_SZ) and per user (HKCU); on a missing value, Set-ItemProperty writes a number (DWORD), so use New-ItemProperty -PropertyType String. Locking needs a chosen screen saver (SCRNSAVE.EXE).", "also": "CONSOLELOCK is the command-line form of the sign-in-on-wake setting and works on Home. InactivityTimeoutSecs (machine-wide) takes effect after a restart and locks every idle session, whoever signed in.", "area": "config"}, {"id": "I-16", "title": "SmartScreen, reputation-based protection, memory integrity", "cmds": ["PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System')) { New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System' -Force | Out-Null }", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System' -Name EnableSmartScreen -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System' -Name ShellSmartScreenLevel -Value Block -Type String", "GUI: Windows Security, App and browser control, Reputation-based protection: everything On", "GUI: Windows Security, Device security, Core isolation: Memory integrity On", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard\\Scenarios\\HypervisorEnforcedCodeIntegrity' -Name Enabled -Value 1 -Type DWord"], "why": "SmartScreen blocks known-bad downloads and installers before Defender scans them, and memory integrity (HVCI) blocks unsigned kernel drivers, the rootkit class. Confirm ShellSmartScreenLevel reads Block; Warn still allows the click-through.", "note": "New-Item -Force on the System key erases its other policies; the Test-Path guard keeps them. A VM without nested virtualization may lack memory integrity, so its toggle stays hidden.", "area": "malware"}, {"id": "I-17", "title": "Browsers: updated and protected by policy", "cmds": ["CMD> reg query HKLM\\SOFTWARE\\Policies\\Mozilla\\Firefox /s", "CMD> reg query HKCU\\SOFTWARE\\Policies\\Mozilla\\Firefox /s", "CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Edge /s", "CMD> reg query HKLM\\SOFTWARE\\Policies\\Google\\Chrome /s", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Google\\Chrome /v SafeBrowsingProtectionLevel /t REG_DWORD /d 1 /f", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Google\\Chrome /v HttpsOnlyMode /t REG_SZ /d force_enabled /f", "GUI: Firefox, Settings, Privacy & Security: Block dangerous and deceptive content On (with dangerous downloads and unwanted software), HTTPS-Only Mode in all windows, Block pop-up windows On, Warn you when websites try to install add-ons On", "GUI: about:policies (Firefox), chrome://policy (Chrome), and edge://policy (Edge) show every policy in force; about:addons, chrome://extensions, and edge://extensions list extensions to compare with the brief"], "why": "Most attacks reach a workstation through the browser. Safe Browsing blocks known-bad sites and downloads; HTTPS-Only keeps sign-ins off plain HTTP. Policy outranks settings: read it first for planted values.", "note": "Planted policy values can switch Safe Browsing off or force an extension. Update each browser first (B-09). Firefox also reads distribution\\policies.json in its install folder; about:policies shows which source applies.", "also": "Before HTTPS-Only, add an exception for any plain-HTTP site the brief requires: HttpAllowlist in Chrome, Manage Exceptions in Firefox. Current Firefox replaced Do Not Track with Global Privacy Control.", "task": "list Chrome's machine policy values (cmd)", "t": "reg query HKLM\\SOFTWARE\\Policies\\Google\\Chrome /s", "ta": ["reg query hklm\\software\\policies\\google\\chrome"], "area": "malware"}, {"id": "I-18", "title": "Automatic updates: policy keeps them on (NoAutoUpdate 0, no WSUS redirect)", "cmds": ["CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU /v NoAutoUpdate", "CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate /v WUServer", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU /v NoAutoUpdate /t REG_DWORD /d 0 /f", "CMD> reg delete HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate /v WUServer /f", "CMD> reg delete HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU /v UseWUServer /f", "GUI: gpedit.msc, Computer Configuration, Administrative Templates, Windows Components, Windows Update, Manage end user experience: Configure Automatic Updates Enabled, option 4 (auto download and schedule the install); Manage updates offered from Windows Server Update Service: Specify intranet Microsoft update service location Not Configured", "CMD> gpupdate /force", "PS> (New-Object -ComObject Microsoft.Update.AutoUpdate).Results"], "why": "B-09 installs pending updates; this item keeps them coming. Policy outranks Settings: NoAutoUpdate 1 switches automatic updates off while the service looks healthy, so keep it 0 or absent.", "note": "WUServer with UseWUServer 1 redirects every check away from Microsoft. A domain may set it to its own server; on stand-alone machines, a server outside the brief is a finding.", "also": "reg query on both policy keys shows NoAutoUpdate and WUServer in seconds. Fix the policy, then confirm the AutoUpdate results show recent LastSearchSuccessDate and LastInstallationSuccessDate after a check.", "area": "patch", "t": "reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU /v NoAutoUpdate", "ta": ["reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU"], "task": "Show whether policy switches automatic updates off"}, {"id": "I-19", "title": "Network checks: address, route, neighbors, names, path, and port", "cmds": ["CMD> ipconfig /all", "CMD> ipconfig /release   (for a 169.254.x.x address: drop it, then renew)", "CMD> ipconfig /renew   (asks DHCP for a fresh lease)", "CMD> route print -4", "CMD> ping <gateway>", "CMD> arp -a", "CMD> nslookup <name>", "PS> Resolve-DnsName <name>", "CMD> ipconfig /displaydns", "CMD> ipconfig /flushdns", "CMD> tracert -d <address>", "PS> Test-NetConnection <host> -Port 443"], "why": "Prove the network path before you blame a setting you just hardened: address, gateway, neighbors, names, path, then the port itself.", "note": "A silent ping proves little: Windows Firewall blocks inbound echo requests unless a rule allows them. Test-NetConnection shows TcpTestSucceeded True once the TCP handshake to that port completes.", "also": "In arp -a, two addresses sharing one physical address, the gateway among them, can point to ARP spoofing. A 169.254.x.x address means the DHCP request went unanswered.", "task": "show the full address, gateway, and DNS configuration (cmd)", "t": "ipconfig /all", "area": "config"}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. Baselines from the command line, registry hardening against credential theft, persistence hunting, Defender depth, SMB signing, and version notes. Learn it first: Defense Ladder se7, \"Windows: credentials and the domain attack surface.\"", "items": [{"id": "A-01", "title": "Security policy as a file: secedit", "cmds": ["CMD> secedit /export /cfg C:\\Temp\\secpol.cfg", "  [System Access] MinimumPasswordAge = 1, MaximumPasswordAge = 60, MinimumPasswordLength = 12, PasswordComplexity = 1, PasswordHistorySize = 24, LockoutBadCount = 5, ResetLockoutCount = 30, LockoutDuration = 30, AllowAdministratorLockout = 1, ClearTextPassword = 0, EnableGuestAccount = 0", "CMD> secedit /configure /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg /areas SECURITYPOLICY", "CMD> secedit /analyze /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg"], "why": "One file, every account policy, repeatable and auditable, and the only command-line path to complexity and reversible encryption.", "note": "secedit ignores .cfg typos quietly; verify with net accounts. Keep only [Unicode], [Version], and [System Access], so /configure leaves audit policy and registry values alone. Home includes secedit too.", "task": "export the local security policy to C:\\Temp\\secpol.cfg", "t": "secedit /export /cfg C:\\Temp\\secpol.cfg", "area": "config"}, {"id": "A-02", "title": "LSA and anonymous-access registry hardening", "cmds": ["PS> $lsa='HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa'", "PS> Set-ItemProperty -Path $lsa -Name LimitBlankPasswordUse -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymous -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymousSAM -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name NoLMHash -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name LmCompatibilityLevel -Value 5 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name EveryoneIncludesAnonymous -Value 0 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name ForceGuest -Value 0 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictRemoteSAM -Value 'O:BAG:BAD:(A;;RC;;;BA)' -Type String", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0' -Name allownullsessionfallback -Value 0 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0' -Name NTLMMinClientSec -Value 537395200 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0' -Name NTLMMinServerSec -Value 537395200 -Type DWord", "PS> Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue", "PS> Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name LocalAccountTokenFilterPolicy"], "why": "RestrictAnonymous stops null-session enumeration; NoLMHash stops storing LM hashes, which crack in seconds; LmCompatibilityLevel 5 refuses NTLMv1 (Windows 11 24H2 and Windows Server 2025 remove it; check the level on older releases and mixed domains). ForceGuest 0 (Classic) keeps local users signing in over the network as themselves; RestrictRemoteSAM limits remote SAM queries to Administrators. NULL session fallback 0 and NTLM minimum session security 537395200 (NTLMv2 session security plus 128-bit encryption) close the last NTLM downgrades. LocalAccountTokenFilterPolicy 1 hands every local administrator a full token over C$ and ADMIN$ from the network, the pass-the-hash road: remove it so remote local admins stay filtered.", "note": "This is the registry form of the Watchman Security Options. A missing LocalAccountTokenFilterPolicy is the good result. MSV1_0 and the System key always exist, so Set-ItemProperty writes there directly.", "area": "config"}, {"id": "A-03", "title": "Credential-theft hardening: LLMNR, NetBIOS, WDigest", "cmds": ["PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient')) { New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Force | Out-Null }", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Name EnableMulticast -Value 0 -Type DWord", "PS> Get-CimInstance Win32_NetworkAdapterConfiguration -Filter \"IPEnabled=TRUE\" | Invoke-CimMethod -MethodName SetTcpipNetbios -Arguments @{TcpipNetbiosOptions=2}", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\WDigest' -Name UseLogonCredential -Value 0 -Type DWord"], "why": "LLMNR and NBT-NS are what Responder poisons to collect NTLMv2 hashes for cracking or relay. WDigest set to 1 keeps plaintext passwords in LSASS memory for mimikatz.", "area": "config", "note": "The Test-Path guard creates the key only when it is missing, so DNS client policies already in it stay (A-04 explains why)."}, {"id": "A-04", "title": "AutoRun and AutoPlay off everywhere", "cmds": ["PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer')) { New-Item -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Force | Out-Null }", "CMD> reg export HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer C:\\Backup\\explorer-policies.reg   (back up the key before you change it)", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoDriveTypeAutoRun -Value 255 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoAutorun -Value 1 -Type DWord", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer /v NoAutoplayfornonVolume /t REG_DWORD /d 1 /f", "CMD> reg delete HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer /v NoDriveTypeAutoRun /f   (rollback, only when the brief needs AutoPlay back: reg import C:\\Backup\\explorer-policies.reg restores the saved values; reg delete removes one the backup lacked)"], "why": "USB-drop attacks. Conficker-era, still a CIS and STIG requirement. NoAutoplayfornonVolume covers phones and cameras, which the drive-type value leaves out.", "area": "malware", "note": "This Explorer key already holds other policies, and New-Item -Force on an existing key deletes every value in it. The Test-Path guard and reg add both keep them."}, {"id": "A-05", "title": "User Rights Assignment", "cmds": ["GUI: secpol.msc, Local Policies, User Rights Assignment", "  Access this computer from the network = Administrators, Authenticated Users (remove Everyone and Guest)", "  Deny log on through Remote Desktop Services = Guest", "  Deny access to this computer from the network = Guest", "  Debug programs = empty, or Administrators only", "  Act as part of the operating system = empty", "  Back up files and directories, Restore files and directories, Take ownership of files or other objects = Administrators", "  Manage auditing and security log = Administrators", "  Change the system time = Administrators, LOCAL SERVICE", "  Allow log on locally = Administrators, Users", "CMD> secedit /export /cfg C:\\Windows\\Temp\\ura.inf /areas USER_RIGHTS", "PS> Select-String -Path C:\\Windows\\Temp\\ura.inf -Pattern 'SeDebugPrivilege|SeTcbPrivilege|SeNetworkLogonRight|SeBackupPrivilege|SeSecurityPrivilege'", "CMD> whoami /priv"], "why": "Rights bypass ACLs: Debug programs dumps LSASS passwords; Back up files reads the SAM hive. Restore and Take ownership rewrite any file; Manage auditing clears the Security log (event 1102).", "note": "Export lists SIDs: *S-1-5-32-544 Administrators, *S-1-5-32-545 Users, *S-1-5-11 Authenticated Users; unknown SIDs are deleted or planted accounts. Remove extra user and group accounts; LOCAL SERVICE, NETWORK SERVICE, and SERVICE stay.", "also": "Set a right by applying SeDebugPrivilege = *S-1-5-32-544 (empty clears it) under [Privilege Rights] as in A-01 with /areas USER_RIGHTS. Changes apply at next sign-in and log 4704 and 4705.", "task": "show the privileges of the current user", "t": "whoami /priv", "area": "access"}, {"id": "A-06", "title": "Deep persistence and backdoor hunt", "cmds": ["PS> Get-CimInstance Win32_Process | Select-Object Name,ProcessId,ParentProcessId,CommandLine | Sort-Object Name", "CMD> quser   (who is signed in now, at the console or over Remote Desktop: capture it before you change anything)", "CMD> wevtutil epl Security E:\\case\\<host>-Sec.evtx   (export the logs before you change anything; repeat for System)", "PS> Get-ChildItem C:\\ -Recurse -Include nc.exe,ncat.exe,netcat*,mimikatz*,psexec*,*.ps1,*.vbs -ErrorAction SilentlyContinue | Select-Object FullName,LastWriteTime", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventFilter", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventConsumer", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __FilterToConsumerBinding", "PS> $PROFILE | Select-Object *; Get-Content $PROFILE.AllUsersAllHosts -ErrorAction SilentlyContinue", "PS> Get-ChildItem -Path C:\\Users,C:\\ProgramData,C:\\Windows\\Temp -Recurse -Force -File -Include *.exe,*.dll,*.scr -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '^C:\\\\Users\\\\(All Users|Default User)\\\\' | Get-AuthenticodeSignature | Where-Object Status -ne 'Valid' | Select-Object Path,Status", "PS> Get-ChildItem 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tree' -Recurse | Where-Object { -not $_.GetValue('SD') -and $_.GetValue('Id') } | Select-Object Name", "CMD> wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true", "CMD> autorunsc.exe -accepteula -a * -c -nobanner   (Sysinternals, public)"], "why": "WMI event subscriptions and PowerShell profiles are the persistence spots checklists miss; Autoruns shows every auto-start location at once. A task with SD deleted runs hidden from Get-ScheduledTask and schtasks.", "note": "A renamed tool keeps its missing or broken signature. Unsigned programs in Users, ProgramData, or Temp are leads; legitimate tools ship unsigned too, so check the brief and the publisher.", "also": "Get Sysinternals from learn.microsoft.com/sysinternals only, and only where policy allows third-party tools. The wevtutil line turns on Task Scheduler history, which starts off.", "area": "malware"}, {"id": "A-07", "title": "NTFS permissions", "cmds": ["CMD> icacls \"C:\\CompanyData\" /save C:\\Windows\\Temp\\acl.txt /t /c", "CMD> icacls \"C:\\CompanyData\"", "CMD> icacls \"C:\\CompanyData\" /inheritance:r /grant:r \"Administrators:(OI)(CI)F\" \"Users:(OI)(CI)RX\" /t", "CMD> icacls \"C:\\CompanyData\" /remove:g Everyone /t", "PS> Get-Acl \"C:\\CompanyData\" | Format-List"], "why": "Everyone with Full control on shares or Program Files lets anyone swap a binary a service runs as SYSTEM. (OI) object inherit, (CI) container inherit, /t recurse, /inheritance:r stop inheriting.", "note": "Save ACLs first: icacls C:\\ /restore C:\\Windows\\Temp\\acl.txt puts them back (restore runs from the parent folder). SIDs work in any display language: /remove:g *S-1-1-0 for Everyone, *S-1-5-11 for Authenticated Users.", "also": "A folder made at the root of C: inherits Authenticated Users Modify, so read it before you trust it.", "task": "show the ACL of C:\\CompanyData (cmd)", "t": "icacls C:\\CompanyData", "ta": ["icacls \"c:\\companydata\"", "get-acl c:\\companydata"], "area": "access"}, {"id": "A-08", "title": "Fine-grained auditing and PowerShell logging", "cmds": ["CMD> auditpol /set /subcategory:\"Credential Validation\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Logon\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Account Lockout\" /failure:enable", "CMD> auditpol /set /subcategory:\"User Account Management\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Security Group Management\" /success:enable", "CMD> auditpol /set /subcategory:\"Process Creation\" /success:enable", "CMD> reg add \"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\Audit\" /v ProcessCreationIncludeCmdLine_Enabled /t REG_DWORD /d 1 /f", "CMD> auditpol /set /subcategory:\"Security System Extension\" /success:enable", "CMD> auditpol /set /subcategory:\"Audit Policy Change\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Filtering Platform Connection\" /success:disable /failure:disable", "CMD> reg add HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa /v SCENoApplyLegacyAuditPolicy /t REG_DWORD /d 1 /f", "PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging')) { New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Force | Out-Null }", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Name EnableScriptBlockLogging -Value 1 -Type DWord", "PS> Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-PowerShell/Operational'; Id=4104} -MaxEvents 3 | Format-List TimeCreated,Message", "PS> Get-ExecutionPolicy -List   (a MachinePolicy or UserPolicy value comes from Group Policy and wins over the scopes below it)", "PS> Set-ExecutionPolicy -Scope CurrentUser RemoteSigned   (only when you must run your own script: Windows 11 starts at Restricted, and RemoteSigned lets local scripts run while downloaded ones need a trusted signature)", "CMD> auditpol /get /category:*"], "why": "Subcategory settings take precedence over the nine legacy categories once Audit: Force audit policy subcategory settings is Enabled (SCENoApplyLegacyAuditPolicy 1). Credential Validation writes 4776 for every local-account password check, so a guessing run shows beside 4625. The command-line value fills the Process Command Line field of every 4688. Security System Extension writes 4697, which names who installed a service. Script Block Logging (event 4104) records what every PowerShell script actually did, including the attacker's.", "area": "audit", "note": "Run it after I-01: a category-wide command rewrites every subcategory in its category. Account Lockout has Failure events only (the lockout itself, 4740, comes from User Account Management), and Security Group Management has Success events only. Filtering Platform Connection floods the log after a category-wide run; turn it back on when the brief asks for connection auditing. auditpol names drop the Audit prefix that secpol shows, and each subcategory also takes a GUID that works in any display language, such as {0CCE923F-69AE-11D9-BED3-505054503030} for Credential Validation. On a domain, a GPO that defines advanced auditing re-applies its list at each refresh, so set the values there. PowerShell 7 reads its own key, HKLM:\\SOFTWARE\\Policies\\Microsoft\\PowerShellCore\\ScriptBlockLogging, and logs to PowerShellCore/Operational.", "also": "Execution policy is a safety setting rather than a security boundary: anyone can bypass it, so script block logging (4104) is what records the script that ran."}, {"id": "A-09", "title": "Defender beyond on: exclusions, PUA, cloud, ASR", "cmds": ["PS> Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension", "PS> Remove-MpPreference -ExclusionPath \"C:\\evil\"", "CMD> reg query \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Exclusions\" /s", "PS> Get-MpPreference | Select-Object ThreatIDDefaultAction_Ids,ThreatIDDefaultAction_Actions", "PS> Remove-MpPreference -ThreatIDDefaultAction_Ids <id>", "PS> Set-MpPreference -PUAProtection Enabled -MAPSReporting Advanced -SubmitSamplesConsent SendAllSamples", "PS> Add-MpPreference -AttackSurfaceReductionRules_Ids 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2 -AttackSurfaceReductionRules_Actions Enabled", "PS> Get-MpThreatDetection | Select-Object DomainUser,ProcessName,InitialDetectionTime", "PS> Set-MpPreference -EnableControlledFolderAccess Enabled -EnableNetworkProtection Enabled"], "why": "Attackers rarely turn Defender off; they exclude a folder or allow one threat (ThreatIDDefaultAction 6 means Allow). PUA protection catches junkware, and the LSASS rule stops mimikatz-class attacks.", "note": "An exclusion set by policy returns after Remove-MpPreference: set the policy to Not Configured in gpedit.msc (or delete the value under the policy key) first, then remove the local one.", "also": "Even with real-time protection on, controlled folder access and network protection stay off until you set them. The first stops ransomware rewriting Documents; the second blocks known-bad domains.", "task": "list Defender exclusions", "t": "Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension", "ta": ["get-mppreference | select exclusionpath,exclusionprocess,exclusionextension", "get-mppreference"], "area": "malware"}, {"id": "A-10", "title": "Optional capabilities: OpenSSH Server and friends", "cmds": ["PS> Get-WindowsCapability -Online | Where-Object State -eq Installed | Select-Object Name", "PS> Get-Service sshd -ErrorAction SilentlyContinue | Select-Object Status,StartType", "PS> Remove-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0", "PS> Get-Content C:\\ProgramData\\ssh\\sshd_config"], "why": "Windows 11 ships OpenSSH Server as an installable capability; an attacker or careless admin can switch it on. The firewall rule for port 22 then quietly allows that second door.", "note": "If the brief requires SSH, keep it and harden C:\\ProgramData\\ssh\\sshd_config (PasswordAuthentication, AllowUsers, no empty passwords), then restart the sshd service.", "task": "list installed Windows capabilities", "t": "Get-WindowsCapability -Online | Where-Object State -eq Installed | Select-Object Name", "ta": ["get-windowscapability -online | where state -eq installed"], "area": "config"}, {"id": "A-11", "title": "SMB signing and encryption", "cmds": ["PS> Set-SmbServerConfiguration -RequireSecuritySignature $true -EncryptData $true -Force", "PS> Set-SmbClientConfiguration -RequireSecuritySignature $true -Force", "PS> Set-SmbClientConfiguration -EnableInsecureGuestLogons $false -Force", "PS> Get-SmbServerConfiguration | Select-Object EnableSMB1Protocol,RequireSecuritySignature,EncryptData", "PS> Get-SmbClientConfiguration | Select-Object RequireSecuritySignature,EnableInsecureGuestLogons"], "why": "Required signing kills NTLM relay, the attack that turns one weak host into domain admin.", "note": "Read the current values before assuming: defaults differ by release and edition (see Version notes). On Pro or Enterprise, RequireSecuritySignature False or EnableInsecureGuestLogons True is a finding to explain.", "also": "Home edition accepts insecure guest logons by default, letting a fake file server hand this PC files without any sign-in. Set EnableInsecureGuestLogons False unless the brief names a guest-only NAS.", "area": "config"}, {"id": "A-12", "title": "Verify, document, re-check", "cmds": ["CMD> gpresult /r", "CMD> w32tm /query /status   (the time source and last sync; net start w32time first if the service is stopped)", "CMD> net accounts", "PS> Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusSignatureLastUpdated", "PS> Get-NetFirewallProfile | Select-Object Name,Enabled", "PS> Get-LocalGroupMember Administrators", "CMD> netstat -abno"], "why": "A change log of what, when, and why lets you reverse a breaking change in thirty seconds instead of thirty minutes. Real incident response runs on the same record.", "task": "show the applied group policy for this computer and user", "t": "gpresult /r"}, {"id": "A-13", "title": "Version notes: Windows 11 26H2", "cmds": ["GUI: Win+R, winver: edition, version (26H2), and OS build", "  This page targets Windows 11 26H2 (the 24H2 core). Several defaults changed in recent releases: read the current value instead of assuming.", "  Account lockout: new installs of 22H2 and later can start with a lockout policy and Allow Administrator account lockout already set (KB5020282 recommends 10 attempts, 10 minutes, and 10 minutes); upgraded machines and machines patched after setup can start at Never, so read net accounts and set the brief's values either way", "  SMB: since 24H2, Pro, Enterprise, and Education require SMB signing in both directions, and Pro blocks insecure guest logons; Home edition leaves signing optional", "  Administrator protection (Windows 11 only): TypeOfAdminApprovalMode 2 gives each elevation a separate, temporary admin token; it starts off, needs a restart, and while it is on, ConsentPromptBehaviorEnhancedAdmin decides the prompt (I-03)", "  Removed since 24H2: Microsoft Defender Application Guard (and its WDAGUtilityAccount), WMIC (use Get-CimInstance), Windows PowerShell 2.0, NTLMv1", "  Home edition: leaves out lusrmgr.msc, secpol.msc, and gpedit.msc; use Settings, net user, or net accounts"], "why": "Every other item holds across releases; release changes live here. Check this list before you flag a default as a finding or count a changed default as a fix."}, {"id": "A-14", "title": "Windows Installer: AlwaysInstallElevated off", "cmds": ["CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer", "CMD> reg query HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated /t REG_DWORD /d 0 /f", "CMD> reg add HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated /t REG_DWORD /d 0 /f", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v EnableUserControl /t REG_DWORD /d 0 /f", "GUI: gpedit.msc, Computer Configuration and User Configuration, Administrative Templates, Windows Components, Windows Installer: Always install with elevated privileges = Disabled"], "why": "AlwaysInstallElevated at 1 in both HKLM and HKCU runs any user's .msi as SYSTEM: a one-step privilege escalation Microsoft strongly discourages. EnableUserControl 0 keeps install options with administrators.", "note": "HKCU covers only the signed-in user. Check each profile the brief keeps: sign in as that user, or read HKEY_USERS\\<SID>\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer; reg add creates missing keys and keeps existing values.", "task": "show the Windows Installer machine policy values (cmd)", "t": "reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer", "area": "access"}, {"id": "A-15", "title": "Encryption, boot integrity, and recovery: BitLocker, TPM, Secure Boot, and an image backup", "cmds": ["GUI: msinfo32, System Summary: BIOS Mode UEFI and Secure Boot State On; tpm.msc: Specification Version 2.0", "PS> Confirm-SecureBootUEFI", "PS> Get-Tpm", "PS> Get-BitLockerVolume", "CMD> manage-bde -status", "PS> Resume-BitLocker -MountPoint C:   (turns suspended protection back on)", "PS> Add-BitLockerKeyProtector -MountPoint C: -RecoveryPasswordProtector   (before you encrypt: the 48-digit recovery password)", "PS> Enable-BitLocker -MountPoint C: -TpmProtector   (then encrypt a FullyDecrypted drive)", "PS> Backup-BitLockerKeyProtector -MountPoint C: -KeyProtectorId <id>   (domain-joined: copies the recovery password to Active Directory)", "PS> BackupToAAD-BitLockerKeyProtector -MountPoint C: -KeyProtectorId <id>   (Microsoft Entra joined)", "CMD> wbadmin start backup -backupTarget:E: -include:C: -allCritical -quiet"], "why": "A stolen disk reads in full on another computer unless BitLocker encrypts it, and a TPM with Secure Boot keeps the unlock tied to an untampered boot.", "note": "Save the recovery password away from the machine before you encrypt. Suspend-BitLocker pauses protection for firmware updates; Resume-BitLocker turns it back on.", "also": "BitLocker management needs Pro, Enterprise, or Education; Home offers Device encryption in Settings on supported hardware. wbadmin backs up C: and everything a bare-metal restore needs to drive E:.", "task": "show BitLocker status for every volume", "t": "Get-BitLockerVolume", "ta": ["manage-bde -status"], "area": "data"}]}], "spot": [{"lvl": 0, "ask": "Output of net accounts. Tap the line that is the finding.", "lines": ["Minimum password length:                 12", "Maximum password age (days):             60", "Lockout threshold:                       Never", "Length of password history maintained:   24"], "finding": 2, "why": "Lockout threshold Never means unlimited password guesses. Set it to 5 with net accounts /lockoutthreshold:5."}, {"lvl": 0, "ask": "Get-NetFirewallProfile output. Tap the finding.", "lines": ["Domain    True", "Private   True", "Public    False", "DefaultInboundAction  Block"], "finding": 2, "why": "The Public profile is off. A common misconfiguration leaves exactly one profile disabled."}, {"lvl": 0, "ask": "Get-LocalUser output. Tap the finding.", "lines": ["alice   True   PasswordRequired: True", "bob     True   PasswordRequired: True", "svc_backup  True   PasswordRequired: False", "Guest   False  PasswordRequired: False"], "finding": 2, "why": "An enabled account with PasswordRequired False is allowed a blank password: set one and require it (net user svc_backup /passwordreq:yes). Guest is disabled, so it is fine for now."}, {"lvl": 0, "ask": "Today is 10/19/2026. Status lines gathered from this PC. Tap the finding.", "lines": ["Get-Service wuauserv:    Running   Automatic", "Newest Get
