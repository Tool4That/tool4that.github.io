<style>
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#16212D; --muted:#5F6E7E; --line:#CFD7E0; --soft:#F4F6F9;
  --term:#0E1A2B; --termink:#D9E4F1; --prompt:#7FA6D6; --accent:#1F4FD8; --accent-ink:#FFFFFF;
  --ok:#1C8A57; --okbg:#E3F5EB; --bad:#C03A3A; --badbg:#FBE7E7; --warn:#A8690F; --warnbg:#FBF0DA; --focus:#FFB300;
  --sans:"Segoe UI Variable Text","Segoe UI","Avenir Next",Avenir,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; } }
:root[data-theme="dark"]{ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) 16px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.brand{font-weight:800;letter-spacing:-.01em;font-size:1.15rem;line-height:1.1}
.brand span{display:block;font-weight:500;color:var(--muted);font-size:.85rem;letter-spacing:0}
.levels{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.levels button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.levels button.on{background:var(--accent);color:var(--accent-ink)}
.levels button .b{font-size:1rem}
.score{font-family:var(--mono);font-size:.95rem;white-space:nowrap}
.score b{font-size:1.2rem}
.theme{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.85rem}
.modes{display:flex;gap:2px;overflow-x:auto}
.modes button{border:0;background:transparent;padding:8px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.modes button.on{color:var(--ink);border-bottom-color:var(--accent)}
.series{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 0 8px;font-size:.82rem;color:var(--muted)}
.series a{color:var(--muted);text-decoration:none}.series a:hover{text-decoration:underline}.series b{color:var(--ink)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 110px)}
main{padding:18px 16px 40px;min-width:0}
aside.report{border-left:1px solid var(--line);background:var(--panel);padding:16px}
footer{padding:14px 16px 30px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);background:var(--panel)}
footer button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.85rem;margin-left:8px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lead{color:var(--muted);max-width:70ch;margin-bottom:16px}
/* learn */
.learn{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:grid;grid-template-columns:18px 54px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;line-height:1.25}
.list button.on{background:var(--soft)}
.list button .id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.learned{background:var(--accent)}.dot.drilled{background:var(--warn)}.dot.mastered{background:var(--ok)}
.item .meta{font-family:var(--mono);color:var(--muted);font-size:.85rem;margin-bottom:2px}
.term{background:var(--term);color:var(--termink);font-family:var(--mono);font-size:.86rem;line-height:1.5;border-radius:10px;padding:8px 14px 12px;margin:12px 0;overflow-x:auto}
.term .tb{display:flex;justify-content:flex-end;min-height:22px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding-left:1.4em;text-indent:-1.4em;margin:2px 0}
.term .p{color:var(--prompt)}
.term .ln.c{color:#9DB0C6;font-style:italic}
.term .copy{border:1px solid #2E4158;background:#17283D;color:var(--termink);border-radius:6px;padding:2px 9px;font:600 .75rem var(--sans)}
.term .copy.done{border-color:var(--ok);color:#8BE0B4}
.run-in b{font-weight:700}
.explain{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--soft)}
.explain textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);resize:vertical}
.explain label{display:flex;gap:10px;align-items:center;margin-top:8px;font-weight:600}
.explain input{width:20px;height:20px;accent-color:var(--ok)}
.nav{display:flex;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
/* drill */
.q{max-width:720px}
.q .count{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;line-height:1.35}
.opts button.cmd{font-family:var(--mono);font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.opts button.ok{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.typein{width:100%;max-width:560px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);background:var(--panel)}
.result{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:560px}
.result .big{font-size:2.4rem;font-weight:800;font-family:var(--mono)}
/* run */
.timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.timer .clock{font-family:var(--mono);font-size:2rem;font-weight:700;min-width:120px}
.timer select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.chk input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--ok)}
.chk .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chk .t .id{font-family:var(--mono);color:var(--muted);font-size:.8rem}
.chk .note{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;background:var(--panel);font-size:.9rem}
.chk.done .t{color:var(--muted);text-decoration:line-through}
.chk .stamp{font-family:var(--mono);font-size:.8rem;color:var(--ok)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
/* games */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.brief{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0 14px;max-width:720px}
.brief ul{margin:4px 0 0 18px;padding:0}
.acct{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);max-width:720px}
.acct .n{font-family:var(--mono)}
.acct .n small{color:var(--muted);font-family:var(--sans);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.acct.ok .n{color:var(--ok)}.acct.bad .n{color:var(--bad)}
.streak{font-family:var(--mono);color:var(--muted);font-size:.9rem}
/* report */
.report h2{font-size:1.05rem;margin-bottom:10px}
.lv{margin:10px 0 14px}
.lv .row{display:flex;justify-content:space-between;font-size:.9rem}
.lv .bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.lv .bar2 i{display:block;height:100%;background:var(--accent)}
.lv .bar2.earned i{background:var(--ok)}
.rr{display:grid;grid-template-columns:18px 52px 1fr 26px;gap:6px;align-items:center;font-size:.85rem;padding:3px 0;border-top:1px solid var(--line)}
.rr .id{font-family:var(--mono);color:var(--muted);font-size:.78rem}
.rr .pt{font-family:var(--mono);text-align:right;color:var(--muted)}
.rr.mastered .g{color:var(--ok);font-weight:800}.rr.mastered .pt{color:var(--ok)}
.rr.learned .g{color:var(--accent);font-weight:800}
.rr.drilled .g{color:var(--warn);font-weight:800}
.rr .g{text-align:center}
.rr.flip{animation:flip .35s ease-out}
@keyframes flip{0%{background:var(--okbg)}100%{background:transparent}}
.total{display:flex;justify-content:space-between;font-family:var(--mono);margin-top:10px;padding-top:8px;border-top:2px solid var(--ink)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted);margin-left:6px}
.empty{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion:reduce){ .rr.flip{animation:none} }
@media (max-width:1100px){ .wrap{grid-template-columns:1fr} aside.report{display:none;border-left:0;border-top:1px solid var(--line)} body[data-mode="report"] aside.report{display:block} body[data-mode="report"] main{display:none} .modes .rep{display:inline-block} }
@media (min-width:1101px){ .modes .rep{display:none} }
@media (max-width:760px){ header.top{position:static} .learn{grid-template-columns:1fr} .list{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px} .list button{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line)} .list button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .list button .ttl{display:none} .levels{margin-left:0} .score{margin-left:auto} }
</style>
</head>

  <div class="bar">

<footer id="foot"></footer>
<script>
const APP = {"key": "windows11", "os": "Windows 11 26H2 (Pro / Enterprise)", "accent": "#1F4FD8", "footer": "Training tool for Windows 11 virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial practice; not affiliated with or endorsed by Microsoft.", "levels": [{"name": "Doorman", "badge": "🚪", "blurb": "Lock the doors. These are the fixes that are safe on almost any machine and close the most common gaps: users, admins, passwords, firewall, updates, Defender, unapproved software.", "items": [{"id": "B-00", "title": "Scenario brief and evidence first", "cmds": ["GUI: open the scenario brief (the documented requirements for this machine) and write down authorized users, admins, required services, and anything forbidden"], "why": "Most outages during hardening come from acting against the documented requirements: removing a user, role or service the business needs is an availability failure. Investigation questions often depend on evidence you destroy while fixing, so answer them before you change anything.", "note": "Unfamiliar is not the same as unauthorized: leave management, backup and monitoring agents alone until the system owner confirms what they are.", "task": "", "t": "", "area": "inv"}, {"id": "B-01", "title": "List local users", "cmds": ["PS> Get-LocalUser | Select-Object Name,Enabled,PasswordRequired,LastLogon", "CMD> net user", "GUI: Win+R, lusrmgr.msc (not available on Home)"], "why": "Unauthorized accounts are backdoors. Compare the list to the authorized users in the scenario brief.", "note": "PasswordRequired=False is its own finding: that account has a blank password. Windows 11 Home has no lusrmgr.msc or secpol.msc: use Settings, Accounts, Other users, or netplwiz.", "task": "list local users (cmd)", "t": "net user", "ta": ["get-localuser"], "area": "acct"}, {"id": "B-02", "title": "Remove an unauthorized user", "cmds": ["PS> Remove-LocalUser -Name \"baduser\"", "CMD> net user baduser /delete", "CMD> net user baduser /active:no"], "why": "Deleting removes the login path and the profile's persistence hooks.", "note": "Only accounts not in the brief. If the brief is unclear, disable first (/active:no), ask the system owner, decide once.", "task": "delete the local user baduser (cmd)", "t": "net user baduser /delete", "ta": ["remove-localuser -name baduser", "remove-localuser baduser"], "area": "acct"}, {"id": "B-03", "title": "Audit the Administrators group", "cmds": ["PS> Get-LocalGroupMember -Group Administrators", "CMD> net localgroup Administrators", "CMD> net localgroup Administrators baduser /delete", "CMD> net localgroup Administrators alice /add"], "why": "An admin can switch off every other control. Least privilege is the single highest-value idea in system hardening.", "note": "Demote users the brief calls standard; promote only the listed admins.", "task": "show who is in the Administrators group (cmd)", "t": "net localgroup Administrators", "ta": ["get-localgroupmember administrators", "get-localgroupmember -group administrators"], "area": "acct"}, {"id": "B-04", "title": "Disable Guest and the built-in Administrator", "cmds": ["CMD> net user Guest /active:no", "CMD> net user Administrator /active:no"], "why": "Well-known accounts are well-known targets; attackers brute-force them by name. Guest allows anonymous-style access.", "note": "If the brief says you log in as Administrator, keep it enabled and give it a strong password instead.", "task": "disable the Guest account", "t": "net user Guest /active:no", "area": "acct"}, {"id": "B-05", "title": "Strong passwords for every user", "cmds": ["CMD> net user alice \"Correct-Horse-Battery-2026!\"", "CMD> net user alice /logonpasswordchg:yes", "PS> Get-LocalUser | ForEach-Object { Set-LocalUser -Name $_.Name -PasswordNeverExpires $false }"], "why": "Weak, shared, or blank passwords are the number one way in. Password never expires defeats the aging policy you set next.", "note": "Record every changed password somewhere safe (on paper, in a lab). Do not change the password of the account you sign in with unless the brief says so.", "task": "force alice to change her password at next logon", "t": "net user alice /logonpasswordchg:yes", "area": "acct"}, {"id": "B-06", "title": "Password policy", "cmds": ["CMD> net accounts /minpwlen:12 /maxpwage:60 /minpwage:1 /uniquepw:5", "CMD> net accounts", "GUI: secpol.msc, Account Policies, Password Policy: complexity Enabled, reversible encryption Disabled"], "gui": "secpol.msc, Account Policies, Password Policy. Turn on 'Password must meet complexity requirements' and keep 'Store passwords using reversible encryption' off.", "why": "Length beats everything. Minimum age plus history stops the trick of changing it five times and setting it back. Reversible encryption is plaintext in disguise.", "note": "Complexity has no net accounts switch, so use secpol.msc (or secedit at Hunter level). On Home edition, net accounts is all you have for policy.", "task": "set min password length 12, max age 60, min age 1, history 5 (cmd)", "t": "net accounts /minpwlen:12 /maxpwage:60 /minpwage:1 /uniquepw:5", "area": "acct"}, {"id": "B-07", "title": "Account lockout policy", "cmds": ["CMD> net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30"], "why": "Turns an online brute force from thousands of guesses a minute into five per half hour.", "note": "A threshold of 0 means never lock, which is a finding.", "task": "lock accounts after 5 bad tries for 30 minutes (cmd)", "t": "net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30", "area": "acct"}, {"id": "B-08", "title": "Firewall on for all profiles", "cmds": ["PS> Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True", "PS> Get-NetFirewallProfile | Select-Object Name,Enabled,DefaultInboundAction", "CMD> netsh advfirewall set allprofiles state on"], "gui": "Settings, Privacy and security, Windows Security, Firewall and network protection.", "why": "Default-deny inbound covers the service you have not found yet. Misconfigured machines often have exactly one profile off, usually Public.", "note": "DefaultInboundAction should be Block. Allow-rule review is a Watchman item.", "task": "turn the firewall on for every profile (cmd)", "t": "netsh advfirewall set allprofiles state on", "ta": ["set-netfirewallprofile -profile domain,public,private -enabled true", "set-netfirewallprofile -all -enabled true"], "area": "config"}, {"id": "B-09", "title": "Windows Update: run it and automate it", "cmds": ["GUI: Settings, Windows Update, Check for updates; Advanced options: receive updates for other Microsoft products", "PS> Set-Service -Name wuauserv -StartupType Automatic; Start-Service wuauserv", "PS> Get-Service wuauserv | Select-Object Status,StartType"], "why": "Patching closes the vulnerabilities scanners actually find. Two separate checks: updates applied now, and automatic updates left enabled.", "note": "Start it first and let it run in the background. Save your work before any reboot.", "area": "patch"}, {"id": "B-10", "title": "Defender: real-time on, definitions current, scan", "cmds": ["PS> Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated", "PS> Set-MpPreference -DisableRealtimeMonitoring $false", "PS> Update-MpSignature", "PS> Start-MpScan -ScanType QuickScan"], "gui": "Windows Security, Virus and threat protection, Manage settings.", "why": "Real-time protection is the baseline malware control. Neglected or compromised machines have it off, or carry exclusions that hide malware.", "note": "If Tamper Protection blocks the cmdlet, flip it in the GUI.", "task": "update Defender signatures", "t": "Update-MpSignature", "area": "malware"}, {"id": "B-11", "title": "Remove unapproved software", "cmds": ["PS> Get-ItemProperty HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*, HKLM:\\Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\* | Select-Object DisplayName,DisplayVersion,Publisher | Sort-Object DisplayName", "GUI: Settings, Apps, Installed apps (or appwiz.cpl)", "PS> winget list", "PS> winget uninstall --name \"Wireshark\"", "PS> Get-AppxPackage -AllUsers | Select-Object Name | Sort-Object Name", "PS> Get-AppxPackage -AllUsers *xbox* | Remove-AppxPackage -AllUsers"], "why": "Hacking tools, games, torrent clients and remote-access tools are acceptable-use violations and attack surface.", "note": "Software the brief requires stays. The registry listing is instant; Win32_Product is slow and can trigger repairs. Store apps do not appear in the Uninstall registry key: list them with Get-AppxPackage.", "area": "software"}, {"id": "B-12", "title": "Find unapproved media and loose executables", "cmds": ["PS> Get-ChildItem -Path C:\\Users -Recurse -Include *.mp3,*.mp4,*.wav,*.avi,*.mkv,*.flac,*.mov,*.m4a -ErrorAction SilentlyContinue | Select-Object FullName", "PS> Get-ChildItem -Path C:\\Users -Recurse -Include *.exe,*.bat,*.ps1,*.vbs -ErrorAction SilentlyContinue | Select-Object FullName"], "why": "Many acceptable-use policies ban personal media on work machines, and scripts sitting in user folders are often the planted backdoor.", "note": "Confirm against the brief before deleting, and search C:\\ too, not just C:\\Users.", "area": "data"}, {"id": "B-13", "title": "Stop obviously unsafe services", "cmds": ["PS> Get-Service -Name ftpsvc,TermService,RemoteRegistry,SNMP -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType", "PS> Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server' -Name fDenyTSConnections -Value 1", "GUI: services.msc, Startup type Disabled; Settings, System, Remote Desktop"], "why": "Telnet and FTP leak credentials in cleartext. Remote Registry lets a remote attacker edit the registry. RDP is a brute-force magnet.", "note": "If the brief requires RDP, FTP or SSH, harden it instead of killing it.", "task": "stop Remote Registry and disable its startup", "t": "Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "gui": "Settings, System, Remote Desktop: Off unless the brief requires it. services.msc for the rest.", "area": "config"}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. Policy, services, shares, scheduled tasks, startup items, hosts file, listening ports, logs. This is where the hidden stuff lives.", "items": [{"id": "I-01", "title": "Audit policy: turn the lights on", "cmds": ["CMD> auditpol /set /category:* /success:enable /failure:enable", "CMD> auditpol /get /category:*", "GUI: secpol.msc, Local Policies, Audit Policy, each set to Success and Failure"], "why": "Without auditing, Event Viewer has nothing to tell you or an investigator. Logon, account management and policy change are the key ones.", "note": "Fine-grained subcategories are a Hunter item.", "task": "enable success and failure auditing for every category", "t": "auditpol /set /category:* /success:enable /failure:enable", "area": "audit"}, {"id": "I-02", "title": "Security Options in secpol.msc", "cmds": ["GUI: secpol.msc, Local Policies, Security Options", "  Accounts: Limit local account use of blank passwords to console logon only = Enabled", "  Interactive logon: Do not display last user name = Enabled", "  Interactive logon: Do not require CTRL+ALT+DEL = Disabled", "  Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled", "  Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM & NTLM", "  Microsoft network client and server: Digitally sign communications (always) = Enabled", "  Shutdown: Allow system to be shut down without having to log on = Disabled", "  User Account Control: Run all administrators in Admin Approval Mode = Enabled"], "why": "These are the classic CIS and STIG level-one settings; each blocks a named attack: blank-password remote logon, username harvesting, LM and NTLMv1 cracking or relay, SMB relay, pre-auth shutdown, UAC bypass.", "note": "Command-line equivalents live in the registry (Hunter A-02) or secedit (Hunter A-01).", "area": "config"}, {"id": "I-03", "title": "UAC to Always notify", "cmds": ["PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name ConsentPromptBehaviorAdmin -Value 2 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name PromptOnSecureDesktop -Value 1 -Type DWord"], "gui": "Control Panel, User Accounts, Change User Account Control settings, slider to the top.", "why": "UAC off means every process an admin runs is full admin with no prompt, which malware loves. Value 2 means prompt on the secure desktop.", "note": "Changing EnableLUA needs a reboot to fully apply.", "area": "config"}, {"id": "I-04", "title": "Service audit: what runs, from where", "cmds": ["PS> Get-CimInstance Win32_Service | Select-Object Name,State,StartMode,PathName | Sort-Object Name", "PS> Get-Service | Where-Object Status -eq Running | Sort-Object DisplayName", "PS> Stop-Service -Name <name>; Set-Service -Name <name> -StartupType Disabled"], "why": "Look for Telnet, FTP, SNMP, SSDP and UPnP, Remote Registry, Xbox services, odd names, and any service whose PathName is under C:\\Users or C:\\Temp. Those are planted.", "note": "Required services (IIS, DNS, DHCP, OpenSSH, MySQL, Apache) stay running; harden their configs instead.", "area": "config"}, {"id": "I-05", "title": "Optional features: SMBv1, Telnet client, TFTP, IIS", "cmds": ["PS> Get-WindowsOptionalFeature -Online | Where-Object State -eq Enabled | Select-Object FeatureName", "PS> Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart", "PS> Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force", "PS> Disable-WindowsOptionalFeature -Online -FeatureName TelnetClient -NoRestart"], "why": "SMBv1 is EternalBlue and WannaCry. Telnet and TFTP clients are cleartext tools that should not exist on a workstation.", "note": "Remove IIS only if the brief does not require a web server.", "task": "turn SMBv1 off in the SMB server configuration", "t": "Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force", "area": "config"}, {"id": "I-06", "title": "Shares", "cmds": ["PS> Get-SmbShare", "CMD> net share", "PS> Remove-SmbShare -Name \"badshare\" -Force"], "why": "An unexpected share is a data exfiltration path. Check the ACLs on the shares you must keep.", "note": "ADMIN$, C$ and IPC$ are system defaults; leave them alone.", "task": "list the shares (cmd)", "t": "net share", "ta": ["get-smbshare"], "area": "access"}, {"id": "I-07", "title": "Scheduled tasks", "cmds": ["PS> Get-ScheduledTask | Where-Object State -ne Disabled | Select-Object TaskName,TaskPath,State", "PS> (Get-ScheduledTask -TaskName \"<name>\").Actions | Select-Object Execute,Arguments", "PS> Disable-ScheduledTask -TaskName \"<name>\" -TaskPath \"\\\"", "PS> Unregister-ScheduledTask -TaskName \"<name>\" -Confirm:$false", "CMD> schtasks /query /fo LIST /v"], "why": "Favorite persistence: a task that re-adds a user, re-opens a port, or runs a script from a user folder every five minutes.", "note": "Tasks under \\Microsoft\\Windows are mostly legit; focus on the root path.", "area": "malware"}, {"id": "I-08", "title": "Startup items and Run keys", "cmds": ["PS> Get-CimInstance Win32_StartupCommand | Select-Object Name,Command,Location,User", "PS> Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Get-ItemProperty 'HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run' -Name \"<evil>\""], "gui": "Task Manager, Startup apps.", "why": "Anything that auto-runs survives a reboot. Attackers hide here with innocent names like Windows Update Helper.", "note": "Also check the RunOnce keys and the shell:startup folders.", "area": "malware"}, {"id": "I-09", "title": "Hosts file", "cmds": ["PS> Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "GUI: notepad as admin, open the hosts file, delete every non-comment line except localhost"], "why": "Malware points update and antivirus domains at 127.0.0.1 or an attacker IP, so Defender and Windows Update silently fail.", "task": "print the hosts file", "t": "Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "ta": ["type c:\\windows\\system32\\drivers\\etc\\hosts", "cat c:\\windows\\system32\\drivers\\etc\\hosts"], "area": "config"}, {"id": "I-10", "title": "Listening ports to process", "cmds": ["CMD> netstat -abno", "PS> Get-NetTCPConnection -State Listen | Select-Object LocalAddress,LocalPort,OwningProcess | Sort-Object LocalPort", "PS> Get-Process -Id <pid> | Select-Object Name,Path", "CMD> tasklist /svc"], "why": "A port you cannot explain is a backdoor; nc.exe listeners are the classic. Map port to PID to binary path to the service or task that starts it.", "task": "show listening ports with their executables (cmd)", "t": "netstat -abno", "ta": ["netstat -ano", "netstat -abn"], "area": "config"}, {"id": "I-11", "title": "Remote Desktop hardening when RDP is required", "cmds": ["PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication -Value 1", "CMD> net localgroup \"Remote Desktop Users\"", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Remote Assistance' -Name fAllowToGetHelp -Value 0"], "why": "Network Level Authentication forces a login before a session exists, which kills pre-auth exploits. The Remote Desktop Users group is a privilege list; audit it. Remote Assistance should be off.", "area": "access"}, {"id": "I-12", "title": "Firewall allow-rule review", "cmds": ["PS> Get-NetFirewallRule | Where-Object {$_.Enabled -eq 'True' -and $_.Direction -eq 'Inbound' -and $_.Action -eq 'Allow'} | Select-Object DisplayName,Profile | Sort-Object DisplayName", "PS> Remove-NetFirewallRule -DisplayName \"<suspicious rule>\"", "PS> Set-NetFirewallProfile -All -DefaultInboundAction Block -NotifyOnListen True -LogBlocked True"], "why": "Firewall on means nothing if a rule allows the whole internet into 4444/tcp.", "area": "config"}, {"id": "I-13", "title": "Local Group Policy quick wins", "cmds": ["GUI: gpedit.msc, Computer Configuration, Administrative Templates", "  Windows Components, Windows Update, Manage end user experience: Configure Automatic Updates = Enabled (4)", "  Windows Components, AutoPlay Policies: Turn off AutoPlay = Enabled, All drives", "  Windows Components, Microsoft Defender Antivirus: Turn off Microsoft Defender Antivirus = Disabled", "CMD> gpupdate /force"], "why": "Policy beats settings. A policy that turns Defender off re-disables it after you click it on in the GUI. When a setting will not stick, check policy.", "task": "apply group policy changes now", "t": "gpupdate /force", "area": "config"}, {"id": "I-14", "title": "Event Viewer for investigations", "cmds": ["GUI: eventvwr.msc, Windows Logs, Security", "PS> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4720} | Format-List TimeCreated,Message", "  4624 logon OK, 4625 logon failed, 4720 user created, 4726 user deleted, 4732 added to local group, 4672 admin logon, 1102 log cleared, 7045 new service (System log)"], "why": "Questions like who created the account on 3 October take one filter if you know a handful of event IDs.", "area": "inv"}, {"id": "I-15", "title": "Screen lock and sign-in requirements", "cmds": ["GUI: Settings, Accounts, Sign-in options: If you've been away, when should Windows require you to sign in again = When PC wakes up from sleep", "PS> Set-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaveActive -Value 1", "PS> Set-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaverIsSecure -Value 1", "PS> Set-ItemProperty -Path 'HKCU:\\Control Panel\\Desktop' -Name ScreenSaveTimeOut -Value 600", "GUI: gpedit.msc, User Configuration, Administrative Templates, Control Panel, Personalization: Enable screen saver, Password protect the screen saver, Screen saver timeout 600"], "why": "An unlocked, unattended desktop is physical access, and physical access is everything. Ten minutes with a password is the usual policy number.", "note": "The registry values are per user (HKCU); the policy applies to everyone.", "area": "config"}, {"id": "I-16", "title": "SmartScreen, reputation-based protection, memory integrity", "cmds": ["PS> New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System' -Force | Out-Null", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\System' -Name EnableSmartScreen -Value 1 -Type DWord", "GUI: Windows Security, App and browser control, Reputation-based protection: everything On", "GUI: Windows Security, Device security, Core isolation: Memory integrity On", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard\\Scenarios\\HypervisorEnforcedCodeIntegrity' -Name Enabled -Value 1 -Type DWord"], "why": "SmartScreen blocks known-bad downloads and installers before Defender ever scans them. Memory integrity (HVCI) stops unsigned kernel drivers, which is the rootkit class.", "note": "Memory integrity may be unavailable inside a VM without nested virtualization; the toggle just will not appear.", "area": "malware"}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. Baselines from the command line, registry hardening against credential theft, persistence hunting, Defender depth, SMB signing, and version notes.", "items": [{"id": "A-01", "title": "Security policy as a file: secedit", "cmds": ["CMD> secedit /export /cfg C:\\Temp\\secpol.cfg", "  [System Access] MinimumPasswordAge = 1, MaximumPasswordAge = 60, MinimumPasswordLength = 12, PasswordComplexity = 1, PasswordHistorySize = 24, LockoutBadCount = 5, ResetLockoutCount = 30, LockoutDuration = 30, ClearTextPassword = 0, EnableGuestAccount = 0", "CMD> secedit /configure /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg /areas SECURITYPOLICY", "CMD> secedit /analyze /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg"], "why": "One file, every account policy, repeatable and auditable, and the only command-line path to complexity and reversible encryption.", "note": "A typo in the .cfg is silently ignored. Verify with net accounts.", "task": "export the local security policy to C:\\Temp\\secpol.cfg", "t": "secedit /export /cfg C:\\Temp\\secpol.cfg", "area": "config"}, {"id": "A-02", "title": "LSA and anonymous-access registry hardening", "cmds": ["PS> $lsa='HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa'", "PS> Set-ItemProperty -Path $lsa -Name LimitBlankPasswordUse -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymous -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymousSAM -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name NoLMHash -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name LmCompatibilityLevel -Value 5 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name EveryoneIncludesAnonymous -Value 0 -Type DWord"], "why": "Null-session enumeration (RestrictAnonymous), LM hash storage that cracks in seconds (NoLMHash), NTLMv1 downgrade (LmCompatibilityLevel 5).", "note": "This is the registry form of the Watchman Security Options.", "area": "config"}, {"id": "A-03", "title": "Credential-theft hardening: LLMNR, NetBIOS, WDigest", "cmds": ["PS> New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Force | Out-Null", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Name EnableMulticast -Value 0 -Type DWord", "PS> Get-CimInstance Win32_NetworkAdapterConfiguration -Filter \"IPEnabled=TRUE\" | Invoke-CimMethod -MethodName SetTcpipNetbios -Arguments @{TcpipNetbiosOptions=2}", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\WDigest' -Name UseLogonCredential -Value 0 -Type DWord"], "why": "LLMNR and NBT-NS are what Responder poisons to collect NTLMv2 hashes for cracking or relay. WDigest set to 1 keeps plaintext passwords in LSASS memory for mimikatz.", "area": "config"}, {"id": "A-04", "title": "AutoRun and AutoPlay off everywhere", "cmds": ["PS> New-Item -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Force | Out-Null", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoDriveTypeAutoRun -Value 255 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoAutorun -Value 1 -Type DWord"], "why": "USB-drop attacks. Conficker-era, still a CIS and STIG requirement.", "area": "malware"}, {"id": "A-05", "title": "User Rights Assignment", "cmds": ["GUI: secpol.msc, Local Policies, User Rights Assignment", "  Access this computer from the network = Administrators, Authenticated Users (remove Everyone and Guest)", "  Deny log on through Remote Desktop Services = Guest", "  Deny access to this computer from the network = Guest", "  Debug programs = empty, or Administrators only", "  Act as part of the operating system = empty", "  Allow log on locally = Administrators, Users", "CMD> whoami /priv"], "why": "Debug programs means read LSASS means dump every password. Rights are privileges that bypass ACLs, and attackers plant extra principals here.", "task": "show the privileges of the current user", "t": "whoami /priv", "area": "access"}, {"id": "A-06", "title": "Deep persistence and backdoor hunt", "cmds": ["PS> Get-CimInstance Win32_Process | Select-Object Name,ProcessId,ParentProcessId,CommandLine | Sort-Object Name", "PS> Get-ChildItem C:\\ -Recurse -Include nc.exe,ncat.exe,netcat*,mimikatz*,psexec*,*.ps1,*.vbs -ErrorAction SilentlyContinue | Select-Object FullName,LastWriteTime", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventFilter", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventConsumer", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __FilterToConsumerBinding", "PS> $PROFILE | Select-Object *; Get-Content $PROFILE.AllUsersAllHosts -ErrorAction SilentlyContinue", "CMD> autorunsc.exe -accepteula -a * -c -nobanner   (Sysinternals, public)"], "why": "WMI event subscriptions and PowerShell profiles are the persistence spots checklists miss. Autoruns shows every auto-start location at once.", "note": "Download Sysinternals tools only from Microsoft (learn.microsoft.com/sysinternals), and only where policy allows third-party tools on the machine.", "area": "malware"}, {"id": "A-07", "title": "NTFS permissions", "cmds": ["CMD> icacls \"C:\\CompanyData\"", "CMD> icacls \"C:\\CompanyData\" /inheritance:r /grant:r \"Administrators:(OI)(CI)F\" \"Users:(OI)(CI)RX\" /t", "CMD> icacls \"C:\\CompanyData\" /remove:g Everyone /t", "PS> Get-Acl \"C:\\CompanyData\" | Format-List"], "why": "Everyone with Full control on a share or a Program Files folder means anyone can replace a binary that a service runs as SYSTEM. (OI) object inherit, (CI) container inherit, /t recurse, /inheritance:r stop inheriting.", "task": "show the ACL of C:\\CompanyData (cmd)", "t": "icacls C:\\CompanyData", "ta": ["icacls \"c:\\companydata\"", "get-acl c:\\companydata"], "area": "access"}, {"id": "A-08", "title": "Fine-grained auditing and PowerShell logging", "cmds": ["CMD> auditpol /set /subcategory:\"Logon\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Account Lockout\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"User Account Management\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Security Group Management\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Process Creation\" /success:enable", "CMD> auditpol /set /subcategory:\"Audit Policy Change\" /success:enable /failure:enable", "PS> New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Force | Out-Null", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Name EnableScriptBlockLogging -Value 1 -Type DWord"], "why": "Subcategory auditing overrides the legacy nine categories. Script Block Logging (event 4104) records what every PowerShell script actually did, including the attacker's.", "area": "audit"}, {"id": "A-09", "title": "Defender beyond on: exclusions, PUA, cloud, ASR", "cmds": ["PS> Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension", "PS> Remove-MpPreference -ExclusionPath \"C:\\evil\"", "PS> Set-MpPreference -PUAProtection Enabled -MAPSReporting Advanced -SubmitSamplesConsent SendAllSamples", "PS> Add-MpPreference -AttackSurfaceReductionRules_Ids 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2 -AttackSurfaceReductionRules_Actions Enabled", "PS> Get-MpThreatDetection | Select-Object DomainUser,ProcessName,InitialDetectionTime", "PS> Set-MpPreference -EnableControlledFolderAccess Enabled -EnableNetworkProtection Enabled"], "why": "Attackers rarely turn Defender off, too obvious. They exclude their folder. PUA protection catches junkware; the LSASS rule blocks the mimikatz class of attacks. Controlled folder access stops ransomware from rewriting Documents; network protection blocks known-bad domains.", "task": "list Defender exclusions", "t": "Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension", "ta": ["get-mppreference | select exclusionpath,exclusionprocess,exclusionextension", "get-mppreference"], "area": "malware"}, {"id": "A-10", "title": "Optional capabilities: OpenSSH Server and friends", "cmds": ["PS> Get-WindowsCapability -Online | Where-Object State -eq Installed | Select-Object Name", "PS> Get-Service sshd -ErrorAction SilentlyContinue | Select-Object Status,StartType", "PS> Remove-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0", "PS> Get-Content C:\\ProgramData\\ssh\\sshd_config"], "why": "Windows 11 ships OpenSSH Server as an installable capability. An attacker (or a careless admin) can switch it on as a second door that the firewall rule for port 22 quietly allows.", "note": "If the brief requires SSH, keep it and harden C:\\ProgramData\\ssh\\sshd_config (PasswordAuthentication, AllowUsers, no empty passwords), then restart the sshd service.", "task": "list installed Windows capabilities", "t": "Get-WindowsCapability -Online | Where-Object State -eq Installed | Select-Object Name", "ta": ["get-windowscapability -online | where state -eq installed"], "area": "config"}, {"id": "A-11", "title": "SMB signing and encryption", "cmds": ["PS> Set-SmbServerConfiguration -RequireSecuritySignature $true -EncryptData $true -Force", "PS> Set-SmbClientConfiguration -RequireSecuritySignature $true -Force", "PS> Get-SmbServerConfiguration | Select-Object EnableSMB1Protocol,RequireSecuritySignature,EncryptData", "PS> Get-SmbClientConfiguration | Select-Object RequireSecuritySignature,EnableInsecureGuestLogons"], "why": "Required signing kills NTLM relay, the attack that turns one weak host into domain admin.", "area": "config", "note": "Read the current values before assuming: defaults differ by release and edition (see Version notes). RequireSecuritySignature False or EnableInsecureGuestLogons True on a Pro or Enterprise machine is a finding to explain."}, {"id": "A-12", "title": "Verify, document, re-check", "cmds": ["CMD> gpresult /r", "CMD> net accounts", "PS> Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusSignatureLastUpdated", "PS> Get-NetFirewallProfile | Select-Object Name,Enabled", "PS> Get-LocalGroupMember Administrators", "CMD> netstat -abno"], "why": "A change log of what, when and why is how you reverse a change that broke something in thirty seconds instead of thirty minutes, and it is exactly how real incident response works.", "task": "show the applied group policy for this computer and user", "t": "gpresult /r"}, {"id": "A-13", "title": "Version notes: Windows 11 26H2", "cmds": ["  This page targets Windows 11 26H2 (the 24H2 core). Several defaults changed in recent releases: read the current value instead of assuming.", "  Account lockout: installs since 22H2 apply a lockout policy at setup (KB5020282; Microsoft recommends 10 attempts and 10 minutes), so Lockout threshold Never means someone turned it off", "  SMB: since 24H2, Pro, Enterprise and Education require SMB signing in both directions, and Pro blocks insecure guest logons; Home edition does not require signing", "  Removed since 24H2: Microsoft Defender Application Guard (and its WDAGUtilityAccount), WMIC (use Get-CimInstance), Windows PowerShell 2.0, NTLMv1", "  Home edition: no lusrmgr.msc, secpol.msc or gpedit.msc; use Settings, net user, net accounts"], "why": "Every other item on this page is written to hold across releases; what changed lives here, so a normal default is not mistaken for a finding and a changed default is not mistaken for a fix."}]}], "spot": [{"lvl": 0, "ask": "Output of net accounts. Tap the line that is the finding.", "lines": ["Minimum password length:                 12", "Maximum password age (days):             60", "Lockout threshold:                       Never", "Length of password history maintained:   5"], "finding": 2, "why": "Lockout threshold Never means unlimited password guesses. Set it to 5 with net accounts /lockoutthreshold:5."}, {"lvl": 0, "ask": "Get-NetFirewallProfile output. Tap the finding.", "lines": ["Domain    True", "Private   True", "Public    False",   const R=S.run;const items=allItems.filter(i=>i.li===S.level||(R.lower&&i.li<S.level));
  const remain=Math.max(0,R.mins*60-R.elapsed);
  const rows=items.map(i=>'<div class="chk '+(R.done[i.id]!=null?'done':'')+'"><input type="checkbox" data-done="'+i.id+'" '+(R.done[i.id]!=null?'checked':'')+' aria-label="Done: '+esc(i.title)+'"><div><div class="t"><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span>'+(R.done[i.id]!=null?'<span class="stamp">'+fmt(R.done[i.id])+'</span>':'')+'<button class="btn small" data-show="'+i.id+'">Commands</button></div><div id="show-'+i.id+'"'+(OPEN.has(i.id)?'':' hidden')+'>'+termBlock(i.cmds,true)+'</div><input class="note" data-note="'+i.id+'" placeholder="Change log: what you changed and why" value="'+esc(R.notes[i.id]||'')+'"></div></div>').join('');
  return '<h2>Run the checklist on your VM</h2><p class="lead">Set the clock, work the list top to bottom, tick each item when it is actually done on the machine, and write a one-line change log. The log is what lets you undo a change that broke something in thirty seconds.</p>'
   +'<div class="timer"><div class="clock" aria-live="off">'+fmt(remain)+'</div><select data-mins>'+[20,45,60,90,120].map(m=>'<option value="'+m+'" '+(m===R.mins?'selected':'')+'>'+m+' min</option>').join('')+'</select><button class="btn primary" data-act="timer">'+(tick?'Pause':'Start')+'</button><button class="btn" data-act="resetclock">Reset clock</button><label class="toggle"><input type="checkbox" data-lower '+(R.lower?'checked':'')+'> include lower levels</label></div>'
   +'<div class="nav" style="margin:0 0 10px"><button class="btn small" data-act="copylog">Copy change log</button><button class="btn small" data-act="dlog">Download change log</button><button class="btn small" data-act="clearrun">Clear this run</button></div>'
   +rows;
}
function changeLog(){const R=S.run;const lines=allItems.filter(i=>R.done[i.id]!=null||R.notes[i.id]).sort((a,b)=>(R.done[a.id]??1e9)-(R.done[b.id]??1e9)).map(i=>'['+(R.done[i.id]!=null?fmt(R.done[i.id]):'--:--')+'] '+i.id+' '+i.title+(R.notes[i.id]?' -- '+R.notes[i.id]:''));
  return '# Change log - '+APP.os+' - '+new Date().toLocaleString()+'\n'+(lines.join('\n')||'(nothing logged yet)')+'\n';}
function startTimer(){if(tick)return;tick=setInterval(()=>{S.run.elapsed++;if(S.run.elapsed%5===0)save();const c=document.querySelector('.clock');if(c)c.textContent=fmt(Math.max(0,S.run.mins*60-S.run.elapsed));if(S.run.elapsed>=S.run.mins*60){stopTimer();render();}},1000);}
function stopTimer(){clearInterval(tick);tick=null;save();}
/* games */
let G={tab:'imposter',sc:0,picks:{},checked:false,jq:null,streak:0,jfb:null};
function renderGames(){
  const tabs='<div class="tabs"><button class="btn '+(G.tab==='imposter'?'primary':'')+'" data-gtab="imposter">Who is the imposter?</button><button class="btn '+(G.tab==='judge'?'primary':'')+'" data-gtab="judge">Fix or break?</button></div>';
  if(G.tab==='imposter'){const sc=APP.imposter[G.sc];
    const rows=sc.accounts.map((a,i)=>{const p=G.picks[i]||'keep';const cls=G.checked?(p===a.truth?'ok':'bad'):'';return '<div class="acct '+cls+'"><div class="n">'+esc(a.name)+'<small>'+esc(a.info)+'</small></div><div class="seg">'+['keep','remove'].concat(a.admin?['demote']:[]).map(k=>'<button data-pick="'+i+'" data-val="'+k+'" class="'+(p===k?'on':'')+'" '+(G.checked?'disabled':'')+'>'+({keep:'Keep',remove:'Remove',demote:'Demote'})[k]+'</button>').join('')+'</div></div>'+(G.checked&&p!==a.truth?'<div class="fb bad">'+esc(a.why)+'</div>':'');}).join('');
    const right=G.checked?sc.accounts.filter((a,i)=>(G.picks[i]||'keep')===a.truth).length:0;
    return tabs+'<h2>'+esc(sc.title)+'</h2><p class="lead">Read the scenario brief, then decide for every account: keep it, remove it, or demote it from admin. The brief is the documented source of truth; when it is unclear, ask the system owner before you delete anything.</p><div class="brief"><b>Scenario brief</b><ul>'+sc.brief.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>'+termBlock(sc.output,false)+rows
      +(G.checked?'<div class="fb '+(right===sc.accounts.length?'ok':'bad')+'" style="max-width:720px">'+right+' of '+sc.accounts.length+' correct. '+esc(sc.debrief)+'</div>':'')+'<div class="nav"><button class="btn primary" data-act="'+(G.checked?'nextsc':'checksc')+'">'+(G.checked?'Next scenario':'Check my calls')+'</button></div>';
  }
  if(!G.jq){G.jq=shuffle(APP.judge.slice());}const j=G.jq[0];
  const fb=G.jfb?'<div class="fb '+(G.jfb.ok?'ok':'bad')+'"><b>'+(G.jfb.ok?'Right.':'Not this time.')+'</b> '+esc(j.why)+'</div><button class="btn primary" data-act="jnext">Next</button>':'';
  return tabs+'<div class="q"><div class="streak">streak '+G.streak+'</div><h2>Fix or break?</h2><div class="brief"><b>Scenario brief says:</b> '+esc(j.brief)+'</div><p><b>You do this:</b> '+esc(j.action)+'</p><div class="opts">'+['fix','penalty','check'].map((k,i)=>'<button data-jopt="'+k+'" class="'+(G.jfb?(k===j.answer?'ok':(G.jfb.pick===k?'bad':'')):'')+'" '+(G.jfb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>'+fb+'</div>';
}
/* report */
function renderReport(){
  const lv=APP.levels.map((L,i)=>{const b=badge(i);return '<div class="lv"><div class="row"><span>'+(b.earned?L.badge+' ':'')+esc(L.name)+'</span><span class="mono">'+b.learned+'/'+b.total+' learned · best '+(b.best||0)+'%</span></div><div class="bar2 '+(b.earned?'earned':'')+'"><i style="width:'+Math.round(100*b.learned/b.total)+'%"></i></div></div>';}).join('');
  const rows=allItems.map(i=>{const st=status(i);const g={mastered:'✓',learned:'◐',drilled:'◔',none:'·'}[st];return '<div class="rr '+st+'" data-rr="'+i.id+'"><span class="g">'+g+'</span><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span><span class="pt">'+itemScore(i)+'</span></div>';}).join('');
  return '<h2>Progress report</h2>'+lv+'<p style="font-size:.8rem;color:var(--muted)">✓ learned and drilled · ◐ learned · ◔ drilled only</p>'+rows+'<div class="total"><span>Total</span><span>'+score()+' / '+maxScore+'</span></div>';
}
function renderFoot(){$('#foot').innerHTML=esc(APP.footer||'Training tool for virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist.')+' <button data-act="reset">Reset my progress</button>';}
function render(){
  if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches)S.mode='learn';
  renderHeader();
  const v=$('#view');const m=S.mode;
  v.innerHTML=m==='learn'?renderLearn():m==='drill'?renderDrill():m==='run'?renderRun():m==='games'?renderGames():'';
  $('#report').innerHTML=renderReport();renderFoot();
  if(m==='drill'&&Q&&!Q.finished&&!Q.fb){const t=v.querySelector('.typein');if(t)t.focus();}
  if(m==='learn'){const on=v.querySelector('.list button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
}
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.level!=null){S.level=+d.level;if(S.mode==='drill'&&Q&&Q.li!==S.level)Q=null;save();render();return;}
  if(d.mode){S.mode=d.mode;save();render();return;}
  if(d.modeGo){S.mode=d.modeGo;save();render();return;}
  if(d.sel){S.sel[S.level]=d.sel;save();render();return;}
  if(d.step){const L=APP.levels[S.level];const cur=S.sel[S.level]||L.items[0].id;const i=L.items.findIndex(x=>x.id===cur)+(+d.step);if(L.items[i]){S.sel[S.level]=L.items[i].id;save();render();}return;}
  if(d.act==='copy'){const term=b.closest('.term');const lines=[...term.querySelectorAll('.ln:not(.c)')].map(n=>n.textContent.replace(PRE,'')).filter(l=>l.trim()).join('\n');copyText(lines,b);return;}
  if(d.act==='startq'){Q=makeQuiz(S.level);render();return;}
  if(d.opt!=null&&S.mode==='drill'&&Q&&!Q.fb){answer(+d.opt);render();return;}
  if(d.act==='check'){const t=$('.typein');answer(null,t?t.value:'');render();return;}
  if(d.act==='skip'){answer(null,'');render();return;}
  if(d.act==='next'){if(Q.i===Q.qs.length-1){$('#view').innerHTML=finishQuiz();renderHeader();$('#report').innerHTML=renderReport();}else{Q.i++;Q.fb=null;render();}return;}
  if(d.act==='timer'){tick?stopTimer():startTimer();render();return;}
  if(d.act==='resetclock'){stopTimer();S.run.elapsed=0;save();render();return;}
  if(d.act==='clearrun'){if(confirm('Clear all ticks, timestamps and notes for this run?')){stopTimer();S.run.done={};S.run.notes={};S.run.elapsed=0;save();render();}return;}
  if(d.act==='copylog'){copyText(changeLog(),b);return;}
  if(d.act==='dlog'){const blob=new Blob([changeLog()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='change-log-'+APP.key+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}
  if(d.show){const el=document.getElementById('show-'+d.show);if(el){el.hidden=!el.hidden;if(el.hidden)OPEN.delete(d.show);else OPEN.add(d.show);}return;}
  if(d.gtab){G.tab=d.gtab;G.jfb=null;render();return;}
  if(d.pick!=null&&!G.checked){G.picks[d.pick]=d.val;render();return;}
  if(d.act==='checksc'){G.checked=true;render();return;}
  if(d.act==='nextsc'){G.sc=(G.sc+1)%APP.imposter.length;G.picks={};G.checked=false;render();return;}
  if(d.jopt&&!G.jfb){const j=G.jq[0];const ok=d.jopt===j.answer;G.streak=ok?G.streak+1:0;G.jfb={ok,pick:d.jopt};render();return;}
  if(d.act==='jnext'){G.jq.push(G.jq.shift());G.jfb=null;render();return;}
  if(d.act==='reset'){if(confirm('Erase all progress for this trainer on this browser?')){stopTimer();S=defaults();save();Q=null;render();}return;}
  if(b.id==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();renderHeader();return;}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.learn){const was=status(byId[d.learn]);S.learned[d.learn]=e.target.checked;if(!e.target.checked)delete S.learned[d.learn];save();render();const now=status(byId[d.learn]);if(now==='mastered'&&was!=='mastered'){const r=document.querySelector('[data-rr="'+d.learn+'"]');if(r)r.classList.add('flip');}return;}
  if(d.done){if(e.target.checked)S.run.done[d.done]=S.run.elapsed;else delete S.run.done[d.done];save();render();return;}
  if(d.mins!=null){S.run.mins=+e.target.value;S.run.elapsed=0;save();render();return;}
  if(d.lower!=null){S.run.lower=e.target.checked;save();render();return;}
});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.explain){S.explain[d.explain]=e.target.value;save();return;}
  if(d.note){S.run.notes[d.note]=e.target.value;save();return;}
});
window.addEventListener('resize',()=>{if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches){S.mode='learn';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('typein')&&Q&&!Q.fb){answer(null,e.target.value);render();}});
render();
})();
</script>
