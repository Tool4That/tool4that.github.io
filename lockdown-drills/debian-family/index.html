<footer id="foot"></footer>
<script>
const APP = {"key": "debian-family", "os": {"u": "Ubuntu 24.04 LTS (GNOME)", "m": "Linux Mint 22.3 (Cinnamon)"}, "distros": [["u", "Ubuntu"], ["m", "Linux Mint"]], "accent": "#772953", "footer": "Training tool for Ubuntu and Linux Mint systems you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial training, independent of and unendorsed by the makers of the systems it names.", "practice": {"lead": "Practice hands-on in the", "label": "Linux Range", "href": "https://freeapp4that.store/lockdown-range/linux/"}, "levels": [{"name": "Doorman", "badge": "🚪", "blurb": {"u": "Lock the doors. Users, admins, passwords, lockout, firewall, updates, snaps and junk software, obvious services, GDM auto-login and screen lock.", "m": "Lock the doors. Users, admins, passwords, lockout, firewall, updates, junk software, obvious services, the Login Window. Mint is Ubuntu LTS underneath (see Version notes), with its own GUI tools on top."}, "learn": ["#sophomore/s3", "Defense Ladder s3, Debian-family hardening"], "items": [{"id": "B-00", "title": "Scenario brief and evidence first", "cmds": ["GUI: open the scenario brief (the documented requirements for this machine) and write down authorized users, admins, required services, and anything forbidden", {"m": "$ sudo timeshift --create --comments \"before hardening\"   (practice VMs)"}, "$ mkdir -p ~/audit/day1 && cd ~/audit/day1 && touch changes.txt && pwd   (one folder for evidence and backups; log each change with what, why, and how to undo it)", "$ chmod 700 ~/audit && script -a session.log   (makes ~/audit a folder only you can read, then records this terminal into session.log, added to its end; exit stops the recording)", "$ type -a sudo passwd su; alias; trap -p   (before your next password: each name should resolve under /usr/bin, /usr/sbin, /bin, or /sbin, aliases should be stock ones such as ls and grep, and trap -p should print nothing; anything else can capture what you type)", "$ sudo cp -a /etc/login.defs /etc/login.defs.bak   (copy each file before you edit it; -a keeps the owner, mode, and time)", "$ sudo rsync -a /home/ /mnt/backup/home/   (copies the home folders to a mounted backup drive; a backup counts once a test restore works)", "$ man login.defs   (the manual for a command or a config file; / searches, n finds the next match, q quits)"], "why": "Authorized users, admins, and required services decide what is a fix and what breaks the business. Evidence first: answer the investigation questions before any change (Defense Ladder f1).", "note": {"u": "Unfamiliar differs from unauthorized: trace and ask before removing agents (Defense Ladder s1). Before PAM, sudoers, or SSH edits, keep a root shell (sudo -i) open to fix lockout typos.", "m": "Unfamiliar differs from unauthorized: trace and ask before removing agents (Defense Ladder s1). PAM, sudoers, or SSH typos lock you out: keep a root terminal (sudo -i) open."}, "also": {"u": "Start B-08's upgrade now in another terminal. B-05 and B-09 wait for its apt lock, so do the apt-free items first and read its result near the end.", "m": "Snapshot practice VMs first (Mint's free undo). Start B-08's upgrade now in another terminal; check it near the end. Do apt-free items while B-05 and B-09 wait for apt's lock."}, "area": "inv"}, {"id": "B-01", "title": "List human users, admins, and UID-0 accounts", "cmds": ["$ awk -F: '$3>=1000 && $3<65534 {print $1\" uid=\"$3\" shell=\"$7}' /etc/passwd", "$ awk -F: '$3==0 {print $1}' /etc/passwd", "$ getent group sudo admin adm wheel docker lxd disk", "$ awk -F: -v g=\"$(getent group sudo | cut -d: -f3)\" '$4==g {print $1\" has sudo as its primary group\"}' /etc/passwd", "$ whoami; id   (the account you work as, and its groups, before you judge anyone else's)", "$ loginctl list-sessions   (every session systemd-logind tracks, including ones that who leaves out, such as an SSH command run without a terminal)"], "why": "An extra UID-0 user is a second root. Members of sudo (or wheel) and admin (default sudoers grants %admin) hold root-level power; adm members read logs.", "note": "A user whose primary group is sudo (/etc/passwd field 4) holds admin rights yet hides from getent group sudo.", "also": "Treat docker, lxd, and disk members as root too: they can mount the host filesystem or read raw disks.", "task": "show who is in the sudo group", "t": "getent group sudo", "ta": ["grep sudo /etc/group", "grep ^sudo /etc/group"], "gui": {"u": "Settings, System, Users (Unlock first).", "m": "Menu, Administration, Users and Groups."}, "area": "acct"}, {"id": "B-02", "title": "Remove or disable an unauthorized user", "cmds": ["$ id -u baduser                             (0 means a hidden root: skip the next two lines and follow the NOTE)", "$ sudo usermod -L -e 1 baduser; ps -o pid,unit,cmd -u baduser", "$ sudo loginctl disable-linger baduser; sudo loginctl terminate-user baduser; sudo pkill -KILL -u baduser; pgrep -u baduser", "$ sudo deluser --remove-home baduser", "$ sudo mkdir -p /root/removed-users && sudo deluser --remove-home --backup-to /root/removed-users baduser", "$ sudo userdel -r baduser", "$ sudo usermod -L -e 1 baduser && sudo usermod -s /usr/sbin/nologin baduser"], "why": "--remove-home clears planted files, deluser drops the crontab userdel leaves, and --backup-to keeps a root-only copy of the home as evidence. Lock, expiry, and nologin disable without destroying evidence: -e 1 stops SSH key sign-in, which -L alone leaves working.", "note": "The brief decides between delete and disable. Lock first, end the processes, then delete: when pgrep -u prints nothing, the account is idle. A service that runs as the user restarts its processes until you stop the unit ps names (sudo systemctl disable --now <unit>). When id -u prints 0 the account is a hidden root: pkill -u on it ends every root process and deluser refuses it, so read its home (field 6 of getent passwd) and remove it with sudo userdel -f <name>, adding -r only when that home is its own.", "task": "delete baduser and their home directory (Debian style)", "t": "sudo deluser --remove-home baduser", "ta": ["sudo userdel -r baduser", "deluser --remove-home baduser", "userdel -r baduser"], "area": "acct"}, {"id": "B-03", "title": "Fix admin group membership", "cmds": ["$ sudo gpasswd -d ikaika sudo", "$ sudo loginctl terminate-user ikaika      (ends the open sessions, which keep the old groups)", "$ sudo usermod -aG sudo keoni", "$ groups keoni", "$ sudo adduser keola   (when the brief lists an account this machine lacks: it sets a password and creates the home; the low-level form is sudo useradd -m -s /bin/bash keola, then sudo passwd keola)", "$ sudo addgroup yearbook && sudo gpasswd -M malia,keola yearbook   (when the brief names a group and its members; -M sets the whole member list)"], "why": "Least privilege. -aG appends; -G alone replaces existing groups. Open sessions keep their starting groups: removed admins keep sudo until each session ends; new members gain it at next sign-in.", "task": "remove ikaika from the sudo group", "t": "sudo gpasswd -d ikaika sudo", "ta": ["gpasswd -d ikaika sudo", "sudo deluser ikaika sudo", "deluser ikaika sudo"], "gui": {"u": "Settings, System, Users: Administrator toggle (adds or removes the sudo group).", "m": "Users and Groups: Account Type Standard or Administrator (Administrator = sudo group); the Groups row opens a tick list of every other group."}, "area": "acct"}, {"id": "B-04", "title": "Passwords: strong, forced change, no empties, root locked", "cmds": ["$ sudo passwd keoni", "$ sudo chage -d 0 keoni", "$ awk -F: '$3>=1000 && $3<65534 {print $1}' /etc/passwd | grep -vx \"${SUDO_USER:-$USER}\" | xargs -r -n1 sudo chage -d 0     (every human account except yours)", "$ sudo awk -F: '$2==\"\" {print $1\" HAS NO PASSWORD\"}' /etc/shadow", "$ awk -F: '$2!=\"x\" {print $1\" has something other than x in /etc/passwd field 2\"}' /etc/passwd", {"m": "$ getent group nopasswdlogin; sudo gpasswd -d <user> nopasswdlogin"}, "$ sudo passwd -l root", "$ sudo passwd -S root                      (expect: root L)"], "why": {"u": "Empty field 2 in /etc/shadow or /etc/passwd means Enter logs in; pam_unix reads /etc/shadow only when /etc/passwd holds x (fix: sudo pwconv, which carries an empty field into /etc/shadow, then sudo passwd <user> or sudo passwd -l <user>). Locked root forces accountable sudo over shared passwords.", "m": "An empty /etc/shadow password or /etc/passwd field 2 means sign-in with Enter; sudo pwconv moves field 2, even an empty one, into /etc/shadow, so follow it with sudo passwd <user> or sudo passwd -l <user>. Locked root forces accountable sudo over a shared root password."}, "note": "Record changed passwords safely (on paper, in a lab). Keep your own sign-in password unless the brief says otherwise; leave service and key-only accounts out of the bulk chage line.", "also": {"m": "Mint's login screen signs in every nopasswdlogin member without a password, and passwd leaves that membership in place, so check the group."}, "task": "force keoni to choose a new password at next login", "t": "sudo chage -d 0 keoni", "ta": ["chage -d 0 keoni", "sudo passwd -e keoni", "passwd -e keoni"], "area": "acct"}, {"id": "B-05", "title": "Password aging and quality", "cmds": ["$ sudo sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS\\t60/' /etc/login.defs", "$ sudo sed -i 's/^PASS_MIN_DAYS.*/PASS_MIN_DAYS\\t1/' /etc/login.defs", "$ sudo sed -i 's/^PASS_WARN_AGE.*/PASS_WARN_AGE\\t7/' /etc/login.defs", "$ sudo sed -i 's/^UMASK.*/UMASK\\t\\t027/' /etc/login.defs", "$ diff /etc/login.defs.bak /etc/login.defs   (compares the B-00 copy with your edit: < marks the old lines, > the new ones)", "$ sudo chage -M 60 -m 1 -W 7 keoni", "$ for u in $(awk -F: '$3>=1000 && $3<=60000 {print $1}' /etc/passwd); do sudo chage -M 60 -m 1 -W 7 \"$u\"; done", "$ sudo passwd -S -a                         (min, max, and warn for every account)", "$ sudo apt install -y libpam-pwquality", "$ sudo nano /etc/security/pwquality.conf", "  minlen = 12  difok = 3  maxrepeat = 3  enforce_for_root", "  dcredit = -1  ucredit = -1  lcredit = -1  ocredit = -1   (only when the brief's policy asks for character classes)", "$ sudo nano /etc/pam.d/common-password", "  password  requisite  pam_pwquality.so retry=3        (ensure present)", "  ... pam_unix.so ... remember=5                       (add to the pam_unix line)", "$ grep -n pam_pwquality /etc/pam.d/common-password", "$ sudo apt install -y libpwquality-tools && printf 'Summer2026\\n' | pwscore"], "why": "login.defs covers only new users; chage (or the loop) sets existing ones. UMASK sets the starting permissions of new files through pam_umask; with a private group per user (USERGROUPS_ENAB yes) users see 0007. pwquality enforces complexity at each change, and remember= blocks reuse. Confirm with pwscore, which tests a password without changing one.", "note": "The scenario brief sets the numbers; these commands show one sample brief. A widely used hardening baseline asks for a minlen of 14 or more, a history of 24 or more, a maximum age of 365 days or fewer, a minimum age of 1 day or more, and a UMASK of 027 or stricter; Defense Ladder s2 compares two published password rule sets, and s3 applies them on Linux. Leave obscure in place. Numbers on the pam_pwquality.so line override pwquality.conf, so keep them in the conf file and leave the PAM line at retry=3. Install libpam-pwquality before any hand edit to a common-* file (B-06): after one, pam-auth-update stops updating those files while apt still reports success, so the grep is the proof. Open a root shell before the loop: an account whose last change is older than the new maximum must change its password at its next sign-in, yours included.", "task": "set keoni: max age 60, min age 1, warn 7", "t": "sudo chage -M 60 -m 1 -W 7 keoni", "ta": ["chage -M 60 -m 1 -W 7 keoni"], "area": "acct"}, {"id": "B-06", "title": "Account lockout with pam_faillock", "cmds": ["$ sudo nano /etc/security/faillock.conf", "  deny = 5   unlock_time = 1800   fail_interval = 900   audit", "$ sudo nano /etc/pam.d/common-auth          (order matters)", "  auth  required                   pam_faillock.so preauth silent", "  auth  [success=1 default=ignore] pam_unix.so            (existing line: set success=1, remove nullok)", "  auth  [default=die]              pam_faillock.so authfail", "  auth  sufficient                 pam_faillock.so authsucc", "$ sudo nano /etc/pam.d/common-account       (add first)", "  account required pam_faillock.so", "$ su - keoni   (the lockout test, in a second terminal while your root shell stays open: each wrong password raises the count sudo faillock --user keoni shows)", "$ sudo faillock --user keoni", "$ sudo faillock --user keoni --reset"], "why": "Stops online brute force. pam_faillock replaced pam_tally2, which current Ubuntu, Mint, and Debian releases have dropped. nullok allows empty passwords. faillock.conf holds the numbers; locking starts only once the PAM lines are in place, and numbers written on a PAM line override the file. Confirm with sudo faillock --user NAME after failed tries.", "note": "Test with su - keoni in a second terminal before closing your root shell. Set the pam_unix line to [success=1 default=ignore] whatever number it had: some installs (Ubuntu desktop among them) ship [success=2] because a pam_sss line follows, and a 2 left in place sends every correct password past authsucc to pam_deny. unlock_time = 0 keeps a lock until sudo faillock --user NAME --reset or a reboot (the records live in /run/faillock); root stays exempt unless even_deny_root is set. Hand-added lines make pam-auth-update treat common-auth as locally modified; Hunter A-09 shows the managed route. On a desktop, the sufficient authsucc line ends the sign-in stack before pam_gnome_keyring runs, so the login keyring stays locked; the account line in common-account also resets the count, and A-09's managed route relies on it alone.", "task": "show keoni's failed-login counter", "t": "sudo faillock --user keoni", "ta": ["faillock --user keoni"], "area": "acct"}, {"id": "B-07", "title": "Firewall with ufw", "cmds": ["$ sudo apt install -y ufw", "$ command -v ufw   (prints where ufw runs from: expect /usr/sbin/ufw; a copy in /usr/local/sbin runs first and needs an explanation; Debian leaves /usr/sbin out of a normal user's PATH, so there run sudo sh -c 'command -v ufw')", "$ sudo ufw default deny incoming", "$ sudo ufw default allow outgoing", "$ sudo ufw allow 22/tcp", "$ sudo systemd-run --on-active=120 ufw disable   (only when you work over SSH, before you enable ufw: a timed undo that turns ufw off in 120 seconds, even if this session drops; once a second SSH session gets in, sudo systemctl stop run-NAME.timer, with the name it printed, cancels it; at the console, skip this line)", "$ sudo ufw enable", "$ sudo ufw logging on", "$ sudo ufw status verbose"], "why": "Default-deny inbound covers the service you have not found yet.", "note": "Only allow 22/tcp if the brief requires SSH. Add rules for required services (80/tcp, 443/tcp, 21/tcp).", "task": "turn the firewall on", "t": "sudo ufw enable", "ta": ["ufw enable"], "gui": {"m": "Menu, Preferences, Firewall Configuration (gufw): Status On, Incoming Deny, Outgoing Allow."}, "area": "config"}, {"id": "B-08", "title": {"u": "Updates: now and automatic", "m": "Updates: now and automatic (Update Manager)"}, "cmds": [{"m": "GUI: Update Manager (shield icon), Refresh, Select All, Install Updates"}, {"m": "GUI: Update Manager, Edit, Preferences, Automation: Apply updates automatically On, Remove obsolete kernels On; Other Updates: Update Flatpaks automatically On"}, {"m": "$ sudo mintupdate-cli upgrade -r -y --keep-configuration"}, {"m": "$ sudo mintupdate-automation upgrade enable   (the terminal form of Update Manager's Automation switch; systemctl is-enabled mintupdate-automation-upgrade.timer then reads enabled)"}, {"m": "$ systemctl is-enabled mintupdate-automation-upgrade.timer; test -e /var/lib/linuxmint/mintupdate-automatic-upgrades-enabled && echo flag-on"}, {"m": "$ grep -qx -- '--keep-configuration' /etc/mintupdate-automatic-upgrades.conf 2>/dev/null || echo '--keep-configuration' | sudo tee -a /etc/mintupdate-automatic-upgrades.conf"}, "$ sudo apt update && sudo apt upgrade -y", "$ apt list --upgradable", {"u": "$ sudo apt full-upgrade                     (when upgrade lists packages kept back; read the REMOVED list)"}, "$ uname -r   (the running kernel; after a kernel update, the new version runs once you reboot)", "$ sudo needrestart -r l   (after the upgrade, lists each service still running old code and restarts none itself: restart those; where it is missing, sudo apt install needrestart)", {"u": "$ sudo snap refresh"}, {"u": "$ snap list; apt-mark showhold              (held in the Notes column, or a held package, freezes updates)"}, {"u": "$ sudo snap refresh --unhold <name>; sudo apt-mark unhold <package>"}, {"u": "$ apt-config dump | grep -E '^APT::Periodic::(Update-Package-Lists|Unattended-Upgrade) '"}, {"u": "  APT::Periodic::Update-Package-Lists \"1\";   APT::Periodic::Unattended-Upgrade \"1\";"}, {"u": "$ systemctl is-enabled apt-daily.timer apt-daily-upgrade.timer"}, {"u": "$ sudo apt install -y unattended-upgrades && sudo dpkg-reconfigure -plow unattended-upgrades"}, {"u": "$ sudo unattended-upgrade --dry-run -d 2>&1 | grep 'Allowed origins'     (expect an Ubuntu noble-security origin)"}, {"u": "GUI: Software and Updates, Updates: Automatically check for updates Daily; When there are security updates: Download and install automatically"}, {"m": "$ sudo flatpak update -y"}, {"m": "$ apt-mark showhold; cat /etc/mintupdate.blacklist 2>/dev/null"}, {"m": "$ sudo apt-mark unhold <package>   (only when the brief allows updating it; apt-mark showhold lists the holds)"}, {"m": "$ sudo unattended-upgrade --dry-run -d 2>&1 | grep 'Allowed origins'   (on Mint the origins name Linuxmint and the Mint codename, so they skip Ubuntu's noble-security pocket; Update Manager's automation patches it)"}], "why": {"u": "unattended-upgrades is preinstalled, run by apt-daily and apt-daily-upgrade timers. Check for Update-Package-Lists or Unattended-Upgrade at 0, the package removed, or automatic checks set to Never; apt-config shows what apt uses.", "m": "Two separate goals: patched now, and configured to keep patching. Mint's automation runs only when both the timer and its flag file exist, and Flatpak apps update outside apt. -r refreshes the lists first, and --keep-configuration keeps your hardened configuration files when a package ships a new default (-y alone takes the package's version). Use Update Manager's automation rather than unattended-upgrades: on Mint its default origins carry the Mint name and codename, so they miss every Ubuntu security pocket (sudo unattended-upgrade --dry-run -d shows the Allowed origins). The daily job runs mintupdate-cli upgrade -r -y plus each line of /etc/mintupdate-automatic-upgrades.conf, so put --keep-configuration on its own line there too."}, "note": {"u": "apt reads every apt.conf.d file, so a later file can reset either to 0. After a kernel update, uname -r shows the old kernel until reboot; /var/run/reboot-required marks one due.", "m": "If Update Manager shows a broken mirror, fix Software Sources (I-11). A held package or a line in /etc/mintupdate.blacklist freezes that update even after everything else upgrades: sudo apt-mark unhold <package>, and remove the line with sudoedit."}, "also": {"u": "Snaps update themselves; snap refresh forces it now. Close Firefox first: running snaps update once closed. 'Deferred due to phasing' packages are Ubuntu's staged rollout; a later run installs them."}, "task": "refresh the package list and install all upgrades", "t": "sudo apt update && sudo apt upgrade -y", "ta": {"u": ["sudo apt update; sudo apt upgrade -y", "apt update && apt upgrade -y", "sudo apt-get update && sudo apt-get upgrade -y"], "m": ["sudo apt update; sudo apt upgrade -y", "apt update && apt upgrade -y", "sudo mintupdate-cli upgrade -y", "sudo mintupdate-cli upgrade -r -y --keep-configuration"]}, "area": "patch"}, {"id": "B-09", "title": "Remove unapproved software", "cmds": ["$ apt list --installed 2>/dev/null | grep -Ei 'nmap|zenmap|john|hydra|medusa|wireshark|tshark|aircrack|ophcrack|netcat|ncat|socat|telnetd|nikto|metasploit|hashcat|sqlmap|doona|torrent|deluge|amule|scanmem|gameconqueror|minetest|aisleriot|mahjongg|sudoku|freeciv|wesnoth'", "$ dpkg-query -W -f='${db:Status-Abbrev}\\t${binary:Package}\\t${Section}\\t${binary:Summary}\\n' | awk -F'\\t' '$1 ~ /^ii/' | grep -iE 'games|crack|brute|sniff|exploit|scanner|torrent|peer-to-peer'", "$ zgrep -hE '^(Start-Date|Commandline)' /var/log/apt/history.log*", "$ dpkg -l | grep -i <name>", "$ sudo apt purge --auto-remove nmap", "$ ls -la /usr/local/bin /usr/local/sbin /opt", {"u": "$ sudo snap list"}, {"u": "$ sudo snap remove <name>"}, {"u": "GUI: App Center, Manage"}, {"m": "$ flatpak list"}, {"m": "$ flatpak remotes   (flathub is Mint's default; any other remote needs a reason in the brief)"}, {"m": "$ flatpak uninstall -y <application-id>"}, {"m": "GUI: Software Manager (mintinstall), Installed"}], "why": "Hacking tools, games, and P2P clients are acceptable-use violations and attack surface. Description search finds tools by purpose, Section lists games, apt's history.log dates installs, and /usr/local holds hand-placed files.", "note": {"u": "Required vsftpd, apache2, samba, openssh-server, and mysql stay; Watchman I-12 hardens them. Keep pam_pwquality's dictionary (cracklib-runtime, libcrack2) and netcat-openbsd (purging removes ubuntu-minimal). Snaps like Firefox appear only in snap list.", "m": "Skip -y and read the REMOVED list first: --auto-remove also removes every package already marked as no longer required. Purge only what dpkg lists; apt stops at any unknown name."}, "also": {"u": "Desktop-installed transmission-gtk is still P2P; the brief decides. Skip -y and read apt's REMOVED list: --auto-remove also removes packages marked unneeded. Purge only dpkg-listed names; apt stops at unknown ones.", "m": "Required packages (vsftpd, apache2, samba, openssh-server, mysql) stay; Watchman I-12 hardens them. Keep the stock cracklib-runtime and libcrack2 (pam_pwquality's dictionary), netcat-openbsd, and /etc/apt/preferences.d/nosnap.pref, which blocks snapd. apt misses Flatpak apps."}, "task": "completely remove the nmap package and its dependencies", "t": "sudo apt purge --auto-remove nmap", "ta": ["sudo apt purge --auto-remove -y nmap", "sudo apt purge -y nmap", "sudo apt remove --purge -y nmap", "apt purge --auto-remove -y nmap", "sudo apt purge nmap", "sudo apt-get purge -y nmap"], "area": "software"}, {"id": "B-10", "title": "Find unapproved media files", "cmds": ["$ sudo find /home /root /tmp /var /dev/shm /srv /opt /mnt /media /usr/local -xdev -type f \\( -iname '*.mp3' -o -iname '*.mp4' -o -iname '*.m4a' -o -iname '*.mov' -o -iname '*.avi' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.wmv' -o -iname '*.flv' -o -iname '*.mpg' -o -iname '*.mpeg' -o -iname '*.wav' -o -iname '*.flac' -o -iname '*.ogg' -o -iname '*.aac' -o -iname '*.wma' \\) -not -path '/var/lib/snapd/*' -not -path '/var/lib/flatpak/*' -printf '%u\\t%s\\t%p\\n' 2>/dev/null", "$ sudo find /home /root /tmp /var/tmp /dev/shm /srv /opt -xdev -type f -size +32k -exec file --mime-type {} + 2>/dev/null | grep -E ': (audio|video)/'", {"u": "$ sudo apt install -y plocate && sudo updatedb && sudo locate -i '*.mp3'   (a quick second look; the index skips /tmp, /dev/shm, and /media, so find stays the proof)"}, {"m": "$ sudo updatedb && sudo locate -i '*.mp3'   (a quick second look; the index skips /tmp, /dev/shm, and /media, so find stays the proof)"}, "$ sudo sha256sum '<path>'; sudo rm -- '<reviewed path>'", "$ sudo mkdir -p /root/quarantine && sudo mv -- '<reviewed path>' /root/quarantine/   (keeps the file as evidence when the brief asks for it, out of the user's reach)"], "why": "Many acceptable-use policies ban personal media; the search also surfaces hidden folders in /home and /var/tmp. file reads first bytes, so a song renamed notes.txt still shows as audio/mpeg.", "note": "App-folder hits (~/.local/share/flatpak, ~/snap, /opt/<app>) are usually the app's; images go only if banned. Before rm, confirm paths against the brief and, for hash questions, run sha256sum (Defense Ladder s6).", "also": "-printf records owner, size, and path for change logs and investigation questions. Skipping /usr except /usr/local avoids OS sounds in /usr/share. Trust find; locate's nightly index skips /tmp and /dev/shm.", "area": "data"}, {"id": "B-11", "title": "Services: what runs, what listens", "cmds": ["$ systemctl list-units --type=service --state=running", "$ sudo ss -tulpn", "$ systemctl list-sockets --no-pager", "$ sudo systemctl disable --now vsftpd", "$ sudo systemctl disable --now telnet.socket inetd xinetd 2>/dev/null"], "why": "Telnet and FTP are cleartext; avahi, cups, rpcbind, nfs, and smb are exposure when unneeded. ss -tulpn shows the PID and program for every open port.", "note": "Required services stay. Check what starts a service before trusting it is off: a .socket unit can hold the port after its .service stops; ss shows systemd holding it.", "also": "disable --now stops units and keeps them off at boot. systemctl list-sockets pairs each socket with its service; disable both. I-07 traces an unknown listener to its unit and package.", "task": "show listening TCP and UDP sockets with their programs", "t": "sudo ss -tulpn", "ta": ["ss -tulpn", "sudo ss -tulnp", "sudo netstat -tulpn"], "area": "config"}, {"id": "B-12", "title": {"u": "GDM auto-login and screen lock", "m": "Login Window: auto-login, guest sessions, screen lock"}, "cmds": [{"u": "$ sudo nano /etc/gdm3/custom.conf"}, {"u": "  [daemon]   AutomaticLoginEnable=false"}, {"u": "GUI: Settings, System, Users, Automatic Login Off"}, {"u": "$ gsettings set org.gnome.desktop.screensaver lock-enabled true"}, {"u": "$ gsettings set org.gnome.desktop.screensaver lock-delay 0"}, {"u": "$ gsettings set org.gnome.desktop.session idle-delay 300"}, {"u": "GUI: Settings, Privacy and Security, Screen Lock: Automatic Screen Lock On; blank screen after 5 minutes"}, {"m": "GUI: Menu, Administration, Login Window, Users: Guest sessions, Allow guest sessions Off; Automatic login, Username empty"}, {"m": "$ /usr/sbin/lightdm --show-config 2>&1 | grep -E 'allow-guest|autologin'"}, {"m": "$ sudo nano /etc/lightdm/lightdm.conf"}, {"m": "  [Seat:*]   autologin-user=   allow-guest=false"}, {"m": "$ gsettings set org.cinnamon.desktop.screensaver lock-enabled true"}, {"m": "$ gsettings set org.cinnamon.desktop.screensaver lock-delay 0"}, {"m": "$ gsettings set org.cinnamon.desktop.session idle-delay 300"}, {"m": "GUI: Menu, Preferences, Screensaver: Lock the computer when put to sleep On, Delay before locking 0"}], "why": {"u": "Auto-login means physical access is root in ten seconds; an unlocked idle desktop is the same thing a few minutes later.", "m": "Auto-login or a guest session means physical access is root in ten seconds; an unlocked idle desktop is the same thing a few minutes later."}, "note": {"u": "gsettings changes the current user only; repeat for each authorized user or use the GUI as each.", "m": "Guest sessions come from LightDM, so passwd -l guest reports an unknown user. The Login Window's Guest sessions section appears only when the guest-account tool is installed."}, "also": {"m": "/etc/lightdm/lightdm.conf is read last and overrides the lightdm.conf.d drop-ins; --show-config prints the value in force and its file. gsettings changes the current user only; repeat it per authorized user."}, "area": "config"}, {"id": "B-13", "title": "Find plaintext credential files and unapproved archives", "area": "data", "cmds": ["$ sudo grep -rIil --exclude-dir=.cache --exclude-dir=.mozilla --exclude-dir=snap --exclude-dir=flatpak -E 'passw(or)?d|credential|secret|api[_-]?key|BEGIN [A-Z ]*PRIVATE KEY' /home /root /tmp /var/tmp /dev/shm /srv /opt /var/www 2>/dev/null", "$ sudo find /home /root /tmp /var/tmp /dev/shm /srv /opt -xdev -type f \\( -iname '*.zip' -o -iname '*.7z' -o -iname '*.rar' -o -iname '*.tar' -o -iname '*.tgz' -o -iname '*.tar.gz' -o -iname '*.tar.xz' -o -iname '*.txt' \\) -printf '%u\\t%TY-%Tm-%Td\\t%p\\n' 2>/dev/null", "$ sudo unzip -l '<file.zip>'; sudo python3 -m zipfile -l '<file.zip>'; sudo tar -tvf '<file.tar.gz>'", "$ file '<file>'"], "why": "Password lists open every named account; archives slip tools past package searches. grep matches content under any name; unzip -l and tar -tvf list without extracting; file unmasks renamed ones.", "note": "Judge each .txt before deleting it: the brief, the investigation questions, and required documents stay. ~/.ssh keys are expected for users the brief lets sign in with keys (I-01).", "also": "Record the path and hash before removing anything (Defense Ladder s6). python3 -m zipfile works where unzip is absent."}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. SSH, sudoers, cron and timers, shell persistence, permissions and SUID, processes, AppArmor, auditing, apt sources, hardening the services you must keep, and browser policies.", "learn": ["#junior/j3", "Defense Ladder j3, Debian and deeper Linux"], "items": [{"id": "I-01", "title": "SSH hardening, only when SSH is required", "cmds": ["$ sudo grep -rniE '^[[:space:]]*(Include|Match|PermitRootLogin|PermitEmptyPasswords|PermitUserEnvironment|PasswordAuthentication|AllowUsers)' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/", "$ sudo less /etc/ssh/sshd_config   (read the whole file before you edit it; / searches, n finds the next match, q quits)", "$ ssh-keygen -t ed25519 -C '<user>@<laptop>'; ssh-copy-id <user>@<server>   (on the admin's own machine, before PasswordAuthentication no; then test a key login)", "$ sudo nano /etc/ssh/sshd_config.d/00-hardening.conf      (or the main file, after reading every drop-in)", "  PermitRootLogin no        PermitEmptyPasswords no     MaxAuthTries 3", "  LoginGraceTime 30         X11Forwarding no            UsePAM yes", "  PermitUserEnvironment no", "  PasswordAuthentication yes or no per the brief      AllowUsers keoni koa", "$ sudo sshd -t && sudo systemctl restart ssh   (or sudo systemctl try-reload-or-restart ssh: reloads a running ssh, or restarts it where reload is missing; a stopped ssh.service stays stopped, and ssh.socket starts it with the new settings at the next sign-in)", "$ sudo sshd -T | grep -E '^(permitrootlogin|permitemptypasswords|permituserenvironment|maxauthtries|passwordauthentication|x11forwarding|allowusers) '", "$ sudo sshd -T -C user=root,host=localhost,addr=127.0.0.1 | grep -i '^permitrootlogin'", "$ systemctl list-units 'ssh*' --no-pager     (is ssh.socket the unit that listens on 22?)", "$ sudo systemctl daemon-reload && sudo systemctl restart ssh.socket   (after a Port or ListenAddress change)", "$ sudo find / -name authorized_keys -exec ls -l {} \\; -exec cat {} \\; 2>/dev/null"], "why": "Root over SSH erases accountability and invites brute force; a planted authorized_keys backdoor survives every password fix. sshd -T, plus -C for Match blocks, confirms the values in force.", "note": "The && runs the restart only when sshd -t passes, so a config typo leaves the running server in place. sshd keeps the first value it reads, and Include reads sshd_config.d/*.conf in name order, so 00-hardening.conf wins over the shipped drop-ins and the main file; a drop-in that sorts before 00- still wins, and the grep and sshd -T show it. When ssh.socket owns port 22, a Port change or a disable aimed at ssh.service alone leaves the socket listening on the old port. Not required: sudo systemctl disable --now ssh.socket ssh.service && sudo apt purge -y openssh-server; confirm with sudo ss -tlpn that port 22 is closed. If sshd -t or sshd -T stops at 'Missing privilege separation directory: /run/sshd', run sudo mkdir -p /run/sshd and test again.", "task": "test the sshd config and restart the service only when the test passes", "t": "sudo sshd -t && sudo systemctl restart ssh", "ta": ["sudo sshd -t && sudo systemctl restart ssh.service", "sshd -t && systemctl restart ssh"], "area": "access"}, {"id": "I-02", "title": "sudoers audit", "cmds": ["$ sudo grep -R -nE 'NOPASSWD|!authenticate|ALL=\\(ALL' /etc/sudoers /etc/sudoers.d/", "$ sudo visudo", "$ sudo visudo -f /etc/sudoers.d/<file>", "$ sudo -l -U ikaika", "$ sudo visudo -c; sudo -k; sudo -v          (expect a password prompt)", "$ ls -l /etc/sudoers-rs && sudo visudo-rs -c -f /etc/sudoers-rs   (where sudo-rs is installed, it reads this file in place of /etc/sudoers whenever the file exists; edit an existing one with sudo visudo-rs -f /etc/sudoers-rs, and leave a missing one missing)", "$ sudoedit /etc/hosts   (edits a copy as you, then installs it as root; grant sudoedit FILE in sudoers in place of an editor, which can open a root shell)"], "why": "A NOPASSWD ALL line in a sudoers.d drop-in is a silent root backdoor. Edit only with visudo, never nano: a syntax error locks everyone out of sudo.", "note": "Defaults !authenticate, global or Defaults:<user>, acts like NOPASSWD on every rule it reaches. In the grep, single quotes keep bash from reading the ! as history.", "also": "sudo -l -U <user> lists the user's rules, with Defaults under Matching Defaults entries.", "task": "edit the sudoers file safely", "t": "sudo visudo", "ta": ["visudo"], "area": "access"}, {"id": "I-03", "title": "Cron, at and systemd timers", "cmds": ["$ cat /etc/crontab /etc/anacrontab 2>/dev/null; sudo ls -la /etc/cron.d /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly /var/spool/cron/crontabs", "$ sudo dpkg --verify cron cron-daemon-common", "$ dpkg -S /etc/cron.d/* /etc/cron.hourly/* /etc/cron.daily/* /etc/cron.weekly/* /etc/cron.monthly/* 2>&1 | grep 'no path found'", "$ for u in $(cut -d: -f1 /etc/passwd); do sudo crontab -l -u \"$u\" 2>/dev/null | sed \"s/^/$u: /\"; done", "$ systemctl list-timers --all", "$ sudo atq                                  (command not found means at is absent, along with any at jobs)", "$ sudo atrm <job>   (removes one job that atq lists; read it first with sudo at -c <job>)", "$ sudo crontab -r -u baduser"], "why": "Cron re-creates users, re-opens ports, and re-installs tools every few minutes, so a fixed problem comes back. The stock /etc/crontab runs four run-parts jobs (hourly, daily, weekly, and monthly).", "note": "Before deleting a planted job, record and hash its program, end its process, and find other starters (I-07's grep -rlF). Cron rereads changed files every minute; fixes apply without restart.", "also": "cron-daemon-common owns /etc/crontab on 24.04, so dpkg --verify flags any edit (??5?????? c /etc/crontab) without a clean VM to compare against. dpkg -S marks hand-placed drop-ins with 'no path found'.", "task": "list every systemd timer", "t": "systemctl list-timers --all", "ta": ["sudo systemctl list-timers --all"], "area": "malware"}, {"id": "I-04", "title": "Shell and startup persistence", "cmds": ["$ grep -R -nE 'alias|nc |ncat|bash -i|/dev/tcp|curl .*\\| *sh|wget .*\\| *sh' /etc/profile /etc/bash.bashrc /etc/profile.d/ /home/*/.bashrc /home/*/.profile /root/.bashrc 2>/dev/null", "$ cat /etc/rc.local 2>/dev/null; ls -la /etc/init.d/ /etc/systemd/system/", "$ systemctl list-unit-files --state=enabled", "$ echo '<encoded text>' | base64 -d   (decodes a blob found in a cron line or startup file; read what it would run before anything else)"], "why": "An alias on sudo or a reverse shell in .bashrc runs every time a terminal opens, including the one you use to fix things.", "area": "malware"}, {"id": "I-05", "title": "Critical file permissions, world-writable, SUID", "cmds": ["$ sudo chown root:shadow /etc/shadow /etc/gshadow && sudo chmod 640 /etc/shadow /etc/gshadow", "$ sudo chown root:root /etc/passwd /etc/group && sudo chmod 644 /etc/passwd /etc/group", "$ sudo chown root:root /etc/sudoers && sudo chmod 440 /etc/sudoers", "$ sudo chown root:root /boot/grub/grub.cfg && sudo chmod 600 /boot/grub/grub.cfg", "$ sudo stat -c '%a %U:%G %n' /etc/passwd /etc/group /etc/shadow /etc/gshadow /etc/passwd- /etc/group- /etc/shadow- /etc/gshadow- /boot/grub/grub.cfg", "$ sudo chmod 750 /home/*", "$ sudo find / -xdev -type f -perm -0002 -not -path '/proc/*' 2>/dev/null", "$ sudo find / -xdev -type d -perm -0002 ! -perm -1000 2>/dev/null", "$ sudo find / -xdev -type f \\( -perm -4000 -o -perm -2000 \\) 2>/dev/null", "$ sudo chmod u-s /path/to/evil", "$ sudo getcap -r / 2>/dev/null   (cap_net_raw or cap_net_admin on a packaged network tool is normal; cap_setuid on python3 or perl gives root to anyone who runs it)", "$ sudo setcap -r /usr/bin/python3.12   (removes every capability on the file, cap_setuid included; getcap /usr/bin/python3.12 then prints nothing)", "$ sudo getfacl /etc/shadow /etc/sudoers   (a + after the mode in ls -l means extra entries; sudo setfacl -x u:<user> <file> removes one, and sudo setfacl -b <file> removes them all)"], "why": "Readable /etc/shadow allows offline cracking. Writable /etc/passwd gives root, as does SUID on bash, nmap, find, or vim (GTFOBins). grub.cfg holds the kernel command line and any GRUB password hash.", "note": "Investigate anything outside this expected list. SUID: passwd, su, sudo, mount, umount, chsh, chfn, gpasswd, newgrp, pkexec, fusermount3, ssh-keysign, dbus-daemon-launch-helper, and polkit-agent-helper-1; SGID: chage, expiry, unix_chkpwd, and crontab.", "also": "Compare unexpected SUID/SGID files with a clean VM of the same release. Backups ending in - (same data) take the main files' owner and mode. update-grub keeps your grub.cfg mode.", "task": "set /etc/shadow to mode 640", "t": "sudo chmod 640 /etc/shadow", "ta": ["chmod 640 /etc/shadow"], "area": "access"}, {"id": "I-06", "title": "Hosts file and name resolution", "cmds": ["$ cat /etc/hosts", "$ resolvectl status 2>/dev/null | grep -i 'DNS Servers'", "$ hostname; ip -br a; ip route   (the machine's name, its addresses, and the default route; explain anything the brief leaves out)", "$ ip -br link   (every interface; an unexpected tun0, wg0, or second NIC needs an explanation)", "$ ip neigh   (the MAC address behind each neighbor; two addresses that share one MAC suggest ARP spoofing)", "$ traceroute -n security.ubuntu.com   (hop 1 should be the gateway the brief names; a different first hop means a changed route; sudo apt install traceroute when it is missing, or use tracepath)", "$ dig +short <name>; dig -x <address>   (what DNS answers, to compare with /etc/hosts; sudo apt install bind9-dnsutils when dig is missing)", "$ nmcli connection show   (saved network profiles; an unknown VPN or Wi-Fi profile needs an explanation)"], "why": {"u": "Redirecting security.ubuntu.com or archive.ubuntu.com to 127.0.0.1 breaks updates silently.", "m": "Redirecting packages.linuxmint.com or security.ubuntu.com to 127.0.0.1 breaks updates silently."}, "task": "print the hosts file", "t": "cat /etc/hosts", "area": "config"}, {"id": "I-07", "title": "Processes and connections: find the backdoor", "cmds": ["$ ps -eo pid,ppid,user,cmd --sort=-%cpu | head -25", "$ top   (live CPU use; a miner sits at the top of the list; q quits)", "$ ps -ef | grep -Ei 'nc |ncat|socat|bash -i|python.* -c|perl -e|xmrig|miner' | grep -v grep", "$ pstree -p   (who started whom: a shell under apache2 or cron is a lead)", "$ sudo ss -tulpn; sudo lsof -i -P -n | grep -Ei 'LISTEN|ESTABLISHED'", "$ sudo ls -l /proc/<pid>/exe; sudo cat /proc/<pid>/cmdline | tr '\\0' ' '", "$ systemctl status <pid> --no-pager; dpkg -S \"$(sudo readlink -f /proc/<pid>/exe)\"", "$ systemctl cat <unit>   (the unit file plus every drop-in; ExecStart names the program it runs)", "$ sudo grep -rlF '<program>' /etc /var/spool/cron /home /root 2>/dev/null", "$ sudo kill -9 <pid>"], "why": "Killing a process is pointless unless you also remove its starter (cron, a systemd unit, rc.local, .bashrc): find the parent, then the file. systemctl status <pid> names the unit to disable; dpkg -S 'no path found' means no package installed it (on 24.04 retry with /bin in place of /usr/bin first, since they merge); grep -rlF lists every file that starts it.", "area": "malware", "note": "When systemctl status names cron.service, rc-local.service, inetd.service, or a session scope, the process is that starter's child: remove the planted line, end the process, keep the starter. A packaged python3, nc, or bash in /proc/<pid>/exe hides what it runs, so read cmdline; an exe path ending in (deleted) is a finding."}, {"id": "I-08", "title": "AppArmor enforcing", "cmds": ["$ sudo apt install -y apparmor-utils", "$ sudo systemctl enable --now apparmor", "$ sudo aa-status", "$ sudo aa-enforce /etc/apparmor.d/<profile>     (only profiles aa-status lists in complain mode)", "$ sudo aa-logprof   (reads AppArmor events from the logs and offers a rule for each; allow only what the program needs)"], "why": "Mandatory access control: a compromised service cannot read files outside its profile. Ubuntu and Mint enable it by default, so a stopped or disabled AppArmor is itself a finding.", "task": "show AppArmor status", "t": "sudo aa-status", "ta": ["aa-status", "sudo apparmor_status"], "note": "Enforce profiles by name: aa-enforce /etc/apparmor.d/* also enforces shipped, deliberately unconfined profiles that only grant one permission (see Version notes), breaking those apps. Test the brief's required apps after.", "area": "config"}, {"id": "I-09", "title": "Logging and audit", "cmds": ["$ systemctl status rsyslog --no-pager", "$ df -h /var   (a full /var stops the logs; keep space free before you turn auditing up)", "$ sudo apt install -y auditd && sudo systemctl enable --now auditd", "$ sudo nano /etc/audit/rules.d/hardening.rules", "  -w /etc/passwd -p wa -k identity", "  -w /etc/shadow -p wa -k identity", "  -w /etc/sudoers -p wa -k sudoers", "  -w /etc/sudoers.d/ -p wa -k sudoers", "$ sudo augenrules --load && sudo auditctl -l", "$ sudo ausearch -k identity", "$ sudo aureport -x --summary   (audit events per program; an unfamiliar path is a lead)", "$ sudo grep -rnE 'audit=(0|off)' /etc/default/grub /etc/default/grub.d/ 2>/dev/null", "$ sudo mkdir -p /etc/default/grub.d && echo 'GRUB_CMDLINE_LINUX=\"$GRUB_CMDLINE_LINUX audit=1 audit_backlog_limit=8192\"' | sudo tee /etc/default/grub.d/99-audit.cfg && sudo update-grub", "$ grep -oE 'audit=[^ ]+' /proc/cmdline        (after a reboot: audit=1)", "$ last; lastlog; sudo lastb | head; who; w", "$ sudo grep -E 'Accepted|Failed|useradd|userdel|usermod' /var/log/auth.log | tail -40", "$ sudo grep 'Failed password' /var/log/auth.log | wc -l   (one number to track between checks; grep -c counts the same lines)", "$ sudo grep 'Failed password' /var/log/auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -rn | head   (failed sign-ins counted per source address)", "$ journalctl -p err -b --no-pager | tail", "$ journalctl --list-boots   (a single line after several reboots means the journal forgets each boot: set Storage=persistent in /etc/systemd/journald.conf)", "$ logger -t hardening 'baseline done'; journalctl -t hardening --no-pager   (a test line that shows up proves logging works end to end)", "$ date   (the local time the logs stamp; timedatectl status below shows whether NTP keeps it right)", "$ timedatectl status   (System clock synchronized: yes and NTP service: active keep log times comparable; when either reads otherwise, run sudo timedatectl set-ntp true)", "$ timedatectl timesync-status   (the server systemd-timesyncd uses, with its poll interval and offset: the Server line should name the source the brief names)"], "why": "Audit rules answer who changed /etc/passwd and when. auditd starts mid-boot, so audit=1 makes the kernel record from the first process; audit=0 anywhere on the kernel line keeps auditing off.", "note": "If rsyslog is not installed (journald only, as on a default Debian install), use journalctl.", "task": "install auditd and start it now and at boot", "t": "sudo apt install -y auditd && sudo systemctl enable --now auditd", "ta": ["sudo apt install auditd && sudo systemctl enable --now auditd", "sudo apt install -y auditd; sudo systemctl enable --now auditd", "sudo apt-get install -y auditd && sudo systemctl enable --now auditd", "apt install -y auditd && systemctl enable --now auditd"], "area": "audit"}, {"id": "I-10", "title": "Account hygiene: shells, system accounts, odd groups", "cmds": ["$ grep -vE 'nologin|/bin/false|/bin/sync' /etc/passwd", "$ sudo usermod -s /usr/sbin/nologin <system-account>", "$ sudo chage -l keoni", "$ sudo lslogins -u   (every human account with its process count, lock state, and last login in one table)", "$ getent group root shadow adm systemd-journal sudo admin docker lxd disk", "$ for g in shadow disk adm systemd-journal docker lxd; do awk -F: -v g=\"$(getent group \"$g\" | cut -d: -f3)\" -v n=\"$g\" 'g!=\"\" && $4==g {print $1\" has primary group \"n}' /etc/passwd; done", "$ sudo gpasswd -d <user> shadow"], "why": "A service account with /bin/bash is a login. Planted group memberships grant quiet privilege: disk reads raw disks, including the shadow file; adm and systemd-journal read the whole journal.", "note": "A primary group of shadow reads every hash without appearing in the member list.", "also": "gpasswd keeps /etc/group and /etc/gshadow in step; a hand edit can split them.", "task": "show keoni's password aging settings", "t": "sudo chage -l keoni", "ta": ["chage -l keoni"], "area": "acct"}, {"id": "I-11", "title": {"u": "Apt sources hygiene (deb822 .sources files)", "m": "Software Sources hygiene"}, "cmds": [{"u": "$ cat /etc/apt/sources.list.d/ubuntu.sources"}, {"u": "$ ls -l /etc/apt/sources.list.d/; cat /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null"}, {"m": "$ cat /etc/apt/sources.list.d/official-package-repositories.list /etc/apt/sources.list.d/*.list 2>/dev/null"}, {"m": "GUI: Menu, Administration, Software Sources: Official repositories, PPAs, Additional repositories"}, "$ ls -l /etc/apt/trusted.gpg.d/ /etc/apt/keyrings/ /etc/apt/preferences.d/ 2>/dev/null", "$ apt-cache policy | grep -- '-security'      (expect 500 lines for noble-security; apt policy prints the same table)", {"u": "$ sudo add-apt-repository --remove ppa:evil/ppa"}, "$ sudo apt update"], "why": {"u": "A malicious repository or key means apt upgrade installs the attacker's packages. Keep the official archive.ubuntu.com and security.ubuntu.com entries; remove unknown PPAs and the keys their Signed-By fields point to.", "m": "A malicious repository or key means apt upgrade installs the attacker's packages. Keep the official packages.linuxmint.com, archive.ubuntu.com, and security.ubuntu.com lines; remove unknown PPAs and keys."}, "note": {"u": "/etc/apt/sources.list may hold only a comment. Each repository is one stanza (Types, URIs, Suites, Components, and Signed-By) in a .sources file under /etc/apt/sources.list.d/.", "m": "nosnap.pref in preferences.d is Mint's own and stays. A pin in preferences.d that lowers noble-security switches security updates off quietly; apt-cache policy shows it."}, "also": {"u": "An Enabled: no line in a stanza, or a pin in /etc/apt/preferences.d, quietly switches off the security pocket (noble-security). apt-cache policy reveals either one."}, "area": "patch"}, {"id": "I-12", "title": "Harden required services instead of removing them", "cmds": ["  vsftpd  /etc/vsftpd.conf: anonymous_enable=NO  local_enable=YES  write_enable=NO  chroot_local_user=YES  ssl_enable=YES", "$ sudo systemctl restart vsftpd && systemctl is-active vsftpd", "$ openssl s_client -connect 127.0.0.1:21 -starttls ftp -brief </dev/null; grep -x root /etc/ftpusers", "$ nc -zv 127.0.0.1 21   (succeeded means the service answers; Connection refused means it is closed; ufw filters traffic from other hosts, so prove a firewall rule from a second machine)", "  apache2 /etc/apache2/conf-enabled/security.conf: ServerTokens Prod  ServerSignature Off  TraceEnable Off ; apache2.conf <Directory /var/www/>: Options FollowSymLinks", "$ sudo apache2ctl configtest && sudo systemctl restart apache2   (apachectl configtest is the same check)", "$ curl -sI http://127.0.0.1/ | grep -i '^server:'; curl -si -X TRACE http://127.0.0.1/ | head -1", "$ openssl x509 -in /etc/ssl/certs/ssl-cert-snakeoil.pem -noout -subject -issuer -dates   (issuer equal to subject means self-signed; notAfter is the expiry)", "  nginx   /etc/nginx/nginx.conf http block: server_tokens off;  ssl_protocols TLSv1.2 TLSv1.3;", "$ sudo nginx -t && sudo systemctl reload nginx", "  samba   /etc/samba/smb.conf [global]: map to guest = Never  restrict anonymous = 2 ; per share: guest ok = no", "$ testparm && sudo systemctl restart smbd", "$ sudo mysql_secure_installation   (on MariaDB the same script is sudo mariadb-secure-installation)", "$ sudo mysql -e \"SELECT user, host, plugin FROM mysql.user;\"   (an empty user name, or root with host %, is a finding)", "  mysql   /etc/mysql/mysql.conf.d/mysqld.cnf: bind-address = 127.0.0.1", "$ sudo systemctl restart mysql", "$ systemd-analyze security <service>   (an exposure level from 0 to 10, where lower is safer; each flagged line names a sandbox setting to add with systemctl edit)", "$ sudo systemctl edit <service>   (a drop-in for sandboxing, such as NoNewPrivileges=yes and ProtectSystem=full; restart it and confirm it stays active, since ProtectSystem=strict also needs ReadWritePaths= for the service's data and logs; systemd-analyze security <service> shows the change)"], "why": "Required services must keep running, so harden their configs instead; anonymous FTP is the classic finding. /etc/ftpusers lists the accounts FTP refuses, root included, and openssl s_client shows TLS working.", "note": "A bad line, like spaces around =, stops vsftpd; is-active proves the restart took. Apache refuses mixed signed and plain options (Options -Indexes FollowSymLinks); write Options FollowSymLinks or -Indexes +FollowSymLinks.", "also": "After the restarts, curl should print Server: Apache (or nginx) without a version, and TRACE should answer 405. If curl is missing, run sudo apt install curl.", "task": "run the MySQL hardening wizard", "t": "sudo mysql_secure_installation", "ta": ["mysql_secure_installation"], "area": "config"}, {"id": "I-13", "title": "Browser protections (Firefox and Chromium)", "area": "config", "cmds": [{"u": "$ snap list firefox chromium 2>/dev/null; pgrep -a firefox"}, {"m": "$ dpkg -l firefox chromium 2>/dev/null | grep '^ii'"}, "$ sudo mkdir -p /etc/firefox/policies", {"u": "$ sudo cp -n /snap/firefox/current/usr/lib/firefox/distribution/policies.json /etc/firefox/policies/ 2>/dev/null"}, {"m": "$ sudo cp -n /usr/lib/firefox/distribution/policies.json /etc/firefox/policies/ 2>/dev/null"}, "$ sudo nano /etc/firefox/policies/policies.json      (add these keys inside \"policies\")", "  \"DisableSecurityBypass\": {\"SafeBrowsing\": true},   \"PopupBlocking\": {\"Default\": true, \"Locked\": true},", "  \"HttpsOnlyMode\": \"force_enabled\",", "  \"Preferences\": {\"browser.safebrowsing.malware.enabled\": {\"Value\": true, \"Status\": \"locked\"},", "    \"browser.safebrowsing.phishing.enabled\": {\"Value\": true, \"Status\": \"locked\"},", "    \"browser.safebrowsing.downloads.enabled\": {\"Value\": true, \"Status\": \"locked\"},", "    \"xpinstall.whitelist.required\": {\"Value\": true, \"Status\": \"locked\"}}", "$ python3 -m json.tool /etc/firefox/policies/policies.json >/dev/null && echo valid", "GUI: Firefox, about:policies: the Active tab lists each policy, and the Errors tab stays empty", "$ sudo find /home /root -type f \\( -name prefs.js -o -name user.js \\) -path '*firefox*' -exec grep -HE 'safebrowsing|https_only_mode|disable_open_during_load|xpinstall' {} + 2>/dev/null", {"u": "$ sudo mkdir -p /etc/chromium-browser/policies/managed && echo '{\"SafeBrowsingProtectionLevel\": 2}' | sudo tee /etc/chromium-browser/policies/managed/hardening.json"}, {"m": "$ sudo mkdir -p /etc/chromium/policies/managed && echo '{\"SafeBrowsingProtectionLevel\": 2}' | sudo tee /etc/chromium/policies/managed/hardening.json"}, "GUI: Chromium, chrome://policy, Reload policies: SafeBrowsingProtectionLevel 2, status OK"], "why": "Safe Browsing blocks known phishing and malware pages and downloads, HTTPS-Only Mode asks before loading an unencrypted page, and the add-on warning stops a site installing an extension on its own. A policy file locks a setting for every user; a Settings checkbox covers one profile. A user.js line restores its value at every start, so a protection turned off there is a persistence finding.", "note": {"u": "Firefox reads /etc/firefox/policies/policies.json in place of its own copy, so cp brings the shipped policies along first; a new file needs the wrapper {\"policies\": { ... }}. Write \"enabled\" rather than \"force_enabled\" when the brief names a site that works over HTTP alone. Restart the browser. The Chromium snap reads policies from /etc/chromium-browser/policies. Updates come from sudo snap refresh (B-08), so Help, About Firefox reports the version only; close the browser first, because snap updates a running app only after it closes.", "m": "/etc/firefox/policies/policies.json replaces the shipped copy: cp that copy there first, keeping the {\"policies\": { ... }} wrapper. Use \"HttpsOnlyMode\": \"enabled\" rather than \"force_enabled\" for an HTTP-only named site; restart Firefox."}, "task": "check that the Firefox policy file is valid JSON", "t": "python3 -m json.tool /etc/firefox/policies/policies.json", "ta": ["sudo python3 -m json.tool /etc/firefox/policies/policies.json"]}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. Kernel and network sysctl, rootkits and tampered packages, the immutable-flag trap, PAM internals and managed PAM profiles, forensics tooling, firewall depth, version notes, and a Lynis self-audit.", "learn": ["#senior/se1", "Defense Ladder se1, FreeBSD: Hunting on any Unix"], "items": [{"id": "A-01", "title": "Kernel and network hardening with sysctl", "cmds": ["$ sudo nano /etc/sysctl.d/99-hardening.conf", "  net.ipv4.ip_forward = 0", "  net.ipv4.conf.all.accept_redirects = 0    net.ipv4.conf.default.accept_redirects = 0", "  net.ipv4.conf.all.send_redirects = 0      net.ipv4.conf.default.send_redirects = 0", "  net.ipv4.conf.all.accept_source_route = 0 net.ipv4.conf.default.accept_source_route = 0", "  net.ipv4.conf.all.rp_filter = 1           net.ipv4.conf.default.rp_filter = 1", "  net.ipv4.conf.all.log_martians = 1        net.ipv4.tcp_syncookies = 1", "  net.ipv4.icmp_echo_ignore_broadcasts = 1  net.ipv4.icmp_ignore_bogus_error_responses = 1", "  net.ipv6.conf.all.accept_redirects = 0    net.ipv6.conf.default.accept_redirects = 0", "  net.ipv6.conf.all.accept_source_route = 0 net.ipv6.conf.default.accept_source_route = 0", "  kernel.randomize_va_space = 2   kernel.kptr_restrict = 2   kernel.dmesg_restrict = 1   kernel.sysrq = 0", "  fs.protected_hardlinks = 1   fs.protected_symlinks = 1   fs.suid_dumpable = 0", "$ sudo sysctl --system", "$ sysctl net.ipv4.ip_forward kernel.randomize_va_space", "$ dmesg | tail   (as a regular user, 'Operation not permitted' proves kernel.dmesg_restrict = 1)", "$ sysctl -a 2>/dev/null | grep -E 'rp_filter|accept_redirects'      (an interface that still reads 2 keeps loose checking: sudo sysctl -w net.ipv4.conf.<iface>.rp_filter=1)", "$ sudo grep -rnE 'ip_forward|randomize_va_space|accept_redirects|rp_filter' /etc/sysctl.conf /etc/sysctl.d/ /etc/ufw/sysctl.conf 2>/dev/null"], "why": "ip_forward=1 enables pivoting; syncookies and rp_filter blunt SYN floods and spoofing; ASLR 2 and suid_dumpable 0 raise exploit cost. sysctl --system loads /etc/sysctl.d/ too; sysctl -p reads /etc/sysctl.conf alone.", "note": "ip_forward goes first: changing it resets the interface settings and would undo lines above it. A bad change can leave ip_forward=1 or randomize_va_space=0 in /etc/sysctl.conf, a file in /etc/sysctl.d/, or /etc/ufw/sysctl.conf, which ufw applies at each start (its keys use slashes: net/ipv4/ip_forward). The stock ufw file sets log_martians=0, so with ufw on, set its two log_martians lines to 1 as well. On 24.04, /etc/sysctl.conf applies last and wins. Stock rp_filter is 2 (loose) in /etc/sysctl.d/10-network-security.conf; 1 is strict and can drop traffic on a host with two network paths. The kernel takes the higher of the all value and each interface value for rp_filter, so read both back.", "task": "apply every sysctl config file now", "t": "sudo sysctl --system", "ta": ["sysctl --system"], "area": "config"}, {"id": "A-02", "title": "Rootkits, tampered packages, malware", "cmds": ["$ sudo apt install -y rkhunter chkrootkit debsums clamav", "$ sudo debsums -c; sudo debsums -ce", "$ sudo rkhunter --propupd && sudo rkhunter --check --sk", "$ sudo chkrootkit", "$ sudo systemctl stop clamav-freshclam; sudo freshclam; sudo systemctl start clamav-freshclam; sudo clamscan -r -i --log=/root/clamscan.log /home /tmp /var/tmp /opt", "$ clamscan --version                        (the signature date proves the database loaded)", "$ which nc ncat netcat socat; sudo find / -xdev -type f \\( -name nc -o -name ncat -o -name netcat -o -name socat \\) 2>/dev/null", "$ sudo apt install -y --no-install-recommends aide aide-common && sudo aideinit -y -f     (last step of the session)", "$ sudo aide --check --config /etc/aide/aide.conf"], "why": "debsums catches a replaced /bin/ls or sshd; rkhunter knows rootkit paths; AIDE reports changes since its baseline. Netcat is the backdoor toolkit: /usr/bin/nc (netcat-openbsd) is stock; hunt copies outside packages.", "note": "Run debsums before rkhunter --propupd, or rkhunter's baseline trusts tampered files. debsums -c skips conffiles; -ce lists edited dpkg ones, /etc/crontab included. sshd_config is ucf-managed, so compare it with /usr/share/openssh/sshd_config.", "also": "clamscan's signatures need internet and about 1.2 GiB of RAM: with 2 GB, close other programs or scan folder by folder. Installing AIDE with --no-install-recommends skips postfix and port 25.", "task": "list installed package files that have been modified", "t": "sudo debsums -c", "ta": ["debsums -c"], "area": "malware"}, {"id": "A-03", "title": "The lsattr trap, core dumps, Ctrl-Alt-Del", "cmds": ["$ sudo lsattr /etc/passwd /etc/shadow /etc/sudoers /etc/ssh/sshd_config", "$ sudo chattr -i /etc/passwd", "$ sudo nano /etc/security/limits.conf", "  * hard core 0", "$ sudo systemctl mask ctrl-alt-del.target", "$ findmnt /tmp; findmnt /dev/shm   (OPTIONS should read nodev and nosuid, plus noexec where the brief allows; empty output means /tmp lives on the root file system)", "$ lsblk -f   (FSTYPE crypto_LUKS means full-disk encryption; record it, since it is chosen at install time)", "$ mokutil --sb-state   (SecureBoot enabled means the firmware checks each signed step of the boot chain; a BIOS-booted VM prints 'EFI variables are not supported on this system')", "$ grub-mkpasswd-pbkdf2   (hashes a GRUB superuser password for /etc/grub.d/40_custom: set superusers=\"root\" and password_pbkdf2 root <hash>; mark the normal entry --unrestricted (CLASS line in /etc/grub.d/10_linux) so unattended reboots still start; then sudo update-grub)"], "why": "An immutable flag set by attackers is the most common reason a fix refuses to stick on a compromised machine, so run lsattr first.", "note": "With the flag set, useradd, passwd, and chage fail even as root, with misleading errors like 'useradd: cannot open /etc/passwd' or 'Authentication token manipulation error'.", "task": "remove the immutable flag from /etc/passwd", "t": "sudo chattr -i /etc/passwd", "ta": ["chattr -i /etc/passwd"], "area": "config"}, {"id": "A-04", "title": "PAM deep dive", "cmds": ["  required: must pass, keep going. requisite: must pass, stop on fail. sufficient: pass means done. optional.", "$ grep -nE 'nullok|pam_permit|pam_succeed_if' /etc/pam.d/common-auth /etc/pam.d/sudo /etc/pam.d/login /etc/pam.d/sshd", "$ sudo sed -i 's/ nullok//g' /etc/pam.d/common-auth", "$ grep -n 'pam_unix' /etc/pam.d/common-password", "$ sudo awk -F: '{h=$2; sub(/^!+/,\"\",h); if (h ~ /^[$](1|5|6)[$]/) print $1, substr(h,1,3)}' /etc/shadow"], "why": "auth sufficient pam_permit.so atop common-auth lets any password in. Expect yescrypt (the Ubuntu and Mint default), obscure, and remember=5 on the pam_unix line.", "note": "Adding sha512 to the pam_unix line downgrades every new hash. A hash changes only when its password changes, so old-format hashes remain until reset.", "also": "The awk line lists accounts still on MD5 ($1$), SHA-256 ($5$), or SHA-512 ($6$); reset those passwords.", "task": "strip nullok from common-auth", "t": "sudo sed -i 's/ nullok//g' /etc/pam.d/common-auth", "ta": ["sudo sed -i s/ nullok//g /etc/pam.d/common-auth"], "area": "access"}, {"id": "A-05", "title": "Forensics toolkit", "cmds": ["$ sudo find / -xdev -type f -newermt \"2026-10-01\" -not -path '/proc/*' -not -path '/sys/*' -not -path '/var/lib/*' 2>/dev/null | head -60", "$ sudo find / -xdev \\( -nouser -o -nogroup \\) 2>/dev/null", "$ sudo find / -xdev -uid <n> -ls 2>/dev/null; getent passwd <n>      (empty getent output: the owner was deleted)", "$ sudo find /home /root /tmp /var/tmp /dev/shm -name '.*' -type f 2>/dev/null", "$ sudo find /home /root /tmp /var/tmp /dev/shm /opt /srv /usr/local -xdev -type f -size -1024k -not -path '*/.mozilla/*' -not -path '*/snap/*' -not -path '*/.local/share/flatpak/*' -not -path '*/.var/app/*' -exec file {} + 2>/dev/null | grep -iE 'python|perl|shell script|ELF'", "$ comm -13 <(dpkg-query -L $(dpkg-query -W -f='${binary:Package} ') 2>/dev/null | sed -E 's#^/(s?bin)/#/usr/\\1/#' | sort -u) <(sudo find /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin -xdev -type f | sort -u)", "$ stat <file>; file <file>; strings <file> | head; md5sum <file>; sha1sum <file>; sha256sum <file>; sha512sum <file>", "$ xxd <file> | head -2   (the first bytes give the real type, whatever the name claims: 7f45 4c46 is ELF, 2550 4446 is PDF; sudo apt install xxd when it is missing)", "$ sudo journalctl _COMM=sudo --no-pager | tail -40", "$ history; sudo sh -c 'tail -n 20 /home/*/.bash_history /root/.bash_history' 2>/dev/null   (the last lines each account typed; the glob runs as root because home folders are 750; an empty history, or one linked to /dev/null, is itself a finding)", "$ sudo grep -E 'useradd|userdel|usermod|groupadd|passwd' /var/log/auth.log* 2>/dev/null", "$ sudo tcpdump -n -i any -c 20 port 4444   (who talks to a suspicious port; -c stops after 20 packets; sudo apt install tcpdump when it is missing)"], "why": "Investigation questions usually want a hash, a timestamp, a hidden path, or who ran what. find -newermt shows recent changes; the file command reads first bytes, exposing renamed scripts.", "note": "comm prints system programs missing from every package's file list. A few come from install scripts, so confirm with dpkg -S before calling one planted.", "also": "find -uid takes a number, so it still works after the account is deleted.", "task": "print the MD5 hash of secret.txt", "t": "md5sum secret.txt", "ta": ["sudo md5sum secret.txt"], "area": "inv"}, {"id": "A-06", "title": "Firewall depth: ufw internals, IPv6, unneeded daemons", "cmds": ["$ sudo ufw status numbered; sudo ufw delete <n>", "$ sudo ufw show added; sudo ufw show raw | less   (added lists your rules as typed; raw is the full loaded set, before.rules included)", "$ grep IPV6 /etc/default/ufw", "$ sudo iptables -S; sudo nft list ruleset 2>/dev/null | head -60", "$ sudo grep -nE 'ACCEPT.*--dport' /etc/ufw/before.rules /etc/ufw/user.rules 2>/dev/null", "$ sudo systemctl disable --now avahi-daemon cups rpcbind nfs-server bluetooth 2>/dev/null"], "why": "A rule planted in before.rules never shows in ufw status. IPv6 off in ufw leaves half the stack unfiltered.", "task": "show ufw rules with their numbers", "t": "sudo ufw status numbered", "ta": ["ufw status numbered"], "area": "config"}, {"id": "A-07", "title": {"u": "Version notes: Ubuntu 24.04 LTS, 26.04 LTS and Debian 13", "m": "Version notes: Linux Mint 22.3 and its Ubuntu base"}, "cmds": [{"u": "  This page targets Ubuntu 24.04 LTS (noble) with GNOME 46."}, {"u": "  24.04 ssh: socket-activated. ssh.socket holds port 22, so disable --now ssh alone leaves it listening; after a Port or ListenAddress change run systemctl daemon-reload, then systemctl restart ssh.socket"}, {"u": "  24.04 apt: deb822 sources in /etc/apt/sources.list.d/ubuntu.sources; /etc/apt/sources.list is only a pointer"}, {"u": "  24.04 AppArmor: unprivileged user namespaces are restricted, and many shipped profiles are in unconfined mode just to grant userns; never aa-enforce /etc/apparmor.d/*"}, {"u": "  24.04 Settings (GNOME 46): Users under System; Screen Lock under Privacy and Security; App Center replaces Ubuntu Software"}, {"u": "  24.04 also: pam_faillock (no pam_tally2), yescrypt hashes, unattended-upgrades on by default, systemd-timesyncd, Firefox as a snap, rsyslog, last and lastlog"}, {"u": "  26.04 LTS: sudo-rs is the default sudo (original sudo kept as sudo.ws); Rust coreutils (GNU cp, mv, rm kept); chrony with NTS replaces systemd-timesyncd on new installs; apt 3 (apt-key removed); Software and Updates app no longer installed by default"}, {"u": "  26.04 time: chronyc tracking shows Leap status Normal and a small System time offset while chrony keeps the clock; on 24.04, timedatectl status shows the same"}, {"u": "  26.04 sysctl: /etc/sysctl.conf is absent and skipped at boot; kernel settings live in /etc/sysctl.d/*.conf, and Ubuntu's defaults move to /usr/lib/sysctl.d/55-*.conf"}, {"u": "  Debian 13 (trixie): sudo group (not wheel), gdm3; may lack ufw, rsyslog, and unattended-upgrades (apt install them); no snaps; lastlog2 and wtmpdb replace lastlog and last; systemd-sysctl skips /etc/sysctl.conf"}, {"u": "  All of them: AppArmor present, /etc/ssh/sshd_config.d/ includes override the main file"}, {"m": "  Mint 22.3 \"Zena\" = Ubuntu 24.04 (noble) package base, Cinnamon 6.6: apt, pam_faillock, yescrypt hashes, AppArmor and ufw behave as on Ubuntu 24.04"}, {"m": "  openssh-server (when installed) is socket-activated: ssh.socket holds port 22, so disable it too; after a Port or ListenAddress change run systemctl daemon-reload, then systemctl restart ssh.socket"}, {"m": "  The noble AppArmor package ships some profiles in unconfined mode on purpose (they only grant user namespaces): never aa-enforce /etc/apparmor.d/*"}, {"m": "  LightDM + Cinnamon: /etc/lightdm/lightdm.conf, cinnamon-settings, gsettings org.cinnamon.*"}, {"m": "  Update Manager (mintupdate) replaces Software Updater; mintupdate-cli for the terminal"}, {"m": "  No snapd (nosnap.pref); Flatpak is enabled: flatpak list"}, {"m": "  Timeshift is preinstalled: snapshot first on practice VMs"}, {"m": "  Mint sources: /etc/apt/sources.list.d/official-package-repositories.list (zena and noble lines)"}], "why": {"u": "Knowing the defaults stops two wastes: hunting for a tool never installed, and calling a normal default a finding. Every other item holds across these releases; the differences live here.", "m": "Knowing which tools Mint ships keeps you from hunting for a GNOME setting that is not there, and from treating Mint's own files as findings."}}, {"id": "A-08", "title": "Verify loop, every thirty minutes", "cmds": ["$ sudo ss -tulpn; getent group sudo admin; awk -F: '$3==0' /etc/passwd", "$ sudo ufw status verbose; sudo aa-status | head -3; systemctl is-active auditd", {"u": "$ sudo awk -F: '$2==\"\"' /etc/shadow; awk -F: '$2!=\"x\"' /etc/passwd; sudo lsattr /etc/passwd /etc/shadow"}, {"m": "$ sudo awk -F: '$2==\"\"' /etc/shadow; awk -F: '$2!=\"x\"' /etc/passwd; getent group nopasswdlogin; sudo lsattr /etc/passwd /etc/shadow"}], "why": "Cron and timers undo fixes. Re-checking catches the undo, and anything you broke, before a user does.", "task": "print every UID-0 account line from /etc/passwd", "t": "awk -F: '$3==0' /etc/passwd", "ta": ["awk -F: $3==0 /etc/passwd", "awk -F: '$3==0 {print $1}' /etc/passwd", "awk -F: $3==0 {print $1} /etc/passwd"]}, {"id": "A-09", "title": "Lockout the managed way: pam-auth-update profiles", "area": "acct", "cmds": ["$ ls /usr/share/pam-configs/; grep '^Module:' /var/lib/pam/auth", "$ sudo nano /usr/share/pam-configs/faillock", "  Name: Enable pam_faillock to deny access", "  Default: yes", "  Priority: 0", "  Auth-Type: Primary", "  Auth:", "    [default=die] pam_faillock.so authfail", "$ sudo nano /usr/share/pam-configs/faillock_notify", "  Name: Notify of failed login attempts and reset count upon success", "  Default: yes", "  Priority: 1024", "  Auth-Type: Primary", "  Auth:", "    requisite pam_faillock.so preauth", "  Account-Type: Primary", "  Account:", "    required pam_faillock.so", "$ sudo pam-auth-update --enable faillock faillock_notify", "$ grep -n pam_faillock /etc/pam.d/common-auth /etc/pam.d/common-account"], "why": "pam-auth-update builds common-auth and common-account from /usr/share/pam-configs profiles, computing [success=N] jumps, so both files work on Ubuntu and Mint and survive package installs. Priority 1024 precedes pam_unix (256); 0 follows.", "note": "After B-06's hand edit, pam-auth-update prints 'Local modifications to /etc/pam.d/common-*, not updating.' yet exits 0: always reread common-auth. Restore your backup before rerunning, or add --force. faillock.conf keeps the numbers.", "also": "--force leaves /etc/pam.d/common-*.pam-old copies (move them out) and restores nullok (strip it, A-04). Retest su - (B-06) with a root shell open. Indent module lines under Auth: or Account: fields.", "task": "turn on the faillock and faillock_notify profiles without the menu", "t": "sudo pam-auth-update --enable faillock faillock_notify", "ta": ["pam-auth-update --enable faillock faillock_notify", "sudo pam-auth-update --enable faillock_notify faillock"]}, {"id": "A-10", "title": "Self-audit with Lynis", "area": "config", "cmds": ["$ sudo apt install -y lynis", "$ sudo lynis audit system --quick", "$ sudo grep -E '^(warning|suggestion)' /var/log/lynis-report.dat", "$ sudo grep '^hardening_index=' /var/log/lynis-report.dat", "$ sudo lynis show details <TEST-ID>"], "why": "Lynis reads the system without changing it, then reports warnings, suggestions, and a hardening index from 0 to 100. Run it before and after fixes; the index should climb.", "note": "A suggestion is a lead to check, since some would break a service the brief requires. show details prints the log lines behind one test ID from the report.", "task": "run a quick Lynis audit of the whole system", "t": "sudo lynis audit system --quick", "ta": ["sudo lynis audit system", "lynis audit system --quick"]}, {"id": "A-11", "title": "Investigate a live process: /proc, tracers, and hidden PIDs", "area": "malware", "cmds": ["$ sudo ls -l /proc/<pid>/exe   (a [kworker] or other kernel-thread name with a program file is a disguise)", "$ tr '\\0' ' ' < /proc/<pid>/cmdline; grep -E 'Name|PPid|Uid' /proc/<pid>/status", "$ sudo cat /proc/<pid>/environ | tr '\\0' '\\n'   (LD_PRELOAD here loads a library ahead of all others)", "$ sudo ls -l /proc/<pid>/fd; sudo cat /proc/<pid>/maps", "$ sudo pmap <pid>", "$ ldd /path/to/program   (a library in maps that ldd leaves out came from LD_PRELOAD or /etc/ld.so.preload)", "$ sudo strace -p <pid> -e trace=network   (connect() shows the address it calls; Ctrl+C detaches)", "$ sudo strace -f -p <pid> -e trace=file -s 200 -o /root/trace.txt", "$ sudo strace -p <pid> -e trace=process", "$ sudo apt install -y ltrace inotify-tools unhide", "$ sudo ltrace -p <pid> -e connect", "$ sudo fuser -v /path/to/file; sudo fuser -v -n tcp <port>", "$ sudo fuser -k -n tcp <port>   (kills every process on the port: read the -v list first)", "$ sudo inotifywait -m -r -e modify,create,delete /etc /var/spool/cron", "$ sudo unhide proc; sudo unhide sys; sudo unhide-tcp"], "why": "A process can rename itself, so read what the kernel records: its program file, open files, mapped libraries, and starting environment. A tracer then shows what it does right now, such as the address it calls and the files it reads. Record each answer, stop it, then remove its starter.", "note": {"u": "Yama's kernel.yama.ptrace_scope is 1 on Ubuntu, so a plain user may trace only its own children: attach with sudo. A real kernel thread shows PPid 2 and an empty exe link. A PID that unhide finds and ps leaves out points at a changed ps (sudo debsums -s) or a rootkit. ltrace, inotify-tools, and unhide install from universe.", "m": "Yama's kernel.yama.ptrace_scope is 1 on Linux Mint, so a plain user may trace only its own children: attach with sudo. A real kernel thread shows PPid 2 and an empty exe link. A PID that unhide finds and ps leaves out points at a changed ps (sudo debsums -s) or a rootkit. ltrace, inotify-tools, and unhide install from universe."}, "task": "attach strace to process 2210 and show only its network calls", "t": "sudo strace -p 2210 -e trace=network", "ta": ["strace -p 2210 -e trace=network", "sudo strace -e trace=network -p 2210", "sudo strace -p 2210 -e network", "sudo strace -e network -p 2210", "sudo strace -f -p 2210 -e trace=network"]}]}], "spot": [{"lvl": 0, "ask": "Lines from /etc/passwd. Tap the finding.", "lines": ["root:x:0:0:root:/root:/bin/bash", "keoni:x:1000:1000:Keoni:/home/keoni:/bin/bash", "sysadm:x:0:0::/home/sysadm:/bin/bash", "www-data:x:33:33:www-data:/var/www:/usr/sbin/nologin"], "finding": 2, "why": "A second UID-0 account is a second root. Remove it (after noting it for the investigation)."}, {"lvl": 0, "ask": "Output of getent group sudo. brief forbids FTP: disable it and remove the package."}, {"lvl": 2, "ask": "Output of sudo lsattr. Tap the finding.", "lines": ["--------------e------- /etc/shadow", "----i---------e------- /etc/passwd", "--------------e------- /etc/sudoers", "--------------e------- /etc/group"], "finding": 1, "why": "The i flag makes /etc/passwd immutable, so user changes fail with a misleading error. Clear it with sudo chattr -i /etc/passwd."}, {"lvl": 2, "ask": "Lines from /etc/sysctl.conf. Tap the finding.", "lines": ["net.ipv4.tcp_syncookies = 1", "net.ipv4.ip_forward = 1", "kernel.randomize_va_space = 2", "fs.protected_symlinks = 1"], "finding": 1, "why": "ip_forward=1 makes a workstation route traffic, a pivot for attackers. Set it to 0 and apply with sysctl --system."}], "judge": [{"lvl": 0, "brief": "Authorized administrators: keoni. Authorized users: koa, nohea.", "action": "Run sudo gpasswd -d koa sudo because koa is in the sudo group.", "answer": "fix", "why": "The brief lists koa as a standard user. Removing that account from sudo is least privilege."}, {"lvl": 0, "brief": "This server hosts the school website with Apache.", "action": "Run sudo apt purge apache2 to remove the web server.", "answer": "breaks", "why": "Required service. Keep it running and harden it: ServerTokens Prod, no directory listing, updates."}, {"lvl": 0, "brief": "Investigation 2: what is the SHA-256 hash of /home/koa/Music/track.mp3?", "action": "Delete all media files, then answer the investigation questions.", "answer": "check", "why": "Hash it first, then delete. Evidence before cleanup."}, {"lvl": 0, "brief": "Nothing in the brief mentions /opt/backup-agent.", "action": "Delete /opt/backup-agent because it is not a standard package.", "answer": "check", "why": "Unrecognized is distinct from unauthorized. Find what runs it (a systemd unit, a cron job, the file owner) and ask the system owner before removing a backup or monitoring agent."}, {"lvl": 0, "brief": "Only keoni may log in with SSH; stays; audit snap list for unapproved apps instead.", "only": "u"}, {"lvl": 0, "brief": "Timeshift is used for backups on this workstation.", "action": "Run sudo apt purge timeshift because backups are not a security control.", "answer": "breaks", "why": "Required software per the brief. Leave it; snapshots are also your own undo button.", "only": "m"}, {"lvl": 1, "brief": "The yearbook class installs approved apps through Flatpak.", "action": "Run sudo apt purge flatpak to remove an unneeded package manager.", "answer": "breaks", "why": "Required tooling. Audit flatpak list for unapproved apps instead.", "only": "m"}, {"lvl": 0, "brief": "Lock an account after three failed sign-ins until an admin releases it.", "action": "Set deny = 3 and unlock_time = 0 in /etc/security/faillock.conf, then move on.", "answer": "check", "why": "faillock.conf only holds the numbers. Confirm the pam_faillock lines are in common-auth (grep -n pam_faillock /etc/pam.d/common-auth); locking starts only with them."}, {"lvl": 0, "brief": "Ubuntu desktop: add account lockout to common-auth by hand.", "action": "Insert the authfail and authsucc lines after the existing [success=2 default=ignore] pam_unix.so line and leave the 2 as it is.", "answer": "breaks", "why": "The 2 now jumps past authfail and authsucc onto the pam_sss and pam_deny lines, so every correct password fails. Set it to [success=1], or use pam-auth-update (A-09).", "only": "u"}, {"lvl": 0, "brief": "No hacking tools are allowed on this machine.", "action": "Run sudo apt purge -y netcat-openbsd because netcat is on the banned list.", "answer": "check", "why": "netcat-openbsd is stock on Ubuntu and part of ubuntu-minimal, so the purge also removes that metapackage. Read the REMOVED list without -y, keep the stock nc unless the brief bans it by name, and hunt copies outside packages (A-02).", "only": "u"}, {"lvl": 0, "brief": "Every account must need a password to sign in.", "action": "Set a password with sudo passwd for each
