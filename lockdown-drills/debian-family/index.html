function docsSup(c){const r=REF.m[cmdKey(c)];if(!r)return '';const ids=r.map(i=>REF.ids[i]);if(ids.length===1)return '<sup class="docs">'+docsLink(ids[0],'docs')+'</sup>';
  return '<sup class="docs"><button type="button" class="docs-b" data-docs="1" aria-expanded="false" aria-label="docs for the '+ids.length+' commands on this line">docs</button></sup><span class="docs-l" hidden>'+ids.map(id=>docsLink(id,id.slice(id.indexOf('/')+1))).join(' · ')+'</span>';}
/* Learn it: the course units for a step, from LEARN_REF; a step without an entry takes its level's unit */
function levelLearn(L){return L.learn?[{href:DL+L.learn[0],label:L.learn[1]}]:[];}
function learnRefs(it,L){const us=(REF.u[it.id]||[]).map(u=>({href:SITE+'defense-ladder/#'+u,label:'Defense Ladder '+u.split('/')[1]+(REF.t[u]?', '+REF.t[u]:'')}));return us.length?us:levelLearn(L);}
function learnLine(it,L){const ls=learnRefs(it,L);return ls.length?'<p class="run-in learnref"><b>Learn it.</b> '+ls.map(l=>'<a href="'+esc(l.href)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>').join(' · ')+'</p>':'';}
/* moreBlock: the collapsed part of a Learn card. MORE keeps an opened card open while it redraws; showCard() starts each newly shown card collapsed */
const MORE=new Set();let SHOWN=null;
function showCard(id){if(SHOWN!==id){if(SHOWN)MORE.delete(SHOWN);SHOWN=id;}}
function moreBlock(id,label,inner){return '<details class="more" data-more="'+esc(id)+'"'+(MORE.has(id)?' open':'')+'><summary>'+label+'</summary><div class="in">'+inner+'</div></details>';}
function cmdsLabel(it){const n=it.cmds.length;return 'Commands and cautions <span class="n">('+n+(n===1?' line':' lines')+')</span>';}
function learnLink(L){return L.learn?' <a href="'+DL+L.learn[0]+'" target="_blank" rel="noopener">Learn it first: '+esc(L.learn[1])+'</a>':'';}
function termBlock(lines,withCopy,docs){
  const html=lines.map(c=>{const d=docs?docsSup(c):'';if(/^GUI:/.test(c))return '<div class="ln c"><span class="cx">'+esc(c)+'</span>'+d+'</div>';const [p,r]=splitCmd(c);return '<div class="ln'+(p?'':' c')+'">'+(p?'<span class="p">'+esc(p)+'</span> ':'')+'<span class="cx">'+esc(r)+'</span>'+d+'</div>';}).join('');
  return '<div class="term">'+(withCopy?'<div class="tb"><button class="copy" data-act="copy">Copy</button></div>':'')+html+'</div>';
}
function copyText(t,btn){const done=()=>{if(btn){btn.textContent='Copied';btn.classList.add('done');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('done');},1400);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallback());}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}}

/* drill */
let Q=null;
function makeQuiz(li){
  const L=APP.levels[li];const rank=it=>due(it)?0:days(it).length?2:1;
  const items=shuffle(L.items.slice()).sort((a,b)=>rank(a)-rank(b));
  const pool=allItems.filter(o=>o.li<=li);const qs=[];
  const distract=(it,fn,n)=>{const own=fn(it);const seen=new Set([own]);return shuffle(pool.filter(o=>o.id!==it.id&&!(it.ex||[]).includes(o.id)&&!(o.ex||[]).includes(it.id))).filter(o=>{const v=fn(o);if(!v||seen.has(v))return false;seen.add(v);return true;}).slice(0,n).map(o=>({t:fn(o),ok:false,src:o.id}));};
  const cmdOf=it=>stripped(firstCmd(it));
  /* recall kinds (pick the command, type it from memory) draw only from steps outside RANGED: a Lockdown Range check asks for the other steps' commands at a prompt */
  const free=items.filter(i=>!RANGED.has(i.id));const which=free.slice(0,4);const rest=items.filter(i=>!which.includes(i));
  const whatQ=it=>({type:'what',item:it,prompt:'What does this command do?',block:[firstCmd(it)],opts:shuffle([{t:it.title,ok:true,src:it.id},...distract(it,o=>o.title,3)])});
  which.forEach(it=>{const c=cmdOf(it);const opts=shuffle([{t:c,ok:true,src:it.id},...distract(it,cmdOf,3)]);qs.push({type:'which',item:it,prompt:'Which command does this?  '+it.title,opts,cmd:true});});
  rest.slice(0,2).forEach(it=>qs.push(whatQ(it)));
  const typed=items.filter(i=>i.t&&!RANGED.has(i.id)).slice(0,2);typed.forEach(it=>qs.push({type:'type',item:it,prompt:'Type the command: '+(it.task||it.title)}));
  const sp=shuffle((APP.spot||[]).filter(s=>(s.lvl==null?0:s.lvl)<=li));if(sp.length)qs.push(Object.assign({type:'spot'},sp[0]));
  const jd=shuffle((APP.judge||[]).filter(s=>(s.lvl==null?0:s.lvl)<=li));jd.slice(0,2).forEach(j=>qs.push(Object.assign({type:'judge'},j)));
  /* a round short of ten takes more questions of the other kinds, each one once: read a command, fix or break, spot the finding */
  const more=[rest.slice(2).map(it=>()=>whatQ(it)),jd.slice(2).map(j=>()=>Object.assign({type:'judge'},j)),sp.slice(1).map(s=>()=>Object.assign({type:'spot'},s))];
  for(let k=0;qs.length<10&&more.some(a=>a.length);k++){const a=more[k%3];if(a.length)qs.push(a.shift()());}
  return {li,qs:shuffle(qs).slice(0,10),i:0,correct:0,done:false,fb:null,res:[]};
}
const NUM=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
/* roundLead: how long a round at this level is, and which kinds it draws */
function roundLead(li){const n=NUM[makeQuiz(li).qs.length]+' questions pulled from this level: ';const p=APP.practice;
  return RANGED.size&&p?n+'read a command, spot the finding in real output, and call fix or break. Pick-the-command and type-from-memory questions cover the steps beyond the '+esc(p.label)+' checks; type the rest at a prompt in the <a href="'+esc(p.href)+'" target="_blank" rel="noopener">'+esc(p.label)+'</a>.':n+'pick the command, read a command, type one from memory, spot the finding in real output, and call fix or break.';}
function renderDrill(){
  const L=APP.levels[S.level];
  if(!Q||Q.li!==S.level||Q.finished){const b=badge(S.level);return '<div class="q"><h2>'+esc(L.name)+' drill</h2><p class="lead">'+roundLead(S.level)+' 80% earns the '+esc(L.name)+' badge once you have learned '+Math.ceil(L.items.length*.8)+' of '+L.items.length+' items.'+learnLink(L)+'</p><p>Best so far: <b class="mono">'+(b.best||0)+'%</b>'+(b.earned?' <span class="chip">badge earned '+L.badge+'</span>':'')+'</p><button class="btn primary" data-act="startq">Start the drill</button></div>';}
  const q=Q.qs[Q.i];let body='';
  if(q.type==='which'||q.type==='what'){body=(q.block?termBlock(q.block,false):'')+'<div class="opts">'+q.opts.map((o,i)=>'<button data-opt="'+i+'" class="'+(q.cmd?'cmd ':'')+(Q.fb?(o.ok?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+esc(o.t)+'</button>').join('')+'</div>';}
  else if(q.type==='type'){body='<input class="typein" data-type="1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type it here" '+(Q.fb?'disabled value="'+esc(Q.fb.given)+'"':'')+'>'+(Q.fb?'':'<div class="nav"><button class="btn primary" data-act="check">Check</button><button class="btn" data-act="skip">Show me</button></div>');}
  else if(q.type==='spot'){body='<p>'+esc(q.ask||'Tap the line that is the finding.')+'</p><div class="opts">'+q.lines.map((l,i)=>'<button data-opt="'+i+'" class="cmd '+(Q.fb?(i===q.finding?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+esc(l)+'</button>').join('')+'</div>';}
  else if(q.type==='judge'){body='<div class="brief"><b>Scenario brief says:</b> '+esc(q.brief)+'</div><p><b>You do this:</b> '+esc(q.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-opt="'+i+'" class="'+(Q.fb?(k===q.answer?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>';}
  const fb=Q.fb?'<div class="fb '+(Q.fb.ok?'ok':'bad')+'" aria-live="polite"><b>'+(Q.fb.ok?'Right.':'Not this time.')+'</b> '+esc(Q.fb.text)+(Q.fb.chosen?'<div class="picked">'+esc(Q.fb.chosen)+'</div>':'')+'</div><button class="btn primary" data-act="next">'+(Q.i===Q.qs.length-1?'See results':'Next question')+'</button>':'';
  return '<div class="q"><div class="count">Question '+(Q.i+1)+' of '+Q.qs.length+' · '+Q.correct+' correct</div><h2>'+esc(q.prompt||(q.type==='spot'?'Spot the finding':'Fix or break?'))+'</h2>'+body+fb+'</div>';
}
function pickWhy(q,pick){
  if(q.type==='which'||q.type==='what'){const o=q.opts[pick];const s=o&&o.src&&byId[o.src];if(!s)return '';return q.type==='which'?'What you picked, '+stripped(firstCmd(s))+', is "'+s.title+'": '+s.why:'What you picked, "'+s.title+'", is what '+stripped(firstCmd(s))+' does.';}
  if(q.type==='spot')return 'Line '+(pick+1)+' is ordinary output here. The finding is line '+(q.finding+1)+'.';
  if(q.type==='judge')return ({fix:'You called it a fix.',breaks:'You said it breaks a requirement.',check:'You chose to check first.'})[['fix','breaks','check'][pick]]||'';
  return '';
}
function answer(pick,given){
  const q=Q.qs[Q.i];let ok=false,text='';const why=q.item?q.item.why:'';
  if(q.type==='which'||q.type==='what'){ok=q.opts[pick].ok;text=why;}
  else if(q.type==='spot'){ok=pick===q.finding;text=q.why;}
  else if(q.type==='judge'){ok=['fix','breaks','check'][pick]===q.answer;text=q.why;}
  else if(q.type==='type'){const g=norm(given);const acc=[q.item.t].concat(q.item.ta||[]).map(norm);ok=acc.includes(g);text=(ok?'':'Answer: '+q.item.t+'. ')+why;}
  const chosen=ok?'':pickWhy(q,pick);
  if(ok&&q.item){const id=q.item.id,t=today();const a=S.days[id]=S.days[id]||((S.drilled[id]||0)>0?[0]:[]);if(!a.includes(t))a.push(t);S.drilled[id]=(S.drilled[id]||0)+1;}
  if(ok)Q.correct++;Q.res.push({q,ok,pick});save();
  Q.fb={ok,text,chosen,pick,given:given||''};
}
function finishQuiz(){const pct=Math.round(100*Q.correct/Q.qs.length);S.best[Q.li]=Math.max(S.best[Q.li]||0,pct);save();Q.finished=true;const b=badge(Q.li);const L=APP.levels[Q.li];
  const missed=Q.res.filter(r=>!r.ok);const mastered=L.items.filter(i=>status(i)==='mastered').length;const dueN=L.items.filter(due).length;
  const list=missed.length?'<h3>Worth another look</h3><div class="missed">'+missed.map(r=>{const it=r.q.item;const label=it?it.id+' · '+it.title:(r.q.type==='spot'?'Spot the finding':'Fix or break: '+r.q.action);return '<div class="miss"><span>'+esc(label)+'</span>'+(it?'<button class="btn small" data-learnjump="'+esc(it.id)+'">Open in Learn</button>':'')+'</div>';}).join('')+'</div>':'<p>Every question right.</p>';
  return '<div class="result"><div class="big">'+pct+'%</div><p>'+Q.correct+' of '+Q.qs.length+' right. '+(b.earned?'The '+esc(L.name)+' badge is yours: '+L.badge:(pct>=80?'The drill is there; learn '+(Math.ceil(L.items.length*.8)-b.learned)+' more items for the badge.':'Open each miss in Learn, then run it again.'))+'</p>'
   +'<p class="small">'+mastered+' of '+L.items.length+' items mastered: right on two different days.'+(dueN?' '+dueN+' due for a second day.':'')+'</p>'+list
   +'<div class="nav"><button class="btn primary" data-act="startq">Run it again</button><button class="btn" data-mode-go="learn">Back to Learn</button></div></div>';}

/* checklist notes: ticks and change, undo, and verify notes this browser holds, shown read-only with a Copy button */
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function runSets(){return (S.runs||[]).map(([d,R])=>[RAW.os[d]||d,R||{}]);}
function runLog(){const lines=[];runSets().forEach(([os,R])=>{const done=R.done||{},notes=R.notes||{},undo=R.undo||{},verify=R.verify||{};const has=k=>String(k||'').trim();
  [...new Set(Object.keys(done).concat(Object.keys(notes),Object.keys(undo),Object.keys(verify)))].filter(id=>done[id]!=null||has(notes[id])||has(undo[id])||has(verify[id])).sort((a,b)=>(done[a]??1e9)-(done[b]??1e9))
   .forEach(id=>lines.push('['+(done[id]!=null?fmt(done[id]):'--:--')+'] '+os+' | '+id+(byId[id]?' '+byId[id].title:'')+' | change: '+(has(notes[id])||'-')+' | undo: '+(has(undo[id])||'-')+' | verified: '+(has(verify[id])||'-')));});return lines;}
function runBlock(){const lines=runLog();if(!lines.length)return '';return '<details class="ex old" data-more="run-notes"'+(MORE.has('run-notes')?' open':'')+'><summary>Your checklist notes ('+lines.length+')</summary><p class="small">Checklist ticks and notes this browser holds, read-only. Copy them into your own notes.</p><pre>'+esc(lines.join('\n'))+'</pre><button class="btn small" data-act="copyrun">Copy</button></details>';}

}

  if(m==='drill'&&Q&&!Q.finished&&!Q.fb){const t=v.querySelector('.typein');if(t)t.focus();}
  if(m==='learn'){const on=v.querySelector('.list button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
}
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.distro){if(d.distro!==S.distro){S.distro=d.distro;setDistro(S.distro);Q=null;G={tab:G.tab,sc:0,picks:{},checked:false,jq:null,streak:0,jfb:null};save();render();}return;}
  if(d.level!=null){S.level=+d.level;if(S.mode==='drill'&&Q&&Q.li!==S.level)Q=null;save();render();return;}
  if(d.mode){S.mode=d.mode;save();render();return;}
  if(d.modeGo){S.mode=d.modeGo;save();render();return;}
  if(d.learnjump){const it=byId[d.learnjump];if(it){S.level=it.li;S.sel[it.li]=it.id;S.mode='learn';Q=null;save();render();}return;}
  if(d.sel){S.sel[S.level]=d.sel;save();render();return;}
  if(d.step){const L=APP.levels[S.level];const cur=S.sel[S.level]||L.items[0].id;const i=L.items.findIndex(x=>x.id===cur)+(+d.step);if(L.items[i]){S.sel[S.level]=L.items[i].id;save();render();}return;}
  if(d.act==='copy'){const term=b.closest('.term');const lines=[...term.querySelectorAll('.ln:not(.c)')].map(n=>n.querySelector('.cx').textContent).filter(l=>l.trim()).join('\n');copyText(lines,b);return;}
  if(d.docs){const l=b.parentNode.nextElementSibling;if(l){const open=l.hidden;l.hidden=!open;b.setAttribute('aria-expanded',String(open));}return;}
  if(d.act==='copyrun'){copyText(runLog().join('\n')+'\n',b);return;}
  if(d.act==='startq'){Q=makeQuiz(S.level);render();return;}
  if(d.opt!=null&&S.mode==='drill'&&Q&&!Q.fb){answer(+d.opt);render();return;}
  if(d.act==='check'){const t=$('.typein');answer(null,t?t.value:'');render();return;}
  if(d.act==='skip'){answer(null,'');render();return;}
  if(d.act==='next'){if(Q.i===Q.qs.length-1){$('#view').innerHTML=finishQuiz();renderHeader();$('#report').innerHTML=renderReport();}else{Q.i++;Q.fb=null;render();}return;}
  if(d.gtab){G.tab=d.gtab;G.jfb=null;render();return;}
  if(d.pick!=null&&!G.checked){G.picks[d.pick]=d.val;render();return;}
  if(d.act==='checksc'){G.checked=true;render();return;}
  if(d.act==='nextsc'){G.sc=(G.sc+1)%APP.imposter.length;G.picks={};G.checked=false;render();return;}
  if(d.jopt&&!G.jfb){const j=G.jq[0];const ok=d.jopt===j.answer;G.streak=ok?G.streak+1:0;G.jfb={ok,pick:d.jopt};render();return;}
  if(d.act==='jnext'){G.jq.push(G.jq.shift());G.jfb=null;render();return;}
  if(d.act==='reset'){if(confirm('Erase all progress for this trainer on this browser?')){const keep=S.distro;S=defaults();S.distro=keep;save();Q=null;render();}return;}
  if(b.id==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();renderHeader();return;}
});
document.addEventListener('toggle',e=>{const t=e.target,k=t.dataset&&t.dataset.more;if(k){if(t.open)MORE.add(k);else MORE.delete(k);}},true);
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.learn){const was=status(byId[d.learn]);S.learned[d.learn]=e.target.checked;if(!e.target.checked)delete S.learned[d.learn];save();render();const now=status(byId[d.learn]);if(now==='mastered'&&was!=='mastered'){const r=document.querySelector('[data-rr="'+d.learn+'"]');if(r)r.classList.add('flip');}return;}
});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.explain){S.explain[d.explain]=e.target.value;save();return;}
});
window.addEventListener('resize',()=>{if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches){S.mode='learn';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('typein')&&Q&&!Q.fb){answer(null,e.target.value);render();}});
render();
})(APP);
</script>

], ["Complain mode", "An AppArmor mode that logs what a profile would block (apparmor=\"ALLOWED\") and blocks nothing; enforce mode blocks."], ["Cron", "The scheduler that runs commands on a minute, hour, day, month, and weekday pattern."], ["curl", "A command-line tool that sends one web request and prints the answer; curl -sI shows only the response headers."], ["debsums", "A Debian tool that checks installed package files against the hashes their packages shipped."], ["Directory listing", "A web server feature that shows every file in a folder to any visitor when the folder has no index page."], ["Distribution", "A Linux kernel bundled with tools, a package manager, and a desktop, such as Debian, Ubuntu, or Linux Mint."], ["DNS", "The service that turns names into IP addresses."], ["Evidence", "The files, logs, and settings an investigation question depends on, kept unchanged until the question is answered."], ["Flatpak", "A cross-distribution app package format that Mint enables, listed with flatpak list."], ["GRUB password", "A superuser password in GRUB’s configuration that guards boot-line edits and recovery mode, which otherwise opens a root shell."], ["GTFOBins", "A public catalog of ordinary Unix programs that can open a shell or write files when given sudo or SUID. Auditors check sudo rules and SUID files against it."], ["Hardening", "Shrinking a system’s attack surface by removing what is unneeded and securely configuring what remains."], ["Hosts file", "A local file of name-to-address pairs that the system reads before DNS."], ["HTTP", "The request-and-response language of the web, sent as readable text on port 80."], ["HTTPS", "HTTP inside TLS on port 443: private and protected against tampering."], ["ICMP", "The IP helper protocol that carries error and test messages, such as ping."], ["Immutable flag", "A file attribute (chattr +i on Linux, schg on FreeBSD) that blocks every change, even by root, until it is cleared."], ["inetd", "A super-server that })();
