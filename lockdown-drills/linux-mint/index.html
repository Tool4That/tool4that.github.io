<style>
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#16212D; --muted:#5F6E7E; --line:#CFD7E0; --soft:#F4F6F9;
  --term:#0E1A2B; --termink:#D9E4F1; --prompt:#7FA6D6; --accent:#1F9D55; --accent-ink:#FFFFFF;
  --ok:#1C8A57; --okbg:#E3F5EB; --bad:#C03A3A; --badbg:#FBE7E7; --warn:#A8690F; --warnbg:#FBF0DA; --focus:#FFB300;
  --sans:"Segoe UI Variable Text","Segoe UI","Avenir Next",Avenir,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; } }
:root[data-theme="dark"]{ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) 16px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.brand{font-weight:800;letter-spacing:-.01em;font-size:1.15rem;line-height:1.1}
.brand span{display:block;font-weight:500;color:var(--muted);font-size:.85rem;letter-spacing:0}
.levels{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.levels button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.levels button.on{background:var(--accent);color:var(--accent-ink)}
.levels button .b{font-size:1rem}
.score{font-family:var(--mono);font-size:.95rem;white-space:nowrap}
.score b{font-size:1.2rem}
.theme{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.85rem}
.modes{display:flex;gap:2px;overflow-x:auto}
.modes button{border:0;background:transparent;padding:8px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.modes button.on{color:var(--ink);border-bottom-color:var(--accent)}
.series{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 0 8px;font-size:.82rem;color:var(--muted)}
.series a{color:var(--muted);text-decoration:none}.series a:hover{text-decoration:underline}.series b{color:var(--ink)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 110px)}
main{padding:18px 16px 40px;min-width:0}
aside.report{border-left:1px solid var(--line);background:var(--panel);padding:16px}
footer{padding:14px 16px 30px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);background:var(--panel)}
footer button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.85rem;margin-left:8px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lead{color:var(--muted);max-width:70ch;margin-bottom:16px}
/* learn */
.learn{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:grid;grid-template-columns:18px 54px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;line-height:1.25}
.list button.on{background:var(--soft)}
.list button .id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.learned{background:var(--accent)}.dot.drilled{background:var(--warn)}.dot.mastered{background:var(--ok)}
.item .meta{font-family:var(--mono);color:var(--muted);font-size:.85rem;margin-bottom:2px}
.term{background:var(--term);color:var(--termink);font-family:var(--mono);font-size:.86rem;line-height:1.5;border-radius:10px;padding:8px 14px 12px;margin:12px 0;overflow-x:auto}
.term .tb{display:flex;justify-content:flex-end;min-height:22px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding-left:1.4em;text-indent:-1.4em;margin:2px 0}
.term .p{color:var(--prompt)}
.term .ln.c{color:#9DB0C6;font-style:italic}
.term .copy{border:1px solid #2E4158;background:#17283D;color:var(--termink);border-radius:6px;padding:2px 9px;font:600 .75rem var(--sans)}
.term .copy.done{border-color:var(--ok);color:#8BE0B4}
.run-in b{font-weight:700}
.explain{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--soft)}
.explain textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);resize:vertical}
.explain label{display:flex;gap:10px;align-items:center;margin-top:8px;font-weight:600}
.explain input{width:20px;height:20px;accent-color:var(--ok)}
.nav{display:flex;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
/* drill */
.q{max-width:720px}
.q .count{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;line-height:1.35}
.opts button.cmd{font-family:var(--mono);font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.opts button.ok{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.typein{width:100%;max-width:560px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);background:var(--panel)}
.result{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:560px}
.result .big{font-size:2.4rem;font-weight:800;font-family:var(--mono)}
/* run */
.timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.timer .clock{font-family:var(--mono);font-size:2rem;font-weight:700;min-width:120px}
.timer select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.chk input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--ok)}
.chk .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chk .t .id{font-family:var(--mono);color:var(--muted);font-size:.8rem}
.chk .note{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;background:var(--panel);font-size:.9rem}
.chk.done .t{color:var(--muted);text-decoration:line-through}
.chk .stamp{font-family:var(--mono);font-size:.8rem;color:var(--ok)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
/* games */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.brief{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0 14px;max-width:720px}
.brief ul{margin:4px 0 0 18px;padding:0}
.acct{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);max-width:720px}
.acct .n{font-family:var(--mono)}
.acct .n small{color:var(--muted);font-family:var(--sans);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.acct.ok .n{color:var(--ok)}.acct.bad .n{color:var(--bad)}
.streak{font-family:var(--mono);color:var(--muted);font-size:.9rem}
/* report */
.report h2{font-size:1.05rem;margin-bottom:10px}
.lv{margin:10px 0 14px}
.lv .row{display:flex;justify-content:space-between;font-size:.9rem}
.lv .bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.lv .bar2 i{display:block;height:100%;background:var(--accent)}
.lv .bar2.earned i{background:var(--ok)}
.rr{display:grid;grid-template-columns:18px 52px 1fr 26px;gap:6px;align-items:center;font-size:.85rem;padding:3px 0;border-top:1px solid var(--line)}
.rr .id{font-family:var(--mono);color:var(--muted);font-size:.78rem}
.rr .pt{font-family:var(--mono);text-align:right;color:var(--muted)}
.rr.mastered .g{color:var(--ok);font-weight:800}.rr.mastered .pt{color:var(--ok)}
.rr.learned .g{color:var(--accent);font-weight:800}
.rr.drilled .g{color:var(--warn);font-weight:800}
.rr .g{text-align:center}
.rr.flip{animation:flip .35s ease-out}
@keyframes flip{0%{background:var(--okbg)}100%{background:transparent}}
.total{display:flex;justify-content:space-between;font-family:var(--mono);margin-top:10px;padding-top:8px;border-top:2px solid var(--ink)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted);margin-left:6px}
.empty{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion:reduce){ .rr.flip{animation:none} }
@media (max-width:1100px){ .wrap{grid-template-columns:1fr} aside.report{display:none;border-left:0;border-top:1px solid var(--line)} body[data-mode="report"] aside.report{display:block} body[data-mode="report"] main{display:none} .modes .rep{display:inline-block} }
@media (min-width:1101px){ .modes .rep{display:none} }
@media (max-width:760px){ header.top{position:static} .learn{grid-template-columns:1fr} .list{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px} .list button{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line)} .list button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .list button .ttl{display:none} .levels{margin-left:0} .score{margin-left:auto} }
</style>
</head>
<body data-mode="learn">
<header class="top">
  <div class="bar">
    <div class="brand" id="brand"></div>
    <div class="levels" id="levels" role="tablist" aria-label="Level"></div>
    <div class="score" id="score"></div>
    <button class="theme" id="theme" aria-label="Switch color theme">Theme</button>
  </div>
  <nav class="modes" id="modes" aria-label="Mode"></nav>
  <nav class="series" id="series" aria-label="Lockdown Drills series" hidden></nav>
</header>
<div class="wrap">
  <main id="view"></main>
  <aside class="report" id="report" aria-label="Progress report"></aside>
</div>
<footer id="foot"></footer>
<script>
const APP = {"key": "linux-mint", "os": "Linux Mint 22.3 (Cinnamon)", "accent": "#1F9D55", "footer": "Training tool for Linux Mint virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial practice; not affiliated with or endorsed by Linux Mint or Canonical.", "levels": [{"name": "Doorman", "badge": "🚪", "blurb": "Lock the doors. Users, admins, passwords, lockout, firewall, updates, junk software, obvious services, the Login Window. Mint is Ubuntu LTS underneath (see Version notes), with its own GUI tools on top.", "items": [{"id": "B-00", "title": "Scenario brief and evidence first", "cmds": ["GUI: open the scenario brief (the documented requirements for this machine) and write down authorized users, admins, required services, and anything forbidden", "$ sudo timeshift --create --comments \"before hardening\"   (practice VMs)"], "why": "Authorized users, admins and required services decide what is a fix and what breaks the business. Answer the investigation questions before changing anything.", "note": "Unfamiliar is not the same as unauthorized: leave backup and monitoring agents alone until the system owner confirms what they are. Keep a second terminal open as root (sudo -i) before touching PAM, sudoers or SSH so a typo cannot lock you out. Timeshift ships with Mint: a snapshot before you start is a free undo on practice VMs.", "area": "inv"}, {"id": "B-01", "title": "List human users, admins and UID-0 accounts", "cmds": ["$ awk -F: '$3>=1000 && $3<65534 {print $1\" uid=\"$3\" shell=\"$7}' /etc/passwd", "$ awk -F: '$3==0 {print $1}' /etc/passwd", "$ getent group sudo adm wheel docker lxd"], "why": "An extra UID-0 user is a second root. sudo, adm and wheel are admin groups. docker and lxd are root-equivalent because they can mount the host filesystem.", "task": "show who is in the sudo group", "t": "getent group sudo", "ta": ["grep sudo /etc/group", "grep ^sudo /etc/group"], "gui": "Menu, Administration, Users and Groups.", "area": "acct"}, {"id": "B-02", "title": "Remove or disable an unauthorized user", "cmds": ["$ sudo deluser --remove-home baduser", "$ sudo userdel -r baduser", "$ sudo usermod -L baduser && sudo usermod -s /usr/sbin/nologin baduser"], "why": "Deleting closes the login path; --remove-home removes planted files. Lock plus nologin disables without destroying evidence.", "note": "Run ps -u baduser first and kill their processes. The brief decides.", "task": "delete baduser and their home directory (Debian style)", "t": "sudo deluser --remove-home baduser", "ta": ["sudo userdel -r baduser", "deluser --remove-home baduser", "userdel -r baduser"], "area": "acct"}, {"id": "B-03", "title": "Fix admin group membership", "cmds": ["$ sudo gpasswd -d mallory sudo", "$ sudo usermod -aG sudo alice", "$ groups alice"], "why": "Least privilege. -aG appends; -G alone replaces every group the user had.", "task": "remove mallory from the sudo group", "t": "sudo gpasswd -d mallory sudo", "ta": ["gpasswd -d mallory sudo", "sudo deluser mallory sudo", "deluser mallory sudo"], "gui": "Users and Groups: Account type Standard or Administrator (Administrator = sudo group).", "area": "acct"}, {"id": "B-04", "title": "Passwords: strong, forced change, no empties, root locked", "cmds": ["$ sudo passwd alice", "$ sudo chage -d 0 alice", "$ sudo awk -F: '$2==\"\" {print $1\" HAS NO PASSWORD\"}' /etc/shadow", "$ sudo passwd -l root"], "why": "An empty shadow field means login with Enter. Locked root forces accountable sudo instead of a shared root password.", "note": "Record changed passwords somewhere safe (on paper, in a lab). Do not change the password of the account you sign in with unless the brief says so.", "task": "force alice to change her password at next login", "t": "sudo chage -d 0 alice", "ta": ["chage -d 0 alice", "sudo passwd -e alice", "passwd -e alice"], "area": "acct"}, {"id": "B-05", "title": "Password aging and quality", "cmds": ["$ sudo sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS\\t60/' /etc/login.defs", "$ sudo sed -i 's/^PASS_MIN_DAYS.*/PASS_MIN_DAYS\\t1/' /etc/login.defs", "$ sudo sed -i 's/^PASS_WARN_AGE.*/PASS_WARN_AGE\\t7/' /etc/login.defs", "$ sudo chage -M 60 -m 1 -W 7 alice", "$ sudo apt install -y libpam-pwquality", "$ sudo nano /etc/security/pwquality.conf", "  minlen = 12  dcredit = -1  ucredit = -1  lcredit = -1  ocredit = -1  difok = 3  maxrepeat = 3  enforce_for_root", "$ sudo nano /etc/pam.d/common-password", "  password  requisite  pam_pwquality.so retry=3        (ensure present)", "  ... pam_unix.so ... remember=5                       (add to the pam_unix line)"], "why": "login.defs only affects new users, so chage for existing ones. pwquality enforces complexity when a password is changed; remember= blocks reuse.", "note": "pam_pwquality is the quality module on Ubuntu, Mint and Debian alike. Leave obscure in place.", "task": "set alice: max age 60, min age 1, warn 7", "t": "sudo chage -M 60 -m 1 -W 7 alice", "ta": ["chage -M 60 -m 1 -W 7 alice"], "area": "acct"}, {"id": "B-06", "title": "Account lockout with pam_faillock", "cmds": ["$ sudo nano /etc/security/faillock.conf", "  deny = 5   unlock_time = 1800   fail_interval = 900", "$ sudo nano /etc/pam.d/common-auth          (order matters)", "  auth  required                   pam_faillock.so preauth silent", "  auth  [success=1 default=ignore] pam_unix.so            (existing line, remove nullok)", "  auth  [default=die]              pam_faillock.so authfail", "  auth  sufficient                 pam_faillock.so authsucc", "$ sudo nano /etc/pam.d/common-account       (add first)", "  account required pam_faillock.so", "$ sudo faillock --user alice", "$ sudo faillock --user alice --reset"], "why": "Stops online brute force. pam_faillock replaced pam_tally2, which current Ubuntu, Mint and Debian releases no longer ship. nullok allows empty passwords.", "note": "Test with su - alice in a second terminal before closing your root shell.", "task": "show alice's failed-login counter", "t": "sudo faillock --user alice", "ta": ["faillock --user alice"], "area": "acct"}, {"id": "B-07", "title": "Firewall with ufw", "cmds": ["$ sudo apt install -y ufw", "$ sudo ufw default deny incoming", "$ sudo ufw default allow outgoing", "$ sudo ufw allow 22/tcp", "$ sudo ufw enable", "$ sudo ufw logging on", "$ sudo ufw status verbose"], "why": "Default-deny inbound covers the service you have not found yet.", "note": "Only allow 22/tcp if the brief requires SSH. Add rules for required services (80/tcp, 443/tcp, 21/tcp).", "task": "turn the firewall on", "t": "sudo ufw enable", "ta": ["ufw enable"], "gui": "Menu, Preferences, Firewall Configuration (gufw): Status On, Incoming Deny, Outgoing Allow.", "area": "config"}, {"id": "B-08", "title": "Updates: now and automatic (Update Manager)", "cmds": ["GUI: Update Manager (shield icon), Refresh, Select All, Install Updates", "GUI: Update Manager, Edit, Preferences, Automation: Apply updates automatically On, Remove obsolete kernels On", "$ sudo mintupdate-cli upgrade -y", "$ sudo apt update && sudo apt upgrade -y", "$ apt list --upgradable", "$ sudo apt install -y unattended-upgrades && sudo dpkg-reconfigure -plow unattended-upgrades"], "why": "Two separate goals: patched now, and configured to keep patching. Mint hides the automation under Update Manager preferences; the apt route works too.", "note": "Start the upgrade first because it takes time. If Update Manager shows a broken mirror, fix Software Sources (I-11).", "task": "refresh the package list and install all upgrades", "t": "sudo apt update && sudo apt upgrade -y", "ta": ["sudo apt update; sudo apt upgrade -y", "apt update && apt upgrade -y", "sudo mintupdate-cli upgrade -y"], "area": "patch"}, {"id": "B-09", "title": "Remove unapproved software", "cmds": ["$ apt list --installed 2>/dev/null | grep -Ei 'nmap|zenmap|john|hydra|medusa|wireshark|aircrack|ophcrack|netcat|ncat|socat|telnetd|nikto|metasploit|hashcat|sqlmap|torrent|deluge|minetest|aisleriot|mahjongg|sudoku|freeciv|wesnoth'", "$ dpkg -l | grep -i <name>", "$ sudo apt purge --auto-remove -y nmap", "$ flatpak list", "$ flatpak uninstall -y <application-id>", "GUI: Software Manager (mintinstall), Installed"], "why": "Hacking tools, games and P2P clients are acceptable-use violations and attack surface.", "note": "Packages the brief requires (vsftpd, apache2, samba, openssh-server, mysql) stay; harden them in Watchman I-12. Mint blocks snapd with /etc/apt/preferences.d/nosnap.pref; that file is normal, not a finding. Flatpak apps hide from apt: list them separately.", "task": "completely remove the nmap package and its dependencies", "t": "sudo apt purge --auto-remove -y nmap", "ta": ["sudo apt purge -y nmap", "sudo apt remove --purge -y nmap", "apt purge --auto-remove -y nmap", "sudo apt purge nmap", "sudo apt-get purge -y nmap"], "area": "software"}, {"id": "B-10", "title": "Find unapproved media files", "cmds": ["$ sudo find / -type f \\( -iname '*.mp3' -o -iname '*.mp4' -o -iname '*.wav' -o -iname '*.mkv' -o -iname '*.avi' -o -iname '*.flac' -o -iname '*.mov' -o -iname '*.m4a' \\) -not -path '/usr/*' -not -path '/proc/*' -not -path '/snap/*' 2>/dev/null"], "why": "Many acceptable-use policies ban personal media on work machines, and the search also surfaces hidden folders in /home and /var/tmp.", "note": "Confirm, then rm. Write the path down in case an investigation question needs it.", "area": "data"}, {"id": "B-11", "title": "Services: what runs, what listens", "cmds": ["$ systemctl list-units --type=service --state=running", "$ sudo ss -tulpn", "$ sudo systemctl disable --now vsftpd", "$ sudo systemctl disable --now telnet.socket inetd xinetd 2>/dev/null"], "why": "Telnet and FTP are cleartext; avahi, cups, rpcbind, nfs and smb are exposure when nobody needs them. ss -tulpn shows the PID and program for every open port.", "note": "Required services stay. disable --now means stop it and do not start it at boot. Check what starts a service before you trust that: a systemd .socket unit can keep the port open after its .service is stopped (ss then shows systemd holding it).", "task": "show listening TCP and UDP sockets with their programs", "t": "sudo ss -tulpn", "ta": ["ss -tulpn", "sudo ss -tulnp", "sudo netstat -tulpn"], "area": "config"}, {"id": "B-12", "title": "Login Window: auto-login, guest sessions, screen lock", "cmds": ["GUI: Menu, Administration, Login Window, Users: Automatic login Off; Settings: Allow guest sessions Off", "$ sudo nano /etc/lightdm/lightdm.conf", "  [Seat:*]   autologin-user=   allow-guest=false", "$ gsettings set org.cinnamon.desktop.screensaver lock-enabled true", "$ gsettings set org.cinnamon.desktop.screensaver lock-delay 0", "$ gsettings set org.cinnamon.desktop.session idle-delay 300", "GUI: Menu, Preferences, Screensaver: Lock the computer when put to sleep On, Delay before locking 0"], "why": "Auto-login or a guest session means physical access is root in ten seconds; an unlocked idle desktop is the same thing a few minutes later.", "note": "gsettings changes the current user only; check each authorized user or set it in the GUI for each.", "area": "config"}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. SSH, sudoers, cron and timers, shell persistence, permissions and SUID, processes, AppArmor, auditing, apt sources, and hardening the services you must keep.", "items": [{"id": "I-01", "title": "SSH hardening, only when SSH is required", "cmds": ["$ sudo nano /etc/ssh/sshd_config            (then every file in /etc/ssh/sshd_config.d/)", "  PermitRootLogin no        PermitEmptyPasswords no     MaxAuthTries 3", "  LoginGraceTime 30         X11Forwarding no            UsePAM yes", "  PasswordAuthentication yes or no per the brief      AllowUsers alice bob", "$ sudo sshd -t && sudo systemctl restart ssh", "$ systemctl list-units 'ssh*' --no-pager     (is ssh.socket the unit that listens on 22?)", "$ sudo systemctl daemon-reload && sudo systemctl restart ssh.socket   (after a Port or ListenAddress change)", "$ sudo find / -name authorized_keys -exec ls -l {} \\; -exec cat {} \\; 2>/dev/null"], "why": "Root over SSH means no accountability and the prime brute-force target. A planted authorized_keys file is a password-less backdoor that survives every password you fix. Check how sshd is started: when ssh.socket owns port 22, a Port change or a disable aimed only at ssh.service does not do what you expect.", "note": "Not required: sudo systemctl disable --now ssh.socket ssh.service && sudo apt purge -y openssh-server, then confirm with sudo ss -tlpn that nothing holds port 22. Also read /etc/ssh/sshd_config.d/*.conf because Include files override.", "task": "test the sshd config and restart the service", "t": "sudo sshd -t && sudo systemctl restart ssh", "ta": ["sudo systemctl restart ssh", "sudo systemctl restart sshd", "sudo sshd -t; sudo systemctl restart ssh", "sudo sshd -t && sudo systemctl restart ssh.service", "sudo systemctl restart ssh.service"], "area": "access"}, {"id": "I-02", "title": "sudoers audit", "cmds": ["$ sudo grep -R -nE 'NOPASSWD|!authenticate|ALL=\\(ALL' /etc/sudoers /etc/sudoers.d/", "$ sudo visudo", "$ sudo visudo -f /etc/sudoers.d/<file>", "$ sudo -l -U mallory"], "why": "A NOPASSWD ALL line in a sudoers.d drop-in is a silent root backdoor. Never edit sudoers with nano: a syntax error means nobody can sudo.", "task": "edit the sudoers file safely", "t": "sudo visudo", "ta": ["visudo"], "area": "access"}, {"id": "I-03", "title": "Cron, at and systemd timers", "cmds": ["$ cat /etc/crontab; sudo ls -la /etc/cron.d /etc/cron.hourly /etc/cron.daily /var/spool/cron/crontabs", "$ for u in $(cut -d: -f1 /etc/passwd); do sudo crontab -l -u \"$u\" 2>/dev/null | sed \"s/^/$u: /\"; done", "$ systemctl list-timers --all", "$ sudo atq", "$ sudo crontab -r -u baduser"], "why": "Cron re-creates users, re-opens ports and re-installs tools every few minutes. It is the reason a fixed problem comes back.", "task": "list every systemd timer", "t": "systemctl list-timers --all", "ta": ["sudo systemctl list-timers --all", "systemctl list-timers"], "area": "malware"}, {"id": "I-04", "title": "Shell and startup persistence", "cmds": ["$ grep -R -nE 'alias|nc |ncat|bash -i|/dev/tcp|curl .*\\| *sh|wget .*\\| *sh' /etc/profile /etc/bash.bashrc /etc/profile.d/ /home/*/.bashrc /home/*/.profile /root/.bashrc 2>/dev/null", "$ cat /etc/rc.local 2>/dev/null; ls -la /etc/init.d/ /etc/systemd/system/", "$ systemctl list-unit-files --state=enabled"], "why": "An alias on sudo or a reverse shell in .bashrc runs every time a terminal opens, including the one you use to fix things.", "area": "malware"}, {"id": "I-05", "title": "Critical file permissions, world-writable, SUID", "cmds": ["$ sudo chown root:shadow /etc/shadow /etc/gshadow && sudo chmod 640 /etc/shadow /etc/gshadow", "$ sudo chown root:root /etc/passwd /etc/group && sudo chmod 644 /etc/passwd /etc/group", "$ sudo chown root:root /etc/sudoers && sudo chmod 440 /etc/sudoers", "$ sudo chmod 750 /home/*", "$ sudo find / -xdev -type f -perm -0002 -not -path '/proc/*' 2>/dev/null", "$ sudo find / -xdev -type d -perm -0002 ! -perm -1000 2>/dev/null", "$ sudo find / -xdev -type f \\( -perm -4000 -o -perm -2000 \\) 2>/dev/null", "$ sudo chmod u-s /path/to/evil"], "why": "A readable /etc/shadow means offline cracking. A writable /etc/passwd means make yourself root. SUID on bash, nmap, find or vim is instant root (see GTFOBins).", "note": "Normal SUID set: passwd su sudo mount umount ping chsh chfn gpasswd newgrp pkexec fusermount3 ssh-keysign. Anything else: investigate.", "task": "set /etc/shadow to mode 640", "t": "sudo chmod 640 /etc/shadow", "ta": ["chmod 640 /etc/shadow"], "area": "access"}, {"id": "I-06", "title": "Hosts file and name resolution", "cmds": ["$ cat /etc/hosts", "$ resolvectl status 2>/dev/null | grep -i 'DNS Servers'"], "why": "Redirecting packages.linuxmint.com or security.ubuntu.com to 127.0.0.1 breaks updates silently.", "task": "print the hosts file", "t": "cat /etc/hosts", "area": "config"}, {"id": "I-07", "title": "Processes and connections: find the backdoor", "cmds": ["$ ps -eo pid,ppid,user,cmd --sort=-%cpu | head -25", "$ ps -ef | grep -Ei 'nc |ncat|socat|bash -i|python.* -c|perl -e|xmrig|miner' | grep -v grep", "$ sudo ss -tulpn; sudo lsof -i -P -n | grep -Ei 'LISTEN|ESTABLISHED'", "$ sudo ls -l /proc/<pid>/exe; sudo cat /proc/<pid>/cmdline | tr '\\0' ' '", "$ sudo kill -9 <pid>"], "why": "Killing a process is pointless unless you also remove what starts it: cron, a systemd unit, rc.local, .bashrc. Find the parent, then the file.", "area": "malware"}, {"id": "I-08", "title": "AppArmor enforcing", "cmds": ["$ sudo apt install -y apparmor-utils", "$ sudo systemctl enable --now apparmor", "$ sudo aa-status", "$ sudo aa-enforce /etc/apparmor.d/<profile>     (only profiles aa-status lists in complain mode)"], "why": "Mandatory access control: a compromised service cannot read files outside its profile. Ubuntu and Mint enable it by default, so a stopped or disabled AppArmor is itself a finding.", "task": "show AppArmor status", "t": "sudo aa-status", "ta": ["aa-status", "sudo apparmor_status"], "note": "Never run aa-enforce on /etc/apparmor.d/*: some shipped profiles are deliberately in unconfined mode and only grant one permission (see Version notes), so enforcing them breaks those apps. Enforce by name, then test the apps the brief requires.", "area": "config"}, {"id": "I-09", "title": "Logging and audit", "cmds": ["$ systemctl status rsyslog --no-pager", "$ sudo apt install -y auditd && sudo systemctl enable --now auditd", "$ sudo nano /etc/audit/rules.d/hardening.rules", "  -w /etc/passwd -p wa -k identity", "  -w /etc/shadow -p wa -k identity", "  -w /etc/sudoers -p wa -k sudoers", "  -w /etc/sudoers.d/ -p wa -k sudoers", "$ sudo augenrules --load && sudo auditctl -l", "$ sudo ausearch -k identity", "$ last; lastlog; sudo lastb | head; who; w", "$ sudo grep -E 'Accepted|Failed|useradd|userdel|usermod' /var/log/auth.log | tail -40", "$ journalctl -p err -b --no-pager | tail"], "why": "Audit rules answer who changed /etc/passwd and when, which is exactly what an investigation needs.", "note": "If rsyslog is not installed (journald only, as on a default Debian install), use journalctl.", "task": "install auditd and start it now and at boot", "t": "sudo apt install -y auditd && sudo systemctl enable --now auditd", "ta": ["sudo systemctl enable --now auditd"], "area": "audit"}, {"id": "I-10", "title": "Account hygiene: shells, system accounts, odd groups", "cmds": ["$ grep -vE 'nologin|/bin/false|/bin/sync' /etc/passwd", "$ sudo usermod -s /usr/sbin/nologin <system-account>", "$ sudo chage -l alice", "$ getent group root shadow adm sudo docker lxd disk"], "why": "A service account with /bin/bash is a login. The disk group reads raw disks, which means the shadow file. Planted group memberships are quiet privilege.", "task": "show alice's password aging settings", "t": "sudo chage -l alice", "ta": ["chage -l alice"], "area": "acct"}, {"id": "I-11", "title": "Software Sources hygiene", "cmds": ["$ cat /etc/apt/sources.list.d/official-package-repositories.list /etc/apt/sources.list.d/*.list 2>/dev/null", "GUI: Menu, Administration, Software Sources: Official repositories, PPAs, Additional repositories", "$ ls -l /etc/apt/trusted.gpg.d/ /etc/apt/keyrings/ /etc/apt/preferences.d/ 2>/dev/null", "$ sudo apt update"], "why": "A malicious repository or key means apt upgrade installs the attacker's packages. Keep the official packages.linuxmint.com and archive.ubuntu.com lines; remove unknown PPAs and keys.", "note": "nosnap.pref in preferences.d is Mint's own and stays.", "area": "patch"}, {"id": "I-12", "title": "Harden required services instead of removing them", "cmds": ["  vsftpd  /etc/vsftpd.conf: anonymous_enable=NO  local_enable=YES  write_enable=NO  chroot_local_user=YES  ssl_enable=YES", "$ sudo systemctl restart vsftpd", "  apache2 /etc/apache2/conf-enabled/security.conf: ServerTokens Prod  ServerSignature Off  TraceEnable Off ; site config: Options -Indexes", "$ sudo apache2ctl configtest && sudo systemctl restart apache2", "  samba   /etc/samba/smb.conf [global]: map to guest = Never  restrict anonymous = 2 ; per share: guest ok = no", "$ testparm && sudo systemctl restart smbd", "$ sudo mysql_secure_installation", "  mysql   /etc/mysql/mysql.conf.d/mysqld.cnf: bind-address = 127.0.0.1", "$ sudo systemctl restart mysql"], "why": "Keeping the service running and making it safe is the real job, and real findings hide in these configs. Anonymous FTP is the classic.", "task": "run the MySQL hardening wizard", "t": "sudo mysql_secure_installation", "ta": ["mysql_secure_installation"], "area": "config"}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. Kernel and network sysctl, rootkits and tampered packages, the immutable-flag trap, PAM internals, forensics tooling, firewall depth, version notes.", "items": [{"id": "A-01", "title": "Kernel and network hardening with sysctl", "cmds": ["$ sudo nano /etc/sysctl.d/99-hardening.conf", "  net.ipv4.ip_forward = 0", "  net.ipv4.conf.all.accept_redirects = 0    net.ipv4.conf.default.accept_redirects = 0", "  net.ipv4.conf.all.send_redirects = 0      net.ipv4.conf.default.send_redirects = 0", "  net.ipv4.conf.all.accept_source_route = 0 net.ipv4.conf.all.rp_filter = 1", "  net.ipv4.conf.all.log_martians = 1        net.ipv4.tcp_syncookies = 1", "  net.ipv4.icmp_echo_ignore_broadcasts = 1  net.ipv4.icmp_ignore_bogus_error_responses = 1", "  net.ipv6.conf.all.accept_redirects = 0    net.ipv6.conf.all.accept_source_route = 0", "  kernel.randomize_va_space = 2   kernel.kptr_restrict = 2   kernel.dmesg_restrict = 1   kernel.sysrq = 0", "  fs.protected_hardlinks = 1   fs.protected_symlinks = 1   fs.suid_dumpable = 0", "$ sudo sysctl --system", "$ sysctl net.ipv4.ip_forward kernel.randomize_va_space"], "why": "ip_forward=1 turns the host into a pivot; syncookies and rp_filter blunt SYN floods and spoofing; ASLR at 2 and suid_dumpable 0 make exploitation harder.", "note": "A bad change can leave ip_forward=1 or randomize_va_space=0 in /etc/sysctl.conf or a file in /etc/sysctl.d/. grep for them.", "task": "apply every sysctl config file now", "t": "sudo sysctl --system", "ta": ["sysctl --system", "sudo sysctl -p"], "area": "config"}, {"id": "A-02", "title": "Rootkits, tampered packages, malware", "cmds": ["$ sudo apt install -y rkhunter chkrootkit debsums clamav", "$ sudo rkhunter --propupd && sudo rkhunter --check --sk", "$ sudo chkrootkit", "$ sudo debsums -c", "$ sudo systemctl stop clamav-freshclam; sudo freshclam; sudo clamscan -r -i /home /tmp /var/tmp /opt", "$ which nc ncat netcat socat; sudo find / -xdev -type f \\( -name nc -o -name ncat -o -name netcat -o -name socat \\) 2>/dev/null"], "why": "debsums catches a replaced /bin/ls or sshd; rkhunter knows rootkit paths; netcat binaries are the backdoor toolkit.", "note": "Signatures need internet. Run propupd early so rkhunter's baseline is the current, hopefully clean, state.", "task": "list installed package files that have been modified", "t": "sudo debsums -c", "ta": ["debsums -c"], "area": "malware"}, {"id": "A-03", "title": "The lsattr trap, core dumps, Ctrl-Alt-Del", "cmds": ["$ sudo lsattr /etc/passwd /etc/shadow /etc/sudoers /etc/ssh/sshd_config", "$ sudo chattr -i /etc/passwd", "$ sudo nano /etc/security/limits.conf", "  * hard core 0", "$ sudo systemctl mask ctrl-alt-del.target"], "why": "Attackers set the immutable flag so your useradd, passwd and chage silently fail. It is the number one reason a fix will not stick on a compromised machine.", "task": "remove the immutable flag from /etc/passwd", "t": "sudo chattr -i /etc/passwd", "ta": ["chattr -i /etc/passwd"], "area": "config"}, {"id": "A-04", "title": "PAM deep dive", "cmds": ["  required: must pass, keep going. requisite: must pass, stop on fail. sufficient: pass means done. optional.", "$ grep -nE 'nullok|pam_permit|pam_succeed_if' /etc/pam.d/common-auth /etc/pam.d/sudo /etc/pam.d/login /etc/pam.d/sshd", "$ sudo sed -i 's/ nullok//g' /etc/pam.d/common-auth", "$ grep -n 'pam_unix' /etc/pam.d/common-password"], "why": "An auth sufficient pam_permit.so line at the top of common-auth means any password works for everyone. An md5 hashing algorithm cracks fast; expect yescrypt or sha512, obscure, remember=5.", "task": "strip nullok from common-auth", "t": "sudo sed -i 's/ nullok//g' /etc/pam.d/common-auth", "ta": ["sudo sed -i s/ nullok//g /etc/pam.d/common-auth"], "area": "access"}, {"id": "A-05", "title": "Forensics toolkit", "cmds": ["$ sudo find / -xdev -type f -newermt \"2026-10-01\" -not -path '/proc/*' -not -path '/sys/*' -not -path '/var/lib/*' 2>/dev/null | head -60", "$ sudo find / -xdev \\( -nouser -o -nogroup \\) 2>/dev/null", "$ sudo find /home /root /tmp /var/tmp /dev/shm -name '.*' -type f 2>/dev/null", "$ stat <file>; file <file>; strings <file> | head; md5sum <file>; sha256sum <file>", "$ sudo journalctl _COMM=sudo --no-pager | tail -40", "$ sudo grep -E 'useradd|userdel|usermod|groupadd|passwd' /var/log/auth.log* 2>/dev/null"], "why": "Investigation questions usually want a hash, a timestamp, a hidden path, or who ran what. -newermt finds what changed most recently.", "task": "print the MD5 hash of secret.txt", "t": "md5sum secret.txt", "ta": ["sudo md5sum secret.txt"], "area": "inv"}, {"id": "A-06", "title": "Firewall depth: ufw internals, IPv6, unneeded daemons", "cmds": ["$ sudo ufw status numbered; sudo ufw delete <n>", "$ grep IPV6 /etc/default/ufw", "$ sudo iptables -S; sudo nft list ruleset 2>/dev/null | head -60", "$ sudo grep -nE 'ACCEPT.*--dport' /etc/ufw/before.rules /etc/ufw/user.rules 2>/dev/null", "$ sudo systemctl disable --now avahi-daemon cups rpcbind nfs-server bluetooth 2>/dev/null"], "why": "A rule planted in before.rules never shows in ufw status. IPv6 off in ufw leaves half the stack unfiltered.", "task": "show ufw rules with their numbers", "t": "sudo ufw status numbered", "ta": ["ufw status numbered"], "area": "config"}, {"id": "A-07", "title": "Version notes: Linux Mint 22.3 and its Ubuntu base", "cmds": ["  Mint 22.3 \"Zena\" = Ubuntu 24.04 (noble) package base, Cinnamon 6.6: apt, pam_faillock, yescrypt hashes, AppArmor and ufw behave as on Ubuntu 24.04", "  openssh-server (when installed) is socket-activated: ssh.socket holds port 22, so disable it too; after a Port or ListenAddress change run systemctl daemon-reload, then systemctl restart ssh.socket", "  The noble AppArmor package ships some profiles in unconfined mode on purpose (they only grant user namespaces): never aa-enforce /etc/apparmor.d/*", "  LightDM + Cinnamon: /etc/lightdm/lightdm.conf, cinnamon-settings, gsettings org.cinnamon.*", "  Update Manager (mintupdate) replaces Software Updater; mintupdate-cli for the terminal", "  No snapd (nosnap.pref); Flatpak is enabled: flatpak list", "  Timeshift is preinstalled: snapshot first on practice VMs", "  Mint sources: /etc/apt/sources.list.d/official-package-repositories.list (zena and noble lines)"], "why": "Knowing which tools Mint ships keeps you from hunting for a GNOME setting that is not there, and from treating Mint's own files as findings."}, {"id": "A-08", "title": "Verify loop, every thirty minutes", "cmds": ["$ sudo ss -tulpn; getent group sudo; awk -F: '$3==0' /etc/passwd", "$ sudo ufw status verbose; sudo aa-status | head -3; systemctl is-active auditd", "$ sudo awk -F: '$2==\"\"' /etc/shadow; sudo lsattr /etc/passwd /etc/shadow"], "why": "Cron and timers undo fixes. Re-checking catches the undo, and anything you broke, before a user does.", "task": "print every UID-0 account line from /etc/passwd", "t": "awk -F: '$3==0' /etc/passwd", "ta": ["awk -F: $3==0 /etc/passwd", "awk -F: '$3==0 {print $1}' /etc/passwd", "awk -F: $3==0 {print $1} /etc/passwd"]}]}], "spot": [{"lvl": 0, "ask": "Lines from /etc/pa   if(q.type==='which'||q.type==='what'){ok=q.opts[pick].ok;text=q.item.why;}
  else if(q.type==='spot'){ok=pick===q.finding;text=q.why;}
  else if(q.type==='judge'){ok=['fix','breaks','check'][pick]===q.answer;text=q.why;}
  else if(q.type==='type'){const g=norm(given);const acc=[q.item.t].concat(q.item.ta||[]).map(norm);ok=acc.includes(g);text=(ok?'':'Answer: '+q.item.t+'. ')+q.item.why;}
  if(ok){Q.correct++;if(q.item){S.drilled[q.item.id]=(S.drilled[q.item.id]||0)+1;save();}}
  Q.fb={ok,text,pick,given:given||''};
}
function finishQuiz(){const pct=Math.round(100*Q.correct/Q.qs.length);S.best[Q.li]=Math.max(S.best[Q.li]||0,pct);save();Q.finished=true;const b=badge(Q.li);const L=APP.levels[Q.li];
  return '<div class="result"><div class="big">'+pct+'%</div><p>'+Q.correct+' of '+Q.qs.length+' right. '+(b.earned?'The '+esc(L.name)+' badge is yours: '+L.badge:(pct>=80?'Score is there; learn '+(Math.ceil(L.items.length*.8)-b.learned)+' more items for the badge.':'Reread the misses in Learn and run it again.'))+'</p><div class="nav"><button class="btn primary" data-act="startq">Run it again</button><button class="btn" data-mode-go="learn">Back to Learn</button></div></div>';}
/* run */
let tick=null;const OPEN=new Set();
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function renderRun(){
  const R=S.run;const items=allItems.filter(i=>i.li===S.level||(R.lower&&i.li<S.level));
  const remain=Math.max(0,R.mins*60-R.elapsed);
  const rows=items.map(i=>'<div class="chk '+(R.done[i.id]!=null?'done':'')+'"><input type="checkbox" data-done="'+i.id+'" '+(R.done[i.id]!=null?'checked':'')+' aria-label="Done: '+esc(i.title)+'"><div><div class="t"><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span>'+(R.done[i.id]!=null?'<span class="stamp">'+fmt(R.done[i.id])+'</span>':'')+'<button class="btn small" data-show="'+i.id+'">Commands</button></div><div id="show-'+i.id+'"'+(OPEN.has(i.id)?'':' hidden')+'>'+termBlock(i.cmds,true)+'</div><input class="note" data-note="'+i.id+'" placeholder="Change log: what you changed and why" value="'+esc(R.notes[i.id]||'')+'"></div></div>').join('');
  return '<h2>Run the checklist on your VM</h2><p class="lead">Set the clock, work the list top to bottom, tick each item when it is actually done on the machine, and write a one-line change log. The log is what lets you undo a change that broke something in thirty seconds.</p>'
   +'<div class="timer"><div class="clock" aria-live="off">'+fmt(remain)+'</div><select data-mins>'+[20,45,60,90,120].map(m=>'<option value="'+m+'" '+(m===R.mins?'selected':'')+'>'+m+' min</option>').join('')+'</select><button class="btn primary" data-act="timer">'+(tick?'Pause':'Start')+'</button><button class="btn" data-act="resetclock">Reset clock</button><label class="toggle"><input type="checkbox" data-lower '+(R.lower?'checked':'')+'> include lower levels</label></div>'
   +'<div class="nav" style="margin:0 0 10px"><button class="btn small" data-act="copylog">Copy change log</button><button class="btn small" data-act="dlog">Download change log</button><button class="btn small" data-act="clearrun">Clear this run</button></div>'
   +rows;
}
function changeLog(){const R=S.run;const lines=allItems.filter(i=>R.done[i.id]!=null||R.notes[i.id]).sort((a,b)=>(R.done[a.id]??1e9)-(R.done[b.id]??1e9)).map(i=>'['+(R.done[i.id]!=null?fmt(R.done[i.id]):'--:--')+'] '+i.id+' '+i.title+(R.notes[i.id]?' -- '+R.notes[i.id]:''));
  return '# Change log - '+APP.os+' - '+new Date().toLocaleString()+'\n'+(lines.join('\n')||'(nothing logged yet)')+'\n';}
function startTimer(){if(tick)return;tick=setInterval(()=>{S.run.elapsed++;if(S.run.elapsed%5===0)save();const c=document.querySelector('.clock');if(c)c.textContent=fmt(Math.max(0,S.run.mins*60-S.run.elapsed));if(S.run.elapsed>=S.run.mins*60){stopTimer();render();}},1000);}
function stopTimer(){clearInterval(tick);tick=null;save();}
/* games */
let G={tab:'imposter',sc:0,picks:{},checked:false,jq:null,streak:0,jfb:null};
function renderGames(){
  const tabs='<div class="tabs"><button class="btn '+(G.tab==='imposter'?'primary':'')+'" data-gtab="imposter">Who is the imposter?</button><button class="btn '+(G.tab==='judge'?'primary':'')+'" data-gtab="judge">Fix or break?</button></div>';
  if(G.tab==='imposter'){const sc=APP.imposter[G.sc];
    const rows=sc.accounts.map((a,i)=>{const p=G.picks[i]||'keep';const cls=G.checked?(p===a.truth?'ok':'bad'):'';return '<div class="acct '+cls+'"><div class="n">'+esc(a.name)+'<small>'+esc(a.info)+'</small></div><div class="seg">'+['keep','remove'].concat(a.admin?['demote']:[]).map(k=>'<button data-pick="'+i+'" data-val="'+k+'" class="'+(p===k?'on':'')+'" '+(G.checked?'disabled':'')+'>'+({keep:'Keep',remove:'Remove',demote:'Demote'})[k]+'</button>').join('')+'</div></div>'+(G.checked&&p!==a.truth?'<div class="fb bad">'+esc(a.why)+'</div>':'');}).join('');
    const right=G.checked?sc.accounts.filter((a,i)=>(G.picks[i]||'keep')===a.truth).length:0;
    return tabs+'<h2>'+esc(sc.title)+'</h2><p class="lead">Read the scenario brief, then decide for every account: keep it, remove it, or demote it from admin. The brief is the documented source of truth; when it is unclear, ask the system owner before you delete anything.</p><div class="brief"><b>Scenario brief</b><ul>'+sc.brief.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>'+termBlock(sc.output,false)+rows
      +(G.checked?'<div class="fb '+(right===sc.accounts.length?'ok':'bad')+'" style="max-width:720px">'+right+' of '+sc.accounts.length+' correct. '+esc(sc.debrief)+'</div>':'')+'<div class="nav"><button class="btn primary" data-act="'+(G.checked?'nextsc':'checksc')+'">'+(G.checked?'Next scenario':'Check my calls')+'</button></div>';
  }
  if(!G.jq){G.jq=shuffle(APP.judge.slice());}const j=G.jq[0];
  const fb=G.jfb?'<div class="fb '+(G.jfb.ok?'ok':'bad')+'"><b>'+(G.jfb.ok?'Right.':'Not this time.')+'</b> '+esc(j.why)+'</div><button class="btn primary" data-act="jnext">Next</button>':'';
  return tabs+'<div class="q"><div class="streak">streak '+G.streak+'</div><h2>Fix or break?</h2><div class="brief"><b>Scenario brief says:</b> '+esc(j.brief)+'</div><p><b>You do this:</b> '+esc(j.action)+'</p><div class="opts">'+['fix','penalty','check'].map((k,i)=>'<button data-jopt="'+k+'" class="'+(G.jfb?(k===j.answer?'ok':(G.jfb.pick===k?'bad':'')):'')+'" '+(G.jfb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>'+fb+'</div>';
}
/* report */
function renderReport(){
  const lv=APP.levels.map((L,i)=>{const b=badge(i);return '<div class="lv"><div class="row"><span>'+(b.earned?L.badge+' ':'')+esc(L.name)+'</span><span class="mono">'+b.learned+'/'+b.total+' learned · best '+(b.best||0)+'%</span></div><div class="bar2 '+(b.earned?'earned':'')+'"><i style="width:'+Math.round(100*b.learned/b.total)+'%"></i></div></div>';}).join('');
  const rows=allItems.map(i=>{const st=status(i);const g={mastered:'✓',learned:'◐',drilled:'◔',none:'·'}[st];return '<div class="rr '+st+'" data-rr="'+i.id+'"><span class="g">'+g+'</span><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span><span class="pt">'+itemScore(i)+'</span></div>';}).join('');
  return '<h2>Progress report</h2>'+lv+'<p style="font-size:.8rem;color:var(--muted)">✓ learned and drilled · ◐ learned · ◔ drilled only</p>'+rows+'<div class="total"><span>Total</span><span>'+score()+' / '+maxScore+'</span></div>';
}
function renderFoot(){$('#foot').innerHTML=esc(APP.footer||'Training tool for virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist.')+' <button data-act="reset">Reset my progress</button>';}
function render(){
  if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches)S.mode='learn';
  renderHeader();
  const v=$('#view');const m=S.mode;
  v.innerHTML=m==='learn'?renderLearn():m==='drill'?renderDrill():m==='run'?renderRun():m==='games'?renderGames():'';
  $('#report').innerHTML=renderReport();renderFoot();
  if(m==='drill'&&Q&&!Q.finished&&!Q.fb){const t=v.querySelector('.typein');if(t)t.focus();}
  if(m==='learn'){const on=v.querySelector('.list button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
}
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.level!=null){S.level=+d.level;if(S.mode==='drill'&&Q&&Q.li!==S.level)Q=null;save();render();return;}
  if(d.mode){S.mode=d.mode;save();render();return;}
  if(d.modeGo){S.mode=d.modeGo;save();render();return;}
  if(d.sel){S.sel[S.level]=d.sel;save();render();return;}
  if(d.step){const L=APP.levels[S.level];const cur=S.sel[S.level]||L.items[0].id;const i=L.items.findIndex(x=>x.id===cur)+(+d.step);if(L.items[i]){S.sel[S.level]=L.items[i].id;save();render();}return;}
  if(d.act==='copy'){const term=b.closest('.term');const lines=[...term.querySelectorAll('.ln:not(.c)')].map(n=>n.textContent.replace(PRE,'')).filter(l=>l.trim()).join('\n');copyText(lines,b);return;}
  if(d.act==='startq'){Q=makeQuiz(S.level);render();return;}
  if(d.opt!=null&&S.mode==='drill'&&Q&&!Q.fb){answer(+d.opt);render();return;}
  if(d.act==='check'){const t=$('.typein');answer(null,t?t.value:'');render();return;}
  if(d.act==='skip'){answer(null,'');render();return;}
  if(d.act==='next'){if(Q.i===Q.qs.length-1){$('#view').innerHTML=finishQuiz();renderHeader();$('#report').innerHTML=renderReport();}else{Q.i++;Q.fb=null;render();}return;}
  if(d.act==='timer'){tick?stopTimer():startTimer();render();return;}
  if(d.act==='resetclock'){stopTimer();S.run.elapsed=0;save();render();return;}
  if(d.act==='clearrun'){if(confirm('Clear all ticks, timestamps and notes for this run?')){stopTimer();S.run.done={};S.run.notes={};S.run.elapsed=0;save();render();}return;}
  if(d.act==='copylog'){copyText(changeLog(),b);return;}
  if(d.act==='dlog'){const blob=new Blob([changeLog()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='change-log-'+APP.key+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}
  if(d.show){const el=document.getElementById('show-'+d.show);if(el){el.hidden=!el.hidden;if(el.hidden)OPEN.delete(d.show);else OPEN.add(d.show);}return;}
  if(d.gtab){G.tab=d.gtab;G.jfb=null;render();return;}
  if(d.pick!=null&&!G.checked){G.picks[d.pick]=d.val;render();return;}
  if(d.act==='checksc'){G.checked=true;render();return;}
  if(d.act==='nextsc'){G.sc=(G.sc+1)%APP.imposter.length;G.picks={};G.checked=false;render();return;}
  if(d.jopt&&!G.jfb){const j=G.jq[0];const ok=d.jopt===j.answer;G.streak=ok?G.streak+1:0;G.jfb={ok,pick:d.jopt};render();return;}
  if(d.act==='jnext'){G.jq.push(G.jq.shift());G.jfb=null;render();return;}
  if(d.act==='reset'){if(confirm('Erase all progress for this trainer on this browser?')){stopTimer();S=defaults();save();Q=null;render();}return;}
  if(b.id==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();renderHeader();return;}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.learn){const was=status(byId[d.learn]);S.learned[d.learn]=e.target.checked;if(!e.target.checked)delete S.learned[d.learn];save();render();const now=status(byId[d.learn]);if(now==='mastered'&&was!=='mastered'){const r=document.querySelector('[data-rr="'+d.learn+'"]');if(r)r.classList.add('flip');}return;}
  if(d.done){if(e.target.checked)S.run.done[d.done]=S.run.elapsed;else delete S.run.done[d.done];save();render();return;}
  if(d.mins!=null){S.run.mins=+e.target.value;S.run.elapsed=0;save();render();return;}
  if(d.lower!=null){S.run.lower=e.target.checked;save();render();return;}
});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.explain){S.explain[d.explain]=e.target.value;save();return;}
  if(d.note){S.run.notes[d.note]=e.target.value;save();return;}
});
window.addEventListener('resize',()=>{if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches){S.mode='learn';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('typein')&&Q&&!Q.fb){answer(null,e.target.value);render();}});
render();
})();
</script>
