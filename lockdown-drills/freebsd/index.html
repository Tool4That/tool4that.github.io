<style>
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#16212D; --muted:#5F6E7E; --line:#CFD7E0; --soft:#F4F6F9;
  --term:#0E1A2B; --termink:#D9E4F1; --prompt:#7FA6D6; --accent:#AB2B28; --accent-ink:#FFFFFF;
  --ok:#1C8A57; --okbg:#E3F5EB; --bad:#C03A3A; --badbg:#FBE7E7; --warn:#A8690F; --warnbg:#FBF0DA; --focus:#FFB300;
  --sans:"Segoe UI Variable Text","Segoe UI","Avenir Next",Avenir,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; --link:#F28B82; } }
:root[data-theme="dark"]{ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; --link:#F28B82; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--link,var(--accent))}
code,.mono{font-family:var(--mono)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) 16px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.brand{font-weight:800;letter-spacing:-.01em;font-size:1.15rem;line-height:1.1}
.brand span{display:block;font-weight:500;color:var(--muted);font-size:.85rem;letter-spacing:0}
.levels{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.levels button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.levels button.on{background:var(--accent);color:var(--accent-ink)}
.levels button .b{font-size:1rem}
.score{font-family:var(--mono);font-size:.95rem;white-space:nowrap}
.score b{font-size:1.2rem}
.theme{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.85rem}
.modes{display:flex;gap:2px;overflow-x:auto}
.modes button{border:0;background:transparent;padding:8px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.modes button.on{color:var(--ink);border-bottom-color:var(--accent)}
.series{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 0 8px;font-size:.82rem;color:var(--muted)}
.series a{color:var(--muted);text-decoration:none}.series a:hover{text-decoration:underline}.series b{color:var(--ink)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 110px)}
main{padding:18px 16px 40px;min-width:0}
aside.report{border-left:1px solid var(--line);background:var(--panel);padding:16px}
footer{padding:14px 16px 30px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);background:var(--panel)}
footer button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.85rem;margin-left:8px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lead{color:var(--muted);max-width:70ch;margin-bottom:16px}.track{font-weight:600;max-width:70ch;margin:0 0 6px}
/* learn */
.learn{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:grid;grid-template-columns:18px 54px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;line-height:1.25}
.list button.on{background:var(--soft)}
.list button .id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.learned{background:var(--accent)}.dot.drilled{background:var(--warn)}.dot.mastered{background:var(--ok)}
.item .meta{font-family:var(--mono);color:var(--muted);font-size:.85rem;margin-bottom:2px}
.term{background:var(--term);color:var(--termink);font-family:var(--mono);font-size:.86rem;line-height:1.5;border-radius:10px;padding:8px 14px 12px;margin:12px 0;overflow-x:auto}
.term .tb{display:flex;justify-content:flex-end;min-height:22px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding-left:1.4em;text-indent:-1.4em;margin:2px 0}
.term .p{color:var(--prompt)}
.term .ln.c{color:#9DB0C6;font-style:italic}
.term .copy{border:1px solid #2E4158;background:#17283D;color:var(--termink);border-radius:6px;padding:2px 9px;font:600 .75rem var(--sans)}
.term .copy.done{border-color:var(--ok);color:#8BE0B4}
.run-in b{font-weight:700}
.explain{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--soft)}
.explain textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);resize:vertical}
.explain label{display:flex;gap:10px;align-items:center;margin-top:8px;font-weight:600}
.explain input{width:20px;height:20px;accent-color:var(--ok)}
.nav{display:flex;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
/* drill */
.q{max-width:720px}
.q .count{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;line-height:1.35}
.opts button.cmd{font-family:var(--mono);font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.opts button.ok{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.typein{width:100%;max-width:560px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);background:var(--panel)}
.result{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:560px}
.result .big{font-size:2.4rem;font-weight:800;font-family:var(--mono)}
/* run */
.timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.timer .clock{font-family:var(--mono);font-size:2rem;font-weight:700;min-width:120px}
.timer select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.chk input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--ok)}
.chk .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chk .t .id{font-family:var(--mono);color:var(--muted);font-size:.8rem}
.chk .note{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;background:var(--panel);font-size:.9rem}
.chk.done .t{color:var(--muted);text-decoration:line-through}
.chk .stamp{font-family:var(--mono);font-size:.8rem;color:var(--ok)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
/* games */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.brief{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0 14px;max-width:720px}
.brief ul{margin:4px 0 0 18px;padding:0}
.acct{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);max-width:720px}
.acct .n{font-family:var(--mono)}
.acct .n small{color:var(--muted);font-family:var(--sans);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.acct.ok .n{color:var(--ok)}.acct.bad .n{color:var(--bad)}
.streak{font-family:var(--mono);color:var(--muted);font-size:.9rem}
/* report */
.report h2{font-size:1.05rem;margin-bottom:10px}
.lv{margin:10px 0 14px}
.lv .row{display:flex;justify-content:space-between;font-size:.9rem}
.lv .bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.lv .bar2 i{display:block;height:100%;background:var(--accent)}
.lv .bar2.earned i{background:var(--ok)}
.rr{display:grid;grid-template-columns:18px 52px 1fr 26px;gap:6px;align-items:center;font-size:.85rem;padding:3px 0;border-top:1px solid var(--line)}
.rr .id{font-family:var(--mono);color:var(--muted);font-size:.78rem}
.rr .pt{font-family:var(--mono);text-align:right;color:var(--muted)}
.rr.mastered .g{color:var(--ok);font-weight:800}.rr.mastered .pt{color:var(--ok)}
.rr.learned .g{color:var(--accent);font-weight:800}
.rr.drilled .g{color:var(--warn);font-weight:800}
.rr .g{text-align:center}
.rr.flip{animation:flip .35s ease-out}
@keyframes flip{0%{background:var(--okbg)}100%{background:transparent}}
.total{display:flex;justify-content:space-between;font-family:var(--mono);margin-top:10px;padding-top:8px;border-top:2px solid var(--ink)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted);margin-left:6px}
.empty{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion:reduce){ .rr.flip{animation:none} }
@media (max-width:1100px){ .wrap{grid-template-columns:1fr} aside.report{display:none;border-left:0;border-top:1px solid var(--line)} body[data-mode="report"] aside.report{display:block} body[data-mode="report"] main{display:none} .modes .rep{display:inline-block} }
@media (min-width:1101px){ .modes .rep{display:none} }
@media (max-width:760px){ header.top{position:static} .learn{grid-template-columns:1fr} .list{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px} .list button{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line)} .list button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .list button .ttl{display:none} .levels{margin-left:0} .score{margin-left:auto} }
</style>
</head>
<body data-mode="learn">
<header class="top">
  <div class="bar">
    <div class="brand" id="brand"></div>
    <div class="levels" id="levels" role="tablist" aria-label="Level"></div>
    <div class="score" id="score"></div>
    <button class="theme" id="theme" aria-label="Switch color theme">Theme</button>
  </div>
  <nav class="modes" id="modes" aria-label="Mode"></nav>
  <nav class="series" id="series" aria-label="Lockdown Drills series" hidden></nav>
</header>
<div class="wrap">
  <main id="view"></main>
  <aside class="report" id="report" aria-label="Progress report"></aside>
</div>
<footer id="foot"></footer>
<script>
const APP = {"key": "freebsd", "os": "FreeBSD 15.1", "accent": "#AB2B28", "footer": "Training tool for FreeBSD virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial practice; not affiliated with or endorsed by the FreeBSD Project.", "track": "Senior track. Start with Defense Ladder se1, FreeBSD; Doorman, Watchman, and Hunter then run in that order inside Senior.", "levels": [{"name": "Doorman", "badge": "🚪", "blurb": "Lock the doors, BSD style. Users and the wheel group, master.passwd, login.conf policy, pf, freebsd-update and pkg, rc.conf services, the console. Commands below run as root: from a wheel account, run su - first, or use sudo or doas where their own rule files grant you access.", "learn": ["senior/se1", "Defense Ladder se1, FreeBSD"], "items": [{"id": "B-00", "title": "Scenario brief and evidence first", "cmds": ["  Read the scenario brief (the documented requirements for this machine): authorized users, wheel members, required services, anything forbidden", "# freebsd-version -kru; uname -a", "# cat /etc/rc.conf"], "why": "Authorized users, wheel members, and required services decide what is a fix and what breaks the business. rc.conf is the service list on FreeBSD; read it before touching anything.", "note": "Evidence first: answer the investigation questions before any change (Defense Ladder f1). Unfamiliar is distinct from unauthorized: trace it and ask before removing an agent (Defense Ladder s1). Keep a second root shell open before editing pam, login.conf, or sshd_config.", "area": "inv"}, {"id": "B-01", "title": "List users, UID 0 accounts, and the wheel group", "cmds": ["# pw usershow -a | awk -F: '$3>=1000 && $3<65534 {print $1\" uid=\"$3\" shell=\"$10}'", "# awk -F: '$3==0 {print $1}' /etc/passwd", "# awk -F: '$1==\"toor\" {print $1\": \"$2}' /etc/master.passwd", "# pw groupshow wheel"], "why": "wheel is the group that may su to root. sudo, a package, follows /usr/local/etc/sudoers, where the line %wheel ALL=(ALL:ALL) ALL works once you uncomment it (leave the NOPASSWD line commented). A UID-0 account other than root is a second root, with one exception: toor is FreeBSD's default disabled alternate root and is normal while its hash is a star.", "note": "toor with a real hash instead of * means someone set it a password. That is a finding.", "task": "show the members of the wheel group", "t": "pw groupshow wheel", "ta": ["grep ^wheel /etc/group", "getent group wheel"], "area": "acct"}, {"id": "B-02", "title": "Remove or lock an unauthorized user", "cmds": ["# pw userdel -n baduser -r", "# pw lock baduser", "# pw unlock baduser", "# pw usermod baduser -s /usr/sbin/nologin"], "why": "userdel -r removes the home directory and its planted files; pw lock keeps the account for the investigation but no password works.", "note": "Check ps -U baduser first and kill their processes. The brief decides.", "task": "delete baduser and their home directory", "t": "pw userdel -n baduser -r", "ta": ["pw userdel baduser -r", "rmuser -y baduser"], "area": "acct"}, {"id": "B-03", "title": "Fix wheel membership", "cmds": ["# pw groupmod wheel -d mallory", "# pw groupmod wheel -m alice", "# pw groupshow wheel", "# id alice"], "why": "Least privilege. Anyone in wheel may su to root with root's password. sudo has its own rules in /usr/local/etc/sudoers (B-01), so read that file too (I-02).", "task": "remove mallory from wheel", "t": "pw groupmod wheel -d mallory", "area": "acct"}, {"id": "B-04", "title": "Passwords: strong, forced change, no empties", "cmds": ["# passwd alice", "# pw usermod alice -p +0d", "# awk -F: '$2==\"\" {print $1\" HAS NO PASSWORD\"}' /etc/master.passwd", "# passwd root"], "why": "master.passwd is the real password file (passwd is the public copy). An empty second field is login with Enter. -p +0d expires the password now, so the next login must change it.", "note": "Write changed passwords down. Do not lock root: wheel users su with root's password, so a locked root breaks su. Give it a strong password instead.", "task": "find accounts with an empty password field", "t": "awk -F: '$2==\"\" {print $1}' /etc/master.passwd", "ta": ["awk -F: $2== {print $1} /etc/master.passwd", "awk -F: '$2==\"\"' /etc/master.passwd"], "area": "acct"}, {"id": "B-05", "title": "Password policy: login.conf and pam_passwdqc", "cmds": ["# vi /etc/login.conf", "  default:  ... :passwordtime=60d:\\   (each capability on its own line, ending in :\\)", "# cap_mkdb /etc/login.conf", "# vi /etc/pam.d/passwd", "  password  requisite  pam_passwdqc.so  min=disabled,disabled,disabled,12,10 max=64 similar=deny retry=3 enforce=everyone", "# pw usershow alice -P"], "why": "login.conf carries password aging per login class (passwordtime); cap_mkdb rebuilds the database or nothing changes. Length and complexity come from pam_passwdqc at change time (min= is per character-class count: 4-class passwords may be 10, 3-class need 12, fewer classes disabled). login.conf also lists minpasswordlen and mixpasswordcase, but they are reserved and not implemented in the base system.", "note": "The scenario brief sets the numbers; these lines show one sample brief. The CIS Benchmarks used in the other drills ask for 14 or more characters and a maximum age of 365 days or fewer. This step opens vi: press i to insert, Esc to stop inserting, then :wq and Enter to save and quit, or :q! to leave without saving. ee is the friendlier editor in base (Esc opens its menu), and vipw opens vi too, unless the EDITOR variable names another editor. Users must belong to the class you edited (default unless pw usermod -L set another).", "task": "rebuild the login.conf database after editing it", "t": "cap_mkdb /etc/login.conf", "area": "acct"}, {"id": "B-06", "title": "Lockout: login.conf retries and blocklistd for sshd", "cmds": ["# vi /etc/login.conf", "  default:  ... :login-retries=5:  :login-backoff=10:   (same file, same continuation style)", "# cap_mkdb /etc/login.conf", "# sysrc blocklistd_enable=YES", "# vi /etc/blocklistd.conf", "  ssh  stream  *  *  *  3  24h", "# echo 'UseBlocklist yes' >> /etc/ssh/sshd_config; sshd -t && service sshd restart", "# service blocklistd start; blocklistctl dump -b"], "why": "There is no pam_faillock here. login.conf limits console retries; blocklistd blocks an IP in pf after repeated sshd failures, which is the brute force that actually happens.", "note": "The scenario brief sets the numbers; these lines show one sample brief. For comparison, the CIS Benchmarks used in the other drills lock an account after 5 or fewer failed attempts, for 15 minutes or more. blocklistd needs the pf anchor from B-07 to enforce anything. Older releases call it blacklistd, with matching old names for every knob (see Version notes); use one set of names throughout.", "task": "enable blocklistd at boot", "t": "sysrc blocklistd_enable=YES", "ta": ["sysrc blocklistd_enable=\"YES\"", "sysrc blacklistd_enable=YES", "sysrc blacklistd_enable=\"YES\""], "area": "acct"}, {"id": "B-07", "title": "Firewall: pf", "cmds": ["# ifconfig | grep -B1 'inet '           (find the interface name, e.g. vtnet0 or em0)", "# vi /etc/pf.conf", "  ext_if=\"vtnet0\"", "  set skip on lo0", "  block in all", "  pass out all keep state", "  pass in on $ext_if proto tcp to port 22 keep state     (only if SSH is required)", "  anchor \"blocklistd/*\" in on $ext_if", "# sysrc pf_enable=YES pflog_enable=YES", "# pfctl -nf /etc/pf.conf", "# service pf start", "# pfctl -sr; pfctl -si"], "why": "Default-deny inbound covers the service you have not found yet. pfctl -nf parses without loading, so a typo cannot leave you with no rules.", "note": "Enabling pf over SSH without the pass rule for 22 drops your session. Add pass rules for the ports the brief requires (80, 443, 21). ipfw alternative: sysrc firewall_enable=YES firewall_type=workstation firewall_myservices=\"22/tcp\" firewall_allowservices=\"any\"; service ipfw start.", "task": "check pf.conf for syntax errors without loading it", "t": "pfctl -nf /etc/pf.conf", "area": "config"}, {"id": "B-08", "title": "Updates: base system and packages", "cmds": ["# pkg which /bin/sh            (names a FreeBSD- base package only on a pkgbase install)", "# freebsd-update fetch install            (classic install: base system and kernel)", "# pkg update && pkg upgrade -y            (packages; on a pkgbase install, the base system too)", "# pkg audit -F", "# freebsd-version -kru"], "why": "Know how the base system is managed before you patch it. On a classic install freebsd-update patches the base system and kernel and pkg upgrades packages; on a pkgbase install the base is packages too, so pkg upgrade covers both and freebsd-update is not used. pkg audit fetches the vulnerability database and names installed packages with known CVEs.", "note": "A kernel update needs a reboot to take effect; save work first.", "task": "patch the base system on a classic (non-pkgbase) install", "t": "freebsd-update fetch install", "ta": ["freebsd-update fetch && freebsd-update install"], "area": "patch"}, {"id": "B-09", "title": "Remove unapproved software", "cmds": ["# pkg info", "# pkg info | grep -Ei 'nmap|john|hydra|medusa|wireshark|aircrack|netcat|socat|nikto|metasploit|hashcat|sqlmap|torrent|transmission|game'", "# pkg delete -y nmap", "# pkg autoremove -y"], "why": "Hacking tools, games and P2P clients are acceptable-use violations and attack surface. pkg autoremove drops the dependencies nothing needs anymore.", "note": "Packages the brief requires (apache24, samba, mysql-server) stay; harden them in I-12.", "task": "remove the nmap package", "t": "pkg delete -y nmap", "ta": ["pkg delete nmap", "pkg remove -y nmap", "pkg remove nmap"], "area": "software"}, {"id": "B-10", "title": "Find unapproved media files", "cmds": ["# find / -type f \\( -iname '*.mp3' -o -iname '*.mp4' -o -iname '*.wav' -o -iname '*.mkv' -o -iname '*.avi' -o -iname '*.flac' -o -iname '*.mov' -o -iname '*.m4a' \\) -not -path '/usr/*' 2>/dev/null"], "why": "Many acceptable-use policies ban personal media on work machines, and the search also surfaces hidden directories in /home, /tmp and /var/tmp.", "note": "Confirm, then rm. Write the path down for a possible investigation question.", "area": "data"}, {"id": "B-11", "title": "Services: rc.conf, inetd, what listens", "cmds": ["# service -e", "# sysrc -a | grep -i enable", "# sockstat -46l", "# sysrc rpcbind_enable=NO; service rpcbind stop     (when nothing needs NFS or NIS)", "# grep -vE '^#' /etc/inetd.conf", "# sysrc inetd_enable=NO; service inetd stop"], "why": "rc.conf decides what starts at boot; service -e shows it. Daemons started by inetd (telnetd, ftpd, the old r-services) never appear there, so read inetd.conf too. sockstat -46l is the ss -tulpn of FreeBSD.", "note": "Required services stay (sshd, apache24, samba, mysql). Disable in rc.conf AND stop the running service.", "task": "list listening IPv4 and IPv6 sockets", "t": "sockstat -46l", "ta": ["sockstat -l", "sockstat -4l"], "area": "config"}, {"id": "B-12", "title": "Console, tmp and syslog hardening in rc.conf and ttys", "cmds": ["# vi /etc/ttys", "  console  none  unknown  off  insecure", "# sysrc clear_tmp_enable=YES", "# sysrc syslogd_flags=\"-ss\"", "# sysrc sendmail_enable=NONE", "# cat /etc/rc.local 2>/dev/null"], "why": "An insecure console makes single-user mode ask for root's password. syslogd -ss stops syslog from listening on the network; clear_tmp wipes planted files in /tmp at boot; sendmail_enable=NONE (the default now that dma is the mail agent) keeps sendmail listeners off.", "note": "If the machine has a desktop (slim, lightdm, gdm), also turn off auto-login in its config under /usr/local/etc.", "task": "stop syslogd from opening a network socket (rc.conf)", "t": "sysrc syslogd_flags=\"-ss\"", "ta": ["sysrc syslogd_flags=-ss"], "area": "config"}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. sshd, sudo and doas, cron and periodic, rc.d and shell startup files, master.passwd permissions and SUID, file flags, processes, auditd, account hygiene, pkg repositories, and the services you must keep.", "learn": ["senior/se1", "Defense Ladder se1, FreeBSD"], "items": [{"id": "I-01", "title": "sshd hardening, only when SSH is required", "cmds": ["# vi /etc/ssh/sshd_config", "  PermitRootLogin no        PermitEmptyPasswords no     MaxAuthTries 3", "  LoginGraceTime 30         X11Forwarding no            UseBlocklist yes", "  PasswordAuthentication yes or no per the brief      AllowUsers alice bob", "# sshd -t && service sshd restart", "# find / -name authorized_keys -exec ls -l {} \\; -exec cat {} \\; 2>/dev/null"], "why": "Root over SSH means no accountability and the prime brute-force target. A planted authorized_keys file is a password-less backdoor that survives every password you fix.", "note": "Not required: sysrc sshd_enable=NO; service sshd stop.", "task": "test the sshd config and restart the service", "t": "sshd -t && service sshd restart", "ta": ["service sshd restart", "sshd -t; service sshd restart"], "area": "access"}, {"id": "I-02", "title": "sudo and doas audit", "cmds": ["# pkg info sudo doas 2>/dev/null", "# grep -R -nE 'NOPASSWD|!authenticate|ALL=\\(ALL' /usr/local/etc/sudoers /usr/local/etc/sudoers.d/ 2>/dev/null", "# visudo", "# cat /usr/local/etc/doas.conf 2>/dev/null", "  permit persist :wheel          (sane)   |   permit nopass mallory   (backdoor)"], "why": "sudo and doas live under /usr/local/etc on FreeBSD, not /etc. A NOPASSWD line or a nopass doas rule is a silent root backdoor. visudo checks syntax; vi does not.", "task": "edit the sudoers file safely", "t": "visudo", "area": "access"}, {"id": "I-03", "title": "Cron, at and periodic", "cmds": ["# cat /etc/crontab; ls -la /var/cron/tabs/", "# for u in $(cut -d: -f1 /etc/passwd); do crontab -l -u \"$u\" 2>/dev/null | sed \"s/^/$u: /\"; done", "# cat /etc/periodic.conf 2>/dev/null; ls /etc/periodic/daily /usr/local/etc/periodic/* 2>/dev/null", "# atq", "# crontab -r -u baduser"], "why": "Cron re-creates users and re-opens ports every few minutes. periodic(8) is the BSD extra: scripts under /etc/periodic and /usr/local/etc/periodic run daily, weekly and monthly from root's crontab.", "task": "show root's crontab", "t": "crontab -l -u root", "ta": ["crontab -l"], "area": "malware"}, {"id": "I-04", "title": "Startup and shell persistence", "cmds": ["# cat /etc/rc.conf /etc/rc.conf.d/* /etc/rc.local 2>/dev/null", "# ls -la /etc/rc.d/ /usr/local/etc/rc.d/", "# grep -nE 'alias|nc |ncat|socat|/dev/tcp|curl .*\\| *sh|fetch .*\\| *sh' /etc/csh.cshrc /etc/profile /root/.cshrc /root/.profile /root/.shrc /home/*/.cshrc /home/*/.profile /home/*/.shrc 2>/dev/null"], "why": "A rogue script in /usr/local/etc/rc.d with an _enable line in rc.conf starts at every boot. Root's shell may be sh or csh (older installs, other users), so check both families of startup files.", "note": "fetch is FreeBSD's curl; look for it in the same places.", "area": "malware"}, {"id": "I-05", "title": "Password database permissions, world-writable, SUID", "cmds": ["# ls -l /etc/master.passwd /etc/spwd.db /etc/passwd /etc/pwd.db /etc/group", "# chmod 600 /etc/master.passwd /etc/spwd.db; chown root:wheel /etc/master.passwd /etc/spwd.db", "# chmod 644 /etc/passwd /etc/pwd.db /etc/group", "# pwd_mkdb -p /etc/master.passwd", "# find / -xdev -type f -perm -0002 2>/dev/null", "# find / -xdev -type d -perm -0002 ! -perm -1000 2>/dev/null", "# find / -xdev -type f \\( -perm -4000 -o -perm -2000 \\) 2>/dev/null", "# chmod u-s /path/to/evil"], "why": "master.passwd and spwd.db hold the hashes; readable means offline cracking. pwd_mkdb rebuilds the db files after any hand edit (vipw does it for you). Unexpected SUID binaries are instant root.", "note": "Normal SUID set includes su, sudo, passwd, chpass, login, ping, and mount-related helpers. Anything in /tmp, /home or /usr/local/bin that is SUID: investigate.", "task": "rebuild the password databases from master.passwd", "t": "pwd_mkdb -p /etc/master.passwd", "area": "access"}, {"id": "I-06", "title": "File flags: the chattr of FreeBSD", "cmds": ["# ls -lo /etc/master.passwd /etc/passwd /etc/group /etc/rc.conf /etc/ssh/sshd_config", "# chflags noschg /etc/master.passwd", "# chflags -R noschg /tmp/evil && rm -rf /tmp/evil", "# sysctl kern.securelevel"], "why": "schg (system immutable) blocks every change, so pw, passwd, and vi fail with a misleading error such as Operation not permitted; sappnd makes a log or rc file append-only. ls -lo shows the flags. If kern.securelevel is 1 or higher the flags stay set until a reboot in single-user mode.", "task": "show file flags on master.passwd", "t": "ls -lo /etc/master.passwd", "area": "config"}, {"id": "I-07", "title": "Processes and connections: find the backdoor", "cmds": ["# ps -ax -o pid,ppid,user,command | head -40", "# ps -ax | grep -Ei 'nc |ncat|socat|sh -i|python.* -c|perl -e|xmrig|miner' | grep -v grep", "# sockstat -46 -c", "# procstat -b <pid>", "# kill -9 <pid>"], "why": "procstat -b prints the binary path behind a PID. Killing a process is pointless unless you also remove what starts it (rc.conf, rc.d, cron, shell files).", "task": "show the binary path behind a process id", "t": "procstat -b <pid>", "ta": ["procstat -b"], "area": "malware"}, {"id": "I-08", "title": "Hosts file and resolver", "cmds": ["# cat /etc/hosts", "# cat /etc/resolv.conf"], "why": "Redirecting update.freebsd.org or pkg.freebsd.org to 127.0.0.1 breaks updates silently.", "area": "config"}, {"id": "I-09", "title": "Logging and the audit daemon", "cmds": ["# tail -40 /var/log/auth.log; tail /var/log/messages; tail /var/log/security", "# last | head; lastlogin; w", "# cat /etc/syslog.conf", "# sysrc auditd_enable=YES; service auditd start", "# vi /etc/security/audit_control", "  flags:lo,aa,ad,ex", "# praudit /var/audit/current | tail -20"], "why": "auth.log answers who logged in and who used su. OpenBSM auditd (built in) records logins, authentication, administrative actions and, with ex, every exec. praudit makes the trail readable.", "task": "enable the audit daemon at boot", "t": "sysrc auditd_enable=YES", "ta": ["sysrc auditd_enable=\"YES\""], "area": "audit"}, {"id": "I-10", "title": "Account hygiene: shells, classes, operator group, SSH keys", "cmds": ["# grep -vE 'nologin|/bin/false|/usr/sbin/nologin' /etc/passwd", "# pw usermod www -s /usr/sbin/nologin", "# pw usershow alice -P", "# pw groupshow operator; pw groupshow wheel", "# ls -l /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys 2>/dev/null"], "why": "A service account with a real shell is a login. operator can read raw disk devices, which means the password hashes. The login class shown by pw usershow -P decides which policy from login.conf applies.", "task": "pretty-print alice's account, login class included", "t": "pw usershow alice -P", "area": "acct"}, {"id": "I-11", "title": "pkg repository hygiene", "cmds": ["# cat /etc/pkg/FreeBSD.conf /usr/local/etc/pkg/repos/*.conf 2>/dev/null", "# pkg -vv | grep -A6 Repositories", "# pkg update -f"], "why": "A planted repo under /usr/local/etc/pkg/repos overrides the official one, so pkg upgrade installs the attacker's packages. Keep the official pkg.FreeBSD.org repositories (on a pkgbase install that includes the base-system repository) with signature_type fingerprints.", "area": "patch"}, {"id": "I-12", "title": "Harden required services instead of removing them", "cmds": ["  FTP (only if required): anonymous login off, local users chrooted, TLS where the server supports it; a packaged FTP server keeps its config under /usr/local/etc", "  apache24: /usr/local/etc/apache24/httpd.conf: ServerTokens Prod  ServerSignature Off  TraceEnable Off; Options -Indexes in the DocumentRoot block; apachectl configtest && service apache24 restart", "  samba: /usr/local/etc/smb4.conf [global]: map to guest = Never  restrict anonymous = 2; testparm && service samba_server restart", "  mysql: mysql_secure_installation; /usr/local/etc/mysql/my.cnf bind-address = 127.0.0.1; service mysql-server restart", "  sshd: see I-01"], "why": "Keeping the service running and making it safe is the job. Third-party configs live under /usr/local/etc, which is where checklists written for Linux go wrong.", "task": "check the Apache config for errors", "t": "apachectl configtest", "area": "config"}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. sysctl and securelevel, pkg check and audit, rootkit hunting, PAM internals, forensics with the BSD toolset, pf depth, Linux-to-BSD translation recall, and version notes.", "learn": ["senior/se1", "Defense Ladder se1, FreeBSD"], "items": [{"id": "A-01", "title": "Kernel and network hardening with sysctl", "cmds": ["# vi /etc/sysctl.conf", "  security.bsd.see_other_uids=0        security.bsd.see_other_gids=0", "  security.bsd.unprivileged_read_msgbuf=0   security.bsd.unprivileged_proc_debug=0", "  kern.randompid=1                     net.inet.ip.forwarding=0", "  net.inet.ip.redirect=0               net.inet.icmp.drop_redirect=1", "  net.inet.ip.sourceroute=0            net.inet.ip.accept_sourceroute=0", "  net.inet.icmp.bmcastecho=0           net.inet.tcp.blackhole=2   net.inet.udp.blackhole=1", "# service sysctl restart", "# sysctl net.inet.ip.forwarding security.bsd.see_other_uids", "# sysrc kern_securelevel_enable=YES kern_securelevel=1   (optional, after all file-flag work is done)"], "why": "see_other_uids stops users from watching each other's processes; blackhole drops probes to closed ports without a reply; forwarding=0 removes a pivot; securelevel 1 locks file flags and kernel modules after boot.", "note": "Set securelevel last: once it is on you cannot clear schg flags until a single-user reboot.", "task": "reload every sysctl value from sysctl.conf", "t": "service sysctl restart", "ta": ["sysctl -f /etc/sysctl.conf"], "area": "config"}, {"id": "A-02", "title": "Package integrity, vulnerable packages, rootkits", "cmds": ["# pkg check -s -a", "# pkg audit -F", "# pkg install -y rkhunter chkrootkit clamav", "# rkhunter --propupd && rkhunter -c --sk", "# chkrootkit", "# freshclam && clamscan -r -i /home /tmp /var/tmp /usr/local/www", "# which nc ncat socat; find / -xdev -type f \\( -name nc -o -name ncat -o -name socat \\) 2>/dev/null"], "why": "pkg check -s verifies the checksum of every installed file against the package database, so a replaced sshd or ls shows up. pkg audit names packages with known CVEs. nc ships in base; a second copy somewhere odd is the backdoor kit.", "task": "verify the checksums of every installed package", "t": "pkg check -s -a", "ta": ["pkg check -sa", "pkg check --checksums -a"], "area": "malware"}, {"id": "A-03", "title": "PAM deep dive", "cmds": ["  Files: /etc/pam.d/system (shared), login, sshd, su, passwd, sudo (under /usr/local/etc/pam.d for ports)", "# grep -nE 'pam_permit|nullok|pam_rootok' /etc/pam.d/* /usr/local/etc/pam.d/* 2>/dev/null", "# grep -n pam_unix /etc/pam.d/passwd /etc/pam.d/system", "# grep -n pam_group /etc/pam.d/su"], "why": "auth sufficient pam_permit.so near the top of system or sshd means any password works. pam_group in su is what restricts su to wheel; if that line is gone, anyone can su.", "note": "Control flags: required, requisite, sufficient, optional, same meaning as on Linux.", "area": "access"}, {"id": "A-04", "title": "Forensics with the BSD toolset", "cmds": ["# find / -xdev -type f -newermt \"2026-10-01\" -not -path '/var/db/*' 2>/dev/null | head -60", "# find / -xdev \\( -nouser -o -nogroup \\) 2>/dev/null", "# find /home /root /tmp /var/tmp -name '.*' -type f 2>/dev/null", "# stat <file>; file <file>; strings <file> | head; md5 <file>; sha256 <file>", "# grep -E 'su:|sshd|login' /var/log/auth.log | tail -40", "# lastlogin; last | head -30"], "why": "md5 and sha256 are the native FreeBSD commands; recent releases also accept md5sum and sha256sum. -newermt finds what changed most recently; auth.log holds su and ssh history.", "task": "print the SHA-256 hash of secret.txt", "t": "sha256 secret.txt", "ta": ["sha256 -q secret.txt", "sha256sum secret.txt"], "area": "inv"}, {"id": "A-05", "title": "pf depth", "cmds": ["# pfctl -vnf /etc/pf.conf", "# pfctl -sr; pfctl -ss | head; pfctl -sa | head -40", "# pfctl -sA; pfctl -a '*' -sr", "# pfctl -a 'blocklistd/22' -t port22 -T show", "# tcpdump -n -e -ttt -i pflog0", "# grep -nE '^pass in' /etc/pf.conf"], "why": "A planted pass in rule or anchor stays out of sight in a casual look. pfctl -sr prints the main ruleset, where an anchor shows as one line; pfctl -sA lists the anchors attached to the main ruleset (add -v to list nested ones), and pfctl -a '*' -sr prints every anchor's rules. pflog0 shows what is being blocked live, which also answers investigation questions about scanning.", "task": "print the main pf ruleset that is loaded now", "t": "pfctl -sr", "area": "config"}, {"id": "A-06", "title": "Recall drill: Linux habit to FreeBSD equivalent", "cmds": ["  Say each FreeBSD equivalent out loud, then check your answers in the places named below.", "  sudo group -> ?          /etc/shadow -> ?", "  systemctl -> ?           apt -> ?", "  ufw -> ?                 chattr/lsattr -> ?", "  /etc/login.defs -> ?     pam_faillock -> ?", "  ss -tulpn -> ?           /etc/sudoers -> ?        md5sum -> ?", "  journalctl -> ?          auditd (Linux) -> ?      useradd/userdel -> ?"], "why": "Recall each row, then check it against Defense Ladder se1 (its tables Linux habit, FreeBSD equivalent; su, sudo, and doas on FreeBSD; and Hunting on any Unix) and against items B-02, I-02, I-06, I-09, and A-04 here. Most people meet FreeBSD after learning Linux: the concepts carry over, and the file paths and command names change. Pulling each pair from memory is what makes it stick."}, {"id": "A-07", "title": "Verify loop, every thirty minutes", "cmds": ["# sockstat -46l; pw groupshow wheel; awk -F: '$3==0' /etc/passwd", "# pfctl -sr | head; service -e; sysctl kern.securelevel", "# awk -F: '$2==\"\"' /etc/master.passwd; ls -lo /etc/master.passwd /etc/rc.conf"], "why": "Cron and periodic undo fixes. Re-checking catches the undo, and anything you broke, before a user does."}, {"id": "A-08", "title": "Version notes: FreeBSD 15.1 and 14.x", "cmds": ["  This page targets FreeBSD 15.1; 14.x is still supported and differs as below.", "  blocklistd (15.0 and later) was blacklistd: blacklistd_enable, /etc/blacklistd.conf, blacklistctl, UseBlacklist, pf anchor \"blacklistd/*\". 15 still accepts the old names with a warning", "  ftpd left the base system in 15.0 (port ftp/freebsd-ftpd, /usr/local/libexec/ftpd); on 14.x it is /usr/libexec/ftpd. telnetd, rshd and rlogind are packages on both", "  pkgbase: a technology preview in 15.0 and the 15.1 installer default. The base system then updates with pkg upgrade from the FreeBSD-base repository, not freebsd-update; pkg which /bin/sh tells you which kind you have", "  Both: dma is the mail agent (sendmail_enable=NONE is the default) and OPIE is gone"], "why": "Every other item on this page is written to hold on 14.x and 15.x; the release differences live here, so a learner on either release knows which name or tool to expect."}]}], "spot": [{"lvl": 0, "ask": "Lines from /etc/master.passwd. Tap the finding.", "lines": ["root:$6$...:0:0::0:0:Charlie &:/root:/bin/sh", "toor:$6$Qx9...:0:0::0:0:Bourne-again Superuser:/root:/bin/sh", "daemon:*:1:1::0:0:Owner of many system processes:/root:/usr/sbin/nologin", "alice:$6$...:1001:1001::0:0:Alice:/home/alice:/bin/sh"], "finding": 1, "why": "toor is normal only while its hash is *. A real hash means a second root with a password someone set. Lock it with pw lock toor, or use vipw to set the hash field back to *."}, {"lvl": 0, "ask": "Output of pw groupshow wheel. Brief: alice is the only admin. Tap the finding.", "lines": ["wheel:*:0:root,alice,mallory", "operator:*:5:root", "staff:   else if(q.type==='spot'){body='<p>'+esc(q.ask||'Tap the line that is the finding.')+'</p><div class="opts">'+q.lines.map((l,i)=>'<button data-opt="'+i+'" class="cmd '+(Q.fb?(i===q.finding?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+esc(l)+'</button>').join('')+'</div>';}
  else if(q.type==='judge'){body='<div class="brief"><b>Scenario brief says:</b> '+esc(q.brief)+'</div><p><b>You do this:</b> '+esc(q.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-opt="'+i+'" class="'+(Q.fb?(k===q.answer?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>';}
  const fb=Q.fb?'<div class="fb '+(Q.fb.ok?'ok':'bad')+'" aria-live="polite"><b>'+(Q.fb.ok?'Right.':'Not this time.')+'</b> '+esc(Q.fb.text)+'</div><button class="btn primary" data-act="next">'+(Q.i===Q.qs.length-1?'See results':'Next question')+'</button>':'';
  return '<div class="q"><div class="count">Question '+(Q.i+1)+' of '+Q.qs.length+' · '+Q.correct+' correct</div><h2>'+esc(q.prompt||(q.type==='spot'?'Spot the finding':'Fix or break?'))+'</h2>'+body+fb+'</div>';
}
function answer(pick,given){
  const q=Q.qs[Q.i];let ok=false,text='';
  if(q.type==='which'||q.type==='what'){ok=q.opts[pick].ok;text=q.item.why;}
  else if(q.type==='spot'){ok=pick===q.finding;text=q.why;}
  else if(q.type==='judge'){ok=['fix','breaks','check'][pick]===q.answer;text=q.why;}
  else if(q.type==='type'){const g=norm(given);const acc=[q.item.t].concat(q.item.ta||[]).map(norm);ok=acc.includes(g);text=(ok?'':'Answer: '+q.item.t+'. ')+q.item.why;}
  if(ok){Q.correct++;if(q.item){S.drilled[q.item.id]=(S.drilled[q.item.id]||0)+1;save();}}
  Q.fb={ok,text,pick,given:given||''};
}
function finishQuiz(){const pct=Math.round(100*Q.correct/Q.qs.length);S.best[Q.li]=Math.max(S.best[Q.li]||0,pct);save();Q.finished=true;const b=badge(Q.li);const L=APP.levels[Q.li];
  return '<div class="result"><div class="big">'+pct+'%</div><p>'+Q.correct+' of '+Q.qs.length+' right. '+(b.earned?'The '+esc(L.name)+' badge is yours: '+L.badge:(pct>=80?'Score is there; learn '+(Math.ceil(L.items.length*.8)-b.learned)+' more items for the badge.':'Reread the misses in Learn and run it again.'))+'</p><div class="nav"><button class="btn primary" data-act="startq">Run it again</button><button class="btn" data-mode-go="learn">Back to Learn</button></div></div>';}
/* run */
let tick=null;const OPEN=new Set();
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function renderRun(){
  const R=S.run;const items=allItems.filter(i=>i.li===S.level||(R.lower&&i.li<S.level));
  const remain=Math.max(0,R.mins*60-R.elapsed);
  const rows=items.map(i=>'<div class="chk '+(R.done[i.id]!=null?'done':'')+'"><input type="checkbox" data-done="'+i.id+'" '+(R.done[i.id]!=null?'checked':'')+' aria-label="Done: '+esc(i.title)+'"><div><div class="t"><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span>'+(R.done[i.id]!=null?'<span class="stamp">'+fmt(R.done[i.id])+'</span>':'')+'<button class="btn small" data-show="'+i.id+'">Commands</button></div><div id="show-'+i.id+'"'+(OPEN.has(i.id)?'':' hidden')+'>'+termBlock(i.cmds,true)+'</div><input class="note" data-note="'+i.id+'" placeholder="Change log: what you changed and why" value="'+esc(R.notes[i.id]||'')+'"></div></div>').join('');
  return '<h2>Run the checklist on your VM</h2><p class="lead">Set the clock, work the list top to bottom, tick each item when it is actually done on the machine, and write a one-line change log. The log is what lets you undo a change that broke something in thirty seconds.</p>'
   +'<div class="timer"><div class="clock" aria-live="off">'+fmt(remain)+'</div><select data-mins>'+[20,45,60,90,120].map(m=>'<option value="'+m+'" '+(m===R.mins?'selected':'')+'>'+m+' min</option>').join('')+'</select><button class="btn primary" data-act="timer">'+(tick?'Pause':'Start')+'</button><button class="btn" data-act="resetclock">Reset clock</button><label class="toggle"><input type="checkbox" data-lower '+(R.lower?'checked':'')+'> include lower levels</label></div>'
   +'<div class="nav" style="margin:0 0 10px"><button class="btn small" data-act="copylog">Copy change log</button><button class="btn small" data-act="dlog">Download change log</button><button class="btn small" data-act="clearrun">Clear this run</button></div>'
   +rows;
}
function changeLog(){const R=S.run;const lines=allItems.filter(i=>R.done[i.id]!=null||R.notes[i.id]).sort((a,b)=>(R.done[a.id]??1e9)-(R.done[b.id]??1e9)).map(i=>'['+(R.done[i.id]!=null?fmt(R.done[i.id]):'--:--')+'] '+i.id+' '+i.title+(R.notes[i.id]?' -- '+R.notes[i.id]:''));
  return '# Change log - '+APP.os+' - '+new Date().toLocaleString()+'\n'+(lines.join('\n')||'(nothing logged yet)')+'\n';}
function startTimer(){if(tick)return;tick=setInterval(()=>{S.run.elapsed++;if(S.run.elapsed%5===0)save();const c=document.querySelector('.clock');if(c)c.textContent=fmt(Math.max(0,S.run.mins*60-S.run.elapsed));if(S.run.elapsed>=S.run.mins*60){stopTimer();render();}},1000);}
function stopTimer(){clearInterval(tick);tick=null;save();}
/* games */
let G={tab:'imposter',sc:0,picks:{},checked:false,jq:null,streak:0,jfb:null};
function renderGames(){
  const tabs='<div class="tabs"><button class="btn '+(G.tab==='imposter'?'primary':'')+'" data-gtab="imposter">Who is the imposter?</button><button class="btn '+(G.tab==='judge'?'primary':'')+'" data-gtab="judge">Fix or break?</button></div>';
  if(G.tab==='imposter'){const sc=APP.imposter[G.sc];
    const rows=sc.accounts.map((a,i)=>{const p=G.picks[i]||'keep';const cls=G.checked?(p===a.truth?'ok':'bad'):'';return '<div class="acct '+cls+'"><div class="n">'+esc(a.name)+'<small>'+esc(a.info)+'</small></div><div class="seg">'+['keep','remove'].concat(a.admin?['demote']:[]).map(k=>'<button data-pick="'+i+'" data-val="'+k+'" class="'+(p===k?'on':'')+'" '+(G.checked?'disabled':'')+'>'+({keep:'Keep',remove:'Remove',demote:'Demote'})[k]+'</button>').join('')+'</div></div>'+(G.checked&&p!==a.truth?'<div class="fb bad">'+esc(a.why)+'</div>':'');}).join('');
    const right=G.checked?sc.accounts.filter((a,i)=>(G.picks[i]||'keep')===a.truth).length:0;
    return tabs+'<h2>'+esc(sc.title)+'</h2><p class="lead">Read the scenario brief, then decide for every account: keep it, remove it, or demote it from admin. The brief is the documented source of truth; when it is unclear, ask the system owner before you delete anything.</p><div class="brief"><b>Scenario brief</b><ul>'+sc.brief.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>'+termBlock(sc.output,false)+rows
      +(G.checked?'<div class="fb '+(right===sc.accounts.length?'ok':'bad')+'" style="max-width:720px">'+right+' of '+sc.accounts.length+' correct. '+esc(sc.debrief)+'</div>':'')+'<div class="nav"><button class="btn primary" data-act="'+(G.checked?'nextsc':'checksc')+'">'+(G.checked?'Next scenario':'Check my calls')+'</button></div>';
  }
  if(!G.jq){G.jq=shuffle(APP.judge.slice());}const j=G.jq[0];
  const fb=G.jfb?'<div class="fb '+(G.jfb.ok?'ok':'bad')+'"><b>'+(G.jfb.ok?'Right.':'Not this time.')+'</b> '+esc(j.why)+'</div><button class="btn primary" data-act="jnext">Next</button>':'';
  return tabs+'<div class="q"><div class="streak">streak '+G.streak+'</div><h2>Fix or break?</h2><div class="brief"><b>Scenario brief says:</b> '+esc(j.brief)+'</div><p><b>You do this:</b> '+esc(j.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-jopt="'+k+'" class="'+(G.jfb?(k===j.answer?'ok':(G.jfb.pick===k?'bad':'')):'')+'" '+(G.jfb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>'+fb+'</div>';
}
/* report */
function renderReport(){
  const lv=APP.levels.map((L,i)=>{const b=badge(i);return '<div class="lv"><div class="row"><span>'+(b.earned?L.badge+' ':'')+esc(L.name)+'</span><span class="mono">'+b.learned+'/'+b.total+' learned · best '+(b.best||0)+'%</span></div><div class="bar2 '+(b.earned?'earned':'')+'"><i style="width:'+Math.round(100*b.learned/b.total)+'%"></i></div></div>';}).join('');
  const rows=allItems.map(i=>{const st=status(i);const g={mastered:'✓',learned:'◐',drilled:'◔',none:'·'}[st];return '<div class="rr '+st+'" data-rr="'+i.id+'"><span class="g">'+g+'</span><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span><span class="pt">'+itemScore(i)+'</span></div>';}).join('');
  return '<h2>Progress report</h2>'+lv+'<p style="font-size:.8rem;color:var(--muted)">✓ learned and drilled · ◐ learned · ◔ drilled only</p>'+rows+'<div class="total"><span>Total</span><span>'+score()+' / '+maxScore+'</span></div>';
}
function renderFoot(){$('#foot').innerHTML=esc(APP.footer||'Training tool for virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist.')+' <button data-act="reset">Reset my progress</button>';}
function render(){
  if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches)S.mode='learn';
  renderHeader();
  const v=$('#view');const m=S.mode;
  v.innerHTML=m==='learn'?renderLearn():m==='drill'?renderDrill():m==='run'?renderRun():m==='games'?renderGames():'';
  $('#report').innerHTML=renderReport();renderFoot();
  if(m==='drill'&&Q&&!Q.finished&&!Q.fb){const t=v.querySelector('.typein');if(t)t.focus();}
  if(m==='learn'){const on=v.querySelector('.list button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
}
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.level!=null){S.level=+d.level;if(S.mode==='drill'&&Q&&Q.li!==S.level)Q=null;save();render();return;}
  if(d.mode){S.mode=d.mode;save();render();return;}
  if(d.modeGo){S.mode=d.modeGo;save();render();return;}
  if(d.sel){S.sel[S.level]=d.sel;save();render();return;}
  if(d.step){const L=APP.levels[S.level];const cur=S.sel[S.level]||L.items[0].id;const i=L.items.findIndex(x=>x.id===cur)+(+d.step);if(L.items[i]){S.sel[S.level]=L.items[i].id;save();render();}return;}
  if(d.act==='copy'){const term=b.closest('.term');const lines=[...term.querySelectorAll('.ln:not(.c)')].map(n=>n.textContent.replace(PRE,'')).filter(l=>l.trim()).join('\n');copyText(lines,b);return;}
  if(d.act==='startq'){Q=makeQuiz(S.level);render();return;}
  if(d.opt!=null&&S.mode==='drill'&&Q&&!Q.fb){answer(+d.opt);render();return;}
  if(d.act==='check'){const t=$('.typein');answer(null,t?t.value:'');render();return;}
  if(d.act==='skip'){answer(null,'');render();return;}
  if(d.act==='next'){if(Q.i===Q.qs.length-1){$('#view').innerHTML=finishQuiz();renderHeader();$('#report').innerHTML=renderReport();}else{Q.i++;Q.fb=null;render();}return;}
  if(d.act==='timer'){tick?stopTimer():startTimer();render();return;}
  if(d.act==='resetclock'){stopTimer();S.run.elapsed=0;save();render();return;}
  if(d.act==='clearrun'){if(confirm('Clear all ticks, timestamps and notes for this run?')){stopTimer();S.run.done={};S.run.notes={};S.run.elapsed=0;save();render();}return;}
  if(d.act==='copylog'){copyText(changeLog(),b);return;}
  if(d.act==='dlog'){const blob=new Blob([changeLog()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='change-log-'+APP.key+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}
  if(d.show){const el=document.getElementById('show-'+d.show);if(el){el.hidden=!el.hidden;if(el.hidden)OPEN.delete(d.show);else OPEN.add(d.show);}return;}
  if(d.gtab){G.tab=d.gtab;G.jfb=null;render();return;}
  if(d.pick!=null&&!G.checked){G.picks[d.pick]=d.val;render();return;}
  if(d.act==='checksc'){G.checked=true;render();return;}
  if(d.act==='nextsc'){G.sc=(G.sc+1)%APP.imposter.length;G.picks={};G.checked=false;render();return;}
  if(d.jopt&&!G.jfb){const j=G.jq[0];const ok=d.jopt===j.answer;G.streak=ok?G.streak+1:0;G.jfb={ok,pick:d.jopt};render();return;}
  if(d.act==='jnext'){G.jq.push(G.jq.shift());G.jfb=null;render();return;}
  if(d.act==='reset'){if(confirm('Erase all progress for this trainer on this browser?')){stopTimer();S=defaults();save();Q=null;render();}return;}
  if(b.id==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();renderHeader();return;}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.learn){const was=status(byId[d.learn]);S.learned[d.learn]=e.target.checked;if(!e.target.checked)delete S.learned[d.learn];save();render();const now=status(byId[d.learn]);if(now==='mastered'&&was!=='mastered'){const r=document.querySelector('[data-rr="'+d.learn+'"]');if(r)r.classList.add('flip');}return;}
  if(d.done){if(e.target.checked)S.run.done[d.done]=S.run.elapsed;else delete S.run.done[d.done];save();render();return;}
  if(d.mins!=null){S.run.mins=+e.target.value;S.run.elapsed=0;save();render();return;}
  if(d.lower!=null){S.run.lower=e.target.checked;save();render();return;}
});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.explain){S.explain[d.explain]=e.target.value;save();return;}
  if(d.note){S.run.notes[d.note]=e.target.value;save();return;}
});
window.addEventListener('resize',()=>{if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches){S.mode='learn';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('typein')&&Q&&!Q.fb){answer(null,e.target.value);render();}});
render();
})();
</script>
