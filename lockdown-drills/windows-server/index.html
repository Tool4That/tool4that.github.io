<style>
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#16212D; --muted:#5F6E7E; --line:#CFD7E0; --soft:#F4F6F9;
  --term:#0E1A2B; --termink:#D9E4F1; --prompt:#7FA6D6; --accent:#3F3DA8; --accent-ink:#FFFFFF;
  --ok:#1C8A57; --okbg:#E3F5EB; --bad:#C03A3A; --badbg:#FBE7E7; --warn:#A8690F; --warnbg:#FBF0DA; --focus:#FFB300;
  --sans:"Segoe UI Variable Text","Segoe UI","Avenir Next",Avenir,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; } }
:root[data-theme="dark"]{ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) 16px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.brand{font-weight:800;letter-spacing:-.01em;font-size:1.15rem;line-height:1.1}
.brand span{display:block;font-weight:500;color:var(--muted);font-size:.85rem;letter-spacing:0}
.levels{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.levels button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.levels button.on{background:var(--accent);color:var(--accent-ink)}
.levels button .b{font-size:1rem}
.score{font-family:var(--mono);font-size:.95rem;white-space:nowrap}
.score b{font-size:1.2rem}
.theme{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.85rem}
.modes{display:flex;gap:2px;overflow-x:auto}
.modes button{border:0;background:transparent;padding:8px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.modes button.on{color:var(--ink);border-bottom-color:var(--accent)}
.series{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 0 8px;font-size:.82rem;color:var(--muted)}
.series a{color:var(--muted);text-decoration:none}.series a:hover{text-decoration:underline}.series b{color:var(--ink)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 110px)}
main{padding:18px 16px 40px;min-width:0}
aside.report{border-left:1px solid var(--line);background:var(--panel);padding:16px}
footer{padding:14px 16px 30px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);background:var(--panel)}
footer button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.85rem;margin-left:8px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lead{color:var(--muted);max-width:70ch;margin-bottom:16px}.legend{color:var(--muted);font-size:.85rem;max-width:70ch;margin:8px 0 0}.legend code{color:var(--ink)}.lead a,.run-in a{color:var(--ink)}
/* learn */
.learn{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:grid;grid-template-columns:18px 54px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;line-height:1.25}
.list button.on{background:var(--soft)}
.list button .id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.learned{background:var(--accent)}.dot.drilled{background:var(--warn)}.dot.mastered{background:var(--ok)}
.item .meta{font-family:var(--mono);color:var(--muted);font-size:.85rem;margin-bottom:2px}
.term{background:var(--term);color:var(--termink);font-family:var(--mono);font-size:.86rem;line-height:1.5;border-radius:10px;padding:8px 14px 12px;margin:12px 0;overflow-x:auto}
.term .tb{display:flex;justify-content:flex-end;min-height:22px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding-left:1.4em;text-indent:-1.4em;margin:2px 0}
.term .p{color:var(--prompt)}
.term .ln.c{color:#9DB0C6;font-style:italic}
.term .copy{border:1px solid #2E4158;background:#17283D;color:var(--termink);border-radius:6px;padding:2px 9px;font:600 .75rem var(--sans)}
.term .copy.done{border-color:var(--ok);color:#8BE0B4}
.run-in b{font-weight:700}
.explain{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--soft)}
.explain textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);resize:vertical}
.explain label{display:flex;gap:10px;align-items:center;margin-top:8px;font-weight:600}
.explain input{width:20px;height:20px;accent-color:var(--ok)}
.nav{display:flex;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
/* drill */
.q{max-width:720px}
.q .count{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;line-height:1.35}
.opts button.cmd{font-family:var(--mono);font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.opts button.ok{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.typein{width:100%;max-width:560px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);background:var(--panel)}
.result{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:560px}
.result .big{font-size:2.4rem;font-weight:800;font-family:var(--mono)}
/* run */
.timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.timer .clock{font-family:var(--mono);font-size:2rem;font-weight:700;min-width:120px}
.timer select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.chk input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--ok)}
.chk .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chk .t .id{font-family:var(--mono);color:var(--muted);font-size:.8rem}
.chk .note{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;background:var(--panel);font-size:.9rem}
.chk.done .t{color:var(--muted);text-decoration:line-through}
.chk .stamp{font-family:var(--mono);font-size:.8rem;color:var(--ok)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
/* games */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.brief{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0 14px;max-width:720px}
.brief ul{margin:4px 0 0 18px;padding:0}
.acct{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);max-width:720px}
.acct .n{font-family:var(--mono)}
.acct .n small{color:var(--muted);font-family:var(--sans);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.acct.ok .n{color:var(--ok)}.acct.bad .n{color:var(--bad)}
.streak{font-family:var(--mono);color:var(--muted);font-size:.9rem}
/* report */
.report h2{font-size:1.05rem;margin-bottom:10px}
.lv{margin:10px 0 14px}
.lv .row{display:flex;justify-content:space-between;font-size:.9rem}
.lv .bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.lv .bar2 i{display:block;height:100%;background:var(--accent)}
.lv .bar2.earned i{background:var(--ok)}
.rr{display:grid;grid-template-columns:18px 52px 1fr 26px;gap:6px;align-items:center;font-size:.85rem;padding:3px 0;border-top:1px solid var(--line)}
.rr .id{font-family:var(--mono);color:var(--muted);font-size:.78rem}
.rr .pt{font-family:var(--mono);text-align:right;color:var(--muted)}
.rr.mastered .g{color:var(--ok);font-weight:800}.rr.mastered .pt{color:var(--ok)}
.rr.learned .g{color:var(--accent);font-weight:800}
.rr.drilled .g{color:var(--warn);font-weight:800}
.rr .g{text-align:center}
.rr.flip{animation:flip .35s ease-out}
@keyframes flip{0%{background:var(--okbg)}100%{background:transparent}}
.total{display:flex;justify-content:space-between;font-family:var(--mono);margin-top:10px;padding-top:8px;border-top:2px solid var(--ink)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted);margin-left:6px}
.empty{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion:reduce){ .rr.flip{animation:none} }
@media (max-width:1100px){ .wrap{grid-template-columns:1fr} aside.report{display:none;border-left:0;border-top:1px solid var(--line)} body[data-mode="report"] aside.report{display:block} body[data-mode="report"] main{display:none} .modes .rep{display:inline-block} }
@media (min-width:1101px){ .modes .rep{display:none} }
@media (max-width:760px){ header.top{position:static} .learn{grid-template-columns:1fr} .list{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px} .list button{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line)} .list button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .list button .ttl{display:none} .levels{margin-left:0} .score{margin-left:auto} }
.picked{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:.92rem}.missed{display:grid;gap:6px;margin:10px 0}.miss{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.9rem;text-align:left}.small{font-size:.85rem;color:var(--muted)}.rr .g.due{color:var(--muted)}.report .ex{margin-top:10px;font-size:.85rem}.report .ex dt{font-family:var(--mono);color:var(--muted);margin-top:6px}.report .ex dd{margin:0}

/* reading support (panel review): text size, support bar, terms panel, banner, contrast, forced colours, print */
:root[data-text="large"]{font-size:112.5%}:root[data-text="larger"]{font-size:125%}
:root[data-text="large"] body{font-size:18px}:root[data-text="larger"] body{font-size:20px}
.sbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 14px;max-width:100%;font-size:.85rem}
.sbar button,.theme.sb{font:inherit;font-size:.8rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line,var(--rule,#8a97a5));background:var(--panel,var(--face,#fff));color:var(--ink);cursor:pointer;white-space:nowrap}
.termsbox{position:fixed;right:12px;bottom:12px;width:min(420px,calc(100vw - 24px));max-height:min(60vh,520px);overflow:auto;background:var(--panel,var(--face,#fff));color:var(--ink);border:1px solid var(--line,var(--rule,#8a97a5));border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:50;font-size:.92rem}
.termsbox h2{margin:0 0 6px;font-size:1rem}.termsbox .trow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.termsbox input{flex:1;min-width:120px;font:inherit;padding:5px 8px;border:1px solid var(--line,var(--rule,#8a97a5));border-radius:8px;background:var(--panel,var(--face,#fff));color:var(--ink)}
.termsbox button{font:inherit;font-size:.8rem;padding:4px 9px;border-radius:8px;border:1px solid var(--line,var(--rule,#8a97a5));background:var(--panel,var(--face,#fff));color:var(--ink);cursor:pointer}
.termsbox dl{margin:6px 0 0}.termsbox dt{font-weight:600;margin-top:6px}.termsbox dd{margin:0}.termsbox .tdef{margin:4px 0;padding:6px 8px;border-left:3px solid currentColor;min-height:1.2em}
.sharebar{display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center;padding:.6rem .9rem;background:var(--soft,var(--face,#eef3f7));color:var(--ink);border-bottom:1px solid var(--line,var(--rule,#8a97a5));font-size:.92rem;max-width:100%}
.sharebar button{font:inherit;font-size:.85rem;padding:.25rem .7rem;border-radius:6px;border:1px solid var(--line,var(--rule,#8a97a5));background:var(--panel,var(--face,#fff));color:var(--ink);cursor:pointer}
@media (prefers-contrast:more){:root{--line:currentColor;--rule:currentColor}button,.btn,.opts button,.list button,.chk,.card,.ticket{border:1px solid currentColor}}
@media (forced-colors:active){button,.btn,.opts button,.list button{border:1px solid ButtonText}.bar2 i,.fill{background:Highlight}}
@media print{.sbar,.termsbox,.sharebar,header .levels,header .modes,header .theme,nav.series,aside.report,footer,.nav,button{display:none !important}.wrap{display:block}.list{flex-direction:column}.list button{display:grid !important;border:none}#view,.learn{display:block}body{background:#fff;color:#000}}
</style>

<script>
const APP = {"key": "windows-server", "os": "Windows Server 2025 (member server or domain controller)", "accent": "#3F3DA8", "footer": "Training tool for Windows Server virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial practice; not affiliated with or endorsed by Microsoft.", "legend": "PS> runs in an elevated PowerShell and CMD> in an elevated Command Prompt. Type what follows the prefix, and replace each value in angle brackets, such as <name>, with a real one. GUI: lines walk through a window, and indented lines show values to set or read.", "levels": [{"name": "Doorman", "badge": "🚪", "blurb": "Lock the doors. Find the role first (standalone, member server, or domain controller), then users, admins, passwords, and policy where it takes effect: local or domain. Learn it first: Defense Ladder s2, \"Desktop, member server, or domain controller.\"", "items": [{"id": "B-00", "title": "Scenario brief and evidence first", "cmds": ["GUI: open the scenario brief (the documented requirements for this machine) and write down authorized users, admins, required services, and anything forbidden", "PS> (Get-CimInstance Win32_ComputerSystem).DomainRole", "  0-1 standalone or member workstation, 2-3 standalone or member server, 4-5 domain controller", "CMD> dsregcmd /status   (AzureAdJoined and DomainJoined show who else can push settings to this server)", "PS> Get-WindowsFeature AD-Domain-Services,DNS,DHCP,Web-Server,Web-Ftp-Server | Select-Object Name,Installed"], "why": "Read the brief: removing a user, role, or service it requires is an availability failure. Evidence first: answer the investigation questions before any change (Defense Ladder f1).", "note": "Unfamiliar is distinct from unauthorized. Before removing an agent, find what starts it, who owns it, and what it does, then ask the owner (Defense Ladder s1).", "also": "Member servers use local accounts and secpol; domain controllers use Active Directory and Group Policy.", "task": "", "t": "", "area": "inv"}, {"id": "B-01", "title": "List users: local and domain", "cmds": ["PS> Get-LocalUser | Select-Object Name,Enabled,PasswordRequired,LastLogon", "PS> Get-ADUser -Filter * -Properties Enabled,PasswordNeverExpires,PasswordNotRequired,LastLogonDate | Select-Object Name,Enabled,PasswordNeverExpires,PasswordNotRequired,LastLogonDate", "CMD> net user /domain", "PS> Get-Command *LocalUser*   (member server; on a domain controller, Get-Command -Module ActiveDirectory)", "PS> Get-LocalUser | Get-Member   (lists every property you can select, such as Enabled)", "GUI: dsa.msc (Active Directory Users and Computers) on a DC; lusrmgr.msc on a member server"], "why": "Unauthorized accounts are backdoors. On a DC the local SAM is gone; every account is a domain account, so Get-ADUser is the list to compare with the brief.", "note": "PasswordNotRequired=True and PasswordNeverExpires=True are findings in their own right.", "task": "list every domain user (minimal PowerShell)", "t": "Get-ADUser -Filter *", "ta": ["get-aduser -filter * | select name", "net user /domain"], "area": "acct"}, {"id": "B-02", "title": "Remove or disable an unauthorized user", "cmds": ["PS> Get-ScheduledTask | Where-Object { $_.Principal.UserId -like '*baduser' } | Select-Object TaskPath,TaskName", "PS> Get-CimInstance Win32_Service | Where-Object StartName -like '*baduser' | Select-Object Name,StartName,PathName", "PS> Disable-ADAccount -Identity baduser", "PS> Enable-ADAccount -Identity keola   (undo a disable once the owner confirms the account is needed)", "PS> Remove-ADUser -Identity baduser -Confirm:$false", "PS> Remove-LocalUser -Name \"baduser\"", "CMD> net user baduser /delete", "PS> Enable-LocalUser -Name keola   (member server: undo a disable once the brief confirms the account belongs)"], "why": "Disable first if the brief is unclear; delete when it is clear. A disabled account keeps its SID and group memberships for the investigation question.", "note": "First, answer every investigation question that names the account. Then handle each scheduled task or service running as that account; the first two commands find them.", "also": "Deletion leaves the profile under C:\\Users: search it for evidence and prohibited files, then remove it.", "task": "disable the domain account baduser", "t": "Disable-ADAccount -Identity baduser", "ta": ["disable-adaccount baduser"], "area": "acct"}, {"id": "B-03", "title": "Audit the privileged groups", "cmds": ["PS> Get-ADGroupMember \"Domain Admins\"; Get-ADGroupMember \"Enterprise Admins\"; Get-ADGroupMember \"Schema Admins\"; Get-ADGroupMember \"Administrators\"", "PS> Get-ADGroupMember \"Account Operators\"; Get-ADGroupMember \"Server Operators\"; Get-ADGroupMember \"Backup Operators\"; Get-ADGroupMember \"DnsAdmins\"", "PS> Remove-ADGroupMember -Identity \"Domain Admins\" -Members baduser -Confirm:$false", "PS> Get-Help Get-LocalGroupMember -Examples   (worked examples; run Update-Help once, online, for the full text)", "PS> Get-LocalGroupMember -Group Administrators", "CMD> net localgroup Administrators baduser /delete", "PS> Remove-LocalGroupMember -Group Administrators -Member baduser   (member server)"], "why": "Domain Admins grants everything; the operator groups, Backup Operators, and DnsAdmins reach the same place quietly. Compare each group's members with the brief; on a member server, check local Administrators.", "task": "list the members of Domain Admins", "t": "Get-ADGroupMember \"Domain Admins\"", "ta": ["get-adgroupmember -identity \"domain admins\"", "get-adgroupmember domain admins", "net group \"domain admins\" /domain"], "area": "acct"}, {"id": "B-04", "title": "Disable Guest; protect the built-in Administrator", "cmds": ["PS> Get-LocalUser | Where-Object { $_.SID -like '*-50[01]' } | Select-Object Name,Enabled,SID   (member server)", "PS> Get-ADUser -Filter * | Where-Object { $_.SID -like '*-50[01]' } | Select-Object Name,Enabled,SID   (domain controller)", "CMD> whoami /user", "CMD> net user Guest /active:no", "PS> Disable-LocalUser -Name Guest   (member server)", "PS> Disable-ADAccount -Identity Guest", "CMD> net user Administrator /active:no", "PS> Set-ADUser -Identity Administrator -PasswordNeverExpires $false", "PS> Get-LapsADPassword -Identity KAILUA-WS07 -AsPlainText   (Windows LAPS: each computer's own local Administrator password, rotated and readable only by granted groups)"], "why": "Well-known names invite brute force. Disable Guest; keep Administrator enabled only when the brief uses it, with a strong password. Match SID -500 (Administrator) and -501 (Guest) to catch renames.", "note": "Keep the account the brief tells you to log in with enabled; whoami /user shows your SID, and -500 marks the built-in Administrator.", "also": "Rename Administrator and Guest last, only when the brief or policy asks (Rename-LocalUser on a member server). The SID stays, so disabling and a strong password carry the protection.", "task": "disable the domain Guest account", "t": "Disable-ADAccount -Identity Guest", "ta": ["net user guest /active:no"], "area": "acct"}, {"id": "B-05", "title": "Strong passwords and forced change", "cmds": ["PS> Get-ADUser -Filter * -Properties PasswordLastSet,PasswordNeverExpires | Select-Object Name,Enabled,PasswordLastSet,PasswordNeverExpires", "PS> Set-ADAccountPassword -Identity alice -Reset -NewPassword (Read-Host -AsSecureString 'New password')", "PS> Set-ADUser -Identity alice -PasswordNeverExpires $false -PasswordNotRequired $false", "PS> Set-ADUser -Identity alice -ChangePasswordAtLogon $true", "PS> Get-ADUser -Identity alice -Properties PasswordNeverExpires,pwdLastSet | Select-Object Name,PasswordNeverExpires,pwdLastSet", "PS> Get-ADUser -Filter 'Enabled -eq $true' | Where-Object SamAccountName -ne $env:USERNAME | Set-ADUser -PasswordNeverExpires $false", "CMD> net user alice *", "CMD> net user alice /logonpasswordchg:yes", "PS> Set-LocalUser -Name alice -PasswordNeverExpires $false   (member server)"], "why": "Weak, shared, or blank passwords let attackers in. PasswordNotRequired allows blank ones despite policy; PasswordNeverExpires defeats aging. Clear both, force a change at next sign-in, and confirm pwdLastSet is 0.", "note": "Apply B-06 and B-07 first so new passwords meet domain policy. Read-Host and net user * prompt, hiding passwords from command history; record them safely (on paper, in a lab).", "also": "The bulk line clears service accounts' PasswordNeverExpires, so their passwords expire. Exclude them by name, or handle them in A-10, updating each service's Log On tab at the same time.", "task": "force domain user alice to change the account's password at next logon", "t": "Set-ADUser -Identity alice -ChangePasswordAtLogon $true", "ta": ["set-aduser alice -changepasswordatlogon $true"], "area": "acct"}, {"id": "B-06", "title": "Password policy where it actually lives", "cmds": ["PS> Get-ADDefaultDomainPasswordPolicy", "PS> Set-ADDefaultDomainPasswordPolicy -Identity (Get-ADDomain).DNSRoot -MinPasswordLength 12 -ComplexityEnabled $true -PasswordHistoryCount 24 -MinPasswordAge 1.00:00:00 -MaxPasswordAge 60.00:00:00 -ReversibleEncryptionEnabled $false", "GUI: gpmc.msc, Default Domain Policy, Computer Configuration, Policies, Windows Settings, Security Settings, Account Policies, Password Policy", "CMD> net accounts /minpwlen:12 /maxpwage:60 /minpwage:1 /uniquepw:24   (member server)", "GUI: secpol.msc, Account Policies, Password Policy (member server)"], "why": "Default Domain Policy overrides net accounts and secpol.msc on DCs only. Passwords set while reversible encryption was on stay recoverable: reset them, and check accounts with Get-ADUser <name> -Properties AllowReversiblePasswordEncryption.", "note": "The brief sets the numbers; these are one sample. CIS Benchmark: 14 or more characters, history 24 or more, maximum age 1–365 days, minimum age 1 day or more.", "task": "show the domain password policy", "t": "Get-ADDefaultDomainPasswordPolicy", "ta": ["net accounts /domain"], "area": "acct"}, {"id": "B-07", "title": "Account lockout policy", "cmds": ["PS> Set-ADDefaultDomainPasswordPolicy -Identity (Get-ADDomain).DNSRoot -LockoutThreshold 5 -LockoutDuration 00:30:00 -LockoutObservationWindow 00:30:00", "CMD> net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30   (member server)", "PS> Search-ADAccount -LockedOut | Select-Object Name", "PS> Unlock-ADAccount -Identity alice"], "why": "Turns an online brute force from thousands of guesses a minute into five per half hour. Search-ADAccount shows who is locked out right now, which is also an investigation clue.", "note": "The brief sets the numbers. The CIS Benchmark asks for a threshold of 5 or fewer and above 0, and a duration and reset window of 15 minutes or more.", "also": "A member server's local built-in Administrator locks only with Allow Administrator account lockout Enabled (AllowAdministratorLockout = 1, Hunter A-01), only for network sign-ins like Remote Desktop. Console sign-in stays available.", "task": "list locked-out domain accounts", "t": "Search-ADAccount -LockedOut", "ta": ["search-adaccount -lockedout | select name"], "area": "acct"}, {"id": "B-08", "title": "Firewall on for all profiles", "cmds": ["PS> Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True", "PS> Get-NetFirewallProfile -PolicyStore ActiveStore | Select-Object Name,Enabled,DefaultInboundAction", "CMD> netsh advfirewall set allprofiles state on", "CMD> netsh advfirewall show allprofiles"], "gui": "Settings, Privacy and security, Windows Security, Firewall and network protection.", "why": "Default-deny inbound covers the service you have not found yet. Misconfigured machines often have exactly one profile off, usually Public.", "note": "DefaultInboundAction should be Block. ActiveStore shows values in force, Group Policy included; the plain view reads NotConfigured for values left at default (Block inbound). Watchman covers allow rules.", "task": "turn the firewall on for every profile (cmd)", "t": "netsh advfirewall set allprofiles state on", "ta": ["set-netfirewallprofile -profile domain,public,private -enabled true", "set-netfirewallprofile -all -enabled true"], "area": "config"}, {"id": "B-09", "title": "Windows Update on a server", "cmds": ["CMD> sconfig   (option 5: Update setting = Automatic; option 6: Install Updates)", "GUI: Win+R, ms-settings:windowsupdate (Settings, Windows Update), Check for updates", "PS> Set-Service -Name wuauserv -StartupType Automatic; Start-Service wuauserv", "PS> Get-Service wuauserv,BITS,UsoSvc | Select-Object Name,Status,StartType", "PS> Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 5", "CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate /s", "CMD> reg delete HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate /v WUServer /f   (only when the brief rules out an update server; delete UseWUServer with it)", "CMD> reg delete HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU /v UseWUServer /f   (the pair goes together: UseWUServer 1 keeps Windows looking for the deleted server)", "GUI: gpmc.msc (or gpedit.msc), Computer Configuration, Policies, Administrative Templates, Windows Components, Windows Update: Configure Automatic Updates = Enabled (4)", "PS> winget upgrade   (lists apps with newer versions; winget ships with Server 2025)", "CMD> shutdown /r /t 60 /c \"Installing updates\"   (warn signed-in users first: quser lists them)"], "why": "Patching closes known holes; automatic updates keep closing them. A reverting setting is GPO-owned: NoAutoUpdate 1 disables automatic updates; UseWUServer 1 sends checks to WUServer, which the brief must name.", "note": "Start updates early; recheck after each restart until Windows Update reports up to date. wuauserv ships as Manual (starts on demand); Disabled is the finding. Save work before any reboot.", "task": "open the server configuration menu", "t": "sconfig", "area": "patch"}, {"id": "B-10", "title": "Microsoft Defender on Server", "cmds": ["PS> Get-MpComputerStatus | Select-Object AMServiceEnabled,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated", "PS> Get-MpComputerStatus | Select-Object AMRunningMode", "PS> Install-WindowsFeature -Name Windows-Defender", "PS> Set-MpPreference -DisableRealtimeMonitoring $false", "PS> Update-MpSignature", "PS> Start-MpScan -ScanType QuickScan", "PS> Start-MpScan -ScanType CustomScan -ScanPath C:\\Users", "PS> Get-MpThreatDetection | Select-Object InitialDetectionTime,ProcessName,Resources", "GUI: Win+R, windowsdefender: (opens Windows Security), Virus and threat protection, Manage settings"], "why": "Windows Server ships with Defender, but someone can remove the feature or disable it by policy. Real-time protection and current signatures both matter, and Get-MpComputerStatus shows each.", "note": "Answer the investigation questions before any scan, because a scan can quarantine the file a question asks about. Record each detection's Resources path before removing the program that dropped it.", "also": "If Get-MpComputerStatus errors, the feature is missing: install it, restart when RestartNeeded says Yes, then configure. AMRunningMode Normal means active; Passive means another antivirus leads. The brief picks the product.", "area": "malware"}, {"id": "B-11", "title": "Remove unapproved software", "cmds": ["PS> Get-ItemProperty HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*, HKLM:\\Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*, Registry::HKEY_USERS\\*\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\* -ErrorAction SilentlyContinue | Select-Object DisplayName,DisplayVersion,Publisher,UninstallString | Sort-Object DisplayName", "GUI: Settings, Apps, Installed apps (or appwiz.cpl)"], "why": "Hacking tools, games, torrent clients, and remote-access tools are acceptable-use violations and attack surface.", "note": "Software the brief requires stays. Portable tools appear only in a file search (B-12, A-06). After removing a remote-access tool, check for its leftover service (I-04) and firewall rule (I-12).", "also": "The registry listing is instant; Win32_Product is slow and can trigger repairs. HKEY_USERS adds signed-in users' own apps. Remove capture tools' separate Npcap install when the brief omits packet capture.", "area": "software"}, {"id": "B-12", "title": "Find unapproved media and loose executables", "cmds": ["PS> Get-ChildItem -Path C:\\Users,C:\\inetpub,C:\\Shares -Recurse -Force -File -Include *.mp3,*.mp4,*.wav,*.avi,*.mkv,*.flac,*.mov,*.m4a,*.mpg,*.mpeg,*.ogg,*.flv,*.wma,*.aac -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\|^C:\\\\Users\\\\(All Users|Default User)\\\\' | Select-Object FullName", "CMD> dir /s /a /b C:\\Users\\*.mp3 C:\\Users\\*.mp4", "CMD> del /s /a C:\\Users\\*.mp3 C:\\Users\\*.mp4   (after dir /s /a /b lists the same files and the brief bans them; del also reaches AppData, where apps keep their own sounds, so check that list for AppData paths first)", "CMD> rd /s /q \"C:\\Users\\<user>\\Music\\<folder>\"   (a folder of banned files, after dir lists it: rd removes the folder and everything in it)", "PS> Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.mp3,*.mp4 -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\' | Remove-Item -Force   (after the list above is reviewed and any file a question names is hashed)", "PS> Get-ChildItem -Path C:\\Users,C:\\inetpub -Recurse -Force -File -Include *.exe,*.bat,*.cmd,*.ps1,*.vbs,*.hta,*.aspx,*.py,*.jar,*.zip,*.7z,*.rar -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\Local\\\\(Microsoft|Packages)\\\\|^C:\\\\Users\\\\(All Users|Default User)\\\\' | Select-Object FullName,LastWriteTime", "PS> Get-Item 'C:\\Users\\<user>\\Downloads\\<file>' -Stream * | Select-Object Stream,Length", "PS> Get-Content 'C:\\Users\\<user>\\Downloads\\<file>' -Stream Zone.Identifier   (ZoneId=3 marks a file downloaded from the internet)", "PS> Unblock-File -Path 'C:\\Users\\<user>\\Downloads\\<file>'   (only for an expected file from a trusted source: it removes the downloaded-from-the-internet mark)", "CMD> tar -tf \"C:\\Users\\<user>\\Downloads\\<archive>.zip\""], "why": "Media in user profiles and web roots is the usual acceptable-use violation; a stray .aspx or .ps1 under inetpub is a webshell. Confirm each file against the brief before deleting.", "note": "First answer every investigation question naming a file and record its hash (B-14); then delete it and log the path. tar -tf lists a .zip's contents before you delete it.", "also": "Search C:\\ too, beyond C:\\Users. -Force shows hidden files; the filters skip AppData caches and the All Users and Default User links. Keep Python and other runtimes the brief needs.", "area": "data"}, {"id": "B-13", "title": "Stop obviously unsafe services", "cmds": ["PS> Get-Service -Name ftpsvc,TermService,RemoteRegistry,SNMP -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType", "PS> Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server' -Name fDenyTSConnections -Value 1", "PS> Get-NetFirewallRule -Group '@FirewallAPI.dll,-28752' -ErrorAction SilentlyContinue | Disable-NetFirewallRule", "CMD> reg query \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\" /v fDenyTSConnections", "PS> Get-WindowsFeature Remote-Assistance", "GUI: services.msc, Startup type Disabled; Settings, System, Remote Desktop", "PS> Stop-Service -Name Spooler; Set-Service -Name Spooler -StartupType Disabled   (unless this is the print server)", "PS> Get-NetTCPConnection -State Listen -LocalPort 21,3389 -ErrorAction SilentlyContinue"], "why": "Telnet and FTP leak cleartext credentials, Remote Registry allows remote registry edits, RDP draws brute force, and a domain controller's Print Spooler is PrintNightmare. Confirm: the port check returns empty.", "note": "If the brief requires RDP, FTP, or SSH, harden it instead of killing it (I-11). Remote management tools use Remote Registry on a server: disable it when the brief names local administration only, and record the change. Turning Remote Desktop off takes the setting plus its firewall group (the @FirewallAPI name works in any display language). fDenyTSConnections 0 under the Terminal Services policy key forces Remote Desktop back on, so an error that the value is missing is the good result. When the brief leaves Remote Assistance out, run Uninstall-WindowsFeature Remote-Assistance. The last line returns empty once FTP and Remote Desktop stop listening.", "task": "stop Remote Registry and disable its startup", "t": "Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "area": "config"}, {"id": "B-14", "title": "Hash a file for an investigation question", "cmds": ["PS> Get-FileHash -LiteralPath 'C:\\Users\\<user>\\Desktop\\<file>' -Algorithm SHA256 | Format-List", "CMD> certutil -hashfile \"C:\\Users\\<user>\\Desktop\\<file>\" SHA256", "PS> Format-Hex -Path 'C:\\Users\\<user>\\Desktop\\<file>' | Select-Object -First 1   (the first bytes name the real type: 4D 5A is an .exe, 25 50 44 46 is a PDF; PowerShell 7 adds -Count 8)", "PS> Get-MpThreatDetection | Select-Object InitialDetectionTime,Resources"], "why": "Answer with the named algorithm's exact hex string, which repeats on every run. Hash before any Defender scan, cleanup, or move: changed or quarantined, the file answers differently or vanishes.", "note": "Check each hash's length: MD5 32 hex characters, SHA1 40, SHA256 64. certutil defaults to SHA1, so name the algorithm. -LiteralPath reads names with [ ] that -Path skips.", "also": "Quotes keep paths with spaces whole. If opening the file reports a virus, Defender already quarantined it: Get-MpThreatDetection and Windows Security, Protection history show the path and time to record.", "task": "print the SHA256 hash of C:\\Users\\Public\\notes.txt", "t": "Get-FileHash -Algorithm SHA256 C:\\Users\\Public\\notes.txt", "ta": ["get-filehash c:\\users\\public\\notes.txt -algorithm sha256", "get-filehash -path c:\\users\\public\\notes.txt -algorithm sha256", "get-filehash -literalpath c:\\users\\public\\notes.txt -algorithm sha256", "certutil -hashfile c:\\users\\public\\notes.txt sha256"], "area": "inv"}, {"id": "B-15", "title": "Create the users and groups the brief lists", "cmds": ["PS> New-ADUser -Name 'kekoa' -SamAccountName 'kekoa' -AccountPassword (Read-Host -AsSecureString 'Password') -Enabled $true", "PS> New-ADGroup -Name 'Accounting' -GroupScope Global", "PS> Add-ADGroupMember -Identity 'Accounting' -Members kekoa", "PS> Get-ADGroupMember -Identity 'Accounting'", "CMD> net user kekoa * /add   (member server)", "PS> New-LocalUser -Name 'kekoa' -Password (Read-Host -AsSecureString 'Password')   (member server)", "PS> New-LocalGroup -Name Accounting   (member server)", "CMD> net localgroup Accounting /add   (member server)", "CMD> net localgroup Accounting kekoa /add   (member server)", "PS> Add-LocalGroupMember -Group Accounting -Member kekoa   (member server)"], "why": "A listed user or group missing from the machine locks someone out of sign-in and the job's files. Create exactly that set; the brief is the source of truth.", "note": "Read-Host and net user * prompt for the password, keeping it out of command history. Security events 4720 (account created) and 4728 (added to a global group) record each step.", "task": "add the domain user kekoa to the group Accounting", "t": "Add-ADGroupMember -Identity Accounting -Members kekoa", "ta": ["add-adgroupmember accounting kekoa", "add-adgroupmember accounting -members kekoa"], "area": "acct"}, {"id": "B-16", "title": "Find files that store passwords", "cmds": ["PS> Get-ChildItem -Path C:\\Users,C:\\inetpub,C:\\Shares -Recurse -Force -File -Include *.txt,*.csv,*.ini,*.xml,*.log,*.ps1,*.bat -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '\\\\AppData\\\\Local\\\\|^C:\\\\Users\\\\(All Users|Default User)\\\\' | Select-String -Pattern 'passw(or)?d|pwd|credential' -List | Select-Object Path,LineNumber,Line", "CMD> findstr /s /i /m /c:\"password\" C:\\Users\\*.txt C:\\Users\\*.csv C:\\Users\\*.ini", "PS> Get-ChildItem -Path C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\PSReadLine\\ConsoleHost_history.txt -Force -ErrorAction SilentlyContinue | Select-String -Pattern 'net user|ConvertTo-SecureString|passw' | Select-Object Path,Line", "PS> Get-ChildItem -Path C:\\Windows\\Panther\\Unattend.xml,C:\\Windows\\Panther\\Unattend\\Unattend.xml,C:\\Windows\\System32\\Sysprep\\unattend.xml -Force -ErrorAction SilentlyContinue | Select-String -Pattern '<Password>|AdministratorPassword' | Select-Object Path,LineNumber", "CMD> cmdkey /list"], "why": "Passwords in notes, scripts, PowerShell history, or Windows Setup answer files expose accounts. Hidden answer-file passwords are only encoded: treat them as plaintext. Content search finds them under any name.", "note": "First answer any investigation question that names the file and record its hash (B-14). Then remove or move it where the brief says, and log the path.", "also": "Review each hit: license and app files match too. cmdkey /list shows only the signed-in user's saved passwords, like TERMSRV/<host> for Remote Desktop; cmdkey /delete:<target> removes one the brief omits.", "task": "list the .txt files under C:\\Users that contain the word password (cmd)", "t": "findstr /s /i /m password C:\\Users\\*.txt", "ta": ["findstr /s /i /m /c:password c:\\users\\*.txt", "findstr /i /s /m password c:\\users\\*.txt", "findstr /s /m /i password c:\\users\\*.txt"], "area": "data"}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. Roles and features, audit and policy through Group Policy, services, shares, tasks, ports, logs, and the required roles (IIS, FTP, DNS, and DHCP) hardened rather than removed. Learn it first: Defense Ladder j1, \"Windows Server and Active Directory,\" and Defense Ladder j2, \"Group Policy.\"", "items": [{"id": "I-01", "title": "Audit policy: turn the lights on", "cmds": ["CMD> wevtutil sl Security /ms:201326592", "CMD> wevtutil gl Security   (maxSize shows the new limit)", "CMD> auditpol /backup /file:C:\\Windows\\Temp\\audit-before.csv", "CMD> auditpol /set /category:* /success:enable /failure:enable", "CMD> auditpol /get /category:*", "GUI: gpmc.msc, Default Domain Controllers Policy, Computer Configuration, Policies, Windows Settings, Security Settings, Advanced Audit Policy Configuration"], "why": "Without auditing, Event Viewer has nothing to tell you or an investigator. Logon, account management, and policy change are the key ones.", "note": "On a DC the Default Domain Controllers Policy overrides local auditpol: set it there or it reverts at the next gpupdate. Pick one route, auditpol here or Advanced Audit Policy Configuration in Group Policy, and leave secpol's basic Audit Policy node unset; Microsoft warns that mixing the two gives unexpected results, so trust auditpol /get. wevtutil raises the Security log to 192 MB first so the extra events keep older evidence; auditpol /restore /file:C:\\Windows\\Temp\\audit-before.csv undoes the change. Fine-grained subcategories, and trimming the noisiest ones, are A-08.", "task": "enable success and failure auditing for every category", "t": "auditpol /set /category:* /success:enable /failure:enable", "area": "audit"}, {"id": "I-02", "title": "Security Options in secpol.msc", "cmds": ["GUI: secpol.msc, Local Policies, Security Options", "  Accounts: Limit local account use of blank passwords to console logon only = Enabled", "  Devices: Prevent users from installing printer drivers = Enabled", "  Interactive logon: Don't display last signed-in = Enabled (older label: Do not display last user name)", "  Interactive logon: Machine inactivity limit = 900 seconds or fewer", "  Interactive logon: Do not require CTRL+ALT+DEL = Disabled", "  Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled", "  Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM & NTLM", "  Microsoft network client and server: Digitally sign communications (always) = Enabled", "  Shutdown: Allow system to be shut down without having to log on = Disabled", "  User Account Control: Run all administrators in Admin Approval Mode = Enabled", "  Domain controller: LDAP server signing requirements = Require signing", "  Domain member: Digitally encrypt or sign secure channel data (always) = Enabled"], "why": "Classic CIS and STIG level-one settings. Each blocks a named attack: blank-password remote logon, username harvesting, LM and NTLMv1 cracking or relay, SMB relay, shutdown before sign-in, and UAC bypass.", "note": "The inactivity limit locks every idle session. A VM sends the required CTRL+ALT+DEL from its window menu or Ctrl+Alt+End (Hyper-V, Remote Desktop). Command line: Hunter A-02 (registry) or A-01 (secedit).", "also": "Releases older than Windows 11 24H2 and Windows Server 2025 still accept NTLMv1: check the LAN Manager authentication level there and in mixed domains.", "area": "config"}, {"id": "I-03", "title": "UAC to Always notify", "cmds": ["GUI: Win+R, UserAccountControlSettings: move the slider to the top, Always notify", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name ConsentPromptBehaviorAdmin -Value 2 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name PromptOnSecureDesktop -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name FilterAdministratorToken -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name ConsentPromptBehaviorUser -Value 0 -Type DWord"], "gui": "Control Panel, User Accounts, Change User Account Control settings, slider to the top.", "why": "ConsentPromptBehaviorAdmin 2 (Always notify) prompts on the secure desktop for every elevation; default 5 prompts only for programs outside Windows. UAC off silently elevates every admin process; malware rides along.", "note": "FilterAdministratorToken 1 puts the built-in Administrator, the account most often used on a server, under UAC too. ConsentPromptBehaviorAdmin 0 elevates silently. EnableLUA needs a reboot.", "also": "ConsentPromptBehaviorUser 0 refuses standard-user elevation; admins elevate from their own sessions. A Security Options policy overrides the slider at the next refresh; gpresult /scope computer /v shows it.", "area": "config"}, {"id": "I-04", "title": "Service audit: what runs, from where", "cmds": ["PS> Get-CimInstance Win32_Service | Select-Object Name,State,StartMode,StartName,PathName | Sort-Object Name", "PS> Get-Service | Where-Object Status -eq Running | Sort-Object DisplayName", "PS> Get-Service -Name EventLog,mpssvc,WinDefend | Select-Object Name,Status,StartType", "PS> Get-Alias sc   (in Windows PowerShell 5.1, sc runs Set-Content: type sc.exe for the service tool)", "CMD> sc.exe query state= all", "CMD> sc.exe qc <name>", "CMD> sc.exe qtriggerinfo RemoteRegistry   (events that can start a Manual service)", "CMD> sc.exe stop <name>", "CMD> sc.exe config <name> start= disabled", "CMD> sc.exe start <name>   (only a service the brief requires)", "CMD> sc.exe delete <name>   (a planted service only, after it is stopped and its file is reviewed; PowerShell 7 adds Remove-Service, and Windows PowerShell 5.1 uses sc.exe delete)", "CMD> sc.exe \\\\<server> qc Spooler   (the same check on a remote server)", "PS> Get-ItemProperty 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\SNMP\\Parameters\\ValidCommunities' -ErrorAction SilentlyContinue", "PS> Stop-Service -Name <name>; Set-Service -Name <name> -StartupType Disabled"], "why": "Planted services: Telnet, FTP, SNMP, SSDP, UPnP, Remote Registry, Xbox, odd names, and PathName under C:\\Users or C:\\Temp. StartName LocalSystem runs as SYSTEM, the most powerful account on the machine.", "note": "Required services (IIS, DNS, DHCP, OpenSSH, MySQL, Apache) stay running; harden their configs. EventLog and mpssvc (firewall) read Running and Automatic; WinDefend (Defender) too, unless the brief names another antivirus.", "also": "SNMP answers 161/udp to anyone who knows a community name; public or private is a guess away. When the brief leaves SNMP out: Uninstall-WindowsFeature -Name SNMP-Service.", "area": "config"}, {"id": "I-05", "title": "Roles and features: remove what the brief does not need", "cmds": ["PS> Get-WindowsFeature | Where-Object Installed | Select-Object Name,DisplayName", "PS> Uninstall-WindowsFeature -Name FS-SMB1,Telnet-Client,TFTP-Client,Simple-TCPIP,Print-LPD-Service", "PS> Uninstall-WindowsFeature -Name Web-Ftp-Server   (only when the brief leaves FTP out)", "PS> Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force", "PS> Get-NetTCPConnection -State Listen -LocalPort 21,80,443,515 -ErrorAction SilentlyContinue", "GUI: Server Manager, Manage, Remove Roles and Features"], "why": "Each extra feature adds exposure. FS-SMB1 is server-side SMBv1 (EternalBlue); Telnet and TFTP clients speak cleartext; Simple TCP/IP services (echo, daytime, chargen) reflect traffic; LPD takes print jobs on 515.", "note": "I-15 and I-16 harden required roles (AD DS, DNS, DHCP, IIS, FTP). -Remove also deletes the feature's component-store files: reinstalls need install media. Use it last, if the brief allows.", "also": "Before removing FS-SMB1 from a server others use, run Set-SmbServerConfiguration -AuditSmb1Access $true -Force; event 3000 in Microsoft-Windows-SMBServer/Audit shows who still uses SMBv1. Read RestartNeeded and batch the restarts.", "task": "list installed roles and features", "t": "Get-WindowsFeature | Where-Object Installed", "ta": ["get-windowsfeature | where installed"], "area": "config"}, {"id": "I-06", "title": "Shares", "cmds": ["PS> Get-SmbShare", "CMD> net share", "PS> Get-SmbShare | Where-Object { $_.Name -notmatch '^(ADMIN|IPC|PRINT|FAX)\\$$' -and -not ($_.Name -match '^[A-Z]\\$$' -and $_.Path -eq ($_.Name.Substring(0,1) + ':\\')) } | Select-Object Name,Path,Description", "PS> Remove-SmbShare -Name \"badshare\" -Force", "PS> Get-SmbShareAccess -Name \"Finance\"", "PS> Revoke-SmbShareAccess -Name \"Finance\" -AccountName Everyone -Force", "PS> Grant-SmbShareAccess -Name \"Finance\" -AccountName \"CORP\\Finance\" -AccessRight Change -Force", "CMD> auditpol /set /subcategory:\"File Share\" /success:enable /failure:enable"], "why": "An unexpected share is a data exfiltration path. Check the ACLs on the shares you must keep. Event 5142 names who added a share once File Share auditing is on.", "note": "A trailing $ hides a share from browsing; it still works. Normal: ADMIN$, IPC$, PRINT$, FAX$, a drive letter on its own root, and, on a DC, SYSVOL and NETLOGON.", "also": "Judge any other share; the filter line lists only added shares. The classic finding: Everyone with Full on a data share. Sharing C:\\Users or a profile folder exposes user files.", "task": "list the shares (cmd)", "t": "net share", "ta": ["get-smbshare"], "area": "access"}, {"id": "I-07", "title": "Scheduled tasks", "cmds": ["GUI: taskschd.msc, Task Scheduler Library: open each task's Triggers and Actions tabs; disable or delete a task the brief leaves unexplained", "PS> Get-ScheduledTask | Where-Object State -ne Disabled | Select-Object TaskPath,TaskName,State,Author,@{n='Run';e={($_.Actions | ForEach-Object { \"$($_.Execute) $($_.Arguments)\" }) -join '; '}},@{n='RunAs';e={$_.Principal.UserId}} | Format-Table -AutoSize -Wrap", "PS> (Get-ScheduledTask -TaskName \"<name>\").Actions | Select-Object Execute,Arguments", "PS> Export-ScheduledTask -TaskPath '\\' -TaskName '<name>' | Out-File -FilePath \"$env:USERPROFILE\\Desktop\\<name>.xml\"", "PS> Disable-ScheduledTask -TaskName \"<name>\" -TaskPath \"\\\"", "PS> Unregister-ScheduledTask -TaskName \"<name>\" -Confirm:$false", "CMD> schtasks /query /fo LIST /v", "  A task action such as powershell.exe -ExecutionPolicy Bypass -File C:\\Users\\Public\\x.ps1 or powershell -EncodedCommand <base64> hides what it runs: read the script or decode the Base64 to text, then remove the task", "CMD> auditpol /set /subcategory:\"Other Object Access Events\" /success:enable /failure:enable", "PS> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4698} | Format-List TimeCreated,Message", "PS> [Text.Encoding]::Unicode.GetString([Convert]::FromBase64String('<the text after -EncodedCommand>'))   (reads an encoded command without running it)"], "why": "Planted tasks re-add users, reopen ports, or run user-folder scripts every five minutes. Event 4698 logs each new task's XML and creator once Other Object Access Events auditing is on.", "note": "Tasks under \\Microsoft\\Windows are mostly stock; judge each root-path task by its program, since vendor updaters live there too. Export before removing: the XML keeps action, account, and author.", "area": "malware"}, {"id": "I-08", "title": "Startup items and Run keys", "cmds": ["PS> Get-CimInstance Win32_StartupCommand | Select-Object Name,Command,Location,User", "PS> Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Get-ItemProperty 'HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run' -Name \"<evil>\"", "GUI: Win+R, shell:startup (your Startup folder) and shell:common startup (every user's): remove shortcuts the brief leaves unexplained"], "gui": "Task Manager, Startup apps.", "why": "Anything that auto-runs survives a reboot. Attackers hide here with innocent names like Windows Update Helper.", "note": "Also check the RunOnce keys and the shell:startup folders.", "area": "malware"}, {"id": "I-09", "title": "Hosts file", "cmds": ["PS> Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "GUI: notepad as admin, open the hosts file, delete every non-comment line except localhost"], "why": "Malware points update and antivirus domains at 127.0.0.1 or an attacker IP, so Defender and Windows Update silently fail.", "task": "print the hosts file", "t": "Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "ta": ["type c:\\windows\\system32\\drivers\\etc\\hosts", "cat c:\\windows\\system32\\drivers\\etc\\hosts"], "area": "config"}, {"id": "I-10", "title": "Listening ports to process", "cmds": ["CMD> netstat -abno", "PS> Get-NetTCPConnection -State Listen | Select-Object LocalAddress,LocalPort,OwningProcess,@{n='Path';e={(Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).Path}} | Sort-Object LocalPort", "PS> Get-NetUDPEndpoint | Select-Object LocalAddress,LocalPort,OwningProcess | Sort-Object LocalPort", "PS> Get-Process -Id <pid> | Select-Object Name,Path", "PS> Stop-Process -Id <pid> -Force   (after you disable what starts it, so it stays stopped)", "CMD> tasklist /svc", "CMD> netsh http show servicestate   (names the program behind a port that netstat pins on PID 4, System)", "CMD> tcpvcon -accepteula -a -c   (Sysinternals: every TCP and UDP endpoint with its owning process, as CSV)"], "why": "A port you cannot explain is a backdoor; nc.exe listeners are the classic. Map port to PID to binary path to the service or task that starts it.", "note": "Expect DC ports 53, 88, 135, 389, 445, 464, 636, 3268, 3269, and dynamic RPC. System (PID 4) owns 445; netsh http show servicestate names programs behind its HTTP.sys ports.", "also": "Before ending a listener, find what starts it (service, task, or Run key) and disable that, or it returns at the next trigger.", "task": "show listening ports with their executables (cmd)", "t": "netstat -abno", "ta": ["netstat -ano", "netstat -abn"], "area": "config"}, {"id": "I-11", "title": "Remote Desktop hardening when RDP is required", "cmds": ["PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication -Value 1", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name SecurityLayer -Value 2", "PS> $ts='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services'; if (-not (Test-Path $ts)) { New-Item -Path $ts -Force | Out-Null }", "PS> foreach ($n in 'fDisableCdm','fDisablePNPRedir','fPromptForPassword','fEncryptRPCTraffic') { Set-ItemProperty -Path $ts -Name $n -Value 1 -Type DWord }", "PS> Get-CimInstance -Namespace root\\cimv2\\TerminalServices -ClassName Win32_TSGeneralSetting | Select-Object TerminalName,UserAuthenticationRequired,PolicySourceUserAuthenticationRequired", "CMD> net localgroup \"Remote Desktop Users\"", "PS> Get-LocalGroupMember -SID S-1-5-32-555", "GUI: Win+R, SystemPropertiesRemote: Allow connections only from computers running Remote Desktop with Network Level Authentication; clear Allow Remote Assistance connections when that box appears", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Remote Assistance' -Name fAllowToGetHelp -Value 0", "PS> Set-NetFirewallRule -DisplayGroup \"Remote Desktop\" -RemoteAddress <admin subnet>", "CMD> mstsc /v:<server> /restrictedAdmin   (Restricted Admin mode, for administrators: your reusable credentials stay off the far server)"], "why": "Network Level Authentication forces a login before a session exists, which kills pre-auth exploits, and the TLS security layer (SecurityLayer 2) proves the server is the real one before anyone types a password. Blocking drive and device redirection keeps a session from reading or dropping files on the connecting PC, and prompting at every connection defeats a password saved in an .rdp file. Administrators connect whenever RDP is on, so the Remote Desktop Users group is the list of non-admins the brief names; audit it. Remote Assistance should be off. Scope the Remote Desktop firewall rule to the admin subnet that the brief names, so only those addresses reach the port.", "area": "access", "note": "The redirector service (UmRdpService) stays at Manual while RDP is in use; the policy values do the blocking. PolicySource 1 in the read-back means Group Policy decides NLA. SecurityLayer 2 uses a self-signed certificate unless the brief supplies one, so the first connection shows a certificate prompt. -SID S-1-5-32-555 names Remote Desktop Users in any display language."}, {"id": "I-12", "title": "Firewall allow-rule review", "cmds": ["GUI: wf.msc, Inbound Rules: sort by Group, then disable or delete an Allow rule the brief leaves unexplained", "PS> Get-NetFirewallRule -PolicyStore ActiveStore | Where-Object {$_.Enabled -eq 'True' -and $_.Direction -eq 'Inbound' -and $_.Action -eq 'Allow'} | Select-Object DisplayName,Profile | Sort-Object DisplayName", "PS> Get-NetFirewallRule -PolicyStore ActiveStore -Direction Outbound -Action Block -Enabled True | Select-Object DisplayName,Profile", "PS> Get-NetFirewallRule -DisplayName '<rule>' | Get-NetFirewallPortFilter", "CMD> netsh advfirewall firewall show rule name=all dir=in", "PS> Remove-NetFirewallRule -DisplayName \"<suspicious rule>\"", "CMD> netsh advfirewall firewall delete rule name=\"<suspicious rule>\"", "PS> New-NetFirewallRule -Name 'Allow-HTTP-In' -DisplayName 'Allow HTTP (TCP 80) in' -Direction Inbound -Protocol TCP -LocalPort 80 -Action Allow -RemoteAddress <brief subnet>", "CMD> netsh advfirewall firewall add rule name=\"HTTP from the brief subnet\" dir=in action=allow protocol=TCP localport=80 remoteip=<brief subnet>", "PS> Set-NetFirewallProfile -All -DefaultInboundAction Block -NotifyOnListen True -LogBlocked True"], "why": "A rule that admits the whole internet to 4444/tcp undoes the firewall; an outbound block on Defender or Windows Update stops protection quietly. Scope required ports to the brief's subnet.", "area": "config", "note": "ActiveStore lists the rules in force, Group Policy rules included. -Name gives a new rule a stable handle for Remove-NetFirewallRule -Name later."}, {"id": "I-13", "title": "Group Policy: where server settings really come from", "cmds": ["GUI: gpmc.msc (Group Policy Management) on a DC; gpedit.msc on a member server", "PS> Get-GPO -All | Select-Object DisplayName,GpoStatus,ModificationTime", "PS> Get-GPOReport -All -ReportType Html -Path C:\\Temp\\gpo.html", "CMD> reg query HKLM\\SOFTWARE\\Policies /s", "CMD> gpupdate /force", "CMD> gpresult /r /scope computer", "CMD> w32tm /query /status   (Source and Last Successful Sync Time: Kerberos refuses clocks more than 5 minutes apart)"], "why": "Domain GPOs override local clicks; password and lockout live in Default Domain Policy. Planted GPOs disabling Defender or the firewall re-apply about every 90 minutes on members, 5 on DCs.", "note": "Flag odd or recently changed GPOs in gpo.html. reg query HKLM\\SOFTWARE\\Policies /s lists machine policies; absent means Not Configured. DisableAntiSpyware 1 under Windows Defender is \"Turn off Microsoft Defender Antivirus.\"", "task": "apply group policy now", "t": "gpupdate /force", "area": "config"}, {"id": "I-14", "title": "Event Viewer for investigations", "cmds": ["GUI: eventvwr.msc, Windows Logs, Security (and System for event 7045)", "PS> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4728,4732,4756} | Format-List TimeCreated,Message", "  4720 user created, 4726 deleted, 4728 added to global group, 4732 local group, 4756 universal group, 4740 lockout", "  4624 logon OK, 4625 failed, 4672 admin logon, 4768 Kerberos TGT, 4769 service ticket, 4771 pre-auth failed, 1102 log cleared", "  Logon type 9 (NewCredentials) in event 4624 comes from runas /netonly /user:<domain>\\<user> <program>: borrowed credentials used for network access only", "PS> Get-WinEvent -FilterHashtable @{LogName='System'; Id=7045} | Format-List TimeCreated,Message", "  7045 new service installed: a System log event, so it takes its own filter; 4697 is its Security-log twin and names the installer once A-08 turns it on"], "why": "Who was added to Domain Admins and when is a question these IDs answer in one filter.", "area": "inv"}, {"id": "I-15", "title": "IIS and FTP hardening when the brief requires them", "cmds": ["PS> Get-Website | Select-Object Name,State,PhysicalPath", "PS> Get-WebBinding", "GUI: inetmgr (IIS Manager), site, Authentication: Anonymous Authentication Disabled unless the brief says the site is public", "PS> Import-Module WebAdministration; Set-WebConfigurationProperty -Filter /system.webServer/directoryBrowse -Name enabled -Value $false -PSPath 'IIS:\\Sites\\Default Web Site'", "PS> Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Filter 'system.webServer/httpLogging' -Name dontLog", "PS> Get-WebConfigurationProperty -PSPath 'MACHINE/WEBROOT/APPHOST' -Location 'Default Web Site' -Filter 'system.webServer/security/access' -Name sslFlags", "GUI: IIS Manager, FTP site, FTP Authentication: Anonymous Disabled; FTP SSL Settings: Require SSL connections", "GUI: IIS Manager, server node, Request Filtering, File Name Extensions: deny .exe and .ps1 (blocks web requests for them); FTP Request Filtering, File Name Extensions: deny .exe and .ps1 (blocks uploading and downloading them)"], "why": "A required web or FTP server stays running. Make it safe: directory listing off, anonymous FTP off, TLS on, and the upload folder free of executables.", "note": "Require SSL (sslFlags Ssl) needs an https binding with a certificate first; it takes an http-only site offline. Check the physical path for planted .aspx webshells (B-12 file search).", "also": "dontLog False means IIS writes request logs, the evidence for webshell and password-guessing questions. Logging runs through W3SVC and the W3C Logging Service (w3logsvc); leave both at their defaults.", "area": "config"}, {"id": "I-16", "title": "DNS and DHCP hygiene when the server runs them", "cmds": ["PS> Get-DnsServerZone | Select-Object ZoneName,ZoneType,DynamicUpdate,SecureSecondaries", "PS> Get-DnsServerResourceRecord -ZoneName corp.local   (look for A and CNAME records missing from the brief)", "CMD> nslookup -type=mx corp.local", "PS> Set-DnsServerPrimaryZone -Name corp.local -DynamicUpdate Secure -SecureSecondaries NoTransfer", "PS> Get-DhcpServerInDC", "PS> Get-DhcpServerv4Scope | Select-Object ScopeId,Name,State"], "why": "Open zone transfers hand an attacker the whole network map; insecure dynamic updates let anyone overwrite records. DHCP servers not authorized in AD are rogue.", "task": "list DNS zones with their transfer and update settings", "t": "Get-DnsServerZone", "ta": ["get-dnsserverzone | select zonename,zonetype,dynamicupdate,securesecondaries"], "area": "config"}, {"id": "I-17", "title": "WinRM: encrypted, with Basic off", "cmds": ["CMD> winrm get winrm/config/service", "CMD> winrm get winrm/config/client", "PS> $wr='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WinRM\\Service'; if (-not (Test-Path $wr)) { New-Item -Path $wr -Force | Out-Null }", "PS> Set-ItemProperty -Path $wr -Name AllowBasic -Value 0 -Type DWord; Set-ItemProperty -Path $wr -Name AllowUnencryptedTraffic -Value 0 -Type DWord; Set-ItemProperty -Path $wr -Name DisableRunAs -Value 1 -Type DWord", "PS> $wc='HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WinRM\\Client'; if (-not (Test-Path $wc)) { New-Item -Path $wc -Force | Out-Null }", "PS> Set-ItemProperty -Path $wc -Name AllowBasic -Value 0 -Type DWord; Set-ItemProperty -Path $wc -Name AllowUnencryptedTraffic -Value 0 -Type DWord; Set-ItemProperty -Path $wc -Name AllowDigest -Value 0 -Type DWord", "GUI: gpedit.msc (or gpmc.msc), Computer Configuration, Administrative Templates, Windows Components, Windows Remote Management (WinRM), WinRM Service and WinRM Client", "CMD> gpupdate /force"], "why": "WinRM (5985, 5986) carries remote PowerShell and Server Manager. Basic sends reversible passwords; unencrypted traffic exposes every command. Kerberos and default encryption stay; DisableRunAs keeps plug-ins from storing RunAs passwords.", "note": "Flag AllowUnencrypted = true in winrm get winrm/config; with WinRM stopped, read the registry. Client policy \"Disallow Digest authentication\" writes AllowDigest 0. Remote management in the brief keeps WinRM running.", "task": "show the WinRM service configuration", "t": "winrm get winrm/config/service", "area": "config"}, {"id": "I-18", "title": "Apache on Windows when the brief requires it", "cmds": ["PS> Get-CimInstance Win32_Service -Filter \"Name LIKE 'Apache%'\" | Select-Object Name,State,StartName,PathName", "GUI: notepad C:\\Apache24\\conf\\httpd.conf (save a copy first), then set these lines", "  ServerTokens Prod", "  ServerSignature Off", "  TraceEnable Off", "  Options FollowSymLinks   (Indexes removed, in each <Directory> block)", "CMD> C:\\Apache24\\bin\\httpd.exe -t", "PS> Restart-Service -Name Apache2.4", "CMD> curl.exe -sI http://localhost/", "CMD> curl.exe -s -o NUL -w \"%{http_code}\" -X TRACE http://localhost/"], "why": "ServerTokens Prod hides Apache's version in headers; ServerSignature Off, on error pages. TraceEnable Off refuses TRACE; removing Indexes ends directory listings. curl shows Server: Apache alone and 405 for TRACE.", "note": "Restart only after httpd.exe -t prints Syntax OK; typos stop the site. Restart-Service needs the name the first command shows (installer default: Apache2.4). Linux pages harden the same directives (I-12).", "also": "ServerSignature Off is the default; find On or EMail lines in httpd.conf or a virtual host. If the brief omits Apache, stop it and run C:\\Apache24\\bin\\httpd.exe -k uninstall -n \"Apache2.4\".", "task": "test the Apache configuration before a restart (cmd)", "t": "C:\\Apache24\\bin\\httpd.exe -t", "ta": ["httpd.exe -t", "httpd -t"], "area": "config"}, {"id": "I-19", "title": "Network checks: address, route, neighbors, names, path, and port", "cmds": ["CMD> ipconfig /all", "CMD> route print -4", "CMD> ping <gateway>", "CMD> arp -a", "CMD> nslookup <name>", "PS> Resolve-DnsName <name>", "CMD> ipconfig /displaydns", "CMD> ipconfig /flushdns", "CMD> tracert -d <address>", "PS> Test-NetConnection <host> -Port 445   (a file server answers on 445)"], "why": "Prove the network path before you blame a setting you just hardened: address, gateway, neighbors, names, path, then the port itself.", "note": "A silent ping proves little: Windows Firewall blocks inbound echo requests unless a rule allows them. Test-NetConnection shows TcpTestSucceeded True once the TCP handshake to that port completes.", "also": "In arp -a, two addresses sharing one physical address, the gateway among them, can point to ARP spoofing. Servers usually keep static addresses: compare ipconfig /all with the brief.", "task": "show the full address, gateway, and DNS configuration (cmd)", "t": "ipconfig /all", "area": "config"}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. Security baselines, credential-theft hardening, Active Directory attack surface (roastable and stale accounts), persistence hunting, SMB and LDAP signing, and version notes. Learn it first: Defense Ladder se7, \"Windows: credentials and the domain attack surface.\"", "items": [{"id": "A-01", "title": "Security policy as a file: secedit", "cmds": ["CMD> secedit /export /cfg C:\\Temp\\secpol.cfg", "  [System Access] MinimumPasswordAge = 1, MaximumPasswordAge = 60, MinimumPasswordLength = 12, PasswordComplexity = 1, PasswordHistorySize = 24, LockoutBadCount = 5, ResetLockoutCount = 30, LockoutDuration = 30, AllowAdministratorLockout = 1, ClearTextPassword = 0, EnableGuestAccount = 0", "CMD> secedit /configure /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg /areas SECURITYPOLICY", "CMD> secedit /analyze /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg"], "why": "One file, every account policy, repeatable and auditable, and the only command-line path to complexity and reversible encryption.", "note": "On a DC, domain policy wins (B-06). Before /configure, keep only [Unicode], [Version], and [System Access], so audit and registry settings stay. Typos fail silently: verify with net accounts.", "task": "export the local security policy to C:\\Temp\\secpol.cfg", "t": "secedit /export /cfg C:\\Temp\\secpol.cfg", "area": "config"}, {"id": "A-02", "title": "LSA and anonymous-access registry hardening", "cmds": ["PS> $lsa='HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa'", "PS> Set-ItemProperty -Path $lsa -Name LimitBlankPasswordUse -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymous -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymousSAM -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name NoLMHash -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name LmCompatibilityLevel -Value 5 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name EveryoneIncludesAnonymous -Value 0 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name ForceGuest -Value 0 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictRemoteSAM -Value 'O:BAG:BAD:(A;;RC;;;BA)' -Type String   (member server)", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0' -Name allownullsessionfallback -Value 0 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0' -Name NTLMMinClientSec -Value 537395200 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\MSV1_0' -Name NTLMMinServerSec -Value 537395200 -Type DWord", "PS> Get-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue", "PS> Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name LocalAccountTokenFilterPolicy"], "why": "RestrictAnonymous stops null-session enumeration; NoLMHash stops storing LM hashes, which crack in seconds; LmCompatibilityLevel 5 refuses NTLMv1 (Windows 11 24H2 and Windows Server 2025 remove it; check the level on older releases and mixed domains). ForceGuest 0 (Classic) keeps local users signing in over the network as themselves; RestrictRemoteSAM limits remote SAM queries to Administrators. NULL session fallback 0 and NTLM minimum session security 537395200 (NTLMv2 session security plus 128-bit encryption) close the last NTLM downgrades. LocalAccountTokenFilterPolicy 1 hands every local administrator a full token over C$ and ADMIN$ from the network, the pass-the-hash road: remove it so remote local admins stay filtered.", "note": "This is the registry form of the Watchman Security Options. A missing LocalAccountTokenFilterPolicy is the good result. MSV1_0 and the System key exist on every install, so Set-ItemProperty writes into them directly. On a domain controller, leave RestrictRemoteSAM undefined unless the brief asks for it: users and admin tools read Active Directory through remote SAM calls.", "area": "config"}, {"id": "A-03", "title": "Credential-theft hardening: LLMNR, NetBIOS, WDigest", "cmds": ["PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient')) { New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Force | Out-Null }", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Name EnableMulticast -Value 0 -Type DWord", "PS> Get-CimInstance Win32_NetworkAdapterConfiguration -Filter \"IPEnabled=TRUE\" | Invoke-CimMethod -MethodName SetTcpipNetbios -Arguments @{TcpipNetbiosOptions=2}", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\WDigest' -Name UseLogonCredential -Value 0 -Type DWord"], "why": "LLMNR and NBT-NS are what Responder poisons to collect NTLMv2 hashes for cracking or relay. WDigest set to 1 keeps plaintext passwords in LSASS memory for mimikatz.", "area": "config", "note": "The Test-Path guard creates the key only when it is missing, so DNS client policies already in it stay (A-04 explains why)."}, {"id": "A-04", "title": "AutoRun and AutoPlay off everywhere", "cmds": ["PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer')) { New-Item -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Force | Out-Null }", "CMD> reg export HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer C:\\Backup\\explorer-policies.reg   (back up the key before you change it)", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoDriveTypeAutoRun -Value 255 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoAutorun -Value 1 -Type DWord", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Explorer /v NoAutoplayfornonVolume /t REG_DWORD /d 1 /f", "CMD> reg delete HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer /v NoDriveTypeAutoRun /f   (rollback, only when the brief needs AutoPlay back: reg import C:\\Backup\\explorer-policies.reg restores the saved values; reg delete removes one the backup lacked)"], "why": "USB-drop attacks. Conficker-era, still a CIS and STIG requirement. NoAutoplayfornonVolume covers phones and cameras, which the drive-type value leaves out.", "area": "malware", "note": "This Explorer key already holds other policies, and New-Item -Force on an existing key deletes every value in it. The Test-Path guard and reg add both keep them."}, {"id": "A-05", "title": "User Rights Assignment", "cmds": ["GUI: secpol.msc, Local Policies, User Rights Assignment", "  Access this computer from the network = Administrators, Authenticated Users (remove Everyone and Guest)", "  Deny log on through Remote Desktop Services = Guest", "  Deny access to this computer from the network = Guest", "  Debug programs = empty, or Administrators only", "  Act as part of the operating system = empty", "  Back up files and directories, Restore files and directories, Take ownership of files or other objects = Administrators", "  Manage auditing and security log = Administrators", "  Change the system time = Administrators, LOCAL SERVICE", "  Allow log on locally = Administrators on a member server, plus Users when the brief names people who sign in at this console", "CMD> secedit /export /cfg C:\\Windows\\Temp\\ura.inf /areas USER_RIGHTS", "PS> Select-String -Path C:\\Windows\\Temp\\ura.inf -Pattern 'SeDebugPrivilege|SeTcbPrivilege|SeNetworkLogonRight|SeBackupPrivilege|SeSecurityPrivilege'", "CMD> whoami /priv"], "why": "Rights bypass ACLs: Debug programs dumps LSASS passwords; Back up files reads the SAM hive. Restore and Take ownership rewrite any file; Manage auditing clears the Security log (event 1102).", "note": "Export lists SIDs: *S-1-5-32-544 Administrators, *S-1-5-32-545 Users, *S-1-5-11 Authenticated Users; unknown SIDs are deleted or planted accounts. Remove extra user and group accounts; LOCAL SERVICE, NETWORK SERVICE, and SERVICE stay.", "also": "Set a right by applying SeDebugPrivilege = *S-1-5-32-544 (empty clears it) under [Privilege Rights] as in A-01 with /areas USER_RIGHTS. Changes apply at next sign-in and log 4704 and 4705.", "task": "show the privileges of the current user", "t": "whoami /priv", "area": "access"}, {"id": "A-06", "title": "Deep persistence and backdoor hunt", "cmds": ["PS> Get-CimInstance Win32_Process | Select-Object Name,ProcessId,ParentProcessId,CommandLine | Sort-Object Name", "CMD> quser   (who is signed in now, at the console or over Remote Desktop: capture it before you change anything)", "CMD> wevtutil epl Security E:\\case\\<host>-Sec.evtx   (export the logs before you change anything; repeat for System)", "PS> Get-ChildItem C:\\ -Recurse -Include nc.exe,ncat.exe,netcat*,mimikatz*,psexec*,*.ps1,*.vbs -ErrorAction SilentlyContinue | Select-Object FullName,LastWriteTime", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventFilter", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventConsumer", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __FilterToConsumerBinding", "PS> $PROFILE | Select-Object *; Get-Content $PROFILE.AllUsersAllHosts -ErrorAction SilentlyContinue", "PS> Get-ChildItem -Path C:\\Users,C:\\ProgramData,C:\\Windows\\Temp -Recurse -Force -File -Include *.exe,*.dll,*.scr -ErrorAction SilentlyContinue | Where-Object FullName -notmatch '^C:\\\\Users\\\\(All Users|Default User)\\\\' | Get-AuthenticodeSignature | Where-Object Status -ne 'Valid' | Select-Object Path,Status", "PS> Get-ChildItem 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\TaskCache\\Tree' -Recurse | Where-Object { -not $_.GetValue('SD') -and $_.GetValue('Id') } | Select-Object Name", "CMD> wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true", "CMD> autorunsc.exe -accepteula -a * -c -nobanner   (Sysinternals, public)", "CMD> sigcheck -accepteula -u -e -s C:\\Users\\Public   (Sysinternals: the unsigned executable images under a folder; -s recurse, add -h for hashes)", "CMD> streams -accepteula -s C:\\Users\\Public   (Sysinternals: the alternate data streams a download or a hidden payload leaves; -d deletes them)"], "why": "WMI event subscriptions and PowerShell profiles are the persistence spots checklists miss; Autoruns shows every auto-start location at once. A task with SD deleted runs hidden from Get-ScheduledTask and schtasks.", "note": "A renamed tool keeps its missing or broken signature. Unsigned progra
