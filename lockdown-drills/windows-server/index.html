ms in Users, ProgramData, or Temp are leads; legitimate tools ship unsigned too, so check the brief and the publisher.", "also": "Get Sysinternals from learn.microsoft.com/sysinternals only, and only where policy allows third-party tools. The wevtutil line turns on Task Scheduler history, which starts off.", "area": "malware"}, {"id": "A-07", "title": "NTFS permissions", "cmds": ["CMD> icacls \"C:\\CompanyData\" /save C:\\Windows\\Temp\\acl.txt /t /c", "CMD> icacls \"C:\\CompanyData\"", "CMD> icacls \"C:\\CompanyData\" /inheritance:r /grant:r \"Administrators:(OI)(CI)F\" \"Users:(OI)(CI)RX\" /t", "CMD> icacls \"C:\\CompanyData\" /remove:g Everyone /t", "PS> Get-Acl \"C:\\CompanyData\" | Format-List", "CMD> accesschk -accepteula -uwcqv \"Authenticated Users\" *   (Sysinternals: the services a standard account can reconfigure, which is a path to SYSTEM)", "CMD> accesschk -accepteula -s -w Users \"C:\\Program Files\"   (Sysinternals: the files and folders a standard account can write)"], "why": "Everyone with Full control on shares or Program Files lets anyone swap a binary a service runs as SYSTEM. (OI) object inherit, (CI) container inherit, /t recurse, /inheritance:r stop inheriting.", "note": "Save ACLs first: icacls C:\\ /restore C:\\Windows\\Temp\\acl.txt puts them back (restore runs from the parent folder). SIDs work in any display language: /remove:g *S-1-1-0 for Everyone, *S-1-5-11 for Authenticated Users.", "also": "A folder made at the root of C: inherits Authenticated Users Modify, so read it before you trust it.", "task": "show the ACL of C:\\CompanyData (cmd)", "t": "icacls C:\\CompanyData", "ta": ["icacls \"c:\\companydata\"", "get-acl c:\\companydata"], "area": "access"}, {"id": "A-08", "title": "Fine-grained auditing and PowerShell logging", "cmds": ["CMD> auditpol /set /subcategory:\"Credential Validation\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Logon\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Account Lockout\" /failure:enable", "CMD> auditpol /set /subcategory:\"User Account Management\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Security Group Management\" /success:enable", "CMD> auditpol /set /subcategory:\"Process Creation\" /success:enable", "CMD> reg add \"HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System\\Audit\" /v ProcessCreationIncludeCmdLine_Enabled /t REG_DWORD /d 1 /f", "CMD> auditpol /set /subcategory:\"Security System Extension\" /success:enable", "CMD> auditpol /set /subcategory:\"Audit Policy Change\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Filtering Platform Connection\" /success:disable /failure:disable", "CMD> reg add HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa /v SCENoApplyLegacyAuditPolicy /t REG_DWORD /d 1 /f", "PS> if (-not (Test-Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging')) { New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Force | Out-Null }", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Name EnableScriptBlockLogging -Value 1 -Type DWord", "PS> Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-PowerShell/Operational'; Id=4104} -MaxEvents 3 | Format-List TimeCreated,Message", "PS> Get-ExecutionPolicy -List   (a MachinePolicy or UserPolicy value comes from Group Policy and wins over the scopes below it)", "PS> Set-ExecutionPolicy -Scope CurrentUser RemoteSigned   (only when you must run your own script and -List shows a stricter policy: Windows Server already starts at RemoteSigned, which lets local scripts run while downloaded ones need a trusted signature)", "CMD> auditpol /get /category:*"], "why": "Subcategory settings take precedence over the nine legacy categories once Audit: Force audit policy subcategory settings is Enabled (SCENoApplyLegacyAuditPolicy 1). Credential Validation writes 4776 for every local-account password check, so a guessing run shows beside 4625. The command-line value fills the Process Command Line field of every 4688. Security System Extension writes 4697, which names who installed a service. Script Block Logging (event 4104) records what every PowerShell script actually did, including the attacker's.", "area": "audit", "note": "Run it after I-01: a category-wide command rewrites every subcategory in its category. Account Lockout has Failure events only (the lockout itself, 4740, comes from User Account Management), and Security Group Management has Success events only. Filtering Platform Connection floods the log after a category-wide run; turn it back on when the brief asks for connection auditing. auditpol names drop the Audit prefix that secpol shows, and each subcategory also takes a GUID that works in any display language, such as {0CCE923F-69AE-11D9-BED3-505054503030} for Credential Validation. On a domain, a GPO that defines advanced auditing re-applies its list at each refresh, so set the values there. PowerShell 7 reads its own key, HKLM:\\SOFTWARE\\Policies\\Microsoft\\PowerShellCore\\ScriptBlockLogging, and logs to PowerShellCore/Operational.", "also": "Execution policy is a safety setting rather than a security boundary: anyone can bypass it, so script block logging (4104) is what records the script that ran."}, {"id": "A-09", "title": "Defender beyond on: exclusions, PUA, cloud, ASR", "cmds": ["PS> Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension", "PS> Remove-MpPreference -ExclusionPath \"C:\\evil\"", "CMD> reg query \"HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Exclusions\" /s", "PS> Get-MpPreference | Select-Object ThreatIDDefaultAction_Ids,ThreatIDDefaultAction_Actions", "PS> Remove-MpPreference -ThreatIDDefaultAction_Ids <id>", "PS> Set-MpPreference -PUAProtection Enabled -MAPSReporting Advanced -SubmitSamplesConsent SendAllSamples", "PS> Add-MpPreference -AttackSurfaceReductionRules_Ids 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2 -AttackSurfaceReductionRules_Actions Enabled", "PS> Get-MpThreatDetection | Select-Object DomainUser,ProcessName,InitialDetectionTime"], "why": "Attackers exclude their folder instead of disabling Defender, or set ThreatIDDefaultAction 6 (Allow) so one threat runs; Get-MpPreference shows both. PUA protection catches junkware; the LSASS rule blocks mimikatz-style dumping.", "task": "list Defender exclusions", "t": "Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension", "ta": ["get-mppreference | select exclusionpath,exclusionprocess,exclusionextension", "get-mppreference"], "area": "malware", "note": "An exclusion set by policy returns after Remove-MpPreference: set the policy to Not Configured in gpedit.msc (or delete the value under the policy key) first, then remove the local one."}, {"id": "A-10", "title": "Active Directory attack surface: roastable and stale accounts", "cmds": ["PS> Search-ADAccount -PasswordNeverExpires | Select-Object Name", "PS> Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00 | Select-Object Name,LastLogonDate", "PS> Get-ADUser -Filter {PasswordNotRequired -eq $true} | Select-Object Name", "PS> Get-ADUser -Filter {DoesNotRequirePreAuth -eq $true} | Select-Object Name", "PS> Set-ADAccountControl -Identity alice -DoesNotRequirePreAuth $false -PasswordNotRequired $false", "PS> Get-ADUser -Filter {ServicePrincipalName -like \"*\"} -Properties ServicePrincipalName | Select-Object Name,ServicePrincipalName", "CMD> klist   (each cached ticket's KerbTicket Encryption Type: AES-256 is the goal, RSADSI RC4-HMAC(NT) the finding)", "PS> Get-ADUser -Filter {AdminCount -eq 1} | Select-Object Name", "PS> Get-ADUser -Filter {TrustedForDelegation -eq $true} | Select-Object Name", "PS> Get-ADComputer -Filter {TrustedForDelegation -eq $true} | Select-Object Name   (computers with unconstrained delegation: the domain controllers belong here, any other is a finding)"], "why": "Disabled Kerberos pre-auth invites AS-REP roasting, a user-account SPN invites Kerberoasting, and stale admins or never-expiring passwords hold quiet persistence. One cmdlet finds each flag; one fixes it.", "note": "SPNs belong on long-password service accounts or group managed service accounts. A new password breaks the service until entered in services.msc, Log On tab (SQL Server Configuration Manager for SQL).", "task": "find domain accounts that do not require Kerberos pre-authentication", "t": "Get-ADUser -Filter {DoesNotRequirePreAuth -eq $true}", "ta": ["get-aduser -filter {doesnotrequirepreauth -eq $true} | select name"], "area": "acct"}, {"id": "A-11", "title": "SMB and LDAP signing", "cmds": ["PS> Get-SmbServerConfiguration | Select-Object RequireSecuritySignature; Get-SmbClientConfiguration | Select-Object RequireSecuritySignature", "PS> Get-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\NTDS\\Parameters' | Select-Object LDAPServerIntegrity,LdapEnforceChannelBinding", "PS> Set-SmbServerConfiguration -RequireSecuritySignature $true -EncryptData $true -Force", "PS> Set-SmbClientConfiguration -RequireSecuritySignature $true -Force", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\NTDS\\Parameters' -Name LDAPServerIntegrity -Value 2 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Services\\NTDS\\Parameters' -Name LdapEnforceChannelBinding -Value 2 -Type DWord"], "why": "Required SMB signing stops NTLM relay to the file server. Required LDAP signing and channel binding stop relay to the domain controller, where one weak host becomes domain admin.", "area": "config", "note": "Defaults differ by release and domain build (see Version notes), so verify each value. Before requiring LDAP signing or channel binding on a DC, confirm every client supports it."}, {"id": "A-12", "title": "Verify, document, re-check", "cmds": ["CMD> gpresult /r", "CMD> net accounts", "PS> Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusSignatureLastUpdated", "PS> Get-NetFirewallProfile | Select-Object Name,Enabled", "PS> Get-LocalGroupMember Administrators", "CMD> netstat -abno"], "why": "A change log of what, when, and why lets you reverse a breaking change in thirty seconds instead of thirty minutes. Real incident response runs on the same record.", "task": "show the applied group policy for this computer and user", "t": "gpresult /r"}, {"id": "A-13", "title": "Version notes: Windows Server 2025", "cmds": ["GUI: Win+R, winver: edition, version (24H2), and OS build", "  This page targets Windows Server 2025 (Windows 11 shell: Settings, Windows Update). Several defaults changed: read the current value instead of assuming.", "  SMB: 2025 requires signing on all outbound SMB connections; domain controllers require it inbound as before", "  LDAP: new 2025 Active Directory deployments require LDAP signing by default; an upgraded domain may not, so read LDAPServerIntegrity (A-11)", "  OpenSSH Server is installed by default; Server Manager, Local Server, Remote SSH Access turns sshd on or off. Unless the brief requires SSH, keep sshd stopped and Disabled", "  Delegated managed service accounts (dMSA) are new: they migrate a legacy service account (A-10) to managed, randomized keys", "  Removed: Windows PowerShell 2.0, NTLMv1, WordPad, SMTP Server, IIS 6 Management Console; WMIC is an optional feature on demand (use Get-CimInstance)"], "why": "Every other item holds across releases; release changes live here. Check this list before you flag a default as a finding or count a changed default as a fix."}, {"id": "A-14", "title": "Windows Installer: AlwaysInstallElevated off", "cmds": ["CMD> reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer", "CMD> reg query HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated /t REG_DWORD /d 0 /f", "CMD> reg add HKCU\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v AlwaysInstallElevated /t REG_DWORD /d 0 /f", "CMD> reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer /v EnableUserControl /t REG_DWORD /d 0 /f", "GUI: gpedit.msc, Computer Configuration and User Configuration, Administrative Templates, Windows Components, Windows Installer: Always install with elevated privileges = Disabled"], "why": "AlwaysInstallElevated at 1 in both HKLM and HKCU runs any user's .msi as SYSTEM: a one-step privilege escalation Microsoft strongly discourages. EnableUserControl 0 keeps install options with administrators.", "note": "HKCU covers only the signed-in user. Check each profile the brief keeps: sign in as that user, or read HKEY_USERS\\<SID>\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer; reg add creates missing keys and keeps existing values.", "task": "show the Windows Installer machine policy values (cmd)", "t": "reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Installer", "area": "access"}, {"id": "A-15", "title": "Encryption, boot integrity, and recovery: BitLocker, TPM, Secure Boot, and an image backup", "cmds": ["GUI: msinfo32, System Summary: BIOS Mode UEFI and Secure Boot State On; tpm.msc: Specification Version 2.0", "PS> Confirm-SecureBootUEFI", "PS> Get-Tpm", "PS> Install-WindowsFeature BitLocker -IncludeAllSubFeature -IncludeManagementTools   (then restart)", "PS> Get-BitLockerVolume", "CMD> manage-bde -status", "PS> Resume-BitLocker -MountPoint C:   (turns suspended protection back on)", "PS> Add-BitLockerKeyProtector -MountPoint C: -RecoveryPasswordProtector   (before you encrypt: the 48-digit recovery password)", "PS> Enable-BitLocker -MountPoint C: -TpmProtector   (then encrypt a FullyDecrypted drive)", "PS> Backup-BitLockerKeyProtector -MountPoint C: -KeyProtectorId <id>   (domain-joined: copies the recovery password to Active Directory)", "PS> Install-WindowsFeature Windows-Server-Backup", "CMD> wbadmin start backup -backupTarget:E: -include:C: -allCritical -quiet"], "why": "A stolen disk reads in full on another computer unless BitLocker encrypts it, and a TPM with Secure Boot keeps the unlock tied to an untampered boot.", "note": "Save the recovery password away from the machine before you encrypt. Suspend-BitLocker pauses protection for firmware updates; Resume-BitLocker turns it back on.", "also": "Windows Server adds BitLocker and Windows Server Backup as features: install each first, and restart after BitLocker. wbadmin backs up C: and everything a bare-metal restore needs to drive E:.", "task": "show BitLocker status for every volume", "t": "Get-BitLockerVolume", "ta": ["manage-bde -status"], "area": "data"}]}], "spot": [{"lvl": 0, "ask": "Output of net accounts. Brief: minimum length 12, maximum age 60, history 24, lockout after 5. Tap the line that is the finding.", "lines": ["Minimum password length:                 12", "Maximum password age (days):             60", "Lockout threshold:                       Never", "Length of password history maintained:   24"], "finding": 2, "why": "Lockout threshold Never means unlimited password guesses. Set it to 5 with net accounts /lockoutthreshold:5."}, {"lvl": 0, "ask": "Get-NetFirewallProfile output. Tap the finding.", "lines": ["Domain    True", "Private   True", "Public    False", "DefaultInboundAction  Block"], "finding": 2, "why": "The Public profile is off. A common misconfiguration leaves exactly one profile disabled."}, {"lvl": 1, "ask": "netstat -abno output. Tap the finding.", "lines": ["TCP    0.0.0.0:135    LISTENING   [svchost.exe]", "TCP    0.0.0.0:445    LISTENING   System", "TCP    0.0.0.0:4444   LISTENING   [nc.exe]", "TCP    127.0.0.1:5040 LISTENING   [svchost.exe]"], "finding": 2, "why": "A netcat listener on 4444 is a backdoor. Find its PID, its path, and whatever task or Run key starts it."}, {"lvl": 2, "ask": "Get-MpPreference output. Tap the finding.", "lines": ["PUAProtection          : 1", "ExclusionPath          : {C:\\ ust stay reachable, and Get-WebBinding shows only an http binding on port 80.", "action": "Set Require SSL (sslFlags Ssl) on the site now.", "answer": "breaks", "why": "With only an http binding, Require SSL refuses every request and the site goes offline. Add an https binding with a certificate first, then require SSL."}, {"lvl": 2, "brief": "The FTP site must let anonymous visitors download files; icacls on the FTP root shows Everyone:(OI)(CI)(M).", "action": "Save the ACL with icacls /save, then replace Everyone Modify with Everyone read and execute on the FTP root.", "answer": "fix", "why": "Anonymous downloads need read and execute only; Modify lets any visitor upload or replace files. The saved ACL makes the change reversible."}, {"lvl": 1, "brief": "Staff map shares on this file server, and the brief requires the firewall on every profile. A staff PC's ping to the server times out while its mapped drive works.", "action": "Turn off Windows Firewall on this server so ping answers.", "answer": "breaks", "why": "The brief requires the firewall, and a silent ping proves little: Windows Firewall blocks inbound echo requests unless a rule allows them. Test-NetConnection <server> -Port 445 from the PC tests the share itself."}, {"lvl": 2, "brief": "The brief requires BitLocker on this server's C: drive. Get-BitLockerVolume shows C: FullyDecrypted with an empty KeyProtector list.", "action": "Run Add-BitLockerKeyProtector -MountPoint C: -RecoveryPasswordProtector, save the recovery password off the server, then run Enable-BitLocker -MountPoint C: -TpmProtector.", "answer": "fix", "why": "That is the safe order: the recovery password exists, and sits away from the server, before encryption starts, so a TPM change after a firmware update still leaves a way back in."}], "imposter": [{"title": "Who is the imposter? Server FS-01", "brief": ["Authorized administrators: dsmith, alice", "Authorized users: jlee, mpatel, rkim", "This server runs the file share and DNS"], "outp     +legendHtml()+termBlock(it.cmds,true)
    +(it.gui?'<p class="run-in"><b>In the GUI.</b> '+esc(it.gui)+'</p>':'')

    +'<div class="explain"><div><b>Explain it in one sentence, no jargon.</b> If you can say why, you own it.</div><textarea data-explain="'+esc(it.id)+'" placeholder="Example: this stops someone from guessing passwords all day">'+esc(S.explain[it.id]||'')+'</textarea><label><input type="checkbox" data-learn="'+esc(it.id)+'" '+(S.learned[it.id]?'checked':'')+'> I can explain this</label></div>'
    +'<div class="nav"><button class="btn" data-step="-1" '+(idx===0?'disabled':'')+'>Previous</button><button class="btn" data-step="1" '+(idx===L.items.length-1?'disabled':'')+'>Next</button></div></div>';
  return '<p class="lead">'+dlLinks(esc(L.blurb))+'</p><div class="learn">'+list+detail+'</div>';

/* drill */
let Q=null;
function makeQuiz(li){
  const L=APP.levels[li];const rank=it=>due(it)?0:days(it).length?2:1;
  const items=shuffle(L.items.slice()).sort((a,b)=>rank(a)-rank(b));
  const pool=allItems.filter(o=>o.li<=li);const qs=[];
  const distract=(it,fn,n)=>{const own=fn(it);const seen=new Set([own]);return shuffle(pool.filter(o=>o.id!==it.id&&!(it.ex||[]).includes(o.id)&&!(o.ex||[]).includes(it.id))).filter(o=>{const v=fn(o);if(!v||seen.has(v))return false;seen.add(v);return true;}).slice(0,n).map(o=>({t:fn(o),ok:false,src:o.id}));};
  const cmdOf=it=>stripped(firstCmd(it));
  items.slice(0,4).forEach(it=>{const c=cmdOf(it);const opts=shuffle([{t:c,ok:true,src:it.id},...distract(it,cmdOf,3)]);qs.push({type:'which',item:it,prompt:'Which command does this?  '+it.title,opts,cmd:true});});
  items.slice(4,6).forEach(it=>{const opts=shuffle([{t:it.title,ok:true,src:it.id},...distract(it,o=>o.title,3)]);qs.push({type:'what',item:it,prompt:'What does this command do?',block:[firstCmd(it)],opts});});
  const typed=items.filter(i=>i.t).slice(0,2);typed.forEach(it=>qs.push({type:'type',item:it,prompt:'Type the command: '+(it.task||it.title)}));
  const sp=shuffle((APP.spot||[]).filter(s=>(s.lvl==null?0:s.lvl)<=li));if(sp.length)qs.push(Object.assign({type:'spot'},sp[0]));
  const jd=shuffle((APP.judge||[]).filter(s=>(s.lvl==null?0:s.lvl)<=li));jd.slice(0,2).forEach(j=>qs.push(Object.assign({type:'judge'},j)));
  return {li,qs:shuffle(qs).slice(0,10),i:0,correct:0,done:false,fb:null,res:[]};
}
function renderDrill(){
  const L=APP.levels[S.level];
  if(!Q||Q.li!==S.level||Q.finished){const b=badge(S.level);return '<div class="q"><h2>'+esc(L.name)+' drill</h2><p class="lead">Ten questions pulled from this level: pick the command, read a command, type one from memory, spot the finding in real output, and call fix or break. 80% earns the '+esc(L.name)+' badge once you have learned '+Math.ceil(L.items.length*.8)+' of '+L.items.length+' items.</p><p>Best so far: <b class="mono">'+(b.best||0)+'%</b>'+(b.earned?' <span class="chip">badge earned '+L.badge+'</span>':'')+'</p><button class="btn primary" data-act="startq">Start the drill</button></div>';}
  const q=Q.qs[Q.i];let body='';
  if(q.type==='which'||q.type==='what'){body=(q.block?termBlock(q.block,false):'')+'<div class="opts">'+q.opts.map((o,i)=>'<button data-opt="'+i+'" class="'+(q.cmd?'cmd ':'')+(Q.fb?(o.ok?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+esc(o.t)+'</button>').join('')+'</div>';}
  else if(q.type==='type'){body='<input class="typein" data-type="1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type it here" '+(Q.fb?'disabled value="'+esc(Q.fb.given)+'"':'')+'>'+(Q.fb?'':'<div class="nav"><button class="btn primary" data-act="check">Check</button><button class="btn" data-act="skip">Show me</button></div>');}
  else if(q.type==='spot'){body='<p>'+esc(q.ask||'Tap the line that is the finding.')+'</p><div class="opts">'+q.lines.map((l,i)=>'<button data-opt="'+i+'" class="cmd '+(Q.fb?(i===q.finding?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+esc(l)+'</button>').join('')+'</div>';}
  else if(q.type==='judge'){body='<div class="brief"><b>Scenario brief says:</b> '+esc(q.brief)+'</div><p><b>You do this:</b> '+esc(q.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-opt="'+i+'" class="'+(Q.fb?(k===q.answer?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>';}
  const fb=Q.fb?'<div class="fb '+(Q.fb.ok?'ok':'bad')+'" aria-live="polite"><b>'+(Q.fb.ok?'Right.':'Not this time.')+'</b> '+esc(Q.fb.text)+(Q.fb.chosen?'<div class="picked">'+esc(Q.fb.chosen)+'</div>':'')+'</div><button class="btn primary" data-act="next">'+(Q.i===Q.qs.length-1?'See results':'Next question')+'</button>':'';
  return '<div class="q"><div class="count">Question '+(Q.i+1)+' of '+Q.qs.length+' · '+Q.correct+' correct</div><h2>'+esc(q.prompt||(q.type==='spot'?'Spot the finding':'Fix or break?'))+'</h2>'+body+fb+'</div>';
}
function pickWhy(q,pick){
  if(q.type==='which'||q.type==='what'){const o=q.opts[pick];const s=o&&o.src&&byId[o.src];if(!s)return '';return q.type==='which'?'What you picked, '+stripped(firstCmd(s))+', is "'+s.title+'": '+s.why:'What you picked, "'+s.title+'", is what '+stripped(firstCmd(s))+' does.';}
  if(q.type==='spot')return 'Line '+(pick+1)+' is ordinary output here. The finding is line '+(q.finding+1)+'.';
  if(q.type==='judge')return ({fix:'You called it a fix.',breaks:'You said it breaks a requirement.',check:'You chose to check first.'})[['fix','breaks','check'][pick]]||'';
  return '';
}
function answer(pick,given){
  const q=Q.qs[Q.i];let ok=false,text='';const why=q.item?q.item.why:'';
  if(q.type==='which'||q.type==='what'){ok=q.opts[pick].ok;text=why;}
  else if(q.type==='spot'){ok=pick===q.finding;text=q.why;}
  else if(q.type==='judge'){ok=['fix','breaks','check'][pick]===q.answer;text=q.why;}
  else if(q.type==='type'){const g=norm(given);const acc=[q.item.t].concat(q.item.ta||[]).map(norm);ok=acc.includes(g);text=(ok?'':'Answer: '+q.item.t+'. ')+why;}
  const chosen=ok?'':pickWhy(q,pick);
  if(ok&&q.item){const id=q.item.id,t=today();const a=S.days[id]=S.days[id]||((S.drilled[id]||0)>0?[0]:[]);if(!a.includes(t))a.push(t);S.drilled[id]=(S.drilled[id]||0)+1;}
  if(ok)Q.correct++;Q.res.push({q,ok,pick});save();
  Q.fb={ok,text,chosen,pick,given:given||''};
}
function finishQuiz(){const pct=Math.round(100*Q.correct/Q.qs.length);S.best[Q.li]=Math.max(S.best[Q.li]||0,pct);save();Q.finished=true;const b=badge(Q.li);const L=APP.levels[Q.li];
  const missed=Q.res.filter(r=>!r.ok);const mastered=L.items.filter(i=>status(i)==='mastered').length;const dueN=L.items.filter(due).length;
  const list=missed.length?'<h3>Worth another look</h3><div class="missed">'+missed.map(r=>{const it=r.q.item;const label=it?it.id+' · '+it.title:(r.q.type==='spot'?'Spot the finding':'Fix or break: '+r.q.action);return '<div class="miss"><span>'+esc(label)+'</span>'+(it?'<button class="btn small" data-learnjump="'+esc(it.id)+'">Open in Learn</button>':'')+'</div>';}).join('')+'</div>':'<p>Every question right.</p>';
  return '<div class="result"><div class="big">'+pct+'%</div><p>'+Q.correct+' of '+Q.qs.length+' right. '+(b.earned?'The '+esc(L.name)+' badge is yours: '+L.badge:(pct>=80?'The drill is there; learn '+(Math.ceil(L.items.length*.8)-b.learned)+' more items for the badge.':'Open each miss in Learn, then run it again.'))+'</p>'
   +'<p class="small">'+mastered+' of '+L.items.length+' items mastered: right on two different days.'+(dueN?' '+dueN+' due for a second day.':'')+'</p>'+list
   +'<div class="nav"><button class="btn primary" data-act="startq">Run it again</button><button class="btn" data-mode-go="learn">Back to Learn</button></div></div>';}
/* run */
let tick=null;const OPEN=new Set();
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function renderRun(){
  const R=S.run;const items=allItems.filter(i=>i.li===S.level||(R.lower&&i.li<S.level));
  const remain=Math.max(0,R.mins*60-R.elapsed);
  const rows=items.map(i=>'<div class="chk '+(R.done[i.id]!=null?'done':'')+'"><input type="checkbox" data-done="'+i.id+'" '+(R.done[i.id]!=null?'checked':'')+' aria-label="Done: '+esc(i.title)+'"><div><div class="t"><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span>'+(R.done[i.id]!=null?'<span class="stamp">'+fmt(R.done[i.id])+'</span>':'')+'<button class="btn small" data-show="'+i.id+'">Commands</button></div><div id="show-'+i.id+'"'+(OPEN.has(i.id)?'':' hidden')+'>'+termBlock(i.cmds,true)+'</div><input class="note" data-note="'+i.id+'" placeholder="Change: what you changed and why" value="'+esc(R.notes[i.id]||'')+'" aria-label="Change for '+esc(i.id)+'"><input class="note" data-undo="'+i.id+'" placeholder="Undo: how to put it back" value="'+esc(R.undo[i.id]||'')+'" aria-label="Undo for '+esc(i.id)+'"><input class="note" data-verify="'+i.id+'" placeholder="Verified with: the command or screen that proved it" value="'+esc(R.verify[i.id]||'')+'" aria-label="Verified with, for '+esc(i.id)+'"></div></div>').join('');
  return '<h2>Run the checklist on your VM</h2><p class="lead">Set the clock, work the list top to bottom, tick each item once you have verified it on the machine, and write the change, how to undo it, and what you verified it with. The log is what lets you undo a change that broke something in thirty seconds.</p>'+legendHtml()
   +'<div class="timer"><div class="clock" aria-live="off">'+fmt(remain)+'</div><select data-mins>'+[20,45,60,90,120].map(m=>'<option value="'+m+'" '+(m===R.mins?'selected':'')+'>'+m+' min</option>').join('')+'</select><button class="btn primary" data-act="timer">'+(tick?'Pause':'Start')+'</button><button class="btn" data-act="resetclock">Reset clock</button><label class="toggle"><input type="checkbox" data-lower '+(R.lower?'checked':'')+'> include lower levels</label></div>'
   +'<div class="nav" style="margin:0 0 10px"><button class="btn small" data-act="copylog">Copy change log</button><button class="btn small" data-act="dlog">Download change log</button><button class="btn small" data-act="clearrun">Clear this run</button></div>'
   +rows;
}
function changeLog(){const R=S.run;const lines=allItems.filter(i=>R.done[i.id]!=null||R.notes[i.id]||R.undo[i.id]||R.verify[i.id]).sort((a,b)=>(R.done[a.id]??1e9)-(R.done[b.id]??1e9)).map(i=>'['+(R.done[i.id]!=null?fmt(R.done[i.id]):'--:--')+'] '+APP.os+' | '+i.id+' '+i.title+' | change: '+(R.notes[i.id]||'-')+' | undo: '+(R.undo[i.id]||'-')+' | verified: '+(R.verify[i.id]||'-'));
  return '# Change log - '+APP.os+' - '+new Date().toLocaleString()+'\n# [time] machine | item | change | undo | verified\n'+(lines.join('\n')||'(nothing logged yet)')+'\n';}
function startTimer(){if(tick)return;tick=setInterval(()=>{S.run.elapsed++;if(S.run.elapsed%5===0)save();const c=document.querySelector('.clock');if(c)c.textContent=fmt(Math.max(0,S.run.mins*60-S.run.elapsed));if(S.run.elapsed>=S.run.mins*60){stopTimer();render();}},1000);}
function stopTimer(){clearInterval(tick);tick=null;save();}
/* games */
let G={tab:'imposter',sc:0,picks:{},checked:false,jq:null,streak:0,jfb:null};
function renderGames(){
  const tabs='<div class="tabs"><button class="btn '+(G.tab==='imposter'?'primary':'')+'" data-gtab="imposter">Who is the imposter?</button><button class="btn '+(G.tab==='judge'?'primary':'')+'" data-gtab="judge">Fix or break?</button></div>';
  if(G.tab==='imposter'){const sc=APP.imposter[G.sc];
    const rows=sc.accounts.map((a,i)=>{const p=G.picks[i]||'keep';const cls=G.checked?(p===a.truth?'ok':'bad'):'';return '<div class="acct '+cls+'"><div class="n">'+esc(a.name)+'<small>'+esc(a.info)+'</small></div><div class="seg">'+['keep','remove'].concat(a.admin?['demote']:[]).map(k=>'<button data-pick="'+i+'" data-val="'+k+'" class="'+(p===k?'on':'')+'" '+(G.checked?'disabled':'')+'>'+({keep:'Keep',remove:'Remove',demote:'Demote'})[k]+'</button>').join('')+'</div></div>'+(G.checked&&p!==a.truth?'<div class="fb bad">'+esc(a.why)+'</div>':'');}).join('');
    const right=G.checked?sc.accounts.filter((a,i)=>(G.picks[i]||'keep')===a.truth).length:0;
    return tabs+'<h2>'+esc(sc.title)+'</h2><p class="lead">Read the scenario brief, then decide for every account: keep it, remove it, or demote it from admin. The brief is the documented source of truth; when it is unclear, ask the system owner before you delete anything.</p><div class="brief"><b>Scenario brief</b><ul>'+sc.brief.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>'+termBlock(sc.output,false)+rows
      +(G.checked?'<div class="fb '+(right===sc.accounts.length?'ok':'bad')+'" style="max-width:720px">'+right+' of '+sc.accounts.length+' correct. '+esc(sc.debrief)+'</div>':'')+'<div class="nav"><button class="btn primary" data-act="'+(G.checked?'nextsc':'checksc')+'">'+(G.checked?'Next scenario':'Check my calls')+'</button></div>';
  }
  if(!G.jq){G.jq=shuffle(APP.judge.slice());}const j=G.jq[0];
  const fb=G.jfb?'<div class="fb '+(G.jfb.ok?'ok':'bad')+'"><b>'+(G.jfb.ok?'Right.':'Not this time.')+'</b> '+esc(j.why)+'</div><button class="btn primary" data-act="jnext">Next</button>':'';
  return tabs+'<div class="q"><div class="streak">streak '+G.streak+'</div><h2>Fix or break?</h2><div class="brief"><b>Scenario brief says:</b> '+esc(j.brief)+'</div><p><b>You do this:</b> '+esc(j.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-jopt="'+k+'" class="'+(G.jfb?(k===j.answer?'ok':(G.jfb.pick===k?'bad':'')):'')+'" '+(G.jfb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>'+fb+'</div>';
}
/* report */
function explainBlock(){const ex=allItems.filter(i=>(S.explain[i.id]||'').trim());if(!ex.length)return '';return '<details class="ex"><summary>Your explanations ('+ex.length+')</summary><dl>'+ex.map(i=>'<dt>'+esc(i.id)+' · '+esc(i.title)+'</dt><dd>'+esc(S.explain[i.id])+'</dd>').join('')+'</dl></details>';}
function renderReport(){
  const lv=APP.levels.map((L,i)=>{const b=badge(i);return '<div class="lv"><div class="row"><span>'+(b.earned?L.badge+' ':'')+esc(L.name)+'</span><span class="mono">'+b.learned+'/'+b.total+' learned · best '+(b.best||0)+'%</span></div><div class="bar2 '+(b.earned?'earned':'')+'"><i style="width:'+Math.round(100*b.learned/b.total)+'%"></i></div></div>';}).join('');
  const rows=allItems.map(i=>{const st=status(i);const isDue=due(i)&&st!=='mastered';const g=isDue?'⟳':{mastered:'✓',learned:'◐',drilled:'◔',none:'·'}[st];return '<div class="rr '+st+'" data-rr="'+i.id+'"><span class="g'+(isDue?' due':'')+'" title="'+(isDue?'Due: answer it right on a second day':'')+'">'+g+'</span><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span><span class="pt">'+itemScore(i)+'</span></div>';}).join('');
  return '<h2>Progress report</h2>'+lv+'<p style="font-size:.8rem;color:var(--muted)">✓ explained, and right on two different days · ◐ explained · ◔ right once · ⟳ due: right on a second day</p>'+rows+explainBlock()+'<div class="total"><span>Total</span><span>'+score()+' / '+maxScore+'</span></div>';
}
function renderFoot(){$('#foot').innerHTML=esc(APP.footer||'Training tool for virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist.')+' <button data-act="reset">Reset my progress</button>';}
function render(){
  if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches)S.mode='learn';
  renderHeader();
  const v=$('#view');const m=S.mode;
  v.innerHTML=m==='learn'?renderLearn():m==='drill'?renderDrill():m==='run'?renderRun():m==='games'?renderGames():'';
  $('#report').innerHTML=renderReport();renderFoot();
  if(m==='drill'&&Q&&!Q.finished&&!Q.fb){const t=v.querySelector('.typein');if(t)t.focus();}
  if(m==='learn'){const on=v.querySelector('.list button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
}
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.level!=null){S.level=+d.level;if(S.mode==='drill'&&Q&&Q.li!==S.level)Q=null;save();render();return;}
  if(d.mode){S.mode=d.mode;save();render();return;}
  if(d.modeGo){S.mode=d.modeGo;save();render();return;}
  if(d.learnjump){const it=byId[d.learnjump];if(it){S.level=it.li;S.sel[it.li]=it.id;S.mode='learn';Q=null;save();render();}return;}
  if(d.sel){S.sel[S.level]=d.sel;save();render();return;}
  if(d.step){const L=APP.levels[S.level];const cur=S.sel[S.level]||L.items[0].id;const i=L.items.findIndex(x=>x.id===cur)+(+d.step);if(L.items[i]){S.sel[S.level]=L.items[i].id;save();render();}return;}
  if(d.act==='copy'){const term=b.closest('.term');const lines=[...term.querySelectorAll('.ln:not(.c)')].map(n=>n.textContent.replace(PRE,'')).filter(l=>l.trim()).join('\n');copyText(lines,b);return;}
  if(d.act==='startq'){Q=makeQuiz(S.level);render();return;}
  if(d.opt!=null&&S.mode==='drill'&&Q&&!Q.fb){answer(+d.opt);render();return;}
  if(d.act==='check'){const t=$('.typein');answer(null,t?t.value:'');render();return;}
  if(d.act==='skip'){answer(null,'');render();return;}
  if(d.act==='next'){if(Q.i===Q.qs.length-1){$('#view').innerHTML=finishQuiz();renderHeader();$('#report').innerHTML=renderReport();}else{Q.i++;Q.fb=null;render();}return;}
  if(d.act==='timer'){tick?stopTimer():startTimer();render();return;}
  if(d.act==='resetclock'){stopTimer();S.run.elapsed=0;save();render();return;}
  if(d.act==='clearrun'){if(confirm('Clear all ticks, timestamps and notes for this run?')){stopTimer();S.run.done={};S.run.notes={};S.run.undo={};S.run.verify={};S.run.elapsed=0;save();render();}return;}
  if(d.act==='copylog'){copyText(changeLog(),b);return;}
  if(d.act==='dlog'){const blob=new Blob([changeLog()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='change-log-'+APP.key+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}
  if(d.show){const el=document.getElementById('show-'+d.show);if(el){el.hidden=!el.hidden;if(el.hidden)OPEN.delete(d.show);else OPEN.add(d.show);}return;}
  if(d.gtab){G.tab=d.gtab;G.jfb=null;render();return;}
  if(d.pick!=null&&!G.checked){G.picks[d.pick]=d.val;render();return;}
  if(d.act==='checksc'){G.checked=true;render();return;}
  if(d.act==='nextsc'){G.sc=(G.sc+1)%APP.imposter.length;G.picks={};G.checked=false;render();return;}
  if(d.jopt&&!G.jfb){const j=G.jq[0];const ok=d.jopt===j.answer;G.streak=ok?G.streak+1:0;G.jfb={ok,pick:d.jopt};render();return;}
  if(d.act==='jnext'){G.jq.push(G.jq.shift());G.jfb=null;render();return;}
  if(d.act==='reset'){if(confirm('Erase all progress for this trainer on this browser?')){stopTimer();S=defaults();save();Q=null;render();}return;}
  if(b.id==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();renderHeader();return;}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.learn){const was=status(byId[d.learn]);S.learned[d.learn]=e.target.checked;if(!e.target.checked)delete S.learned[d.learn];save();render();const now=status(byId[d.learn]);if(now==='mastered'&&was!=='mastered'){const r=document.querySelector('[data-rr="'+d.learn+'"]');if(r)r.classList.add('flip');}return;}
  if(d.done){if(e.target.checked&&!(S.run.verify[d.done]||'').trim()){e.target.checked=false;const row=e.target.closest('.chk');const v=row&&row.querySelector('[data-verify]');if(v){v.placeholder='Verified with: fill this in first, then tick';v.focus();}return;}
    if(e.target.checked)S.run.done[d.done]=S.run.elapsed;else delete S.run.done[d.done];save();render();return;}
  if(d.mins!=null){S.run.mins=+e.target.value;S.run.elapsed=0;save();render();return;}
  if(d.lower!=null){S.run.lower=e.target.checked;save();render();return;}
});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.explain){S.explain[d.explain]=e.target.value;save();return;}
  if(d.note){S.run.notes[d.note]=e.target.value;save();return;}
  if(d.undo){S.run.undo[d.undo]=e.target.value;save();return;}
  if(d.verify){S.run.verify[d.verify]=e.target.value;save();return;}
});
window.addEventListener('resize',()=>{if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches){S.mode='learn';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('typein')&&Q&&!Q.fb){answer(null,e.target.value);render();}});
render();
})();
</script>

(function(){
  const C={"key": "lockdown-drills-windows-server", "progressKey": "lockdown-drills-windows-server-v1", "read": ["#view"], "gloss": [["Advanced audit policy", "About 60 audit subcategories under Advanced Audit Policy Configuration, finer than the nine basic categories."], ["Antivirus", "Software that checks files and programs against detection signatures and suspicious actions, then blocks, quarantines, or reports them."], ["ARP", "The protocol that finds the MAC address for an IPv4 address on the local network."], ["ARP spoofing", "Forged ARP replies that claim another host’s IP address, often the gateway’s, to put the sender on-path."], ["AS-REP roasting", "Cracking offline the reply a domain controller sends for an account set to skip Kerberos pre-authentication."], ["Attack surface", "Every account, service, port, and program an attacker could reach on a system."], ["Audit policy", "The Windows settings that decide which Success and Failure events go to the Security log."], ["AutoPlay", "The Windows prompt that offers to open a drive or disc when it connects; turning it off removes one easy click for a planted USB stick."], ["Backdoor", "A hidden way back into a system, such as a netcat listener, an extra SSH key, or a rogue user."], ["Backup", "An independent copy on separate media that survives the loss of the original and earns trust after a test restore."], ["Baseline", "A record of how a system looks before you change it: its users, services, ports, software, and settings."], ["BitLocker", "Windows drive encryption that keeps a lost or stolen drive unreadable; the TPM unlocks it at startup, and a 48-digit recovery key opens it when the boot chain changes."], ["Certificate", "A signed record that binds a public key to a name; browsers accept it when the name matches the address, the dates are current, and the chain reaches a trusted root."], ["Change log", "One line per change: the time, the machine, what changed, and how to undo it."], ["Channel binding", "Ties a sign-in to the TLS session it travels in, so a sign-in relayed through another connection fails."], ["Cmdlet", "A PowerShell command named Verb-Noun, such as Get-LocalUser."], ["Command Prompt", "cmd.exe, the older Windows command line, where commands such as dir and del, and tools such as sc.exe, netsh, and reg, take their own options (such as /s or start= disabled) in place of PowerShell parameters."], ["Container", "An app packed with its own files and network that shares the host’s kernel: lighter than a VM, with a thinner wall."], ["CSV", "Comma-separated values: a table in plain text, with one record per line."], ["curl", "A command-line tool that sends one web request and prints the answer; curl -sI shows only the response headers."], ["Default Domain Policy", "The GPO linked at the domain that carries password and lockout policy for every domain account."], ["DHCP", "The service that hands hosts an address, mask, gateway, and DNS server automatically."], ["Directory listing", "A web server feature that shows every file in a folder to any visitor when the folder has no index page."], ["DNS", "The service that turns names into IP addresses."], ["DnsAdmins", "An AD group whose members can load code into the DNS service, which makes it an admin group by another road."], ["Domain account", "An account stored in Active Directory that can sign in to any computer in the domain."], ["DWORD", "A 32-bit number stored as a registry value, the type most security switches use."], ["Encryption", "Scrambling data so that only holders of the key can read it."], ["Evidence", "The files, logs, and settings an investigation question depends on, kept unchanged until the question is answered."], ["Execution policy", "The PowerShell setting that decides which script files may start. It is a safety catch rather than a lock: typed commands still run, and unless Group Policy sets it, anyone can bypass it for one run."], ["Hardening", "Shrinking a system’s attack surface by removing what is unneeded and securely configuring what remains."], ["Hosts file", "A local file of name-to-address pairs that the system reads before DNS."], ["HTTP", "The request-and-response language of the web, sent as readable text on port 80."], ["HTTPS", "HTTP inside TLS on port 443: private and protected against tampering."], ["Incident", "An event, or a set of events, that harms or truly threatens confidentiality, integrity, or availability; often an alert that evidence confirms."], ["Incident response", "The planned work of handling an incident: preparation, identification, containment, eradication, recovery, and lessons learned."], ["Investigation question", "A lab question about what happened on the machine, answered exactly in the format it asks for."], ["JSON", "A data format of braces, brackets, and quoted keys, used in API answers, cloud policies, and audit events."], ["Kerberoasting", "Requesting service tickets for user accounts with SPNs and cracking their passwords offline."], ["Kerberos", "The ticket-based sign-in protocol Active Directory uses by default."], ["krbtgt", "The built-in, disabled AD account whose key signs every ticket-granting ticket; Windows keeps it, so leave it in place."], ["LAN", "Local area network: devices in one building or campus, joined by links the owner controls."], ["LDAP signing", "Signs each LDAP message on port 389 so tampering shows; when a DC requires it, the DC refuses unsigned binds and simple binds sent without TLS."], ["Least privilege", "Giving every account and program only the access its job needs."], ["LLMNR and NBT-NS", "Fallback name lookups sent to every host on the local network (LLMNR by multicast, NBT-NS by broadcast), which an attacker on the LAN can answer to capture password hashes."], ["Local account", "An account stored on one computer and usable only there."], ["Logon type", "The number in a Windows sign-in event that says how the sign-in happened: 2 at the keyboard, 3 over the network, and 10 by t a program at every sign-in."], ["Scenario brief", "The document that comes with a lab: authorized users and admins, required services, software policy, and investigation questions."], ["Scope", "The exact systems, accounts, methods, and time window that an authorization covers."], ["Script", "A text file of commands that an interpreter reads and runs. Read every line before you run one."], ["Script block logging", "Records the decoded text of each PowerShell script block as event 4104 in the PowerShell Operational log."], ["Secure Boot", "A UEFI firmware feature that starts only a boot manager signed with a trusted key, which blocks bootkits that try to load before Windows."], ["Security group", "A stateful cloud firewall attached to a VM’s network interface; it holds allow rules only."], ["Self-signed certificate", "A certificate whose issuer is its own subject, trusted only on devices where someone installed it."], ["Service name", "The short name commands use for a Windows service, such as RemoteRegistry, distinct from the display name services.msc shows."], ["Shell", "The program that reads the commands you type and runs them. Bash is the usual shell on Linux."], ["SMB signing", "A signature on every file-sharing message that proves the sender and blocks relay."], ["SMBv1", "The first, obsolete version of Windows file sharing, exploited by EternalBlue and WannaCry."], ["SSH", "Secure Shell, the encrypted remote-login service on TCP port 22."], ["SSL", "Secure Sockets Layer, the retired forerunner of TLS. “SSL certificate” lives on as a name for a TLS certificate."], ["Sysprep", "The Windows tool that strips a machine’s unique identity (computer name, security ID, and hardware-specific settings) so its image can become a template for many PCs."], ["Threat", "Who or what might attack or harm a system, such as a phishing crew or a flood of traffic."], ["TLS", "The protocol behind the padlock (a slider icon in Chrome): it encrypts a connection and checks the server’s certificate. It replaced the retired SSL."], ["TTL", "A packet counter each router lowers by one, so a looping packet eventually dies."], ["UEFI", "Unified Extensible Firmware Interface: the code built into a PC that checks the hardware and starts the boot manager; it replaced the older BIOS."], ["UPnP", "A router feature that lets apps open port forwards on their own. Turn it off and forward only what the brief names."], ["User Rights Assignment", "The policy section that grants privileges such as Allow log on locally and Debug programs to users and groups."], ["WDigest", "An old sign-in package that, with UseLogonCredential set to 1, keeps plaintext passwords in LSASS memory."], ["Web root", "The folder a web server serves files from, such as C:\\inetpub\\wwwroot on IIS or /var/www/html on Apache."], ["Webshell", "A script planted in a web root that gives an attacker commands through the web server."], ["Windows LAPS", "Built-in Windows feature that gives each machine its own random local admin password, rotates it, and stores it in AD or Entra ID."], ["Zone.Identifier", "The hidden stream that carries the Mark of the Web; ZoneId=3 means the file came from the internet, and HostUrl names where."]]};
  const $=s=>document.querySelector(s);

  const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};

  }
})();
</script>
