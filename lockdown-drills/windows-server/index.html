<style>
:root{
  --bg:#EDF0F4; --panel:#FFFFFF; --ink:#16212D; --muted:#5F6E7E; --line:#CFD7E0; --soft:#F4F6F9;
  --term:#0E1A2B; --termink:#D9E4F1; --prompt:#7FA6D6; --accent:#3F3DA8; --accent-ink:#FFFFFF;
  --ok:#1C8A57; --okbg:#E3F5EB; --bad:#C03A3A; --badbg:#FBE7E7; --warn:#A8690F; --warnbg:#FBF0DA; --focus:#FFB300;
  --sans:"Segoe UI Variable Text","Segoe UI","Avenir Next",Avenir,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; } }
:root[data-theme="dark"]{ --bg:#111922; --panel:#182330; --ink:#E7EEF6; --muted:#9DACBC; --line:#2B3A4B; --soft:#1F2B3A; --term:#0A121D; --termink:#D6E2F0; --okbg:#143524; --badbg:#3A1B1B; --warnbg:#3A2C12; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top,0px) 16px 0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}
.brand{font-weight:800;letter-spacing:-.01em;font-size:1.15rem;line-height:1.1}
.brand span{display:block;font-weight:500;color:var(--muted);font-size:.85rem;letter-spacing:0}
.levels{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.levels button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.levels button.on{background:var(--accent);color:var(--accent-ink)}
.levels button .b{font-size:1rem}
.score{font-family:var(--mono);font-size:.95rem;white-space:nowrap}
.score b{font-size:1.2rem}
.theme{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:.85rem}
.modes{display:flex;gap:2px;overflow-x:auto}
.modes button{border:0;background:transparent;padding:8px 12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.modes button.on{color:var(--ink);border-bottom-color:var(--accent)}
.series{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 0 8px;font-size:.82rem;color:var(--muted)}
.series a{color:var(--muted);text-decoration:none}.series a:hover{text-decoration:underline}.series b{color:var(--ink)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 110px)}
main{padding:18px 16px 40px;min-width:0}
aside.report{border-left:1px solid var(--line);background:var(--panel);padding:16px}
footer{padding:14px 16px 30px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);background:var(--panel)}
footer button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.85rem;margin-left:8px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.3rem;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:1.05rem;margin:18px 0 6px}
p{margin:0 0 10px;max-width:68ch}
.lead{color:var(--muted);max-width:70ch;margin-bottom:16px}.legend{color:var(--muted);font-size:.85rem;max-width:70ch;margin:8px 0 0}.legend code{color:var(--ink)}.lead a,.run-in a{color:var(--ink)}
/* learn */
.learn{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}
.list{display:flex;flex-direction:column;gap:2px}
.list button{display:grid;grid-template-columns:18px 54px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;line-height:1.25}
.list button.on{background:var(--soft)}
.list button .id{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.dot.learned{background:var(--accent)}.dot.drilled{background:var(--warn)}.dot.mastered{background:var(--ok)}
.item .meta{font-family:var(--mono);color:var(--muted);font-size:.85rem;margin-bottom:2px}
.term{background:var(--term);color:var(--termink);font-family:var(--mono);font-size:.86rem;line-height:1.5;border-radius:10px;padding:8px 14px 12px;margin:12px 0;overflow-x:auto}
.term .tb{display:flex;justify-content:flex-end;min-height:22px;margin-bottom:4px}
.term .ln{white-space:pre-wrap;word-break:break-word;padding-left:1.4em;text-indent:-1.4em;margin:2px 0}
.term .p{color:var(--prompt)}
.term .ln.c{color:#9DB0C6;font-style:italic}
.term .copy{border:1px solid #2E4158;background:#17283D;color:var(--termink);border-radius:6px;padding:2px 9px;font:600 .75rem var(--sans)}
.term .copy.done{border-color:var(--ok);color:#8BE0B4}
.run-in b{font-weight:700}
.explain{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:10px;background:var(--soft)}
.explain textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);resize:vertical}
.explain label{display:flex;gap:10px;align-items:center;margin-top:8px;font-weight:600}
.explain input{width:20px;height:20px;accent-color:var(--ok)}
.nav{display:flex;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
/* drill */
.q{max-width:720px}
.q .count{font-family:var(--mono);color:var(--muted);font-size:.85rem}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opts button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;line-height:1.35}
.opts button.cmd{font-family:var(--mono);font-size:.88rem;white-space:pre-wrap;word-break:break-word}
.opts button.ok{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin:12px 0}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.typein{width:100%;max-width:560px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);background:var(--panel)}
.result{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-width:560px}
.result .big{font-size:2.4rem;font-weight:800;font-family:var(--mono)}
/* run */
.timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.timer .clock{font-family:var(--mono);font-size:2rem;font-weight:700;min-width:120px}
.timer select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel)}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.chk input[type=checkbox]{width:20px;height:20px;margin-top:4px;accent-color:var(--ok)}
.chk .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chk .t .id{font-family:var(--mono);color:var(--muted);font-size:.8rem}
.chk .note{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;background:var(--panel);font-size:.9rem}
.chk.done .t{color:var(--muted);text-decoration:line-through}
.chk .stamp{font-family:var(--mono);font-size:.8rem;color:var(--ok)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
/* games */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.brief{border-left:4px solid var(--accent);background:var(--soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0 14px;max-width:720px}
.brief ul{margin:4px 0 0 18px;padding:0}
.acct{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);max-width:720px}
.acct .n{font-family:var(--mono)}
.acct .n small{color:var(--muted);font-family:var(--sans);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.acct.ok .n{color:var(--ok)}.acct.bad .n{color:var(--bad)}
.streak{font-family:var(--mono);color:var(--muted);font-size:.9rem}
/* report */
.report h2{font-size:1.05rem;margin-bottom:10px}
.lv{margin:10px 0 14px}
.lv .row{display:flex;justify-content:space-between;font-size:.9rem}
.lv .bar2{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.lv .bar2 i{display:block;height:100%;background:var(--accent)}
.lv .bar2.earned i{background:var(--ok)}
.rr{display:grid;grid-template-columns:18px 52px 1fr 26px;gap:6px;align-items:center;font-size:.85rem;padding:3px 0;border-top:1px solid var(--line)}
.rr .id{font-family:var(--mono);color:var(--muted);font-size:.78rem}
.rr .pt{font-family:var(--mono);text-align:right;color:var(--muted)}
.rr.mastered .g{color:var(--ok);font-weight:800}.rr.mastered .pt{color:var(--ok)}
.rr.learned .g{color:var(--accent);font-weight:800}
.rr.drilled .g{color:var(--warn);font-weight:800}
.rr .g{text-align:center}
.rr.flip{animation:flip .35s ease-out}
@keyframes flip{0%{background:var(--okbg)}100%{background:transparent}}
.total{display:flex;justify-content:space-between;font-family:var(--mono);margin-top:10px;padding-top:8px;border-top:2px solid var(--ink)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted);margin-left:6px}
.empty{color:var(--muted);padding:20px 0}
@media (prefers-reduced-motion:reduce){ .rr.flip{animation:none} }
@media (max-width:1100px){ .wrap{grid-template-columns:1fr} aside.report{display:none;border-left:0;border-top:1px solid var(--line)} body[data-mode="report"] aside.report{display:block} body[data-mode="report"] main{display:none} .modes .rep{display:inline-block} }
@media (min-width:1101px){ .modes .rep{display:none} }
@media (max-width:760px){ header.top{position:static} .learn{grid-template-columns:1fr} .list{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px} .list button{grid-template-columns:auto auto;white-space:nowrap;border:1px solid var(--line)} .list button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .list button .ttl{display:none} .levels{margin-left:0} .score{margin-left:auto} }
</style>

  <div class="bar">
    <div class="brand" id="brand"></div>
    <div class="levels" id="levels" role="tablist" aria-label="Level"></div>
    <div class="score" id="score"></div>

<footer id="foot"></footer>
<script>
const APP = {"key": "windows-server", "os": "Windows Server 2025 (member server or domain controller)", "accent": "#3F3DA8", "footer": "Training tool for Windows Server virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist. Unofficial practice; not affiliated with or endorsed by Microsoft.", "legend": "PS> runs in an elevated PowerShell and CMD> in an elevated Command Prompt. Type what follows the prefix, and replace each value in angle brackets, such as <name>, with a real one. GUI: lines walk through a window, and indented lines show values to set or read.", "levels": [{"name": "Doorman", "badge": "🚪", "blurb": "Lock the doors. First find out what the box is (standalone, member server, or domain controller), then users, admins, passwords, and policy in the place that actually takes effect: local, or the domain. Learn it first: Defense Ladder s2, \"Desktop, member server, or domain controller.\"", "items": [{"id": "B-00", "title": "Scenario brief and evidence first", "cmds": ["GUI: open the scenario brief (the documented requirements for this machine) and write down authorized users, admins, required services, and anything forbidden", "PS> (Get-CimInstance Win32_ComputerSystem).DomainRole", "  0-1 standalone or member workstation, 2-3 standalone or member server, 4-5 domain controller", "PS> Get-WindowsFeature AD-Domain-Services,DNS,DHCP,Web-Server,Web-Ftp-Server | Select-Object Name,Installed"], "why": "Most outages during hardening come from acting against the documented requirements: removing a user, role, or service the business needs is an availability failure. Evidence first: answer the investigation questions before any change (Defense Ladder f1). Which commands apply depends on the role: local accounts and secpol on a member server, Active Directory and Group Policy on a domain controller.", "note": "Unfamiliar is distinct from unauthorized: find what starts it, who owns it, and what it does, then ask the owner before removing an agent (Defense Ladder s1).", "task": "", "t": "", "area": "inv"}, {"id": "B-01", "title": "List users: local and domain", "cmds": ["PS> Get-LocalUser | Select-Object Name,Enabled,PasswordRequired,LastLogon", "PS> Get-ADUser -Filter * -Properties Enabled,PasswordNeverExpires,PasswordNotRequired,LastLogonDate | Select-Object Name,Enabled,PasswordNeverExpires,PasswordNotRequired,LastLogonDate", "CMD> net user /domain", "GUI: dsa.msc (Active Directory Users and Computers) on a DC; lusrmgr.msc on a member server"], "why": "Unauthorized accounts are backdoors. On a DC the local SAM is gone; every account is a domain account, so Get-ADUser is the list to compare with the brief.", "note": "PasswordNotRequired=True and PasswordNeverExpires=True are findings in their own right.", "task": "list every domain user (minimal PowerShell)", "t": "Get-ADUser -Filter *", "ta": ["get-aduser -filter * | select name", "net user /domain"], "area": "acct"}, {"id": "B-02", "title": "Remove or disable an unauthorized user", "cmds": ["PS> Disable-ADAccount -Identity baduser", "PS> Remove-ADUser -Identity baduser -Confirm:$false", "PS> Remove-LocalUser -Name \"baduser\"", "CMD> net user baduser /delete"], "why": "Disable first if the brief is unclear, delete when it is not: a disabled account keeps its SID and group memberships for the investigation question.", "task": "disable the domain account baduser", "t": "Disable-ADAccount -Identity baduser", "ta": ["disable-adaccount baduser"], "area": "acct"}, {"id": "B-03", "title": "Audit the privileged groups", "cmds": ["PS> Get-ADGroupMember \"Domain Admins\"; Get-ADGroupMember \"Enterprise Admins\"; Get-ADGroupMember \"Schema Admins\"; Get-ADGroupMember \"Administrators\"", "PS> Get-ADGroupMember \"Account Operators\"; Get-ADGroupMember \"Server Operators\"; Get-ADGroupMember \"Backup Operators\"; Get-ADGroupMember \"DnsAdmins\"", "PS> Remove-ADGroupMember -Identity \"Domain Admins\" -Members baduser -Confirm:$false", "PS> Get-LocalGroupMember -Group Administrators", "CMD> net localgroup Administrators baduser /delete"], "why": "Domain Admins is the whole game, and the operator groups, Backup Operators, and DnsAdmins are quieter roads to the same place. On a member server it is still the local Administrators group.", "task": "list the members of Domain Admins", "t": "Get-ADGroupMember \"Domain Admins\"", "ta": ["get-adgroupmember -identity \"domain admins\"", "get-adgroupmember domain admins", "net group \"domain admins\" /domain"], "area": "acct"}, {"id": "B-04", "title": "Disable Guest; protect the built-in Administrator", "cmds": ["CMD> net user Guest /active:no", "PS> Disable-ADAccount -Identity Guest", "CMD> net user Administrator /active:no", "PS> Set-ADUser -Identity Administrator -PasswordNeverExpires $false"], "why": "Well-known accounts are brute-forced by name. The domain Guest should always be disabled; the domain Administrator stays enabled only if the brief uses it, with a strong password.", "note": "Do not disable the account the brief tells you to log in with.", "task": "disable the domain Guest account", "t": "Disable-ADAccount -Identity Guest", "ta": ["net user guest /active:no"], "area": "acct"}, {"id": "B-05", "title": "Strong passwords and forced change", "cmds": ["PS> Set-ADAccountPassword -Identity alice -Reset -NewPassword (ConvertTo-SecureString \"Correct-Horse-Battery-2026!\" -AsPlainText -Force)", "PS> Set-ADUser -Identity alice -ChangePasswordAtLogon $true -PasswordNeverExpires $false -PasswordNotRequired $false", "PS> Get-ADUser -Filter * | Set-ADUser -PasswordNeverExpires $false", "CMD> net user alice \"Correct-Horse-Battery-2026!\"", "CMD> net user alice /logonpasswordchg:yes"], "why": "Weak, shared, or blank passwords are the way in. PasswordNotRequired lets an account have a blank password even when policy forbids it; PasswordNeverExpires defeats the aging policy.", "note": "Record every changed password somewhere safe (on paper, in a lab).", "task": "force domain user alice to change the account's password at next logon", "t": "Set-ADUser -Identity alice -ChangePasswordAtLogon $true", "ta": ["set-aduser alice -changepasswordatlogon $true"], "area": "acct"}, {"id": "B-06", "title": "Password policy where it actually lives", "cmds": ["PS> Get-ADDefaultDomainPasswordPolicy", "PS> Set-ADDefaultDomainPasswordPolicy -Identity (Get-ADDomain).DNSRoot -MinPasswordLength 12 -ComplexityEnabled $true -PasswordHistoryCount 24 -MinPasswordAge 1.00:00:00 -MaxPasswordAge 60.00:00:00 -ReversibleEncryptionEnabled $false", "GUI: gpmc.msc, Default Domain Policy, Computer Configuration, Policies, Windows Settings, Security Settings, Account Policies, Password Policy", "CMD> net accounts /minpwlen:12 /maxpwage:60 /minpwage:1 /uniquepw:24   (member server)", "GUI: secpol.msc, Account Policies, Password Policy (member server)"], "why": "On a domain controller, net accounts and secpol.msc are overridden by the Default Domain Policy, so a change there never sticks. On a member server the local policy is the one that counts.", "note": "The scenario brief sets the numbers; these commands show one sample brief. The CIS Benchmark asks for 14 or more characters, a history of 24 or more, a maximum age of 365 days or fewer (and above 0), and a minimum age of 1 day or more. Defense Ladder s2 compares the CIS and NIST rulebooks.", "task": "show the domain password policy", "t": "Get-ADDefaultDomainPasswordPolicy", "ta": ["net accounts /domain"], "area": "acct"}, {"id": "B-07", "title": "Account lockout policy", "cmds": ["PS> Set-ADDefaultDomainPasswordPolicy -Identity (Get-ADDomain).DNSRoot -LockoutThreshold 5 -LockoutDuration 00:30:00 -LockoutObservationWindow 00:30:00", "CMD> net accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30   (member server)", "PS> Search-ADAccount -LockedOut | Select-Object Name", "PS> Unlock-ADAccount -Identity alice"], "why": "Turns an online brute force from thousands of guesses a minute into five per half hour. Search-ADAccount shows who is locked out right now, which is also an investigation clue.", "note": "The scenario brief sets the numbers; these commands show one sample brief. The CIS Benchmark asks for a threshold of 5 or fewer (and above 0) and a lockout duration and reset window of 15 minutes or more. Defense Ladder s2 compares the CIS and NIST rulebooks.", "task": "list locked-out domain accounts", "t": "Search-ADAccount -LockedOut", "ta": ["search-adaccount -lockedout | select name"], "area": "acct"}, {"id": "B-08", "title": "Firewall on for all profiles", "cmds": ["PS> Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True", "PS> Get-NetFirewallProfile | Select-Object Name,Enabled,DefaultInboundAction", "CMD> netsh advfirewall set allprofiles state on"], "gui": "Settings, Privacy and security, Windows Security, Firewall and network protection.", "why": "Default-deny inbound covers the service you have not found yet. Misconfigured machines often have exactly one profile off, usually Public.", "note": "DefaultInboundAction should be Block. Allow-rule review is a Watchman item.", "task": "turn the firewall on for every profile (cmd)", "t": "netsh advfirewall set allprofiles state on", "ta": ["set-netfirewallprofile -profile domain,public,private -enabled true", "set-netfirewallprofile -all -enabled true"], "area": "config"}, {"id": "B-09", "title": "Windows Update on a server", "cmds": ["CMD> sconfig   (option 5: Update setting = Automatic; option 6: Install Updates)", "GUI: Settings, Windows Update, Check for updates", "PS> Set-Service -Name wuauserv -StartupType Automatic; Start-Service wuauserv", "GUI: gpmc.msc (or gpedit.msc), Computer Configuration, Policies, Administrative Templates, Windows Components, Windows Update: Configure Automatic Updates = Enabled (4)"], "why": "Patching closes the holes scanners find, and the automatic-update setting matters on its own. On a server, policy usually decides it, so check the GPO when the setting will not stick.", "note": "Start updates first and let them run; save work before any reboot.", "task": "open the server configuration menu", "t": "sconfig", "area": "patch"}, {"id": "B-10", "title": "Microsoft Defender on Server", "cmds": ["PS> Get-MpComputerStatus | Select-Object AMServiceEnabled,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated", "PS> Install-WindowsFeature -Name Windows-Defender", "PS> Set-MpPreference -DisableRealtimeMonitoring $false", "PS> Update-MpSignature", "PS> Start-MpScan -ScanType QuickScan", "GUI: Windows Security, Virus and threat protection, Manage settings"], "why": "Windows Server ships with Defender, but someone can remove the feature or disable it by policy. Real-time protection and current signatures both matter.", "note": "If Get-MpComputerStatus errors, the feature is missing: install it, then configure it.", "area": "malware"}, {"id": "B-11", "title": "Remove unapproved software", "cmds": ["PS> Get-ItemProperty HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*, HKLM:\\Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\* | Select-Object DisplayName,DisplayVersion,Publisher | Sort-Object DisplayName", "GUI: Settings, Apps, Installed apps (or appwiz.cpl)"], "why": "Hacking tools, games, torrent clients, and remote-access tools are acceptable-use violations and attack surface.", "note": "Software the brief requires stays. The registry listing is instant; Win32_Product is slow and can trigger repairs.", "area": "software"}, {"id": "B-12", "title": "Find unapproved media and loose executables", "cmds": ["PS> Get-ChildItem -Path C:\\Users,C:\\inetpub,C:\\Shares -Recurse -Include *.mp3,*.mp4,*.wav,*.avi,*.mkv,*.flac,*.mov,*.m4a -ErrorAction SilentlyContinue | Select-Object FullName", "PS> Get-ChildItem -Path C:\\Users,C:\\inetpub -Recurse -Include *.exe,*.bat,*.ps1,*.vbs,*.aspx -ErrorAction SilentlyContinue | Select-Object FullName"], "why": "Media in user profiles and web roots is the usual acceptable-use violation; a stray .aspx or .ps1 under inetpub is a webshell.", "note": "Confirm against the brief before deleting, and search C:\\ too, not just C:\\Users.", "area": "data"}, {"id": "B-13", "title": "Stop obviously unsafe services", "cmds": ["PS> Get-Service -Name ftpsvc,TermService,RemoteRegistry,SNMP -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType", "PS> Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server' -Name fDenyTSConnections -Value 1", "GUI: services.msc, Startup type Disabled; Settings, System, Remote Desktop", "PS> Stop-Service -Name Spooler; Set-Service -Name Spooler -StartupType Disabled   (unless this is the print server)"], "why": "Telnet and FTP leak credentials in cleartext. Remote Registry lets a remote attacker edit the registry. RDP is a brute-force magnet. The Print Spooler on a domain controller is PrintNightmare: off unless the brief makes it a print server.", "note": "If the brief requires RDP, FTP, or SSH, harden it instead of killing it.", "task": "stop Remote Registry and disable its startup", "t": "Stop-Service -Name RemoteRegistry; Set-Service -Name RemoteRegistry -StartupType Disabled", "area": "config"}]}, {"name": "Watchman", "badge": "🔦", "blurb": "Check the windows. Roles and features, audit and policy through Group Policy, services, shares, tasks, ports, logs, and the required roles (IIS, FTP, DNS, and DHCP) hardened instead of removed. Learn it first: Defense Ladder j1, \"Windows Server and Active Directory,\" and Defense Ladder j2, \"Group Policy.\"", "items": [{"id": "I-01", "title": "Audit policy: turn the lights on", "cmds": ["CMD> auditpol /set /category:* /success:enable /failure:enable", "CMD> auditpol /get /category:*", "GUI: secpol.msc, Local Policies, Audit Policy, each set to Success and Failure", "GUI: gpmc.msc, Default Domain Controllers Policy, Computer Configuration, Policies, Windows Settings, Security Settings, Advanced Audit Policy Configuration"], "why": "Without auditing, Event Viewer has nothing to tell you or an investigator. Logon, account management, and policy change are the key ones.", "note": "On a DC the Default Domain Controllers Policy overrides local auditpol; set it there or it will revert at the next gpupdate.", "task": "enable success and failure auditing for every category", "t": "auditpol /set /category:* /success:enable /failure:enable", "area": "audit"}, {"id": "I-02", "title": "Security Options in secpol.msc", "cmds": ["GUI: secpol.msc, Local Policies, Security Options", "  Accounts: Limit local account use of blank passwords to console logon only = Enabled", "  Interactive logon: Do not display last user name = Enabled", "  Interactive logon: Do not require CTRL+ALT+DEL = Disabled", "  Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled", "  Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM & NTLM", "  Microsoft network client and server: Digitally sign communications (always) = Enabled", "  Shutdown: Allow system to be shut down without having to log on = Disabled", "  User Account Control: Run all administrators in Admin Approval Mode = Enabled", "  Domain controller: LDAP server signing requirements = Require signing", "  Domain member: Digitally encrypt or sign secure channel data (always) = Enabled"], "why": "These are the classic CIS and STIG level-one settings; each blocks a named attack: blank-password remote logon, username harvesting, LM and NTLMv1 cracking or relay, SMB relay, pre-auth shutdown, and UAC bypass. Check the level on older releases and mixed domains; Windows 11 24H2 and Windows Server 2025 remove NTLMv1.", "note": "Command-line equivalents live in the registry (Hunter A-02) or secedit (Hunter A-01).", "area": "config"}, {"id": "I-03", "title": "UAC to Always notify", "cmds": ["PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name EnableLUA -Value 1 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name ConsentPromptBehaviorAdmin -Value 2 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System' -Name PromptOnSecureDesktop -Value 1 -Type DWord"], "gui": "Control Panel, User Accounts, Change User Account Control settings, slider to the top.", "why": "UAC off means every process an admin runs is full admin with no prompt, which malware loves. Value 2 means prompt on the secure desktop.", "note": "Changing EnableLUA needs a reboot to fully apply.", "area": "config"}, {"id": "I-04", "title": "Service audit: what runs, from where", "cmds": ["PS> Get-CimInstance Win32_Service | Select-Object Name,State,StartMode,StartName,PathName | Sort-Object Name", "PS> Get-Service | Where-Object Status -eq Running | Sort-Object DisplayName", "PS> Stop-Service -Name <name>; Set-Service -Name <name> -StartupType Disabled"], "why": "Look for Telnet, FTP, SNMP, SSDP, UPnP, Remote Registry, Xbox services, odd names, and any service whose PathName is under C:\\Users or C:\\Temp. Those are planted. A StartName of LocalSystem means the service runs as SYSTEM, the most powerful account on the machine.", "note": "Required services (IIS, DNS, DHCP, OpenSSH, MySQL, Apache) stay running; harden their configs instead.", "area": "config"}, {"id": "I-05", "title": "Roles and features: remove what the brief does not need", "cmds": ["PS> Get-WindowsFeature | Where-Object Installed | Select-Object Name,DisplayName", "PS> Uninstall-WindowsFeature -Name FS-SMB1,Telnet-Client,TFTP-Client -Remove", "PS> Uninstall-WindowsFeature -Name Web-Ftp-Server -Remove   (only if FTP is not required)", "PS> Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force", "GUI: Server Manager, Manage, Remove Roles and Features"], "why": "Every role is a listening service. FS-SMB1 is the server-side SMBv1 (EternalBlue). Telnet and TFTP clients are cleartext tools that have no business on a server.", "note": "Required roles (AD DS, DNS, DHCP, IIS, FTP) stay and get hardened in I-15 and I-16.", "task": "list installed roles and features", "t": "Get-WindowsFeature | Where-Object Installed", "ta": ["get-windowsfeature | where installed"], "area": "config"}, {"id": "I-06", "title": "Shares", "cmds": ["PS> Get-SmbShare", "CMD> net share", "PS> Remove-SmbShare -Name \"badshare\" -Force", "PS> Get-SmbShareAccess -Name \"Finance\"", "PS> Revoke-SmbShareAccess -Name \"Finance\" -AccountName Everyone -Force", "PS> Grant-SmbShareAccess -Name \"Finance\" -AccountName \"CORP\\Finance\" -AccessRight Change -Force"], "why": "An unexpected share is a data exfiltration path. Check the ACLs on the shares you must keep.", "note": "ADMIN$, C$, IPC$ are defaults; on a DC, SYSVOL and NETLOGON are normal too. Everyone with Full on a data share is the classic finding.", "task": "list the shares (cmd)", "t": "net share", "ta": ["get-smbshare"], "area": "access"}, {"id": "I-07", "title": "Scheduled tasks", "cmds": ["PS> Get-ScheduledTask | Where-Object State -ne Disabled | Select-Object TaskName,TaskPath,State", "PS> (Get-ScheduledTask -TaskName \"<name>\").Actions | Select-Object Execute,Arguments", "PS> Disable-ScheduledTask -TaskName \"<name>\" -TaskPath \"\\\"", "PS> Unregister-ScheduledTask -TaskName \"<name>\" -Confirm:$false", "CMD> schtasks /query /fo LIST /v"], "why": "Favorite persistence: a task that re-adds a user, re-opens a port, or runs a script from a user folder every five minutes.", "note": "Tasks under \\Microsoft\\Windows are mostly legit; focus on the root path.", "area": "malware"}, {"id": "I-08", "title": "Startup items and Run keys", "cmds": ["PS> Get-CimInstance Win32_StartupCommand | Select-Object Name,Command,Location,User", "PS> Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Get-ItemProperty 'HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run'", "PS> Remove-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run' -Name \"<evil>\""], "gui": "Task Manager, Startup apps.", "why": "Anything that auto-runs survives a reboot. Attackers hide here with innocent names like Windows Update Helper.", "note": "Also check the RunOnce keys and the shell:startup folders.", "area": "malware"}, {"id": "I-09", "title": "Hosts file", "cmds": ["PS> Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "GUI: notepad as admin, open the hosts file, delete every non-comment line except localhost"], "why": "Malware points update and antivirus domains at 127.0.0.1 or an attacker IP, so Defender and Windows Update silently fail.", "task": "print the hosts file", "t": "Get-Content C:\\Windows\\System32\\drivers\\etc\\hosts", "ta": ["type c:\\windows\\system32\\drivers\\etc\\hosts", "cat c:\\windows\\system32\\drivers\\etc\\hosts"], "area": "config"}, {"id": "I-10", "title": "Listening ports to process", "cmds": ["CMD> netstat -abno", "PS> Get-NetTCPConnection -State Listen | Select-Object LocalAddress,LocalPort,OwningProcess | Sort-Object LocalPort", "PS> Get-Process -Id <pid> | Select-Object Name,Path", "CMD> tasklist /svc"], "why": "A port you cannot explain is a backdoor; nc.exe listeners are the classic. Map port to PID to binary path to the service or task that starts it.", "task": "show listening ports with their executables (cmd)", "t": "netstat -abno", "ta": ["netstat -ano", "netstat -abn"], "note": "Normal on a DC: 53, 88, 135, 389, 445, 464, 636, 3268, 3269, plus dynamic RPC ports. Anything else needs a name.", "area": "config"}, {"id": "I-11", "title": "Remote Desktop hardening when RDP is required", "cmds": ["PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server\\WinStations\\RDP-Tcp' -Name UserAuthentication -Value 1", "CMD> net localgroup \"Remote Desktop Users\"", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Remote Assistance' -Name fAllowToGetHelp -Value 0"], "why": "Network Level Authentication forces a login before a session exists, which kills pre-auth exploits. The Remote Desktop Users group is a privilege list; audit it. Remote Assistance should be off.", "area": "access"}, {"id": "I-12", "title": "Firewall allow-rule review", "cmds": ["PS> Get-NetFirewallRule | Where-Object {$_.Enabled -eq 'True' -and $_.Direction -eq 'Inbound' -and $_.Action -eq 'Allow'} | Select-Object DisplayName,Profile | Sort-Object DisplayName", "PS> Remove-NetFirewallRule -DisplayName \"<suspicious rule>\"", "PS> Set-NetFirewallProfile -All -DefaultInboundAction Block -NotifyOnListen True -LogBlocked True"], "why": "Firewall on means nothing if a rule allows the whole internet into 4444/tcp.", "area": "config"}, {"id": "I-13", "title": "Group Policy: where server settings really come from", "cmds": ["GUI: gpmc.msc (Group Policy Management) on a DC; gpedit.msc on a member server", "PS> Get-GPO -All | Select-Object DisplayName,GpoStatus,ModificationTime", "PS> Get-GPOReport -All -ReportType Html -Path C:\\Temp\\gpo.html", "CMD> gpupdate /force", "CMD> gpresult /r /scope computer"], "why": "In a domain, policy applied by GPO wins over anything you click locally. Password and lockout live in the Default Domain Policy; a planted GPO that disables Defender or the firewall re-applies at every background refresh: about every 90 minutes on member servers, every 5 minutes on domain controllers.", "note": "Look for GPOs modified recently or with odd names; read the HTML report.", "task": "apply group policy now", "t": "gpupdate /force", "area": "config"}, {"id": "I-14", "title": "Event Viewer for investigations", "cmds": ["GUI: eventvwr.msc, Windows Logs, Security (and System for event 7045)", "PS> Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4728,4732,4756} | Format-List TimeCreated,Message", "  4720 user created, 4726 deleted, 4728 added to global group, 4732 local group, 4756 universal group, 4740 lockout", "  4624 logon OK, 4625 failed, 4768 Kerberos TGT, 4769 service ticket, 4771 pre-auth failed, 1102 log cleared", "PS> Get-WinEvent -FilterHashtable @{LogName='System'; Id=7045} | Format-List TimeCreated,Message", "  7045 new service installed: a System log event, so it takes its own filter"], "why": "Who was added to Domain Admins and when is a question these IDs answer in one filter.", "area": "inv"}, {"id": "I-15", "title": "IIS and FTP hardening when the brief requires them", "cmds": ["PS> Get-Website | Select-Object Name,State,PhysicalPath", "PS> Get-WebBinding", "GUI: inetmgr (IIS Manager), site, Authentication: Anonymous Authentication Disabled unless the brief says the site is public", "PS> Import-Module WebAdministration; Set-WebConfigurationProperty -Filter /system.webServer/directoryBrowse -Name enabled -Value $false -PSPath 'IIS:\\Sites\\Default Web Site'", "GUI: IIS Manager, FTP site, FTP Authentication: Anonymous Disabled; FTP SSL Settings: Require SSL connections", "GUI: IIS Manager, server node, Request Filtering, File Name Extensions: deny .exe and .ps1 (blocks web requests for them); FTP Request Filtering, File Name Extensions: deny .exe and .ps1 (blocks uploading and downloading them)"], "why": "A required web or FTP server is kept running and made safe: no directory listing, no anonymous FTP, TLS on, and nothing executable in the upload folder.", "note": "Check the physical path for planted .aspx webshells (B-12).", "area": "config"}, {"id": "I-16", "title": "DNS and DHCP hygiene when the server runs them", "cmds": ["PS> Get-DnsServerZone | Select-Object ZoneName,ZoneType,DynamicUpdate,SecureSecondaries", "PS> Set-DnsServerPrimaryZone -Name corp.local -DynamicUpdate Secure -SecureSecondaries NoTransfer", "PS> Get-DhcpServerInDC", "PS> Get-DhcpServerv4Scope | Select-Object ScopeId,Name,State"], "why": "Open zone transfers hand an attacker the whole network map; insecure dynamic updates let anyone overwrite records. DHCP servers not authorized in AD are rogue.", "task": "list DNS zones with their transfer and update settings", "t": "Get-DnsServerZone", "ta": ["get-dnsserverzone | select zonename,zonetype,dynamicupdate,securesecondaries"], "area": "config"}]}, {"name": "Hunter", "badge": "🎯", "blurb": "Hunt and harden. Security baselines, credential-theft hardening, Active Directory attack surface (roastable and stale accounts), persistence hunting, SMB and LDAP signing, and version notes. Learn it first: Defense Ladder se7, \"Windows: credentials and the domain attack surface.\"", "items": [{"id": "A-01", "title": "Security policy as a file: secedit", "cmds": ["CMD> secedit /export /cfg C:\\Temp\\secpol.cfg", "  [System Access] MinimumPasswordAge = 1, MaximumPasswordAge = 60, MinimumPasswordLength = 12, PasswordComplexity = 1, PasswordHistorySize = 24, LockoutBadCount = 5, ResetLockoutCount = 30, LockoutDuration = 30, ClearTextPassword = 0, EnableGuestAccount = 0", "CMD> secedit /configure /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg /areas SECURITYPOLICY", "CMD> secedit /analyze /db C:\\Windows\\security\\local.sdb /cfg C:\\Temp\\secpol.cfg"], "why": "One file, every account policy, repeatable and auditable, and the only command-line path to complexity and reversible encryption.", "note": "A typo in the .cfg is silently ignored. Verify with net accounts. Member servers only: on a DC the domain policy wins (B-06).", "task": "export the local security policy to C:\\Temp\\secpol.cfg", "t": "secedit /export /cfg C:\\Temp\\secpol.cfg", "area": "config"}, {"id": "A-02", "title": "LSA and anonymous-access registry hardening", "cmds": ["PS> $lsa='HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Lsa'", "PS> Set-ItemProperty -Path $lsa -Name LimitBlankPasswordUse -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymous -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name RestrictAnonymousSAM -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name NoLMHash -Value 1 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name LmCompatibilityLevel -Value 5 -Type DWord", "PS> Set-ItemProperty -Path $lsa -Name EveryoneIncludesAnonymous -Value 0 -Type DWord"], "why": "Null-session enumeration (RestrictAnonymous), LM hash storage that cracks in seconds (NoLMHash), and NTLMv1 downgrade (LmCompatibilityLevel 5). Check the level on older releases and mixed domains; Windows 11 24H2 and Windows Server 2025 remove NTLMv1.", "note": "This is the registry form of the Watchman Security Options.", "area": "config"}, {"id": "A-03", "title": "Credential-theft hardening: LLMNR, NetBIOS, WDigest", "cmds": ["PS> New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Force | Out-Null", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient' -Name EnableMulticast -Value 0 -Type DWord", "PS> Get-CimInstance Win32_NetworkAdapterConfiguration -Filter \"IPEnabled=TRUE\" | Invoke-CimMethod -MethodName SetTcpipNetbios -Arguments @{TcpipNetbiosOptions=2}", "PS> Set-ItemProperty -Path 'HKLM:\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\WDigest' -Name UseLogonCredential -Value 0 -Type DWord"], "why": "LLMNR and NBT-NS are what Responder poisons to collect NTLMv2 hashes for cracking or relay. WDigest set to 1 keeps plaintext passwords in LSASS memory for mimikatz.", "area": "config"}, {"id": "A-04", "title": "AutoRun and AutoPlay off everywhere", "cmds": ["PS> New-Item -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Force | Out-Null", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoDriveTypeAutoRun -Value 255 -Type DWord", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer' -Name NoAutorun -Value 1 -Type DWord"], "why": "USB-drop attacks. Conficker-era, still a CIS and STIG requirement.", "area": "malware"}, {"id": "A-05", "title": "User Rights Assignment", "cmds": ["GUI: secpol.msc, Local Policies, User Rights Assignment", "  Access this computer from the network = Administrators, Authenticated Users (remove Everyone and Guest)", "  Deny log on through Remote Desktop Services = Guest", "  Deny access to this computer from the network = Guest", "  Debug programs = empty, or Administrators only", "  Act as part of the operating system = empty", "  Allow log on locally = Administrators, Users", "CMD> whoami /priv"], "why": "Debug programs means read LSASS means dump every password. Rights are privileges that bypass ACLs, and attackers plant extra principals here.", "task": "show the privileges of the current user", "t": "whoami /priv", "area": "access"}, {"id": "A-06", "title": "Deep persistence and backdoor hunt", "cmds": ["PS> Get-CimInstance Win32_Process | Select-Object Name,ProcessId,ParentProcessId,CommandLine | Sort-Object Name", "PS> Get-ChildItem C:\\ -Recurse -Include nc.exe,ncat.exe,netcat*,mimikatz*,psexec*,*.ps1,*.vbs -ErrorAction SilentlyContinue | Select-Object FullName,LastWriteTime", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventFilter", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __EventConsumer", "PS> Get-CimInstance -Namespace root\\subscription -ClassName __FilterToConsumerBinding", "PS> $PROFILE | Select-Object *; Get-Content $PROFILE.AllUsersAllHosts -ErrorAction SilentlyContinue", "CMD> autorunsc.exe -accepteula -a * -c -nobanner   (Sysinternals, public)"], "why": "WMI event subscriptions and PowerShell profiles are the persistence spots checklists miss. Autoruns shows every auto-start location at once.", "note": "Download Sysinternals tools only from Microsoft (learn.microsoft.com/sysinternals), and only where policy allows third-party tools on the machine.", "area": "malware"}, {"id": "A-07", "title": "NTFS permissions", "cmds": ["CMD> icacls \"C:\\CompanyData\"", "CMD> icacls \"C:\\CompanyData\" /inheritance:r /grant:r \"Administrators:(OI)(CI)F\" \"Users:(OI)(CI)RX\" /t", "CMD> icacls \"C:\\CompanyData\" /remove:g Everyone /t", "PS> Get-Acl \"C:\\CompanyData\" | Format-List"], "why": "Everyone with Full control on a share or a Program Files folder means anyone can replace a binary that a service runs as SYSTEM. (OI) object inherit, (CI) container inherit, /t recurse, /inheritance:r stop inheriting.", "task": "show the ACL of C:\\CompanyData (cmd)", "t": "icacls C:\\CompanyData", "ta": ["icacls \"c:\\companydata\"", "get-acl c:\\companydata"], "area": "access"}, {"id": "A-08", "title": "Fine-grained auditing and PowerShell logging", "cmds": ["CMD> auditpol /set /subcategory:\"Logon\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Account Lockout\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"User Account Management\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Security Group Management\" /success:enable /failure:enable", "CMD> auditpol /set /subcategory:\"Process Creation\" /success:enable", "CMD> auditpol /set /subcategory:\"Audit Policy Change\" /success:enable /failure:enable", "PS> New-Item -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Force | Out-Null", "PS> Set-ItemProperty -Path 'HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\PowerShell\\ScriptBlockLogging' -Name EnableScriptBlockLogging -Value 1 -Type DWord"], "why": "Subcategory auditing overrides the legacy nine categories. Script Block Logging (event 4104) records what every PowerShell script actually did, including the attacker's.", "area": "audit"}, {"id": "A-09", "title": "Defender beyond on: exclusions, PUA, cloud, ASR", "cmds": ["PS> Get-MpPreference | Select-Object ExclusionPath,ExclusionProcess,ExclusionExtension", "PS> Remove-MpPreference -ExclusionPath \"C:\\evil\"", "PS> Set-MpPreference -PUAProtection Enabled -MAPSReporting Adv (function(){

function defaults(){return {learned:{},explain:{},drilled:{},best:{},run:{done:{},notes:{},elapsed:0,mins:20,lower:true},level:0,mode:'learn',sel:{},theme:'auto'};}

try{const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);S=Object.assign(defaults(),o);S.run=Object.assign(defaults().run,o.run||{});}}catch(e){}

const PRE=/^(PS>|CMD>|GUI:|\$|#)\s?|^[A-Za-z0-9]+(\([\w\-]+\))?[#>]\s?/;
function splitCmd(c){const m=c.match(PRE);return m?[m[0].trim(),c.slice(m[0].length)]:['',c];}

function firstCmd(it){return (it.cmds||[]).find(c=>!/^GUI:/.test(c)&&PRE.test(c))||(it.cmds||[])[0]||'';}
function status(it){const l=!!S.learned[it.id],d=(S.drilled[it.id]||0)>0;return l&&d?'mastered':l?'learned':d?'drilled':'none';}

function badge(li){const L=APP.levels[li];const learned=L.items.filter(i=>S.learned[i.id]).length;const best=S.best[li]||0;return {learned,total:L.items.length,best,earned:best>=80&&learned>=Math.ceil(L.items.length*.8)};}

    +legendHtml()+termBlock(it.cmds,true)
    +(it.gui?'<p class="run-in"><b>In the GUI.</b> '+esc(it.gui)+'</p>':'')
    +'<p class="run-in"><b>Why it matters.</b> '+dlLinks(esc(it.why))+'</p>'
    +(it.note?'<p class="run-in"><b>Watch out.</b> '+dlLinks(esc(it.note))+'</p>':'')
    +'<div class="explain"><div><b>Explain it in one sentence, no jargon.</b> If you can say why, you own it.</div><textarea data-explain="'+esc(it.id)+'" placeholder="Example: this stops someone from guessing passwords all day">'+esc(S.explain[it.id]||'')+'</textarea><label><input type="checkbox" data-learn="'+esc(it.id)+'" '+(S.learned[it.id]?'checked':'')+'> I can explain this</label></div>'
    +'<div class="nav"><button class="btn" data-step="-1" '+(idx===0?'disabled':'')+'>Previous</button><button class="btn" data-step="1" '+(idx===L.items.length-1?'disabled':'')+'>Next</button></div></div>';
  return '<p class="lead">'+dlLinks(esc(L.blurb))+'</p><div class="learn">'+list+detail+'</div>';
}
/* drill */
let Q=null;
function makeQuiz(li){
  const items=shuffle(APP.levels[li].items.slice());const pool=allItems;const qs=[];
  const distract=(it,fn,n)=>shuffle(pool.filter(o=>o.id!==it.id&&fn(o)).map(fn)).filter((v,i,a)=>v&&a.indexOf(v)===i).slice(0,n);
  const cmdOf=it=>stripped(firstCmd(it));
  items.slice(0,4).forEach(it=>{const c=cmdOf(it);const opts=shuffle([{t:c,ok:true},...distract(it,cmdOf,3).map(t=>({t,ok:false}))]);qs.push({type:'which',item:it,prompt:'Which command does this?  '+it.title,opts,cmd:true});});
  items.slice(4,6).forEach(it=>{const opts=shuffle([{t:it.title,ok:true},...distract(it,o=>o.title,3).map(t=>({t,ok:false}))]);qs.push({type:'what',item:it,prompt:'What does this command do?',block:[firstCmd(it)],opts});});
  const typed=items.filter(i=>i.t).slice(0,2);typed.forEach(it=>qs.push({type:'type',item:it,prompt:'Type the command: '+(it.task||it.title)}));
  const sp=shuffle((APP.spot||[]).filter(s=>(s.lvl==null?0:s.lvl)<=li));if(sp.length)qs.push(Object.assign({type:'spot'},sp[0]));
  const jd=shuffle((APP.judge||[]).filter(s=>(s.lvl==null?0:s.lvl)<=li));jd.slice(0,2).forEach(j=>qs.push(Object.assign({type:'judge'},j)));
  return {li,qs:shuffle(qs).slice(0,10),i:0,correct:0,done:false,fb:null};
}
function renderDrill(){
  const L=APP.levels[S.level];
  if(!Q||Q.li!==S.level||Q.finished){const b=badge(S.level);return '<div class="q"><h2>'+esc(L.name)+' drill</h2><p class="lead">Ten questions pulled from this level: pick the command, read a command, type one from memory, spot the finding in real output, and call fix or break. 80% earns the '+esc(L.name)+' badge once you have learned '+Math.ceil(L.items.length*.8)+' of '+L.items.length+' items.</p><p>Best so far: <b class="mono">'+(b.best||0)+'%</b>'+(b.earned?' <span class="chip">badge earned '+L.badge+'</span>':'')+'</p><button class="btn primary" data-act="startq">Start the drill</button></div>';}
  const q=Q.qs[Q.i];let body='';
  if(q.type==='which'||q.type==='what'){body=(q.block?termBlock(q.block,false):'')+'<div class="opts">'+q.opts.map((o,i)=>'<button data-opt="'+i+'" class="'+(q.cmd?'cmd ':'')+(Q.fb?(o.ok?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+esc(o.t)+'</button>').join('')+'</div>';}
  else if(q.type==='type'){body='<input class="typein" data-type="1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type it here" '+(Q.fb?'disabled value="'+esc(Q.fb.given)+'"':'')+'>'+(Q.fb?'':'<div class="nav"><button class="btn primary" data-act="check">Check</button><button class="btn" data-act="skip">Show me</button></div>');}
  else if(q.type==='spot'){body='<p>'+esc(q.ask||'Tap the line that is the finding.')+'</p><div class="opts">'+q.lines.map((l,i)=>'<button data-opt="'+i+'" class="cmd '+(Q.fb?(i===q.finding?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+esc(l)+'</button>').join('')+'</div>';}
  else if(q.type==='judge'){body='<div class="brief"><b>Scenario brief says:</b> '+esc(q.brief)+'</div><p><b>You do this:</b> '+esc(q.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-opt="'+i+'" class="'+(Q.fb?(k===q.answer?'ok':(Q.fb.pick===i?'bad':'')):'')+'" '+(Q.fb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>';}
  const fb=Q.fb?'<div class="fb '+(Q.fb.ok?'ok':'bad')+'" aria-live="polite"><b>'+(Q.fb.ok?'Right.':'Not this time.')+'</b> '+esc(Q.fb.text)+'</div><button class="btn primary" data-act="next">'+(Q.i===Q.qs.length-1?'See results':'Next question')+'</button>':'';
  return '<div class="q"><div class="count">Question '+(Q.i+1)+' of '+Q.qs.length+' · '+Q.correct+' correct</div><h2>'+esc(q.prompt||(q.type==='spot'?'Spot the finding':'Fix or break?'))+'</h2>'+body+fb+'</div>';
}
function answer(pick,given){
  const q=Q.qs[Q.i];let ok=false,text='';
  if(q.type==='which'||q.type==='what'){ok=q.opts[pick].ok;text=q.item.why;}
  else if(q.type==='spot'){ok=pick===q.finding;text=q.why;}
  else if(q.type==='judge'){ok=['fix','breaks','check'][pick]===q.answer;text=q.why;}
  else if(q.type==='type'){const g=norm(given);const acc=[q.item.t].concat(q.item.ta||[]).map(norm);ok=acc.includes(g);text=(ok?'':'Answer: '+q.item.t+'. ')+q.item.why;}
  if(ok){Q.correct++;if(q.item){S.drilled[q.item.id]=(S.drilled[q.item.id]||0)+1;save();}}
  Q.fb={ok,text,pick,given:given||''};
}
function finishQuiz(){const pct=Math.round(100*Q.correct/Q.qs.length);S.best[Q.li]=Math.max(S.best[Q.li]||0,pct);save();Q.finished=true;const b=badge(Q.li);const L=APP.levels[Q.li];
  return '<div class="result"><div class="big">'+pct+'%</div><p>'+Q.correct+' of '+Q.qs.length+' right. '+(b.earned?'The '+esc(L.name)+' badge is yours: '+L.badge:(pct>=80?'Score is there; learn '+(Math.ceil(L.items.length*.8)-b.learned)+' more items for the badge.':'Reread the misses in Learn and run it again.'))+'</p><div class="nav"><button class="btn primary" data-act="startq">Run it again</button><button class="btn" data-mode-go="learn">Back to Learn</button></div></div>';}
/* run */
let tick=null;const OPEN=new Set();
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function renderRun(){
  const R=S.run;const items=allItems.filter(i=>i.li===S.level||(R.lower&&i.li<S.level));
  const remain=Math.max(0,R.mins*60-R.elapsed);
  const rows=items.map(i=>'<div class="chk '+(R.done[i.id]!=null?'done':'')+'"><input type="checkbox" data-done="'+i.id+'" '+(R.done[i.id]!=null?'checked':'')+' aria-label="Done: '+esc(i.title)+'"><div><div class="t"><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span>'+(R.done[i.id]!=null?'<span class="stamp">'+fmt(R.done[i.id])+'</span>':'')+'<button class="btn small" data-show="'+i.id+'">Commands</button></div><div id="show-'+i.id+'"'+(OPEN.has(i.id)?'':' hidden')+'>'+termBlock(i.cmds,true)+'</div><input class="note" data-note="'+i.id+'" placeholder="Change log: what you changed and why" value="'+esc(R.notes[i.id]||'')+'"></div></div>').join('');
  return '<h2>Run the checklist on your VM</h2><p class="lead">Set the clock, work the list top to bottom, tick each item when it is actually done on the machine, and write a one-line change log. The log is what lets you undo a change that broke something in thirty seconds.</p>'+legendHtml()
   +'<div class="timer"><div class="clock" aria-live="off">'+fmt(remain)+'</div><select data-mins>'+[20,45,60,90,120].map(m=>'<option value="'+m+'" '+(m===R.mins?'selected':'')+'>'+m+' min</option>').join('')+'</select><button class="btn primary" data-act="timer">'+(tick?'Pause':'Start')+'</button><button class="btn" data-act="resetclock">Reset clock</button><label class="toggle"><input type="checkbox" data-lower '+(R.lower?'checked':'')+'> include lower levels</label></div>'
   +'<div class="nav" style="margin:0 0 10px"><button class="btn small" data-act="copylog">Copy change log</button><button class="btn small" data-act="dlog">Download change log</button><button class="btn small" data-act="clearrun">Clear this run</button></div>'
   +rows;
}
function changeLog(){const R=S.run;const lines=allItems.filter(i=>R.done[i.id]!=null||R.notes[i.id]).sort((a,b)=>(R.done[a.id]??1e9)-(R.done[b.id]??1e9)).map(i=>'['+(R.done[i.id]!=null?fmt(R.done[i.id]):'--:--')+'] '+i.id+' '+i.title+(R.notes[i.id]?' -- '+R.notes[i.id]:''));
  return '# Change log - '+APP.os+' - '+new Date().toLocaleString()+'\n'+(lines.join('\n')||'(nothing logged yet)')+'\n';}
function startTimer(){if(tick)return;tick=setInterval(()=>{S.run.elapsed++;if(S.run.elapsed%5===0)save();const c=document.querySelector('.clock');if(c)c.textContent=fmt(Math.max(0,S.run.mins*60-S.run.elapsed));if(S.run.elapsed>=S.run.mins*60){stopTimer();render();}},1000);}
function stopTimer(){clearInterval(tick);tick=null;save();}
/* games */
let G={tab:'imposter',sc:0,picks:{},checked:false,jq:null,streak:0,jfb:null};
function renderGames(){
  const tabs='<div class="tabs"><button class="btn '+(G.tab==='imposter'?'primary':'')+'" data-gtab="imposter">Who is the imposter?</button><button class="btn '+(G.tab==='judge'?'primary':'')+'" data-gtab="judge">Fix or break?</button></div>';
  if(G.tab==='imposter'){const sc=APP.imposter[G.sc];
    const rows=sc.accounts.map((a,i)=>{const p=G.picks[i]||'keep';const cls=G.checked?(p===a.truth?'ok':'bad'):'';return '<div class="acct '+cls+'"><div class="n">'+esc(a.name)+'<small>'+esc(a.info)+'</small></div><div class="seg">'+['keep','remove'].concat(a.admin?['demote']:[]).map(k=>'<button data-pick="'+i+'" data-val="'+k+'" class="'+(p===k?'on':'')+'" '+(G.checked?'disabled':'')+'>'+({keep:'Keep',remove:'Remove',demote:'Demote'})[k]+'</button>').join('')+'</div></div>'+(G.checked&&p!==a.truth?'<div class="fb bad">'+esc(a.why)+'</div>':'');}).join('');
    const right=G.checked?sc.accounts.filter((a,i)=>(G.picks[i]||'keep')===a.truth).length:0;
    return tabs+'<h2>'+esc(sc.title)+'</h2><p class="lead">Read the scenario brief, then decide for every account: keep it, remove it, or demote it from admin. The brief is the documented source of truth; when it is unclear, ask the system owner before you delete anything.</p><div class="brief"><b>Scenario brief</b><ul>'+sc.brief.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>'+termBlock(sc.output,false)+rows
      +(G.checked?'<div class="fb '+(right===sc.accounts.length?'ok':'bad')+'" style="max-width:720px">'+right+' of '+sc.accounts.length+' correct. '+esc(sc.debrief)+'</div>':'')+'<div class="nav"><button class="btn primary" data-act="'+(G.checked?'nextsc':'checksc')+'">'+(G.checked?'Next scenario':'Check my calls')+'</button></div>';
  }
  if(!G.jq){G.jq=shuffle(APP.judge.slice());}const j=G.jq[0];
  const fb=G.jfb?'<div class="fb '+(G.jfb.ok?'ok':'bad')+'"><b>'+(G.jfb.ok?'Right.':'Not this time.')+'</b> '+esc(j.why)+'</div><button class="btn primary" data-act="jnext">Next</button>':'';
  return tabs+'<div class="q"><div class="streak">streak '+G.streak+'</div><h2>Fix or break?</h2><div class="brief"><b>Scenario brief says:</b> '+esc(j.brief)+'</div><p><b>You do this:</b> '+esc(j.action)+'</p><div class="opts">'+['fix','breaks','check'].map((k,i)=>'<button data-jopt="'+k+'" class="'+(G.jfb?(k===j.answer?'ok':(G.jfb.pick===k?'bad':'')):'')+'" '+(G.jfb?'disabled':'')+'>'+({fix:'Fix: do it',breaks:'Do not: it breaks a requirement',check:'Check the brief or preserve evidence first'})[k]+'</button>').join('')+'</div>'+fb+'</div>';
}
/* report */
function renderReport(){
  const lv=APP.levels.map((L,i)=>{const b=badge(i);return '<div class="lv"><div class="row"><span>'+(b.earned?L.badge+' ':'')+esc(L.name)+'</span><span class="mono">'+b.learned+'/'+b.total+' learned · best '+(b.best||0)+'%</span></div><div class="bar2 '+(b.earned?'earned':'')+'"><i style="width:'+Math.round(100*b.learned/b.total)+'%"></i></div></div>';}).join('');
  const rows=allItems.map(i=>{const st=status(i);const g={mastered:'✓',learned:'◐',drilled:'◔',none:'·'}[st];return '<div class="rr '+st+'" data-rr="'+i.id+'"><span class="g">'+g+'</span><span class="id">'+esc(i.id)+'</span><span>'+esc(i.title)+'</span><span class="pt">'+itemScore(i)+'</span></div>';}).join('');
  return '<h2>Progress report</h2>'+lv+'<p style="font-size:.8rem;color:var(--muted)">✓ learned and drilled · ◐ learned · ◔ drilled only</p>'+rows+'<div class="total"><span>Total</span><span>'+score()+' / '+maxScore+'</span></div>';
}
function renderFoot(){$('#foot').innerHTML=esc(APP.footer||'Training tool for virtual machines you own or are authorized to change. No scripts here on purpose: type it, read it, explain it, and write your own checklist.')+' <button data-act="reset">Reset my progress</button>';}
function render(){
  if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches)S.mode='learn';
  renderHeader();
  const v=$('#view');const m=S.mode;
  v.innerHTML=m==='learn'?renderLearn():m==='drill'?renderDrill():m==='run'?renderRun():m==='games'?renderGames():'';
  $('#report').innerHTML=renderReport();renderFoot();
  if(m==='drill'&&Q&&!Q.finished&&!Q.fb){const t=v.querySelector('.typein');if(t)t.focus();}
  if(m==='learn'){const on=v.querySelector('.list button.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'});}
}
/* events */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.level!=null){S.level=+d.level;if(S.mode==='drill'&&Q&&Q.li!==S.level)Q=null;save();render();return;}
  if(d.mode){S.mode=d.mode;save();render();return;}
  if(d.modeGo){S.mode=d.modeGo;save();render();return;}
  if(d.sel){S.sel[S.level]=d.sel;save();render();return;}
  if(d.step){const L=APP.levels[S.level];const cur=S.sel[S.level]||L.items[0].id;const i=L.items.findIndex(x=>x.id===cur)+(+d.step);if(L.items[i]){S.sel[S.level]=L.items[i].id;save();render();}return;}
  if(d.act==='copy'){const term=b.closest('.term');const lines=[...term.querySelectorAll('.ln:not(.c)')].map(n=>n.textContent.replace(PRE,'')).filter(l=>l.trim()).join('\n');copyText(lines,b);return;}
  if(d.act==='startq'){Q=makeQuiz(S.level);render();return;}
  if(d.opt!=null&&S.mode==='drill'&&Q&&!Q.fb){answer(+d.opt);render();return;}
  if(d.act==='check'){const t=$('.typein');answer(null,t?t.value:'');render();return;}
  if(d.act==='skip'){answer(null,'');render();return;}
  if(d.act==='next'){if(Q.i===Q.qs.length-1){$('#view').innerHTML=finishQuiz();renderHeader();$('#report').innerHTML=renderReport();}else{Q.i++;Q.fb=null;render();}return;}
  if(d.act==='timer'){tick?stopTimer():startTimer();render();return;}
  if(d.act==='resetclock'){stopTimer();S.run.elapsed=0;save();render();return;}
  if(d.act==='clearrun'){if(confirm('Clear all ticks, timestamps and notes for this run?')){stopTimer();S.run.done={};S.run.notes={};S.run.elapsed=0;save();render();}return;}
  if(d.act==='copylog'){copyText(changeLog(),b);return;}
  if(d.act==='dlog'){const blob=new Blob([changeLog()],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='change-log-'+APP.key+'.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}
  if(d.show){const el=document.getElementById('show-'+d.show);if(el){el.hidden=!el.hidden;if(el.hidden)OPEN.delete(d.show);else OPEN.add(d.show);}return;}
  if(d.gtab){G.tab=d.gtab;G.jfb=null;render();return;}
  if(d.pick!=null&&!G.checked){G.picks[d.pick]=d.val;render();return;}
  if(d.act==='checksc'){G.checked=true;render();return;}
  if(d.act==='nextsc'){G.sc=(G.sc+1)%APP.imposter.length;G.picks={};G.checked=false;render();return;}
  if(d.jopt&&!G.jfb){const j=G.jq[0];const ok=d.jopt===j.answer;G.streak=ok?G.streak+1:0;G.jfb={ok,pick:d.jopt};render();return;}
  if(d.act==='jnext'){G.jq.push(G.jq.shift());G.jfb=null;render();return;}
  if(d.act==='reset'){if(confirm('Erase all progress for this trainer on this browser?')){stopTimer();S=defaults();save();Q=null;render();}return;}
  if(b.id==='theme'){S.theme=S.theme==='auto'?'light':S.theme==='light'?'dark':'auto';save();renderHeader();return;}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
  if(d.learn){const was=status(byId[d.learn]);S.learned[d.learn]=e.target.checked;if(!e.target.checked)delete S.learned[d.learn];save();render();const now=status(byId[d.learn]);if(now==='mastered'&&was!=='mastered'){const r=document.querySelector('[data-rr="'+d.learn+'"]');if(r)r.classList.add('flip');}return;}
  if(d.done){if(e.target.checked)S.run.done[d.done]=S.run.elapsed;else delete S.run.done[d.done];save();render();return;}
  if(d.mins!=null){S.run.mins=+e.target.value;S.run.elapsed=0;save();render();return;}
  if(d.lower!=null){S.run.lower=e.target.checked;save();render();return;}
});
document.addEventListener('input',e=>{const d=e.target.dataset;
  if(d.explain){S.explain[d.explain]=e.target.value;save();return;}
  if(d.note){S.run.notes[d.note]=e.target.value;save();return;}
});
window.addEventListener('resize',()=>{if(S.mode==='report'&&window.matchMedia('(min-width:1101px)').matches){S.mode='learn';render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('typein')&&Q&&!Q.fb){answer(null,e.target.value);render();}});
render();
})();
</script>
