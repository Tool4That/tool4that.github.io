     alt:['A new inbound SSH connection (TCP port 22) arrives, and pf checks it against every rule from top to bottom.',
          'Rule 1, block in all, matches. The verdict so far is block, and pf keeps reading.',
          'Rule 2, pass out all keep state, covers outbound traffic, so this inbound packet passes it by.',
          'Rule 3, pass in on $ext_if proto tcp to ($ext_if) port 22 keep state, matches. The verdict is now pass.',
          'At the end of the rules, the last match wins: the packet passes, and pf records the connection in its state table, so the replies and later packets skip the rules.',
          'A packet for TCP port 80 matches only rule 1, so it is blocked.',
          'A rule marked quick decides at once and ends the search, and packets of a recorded connection skip the rules. iptables and ufw use the first match instead, so the same three lines there would block SSH.']}),
   COMPARE('Right now or at every boot: separate switches',[
     {name:'Right now',tag:'Lasts until a reboot',tone:'l2',
      svg:{label:'A switch turned on now, which lasts until the next reboot.',
       body:'<rect x="60" y="14" width="80" height="34" rx="17" fill="var(--tint2)" stroke="var(--l2)" stroke-width="2"/><circle cx="123" cy="31" r="12" fill="var(--l2)"/><text x="86" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">ON</text><text x="100" y="68" text-anchor="middle" font-size="10" fill="var(--ink-2)">until the next reboot</text>'},
      rows:[['Run a service','<code>service sshd start</code>'],['Load the pf rules','<code>pfctl -f /etc/pf.conf</code>'],['Turn pf filtering on','<code>pfctl -e</code>'],['Check it','<code>service sshd status</code>, <code>pfctl -sr</code>, and <code>pfctl -si</code>']],
      hook:'flipping a light switch.'},
     {name:'At every boot',tag:'Written to /etc/rc.conf',tone:'l4',
      svg:{label:'A circular arrow around the word boot: the setting applies again at every start.',
       body:'<path d="M100 8 A23 23 0 1 1 77 31" fill="none" stroke="var(--l4)" stroke-width="2.5" marker-end="url(#arrow-l4)"/><text x="100" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">boot</text><text x="100" y="68" text-anchor="middle" font-size="10" fill="var(--ink-2)">applied again at every start</text>'},
      rows:[['Run a service','<code>sysrc sshd_enable=YES</code>'],['Load the pf rules','<code>sysrc pf_rules=/etc/pf.conf</code>'],['Turn pf filtering on','<code>sysrc pf_enable=YES</code>'],['Check it','<code>sysrc -a</code> and <code>service -e</code>']],
      hook:'an alarm set for every morning.'}
   ],{bloom:'Apply',intro:'Each job has two switches. One acts now and is gone after a reboot; the other waits for the next boot. A finished change flips both.',
     note:'Loading and enabling are separate in pf as well: <code>pfctl -f</code> loads a ruleset and leaves filtering as it was, and <code>pfctl -e</code> turns filtering on with whatever rules are loaded. To run a service once while it stays disabled at boot, use <code>service sshd onestart</code>.',
     caption:'Check both columns after every change: <code>pfctl -si</code> shows Status: Enabled, and <code>sysrc -a</code> shows what the next boot will do.'}),
   COMPARE('Hunting on any Unix',[
     {name:'Linux',tag:'Debian, Ubuntu, and Mint',tone:'muted',
      rows:[['Swapped system binary','<code>debsums -c</code> lists files that differ from their packages'],['Hidden firewall rules','<code>ufw status</code> leaves out /etc/ufw/before.rules; read the loaded set with <code>iptables -S</code> or <code>nft list ruleset</code>'],['Immutable files','<code>chattr +i</code> blocks every change, even by root; <code>lsattr</code> shows the i'],['Hash a file','<code>sha256sum</code> and <code>md5sum</code>']]},
     {name:'FreeBSD',tag:'Base system plus pkg',tone:'l4',
      rows:[['Swapped system binary','<code>pkg check -s -a</code> for packages; <code>freebsd-update IDS</code> for the base'],['Hidden firewall rules','<code>pfctl -sr</code> shows an anchor as one line; <code>pfctl -sA</code> lists anchors, and <code>pfctl -a \'*\' -sr</code> prints their rules'],['Immutable files','<code>chflags schg</code>, shown by <code>ls -lo</code>; at securelevel 1 or higher the flag stays until a single-user reboot, so clear flags first and raise securelevel last'],['Hash a file','<code>sha256</code> and <code>md5</code>; recent releases also accept the GNU names']]}
   ],{bloom:'Analyze',intro:'A friendly view shows what a tool wrote; the hunt reads what the system actually runs.',
     note:'Account fixes on an immutable file fail with a misleading error, such as <code>useradd: cannot open /etc/passwd</code>, <code>Authentication token manipulation error</code>, or <code>Operation not permitted</code>: check the flags first.',
     caption:'Trust the loaded ruleset and the package database over the summary.'}),
   QUIZ('se1q','Check: FreeBSD',[
     ['Which group lets a user su to root on FreeBSD?',['sudo','wheel','admin','root'],1,'wheel. Membership in wheel is required to su, and sudo (if present) is configured separately.'],
     ['How do you enable a service at boot on FreeBSD?',['systemctl enable','edit /etc/rc.conf (or sysrc name_enable=YES)','update-rc.d','chkconfig on'],1,'rc.conf plus the service command. FreeBSD runs without systemd.'],
     ['The default rules file for pf is',['/etc/ufw/rules','/etc/pf.conf','/etc/iptables.rules','/etc/firewalld'],1,'/etc/pf.conf, loaded with pfctl -f and enabled with pfctl -e.'],
     ['Listening sockets with their process on FreeBSD:',['ss -tulnp','sockstat -4 -l','netstat only','lsof is the only option'],1,'sockstat -4 -l is the FreeBSD habit; ss is Linux-only.']
   ]),
   QUIZ('se1q2','Check: read FreeBSD like an auditor',[
     ['pf.conf holds, in order: block in all; pass in on $ext_if proto tcp to port 22 keep state; block in on $ext_if proto tcp to port 22. What happens to a new inbound SSH connection?',['Passed: rule 2 matched first','Passed: keep state overrides later rules','Blocked: the last matching rule decides','Passed: pf skips rules for SSH'],2,'pf keeps reading after a match, and the last match wins, so rule 3 blocks it. A quick keyword on rule 2 would end the search there.'],
     ['/etc/master.passwd shows toor:$6$Qx…:0:0::0:0:Bourne-again Superuser:/root: What does that tell you?',['toor holds a real password hash, so a second root login is open','It is normal: toor always holds a hash','toor is locked','toor is an ordinary user'],0,'toor is normal only while its hash field is *. A real hash lets someone sign in as UID 0.'],
     ['A teammate ran pkg upgrade and reports the FreeBSD server fully patched. Your call?',['Agree: pkg upgrade patches everything','Reboot to finish the patch','Reinstall the base','Check first: pkg upgrade patches packages, and the base needs freebsd-update unless the system uses pkgbase'],3,'Two layers, two update paths. freebsd-version -kru shows what the base runs now.'],
     ['The brief says the owner may need to recover a forgotten root password at the console. Do you mark the console insecure in /etc/ttys?',['Yes, on every machine','Check first: insecure protects single-user mode, and recovery then needs boot media, so confirm the owner accepts that','Leave /etc/ttys alone on every machine','Delete /etc/ttys'],1,'Weigh the control against the requirement it touches, and record the decision.']
   ]),
   LINKS('Go further',['fbsd','cis','stig','t4t-ld-fbsd'])
  ]},
 {id:'se7',title:'Windows: credentials and the domain attack surface',bloom:'Analyze',sum:'How credentials get stolen, how Kerberos gets attacked, and where attackers dig in after the baseline: Defender exclusions, deeper persistence, and writable service files.',
  blocks:[
   PATH('From the LAN to a password in hand',[
    {name:'Attacker on the LAN',tag:'starts empty-handed',tone:'bad',note:'Listens for name lookups that DNS failed to answer',via:'answers LLMNR or NBT-NS'},
    {name:'Victim connects',tag:'NTLMv2 hash captured',tone:'amber',note:'The victim’s machine sends its NTLM response to the fake server',via:'cracks it or relays it'},
    {name:'A foothold',tag:'admin on one machine',tone:'amber',note:'Reads LSASS memory, where WDigest set to 1 leaves plaintext passwords',via:'reuses what it finds'},
    {name:'Domain credentials',tag:'the goal',tone:'bad',note:'A cached domain admin password or hash opens every machine'}
   ],{intro:'Each hop has a setting that closes it.',note:'<b>Close each hop:</b> LLMNR and NetBIOS over TCP/IP off; NTLMv2 only, with SMB signing required (<a href="#junior/j1">Junior</a>); WDigest UseLogonCredential 0; NoLMHash 1; RestrictAnonymous 1; and LSA protection (RunAsPPL 1). The detail panel lists the registry paths.',caption:'Close the name-lookup trick, the old hash formats, and the plaintext cache, and the chain breaks at every link.'}),
   C('Kerberos and the attacks it invites','Understand',
    SEQ('A Kerberos sign-in',[
     ['Pre-authentication','The user proves the password to the domain controller with a timestamp encrypted by the password’s key.','l1'],
     ['Ticket-granting ticket (TGT)','The DC returns a TGT, encrypted with the krbtgt account’s key.','l2'],
     ['Service ticket','The user shows the TGT and asks for a ticket to a service named by its SPN; the DC encrypts that ticket with the service account’s key.','l3'],
     ['Access','The service reads the ticket and grants access.','l4']
    ],{caption:'Two keys matter: krbtgt’s, which locks every TGT, and each service account’s, which locks its tickets.'}),
    TIPS('<b>AS-REP roasting:</b> an account set to skip pre-authentication hands any requester a reply encrypted with its password key, to crack offline. Require pre-authentication.','<b>Kerberoasting:</b> any domain user can request a service ticket for an account with an SPN and crack its password offline. Give service accounts long random passwords, or use group managed service accounts (gMSA), whose passwords Windows rotates.','<b>Unconstrained delegation</b> lets a server keep users’ TGTs; keep it to the domain controllers.')),
   C('After the baseline: where attackers dig in','Analyze',TIPS('<b>Defender on is step one.</b> Attackers add exclusions rather than switch Defender off, so read Get-MpPreference for ExclusionPath, ExclusionProcess, and ExclusionExtension next. PUA protection, cloud protection, attack surface reduction (ASR) rules, controlled folder access, and network protection add layers beyond real-time scanning.','<b>Persistence beyond tasks and Run keys:</b> services, WMI event subscriptions, PowerShell profiles, and odd parent-child process chains. Autoruns from Sysinternals lists every auto-start place at once; for Linux, <a href="#junior/j3">Where persistence hides on Linux</a> maps the same places.','<b>Writable service files.</b> Whoever can replace the file a SYSTEM service runs becomes SYSTEM, so Everyone or Users holding write access on a service binary or its folder is a finding. Read it with icacls, as in <a href="#freshman/f5">Freshman</a>.')),
   SPOT('se7sp','Spot the openings','Excerpts from a member server, where the HealthAgent service runs as SYSTEM from C:\\Program Files\\HealthAgent. Tap every line an attacker could use, then Check.',[
    ['PS> icacls "C:\\Program Files\\HealthAgent"',null],
    ['C:\\Program Files\\HealthAgent NT AUTHORITY\\SYSTEM:(OI)(CI)(F)',null],
    ['                               BUILTIN\\Administrators:(OI)(CI)(F)',null],
    ['                               BUILTIN\\Users:(OI)(CI)(M)','Users can modify the folder of a service that runs as SYSTEM, so any user can swap its program and become SYSTEM. Remove the Modify grant.'],
    ['PS> Get-MpPreference | Select-Object ExclusionPath',null],
    ['{C:\\Users\\Public}','Defender skips a folder every user can write to: a ready-made malware drop. Remove the exclusion.'],
    ['PS> Get-ADUser -Filter * -Properties DoesNotRequirePreAuth,ServicePrincipalName | Select-Object Name,DoesNotRequirePreAuth,ServicePrincipalName',null],
    ['alice      False   {}',null],
    ['svc_sql    False   {MSSQLSvc/db1.example.com:1433}','A user account with an SPN is a Kerberoasting target. Give it a long random password, or move the service to a gMSA.'],
    ['bob        True    {}','Pre-authentication is off for bob, so anyone can request an AS-REP and crack it offline. Set DoesNotRequirePreAuth to False.']
   ]),
   QUIZ('se7q','Check: weigh the change',[
    ['The brief names a legacy lab instrument that signs in with NTLMv1. Do you set the LAN Manager authentication level to refuse LM and NTLM today?',['Set it to send LM','Check first: confirm the device and plan its replacement, because the setting would lock it out','Remove the device from the brief','Yes, at once'],1,'A secure setting that breaks a required device is an outage. Raise the level once the owner accepts the plan.'],
    ['Why does WDigest UseLogonCredential = 1 matter?',['It speeds up sign-in','It encrypts the SAM','It turns on Kerberos','LSASS then keeps plaintext passwords in memory for any admin-level tool to read'],3,'Set it to 0 so only hashes stay in memory, and add LSA protection.'],
    ['Defender reports real-time protection on, yet a known tool ran from C:\\Users\\Public\\tools. What do you check next?',['The exclusions in Get-MpPreference','Windows Update history','The DNS cache','The screen saver'],0,'Attackers add exclusions rather than switch Defender off.'],
    ['A service account with an SPN has had the same 12-character password for years. Best fix?',['Add the account to Domain Admins','Keep it, since services need stable passwords','Move it to a gMSA, or give it a long random password and update the service’s stored credentials','Delete the SPN'],2,'Kerberoasting cracks short service passwords offline. Change the stored credentials together with the password, so the service keeps running.']
   ]),
   DETAIL('Credential-protection registry values',TIPS('<b>HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa:</b> LimitBlankPasswordUse 1, RestrictAnonymous 1, RestrictAnonymousSAM 1, NoLMHash 1, LmCompatibilityLevel 5 (0 sends LM and NTLMv1), EveryoneIncludesAnonymous 0, and RunAsPPL 1 (LSA protection).','<b>WDigest:</b> HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\WDigest UseLogonCredential 0.','<b>LLMNR:</b> HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient EnableMulticast 0. <b>NetBIOS over TCP/IP:</b> NetbiosOptions 2 in each adapter’s Tcpip_ key under HKLM\\SYSTEM\\CurrentControlSet\\Services\\NetBT\\Parameters\\Interfaces; the SetTcpipNetbios method with TcpipNetbiosOptions 2 writes it for you.','<b>SMB signing:</b> Set-SmbServerConfiguration and Set-SmbClientConfiguration -RequireSecuritySignature $true. <b>LDAP on a DC:</b> NTDS\\Parameters LDAPServerIntegrity 2 and LdapEnforceChannelBinding 2.')),
   DETAIL('AD queries, hunting, and Defender settings',TIPS('<b>AD attack-surface queries:</b> Search-ADAccount -PasswordNeverExpires; Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00; Get-ADUser -Filter {DoesNotRequirePreAuth -eq $true}; Get-ADUser -Filter {PasswordNotRequired -eq $true}; Get-ADUser -Filter {ServicePrincipalName -like "*"} -Properties ServicePrincipalName; Get-ADUser -Filter {AdminCount -eq 1}; Get-ADComputer -Filter {TrustedForDelegation -eq $true}. Fix flags with Set-ADAccountControl, and update a service’s stored credentials whenever its password changes.','<b>Hunting:</b> WMI subscriptions with Get-CimInstance -Namespace root\\subscription (__EventFilter, CommandLineEventConsumer, and __FilterToConsumerBinding); PowerShell profiles at $PROFILE.AllUsersAllHosts and $PROFILE.CurrentUserAllHosts; process chains with Get-CimInstance Win32_Process (ParentProcessId and CommandLine); autorunsc.exe from Sysinternals.','<b>Defender:</b> Get-MpPreference ExclusionPath, ExclusionProcess, and ExclusionExtension; ASR rule GUIDs from Microsoft’s reference.','<b>Advanced auditing:</b> auditpol /set /subcategory:"Process Creation" /success:enable, plus the ScriptBlockLogging policy key; subcategories worth turning on include Logon, Account Lockout, User Account Management, Security Group Management, Process Creation, and Audit Policy Change.','<b>AutoRun:</b> NoDriveTypeAutoRun 255 and NoAutorun 1 block USB-drop attacks. <b>OpenSSH Server</b> installs as a capability (Get-WindowsCapability -Online), and its firewall rule opens port 22; harden it as in <a href="#sophomore/s3">Linux Mint and Ubuntu hardening</a>.')),
   LINKS('Go further',['ms-win-sec','ms-sysint','ms-baselines','t4t-ld-win11','t4t-ld-winsrv','t4t-lr-win'])
  ]},
 {id:'se2',title:'Web application security',bloom:'Analyze',sum:'The OWASP Top 10, the risks behind it, and how to harden a small web stack.',
  blocks:[
   C('What to know','Understand',
     P('Most organizations run at least one small web application: an intranet, a shop, or a ticket system. Securing it rewards understanding the common web risks and the configuration of the server behind them, far more than writing exploits.'),
     TIPS('Learn the <b>OWASP Top 10 (2025)</b> by name and idea: broken access control (number one), security misconfiguration, software supply chain failures, cryptographic failures, injection (SQL, command), insecure design, authentication failures, software or data integrity failures, security logging and alerting failures, and mishandling of exceptional conditions. Two to know cold: <b>injection</b> means untrusted input changes a query or command (a quote that breaks a SQL statement), and <b>security misconfiguration</b> means a setting left unsafe (directory listing, sample apps, or verbose errors). The detail panel gives every category one line.',
          'Server side, the familiar areas return: patch the web server (Apache/nginx) and language runtime, remove default pages and sample apps, disable directory listing, set correct file permissions, and run the service as a low-privileged user.',
          'Credentials: replace default admin passwords, keep secrets out of world-readable config files, and limit database accounts to what the app needs.',
          'Practice safely on a deliberately vulnerable app you run locally, and only ever on systems you own.'),
    COMPARE('Who are you, what may you do, and what did you do?',[
     {name:'Authentication',tag:'Who are you?',tone:'l1',
      svg:{label:'An ID card: authentication checks who you are.',
       body:'<rect x="62" y="10" width="76" height="52" rx="6" fill="var(--paper)" stroke="var(--l1)" stroke-width="2"/><circle cx="84" cy="30" r="9" fill="none" stroke="var(--l1)" stroke-width="2"/><path d="M71 54 Q84 38 97 54" fill="none" stroke="var(--l1)" stroke-width="2"/><path d="M106 26 H130 M106 36 H130 M106 46 H122" fill="none" stroke="var(--ink-3)" stroke-width="2"/>'},
      rows:[['Job','Proves the identity a user claims, with a password, a passkey, or a second factor'],['Fails as','<b>A07</b> Authentication Failures: guessable or reused passwords, missing MFA, and sessions that stay valid forever'],['Example','A login form that accepts <code>admin</code> and <code>admin</code>']],
      hook:'showing your ID at the door.'},
     {name:'Authorization',tag:'What may you do?',tone:'l3',
      svg:{label:'Three doors: the badge opens Shop and Orders, and Admin stays locked for this user.',
       body:'<g fill="var(--paper)" stroke-width="2"><rect x="12" y="4" width="44" height="48" rx="3" stroke="var(--l3)"/><rect x="78" y="4" width="44" height="48" rx="3" stroke="var(--l3)"/><rect x="144" y="4" width="44" height="48" rx="3" stroke="var(--bad)"/></g><rect x="159" y="18" width="14" height="11" rx="2" fill="var(--bad)"/><path d="M162 18 V14 A4 4 0 0 1 170 14 V18" fill="none" stroke="var(--bad)" stroke-width="2"/><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="34" y="32">open</text><text x="100" y="32">open</text><text x="166" y="44">locked</text></g><g font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink-2)"><text x="34" y="69">Shop</text><text x="100" y="69">Orders</text><text x="166" y="69">Admin</text></g>'},
      rows:[['Job','Decides what that identity may use (pages, records, and actions), checked on the server for every request'],['Fails as','<b>A01</b> Broken Access Control, number one in 2025'],['Example','An admin panel anyone can open, or changing <code>?id=101</code> to <code>?id=102</code> to read someone else’s order']],
      hook:'the rooms your badge opens.'},
     {name:'Accounting',tag:'What did you do?',tone:'l4',
      svg:{label:'A log: each line records a time, a user, and an action.',
       body:'<rect x="10" y="4" width="180" height="66" rx="6" fill="var(--paper)" stroke="var(--l4)" stroke-width="2"/><g font-size="12" font-family="ui-monospace,Consolas,monospace" fill="var(--ink)"><text x="20" y="24">10:02 alex login</text><text x="20" y="43">10:03 alex view 101</text><text x="20" y="62">10:05 alex export</text></g>'},
      rows:[['Job','Records who did what, and when, so someone can review it and get an alert'],['Fails as','<b>A09</b> Security Logging and Alerting Failures'],['Example','Failed logins and admin actions that pass without a log entry or an alert']],
      hook:'the visitor log at the front desk.'}
   ],{intro:'The three A’s of AAA answer three different questions. A page anyone reaches <b>without logging in</b> is an authorization failure: the server skipped the question “may this person use it?”',
     note:'“Authorization” has a second meaning in this course: the system owner’s written permission to test or change a system. <a href="#freshman/f3">Security principles</a> introduced both meanings, and <a href="#senior/se5">Power and responsibility</a> returns to the second.',
     caption:'Authentication proves identity, authorization enforces permissions, and accounting keeps the record. OWASP ranks broken access control first.'}),
     CMDS('Harden a small web stack (Apache on Debian/Ubuntu)',[
       ['sudo apt update && sudo apt upgrade','Patch the server and the web/app packages first.'],
       ['sudo find /var/www -type f -perm -o+w 2>/dev/null','World-writable web files: tighten them.'],
       ['sudo chown -R root:www-data /var/www/html && sudo chmod -R g-w,o-w /var/www/html','Content owned by root, readable by the web server group, and writable only by root. Give the service write access only to the folders the app must write to.'],
       ['sudo nano /etc/apache2/apache2.conf','In the &lt;Directory /var/www/&gt; block change "Options Indexes FollowSymLinks" to "Options FollowSymLinks" to turn off directory listing.'],
       ['sudo nano /etc/apache2/conf-available/security.conf','Set ServerTokens Prod and ServerSignature Off, then sudo apachectl configtest && sudo systemctl reload apache2.'],
       ['grep -ri "password" /var/www 2>/dev/null','Hunt for credentials left in source or config.'],
       ['sudo ss -tulnp | grep -E ":80|:443|:3306"','Confirm only the expected web and database ports listen, and bind the database to localhost if only the app uses it.']
     ]),
     DETAIL('The OWASP Top 10 (2025) in one line each',TIPS('<b>A01 Broken access control:</b> users reach data or actions beyond their rights.','<b>A02 Security misconfiguration:</b> unsafe settings, sample apps, directory listing, and verbose errors.','<b>A03 Software supply chain failures:</b> compromised or unvetted dependencies and build pipelines.','<b>A04 Cryptographic failures:</b> weak or absent encryption for sensitive data.','<b>A05 Injection:</b> untrusted input changes a query or command, as in SQL injection, command injection, and cross-site scripting.','<b>A06 Insecure design:</b> the design itself leaves out a needed control.','<b>A07 Authentication failures:</b> guessable passwords, absent MFA, and sessions that live too long.','<b>A08 Software or data integrity failures:</b> unsigned updates, and untrusted data treated as code.','<b>A09 Security logging and alerting failures:</b> attacks pass unrecorded or unnoticed.','<b>A10 Mishandling of exceptional conditions:</b> errors that fail open or leak details.'))),
    ANATOMY('Reading a web file’s permissions',[
     {name:'-rw-r--r--  root  www-data  index.html',tag:'ls -l output',tone:'l2',grid:true,
      children:[
        {name:'Type',tone:'muted',text:'<code>-</code><br>a regular file (<code>d</code> marks a directory)'},
        {name:'Owner',tone:'l4',text:'<code>rw-</code><br>root: read and write'},
        {name:'Group',tone:'l3',text:'<code>r--</code><br>www-data: read'},
        {name:'Other',tone:'l1',text:'<code>r--</code><br>every other account: read'}]}
   ],{intro:'The command table above leaves the web files in this state. Read the mode in four parts: the type, then three triplets of read (r), write (w), and execute (x), for the owner, the group, and everyone else.',
     label:'The ls -l line for index.html, owned by root with group www-data, split into four parts: type -, owner rw-, group r--, and other r--.',
     strip:['Mode','- rw- r-- r--','type, then owner rw-, group r--, and other r--: mode 644.'],
     facts:{head:['','Owner','Group','Other'],rows:[
       ['Who','root','www-data, the group Apache’s workers run in','Every other account'],
       ['Bits','<code>rw-</code>','<code>r--</code>','<code>r--</code>'],
       ['Octal','6 (4 + 2)','4','4'],
       ['Can','Read and change the file','Read it, so Apache can serve it','Read it']]},
     note:'<code>find -perm -o+w</code> lists files whose <b>other</b> triplet holds <code>w</code>: any account can change them. <code>chmod g-w,o-w</code> takes <code>w</code> away from group and other and leaves the owner’s bits as they are. On a directory, <code>r</code> lists its entries, <code>w</code> adds or deletes them, and <code>x</code> lets you enter it. Grant the group write access only on folders the app writes to, such as uploads.',
     caption:'Root owns the content and alone can change it; Apache reads it through the www-data group. A hijacked web server gets read access only, and the files stay as root wrote them.',
     alt:['Type: - means a regular file; d marks a directory.',
          'Owner, root: rw-, read and write (octal 6).',
          'Group, www-data, the group Apache’s workers run in: r--, read only (octal 4), enough to serve the file.',
          'Other, every other account: r--, read only (octal 4).',
          'Together the mode is 644. find -perm -o+w lists files where other holds w; chmod g-w,o-w removes write from group and other and leaves the owner’s bits as they are.',
          'On a directory, r lists its entries, w adds or deletes them, and x lets you enter it. Give the group write access only on folders the app writes to, such as uploads.']}),
   QUIZ('se2q','Check: web hardening',[
     ['A small company web app has an admin panel anyone can reach without logging in. This is',['SQL injection','Broken access control','A firewall issue','Expected behavior'],1,'Reaching things beyond your permissions is broken access control, number one in the OWASP Top 10 (2025).'],
     ['Where should you practice web attacks and fixes?',['A random live website','A deliberately vulnerable app you run locally (for example OWASP Juice Shop)','Your school portal','A classmate’s site'],1,'Only systems you own or are authorized to test. Juice Shop is built for exactly this.'],
     ['A database account used by the web app has full admin rights to every database. Better posture?',['Leave it, it works','Grant only the privileges, on only the database, the app needs','Delete the database','Share the admin password with the team'],1,'Least privilege applies to database accounts too. Limit scope and privileges to the app’s actual needs.'],
     ['Directory listing shows every file under /files to any visitor. Fix on Apache?',['Add Indexes to Options','Remove Indexes from Options for that directory and set correct permissions','Rename the folder','Leave it as is, it is fine'],1,'Turn off directory listing and make sure only intended files are served.']
   ]),
   MATCH('se2m','Name the OWASP risk','Tap a finding, then the OWASP Top 10 category it belongs to.',[
     ['A login form accepts unlimited guesses and the password admin','Authentication failures','The server fails to prove who you are: no rate limit, and a default password.'],
     ['Changing ?id=101 to ?id=102 shows another customer’s order','Broken access control','The server skipped “may this user see it?”'],
     ['A single quote in the search box returns a SQL error','Injection','Untrusted input reached the query.'],
     ['/files/ lists every file to any visitor','Security misconfiguration','Directory listing is a setting left unsafe.'],
     ['Admin exports run without a log entry or an alert','Security logging and alerting failures','Accounting is missing, so the export goes unnoticed.']
   ],'Analyze'),
   LINKS('Go further',['owasp10','juice','cis','stig'])
  ]},
 {id:'se3',title:'Create: your own checklist',bloom:'Create',sum:'Build a per-OS hardening checklist from standards and vendor documentation: the single biggest speed multiplier.',
  blocks:[
   C('Why you build it yourself','Create',
     P('A checklist your team writes from <b>general documentation</b> (CIS Benchmarks, vendor docs, and DISA STIGs) is how the knowledge becomes yours. A copied list gives you steps without reasons, and when something breaks you are left guessing which step did it. This is the Create level of Bloom’s taxonomy: you are producing an original artifact from everything below.'),
     P('On Windows a checklist can become a <b>security template</b>: <code>secedit /export</code> captures the current policy, you edit it, <code>secedit /configure</code> applies it, and <code>secedit /analyze</code> compares a machine against it, so the baseline is repeatable and auditable.'),
     NOTE('Cite a source for every line (a CIS recommendation number, a Microsoft Learn page, or a man page), so you can re-check it when versions change. Check each source’s license and terms of use before you share anything copied from it.')),
    HIER('From framework to checklist line',[
     ['Framework: NIST CSF 2.0','Outcomes in six Functions: Govern, Identify, Protect, Detect, Respond, and Recover. It says what to achieve and leaves the settings to you.','l1'],
     ['Controls: CIS Controls v8.1','18 prioritized controls with safeguards, for a whole organization and any product. They say what to do first.','l2'],
     ['Configuration guides: CIS Benchmarks, DISA STIGs, and vendor baselines','Numbered settings per product and version. Benchmarks offer Level 1 and Level 2 profiles; STIGs, written for US Department of Defense systems, rate findings from CAT I (most severe) to CAT III; vendor baselines, such as Microsoft’s security baselines, often ship as importable policy.','l3'],
     ['Your checklist','One line per setting: what to check, the command or panel, the value, and the source it came from.','l4']
   ],{top:'Broad: what to achieve',bottom:'Exact: what to set',bloom:'Understand',
     intro:'These sources sit at different heights. Take exact settings from the configuration guides, and use the rungs above them to check that your list covers every area.',
     note:'Each rung maps onto the one above it: CIS Benchmark recommendations point to CIS Controls safeguards, and CIS maps the Controls to NIST CSF 2.0. A strong checklist line can cite a benchmark number and the control it serves.',
     caption:'Frameworks set goals, controls set priorities, and configuration guides give the exact values your checklist cites.'}),
   BUILDER('se3b','Checklist builder','Fill each section for one operating system. Export the text, then refine it after every practice session. Everything you type here stays in this browser.',[
     ['os','Operating system this checklist is for','e.g. Windows 11, Windows Server 2025, Linux Mint, Ubuntu, Debian, or FreeBSD'],
     ['first','First five minutes (orientation)','Read the scenario brief and investigation questions, and answer the questions before any change; note users, admins, and required services; record a baseline; snapshot if allowed; assign roles; start the change log.'],
     ['accounts','Account management and access control','List authorized users and admins; remove or disable the rest; strip extra admins; disable guest; set a password on every account; force resets on compromised accounts.'],
     ['policy','Password and lockout policy','Minimum length, history, age, and complexity per your policy; lockout threshold, duration, and reset window. Where to set it on this OS, and which standard you follow.'],
     ['firewall','Firewall','Default deny inbound, allow outbound, and open only required ports. The exact tool and commands for this OS.'],
     ['services','Services, startup, and persistence','Enumerate listening ports and running services; remove or disable insecure ones outside the brief; check scheduled tasks, cron, and rc.conf for persistence.'],
     ['updates','Patching and malware defenses','Patch the OS; enable automatic updates; confirm antivirus on and current (where applicable).'],
     ['files','Files, shares, and unauthorized software','Fix shares and dangerous permissions; find unauthorized media; uninstall unauthorized or remote-access software.'],
     ['forensics','Investigation approach','How you will find and answer: search, hash, and read logs; answer in the exact format; leave everything else untouched.'],
     ['verify','Verify and sweep','Re-run your baseline commands and compare; confirm every required service and user still works; mop up low-impact items (banners, screen lock, and logging).']
   ]),
   REFLECT('se3r','Which release is this line for?','Pick five lines from your checklist. For each, name the release it targets and how you would confirm the current default before acting: new installs of Windows 11 22H2 and later already lock out repeated wrong passwords, and 24H2 already requires SMB signing. Which line would you have called a finding on a machine that already had it right?'),
   DETAIL('Security templates and release defaults',TIPS('<b>[System Access] keys:</b> MinimumPasswordLength, PasswordComplexity (1 on), PasswordHistorySize, MaximumPasswordAge, MinimumPasswordAge, LockoutBadCount, LockoutDuration, ResetLockoutCount, and ClearTextPassword (0 keeps reversible encryption off).','<b>Commands:</b> <code>secedit /export /cfg C:\\Temp\\secpol.cfg</code> (create C:\\Temp first); <code>secedit /configure /db C:\\Windows\\security\\local.sdb /cfg FILE /areas SECURITYPOLICY</code>; <code>secedit /analyze</code> to compare.','<b>Release defaults:</b> new Windows 11 22H2 and later installs lock out after 10 attempts for 10 minutes; 24H2 requires SMB signing and removes NTLMv1, WMIC (now a feature on demand), Windows PowerShell 2.0, and Defender Application Guard; Windows Server 2025 signs all outbound SMB, and new AD deployments require LDAP signing. Read the current value before calling it a finding.')),
   LINKS('Go further',['cis','cis-controls','stig','ms-baselines','ubuntu-sec','fbsd'])
  ]},
 {id:'se4',title:'Create: roles, timing, and the runbook',bloom:'Create',sum:'Turn a small team and a fixed time window into a system: who does what, when, and how you hand off.',
  blocks:[
   C('A team is a design, built on purpose','Create',
     TIPS('<b>Assign machines to people.</b> Typically one or two people per machine and one who owns the network devices. Depth matters: everyone should be able to cover a second machine.',
          '<b>One scribe per machine</b> keeps <a href="#sophomore/s6">the change log</a>, and the runbook names each machine’s scribe.',
          '<b>A timekeeper</b> calls the clock: halfway, a quarter left, and fifteen minutes left (freeze changes; verify every required service and user still works).',
          '<b>Plan the session.</b> Rough split: the first fifteen to twenty minutes on the brief, the investigation questions, the baseline, and accounts; the bulk on the high-value areas; the last stretch on verification and low-impact items.',
          '<b>Debrief every run.</b> What did we miss, what broke, and what goes on the checklist. The debrief is the real practice.',
          'The same structure runs real maintenance windows and incident response: a lead, a scribe, a clock, and a written plan (NIST CSF 2.0 calls that last part Respond).')),
   PLANNER('se4pl'),
   TIMER('se4tm'),
   REFLECT('se4r','Write your team’s one-page runbook','In your own words: the order of operations for the first twenty minutes, who owns each machine and the network devices, who keeps the log, and the three checks the timekeeper calls out. Keep it to one page. Print it. Rehearse it.'),
   LINKS('Go further',['nist-csf','cis-controls','t4t-range'])
  ]},
 {id:'se6',title:'Cisco: audit and extend the two-site network',bloom:'Evaluate',sum:'Audit both sites, add a host route to 8.8.8.8, share it through OSPF, and defend every design choice.',
  blocks:[
   COMPARE('The finished network, both sites',[
     {name:'Site A',tag:'SwA and RtrA',tone:'l2',
      rows:[['VLANs and subnets','10 STUDENTS 10.1.10.0/24, 20 TEACHERS 10.1.20.0/24, and 30 PRINCIPALS 10.1.30.0/24; each gateway is .1 on RtrA'],
            ['Management SVI','SwA <code>interface vlan 20</code>, 10.1.20.2, gateway 10.1.20.1'],
            ['Native VLAN','99 on SwA G0/1 and RtrA g0/0.99, without hosts or an IP'],
            ['Trunk allowed list','10,20,30,99'],
            ['Unused ports','VLAN 999 PARKING, shut down'],
            ['Inter-site link','RtrA G0/2, 10.0.0.1/30'],
            ['ISP next hop','RtrA G0/1 203.0.113.2/30, next hop 203.0.113.1'],
            ['VTY ACL','ACL 20 permits 10.1.20.0/24 and 10.2.20.0/24, with <code>access-class 20 in</code> on every VTY line']]},
     {name:'Site B',tag:'SwB and RtrB',tone:'l3',
      rows:[['VLANs and subnets','10 STUDENTS 10.2.10.0/24, 20 TEACHERS 10.2.20.0/24, and 30 PRINCIPALS 10.2.30.0/24; each gateway is .1 on RtrB'],
            ['Management SVI','SwB <code>interface vlan 20</code>, 10.2.20.2, gateway 10.2.20.1'],
            ['Native VLAN','99 on SwB G0/1 and RtrB g0/0.99, without hosts or an IP'],
            ['Trunk allowed list','10,20,30,99'],
            ['Unused ports','VLAN 999 PARKING, shut down'],
            ['Inter-site link','RtrB G0/2, 10.0.0.2/30'],
            ['ISP next hop','RtrB G0/1 198.51.100.2/30, next hop 198.51.100.1'],
            ['VTY ACL','The same ACL 20 and <code>access-class 20 in</code> on every VTY line']]}
   ],{intro:'Two sites built from one plan: the same VLAN numbers, names, and rules, with 10.1 addresses at Site A and 10.2 addresses at Site B. Audit each device against this table.',
     note:'Why management sits on Teachers: <a href="#junior/j4">the access-class note in Junior</a>; the reflection at the end of this unit asks you to defend it.',
     caption:'Every row matches across the sites except the addresses: the second octet names the site.',
     bloom:'Evaluate'}),
   C('A host route to 8.8.8.8','Apply',
     CMDS('On RtrA (RtrB uses its own ISP next hop, 198.51.100.1)',[
       ['interface g0/1','The ISP uplink. Then: ip address 203.0.113.2 255.255.255.252 and no shutdown.'],
       ['ip route 8.8.8.8 255.255.255.255 203.0.113.1','A static host route: the /32 mask matches 8.8.8.8 and nothing else.'],
       ['show ip route 8.8.8.8','Verify: Routing entry for 8.8.8.8/32, Known via "static", distance 1.'],
       ['show ip route static','The same route in the table, under the header 8.0.0.0/32 is subnetted, 1 subnets: S 8.8.8.8 [1/0] via 203.0.113.1.']
     ]),
     P('A /32 mask matches exactly one address. Here the next hop sits in the connected subnet 203.0.113.0/30 on G0/1, and the router installs the route only while it can reach that next hop: when G0/1 goes down, the route leaves the table. A static route has administrative distance (AD) 1, so it beats a routing protocol’s route to the same prefix; a longer prefix still wins first (<a href="#junior/j4">Reading the routing table</a>).'),
     TIPS('<b>Edge ACLs are stateless.</b> Unlike the host firewalls in Sophomore, which track connections, an interface ACL judges each packet on its own, so an inbound ACL on the ISP uplink permits the published service plus the replies inside hosts need (established TCP, echo replies, and DNS answers) ahead of its final deny. <a href="#junior/j4">How a router reads an ACL</a> still applies.'),
     NOTE('203.0.113.0/24 and 198.51.100.0/24 are documentation ranges that stand in for real ISP addresses. 8.8.8.8 is a well-known public DNS resolver, used here as one destination worth a dedicated route.'),
     DETAIL('Edge ACLs and Senior device hardening',TIPS('<b>Edge ACL keywords:</b> <code>permit tcp any any established</code> (replies carrying ACK or RST), <code>permit icmp any any echo-reply</code>, <code>permit udp host 8.8.8.8 eq domain any</code> (DNS answers from that resolver), and <code>deny ip any any log</code>. An inbound ACL on the outside interface reads addresses before NAT translates them; a stateful zone-based firewall takes over where state matters.','<b>Edge interfaces:</b> no ip proxy-arp, no ip directed-broadcast, no ip redirects, no ip unreachables, and no ip mask-reply.','<b>AAA:</b> create a local user first, then <code>aaa new-model</code>, so the next login has an account to use.','<b>Resilient configuration:</b> secure boot-image, secure boot-config, and configuration change logging (archive, then log config).','<b>Switch defenses:</b> ip dhcp snooping with trusted uplinks (ip dhcp snooping trust), ip arp inspection on the user VLANs, and storm-control broadcast level 5 on edge ports.'))),
   C('Share the route through OSPF (concept)','Understand',
     CMDS('On RtrA (RtrB: the same, with 10.2.0.0)',[
       ['router ospf 1','Starts OSPF process 1; the number stays local to this router.'],
       ['network 10.0.0.0 0.0.0.3 area 0','Runs OSPF on the inter-site link, G0/2, so RtrA and RtrB become neighbors.'],
       ['network 10.1.0.0 0.0.255.255 area 0','Advertises every Site A subnet: 10.1.10.0, 10.1.20.0, and 10.1.30.0.'],
       ['passive-interface g0/0.10','Advertises the Students subnet while sending no hellos to its hosts. Repeat for g0/0.20 and g0/0.30.'],
       ['redistribute static subnets','Shares the static /32 to 8.8.8.8 with RtrB as an external route.'],
       ['no ip route 10.2.0.0 255.255.0.0 10.0.0.2','In global configuration: OSPF now learns the Site B subnets, so the Junior static route goes. Left in place, redistribute static would advertise it too. On RtrB: no ip route 10.1.0.0 255.255.0.0 10.0.0.1.'],
       ['show ip ospf neighbor','Verify: RtrB reaches FULL on G0/2.'],
       ['show ip route ospf','On RtrB: the Site A subnets as O routes.']
     ]),
     PATH('How 8.8.8.8 reaches RtrB’s table',[
       {name:'RtrA',tag:'S 8.8.8.8 [1/0]',tone:'l3',note:['Its static route, via 203.0.113.1','In the table while G0/1 is up'],via:'redistribute static subnets'},
       {name:'External LSA',tag:'type 5 · E2',tone:'amber',note:['RtrA, now an ASBR (a router that brings outside routes into OSPF), floods 8.8.8.8/32 into area 0 as a link-state advertisement (LSA)','A redistributed route starts at metric 20, and E2 (external type 2) keeps that cost unchanged'],via:'Across 10.0.0.0/30'},
       {name:'RtrB',tag:'backup path',tone:'l4',note:['O E2 8.8.8.8 [110/20] via 10.0.0.1, under 8.0.0.0/32 is subnetted','Its own static (AD 1) beats this copy (AD 110), so the copy waits as the backup','Enters the table when RtrB’s own static leaves it, for example when RtrB’s G0/1 uplink fails']}
     ],{caption:'RtrA’s static becomes an external OSPF route, and RtrB keeps it as a backup to its own static.'}),
     NOTE('<b>Why <code>subnets</code> matters.</b> On classic IOS, <code>redistribute static</code> without <code>subnets</code> carries only classful networks, so a /32 stays home (IOS warns “% Only classful networks will be redistributed”). IOS XE adds <code>subnets</code> automatically. The detail panel below lists the classful ranges.'),
     NOTE('<b>Practice it.</b> <a href="'+RES['t4t-lr-ios'][1]+'" target="_blank" rel="noopener noreferrer">Lockdown Range: Cisco IOS</a>, Level 4 (Two sites), hands you a finished Site A and a factory-default SwB and RtrB: build the host route, the OSPF neighbor, and redistribute static subnets, then shut RtrB G0/1 and watch O E2 8.8.8.8/32 take over. <a href="'+RES['t4t-audit'][1]+'" target="_blank" rel="noopener noreferrer">Config Audit</a>’s Site B switch and Site B router scenarios drill the audit below.'),
     DETAIL('OSPF behind the scenes',TIPS('Hello every 10 seconds and dead after 40 on Ethernet.','Neighbors form only when both ends share the subnet, mask, area, timers, and authentication, and each router-id is unique. Area 0 is the backbone.','Neighbor states: DOWN, INIT, 2WAY, EXSTART, EXCHANGE, LOADING, and FULL. Multi-access links elect a DR and a BDR.','<code>router-id</code> sets the name; <code>clear ip ospf process</code> applies a change. <code>passive-interface default</code>, then <code>no passive-interface</code> on the links, is the tidy pattern.','An ASBR brings outside routes in as type 5 LSAs; an E2 route keeps its seed metric, 20 by default.','Classful ranges behind the <code>subnets</code> keyword: first octet 1 to 126 is class A (/8), 128 to 191 class B (/16), and 192 to 223 class C (/24), so 8.8.8.8/32 sits inside class A 8.0.0.0/8. IOS XE adds <code>subnets</code> for you.'))),
   SPOT('se6sp','Audit SwB and RtrB','Excerpts from Site B. Compare each line with the finished-network table, tap every line that breaks the design or weakens security, then Check.',[
     ['SwB# show running-config',null],
     ['interface FastEthernet0/1',null],
     [' switchport access vlan 10',null],
     [' switchport mode access',null],
     [' spanning-tree portfast',null],
     [' spanning-tree bpduguard enable',null],
     ['interface GigabitEthernet0/1',null],
     [' switchport trunk native vlan 10','The native VLAN is 10, the Students VLAN, while RtrB expects 99. Students frames cross untagged and land in RtrB’s VLAN 99, so Students lose their gateway, and a Students host could double-tag its way into other VLANs. Fix: switchport trunk native vlan 99.'],
     [' switchport trunk allowed vlan 10,20,99','VLAN 30 is missing, so Principals frames stop at SwB and Principals lose their gateway. Fix: switchport trunk allowed vlan add 30.'],
     [' switchport mode trunk',null],
     [' spanning-tree portfast trunk','PortFast on the uplink trunk skips the listening and learning that guard against loops. PortFast belongs on the Fa edge ports, as on Fa0/1 above. Fix: no spanning-tree portfast trunk.'],
     ['SwB# show ip interface brief | include Vlan',null],
     ['Vlan1      10.2.1.2     YES manual up     up','SwB’s management address sits on Vlan1, the default VLAN, outside the Teachers subnet that the design and ACL 20 expect. Fix: interface vlan 20 with 10.2.20.2, ip default-gateway 10.2.20.1, and shutdown on interface vlan 1.'],
     ['RtrB# show running-config',null],
     ['ip ssh version 2',null],
     ['interface GigabitEthernet0/0.99',null],
     [' encapsulation dot1Q 99 native',null],
     ['router ospf 1',null],
     [' redistribute static','Without subnets, classic IOS redistributes only classful networks, so the /32 to 8.8.8.8 stays on RtrB and RtrA goes without its backup path. Fix: redistribute static subnets (IOS XE adds subnets for you).'],
     [' passive-interface GigabitEthernet0/0.10',null],
     [' passive-interface GigabitEthernet0/0.20',null],
     [' passive-interface GigabitEthernet0/0.30',null],
     [' network 10.0.0.0 0.0.0.3 area 0',null],
     [' network 10.2.0.0 0.0.255.255 area 0',null],
     ['ip route 8.8.8.8 255.255.255.255 198.51.100.1',null],
     ['access-list 20 permit 10.1.20.0 0.0.0.255',null],
     ['access-list 20 permit 10.2.20.0 0.0.0.255',null],
     ['access-list 20 permit 10.2.10.0 0.0.0.255','10.2.10.0/24 is the Site B Students subnet, so every Students PC there can open a session to RtrB. Fix: ip access-list standard 20, then remove that entry by its sequence number.'],
     ['line vty 0 4',null],
     [' access-class 20 in',null],
     [' login local',null],
     [' transport input ssh',null],
     ['line vty 5 15','Lines 5 to 15 run without access-class 20 in, so once five sessions hold lines 0 to 4, the next session, from any source, lands on these unfiltered lines. Fix: access-class 20 in under line vty 5 15.'],
     [' login local',null],
     [' transport input telnet ssh','Telnet sends the session and the password as plain text. Fix: transport input ssh.']
   ]),
   ORDER('se6o','Remediate with the least downtime','You found the faults on SwB and RtrB. Tap the fixes in the order that keeps the network up and keeps you able to undo each one: a saved copy first, then how you reach the devices (the VTY lines first, then SwB’s management address), then the outages (the one that also opens an attack first), then the risks that have yet to cause harm, with the backup path as the last fix, and the verified save at the end.',[
     ['Save a backup of the running-config','copy running-config flash:pre-audit.cfg on each device, so any step can roll back.'],
     ['Fix the VTY lines (ACL 20 on every range, SSH only) from a Teachers PC session while the console stays open','ACL 20 decides who reaches each device, so it comes first. A wrong access-class locks out every new session, your next login included, though the session you are typing in stays up; the open console is the way back in.'],
     ['Move SwB management from Vlan1 to interface vlan 20 from the console','The address you manage SwB by changes, so make this move on the console, with the VTY lines already right, and confirm 10.2.20.2 answers before shutting Vlan1.'],
     ['Set native VLAN 99 on SwB G0/1 to match RtrB','The largest outage: Students lose their gateway, and the mismatch opens double tagging. RtrB already has encapsulation dot1Q 99 native, so switchport trunk native vlan 99 on SwB G0/1 closes the gap; check show interfaces trunk at once.'],
     ['Add VLAN 30 to the trunk’s allowed list','The second outage: switchport trunk allowed vlan add 30 restores the Principals gateway; add keeps the rest of the list.'],
     ['Move PortFast off the trunk','A latent loop risk with no outage today, so it follows the outages: no spanning-tree portfast trunk on G0/1.'],
     ['Add subnets to redistribute static','Only the other site’s backup path depends on it, so it is the last fix: redistribute static subnets.'],
     ['Verify with pings and show ip route','Ping across VLANs and sites, and read show ip route on both routers before calling it done.'],
     ['Save with copy running-config startup-config','Only a verified configuration becomes the one that survives a reload.']
   ]),
   QUIZ('se6q','Mixed review across the ladder',[
     ['RtrA holds a static route and an O E2 route to 8.8.8.8/32. Which one goes in its routing table?',['The O E2 route, because OSPF is dynamic','The static route: AD 1 beats AD 110','Both, sharing the load','Whichever has the lower metric'],1,'For the same prefix, administrative distance chooses between sources first: static 1, OSPF 110. Metrics compare routes from the same source only.'],
     ['Which keyword lets classic IOS redistribute the /32 into OSPF?',['<code>metric-type 1</code>','<code>default-information originate</code>','<code>classful</code>','<code>subnets</code>'],3,'<code>redistribute static subnets</code> carries subnets and host routes. IOS XE adds the keyword automatically.'],
     ['RtrB’s G0/1 uplink fails. How does RtrB reach 8.8.8.8 now?',['Through the O E2 route from RtrA, via 10.0.0.1','Through its static route, which stays in the table','Through SwB’s default gateway, 10.2.20.1','Through the native VLAN to SwB'],0,'The static leaves with its next hop, and the OSPF copy from RtrA takes over: the backup path at work.'],
     ['SwB’s <code>interface vlan 20</code> reads down/down although it has <code>no shutdown</code>. What do you check first?',['<code>show ip ssh</code>: SSH must run before the SVI comes up','<code>show vlan brief</code>: VLAN 20 must exist with an up port','<code>show ip route</code>: the SVI needs a route to its gateway','<code>show ip ospf neighbor</code>: the SVI waits for a neighbor'],1,'From Sophomore: the SVI depends on the VLAN. It comes up once VLAN 20 exists and an up port or trunk carries it.'],
     ['Where does native VLAN 99 get configured?',['On the switch trunk only; the router follows it','On the router only; it routes the VLANs','On both ends: the switch trunk and the router subinterface','On every access port in VLAN 99'],2,'From Junior: both ends must agree, and VLAN 99 carries no hosts.'],
     ['Which of these lines is a finding?',['<code>spanning-tree portfast</code> on Fa0/1','<code>spanning-tree bpduguard enable</code> on Fa0/1','<code>spanning-tree portfast trunk</code> on G0/1','<code>switchport mode access</code> on Fa0/1'],2,'From Freshman: PortFast and BPDU guard belong on edge ports. The uplink trunk keeps the full spanning tree process.'],
     ['Where does <code>access-class 20 in</code> go?',['Under every VTY line range','Under interface g0/0','Under router ospf 1','On the VLAN 20 SVI'],0,'access-class filters who opens a session to the device, so it goes on the lines: vty 0 15 on the switches, and every listed range on the routers.'],
     ['A user connects to the SwB console. In what order do the messages appear?',['The login banner, then the MOTD, then the password prompt','The MOTD, then the login banner, then the password prompt','The password prompt, then the MOTD and the login banner','The MOTD alone, then the password prompt, then the login banner'],1,'From Sophomore: the MOTD shows first, then the login banner, just before the login prompt. This console uses a line password, so that prompt reads Password:.']
   ]),
   REFLECT('se6r','Defend your design','Justify three choices: management on Teachers or a dedicated VLAN, native VLAN 99 carrying no hosts, and the ACL on every VTY line. Name one trade-off for each.'),
   REFLECT('se6r2','Extend the design to a third site','Site C needs Students for 100 hosts, Teachers for 40, and Principals for 10, carved from 10.3.0.0/24. Plan the subnets with VLSM (variable-length subnet masks): give each subnet the smallest mask that fits its hosts, and carve the largest first so each block starts on its own boundary. Note each gateway. Then write the extended ACL, and the interface and direction it goes on, for this policy: Students may browse the Teachers web server at 10.3.0.140 and reach nothing else in Teachers. Last, weigh static summary routes against OSPF for three sites, with one trade-off each. <a href="'+RES['t4t-subnet'][1]+'" target="_blank" rel="noopener noreferrer">Subnet Sprint</a>’s Plan tab (VLSM plan) drills the subnet math.'),
   LINKS('Go further',['t4t-lr-ios','t4t-audit','t4t-tickets','t4t-ios','t4t-ld-ios','pt','netacad'])
  ]},
 {id:'se5',title:'Power and responsibility',bloom:'Evaluate',sum:'You can now break and defend real systems. The whole point of the training is choosing how to use it.',
  blocks:[
   C('The line you hold','Evaluate',
     P('Everything in this ladder gives you real capability. The same skills that harden a practice lab can disable a real system; the same investigation that answers a lab question can expose a real person. Labs are systems built to be changed. Outside them, <b>authorization is the entire difference between a security professional and a criminal</b>, and the law judges actions as well as intent.'),
     TIPS('<b>Can and should are separate questions.</b> Permission comes only from the system’s owner.',
          'Get explicit, written authorization before touching any system someone else owns. "I was only curious" fails as a defense.',
          'Handle other people’s data as if it were your own: minimize it, protect it, and keep it contained. Investigation answers go in the report and only there.',

const KEY='defense-ladder-v1';
let MEM={};
const store={
  load(){ try{ const r=localStorage.getItem(KEY); MEM=r?JSON.parse(r):{}; }catch(e){ MEM={}; } return MEM; },
  save(){ try{ localStorage.setItem(KEY,JSON.stringify(MEM)); }catch(e){} },
  get(id){ return MEM[id]; },
  set(id,v){ MEM[id]=v; this.save(); }
};
store.load();

/* theme */
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  themeBtn.textContent='Theme: '+(t||'auto');
}
let theme=(function(){ try{return localStorage.getItem(KEY+'-theme')||'auto';}catch(e){return 'auto';} })();

const el=(tag,cls,html)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const bloomName={R:'Remember',U:'Understand',A:'Apply',An:'Analyze',E:'Evaluate',Cr:'Create'};
const bloomFull=['Remember','Understand','Apply','Analyze','Evaluate','Create'];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* chevron icon for a level (stacked chevrons = grade) */
function chevSvg(n,color){
  const w=16,gap=5; let p='';
  for(let i=0;i<4;i++){
    const on=i<n;
    p+=`<path d="M2 ${4+i*gap} L8 ${1+i*gap} L14 ${4+i*gap}" fill="none" stroke="${on?color:'var(--line)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  return `<svg width="${w}" height="26" viewBox="0 0 16 26" aria-hidden="true">${p}</svg>`;
}

let current={level:LEVELS[0].id, unit:LEVELS[0].units[0].id, page:'level'};

function levelById(id){return LEVELS.find(l=>l.id===id);}
function allInteractiveIds(){
  const ids=[];
  LEVELS.forEach(l=>l.units.forEach(u=>u.blocks.forEach(b=>{ if(b.id) ids.push(b.id); })));
  return ids;
}
function isDone(id){const v=store.get(id);return v&&v.done;}

/* =====================================================================
   RAIL
   ===================================================================== */
function buildRail(){
  const ladder=document.getElementById('ladder');
  ladder.innerHTML='';
  LEVELS.forEach(l=>{
    const b=el('button','lv');
    b.style.setProperty('--c',l.color);
    b.setAttribute('role','tab');
    b.innerHTML=chevSvg(l.chev,l.color)+`<span class="lv-t"><span class="lv-g">${l.grade}</span><span class="lv-p">${l.range}</span></span>`;
    b.addEventListener('click',()=>{current={level:l.id,unit:l.units[0].id,page:'level'};render();});
    ladder.appendChild(b);
  });
  const pages=document.getElementById('pages');
  pages.innerHTML='';
  PAGES.forEach(([id,label])=>{
    const b=el('button','pg',label);
    b.addEventListener('click',()=>{current={page:id};render();});
    pages.appendChild(b);
  });
}

function markRail(){
  const lvs=document.querySelectorAll('#ladder .lv');
  LEVELS.forEach((l,i)=>lvs[i].setAttribute('aria-current', current.page==='level'&&current.level===l.id?'true':'false'));
  const pgs=document.querySelectorAll('#pages .pg');
  pgs.forEach((p,i)=>p.setAttribute('aria-current', current.page===PAGES[i][0]?'true':'false'));
}

/* =====================================================================

   ===================================================================== */
const main=document.getElementById('main');
let booted=false;
function render(){
  main.innerHTML='';
  if(current.page==='level') renderLevel();
  else if(current.page==='plan') renderPlan();
  else if(current.page==='scorecard') renderScorecard();
  else if(current.page==='progress') renderProgress();
  else if(current.page==='glossary') renderGlossary();
  else if(current.page==='about') renderAbout();

  main.focus();

}

/* =====================================================================
   UNIT LINKS: #<grade>/<unit>, e.g. #freshman/f7 (unit ids are stable; never renumber)
   ===================================================================== */
function syncHash(){
  const h=current.page==='level'?'#'+current.level+'/'+current.unit:'';
  if(location.hash===h) return;
  try{ history.replaceState(null,'',location.pathname+location.search+h); }catch(e){}
}
function unitFromHash(){
  const m=/^#([a-z]+)\/([a-z]+[0-9]+)$/.exec(location.hash||'');
  const L=m&&levelById(m[1]);
  const U=L&&L.units.find(u=>u.id===m[2]);
  return U?{level:L.id,unit:U.id,page:'level'}:null;
}
function route(){
  const target=unitFromHash();
  current=target||{level:LEVELS[0].id,unit:LEVELS[0].units[0].id,page:'level'};
  render();
  if(target){ const uh=main.querySelector('.uhead'); if(uh) uh.scrollIntoView({block:'start'}); }
}
window.addEventListener('hashchange',route);

function renderLevel(){
  const L=levelById(current.level);
  const head=el('div','lvhead');
  head.style.setProperty('--accent',L.color);
  document.documentElement.style.setProperty('--accent',L.color);
  head.innerHTML=`<div class="grade">${L.grade}</div><div class="range">${L.range}</div>`;
  const bloom=el('div','bloom');
  bloomFull.forEach(bf=>{
    const on=L.blooms.map(b=>bloomName[b]).includes(bf);
    const s=el('span',on?'on':'',bf);
    bloom.appendChild(s);
  });
  head.appendChild(bloom);
  head.appendChild(el('div','bloom-cap',L.bloomCap));
  head.appendChild(el('p','intro',L.intro));
  if(L.mentor){
    const d=el('details','mentor');
    d.innerHTML='<summary>For instructors and study leads</summary><ul>'+L.mentor.map(m=>`<li>${m}</li>`).join('')+'</ul>';
    head.appendChild(d);
  }
  main.appendChild(head);

  // unit chips
  const units=el('div','units');
  L.units.forEach(u=>{
    const chip=el('button','unit');
    const st=unitStatus(u);
    chip.innerHTML=`<span class="dot ${st}"></span>${u.title}`;
    chip.setAttribute('aria-current', u.id===current.unit?'true':'false');
    chip.style.setProperty('--accent',L.color);
    chip.addEventListener('click',()=>{current.unit=u.id;render();});
    units.appendChild(chip);
  });
  main.appendChild(units);

  const U=L.units.find(u=>u.id===current.unit)||L.units[0];
  const uh=el('div','uhead');
  uh.innerHTML=`<h2>${U.title}<span class="blm">${U.bloom}</span></h2><p class="sum">${U.sum}</p>`;
  main.appendChild(uh);

  U.blocks.forEach(b=>main.appendChild(renderBlock(b,L)));

  // unit pager
  const idx=L.units.findIndex(u=>u.id===U.id);
  const pager=el('div','row');
  if(idx>0){const p=el('button','btn sec','\u2190 '+L.units[idx-1].title);p.addEventListener('click',()=>{current.unit=L.units[idx-1].id;render();});pager.appendChild(p);}
  if(idx<L.units.length-1){const n=el('button','btn','Next: '+L.units[idx+1].title+' \u2192');n.addEventListener('click',()=>{current.unit=L.units[idx+1].id;render();});pager.appendChild(n);}
  else{
    const li=LEVELS.findIndex(x=>x.id===L.id);
    if(li<LEVELS.length-1){const n=el('button','btn','Start '+LEVELS[li+1].grade+' \u2192');n.addEventListener('click',()=>{current={level:LEVELS[li+1].id,unit:LEVELS[li+1].units[0].id,page:'level'};render();});pager.appendChild(n);}
    else{const n=el('button','btn','See the study plan \u2192');n.addEventListener('click',()=>{current={page:'plan'};render();});pager.appendChild(n);}
  }
  main.appendChild(pager);
}

function unitStatus(u){
  const ids=u.blocks.filter(b=>b.id).map(b=>b.id);
  if(!ids.length) return '';
  const done=ids.filter(isDone).length;
  if(done===0) return '';
  if(done===ids.length) return 'full';
  return 'part';
}

function renderCard(b){

/* =====================================================================
   VISUAL BLOCKS (the constructor notes near the top describe the data)
   ===================================================================== */
const TONES={l1:['--l1','--tint1'],l2:['--l2','--tint2'],l3:['--l3','--tint3'],l4:['--l4','--tint4'],muted:['--ink-3','--paper-2'],ok:['--ok','--ok-bg'],bad:['--bad','--bad-bg'],amber:['--amber','--amber-bg']};
const toneCss=(t,d)=>{const k=TONES[t]||TONES[d]||TONES.l2;return `--c:var(${k[0]});--bgc:var(${k[1]})`;};
const plain=s=>String(s==null?'':s).replace(/<br\s*\/?>/gi,'; ').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
const attrq=s=>plain(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
const andList=a=>{a=a.filter(x=>x!==''&&x!=null);return a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+', and '+a[a.length-1];};
const dot=s=>{s=String(s==null?'':s).trim();return !s||/[.!?:]$/.test(plain(s))?s:s+'.';};
const asList=x=>x==null||x===''?[]:Array.isArray(x)?x:[x];
let visSeq=0;

/* SVG presentation attributes holding var(...) move into style, where every browser reads them */
function svgVarAttrs(body){
  return body.replace(/<([a-zA-Z][\w-]*)((?:[^>"']|"[^"]*"|'[^']*')*?)(\/?)>/g,(m,tag,attrs,sl)=>{
    const st=[];
    attrs=attrs.replace(/\s(fill|stroke|stop-color|color)\s*=\s*"(var\([^"]*\))"/g,(x,n,v)=>{st.push(n+':'+v);return '';});
    if(!st.length) return m;
    if(/\sstyle\s*=\s*"/.test(attrs)) attrs=attrs.replace(/\sstyle\s*=\s*"([^"]*)"/,(x,v)=>` style="${v.replace(/;?\s*$/,';')}${st.join(';')}"`);
    else attrs+=` style="${st.join(';')}"`;
    return `<${tag}${attrs}${sl}>`;
  });
}
/* an author's {body,label,view,width} drawing, with its own arrowhead markers */
function svgHtml(svg){
  if(!svg) return '';
  const s=typeof svg==='string'?{body:svg}:svg;
  const uid='v'+(++visSeq), used=new Set();
  let body=String(s.body||'').replace(/url\(#arrow(?:-([a-z0-9]+))?\)/g,(m,t)=>{const k=t&&TONES[t]?t:'';used.add(k);return `url(#${uid}-arrow${k?'-'+k:''})`;});
  body=svgVarAttrs(body);
  const defs=[...used].map(k=>`<marker id="${uid}-arrow${k?'-'+k:''}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(${k?TONES[k][0]:'--ink-3'})"/></marker>`).join('');
  const a11y=s.label?`role="img" aria-label="${attrq(s.label)}"`:'aria-hidden="true"';
  const size=(s.width?` width="${s.width}"`:'')+(s.height?` height="${s.height}"`:'');
  return `<svg viewBox="${s.view||'0 0 200 74'}"${size} ${a11y} focusable="false">${defs?'<defs>'+defs+'</defs>':''}${body}</svg>`;
}
/* shared frame: card or in-card heading, intro, figure, note, caption, key, and the text version */
function visShell(b,inCard,figHtml,altAuto){
  const o=b.o||{};
  const wrap=el('div',inCard?'v-in':'card');
  if(b.title) wrap.appendChild(el(inCard?'h4':'h3',null,inCard?b.title:`${b.title}<span class="blm">${o.bloom||'Understand'}</span>`));
  if(o.intro) wrap.appendChild(el('p','v-why',o.intro));
  const fig=el('figure','vis');
  let h=figHtml;
  if(o.note) h+=`<p class="v-note">${o.note}</p>`;
  h+=`<figcaption class="v-cap">${o.caption||b.title||''}</figcaption>`;
  if(o.key&&o.key.length) h+=`<div class="v-key">${o.key.map(([t,l])=>`<span style="${toneCss(t)}">${l}</span>`).join('')}</div>`;
  const alt=o.alt?(Array.isArray(o.alt)?'<ol>'+o.alt.map(x=>`<li>${x}</li>`).join('')+'</ol>':`<p>${o.alt}</p>`):altAuto;
  h+=`<details class="v-alt"><summary>Read it as text</summary>${alt}</details>`;
  fig.innerHTML=h;
  wrap.appendChild(fig);
  return wrap;
}

/* ---- COMPARE ---- */
function renderCompare(b,inCard){
  const cols=b.cols||[], hn=inCard?'h5':'h4';
  const html=`<div class="v-cmp v-n${cols.length}">`+cols.map(c=>
    `<div class="v-col" style="${toneCss(c.tone,'l2')}"><${hn} class="v-colh"><span>${c.name}</span>${c.tag?`<span class="v-tag">${c.tag}</span>`:''}</${hn}>`+
    svgHtml(c.svg)+
    ((c.rows||[]).length?'<dl>'+c.rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>':'')+
    (c.hook?`<div class="v-mem">Remember it as: ${c.hook}</div>`:'')+'</div>').join('')+'</div>';
  const alt=cols.map(c=>`<p><b>${dot(c.name+(c.tag?', '+c.tag:''))}</b> `+(c.rows||[]).map(([k,v])=>`${k}: ${dot(v)}`).join(' ')+
    (c.svg&&c.svg.label?' '+dot(c.svg.label):'')+(c.hook?' Remember it as: '+dot(c.hook):'')+'</p>').join('');
  return visShell(b,inCard,html,alt);
}

/* ---- ANATOMY ---- */
function anatBox(x){
  if(x.core) return `<div class="v-core">${x.name||''}${x.sub?`<div class="v-sub">${x.sub}</div>`:''}</div>`;
  const fld=(f,cls)=>f&&f.length?`<div class="${cls}"><b>${f[0]}</b>${f.slice(1).join('<br>')}</div>`:'';
  const kids=(x.children||[]).map(anatBox).join('');
  const inner=(x.panel?`<div class="v-panel"><b>${x.panel[0]}</b>${x.panel.slice(1).join(' · ')}</div>`:'')+(kids?(x.grid?`<div class="v-grid">${kids}</div>`:kids):'');
  const body=(x.head||x.trail)?`<div class="v-arow">${fld(x.head,'v-hdr')}<div class="v-inner">${inner}</div>${fld(x.trail,'v-trl')}</div>`:(inner?`<div class="v-inner">${inner}</div>`:'');
  return `<div class="v-box" style="${toneCss(x.tone,'l2')}"><div class="v-blabel"><span>${x.name||''}</span>${x.tag?`<span class="v-tag">${x.tag}</span>`:''}</div>`+
    (x.text?`<div class="v-btxt">${x.text}</div>`:'')+body+svgHtml(x.svg)+'</div>';
}
function anatAlt(x){
  if(x.core) return `<li>${x.name||''}${x.sub?': '+x.sub:''}</li>`;
  const f=(a)=>a&&a.length?` ${a[0]}: ${dot(andList(a.slice(1).map(plain)))}`:'';
  const kids=(x.children||[]).map(anatAlt).join('');
  return `<li><b>${x.name||''}</b>${x.tag?' ('+x.tag+')':''}.${x.text?' '+dot(plain(x.text)):''}${f(x.head)}${f(x.panel)}${f(x.trail)}${kids?' Inside it:<ul>'+kids+'</ul>':''}</li>`;
}
function anatSay(x){
  const k=(x.children||[]).filter(c=>c.name);
  if(!k.length) return plain(x.name);
  if(k.length===1&&!x.grid) return plain(x.name)+' contains '+anatSay(k[0]);
  return plain(x.name)+' contains '+andList(k.map(c=>plain(c.name)));
}
function renderAnatomy(b,inCard){
  const o=b.o||{}, boxes=b.boxes||[];
  const label=o.label||dot(boxes.map(anatSay).join('; '));
  const strip=o.strip?`<div class="v-strip" aria-hidden="true"><b>${o.strip[0]}</b><code>${o.strip[1]}</code></div>`:'';
  const F=o.facts;
  const facts=F?`<div class="v-facts"><table><thead><tr>${F.head.map((h,i)=>i||h?`<th scope="col">${h}</th>`:'<td></td>').join('')}</tr></thead><tbody>`+
    F.rows.map(r=>'<tr>'+r.map((c,i)=>i?`<td>${c}</td>`:`<th scope="row">${c}</th>`).join('')+'</tr>').join('')+'</tbody></table></div>':'';
  const html=`<div class="v-anat${F?' v-hasfacts':''}"><div><div class="v-boxes" role="img" aria-label="${attrq(label)}">${boxes.map(anatBox).join('')}</div>${strip}</div>${facts}</div>`;
  const alt='<ul>'+boxes.map(anatAlt).join('')+'</ul>'+(o.strip?`<p>${o.strip[0]}: ${o.strip[2]||o.strip[1]}</p>`:'');
  return visShell(b,inCard,html,alt);
}

/* ---- STACK ---- */
function renderStack(b,inCard){
  const S=b.stacks||[];
  const sum=s=>(s.layers||[]).reduce((n,l)=>n+(l[2]||1),0);
  const rows=Math.max(1,...S.map(sum));
  const first=[];
  let h=`<div class="v-stack" style="grid-template-columns:repeat(${S.length},minmax(0,1fr));grid-template-rows:auto repeat(${rows},minmax(2.6em,auto))">`;
  const alt=[];
  S.forEach((s,ci)=>{
    h+=`<div class="v-sth" style="grid-column:${ci+1};grid-row:1">${s.name||''}</div>`;
    let r=0, num=(s.layers||[]).length; const li=[];
    (s.layers||[]).forEach(l=>{
      const sp=l[2]||1;
      h+=`<div class="v-layer" style="${toneCss(l[3]||s.tone,'l2')};grid-column:${ci+1};grid-row:${r+2} / span ${sp}"><b>${s.numbered?`<span class="v-num">${num}</span>`:''}<span>${l[0]}</span></b>${l[1]?`<small>${l[1]}</small>`:''}</div>`;
      if(ci===0) for(let k=0;k<sp;k++) first[r+k]=plain(l[0]);
      let t=(s.numbered?num+' ':'')+l[0]+(l[1]?' ('+l[1]+')':'');
      if(ci>0&&S[0]){const cov=[...new Set(first.slice(r,r+sp).filter(Boolean))];if(cov.length) t+=`, lining up with ${andList(cov)} in ${plain(S[0].name)}`;}
      li.push(`<li>${t}</li>`);
      r+=sp; num--;
    });
    alt.push(`<p><b>${s.name||''}</b>, top to bottom:</p><ul>${li.join('')}</ul>`);
  });
  h+='</div>';
  return visShell(b,inCard,h,alt.join(''));
}

/* ---- PATH ---- */
function renderPath(b,inCard){
  const H=b.hops||[];
  const arrow='<svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true" focusable="false"><path d="M1 7 H15" style="stroke:var(--ink-2);stroke-width:2;fill:none"/><path d="M13 2 L21 7 L13 12 z" style="fill:var(--ink-2)"/></svg>';
  let h=`<div class="v-path${H.length<=3?' v-row':H.length===4?' v-row4':''}">`;
  const alt=[];
  H.forEach((x,i)=>{
    const notes=asList(x.note);
    h+=`<div class="v-hop" style="${toneCss(x.tone,'l2')}"><b>${x.name}</b>${x.tag?`<span class="v-tag">${x.tag}</span>`:''}`+
      (notes.length===1?`<div>${notes[0]}</div>`:notes.length?'<ul>'+notes.map(n=>`<li>${n}</li>`).join('')+'</ul>':'')+'</div>';
    if(i<H.length-1) h+=`<div class="v-arr">${arrow}${x.via?`<span>${x.via}</span>`:''}</div>`;
    alt.push(`<li><b>${x.name}</b>${x.tag?' ('+x.tag+')':''}.${notes.length?' '+notes.map(dot).join(' '):''}${x.via&&i<H.length-1?' Then: '+dot(x.via):''}</li>`);
  });
  h+='</div>';
  return visShell(b,inCard,h,'<ol>'+alt.join('')+'</ol>');
}

/* ---- SEQ ---- */
function renderSeq(b,inCard){
  const alt=[];
  const items=(b.steps||[]).map((s,i)=>{
    if(Array.isArray(s)){
      alt.push(`<li><b>${s[0]}</b>${s[1]?': '+s[1]:''}</li>`);
      return `<li style="${toneCss(s[2],'l2')}"><span class="v-sn">${i+1}</span><span class="v-sl">${s[0]}</span>${s[1]?`<span class="v-sd">${s[1]}</span>`:''}</li>`;
    }
    const br=s.branches||[];
    alt.push(`<li><b>Decision: ${s.ask}</b>${s.detail?' '+dot(s.detail):''} ${br.map(([k,v])=>`${k}: ${dot(v)}`).join(' ')}</li>`);
    return `<li class="v-dec" style="${toneCss(s.tone,'amber')}"><span class="v-sn"><span>${i+1}</span></span><span class="v-sl">${s.ask}</span>${s.detail?`<span class="v-sd">${s.detail}</span>`:''}`+
      (br.length?`<div class="v-br">${br.map(([k,v])=>`<div><b>${k}</b>${v}</div>`).join('')}</div>`:'')+'</li>';
  });
  return visShell(b,inCard,`<ol class="v-seq">${items.join('')}</ol>`,'<ol>'+alt.join('')+'</ol>');
}

/* ---- HIER ---- */
function hierNode(x){
  const k=x.children||[];
  return `<li><span class="v-node" style="${toneCss(x.tone,'l2')}"><b>${x.name}</b>${x.note?`<small>${x.note}</small>`:''}</span>${k.length?'<ul>'+k.map(hierNode).join('')+'</ul>':''}</li>`;
}
function hierAlt(x){
  const k=x.children||[];
  return `<li>${x.name}${x.note?': '+x.note:''}${k.length?'<ul>'+k.map(hierAlt).join('')+'</ul>':''}</li>`;
}
function renderHier(b,inCard){
  const o=b.o||{}, R=b.root;
  if(Array.isArray(R)){
    const top=o.top||'Wins', bottom=o.bottom||'Yields';
    const h=`<div class="v-ladder"><div class="v-axis" aria-hidden="true"><span>${top}</span><i></i><span>${bottom}</span></div><ol>`+
      R.map((r,i)=>`<li style="${toneCss(r[2],'l2')}"><span class="v-num">${i+1}</span><span><b>${r[0]}</b>${r[1]?`<small>${r[1]}</small>`:''}</span></li>`).join('')+'</ol></div>';
    const alt=`<p>From the top (${top}) to the bottom (${bottom}):</p><ol>`+R.map(r=>`<li>${r[0]}${r[1]?': '+r[1]:''}</li>`).join('')+'</ol>';
    return visShell(b,inCard,h,alt);
  }
  return visShell(b,inCard,`<ul class="v-tree">${hierNode(R)}</ul>`,`<ul>${hierAlt(R)}</ul>`);
}

/* ---- VENN ---- */
function renderVenn(b,inCard){
  const o=b.o||{}, S=(b.sets||[]).slice(0,3), three=S.length===3;
  const G=three?{vb:'0 0 300 270',c:[[115,100],[185,100],[150,160]],r:72,nm:[[60,22],[240,22],[150,258]],reg:{A:[82,82],B:[218,82],C:[150,207],AB:[150,74],AC:[110,150],BC:[190,150],ABC:[150,122]}}
               :{vb:'0 0 300 200',c:[[110,108],[190,108]],r:80,nm:[[70,18],[230,18]],reg:{A:[68,108],B:[232,108],AB:[150,108]}};
  const idx={A:0,B:1,C:2}, deft=['l1','l3','l2'];
  const regs=[];
  S.forEach((s,i)=>{ if((s.items||[]).length) regs.push({k:'ABC'[i],name:plain(s.name)+' only',items:s.items}); });
  (o.overlaps||[]).forEach(v=>{
    const k=String(v.sets||'').toUpperCase().split('').filter(c=>idx[c]!=null&&idx[c]<S.length).sort().join('');
    if(k.length<2||!G.reg[k]||!(v.items||[]).length) return;
    regs.push({k,name:v.name||(k.length===3?'All three':andList(k.split('').map(c=>plain(S[idx[c]].name)))),items:v.items});
  });
  let svg=`<svg viewBox="${G.vb}" role="img" aria-label="${attrq('Overlapping circles for '+andList(S.map(s=>plain(s.name)))+'; the numbered regions are listed beside the drawing.')}" focusable="false">`;
  S.forEach((s,i)=>{const k=TONES[s.tone]||TONES[deft[i]];svg+=`<circle cx="${G.c[i][0]}" cy="${G.c[i][1]}" r="${G.r}" style="fill:var(${k[0]});fill-opacity:.14;stroke:var(${k[0]});stroke-width:2"/>`;});
  S.forEach((s,i)=>{svg+=`<text x="${G.nm[i][0]}" y="${G.nm[i][1]}" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">${esc(plain(s.name))}</text>`;});
  regs.forEach((r,n)=>{const [x,y]=G.reg[r.k];svg+=`<circle cx="${x}" cy="${y}" r="11" style="fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5"/><text x="${x}" y="${y+4}" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700">${n+1}</text>`;});
  svg+='</svg>';
  const list=`<ol class="v-regions">${regs.map((r,n)=>`<li><span class="v-num">${n+1}</span><span><b>${r.name}:</b> ${andList(r.items)}</span></li>`).join('')}</ol>`;
  const alt=`<p>Sets: ${andList(S.map(s=>plain(s.name)))}.</p><ul>${regs.map(r=>`<li>${r.name}: ${dot(andList(r.items))}</li>`).join('')}</ul>`;
  return visShell(b,inCard,`<div class="v-venn">${svg}${list}</div>`,alt);
}

/* ---- SCALE ---- */
function renderScale(b,inCard){
  const p=b.spec||{};
  if(p.cells){
    const X=p.x||[''], Y=p.y||[''], nc=X.length-1;
    const cell=c=>Array.isArray(c)?c:[c,'',''];
    let h=`<table class="v-mx"><colgroup><col style="width:4.6em">${'<col>'.repeat(nc)}</colgroup><thead><tr><td></td><th scope="colgroup" colspan="${nc}" class="v-ax">${X[0]}</th></tr>`+
      `<tr><th scope="col" class="v-ax">${Y[0]}</th>${X.slice(1).map(t=>`<th scope="col" class="v-xt">${t}</th>`).join('')}</tr></thead><tbody>`;
    const alt=[];
    p.cells.forEach((row,ri)=>{
      h+=`<tr><th scope="row" class="v-yt">${Y[ri+1]||''}</th>`;
      row.forEach((c,ci)=>{
        const [t,n,tone]=cell(c);
        h+=`<td class="v-cell" style="${toneCss(tone,'l2')}"><b>${t}</b>${n?`<small>${n}</small>`:''}</td>`;
        alt.push(`<li>${Y[0]} ${plain(Y[ri+1]||'')}, ${X[0]} ${plain(X[ci+1]||'')}: <b>${t}</b>${n?' ('+n+')':''}</li>`);
      });
      h+='</tr>';
    });
    h+='</tbody></table>';
    return visShell(b,inCard,h,'<ul>'+alt.join('')+'</ul>');
  }
  const B=p.bands||[];
  const h=`<div class="v-range"><div class="v-ends" aria-hidden="true"><span>${p.from||''}</span><i></i><span>${p.to||''}</span></div><div class="v-bands">`+
    B.map(([l,n,t,w])=>`<div class="v-band" style="${toneCss(t,'l2')};--w:${+w||1}"><b>${l}</b>${n?`<small>${n}</small>`:''}</div>`).join('')+'</div></div>';
  const alt=`<p>From ${p.from||'the start'} to ${p.to||'the end'}:</p><ol>`+B.map(([l,n])=>`<li>${l}${n?': '+n:''}</li>`).join('')+'</ol>';
  return visShell(b,inCard,h,alt);
}

/* ---- flashcards ---- */
function renderFlash(b){

    fc.className='fc'+(back?' back':'');

    fc.innerHTML=`<span class="side">${back?'Answer':'Term'}</span><span class="cnt">${i+1} / ${b.cards.length}</span><div>${back?b.cards[i][1]:b.cards[i][0]}</div>`;
