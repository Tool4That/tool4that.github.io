 {id:'j5',title:'Evaluate a configuration',bloom:'Evaluate',sum:'Read a config or a system like an auditor: rank findings by impact and defend the order.',
  blocks:[
   C('Thinking like an auditor','Evaluate',
     P('At this grade you move from asking "is this a finding?" to asking "which finding do I fix first?" Rank by <b>impact</b> (how much an attacker gains) and <b>effort</b> (how fast you fix it). A domain admin backdoor outranks a missing login banner even though both are findings.'),
     TIPS('High impact: extra administrators, UID-0 backdoors, reverse shells, root SSH login, blank or shared passwords, and disabled firewall and antivirus.',
          'Medium: missing updates, weak password policy, insecure services beyond what the brief needs, and over-broad shares.',
          'Low but worth doing: banners, screen-lock timeouts, audit logging, SMBv1, and unauthorized media files.',
          'Always weigh availability risk: a "fix" that stops a required service is an outage, which is worse than leaving the finding for later.')),
    SCALE('Triage: impact first, effort second, availability always',{
     x:['Effort to fix','Quick','Slow'],
     y:['Impact','High','Medium','Low'],
     cells:[
       [['1. First','A second UID 0 account, a reverse-shell cron job, extra admins, a blank or guest password, root SSH login, or the firewall or antivirus turned off','l4'],['2. Second','Tracing how a backdoor got in: cron, systemd units, startup files, and new accounts','l4']],
       [['3. Third','A weak password policy, or an insecure service the brief leaves out','l3'],['4. Fourth','Missing updates and over-broad shares','l2']],
       [['5. Fifth','A login banner and a screen-lock timeout','l1'],['6. Last','Hunting unauthorized media files across the disk','muted']]]},
     {intro:'Read the rows from the top: impact decides first. Within a row, the quicker fix goes first because it removes risk sooner.',
      note:'<b>Availability can veto any cell.</b> Before each fix, ask whether it stops a required service or locks out an authorized user. If it does, harden and restrict instead: an outage is worse than a finding left for later.',
      caption:'Highest impact, lowest effort, and lowest availability risk first.',
      bloom:'Evaluate'}),
   ORDER('j5o','Rank the findings on one machine','Order these from fix-first to fix-last by impact, assuming each one falls outside the required services.',[
     ['A second account with UID 0','An unauthorized root. Total compromise; fix immediately.'],

     ['Your maintenance window closes in ten minutes. Which usually reduces the most risk per minute?',['Writing a login banner','Confirming only authorized admins remain and the firewall and antivirus are on','Renaming the Administrator account','Reading the whole config again'],1,'High-impact areas first. Cheap, high-value checks beat cosmetic ones under time pressure.'],

     ['Why rank findings at all instead of fixing them top to bottom?',['It looks professional','Time is limited and impact varies; ranking removes the most risk soonest','The firewall requires it','It is irrelevant'],1,'Triage is the skill. Highest impact, lowest effort, and lowest availability risk first.']
   ]),

  ]}

 id:'senior', grade:'Senior', range:'Advanced to team lead', color:'var(--l4)', chev:4,
 blooms:['An','E','Cr'], bloomCap:'Analyze, evaluate, and create. You build systems: a checklist, a role plan, and a runbook.',
 intro:'FreeBSD and web application security join the mix, and the differentiator shifts from knowledge to a team that works like a system: a checklist written from standards, clear roles, a time plan, and the discipline to understand every change before making it. This grade is where you create those artifacts, and own the ethics that come with the skill.',
 mentor:['Hand the pen to the learners. Your job here is to review what they create (checklist, role plan, and runbook) and leave the authorship to them.','Run full timed practice sessions on Lockdown Range or your own VMs, then debrief. The debrief, more than the run, is where the learning lands.','Train every fix by hand before anyone automates it. A script is a liability until someone on the team can explain it.','Make the ethics conversation explicit and recurring. These learners can now do real damage; the whole point is that they choose restraint.'],
 units:[
 {id:'se1',title:'FreeBSD',bloom:'Analyze',sum:'A different Unix: where the files live, how services and the firewall work, and how to map your Linux habits across.',
  blocks:[
   C('Translate your Linux instincts','Analyze',
     TIPS('FreeBSD is a Unix in its own right, distinct from Linux. The base system and third-party <b>ports/packages</b> are separate. Package tool: <code>pkg</code>.',
          'Services are enabled in <b>/etc/rc.conf</b> (or with <code>sysrc</code>) and started or stopped with <code>service</code>. FreeBSD runs rc scripts in place of systemd.',
          'FreeBSD has three firewalls built into the base system: <b>pf</b>, <b>ipfw</b>, and <b>ipf</b> (IPFILTER). pf rules live in <code>/etc/pf.conf</code>.',
          'Users: <code>pw</code> manages accounts; membership in the <b>wheel</b> group is required to <code>su</code> to root; sudo, if installed from packages, is configured in <code>/usr/local/etc/sudoers</code>.',
          'Updating: <code>freebsd-update fetch install</code> for the base system, <code>pkg update &amp;&amp; pkg upgrade</code> for packages. On a system installed from base packages (pkgbase, FreeBSD 15 and later), <code>pkg upgrade -r FreeBSD-base</code> patches the base instead.'),
    STACK('Base system and packages: two layers, two update paths',[
       {name:'Debian, Ubuntu, and Mint',layers:[['One package collection','Kernel, core tools, and applications alike<br>Patch it all: <code>apt upgrade</code><br>Config: <code>/etc</code>',2,'muted']]},
       {name:'FreeBSD',layers:[
         ['Packages and ports','Third-party software, such as sudo, bash, and nginx<br>Patch: <code>pkg upgrade</code><br>Files: <code>/usr/local</code><br>Config: <code>/usr/local/etc</code>',1,'l2'],
         ['Base system','Kernel and core userland, such as sh, sshd, and pf<br>Patch: <code>freebsd-update</code><br>Config: <code>/etc</code>',1,'l4']]}
     ],{intro:'On Linux one package manager patches everything. FreeBSD keeps two layers, and each layer has its own update tool and its own place for configuration.',
       note:'<b>Ports or packages?</b> The same third-party collection in two forms: ports build from source, and packages arrive prebuilt through <code>pkg</code>. Both install under <code>/usr/local</code>. On FreeBSD 15 and later, a system installed from base packages (pkgbase) patches its base with <code>pkg upgrade -r FreeBSD-base</code> as well.',
       caption:'Patch both layers, each with its own tool, and look for third-party configuration, such as sudoers, under /usr/local/etc.',
       key:[['l4','Base system, maintained by the FreeBSD project'],['l2','Third-party packages and ports'],['muted','One collection for everything (Debian family)']],
       alt:['Debian, Ubuntu, and Mint: one package collection holds the kernel, the core tools, and the applications. apt update then apt upgrade patches all of it, and configuration lives in /etc.',
            'FreeBSD, top layer: packages and ports, the third-party software such as sudo, bash, and nginx. pkg update then pkg upgrade patches it; its files live under /usr/local and its configuration under /usr/local/etc.',
            'FreeBSD, bottom layer: the base system, meaning the kernel and core userland such as sh, sshd, and pf. freebsd-update fetch install patches it (pkg upgrade -r FreeBSD-base on a pkgbase install), and its configuration lives in /etc.']}),
     CMDS('FreeBSD essentials',[
       ['cat /etc/passwd','Same format idea as Linux. Hunt for UID 0 accounts: besides root, some FreeBSD releases ship toor, a spare superuser whose login is disabled (* in master.passwd). Anything else at UID 0 is a finding.'],
       ['pw groupshow wheel','Who can su to root. Compare to the scenario brief.'],
       ['pw groupmod wheel -d dave','Remove dave from wheel.'],
       ['pw lock bob','Lock an account (pw unlock bob reverses it).'],
       ['sysrc -a','Show rc.conf settings (what is enabled at boot).'],
       ['service -e','List enabled services.'],
       ['service sshd restart','Start, stop, or restart a service by name.'],
       ['sockstat -4 -l','Listening IPv4 sockets with the owning process (FreeBSD’s answer to ss).'],
       ['pkg info','Installed packages. pkg which /path traces a file to its package.'],
       ['freebsd-update fetch install','Patch the base system. On a pkgbase install: pkg upgrade -r FreeBSD-base.'],
       ['vi /etc/pf.conf','Firewall rules. Then: pfctl -f /etc/pf.conf to load, pfctl -e to enable.']
     ])),
    COMPARE('Linux habit, FreeBSD equivalent',[
     {name:'Linux',tag:'Debian, Ubuntu, and Mint',tone:'muted',
      svg:{label:'On Linux, systemctl asks systemd to enable or start a service, and systemd reads that service’s unit file.',view:'0 0 250 74',
       body:'<g fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"><rect x="1" y="14" width="72" height="28" rx="5"/><rect x="89" y="14" width="72" height="28" rx="5"/><rect x="177" y="14" width="72" height="28" rx="5"/></g><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="37" y="32">systemctl</text><text x="125" y="32">systemd</text><text x="213" y="32">unit files</text></g><g fill="none" stroke="var(--ink-3)" stroke-width="1.5"><path d="M74 28 H86" marker-end="url(#arrow)"/><path d="M162 28 H174" marker-end="url(#arrow)"/></g><text x="125" y="62" font-size="10" text-anchor="middle" fill="var(--ink-2)">one manager starts and watches every service</text>'},
      rows:[['Enable at boot','<code>systemctl enable ssh</code>'],['Start now','<code>systemctl start ssh</code>'],['Install software','<code>apt install</code>'],['Patch','<code>apt upgrade</code>, kernel included'],['Listening ports','<code>ss -tulnp</code>'],['Accounts','<code>useradd</code>, <code>usermod</code>, and <code>passwd</code>'],['Admin power','The sudo group'],['Firewall','ufw, nftables, or iptables']],
      hook:'one manager, systemd, runs every service.'},
     {name:'FreeBSD',tag:'Base system plus pkg',tone:'l4',
      svg:{label:'On FreeBSD, sysrc writes a YES switch into /etc/rc.conf, and at boot rc runs the rc.d script of every service set to YES.',view:'0 0 250 74',
       body:'<g fill="var(--paper)" stroke="var(--l4)" stroke-width="1.5"><rect x="1" y="14" width="72" height="28" rx="5"/><rect x="89" y="14" width="72" height="28" rx="5"/><rect x="177" y="14" width="72" height="28" rx="5"/></g><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="37" y="32">sysrc</text><text x="125" y="32">/etc/rc.conf</text><text x="213" y="32">rc.d scripts</text></g><g fill="none" stroke="var(--l4)" stroke-width="1.5"><path d="M74 28 H86" marker-end="url(#arrow-l4)"/><path d="M162 28 H174" marker-end="url(#arrow-l4)"/></g><text x="125" y="62" font-size="10" text-anchor="middle" fill="var(--ink-2)">at boot, rc runs each service set to YES</text>'},
      rows:[['Enable at boot','<code>sysrc sshd_enable=YES</code>'],['Start now','<code>service sshd start</code>'],['Install software','<code>pkg install</code>'],['Patch','<code>freebsd-update fetch install</code> for the base, <code>pkg upgrade</code> for packages'],['Listening ports','<code>sockstat -4 -l</code>'],['Accounts','<code>pw useradd</code>, <code>pw usermod</code>, and <code>passwd</code>'],['Admin power','The wheel group (for su to root)'],['Firewall','pf (<code>/etc/pf.conf</code>), ipfw, or ipf: one per host']],
      hook:'a list of YES switches in /etc/rc.conf, read at every boot.'}
   ],{intro:'Each row label is a job you already do on Linux. Find the same label in the FreeBSD column for the tool that does that job there.',
     note:'Typing a Linux command on FreeBSD usually returns “command not found”. That message is your cue to translate the habit, then read the FreeBSD man page.',
     caption:'The jobs match and the tools differ: FreeBSD manages services with rc.conf and the service command, packages with pkg, and accounts with pw.',
     alt:['Enable a service at boot: systemctl enable ssh on Linux; sysrc sshd_enable=YES on FreeBSD, which writes the setting into /etc/rc.conf.',
          'Start a service now: systemctl start ssh on Linux; service sshd start on FreeBSD.',
          'Install software: apt install on Linux; pkg install on FreeBSD.',
          'Patch: apt upgrade on Linux, kernel included; on FreeBSD, freebsd-update fetch install for the base system and pkg upgrade for packages.',
          'List listening ports with their processes: ss -tulnp on Linux; sockstat -4 -l on FreeBSD.',
          'Manage accounts: useradd, usermod, and passwd on Linux; pw useradd, pw usermod, and passwd on FreeBSD.',
          'Admin power: the sudo group on Debian, Ubuntu, and Mint; the wheel group, which may su to root, on FreeBSD.',
          'Firewall: ufw, nftables, or iptables on Linux; pf (rules in /etc/pf.conf), ipfw, or ipf on FreeBSD, one per host.',
          'The service model: on Linux, systemctl asks systemd, which reads unit files and watches every service. On FreeBSD, sysrc writes YES switches into /etc/rc.conf, and at boot rc runs the rc.d script of every service set to YES.']}),
   COMPARE('su and sudo on FreeBSD: two doors to root',[
     {name:'su',tag:'Base system',tone:'l4',
      svg:{label:'su: you type root’s password and get a root shell that runs every command.',
       body:'<rect x="2" y="22" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/><text x="21" y="40" text-anchor="middle" font-size="11" fill="var(--ink)">you</text><path d="M42 36 H118" fill="none" stroke="var(--l4)" stroke-width="2" marker-end="url(#arrow-l4)"/><text x="80" y="28" text-anchor="middle" font-size="9" fill="var(--ink-2)">root’s password</text><rect x="122" y="10" width="74" height="54" rx="6" fill="var(--paper)" stroke="var(--l4)" stroke-width="2"/><text x="159" y="34" text-anchor="middle" font-size="11" fill="var(--ink)">root shell</text><text x="159" y="50" text-anchor="middle" font-size="9" fill="var(--ink-2)">every command</text>'},
      rows:[['Asks for','The <b>target</b> account’s password: root’s'],['Who may use it','Members of the <b>wheel</b> group'],['Gives','A whole root shell, until you type <code>exit</code>'],['Take it away','<code>pw groupmod wheel -d dave</code>']],
      hook:'borrowing the master key.'},
     {name:'sudo',tag:'Package, if installed',tone:'l2',
      svg:{label:'sudo: you type your own password, and the sudoers rules allow one command at a time.',
       body:'<rect x="2" y="22" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/><text x="21" y="40" text-anchor="middle" font-size="11" fill="var(--ink)">you</text><path d="M42 36 H118" fill="none" stroke="var(--l2)" stroke-width="2" marker-end="url(#arrow-l2)"/><text x="80" y="28" text-anchor="middle" font-size="9" fill="var(--ink-2)">your password</text><rect x="122" y="10" width="74" height="54" rx="6" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="159" y="34" text-anchor="middle" font-size="11" fill="var(--ink)">sudoers</text><text x="159" y="50" text-anchor="middle" font-size="9" fill="var(--ink-2)">one command</text>'},
      rows:[['Asks for','Your <b>own</b> password'],['Who may use it','Whoever <code>/usr/local/etc/sudoers</code> names. The wheel group counts only where a <code>%wheel</code> line is switched on.'],['Gives','One command at a time, as the rules allow'],['Take it away','Delete the user’s lines with <code>visudo</code>']],
      hook:'a guest list for specific rooms.'}
   ],{intro:'Both lead to root, and they are separate doors. Taking someone out of wheel closes the su door and leaves their sudoers rules open, so check both.',
     note:'<b>Power belongs to UID 0, whatever the name.</b> Every account with UID 0 is a superuser. Some FreeBSD releases ship <b>toor</b>, a spare UID 0 account with its login disabled; any other UID 0 account is a finding. On Debian, Ubuntu, and Mint, the <b>sudo</b> group grants sudo.',
     caption:'su asks for root’s password and checks wheel; sudo asks for your own password and checks sudoers.'}),
   C('A minimal pf firewall','Apply',
     TERM('# /etc/pf.conf  (default deny inbound, allow outbound, permit SSH)\next_if = "em0"\nset skip on lo\nblock in all\npass out all keep state\npass in on $ext_if proto tcp to ($ext_if) port 22 keep state'),
     TIPS('Load and enable: <code>pfctl -f /etc/pf.conf</code> then <code>pfctl -e</code>. Check rules with <code>pfctl -sr</code>.',
          'Enable at boot: <code>sysrc pf_enable=YES</code> and <code>sysrc pf_rules=/etc/pf.conf</code>.',
          'Open only the ports the brief needs. The idea is identical to ufw; the syntax is new.')),
    PATH('pf reads every rule, and the last match decides',[
     {name:'A new SSH connection arrives',tag:'TCP 22, inbound',tone:'muted',note:'pf checks it against the rules from top to bottom.',via:'next rule'},
     {name:'block in all',tag:'Rule 1: matches',tone:'bad',note:'Verdict so far: <b>block</b>. pf keeps reading.',via:'next rule'},
     {name:'pass out all keep state',tag:'Rule 2: other traffic',tone:'muted',note:'This rule covers outbound traffic, and the packet is inbound.',via:'next rule'},
     {name:'pass in on $ext_if proto tcp to ($ext_if) port 22 keep state',tag:'Rule 3: matches',tone:'ok',note:'Verdict now: <b>pass</b>. This is the last rule, so this verdict stands.',via:'end of the rules'},
     {name:'Verdict: pass',tag:'The last match wins',tone:'ok',note:'pf records the connection in its state table, so the replies and later packets skip the rules.'}
   ],{bloom:'Apply',intro:'Read the sample rules above the way pf does. One difference from ufw matters: pf keeps reading after a match, and the <b>last</b> matching rule decides.',
     note:'<b>Two shortcuts.</b> A rule marked <code>quick</code> decides on the spot and ends the search. And once a connection is in the state table, its later packets and replies skip the rules entirely. <b>Linux flips the order:</b> iptables and ufw stop at the <b>first</b> matching rule, so these three lines there would block SSH.',
     caption:'A packet for TCP port 80 matches only rule 1, so it ends blocked. In pf, put the broad rules first and the specific exceptions after them.',
     key:[['bad','A matching rule that blocks'],['ok','A matching rule that passes'],['muted','The packet, and a rule for other traffic']],
     alt:['A new inbound SSH connection (TCP port 22) arrives, and pf checks it against every rule from top to bottom.',
          'Rule 1, block in all, matches. The verdict so far is block, and pf keeps reading.',
          'Rule 2, pass out all keep state, covers outbound traffic, so this inbound packet passes it by.',
          'Rule 3, pass in on $ext_if proto tcp to ($ext_if) port 22 keep state, matches. The verdict is now pass.',
          'At the end of the rules, the last match wins: the packet passes, and pf records the connection in its state table, so the replies and later packets skip the rules.',
          'A packet for TCP port 80 matches only rule 1, so it is blocked.',
          'A rule marked quick decides at once and ends the search, and packets of a recorded connection skip the rules. iptables and ufw use the first match instead, so the same three lines there would block SSH.']}),

/* =====================================================================
   STORAGE (per-viewer, this browser only; degrades to memory if blocked)
   ===================================================================== */
const KEY='defense-ladder-v1';
let MEM={};
const store={
  load(){ try{ const r=localStorage.getItem(KEY); MEM=r?JSON.parse(r):{}; }catch(e){ MEM={}; } return MEM; },
  save(){ try{ localStorage.setItem(KEY,JSON.stringify(MEM)); }catch(e){} },
  get(id){ return MEM[id]; },
  set(id,v){ MEM[id]=v; this.save(); }
};
store.load();

/* theme */
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  themeBtn.textContent='Theme: '+(t||'auto');
}
let theme=(function(){ try{return localStorage.getItem(KEY+'-theme')||'auto';}catch(e){return 'auto';} })();
applyTheme(theme);
themeBtn.addEventListener('click',()=>{
  theme = theme==='auto'?'light':theme==='light'?'dark':'auto';
  try{localStorage.setItem(KEY+'-theme',theme);}catch(e){}
  applyTheme(theme);
});

/* =====================================================================
   small helpers
   ===================================================================== */
const el=(tag,cls,html)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const bloomName={R:'Remember',U:'Understand',A:'Apply',An:'Analyze',E:'Evaluate',Cr:'Create'};
const bloomFull=['Remember','Understand','Apply','Analyze','Evaluate','Create'];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* chevron icon for a level (stacked chevrons = grade) */
function chevSvg(n,color){
  const w=16,gap=5; let p='';
  for(let i=0;i<4;i++){
    const on=i<n;
    p+=`<path d="M2 ${4+i*gap} L8 ${1+i*gap} L14 ${4+i*gap}" fill="none" stroke="${on?color:'var(--line)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  return `<svg width="${w}" height="26" viewBox="0 0 16 26" aria-hidden="true">${p}</svg>`;
}

/* =====================================================================
   NAV state
   ===================================================================== */
const PAGES=[['plan','Study plan'],['scorecard','Hardening scorecard'],['progress','My progress'],['about','About & links']];
let current={level:LEVELS[0].id, unit:LEVELS[0].units[0].id, page:'level'};

function levelById(id){return LEVELS.find(l=>l.id===id);}
function allInteractiveIds(){
  const ids=[];
  LEVELS.forEach(l=>l.units.forEach(u=>u.blocks.forEach(b=>{ if(b.id) ids.push(b.id); })));
  return ids;
}
function isDone(id){const v=store.get(id);return v&&v.done;}

/* =====================================================================
   RAIL
   ===================================================================== */
function buildRail(){
  const ladder=document.getElementById('ladder');
  ladder.innerHTML='';
  LEVELS.forEach(l=>{
    const b=el('button','lv');
    b.style.setProperty('--c',l.color);
    b.setAttribute('role','tab');
    b.innerHTML=chevSvg(l.chev,l.color)+`<span class="lv-t"><span class="lv-g">${l.grade}</span><span class="lv-p">${l.range}</span></span>`;
    b.addEventListener('click',()=>{current={level:l.id,unit:l.units[0].id,page:'level'};render();});
    ladder.appendChild(b);
  });
  const pages=document.getElementById('pages');
  pages.innerHTML='';
  PAGES.forEach(([id,label])=>{
    const b=el('button','pg',label);
    b.addEventListener('click',()=>{current={page:id};render();});
    pages.appendChild(b);
  });
}

function markRail(){
  const lvs=document.querySelectorAll('#ladder .lv');
  LEVELS.forEach((l,i)=>lvs[i].setAttribute('aria-current', current.page==='level'&&current.level===l.id?'true':'false'));
  const pgs=document.querySelectorAll('#pages .pg');
  pgs.forEach((p,i)=>p.setAttribute('aria-current', current.page===PAGES[i][0]?'true':'false'));
}

/* =====================================================================
   RENDER
   ===================================================================== */
const main=document.getElementById('main');
let booted=false;
function render(){
  main.innerHTML='';
  if(current.page==='level') renderLevel();
  else if(current.page==='plan') renderPlan();
  else if(current.page==='scorecard') renderScorecard();
  else if(current.page==='progress') renderProgress();
  else if(current.page==='about') renderAbout();
  markRail();
  if(booted) syncHash();
  main.focus();
  window.scrollTo(0,0);
}

/* =====================================================================
   UNIT LINKS: #<grade>/<unit>, e.g. #freshman/f7 (unit ids are stable; never renumber)
   ===================================================================== */
function syncHash(){
  const h=current.page==='level'?'#'+current.level+'/'+current.unit:'';
  if(location.hash===h) return;
  try{ history.replaceState(null,'',location.pathname+location.search+h); }catch(e){}
}
function unitFromHash(){
  const m=/^#([a-z]+)\/([a-z]+[0-9]+)$/.exec(location.hash||'');
  const L=m&&levelById(m[1]);
  const U=L&&L.units.find(u=>u.id===m[2]);
  return U?{level:L.id,unit:U.id,page:'level'}:null;
}
function route(){
  const target=unitFromHash();
  current=target||{level:LEVELS[0].id,unit:LEVELS[0].units[0].id,page:'level'};
  render();
  if(target){ const uh=main.querySelector('.uhead'); if(uh) uh.scrollIntoView({block:'start'}); }
}
window.addEventListener('hashchange',route);

function renderLevel(){
  const L=levelById(current.level);
  const head=el('div','lvhead');
  head.style.setProperty('--accent',L.color);
  document.documentElement.style.setProperty('--accent',L.color);
  head.innerHTML=`<div class="grade">${L.grade}</div><div class="range">${L.range}</div>`;
  const bloom=el('div','bloom');
  bloomFull.forEach(bf=>{
    const on=L.blooms.map(b=>bloomName[b]).includes(bf);
    const s=el('span',on?'on':'',bf);
    bloom.appendChild(s);
  });
  head.appendChild(bloom);
  head.appendChild(el('div','bloom-cap',L.bloomCap));
  head.appendChild(el('p','intro',L.intro));
  if(L.mentor){
    const d=el('details','mentor');
    d.innerHTML='<summary>For instructors and study leads</summary><ul>'+L.mentor.map(m=>`<li>${m}</li>`).join('')+'</ul>';
    head.appendChild(d);
  }
  main.appendChild(head);

  // unit chips
  const units=el('div','units');
  L.units.forEach(u=>{
    const chip=el('button','unit');
    const st=unitStatus(u);
    chip.innerHTML=`<span class="dot ${st}"></span>${u.title}`;
    chip.setAttribute('aria-current', u.id===current.unit?'true':'false');
    chip.style.setProperty('--accent',L.color);
    chip.addEventListener('click',()=>{current.unit=u.id;render();});
    units.appendChild(chip);
  });
  main.appendChild(units);

  const U=L.units.find(u=>u.id===current.unit)||L.units[0];
  const uh=el('div','uhead');
  uh.innerHTML=`<h2>${U.title}<span class="blm">${U.bloom}</span></h2><p class="sum">${U.sum}</p>`;
  main.appendChild(uh);

  U.blocks.forEach(b=>main.appendChild(renderBlock(b,L)));

  // unit pager
  const idx=L.units.findIndex(u=>u.id===U.id);
  const pager=el('div','row');
  if(idx>0){const p=el('button','btn sec','\u2190 '+L.units[idx-1].title);p.addEventListener('click',()=>{current.unit=L.units[idx-1].id;render();});pager.appendChild(p);}
  if(idx<L.units.length-1){const n=el('button','btn','Next: '+L.units[idx+1].title+' \u2192');n.addEventListener('click',()=>{current.unit=L.units[idx+1].id;render();});pager.appendChild(n);}
  else{
    const li=LEVELS.findIndex(x=>x.id===L.id);
    if(li<LEVELS.length-1){const n=el('button','btn','Start '+LEVELS[li+1].grade+' \u2192');n.addEventListener('click',()=>{current={level:LEVELS[li+1].id,unit:LEVELS[li+1].units[0].id,page:'level'};render();});pager.appendChild(n);}
    else{const n=el('button','btn','See the study plan \u2192');n.addEventListener('click',()=>{current={page:'plan'};render();});pager.appendChild(n);}
  }
  main.appendChild(pager);
}

function unitStatus(u){
  const ids=u.blocks.filter(b=>b.id).map(b=>b.id);
  if(!ids.length) return '';
  const done=ids.filter(isDone).length;
  if(done===0) return '';
  if(done===ids.length) return 'full';
  return 'part';
}
/* =====================================================================
   BLOCK RENDERERS
   ===================================================================== */
function renderBlock(b,L,inCard){
  switch(b.t){
    case 'c': return renderCard(b);
    case 'p': return el('p',null,b.html);
    case 'tips': { const u=el('ul');b.items.forEach(i=>u.appendChild(el('li',null,i)));return u; }
    case 'cmds': return renderCmds(b);
    case 'term': return renderTerm(b);
    case 'note': return el('div','note'+(b.warn?' warn':''),b.html);
    case 'areas': return renderAreas();
    case 'flash': return renderFlash(b);
    case 'quiz': return renderQuiz(b);
    case 'match': return renderMatch(b);
    case 'spot': return renderSpot(b);
    case 'order': return renderOrder(b);
    case 'lab': return renderLab(b);
    case 'reflect': return renderReflect(b);
    case 'builder': return renderBuilder(b);
    case 'planner': return renderPlanner(b);
    case 'timer': return renderTimer(b);
    case 'links': return renderLinks(b);
    case 'compare': return renderCompare(b,inCard);
    case 'anatomy': return renderAnatomy(b,inCard);
    case 'stack': return renderStack(b,inCard);
    case 'path': return renderPath(b,inCard);
    case 'seq': return renderSeq(b,inCard);
    case 'hier': return renderHier(b,inCard);
    case 'venn': return renderVenn(b,inCard);
    case 'scale': return renderScale(b,inCard);
    default: return el('div');
  }
}

function renderCard(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">${b.bloom}</span>`));
  b.parts.forEach(p=>c.appendChild(renderBlock(p,null,true)));
  return c;
}
function renderCmds(b){
  const wrap=el('div');
  if(b.title) wrap.appendChild(el('p',null,`<b>${b.title}</b>`));
  const t=el('table','cmds');
  b.rows.forEach(([cmd,why])=>{
    const tr=el('tr');
    tr.appendChild(el('td',null,`<code>${esc(cmd)}</code>`));
    tr.appendChild(el('td',null,why));
    t.appendChild(tr);
  });
  wrap.appendChild(t);
  return wrap;
}
function renderTerm(b){ return el('pre','term',esc(b.text)); }

/* =====================================================================
   VISUAL BLOCKS (the constructor notes near the top describe the data)
   ===================================================================== */
const TONES={l1:['--l1','--tint1'],l2:['--l2','--tint2'],l3:['--l3','--tint3'],l4:['--l4','--tint4'],muted:['--ink-3','--paper-2'],ok:['--ok','--ok-bg'],bad:['--bad','--bad-bg'],amber:['--amber','--amber-bg']};
const toneCss=(t,d)=>{const k=TONES[t]||TONES[d]||TONES.l2;return `--c:var(${k[0]});--bgc:var(${k[1]})`;};
const plain=s=>String(s==null?'':s).replace(/<br\s*\/?>/gi,'; ').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
const attrq=s=>plain(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
const andList=a=>{a=a.filter(x=>x!==''&&x!=null);return a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+', and '+a[a.length-1];};
const dot=s=>{s=String(s==null?'':s).trim();return !s||/[.!?:]$/.test(plain(s))?s:s+'.';};
const asList=x=>x==null||x===''?[]:Array.isArray(x)?x:[x];
let visSeq=0;

/* SVG presentation attributes holding var(...) move into style, where every browser reads them */
function svgVarAttrs(body){
  return body.replace(/<([a-zA-Z][\w-]*)((?:[^>"']|"[^"]*"|'[^']*')*?)(\/?)>/g,(m,tag,attrs,sl)=>{
    const st=[];
    attrs=attrs.replace(/\s(fill|stroke|stop-color|color)\s*=\s*"(var\([^"]*\))"/g,(x,n,v)=>{st.push(n+':'+v);return '';});
    if(!st.length) return m;
    if(/\sstyle\s*=\s*"/.test(attrs)) attrs=attrs.replace(/\sstyle\s*=\s*"([^"]*)"/,(x,v)=>` style="${v.replace(/;?\s*$/,';')}${st.join(';')}"`);
    else attrs+=` style="${st.join(';')}"`;
    return `<${tag}${attrs}${sl}>`;
  });
}
/* an author's {body,label,view,width} drawing, with its own arrowhead markers */
function svgHtml(svg){
  if(!svg) return '';
  const s=typeof svg==='string'?{body:svg}:svg;
  const uid='v'+(++visSeq), used=new Set();
  let body=String(s.body||'').replace(/url\(#arrow(?:-([a-z0-9]+))?\)/g,(m,t)=>{const k=t&&TONES[t]?t:'';used.add(k);return `url(#${uid}-arrow${k?'-'+k:''})`;});
  body=svgVarAttrs(body);
  const defs=[...used].map(k=>`<marker id="${uid}-arrow${k?'-'+k:''}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(${k?TONES[k][0]:'--ink-3'})"/></marker>`).join('');
  const a11y=s.label?`role="img" aria-label="${attrq(s.label)}"`:'aria-hidden="true"';
  const size=(s.width?` width="${s.width}"`:'')+(s.height?` height="${s.height}"`:'');
  return `<svg viewBox="${s.view||'0 0 200 74'}"${size} ${a11y} focusable="false">${defs?'<defs>'+defs+'</defs>':''}${body}</svg>`;
}
/* shared frame: card or in-card heading, intro, figure, note, caption, key, and the text version */
function visShell(b,inCard,figHtml,altAuto){
  const o=b.o||{};
  const wrap=el('div',inCard?'v-in':'card');
  if(b.title) wrap.appendChild(el(inCard?'h4':'h3',null,inCard?b.title:`${b.title}<span class="blm">${o.bloom||'Understand'}</span>`));
  if(o.intro) wrap.appendChild(el('p','v-why',o.intro));
  const fig=el('figure','vis');
  let h=figHtml;
  if(o.note) h+=`<p class="v-note">${o.note}</p>`;
  h+=`<figcaption class="v-cap">${o.caption||b.title||''}</figcaption>`;
  if(o.key&&o.key.length) h+=`<div class="v-key">${o.key.map(([t,l])=>`<span style="${toneCss(t)}">${l}</span>`).join('')}</div>`;
  const alt=o.alt?(Array.isArray(o.alt)?'<ol>'+o.alt.map(x=>`<li>${x}</li>`).join('')+'</ol>':`<p>${o.alt}</p>`):altAuto;
  h+=`<details class="v-alt"><summary>Read it as text</summary>${alt}</details>`;
  fig.innerHTML=h;
  wrap.appendChild(fig);
  return wrap;
}

/* ---- COMPARE ---- */
function renderCompare(b,inCard){
  const cols=b.cols||[], hn=inCard?'h5':'h4';
  const html=`<div class="v-cmp v-n${cols.length}">`+cols.map(c=>
    `<div class="v-col" style="${toneCss(c.tone,'l2')}"><${hn} class="v-colh"><span>${c.name}</span>${c.tag?`<span class="v-tag">${c.tag}</span>`:''}</${hn}>`+
    svgHtml(c.svg)+
    ((c.rows||[]).length?'<dl>'+c.rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')+'</dl>':'')+
    (c.hook?`<div class="v-mem">Remember it as: ${c.hook}</div>`:'')+'</div>').join('')+'</div>';
  const alt=cols.map(c=>`<p><b>${dot(c.name+(c.tag?', '+c.tag:''))}</b> `+(c.rows||[]).map(([k,v])=>`${k}: ${dot(v)}`).join(' ')+
    (c.svg&&c.svg.label?' '+dot(c.svg.label):'')+(c.hook?' Remember it as: '+dot(c.hook):'')+'</p>').join('');
  return visShell(b,inCard,html,alt);
}

/* ---- ANATOMY ---- */
function anatBox(x){
  if(x.core) return `<div class="v-core">${x.name||''}${x.sub?`<div class="v-sub">${x.sub}</div>`:''}</div>`;
  const fld=(f,cls)=>f&&f.length?`<div class="${cls}"><b>${f[0]}</b>${f.slice(1).join('<br>')}</div>`:'';
  const kids=(x.children||[]).map(anatBox).join('');
  const inner=(x.panel?`<div class="v-panel"><b>${x.panel[0]}</b>${x.panel.slice(1).join(' · ')}</div>`:'')+(kids?(x.grid?`<div class="v-grid">${kids}</div>`:kids):'');
  const body=(x.head||x.trail)?`<div class="v-arow">${fld(x.head,'v-hdr')}<div class="v-inner">${inner}</div>${fld(x.trail,'v-trl')}</div>`:(inner?`<div class="v-inner">${inner}</div>`:'');
  return `<div class="v-box" style="${toneCss(x.tone,'l2')}"><div class="v-blabel"><span>${x.name||''}</span>${x.tag?`<span class="v-tag">${x.tag}</span>`:''}</div>`+
    (x.text?`<div class="v-btxt">${x.text}</div>`:'')+body+svgHtml(x.svg)+'</div>';
}
function anatAlt(x){
  if(x.core) return `<li>${x.name||''}${x.sub?': '+x.sub:''}</li>`;
  const f=(a)=>a&&a.length?` ${a[0]}: ${dot(andList(a.slice(1).map(plain)))}`:'';
  const kids=(x.children||[]).map(anatAlt).join('');
  return `<li><b>${x.name||''}</b>${x.tag?' ('+x.tag+')':''}.${x.text?' '+dot(plain(x.text)):''}${f(x.head)}${f(x.panel)}${f(x.trail)}${kids?' Inside it:<ul>'+kids+'</ul>':''}</li>`;
}
function anatSay(x){
  const k=(x.children||[]).filter(c=>c.name);
  if(!k.length) return plain(x.name);
  if(k.length===1&&!x.grid) return plain(x.name)+' contains '+anatSay(k[0]);
  return plain(x.name)+' contains '+andList(k.map(c=>plain(c.name)));
}
function renderAnatomy(b,inCard){
  const o=b.o||{}, boxes=b.boxes||[];
  const label=o.label||dot(boxes.map(anatSay).join('; '));
  const strip=o.strip?`<div class="v-strip" aria-hidden="true"><b>${o.strip[0]}</b><code>${o.strip[1]}</code></div>`:'';
  const F=o.facts;
  const facts=F?`<div class="v-facts"><table><thead><tr>${F.head.map((h,i)=>i||h?`<th scope="col">${h}</th>`:'<td></td>').join('')}</tr></thead><tbody>`+
    F.rows.map(r=>'<tr>'+r.map((c,i)=>i?`<td>${c}</td>`:`<th scope="row">${c}</th>`).join('')+'</tr>').join('')+'</tbody></table></div>':'';
  const html=`<div class="v-anat${F?' v-hasfacts':''}"><div><div class="v-boxes" role="img" aria-label="${attrq(label)}">${boxes.map(anatBox).join('')}</div>${strip}</div>${facts}</div>`;
  const alt='<ul>'+boxes.map(anatAlt).join('')+'</ul>'+(o.strip?`<p>${o.strip[0]}: ${o.strip[2]||o.strip[1]}</p>`:'');
  return visShell(b,inCard,html,alt);
}

/* ---- STACK ---- */
function renderStack(b,inCard){
  const S=b.stacks||[];
  const sum=s=>(s.layers||[]).reduce((n,l)=>n+(l[2]||1),0);
  const rows=Math.max(1,...S.map(sum));
  const first=[];
  let h=`<div class="v-stack" style="grid-template-columns:repeat(${S.length},minmax(0,1fr));grid-template-rows:auto repeat(${rows},minmax(2.6em,auto))">`;
  const alt=[];
  S.forEach((s,ci)=>{
    h+=`<div class="v-sth" style="grid-column:${ci+1};grid-row:1">${s.name||''}</div>`;
    let r=0, num=(s.layers||[]).length; const li=[];
    (s.layers||[]).forEach(l=>{
      const sp=l[2]||1;
      h+=`<div class="v-layer" style="${toneCss(l[3]||s.tone,'l2')};grid-column:${ci+1};grid-row:${r+2} / span ${sp}"><b>${s.numbered?`<span class="v-num">${num}</span>`:''}<span>${l[0]}</span></b>${l[1]?`<small>${l[1]}</small>`:''}</div>`;
      if(ci===0) for(let k=0;k<sp;k++) first[r+k]=plain(l[0]);
      let t=(s.numbered?num+' ':'')+l[0]+(l[1]?' ('+l[1]+')':'');
      if(ci>0&&S[0]){const cov=[...new Set(first.slice(r,r+sp).filter(Boolean))];if(cov.length) t+=`, lining up with ${andList(cov)} in ${plain(S[0].name)}`;}
      li.push(`<li>${t}</li>`);
      r+=sp; num--;
    });
    alt.push(`<p><b>${s.name||''}</b>, top to bottom:</p><ul>${li.join('')}</ul>`);
  });
  h+='</div>';
  return visShell(b,inCard,h,alt.join(''));
}

/* ---- PATH ---- */
function renderPath(b,inCard){
  const H=b.hops||[];
  const arrow='<svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true" focusable="false"><path d="M1 7 H15" style="stroke:var(--ink-2);stroke-width:2;fill:none"/><path d="M13 2 L21 7 L13 12 z" style="fill:var(--ink-2)"/></svg>';
  let h=`<div class="v-path${H.length<=3?' v-row':H.length===4?' v-row4':''}">`;
  const alt=[];
  H.forEach((x,i)=>{
    const notes=asList(x.note);
    h+=`<div class="v-hop" style="${toneCss(x.tone,'l2')}"><b>${x.name}</b>${x.tag?`<span class="v-tag">${x.tag}</span>`:''}`+
      (notes.length===1?`<div>${notes[0]}</div>`:notes.length?'<ul>'+notes.map(n=>`<li>${n}</li>`).join('')+'</ul>':'')+'</div>';
    if(i<H.length-1) h+=`<div class="v-arr">${arrow}${x.via?`<span>${x.via}</span>`:''}</div>`;
    alt.push(`<li><b>${x.name}</b>${x.tag?' ('+x.tag+')':''}.${notes.length?' '+notes.map(dot).join(' '):''}${x.via&&i<H.length-1?' Then: '+dot(x.via):''}</li>`);
  });
  h+='</div>';
  return visShell(b,inCard,h,'<ol>'+alt.join('')+'</ol>');
}

/* ---- SEQ ---- */
function renderSeq(b,inCard){
  const alt=[];
  const items=(b.steps||[]).map((s,i)=>{
    if(Array.isArray(s)){
      alt.push(`<li><b>${s[0]}</b>${s[1]?': '+s[1]:''}</li>`);
      return `<li style="${toneCss(s[2],'l2')}"><span class="v-sn">${i+1}</span><span class="v-sl">${s[0]}</span>${s[1]?`<span class="v-sd">${s[1]}</span>`:''}</li>`;
    }
    const br=s.branches||[];
    alt.push(`<li><b>Decision: ${s.ask}</b>${s.detail?' '+dot(s.detail):''} ${br.map(([k,v])=>`${k}: ${dot(v)}`).join(' ')}</li>`);
    return `<li class="v-dec" style="${toneCss(s.tone,'amber')}"><span class="v-sn"><span>${i+1}</span></span><span class="v-sl">${s.ask}</span>${s.detail?`<span class="v-sd">${s.detail}</span>`:''}`+
      (br.length?`<div class="v-br">${br.map(([k,v])=>`<div><b>${k}</b>${v}</div>`).join('')}</div>`:'')+'</li>';
  });
  return visShell(b,inCard,`<ol class="v-seq">${items.join('')}</ol>`,'<ol>'+alt.join('')+'</ol>');
}

/* ---- HIER ---- */
function hierNode(x){
  const k=x.children||[];
  return `<li><span class="v-node" style="${toneCss(x.tone,'l2')}"><b>${x.name}</b>${x.note?`<small>${x.note}</small>`:''}</span>${k.length?'<ul>'+k.map(hierNode).join('')+'</ul>':''}</li>`;
}
function hierAlt(x){
  const k=x.children||[];
  return `<li>${x.name}${x.note?': '+x.note:''}${k.length?'<ul>'+k.map(hierAlt).join('')+'</ul>':''}</li>`;
}
function renderHier(b,inCard){
  const o=b.o||{}, R=b.root;
  if(Array.isArray(R)){
    const top=o.top||'Wins', bottom=o.bottom||'Yields';
    const h=`<div class="v-ladder"><div class="v-axis" aria-hidden="true"><span>${top}</span><i></i><span>${bottom}</span></div><ol>`+
      R.map((r,i)=>`<li style="${toneCss(r[2],'l2')}"><span class="v-num">${i+1}</span><span><b>${r[0]}</b>${r[1]?`<small>${r[1]}</small>`:''}</span></li>`).join('')+'</ol></div>';
    const alt=`<p>From the top (${top}) to the bottom (${bottom}):</p><ol>`+R.map(r=>`<li>${r[0]}${r[1]?': '+r[1]:''}</li>`).join('')+'</ol>';
    return visShell(b,inCard,h,alt);
  }
  return visShell(b,inCard,`<ul class="v-tree">${hierNode(R)}</ul>`,`<ul>${hierAlt(R)}</ul>`);
}

/* ---- VENN ---- */
function renderVenn(b,inCard){
  const o=b.o||{}, S=(b.sets||[]).slice(0,3), three=S.length===3;
  const G=three?{vb:'0 0 300 270',c:[[115,100],[185,100],[150,160]],r:72,nm:[[60,22],[240,22],[150,258]],reg:{A:[82,82],B:[218,82],C:[150,207],AB:[150,74],AC:[110,150],BC:[190,150],ABC:[150,122]}}
               :{vb:'0 0 300 200',c:[[110,108],[190,108]],r:80,nm:[[70,18],[230,18]],reg:{A:[68,108],B:[232,108],AB:[150,108]}};
  const idx={A:0,B:1,C:2}, deft=['l1','l3','l2'];
  const regs=[];
  S.forEach((s,i)=>{ if((s.items||[]).length) regs.push({k:'ABC'[i],name:plain(s.name)+' only',items:s.items}); });
  (o.overlaps||[]).forEach(v=>{
    const k=String(v.sets||'').toUpperCase().split('').filter(c=>idx[c]!=null&&idx[c]<S.length).sort().join('');
    if(k.length<2||!G.reg[k]||!(v.items||[]).length) return;
    regs.push({k,name:v.name||(k.length===3?'All three':andList(k.split('').map(c=>plain(S[idx[c]].name)))),items:v.items});
  });
  let svg=`<svg viewBox="${G.vb}" role="img" aria-label="${attrq('Overlapping circles for '+andList(S.map(s=>plain(s.name)))+'; the numbered regions are listed beside the drawing.')}" focusable="false">`;
  S.forEach((s,i)=>{const k=TONES[s.tone]||TONES[deft[i]];svg+=`<circle cx="${G.c[i][0]}" cy="${G.c[i][1]}" r="${G.r}" style="fill:var(${k[0]});fill-opacity:.14;stroke:var(${k[0]});stroke-width:2"/>`;});
  S.forEach((s,i)=>{svg+=`<text x="${G.nm[i][0]}" y="${G.nm[i][1]}" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">${esc(plain(s.name))}</text>`;});
  regs.forEach((r,n)=>{const [x,y]=G.reg[r.k];svg+=`<circle cx="${x}" cy="${y}" r="11" style="fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5"/><text x="${x}" y="${y+4}" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700">${n+1}</text>`;});
  svg+='</svg>';
  const list=`<ol class="v-regions">${regs.map((r,n)=>`<li><span class="v-num">${n+1}</span><span><b>${r.name}:</b> ${andList(r.items)}</span></li>`).join('')}</ol>`;
  const alt=`<p>Sets: ${andList(S.map(s=>plain(s.name)))}.</p><ul>${regs.map(r=>`<li>${r.name}: ${dot(andList(r.items))}</li>`).join('')}</ul>`;
  return visShell(b,inCard,`<div class="v-venn">${svg}${list}</div>`,alt);
}

/* ---- SCALE ---- */
function renderScale(b,inCard){
  const p=b.spec||{};
  if(p.cells){
    const X=p.x||[''], Y=p.y||[''], nc=X.length-1;
    const cell=c=>Array.isArray(c)?c:[c,'',''];
    let h=`<table class="v-mx"><colgroup><col style="width:4.6em">${'<col>'.repeat(nc)}</colgroup><thead><tr><td></td><th scope="colgroup" colspan="${nc}" class="v-ax">${X[0]}</th></tr>`+
      `<tr><th scope="col" class="v-ax">${Y[0]}</th>${X.slice(1).map(t=>`<th scope="col" class="v-xt">${t}</th>`).join('')}</tr></thead><tbody>`;
    const alt=[];
    p.cells.forEach((row,ri)=>{
      h+=`<tr><th scope="row" class="v-yt">${Y[ri+1]||''}</th>`;
      row.forEach((c,ci)=>{
        const [t,n,tone]=cell(c);
        h+=`<td class="v-cell" style="${toneCss(tone,'l2')}"><b>${t}</b>${n?`<small>${n}</small>`:''}</td>`;
        alt.push(`<li>${Y[0]} ${plain(Y[ri+1]||'')}, ${X[0]} ${plain(X[ci+1]||'')}: <b>${t}</b>${n?' ('+n+')':''}</li>`);
      });
      h+='</tr>';
    });
    h+='</tbody></table>';
    return visShell(b,inCard,h,'<ul>'+alt.join('')+'</ul>');
  }
  const B=p.bands||[];
  const h=`<div class="v-range"><div class="v-ends" aria-hidden="true"><span>${p.from||''}</span><i></i><span>${p.to||''}</span></div><div class="v-bands">`+
    B.map(([l,n,t,w])=>`<div class="v-band" style="${toneCss(t,'l2')};--w:${+w||1}"><b>${l}</b>${n?`<small>${n}</small>`:''}</div>`).join('')+'</div></div>';
  const alt=`<p>From ${p.from||'the start'} to ${p.to||'the end'}:</p><ol>`+B.map(([l,n])=>`<li>${l}${n?': '+n:''}</li>`).join('')+'</ol>';
  return visShell(b,inCard,h,alt);
}

/* ---- match ---- */
function renderMatch(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Understand</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));
  const grid=el('div','match');
  const left=b.pairs.map((p,i)=>({txt:p[0],i}));
  const right=shuffle(b.pairs.map((p,i)=>({txt:p[1],i})));
  let sel=null, matched=0;
  const colL=el('div'); const colR=el('div');
  colL.style.display='flex';colL.style.flexDirection='column';colL.style.gap='8px';
  colR.style.display='flex';colR.style.flexDirection='column';colR.style.gap='8px';
  const Lbtns={}, Rbtns={};
  left.forEach(o=>{const btn=el('button','mi',o.txt);btn.addEventListener('click',()=>pick('L',o.i,btn));colL.appendChild(btn);Lbtns[o.i]=btn;});
  right.forEach(o=>{const btn=el('button','mi',o.txt);btn.addEventListener('click',()=>pick('R',o.i,btn));colR.appendChild(btn);Rbtns[o.i]=btn;});
  grid.append(colL,colR);
  c.appendChild(grid);
  const status=el('div','row');const pill=el('span','pill');status.appendChild(pill);c.appendChild(status);
  const explain=b.pairs.some(p=>p[2]);
  const whyEl=el('div');whyEl.setAttribute('aria-live','polite');if(explain)c.appendChild(whyEl);
  function pick(side,i,btn){
    if(btn.classList.contains('done'))return;
    if(!sel){sel={side,i,btn};btn.classList.add('sel');return;}
    if(sel.side===side){sel.btn.classList.remove('sel');sel={side,i,btn};btn.classList.add('sel');return;}
    // compare
    if(sel.i===i){
      sel.btn.classList.remove('sel');sel.btn.classList.add('done');btn.classList.add('done');
      matched++;
      whyEl.innerHTML='';
      if(matched===b.pairs.length){pill.textContent='All matched';pill.className='pill ok';store.set(b.id,{done:true});refreshChrome();}
      sel=null;
    } else {
      const a=sel.btn,bb=btn;a.classList.add('shake');bb.classList.add('shake');
      setTimeout(()=>{a.classList.remove('shake','sel');bb.classList.remove('shake');},500);
      const ri=side==='R'?i:sel.i;
      sel=null;
      pill.textContent='Try a different pair';pill.className='pill bad';
      if(explain){const p=b.pairs[ri];whyEl.innerHTML='';whyEl.appendChild(el('div','why',`<b>${p[1]}</b> goes with <b>${p[0]}</b>. ${p[2]||''}`));}
    }
  }
  if(isDone(b.id)){pill.textContent='Completed before. Play again anytime.';pill.className='pill ok';}
  return c;
}

/* ---- spot the problem ---- */
function renderSpot(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Analyze</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));

  const flagged=new Set();
  b.lines.forEach((ln,i)=>{
    const [text,why]=ln;
    const line=el('span','sl',esc(text));
    line.addEventListener('click',()=>{
      if(box.dataset.checked)return;
      if(flagged.has(i)){flagged.delete(i);line.classList.remove('flag');}
      else{flagged.add(i);line.classList.add('flag');}
    });
    pre.appendChild(line);
  });
  box.appendChild(pre);
  c.appendChild(box);
  const row=el('div','row');
  const check=el('button','btn sm','Check');
  const reset=el('button','btn sec sm','Reset');
  const pill=el('span','pill');
  row.append(check,reset,pill);
  c.appendChild(row);
  const legend=el('div','legend','Findings are the lines that weaken the system. A struck-through red line means you flagged a safe line.');
  c.appendChild(legend);
  const whyWrap=el('div');
  c.appendChild(whyWrap);
  check.addEventListener('click',()=>{
    box.dataset.checked='1';
    const lines=[...pre.children];
    let hits=0,total=0;
    whyWrap.innerHTML='';
    b.lines.forEach((ln,i)=>{
      const [text,why]=ln;const isBad=!!why;
      const span=lines[i];span.className='sl';
      if(isBad){total++;
        if(flagged.has(i)){span.classList.add('hit');hits++;}
        else span.classList.add('miss');
        whyWrap.appendChild(el('div','why',`<b>${esc(text.trim().slice(0,42))}\u2026</b> ${why}`));
      } else if(flagged.has(i)){span.classList.add('false');}
    });
    const falses=[...flagged].filter(i=>!b.lines[i][1]).length;
    pill.textContent=`${hits} / ${total} findings`+(falses?`, ${falses} false flag${falses>1?'s':''}`:'');
    pill.className='pill'+(hits===total&&!falses?' ok':' bad');
    if(hits===total&&!falses){store.set(b.id,{done:true});refreshChrome();}
  });
  reset.addEventListener('click',()=>{renderReplace(c,renderSpot(b));});
  if(isDone(b.id)){pill.textContent='Completed before.';pill.className='pill ok';}
  return c;
}
function renderReplace(oldNode,newNode){oldNode.replaceWith(newNode);}

function renderOrder(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Apply</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));

  const pool=el('div','pool');
  const seqH=el('h4',null,'Your sequence');
  const seq=el('div','seq');
  wrap.append(poolH,pool,seqH,seq);
  c.appendChild(wrap);
  const order=shuffle(b.items.map((it,i)=>({it,i})));
  const chosen=[];
  function drawPool(){
    pool.innerHTML='';
    order.forEach(o=>{
      if(chosen.includes(o.i))return;
      const btn=el('button','oi',`<span class="n">+</span><span>${o.it[0]}</span>`);
      btn.addEventListener('click',()=>{chosen.push(o.i);drawPool();drawSeq();});
      pool.appendChild(btn);
    });
  }
  function drawSeq(){
    seq.innerHTML='';
    chosen.forEach((ci,pos)=>{
      const btn=el('button','oi',`<span class="n">${pos+1}</span><span>${b.items[ci][0]}</span>`);
      btn.title='Tap to remove';
      btn.addEventListener('click',()=>{chosen.splice(pos,1);drawPool();drawSeq();});
      seq.appendChild(btn);
    });
  }
  drawPool();
  const row=el('div','row');const check=el('button','btn sm','Check order');const pill=el('span','pill');row.append(check,pill);c.appendChild(row);
  const whyWrap=el('div');c.appendChild(whyWrap);
  check.addEventListener('click',()=>{
    if(chosen.length<b.items.length){pill.textContent='Place every step first';pill.className='pill bad';return;}
    let ok=true;whyWrap.innerHTML='';
    [...seq.children].forEach((node,pos)=>{
      const correct=chosen[pos]===pos;
      node.className='oi '+(correct?'ok':'off');
      if(!correct)ok=false;
    });
    pill.textContent=ok?'Perfect order':'Try again: the numbers show your order; grey/red steps belong elsewhere';
    pill.className='pill'+(ok?' ok':' bad');
    if(ok){store.set(b.id,{done:true});refreshChrome();}
    else { whyWrap.appendChild(el('div','why','Correct order with the reason for each step:')); b.items.forEach((it,i)=>whyWrap.appendChild(el('div','why',`<b>${i+1}. ${it[0]}.</b> ${it[1]}`))); }
  });
  if(isDone(b.id)){pill.textContent='Completed before.';pill.className='pill ok';}
  return c;
}

  let total=0, left=0, timer=null;
  function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;}
  function marksOff(){[m1,m2,m3].forEach(m=>m.className='pill');}
  function setup(){
    const mins=Math.max(15,parseInt(lenInp.value||'0',10)||120);
    total=mins*60;left=total;disp.textContent=fmt(left);
    m1.textContent='Halfway: '+fmt(Math.round(total/2));m2.textContent='Quarter left: '+fmt(Math.round(total/4));marksOff();
  }
  function tick(){left--;disp.textContent=fmt(Math.max(0,left));
    m1.className='pill'+(left<=total*0.5?' ok':'');m2.className='pill'+(left<=total*0.25?' ok':'');m3.className='pill'+(left<=15*60?' bad':'');
    if(left<=0){clearInterval(timer);timer=null;disp.textContent='0:00:00';}
  }
  lenInp.addEventListener('input',()=>{const v=parseInt(lenInp.value||'0',10)||0;store.set(b.id,{len:v});if(!timer)setup();});
  start.addEventListener('click',()=>{lenInp.disabled=true;if(!timer)timer=setInterval(tick,1000);});
  pause.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;}});
  reset.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;}lenInp.disabled=false;setup();});
  setup();
  return c;
}

function renderScorecard(){
  document.documentElement.style.setProperty('--accent','var(--l3)');
  const h=el('div','lvhead');h.style.setProperty('--accent','var(--l3)');
  h.innerHTML=`<div class="grade">Hardening scorecard</div><div class="range">Six areas, aligned with the CIS Critical Security Controls v8</div>`;
  h.appendChild(el('p','intro','Use this after you harden a lab or a VM you own. Tick each check you can prove with a command or a screenshot, rather than from memory. On any operating system you are always working in one of these six areas.'));
  main.appendChild(h);
  const saved=store.get('scorecard')||{};
  const ticks=saved.ticks||{};
  const machine=el('input');machine.type='text';machine.placeholder='Which machine is this for? (e.g. Windows 11 practice VM)';machine.value=saved.machine||'';machine.setAttribute('aria-label','Machine');
  const mwrap=el('div','card');mwrap.appendChild(el('label','sc-lbl','Machine'));mwrap.appendChild(machine);main.appendChild(mwrap);
  const totalPill=el('span','pill');
  const counts=[];
  function save(){store.set('scorecard',{machine:machine.value,ticks});}
  function refresh(){
    let all=0,done=0;
    AREAS.forEach((a,ai)=>{const n=a.checks.filter((_,ci)=>ticks[ai+'-'+ci]).length;all+=a.checks.length;done+=n;counts[ai].textContent=`${n} / ${a.checks.length}`;counts[ai].className='pill'+(n===a.checks.length?' ok':'');});
    totalPill.textContent=`${done} of ${all} checks proven`;totalPill.className='pill'+(done===all?' ok':'');
  }
  machine.addEventListener('input',save);
  AREAS.forEach((a,ai)=>{
    const c=el('div','card');
    const hd=el('h3',null,`${ai+1}. ${a.n}`);const cnt=el('span','pill');counts[ai]=cnt;
    const top=el('div','prow');top.append(hd,cnt);c.appendChild(top);
    c.appendChild(el('p','sum',`<small>${a.cis}</small><br>${a.d}`));
    a.checks.forEach((txt,ci)=>{
      const k=ai+'-'+ci;
      const row=el('div','step'+(ticks[k]?' done':''));
      const cb=el('input');cb.type='checkbox';cb.checked=!!ticks[k];cb.setAttribute('aria-label',txt);
      cb.addEventListener('change',()=>{if(cb.checked)ticks[k]=true;else delete ticks[k];row.className='step'+(cb.checked?' done':'');save();refresh();});
      row.append(cb,el('div','st',txt));
      c.appendChild(row);
    });
    main.appendChild(c);
  });
  const ex=el('div','card');ex.appendChild(el('h3',null,'Outside the six areas'));
  const t=el('table','cmds areas');
  AREAS_EXTRA.forEach(([n,d])=>{const tr=el('tr');tr.appendChild(el('td',null,`<b>${n}</b>`));tr.appendChild(el('td',null,d));t.appendChild(tr);});
  ex.appendChild(t);main.appendChild(ex);
  const row=el('div','row');
  const reset=el('button','btn sec sm','Clear scorecard');
  let armed=false;
  reset.addEventListener('click',()=>{
    if(!armed){armed=true;reset.textContent='Tap again to confirm';return;}
    store.set('scorecard',{});render();
  });
  row.append(totalPill,reset);main.appendChild(row);
  main.appendChild(el('div','note','These are areas rather than a list of answers. The specific weaknesses change on every machine; the skill is reasoning from the scenario brief and the standard instead of memorizing. Source: CIS Critical Security Controls v8, Controls 2 to 8 and 10.'));
  main.appendChild(linkBtn('btn sec sm',RES['cis-controls'][1],'CIS Controls list →'));
  refresh();
}

function renderProgress(){
  document.documentElement.style.setProperty('--accent','var(--l1)');
  const h=el('div','lvhead');h.style.setProperty('--accent','var(--l1)');
  h.innerHTML=`<div class="grade">My progress</div><div class="range">Saved in this browser only</div>`;
  h.appendChild(el('p','intro','Every quiz, drill, flashcard set, lab, and reflection you complete is counted here. Everything stays on this device; clearing your browser data clears this.'));
  main.appendChild(h);
  const prog=el('div','prog');
  LEVELS.forEach(l=>{
    const ids=[];l.units.forEach(u=>u.blocks.forEach(b=>{if(b.id)ids.push(b.id);}));
    const done=ids.filter(isDone).length;
    const pct=ids.length?Math.round(done/ids.length*100):0;
    const card=el('div','card');
    card.style.setProperty('--accent',l.color);
    card.innerHTML=`<div class="prow"><b>${l.grade}</b><small>${done} / ${ids.length} activities</small></div><div class="pbar"><i></i></div>`;
    const bar=card.querySelector('.pbar i'); if(bar){bar.style.width=pct+'%';bar.style.background=l.color;}
    const go=el('button','btn sec sm','Open '+l.grade);
    go.addEventListener('click',()=>{current={level:l.id,unit:l.units[0].id,page:'level'};render();});
    card.appendChild(go);
    prog.appendChild(card);
  });
  main.appendChild(prog);
  // overall
  const all=allInteractiveIds();const ad=all.filter(isDone).length;const apct=all.length?Math.round(ad/all.length*100):0;
  const o=el('div','card');
  o.innerHTML=`<div class="prow"><b>Overall</b><small>${ad} / ${all.length} activities (${apct}%)</small></div><div class="pbar"><i></i></div>`;
  const obar=o.querySelector('.pbar i'); if(obar)obar.style.width=apct+'%';
  main.appendChild(o);
  const row=el('div','row');
  const reset=el('button','btn sec sm','Reset my progress');
  const pill=el('span','pill');
  let armed=false;
  reset.addEventListener('click',()=>{
    if(!armed){armed=true;reset.textContent='Tap again to confirm';pill.textContent='This clears everything saved in this browser.';pill.className='pill bad';return;}
    MEM={};store.save();pill.textContent='Cleared';pill.className='pill ok';reset.textContent='Reset my progress';armed=false;render();
  });
  row.append(reset,pill);
  main.appendChild(row);
}
