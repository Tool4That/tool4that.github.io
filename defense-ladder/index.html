<title>Defense Ladder</title>
<style>
:root{
  --bg:#EEF3F5; --paper:#FFFFFF; --paper-2:#F6F9FA; --ink:#10283A; --ink-2:#4A6072; --ink-3:#7A8E9B;
  --line:#CFDAE1; --line-2:#E3EAEF;
  --l1:#2A9DB5; --l2:#0B6E8C; --l3:#0E4F6E; --l4:#14213D;
  --amber:#F2B134; --amber-ink:#5A3E00; --ok:#2E7D4F; --ok-bg:#E4F3EA; --bad:#C8402E; --bad-bg:#FBE6E2;
  --code-bg:#10283A; --code-ink:#E6F0F5; --code-cmd:#9EE7FF;
  --accent:var(--l1); --focus:#F2B134;
  --radius:10px; --shadow:0 1px 2px rgba(16,40,58,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A24; --paper:#13283A; --paper-2:#17303F; --ink:#E6EEF3; --ink-2:#A9BCC9; --ink-3:#7F95A5;
    --line:#27465A; --line-2:#1F3A4B;
    --l1:#4FC3DB; --l2:#3AA6C6; --l3:#6FA8D8; --l4:#A9B9E8;
    --amber:#F2B134; --amber-ink:#2B1D00; --ok:#5CC98A; --ok-bg:#153324; --bad:#F08A7A; --bad-bg:#3E1A14;
    --code-bg:#0A1620; --code-ink:#D8E6EE; --code-cmd:#8EDFFF;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A24; --paper:#13283A; --paper-2:#17303F; --ink:#E6EEF3; --ink-2:#A9BCC9; --ink-3:#7F95A5;
  --line:#27465A; --line-2:#1F3A4B;
  --l1:#4FC3DB; --l2:#3AA6C6; --l3:#6FA8D8; --l4:#A9B9E8;
  --amber:#F2B134; --amber-ink:#2B1D00; --ok:#5CC98A; --ok-bg:#153324; --bad:#F08A7A; --bad-bg:#3E1A14;
  --code-bg:#0A1620; --code-ink:#D8E6EE; --code-cmd:#8EDFFF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI","SF Pro Text",-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
code,kbd,pre,.mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
a{color:var(--l2);text-decoration-thickness:1px;text-underline-offset:2px}
:root[data-theme="dark"] a{color:var(--l1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--l1)}}
button{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.01em;margin:0}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.rail,.main{min-width:0}
.rail{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 14px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.25rem;font-weight:800}
.brand .tag{color:var(--ink-2);font-size:.9rem}
.ladder{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ladder::-webkit-scrollbar{display:none}
.lv{flex:1 0 auto;min-width:112px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);cursor:pointer;text-align:left}
.lv svg{flex:none}
.lv .lv-t{display:flex;flex-direction:column;line-height:1.15}
.lv .lv-g{font-weight:700;font-size:.92rem}
.lv .lv-p{font-size:.75rem;color:var(--ink-2)}
.lv[aria-current="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.pages{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pg{flex:none;padding:6px 11px;border:1px solid var(--line);background:transparent;border-radius:999px;font-size:.88rem;cursor:pointer;color:var(--ink-2)}
.pg[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rail-foot{display:none}

.main{padding:18px 16px 60px;max-width:76ch;width:100%}
@media (min-width:920px){
  .app{grid-template-columns:260px minmax(0,1fr)}
  .rail{position:sticky;top:0;height:100vh;height:100dvh;border-bottom:0;border-right:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;overflow:auto}
  .brand{flex-direction:column;align-items:flex-start;gap:2px}
  .brand h1{font-size:1.45rem}
  .ladder{flex-direction:column;margin-top:22px;overflow:visible}
  .lv{min-width:0;padding:10px 12px}
  .pages{flex-direction:column;margin-top:18px;overflow:visible;gap:4px}
  .pg{text-align:left;border-radius:8px}
  .rail-foot{display:block;margin-top:auto;padding-top:18px;font-size:.78rem;color:var(--ink-3);line-height:1.4}
  .main{padding:34px 40px 80px;max-width:calc(76ch + 80px)}
}

/* ---------- level header ---------- */
.lvhead{border-left:6px solid var(--accent);padding:4px 0 4px 16px;margin-bottom:18px}
.lvhead .grade{font-size:2rem;font-weight:800}
.lvhead .range{color:var(--ink-2);font-size:1.05rem}
.bloom{display:flex;gap:4px;margin:12px 0 10px;max-width:420px}
.bloom span{flex:1;height:22px;border-radius:5px;background:var(--line-2);font-size:.68rem;display:flex;align-items:center;justify-content:center;color:var(--ink-3);border:1px solid var(--line)}
.bloom span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .bloom span.on{color:#0C1A24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bloom span.on{color:#0C1A24}}
.bloom-cap{font-size:.8rem;color:var(--ink-2)}
.intro{margin-top:8px}
details.mentor{margin-top:10px;border:1px dashed var(--line);border-radius:var(--radius);padding:8px 12px;background:var(--paper-2)}
details.mentor summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details.mentor ul{margin:8px 0 2px;padding-left:20px}

.units{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin-bottom:12px;scrollbar-width:thin}
.unit{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:7px}
.unit[aria-current="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
:root[data-theme="dark"] .unit[aria-current="true"]{color:#0C1A24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .unit[aria-current="true"]{color:#0C1A24}}
.unit .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.unit .dot.part{background:var(--amber)}
.unit .dot.full{background:var(--ok)}
.unit[aria-current="true"] .dot{outline:2px solid rgba(255,255,255,.6)}

/* ---------- content ---------- */
.uhead{margin:6px 0 14px}
.uhead h2{font-size:1.45rem}
.uhead .sum{color:var(--ink-2);margin-top:4px}
.blm{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);margin-left:8px;vertical-align:middle}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h3{font-size:1.08rem;margin-bottom:8px}
.card h3 .blm{margin-left:8px}
.card ul,.card ol{margin:0 0 .6em;padding-left:22px}
.card li{margin:.25em 0}
.note{border-left:4px solid var(--amber);background:var(--paper-2);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.warn{border-left-color:var(--bad)}
table.cmds{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 4px;display:block;overflow-x:auto}
table.cmds td{padding:7px 8px;border-top:1px solid var(--line-2);vertical-align:top}
table.cmds td:first-child{white-space:nowrap}
table.cmds code{background:var(--code-bg);color:var(--code-cmd);padding:2px 7px;border-radius:5px;font-size:.84rem}
pre.term{background:var(--code-bg);color:var(--code-ink);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:.84rem;line-height:1.5;margin:8px 0}
p code,li code,.why code{background:var(--line-2);padding:1px 5px;border-radius:4px;font-size:.88em}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pill{font-size:.8rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}

/* quiz */
.q{padding:10px 0;border-top:1px solid var(--line-2)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer;background:var(--paper-2)}
.opt input{margin-top:4px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.right span::after{content:" \2713  Correct";font-weight:700;color:var(--ok);white-space:nowrap}
.opt.wrong span::after{content:" \2717  Your answer";font-weight:700;color:var(--bad);white-space:nowrap}
.why{font-size:.9rem;color:var(--ink-2);margin:6px 0 0;padding:8px 10px;background:var(--paper-2);border-radius:8px;border:1px dashed var(--line)}

/* flashcards */
.flash{perspective:1000px}
.fc{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);min-height:150px;padding:18px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:1.05rem;position:relative}
.fc .side{font-size:.72rem;color:var(--ink-3);position:absolute;top:8px;left:12px}
.fc .cnt{font-size:.72rem;color:var(--ink-3);position:absolute;top:8px;right:12px}
.fc.back{background:var(--paper);border-color:var(--accent)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper-2);cursor:pointer;font-size:.92rem;text-align:left}
.mi.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mi.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);cursor:default}
.mi.shake{border-color:var(--bad)}

/* spot */
.spot pre{margin:0;padding:0;background:var(--code-bg);border-radius:8px;overflow-x:auto;font-size:.84rem}
.sl{display:block;padding:4px 12px;color:var(--code-ink);cursor:pointer;border-left:4px solid transparent;white-space:pre}
.sl:hover{background:rgba(255,255,255,.06)}
.sl.flag{border-left-color:var(--amber);background:rgba(242,177,52,.14)}
.sl.hit{border-left-color:var(--ok);background:rgba(46,125,79,.25)}
.sl.miss{border-left-color:var(--bad);background:rgba(200,64,46,.25)}
.sl.false{border-left-color:var(--bad);text-decoration:line-through;opacity:.8}
.spot .legend{font-size:.8rem;color:var(--ink-2);margin-top:6px}

/* order */
.ord .pool,.ord .seq{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.oi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper-2);cursor:pointer;text-align:left;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.oi .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.75rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.oi.ok{border-color:var(--ok);background:var(--ok-bg)}
.oi.off{border-color:var(--bad);background:var(--bad-bg)}
.ord h4{font-size:.85rem;color:var(--ink-2);margin:12px 0 0;font-weight:600}

/* lab */
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-2)}
.step:first-of-type{border-top:0}
.step input{margin-top:5px;width:18px;height:18px;flex:none}
.step .st{flex:1}
.step code{display:inline-block;margin-top:4px;background:var(--code-bg);color:var(--code-cmd);padding:3px 8px;border-radius:5px;font-size:.84rem;white-space:pre-wrap;word-break:break-word}
.step.done .st{color:var(--ink-3);text-decoration:line-through}
.step.done code{opacity:.6}

/* builder, planner, reflect */
textarea,input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
.bsec{margin:10px 0}
.bsec label{display:block;font-weight:600;margin-bottom:4px}
.bsec .hint{font-size:.85rem;color:var(--ink-2);margin-bottom:6px}
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl-grid label{display:block;font-size:.85rem;color:var(--ink-2)}
.plan-out{white-space:pre-wrap;font-size:.86rem}
.timer{font-size:2.4rem;font-weight:800;letter-spacing:.02em;margin:6px 0}

/* links */
.lk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-2)}
.lk:first-of-type{border-top:0}
.lk .k{flex:none;font-size:.7rem;padding:3px 7px;border-radius:5px;margin-top:3px;min-width:74px;text-align:center;font-weight:600}
.k.vendor{background:#0B6E8C;color:#fff}
.k.standard{background:#2E7D4F;color:#fff}
.k.community{background:#7A5C00;color:#fff}
.k.practice{background:#6B3FA0;color:#fff}
.k.tool4that{background:var(--amber);color:var(--amber-ink)}
.lk .d{font-size:.9rem;color:var(--ink-2)}

/* study plan timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.ph{position:relative;padding:0 0 16px}
.ph::before{content:"";position:absolute;left:-19px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--accent)}
.ph.ms::before{border-color:var(--ok);background:var(--ok)}
.ph h3{font-size:1.05rem}
.ph .when{color:var(--ink-2);font-size:.9rem}
.ph ul{margin:6px 0 8px;padding-left:20px;font-size:.93rem}

/* hardening areas and scorecard */
table.areas td:first-child{white-space:normal;min-width:9.5em;width:40%}
table.areas small{color:var(--ink-2)}
.sc-lbl{display:block;font-weight:600;margin-bottom:6px}
.pl-len{display:block;font-size:.85rem;color:var(--ink-2);margin:4px 0 10px;max-width:16rem}

/* progress page */
.prog{display:grid;gap:10px}
.pbar{height:10px;background:var(--line-2);border-radius:999px;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prow b{font-size:1rem}
.prow small{color:var(--ink-2)}

.foot{margin-top:36px;font-size:.8rem;color:var(--ink-3);line-height:1.5}
.theme{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 11px;font-size:.8rem;cursor:pointer;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Levels and pages">
    <div class="brand">
      <h1>Defense Ladder</h1>
      <span class="tag">Cybersecurity fundamentals, from first command to team lead</span>
    </div>
    <div class="ladder" id="ladder" role="tablist" aria-label="Grade levels"></div>
    <div class="pages" id="pages"></div>
    <div class="rail-foot">Unofficial practice; not affiliated with or endorsed by Microsoft, Canonical, Linux Mint, the FreeBSD Project or Cisco. Progress stays in this browser.</div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<button class="theme" id="themeBtn" type="button" aria-label="Switch color theme">Theme: auto</button>
<script>
/* ===================== Defense Ladder =====================
   Single-file, offline cybersecurity course: four grades, Freshman to Senior.
   Content model: LEVELS -> units -> blocks. Interactive blocks carry an id;
   progress for each id is kept in localStorage (if available).
   Learning design: Bloom's revised taxonomy (Anderson & Krathwohl, 2001):
   Remember, Understand, Apply, Analyze, Evaluate, Create.
   Frameworks: NICE Workforce Framework (work roles), CIS Critical Security
   Controls v8 (hardening areas), NIST Cybersecurity Framework 2.0.
   ========================================================== */
'use strict';

/* ---- block constructors ---- */
const C=(title,bloom,...parts)=>({t:'c',title,bloom,parts});
const P=(html)=>({t:'p',html});
const TIPS=(...items)=>({t:'tips',items});
const CMDS=(title,rows)=>({t:'cmds',title,rows});
const TERM=(text)=>({t:'term',text});
const NOTE=(html,warn)=>({t:'note',html,warn:!!warn});
const FLASH=(id,title,cards)=>({t:'flash',id,title,cards});
const QUIZ=(id,title,items)=>({t:'quiz',id,title,items});
const MATCH=(id,title,intro,pairs)=>({t:'match',id,title,intro,pairs});
const SPOT=(id,title,intro,lines)=>({t:'spot',id,title,intro,lines});
const ORDER=(id,title,intro,items)=>({t:'order',id,title,intro,items});
const LAB=(id,title,intro,steps)=>({t:'lab',id,title,intro,steps});
const REFLECT=(id,title,prompt)=>({t:'reflect',id,title,prompt});
const BUILDER=(id,title,intro,sections)=>({t:'builder',id,title,intro,sections});
const PLANNER=(id)=>({t:'planner',id});
const TIMER=(id)=>({t:'timer',id});
const LINKS=(title,keys)=>({t:'links',title,keys});

/* ---- Tool4That hub (edit these if paths change) ---- */
const HUB='https://freeapp4that.store/';

/* ---- master resource list: key -> [name, url, one-line why, kind] ----
   kinds: vendor (makers of the software, their own docs and training),
   standard (consensus or government frameworks and benchmarks),
   community (free, well-regarded), practice (hands-on platforms),
   tool4that (practice tools on this site) */
const RES={
  'netacad':['Cisco Networking Academy','https://www.netacad.com/','Free self-paced courses from Cisco, from networking basics to cybersecurity. Needs a free account.','vendor'],
  'pt':['Cisco Packet Tracer','https://www.netacad.com/cisco-packet-tracer','Cisco’s free network simulator: build and configure virtual routers, switches and PCs with the real IOS command line. Download after a free NetAcad sign-up.','vendor'],
  'ms-win-sec':['Microsoft Learn: Windows security','https://learn.microsoft.com/en-us/windows/security/','Primary source for Defender, firewall, account policy, BitLocker and audit settings.','vendor'],

 {id:'f2',title:'Safe and ethical online',bloom:'Understand',sum:'PII, authorization, and the habit that keeps you employable: just because you can does not mean you should.',

     ['Which is a vulnerability, not a threat?',['A disgruntled ex-employee','A phishing crew','An SSH server that allows root login with a password','A ransomware gang'],2,'Threats are actors or events. The root-login setting is the weakness they would exploit.'],
     ['Turning the firewall on when every risky service is already removed is an example of',['Wasted time','Defense in depth','Availability','Privilege escalation'],1,'Layers. The next admin will install something; the firewall catches it.'],
     ['Software that looks like a game but installs a hidden remote-control tool is a',['Worm','Trojan','Rootkit','Keylogger'],1,'Trojans disguise themselves as something wanted. Unauthorized-software findings on practice machines are often exactly this.']
   ]),
   LINKS('Go further',['nist-csf','cisa','khan'])
  ]},
 {id:'f4',title:'Computers, virtualization and the network',bloom:'Remember',sum:'What a VM is, snapshots versus backups, why checksums matter, and the networking words you will hear everywhere.',
  blocks:[
   C('Virtual machines in plain words','Understand',
     P('A <b>virtual machine</b> (VM) is a whole computer running as a program inside your computer. The <b>hypervisor</b> pretends to be hardware; the <b>guest</b> operating system inside has no idea. Practice labs are usually VMs because you can copy them, snapshot them and reset them in minutes.'),
     TIPS('Common free hypervisors: <b>Hyper-V</b> (built into Windows 11 Pro, Enterprise and Education), <b>VirtualBox</b>, and <b>VMware Workstation Pro</b>. Your CPU\u2019s virtualization feature (Intel VT-x or AMD-V) must be enabled in the firmware settings.',
          'Check each guest\u2019s requirements before you start. Windows 11, for example, needs at least 4 GB of RAM and 64 GB of storage, on top of what your host needs.',
          '<b>Snapshots</b> save the VM\u2019s exact state. Take one before risky changes so you can roll back in seconds. A snapshot is not a backup: it lives with the VM, so losing that disk loses both.',
          '<b>Checksum</b> (SHA-256, or the older MD5) is a fingerprint of a file. Compare a downloaded ISO\u2019s checksum to the value the publisher lists, so you know it arrived complete and unaltered.',
          'Keep the VM window and the host separate in your head: a command typed in the wrong window changes the wrong computer.')),
   C('Networking words','Remember',
     TIPS('<b>IP address</b>: the number that identifies a device on a network (192.168.1.20). <b>Subnet mask</b> (255.255.255.0) says which part is the network. <b>Default gateway</b>: the router that leads out.',
          '<b>DNS</b> turns names into addresses. <b>DHCP</b> hands out addresses automatically.',
          '<b>Switch</b> connects devices inside one network using MAC addresses. <b>Router</b> connects networks using IP addresses.',
          '<b>Port</b>: a numbered door on a device. 22 SSH, 23 Telnet, 80 HTTP, 443 HTTPS, 21 FTP, 3389 RDP, 53 DNS.',
          '<b>Ping</b> tests reachability. <b>ipconfig</b> (Windows) and <b>ip a</b> (Linux) show your addresses.'),
     CMDS('Try these on any machine you own',[
       ['ipconfig /all','Windows: every adapter, IP, mask, gateway, DNS, MAC.'],
       ['ip a','Linux: addresses on every interface (a is short for address).'],
       ['ping 1.1.1.1','Is the internet reachable by IP? (Ctrl+C to stop on Linux.)'],
       ['ping example.com','Does name resolution (DNS) work too?'],
       ['nslookup example.com','Ask DNS directly and see which server answered.'],
       ['tracert 1.1.1.1','Windows: the routers between you and the target. Linux: traceroute 1.1.1.1']
     ])),
   QUIZ('f4q','Check: machines and networks',[
     ['Why compare a downloaded ISO\u2019s SHA-256 checksum to the one on the publisher\u2019s site?',['To unlock the file','To confirm the file is complete and unaltered','To register the software','To speed up installation'],1,'A checksum is a fingerprint. A mismatch means a corrupt or tampered download: get it again from the official source.'],
     ['Which device forwards traffic between two different networks?',['Switch','Router','Hub','Access point'],1,'Routers route between networks using IP. Switches forward inside a network using MAC addresses.'],
     ['Port 22 is normally',['FTP','Telnet','SSH','HTTPS'],2,'SSH on 22. Telnet is 23 and sends everything in clear text, which is why it is a classic finding.'],
     ['A VM snapshot is',['A screenshot of the desktop','A saved copy of the VM\u2019s whole state you can return to','A backup of your email','A log of your commands'],1,'Snapshots on your own practice VMs let you break things fearlessly and roll back.'],
     ['Why is a snapshot not a real backup?',['It is too small','It is stored with the VM, so losing that disk or host loses the snapshot too','Snapshots cannot be restored','Backups are only for servers'],1,'A backup lives somewhere else (another disk, another site) and survives the loss of the original. A common rule of thumb is 3-2-1: three copies, two kinds of media, one off site.']
   ]),
   LINKS('Go further',['t4t-subnet','khan','netacad'])
  ]},
 {id:'f5',title:'First look at Windows',bloom:'Apply',sum:'Editions and account types, UAC and NTFS permissions, where users, policies, the firewall, updates and Defender live, and your first commands.',
  blocks:[
   C('Windows editions and terms','Remember',
     TIPS('<b>Editions.</b> Windows 11 Home, Pro, Enterprise and Education share one core. Pro and above add BitLocker, domain join, Hyper-V, the Local Group Policy Editor (<code>gpedit.msc</code>) and Local Security Policy (<code>secpol.msc</code>). Home does not include those two consoles.',
          '<b>Windows Server</b> (2022, 2025) is the server family, with roles such as Active Directory, DNS, DHCP and IIS. Run <code>winver</code> to see the exact edition, version and build of any Windows machine.',
          '<b>Account types.</b> A <b>local account</b> exists only on this PC. A <b>Microsoft account</b> signs in with an online identity. A <b>domain account</b> lives in Active Directory and works on every machine in the domain.',
          '<b>User Account Control (UAC).</b> Administrators run with standard rights until something needs elevation; then UAC asks for consent (admins) or for an admin\u2019s credentials (standard users). It is on by default. Leave it on.',
          '<b>NTFS permissions.</b> Every file and folder has an access control list (ACL) of allow and deny entries for users and groups. Folders pass entries down to their contents through <b>inheritance</b>; entries set directly on an item take precedence over inherited ones.',
          '<b>SID.</b> Windows tracks accounts by security identifier, not by name. Renaming an account keeps its SID, its group memberships and its rights.')),
   C('The map of Windows security','Remember',
     P('Everything you will secure on a Windows machine lives behind a short list of consoles. Press <kbd>Win</kbd>+<kbd>R</kbd>, type the name, press Enter.'),
     CMDS('Consoles to memorize',[
       ['lusrmgr.msc','Local Users and Groups: add, disable, delete users; see who is in Administrators. (Not on Home: use Settings or PowerShell.)'],
       ['secpol.msc','Local Security Policy: password policy, lockout policy, audit policy, security options (including UAC).'],
       ['gpedit.msc','Local Group Policy Editor: hundreds of settings, including the ones secpol shows.'],
       ['services.msc','Services: what runs in the background and how it starts.'],
       ['wf.msc','Windows Defender Firewall with Advanced Security: profiles and rules.'],
       ['eventvwr.msc','Event Viewer: logs. The Security log is where logons and account changes land.'],
       ['taskschd.msc','Task Scheduler: a favorite hiding spot for malware.'],
       ['appwiz.cpl','Programs and Features: uninstall unauthorized software.'],
       ['ms-settings:windowsupdate','Settings > Windows Update (type it in Run).']
     ])),
   C('Your first PowerShell','Apply',
     P('Right-click Start, choose <b>Terminal (Admin)</b> or <b>Windows PowerShell (Admin)</b>. UAC will ask you to confirm: that prompt is the elevation you just read about. Try each line and read what comes back.'),
     CMDS('Read-only first (nothing changes)',[
       ['Get-LocalUser','Every local account, with Enabled true/false.'],
       ['Get-LocalGroupMember -Group Administrators','Who has admin. Compare to the scenario brief.'],
       ['net accounts','Password length, age, history and lockout settings, in one screen.'],
       ['Get-NetFirewallProfile | Select-Object Name,Enabled','Domain, Private and Public profiles: all should be True.'],
       ['Get-MpComputerStatus | Select-Object AMServiceEnabled,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated','Is Defender on and current?'],
       ['Get-Service | Where-Object Status -eq Running | Sort-Object DisplayName','What is running right now.'],
       ['Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 5','Most recent updates.'],
       ['whoami /groups','Your groups. An elevated session shows Mandatory Label\\High Mandatory Level.'],
       ['icacls C:\\Users\\Public','The ACL on a folder. (OI)(CI) means the entry flows to files and subfolders; (I) means it was inherited.'],
       ['Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System | Select-Object EnableLUA,ConsentPromptBehaviorAdmin','UAC: EnableLUA 1 means on; ConsentPromptBehaviorAdmin 5 is the default prompt.']
     ])),
   FLASH('f5fl','Windows terms',[
     ['UAC','User Account Control: admins run with standard rights until an action needs elevation, then Windows prompts.'],
     ['ACL','Access control list: the allow and deny entries that decide who can do what to a file, folder, share or registry key.'],
     ['Inheritance','A folder passes its permission entries down to the files and subfolders inside it.'],
     ['SID','Security identifier: the value Windows uses to identify an account or group. Names can change; SIDs do not.'],
     ['Local account','An account that exists only on one computer.'],
     ['Domain account','An account stored in Active Directory that can sign in to any computer in the domain.'],
     ['secpol.msc','Local Security Policy: password, lockout, audit and security options (Pro and above).'],
     ['Event ID 4624','A successful logon, recorded in the Security log. 4625 is a failed logon.']
   ]),
   LAB('f5lab','Lab: five minutes on a Windows VM','On a Windows VM you own (Pro or an evaluation edition, not a computer someone else manages), do each step and tick it.',[
     ['Open Local Users and Groups and write down every account and whether it is enabled.','lusrmgr.msc'],
     ['List the Administrators group in PowerShell and compare to what you saw.','Get-LocalGroupMember -Group Administrators'],
     ['Check all three firewall profiles are enabled.','Get-NetFirewallProfile | Select-Object Name,Enabled'],
     ['Open Local Security Policy and find Account Policies > Password Policy. Note the minimum length.','secpol.msc'],
     ['Open Windows Security and confirm real-time protection is on.',null],
     ['Look at the permissions on a folder and find one inherited entry.','icacls C:\\Users\\Public'],
     ['Open Event Viewer > Windows Logs > Security and find one logon event (ID 4624).','eventvwr.msc']
   ]),
   QUIZ('f5q','Check: Windows map',[
     ['Where do you change the minimum password length on a stand-alone Windows Pro machine?',['services.msc','secpol.msc > Account Policies > Password Policy','eventvwr.msc','wf.msc'],1,'Local Security Policy owns password and lockout policy. Group Policy Editor also reaches it.'],
     ['Which command shows who is a local administrator?',['Get-LocalUser','net accounts','Get-LocalGroupMember -Group Administrators','Get-Service'],2,'Get-LocalUser lists users; group membership is a separate question.'],
     ['Which console would you open to see tasks that run automatically on a schedule or at logon?',['lusrmgr.msc','appwiz.cpl','taskschd.msc','secpol.msc'],2,'Task Scheduler (plus Startup apps in Settings and Autoruns from Sysinternals) is where persistence hides.'],
     ['Your laptop runs Windows 11 Home and secpol.msc will not open. Why?',['It is broken','Home does not include Local Security Policy or the Group Policy Editor','You need to be online','You must reboot first'],1,'Those consoles ship with Pro, Enterprise and Education. On Home, use net accounts and Settings, or practice on a Pro or evaluation VM.'],
     ['UAC is turned off (EnableLUA = 0). Why does that matter?',['It does not','Every program an administrator starts gets full rights with no prompt, including malware','It turns off the firewall','It slows the PC down'],1,'With Admin Approval Mode off there is no prompt between an admin and full control. Windows Security also warns that overall security is reduced.'],
     ['A folder inherits "Everyone: Read" from its parent. You want only the Finance group in this one folder. Cleanest approach?',['Delete the parent folder','Disable inheritance on that folder (copying the entries), remove Everyone, grant Finance','Add a Deny for Everyone on every file','Rename the folder'],1,'Breaking inheritance gives the folder its own ACL. icacls folder /inheritance:d copies the inherited entries so you can edit them; /inheritance:r removes them.']
   ]),
   LINKS('Go further',['ms-win-sec','ms-uac','ms-icacls','ms-ps','t4t-ld-win11','t4t-lr-win'])
  ]},
 {id:'f6',title:'First look at Linux',bloom:'Apply',sum:'Distributions in one minute, the terminal, ten commands, and the three files that describe every user on the machine.',
  blocks:[
   C('Linux in one minute','Understand',
     TIPS('<b>Linux</b> is the kernel; a <b>distribution</b> (distro) bundles it with tools, a package manager and a desktop. Almost everything is a file, and permissions decide who may read, write or execute each one.',
          '<b>Debian</b> is a community-run distribution and the base for many others. <b>Ubuntu</b>, from Canonical, is built on Debian, with a long-term support (LTS) release every two years and five years of standard security updates.',
          '<b>Linux Mint</b> is built on Ubuntu LTS (its alternate edition, LMDE, is built on Debian). Same apt and .deb packages, different desktop (Cinnamon by default) and tools: <b>Update Manager</b> for updates and <b>Timeshift</b> for system snapshots. Mint disables Snap by default; Ubuntu installs some apps as Snaps.',
          'All three use <code>apt</code>, <code>systemd</code>, the <b>sudo</b> group for administrators and the same files under /etc, so most commands on this page work on each.')),
   C('Ten commands that get you anywhere','Apply',
     P('Open a terminal (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>T</kbd> on Mint and Ubuntu). The prompt ends with <code>$</code> for a normal user. <code>sudo</code> runs one command as the superuser (root); it asks for <b>your</b> password.'),
     CMDS('Navigate and read',[
       ['pwd','Print working directory: where am I?'],
       ['ls -la','List everything here, including hidden dotfiles, with permissions and owners.'],
       ['cd /etc','Change directory. cd alone goes home; cd .. goes up one.'],
       ['cat /etc/hostname','Print a file. For long files: less /etc/passwd (q to quit).'],
       ['man ls','The manual for any command. Press q to leave.'],
       ['sudo -l','What am I allowed to run with sudo?'],
       ['whoami','Which user am I right now?'],
       ['id','My user id, group id and groups.'],
       ['history','Commands I have typed. Great for your change log.'],
       ['clear','Clean screen. Ctrl+C cancels a running command.']
     ])),
   C('The three user files','Understand',
     TIPS('<b>/etc/passwd</b>: one line per account: <code>name:x:UID:GID:comment:home:shell</code>. Normal humans have UID 1000 and up. UID 0 is root. Anything else with UID 0 is a backdoor.',
          '<b>/etc/shadow</b>: password hashes. Readable only by root and the shadow group. A <code>!</code> or <code>*</code> in the hash field means the account is locked or has no password set.',
          '<b>/etc/group</b>: group memberships. On Mint, Ubuntu and Debian, members of the <b>sudo</b> group are administrators. (Some setups also use <b>wheel</b> or a custom group; check <code>sudo -l</code> and <code>/etc/sudoers</code>.)'),
     CMDS('Look, do not change (yet)',[
       ['awk -F: \'$3 >= 1000 && $3 < 65534 {print $1}\' /etc/passwd','Human accounts: field 3 (UID) between 1000 and 65533.'],
       ['awk -F: \'$3 == 0 {print $1}\' /etc/passwd','Every UID-0 account. Only root should print.'],
       ['getent group sudo','Who can become root. Compare to the scenario brief\u2019s administrator list.'],
       ['sudo head -n 5 /etc/shadow','First five password entries (needs root).'],
       ['ls -l /etc/shadow /etc/passwd','Expect -rw-r----- root shadow and -rw-r--r-- root root.']
     ])),
   FLASH('f6fl','Linux terms',[
     ['Kernel','The core of the operating system that talks to hardware and runs processes. Linux is a kernel.'],
     ['Distribution','A kernel plus tools, package manager and desktop, released together: Debian, Ubuntu, Linux Mint.'],
     ['LTS','Long-term support: an Ubuntu release (every two years) that gets five years of standard security updates.'],
     ['root','The superuser, UID 0. Can do anything, which is why you borrow its power with sudo one command at a time.'],
     ['sudo','Runs one command as root after checking your own password and your rights in /etc/sudoers.'],
     ['/etc/passwd','The account list: name, UID, GID, home directory and shell. Not the passwords.'],
     ['/etc/shadow','The password hashes and aging data, readable only by root and the shadow group.'],
     ['apt','The package manager on Debian, Ubuntu and Mint: install, update and remove .deb packages.'],
     ['Timeshift','Mint\u2019s system snapshot tool. Protects system files; home folders are excluded by default.']
   ]),
   LAB('f6lab','Lab: five minutes on a Linux VM','On a Mint or Ubuntu VM you own, do each step and tick it.',[
     ['Open a terminal and print where you are and who you are.','pwd; whoami; id'],
     ['Check which release you are on.','cat /etc/os-release'],
     ['List the human accounts on the machine.','awk -F: \'$3 >= 1000 && $3 < 65534 {print $1}\' /etc/passwd'],
     ['List the sudo group.','getent group sudo'],
     ['Read the manual page for ls and find what -a and -l mean.','man ls'],
     ['Show the last 20 lines of the authentication log (Mint/Ubuntu). On Debian use journalctl.','sudo tail -n 20 /var/log/auth.log'],
     ['Check whether the firewall is active.','sudo ufw status']
   ]),
   QUIZ('f6q','Check: Linux basics',[
     ['Which UID is root?',['1','0','1000','65534'],1,'UID 0 is root. A second UID-0 account, whatever its name, is a hidden administrator and a classic finding.'],
     ['sudo asks for a password. Whose?',['root\u2019s','The current user\u2019s','The instructor\u2019s','No password, ever'],1,'sudo authenticates you, then grants root for that command. Membership in the sudo group is what makes it work.'],
     ['Which file holds password hashes?',['/etc/passwd','/etc/group','/etc/shadow','/etc/sudoers'],2,'/etc/shadow, readable by root only. The x in /etc/passwd just points there.'],
     ['Which command lists hidden files too?',['ls','ls -la','ls -h','cat .'],1,'-a shows dotfiles like .bashrc, which is also where malicious aliases hide.'],
     ['Linux Mint\u2019s main edition is built on',['Fedora','Ubuntu LTS','FreeBSD','Windows'],1,'Mint follows Ubuntu LTS releases, so Ubuntu documentation usually applies. LMDE is the Debian-based edition.']
   ]),
   LINKS('Go further',['linuxjourney','bandit','explainshell','mint-docs','ubuntu-server','t4t-ld-mint','t4t-lr-linux'])
  ]},
 {id:'f7',title:'Networking fundamentals and Cisco basics',bloom:'Remember',sum:'The OSI and TCP/IP models, addressing, how switches and routers decide, and where to learn Cisco networking for free.',
  blocks:[
   C('Two models of a network','Understand',
     P('Networking is taught with two layered models. The <b>OSI model</b> has seven layers and is the shared vocabulary for troubleshooting ("that is a layer 2 problem"). The <b>TCP/IP model</b> has four layers and matches how the internet\u2019s protocols are actually built.'),
     TIPS('<b>Layers 7, 6, 5: Application, Presentation, Session.</b> What programs say to each other and how it is formatted and kept going (HTTP, DNS, SSH, TLS). TCP/IP folds all three into its <b>Application</b> layer.',
          '<b>Layer 4: Transport.</b> TCP (reliable and ordered, set up with a three-way handshake) and UDP (fast, no delivery guarantee). Port numbers live here. Unit of data: segment (TCP) or datagram (UDP).',
          '<b>Layer 3: Network.</b> IP addresses and routing between networks; routers work here. TCP/IP calls it the <b>Internet</b> layer. Unit of data: packet.',
          '<b>Layer 2: Data link, and Layer 1: Physical.</b> MAC addresses and frames on one local network (switches work at layer 2), then bits on copper, fiber or radio. TCP/IP groups both as its <b>Link</b> layer (also called Network Access).',
          '<b>Encapsulation:</b> on the way out, each layer wraps the data from the layer above in its own header (layer 2 adds a trailer too). The receiver unwraps in reverse.')),
   C('Core ideas','Understand',
     TIPS('Networks of all sizes share the same parts: end devices, intermediary devices (switches, routers, access points), and media (copper, fiber, wireless).',
          'Binary and decimal: an IPv4 address is 32 bits written as four decimal numbers (octets). 11000000 is 192.',
          'Ethernet frames carry MAC addresses; IP packets carry IP addresses; segments carry port numbers.',
          'A switch learns MAC addresses from incoming frames and forwards only where needed. ARP finds the MAC address that belongs to an IPv4 address on the local network.',
          'Basic device configuration: hostname, passwords on console and vty lines, enable secret, a management IP on the switch, and saving the config.')),
   C('Learning Cisco networking for free','Remember',
     TIPS('<b>Cisco Networking Academy</b> (NetAcad) offers free self-paced courses, from networking basics upward. A free account is required.',
          '<b>Packet Tracer</b> is Cisco\u2019s free network simulator: drag routers, switches and PCs onto a canvas, cable them, and configure them with the IOS command line. Download it after signing up on NetAcad.',
          '<b>Configuration hygiene starts on day one.</b> Name each device exactly as the network documentation does, so prompts, logs and neighbor tables match the diagram. Router interfaces start administratively down until you enter <code>no shutdown</code>. And save with <code>copy running-config startup-config</code>, or the work vanishes on reload.')),
   FLASH('f7fl','Networking terms',[
     ['OSI model','Seven layers: Physical, Data link, Network, Transport, Session, Presentation, Application.'],
     ['TCP/IP model','Four layers: Link (also called Network Access), Internet, Transport, Application.'],
     ['Encapsulation','Each layer wraps the data from the layer above in its own header on the way out.'],
     ['MAC address','A 48-bit hardware address used inside one local network (layer 2).'],
     ['IP address','A logical address used to route between networks (layer 3). IPv4 is 32 bits; IPv6 is 128 bits.'],
     ['ARP','Address Resolution Protocol: finds the MAC address for an IPv4 address on the local network.'],
     ['TCP','Connection-oriented transport: handshake, ordering, retransmission of lost data.'],
     ['UDP','Connectionless transport: no handshake, no retransmission. Used by DNS queries, streaming and VoIP.'],
     ['Default gateway','The router a host sends traffic to when the destination is on another network.']
   ]),
   ORDER('f7o1','OSI drill: stack the seven layers','Tap the layers from the top (layer 7, closest to the user) down to layer 1, the wire.',[
     ['Layer 7: Application','Closest to the user: where programs talk, such as web (HTTP, HTTPS), names (DNS), remote shells (SSH) and address requests (DHCP).'],
     ['Layer 6: Presentation','Formats the data: encoding, encryption, compression.'],
     ['Layer 5: Session','Opens, keeps and closes the conversation between two programs.'],
     ['Layer 4: Transport','TCP and UDP; port numbers pick the program on each end.'],
     ['Layer 3: Network','IP addresses and routing between networks. Routers work here.'],
     ['Layer 2: Data link','Frames and MAC addresses on one local network. Switches work here.'],
     ['Layer 1: Physical','Bits as signals on copper, light in fiber, or radio.']
   ]),
   ORDER('f7o2','OSI drill: the four TCP/IP layers','Now the TCP/IP model, top to bottom. Each item says which OSI layers it covers.',[
     ['Application: covers OSI layers 7, 6 and 5','Application protocols such as HTTP, DNS and SSH also handle their own formatting and sessions, so TCP/IP folds the top three OSI layers into one.'],
     ['Transport: covers OSI layer 4','TCP and UDP, the same job as OSI layer 4.'],
     ['Internet: covers OSI layer 3','IPv4, IPv6 and ICMP: addressing and routing between networks.'],
     ['Link: covers OSI layers 2 and 1','Ethernet, Wi-Fi and the physical medium itself. Also called Network Access.']
   ]),
   ORDER('f7o3','OSI drill: encapsulation on the way out','A browser sends a request. Put the names of the data in the order it is wrapped as it goes down the stack. The receiver unwraps it in reverse, from bits back up to data.',[
     ['Data','At the top three layers the program’s message is just called data.'],
     ['Segment (TCP) or datagram (UDP)','Layer 4 adds a header with source and destination ports.'],
     ['Packet','Layer 3 adds a header with source and destination IP addresses.'],
     ['Frame','Layer 2 adds MAC addresses in a header and an error check in a trailer.'],
     ['Bits','Layer 1 sends the frame as signals on the medium.']
   ]),
   MATCH('f7m1','OSI drill: layer to PDU','Tap a layer on the left, then the name its data has (its PDU, protocol data unit) on the right. A wrong pick explains where that answer belongs.',[
     ['Layers 7, 6 and 5: Application, Presentation, Session','Data','Above the transport layer the payload is simply called data.'],
     ['Layer 4: Transport','Segment (TCP), datagram (UDP)','TCP data is a segment and UDP data is a datagram; the header adds source and destination ports.'],
     ['Layer 3: Network','Packet','The IP header adds source and destination IP addresses; the result is a packet.'],
     ['Layer 2: Data link','Frame','A frame adds MAC addresses in a header and an error check in a trailer.'],
     ['Layer 1: Physical','Bits','On the medium it is just bits: voltage, light or radio.']
   ]),
   MATCH('f7m2','OSI drill: layer to example protocol','Tap a layer, then its example protocols. Two layers have none of their own in TCP/IP.',[
     ['Layer 7: Application','HTTP, HTTPS, DNS, SSH, DHCP','Application protocols carry what programs say: web pages, name lookups, remote shells, address requests.'],
     ['Layer 6: Presentation','None: its job is formatting, encryption, compression','TCP/IP has no separate presentation protocol; the application does this work itself.'],
     ['Layer 5: Session','None: its job is opening, keeping, and closing sessions','TCP/IP has no separate session protocol either; applications manage their own sessions.'],
     ['Layer 4: Transport','TCP, UDP','TCP is reliable and ordered; UDP is fast with no delivery guarantee.'],
     ['Layer 3: Network','IPv4, IPv6, ICMP','IP addresses and routes packets; ICMP carries their error and test messages, such as ping.'],
     ['Layer 2: Data link','Ethernet, 802.1Q VLAN tags, Wi-Fi (802.11)','These frame data for one local network; an 802.1Q tag marks which VLAN a frame belongs to.'],
     ['Layer 1: Physical','Signals on copper, light in fiber, radio','Layer 1 is the signal on the medium itself, not a protocol message.']
   ]),
   MATCH('f7m3','OSI drill: layer to example device','Tap a layer, then the devices that work there.',[
     ['Layers 7, 6 and 5: Application, Presentation, Session','End hosts: the programs on computers, phones and servers','These layers run in software on the end hosts themselves.'],
     ['Layer 4: Transport','Firewalls that filter on port numbers','A firewall that allows or blocks traffic by port is making a layer 4 decision.'],
     ['Layer 3: Network','Router, layer 3 switch','Routers and layer 3 switches forward packets between networks by IP address.'],
     ['Layer 2: Data link','Switch, wireless access point, NIC','Switches, access points and network cards work with frames and MAC addresses.'],
     ['Layer 1: Physical','Hub, repeater, cables','Hubs and repeaters only repeat bits; cables carry them.']
   ]),
   QUIZ('f7q','Check: networking foundations',[
     ['11111111.11111111.11111111.00000000 as a subnet mask is',['255.255.0.0','255.255.255.0','255.255.255.128','255.0.0.0'],1,'Eight ones per octet is 255. Three full octets of ones is /24.'],
     ['At which OSI layer does a switch forward frames using MAC addresses?',['Layer 1','Layer 2','Layer 3','Layer 4'],1,'Data link, layer 2. Routers make layer 3 decisions with IP addresses.'],
     ['Which layer of the TCP/IP model does IP belong to?',['Application','Transport','Internet','Network Access'],2,'IP is the Internet layer. TCP and UDP are Transport.'],
     ['Which protocol is connection-oriented and retransmits lost data?',['UDP','TCP','IP','ARP'],1,'TCP sets up a connection (SYN, SYN-ACK, ACK), numbers the bytes and retransmits losses. UDP sends and forgets.'],
     ['What does ARP do?',['Assigns IP addresses','Finds the MAC address that belongs to an IPv4 address on the local network','Encrypts traffic','Translates names to addresses'],1,'ARP maps IPv4 to MAC on the local segment. DHCP assigns addresses; DNS translates names.'],
     ['What does <code>enable secret</code> protect?',['Console access','Privileged EXEC (enable) mode, with a hashed password','SSH only','The running-config file'],1,'enable secret hashes the password that guards privileged mode. enable password (no secret) is clear text and a classic Config Audit finding.']
   ]),
   LINKS('Go further',['netacad','pt','t4t-subnet','t4t-ios','khan'])
  ]}
 ]
});
