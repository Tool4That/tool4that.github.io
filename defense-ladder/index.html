   C('Native VLAN, PortFast, and BPDU guard','Understand',
     P('PortFast belongs on edge ports that connect one end device, such as a PC or a printer. Trunks and switch-to-switch links keep the full listening and learning stages, so spanning tree can find and block a loop before frames circulate. BPDU guard shuts an edge port the moment another switch’s BPDU arrives, so a switch plugged into a classroom jack stays off the network until an admin checks it. Spanning tree builds its loop-free layout around one switch, the <b>root bridge</b>, which the switches elect by trading BPDUs (bridge protocol data units): the lowest bridge priority wins, and the lowest MAC address breaks a tie. A stray switch with a lower priority could take over as root and redraw every path, one more reason edge ports refuse BPDUs.'),
     SEQ('A port comes up: the spanning tree states',[
       {ask:'Is PortFast on this port?',branches:[['Yes, an edge port','It jumps straight to forwarding as the link comes up.'],['Otherwise','It walks through the states below first.']]},
       ['Blocking','Listens for BPDUs and forwards no user frames.','muted'],
       ['Listening','About 15 seconds: switches exchange BPDUs and settle the port’s role, still without user frames.','amber'],
       ['Learning','About 15 seconds more: the port fills its MAC address table, still without forwarding.','l2'],
       ['Forwarding','User frames flow, about 30 seconds after the link came up.','ok']
     ],{caption:'Without PortFast a port waits about 30 seconds; with it, an edge port forwards at once.',
       note:'These are the classic 802.1D states, used by PVST+, the default on a 2960. Rapid PVST+ folds blocking and listening into one discarding state and converges faster; PortFast still marks the edge ports.'}),
     NOTE('<b>The native VLAN</b> is the one VLAN that crosses a trunk untagged. This network uses VLAN 99 for it, keeps 99 free of hosts, and leaves VLAN 1 for defaults only: every switch port starts in VLAN 1, and the switches’ own control traffic uses it, so users and management move to other VLANs. Unused ports park in a separate VLAN, 999, and stay shut down.')),
   FLASH('f7fl2','Two-site network vocabulary',[
     ['VLAN','Virtual LAN: a group of switch ports that forms its own broadcast domain. This network uses 10 STUDENTS, 20 TEACHERS, and 30 PRINCIPALS.'],
     ['Trunk','A link that carries many VLANs at once, tagging each frame with its VLAN. At Site A, SwA G0/1 to RtrA G0/0 is the trunk.'],
     ['802.1Q tag','A 4-byte field inserted after the source MAC address; its 12-bit VLAN ID names the frame’s VLAN on a trunk.'],
     ['Native VLAN','The one VLAN whose frames cross a trunk untagged. This network uses VLAN 99 and keeps it free of hosts.'],
     ['SVI','Switched virtual interface, such as <code>interface vlan 20</code>: gives the switch its own IP address inside a VLAN, for management or routing.'],
     ['Access port','A switch port in one VLAN that sends and receives untagged frames, for one end device.'],
     ['Router-on-a-stick','One router interface split into subinterfaces (<code>g0/0.10</code>, <code>g0/0.20</code>, and <code>g0/0.30</code>) routes between VLANs over a single trunk.'],
     ['PortFast','Moves an edge port straight to forwarding, skipping about 30 seconds of listening and learning. It belongs on edge ports only.'],
     ['BPDU guard','Shuts down (err-disables) an edge port the moment it receives a BPDU, the message switches send each other.'],
     ['SSH vs Telnet','Both give a remote command line. SSH (TCP 22) encrypts the session and the password; Telnet (TCP 23) sends both as plain text.']
   ]),

     ['Trunk port','Carries many VLANs with tags','<code>switchport mode trunk</code>: each frame carries an 802.1Q tag that names its VLAN.'],
     ['Native VLAN','Crosses the trunk untagged','One VLAN per trunk travels without a tag; this network uses VLAN 99 and keeps hosts off it.'],
     ['SVI','Gives the switch an address in a VLAN','<code>interface vlan 20</code> with 10.1.20.2 lets admins reach SwA.'],
     ['Subinterface','The router’s address in one VLAN','<code>g0/0.10</code> with <code>encapsulation dot1Q 10</code> is RtrA’s gateway for Students.'],
     ['PortFast','Lets an edge port forward at once','It skips listening and learning on ports that connect one end device.'],
     ['BPDU guard','Shuts an edge port that hears a switch','A BPDU on an edge port means a switch is plugged in, so the port goes err-disabled.'],
     ['SSH','Encrypted remote console','SSH protects the session and the password; Telnet sends both as plain text.']
   ]),
   QUIZ('f7q2','Why each rule exists',[
     ['Why do user VLANs use numbers above 1?',['VLAN 1 is reserved for traffic between routers','Every port starts in VLAN 1, and control traffic uses it','Routers ignore VLAN 1, so its hosts lack a gateway','VLANs above 1 skip spanning tree and come up sooner'],1,'VLAN 1 is every port’s default and carries control protocols, so it stays for defaults only. Students, Teachers, and Principals get 10, 20, and 30.'],
     ['What does a trunk carry?',['Many VLANs, each frame tagged with its VLAN ID','Every VLAN, with frames left untagged to save space','Management and control traffic between switches only','Routed packets, each one tagged with its subnet'],0,'A trunk carries many VLANs over one link. An 802.1Q tag in each frame names its VLAN; the native VLAN alone crosses untagged.'],
     ['What makes the native VLAN different?',['It carries the most traffic','It is the one VLAN with an SVI','Its frames cross the trunk untagged','It is always VLAN 999'],2,'The native VLAN’s frames cross a trunk without a tag. This network uses VLAN 99 for it and keeps it free of hosts; VLAN 999 is the separate parking VLAN.'],
     ['What is the difference between <code>vlan 20</code> and <code>interface vlan 20</code>?',['<code>vlan 20</code> names the VLAN; <code>interface vlan 20</code> assigns its ports','<code>vlan 20</code> creates the layer 2 VLAN; <code>interface vlan 20</code> gives the switch an address in it','<code>interface vlan 20</code> creates the VLAN and its address in one step','<code>vlan 20</code> holds the IP address; <code>interface vlan 20</code> holds the name'],1,'The VLAN is the broadcast domain in the VLAN database. The SVI is the switch’s own IP address inside that VLAN, used for management.'],
     ['Where does PortFast belong?',['On the trunk to the router, so the uplink comes up sooner','On every port, so the whole switch comes up sooner','On switch-to-switch links between closets','On access ports that connect one end device'],3,'PortFast skips listening and learning, which suits a port with one end device. Trunks and switch-to-switch links keep the full process, so spanning tree can catch a loop.'],

     ['A packet crosses two routers on its way to a web server. Which addresses change at every router?',['The MAC addresses in the frame','The source and destination IP addresses together','The destination port','The destination IP address'],0,'Each router builds a new frame for the next hop, while the IP addresses ride through from end to end (NAT at the edge aside). <a href="#freshman/f7">Review: Networking fundamentals and Cisco basics</a>'],
     ['Every change on a switch vanished after a reload. Which step was skipped?',['no shutdown','enable secret','show running-config','copy running-config startup-config'],3,'Changes live in the running-config, in RAM, until you save them to the startup-config, which loads at boot. <a href="#freshman/f7">Review: Networking fundamentals and Cisco basics</a>'],
     ['An intruder renamed an unauthorized admin account from svc_admin to Printer. What happened to its admin rights?',['They vanish after a reboot','They stay: Windows tracks the account by its SID, so its memberships follow it','They move to the Guest account','They vanish, because rights follow the name'],1,'Names are labels and the SID stays fixed, so judge accounts by their memberships. <a href="#freshman/f5">Review: First look at Windows</a>'],
     ['A folder grants Finance an explicit Allow: Modify and inherits Deny: Write for Everyone from its parent. A Finance member saves a file there. What happens?',['The save fails: inherited entries are checked first','The save fails: a Deny always wins','The save succeeds: an explicit Allow outranks an inherited Deny','Windows asks an administrator'],2,'Windows checks explicit Deny, explicit Allow, inherited Deny, then inherited Allow. <a href="#freshman/f5">Review: First look at Windows</a>'],
     ['Which Security log event ID records a failed sign-in?',['4624','4625','4720','4732'],1,'4624 is a successful sign-in and 4625 a failed one; both land in Event Viewer &gt; Windows Logs &gt; Security. <a href="#freshman/f5">Review: First look at Windows</a>'],
     ['An /etc/passwd line reads backup2:x:0:0::/home/backup2:/bin/bash. What does it tell you?',['backup2 has full root power, because its UID is 0','backup2 is locked, because its UID is 0','backup2 belongs to the sudo group','backup2 is an ordinary human account'],0,'The third field is the UID, and UID 0 is root whatever the name, so a second UID 0 account is a backdoor. <a href="#freshman/f6">Review: First look at Linux</a>'],
     ['ls -l shows -rw-r----- root shadow /etc/shadow. Who can read the file?',['Only root','Every user on the machine','Only members of the sudo group','root and members of the shadow group'],3,'After the type character come owner, group, and other: rw- for root, r-- for the shadow group, and --- for everyone else. <a href="#freshman/f6">Review: First look at Linux</a>'],
     ['In /etc/shadow, bob’s password field is empty and carol’s holds !. Which account signs in without a password?',['carol','bob','Both','Neither'],1,'An empty hash field accepts an empty password, while ! or * turns password sign-ins away for that account. <a href="#freshman/f6">Review: First look at Linux</a>'],
     ['A teacher assigns you lab VM 3. While hardening it, you notice VM 4 uses the same weak password. What do you do?',['Fix both, since the password is the same','Sign in to VM 4 to confirm, then report it','Change the password on every lab VM','Fix VM 3 and report VM 4 to the teacher'],3,'Your authorization covers VM 3 alone, so a weakness elsewhere goes to the owner as a report. <a href="#freshman/f1">Review: How hands-on defense practice works</a>'],
     ['You just turned Telnet off. What does verify include?',['Rebooting and hoping the change holds','Reading the change log aloud','Re-running the baseline checks and confirming every required service and authorized user still works','Turning Telnet back on to compare'],2,'Verify has two halves: the fix took effect, and everything the brief requires still works. <a href="#freshman/f1">Review: How hands-on defense practice works</a>'],
     ['Your lab host’s disk fails. Which copy still lets you restore your work?',['A backup on separate media','A VM snapshot','A Timeshift snapshot on the same drive','The VM’s undo history'],0,'A snapshot lives beside what it protects, so losing the disk loses both; a backup on other media survives. <a href="#freshman/f4">Review: Computers, virtualization, and the network</a>']
   ])
  ]},
 {id:'s1',title:'Read the scenario brief first',bloom:'Apply',sum:'Read the brief like a contract, learn the six hardening areas, and plan your first twenty minutes.',
  blocks:[
   C('How to read a scenario brief','Understand',
     TIPS('Find and write down: the <b>authorized users</b>, who is an <b>administrator</b>, which <b>services</b> must stay running, which <b>software</b> is allowed or banned, and any <b>investigation questions</b>.',
          'Everything off the authorized list is suspect, and suspect means investigate: find what starts it, who owns it, and what it does, and ask the owner before you remove a backup, management, or monitoring agent the brief leaves unmentioned. Everything on the list is protected: deleting an authorized user or stopping a required service fails an availability check, because you broke something the business needs.',
          'When the brief says "this machine is the company web server", you harden the web server and keep it running.',
          '<b>Remote Desktop</b> (RDP, TCP 3389) lets someone sign in to Windows over the network; <b>Network Level Authentication</b> (NLA) makes them prove who they are before a session starts, and membership in Remote Desktop Users grants a standard user that sign-in.',
          'The brief is your scope. If a fix would reach beyond it (another machine, a network outside your assignment), stop and ask.',
          'Answer investigation questions before you change the machine (<a href="#freshman/f1">Evidence first</a>), in the exact format asked (a hash, a file path, or a user name). A right answer in the wrong format is a wrong answer.',
          '<b>Keep your own way in.</b> Record every password in your log before you set it, follow the brief on changing your own sign-in password, and keep a second administrator or root session open while you edit sign-in, sudo, PAM, or SSH settings.'),
     NOTE('The six hardening areas, each aligned with a CIS Critical Security Control (v8). On any operating system you are always working in one of them. The Hardening scorecard page turns them into a checklist.'),
     {t:'areas'},
     DETAIL('How the practice labs score you',TIPS('A progress check samples the problems (<a href="#freshman/f1">How hands-on defense practice works</a>).','Availability checks subtract points while a required user, admin, service, link, or address stays broken, and they restore the points once you undo the damage.','Lockdown Range levels show progress differently: Recruit lists every check as a to-do with hints, Operator shows the remaining count per hardening area, and Captain shows only the checks you have passed.','The debrief lists every missed check with its fix and the reason it matters.'))),
    VENN('Authorized users and admin rights: one action per region',[
     {name:'Authorized users',tone:'l2',items:['keep the account','set a strong password','confirm it holds standard rights']},
     {name:'Admin rights',tone:'amber',items:['remove the account (or lock it while you investigate)','check what it changed']}
   ],{overlaps:[{sets:'AB',name:'Authorized users with admin rights',items:['keep admin rights for the administrators the brief names; for everyone else, remove the rights and keep the account']}],
     intro:'Compare two lists: the brief’s authorized users, and the accounts that hold admin rights on the machine right now. Every account lands in one region, and each region has one action.',
     note:'<b>Outside both circles</b> sit accounts missing from the brief that hold standard rights: remove them too (or lock them while you investigate). Built-in system accounts, such as root and the service accounts below UID 1000 on Linux, belong to the operating system: keep them and check them for extra rights.',
     caption:'On a hardened machine, the admin circle sits entirely inside the authorized circle. An account with admin rights outside it is your first finding.'}),
   QUIZ('s1q','Scenario brief: which actions are safe?',[
     ['Brief: "Authorized users: alice, bob, carol. Administrators: alice. The company runs an FTP server for customers." You find user dave with admin rights and a running FTP service.',['Delete dave, remove FTP','Remove dave\u2019s admin rights and delete dave, harden FTP, and keep it running','Keep dave, remove FTP','Leave both alone'],1,'dave is unauthorized: remove. FTP is required: configure it securely (anonymous login disabled, strong authentication) and keep it up.'],
     ['Brief: "bob needs Remote Desktop to work from home." Which is the right call?',['Disable Remote Desktop, it is insecure','Keep RDP enabled, require Network Level Authentication, make sure bob is in Remote Desktop Users, and limit RDP in the firewall to what is needed','Delete bob to be safe','Open RDP to everyone'],1,'Required services stay, hardened. Removing one the brief needs is an outage.'],
     ['An investigation question asks: "What is the SHA-256 hash of the file secret.txt on the Desktop?" Your answer should be',['The file size','The MD5 hash, it is shorter','The exact SHA-256 hex string alone','The file contents'],2,'Exact format, exact algorithm. Get-FileHash -Algorithm SHA256 on Windows, sha256sum on Linux.'],
     ['Right after your last change, an availability check fails: the company web site is down. What do you check first?',['The last change you made','The firewall in general','Windows Update','Ignore it and keep going'],0,'Last change first; that is what the change log is for. Undo it, confirm the site is back, then find a fix that keeps it running.']
   ]),
   C('The first twenty minutes, and why','Understand',TIPS('<b>The brief comes first,</b> because every later call depends on it.','<b>The before-picture comes before any change,</b> so you can prove what changed and roll it back.','<b>Roles come before typing.</b> On a team, each machine gets a <b>driver</b> who types, a <b>scribe</b> who logs each change before it happens (<a href="#sophomore/s6">the change log</a>), and a <b>verifier</b> who checks every required service and user. The baseline and the roles can happen in either order.','<b>Accounts come next,</b> because comparing users and admins with the brief removes the most risk per minute; policy, the firewall, and updates follow.')),
   ORDER('s1o','Order the first twenty minutes','Put these in the order a calm team does them. Tap items from the pool to build the sequence.',[
     ['Read the whole scenario brief and investigation questions; write down users, admins, and required services','Everything else depends on it. Skipping it is how required services get broken.'],
     ['Record a baseline (users, admins, running services, and listening ports) and take a snapshot if allowed','Your before picture: it lets you prove what changed.',1],
     ['Assign roles: who works this machine, who logs changes, and who verifies','One driver, one scribe, and one verifier per machine; the card above gives the reasons.',1],
     ['Compare users and administrators to the brief','The fastest high-impact wins on any machine; the brief tells you the right answer.'],
     ['Fix accounts: remove unauthorized users, strip extra admins, disable guest, and set passwords','Apply the comparison before you forget it.'],
     ['Move to password and lockout policy, then firewall, then updates','The next areas, in rough order of speed and value.']
   ],'Understand'),
   REFLECT('s1r','Fix, break, or check first?','Take three changes you might make on a lab: removing an unfamiliar backup agent, deleting a user missing from the brief, and turning off an FTP server. For each one, make the three-way call: it fixes a finding, it breaks a requirement, or it needs a check of the brief or the evidence first. Write the brief line or the evidence that decided each call, and what you would check before removing a program that was new to you.'),
   LINKS('Go further',['cis-controls','nist-csf','t4t-range'])
  ]},
 {id:'s2',title:'Windows 11 hardening',bloom:'Apply',sum:'Accounts, password and lockout policy, firewall, updates, Defender, services, startup, permissions, backups, and unauthorized files: by hand.',
  blocks:[
   LAB('f5lab','Lab: read a Windows VM before you change it','Freshman’s <a href="#freshman/f5">First look at Windows</a> named these consoles and commands; now you run them. On a Windows VM you own (Pro or an evaluation edition, and only on a computer you manage yourself), do each step and tick it. Every step reads and leaves the machine as it was, so your notes become the baseline for the hardening below.',[
     ['Open Local Users and Groups and write down every account and whether it is enabled.','lusrmgr.msc'],
     ['List the Administrators group in PowerShell and compare to what you saw.','Get-LocalGroupMember -Group Administrators'],
     ['Check all three firewall profiles are enabled.','Get-NetFirewallProfile | Select-Object Name,Enabled'],
     ['Open Local Security Policy and find Account Policies > Password Policy. Note the minimum length.','secpol.msc'],
     ['Open Windows Security and confirm real-time protection is on.','windowsdefender:','Type the line above in Run (<kbd>Win</kbd>+<kbd>R</kbd>), then open Virus &amp; threat protection &gt; Manage settings (under Virus &amp; threat protection settings) and read the Real-time protection switch.'],
     ['Look at the permissions on a folder and find one inherited entry.','icacls C:\\Users\\Public'],
     ['Open Event Viewer > Windows Logs > Security and find one logon event (ID 4624).','eventvwr.msc']
   ]),
   C('Desktop, member server, or domain controller','Understand',TIPS('A <b>stand-alone</b> desktop keeps only local accounts and local policy (<code>secpol.msc</code>). A <b>domain member</b> keeps local accounts and also accepts domain accounts. A <b>domain controller</b> (DC) keeps every account in Active Directory, managed with <code>dsa.msc</code> or <code>Get-ADUser</code>.','A <b>Group Policy Object</b> (GPO) is a named bundle of settings that a domain pushes to its machines. On a DC the <b>Default Domain Policy</b> GPO sets password and lockout policy for every domain account, and it outranks <code>net accounts</code> and <code>secpol.msc</code>.','<b>Admin by another road.</b> Besides Domain Admins, Enterprise Admins, Schema Admins, and Administrators, the groups Account Operators, Server Operators, Backup Operators, Print Operators, and DnsAdmins reach administrator power indirectly (Backup Operators read any file; DnsAdmins can load code into the DNS service), so audit them the same way. The built-in Administrator belongs to Domain Admins by default.'),P('Junior goes deeper: <a href="#junior/j1">Windows Server and Active Directory</a>.')),
   C('Accounts','Apply',
     CMDS('Users and groups',[
       ['Get-LocalUser | Select-Object Name,Enabled,PasswordRequired','Who exists, who is enabled, and who can have a blank password.'],
       ['Disable-LocalUser -Name Guest','Guest off. Also: net user Guest /active:no'],
       ['Remove-LocalUser -Name mallory','Delete an unauthorized user. Also: net user mallory /delete'],
       ['net user test * /add','Create a local user; the * prompts for its password. PowerShell: New-LocalUser -Name test'],
       ['Remove-LocalGroupMember -Group Administrators -Member dave','Strip admin from an authorized standard user. Also: net localgroup Administrators dave /delete'],
       ['Add-LocalGroupMember -Group "Remote Desktop Users" -Member bob','Give exactly the access the scenario brief asks for.'],
       ['net user alice *','Prompt for a new password for an account with a weak or blank one.'],
       ['Set-LocalUser -Name alice -PasswordNeverExpires $false','Follow the same expiry policy as every other account.']
     ]),
     TIPS('<b>Built-in accounts stay in place.</b> Disable Guest; leave DefaultAccount and WDAGUtilityAccount as Windows keeps them; disable the built-in Administrator on a workstation unless the brief signs in with it, and give it a strong password when it stays. The detail panel lists a domain controller’s set.','<b>When the brief requires Remote Desktop,</b> keep it on, require NLA, add only the listed users to Remote Desktop Users, and scope the firewall rule to the addresses that need it. When the brief leaves it out, turn it off.'),
     DETAIL('Accounts and policy lookups',TIPS('<b>Workstation built-ins:</b> Administrator (disable unless the brief signs in with it; then give it a strong password), Guest (disable), DefaultAccount (Windows keeps it disabled), and WDAGUtilityAccount (Application Guard, which 24H2 removed; the disabled account can remain, especially after an upgrade, so leave it in place).','<b>Server and domain controller:</b> the built-in Administrator is often the authorized sign-in. A DC adds krbtgt (the Kerberos key account, disabled by design) and the DSRM administrator (the local repair account); leave both in place.','<b>net accounts ranges:</b> /minpwlen 0 to 14 (0 allows a blank password; Relax minimum password length limits unlocks 15 and up in secpol.msc), /maxpwage 1 to 999 or UNLIMITED (secpol.msc shows never-expire as 0), /minpwage in days and below the maximum, /uniquepw 0 to 24, /lockoutthreshold 0 to 999 (0 turns lockout off), /lockoutduration in minutes (0 waits for an administrator), and /lockoutwindow in minutes, at most the duration. The lockout switches work even though net help accounts omits them, and complexity lives in secpol.msc or a security template.'))),
   C('Password and lockout policy','Apply',
     P('Open <code>secpol.msc</code> &gt; Account Policies (Pro and above). Or set it from an admin prompt:'),
     CMDS('net accounts',[
       ['net accounts /minpwlen:14 /maxpwage:365 /minpwage:1 /uniquepw:24','Length 14 (the most net accounts accepts), expire after 365 days, wait 1 day between changes, and remember 24 old passwords.'],
       ['net accounts /lockoutthreshold:5 /lockoutduration:15 /lockoutwindow:15','Lock for 15 minutes after 5 bad tries within 15 minutes.'],
       ['net accounts','Verify. net accounts leaves complexity out: set it in secpol.msc &gt; Password Policy (Enabled), or with a security template (Senior).']
     ])),
    COMPARE('CIS Benchmark and NIST SP 800-63B-4: two password rulebooks',[
     {name:'CIS Benchmark',tag:'Windows',tone:'l2',
      svg:{label:'Fourteen of sixteen character slots filled: a minimum length of 14.',view:'0 0 200 42',
       body:'<path d="M4 12 H172" stroke="var(--l2)" stroke-width="14" stroke-dasharray="10 2"/><path d="M172 12 H196" stroke="var(--line)" stroke-width="14" stroke-dasharray="10 2"/><text x="4" y="36" font-size="11" fill="var(--ink)">14 characters or more</text>'},
      rows:[['Length','14 or more characters'],['Complexity','On: a mix of at least three character types, such as upper case, lower case, digits, and symbols'],['Expiry','Every 365 days or fewer, with a minimum age of 1 day'],['History','Remembers the last 24 passwords'],['Lockout','After 5 or fewer failed attempts (0 turns lockout off)']],
      hook:'a checklist an auditor ticks line by line.'},
     {name:'NIST SP 800-63B-4',tag:'2025',tone:'l3',
      svg:{label:'Fifteen of sixteen character slots filled: a minimum length of 15 for a password used on its own.',view:'0 0 200 42',
       body:'<path d="M4 12 H184" stroke="var(--l3)" stroke-width="14" stroke-dasharray="10 2"/><path d="M184 12 H196" stroke="var(--line)" stroke-width="14" stroke-dasharray="10 2"/><text x="4" y="36" font-size="11" fill="var(--ink)">15 characters or more, used alone</text>'},
      rows:[['Length','15 or more when the password is the only factor; 8 or more when it is one factor of multi-factor sign-in. Allows at least 64 characters'],['Complexity','Length instead of composition rules'],['Expiry','A change when there is evidence of compromise, instead of on a schedule'],['Screening','Every new password checked against a blocklist of common, expected, and breached values'],['Failed attempts','Rate-limited']],
      hook:'long, unique, and changed when exposed.'}
   ],{intro:'Both aim for passwords that resist guessing. They differ on expiry and complexity, so check which one the brief names before you set a number.',
     note:'<code>net accounts</code> tops out at a minimum length of 14. To require 15 or more on Windows, enable <b>Relax minimum password length limits</b> (secpol.msc &gt; Account Policies &gt; Password Policy), then raise <b>Minimum password length</b>.',
     caption:'In a lab, the scenario brief picks the rulebook; at work, your organization’s policy does.'}),
   C('Audit policy: turn the lights on','Understand',TIPS('Audit policy decides what Windows writes to the Security log, and Event Viewer holds evidence only for the categories it turns on. Each category records <b>Success</b>, <b>Failure</b>, or both.','<b>Audit logon events</b> covers sign-ins to this machine; <b>Audit account logon events</b> covers credential checks, which a domain controller performs for domain accounts; <b>Audit account management</b> records user and group changes.','Set it in secpol.msc &gt; Local Policies &gt; Audit Policy, then verify it before you rely on the log.'),CMDS('Verify',[['auditpol /get /category:*','Every audit category and what it records now. The event IDs live in <a href="#sophomore/s6">Investigation questions</a>.']])),
   C('Firewall, updates, and antivirus','Apply',
     CMDS('Three quick wins',[
       ['Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True','All three profiles on. Then check rules in wf.msc for anything allowing everything inbound.'],
       ['Set-NetFirewallProfile -Profile Domain,Private,Public -DefaultInboundAction Block','Default deny inbound, allow outbound (the normal posture).'],
       ['ms-settings:windowsupdate','Run this: Settings > Windows Update. Check for updates and install them.'],
       ['Set-MpPreference -DisableRealtimeMonitoring $false','Defender real-time protection on. Confirm in Windows Security > Virus & threat protection.'],
       ['Update-MpSignature','Pull the latest Defender signatures.']
     ]),
     TIPS('<b>Policy beats the toggle.</b> When Defender, the firewall, or Windows Update keeps switching back, look in gpedit.msc (Computer Configuration &gt; Administrative Templates) for a policy that forces it: a policy re-applies over the Settings and Windows Security switches (for Defender, while Tamper Protection is off).')),
    COMPARE('Inbound and outbound: who starts the connection',[
     {name:'Inbound',tag:'Default: block',tone:'l3',
      svg:{label:'A remote host connects in. The firewall blocks the connection on an unlisted port and lets it through on 22/tcp, which has an allow rule.',
       body:'<rect x="4" y="22" width="48" height="30" rx="5" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="2"/><text x="28" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">remote</text><rect x="96" y="4" width="8" height="66" fill="var(--l3)"/><rect x="148" y="22" width="48" height="30" rx="5" fill="var(--paper)" stroke="var(--l3)" stroke-width="2"/><text x="172" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">this PC</text><path d="M54 28 H90" stroke="var(--bad)" stroke-width="2" fill="none" marker-end="url(#arrow-bad)"/><text x="72" y="20" text-anchor="middle" font-size="8" fill="var(--ink-2)">blocked</text><path d="M54 48 H144" stroke="var(--ok)" stroke-width="2" fill="none" marker-end="url(#arrow-ok)"/><text x="150" y="66" text-anchor="middle" font-size="8" fill="var(--ink-2)">22/tcp allowed</text>'},
      rows:[['Who starts it','Another host, connecting to this machine'],['Default','Block'],['Gets through','A port with an allow rule, such as 22/tcp when the brief requires SSH']],
      hook:'a locked front door with a guest list.'},
     {name:'Outbound',tag:'Default: allow',tone:'l2',
      svg:{label:'This machine connects out through the firewall, and the reply comes back in because the firewall tracks the connection.',
       body:'<rect x="4" y="22" width="48" height="30" rx="5" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="28" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">this PC</text><rect x="96" y="4" width="8" height="66" fill="var(--l3)"/><rect x="148" y="22" width="48" height="30" rx="5" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="2"/><text x="172" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">server</text><path d="M54 28 H144" stroke="var(--l2)" stroke-width="2" fill="none" marker-end="url(#arrow-l2)"/><text x="124" y="20" text-anchor="middle" font-size="8" fill="var(--ink-2)">request</text><path d="M146 48 H56" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-ok)"/><text x="50" y="66" text-anchor="middle" font-size="8" fill="var(--ink-2)">reply returns</text>'},
      rows:[['Who starts it','This machine: updates, DNS lookups, and browsing'],['Default','Allow'],['Replies','Come back in automatically: the firewall is stateful and tracks each connection it lets out']],
      hook:'your own calls out, with the answers let back in.'}
   ],{intro:'Direction means who opened the connection, whichever way its packets flow afterward.',
     note:'<b>Windows profiles.</b> Windows Defender Firewall keeps three profiles (Domain, Private, and Public) and applies one to each network connection according to its network category. The quick wins above give all three the same posture. On Linux, <code>ufw default deny incoming</code> plus <code>ufw default allow outgoing</code> sets the same posture.',
     caption:'Default deny inbound, allow outbound, and one allow rule for each required inbound port. Replies to your own outbound connections still arrive.'}),
   C('Services, startup, shares, and files','Apply',
     CMDS('Find the extras',[
       ['Get-Service | Where-Object Status -eq Running | Select-Object Name,DisplayName,StartType','Running services. Research anything unfamiliar before stopping it.'],
       ['Stop-Service -Name Spooler -Force; Set-Service -Name Spooler -StartupType Disabled','Example: Print Spooler stopped and disabled on a machine without a printing role (Microsoft’s own PrintNightmare workaround). Same pattern for RemoteRegistry, ftpsvc, and SNMP when unneeded.'],
       ['Get-NetTCPConnection -State Listen | Select-Object LocalPort,OwningProcess | Sort-Object LocalPort','What is listening. Match PIDs with Get-Process -Id &lt;pid&gt;.'],
       ['Get-ScheduledTask | Where-Object State -ne Disabled | Select-Object TaskName,TaskPath','Scheduled tasks: malware loves these.'],
       ['Get-CimInstance Win32_StartupCommand | Select-Object Name,Command,Location','Startup entries (Run keys and Startup folders).'],
       ['Get-SmbShare','Shares. Keep ADMIN$, C$, and IPC$, which Windows creates on every machine; judge the other shares against the brief and remove the rest: Remove-SmbShare -Name Public'],
       ['Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol','SMBv1 should be Disabled: Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart'],
       ['Get-ChildItem -Path C:\\Users -Recurse -Include *.mp3,*.mp4,*.mkv,*.jpg,*.png,*.exe -ErrorAction SilentlyContinue | Select-Object FullName','Media files and odd executables in user folders. Check the brief or the acceptable-use policy for what is unauthorized.'],
       ['appwiz.cpl','Run it: uninstall unauthorized or suspicious programs (games, cracked tools, and remote-access tools outside the brief).']
     ]),
     TIPS('<b>Service name and display name.</b> Commands take the short service name (RemoteRegistry); services.msc shows the display name (Remote Registry); Get-Service shows both.','<b>Judge a program by its path.</b> Windows and most programs run from C:\\Windows, C:\\Program Files, and C:\\ProgramData (Defender runs from C:\\ProgramData\\Microsoft\\Windows Defender\\Platform). A task, service, Run entry, firewall rule, or Defender exclusion that points into C:\\Users\\Public, Temp, or Downloads deserves a close look, because standard users can write there. Per-user apps such as OneDrive and Teams run from AppData by design, so check the publisher and the brief before you remove one; a maintenance-sounding name is only a label.','<b>Scripts in odd places.</b> A script such as .aspx, .php, or .ps1 in a web root or a user folder can be a planted <b>webshell</b> or backdoor: record its path and hash before you remove it.'),
     DETAIL('Services, startup, Defender, and files',TIPS('<b>Service names</b> (display names): mpssvc (Windows Defender Firewall), WinDefend (Microsoft Defender Antivirus Service), wuauserv (Windows Update), TermService (Remote Desktop Services), RemoteRegistry (Remote Registry), Spooler (Print Spooler), ftpsvc (Microsoft FTP Service), W3SVC (World Wide Web Publishing Service), SNMP (SNMP Service), and sshd (OpenSSH SSH Server). Names ignore case, and sc needs a space after start= (sc config NAME start= disabled).','<b>Tasks and startup:</b> tasks under \\Microsoft\\Windows\\ ship with Windows, while tasks in the root \\ folder were added later, so read their action; the root folder also holds legitimate per-user updater tasks, such as the OneDrive Standalone Update Task. schtasks /query /fo LIST /v shows Task To Run and Author and prints each name after a leading backslash. Run keys: HKLM\\…\\CurrentVersion\\Run and RunOnce (every user) and HKCU\\…\\Run (one user); shell:startup and shell:common startup open the Startup folders.','<b>Defender:</b> Set-MpPreference -DisableRealtimeMonitoring $false turns protection on (a double negative). Tamper Protection blocks changes from PowerShell, the registry, and Group Policy, so use Windows Security &gt; Virus &amp; threat protection &gt; Manage settings when a cmdlet is refused. While Tamper Protection is off, as it is on a lab image that sets such a policy, a policy under Administrative Templates &gt; Windows Components &gt; Microsoft Defender Antivirus overrides the toggle. PUAProtection 1 means on. SmartScreen lives under App &amp; browser control &gt; Reputation-based protection, and memory integrity (HVCI), which blocks unsigned kernel drivers, under Device security &gt; Core isolation.','<b>Prohibited files:</b> media (.mp3, .m4a, .aac, .wav, .flac, .wma, .ogg, .mp4, .mkv, .avi, .mov, and .wmv) and executables or scripts in user folders (.exe, .msi, .bat, .cmd, .ps1, and .vbs). Search every profile under C:\\Users (Desktop, Documents, Downloads, Music, Videos, and Pictures), C:\\Users\\Public, and hidden folders (add -Force in PowerShell).'))),
   C('Permissions, UAC, and backups','Apply',
     CMDS('Check the guard rails',[
       ['icacls "C:\\Shared"','Who can do what to a folder. Look for Everyone or Users with (F) full control or (M) modify where they are out of place.'],
       ['icacls "C:\\Shared" /inheritance:d','Stop inheriting from the parent, keeping copies of the inherited entries so you can edit them.'],
       ['icacls "C:\\Shared" /remove Everyone','Remove the explicit entries for Everyone.'],
       ['icacls "C:\\Shared" /grant "Finance:(OI)(CI)M"','Give the Finance group Modify on the folder and everything inside it. Quote the grant in PowerShell because of the parentheses.'],
       ['secpol.msc','Local Policies > Security Options: "User Account Control: Run all administrators in Admin Approval Mode" should be Enabled (the default).'],
       ['wbadmin start backup -backupTarget:E: -include:C: -allCritical -quiet','Built-in image backup (Windows 11 and Windows Server): back up C: plus everything needed for bare-metal recovery to drive E:.']
     ]),
     TIPS('<b>Backups</b> are their own CIS Control (11: Data Recovery). File History or a backup tool copies personal files to another drive; servers back up volumes and system state. Test-restore every backup: until you have restored it, a backup is only a hope.',
          'Snapshots and backups do different jobs; <a href="#freshman/f4">the Freshman comparison</a> shows which one survives a lost disk.')),
    HIER('NTFS inheritance: entries flow down the folder tree',
     {name:'C:\\ (the drive)',note:'Users: Read &amp; execute (RX), set here and inherited by everything below',tone:'muted',children:[
       {name:'C:\\Shared',note:'Inherits Users from C:\\ and adds an explicit entry, <code>Finance:(OI)(CI)M</code>. Run <code>/inheritance:d</code> here to turn the inherited copies into explicit entries you can edit (<code>/inheritance:r</code> removes them instead).',tone:'l2',children:[
         {name:'Reports (subfolder)',note:'(CI) carries Finance Modify here; icacls marks it <code>(I)</code>, inherited',tone:'l1'},
         {name:'budget.xlsx (file)',note:'(OI) carries Finance Modify here, also marked <code>(I)</code>',tone:'l1'}]}]},
     {intro:'An entry set on a folder flows down to the folders and files inside it. You change an inherited entry where it is set, or break inheritance first; that is why <code>/remove Everyone</code> leaves inherited Everyone entries in place.',
      note:'<b>Who wins a conflict:</b> <a href="#freshman/f5">the Freshman ladder</a> shows the order. <b>Over the network</b>, a user gets the more restrictive of the share permission and the NTFS permission.',
      caption:'(OI) object inherit reaches files, (CI) container inherit reaches subfolders, and together they cover everything below. F is full control, M is modify, and RX is read and execute.'}),
   SPOT('s2sp','Spot the problems: net accounts','The brief says to follow the CIS Benchmark. Tap every line that is a finding, then Check.',[
     ['Force user logoff how long after time expires?:       Never',null],
     ['Minimum password age (days):                          0','Users can change a password and immediately change it back, defeating history. CIS: 1 or more.'],
     ['Maximum password age (days):                          Unlimited','Passwords stay valid indefinitely. CIS: 365 or fewer. (NIST SP 800-63B-4 drops forced changes, but this brief follows CIS.)'],
     ['Minimum password length:                              0','Blank passwords allowed. CIS: 14 or more.'],
     ['Length of password history maintained:                None','Old passwords can be reused. CIS: 24.'],
     ['Lockout threshold:                                    Never','Unlimited guesses. CIS: 1 to 5 (0 turns lockout off).'],
     ['Lockout duration (minutes):                           30',null],
     ['Lockout observation window (minutes):                 30',null],
     ['Computer role:                                        WORKSTATION',null]
   ]),
   QUIZ('s2q','Check: Windows judgment',[
     ['A laptop with an unencrypted disk is stolen from a car, and its files are backed up elsewhere. Which CIA goal is now at risk?',['Integrity','Confidentiality','Availability','Accounting'],1,'Anyone holding the disk can read the files, while the backup keeps them available. Disk encryption, such as BitLocker, protects confidentiality once the hardware leaves your control.'],
     ['A user keeps backups on a USB drive that stays plugged into the same desk, plus a folder that syncs every change to the cloud. Does that meet the 3-2-1 rule and survive ransomware?',['Yes: three copies sit on two kinds of storage','Partly: both copies stay reachable, so ransomware can encrypt the USB copy and the sync can carry encrypted files to the cloud; one copy needs to stay offline or unchangeable','Yes: cloud storage always survives ransomware','Only once a VM snapshot exists'],1,'3-2-1 asks for three copies on two kinds of storage with one off site, and a copy kept offline or unchangeable survives ransomware. A test restore makes it trustworthy.'],
     ['You find shell.aspx in C:\\inetpub\\wwwroot, and the brief describes a site of static pages. What comes first?',['Delete it at once','Open it in a browser to see what it does','Record its path and hash and answer any question about it, then remove it','Leave it, since the web server needs its files'],2,'A script planted in a web root is a likely webshell. Evidence first, then removal; opening it in a browser would run it.'],
     ['You turn Defender real-time protection on, and it switches off again a few minutes later. Where do you look?',['Windows Update history','The Startup tab in Task Manager','The firewall’s inbound rules','gpedit.msc, for a policy that turns Defender off'],3,'A policy re-applies over the Windows Security toggle. Set that policy to Not Configured, then turn protection on.'],
     ['Get-SmbShare lists ADMIN$, C$, IPC$, and Public, and the brief is silent on shares. Which do you remove?',['All four','ADMIN$ and C$','Public','The three with a $ sign'],2,'Windows creates ADMIN$, C$, and IPC$ on every machine. Someone added Public, and the brief leaves it unexplained.']
   ]),
   DETAIL('Snapshots in each hypervisor',TIPS('<b>VirtualBox:</b> in the VM window, Machine &gt; Take Snapshot; to revert, open the VM’s Snapshots view in VirtualBox Manager, select the snapshot, and choose Restore.','<b>VMware Workstation:</b> VM &gt; Snapshot &gt; Take Snapshot, and VM &gt; Snapshot &gt; Revert to Snapshot; Snapshot Manager lists them all.','<b>Hyper-V</b> calls them checkpoints: right-click the VM in Hyper-V Manager and choose Checkpoint, then select it and choose Apply. PowerShell: Checkpoint-VM -Name VM -SnapshotName "before hardening", then Restore-VMCheckpoint. Production checkpoints capture the disk alone; standard checkpoints add memory.','Name each snapshot for the moment it marks, such as "before hardening".')),
   LAB('s2lab','Lab: harden a Windows VM you own','Use a snapshot first. Tick each step as you do it, and write each change in your log.',[
     ['Take a snapshot named "before hardening".',null,'Each hypervisor names this step differently; the <b>Snapshots in each hypervisor</b> panel above lists the menu paths.'],
     ['Disable Guest and confirm it shows Enabled: False.','Disable-LocalUser -Name Guest; Get-LocalUser Guest'],
     ['Create a test user, give it admin, then remove the admin membership again.','net user test * /add; Add-LocalGroupMember -Group Administrators -Member test; Remove-LocalGroupMember -Group Administrators -Member test'],
     ['Set password length, age, history, and lockout, then verify.','net accounts /minpwlen:14 /maxpwage:365 /minpwage:1 /uniquepw:24 /lockoutthreshold:5 /lockoutduration:15 /lockoutwindow:15; net accounts'],
     ['Enable complexity in secpol.msc > Account Policies > Password Policy.','secpol.msc'],
     ['Turn every firewall profile on with default inbound Block.','Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -DefaultInboundAction Block'],
     ['Confirm Defender is on and signatures are current.','Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusSignatureLastUpdated'],
     ['List listening ports and explain each one in your log.','Get-NetTCPConnection -State Listen | Select-Object LocalPort,OwningProcess','<a href="#sophomore/s4">Services and ports</a> explains each part of a listening socket, and its detail panel lists what a clean machine listens on.'],
     ['Create a folder, break inheritance, and give one group Modify.','icacls "C:\\Shared" /inheritance:d'],
     ['Revert to the snapshot and do it again, faster.',null]
   ]),
   LINKS('Go further',['ms-win-sec','ms-baselines','ms-icacls','ms-sysint','nist-63b','t4t-ld-win11','t4t-lr-win'])
  ]},
 {id:'s3',title:'Linux Mint and Ubuntu hardening',bloom:'Apply',sum:'Users, sudo, passwords, ufw, apt, services, SSH, unauthorized files, and snapshots: the Linux half of hands-on hardening.',
  blocks:[
   LAB('f6lab','Lab: read a Linux VM before you change it','Freshman’s <a href="#freshman/f6">First look at Linux</a> named these commands; now you run them. On a Mint or Ubuntu VM you own, do each step and tick it. Every step reads and leaves the machine as it was, so your notes become the baseline for the hardening below.',[
     ['Open a terminal and print where you are and who you are.','pwd; whoami; id'],
     ['Check which release you are on.','cat /etc/os-release'],
     ['List the human accounts on the machine.','awk -F: \'$3 >= 1000 && $3 < 65534 {print $1}\' /etc/passwd'],
     ['List the sudo group.','getent group sudo'],
     ['Read the manual page for ls and find what -a and -l mean.','man ls'],
     ['Show the last 20 lines of the authentication log (Mint/Ubuntu). On Debian use journalctl.','sudo tail -n 20 /var/log/auth.log'],
     ['Check whether the firewall is active.','sudo ufw status']
   ]),
   C('Mint and Ubuntu: same base, different tools','Understand',
     TIPS('<b>Updates.</b> Ubuntu uses Software Updater and <code>unattended-upgrades</code>; Mint uses <b>Update Manager</b>, which can also apply updates automatically (Edit &gt; Preferences &gt; Automation). Both sit on <code>apt</code>, so <code>sudo apt update &amp;&amp; sudo apt upgrade</code> works on either.',
          '<b>Firewall.</b> Both include <code>ufw</code>. Mint adds a graphical Firewall Configuration tool (gufw); Ubuntu Desktop ships without one by default.',
          '<b>Snapshots.</b> Mint\u2019s Update Manager asks you to set up <b>Timeshift</b>, which snapshots system files (home folders are excluded by default). For personal files, use a backup tool such as Ubuntu\u2019s Déjà Dup or Mint\u2019s Backup Tool.',
          '<b>Software.</b> Ubuntu installs some apps as Snaps; Mint disables Snap by default and prefers .deb packages and Flatpak.',
          '<b>Login screen.</b> Ubuntu’s login screen is GDM and Mint’s is LightDM. Automatic login, timed login, and guest sessions hand the desktop to anyone at the keyboard, so all three belong off, and an idle screen lock closes the same gap later.')),
   C('Accounts and sudo','Apply',
     CMDS('Compare to the scenario brief, then act',[
       ['awk -F: \'$3 >= 1000 && $3 < 65534 {print $1}\' /etc/passwd','Human accounts.'],
       ['getent group sudo','Administrators on Mint/Ubuntu/Debian.'],
       ['sudo deluser --remove-home mallory','Remove an unauthorized user and the home directory. (Generic Linux: sudo userdel -r mallory)'],
       ['sudo gpasswd -d dave sudo','Remove dave from the sudo group (keeps the user).'],
       ['sudo usermod -aG sudo alice','Add alice to sudo. -a (append) matters: without it you replace every group alice belongs to.'],
       ['sudo passwd -l hacker','Lock an account you are unsure about instead of deleting it.'],
       ['sudo passwd bob','Set a strong password for an account with a weak one.'],
       ['sudo visudo','Edit sudoers safely. Look for ALL=(ALL) NOPASSWD: ALL and unknown entries, and check /etc/sudoers.d/.']
     ])),
    HIER('Every road to root on Linux',
     {name:'Full control: UID 0',note:'The kernel grants it to user ID 0, whatever the account is called',tone:'bad',children:[
       {name:'Be UID 0',note:'Any line in /etc/passwd with 0 in the third field',tone:'l4',children:[
         {name:'root',note:'Expected. <code>PermitRootLogin no</code> keeps it off SSH',tone:'l3'},
         {name:'Any other UID 0 account',note:'Such as <code>sysadm:x:0:0</code>: a second root and a backdoor. Remove it',tone:'bad'}]},
       {name:'Borrow UID 0',note:'Run commands as root from another account',tone:'l2',children:[
         {name:'sudo group (wheel on some distributions)',note:'Members run commands as root after typing their own password, through the <code>%sudo</code> rule in /etc/sudoers',tone:'l2'},
         {name:'NOPASSWD rule',note:'Skips that password prompt. Read /etc/sudoers and every file in /etc/sudoers.d/',tone:'amber'},
         {name:'su',note:'Opens a whole root shell with root’s own password, which Ubuntu and Mint lock by default',tone:'l1'}]},
       {name:'Act as root another way',note:'Root-equivalent groups: <b>docker</b> and <b>lxd</b> can mount the host’s files, and <b>disk</b> reads raw disks, password hashes included. (<b>adm</b> only reads logs.)',tone:'amber'}]},
     {intro:'Root power belongs to a number, UID 0, rather than to a name. Find every account that is UID 0 and every rule that lets an account act as UID 0.',
      note:'Three checks cover every road: <code>awk -F: \'$3 == 0 {print $1}\' /etc/passwd</code> should print root alone; <code>getent group sudo docker lxd disk</code> should list the brief’s administrators alone; then read <code>sudo visudo</code> and /etc/sudoers.d/.',
      caption:'Keep one UID 0 account (root), keep the sudo group to the brief’s administrators, and remove any sudoers rule the brief leaves unexplained.'}),
   C('Password policy','Apply',
     CMDS('Aging and quality',[
       ['sudo nano /etc/login.defs','Set PASS_MAX_DAYS 365, PASS_MIN_DAYS 1, and PASS_WARN_AGE 7 (or what your policy says). Applies to new accounts.'],
       ['sudo chage -M 365 -m 1 -W 7 alice','Apply the same aging to an existing user. sudo chage -l alice to view.'],
       ['sudo apt install libpam-pwquality','Password quality module.'],
       ['sudo nano /etc/pam.d/common-password','On the pam_pwquality.so line add: retry=3 minlen=14. Add character-class rules (ucredit=-1 and so on) only if your policy requires them; NIST SP 800-63B-4 calls for length instead of composition rules.'],
       ['sudo nano /etc/security/faillock.conf','Lockout with pam_faillock (current Ubuntu, Mint, and Debian): deny = 5 and unlock_time = 900, then enable pam_faillock as man faillock describes.']
     ]),
     NOTE('Snapshot before PAM edits. A typo in common-password or common-auth can lock everyone out, including you.',true),
     DETAIL('Linux account, PAM, login-screen, and SSH settings',TIPS('<b>Accounts:</b> force a change with sudo chage -d 0 NAME (or passwd -e); disable without deleting with usermod -L plus usermod -s /usr/sbin/nologin; root stays locked on Ubuntu and Mint (passwd -l root).','<b>pwquality.conf keys:</b> minlen, dcredit, ucredit, lcredit, ocredit, difok, maxrepeat, and enforce_for_root; add the class rules only when the policy asks. <b>History:</b> remember=5 on the pam_unix.so line in common-password, or pam_pwhistory.','<b>Lockout with pam_faillock:</b> faillock.conf sets deny, unlock_time, and fail_interval. In common-auth, in order: auth required pam_faillock.so preauth silent; the existing pam_unix line, without nullok and with [success=1], so a correct password skips the next line; auth [default=die] pam_faillock.so authfail; auth sufficient pam_faillock.so authsucc. common-account starts with account required pam_faillock.so. faillock --user NAME shows the count, and --reset clears it. Keep a second root terminal open and test with su - NAME.','<b>Automatic updates:</b> /etc/apt/apt.conf.d/20auto-upgrades with APT::Periodic::Update-Package-Lists "1" and APT::Periodic::Unattended-Upgrade "1".','<b>Login screen:</b> GDM: /etc/gdm3/custom.conf [daemon] AutomaticLoginEnable=false and TimedLoginEnable=false. LightDM: /etc/lightdm/lightdm.conf [Seat:*] autologin-user= (empty) and allow-guest=false. Screen lock: gsettings org.gnome.desktop.screensaver (Ubuntu) or org.cinnamon.desktop.screensaver (Mint) lock-enabled true and lock-delay 0, with idle-delay 300 under org.gnome.desktop.session (Ubuntu) or org.cinnamon.desktop.session (Mint).','<b>SSH extras:</b> MaxAuthTries 3 or 4, LoginGraceTime 30, AllowUsers alice bob, and every file in /etc/ssh/sshd_config.d/. Turn ufw logging on.'))),
   ANATOMY('One PAM line: type, control, module, and arguments',[
    {name:'A line in /etc/pam.d/common-password',tag:'one rule',tone:'l2',grid:true,text:'<code>password</code> <code>requisite</code> <code>pam_pwquality.so</code> <code>retry=3</code> <code>minlen=14</code>',children:[
     {name:'password',tag:'type',tone:'l1',text:'Which job: auth, account, password, or session'},
     {name:'requisite',tag:'control',tone:'amber',text:'What a pass or a fail means'},
     {name:'pam_pwquality.so',tag:'module',tone:'l3',text:'The check that runs'},
     {name:'retry=3 minlen=14',tag:'arguments',tone:'l4',text:'Settings for that module'}]}
   ],{intro:'PAM reads each file top to bottom, one rule per line, and every line has the same four parts.',
     label:'A PAM line split into its type, control flag, module, and arguments.',
     facts:{head:['Control flag','On success','On failure'],rows:[['required','Keep going','Keep going, then fail the whole stack at the end'],['requisite','Keep going','Stop at once and fail'],['sufficient','Stop and succeed, when every earlier required line passed','Keep going'],['optional','Counts only when it is the only line of its type','Counts only when it is the only line of its type']]},
     note:'<b>Two backdoors to look for:</b> <code>nullok</code> on the pam_unix line accepts an empty password, and <code>auth sufficient pam_permit.so</code> lets anyone in. Snapshot before any PAM edit.',
     caption:'Read the control flag to know what a failed check does.'}),
   C('Firewall, updates, and services','Apply',
     CMDS('ufw, apt, and systemd',[
       ['sudo ufw default deny incoming','Only allowed traffic comes in.'],
       ['sudo ufw default allow outgoing','Normal outbound traffic.'],
       ['sudo ufw allow 22/tcp','Only if the brief needs SSH. Same pattern for 80/tcp, 443/tcp.'],
       ['sudo ufw enable','Turn it on. sudo ufw status verbose to confirm.'],
       ['sudo apt update && sudo apt upgrade -y','Patch everything. Check Update Manager (Mint) or Software & Updates (Ubuntu) for sources and automatic updates.'],
       ['sudo apt install unattended-upgrades && sudo dpkg-reconfigure -plow unattended-upgrades','Automatic security updates on.'],
       ['sudo ss -tulnp','Listening TCP and UDP sockets with the owning process.'],
       ['systemctl list-units --type=service --state=running','Running services.'],
       ['sudo systemctl disable --now vsftpd','Stop and disable a service the brief leaves out. Then sudo apt purge vsftpd to remove it along with its configuration files.'],
       ['sudo apt purge telnetd','Remove clearly insecure packages (telnetd, rsh-server) when the brief leaves them out.'],
       ['sudo timeshift --create --comments "before hardening"','Mint: a system snapshot from the command line before risky changes.']
     ])),
   C('SSH and unauthorized files','Apply',
     CMDS('sshd_config and find',[
       ['sudo nano /etc/ssh/sshd_config','Set PermitRootLogin no, PermitEmptyPasswords no, and X11Forwarding no. Keep PasswordAuthentication yes unless the brief says keys only.'],
       ['sudo sshd -t && sudo systemctl restart ssh','Test the config, then restart (service name ssh on Debian/Ubuntu/Mint). Check how the service starts (systemctl status ssh.socket): on Ubuntu 24.04 and Mint 22, ssh.socket holds port 22, so disabling ssh.service leaves it open, and a Port change needs sudo systemctl daemon-reload &amp;&amp; sudo systemctl restart ssh.socket.'],
       ['sudo find / -type f \\( -iname "*.mp3" -o -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.jpg" \\) 2>/dev/null','Media files anywhere. Check the brief before deleting.'],
       ['sudo find /home -type f \\( -iname "*.sh" -o -iname "*.py" \\) 2>/dev/null','Scripts in home folders: read them.'],
       ['sudo find / -perm -4000 -type f 2>/dev/null','SUID binaries. Compare to a clean VM; unknown ones are suspicious.'],
       ['dpkg -l | grep -i NAME','Installed .deb packages; apt list --installed lists them too.'],
       ['snap list','Snap packages, which apt’s list leaves out.'],
       ['flatpak list','Flatpak apps, also outside apt’s list. Check every channel against the brief’s banned categories.'],
       ['ls -la /home/*/.ssh','Extra authorized_keys entries are backdoors.']
     ])),
   SPOT('s3sp','Spot the problems: sshd_config','Tap every line that weakens the server, then Check.',[
     ['Port 22',null],
     ['PermitRootLogin yes','Root can log in over the network with a password. Set no.'],
     ['PubkeyAuthentication yes',null],
     ['PasswordAuthentication yes',null],
     ['PermitEmptyPasswords yes','Accounts with empty passwords can log in. Set no.'],
     ['X11Forwarding yes','Unneeded feature with a long history of abuse. Set no.'],
     ['MaxAuthTries 100','Brute force welcome. Set 3 or 4.'],
     ['UsePAM yes',null],
     ['Subsystem sftp /usr/lib/openssh/sftp-server',null]
   ]),
   SPOT('s3sp2','Spot the problems: /etc/passwd','The brief says the authorized users are alice and bob, and the only administrator is alice. Tap the suspicious lines, then Check.',[
     ['root:x:0:0:root:/root:/bin/bash',null],
     ['daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin',null],
     ['alice:x:1000:1000:Alice:/home/alice:/bin/bash',null],
     ['bob:x:1001:1001:Bob:/home/bob:/bin/bash',null],
     ['backup:x:34:34:backup:/var/backups:/usr/sbin/nologin',null],
     ['sysadm:x:0:0::/home/sysadm:/bin/bash','A second UID 0 account. This is root under another name: a backdoor.'],
     ['games:x:5:60:games:/usr/games:/usr/sbin/nologin',null],
     ['tmpuser:x:1002:1002::/home/tmpuser:/bin/bash','Missing from the authorized list. Investigate and remove.']
   ]),
   QUIZ('s3q','Check: Mint and Ubuntu hardening',[
     ['Which PAM control flag stops the stack at once when its check fails?',['required','sufficient','requisite','optional'],2,'requisite fails immediately. required fails the stack too, after the remaining lines run.'],
     ['You set PASS_MAX_DAYS 90 in /etc/login.defs. Which accounts change?',['Every account at once','Only root','Only members of the sudo group','Only accounts created afterward; sudo chage -M 90 NAME updates each existing one'],3,'login.defs holds the defaults for new accounts, and chage applies aging to the accounts that already exist.'],
     ['Before you restart SSH after editing sshd_config, which command catches a typo that would lock everyone out?',['sudo systemctl status ssh','sudo sshd -t','sudo ss -tulnp','sudo ufw status'],1,'sshd -t tests the configuration and prints the error, so you fix it before the restart.'],
     ['On Ubuntu 24.04 you run sudo systemctl disable --now ssh, yet port 22 still listens. Why?',['ssh.socket holds port 22 and starts sshd on demand','ufw reopened the port','sshd ignores systemctl','The change waits for a reboot'],0,'With socket activation the .socket unit owns the port. Disable ssh.socket too when the brief leaves SSH out.'],
     ['The brief requires SSH and a web site. sudo ufw status verbose shows <code>Default: deny (incoming), allow (outgoing)</code> and one rule, <code>22/tcp ALLOW IN Anywhere</code>. What is missing?',['A deny rule for 22/tcp','Default allow incoming','Allow rules for the web ports, 80/tcp and 443/tcp','A rule that denies outgoing traffic'],2,'Default deny blocks every inbound port the rules leave out, so the required web site needs its own allow rules.'],
     ['bob belongs to the docker group, and the brief lists bob as a standard user. Why does that matter?',['docker only serves web pages','docker members can mount the host’s files as root, so the group equals admin power','The group matters only while bob is signed in','docker members only read logs'],1,'docker, lxd, and disk are root-equivalent groups. Remove bob from docker, just as you would from sudo.']
   ]),
   LAB('s3lab','Lab: harden a Mint or Ubuntu VM you own','Snapshot first. Tick each step, log each change.',[
     ['Create a test user, add it to sudo, then remove it from sudo.','sudo adduser test; sudo usermod -aG sudo test; sudo gpasswd -d test sudo'],
     ['Set aging in /etc/login.defs and apply it to your main user with chage.','sudo chage -M 365 -m 1 -W 7 $USER; sudo chage -l $USER'],
     ['Install pwquality and set minlen=14 in common-password, then test by trying a weak password.','sudo apt install libpam-pwquality'],
     ['Default-deny inbound firewall, enable, and verify.','sudo ufw default deny incoming; sudo ufw enable; sudo ufw status verbose'],
     ['Patch and turn on unattended upgrades.','sudo apt update && sudo apt upgrade -y'],
     ['List listening sockets and explain each in your log.','sudo ss -tulnp'],
     ['Set PermitRootLogin no, test, and restart SSH.','sudo sshd -t && sudo systemctl restart ssh'],
     ['Find all SUID files and media files; note which you would remove and why.','sudo find / -perm -4000 -type f 2>/dev/null'],
     ['Download a small file whose publisher lists a SHA-256 value, hash it, and compare the two.','sha256sum FILE']
   ]),
   LINKS('Go further',['ubuntu-server','ubuntu-sec','mint-docs','cis','t4t-ld-mint','t4t-ld-ubuntu','t4t-lr-linux'])
  ]},
 {id:'s4',title:'Services and ports',bloom:'Understand',sum:'Which services are insecure by design, which are insecure by configuration, and how to tell "remove" from "harden".',
  blocks:[
   C('Remove, harden, or keep','Understand',
     TIPS('<b>Insecure by design</b> (clear-text credentials): Telnet (23), FTP (21), rsh/rlogin (512-514), and HTTP admin pages. Remove them when the brief leaves them out; if required, restrict and monitor.',
          '<b>Insecure by configuration</b>: SSH with root login, Samba with guest shares (SMB, TCP 445), VNC without a password, RDP without NLA, and SNMP with "public". Keep if required, fix the configuration.',
          '<b>Mail and databases.</b> SMTP (TCP 25) and MySQL (TCP 3306) stay only when the brief needs them, and a database that serves only local apps listens on 127.0.0.1.',
          '<b>Remote access tools</b> missing from the brief (TeamViewer, AnyDesk, VNC, and netcat listeners) are usually unauthorized software or malware.',
          'Rule of thumb: you are done with a listening port only once you can say what it is for.',
          '<b>Know normal first.</b> Record what a clean VM of the same version listens on, so an extra listener stands out; the detail panel lists the usual ones.'),
     DETAIL('Settings for services you keep',TIPS('<b>vsftpd</b> (/etc/vsftpd.conf): anonymous_enable=NO, local_enable=YES, write_enable=YES only when uploads are required, chroot_local_user=YES, and ssl_enable=YES.','<b>Apache</b> (/etc/apache2/conf-available/security.conf on the Debian family; /usr/local/etc/apache24/httpd.conf on FreeBSD): ServerTokens Prod, ServerSignature Off, TraceEnable Off, and Options -Indexes in the site’s Directory block. Test with apachectl configtest, then reload.','<b>Samba</b> (/etc/samba/smb.conf; /usr/local/etc/smb4.conf on FreeBSD): map to guest = Never, restrict anonymous = 2, and guest ok = no on each share. Test with testparm. smbd serves TCP 139 and 445, and nmbd serves UDP 137 and 138.','<b>MySQL or MariaDB:</b> bind-address = 127.0.0.1 when only local apps connect (mysqld.cnf for MySQL, 50-server.cnf for MariaDB on the Debian family, and my.cnf on FreeBSD), then sudo mysql_secure_installation.','Old clear-text servers often start through inetd or a .socket unit: close that too.'))),
    SEQ('Remove, harden, or keep: two questions',[
     ['Name the listener','<code>ss -tulnp</code> or <code>Get-NetTCPConnection -State Listen</code>: find the owning process, then the package or program behind it.'],
     {ask:'Does the scenario brief require it?',branches:[['No','Stop it, disable it, and remove it, along with anything that relaunches it (services, scheduled tasks, and cron jobs). Remote-access tools that the brief leaves out land here.'],['Yes','Keep it running and ask the next question.']]},
     {ask:'Where does the weakness live?',branches:[['In the protocol','Insecure by design: Telnet, FTP, and rsh send credentials in clear text. Move to SSH, SFTP, or FTPS if the brief allows; otherwise keep it, restrict who can reach it, tighten its settings (<code>anonymous_enable=NO</code> for vsftpd), and watch its logs.'],['In the settings','Insecure by configuration: SSH root login, guest shares, VNC without a password, RDP without NLA, and SNMP with "public". Keep it and fix the setting.'],['Neither','Keep it, patched and logged.']]},
     ['Prove it still works','Test every required service and user from the brief, then log the change and how to undo it.','ok']
   ],{intro:'Two questions sort every service. Answer them in order, and write each decision in your change log.',
     caption:'Removing a required service fails an availability check; hardening it keeps the business running.'}),
   C('Processes and threads: who is listening','Understand',
     P('Every service on this page runs as a <b>process</b>: a running program with its own memory and its own security identity. Inside each process, one or more <b>threads</b> do the work. Threads share their process’s memory and permissions, and each keeps its own place in the code.'),
     ANATOMY(null,[
       {name:'Process: browser.exe (PID 4120)',tag:'runs as: alex',tone:'l2',grid:true,
        panel:['Owned by the process, shared by its threads','Its own memory (code, data, heap)','open files and network sockets','security token or user ID'],
        children:[
          {name:'Thread 1',tone:'l1',text:'own stack<br>own registers',svg:{width:46,height:16,view:'0 0 46 16',body:'<path d="M2 8 C10 0, 18 16, 26 8 S42 0, 44 8" fill="none" stroke="var(--l1)" stroke-width="2"/>'}},
          {name:'Thread 2',tone:'l1',text:'own stack<br>own registers',svg:{width:46,height:16,view:'0 0 46 16',body:'<path d="M2 8 C10 16, 18 0, 26 8 S42 16, 44 8" fill="none" stroke="var(--l1)" stroke-width="2"/>'}},
          {name:'Thread 3',tone:'l1',text:'own stack<br>own registers',svg:{width:46,height:16,view:'0 0 46 16',body:'<path d="M2 8 H44" fill="none" stroke="var(--l1)" stroke-width="2" stroke-dasharray="4 3"/>'}}]},
       {name:'Process: sshd (PID 812)',tag:'runs as: root',tone:'l3',
        panel:['Separate memory and its own permissions','The operating system keeps each process’s memory apart from every other process.']}
     ],{label:'Two processes. Each has its own memory, open files, and security token. Inside the first process, three threads share that memory and each has its own stack and registers.',
       facts:{head:['','Process','Thread'],rows:[
         ['Is','A running program','A path of execution inside a process'],
         ['Owns','Memory, open files, sockets, and a security identity','Its own stack and registers'],
         ['Shares','With other processes: only what it chooses, through the OS','Everything its process owns'],
         ['Permissions','Set per process (its user or token)','Its process’s, by default'],
         ['A crash','Stays in that process','Can stop the whole process'],
         ['See it','Task Manager › Details; <code>ps aux</code>','Details › Threads column; <code>ps -eLf</code>, <code>top -H</code>']]},
       caption:'For defenders: privileges belong to the process, so a service running as root or SYSTEM gives all of its threads that power. Run services as the least-privileged account that works.',
       alt:'A process is a running program. It owns its memory (code, data, and heap), its open files and network sockets, and a security identity (a user ID or token). The operating system keeps each process’s memory apart. A thread is a path of execution inside a process: each thread has its own stack and registers, and shares everything else its process owns, including its permissions. A crash in one thread can stop the whole process. The figure shows two examples: browser.exe (PID 4120), running as alex with three threads, and sshd (PID 812), running as root. Windows lists processes in Task Manager’s Details tab, where you can add a Threads column; Linux lists processes with ps aux and threads with ps -eLf or top -H.'}),
     TIPS('<b>Permissions belong to the process.</b> Windows gives each process an access token, and Linux gives it user and group IDs. Its threads act with those rights by default; a server thread can briefly borrow a client’s identity, which Windows calls impersonation.',
          '<b>Ports belong to processes too.</b> Each listening socket has an owning process: <code>ss -tulnp</code> names the program and PID behind every port on Linux, and <code>netstat -ano</code> shows the PID on Windows (match it with <code>tasklist</code>). That name is your first clue for remove, harden, or keep.',
          '<b>The account sets the blast radius.</b> A service running as root or SYSTEM gives every one of its threads full control of the machine. Well-built services, such as web servers, keep one small parent process as root to open their port and run the workers that handle requests under a low-privilege account (www-data on Debian and Ubuntu), so ps shows one root process and many www-data ones.',
          '<b>Malware hides in both.</b> It runs as its own process under a harmless-looking name, or starts a thread inside a trusted process (injection). Check the path, the account, and the parent process of anything unexpected.'),
     CMDS('See them for yourself',[
       ['tasklist /svc','Windows: every process with its PID and the services it hosts.'],
       ['Get-Process -IncludeUserName','Windows PowerShell, elevated: each process with the account it runs as.'],
       ['(Get-Process -Id 4120).Threads.Count','Windows PowerShell: the number of threads in one process (use a real PID).'],
       ['ps aux','Linux: every process with its user, PID, CPU, and memory.'],
       ['ps -eLf','Linux: one line per thread; LWP is the thread ID and NLWP the thread count.'],
       ['top -H','Linux: a live view of threads instead of processes (q to quit).'],
       ['ps -u NAME','Linux: every process one user runs.'],
       ['kill PID','Linux: end one process (pkill NAME ends it by name). Remove what starts it first, or a unit with Restart=always, a cron line, or rc.local brings it back.'],
       ['Stop-Process -Id PID','Windows PowerShell: end one process; disable its service or task first, for the same reason.']
     ])),
    ANATOMY('Port, service, and process: one listening socket',[
     {name:'Listening socket',tag:'one line of ss -tulnp',tone:'l2',grid:true,
      text:'<code>tcp LISTEN 0 128</code> <code>0.0.0.0:22</code> <code>0.0.0.0:*</code> <code>users:(("sshd",pid=812,fd=3))</code>',
      children:[
        {name:'Protocol',tone:'l1',text:'<code>tcp</code> or <code>udp</code>'},
        {name:'Local address',tone:'l3',text:'<code>0.0.0.0</code> or <code>[::]</code>: every interface<br><code>127.0.0.1</code> or <code>[::1]</code>: this machine alone'},
        {name:'Port',tone:'l2',text:'<code>22</code>: a convention the program chose'},
        {name:'Owning process',tone:'l4',text:'<code>sshd</code>, PID 812: the program that answers'}]}
   ],{intro:'People say port, service, and process as if they were one thing. A listening socket ties them together, and each tool shows a different part of it.',
     label:'A listening socket has four parts: the protocol, the local address, the port number, and the owning process.',
     facts:{head:['','What it is','See it'],rows:[
       ['Port','A number from 1 to 65535 on TCP or UDP. Any program with the rights can listen on any free port, so 22 is a habit rather than a guarantee','<code>ss -tulnp</code>; <code>netstat -ano</code>'],
       ['Service','A program the system starts and keeps running in the background','<code>systemctl</code>; <code>Get-Service</code>'],
       ['Process','The running program, with a PID and an account','<code>ps aux</code>; <code>Get-Process</code>']]},
     note:'A firewall decides who can reach a listener, and the listener keeps running behind it. To close a port for good, stop and disable the service or remove the software. <b>When the owner is inetd or systemd,</b> a super-server or a .socket unit holds the port and starts the program on demand: find that inetd line or socket unit and disable it too (ssh.socket in <a href="#sophomore/s3">Linux Mint and Ubuntu hardening</a> is one example).',
     caption:'Trust the owning process over the port number: the number is a convention, and the process shows what really answers.',
     alt:'One line of ss -tulnp reads: tcp, LISTEN, local address 0.0.0.0 port 22, peer 0.0.0.0:*, owned by sshd with PID 812. It has four parts. Protocol: tcp or udp. Local address: 0.0.0.0 or [::] listens on every interface; 127.0.0.1 or [::1] listens for this machine alone. Port: 22, a convention the program chose. Owning process: sshd, PID 812, the program that answers. A port is a number from 1 to 65535 on TCP or UDP; see ports with ss -tulnp on Linux and netstat -ano on Windows. A service is a program the system starts and keeps running in the background; see services with systemctl and Get-Service. A process is the running program, with a PID and an account; see processes with ps aux and Get-Process.'}),
   DETAIL('Ports and normal listeners',TIPS('<b>Well-known ports:</b> 20 and 21 FTP, 22 SSH, 23 Telnet, 25 SMTP, 53 DNS (UDP, and TCP for large answers), 67 and 68 DHCP, 80 HTTP, 88 Kerberos, 110 POP3, 123 NTP, 135 RPC, 139 and 445 SMB, 143 IMAP, 161 SNMP, 389 and 636 LDAP, 443 HTTPS, 464 Kerberos password change, 514 syslog, 631 IPP (cupsd), 3268 and 3269 Global Catalog, 3306 MySQL, 3389 RDP, and 5353 mDNS (avahi). Windows hands out dynamic RPC ports from 49152 up and usually shows 49664 and higher.','<b>A clean Windows workstation:</b> 135 (RPC, svchost), 139 (NetBIOS, when on), 445 (SMB, System), 5040 (Connected Devices Platform), 5357 (WSD, on private networks), and 49664 to 49670 (lsass, wininit, services, spoolsv, and the event log). A server adds 5985 and 47001 (WinRM) and often 3389; a domain controller adds 53, 88, 389, 636, 464, 3268, 3269, and 9389 (AD Web Services).','<b>A clean Mint or Ubuntu desktop:</b> cupsd on 127.0.0.1:631, avahi-daemon on 5353/udp, and systemd-resolved on 127.0.0.53:53.','<b>Common attacker picks:</b> 4444 and 1337, often with netcat or nc.exe.')),
   MATCH('s4m','Match the service to its port','Tap a service, then the port it normally uses.',[
     ['SSH','22','Encrypted remote login.'],['Telnet','23','Clear-text remote login.'],['FTP','21','File transfer; port 21 carries the commands.'],['HTTP','80','Web pages in clear text.'],['HTTPS','443','Web pages over TLS.'],['DNS','53','Name lookups: UDP for most queries, TCP for large answers.'],['RDP','3389','Windows Remote Desktop.'],['SMB','445','Windows file sharing, also served by Samba.'],['SMTP','25','Mail between servers.'],['MySQL','3306','The MySQL and MariaDB database.']
   ],'Remember'),
   QUIZ('s4q','Check: what would you do?',[
     ['ss -tulnp shows vsftpd listening on 21. Brief: "This machine is a web server." Action?',['Keep it, it is harmless','Disable and remove vsftpd','Change the port to 2121','Add a firewall rule allowing 21'],1,'FTP falls outside the scenario. Remove it, then confirm the web server still works.'],
     ['Brief: "Employees transfer files to this server with FTP." Action?',['Remove FTP anyway','Keep FTP, disable anonymous login, require strong passwords, and restrict users to their home directories','Replace it with Telnet','Open FTP to the internet'],1,'Required service: harden it. In vsftpd.conf that means anonymous_enable=NO, local_enable=YES, chroot_local_user=YES.'],
     ['Windows shows a listener on 5900 owned by winvnc.exe, absent from the brief.',['Leave it, VNC is standard','Uninstall it and check startup and scheduled tasks for anything that re-launches it','Only block port 5900 in the firewall','Rename the process'],1,'Unlisted remote-access software is an unauthorized-software or malware finding. Remove it and its persistence.'],
     ['Which is the usual default firewall posture for a workstation or server?',['Block everything in and out','Default deny inbound, allow outbound, and open only required inbound ports','Allow everything, the OS handles it','Block outbound only'],1,'Blocking all outbound traffic would break updates, DNS, and everything users need. Tighter outbound filtering is possible, but it has to be planned service by service.']
   ]),
   LINKS('Go further',['ubuntu-server','ms-win-sec','cis'])
  ]},
 {id:'s5',title:'Cisco: configure a switch and a router',bloom:'Apply',sum:'The baseline IOS commands for a new switch and router, why each one matters, and how to verify them.',
  blocks:[
