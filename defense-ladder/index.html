   C('Addresses and subnets','Understand',P('Every prefix splits an address into network bits and host bits. Set every host bit to 0 and you get the <b>network address</b>; set every host bit to 1 and you get the <b>broadcast address</b>; the addresses between them are the usable hosts, 2<sup>h</sup> − 2 for h host bits.'),TIPS('<b>10.1.20.0/24</b> (Teachers): network 10.1.20.0, broadcast 10.1.20.255, and usable 10.1.20.1 to 10.1.20.254, which is 254 hosts. RtrA takes .1 as the gateway, and SwA takes .2.','<b>10.1.20.64/26:</b> the mask’s last octet is 192, and 256 − 192 = 64 is the block size, so the subnets start at .0, .64, .128, and .192. This one runs from 10.1.20.64 to 10.1.20.127, with 62 usable hosts.','<b>VLSM (variable-length subnet masks):</b> give each subnet the smallest mask whose 2<sup>h</sup> − 2 covers its hosts, then carve the largest first so each block starts on its own boundary. From 10.1.20.0/24, 100 hosts take a /25 at .0, 40 take a /26 at .128, and 10 take a /28 at .192.','<b>10.0.0.0/30</b> (the link between the sites): four addresses and two usable ones, 10.0.0.1 and 10.0.0.2, exactly one router at each end.','<b>A gateway sits inside its hosts’ subnet,</b> because a host reaches its gateway directly over the local link.'),P('Practice the arithmetic in <a href="'+RES['t4t-subnet'][1]+'" target="_blank" rel="noopener noreferrer">Subnet Sprint</a>.')),
   C('Baseline switch configuration','Apply',
     P('The worked example is <b>SwA</b>, the Site A switch: a Cisco 2960 with ports Fa0/1 to Fa0/24 and two uplinks, G0/1 and G0/2. The commands match Packet Tracer and classic IOS 15.'),
     CMDS('SwA, from user mode to a saved config',[
       ['enable','User EXEC (>) to privileged EXEC (#).'],
       ['configure terminal','Global configuration mode (config)#.'],
       ['hostname SwA','Match the name in your network documentation exactly; it appears in prompts, logs, and neighbor tables.'],
       ['ip domain-name school.lan','Required before generating the SSH key; the key is named after the hostname and the domain (SwA.school.lan).'],
       ['vlan 10','Then: name STUDENTS. Creates VLAN 10 in the VLAN database.'],
       ['vlan 20','Then: name TEACHERS. Teachers, and the switch’s management address.'],
       ['vlan 30','Then: name PRINCIPALS.'],
       ['vlan 99','Then: name NATIVE. The trunk’s untagged VLAN; it carries no hosts.'],
       ['vlan 999','Then: name PARKING. Unused ports wait here, shut down.'],
       ['interface range f0/1 - 8','Students ports. Then: switchport mode access, switchport access vlan 10, spanning-tree portfast, and spanning-tree bpduguard enable.'],
       ['interface range f0/9 - 16','Teachers ports: the same four commands, with switchport access vlan 20.'],
       ['interface range f0/17 - 20','Principals ports: the same four commands, with switchport access vlan 30.'],
       ['switchport port-security','On each user port, after switchport mode access: limits which devices may use the port. Then: switchport port-security maximum 1, switchport port-security mac-address sticky (learns the first device), and switchport port-security violation shutdown. A second device err-disables the port until an admin removes that device and cycles the port (shutdown, then no shutdown).'],
       ['interface range f0/21 - 24, g0/2','Unused ports. Then: switchport mode access, switchport access vlan 999, and shutdown.'],
       ['interface vlan 20','Management interface (SVI). Then: ip address 10.1.20.2 255.255.255.0 and no shutdown.'],
       ['ip default-gateway 10.1.20.1','In global configuration: RtrA’s Teachers address, so admins on other subnets and at Site B reach the switch.'],
       ['interface vlan 1','Then: shutdown. VLAN 1 keeps its default role and carries no management address.'],
       ['security passwords min-length 10','Every new password on the device needs at least 10 characters, so set it before the passwords below.'],
       ['enable secret En@ble-A1-26','Hashed password for privileged mode (use this instead of enable password).'],
       ['line console 0','Then: password C0nsole-A1, login, and exec-timeout 5 0 (idle sessions log out after 5 minutes). exit to leave.'],
       ['service password-encryption','Obscures the clear-text line passwords in the config (weak, but better than plain text).'],
       ['username netadmin secret Adm1n-A1-26','Local account used by login local. IOS privilege levels run from 0 to 15: level 1 is user EXEC and 15 is full control (username NAME privilege 15 secret …), so a privilege 15 user missing from the brief is an admin backdoor.'],
       ['login block-for 120 attempts 3 within 60','Three failed logins within 60 seconds block new logins for 120 seconds (quiet mode), while the console keeps working: the same idea as account lockout on Windows and Linux.'],
       ['crypto key generate rsa modulus 2048','SSH key pair. It needs the hostname and the domain name first.'],
       ['ip ssh version 2','SSH version 2 only.'],
       ['line vty 0 15','Remote lines. Then: login local, transport input ssh, and exec-timeout 5 0. The VTY lines accept SSH only, so a Telnet attempt gets connection refused.'],
       ['banner motd #Authorized access only#','Legal notice, shown first. Pick a delimiter character that appears nowhere in the text.'],
       ['banner login #Authorized staff only. Activity is logged.#','On the console, the MOTD shows first, then the login banner, just before the login prompt (Password: here; Username: on lines that use login local).'],
       ['copy running-config startup-config','Save to NVRAM. Unsaved changes vanish on reload. (VLANs live in vlan.dat in flash, saved as you create them.)']
     ]),
     CMDS('Verify SwA',[
       ['show vlan brief','VLAN names and their access ports: STUDENTS, TEACHERS, PRINCIPALS, NATIVE, and PARKING.'],
       ['show ip interface brief','Vlan20 up/up with 10.1.20.2; Vlan1 administratively down.'],
       ['show interfaces f0/1 switchport','The port’s role: Administrative Mode static access, Access Mode VLAN 10.'],
       ['show mac address-table','Learned MAC addresses, by VLAN and port.'],
       ['show ip ssh','"SSH Enabled - version 2.0".'],
       ['show running-config | section line vty','login local and transport input ssh on every VTY line.'],
       ['ping 10.1.20.2','From a Teachers PC: the switch’s management address answers.']
     ]),
     COMPARE('Reading show ip interface brief: Status and Protocol',[
      {name:'administratively down / down',tone:'muted',rows:[['Means','shutdown is in the configuration'],['Layer','Configuration'],['First fix','no shutdown']]},
      {name:'down / down',tone:'bad',rows:[['Means','The physical port senses a dead link'],['Layer','Layer 1: the cable, the port, or the far end'],['First fix','Check the cable and the device at the other end']]},
      {name:'up / down',tone:'amber',rows:[['Means','Signal, with the link protocol down; on an SVI, the VLAN exists and every port in it is down'],['Layer','Layer 2'],['First fix','Match the far end’s settings, or bring up a port in the VLAN']]},
      {name:'up / up',tone:'ok',rows:[['Means','Working'],['Layer','Layers 1 and 2 check out'],['First fix','Move up a layer: addresses and routes']]}
     ],{intro:'Read the two columns as a pair; each pair points at one layer (<a href="#freshman/f7">the layers</a> from Freshman).',caption:'Start at the lowest layer the pair points to.',bloom:'Understand'}),
     NOTE('Every password here is a placeholder, and each line uses a different one. On a real device, choose a unique passphrase for each: the enable secret, the console, and every user.'),
     DETAIL('IOS baseline extras',TIPS('<code>no ip domain-lookup</code> stops a typo from hanging while IOS tries to resolve it as a hostname.','<code>logging synchronous</code> on the console keeps log messages from splitting what you type.','<code>ip ssh time-out 60</code> and <code>ip ssh authentication-retries 3</code> tighten SSH logins.','<code>exec-timeout</code> takes minutes, then seconds; 0 0 turns it off, and the IOS default is 10 minutes.','Routers also have an <b>AUX</b> (auxiliary) port, a second console-style line often wired to a modem. Secure <code>line aux 0</code> like the console, with <code>login local</code> and <code>exec-timeout 5 0</code>, or give it <code>no exec</code> when the port goes unused.','Password types: 0 clear text, 7 reversible, 5 MD5, 8 PBKDF2, and 9 scrypt (<code>enable algorithm-type scrypt secret …</code>).','The number of VTY lines differs by platform: a 2960 has lines 0 to 15, which show running-config may list as vty 0 4 and vty 5 15, while many routers list 0 4 alone and some images add 5 15. Configure every range the configuration lists.','Banner order on the console: the MOTD, then the login banner, then the prompt. Over SSH version 2 the login banner shows before authentication.','Interface names: Fa0/1 and G0/0 on classic gear; G0/0/0 on an ISR 4000.'))),
    HIER('IOS command modes: where each command lives',
     {name:'User EXEC',note:'Prompt <code>SwA&gt;</code>: basic monitoring. <code>enable</code> moves down a level',tone:'l1',children:[
       {name:'Privileged EXEC',note:'Prompt <code>SwA#</code>: show, copy, ping, and reload. <code>configure terminal</code> moves down',tone:'l2',children:[
         {name:'Global configuration',note:'Prompt <code>SwA(config)#</code>: hostname, enable secret, username, banner, and ip default-gateway',tone:'l3',children:[
           {name:'Interface configuration',note:'<code>SwA(config-if)#</code>, from <code>interface vlan 20</code>: ip address and no shutdown',tone:'l4'},
           {name:'Line configuration',note:'<code>SwA(config-line)#</code>, from <code>line console 0</code> or <code>line vty 0 15</code>: password, login local, transport input ssh, and exec-timeout',tone:'l4'}]}]}]},
     {intro:'Each prompt tells you where you are. A command typed at the wrong level returns an error, so read the prompt first.',
      note:'<code>exit</code> climbs one level; <code>end</code> or Ctrl+Z jumps straight back to privileged EXEC. In any configuration mode, put <code>do</code> in front of a privileged command (<code>do show ip interface brief</code>) to run it where you are.',
      caption:'Down the tree: enable, configure terminal, then interface or line. The prompt changes at every step.'}),
   DETAIL('Port security options and err-disabled recovery',TIPS('<code>switchport port-security maximum N</code> sets how many MACs may use the port (default 1).','<code>switchport port-security mac-address sticky</code> learns MACs from traffic and writes them into the running-config, so save after testing.','Violation modes: <b>protect</b> drops the extra traffic quietly, <b>restrict</b> drops it and logs, and <b>shutdown</b>, the default, err-disables the port.','<code>show port-security interface f0/9</code> shows the mode, the count, and the last violating MAC.','Recovery: remove the cause, then <code>shutdown</code> and <code>no shutdown</code> on the port. The log names the reason: %PORT_SECURITY-2-PSECURE_VIOLATION or %SPANTREE-2-BLOCK_BPDUGUARD. An err-disabled port differs from a spanning-tree blocking port: it stays shut until you act, or until an errdisable recovery timer does.')),
   COMPARE('vlan 20 and interface vlan 20 on SwA',[
     {name:'vlan 20',tag:'Layer 2 · the VLAN',tone:'l2',
      rows:[['Lives in','The VLAN database, vlan.dat in flash, saved as you create it'],
            ['Is up when','It exists: <code>show vlan brief</code> lists it as active']],
      hook:'the room.'},
     {name:'interface vlan 20',tag:'Layer 3 · the SVI',tone:'l3',
      rows:[['Lives in','The running-config, saved with <code>copy running-config startup-config</code>'],
            ['Is up when','It has <code>no shutdown</code>, VLAN 20 exists, and an up port or trunk carries VLAN 20 (autostate)']],
      hook:'the switch’s own desk inside the room.'}
   ],{intro:'Same number, two different objects (<a href="#freshman/f7">Freshman compares them</a>). Here is where each one lives on SwA, and when the SVI comes up.',
     note:'<b>Autostate:</b> an SVI reaches up/up only when VLAN 20 exists and at least one port in VLAN 20 (or a trunk that carries it) is up and forwarding. Until then it reads down/down while VLAN 20 is missing from the VLAN database, and up/down while the VLAN exists but every port in it is down, even with <code>no shutdown</code>.',
     caption:'The VLAN lives in vlan.dat and groups ports; the SVI lives in the running-config and gives SwA an address inside VLAN 20.',
     bloom:'Apply'}),
   SCALE('Cisco password storage, from readable to hard to crack',{from:'Readable',to:'Hard to crack',bands:[
       ['enable password','Clear text: anyone who sees the configuration reads it','bad'],
       ['Type 7','What service password-encryption makes of enable and line passwords: a reversible scramble that free tools undo in seconds','amber'],
       ['Type 5','A salted MD5 hash, the classic form of enable secret and username … secret: one-way, but quick to brute-force','l2'],
       ['Type 8 or 9','Slow, salted hashes (PBKDF2 with SHA-256, or scrypt), chosen with the algorithm-type keyword','ok']]},
     {intro:'The word “encryption” in service password-encryption oversells it. What protects a password is the secret keyword, which stores a hash.',
      note:'When <code>enable secret</code> and <code>enable password</code> both exist, enable secret wins. <code>username netadmin secret …</code> stores a hash; <code>username netadmin password …</code> stores clear text or type 7. Example: <code>enable algorithm-type scrypt secret …</code>',
      caption:'Use secret for every password that offers it, and treat service password-encryption as a screen against glances over your shoulder.'}),
   C('Baseline router configuration','Apply',
     CMDS('RtrA: the same secure baseline, then the link to SwA',[
       ['hostname RtrA','Repeat hostname, ip domain-name school.lan, crypto key generate rsa modulus 2048, ip ssh version 2, the username, and the VTY lines on RtrA, with its own secrets. The router needs SSH too.'],
       ['line console 0','Then: password, login, and exec-timeout 5 0: idle console sessions log out after 5 minutes.'],
       ['line vty 0 4','Then: login local, transport input ssh, and exec-timeout 5 0. Configure every VTY range that show running-config lists (some images also list line vty 5 15): once lines 0 to 4 are busy, the next session lands on line 5, so an unsecured range is an open door.'],
       ['interface g0/0','The link to SwA G0/1. Then: description Trunk to SwA G0/1 and no shutdown. Router interfaces start administratively down.'],
       ['show ip interface brief','Interface status and addresses. up/up is the goal.'],
       ['show running-config','What is configured now. show startup-config is what is saved.'],
       ['show ip ssh','"SSH Enabled - version 2.0" on the router as well.'],
       ['copy running-config startup-config','Save the router too.']
     ]),
     TIPS('<b>Services on the device itself.</b> Use the remove, harden, or keep test from <a href="#sophomore/s4">Services and ports</a>. The web UI (<code>ip http server</code> and <code>ip http secure-server</code>) goes off when the brief leaves it out. CDP announces the model, IOS version, and addresses to neighbors, so <code>no cdp run</code> silences it wherever the brief leaves it out. SNMP v1 and v2c use a community string as a shared password: RO reads, RW can change the configuration, and <code>public</code> is the first guess, so remove it; SNMPv3 adds authentication and encryption.'),
     NOTE('Junior adds the subinterfaces <code>g0/0.10</code>, <code>.20</code>, and <code>.30</code> that make RtrA the gateway for each VLAN (10.1.10.1, 10.1.20.1, and 10.1.30.1).'),
     DETAIL('Device services: logging, time, and SNMP',TIPS('<code>service timestamps log datetime msec</code> stamps each log line with the date and time.','<code>logging host 10.1.20.50</code> sends a copy of every log line to a central syslog server, and <code>logging buffered</code> keeps one in RAM.','<code>ntp server 10.1.20.50</code> syncs the clock; <code>show clock</code>, <code>show ntp associations</code>, and <code>show logging</code> confirm all three.','SNMP v1 and v2c: <code>no snmp-server community public</code> removes the default; an RO community reads and an RW community writes.','SNMPv3: <code>snmp-server group ADMINS v3 priv</code>, then <code>snmp-server user netmon ADMINS v3 auth sha PASS priv aes 128 PASS</code>.'))),
    PATH('Site A, worked addresses: Teachers PC, SwA, and RtrA',[
     {name:'Teachers PC',tag:'10.1.20.30/24',tone:'l1',note:['Gateway: 10.1.20.1','Sends traffic for other networks to its gateway'],via:'Frame to the router’s MAC'},
     {name:'SwA',tag:'Layer 2 switch',tone:'l2',note:['Forwards frames by MAC address','Management IP 10.1.20.2 on interface vlan 20','Gateway 10.1.20.1, so admins on other networks reach it'],via:'Same frame, out the uplink to RtrA'},
     {name:'RtrA',tag:'Layer 3 router',tone:'l3',note:['10.1.20.1, the gateway for Teachers (Junior builds it on g0/0.20)','Each interface sits in its own network','Routes packets by destination IP to other networks']}
   ],{intro:'Both devices take an IP address, for different reasons. The switch’s address is a handle for managing it; the router’s addresses are the gateways that traffic flows through.',
     note:'Why management sits on Teachers: <a href="#junior/j4">the access-class note in Junior</a>.',
     caption:'The Teachers PC (.30) and the switch (.2) both use the router (.1) as their gateway. Frames cross the switch; packets cross the router. Check them with show mac address-table on SwA and show ip route on RtrA.'}),
   PATH('running-config and startup-config: where a change lives',[
     {name:'You type a command',tag:'(config)#',tone:'muted',note:'It takes effect at once',via:'Changes'},
     {name:'running-config',tag:'RAM',tone:'l2',note:['The configuration in effect now','<code>show running-config</code>','Cleared by a reload or power loss'],via:'Save'},
     {name:'startup-config',tag:'NVRAM',tone:'ok',note:['The saved configuration','<code>show startup-config</code>','Survives a reload'],via:'Loads at boot'},
     {name:'running-config after a reload',tag:'RAM',tone:'l2',note:'Matches the last save, exactly'}
   ],{intro:'Every command changes the device the moment you press Enter, and the change stays in RAM until you save it.',
     note:'Save with <code>copy running-config startup-config</code>: the copy command reads source first, destination second. The reverse order merges the saved file into what is running, so check the order before you press Enter. <code>write memory</code> is the older way to save.',
     caption:'Save after each block of changes. A reload before saving discards everything since the last save.'}),
   ORDER('s5o','Build SwA in a working order','Tap the twelve jobs in the order of the SwA worked example above. Each reason says what that step makes possible.',[
     ['Set the hostname and the domain name','The prompt then names the device you are on, and SSH key generation needs both names.'],
     ['Create VLANs 10, 20, 30, 99, and 999 with names','Ports and the SVI need their VLANs to exist first.'],
     ['Make the user ports access ports with PortFast and BPDU guard','Each port joins one VLAN; PortFast and BPDU guard belong on these edge ports.'],
     ['Park the unused ports in VLAN 999 and shut them down','A spare jack then leads nowhere until an admin enables it.'],
     ['Give the VLAN 20 SVI its address, then set the default gateway','The switch gets a management address, and replies reach admins on other subnets.'],
     ['Shut the VLAN 1 SVI','Management lives on VLAN 20, so VLAN 1 keeps its default role only.'],
     ['Set the enable secret','A hashed password now guards privileged mode.'],
     ['Require a password on the console','Physical access now needs a password, and idle sessions time out.'],
     ['Add the local user, then generate the 2048-bit RSA key, then turn on SSH version 2','login local needs the user, and SSH needs the key.'],
     ['Set the VTY lines to login local and SSH only','Remote logins now use the local user over an encrypted session.'],
     ['Add the MOTD and login banners','The legal notice appears before anyone signs in.'],
     ['Save with copy running-config startup-config','Everything above survives a reload.']
   ]),
   MATCH('s5m','Command and what it proves','Tap a show command, then what it proves about SwA.',[
     ['show vlan brief','VLAN names and their access ports','It lists STUDENTS, TEACHERS, PRINCIPALS, NATIVE, and PARKING with the ports in each.'],
     ['show ip interface brief','The SVI is up/up','Vlan20 with 10.1.20.2 should read up/up; Vlan1 should read administratively down.'],
     ['show ip ssh','SSH version 2 is on','The first line reads “SSH Enabled - version 2.0”.'],
     ['show running-config | section line vty','The VTY lines use login local and SSH only','Every VTY range shows login local and transport input ssh.'],
     ['show interfaces switchport','Each port’s access or trunk role','Administrative Mode reads static access on the user ports; the uplink G0/1 still reads dynamic auto until Junior makes it a trunk.']
   ]),
   LAB('s5lab','Configure SwA in Packet Tracer or IOS CLI Lab','Place a 2960 switch named SwA in Packet Tracer and cable a Teachers PC to Fa0/9, or open the <a href="'+RES['t4t-ios'][1]+'" target="_blank" rel="noopener noreferrer">IOS CLI Lab</a>, choose Free play, and move PC2 to Fa0/9 (its missions grade the names R1 and S1). Every step shows its commands; semicolons separate the lines you type. Tick each step once it works.',[
     ['Enter privileged EXEC, then global configuration.','enable; configure terminal'],
     ['Name the switch and its domain.','hostname SwA; ip domain-name school.lan'],
     ['Create and name the five VLANs.','vlan 10; name STUDENTS; vlan 20; name TEACHERS; vlan 30; name PRINCIPALS; vlan 99; name NATIVE; vlan 999; name PARKING'],
     ['Students ports: access VLAN 10, PortFast, and BPDU guard.','interface range f0/1 - 8; switchport mode access; switchport access vlan 10; spanning-tree portfast; spanning-tree bpduguard enable'],
     ['Teachers ports: access VLAN 20, PortFast, and BPDU guard.','interface range f0/9 - 16; switchport mode access; switchport access vlan 20; spanning-tree portfast; spanning-tree bpduguard enable'],
     ['Principals ports: access VLAN 30, PortFast, and BPDU guard.','interface range f0/17 - 20; switchport mode access; switchport access vlan 30; spanning-tree portfast; spanning-tree bpduguard enable'],
     ['Park and shut the unused ports.','interface range f0/21 - 24, g0/2; switchport mode access; switchport access vlan 999; shutdown'],
     ['Give the switch its management address and gateway.','interface vlan 20; ip address 10.1.20.2 255.255.255.0; no shutdown; exit; ip default-gateway 10.1.20.1'],
     ['Shut the VLAN 1 SVI.','interface vlan 1; shutdown; exit'],
     ['Set a password length floor, then protect privileged mode and the console.','security passwords min-length 10; enable secret En@ble-A1-26; line console 0; password C0nsole-A1; login; exec-timeout 5 0; exit; service password-encryption'],
     ['Add the local user, the RSA key, and SSH version 2.','username netadmin secret Adm1n-A1-26; crypto key generate rsa modulus 2048; ip ssh version 2'],
     ['Set the VTY lines to login local and SSH only.','line vty 0 15; login local; transport input ssh; exec-timeout 5 0; exit'],
     ['Add both banners.','banner motd #Authorized access only#; banner login #Authorized staff only. Activity is logged.#'],
     ['Save, then verify the VLANs and SSH.','end; copy running-config startup-config; show vlan brief; show ip ssh'],
     ['Give the Teachers PC 10.1.20.30/24 with gateway 10.1.20.1. Ping 10.1.20.2 from it, then SSH in as netadmin.','ping 10.1.20.2; ssh -l netadmin 10.1.20.2','In Packet Tracer, click the PC: Desktop &gt; IP Configuration sets the address, mask, and gateway, and Desktop &gt; Command Prompt runs ping and ssh.'],
     ['Back on SwA’s console, add login blocking, then save again.','configure terminal; login block-for 120 attempts 3 within 60; end; copy running-config startup-config']
   ]),
   QUIZ('s5q','Check: IOS',[
     ['You configured 10.1.20.2 on interface vlan 20, VLAN 20 exists with a PC plugged in, and pings to SwA still fail. Most likely missing?',['enable secret','no shutdown on the interface','service password-encryption','a banner'],1,'The SVI is still administratively down. no shutdown brings it up; show ip interface brief then shows Vlan20 up/up.'],
     ['Which command makes the vty lines use the local username database?',['login','login local','password cisco','transport input ssh'],1,'login alone uses the line password; login local uses username/secret entries.'],
     ['The switch reloaded and your configuration is gone. What was missed?',['enable secret','copy running-config startup-config','show vlan brief','exec-timeout'],1,'The running-config lives in RAM. Save it to NVRAM (the startup-config) so it survives a reload.'],
     ['Why enable secret rather than enable password?',['It is shorter','enable secret stores a hash; enable password is clear text or weakly reversible','They are the same','enable password is newer'],1,'Config Audit will show you this one in the wild: an enable password line is a finding.']
   ]),
   QUIZ('s5q2','Check: addresses, ports, and status',[
     ['A Teachers PC at 10.1.20.30/24 has its gateway set to 10.1.10.1. Why does traffic to other networks fail?',['10.1.10.1 is a broadcast address','The gateway sits outside the PC’s subnet, and a host reaches its gateway only over the local link','Gateways must end in .254','The PC needs a /30 mask'],1,'A host reaches its gateway directly, so the gateway sits inside the host’s own subnet: 10.1.20.1 here.'],
     ['How many usable host addresses does a /30 give?',['4','30','2','254'],2,'A /30 holds four addresses: the network, two hosts, and the broadcast. That fits a link with one router at each end.'],
     ['What is the broadcast address of 10.1.20.64/26?',['10.1.20.255','10.1.20.64','10.1.20.128','10.1.20.127'],3,'The block size is 64, so this subnet runs from .64 to .127, and the last address is the broadcast.'],
     ['Fa0/9 uses port security with maximum 1, sticky learning, and violation shutdown. A visitor unplugs the Teachers PC and plugs in a laptop. What happens, and how does the port come back?',['The port err-disables; remove the laptop, then enter shutdown and no shutdown on the interface','The laptop joins VLAN 20 as usual','The switch learns the laptop and forgets the PC','The port stays up and drops the laptop’s frames quietly'],0,'Sticky learned the PC’s MAC, so a second MAC is a violation, and shutdown mode err-disables the port. Remove the cause, then cycle the port.'],
     ['show ip interface brief shows Fa0/9 as down/down. Where do you look first?',['The enable secret','Layer 1: the cable and the device at the far end','The VTY lines','The routing table'],1,'down/down on a physical port means it senses a dead link; administratively down would point at a shutdown command instead.']
   ]),
   LINKS('Go further',['t4t-ios','t4t-audit','t4t-ld-ios','t4t-lr-ios','netacad','pt'])
  ]},
 {id:'s6',title:'Investigation questions and the change log',bloom:'Apply',sum:'How to answer exactly, the commands that find things, and the one habit that makes every teammate better.',
  blocks:[
   C('Answering an investigation question','Understand',
     TIPS('Read the whole question twice, and answer it before you change anything (<a href="#freshman/f1">Evidence first</a>). Note the <b>exact format</b> requested: hash algorithm, full path or just a name, user name or UID, and date format.',
          'Write the answer where the question file asks (often an <code>ANSWER:</code> line), exactly as asked, and leave the rest of that file untouched.',
          'Typical asks: find a file by name or content, hash a file, identify the user who owns or created something, find a process or listening port, decode text, or read a log entry.',
          'If it feels like a trick, it is usually a format trick (MD5 vs SHA-256, with or without the extension).',
          '<b>Timelines need clocks.</b> Evidence from several devices lines up only when every log carries a timestamp from a shared clock (NTP) and a copy lives on a central log server (syslog), out of an intruder’s reach.'),
     CMDS('Finding and fingerprinting',[
       ['Get-ChildItem -Path C:\\ -Recurse -Filter "secret*" -ErrorAction SilentlyContinue','Windows: find by name. Add -Force to include hidden.'],
       ['Get-FileHash -Algorithm SHA256 C:\\Users\\alice\\Desktop\\secret.txt','Windows hash. -Algorithm MD5 for MD5.'],
       ['Select-String -Path C:\\Users\\*\\*.txt -Pattern "flag"','Windows: search inside text files.'],
       ['Get-WinEvent -FilterHashtable @{LogName=\'Security\'; Id=4720}','Windows: user-created events, searched across the whole Security log. 4624 logon, 4625 failed logon, and 4732 added to a local group.'],
       ['sudo find / -iname "secret*" 2>/dev/null','Linux: find by name.'],
       ['sudo grep -rin "flag" /home /var/log 2>/dev/null','Linux: find by content, recursive, case-insensitive, and with line numbers.'],
       ['sha256sum file.txt','Linux hash. md5sum file.txt for MD5.'],
       ['stat file.txt','Owner, permissions, and timestamps.'],
       ['echo "ZmxhZw==" | base64 -d','Decode base64 text.'],
       ['last -n 20','Recent logins. lastlog for the last login of each user. Debian 13 dropped both: use lslogins, or install wtmpdb and lastlog2.']
     ]),
     DETAIL('Windows event IDs and audit categories',TIPS('<b>Security log:</b> 4624 sign-in, 4625 failed sign-in, 4634 sign-out, 4672 special privileges at sign-in (it also fires for SYSTEM and services), 4688 process created, 4698 scheduled task created, 4719 audit policy changed, 4720 user created, 4722 user enabled, 4724 password reset, 4725 user disabled, 4726 user deleted, 4728 added to a global group, 4732 added to a local group, 4740 account locked out, 4756 added to a universal group, and 1102 Security log cleared.','<b>System log:</b> 7045 new service installed; search it with LogName=\'System\'.','<b>auditpol categories:</b> "Logon/Logoff", "Account Management", "Account Logon", "Policy Change", "Privilege Use", "Detailed Tracking", "Object Access", "System", and "DS Access"; quote names that hold spaces or slashes.'))),
    COMPARE('Hash, encoding, and encryption: can it be reversed?',[
     {name:'Hash',tag:'One-way',tone:'l2',
      svg:{label:'Any file goes into SHA-256 and comes out as 64 hex characters. The arrow runs one way.',
       body:'<rect x="4" y="22" width="44" height="28" rx="4" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="26" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">any file</text><path d="M50 36 H70" stroke="var(--l2)" stroke-width="2" fill="none" marker-end="url(#arrow-l2)"/><rect x="74" y="22" width="52" height="28" rx="14" fill="var(--tint2)" stroke="var(--l2)" stroke-width="2"/><text x="100" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">SHA-256</text><path d="M128 36 H146" stroke="var(--l2)" stroke-width="2" fill="none" marker-end="url(#arrow-l2)"/><rect x="150" y="22" width="46" height="28" rx="4" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="173" y="34" text-anchor="middle" font-size="8" fill="var(--ink)">64 hex</text><text x="173" y="44" text-anchor="middle" font-size="8" fill="var(--ink)">characters</text><text x="100" y="66" text-anchor="middle" font-size="9" fill="var(--ink-2)">one way</text>'},
      rows:[['Does','Turns any input into a fixed-length fingerprint'],['Reverse it','Out of reach by design: you can only hash guesses and compare'],['Key','None'],['Sizes','MD5: 32 hex characters (128 bits). SHA-256: 64 hex characters (256 bits)'],['Use it for','Integrity checks (<code>Get-FileHash</code>, <code>sha256sum</code>) where SHA-256 is the choice and MD5 is broken for collisions. Password storage uses slow, salted hashes built for it, such as yescrypt, bcrypt, or PBKDF2']],
      hook:'a fingerprint: it identifies the file and stays one-way.'},
     {name:'Encoding',tag:'Reversible by anyone',tone:'amber',
      svg:{label:'The word flag encodes to ZmxhZw== in base64, and anyone decodes it back.',
       body:'<rect x="4" y="22" width="44" height="28" rx="4" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="2"/><text x="26" y="40" text-anchor="middle" font-size="10" fill="var(--ink)">flag</text><rect x="134" y="22" width="62" height="28" rx="4" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="2"/><text x="165" y="40" text-anchor="middle" font-size="10" fill="var(--ink)">ZmxhZw==</text><path d="M52 29 H128" stroke="var(--ink-2)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M130 43 H54" stroke="var(--ink-2)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="91" y="18" text-anchor="middle" font-size="9" fill="var(--ink-2)">base64</text><text x="91" y="64" text-anchor="middle" font-size="9" fill="var(--ink-2)">base64 -d: anyone decodes</text>'},
      rows:[['Does','Rewrites data in another alphabet so it travels safely as text'],['Reverse it','Anyone can: <code>base64 -d</code> turns ZmxhZw== back into flag'],['Key','None'],['Spot it','base64 uses A–Z, a–z, 0–9, +, and /, often ending in = or =='],['Also here','Cisco type 7 (service password-encryption): its fixed key is public, so free tools reverse it']],
      hook:'a translation: anyone with the dictionary reads it.'},
     {name:'Encryption',tag:'Reversible with a key',tone:'l3',
      svg:{label:'The word flag is encrypted with a key into scrambled text, and the same key decrypts it.',
       body:'<rect x="4" y="22" width="44" height="28" rx="4" fill="var(--paper)" stroke="var(--l3)" stroke-width="2"/><text x="26" y="40" text-anchor="middle" font-size="10" fill="var(--ink)">flag</text><rect x="134" y="22" width="62" height="28" rx="4" fill="var(--paper)" stroke="var(--l3)" stroke-width="2"/><text x="165" y="40" text-anchor="middle" font-size="10" fill="var(--ink)">9f#Qx2…</text><path d="M52 29 H128" stroke="var(--l3)" stroke-width="2" fill="none" marker-end="url(#arrow-l3)"/><path d="M130 43 H54" stroke="var(--l3)" stroke-width="2" fill="none" marker-end="url(#arrow-l3)"/><circle cx="80" cy="12" r="5" fill="none" stroke="var(--l3)" stroke-width="2"/><path d="M85 12 H100 M96 12 V17 M100 12 V17" stroke="var(--l3)" stroke-width="2" fill="none"/><text x="104" y="15" font-size="9" fill="var(--ink-2)">key</text><text x="91" y="64" text-anchor="middle" font-size="9" fill="var(--ink-2)">decrypt with the key</text>'},
      rows:[['Does','Scrambles data so only key holders can read it'],['Reverse it','With the right key'],['Key','Required: one shared key (such as AES) or a key pair (such as RSA)'],['Gives','Confidentiality: TLS for data in transit, BitLocker or LUKS for disks']],
      hook:'a locked box: the key opens it.'}
   ],{intro:'Investigation questions mix these three up on purpose. Ask two things: can it be reversed, and does reversing it need a key?',
     note:'Same file, different algorithm, different answer: the MD5 and the SHA-256 of one file share nothing. Answer with exactly the algorithm the question names.',
     caption:'Hash to check, encode to carry, encrypt to keep secret.'}),
   DETAIL('Investigation one-liners and hash commands',TIPS('<b>Who owns it:</b> find / -xdev \\( -nouser -o -nogroup \\) 2&gt;/dev/null.','<b>Hidden files:</b> find /home /root /tmp /var/tmp /dev/shm -name ".*" -type f.','<b>What is it:</b> file NAME; strings NAME | head.','<b>When did it change:</b> stat NAME; find / -xdev -newermt DATE.','<b>Who ran what:</b> journalctl _COMM=sudo; grep -E "useradd|userdel|usermod|passwd" /var/log/auth.log*; last, lastb, who, and w (Debian 13: lslogins, wtmpdb, and lastlog2).','<b>Hash lengths</b> in hex characters: MD5 32, SHA-1 40, and SHA-256 64.','<b>Hash commands:</b> Windows, Get-FileHash -Algorithm SHA256 FILE or certutil -hashfile FILE SHA256; Linux, sha256sum and md5sum; FreeBSD, sha256 and md5 (-q prints the hash alone; recent releases also accept the GNU names). Get-FileHash prints uppercase hex and the Linux tools lowercase, and the labs accept either case.')),
   C('The change log','Apply',
     P('A change log is a text file (on the host, or on paper) with one line per change: <b>time, machine, what you changed, and how to undo it</b>. It turns a broken service into a two-minute fix, and it becomes the raw material for your checklist afterward.'),
     TERM('14:07  WIN   Disabled Guest (Disable-LocalUser -Name Guest)   undo: Enable-LocalUser -Name Guest\n14:09  WIN   Removed dave from Administrators                   undo: Add-LocalGroupMember -Group Administrators -Member dave\n14:15  MINT  ufw enable, default deny incoming                  undo: sudo ufw disable\n14:22  MINT  purged vsftpd                                      undo: sudo apt install vsftpd\n14:24  MINT  AVAILABILITY CHECK FAILED -> reinstalled vsftpd; brief says customers use FTP. Harden instead.'),
     TIPS('Log before you press Enter. The habit is the point.','One scribe per machine; the driver says the change out loud.','Keep the undo column honest. "Reinstall" counts as an undo only if the config survived.')),
   SPOT('s6sp','Spot the problems: a change log and the baseline it broke','The brief says customers use the web server on port 80 and FTP on port 21. Tap every log line with an empty or dishonest undo, and every after-baseline line that shows a broken requirement, then Check.',[
     ['14:02  WIN   Disabled Guest                    undo: Enable-LocalUser -Name Guest',null],
     ['14:05  WIN   Removed dave from Administrators  undo: (blank)','An empty undo turns a mistake into guesswork. Write: Add-LocalGroupMember -Group Administrators -Member dave.'],
     ['14:11  MINT  purged vsftpd                     undo: sudo apt install vsftpd','Reinstalling counts as an undo only when the config survived, and purge deletes it. The brief requires FTP, so harden it instead.'],
     ['14:15  MINT  ufw enable, default deny incoming undo: sudo ufw disable',null],
     ['Before:  tcp LISTEN 0.0.0.0:21  vsftpd',null],
     ['Before:  tcp LISTEN 0.0.0.0:80  apache2',null],
     ['After:   tcp LISTEN 0.0.0.0:80  apache2',null],
     ['After:   port 21 absent','The after-baseline shows FTP gone, a required service. The 14:11 line explains why: reinstall, restore the config, and harden it.'],
     ['After:   ufw  80/tcp ALLOW IN',null],
     ['After:   ufw  21/tcp absent from the rules','Default deny now blocks FTP even once vsftpd returns. Add sudo ufw allow 21/tcp.']
   ]),
   DETAIL('Answer formats that trip people up',TIPS('A full path starts at the root: /home/jace/.hidden_tools or C:\\Users\\Public\\x.txt.','A name includes the extension only when the question shows one.','A user name and a full name are different answers, and a UID is a number.','A port is the number alone: 4444.','schtasks prints a task name with its folder in front; the name is the part after the last backslash.','A date follows the format the question shows, and a hash uses the named algorithm alone.')),
   QUIZ('s6q','Check: investigation and logging',[
     ['Question: "What is the MD5 hash of /home/bob/notes.txt?" You answer with sha256sum output. Is that correct?',['Yes, hashes are hashes','No: the question asked for MD5','Only if the file is small','Yes, if you also include the path'],1,'Use the algorithm asked: md5sum /home/bob/notes.txt'],
     ['Which Windows Security event ID means a user account was created?',['4624','4625','4720','4732'],2,'4720 created, 4726 deleted, 4732 added to a local group, 4624 logon, and 4625 failed logon.'],
     ['The fastest way to find which change broke a required service is',['Re-read the brief','Your change log, newest entry first','Reboot the machine','Reinstall the operating system'],1,'Newest change first, then undo it and confirm the service is back.'],
     ['Decode: ZmxhZw== (base64)',['flag','frog','file','fail'],0,'echo "ZmxhZw==" | base64 -d prints flag. Investigations often meet base64 in scripts, logs, and config files.']
   ]),
   REFLECT('s6r','Evidence before cleanup','List the fixes you plan for the first twenty minutes on a lab. Which of them would erase an answer you still need, such as a file’s hash, its path, or its owner? Reorder the list so evidence comes first, and write one line on how you will notice the next time a fix threatens evidence.'),
   LINKS('Go further',['ms-sysint','explainshell','pico','t4t-range'])
  ]}
 ]
});

LEVELS.push({
 id:'junior', grade:'Junior', range:'Intermediate to advanced', color:'var(--l3)', chev:3,
 blooms:['A','An','E'], bloomCap:'Apply, analyze, and evaluate. You judge trade-offs and defend your choices.',
 intro:'Servers and networks. Windows Server with Active Directory and Group Policy, Debian, and Cisco networks with VLANs, inter-VLAN routing, and access control lists. You move from following checklists to reasoning about why one fix beats another.',
 mentor:['Shift from "what" to "why". After each fix ask: which hardening area, which principle, and what would break if you did the opposite?','Server topics take the longest. Give Active Directory and Group Policy their own sessions.','Have the learner who owns networking teach VLANs and ACLs back to the group. Teaching is the Analyze level in disguise.','Introduce the Config Audit drill here; evaluating someone else’s config is exactly this grade’s Bloom band.'],
 units:[
 {id:'j0',title:'Ready for Junior?',bloom:'Review',sum:'Twelve questions on what Freshman and Sophomore taught. Advisory: every unit stays open, and each miss links to the unit that teaches it.',
  blocks:[
   C('How this check works','Understand',
     P('Answer all twelve, then read the reason under each one. Each reason ends with a link to the unit that teaches it, so a miss tells you exactly what to review. The check counts toward your progress like any quiz, and every unit stays open whatever your score.')),
   QUIZ('j0q','Ready for Junior?',[
     ['interface vlan 20 reads down/down even after no shutdown. What do you check first?',['The console exec-timeout','Whether VLAN 20 exists and has an up port','The MOTD banner','The enable secret'],1,'Autostate keeps an SVI down until its VLAN exists and a port or trunk carrying it is up. <a href="#sophomore/s5">Review: Cisco: configure a switch and a router</a>'],
     ['Admins on 10.1.20.0/24 reach the switch at 10.1.20.2, and admins on other subnets get no reply. Which line is missing?',['ip domain-name school.lan','service password-encryption','banner motd #Authorized access only#','ip default-gateway 10.1.20.1'],3,'A layer 2 switch answers other subnets only through its ip default-gateway. <a href="#sophomore/s5">Review: Cisco: configure a switch and a router</a>'],
     ['On RtrA, show running-config | section line vty lists transport input ssh under line vty 0 4 and transport input telnet ssh under line vty 5 15. Five admins hold SSH sessions, and a teacher Telnets to RtrA. What happens?',['RtrA refuses the connection: lines 0 to 4 admit SSH alone','A login prompt appears: the session lands on line 5, which still admits Telnet','The session upgrades to SSH','RtrA holds the session until an SSH line frees up'],1,'Once lines 0 to 4 are busy, the next session lands on line 5, and that range still admits Telnet, which sends the password in clear text. Configure every VTY range that show running-config lists. <a href="#sophomore/s5">Review: Cisco: configure a switch and a router</a>'],
     ['net accounts shows Minimum password age 0 and history 24. Why does the age line matter?',['Age 0 locks every account','It matters only on a domain controller','With age 0 a user can change a password 24 times in minutes and reuse the old one','Age 0 turns complexity off'],2,'Minimum age makes history work: a one-day wait between changes stops users cycling through history to reuse a favorite. <a href="#sophomore/s2">Review: Windows 11 hardening</a>'],
     ['A user opens a network share that grants Change, on a folder whose NTFS entry grants Read. What can the user do over the network?',['Full control: the two add up','Read only: the more restrictive of the share and NTFS permissions applies','Nothing: the two conflict','Change: the share permission wins'],1,'Over the network Windows applies both layers, and the stricter result wins. <a href="#sophomore/s2">Review: Windows 11 hardening</a>'],
     ['The brief requires Remote Desktop, and RDP runs without Network Level Authentication. Your call?',['Keep it as it is','Remove it: RDP is insecure by design','Block port 3389 for everyone','Harden it: keep RDP and require NLA, since the weakness lives in its configuration'],3,'A required service stays, and a weak setting on it gets fixed; removing it breaks the business. <a href="#sophomore/s4">Review: Services and ports</a>'],
     ['You run sudo usermod -G sudo alice, leaving out -a. What happens?',['alice joins sudo and keeps every other group','alice leaves the sudo group','alice’s other supplementary groups are replaced by sudo alone','Nothing changes until alice signs out'],2,'-a appends; -G alone replaces every supplementary group the user had. <a href="#sophomore/s3">Review: Linux Mint and Ubuntu hardening</a>'],
     ['Which sudoers line is a silent root backdoor for an unlisted user?',['mallory ALL=(ALL) NOPASSWD: ALL in a file under /etc/sudoers.d/','root ALL=(ALL:ALL) ALL','%sudo ALL=(ALL:ALL) ALL','Defaults env_reset'],0,'NOPASSWD skips the password prompt, and a drop-in under sudoers.d adds rules quietly; read every file there with visudo. <a href="#sophomore/s3">Review: Linux Mint and Ubuntu hardening</a>'],
     ['ss -tulnp shows mysqld on 0.0.0.0:3306, and the brief says only the local web app uses the database. What does 0.0.0.0 tell you?',['The firewall has blocked the port','It listens on every interface, so other machines can reach it; binding to 127.0.0.1 keeps it local','The service is stopped','It listens on this machine alone'],1,'0.0.0.0 or [::] means every interface; 127.0.0.1 or [::1] means this machine alone. <a href="#sophomore/s4">Review: Services and ports</a>'],
     ['A config file holds the value cGFzc3dvcmQ=. What is it?',['A random token','A SHA-256 hash, which works one way only','AES encryption, which needs a key','base64 encoding, which anyone can decode'],3,'The A-Z, a-z, 0-9, +, and / alphabet with a trailing = marks base64, and base64 -d reverses it. <a href="#sophomore/s6">Review: Investigation questions and the change log</a>'],
     ['A fix would mean changing a router that the brief says belongs to another team. What do you do?',['Change it now and undo it later','Ask a teammate to make the change','Stop and ask the owner, since the router sits outside your scope','Make the change, since it improves security'],2,'The brief is your scope, and a fix that reaches beyond it waits for the owner’s decision. <a href="#sophomore/s1">Review: Read the scenario brief first</a>'],
     ['Why do well-built web servers run their request workers under an account such as www-data?',['A hijacked worker then gets only that account’s limited rights','Only www-data may open network ports','It makes pages load faster','The firewall requires it'],0,'Privileges belong to the process: a small root parent opens the port, and low-privilege workers handle the requests. <a href="#sophomore/s4">Review: Services and ports</a>']
   ])
  ]},
 {id:'j1',title:'Windows Server and Active Directory',bloom:'Apply',sum:'Domain controllers, users and groups in AD, and the few server roles you will actually touch.',
  blocks:[
   C('Server is more than a bigger desktop','Understand',
     TIPS('A <b>domain controller</b> (DC) holds Active Directory, the central database of users, groups, and computers; the comparison below shows where accounts live on each kind of machine.',
          'Admin power comes from several groups, and each reaches a different distance; the tree below maps them. Keep only the members the scenario brief authorizes.',
          'Servers often run real services: DNS, DHCP, IIS (web), and file shares. Harden what the brief keeps; remove roles the brief leaves out.'),
     CMDS('AD from PowerShell',[
       ['Get-ADUser -Filter * -Properties Enabled | Select-Object Name,Enabled','Domain users. (Get-LocalUser is for member servers and desktops.)'],
       ['Get-ADGroupMember "Domain Admins"','Who holds the keys to the domain. Compare to the brief.'],
       ['Remove-ADGroupMember -Identity "Domain Admins" -Members dave','Strip an unauthorized domain admin.'],
       ['Disable-ADAccount -Identity guest','Disable an account you are told is unauthorized but must keep.'],
       ['Set-ADUser -Identity bob -ChangePasswordAtLogon $true','Force a reset for a compromised account.'],
       ['Get-ADDefaultDomainPasswordPolicy','Domain password policy (set in the Default Domain Policy GPO; secpol holds local policy).']
     ])),
    COMPARE('Domain controller, domain member, and stand-alone machine: where accounts live',[
     {name:'Domain controller',tag:'holds AD',tone:'l3',

      rows:[['Account store','The Active Directory database (ntds.dit), replicated to every DC'],
            ['Manage accounts with','<code>dsa.msc</code>, Active Directory Administrative Center, and <code>Get-ADUser</code>'],
            ['Local accounts','Only the Directory Services Restore Mode (DSRM) administrator, kept for recovery'],
            ['Policy from','Domain GPOs, including the Default Domain Controllers Policy']],
      hook:'the head office that keeps the master staff list.'},
     {name:'Domain member',tag:'server or desktop',tone:'l2',
      svg:{label:'A domain member keeps its own local accounts database and also accepts domain accounts from Active Directory on a domain controller.',
       body:'<rect x="8" y="14" width="76" height="44" rx="6" fill="var(--tint2)" stroke="var(--l2)" stroke-width="2"/><text x="46" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">Local SAM</text><text x="46" y="49" text-anchor="middle" font-size="9" fill="var(--ink-2)">this machine</text><path d="M128 18 V52 A22 7 0 0 0 172 52 V18" fill="none" stroke="var(--l3)" stroke-width="1.5" stroke-dasharray="4 3"/><ellipse cx="150" cy="18" rx="22" ry="7" fill="none" stroke="var(--l3)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="150" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">AD</text><text x="150" y="72" text-anchor="middle" font-size="9" fill="var(--ink-2)">on a DC</text><path d="M124 36 H90" fill="none" stroke="var(--l3)" stroke-width="2" marker-end="url(#arrow-l3)"/><text x="46" y="72" text-anchor="middle" font-size="9" fill="var(--ink-2)">plus domain sign-in</text>'},
      rows:[['Account store','Its own local SAM, plus every domain account from AD'],
            ['Manage accounts with','Local: <code>lusrmgr.msc</code>, <code>Get-LocalUser</code>. Domain: the AD tools'],
            ['Local accounts','Yes, alongside domain accounts; audit both'],
            ['Policy from','Local policy first, then domain GPOs, which win a conflict']],
      hook:'a branch office with its own guest book that also honors head-office badges.'},
     {name:'Stand-alone machine',tag:'workgroup',tone:'l1',
      svg:{label:'A stand-alone machine keeps only its own local accounts database.',
       body:'<rect x="56" y="14" width="88" height="44" rx="6" fill="var(--tint1)" stroke="var(--l1)" stroke-width="2"/><text x="100" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">Local SAM</text><text x="100" y="49" text-anchor="middle" font-size="9" fill="var(--ink-2)">the only store</text>'},
      rows:[['Account store','Its own local SAM only'],
            ['Manage accounts with','<code>lusrmgr.msc</code>, <code>Get-LocalUser</code>, and Settings › Accounts'],
            ['Local accounts','Every account is local (a Windows desktop can also sign in with a Microsoft account)'],
            ['Policy from','Local policy only: <code>secpol.msc</code> and <code>gpedit.msc</code>, both on Pro and higher editions']],
      hook:'a house with its own keys.'}
   ],{intro:'The tools you reach for depend on where the account lives. Ask first: is this machine a domain controller, a domain member, or on its own?',
     note:'<b>Read the prefix.</b> <code>EXAMPLE\\alice</code> is a domain account; <code>PC-07\\alice</code> or <code>.\\alice</code> is a local account on that machine. The two are separate accounts with separate passwords, even with the same name.',
     caption:'A domain controller keeps every account in AD, a domain member keeps local accounts and accepts domain ones, and a stand-alone machine keeps local accounts only.'}),
   HIER('Who holds admin power, and how far it reaches',
     {name:'Forest',note:'<b>Enterprise Admins</b> lives in the forest root domain and has full control of every domain in the forest. <b>Schema Admins</b> can change the directory schema.',tone:'l4',children:[
       {name:'Domain: example.com',note:'<b>Domain Admins</b>: full control of this domain, and a member of the local Administrators group on every computer joined to it. The built-in domain <b>Administrators</b> group: full control of the domain controllers and the directory.',tone:'l3',children:[
         {name:'Domain controllers',note:'Governed by the domain groups above; every account here lives in AD.',tone:'l2'},
         {name:'Member server or desktop',note:'The <b>local Administrators</b> group: full control of this one machine. It holds Domain Admins plus any account added on the machine itself.',tone:'l1'}]}]},
     {intro:'Several groups have “admin” in the name, and each one reaches a different distance. An extra member in any of them is an administrator.',
      note:'<b>Audit every level.</b> <code>Get-ADGroupMember "Enterprise Admins"</code>, <code>"Domain Admins"</code>, and <code>"Administrators"</code> on a DC; <code>Get-LocalGroupMember Administrators</code> on each member server and desktop. Run the same check on Account Operators, Server Operators, Backup Operators, Print Operators, and DnsAdmins, which reach admin power by another road. Compare each list with the brief.',
      caption:'Wider reach sits higher: forest, then domain, then one machine. Domain Admins reaches down into every joined computer.',
      key:[['l4','Forest-wide'],['l3','Domain-wide'],['l2','Domain controllers'],['l1','One machine']]}),
   DETAIL('Privileged groups and server feature names',
     TIPS('<b>Admin by design:</b> Enterprise Admins, Domain Admins, Schema Admins, and Administrators. <b>Admin by another road:</b> Account Operators, Server Operators, Backup Operators, Print Operators, and DnsAdmins. Worth auditing too: Group Policy Creator Owners, whose members create GPOs that take effect once someone links them.',
          '<b>Feature names:</b> AD-Domain-Services, DNS, DHCP, Web-Server, Web-Ftp-Server (the FTP Server role service), FS-SMB1, RSAT-AD-Tools, and Windows-Defender.',
          '<b>Which kind of machine:</b> <code>(Get-CimInstance Win32_ComputerSystem).DomainRole</code> returns 0 or 1 for a workstation, 2 or 3 for a server, and 4 or 5 for a domain controller.')),
   COMPARE('Remove from a group, disable, or delete: three different actions',[
     {name:'Remove from a group',tag:'Remove-ADGroupMember',tone:'l2',
      rows:[['Ends','The rights and access that group gives'],
            ['Keeps','The account, its password, its files, and its other groups'],
            ['Sign-in','Still works. The change applies at the next sign-in, when Windows builds a new access token'],
            ['Undo','Add the member back'],
            ['Use it for','An authorized user who holds more privilege than the brief grants']],
      hook:'taking back a key and leaving the badge.'},
     {name:'Disable',tag:'Disable-ADAccount',tone:'amber',
      rows:[['Ends','Every new sign-in'],
            ['Keeps','The SID, the group memberships, and the files'],
            ['Sign-in','Blocked'],
            ['Undo','<code>Enable-ADAccount</code>'],
            ['Use it for','An unauthorized account the brief asks you to keep']],
      hook:'suspending the badge.'},
     {name:'Delete',tag:'Remove-ADUser',tone:'bad',
      rows:[['Ends','The account and its SID'],
            ['Sign-in','Gone, along with the account'],
            ['Afterward','A new account with the same name gets a new SID and starts from scratch'],
            ['Undo','The AD Recycle Bin, when it was turned on before the deletion; otherwise a slower restore from a domain controller backup'],
            ['Use it for','An unauthorized account the brief tells you to remove']],
      hook:'shredding the badge.'}
   ],{intro:'These three actions do different jobs rather than one job at three strengths. Pick the one the brief calls for.',
     note:'<b>Follow the brief.</b> Authorized users stay enabled; remove only their extra privilege. Unauthorized accounts are disabled or deleted, as the brief instructs. On a local machine the matching cmdlets are <code>Remove-LocalGroupMember</code>, <code>Disable-LocalUser</code>, and <code>Remove-LocalUser</code>.',
     caption:'Removing from a group trims privilege, disabling pauses the account, and deleting ends it for good.',
     bloom:'Apply'}),
   C('How Windows checks a password over the network','Understand',
     SEQ('NTLM in four steps',[
       ['Challenge','The server sends a random number.','l1'],
       ['Response','The client answers with a value computed from the challenge and the password hash; the password itself stays home.','l2'],
       ['Check','The server, or a domain controller for a domain account, computes the same value and compares the two.','l3'],
       {ask:'Which response format did the client send?',branches:[['LM or NTLMv1','Old formats that crack quickly: refuse them.'],['NTLMv2','The current format. In a domain, Kerberos (taught in Senior) comes first, and NTLMv2 is the fallback.']]}
     ],{caption:'NTLM proves you know the password hash without sending it, and the format decides how hard a captured answer is to crack.'}),
     TIPS('<b>Refuse the old formats.</b> Security Options &gt; Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM &amp; NTLM. Windows 11 24H2 and Windows Server 2025 remove NTLMv1, so check the level on older releases and in mixed domains.',
          '<b>Relay.</b> An attacker who captures an NTLM exchange can forward it to another server and act as the victim. Requiring <b>SMB signing</b>, plus LDAP signing on a DC, blocks the forwarded sign-in: <code>Get-SmbServerConfiguration | Select-Object RequireSecuritySignature</code> should read True.',
          '<b>Anonymous enumeration.</b> A null session, an anonymous connection, can list accounts and shares; Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled closes it.')),
   C('Server roles and features','Apply',
     CMDS('See and shrink the attack surface',[
       ['Get-WindowsFeature | Where-Object Installed','Every installed role and feature. Keep only the ones the brief justifies.'],
       ['Uninstall-WindowsFeature -Name Web-Ftp-Server','Example: remove the FTP Server role service (Web-Ftp-Server) when the brief omits it.'],
       ['Get-Service | Where-Object {$_.Status -eq "Running"} | Select-Object Name,DisplayName','Running services, same idea as the desktop.'],
       ['Get-SmbShare | Select-Object Name,Path,Description','File shares. Keep ADMIN$, C$, and IPC$, and on a DC keep SYSVOL and NETLOGON, which Group Policy and logon scripts need; remove the shares the scenario leaves unexplained with Remove-SmbShare.'],
       ['Get-DnsServerResourceRecord -ZoneName example.com','If it is a DNS server: look for stray records.']
     ]),
     TIPS('<b>A DNS server you keep.</b> Zone transfers to any host hand out the whole network map, and unsecured dynamic updates let anyone rewrite records, so close transfers and require secure updates. <b>A DHCP server you keep.</b> In a domain, a Windows DHCP server needs authorization in AD before it hands out addresses, so an unauthorized one is a rogue.')),
   C('Web and database servers you keep','Understand',
     TIPS('<b>Keep the site, shrink what it shows.</b> Directory listing goes off, version banners go off, and default pages and sample apps go.',
          '<b>Anonymous read access stays only for a public site;</b> everyone else signs in.',
          '<b>Upload folders hold data only,</b> so nothing in them runs, and the web root (C:\\inetpub\\wwwroot on IIS, /var/www/html on Apache) holds only the site’s own files: a stray script there is a likely webshell.',
          '<b>A database used only by the site</b> listens on 127.0.0.1 and gives the site an account limited to its own database.',
          '<b>On IIS</b> keep World Wide Web Services, and remove the FTP Server role service when the brief leaves FTP out. <a href="#senior/se2">Web application security</a> maps these habits to the OWASP Top 10, and the Apache settings sit in the <a href="#sophomore/s4">Services and ports</a> detail panel.'),
     DETAIL('Default shares, DNS, DHCP, and IIS',
       TIPS('<b>Default shares:</b> ADMIN$, C$ (and the other drive letters), and IPC$; a DC adds SYSVOL and NETLOGON.',
            '<b>DNS:</b> SecureSecondaries set to NoTransfer or TransferToZoneNameServer (TransferAnyServer leaks the zone), and DynamicUpdate set to Secure on AD-integrated zones. _msdcs.DOMAIN is the normal AD locator zone, and forwarders are normal.',
            '<b>DHCP:</b> an AD-joined DHCP server needs authorization in AD; <code>Get-DhcpServerInDC</code> lists the authorized ones.',
            '<b>Normal DC ports:</b> 53, 88, 135, 389, 445, 464, 636, 3268, 3269, and dynamic RPC.',
            '<b>IIS:</b> web root C:\\inetpub\\wwwroot; Anonymous Authentication (IUSR) stays for a public site; Directory Browsing off; Request Filtering can deny web requests for .exe and .ps1 files, and FTP Request Filtering can deny those extensions on upload; FTP SSL Settings require SSL when FTP must stay.'))),
   SPOT('j1sp','Read this server’s output','Brief: the domain admins are Administrator and alice; the server runs DNS and the company web site, with FTP and SMBv1 left out. Tap every line that breaks the brief, then Check.',[
     ['PS> Get-ADGroupMember "Domain Admins" | Select-Object Name',null],
     ['Administrator',null],
     ['alice',null],
     ['svc_print','A service account in Domain Admins is an administrator everywhere in the domain. Remove it from the group and give it only the rights its service needs.'],
     ['PS> Get-ADGroupMember DnsAdmins | Select-Object Name',null],
     ['dave','DnsAdmins can load code into the DNS service, which runs as SYSTEM: admin power by another road, and the brief gives admin power only to Administrator and alice. Remove dave from DnsAdmins.'],
     ['PS> Get-WindowsFeature | Where-Object Installed | Select-Object Name',null],
     ['AD-Domain-Services',null],
     ['DNS',null],
     ['Web-Server',null],
     ['Web-Ftp-Server','The brief leaves FTP out: Uninstall-WindowsFeature -Name Web-Ftp-Server, then confirm the web site still answers.'],
     ['FS-SMB1','SMBv1 is the obsolete, wormable protocol that EternalBlue exploited. Remove it: Uninstall-WindowsFeature -Name FS-SMB1.']
   ]),
   QUIZ('j1q','Check: server and AD',[
     ['On a domain controller, where do you remove a user’s administrative power?',['Local Users and Groups','Active Directory Users and Computers / the right AD group','secpol.msc','Task Manager'],1,'Domain accounts live in AD. Local tools barely apply on a DC.'],
     ['The brief lists Domain Admins as: administrator, alice. You find administrator, alice, eve. Action?',['Delete eve','Remove eve from Domain Admins (delete only if eve is also an unauthorized account)','Leave it','Add everyone to be safe'],1,'Strip the group membership first. Deleting an account the scenario expects elsewhere would break availability for that person.'],
     ['The domain password policy is set in',['secpol.msc on each machine','the Default Domain Policy GPO','each user’s properties','the registry only'],1,'Group Policy at the domain level governs domain accounts; local policy governs only local ones.'],
     ['A server runs the FTP Server role service (Web-Ftp-Server), which is absent from the brief. Best action?',['Keep it','Uninstall the role and confirm the web site (if required) still works','Only firewall it','Rename it'],1,'Remove extra roles to shrink the attack surface, then verify required services survive.']
   ]),
   LINKS('Go further',['ms-winsrv','ms-win-sec','cis','stig','t4t-ld-winsrv','t4t-lr-win'])
  ]},
 {id:'j2',title:'Group Policy',bloom:'Apply',sum:'How GPOs enforce settings across a domain, the high-value ones, and how to confirm they applied.',
  blocks:[
   C('One place to set a thousand machines','Understand',
     TIPS('A <b>Group Policy Object</b> (GPO) is a bundle of settings linked to the domain or an organizational unit. Settings flow down to the computers and users underneath.',
          'The <b>Default Domain Policy</b> carries domain password and lockout policy, and the tree below shows where it links. Edit GPOs in <b>Group Policy Management</b> (<code>gpmc.msc</code>).',
          'Computer settings land at startup and user settings at sign-in; the sequence below shows the refresh timing.',
          'High-value areas: Account Policies, User Rights Assignment, Security Options, Audit Policy, and Administrative Templates for Windows components. <b>User Rights Assignment</b> grants privileges such as Allow log on locally, Access this computer from the network, and Debug programs. A right is a privilege, separate from a file permission, and some rights (Back up files and directories, Take ownership of files or other objects, and Debug programs, which opens any process’s memory, LSASS included) reach past file permissions entirely.'),
     CMDS('Work with and verify GPOs',[
       ['gpmc.msc','Group Policy Management: create, link, and edit GPOs.'],
       ['gpupdate /force','Reapply policy now instead of waiting.'],
       ['gpresult /r','What policy is actually applied to this machine and user.'],
       ['Get-ADDefaultDomainPasswordPolicy','Confirm domain password settings after editing the Default Domain Policy.'],
       ['auditpol /get /category:*','Current audit policy. Enable logon and account-management auditing where the brief or good practice calls for it.']
     ]),
     DETAIL('Security Options and User Rights targets',
       TIPS('<b>Security Options:</b> Accounts: Limit local account use of blank passwords to console logon only = Enabled; Interactive logon: Do not display last user name = Enabled; Interactive logon: Do not require CTRL+ALT+DEL = Disabled (worded in the negative, so Disabled requires it); Interactive logon: Machine inactivity limit = 900 seconds or fewer; Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled; Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM &amp; NTLM; Microsoft network client and server: Digitally sign communications (always) = Enabled; User Account Control: Run all administrators in Admin Approval Mode = Enabled. Registry forms: DontDisplayLastUserName 1 and DisableCAD 0 under HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System.',
            '<b>User Rights Assignment:</b> Allow log on locally: Administrators and Users on a workstation, Administrators on a member server, and Administrators plus ENTERPRISE DOMAIN CONTROLLERS on a DC. Access this computer from the network: Administrators and Authenticated Users on a member server (plus ENTERPRISE DOMAIN CONTROLLERS on a DC); CIS narrows a workstation to Administrators and Remote Desktop Users. Deny log on through Remote Desktop Services: Guests, plus Local account on workstations and member servers. Debug programs: Administrators only. Act as part of the operating system: nobody. <code>whoami /priv</code> lists the current token’s privileges.'))),
    HIER('Where a GPO links: domain and OUs hold the links, groups hold members',
     {name:'Domain: example.com',note:'GPO link: <b>Default Domain Policy</b>, the password and lockout policy for every domain account',tone:'l4',children:[
       {name:'OU: Domain Controllers',note:'GPO link: <b>Default Domain Controllers Policy</b>',tone:'l3',children:[
         {name:'Computer: DC1',tone:'l1'}]},
       {name:'OU: Workstations',note:'GPO link: Workstation Baseline',tone:'l3',children:[
         {name:'Computer: PC-07',note:'Sits in exactly one OU',tone:'l1'}]},
       {name:'OU: Staff',note:'GPO link: Staff Settings',tone:'l3',children:[
         {name:'User: alice',note:'Member of the groups Sales and VPN Users. Joining a group leaves the account in this OU.',tone:'l1'}]},
       {name:'Users (built-in container)',note:'A default container rather than an OU: GPOs link only to sites, domains, and OUs, so its objects get the site and domain GPOs alone. Default groups such as Domain Admins live here.',tone:'muted'}]},
     {intro:'An OU is a folder for users and computers, and policy follows the folder. A group is a membership list that grants rights and permissions.',
      note:'<b>GPOs link to sites, domains, and OUs.</b> Security filtering can narrow a linked GPO to the members of a group; the link itself stays on the site, domain, or OU. Fine-grained password policies are the one password setting that targets users or groups directly.',
      caption:'Each user and computer sits in one OU or container and collects the GPOs linked above it. Group membership grants access and leaves the OU unchanged.',
      key:[['l4','Domain'],['l3','Organizational unit'],['l1','User or computer'],['muted','Default container']]}),
   HIER('Group Policy precedence: the last one applied wins',[
       ['Child OU','The GPO linked closest to the object; applied last','l4'],
       ['Parent OU','Applied before its child OUs','l3'],
       ['Domain','The Default Domain Policy and other domain-linked GPOs','l2'],
       ['Site','GPOs linked to the Active Directory site','l1'],
       ['Local','The machine’s own local policy; applied first','muted']],
     {top:'Wins a conflict, applied last',bottom:'Yields, applied first',
      intro:'Windows applies policy in the order Local, Site, Domain, then OU (LSDOU). The order decides only when two GPOs set the same setting differently.',
      note:'<b>Two switches change the order.</b> <b>Block Inheritance</b> on an OU stops GPOs from the containers above it. An <b>Enforced</b> link overrides Block Inheritance and beats conflicting GPOs linked lower down. Within one container, link order 1 has the highest precedence. <code>gpresult /r</code> lists the GPOs that applied.',
      caption:'The OU closest to the object usually wins, because its GPOs apply last; local policy yields to every domain GPO.'}),
   SEQ('When Group Policy lands: startup, sign-in, and refresh',[

       ['Sign in','<b>User Configuration</b> applies for the person signing in.','l1'],
       ['Background refresh','Both halves refresh about every 90 minutes, plus a random offset of up to 30 minutes (every 5 minutes on domain controllers).','l2'],
       ['<code>gpupdate /force</code>','Reapplies every setting now; software installation and folder redirection wait for the next restart or sign-in.','amber'],
       ['<code>gpresult /r</code>','Reports what applied and which GPOs were filtered out (both commands sit in the table above).','ok']],
     {intro:'A GPO has two halves, and each half lands at its own moment.',
      caption:'Computer settings land at startup, user settings at sign-in, and both refresh in the background. gpupdate requests a refresh; gpresult reports the result.'}),
   ORDER('j2o','Order: enforce a domain password policy','Put the steps in order.',[
     ['Open Group Policy Management (gpmc.msc)','You edit domain policy here; local secpol covers only one machine.'],

     ['Set Account Lockout Policy: threshold, duration, and reset counter','Slows brute force across the domain.'],
     ['Run gpupdate /force on the DC','Apply immediately instead of waiting for the refresh cycle.'],
     ['Verify with Get-ADDefaultDomainPasswordPolicy','Prove the change took effect before moving on.']

   QUIZ('j2q','Check: Group Policy',[
     ['A setting in the Default Domain Policy is missing on a workstation. First command?',['shutdown /r','gpupdate /force then gpresult /r','net accounts','ipconfig /flushdns'],1,'Force the refresh, then confirm what applied. gpresult /r shows which GPOs won.'],

     ['    The following GPOs were not applied because they were filtered out',null],
