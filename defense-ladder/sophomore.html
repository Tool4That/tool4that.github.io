     ['4740','An account was locked out','Windows writes 4740 when too many failures lock an account: a mistyped password or a guessing attack.'],
     ['1102','The Security log was cleared','Windows writes 1102 whenever the Security log is cleared, a common way to cover tracks; forwarded copies still hold the earlier events.'],
     ['7045','A service was installed (System log)','7045 lives in the System log and records a new service, a common way for malware to start at every boot.']
   ],'Remember'),
   SPOT('s10sp','Spot the spray: failed sign-ins on KAIMANA-FD1','A spray tries one password against many accounts. Event 4625 rows, oldest first: time (HST), account, SubStatus, and source address. Tap every line where the outside address tried a password against a <b>real</b> account, then Check.',[
     ['08:02:11 keola 0xC000006A 127.0.0.1',null,'keola is a real account, and this try came from 127.0.0.1, the PC itself, an hour before the spray: a mistyped password at the front desk.'],
     ['09:14:03 keola 0xC000006A 203.0.113.50','A real account (wrong password) from the outside address: part of the spray. The admin, user, and test lines show 0xC0000064: those names are absent here, so the guess missed every real account.'],
     ['09:14:04 admin 0xC0000064 203.0.113.50',null,'This try came from the spray address, and 0xC0000064 means the name admin is unknown on this PC, so the guess reached no real account.'],
     ['09:14:05 pua   0xC000006A 203.0.113.50','pua exists, and one try from the same address a second later fits the spray.'],
     ['09:14:06 user  0xC0000064 203.0.113.50',null],
     ['09:14:07 mele  0xC000006A 203.0.113.50','Real account, one guess, same address: the spray found mele.'],
     ['09:14:08 test  0xC0000064 203.0.113.50',null],
     ['09:14:09 keahi 0xC000006A 203.0.113.50','Real account hit by the same one-try-each pattern.'],
     ['09:14:10 nohea 0xC000006A 203.0.113.50','Another real account from the spray address. Check each of these accounts for a 4624 next.'],
     ['09:31:40 malia 0xC000006A 10.0.5.31',null,'malia’s try came from an inside address, 17 minutes after the spray ended: a staff typo, apart from the spray.']
   ]),
   ORDER('s10o','Build the pipeline','Put the stages in order to rank the addresses with the most failed SSH passwords.',[
     ['grep \'Failed password\' /var/log/auth.log','First: this grep reads the log file itself, and every later stage works on the failed lines it passes along.'],
     ['grep -oE \'from [0-9.]+\'','Second: it needs the failed lines from the first grep, and it trims each one to “from” and the address, so awk gets a clean two-word line.'],
     ['awk \'{print $2}\'','Third: the trim before it leaves exactly two words, so the second word is the address alone.'],
     ['sort','Before uniq -c: uniq counts only matching lines that sit together, so sort lines up identical addresses first.'],
     ['uniq -c','Just after sort: with identical addresses side by side, it collapses each run into one line with its count.'],
     ['sort -rn','After uniq -c: the counts exist only from that stage on, so this sort can now rank them, largest first.'],
     ['head -5','Last: cutting to five makes sense once the list is ranked, so the five lines left are the busiest addresses.']
   ],'Apply'),
   QUIZ('s10q','Check: read the logs',[
     ['Event Viewer on KAIMANA-FD1 (set to Hawaiʻi time) shows a failed sign-in at 9:14:03 AM on 20 October 2026. When was that in UTC?',['23:14:03 on 19 October','19:14:03 on 20 October','20:14:03 on 20 October','09:14:03 on 20 October'],1,'Hawaiʻi is UTC−10 all year, without daylight saving time: add 10 hours for UTC.',{whys:['This subtracts 10 hours, the wrong way: add 10 for UTC.','Add 10 hours: 9:14 AM HST is 19:14 UTC.','This assumes daylight saving time, which Hawaiʻi skips.','This is the local time, still unconverted.'],imp:'core',c:'det-windows-events'}],
     ['A 4624 on KAIMANA-FD1 shows Account Name svc_backup, Logon Type 10, Source Network Address 203.0.113.50. What happened?',['Someone unlocked the screen at the keyboard','A Remote Desktop sign-in by a service account from an outside address: look closer','A scheduled batch job started','A cached sign-in while offline'],1,'Remote Desktop is out of place for a service account, and more so from outside.',{whys:['Screen unlock is logon type 7.','Type 10 is Remote Desktop, odd for a service account and odder from outside.','A batch job is logon type 4.','A cached offline sign-in is logon type 11.'],imp:'core',c:'det-windows-events'}],
     ['On a fresh Debian 13 server, /var/log/auth.log is missing. Where do you read SSH sign-ins?',['/var/log/messages','/var/log/secure','/etc/ssh/sshd_config','journalctl -u ssh'],3,'Debian 12 and later keep these in the journal; on Debian 13 the lines show sshd-session.',{whys:['/var/log/messages is a text log; Debian 13 writes SSH sign-ins to the journal.','/var/log/secure is a text log too; Debian 13 uses the journal.','sshd_config holds SSH settings, while sign-ins go to a log.','Debian 12 and later keep SSH sign-ins in the journal: journalctl -u ssh.'],imp:'good',c:'det-unix-logs'}],
     ['makani-web’s auth.log holds these lines:<br><code>sshd[2211]: Failed password for root from 203.0.113.50 port 51122 ssh2<br>sshd[2214]: Failed password for keola from 203.0.113.50 port 51130 ssh2<br>sshd[2230]: Accepted publickey for keola from 10.0.5.31 port 40112 ssh2<br>sudo: pam_unix(sudo:session): session opened for user root(uid=0) by keola(uid=1000)<br>sshd[2241]: Failed password for root from 203.0.113.50 port 51140 ssh2</code><br>Which command lists only the failed sign-ins for root?',['<code>grep -i root /var/log/auth.log</code>','<code>grep -v \'Failed password\' /var/log/auth.log</code>','<code>grep \'Failed password for root\' /var/log/auth.log</code>','<code>grep -c \'Failed password\' /var/log/auth.log</code>'],2,'-i root also catches the sudo line, -v keeps everything else, and -c prints only a count.',{whys:['-i root also matches the sudo line.','-v keeps every line that lacks the phrase: the opposite.','The full phrase matches exactly the two failed root lines.','-c prints a count (3) in place of the lines.'],imp:'core',c:'det-unix-logs'}],
     ['A teammate is about to test an SSH sign-in on a Debian 13 server. Which command shows the sign-ins live, as they land?',['<code>sudo tail -n 50 /var/log/auth.log</code>','<code>sudo head -n 3 /var/log/ufw.log</code>','<code>sudo grep -c \'Failed password\' /var/log/auth.log</code>','<code>sudo journalctl -u ssh -f</code>'],3,'Debian 13 uses the journal, and tail -n, head, and grep -c each print once and stop.',{whys:['tail -n prints once and stops, and Debian 13 uses the journal.','head prints the oldest lines of a firewall log, once.','-c prints one count and stops.','-f follows the journal and prints each sign-in as it lands.'],imp:'good',c:'det-unix-logs'}],
     ['makani-web’s auth.log shows a failed password from 203.0.113.50 port 51122 at <code>2026-10-20T09:14:03-10:00</code>. The Site A router logged the same connection, source port 51122, at <code>Oct 20 19:23:10</code> UTC. What do you check first?',['Rebuild makani-web','Each device’s clock sync: <code>timedatectl</code> on the server, <code>show ntp associations</code> on the router','The intruder forged the router’s time','Convert HST by subtracting 10 hours'],1,'09:14:03 HST is 19:14:03 UTC, so the logs sit 9 minutes apart; Kerberos sign-ins fail past 5 minutes of drift.',{whys:['Rebuilding over what looks like a clock gap wastes time and evidence.','Two logs 9 minutes apart point at a clock first: check sync on each device.','Clock drift is the simpler explanation, so check it first.','HST to UTC adds 10 hours: 09:14 HST is 19:14 UTC.'],imp:'good',c:'det-timelines'}],
     ['A spray alert fires at 07:00. The approved change ticket lists a 07:00 help-desk test of 30 test accounts, and the source is the help desk’s own address. What do you do?',['Record it as a false positive and tune the rule','Record it as a false negative','Escalate it as an incident','Record it as a true negative'],0,'Tune the rule narrowly: skip only the help desk’s address in approved test windows, so other sprays still fire. <a href="#freshman/f13">Review: Watch, detect, and respond</a>',{whys:['Harmless activity that fired is a false positive: check the ticket and source address, record why, and tune the rule.','A false negative is a missed attack, and this rule fired.','The ticket and the help desk’s address show a planned, harmless test.','A true negative is silence on harmless activity, and this rule fired.'],imp:'core',c:'det-outcomes'}],
     ['The SIEM shows 1102 from HILO-FS01 at 02:13. What still holds the events from before the clear?',['Nothing: they are gone','The Recycle Bin','The System log','The copies already forwarded to the SIEM'],3,'Clearing erases the local copy only. Forwarding is preparation that pays off here.',{whys:['Forwarded copies left the PC before the clear.','The Recycle Bin holds deleted files, apart from event logs.','The System log holds its own events, apart from the cleared Security events.','The SIEM kept the copies forwarded as each line was written.'],imp:'core',c:'host-audit-logging'}],
     ['The first bad auth.log line is 2026-10-18T02:13-10:00. Backups ran at 23:00 HST on 17 and 18 October. Which do you restore?',['18 October, the newest','17 October, before the first bad line','Either one','Neither: rebuild'],1,'Restore the last backup taken before the earliest bad line, check it for the same indicators, then keep watching.',{whys:['The 18 October backup ran after the first bad line and may hold the intruder.','17 October ran before the first bad line, so it is the clean choice.','Only a backup from before the first bad line earns trust.','A clean backup exists, so restore it, check it, and keep watching.'],imp:'good',c:'det-containment'}],
     ['<code>Get-MpComputerStatus</code> on KAIMANA-FD1 shows <code>RealTimeProtectionEnabled : False</code>. What does that leave open?',['Files that run as they land go unscanned','Sign-ins stop logging','The firewall stops','Nothing: scheduled scans cover it'],0,'Turn it back on, then find who turned it off. <a href="#sophomore/s2">Review: Windows 11 hardening</a>',{whys:['Real-time protection scans each file as it arrives and runs.','Sign-in logging follows audit policy, apart from antivirus.','The firewall runs on its own settings.','Scheduled scans come later, after a file has already run.'],imp:'good',c:'host-antivirus'}],
     ['keola typed a wrong password five times at KAIMANA-FD1, yet the Security log holds no 4625. What is the likely cause?',['The PC is offline','Audit logon events records Success only','4625 needs a domain','The log is full'],1,'Audit policy decides what reaches the Security log: turn on Failure for logon events and verify with auditpol. <a href="#sophomore/s2">Review: Windows 11 hardening</a>',{whys:['An offline PC still writes its own Security log.','Recording Success only leaves failures out: turn on Failure.','4625 appears on standalone PCs too.','A full log set to overwrite keeps writing the newest events, so 4625s would still appear; their absence points at audit policy.'],imp:'core',c:'host-audit-logging'}],
     ['makani-web’s auth.log shows <code>Accepted password for root from 203.0.113.50</code>. Which setting refuses that sign-in?',['PermitRootLogin no in sshd_config','ufw default allow incoming','A longer root password','X11Forwarding yes'],0,'Root signs in over SSH only when PermitRootLogin allows it: set it to no, test with <code>sudo sshd -t</code>, reload SSH, and confirm with <code>sudo sshd -T | grep permitrootlogin</code>, since a file in sshd_config.d can override the main file. <a href="#sophomore/s3">Review: Debian-family hardening</a>',{whys:['sshd checks PermitRootLogin before any password, so no turns root away however good the guess.','ufw default allow incoming opens more doors.','A longer password slows guessing, and root can still sign in.','X11Forwarding controls remote windows, apart from who signs in.'],imp:'core',c:'host-login-policy'}]
   ]),
   LINKS('Go further',['nist-800-92','ms-win-sec','ubuntu-server','explainshell'])
   ]},
 {id:'s11',title:'Scripts for defenders',bloom:'Apply',sum:'Worked scripts in Bash, PowerShell, and Python that audit accounts and count log lines, how to read a script before you run it, and the controls that record and restrict scripts.',
  can:'read a script before you run it, follow worked audits in Bash, PowerShell, and Python, change one line to move an audit to another system, and name the controls that record and restrict scripts',
  blocks:[
   C('Read a script before you run it','Apply',
     P('In <a href="#freshman/f12">Code you can read</a> you read scripts; now you run and fix them, so reading comes first. A script runs with your rights, and under sudo with root’s, so every line you skip is a line you trust blind.'),
     TIPS('<b>Know where it came from.</b> A teammate’s file beats a forum paste. Save a download and read it before any shell runs it.',
          '<b>Read it in a pager.</b> <code>less audit.sh</code> shows every line and runs none of them.',
          '<b>Say what each line reads, changes, and sends.</b> Reads are safe to try, changes need the brief, and sends need a reason.',
          '<b>Mark the risky patterns:</b> a download piped to a shell, <code>curl -k</code>, <code>chmod 777</code>, <code>rm -rf</code> on a variable, new cron entries, and hardcoded passwords.',
          '<b>Run it small first:</b> as a normal user, on a lab VM or snapshot, with sample input, before it meets sudo.')),
   C('Worked script: audit_users.sh','Apply',
     P('The job on Makai Surf Supply’s Linux server: report any second root account, and any person-style account (UID 1000 and up) the brief leaves out. brief.txt lists malia and keola, one name per line.'),
     TERM(' 1  #!/bin/bash\n 2  # audit_users.sh: report accounts that need a look. Reads only.\n 3  set -euo pipefail\n 4  brief="$1"\n 5  flagged=0\n 6  while IFS=: read -r name _ uid _ _ _ shell; do\n 7    if [[ "$uid" -eq 0 && "$name" != "root" ]]; then\n 8      echo "EXTRA UID 0: $name"\n 9      flagged=$((flagged + 1))\n10    elif [[ "$uid" -ge 1000 && "$uid" -lt 65534 ]] && ! grep -qx "$name" "$brief"; then\n11      echo "NOT IN BRIEF: $name ($shell)"\n12      flagged=$((flagged + 1))\n13    fi\n14  done < /etc/passwd\n15  echo "Flagged: $flagged"'),
     TERM('$ chmod +x audit_users.sh\n$ ./audit_users.sh brief.txt\nEXTRA UID 0: sysadm\nNOT IN BRIEF: tmpuser (/bin/bash)\nFlagged: 2\n$ ./audit_users.sh\n./audit_users.sh: line 4: $1: unbound variable'),
     P('The second run shows <code>set -u</code> at work: with no brief named, the script stops at once rather than flag every account.')),
   ANATOMY('A Bash audit script',[
     {name:'Shebang',tag:'line 1',tone:'muted',text:'<code>#!/bin/bash</code> names the interpreter; <code>chmod +x</code> lets <code>./audit_users.sh</code> run'},
     {name:'Safety line',tag:'line 3',tone:'amber',text:'<code>set -euo pipefail</code>: stop at the first failed command (-e), at an unset variable (-u), and when any part of a pipeline fails (pipefail)'},
     {name:'Variables',tag:'lines 4 and 5',tone:'l1',text:'<code>brief="$1"</code> keeps the first argument, and <code>flagged=0</code> starts a tally; no spaces around ='},
     {name:'Loop',tag:'lines 6 to 14',tone:'l3',text:'<code>IFS=: read -r</code> splits each /etc/passwd line at the colons, <code>_</code> skips a field, and <code>done &lt; /etc/passwd</code> feeds the file in',children:[
       {name:'Condition',tag:'lines 7 and 10',tone:'l4',text:'<code>[[ … ]]</code> tests numbers and text; <code>! grep -qx</code> is true when the name is missing from the brief',children:[
         {name:'Output',tag:'lines 8 and 11',tone:'ok',text:'<code>echo</code> prints each finding; line 15 prints the total'}]}]}
   ],{bloom:'Apply',
     key:[['amber','The safety line'],['l3','Repeats per account'],['ok','What you see']],
     facts:{head:['Mark','Means','Here'],rows:[
       ['<code>$1</code>','The first argument after the script name','brief.txt'],
       ['<code>"$@"</code>','Every argument, each kept whole even with spaces','<code>for f in "$@"</code> loops over several'],
       ['<code>$?</code>','The last command’s exit code: 0 is success','grep -q sets it to 0 on a match and 1 on none'],
       ['<code>"$name"</code>','A quoted variable stays one word, even when empty','Every variable here is quoted']]}}),
   QUIZ('s11cy','Check yourself',[
     ['brief.txt lists malia and keola. /etc/passwd holds root (UID 0), toor (UID 0), backup (UID 34), malia (UID 1000), and pua (UID 1002, /bin/bash). What does audit_users.sh print?',['EXTRA UID 0: toor, NOT IN BRIEF: pua (/bin/bash), and Flagged: 2','EXTRA UID 0: root, EXTRA UID 0: toor, and Flagged: 2','NOT IN BRIEF: backup, NOT IN BRIEF: pua (/bin/bash), and Flagged: 2','Flagged: 0'],0,'root is skipped by name, backup sits below UID 1000, and malia is in the brief.',{whys:['toor is a second UID 0, and pua is a person-style account missing from the brief.','The script skips root by name, so toor alone prints as an extra UID 0.','backup’s UID 34 sits below 1000, so the person check skips it.','toor and pua each match a test, so the count is 2.'],imp:'core',c:'host-user-audit'}]
   ]),
   C('Worked script: Find-ExtraAdmins.ps1','Apply',
     P('The same check on KAIMANA-FD1, the front-desk PC at Kaimana Dental Clinic: list enabled local administrators the brief leaves out, and hand back every member it cannot check. A .ps1 file holds PowerShell lines, <code>param()</code> takes the arguments, and each cmdlet returns objects with properties such as Name and Enabled.'),
     TERM('# Find-ExtraAdmins.ps1: enabled local admins missing from the brief. Reads only.\nparam([string]$BriefFile = ".\\brief.txt")\n$approved = Get-Content $BriefFile\n$admins = Get-LocalGroupMember -Group Administrators\nforeach ($a in $admins) {\n  if ($a.ObjectClass -ne \'User\' -or $a.PrincipalSource -ne \'Local\') {\n    Write-Output "Check by hand: $($a.Name) ($($a.ObjectClass), $($a.PrincipalSource))"\n    continue\n  }\n  $name = $a.Name.Split(\'\\\')[-1]\n  $user = Get-LocalUser -Name $name\n  if ($user.Enabled -and $name -notin $approved) {\n    Write-Output "Not in brief: $name"\n  }\n}'),
     TERM('PS C:\\Audit> .\\Find-ExtraAdmins.ps1\n.\\Find-ExtraAdmins.ps1 : File C:\\Audit\\Find-ExtraAdmins.ps1 cannot be loaded because\nrunning scripts is disabled on this system.\nPS C:\\Audit> Set-ExecutionPolicy -Scope CurrentUser RemoteSigned\nExecution Policy Change\nDo you want to change the execution policy?\n[Y] Yes  [A] Yes to All  [N] No  [L] No to All  [S] Suspend  [?] Help (default is "N"): Y\nPS C:\\Audit> .\\Find-ExtraAdmins.ps1\nNot in brief: kawika'),
     CMDS('Read it line by line',[
       ['-ne \'User\' -or … -ne \'Local\'','True for a group, or for a domain or Microsoft Entra account: members Get-LocalUser cannot read.'],
       ['continue','Moves on once this member prints as Check by hand, so no admin drops out unseen.'],
       ['.Split(\'\\\')[-1]','Cuts KAIMANA-FD1\\kawika at the backslash; [-1] keeps the last piece, kawika.'],
       ['-notin $approved','True when the name is missing from the brief’s list.']
     ]),
     TIPS('<b>The first run stopped on execution policy.</b> Windows 11 starts at Restricted; RemoteSigned lets local scripts run and asks downloaded ones for a signature.',
          'Set RemoteSigned for your own account only; Windows Server already starts there. Answer Y, since Enter alone keeps the old policy.'),
     DETAIL('Explore cmdlets before you write',TIPS('<code>Get-Command *LocalUser*</code> finds cmdlets, <code>Get-Help Get-LocalGroupMember -Examples</code> shows worked uses, and <code>Get-LocalUser | Get-Member</code> lists properties such as Enabled.')),
     DETAIL('When Get-LocalGroupMember stops',TIPS('<b>If Get-LocalGroupMember stops</b> with “Failed to compare two elements in the array”, one SID has lost its name; list the group with <code>net localgroup Administrators</code>.',
          'A bare SID (S-1-5-21-… or S-1-12-1-…) may be a deleted account or an Entra administrator role, so list it under Check by hand.',
          'Give the Check by hand list to the PC’s owner; this audit only reads, so leave every entry in place.'))),
   QUIZ('s11cy2','Check yourself',[
     ['Administrators on KAIMANA-FD1 holds Administrator (disabled), malia (enabled, in the brief), kawika (enabled, missing from the brief), and AzureAD\\pua. What does Find-ExtraAdmins.ps1 print?',['Check by hand: AzureAD\\pua (User, AzureAD), and Not in brief: kawika','Not in brief: kawika, alone','Not in brief: Administrator, and Not in brief: kawika','Nothing, since malia is in the brief'],0,'The script skips disabled and approved accounts and hands back any member it cannot check.',{whys:['pua is an Entra account, so it prints for a look by hand, and kawika is enabled and missing from the brief.','pua prints too, since the script hands back each member it cannot check.','The disabled Administrator is skipped, so kawika alone prints as Not in brief.','malia passes, and kawika and pua still print.'],imp:'core',c:'host-admin-groups'}]
   ]),
   C('Worked script: failed_report.py','Apply',
     P('The ten-line counter from <a href="#freshman/f12">Code you can read</a> grows into a tool. Name a log, and it reports each address at or above a limit, with its users, as JSON. Its pattern comes from the table in <a href="#sophomore/s10">Read the logs</a>.'),
     TERM(' 1  #!/usr/bin/env python3\n 2  # failed_report.py: failed SSH sign-ins per address, as JSON. Reads only.\n 3  import json, re, sys\n 4  from collections import Counter\n 5\n 6  PATTERN = re.compile(r"Failed password for (invalid user )?(\\S+) from ([0-9.]+)")\n 7  LIMIT = 10\n 8  counts, users = Counter(), {}\n 9\n10  with open(sys.argv[1]) as log:\n11      for line in log:\n12          m = PATTERN.search(line)\n13          if m:\n14              ip = m.group(3)\n15              counts[ip] += 1\n16              users.setdefault(ip, set()).add(m.group(2))\n17\n18  report = [{"ip": ip, "failures": n, "users": sorted(users[ip])}\n19            for ip, n in counts.most_common() if n >= LIMIT]\n20  print(json.dumps(report))'),
     TERM('$ python3 failed_report.py /var/log/auth.log\n[{"ip": "203.0.113.45", "failures": 41, "users": ["admin", "keola", "oracle", "test"]}]\n$ python3 failed_report.py /var/log/auth.log > report.json\n$ jq -r \'.[].ip\' report.json\n203.0.113.45'),
     P('One address tried four user names 41 times: guessing from a single source. 198.51.100.7 failed 3 times and stays under the limit.')),
   ANATOMY('A Python script that counts failed sign-ins',[
     {name:'Imports',tag:'lines 3 and 4',tone:'muted',text:'json writes the report, re matches patterns, sys reads the arguments, and Counter tallies'},
     {name:'Settings',tag:'lines 6 to 8',tone:'l1',text:'The pattern, compiled once; the limit; and two empty tallies'},
     {name:'Open the log named on the command line',tag:'line 10',tone:'l2',text:'<code>sys.argv[1]</code> is the first argument, like Bash’s $1',children:[
       {name:'Loop and match',tag:'lines 11 to 13',tone:'l3',text:'<code>PATTERN.search(line)</code> returns the pieces, or None for a line that does not match',children:[
         {name:'Count',tag:'lines 14 to 16',tone:'amber',text:'group(3) is the address and group(2) the user: add one, and remember the user'}]}]},
     {name:'Report and output',tag:'lines 18 to 20',tone:'ok',text:'Keep addresses at or above LIMIT, busiest first, and print them as JSON'}
   ],{bloom:'Apply',
     facts:{head:['Line','Reads, then changes'],rows:[
       ['<code>open(sys.argv[1])</code>','Reads the log you name and leaves it unchanged'],
       ['<code>PATTERN.search(line)</code>','Reads one line; m holds the match'],
       ['<code>counts[ip] += 1</code>','Reads and raises the tally, in memory only'],
       ['<code>json.dumps(report)</code>','Turns the report into JSON text; print shows it, and <code>&gt; report.json</code> saves it']]},
     note:'Groups count opening parentheses from the left: group 1 is the optional “invalid user ”, group 2 the user, and group 3 the address. The script only reads the log, so any adm group member (Ubuntu and Mint) runs it safely.'}),
   QUIZ('s11cy3','Check yourself',[
     ['failed_report.py reads a log with 41 failures from 203.0.113.45, 12 from 198.51.100.7, and 3 from 192.0.2.80. Which addresses does it print?',['203.0.113.45 alone','203.0.113.45 and 198.51.100.7','All three','198.51.100.7 alone'],1,'LIMIT is 10 and the test is n >= LIMIT, so 41 and 12 pass and 3 stays out.',{whys:['12 also meets the limit of 10, so 198.51.100.7 prints too.','LIMIT is 10, so 41 and 12 pass and 3 stays out.','3 is below the limit of 10, so 192.0.2.80 stays out.','203.0.113.45 has 41 failures, well over the limit, so it prints too.'],imp:'core',c:'comp-scripting'}]
   ]),
   C('Pipelines inside scripts','Apply',
     P('Scripts reuse the text tools from <a href="#sophomore/s10">Read the logs</a>. Worked example on makani-web: which shells do the accounts use, and who has bash?'),
     TERM('$ cut -d: -f7 /etc/passwd | sort | uniq -c | sort -rn\n     23 /usr/sbin/nologin\n      5 /bin/bash\n      1 /bin/sync\n      1 /bin/false\n$ awk -F: \'$7 == "/bin/bash" {print $1}\' /etc/passwd\nroot\nmalia\nkeola\nsysadm\ntmpuser'),
     CMDS('Pieces to reuse',[
       ['cut -d: -f1,3 /etc/passwd','Fields 1 and 3 (name and UID), split at the colons.'],
       ['sort | uniq -c | sort -rn','Count repeats, busiest first. uniq merges only neighboring lines, so sort comes first.'],
       ['grep -E \'^(malia|keola):\' /etc/passwd','An extended pattern: ^ anchors the start, and ( | ) offers choices.'],
       ['python3 -m json.tool report.json','Checks that a JSON file parses; an error names the broken line.'],
       ['jq -r \'.[] | select(.failures >= 20) | .ip\' report.json','Pulls fields out of JSON (sudo apt install jq).']
     ])),
   C('sed in a script: set each key, then prove it','Apply',
     P('In <a href="#sophomore/s3">Debian-family hardening</a> you changed one line with <code>sed -i.bak</code> and proved it with grep. A script repeats them for every key, the same way on each machine, and prints its own proof.'),
     TERM(' 1  #!/bin/bash\n 2  # set_aging.sh: password aging in /etc/login.defs, then proof. Run with sudo.\n 3  set -euo pipefail\n 4  file=/etc/login.defs\n 5  cp -a "$file" "$file.bak"\n 6  set_key() {\n 7    if grep -q "^$1" "$file"; then\n 8      sed -i "s/^$1.*/$1   $2/" "$file"\n 9    else\n10      echo "$1   $2" >> "$file"\n11    fi\n12    grep "^$1" "$file"\n13  }\n14  set_key PASS_MAX_DAYS 90\n15  set_key PASS_MIN_DAYS 7\n16  set_key PASS_WARN_AGE 7'),
     TERM('$ sudo ./set_aging.sh\nPASS_MAX_DAYS   90\nPASS_MIN_DAYS   7\nPASS_WARN_AGE   7\n$ diff /etc/login.defs.bak /etc/login.defs | grep \'^[<>]\'\n< PASS_MAX_DAYS 99999\n< PASS_MIN_DAYS 0\n< PASS_WARN_AGE 7\n> PASS_MAX_DAYS   90\n> PASS_MIN_DAYS   7\n> PASS_WARN_AGE   7'),
     CMDS('Read it line by line',[
       ['cp -a "$file" "$file.bak"','One backup before any change. An -i.bak on every sed would overwrite the .bak with a half-done file.'],
       ['set_key() { … }','A function: a named block that runs with its own $1 and $2 each time a later line calls it.'],
       ['"s/^$1.*/$1   $2/"','Double quotes let the shell fill in the key and the value; single quotes would hand sed the characters $1 and $2.'],
       ['grep -q … else echo … >>','sed rewrites only lines that exist, so a missing key is added at the end instead.'],
       ['grep "^$1" "$file"','Prints each key as the file now holds it: the proof sits in the output.']
     ])),
   COMPARE('Record it and restrict it',[
     {name:'Record',tag:'what ran, read afterward',tone:'l4',rows:[
       ['Windows','Execution policy logs nothing; <a href="#junior/j2">Group Policy</a> turns on script block logging and transcription'],
       ['Linux','auditd records what its rules ask for: <a href="#junior/j3">Debian and deeper Linux</a> watches files, and <a href="#senior/se9">Linux: confine services and prove it</a> adds an execve rule with a key (<code>-k exec</code>) that logs every program start; sudo logs each command, and <code>Defaults log_output</code> records whole sessions'],
       ['Where you set it','Group Policy, /etc/audit/rules.d/, and <code>sudo visudo</code>'],
       ['Leaves open','Every run; someone has to read the record']],
      hook:'cameras that record what happened.'},
     {name:'Restrict',tag:'what may run, decided first',tone:'amber',rows:[
       ['Windows','Lightly: Restricted, RemoteSigned, or AllSigned decides which .ps1 files start. AMSI, on by default, hands each script’s text to antivirus, which can block it (more in <a href="#junior/j2">Group Policy</a>)'],
       ['Linux','An AppArmor profile that denies an interpreter or a path, even when the program runs as root'],
       ['Where you set it','<code>Set-ExecutionPolicy</code> (<code>Get-ExecutionPolicy -List</code> shows each scope), Group Policy, and /etc/apparmor.d/'],
       ['Leaves open','Typed or pasted commands, a run started with <code>-ExecutionPolicy</code> <code>Bypass</code> unless Group Policy sets the policy, and any program with no profile']],
      hook:'locks on chosen doors; execution policy is a safety catch rather than a lock.'}
   ],{bloom:'Apply',
     note:'<b>noexec on /tmp and /dev/shm stops ./file and leaves bash file working; it is one layer, never the wall.</b> Pair the mount option with records and a profile.'}),
   ORDER('s11o','Put the script lines in order','check_sudo.sh lists sudo-group members the brief leaves out. Tap its nine lines in the order the worked script uses: shebang, safety line, the argument, then the work.',[
     ['<code>#!/bin/bash</code>','First: the system reads line 1 alone to choose the interpreter, so the shebang leads the file.'],
     ['<code>set -euo pipefail</code>','Second: set -euo pipefail guards only the lines after it, so it goes in before any real work.'],
     ['<code>brief="$1"</code>','Third: the test inside the loop reads $brief, so the argument gets its name before anything uses it.'],
     ['<code>admins=$(getent group sudo | cut -d: -f4 | tr \',\' \' \')</code>','Before the loop: the for line walks $admins, so the list must exist first. It holds field 4 of the group line, with commas turned into spaces.'],
     ['<code>for user in $admins; do</code>','Now the loop can open, because $admins holds the names. $admins stays unquoted on purpose, so the shell splits it into one name per pass.'],
     ['<code>if ! grep -qx "$user" "$brief"; then</code>','Inside the loop: the test needs $user, which takes a name only once the loop starts each pass.'],
     ['<code>echo "Extra admin: $user"</code>','Inside the if: it belongs to the test, so it prints only for names the brief leaves out.'],
     ['<code>fi</code>','Before done: the if opened inside the loop, so it closes inside the loop too.'],
     ['<code>done</code>','Last: done closes the loop from step 5, after every line it repeats.']
   ],'Apply'),
   TYPEIN('s11t','Change one line: audit wheel on FreeBSD','check_sudo.sh audits the sudo group on Mint, Ubuntu, and Debian. FreeBSD keeps its administrators in the wheel group, and pw groupshow prints a group line in the same colon-separated form that getent prints. One line decides which system the audit runs on.',
     '#!/bin/bash\nset -euo pipefail\nbrief="$1"\nadmins=$(getent group sudo | cut -d: -f4 | tr \',\' \' \')    # <- this line\nfor user in $admins; do\n  if ! grep -qx "$user" "$brief"; then\n    echo "Extra admin: $user"\n  fi\ndone',
     ['admins=$(pw groupshow wheel | cut -d: -f4 | tr \',\' \' \')','admins=$(getent group wheel | cut -d: -f4 | tr \',\' \' \')'],
     '<b>Right.</b> <code>pw groupshow wheel</code> prints <code>wheel:*:0:root,kawika</code>, the same four fields <code>getent</code> prints, so <code>cut -d: -f4</code> still takes the member list and <code>tr</code> turns the commas into spaces. The rest of the script stays as it is: the loop, the grep against the brief, and the message. One line moved the audit to another operating system. (<code>getent group wheel</code> works on FreeBSD too.)',
     {bloom:'Apply',prompt:'Type the replacement for the marked line:'}),
   QUIZ('s11q2','Check: predict the output',[
     ['brief.txt holds root and lani. <code>pw groupshow wheel</code> prints <code>wheel:*:0:root,kawika,lani</code>. What does the changed script print?',['Extra admin: root','Extra admin: kawika','Extra admin: lani','Nothing'],1,'The if prints once for each member that grep -qx cannot find in the brief.',{whys:['root is in the brief, so grep -qx finds it and the if stays quiet.','kawika is the one member the brief leaves out, so the test fails for that name alone and the message prints once.','lani is in the brief, so grep -qx finds her and the if stays quiet.','One member is missing from the brief, so one line prints.'],imp:'core',c:'comp-scripting'}]
   ]),
   SPOT('s11sp','Spot the risky lines before you run a downloaded script','Mele found setup_printer.sh on a forum for the front-desk printer at Lanikai Book Nook. Tap every line to fix or remove before anything runs, then Check.',[
     ['#!/bin/bash',null],
     ['# setup_printer.sh: front-desk printer helper',null],
     ['LOG=/var/log/printer-setup.log',null,'Sets LOG before the last line uses it, the step the WORKDIR line skips.'],
     ['sudo apt-get install -y cups',null,'apt installs CUPS from the distribution’s own signed repository, the trusted way to add software.'],
     ['curl -fsSL https://get.printhelper.example/install.sh | sudo bash','Runs a download nobody has read, as root. Save it, read it, and run it only if it passes.'],
     ['curl -k -o driver.tar.gz https://dl.printhelper.example/driver.tar.gz','-k turns off the certificate check, so a device in the path could swap the file. Drop -k.'],
     ['sudo chmod 777 /etc/cups','Lets every account rewrite the print settings. The folder ships as 755.'],
     ['sudo rm -rf "$WORKDIR"/*','WORKDIR is never set, so this becomes rm -rf /*. Set and check the variable, or delete the line.'],
     ['echo "*/5 * * * * root /usr/local/bin/printer-update" | sudo tee /etc/cron.d/printer','A new cron job that runs as root every five minutes: persistence. Ask why a printer needs it.'],
     ['ADMIN_PASS="Kona2026!"','A password typed into the file: everyone who reads the script has it. Remove it and change that password.'],
     ['sudo systemctl restart cups',null,'Restarts the print service so it reads its settings again: routine, and it changes no permissions.'],
     ['echo "Done $(date)" | sudo tee -a "$LOG"',null]
   ]),
   QUIZ('s11q','Check: predict the output',[
     ['A script with <code>set -euo pipefail</code> on contains <code>echo "Report for $breif"</code>, a misspelling of brief. What happens?',['It prints “Report for ” and carries on','It stops with “breif: unbound variable”','It prints the brief’s contents','It asks for a value'],1,'-u stops the script at any variable that was never set, so typos surface at once.',{whys:['-u stops at a variable that was never set, rather than printing a blank.','-u stops the script and names the unset variable, breif.','breif was never set, so it has nothing to print.','The script reads values from its code and arguments, and stops without asking.'],imp:'core',c:'comp-scripting'}],
     ['brief.txt holds malia and keola. What does <code>grep -qx kai brief.txt; echo $?</code> print?',['0','1','kai','Nothing'],1,'grep exits 0 on a match and 1 on none, and $? holds that code.',{whys:['0 is the exit code for a match, and kai is missing.','grep exits 1 when nothing matches, and echo $? prints it.','-q keeps grep silent, so echo prints the exit code alone.','echo $? always prints the exit code, here 1.'],imp:'good',c:'comp-scripting'}],
     ['Which lines does <code>grep -E \'Failed password for (invalid user )?[a-z]+ from\'</code> match?<br>a. <code>Failed password for keola from 203.0.113.45</code><br>b. <code>Failed password for invalid user admin from 203.0.113.45</code><br>c. <code>Accepted password for malia from 192.0.2.10</code><br>d. <code>Failed password for invalid user Admin2 from 198.51.100.7</code>',['a and b','a, b, and d','a alone','All four'],0,'( )? makes “invalid user ” optional, and [a-z]+ takes lowercase letters alone, so Admin2 fails; c says Accepted.',{whys:['a skips the optional part, and b fills it, with lowercase names in both.','d’s Admin2 holds a capital and a digit, which [a-z]+ rejects.','b matches too, since ( )? makes “invalid user ” optional.','c says Accepted, and d fails on Admin2.'],imp:'good',c:'comp-scripting'}],
     ['report.json holds <code>[{"ip": "203.0.113.45", "failures": 41}, {"ip": "198.51.100.7", "failures": 12}]</code>. What does <code>jq -r \'.[] | select(.failures &gt;= 20) | .ip\' report.json</code> print?',['203.0.113.45','198.51.100.7','Both addresses','41'],0,'select keeps records with 20 or more failures; .ip prints each address.',{whys:['select keeps 41, at or above 20, and .ip prints its address.','12 is below 20, so select drops 198.51.100.7.','One record passes select, so one address prints.','.ip prints the address field; 41 sits in the failures field.'],imp:'good',c:'comp-data-formats'}],
     ['A Windows 11 PC keeps the default Restricted policy, with no Group Policy setting, yet Task Manager’s Details tab, with the Command line column on, shows <code>powershell.exe -ExecutionPolicy Bypass -File C:\\Users\\Public\\x.ps1</code> running. What does that tell you?',['The policy is broken and needs a repair','Any user can bypass it for one run; check what x.ps1 does','Restricted blocks Bypass, so the list is wrong','Only administrators can use Bypass'],1,'Execution policy is a safety catch rather than a lock; logging and app control do the real work.',{whys:['The policy works as designed: without Group Policy, Bypass on the command line is allowed.','Without Group Policy, -ExecutionPolicy Bypass overrides Restricted for one run, so the policy stopped nothing and x.ps1 itself is what to read.','Restricted is a safety catch, and -ExecutionPolicy Bypass steps past it.','Without Group Policy, any user can use Bypass, admin or standard.'],imp:'good',c:'win-script-logging'}],
     ['/tmp is mounted noexec. Which command still runs /tmp/check.sh?',['./check.sh, typed inside /tmp','bash /tmp/check.sh','Neither one','Both of them'],1,'noexec blocks starting a file directly; bash lives in /usr/bin and just reads the script as text.',{whys:['./check.sh starts the file directly, which noexec blocks.','bash lives in /usr/bin and reads the script as text, so noexec leaves it alone.','bash /tmp/check.sh still runs, since bash itself sits outside /tmp.','./check.sh stops under noexec, so one command runs it.'],imp:'good',c:'host-misc-hardening'}],
     ['What does <code>for u in keola malia; do echo "hi $u"; done</code> print?',['hi keola, then hi malia, each on its own line','hi $u, twice','hi keola malia, on one line','Nothing, since it needs a file'],0,'The loop runs once per word, and $u becomes each name in turn. <a href="#freshman/f12">Review: Code you can read</a>',{whys:['The loop runs once per word, printing keola, then malia.','Double quotes let $u expand, so each name takes the place of $u.','The loop splits the list into words and runs once for each.','A for loop can walk a list of words typed right in the command.'],imp:'core',c:'comp-scripting'}],
     ['In <code>2026-10-20T09:14:03.512345-10:00 makani-web sshd[2211]: Failed password for invalid user admin from 203.0.113.50 port 51122 ssh2</code>, what is 2211?',['The source port','The process ID of the sshd that wrote the line','The number of failures so far','admin’s user ID'],1,'program[pid] follows the host name; the source port, 51122, follows the word port. <a href="#sophomore/s10">Review: Read the logs: Windows, Linux, and network devices</a>',{whys:['The source port is 51122, after the word port.','program[pid] marks the process ID of the sshd that wrote the line.','The line counts nothing; the number belongs to the process.','admin is an invalid user, so it lacks a user ID; 2211 is the process ID.'],imp:'good',c:'det-unix-logs'}],
     ['Someone edits line 8 of set_aging.sh to <code>sed -i \'s/^$1.*/$1   $2/\' "$file"</code>, with single quotes. What happens to PASS_MAX_DAYS?',['It stays at its old value: sed looks for a line that starts with the characters $1 and finds none','It becomes 90, as before','sed deletes every line in the file','The script stops with a sed syntax error'],0,'The proof line exposes it: line 12 still prints the old value. <a href="#sophomore/s3">Review: Debian-family hardening</a>',{whys:['Inside single quotes $1 stays as two characters, no line starts with them, and line 12 prints PASS_MAX_DAYS 99999 as the clue.','The value reaches sed only through double quotes; here sed receives the characters $1 and $2.','s/// rewrites matching lines alone; with no match, every line stays.','The command is valid sed that matches nothing, so sed succeeds quietly.'],imp:'good',c:'comp-scripting'}]
   ]),
   LINKS('Go further',['gnu-bash','shellcheck','python-tutorial','ms-ps','explainshell'])
   ]},
 {id:'s6',title:'Investigation questions and the change log',bloom:'Apply',sum:'How to answer exactly, the commands that find things, and the one habit that makes every teammate better.',
  can:'answer an investigation question exactly, pick the command that finds the answer, and keep a change log your teammates can use',
  blocks:[
   C('Answering an investigation question','Understand',
     TIPS('Read the question twice, then answer in its <b>exact format</b> before changing anything (<a href="#freshman/f1">Evidence first</a>).',
          'Exact format covers the hash algorithm, full path or name (with or without the extension), user name or UID, and date format; most “tricks” are format tricks.',
          'Write the answer where the question file asks (often an <code>ANSWER:</code> line), and leave the rest of that file untouched.',
          'Typical asks: a file’s location, hash, owner, or creator; a process or listening port; decoded text; or a log entry.',
          '<b>Timelines need clocks.</b> Logs from several devices line up only when every timestamp comes from one shared clock (NTP).',
          '<b>Copies survive.</b> Send every log to a central log server (syslog), so an intruder who wipes a device’s log leaves the copy behind.'),
     CMDS('Finding and fingerprinting',[
       ['Get-ChildItem -Path C:\\ -Recurse -Filter "secret*" -ErrorAction SilentlyContinue','Windows: find by name. Add -Force to include hidden.'],
       ['Get-FileHash -Algorithm SHA256 C:\\Users\\malia\\Desktop\\secret.txt','Windows hash. -Algorithm MD5 for MD5.'],
       ['Select-String -Path C:\\Users\\*\\*.txt -Pattern "flag"','Windows: search inside text files.'],
       ['Get-WinEvent -FilterHashtable @{LogName=\'Security\'; Id=4720}','Windows: user-created events in the Security log. Also 4624 logon, 4625 failed logon, and 4732 added to a local group.'],
       ['sudo find / -iname "secret*" 2>/dev/null','Linux: find by name.'],
       ['sudo grep -rin "flag" /home /var/log 2>/dev/null','Linux: find by content, recursive, case-insensitive, and with line numbers.'],
       ['sha256sum file.txt','Linux hash. md5sum file.txt for MD5.'],
       ['stat file.txt','Owner, permissions, and timestamps.'],
       ['echo "ZmxhZw==" | base64 -d','Decode base64 text.'],
       ['last -n 20','Recent logins. lastlog for the last login of each user. Debian 13 dropped both: use lslogins, or install wtmpdb and lastlog2.']
     ]),
     DETAIL('Windows event IDs and audit categories',TIPS('<b>Event IDs:</b> <a href="#sophomore/s10">The event IDs a defender reads first</a>.','<b>auditpol categories:</b> "Logon/Logoff", "Account Management", "Account Logon", "Policy Change", "Privilege Use", "Detailed Tracking", "Object Access", "System", and "DS Access"; quote names with spaces or slashes.'))),
    COMPARE('Hash, encoding, and encryption: can it be reversed?',[
     {name:'Hash',tag:'One-way',tone:'l2',
      svg:{label:'Any file goes into SHA-256 and comes out as 64 hex characters. The arrow runs one way.',
       body:'<rect x="4" y="22" width="44" height="28" rx="4" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="26" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">any file</text><path d="M50 36 H70" stroke="var(--l2)" stroke-width="2" fill="none" marker-end="url(#arrow-l2)"/><rect x="74" y="22" width="52" height="28" rx="14" fill="var(--tint2)" stroke="var(--l2)" stroke-width="2"/><text x="100" y="40" text-anchor="middle" font-size="9" fill="var(--ink)">SHA-256</text><path d="M128 36 H146" stroke="var(--l2)" stroke-width="2" fill="none" marker-end="url(#arrow-l2)"/><rect x="150" y="22" width="46" height="28" rx="4" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="173" y="34" text-anchor="middle" font-size="8" fill="var(--ink)">64 hex</text><text x="173" y="44" text-anchor="middle" font-size="8" fill="var(--ink)">characters</text><text x="100" y="66" text-anchor="middle" font-size="9" fill="var(--ink-2)">one way</text>'},
      rows:[['Does','Turns any input into a fixed-length fingerprint'],['Reverse it','Out of reach by design: you can only hash guesses and compare'],['Key','None'],['Sizes','MD5: 32 hex characters (128 bits). SHA-256: 64 hex characters (256 bits)'],['Use it for','Integrity checks (<code>Get-FileHash</code>, <code>sha256sum</code>) with SHA-256, since MD5 is broken for collisions. Password storage uses slow, salted hashes such as yescrypt, bcrypt, or PBKDF2']],
      hook:'a fingerprint: it identifies the file and stays one-way.'},
     {name:'Encoding',tag:'Reversible by anyone',tone:'amber',
      svg:{label:'The word flag encodes to ZmxhZw== in base64, and anyone decodes it back.',
       body:'<rect x="4" y="22" width="44" height="28" rx="4" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="2"/><text x="26" y="40" text-anchor="middle" font-size="10" fill="var(--ink)">flag</text><rect x="134" y="22" width="62" height="28" rx="4" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="2"/><text x="165" y="40" text-anchor="middle" font-size="10" fill="var(--ink)">ZmxhZw==</text><path d="M52 29 H128" stroke="var(--ink-2)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M130 43 H54" stroke="var(--ink-2)" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="91" y="18" text-anchor="middle" font-size="9" fill="var(--ink-2)">base64</text><text x="91" y="64" text-anchor="middle" font-size="9" fill="var(--ink-2)">base64 -d: anyone decodes</text>'},
      rows:[['Does','Rewrites data in another alphabet so it travels safely as text'],['Reverse it','Anyone can: <code>base64 -d</code> turns ZmxhZw== back into flag'],['Key','None'],['Spot it','base64 uses A–Z, a–z, 0–9, +, and /, often ending in = or =='],['Also here','Cisco type 7 (service password-encryption): its fixed key is public, so free tools reverse it']],
      hook:'a translation: anyone with the dictionary reads it.'},
     {name:'Encryption',tag:'Reversible with a key',tone:'l3',
      svg:{label:'The word flag is encrypted with a key into scrambled text, and the same key decrypts it.',
       body:'<rect x="4" y="22" width="44" height="28" rx="4" fill="var(--paper)" stroke="var(--l3)" stroke-width="2"/><text x="26" y="40" text-anchor="middle" font-size="10" fill="var(--ink)">flag</text><rect x="134" y="22" width="62" height="28" rx="4" fill="var(--paper)" stroke="var(--l3)" stroke-width="2"/><text x="165" y="40" text-anchor="middle" font-size="10" fill="var(--ink)">9f#Qx2…</text><path d="M52 29 H128" stroke="var(--l3)" stroke-width="2" fill="none" marker-end="url(#arrow-l3)"/><path d="M130 43 H54" stroke="var(--l3)" stroke-width="2" fill="none" marker-end="url(#arrow-l3)"/><circle cx="80" cy="12" r="5" fill="none" stroke="var(--l3)" stroke-width="2"/><path d="M85 12 H100 M96 12 V17 M100 12 V17" stroke="var(--l3)" stroke-width="2" fill="none"/><text x="104" y="15" font-size="9" fill="var(--ink-2)">key</text><text x="91" y="64" text-anchor="middle" font-size="9" fill="var(--ink-2)">decrypt with the key</text>'},
      rows:[['Does','Scrambles data so only key holders can read it'],['Reverse it','With the right key'],['Key','Required: one shared key (such as AES) or a key pair (such as RSA)'],['Gives','Confidentiality: TLS for data in transit, BitLocker or LUKS for disks']],
      hook:'a locked box: the key opens it.'}
   ],{note:'Same file, different algorithm, different answer: the MD5 and the SHA-256 of one file share nothing, so answer with exactly the algorithm the question names.',
     caption:'Hash to check, encode to carry, encrypt to keep secret.'}),
   QUIZ('s6ck1','Check yourself',[
     ['Decode: ZmxhZw== (base64)',['flag','frog','file','fail'],0,'Investigations often meet base64 in scripts, logs, and config files.',{whys:['Running echo "ZmxhZw==" | base64 -d prints flag: encoding reverses for anyone, with no key.','frog encodes as ZnJvZw==, so its second character, n, already differs from ZmxhZw==.','file encodes as ZmlsZQ==, so it parts from ZmxhZw== at the third character, l.','fail encodes as ZmFpbA==, so it parts from ZmxhZw== at the third character, F.'],imp:'good',c:'host-forensics'}]
   ]),
   DETAIL('Investigation one-liners and hash commands',TIPS('<b>Who owns it:</b> find / -xdev \\( -nouser -o -nogroup \\) 2&gt;/dev/null lists ownerless files; id NAME prints an account’s UID, primary GID, and groups.',
          '<b>Bare UID:</b> sudo find / -xdev -uid 1003 lists its files; getent passwd 1003 names the account, and empty output means it is gone.','<b>Hidden files:</b> find /home /root /tmp /var/tmp /dev/shm -name ".*" -type f.','<b>What is it:</b> file NAME; strings NAME | head.','<b>When did it change:</b> stat NAME; find / -xdev -newermt DATE.','<b>Who ran what:</b> journalctl _COMM=sudo; grep -E "useradd|userdel|usermod|passwd" /var/log/auth.log*; last, lastb, who, and w (Debian 13: lslogins, wtmpdb, and lastlog2).','<b>Hash lengths</b> in hex characters: MD5 32, SHA-1 40, RIPEMD-160 40, SHA-256 64, and SHA-512 128.','<b>Hash commands:</b> Windows, Get-FileHash -Algorithm SHA256 FILE or certutil -hashfile FILE SHA256; Linux, sha256sum, sha512sum, sha1sum, and md5sum.',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      '<b>RIPEMD-160:</b> Linux uses openssl dgst -ripemd160 FILE, and Windows PowerShell 5.1 also takes Get-FileHash -Algorithm RIPEMD160.',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      '<b>FreeBSD:</b> sha256 and md5, with -q to print the hash alone; recent releases also accept the GNU names Linux uses, such as sha256sum.',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      '<b>Letter case:</b> Get-FileHash prints uppercase hex and the Linux tools lowercase; the labs accept either case.',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      '<b>Brackets in a file name:</b> give Get-FileHash -LiteralPath for a name with [ or ]; -Path reads them as wildcards and matches nothing.',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      '<b>Hidden files in PowerShell:</b> Get-FileHash hashes a hidden file when you give it the full path.',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      '<b>Skip MACTripleDES:</b> it uses a fresh random key each run, so its value changes every time.')),
   C('The change log','Apply',
     P('A change log is a text file (on the host, or on paper) with one line per change: <b>time, machine, what you changed, and how to undo it</b>. It turns a broken service into a two-minute fix and later becomes the raw material for your checklist.'),
     TERM('14:07  WIN   Disabled Guest (Disable-LocalUser -Name Guest)   undo: Enable-LocalUser -Name Guest\n14:09  WIN   Removed kawika from Administrators                 undo: Add-LocalGroupMember -Group Administrators -Member kawika\n14:15  MINT  ufw enable, default deny incoming                  undo: sudo ufw disable\n14:22  MINT  purged vsftpd                                      undo: sudo apt install vsftpd\n14:24  MINT  AVAILABILITY CHECK FAILED -> reinstalled vsftpd; brief says customers use FTP. Harden instead.'),
     TIPS('Log before you press Enter.','One scribe per machine; the driver says the change out loud.','Keep the undo column honest. "Reinstall" counts as an undo only if the config survived.')),
   SPOT('s6sp','Spot the problems: a change log and the baseline it broke','The brief says customers use the web server on port 80 and FTP on port 21. Tap every log line with an empty or dishonest undo, and every after-baseline line that shows a broken requirement, then Check.',[
     ['14:02  WIN   Disabled Guest                    undo: Enable-LocalUser -Name Guest',null,'Time, machine, change, and an exact undo command: a complete entry.'],
     ['14:05  WIN   Removed kawika from Administrators  undo: (blank)','An empty undo turns a mistake into guesswork. Write: Add-LocalGroupMember -Group Administrators -Member kawika.'],
     ['14:11  MINT  purged vsftpd                     undo: sudo apt install vsftpd','Reinstalling counts as an undo only when the config survived, and purge deletes it. The brief requires FTP, so harden it instead.'],
     ['14:15  MINT  ufw enable, default deny incoming undo: sudo ufw disable',null,'The undo is honest: sudo ufw disable reverses this exact change. Its side effect shows up later, in the missing 21/tcp rule.'],
     ['Before:  tcp LISTEN 0.0.0.0:21  vsftpd',null],
     ['Before:  tcp LISTEN 0.0.0.0:80  apache2',null],
     ['After:   tcp LISTEN 0.0.0.0:80  apache2',null,'Port 80 still listens after the changes, so the required web service survived.'],
     ['After:   port 21 absent','The after-baseline shows FTP gone, a required service. The 14:11 line explains why: reinstall, restore the config, and harden it.'],
     ['After:   ufw  80/tcp ALLOW IN',null],
     ['After:   ufw  21/tcp absent from the rules','Default deny now blocks FTP even once vsftpd returns. Add sudo ufw allow 21/tcp.']
   ]),
   DETAIL('Answer formats that trip people up',TIPS('A full path starts at the root: /home/kekoa/.hidden_tools or C:\\Users\\Public\\x.txt.','A name includes the extension only when the question shows one.','A user name and a full name are different answers, and a UID is a number.','A port is the number alone: 4444.','schtasks prints a task name with its folder in front; the name is the part after the last backslash.','A date follows the format the question shows, and a hash uses the named algorithm alone.')),
   QUIZ('s6q','Check: investigation and logging',[
     ['Question: "What is the MD5 hash of /home/keola/notes.txt?" You answer with sha256sum output. Is that correct?',['Yes, hashes are hashes','No: the question asked for MD5','Only if the file is small','Yes, if you also include the path'],1,'Use the algorithm asked: md5sum /home/keola/notes.txt',{whys:['The question names MD5, and a SHA-256 value is a different answer.','Use the algorithm asked: md5sum gives the MD5 value.','File size leaves the algorithm question unchanged.','Adding the path still leaves the wrong algorithm.'],imp:'core',c:'host-forensics'}],
     ['Which Windows Security event ID means a user account was created?',['4624','4625','4720','4732'],2,'4720 created, 4726 deleted, 4732 added to a local group, 4624 logon, and 4625 failed logon.',{whys:['4624 records a successful sign-in, which an existing account makes.','4625 records a failed sign-in, such as a mistyped password.','Windows logs 4720 when an account is created; 4732 then shows it joining a group.','4732 records an account joining a local group, a step that can follow its creation.'],imp:'good',c:'det-windows-events'}],
     ['The fastest way to find which change broke a required service is',['Re-read the brief','Your change log, newest entry first','Reboot the machine','Reinstall the operating system'],1,'Newest change first, then undo it and confirm the service is back.',{whys:['The brief lists what must run; the log shows what changed.','The newest change is the likeliest cause: undo it and confirm.','A reboot keeps the broken setting in place.','Reinstalling erases evidence and every fix.'],imp:'core',c:'host-change-log'}]
   ]),
   QUIZ('s6q2','Interleaved review: Sophomore',[
     ['pua holds admin rights, but the brief never names pua. First step?',['Leave pua as is','Remove pua from Administrators only','Reset pua’s password','Remove or lock pua, then check what it changed'],3,'Only the accounts the brief names are authorized. <a href="#sophomore/s1">Review: Read the scenario brief first</a>',{whys:['An unnamed admin is unauthorized, so leaving it keeps the risk.','An unauthorized account stays usable after losing admin rights.','A new password keeps an unauthorized account alive.','Unnamed means unauthorized: remove or lock it, then check its changes.'],imp:'core',c:'host-user-audit'}],
     ['Which command shows what Windows audit policy records?',['net accounts','Get-LocalUser','auditpol /get /category:*','gpupdate /force'],2,'It lists Success and Failure per category. <a href="#sophomore/s2">Review: Windows 11 hardening</a>',{whys:['net accounts shows password and lockout policy.','Get-LocalUser lists local accounts.','auditpol lists Success and Failure for each audit category.','gpupdate applies Group Policy changes.'],imp:'core',c:'host-audit-logging'}],
     ['Which command lists the sudo group’s members on Ubuntu?',['getent group sudo','sudo -l','ls /home','id root'],0,'getent lists every member; sudo -l shows only your own rights. <a href="#sophomore/s3">Review: Debian-family hardening</a>',{whys:['getent group sudo lists every member of the group.','sudo -l shows your own rights only.','ls /home lists home folders, apart from group members.','id root shows root’s own groups.'],imp:'good',c:'host-admin-groups'}],
     ['The brief needs remote admin, and Telnet listens on 23. Best fix?',['Keep Telnet','Replace Telnet with SSH','Move Telnet to 2323','Keep Telnet and add a longer password'],1,'Telnet sends passwords in clear text. <a href="#sophomore/s4">Review: Services and ports</a>',{whys:['Telnet sends passwords in clear text.','SSH encrypts the session and meets the remote admin need.','A new port number still carries clear text.','A longer password still crosses the network in clear text.'],imp:'core',c:'net-protected-protocols'}],
     ['After <code>login block-for 120 attempts 3 within 60</code>, what follows 3 failures in 60 seconds?',['The router reloads','The VTY lines shut down','Only the console port refuses sign-ins','Sign-ins are refused for 120 seconds'],3,'Quiet mode lasts the block-for time. <a href="#sophomore/s5">Review: Cisco: configure a switch and a router</a>',{whys:['The router stays up; quiet mode only refuses sign-ins.','The lines stay up and refuse sign-ins for a while.','Quiet mode acts on remote sign-ins for the block-for time.','Sign-ins are refused for the block-for time: 120 seconds.'],imp:'good',c:'cisco-device-hardening'}],
     ['KAILUA-WS07 shows 169.254.20.7 and reaches nothing. What do you check first?',['The link and the DHCP server, then ipconfig /renew','The DNS server list','The browser’s proxy setting','The VPN client'],0,'A 169.254 address means Windows heard no DHCP answer and picked its own, so fix the path to the DHCP server and renew. <a href="#sophomore/s7">Review: Network tools and a safer router</a>',{whys:['169.254 means no DHCP answer, so check the link and DHCP, then renew.','DNS turns names into addresses; the address problem comes first.','A proxy setting affects the browser alone.','A VPN rides on a working address first.'],imp:'good',c:'net-dns-dhcp'}],
     ['Which cookie flag hides a session cookie from page scripts?',['Secure','SameSite=Lax','HttpOnly','Path=/'],2,'HttpOnly hides the cookie from page scripts, so injected script cannot read it; Secure keeps it on HTTPS. <a href="#sophomore/s8">Review: Web traffic, HTTPS, and certificates</a>',{whys:['Secure keeps the cookie on HTTPS.','SameSite limits sending the cookie across sites.','HttpOnly hides the cookie from page scripts.','Path limits which pages get the cookie.'],imp:'good',c:'web-http'}],
     ['A file’s hash scores zero on every engine. Verdict?',['Safe to open','Still unknown: new files often score zero','Ransomware','A mistyped hash'],1,'Engines flag only files they know. <a href="#sophomore/s9">Review: Check before you trust: messages, links, and files</a>',{whys:['Zero hits means unknown, since engines flag only what they know.','New files often score zero, so the verdict stays open.','Calling it ransomware takes evidence beyond a zero score.','A valid hash of a new file also scores zero.'],imp:'core',c:'det-sandboxes'}],
     ['Why does <code>sort</code> run before <code>uniq -c</code>?',['uniq -c counts only neighboring lines','sort removes duplicates','uniq reads numbers only','For speed'],0,'uniq -c merges only matching lines that sit together, so sort groups them first. <a href="#sophomore/s10">Review: Read the logs: Windows, Linux, and network devices</a>',{whys:['uniq -c merges only matching neighbors, so sort groups them first.','sort orders lines; uniq does the merging.','uniq compares any text lines.','Correctness is the reason: matching lines must sit together.'],imp:'good',c:'lin-shell'}],
     ['Does a local Restricted execution policy stop a harmful script?',['Yes, every script','Yes, except for admins','Yes, after a restart','No: -ExecutionPolicy Bypass steps around it'],3,'It guards against accidents only. <a href="#sophomore/s11">Review: Scripts for defenders</a>',{whys:['Bypass steps around the policy for any script.','Any account can pass -ExecutionPolicy Bypass.','A restart leaves the bypass open.','Bypass steps around it: the policy guards against accidents only.'],imp:'good',c:'win-powershell'}],
     ['The “principal” emails a teacher: buy gift cards today, tell no one. Which trick?',['Vishing','Business email compromise','Tailgating','Smishing'],1,'It poses as a leader to rush a secret payment; verify on a known number. <a href="#freshman/f8">Review: Threats and the people behind them</a>',{whys:['Vishing uses a phone call.','A fake leader rushing a secret payment is business email compromise.','Tailgating follows someone through a door.','Smishing uses text messages.'],imp:'core',c:'sec-social-engineering'}],
     ['The SIEM stays quiet all night, and the morning review confirms nothing happened. Which outcome is that?',['False negative','False positive','True negative','True positive'],2,'No alert (negative) on a night with nothing to find, so the tool was right (true). <a href="#freshman/f13">Review: Watch, detect, and respond</a>',{whys:['A false negative is a missed attack, and the night was harmless.','A false positive is an alert, and the night stayed quiet.','Quiet tools on a quiet night: a true negative.','A true positive is an alert on a real attack.'],imp:'core',c:'det-outcomes'}],
     ['Which part of a script repeats steps for each item in a list?',['A condition','A variable','A loop','A pipe'],2,'A loop runs its steps once for each item; a condition picks a path, and a variable holds a value. <a href="#freshman/f12">Review: Code you can read</a>',{whys:['A condition picks a path.','A variable holds a value.','A loop runs its steps once for each item.','A pipe passes output to the next command.'],imp:'good',c:'comp-scripting'}]
   ]),
   REFLECT('s6r','Evidence before cleanup','List the fixes you plan for the first twenty minutes on a lab. Which of them would erase an answer you still need, such as a file’s hash, its path, or its owner? Reorder the list so evidence comes first, and write one line on how you will notice the next time a fix threatens evidence.'),
   LINKS('Go further',['ms-sysint','explainshell','pico','t4t-range'])
  ]}
 ]
});

<script>
'use strict';
/* ---- glossary (the Glossary rail page) ----
   Kept alphabetical. Each entry links to the unit where the ladder first teaches the term;
   'at' is a #grade/unit anchor. def may hold <b> and <code>. */
LADDER.addGlossary([
  {term:'3-2-1 rule',def:'Three copies of your data, on two kinds of storage, with one copy off site.',at:'freshman/f4'},
  {term:'802.1Q tag',def:'A 4-byte field in a frame on a trunk whose 12-bit VLAN ID names the frame’s VLAN.',at:'freshman/f7'},
  {term:'802.1X',def:'Port-based network access control: a device proves itself through EAP before the switch port or SSID lets it on.',at:'junior/j6'},
  {term:'AAA',def:'Authentication, authorization, and accounting: proving who you are, deciding what you may do, and recording what you did.',at:'freshman/f3'},
  {term:'ABAC (attribute-based access control)',def:'Rules decide access from attributes of the user, the resource, and the request, such as network, time, or tag.',at:'junior/j10'},
  {term:'Absolute path',def:'A path that starts at / and works from any folder, such as /etc/ssh. A relative path starts from the folder you are in.',at:'freshman/f6'},
  {term:'Access log',def:'A web server’s record of every request, one line each: client, time, request, status, size, referrer, and agent.',at:'junior/j9'},
  {term:'Access port',def:'A switch port in one VLAN that passes untagged frames to one end device.',at:'freshman/f7'},
  {term:'Access token',def:'What Windows builds at sign-in: the user’s SID, group SIDs, privileges, and integrity level. Each process carries a copy.',at:'junior/j8'},
  {term:'access-class',def:'The line command that filters which source addresses may open a session to the device itself.',at:'junior/j4'},
  {term:'ACL (access control list)',def:'A list of allow and deny entries that decides who can do what to a file, folder, share, or registry key; on a router, the permit and deny lines that filter packets.',at:'freshman/f5'},
  {term:'ACL (network)',def:'On a router, switch, or cloud subnet: an ordered list of permit and deny lines for packets, read top down; the first match wins, and an implicit deny ends the list.',at:'junior/j4'},
  {term:'Active Directory (AD)',def:'The Windows Server directory that stores a domain’s users, groups, and computers in one place.',at:'sophomore/s2'},
  {term:'Active reconnaissance',def:'Probing a target’s systems directly, such as port scans or guessed paths, which shows up in its logs.',at:'junior/j11'},
  {term:'adm group',def:'The Debian-family group that reads system logs under /var/log, without root power.',at:'sophomore/s3'},
  {term:'Administrative distance (AD)',def:'A trust rank that picks between route sources for the same prefix: connected 0, static 1, and OSPF 110.',at:'junior/j4'},
  {term:'Advanced audit policy',def:'About 60 audit subcategories under Advanced Audit Policy Configuration, finer than the nine basic categories.',at:'junior/j2'},
  {term:'After-action report',def:'The written review after an incident or drill: summary, timeline, scope, root cause, response, and improvements with owners and dates.',at:'senior/se13'},
  {term:'AIDE',def:'A Linux file integrity checker that compares every watched file with a database of hashes built on a clean day.',at:'junior/j3'},
  {term:'Air gap',def:'A system without any network link, so data moves only by hand.',at:'freshman/f4'},
  {term:'Alert',def:'A notice raised when a rule decides that some events need a person’s look.',at:'sophomore/s10'},
  {term:'Alert fatigue',def:'Worn-down attention after too many false positives, when analysts start skimming or ignoring alerts.',at:'senior/se13'},
  {term:'Alias (PowerShell)',def:'A short name for a cmdlet, such as del for Remove-Item or sc for Set-Content in Windows PowerShell 5.1; Get-Alias shows what each one runs.',at:'freshman/f5'},
  {term:'Alternate data stream (ADS)',def:'A hidden second stream of data attached to a file on an NTFS drive; Windows keeps the Mark of the Web in one called Zone.Identifier.',at:'sophomore/s2'},
  {term:'AMSI (Antimalware Scan Interface)',def:'Hands scripts and commands to the antivirus after they are decoded, just before they run.',at:'junior/j2'},
  {term:'Anti-CSRF token',def:'A secret value a site places in its own forms and checks on every change request; other sites cannot read it.',at:'junior/j9'},
  {term:'Anti-malware',def:'The layers that work with the virus scanner, such as download reputation, unwanted-app blocking, real-time scanning, and controlled folder access.',at:'freshman/f13'},
  {term:'Antivirus',def:'Software that checks files and programs against detection signatures and suspicious actions, then blocks, quarantines, or reports them.',at:'freshman/f13'},
  {term:'API (application programming interface)',def:'A set of addresses a program calls to get or change data, usually over HTTP with JSON.',at:'senior/se10'},
  {term:'APIPA',def:'A self-assigned 169.254.x.x address that a Windows host takes when its DHCP request goes unanswered.',at:'freshman/f4'},
  {term:'App Control for Business',def:'Windows’ kernel-enforced application control (formerly WDAC): code runs only when the policy trusts its publisher, path, hash, or installer.',at:'senior/se8'},
  {term:'AppArmor',def:'The mandatory access control on Ubuntu, Mint, and Debian that confines each profiled program to the files it needs, even when it runs as root.',at:'junior/j3'},
  {term:'Application control',def:'Letting only approved programs run, by publisher, path, or hash: App Control for Business and AppLocker.',at:'junior/j8'},
  {term:'AppLocker',def:'The older Windows application control, with rules per user or group; it still works, while new features go to App Control.',at:'senior/se8'},
  {term:'Approval gate',def:'A step in an automated playbook that waits for a person before a disruptive action, such as isolating a server.',at:'senior/se13'},
  {term:'apt',def:'The package manager on Debian, Ubuntu, and Mint that installs, updates, and removes .deb packages.',at:'freshman/f6'},
  {term:'APT (advanced persistent threat)',def:'A skilled, well-funded team, often state-backed, that targets chosen organizations and stays hidden for months.',at:'freshman/f8'},
  {term:'Argument',def:'A value you type after a command or script name, such as brief.txt in ./audit_users.sh brief.txt. A Bash script reads the first one as $1.',at:'sophomore/s11'},
  {term:'ARP',def:'The protocol that finds the MAC address for an IPv4 address on the local network.',at:'freshman/f7'},
  {term:'ARP spoofing',def:'Forged ARP replies that claim another host’s IP address, often the gateway’s, to put the sender on-path.',at:'junior/j7'},
  {term:'AS-REP roasting',def:'Cracking offline the reply a domain controller sends for an account set to skip Kerberos pre-authentication.',at:'senior/se7'},
  {term:'ASLR (address space layout randomization)',def:'An OS guard that loads code and data at shuffled addresses, so an intruder cannot predict where they sit.',at:'senior/se2'},
  {term:'ASR rules (attack surface reduction)',def:'Defender rules that block risky behavior, such as Office starting child processes, in Audit, Block, or Warn mode.',at:'junior/j8'},
  {term:'at job',def:'A command queued to run once at a set time, listed with atq.',at:'junior/j3'},
  {term:'Attack surface',def:'Every account, service, port, and program an attacker could reach on a system.',at:'freshman/f1'},
  {term:'Audit mode',def:'A policy state that logs what a rule would block while blocking nothing, used to tune rules before enforcing them.',at:'senior/se8'},
  {term:'Audit policy',def:'The Windows settings that decide which Success and Failure events go to the Security log.',at:'sophomore/s2'},
  {term:'Audit user ID (auid)',def:'The ID of the person who signed in, which auditd keeps on every process that person starts, even after su or sudo. Services have it unset, and cron jobs carry their owner’s ID.',at:'senior/se9'},
  {term:'auditd',def:'The Linux audit daemon that records the security events its rules ask for.',at:'junior/j3'},
  {term:'Auditor',def:'An independent checker who tests controls against a standard and reports gaps; external auditors work for an outside firm.',at:'senior/se12'},
  {term:'auth.log',def:'The Ubuntu and Mint log file for sign-ins, sudo, and SSH. Debian 12 and later keep the same lines in the systemd journal (<code>journalctl -u ssh</code>).',at:'sophomore/s10'},
  {term:'Authentication-Results',def:'The header your own mail server adds with its SPF, DKIM, and DMARC verdicts.',at:'sophomore/s9'},
  {term:'Authorization',def:'Permission from a system’s owner, ideally in writing, to access or change it; inside a computer, the rights an account holds.',at:'freshman/f1'},
  {term:'authorized_keys',def:'The per-user file of SSH public keys that may sign in without that user’s password.',at:'sophomore/s3'},
  {term:'AutoPlay',def:'The Windows prompt that offers to open a drive or disc when it connects; turning it off removes one easy click for a planted USB stick.',at:'sophomore/s2'},
  {term:'Autostate',def:'The rule that keeps an SVI down until its VLAN exists and a port carrying it is up.',at:'sophomore/s5'},
  {term:'Availability check',def:'A lab test that confirms a required service or authorized account still works after your changes.',at:'freshman/f1'},
  {term:'Backdoor',def:'A hidden way back into a system, such as a netcat listener, an extra SSH key, or a rogue user.',at:'freshman/f3'},
  {term:'Backup',def:'An independent copy on separate media that survives the loss of the original and earns trust after a test restore.',at:'freshman/f4'},
  {term:'Base system (FreeBSD)',def:'The kernel and core userland the FreeBSD project maintains, patched with freebsd-update (or pkg on a pkgbase install).',at:'senior/se1'},
  {term:'Baseline',def:'A record of how a system looks before you change it: its users, services, ports, software, and settings.',at:'freshman/f1'},
  {term:'Beaconing',def:'Small, regular check-ins from an infected host to its controller; it shows as evenly spaced flows.',at:'junior/j7'},
  {term:'Bearer token',def:'A token sent in the Authorization header; whoever holds it acts as its owner until it expires.',at:'senior/se10'},
  {term:'Behavior detection',def:'Detection that flags actions departing from normal: it catches new tricks and raises more false alarms.',at:'freshman/f13'},
  {term:'BitLocker',def:'Windows drive encryption that keeps a lost or stolen drive unreadable; the TPM unlocks it at startup, and a 48-digit recovery key opens it when the boot chain changes.',at:'freshman/f5'},
  {term:'BitLocker To Go',def:'BitLocker for removable drives, so a USB stick that leaves the building stays unreadable without its password or recovery key.',at:'sophomore/s2'},
  {term:'Block Public Access',def:'An S3 setting, for one bucket or a whole account, that overrides any policy or ACL that would make storage public.',at:'junior/j10'},
  {term:'blocklistd',def:'The FreeBSD daemon that blocks an address in pf after repeated failed logins (blacklistd before FreeBSD 15).',at:'senior/se1'},
  {term:'Blue team',def:'The defenders who harden systems, watch alerts, and respond to incidents.',at:'freshman/f13'},
  {term:'BOLA (broken object-level authorization)',def:'An API that returns any object whose id a caller asks for without checking ownership: the IDOR of APIs.',at:'senior/se10'},
  {term:'BPDU',def:'The message switches exchange to run spanning tree.',at:'freshman/f7'},
  {term:'BPDU guard',def:'A setting that err-disables an edge port the moment a BPDU arrives.',at:'freshman/f7'},
  {term:'Broadcast address',def:'The last address of a subnet, with every host bit set to 1.',at:'sophomore/s5'},
  {term:'Broadcast domain',def:'The set of devices that receive one another’s broadcasts; each VLAN is one.',at:'freshman/f7'},
  {term:'Broken access control',def:'The server lets a user reach data or actions beyond their rights, often because it checks sign-in but not ownership.',at:'junior/j9'},
