      rows:[['Who starts it','This machine: updates, DNS lookups, and browsing'],['Default','Allow'],['Replies','Come back in automatically: the firewall is stateful and tracks each connection it lets out']],
      hook:'your own calls out, with the answers let back in.'}
   ],{intro:'Direction means who opened the connection, whichever way its packets flow afterward.',
     note:'<b>Windows profiles.</b> Windows Defender Firewall applies one of three profiles (Domain, Private, or Public) to each connection by its network category; the quick wins above set all three alike.'}),
   C('Services, startup, shares, and files','Apply',
     CMDS('Find the extras',[
       ['Get-Service | Where-Object Status -eq Running | Select-Object Name,DisplayName,StartType','Running services. Research anything unfamiliar before stopping it.'],
       ['Stop-Service -Name Spooler -Force; Set-Service -Name Spooler -StartupType Disabled','Stop and disable a service the brief leaves out, here Print Spooler; RemoteRegistry, ftpsvc, and SNMP follow the same pattern.'],
       ['Get-NetTCPConnection -State Listen | Select-Object LocalPort,OwningProcess | Sort-Object LocalPort','What is listening. Match PIDs with Get-Process -Id &lt;pid&gt;.'],
       ['Get-SmbShare','Shares. Keep ADMIN$, C$, and IPC$, which Windows creates on every machine; judge the rest against the brief and remove the unexplained ones: Remove-SmbShare -Name Public.'],
       ['Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol','SMBv1 should be Disabled: Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart'],
       ['Set-SmbClientConfiguration -EnableInsecureGuestLogons $false -Force','Guest logons let a look-alike server hand out files without sign-in. Home accepts them until this runs; Pro, Enterprise, and Server refuse them by default. Verify: Get-SmbClientConfiguration reads EnableInsecureGuestLogons False.'],
       ['Get-ChildItem -Path C:\\Users -Recurse -Include *.mp3,*.mp4,*.mkv,*.jpg,*.png,*.exe -ErrorAction SilentlyContinue | Select-Object FullName','Media files and odd executables in user folders. Check the brief or the acceptable-use policy for what is unauthorized.'],
       ['appwiz.cpl','Run it: uninstall unauthorized or suspicious programs (games, cracked tools, and remote-access tools outside the brief).']
     ]),
     TIPS('<b>Commands take the short service name</b> (RemoteRegistry); services.msc shows the display name (Remote Registry); Get-Service shows both.','<b>A $ only hides a share from browsing.</b> An added share such as Backup$, or any share of C:\\Users or a profile, is a finding.','<b>Judge a program by its path.</b> Windows and most programs run from C:\\Windows, C:\\Program Files, and C:\\ProgramData.','<b>Writable folders are the clue.</b> Standard users write to C:\\Users\\Public, Temp, and Downloads: suspect any task, service, Run entry, firewall rule, or Defender exclusion there.','<b>AppData is normal for per-user apps</b> (OneDrive, Teams): check the publisher and the brief before removing one. A maintenance-sounding name is only a label.','<b>Scripts in odd places.</b> A .aspx, .php, or .ps1 file in a web root or user folder can be a planted <b>webshell</b> or backdoor.',
          'Record a suspect script’s path and hash before you remove it, so the evidence survives.','<b>Judge software by its job.</b> Installed (appwiz.cpl), portable (an .exe in a user folder), or browser extension: the brief decides. Unfamiliar is distinct from unauthorized.','<b>The usual outsiders:</b> torrent and file-sharing clients, remote-access servers, cleaners, driver updaters, unapproved VPNs, port-opening servers, and dual-use tools (scanners, password crackers, and packet sniffers).','<b>After an uninstall, check what stayed:</b> a capture driver such as Npcap, services, tasks, firewall rules, and the install folder.','<b>Passwords in plain text</b> hide in desktop notes, PowerShell history (ConsoleHost_history.txt under AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\PSReadLine), and Setup answer files (Unattend.xml in C:\\Windows\\Panther); search by content.',
          'Record what a question needs from a leaked file, as in <a href="#sophomore/s6">Investigation questions and the change log</a>, then remove or secure it.'),
     DETAIL('Services, Defender, files, and browsers',TIPS('<b>Service names</b> (display names): mpssvc (Windows Defender Firewall), WinDefend (Microsoft Defender Antivirus Service), wuauserv (Windows Update), TermService (Remote Desktop Services), and RemoteRegistry (Remote Registry).',
                                                 '<b>More service names:</b> Spooler (Print Spooler), ftpsvc (Microsoft FTP Service), W3SVC (World Wide Web Publishing Service), SNMP (SNMP Service), and sshd (OpenSSH SSH Server).',
                                                 'Names ignore case, and sc needs a space after start= (sc config NAME start= disabled).','<b>Defender:</b> -DisableRealtimeMonitoring $false turns protection on (a double negative), and PUAProtection 1 means on. Defender runs from C:\\ProgramData\\Microsoft\\Windows Defender\\Platform.','When Tamper Protection refuses a Defender cmdlet or policy change, use Windows Security.',
          'SmartScreen (App &amp; browser control): in policy, Warn offers Run anyway; Warn and prevent bypass removes it. Memory integrity: Device security &gt; Core isolation.','Stopping the spooler is Microsoft’s own PrintNightmare workaround.','When the brief needs printing, keep the spooler and leave driver installs to administrators: Point and Print’s RestrictDriverInstallationToAdministrators 1, default since the August 2021 updates.','<b>Prohibited files:</b> media (.mp3, .m4a, .wav, .flac, .mp4, .mkv, .avi, and .mov) and executables or scripts in user folders (.exe, .msi, .bat, .ps1, and .vbs).',
          'Search every profile under C:\\Users, C:\\Users\\Public, and hidden folders (add -Force) before you call the sweep complete.','<b>Browser protections:</b> Safe Browsing (Chrome and Firefox) and SmartScreen (Edge) block known-bad pages and downloads; policy can lock each on or off.'))),
   QUIZ('s2ck1','Check yourself',[
     ['Get-SmbShare lists ADMIN$, C$, IPC$, and Public, and the brief is silent on shares. Which do you remove?',['All four','ADMIN$ and C$','Public','The three with a $ sign'],2,'Keep the shares Windows creates; judge every added share against the brief.',{whys:['Windows uses ADMIN$, C$, and IPC$ for management, so removing them breaks admin work.','ADMIN$ and C$ are defaults every Windows machine carries; the added share is Public.','Someone added Public, and the brief names no use for it.','The $ shares are the built-in defaults; the added share is the finding.'],imp:'core',c:'host-file-permissions-shares'}]
   ]),
   HIER('Where Windows starts things automatically',
    {name:'Auto-start places',note:'Each one runs code without a click from the user',tone:'muted',children:[
      {name:'Services and drivers',note:'Automatic ones start at boot, often as LocalSystem. <code>Get-Service</code>; services.msc shows each path',tone:'l4'},
      {name:'Scheduled tasks',note:'Start on a trigger: boot, sign-in, or a clock. <code>Get-ScheduledTask</code>; most tasks under <code>\\Microsoft\\Windows\\</code> ship with Windows, yet malware hides there too. Read every action: root <code>\\</code> tasks first (OneDrive’s updater lives there by design), then any action pointing into Users, Temp, or Downloads',tone:'l3'},
      {name:'Run and RunOnce keys',note:'Start at sign-in: <code>HKLM\\…\\<wbr>CurrentVersion\\<wbr>Run</code> for every user, <code>HKCU\\…\\Run</code> for one. <code>Get-CimInstance</code> <code>Win32_StartupCommand</code>',tone:'l2'},
      {name:'Startup folders',note:'Shortcuts or files that start at sign-in. <code>shell:startup</code> (yours) and <code>shell:common startup</code> (everyone’s)',tone:'l1'},
      {name:'Deeper spots: WMI subscriptions, PowerShell profiles, and writable service files (Senior)',tone:'muted'}]},
    {intro:'Malware that survives a reboot writes itself into one of these places, so check all four.',
     note:'<code>schtasks /query /fo LIST /v</code> adds Task To Run and Author.',
     bloom:'Apply'}),
   C('Services from Command Prompt: sc.exe','Apply',
     P('Run these in Command Prompt (Admin), or type <code>sc.exe</code> in PowerShell, where plain <code>sc</code> means Set-Content (<a href="#freshman/f5">First look at Windows</a>).'),
     CMDS('sc.exe beside the cmdlets',[
       ['sc.exe query state= all','Every service and its STATE; plain sc.exe query lists the running ones. Twin: Get-Service'],
       ['sc.exe qc SysCacheHelper','Its configuration: START_TYPE, BINARY_PATH_NAME (the program), and SERVICE_START_NAME (the account). Twin: Get-CimInstance Win32_Service | Where-Object Name -eq SysCacheHelper | Select-Object StartMode,PathName,StartName'],
       ['sc.exe stop Spooler','Stop it now: STATE reads 3 STOP_PENDING, then 1 STOPPED. Twin: Stop-Service'],
       ['sc.exe config Spooler start= disabled','Keep it from starting again. The space after start= is required; the other start types are auto, delayed-auto, and demand (manual). Twin: Set-Service -StartupType Disabled'],
       ['sc.exe start Spooler','Start a service the brief requires; set start= auto first so it comes back after a restart. Twin: Start-Service'],
       ['sc.exe delete SysCacheHelper','Remove a service the brief rules out. Its registry entry goes; its program file stays, so record and remove it next. Twin: Remove-Service (PowerShell 7; Windows PowerShell 5.1 uses sc.exe).']
     ]),
     TERM('C:\\> sc qc SysCacheHelper\n[SC] QueryServiceConfig SUCCESS\n\nSERVICE_NAME: SysCacheHelper\n        TYPE               : 10  WIN32_OWN_PROCESS\n        START_TYPE         : 2   AUTO_START\n        ERROR_CONTROL      : 1   NORMAL\n        BINARY_PATH_NAME   : C:\\Users\\Public\\cache\\schelper.exe\n        LOAD_ORDER_GROUP   :\n        TAG                : 0\n        DISPLAY_NAME       : System Cache Helper\n        DEPENDENCIES       :\n        SERVICE_START_NAME : LocalSystem'),
     TIPS('<b>Read it like an investigator.</b> AUTO_START runs it at boot, LocalSystem gives it full power, and its program sits in C:\\Users\\Public, where anyone can write.',
          'A Windows-sounding display name is only a label: judge the path and the account against the brief.',
          '<b>Order matters.</b> Log the service name, path, and <code>Get-FileHash</code> result; stop it; disable or delete it as the brief directs; then remove its program file.',
          '<b>A stop alone lasts until the next boot,</b> so disable the service too.',
          '<b>Check the result.</b> <code>sc.exe qc</code> shows START_TYPE 4 DISABLED; after a delete, and once the service stops, <code>sc.exe query</code> answers 1060, the service does not exist.',
          '<b>Manual is still on call:</b> it starts on request or trigger (normal for wuauserv and many others); only Disabled blocks every start.'),
     DETAIL('Service triggers',TIPS('<b>See a service’s triggers.</b> <code>sc.exe qtriggerinfo RemoteRegistry</code> lists every event that can start RemoteRegistry while it is set to Manual.'))),
   C('The firewall from Command Prompt: netsh advfirewall','Apply',
     CMDS('netsh beside the NetSecurity cmdlets',[
       ['netsh advfirewall show allprofiles','State and Firewall Policy for the Domain, Private, and Public profiles. Twin: Get-NetFirewallProfile | Select-Object Name,Enabled,DefaultInboundAction, where NotConfigured means the Windows default, Block.'],
       ['netsh advfirewall set allprofiles state on','All three profiles on. Twin: Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True'],
       ['netsh advfirewall set allprofiles firewallpolicy blockinbound,allowoutbound','Default deny inbound, allow outbound. Twin: -DefaultInboundAction Block -DefaultOutboundAction Allow'],
       ['netsh advfirewall firewall show rule name=all dir=in','Every inbound rule. name="Kona Print Relay (TCP-In)" shows one rule: Enabled, Action, Protocol, LocalPort, and RemoteIP. Twin: Get-NetFirewallRule -DisplayName "Kona Print Relay (TCP-In)" | Get-NetFirewallPortFilter'],
       ['netsh advfirewall firewall add rule name="SSH from IT" dir=in action=allow protocol=TCP localport=22 remoteip=192.168.20.0/24','One allow rule for a port the brief requires, scoped to the addresses that need it. Twin: New-NetFirewallRule -DisplayName "SSH from IT" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 22 -RemoteAddress 192.168.20.0/24'],
       ['netsh advfirewall firewall set rule name="Kona Print Relay (TCP-In)" new enable=no','Turn a rule off and keep it for review. Twin: Disable-NetFirewallRule -DisplayName "Kona Print Relay (TCP-In)"'],
       ['netsh advfirewall firewall delete rule name="Kona Print Relay (TCP-In)"','Delete every rule with that name. Twin: Remove-NetFirewallRule -DisplayName "Kona Print Relay (TCP-In)"']
     ]),
     TIPS('<b>One name, two fields.</b> The netsh Rule Name is PowerShell’s <b>DisplayName</b>; the cmdlets’ -Name is an ID, often a GUID. Copy names exactly, quotes included.',
          '<b>Read before you remove.</b> Run show rule: an inbound Allow to RemoteIP Any on a port outside the brief is the finding. Log its port.',
          '<b>Disable built-in rules; delete added ones.</b> A disabled Remote Desktop rule can come back when the brief needs it.',
          '<b>Keep name=all for show.</b> With delete, name=all removes every rule that matches the rest of the line.',
          '<b>Two views.</b> Get-NetFirewallProfile shows local settings; Get-NetFirewallProfile -PolicyStore ActiveStore shows the result in force, so a profile Group Policy disables appears there.')),
   C('The registry from Command Prompt: reg','Apply',
     CMDS('reg beside the registry cmdlets',[
       ['reg export HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer C:\\Backup\\explorer-policies.reg','Back up the key and everything under it before you change it. To undo, reg import C:\\Backup\\explorer-policies.reg restores the saved values; later additions stay until you reg delete them.'],
       ['reg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer','Every value in the key, with its type and data. Twin: Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer'],
       ['reg query "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Terminal Server" /v fDenyTSConnections','One value; quote a key whose name has a space. 0x1 means Remote Desktop refuses connections.'],
       ['reg add HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer /v NoDriveTypeAutoRun /t REG_DWORD /d 255 /f','/v names the value, /t its type, /d the data (decimal, or hex with 0x; 255 reads back as 0xff), and /f overwrites without a prompt; reg add creates a missing key. 255 turns AutoPlay off for every drive type once Explorer restarts, as it does at the next sign-in. Twin: New-ItemProperty -Path HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer -Name NoDriveTypeAutoRun -PropertyType DWord -Value 255 -Force'],
       ['reg delete HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\Explorer /v NoDriveTypeAutoRun /f','Remove one value, which returns that setting to the Windows default. Twin: Remove-ItemProperty']
     ]),
     NOTE('<b>Export first, then change.</b> A registry change is final, and /f overwrites at once. Export the key to a .reg file, log the change, make it, then reg query to confirm. A wrong value under HKLM\\SYSTEM can stop Windows from starting: snapshot the VM.',true),
     TIPS('<b>New-Item -Force wipes an existing key</b>, every value and subkey. New-ItemProperty needs an existing key, so run Test-Path and create the key only on False.')),
   C('Remove prohibited media: find, review, then delete','Apply',
     P('When the brief bans file types, such as music and video in user folders, keep the list of every path you remove for your log.'),
     CMDS('Find, review, and delete',[
       ['dir /s /a /b C:\\Users\\*.mp3 C:\\Users\\*.mp4','Command Prompt: every match under C:\\Users, in every subfolder (/s), hidden files included (/a), one full path per line (/b). Read the list before you delete anything.'],
       ['Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.mp3,*.mp4 -ErrorAction SilentlyContinue | Select-Object FullName,Length','PowerShell: the same list; -Force adds hidden files.'],
       ['del /s /a C:\\Users\\*.mp3 C:\\Users\\*.mp4','Command Prompt: delete the reviewed types in every subfolder (/s), hidden files included (/a); del prints each path it removes. Add /f to delete read-only files too.'],
       ['Get-ChildItem -Path C:\\Users -Recurse -Force -File -Include *.mp3,*.mp4 | Remove-Item -Force','PowerShell: pipe the reviewed list to Remove-Item. Add -WhatIf first to print each deletion without making it.'],
       ['Remove-Item -Path C:\\Users\\keola\\Music\\Mixes -Recurse -Force','PowerShell: delete one folder and everything inside it, once every file in it is prohibited. Command Prompt: rd /s /q C:\\Users\\keola\\Music\\Mixes']
     ]),
     TIPS('<b>Two shells, two syntaxes.</b> <code>del /s /a</code> works in Command Prompt; PowerShell’s del, a Remove-Item alias, takes -Recurse and -Force for /s and /a.',
          '<b>Read the error.</b> “A positional parameter cannot be found” after del /s /a means you are in PowerShell; switch shells or use the PowerShell lines.',
          '<b>Review each path against the brief:</b> AppData files usually belong to an installed app, and recordings the brief names stay.',
          '<b>Record before you delete.</b> Note the path of any file a question asks about; deleting it first removes your answer too.',
          '<b>Deleted means gone.</b> del and Remove-Item skip the Recycle Bin, so a snapshot and your list are the way back.')),
   C('Permissions, UAC, and backups','Apply',
     CMDS('Check the guard rails',[
       ['icacls "C:\\Shared"','Who can do what to a folder. Look for Everyone, Users, or IUSR (anonymous web and FTP visitors) with (F) full control, (M) modify, or (W) write where they are out of place; the advanced rights WD (create files) and AD (create folders) allow uploads too.'],
       ['icacls "C:\\Shared" /inheritance:d','Stop inheriting from the parent, keeping copies of the inherited entries so you can edit them.'],
       ['icacls "C:\\Shared" /remove Everyone','Remove the explicit entries for Everyone.'],
       ['icacls "C:\\Shared" /grant "Finance:(OI)(CI)M"','Give the Finance group Modify on the folder and everything inside it. Quote the grant in PowerShell because of the parentheses.'],
       ['secpol.msc','Local Policies > Security Options: "User Account Control: Run all administrators in Admin Approval Mode" should be Enabled (the default).'],
       ['wbadmin start backup -backupTarget:E: -include:C: -allCritical -quiet','Built-in image backup (Windows 11 and Windows Server): back up C: plus everything needed for bare-metal recovery to drive E:.']
     ]),
     TIPS('<b>Backups:</b> File History copies personal files to another drive; servers back up volumes and system state. Test-restore every backup.',
          'Snapshots and backups do different jobs; <a href="#freshman/f4">the Freshman comparison</a> shows which one survives a lost disk.')),
    HIER('NTFS inheritance: entries flow down the folder tree',
     {name:'C:\\ (the drive)',note:'Users: Read &amp; execute (RX), set here and inherited by everything below',tone:'muted',children:[
       {name:'C:\\Shared',note:'Inherits Users from C:\\ and adds an explicit entry, <code>Finance:(OI)(CI)M</code>. Break inheritance here with <code>/inheritance:d</code> (keeps editable copies) or <code>/inheritance:r</code> (removes them).',tone:'l2',children:[

   QUIZ('s2ck2','Check yourself',[
     ['Get-BitLockerVolume on KAILUA-WS07 shows VolumeStatus FullyEncrypted, ProtectionStatus Off, and KeyProtector {Tpm, RecoveryPassword}, a week after the last update. What do you do?',['Nothing: the drive is fully encrypted','Run Resume-BitLocker: protection is suspended','Turn Secure Boot on in msinfo32, since protection follows it','Decrypt and encrypt again with XtsAes256'],1,'Encrypted and protected differ; after resuming, confirm the recovery password is escrowed. <a href="#freshman/f5">Review: First look at Windows</a>',{whys:['Encrypted with protection Off leaves the key unprotected on the disk.','Resume-BitLocker turns protection back on, so the key waits for the TPM again.','msinfo32 reports Secure Boot State; the finding here is suspended protection.','Re-encrypting takes hours and leaves the real finding, protection Off, in place.'],imp:'core',c:'host-disk-encryption'}]
   ]),
   C('Downloads and USB drives','Apply',
     P('Downloads and saved email attachments carry the <b>Mark of the Web</b> (<a href="#freshman/f11">The web and the cloud in plain words</a>). It is a hidden <b>Zone.Identifier</b> stream recording where the file came from, which SmartScreen and Office act on:'),
     TERM('PS> Get-Item .\\invoice.zip -Stream * | Select-Object Stream,Length\n\nStream          Length\n------          ------\n:$DATA           48213\nZone.Identifier    114\n\nPS> Get-Content .\\invoice.zip -Stream Zone.Identifier\n[ZoneTransfer]\nZoneId=3\nHostUrl=https://files.example/dl/invoice.zip'),
     TIPS('<b>ZoneId=3</b> is the internet (0 this computer, 1 intranet, 2 trusted, and 4 restricted). Check HostUrl against where the user says the file came from.',
          '<b>Keep the mark.</b> <code>Unblock-File</code> and the Unblock box in Properties remove it, so use them only on an expected file from a trusted source.',
          'Windows copies the mark onto files from a marked ZIP or ISO; some archive tools drop it, so treat extracted files as fresh downloads.',
          '<b>USB drives.</b> Turn AutoPlay off in Settings &gt; Bluetooth &amp; devices &gt; AutoPlay; a keyboard-posing stick slips past storage rules, so keep unknown devices unplugged.',
          '<b>Removable Disks: Deny write access</b> stops copying out; <b>All Removable Storage classes: Deny all access</b> blocks every storage type (gpedit.msc, System &gt; Removable Storage Access).',
          '<b>BitLocker To Go</b> encrypts a drive that leaves the building, so a lost stick stays unreadable.',
          '<b>Weigh the block.</b> Kahikina High teachers bring slides on drives; the brief decides. A middle road allows reads, denies writes, and lets real-time protection scan.')),

     ['Harden','Accounts, policy, firewall, services, and auto-start places, each in your log','l2'],

   ],{intro:'Order matters: firmware guards the install, and the snapshot captures a patched, hardened machine.',

   SPOT('s2sp','Spot the problems: net accounts','The brief says to follow the CIS Benchmark. Tap every line that is a finding, then Check.',[
     ['Force user logoff how long after time expires?:       Never','Sessions keep running after an account’s logon hours end. CIS and Microsoft both set Force logoff when logon hours expire to Enabled (net accounts /forcelogoff:0).'],
     ['Minimum password age (days):                          0','Users can change a password and immediately change it back, defeating history. CIS: 1 or more.'],

     ['Minimum password length:                              0','Blank passwords allowed. CIS: 14 or more.'],
     ['Length of password history maintained:                None','Old passwords can be reused. CIS: 24.'],

     ['Computer role:                                        WORKSTATION',null]

   QUIZ('s2q','Check: Windows judgment',[
     ['A laptop with an unencrypted disk is stolen from a car, and its files are backed up elsewhere. Which CIA goal is now at risk?',['Integrity','Confidentiality','Availability','Accounting'],1,'Disk encryption, such as BitLocker, protects confidentiality once the hardware leaves your control.',{whys:['Integrity means the data stays unchanged; here the thief can read it, a secrecy problem.','Anyone holding the unencrypted disk can read the files.','The backup keeps the files available, so availability holds.','Accounting records who did what; the CIA triad is confidentiality, integrity, and availability.'],imp:'core',c:'sec-cia'}],
     ['A user keeps backups on a USB drive that stays plugged into the same desk, plus a folder that syncs every change to the cloud. Does that meet the 3-2-1 rule and survive ransomware?',['Yes: three copies sit on two kinds of storage','Partly: both copies stay reachable, so one copy needs to stay offline or unchangeable','Yes: cloud storage always survives ransomware','Only once a VM snapshot exists'],1,'3-2-1: three copies, two kinds of storage, and one off site; against ransomware, keep one offline or unchangeable.',{whys:['The count fits, yet both copies stay reachable, so ransomware can reach them too.','A plugged-in drive and a syncing folder both take the damage; an offline or unchangeable copy survives.','Sync copies every change, so encrypted files replace the good ones in the cloud.','A snapshot sits beside the VM it rolls back; the rule asks for an offline or off-site copy.'],imp:'core',c:'win-backup-perf'}],
     ['You find shell.aspx in C:\\inetpub\\wwwroot, and the brief describes a site of static pages. What comes first?',['Delete it at once','Open it in a browser to see what it does','Record its path and hash and answer any question about it, then remove it','Leave it, since the web server needs its files'],2,'A planted web-root script is a likely webshell: evidence first, then removal; browsing to it would run it.',{whys:['Deleting first destroys the evidence that answers questions about the file.','Opening it through the web server runs the script, which is the very risk.','The path and hash keep the evidence, and removal then closes the backdoor.','A site of static pages runs without server scripts, so this file falls outside the brief.'],imp:'core',c:'host-forensics'}],
     ['You turn Defender real-time protection on, and it switches off again a few minutes later. Where do you look?',['Windows Update history','The Startup tab in Task Manager','The firewall’s inbound rules','gpedit.msc, for a policy that turns Defender off'],3,'Set the overriding policy to Not Configured, then turn protection back on.',{whys:['Update history lists installed fixes rather than settings that switch Defender off.','The Startup tab lists sign-in apps; a policy flips Defender back.','Firewall rules filter traffic and leave Defender’s switch alone.','A policy re-applies over the toggle, and gpedit.msc shows it.'],imp:'core',c:'host-antivirus'}],
     ['You will clone one hardened Windows VM into six lab stations. When do you turn on BitLocker?',['On each station after it is deployed, so every device gets its own recovery key','In the template, just before the baseline snapshot','Never, because a virtual machine can’t use BitLocker','Before installing, so Windows lands on an encrypted disk'],0,'Generalize with Sysprep, deploy, then encrypt each station. <a href="#freshman/f4">Review: Computers, virtualization, and the network</a>',{whys:['Each station creates its own key when it encrypts, so one leaked key opens one disk instead of all six.','Clones of an encrypted template share one key, so one leak opens all six.','A VM with a virtual TPM runs BitLocker like a physical PC, and skipping it leaves six readable disks.','Encrypting before install still bakes one key into the template every clone copies.'],imp:'good',c:'host-disk-encryption'}],
     ['You run <code>sc.exe config Spooler start=disabled</code>, and sc.exe prints its usage text instead of SUCCESS. What fixes it?',['Run the command twice','Put a space after the equal sign: start= disabled','Use start=off instead','Stop the service first, since sc.exe changes only stopped services'],1,'Confirm the fix: sc.exe qc Spooler then shows START_TYPE 4 DISABLED.',{whys:['The same typo fails the same way each time.','sc.exe takes start= as one word and the value as the next one, so the space makes it work.','The start values are boot, system, auto, demand, disabled, and delayed-auto; off is outside that list.','sc.exe config changes a running service too; the stop stands apart from the start type.'],imp:'core',c:'host-services'}],
     ['netsh advfirewall firewall show rule lists an inbound Allow rule named Kona Print Relay (TCP-In), yet <code>Remove-NetFirewallRule -Name "Kona Print Relay (TCP-In)"</code> finds no rule. Why?',['The rule is already gone','netsh prints the DisplayName; -Name wants the internal ID, so use -DisplayName','PowerShell manages outbound rules only','The firewall must be off first'],1,'Pass netsh rule names to -DisplayName, then run show rule again to confirm.',{whys:['netsh still lists it, so the rule exists; the cmdlet searched the wrong field.','netsh’s Rule Name is the DisplayName, while -Name holds an internal ID that often looks like a GUID.','The NetSecurity cmdlets manage inbound and outbound rules alike.','Rules change while the firewall runs; switching it off would open the machine.'],imp:'core',c:'host-firewall'}],
     ['The brief asks for AutoPlay off on KAILUA-WS07, and you are about to run <code>reg add … /v NoDriveTypeAutoRun /t REG_DWORD /d 255 /f</code>. What comes first?',['Nothing: /f makes it safe','reg export the Policies\\Explorer key to a .reg file and note the change in your log','Delete the Explorer key so the new value starts clean','Restart, so the registry is unlocked'],1,'The export is your undo; after the change, reg query the value and expect 0xff.',{whys:['/f only skips the overwrite prompt, so an old value vanishes without a question.','reg import writes the exported values back, and the log explains the change.','Deleting the key wipes every other value in it, a bigger change than the brief asks for.','The registry is open for changes while Windows runs; the value applies once Explorer restarts, as it does at the next sign-in.'],imp:'good',c:'host-change-log'}],
     ['In PowerShell, <code>del /s /a C:\\Users\\*.mp3</code> stops with a positional parameter error. The brief lists .mp3 as prohibited. Best next step?',['Add -Force to the same line','List the matches with Get-ChildItem -Recurse -Force -Include *.mp3, review them, then pipe that list to Remove-Item (or run del /s /a in Command Prompt)','Delete C:\\Users\\*.mp3 by hand in each top folder only','Give up on hidden files'],1,'In PowerShell, del means Remove-Item: find, review, then delete in the shell whose syntax you use.',{whys:['The /s and /a switches still break Remove-Item, with or without -Force.','The list shows every match, hidden ones too, before anything goes, and the pipe deletes exactly that list.','Prohibited files hide in subfolders such as Music and Downloads, which a top-level delete misses.','-Force in PowerShell and /a in Command Prompt both include hidden files.'],imp:'core',c:'host-prohibited-files-software'}]
   ]),
   DETAIL('Snapshots in each hypervisor',TIPS('<b>VirtualBox:</b> in the VM window, Machine &gt; Take Snapshot; to revert, open the VM’s Snapshots view in VirtualBox Manager, select the snapshot, and choose Restore.','<b>VMware Workstation:</b> VM &gt; Snapshot &gt; Take Snapshot, and VM &gt; Snapshot &gt; Revert to Snapshot; Snapshot Manager lists them all.','<b>Hyper-V</b> calls them checkpoints: right-click the VM in Hyper-V Manager and choose Checkpoint; Apply restores it. PowerShell: Checkpoint-VM -Name VM -SnapshotName "before hardening", then Restore-VMCheckpoint.',
          'Production checkpoints capture the disk alone; standard checkpoints add memory, so a standard checkpoint restores running programs too.','Name each snapshot for the moment it marks, such as "before hardening".')),
   LAB('s2lab','Lab: harden a Windows VM you own','Use a snapshot first. Tick each step as you do it, and write each change in your log.',[
     ['Take a snapshot named "before hardening".',null,'Each hypervisor names this step differently; the <b>Snapshots in each hypervisor</b> panel above lists the menu paths.'],
     ['Disable Guest and confirm it shows Enabled: False.','Disable-LocalUser -Name Guest; Get-LocalUser Guest'],
     ['Create a test user, give it admin, then remove the admin membership again.','net user test * /add; Add-LocalGroupMember -Group Administrators -Member test; Remove-LocalGroupMember -Group Administrators -Member test'],
     ['Set password length, age, history, and lockout, then verify.','net accounts /minpwlen:14 /maxpwage:365 /minpwage:1 /uniquepw:24 /lockoutthreshold:5 /lockoutduration:15 /lockoutwindow:15; net accounts'],
     ['Enable complexity in secpol.msc > Account Policies > Password Policy.','secpol.msc'],
     ['Turn every firewall profile on with default inbound Block.','Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -DefaultInboundAction Block'],
     ['Confirm Defender is on and signatures are current.','Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,AntivirusSignatureLastUpdated'],
     ['List listening ports and record each port with its owning process in your log.','Get-NetTCPConnection -State Listen | Select-Object LocalPort,OwningProcess','Match each PID with Get-Process -Id; <a href="#sophomore/s4">Services and ports</a>, two units on, shows how to judge each one.'],
     ['Create a folder, break inheritance, and give one group Modify.','icacls "C:\\Shared" /inheritance:d'],
     ['Revert to the snapshot and do it again, faster.',null]
   ]),
   REFLECT('s2r','Your first Windows change log','Pick three changes you made or would make on a Windows 11 lab: an account, a policy, and a service. For each, write the one line you would put in the change log: time, machine, what you did, and how to undo it. Then name the check that proves each change took effect.'),

 {id:'s3',title:'Debian-family hardening',bloom:'Apply',sum:'Accounts, sudo rules, shadow fields, ufw, packages, quick checks, safe edits, SSH keys, and unauthorized files: the Linux half of hands-on hardening.',
  can:'harden a Debian-family machine by hand: accounts, sudo, shadow fields, ufw, packages, safe edits, SSH keys, and unauthorized files',
  blocks:[
   LAB('f6lab','Lab: read a Linux VM before you change it','Freshman’s <a href="#freshman/f6">First look at Linux</a> named these commands; now you run them. On a Debian VM you own, do each step and tick it. Every step reads and leaves the machine as it was, so your notes become the baseline for the hardening below.',[
     ['Open a terminal and print where you are and who you are.','pwd; whoami; id'],
     ['Check which release you are on.','cat /etc/os-release'],
     ['List the human accounts on the machine.','awk -F: \'$3 >= 1000 && $3 < 65534 {print $1}\' /etc/passwd'],
     ['List the sudo group.','getent group sudo'],
     ['Read the manual page for ls and find what -a and -l mean.','man ls'],
     ['Show the last 20 SSH sign-in events. Debian 12 and later keep them in the systemd journal; /var/log/auth.log appears once rsyslog is installed.','sudo journalctl -u ssh -n 20'],
     ['List the firewall rules; empty output means none are loaded. Debian ships nftables without a frontend, and sudo apt install ufw adds ufw.','sudo nft list ruleset']
   ]),
   C('Snapshots and the login screen','Understand',
     TIPS('<b>Snapshots.</b> <b>Timeshift</b> (sudo apt install timeshift) snapshots system files, and Déjà Dup copies personal files.',
          '<b>Login screen</b> (GDM with GNOME, LightDM with most other desktops): turn off automatic login, timed login, and guest sessions, which hand the desktop to anyone at the keyboard.',
          'An idle screen lock closes the same gap for a desktop left open.')),
   DETAIL('The Debian family: one base, many update tools',
     TIPS('<b>One base.</b> Every Debian-family system sits on <code>apt</code> and <code>dpkg</code>, so <code>sudo apt update &amp;&amp; sudo apt upgrade</code> works on each. Debian ships nftables without a frontend; <code>sudo apt install ufw</code> adds ufw, and gufw is its graphical front end.',
          '<b>Updates.</b> Debian patches automatically through <code>unattended-upgrades</code>, so updates land even when nobody signs in (commands below). A derivative can add a graphical update tool of its own; read its settings too.')),
   C('Accounts and sudo','Apply',
     CMDS('Compare to the scenario brief, then act',[
       ['awk -F: \'$3 >= 1000 && $3 < 65534 {print $1}\' /etc/passwd','Human accounts.'],
       ['getent group sudo','Administrators across the Debian family.'],
       ['id -nG malia','Every group malia is in, the primary group (field 4 of /etc/passwd) included; getent group sudo misses an account whose primary group is sudo.'],
       ['getent group shadow nopasswdlogin','Both member lists should be empty: shadow members read every password hash; nopasswdlogin members can sign in at a LightDM login screen without a password.'],
       ['sudo gpasswd -d NAME GROUP','Remove a member; /etc/gshadow updates too.'],
       ['sudo passwd -S -a','Column 2 shows each password’s state: P set, L locked, and NP none. NP is a finding; root reads L when the installer left root’s password empty.'],
       ['sudo usermod -L -e 1 svc_update; sudo pkill -KILL -u svc_update','Lock the account and end its processes first: deluser calls userdel, which refuses an account with running processes and leaves it half removed.'],
       ['sudo deluser --remove-home svc_update','Remove an unauthorized user and its home folder (elsewhere: sudo userdel -r svc_update).'],
       ['sudo gpasswd -d kawika sudo','Remove kawika from sudo and keep the user. Group changes apply at the next sign-in, so end kawika’s open sessions with sudo loginctl terminate-user kawika.'],
       ['sudo usermod -aG sudo malia','Add malia to sudo. -a (append) keeps malia’s other groups; without it, they are replaced.'],
       ['sudo addgroup designers; sudo gpasswd -M malia,keola designers','Create a group the brief requires, then set its whole member list in one step; getent group designers proves it.'],
       ['sudo passwd -l tmpuser','Lock tmpuser’s password while you ask about it; sudo chage -E 0 tmpuser also stops key sign-in.'],
       ['sudo passwd keola','Set a strong password for an account with a weak one.'],
       ['sudo visudo','Edit sudoers safely, then read every file in /etc/sudoers.d/.']
     ])),
    HIER('Every road to root on Linux',
     {name:'Full control: UID 0',note:'The kernel grants it to user ID 0, whatever the account is called',tone:'bad',children:[
       {name:'Be UID 0',note:'Any line in /etc/passwd with 0 in the third field',tone:'l4',children:[
         {name:'root',note:'Expected. <code>PermitRootLogin no</code> keeps it off SSH',tone:'l3'},
         {name:'Any other UID 0 account',note:'Such as <code>sysadm:x:0:0</code>: a second root and a backdoor. Remove it',tone:'bad'}]},
       {name:'Borrow UID 0',note:'Run commands as root from another account',tone:'l2',children:[
         {name:'sudo group (wheel on some distributions)',note:'Members run commands as root after typing their own password, through the <code>%sudo</code> rule in /etc/sudoers',tone:'l2'},
         {name:'NOPASSWD rule',note:'Skips that password prompt. Read /etc/sudoers and every file in /etc/sudoers.d/',tone:'amber'},
         {name:'Defaults !authenticate',note:'Turns the password prompt off for everyone, or for one account with <code>Defaults:NAME</code>. Delete the line with visudo; sudo asks for the password by default',tone:'amber'},
         {name:'Other group rules',note:'Debian’s /etc/sudoers grants only <code>%sudo</code>; any other % line, such as <code>%admin ALL=(ALL) ALL</code>, makes that group a second sudo group',tone:'amber'},
         {name:'su',note:'Opens a whole root shell with root’s own password, which stays locked when the installer left it empty',tone:'l1'}]},
       {name:'Act as root another way',note:'Root-equivalent groups: <b>docker</b> and <b>lxd</b> can mount the host’s files, and <b>disk</b> reads raw disks, password hashes included. (<b>adm</b> only reads logs.)',tone:'amber',children:[
         {name:'SUID files no package owns, and file capabilities',note:'<code>sudo find / -perm -4000 -type f</code>, then <code>dpkg -S PATH</code> for each (retry /usr/bin/X as /bin/X): “no path found” on both is a finding. <code>sudo getcap -r /</code>: cap_setuid on python3 or perl equals root',tone:'bad'}]}]},
     {note:'Four checks cover every road: <code>awk -F: \'$3 == 0 {print $1}\' /etc/passwd</code> should print root alone; <code>getent group sudo admin docker lxd disk</code> should list the brief’s administrators alone; read <code>sudo visudo</code> and /etc/sudoers.d/ (<code>sudo grep -rn -e NOPASSWD -e \'!authenticate\' /etc/sudoers /etc/sudoers.d/</code> finds both password skips); then run the SUID and getcap checks above.',
      caption:'Remove any sudoers rule the brief leaves unexplained.'}),
   ANATOMY('One /etc/shadow line, nine fields',[
    {name:'keola’s line in /etc/shadow',tag:'root and the shadow group read it',tone:'l2',grid:true,
     text:'<code>keola:$y$j9T$Vd1k…$ktG2…</code><wbr><code>:20727:1:365:7:30::</code>',
     children:[
      {name:'keola',tag:'1 name',tone:'l1',text:'As in /etc/passwd'},
      {name:'$y$j9T$…',tag:'2 hash',tone:'l4'},
      {name:'20727',tag:'3 last change',text:'Days since 1 Jan 1970: 1 Oct 2026; 0 forces a new password at the next sign-in'},
      {name:'1',tag:'4 min'},
      {name:'365',tag:'5 max'},
      {name:'7',tag:'6 warn'},
      {name:'30',tag:'7 inactive'},
      {name:'(empty)',tag:'8 expire',tone:'muted'},
      {name:'(empty)',tag:'9 reserved',tone:'muted'}]},
    {name:'Field 2 opened up',tag:'$ splits it',tone:'l3',grid:true,children:[
      {name:'$y$',tag:'id',tone:'l1',text:'yescrypt, the current default'},
      {name:'j9T',tag:'cost settings',tone:'amber',text:'Work per guess'},
      {name:'Vd1kq0aB…',tag:'salt',tone:'l3',text:'Random per account, not secret'},
      {name:'ktG2Hn8w…Rn0',tag:'hash',tone:'l4',text:'From the password, salt, and cost'}]}
   ],{bloom:'Apply',
     facts:{head:['Field 2 shows','Meaning'],rows:[
      ['<code>$6$…</code>','SHA-512-crypt: older installs, FreeBSD'],
      ['<code>$1$…</code>','MD5-crypt: salted but fast; replace it'],
      ['<code>!</code> before the hash','Password locked (<code>passwd -l</code>)'],
      ['<code>*</code> or <code>!</code> alone','Password sign-in off'],
      ['Empty','Sign-in with no password: fix it now']]},
     note:'<b>The salt</b> (<a href="#freshman/f10">Keys, locks, and certificates</a>) gives keola and pua different hashes for the same password, so precomputed tables fail; the cost makes each guess slow. <code>sudo chage -l keola</code> reads fields 3 to 8.',
     caption:'Name, hash, six aging fields, and one reserved field.'}),
   QUIZ('s3cy','Check yourself',[
     ['keola and pua share a password. Their /etc/shadow lines start <code>keola:$y$j9T$Vd1k…$ktG2…</code> and <code>pua:!$y$j9T$Qm…$Zp8…</code>. Which is true?',['One of the two passwords is unsalted','pua’s password is locked, and different salts give the two accounts different hashes','The ! means SHA-512-crypt','The cost settings make the hashes differ'],1,'passwd -l locks only the password; sudo chage -E 0 pua stops every sign-in, keys included.',{whys:['Both lines carry a salt (Vd1k… and Qm…), so both are salted.','The ! marks pua’s password locked, and different salts give different hashes.','$y$ marks yescrypt; the ! means a locked password.','Both costs read j9T, so the salts make the difference.'],imp:'good',c:'crypto-salted-hashes'}]

   C('Password policy','Apply',
     CMDS('Aging and quality',[
       ['sudo nano /etc/login.defs','Set PASS_MAX_DAYS 365, PASS_MIN_DAYS 1, and PASS_WARN_AGE 7 (or what your policy says). Applies to new accounts.'],
       ['sudo chage -M 365 -m 1 -W 7 malia','Apply the same aging to an existing user. sudo chage -l malia to view.'],
       ['sudo apt install libpam-pwquality','Password quality module.'],
       ['sudo nano /etc/pam.d/common-password','On the pam_pwquality.so line add: retry=3 minlen=14 (the CIS value; NIST SP 800-63B-4 requires 15 or more for a password used alone, so set minlen=15 when the brief follows NIST). Add character-class rules (ucredit=-1 and so on) only if your policy requires them; NIST favors length over composition rules.'],
       ['sudo nano /etc/security/faillock.conf','Lockout with pam_faillock (Debian 11 and later): deny = 5 and unlock_time = 900, then enable pam_faillock with pam-auth-update profiles (Deeper detail below).'],
       ['sudo faillock --user keola','keola’s recent failed sign-ins: when, the source, and V for each failure that still counts toward the lock.'],
       ['sudo faillock --user keola --reset','Clears keola’s count and unlocks the account, once you know who was guessing.']
     ]),
     NOTE('Snapshot before PAM edits, and keep a root terminal open. A typo in common-password or common-auth can lock everyone out, including you.',true),
     DETAIL('Linux account, PAM, login-screen, and SSH settings',TIPS('<b>Accounts:</b> force a password change with sudo chage -d 0 NAME (or passwd -e); disable without deleting with usermod -L plus usermod -s /usr/sbin/nologin.',
          'When the installer left root’s password empty, root stays locked (passwd -S root reads L), so every admin action goes through sudo and lands in the log.','A graphical account tool can put a new account in nopasswdlogin until its password is set; a group the release lacks prints no line.','<b>pwquality.conf keys:</b> minlen, dcredit, ucredit, lcredit, ocredit, difok, maxrepeat, and enforce_for_root; add the class rules only when the policy asks.',
          '<b>One place per number:</b> an argument on the pam_pwquality.so line overrides the same key in /etc/security/pwquality.conf, so set each number once.','<b>Test a candidate:</b> <code>echo \'CANDIDATE\' | pwscore</code> (package libpwquality-tools) scores it against the policy and changes nothing.','<b>History and hashing:</b> remember=5 on the pam_unix.so line in common-password (or pam_pwhistory); keep that line on its yescrypt default, since adding sha512 there turns every new hash into $6$.','<b>Test as the user:</b> root’s sudo passwd NAME skips pam_unix’s minlen and remember checks; run su - NAME, then passwd, to see them apply.',
          '<b>Root gets a warning only:</b> pam_pwquality warns root and still accepts the password unless enforce_for_root is set.','<b>Lockout with pam_faillock, through pam-auth-update:</b> the three profiles below, then <code>sudo pam-auth-update --enable faillock faillock_reset faillock_notify</code>; <code>grep pam_faillock /etc/pam.d/common-auth</code> shows preauth, authfail, and authsucc.',
          '<b>Why profiles:</b> pam-auth-update builds each common-* file from /usr/share/pam-configs and recounts every [success=N] jump, so pam_sss and fingerprint lines keep working.',
          '<b>Packages use the same path:</b> installing libpam-pwquality adds a profile, and pam-auth-update writes its pam_pwquality.so line into common-password.','<b>One hand-added line freezes it:</b> pam-auth-update then answers “Local modifications to /etc/pam.d/common-*, not updating.” Run pam-auth-update before any hand edit.',
          '<b>Option edits survive:</b> removing nullok from a line is kept; <code>--force</code> rewrites the files, saves your copies as *.pam-old, and can bring nullok back.','<b>faillock.conf</b> sets deny, fail_interval, and unlock_time; a pam_faillock line argument overrides the file. unlock_time = 0 locks until an administrator runs faillock --user NAME --reset.',
          '<b>Test safely:</b> keep a second root terminal open, try su - NAME, and read faillock --user NAME; root stays exempt unless even_deny_root is set.',
          '<b>A reboot clears every lock:</b> pam_faillock keeps its records in /var/run/faillock, a folder emptied at each boot.','<b>Automatic updates:</b> /etc/apt/apt.conf.d/20auto-upgrades with APT::Periodic::Update-Package-Lists "1" and APT::Periodic::Unattended-Upgrade "1".','<b>Login screen:</b> GDM: /etc/gdm3/daemon.conf [daemon] AutomaticLoginEnable=false and TimedLoginEnable=false. LightDM: /etc/lightdm/lightdm.conf [Seat:*] autologin-user= (empty) and allow-guest=false.',
          '<b>Screen lock:</b> gsettings org.gnome.desktop.screensaver (GNOME) or org.cinnamon.desktop.screensaver (Cinnamon) lock-enabled true and lock-delay 0; idle-delay 300 under org.gnome.desktop.session (GNOME) or org.cinnamon.desktop.session (Cinnamon).','<b>SSH extras:</b> MaxAuthTries 3 or 4, LoginGraceTime 30, and AllowUsers malia keola. PermitUserEnvironment no, the default, keeps ~/.ssh/environment from setting LD_PRELOAD. Turn ufw logging on.',
          '<b>Dead link versus idle shell:</b> ClientAliveInterval 600 with ClientAliveCountMax 1 closes a dead link; a live client answers automatically, so idle shells stay open.',
          '<b>Ending idle shells:</b> readonly TMOUT=600 in a file under /etc/profile.d ends a shell left idle for 600 seconds.','<b>When ssh.socket is enabled</b> (Debian starts ssh.service at boot; a derivative can switch to the socket), it holds port 22 (systemctl status ssh.socket), so disabling ssh.service leaves it open.','A Port change needs sudo systemctl daemon-reload &amp;&amp; sudo systemctl restart ssh.socket before the new port listens.',
          '<code>sshd -t</code> and <code>sshd -T</code> stop at <code>Missing privilege separation directory: /run/sshd</code>; create that folder with <code>sudo mkdir -p /run/sshd</code>, then test again.',
          'With the socket, the first SSH sign-in after boot starts ssh.service, which creates /run/sshd; until then, the test stops at that error.','<b>Windows:</b> its NT hash is unsalted and fast, so one stolen hash fits every account sharing that password.'),
       TERM('$ cat /usr/share/pam-configs/faillock_notify\nName: faillock preauth (refuse a locked account)\nDefault: no\nPriority: 1024\nAuth-Type: Primary\nAuth:\n        requisite pam_faillock.so preauth\n$ cat /usr/share/pam-configs/faillock\nName: faillock authfail (count a failed sign-in)\nDefault: no\nPriority: 0\nAuth-Type: Primary\nAuth:\n        [default=die] pam_faillock.so authfail\n$ cat /usr/share/pam-configs/faillock_reset\nName: faillock authsucc (clear the count after success)\nDefault: no\nPriority: 0\nAuth-Type: Additional\nAuth:\n        required pam_faillock.so authsucc'))),

   C('Firewall, updates, and services','Apply',
     CMDS('ufw, apt, and systemd',[
       ['sudo ufw default deny incoming','Only allowed traffic comes in.'],
       ['sudo ufw default allow outgoing','Normal outbound traffic.'],
       ['sudo ufw allow 22/tcp','Only if the brief needs SSH. Same pattern for 80/tcp, 443/tcp.'],
       ['sudo ufw enable','Turn it on. sudo ufw status verbose to confirm.'],
       ['sudo ufw status numbered','Every rule with its number. Read it before you delete one.'],
       ['sudo ufw delete allow 23/tcp','Deletes a rule by its text, the IPv4 and IPv6 copies together.'],
       ['sudo ufw delete 3','Deletes rule 3 after you answer y. The numbers shift after each delete, so list again before the next one.'],
       ['sudo apt update && sudo apt upgrade -y','Patch everything, then check the sources and automatic updates below.'],
       ['apt-cache policy | grep -- -security','The proof that security updates can arrive: trixie-security lines at priority 500 on Debian 13. A missing line means the security source is off (read /etc/apt/sources.list and /etc/apt/sources.list.d/); a priority of -1 or 1 means a pin in /etc/apt/preferences.d holds them back.'],
       ['sudo apt install unattended-upgrades && sudo dpkg-reconfigure -plow unattended-upgrades','Automatic security updates on: answering Yes writes /etc/apt/apt.conf.d/20auto-upgrades.'],
       ['sudo unattended-upgrade --dry-run -d 2>&1 | grep \'Allowed origins\'','The proof: on Debian 13 the list names codename=trixie-security,label=Debian-Security. The dry run installs nothing.'],
       ['sudo ss -tulnp','Listening TCP and UDP sockets with the owning process.'],
       ['systemctl list-units --type=service --state=running','Running services.'],
       ['systemctl list-sockets','Sockets systemd listens on for services it starts on demand, such as ssh.socket on port 22.'],
       ['sudo systemctl disable --now vsftpd','Stop and disable a service the brief leaves out; sudo apt purge vsftpd then removes it and its configuration files.'],
       ['sudo apt purge telnetd','Remove insecure packages (telnetd, rsh-server) the brief leaves out.'],
       ['sudo timeshift --create --comments "before hardening"','A system snapshot from the command line before risky changes (sudo apt install timeshift first).']
     ]),
     NOTE('<b>Type option dashes yourself.</b> A copied command can carry a long dash (–) in place of two hyphens. Then systemctl reads the option as a unit name and answers 0 loaded units listed, which looks clean.')),

   C('Browser protections on Debian','Apply',
     TIPS('<b>Firefox</b> (Settings &gt; Privacy &amp; Security): keep <b>Block dangerous and deceptive content</b> and both sub-options ticked, and turn on <b>HTTPS-Only Mode in all windows</b>.',
          'HTTPS-First, the Firefox default, upgrades a link and falls back to http:// quietly; HTTPS-Only asks before any http:// page loads.',
          '<b>Set them for every user</b> in /etc/firefox/policies/policies.json; this forces HTTPS-Only and removes the Safe Browsing bypass button: <code>{"policies": {"HttpsOnlyMode": "force_enabled", "DisableSecurityBypass": {"SafeBrowsing": true}}}</code>. <a href="#sophomore/s2">Windows 11 hardening</a> explains browser policy.',
          '<code>about:policies</code> lists each active policy and its Errors tab names a typo; <code>"InstallAddonsPermission": {"Default": false}</code> blocks new extensions when the brief rules them out.',
          '<b>Chromium:</b> Settings &gt; Privacy and security &gt; Security &gt; Enhanced protection, or the managed policy <code>"SafeBrowsingProtectionLevel": 2</code>; <code>chrome://policy</code> shows each policy with its status.',
          '<b>Updates</b> come with the system through apt, which carries Firefox as firefox-esr; the About window shows the version.',
          'A hold freezes updates: <code>apt-mark showhold</code> lists held packages, and <code>sudo apt-mark unhold firefox-esr</code> releases one.',
          '<b>Extensions:</b> <code>about:addons</code> and <code>chrome://extensions</code> list them; compare each with the brief, as with any software.')),
   C('Four quick checks: clock, network, disk, and backups','Apply',
     CMDS('Read, then fix',[
       ['timedatectl status','NTP (UDP 123) keeps clocks on one time, so log lines sort across devices. Debian runs systemd-timesyncd or chrony (chronyc tracking); either one shows System clock synchronized: yes; on no, run sudo timedatectl set-ntp true.'],
       ['ip -br a; ip route','Addresses and the default route; explain anything extra. nmcli connection show lists saved connections where NetworkManager runs; a Debian server without it reads /etc/network/interfaces.'],
       ['lsblk -f','A crypto_LUKS partition means full-disk encryption: data stays safe while the machine is off.'],
       ['sudo rsync -a /home/ /mnt/backup/home/','Copies the home folders Timeshift leaves out. A backup counts after a test restore, with a copy off the machine.']
     ])),
   C('Create, copy, move, and delete','Apply',
     CMDS('Everyday file work',[
       ['touch notes.txt; mkdir -p ~/audit/day1','Make a file; make a folder and its parents.'],
       ['sudo cp -a sshd_config sshd_config.bak','Copy; -a keeps owner, mode, and times.'],
       ['mv report.txt ~/audit/','Move or rename.'],
       ['rm -i old.txt','rm skips the trash, so -i asks first. Record path, owner, and hash before a file goes.']
     ])),
   SEQ('A safe configuration edit',[
     ['Copy','<code>sudo cp -a FILE FILE.bak</code>'],
     ['Edit','One change at a time'],
     ['Test','<code>sudo sshd -t</code>, <code>sudo visudo -c</code>, or <code>sudo apache2ctl configtest</code>'],
     {ask:'Did the test pass?',branches:[['Yes','Reload: <code>sudo systemctl reload ssh</code>'],['No','Restore the .bak and test again']]},
     ['Verify','From a second session: <code>sudo sshd -T</code> or a fresh sign-in'],
     ['Log','The change and its undo']
   ],{bloom:'Apply',
     note:'Keep the first session open until the second proves the change. Where ssh.socket starts SSH on demand, run <code>sudo mkdir -p /run/sshd</code> before the first test after a boot, and restart when ssh.service is inactive. <a href="#sophomore/s6">The change log</a> shows the line format.'}),
   C('Change one line with sed','Apply',
     P('<code>sed</code>, the stream editor, reads a file line by line and rewrites each line a pattern matches, so it changes one setting without opening an editor. Use it with the copy, test, and verify steps above.'),
     TERM('$ grep PASS_MAX_DAYS /etc/login.defs\n#       PASS_MAX_DAYS   Maximum number of days a password may be used.\nPASS_MAX_DAYS   99999\n$ sed -n \'s/^PASS_MAX_DAYS.*/PASS_MAX_DAYS   90/p\' /etc/login.defs\nPASS_MAX_DAYS   90\n$ sudo sed -i.bak \'s/^PASS_MAX_DAYS.*/PASS_MAX_DAYS   90/\' /etc/login.defs\n$ grep \'^PASS_MAX_DAYS\' /etc/login.defs.bak /etc/login.defs\n/etc/login.defs.bak:PASS_MAX_DAYS       99999\n/etc/login.defs:PASS_MAX_DAYS   90'),
     CMDS('Read the command piece by piece',[
       ['s/OLD/NEW/','Substitute: on each line where OLD matches, the matched text becomes NEW.'],
       ['^PASS_MAX_DAYS','^ anchors the match to the start of the line, so the comment line, which starts with #, stays as it is.'],
       ['.*','Any characters to the end of the line, so the old value goes too.'],
       ['\'…\'','Single quotes hand the whole command to sed, so the shell leaves the * and the spaces alone.'],
       ['sed -n \'s/…/…/p\' FILE','The test run: prints only the lines the edit would write and changes nothing. Run it first.'],
       ['-i.bak','In place: sed saves the original as FILE.bak, then writes the change into FILE. Keep .bak right against -i, with no space.'],
       ['sudo','root owns /etc/login.defs, and sed -i writes a fresh copy inside /etc, so the edit needs root’s rights.'],
       ['grep \'^PASS_MAX_DAYS\' FILE.bak FILE','The proof: one line from each file, the old value and the new.']
     ]),
     NOTE('<b>sed stays quiet.</b> A pattern that matches nothing still reports success, so the grep is the proof. Add a missing key with an editor. Since login.defs sets only new accounts, follow it with <code>sudo chage -M 90 NAME</code> for each existing one.')),
     CMDS('More one-line edits from the Range and the drills',[
       ['sudo sed -i.bak \'s/^#\\?PermitRootLogin.*/PermitRootLogin no/\' /etc/ssh/sshd_config','#\\? matches an optional #, so a commented default line becomes the active setting too. Then run sudo sshd -t.'],
       ['sudo sed -i.bak \'/^autologin-user/d\' /etc/lightdm/lightdm.conf','/PATTERN/d deletes each matching line. Preview it with sed -n \'/^autologin-user/p\' FILE.'],
       ['sudo cp -a /etc/pam.d/common-auth /root/ && sudo sed -i \'s/ nullok\\(_secure\\)\\?//g\' /etc/pam.d/common-auth','Empty NEW deletes the match; g hits every match on the line instead of the first alone. \\(_secure\\)\\? removes the older nullok_secure whole (a bare \' nullok\' would leave pam_unix.so_secure, a module name PAM cannot load). The backup goes to /root because a .bak inside /etc/pam.d keeps answering grep -rn nullok /etc/pam.d/. Keep a root terminal open during PAM edits.'],
       ['diff FILE.bak FILE','Every changed line, old (&lt;) and new (&gt;). Empty output means sed matched nothing.']
     ]),
   C('SSH and unauthorized files','Apply',
     CMDS('sshd_config and find',[
       ['sudo nano /etc/ssh/sshd_config','Set PermitRootLogin no, PermitEmptyPasswords no, and X11Forwarding no (Debian ships X11Forwarding yes in this file). Keep PasswordAuthentication yes unless the brief says keys only. Without a PermitRootLogin line, sshd uses prohibit-password: root’s password fails, and a key in /root/.ssh/authorized_keys still signs in.'],
       ['sudo sshd -t && sudo systemctl restart ssh','Test, then restart (the service is ssh across the Debian family).'],
       ['sudo find /home /root /tmp /var/tmp /dev/shm /srv /opt -xdev -type f \\( -iname "*.mp3" -o -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.mov" -o -iname "*.flac" \\) 2>/dev/null','Media files where people and intruders leave them; /usr/share (the system’s own wallpapers and sounds) stays out.'],
       ['sudo rm -- \'PATH\'','Check the brief, then delete each reviewed path. sudo rm *.mp3 fails in a folder only its owner can open: your own shell expands the * before sudo runs.'],
       ['sudo locate -i "*.mp3"','The fast way: plocate searches the file-name index updatedb builds, rather than the disk (where it is missing: sudo apt install plocate, then sudo updatedb). The index holds only what existed at its last update (a daily timer, or sudo updatedb) and skips /tmp, /var/spool, /media, and memory filesystems such as /dev/shm; without sudo it lists only folders you can open, so finish every hunt with find.'],
       ['sudo find /home /root /tmp /var/tmp /dev/shm /opt -xdev -type f \\( -iname "*.sh" -o -iname "*.py" -o -iname "*.pl" \\) 2>/dev/null','Scripts in home folders and the usual drop spots: read them. file NAME names a script or program by its content when the name lacks an extension.'],
       ['sudo grep -rIil -E \'passw(or)?d|credential|secret\' /home /root /tmp /var/tmp /srv 2>/dev/null','Files whose text names a password, whatever they are called (-I skips programs, and -l prints names alone). Read each one against the brief before it goes.'],
       ['python3 -m zipfile -l FILE.zip; tar -tvf FILE.tar.gz','What an archive holds, listed without extracting it.'],
       ['sudo find / -perm -4000 -type f 2>/dev/null','SUID binaries. Compare to a clean VM; unknown ones are suspicious.'],
       ['dpkg -l | grep -i NAME','Installed .deb packages.'],
       ['dpkg-query -W -f=\'${db:Status-Abbrev} ${binary:Package}: ${binary:Summary}\\n\' | grep \'^ii\' | grep -iE \'crack|sniff|brute|exploit|game\'','Installed packages whose name or summary matches, so a hacking tool or game shows up under any name. netcat-openbsd often comes with the base system, so judge nc by what it runs.'],
       ['zgrep -hE \'Start-Date|Commandline\' /var/log/apt/history.log*','Every apt command run on this machine, each under its date.'],
       ['ls -la /usr/local/bin /usr/local/sbin','Debian packages leave these folders empty, so each program here came by hand or from a tool such as pip. The shell finds it before the same name in /usr/bin.'],
       ['ls -la /home/*/.ssh','Extra authorized_keys entries are backdoors.']
     ])),

     CMDS('Laptop first, then the server',[
       ['ssh-keygen -t ed25519 -C "keola@KAILUA-WS07"','Make a key pair with a passphrase.'],
       ['ssh-copy-id keola@makani-web','Add the public key to authorized_keys. Then sign in with the key and keep that session open.'],
       ['sudo nano /etc/ssh/sshd_config.d/10-keys-only.conf','Server: PasswordAuthentication no and KbdInteractiveAuthentication no, in a file that sorts before 50-cloud-init.conf.'],
       ['sudo sshd -t && sudo systemctl reload ssh','Test, reload, and prove it from a second terminal.']
     ])),
   SPOT('s3sp','Spot the problems: sshd_config','Tap every line that weakens the server, then Check.',[
     ['Port 22',null,'The standard SSH port. A scan finds SSH on any port, so the lines that decide who gets in are the ones to fix.'],
     ['PermitRootLogin yes','Root can log in over the network with a password. Set no.'],
     ['PubkeyAuthentication yes',null],
     ['PasswordAuthentication yes',null,'Password sign-in stays on while people still need it. Turn it off once each person’s key sign-in works, so nobody gets locked out.'],
     ['PermitEmptyPasswords yes','Accounts with empty passwords can log in. Set no.'],
     ['X11Forwarding yes','Unneeded feature with a long history of abuse. Set no.'],
     ['MaxAuthTries 100','Brute force welcome. Set 3 or 4.'],
     ['UsePAM yes',null,'PAM applies the password rules and account locks you set, so sshd should keep using it.'],
     ['Subsystem sftp /usr/lib/openssh/sftp-server',null]
   ]),
   SPOT('s3sp2','Spot the problems: /etc/passwd','The brief says the authorized users are malia and keola, and the only administrator is malia. Tap the suspicious lines, then Check.',[
     ['root:x:0:0:root:/root:/bin/bash',null,'root belongs at UID 0. The finding is a second UID 0 account, so compare every other line to this one.'],
     ['daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin',null],
     ['malia:x:1000:1000:Malia:/home/malia:/bin/bash',null],
     ['keola:x:1001:1001:Keola:/home/keola:/bin/bash',null],
     ['backup:x:34:34:backup:/var/backups:/usr/sbin/nologin',null],
     ['sysadm:x:0:0::/home/sysadm:/bin/bash','A second UID 0 account. This is root under another name: a backdoor.'],
     ['games:x:5:60:games:/usr/games:/usr/sbin/nologin',null,'A built-in system account whose shell is /usr/sbin/nologin, so nobody can sign in with it.'],
     ['tmpuser:x:1002:1002::/home/tmpuser:/bin/bash','Missing from the authorized list. Investigate and remove.']
   ]),
   SPOT('s3sp3','Spot the problems: a sudoers file','The brief: malia is the only administrator, keola and pua are standard users, and the helpdesk group may restart printing. Tap each risky line, then Check.',[
     ['root ALL=(ALL:ALL) ALL',null],
     ['%sudo ALL=(ALL:ALL) ALL',null,'The standard rule: members of the sudo group get root after typing their own password, so group membership is what you audit.'],
     ['malia ALL=(ALL:ALL) ALL',null],
     ['keola ALL=(ALL) NOPASSWD: ALL','Full root, no password, for a standard user. Delete it.'],
     ['pua ALL=(root) NOPASSWD: /usr/bin/vim /etc/hosts','vim can start a shell, so this hands pua root. Use sudoedit or remove it.'],
     ['%helpdesk ALL=(root) /usr/bin/systemctl restart cups',null,'One exact command that restarts printing, which the brief grants, and systemctl restart cups opens no shell.'],
     ['%helpdesk ALL=(root) /usr/bin/less /var/log/syslog','less can start a shell: root for the whole group, and the brief grants printing only. Delete it.'],
     ['svc_update ALL=(ALL) NOPASSWD: ALL','An account the brief never names, with full root: a backdoor. Remove it and investigate.'],
     ['@includedir /etc/sudoers.d',null,'The standard include line. It loads every file in /etc/sudoers.d, so read those files next.']
   ]),
   QUIZ('s3q','Check: Debian-family hardening',[
     ['Which PAM control flag stops the stack at once when its check fails?',['required','sufficient','requisite','optional'],2,'requisite fails immediately. required fails the stack too, after the remaining lines run.',{whys:['required also fails the stack, after the remaining lines run.','sufficient ends the stack early on success and keeps going on failure.','requisite returns failure at once and skips the lines below it, while required waits until they run.','optional counts only when it is the only line of its type.'],imp:'good',c:'lin-pam'}],
     ['You set PASS_MAX_DAYS 90 in /etc/login.defs. Which accounts change?',['Every account at once','Only root','Only members of the sudo group','Only accounts created afterward; sudo chage -M 90 NAME updates each existing one'],3,'login.defs holds the defaults for new accounts, and chage applies aging to the accounts that already exist.',{whys:['login.defs sets defaults for new accounts, so existing ones keep their aging.','root follows the same rule: login.defs reaches new accounts alone.','Group membership plays no part; login.defs applies to new accounts.','New accounts take the default, and chage -M sets each existing account.'],imp:'core',c:'host-password-policy'}],
     ['Before you restart SSH after editing sshd_config, which command catches a typo that would lock everyone out?',['sudo systemctl status ssh','sudo sshd -t','sudo ss -tulnp','sudo ufw status'],1,'sshd -t tests the configuration and prints the error, so you fix it before the restart.',{whys:['systemctl status shows whether ssh runs now and leaves the edited file unread.','sshd -t reads the configuration and names the line with the typo.','ss -tulnp lists listening ports and leaves sshd_config unread.','ufw status shows firewall rules and leaves sshd_config unread.'],imp:'core',c:'host-services'}],
     ['On a Debian-family server you run sudo systemctl disable --now ssh, yet port 22 still listens. Why?',['ssh.socket holds port 22 and starts sshd on demand','ufw reopened the port','sshd ignores systemctl','The change waits for a reboot'],0,'With socket activation the .socket unit owns the port. Disable ssh.socket too when the brief leaves SSH out.',{whys:['ssh.socket listens on port 22 and starts sshd when a connection arrives.','ufw filters traffic; the listening comes from ssh.socket.','sshd follows systemctl; here a second unit, the socket, holds the port.','--now stops the service at once, so a reboot changes nothing here.'],imp:'good',c:'lin-systemd'}],
     ['The brief requires SSH and a web site. sudo ufw status verbose shows <code>Default: deny (incoming), allow (outgoing)</code> and one rule, <code>22/tcp ALLOW IN Anywhere</code>. What is missing?',['A deny rule for 22/tcp','Default allow incoming','Allow rules for the web ports, 80/tcp and 443/tcp','A rule that denies outgoing traffic'],2,'Default deny blocks every inbound port the rules leave out.',{whys:['A deny for 22/tcp would block the SSH the brief requires.','Default allow incoming opens every port, the opposite of hardening.','Default deny blocks the web site until 80/tcp and 443/tcp get allow rules.','Outbound traffic is fine here; the gap is the inbound web ports.'],imp:'core',c:'host-firewall'}],
     ['keola belongs to the docker group, and the brief lists keola as a standard user. Why does that matter?',['docker only serves web pages','docker members can mount the host’s files as root, so the group equals admin power','The group matters only while keola is signed in','docker members only read logs'],1,'docker, lxd, and disk are root-equivalent groups. Remove keola from docker, just as you would from sudo.',{whys:['docker runs containers as root, whatever they serve.','A docker member can start a container that mounts the host’s files, /etc/shadow included, so the group carries the same reach as sudo.','Group power applies to anything keola runs, signed in or not.','adm reads logs; docker grants root-level power.'],imp:'core',c:'host-admin-groups'}],
     ['sshd ignores keola’s new key, and <code>ls -l ~/.ssh/authorized_keys</code> shows <code>-rw-rw-rw- 1 keola keola</code>. What fixes it?',['chmod 600 ~/.ssh/authorized_keys','chmod 777 ~/.ssh','sudo chown root ~/.ssh/authorized_keys','PubkeyAuthentication no'],0,'Anyone could add a key to a file everyone can write, so sshd refuses it. <a href="#freshman/f6">Review: First look at Linux</a>',{whys:['600 leaves the file to keola alone, so sshd trusts it again.','777 lets everyone write the folder, which gives sshd one more reason to refuse.','A new owner leaves the file writable by everyone, so sshd still refuses it.','PubkeyAuthentication no turns key sign-in off for everyone.'],imp:'core',c:'host-file-permissions-shares'}],
     ['You plan to run <code>sudo sed -i.bak \'s/^PASS_MAX_DAYS.*/PASS_MAX_DAYS   90/\' /etc/login.defs</code>. Which command shows the line it would write and changes nothing?',['<code>sed -n \'s/^PASS_MAX_DAYS.*/PASS_MAX_DAYS   90/p\' /etc/login.defs</code>','<code>sudo sed -i \'s/^PASS_MAX_DAYS.*/PASS_MAX_DAYS   90/\' /etc/login.defs</code>','<code>sudo sed -i.bak \'s/PASS_MAX_DAYS/90/\' /etc/login.defs</code>','<code>sudo cat /etc/login.defs.bak</code>'],0,'Preview without -i; after the real edit, <code>grep \'^PASS_MAX_DAYS\' /etc/login.defs</code> proves it.',{whys:['-n prints nothing by default, p prints each changed line, and without -i the file stays as it was.','-i writes the change at once, and without a suffix it keeps no backup either.','-i.bak writes the change, and without ^ and .* it swaps the key name for 90 and also edits the comment line.','The .bak appears only after an -i.bak edit has run, and it holds the old file.'],imp:'core',c:'host-password-policy'}],
     ['The Lanikai Book Nook patron PC runs Debian 13 with unattended-upgrades installed, and the brief requires automatic security updates. Which command turns them on?',['sudo dpkg-reconfigure -plow unattended-upgrades','sudo apt upgrade -y','sudo apt update','sudo ufw enable'],0,'Answering Yes writes /etc/apt/apt.conf.d/20auto-upgrades, and <code>sudo unattended-upgrade --dry-run -d</code> shows which origins it patches from.',{whys:['It switches on the daily unattended-upgrades job, so security updates keep installing on their own.','apt upgrade patches the PC once, now; the daily job keeps patching it later.','apt update refreshes the package lists and installs nothing.','ufw enable turns on the firewall and leaves updates as they were.'],imp:'core',c:'host-updates'}],
     ['<code>sudo ufw status numbered</code> lists 22/tcp, 23/tcp, and 80/tcp as rules 1 to 3, then the same three as (v6) rules 4 to 6. The brief requires SSH and the web site. Which one command removes telnet’s port from both lists?',['sudo ufw delete 2','sudo ufw delete allow 23/tcp','sudo ufw delete 2 5','sudo ufw disable'],1,'By number, delete one rule at a time, then list again.',{whys:['Rule 2 goes, and 23/tcp (v6) stays open; it becomes rule 4 after the delete, so list again.','Naming the rule by its text removes the IPv4 and the IPv6 copy at once.','delete takes one rule number at a time, and the numbers shift after each delete.','disable turns the whole firewall off, the SSH and web rules included.'],imp:'good',c:'host-firewall'}]
   ]),
   LAB('s3lab','Lab: harden a Debian VM you own','Snapshot first. Tick each step, log each change.',[
     ['Create a test user, add it to sudo, then remove it from sudo.','sudo adduser test; sudo usermod -aG sudo test; sudo gpasswd -d test sudo'],
     ['Set aging in /etc/login.defs and apply it to your main user with chage.','sudo chage -M 365 -m 1 -W 7 $USER; sudo chage -l $USER'],
     ['Install pwquality and set minlen=14 in common-password, then test by trying a weak password.','sudo apt install libpam-pwquality'],
     ['Install ufw, default-deny inbound, enable, and verify.','sudo apt install ufw; sudo ufw default deny incoming; sudo ufw enable; sudo ufw status verbose'],
     ['Patch, then turn on automatic updates with unattended-upgrades.','sudo apt update && sudo apt upgrade -y'],
     ['List listening sockets and record each with its program in your log; judge them after Services and ports.','sudo ss -tulnp'],
     ['Set PermitRootLogin no, test, and restart SSH.','sudo sshd -t && sudo systemctl restart ssh'],
     ['Find all SUID files and media files; note which you would remove and why.','sudo find / -perm -4000 -type f 2>/dev/null'],
     ['Download a small file whose publisher lists a SHA-256 value, hash it, and compare the two.','sha256sum FILE']
   ]),
   REFLECT('s3r','Where Linux differs from Windows','Take three findings you fixed on Windows: an extra admin, a weak password policy, and an unneeded service. Write how you would find and fix each one on a Debian-family system, and one place where the Linux approach differs enough to trip you up.'),
   LINKS('Go further',['debian-handbook','debian-security','debian-wiki','cis','t4t-ld-mint','t4t-ld-ubuntu','t4t-lr-linux'])
  ]},
 {id:'s4',title:'Services and ports',bloom:'Understand',sum:'Which services are insecure by design, which are insecure by configuration, and how to tell "remove" from "harden".',
  can:'tell a service that is insecure by design from one that is insecure by configuration, and decide between remove and harden from the brief',
  blocks:[
   C('Remove, harden, or keep','Apply',
     TIPS('<b>Insecure by design</b> (clear-text credentials): Telnet (23), FTP (21), rsh/rlogin (512-514), and HTTP admin pages.',
          '<b>Insecure by configuration</b>: SSH root login, Samba guest shares (SMB, TCP 445), passwordless VNC, RDP without NLA, and SNMP with "public".',
          '<b>Mail and databases.</b> SMTP (TCP 25) and MySQL (TCP 3306) stay only when the brief needs them; a local-only database listens on 127.0.0.1.',
          '<b>Remote access tools</b> missing from the brief (TeamViewer, AnyDesk, VNC, and netcat listeners) are usually unauthorized software or malware.',
          'You are done with a listening port only once you can say what it is for.',
          '<b>Know normal first.</b> Record a clean VM\'s listeners for the same version, so an extra one stands out; the detail panel lists usual ones.'),
     P('<b>Worked example: one listener, two questions.</b> The brief for makani-web reads: “Serves the school’s public website; staff sign in with SSH.” <code>ss -tulnp</code> shows one listener you cannot yet explain:'),
     TERM('$ sudo ss -tulnp | grep :21\ntcp   LISTEN 0  32  0.0.0.0:21  0.0.0.0:*  users:(("vsftpd",pid=911,fd=3))'),
     TIPS('<b>Name the listener:</b> vsftpd, PID 911, FTP on port 21. On Linux, <code>systemctl status 911</code> names its unit, and <code>dpkg -S "$(sudo readlink -f /proc/911/exe)"</code> names its package.','<b>Two odd answers.</b> “no path found”: installed outside any package. A unit like cron.service or rc-local.service: remove only the planted line that started it.',
          '<b>Does the brief require it?</b> It names a website and SSH sign-ins; file transfer appears nowhere, so the answer is no.',
          '<b>Act.</b> <code>sudo systemctl disable --now vsftpd</code>, then <code>sudo apt purge vsftpd</code>, and check that no cron job or service starts it again.',
          '<b>Prove it still works.</b> The website loads, staff SSH sign-in succeeds, and port 21 drops off <code>ss -tulnp</code>. Log the change and its undo.',
          'If the brief said “staff upload pages by FTP”, the answer would be yes: keep vsftpd and harden it.',
          'Then ask where the weakness lives: for FTP, in the protocol, which sends credentials in clear text.'),
     DETAIL('Settings for services you keep',TIPS('<b>vsftpd</b> (/etc/vsftpd.conf): anonymous_enable=NO, local_enable=YES, write_enable=YES only for uploads, chmod_enable=NO, chroot_local_user=YES, ssl_enable=YES, and ftpd_banner=Welcome hides the version. Keep root in /etc/ftpusers; PAM refuses names listed there.',
          '<b>Chroot jail:</b> chroot_local_user=YES locks each user in the home folder; vsftpd requires that folder’s top level read-only, so allow_writeable_chroot=YES weakens the jail.','<b>nginx</b> (/etc/nginx/nginx.conf): in the http block, <code>server_tokens off;</code> removes the version from the Server header. Test with <code>sudo nginx -t</code>, then reload.','<b>See what nginx reads:</b> <code>sudo nginx -T</code> prints the whole configuration nginx reads, so you can find <code>server_tokens off;</code> in it.','<b>Apache</b> (/etc/apache2/conf-available/security.conf on the Debian family; /usr/local/etc/apache24/httpd.conf on FreeBSD; C:\\Apache24\\conf\\httpd.conf on Windows): ServerTokens Prod, ServerSignature Off, and TraceEnable Off in the main server config.',
