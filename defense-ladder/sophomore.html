     ['Ping to HILO-FS01 times out, yet staff open its shares all day. Best next check?',['Declare the server down','Turn off the server’s firewall','Flush the DNS cache','Test-NetConnection HILO-FS01 -Port 445'],3,'Windows Firewall drops inbound echo by default, so a ping timeout means blocked or down.',{whys:['Staff open its shares all day, so the server is up and only ping goes unanswered.','Turning off the firewall weakens the server just to make ping work.','The name already resolves for staff, so the DNS cache is fine.','A port test on 445 checks the file-sharing service itself, which is the real question.'],imp:'good',c:'net-troubleshooting-tools'}],
     ['ss -tan on a web server lists 600 SYN-RECV lines from scattered addresses, and the site crawls. What is it?',['A SYN flood: a denial of service against the TCP handshake','A normal busy day','A port scan from one address','Slow DNS'],0,'SYN cookies, rate limits, and the provider’s flood protection answer it. <a href="#freshman/f9">Review: Networks around you: home, school, and the internet</a>',{whys:['Hundreds of half-open handshakes from scattered addresses fill the queue: a SYN flood.','A busy day completes its handshakes; hundreds stuck half-open with a crawling site point to a flood.','A port scan comes from one address across many ports; this is many addresses at one service.','Slow DNS delays lookups and leaves the server’s handshake queue alone.'],imp:'core',c:'threat-network-attacks'}],
     ['Brief: MySQL serves local apps only. ss shows mysqld on 0.0.0.0:3306, and a scan from another lab VM shows 3306 open. Best fix?',['Move MySQL to port 3307','Turn off the firewall','Leave it: the scan proves it works','Bind MySQL to 127.0.0.1, then rescan and expect 3306 closed or filtered'],3,'0.0.0.0 listens on every interface; loopback answers programs on the same machine only. <a href="#sophomore/s4">Review: Services and ports</a>',{whys:['Port 3307 still listens on every interface, so the scan finds it again.','Turning off the firewall exposes even more; the fix is where MySQL listens.','The brief says local apps only, so 3306 open to another VM is a finding.','Binding to 127.0.0.1 lets only programs on the same machine connect, and the rescan confirms it.'],imp:'core',c:'net-scan-results'}],
     ['Hāpuʻu Fern Café’s card reader supports only WPA2; the staff laptops support WPA3. Best setup?',['Everything on WEP for compatibility','WPA2/WPA3 transition mode on the one staff SSID','WPA3 on the staff SSID, and a separate WPA2-AES network for the card reader','Open Wi-Fi with MAC filtering'],2,'A separate network for the old device keeps an evil twin from pulling the laptops down.',{whys:['WEP is broken, so it would expose every device.','Transition mode lets an evil twin pull the WPA3 laptops down to WPA2.','Staff stay on WPA3, and the reader gets the WPA2-AES minimum on its own network.','Open Wi-Fi encrypts nothing, and MAC filters are easy to copy.'],imp:'core',c:'net-wifi-security'}],
     ['Mānoa Bakery uses MAC filtering instead of a Wi-Fi passphrase. Why does that fail?',['MAC filters slow every device','Any device can copy an allowed MAC it hears over the air','MAC filtering works only on 5 GHz','Routers ignore MAC filters'],1,'Software changes MACs, and open Wi-Fi encrypts nothing: use WPA3 with a long passphrase.',{whys:['Speed is beside the point; the weakness is how easily MACs are copied.','MACs travel in the clear, so anyone nearby can copy an allowed one.','MAC filtering works on every band, and it is weak on all of them.','Routers do apply MAC filters; the trouble is how easily MACs are copied.'],imp:'good',c:'net-wifi-security'}],
     ['Look back: the IDS alerts that one outside address touched 1,000 ports on the web server in 4 seconds. What is it, and what would an IPS add?',['A port scan; an IPS sits inline and could drop that address’s traffic','A DNS lookup; nothing','A SYN flood; an IPS would restart the server','Normal web traffic; nothing'],0,'An IDS raises the alert; an IPS can also block. <a href="#freshman/f13">Review: Watch, detect, and respond</a>',{whys:['One source touching many ports in seconds is a scan, and an inline IPS can drop that source’s traffic.','A DNS lookup asks one server one question on port 53.','A SYN flood comes from many addresses at one service, and an IPS blocks traffic rather than restarting servers.','Normal web traffic uses ports such as 80 and 443, far from 1,000 ports in seconds.'],imp:'core',c:'det-ids-ips'}],
     ['Look back: in the Hōkū Hardware trace, hop 1 is 192.168.1.1 and hop 2 is 198.51.100.1. Where does the laptop’s private address become a public one?',['At hop 2, the provider','At the resolver','At hop 1, the shop router doing NAT','Nowhere: it never changes'],2,'Private addresses stay inside the shop. <a href="#freshman/f9">Review: Networks around you: home, school, and the internet</a>',{whys:['The provider’s router at hop 2 already sees the shop’s public address.','The resolver answers names and leaves the addresses on packets alone.','The shop router at hop 1 does NAT, swapping the private address for the shop’s public one.','Private addresses stay inside the shop, so the swap happens on the way out.'],imp:'good',c:'net-nat'}]
   ]),
   LINKS('Go further',['nmap-ref','wfa-security','cisa'])
   ]},
 {id:'s8',title:'Web traffic, HTTPS, and certificates',bloom:'Apply',sum:'Read real requests and responses with curl, check a certificate and its warnings, rank TLS versions, set cookie flags that protect a session, and check who a cloud file is shared with.',
  can:'read a request and response with curl, judge a certificate warning, rank TLS versions, set cookie flags, and check who a cloud file is shared with',
  blocks:[
   C('Ask a server directly with curl','Apply',
     P('A browser hides most of the conversation you met in <a href="#freshman/f11">The web and the cloud in plain words</a>, and <b>curl</b> shows it. It sends one request and prints exactly what comes back, so an admin checks a server they run in seconds. In Windows PowerShell, type <code>curl.exe</code>, since plain curl there runs a different command.'),
     P('Two curl habits are findings. A download piped straight into a shell, in a script or a scheduled job, runs code nobody read; <code>-k</code> turns off certificate checks.'),
     P('Worked example: Keahi runs the booking site for Kapaʻa Kayak Rentals and checks the sign-in page after hardening it.')),
   ANATOMY('Reading curl -sI',[
     {name:'The command',tag:'what Keahi typed',tone:'l2',grid:true,text:'<span class="mono">curl -sI https://shop.<wbr>kapaa-kayak.<wbr>example/<wbr>login</span>',children:[
       {name:'curl',tag:'tool',tone:'l1',text:'Sends one request and prints the answer'},
       {name:'-s',tag:'flag',tone:'l1',text:'Silent: hides the progress meter'},
       {name:'-I',tag:'flag',tone:'l1',text:'Capital I: headers only (a HEAD request)'},
       {name:'URL',tag:'target',tone:'l1',text:'The page to ask, on a server Keahi runs'}]},
     {name:'The answer',tag:'what curl printed',tone:'l3',children:[
       {name:'Status line',tone:'ok',text:'<span class="mono">HTTP/2 200</span><br>HTTP/2 prints header names in lowercase'},
       {name:'Security headers',tone:'l3',text:'<span class="mono">strict-transport-security: max-age=31536000; includeSubDomains<br>content-security-policy: default-src \'self\'; frame-ancestors \'none\'<br>x-content-type-options: nosniff<br>referrer-policy: strict-origin-when-cross-origin</span>'},
       {name:'Banner and cookie',tone:'l3',text:'<span class="mono">server: Apache<br>set-cookie: __Host-session=9c1e…; Path=/; Secure; HttpOnly; SameSite=Lax</span>'}]}
   ],{label:'The command curl -sI split into tool, two flags, and URL, then the answer: a status line, four security headers, a banner without a version, and a fully flagged cookie.',
     facts:{head:['Header','What it tells the browser'],rows:[
       ['Strict-Transport-Security (HSTS)','HTTPS only for max-age seconds (a year), even after a typed http://: that blocks TLS stripping (<a href="#junior/j7">Junior: Read the wire</a>). The browsers’ HSTS preload list covers the first visit too. HTTPS-Only mode is the browser-side half: the browser upgrades every site to HTTPS and warns before any page loads over plain HTTP (<a href="#sophomore/s3">Debian-family hardening</a> turns it on in Firefox).'],
       ['Content-Security-Policy (CSP)','Run scripts only from listed sources (\'self\' is this site); frame-ancestors \'none\' blocks framing.'],
       ['X-Content-Type-Options: nosniff','Trust the declared file type, so an uploaded text file never runs as a script.'],
       ['Referrer-Policy','Send other sites only this site’s name, never the full address.'],
       ['server: Apache','No version number, so scanners have less to match.']]},
     note:'Each missing header is one line of server config, and one curl line proves the fix.',
     caption:'Status first, then headers: each security header is a rule the server hands the browser.',bloom:'Apply'}),
   DETAIL('More curl flags (case matters), and two retired headers',
     P('<code>-v</code> also prints the TLS greeting and the certificate; <code>-L</code> follows redirects to the final page; and <code>-o file</code> saves the body to a file.'),
     P('Leave two old headers behind: X-XSS-Protection is retired (browsers ignore it; CSP does the job), and X-Frame-Options is replaced by CSP frame-ancestors.')),
   C('Cookies: the key you carry after sign-in','Apply',
     P('HTTP forgets each request once it answers. So after you sign in, the server hands the browser a <b>session cookie</b>, a long random value sent back with every request to prove it is you. Whoever copies it becomes you until the session ends, with the password and MFA already behind them.'),
     P('The server’s half: make each session value long, random, and new at every sign-in; end the session on the server at sign-out; and expire idle sessions, so a copied cookie goes stale fast.')),
   ANATOMY('One Set-Cookie header',[
     {name:'Set-Cookie',tag:'one response header',tone:'l2',grid:true,
      text:'<span class="mono">Set-Cookie: __Host-session=9c1e…; Path=/; Max-Age=3600; Secure; HttpOnly; SameSite=Lax</span>',
      children:[
       {name:'Name and value',tag:'the key',tone:'l1',text:'<span class="mono">__Host-<wbr>session=<wbr>9c1e…</span>: the value is the key'},
       {name:'Domain',tag:'scope',tone:'muted',text:'Left out: only this exact host gets it'},
       {name:'Path=/',tag:'scope',tone:'muted',text:'Which paths receive it; never a security wall'},
       {name:'Max-Age=3600',tag:'lifetime',tone:'muted',text:'Seconds to live; left out, it usually ends when the browser closes'},
       {name:'Secure',tag:'protects',tone:'ok',text:'Sent over HTTPS only'},
       {name:'HttpOnly',tag:'protects',tone:'ok',text:'Hidden from page scripts'},
       {name:'SameSite=Lax',tag:'protects',tone:'ok',text:'Kept off most requests from other sites; Strict: all'}]}
   ],{facts:{head:['Flag left out, or added','What goes wrong'],rows:[
       ['Secure','One plain-HTTP request on café Wi-Fi hands the cookie to anyone listening'],
       ['HttpOnly','A script injected into the page reads the cookie and sends it away'],
       ['SameSite','Another site makes your browser send a request that carries your cookie (cross-site request forgery, Junior)'],
       ['Domain=kapaa-<wbr>kayak.<wbr>example (added)','Every subdomain receives the cookie, including the weakest one']]},
     key:[['ok','Protects the cookie'],['muted','Sets scope and lifetime']],
     note:'A name that starts with <code>__Host-</code> forces Secure and Path=/ and forbids Domain, so the browser itself refuses a weaker copy.',
     caption:'A session cookie wants all three protective flags and a short life.',bloom:'Apply'}),
   QUIZ('s8c1','Check yourself',[
     ['Which Set-Cookie line best protects a session?',['Set-Cookie: session=…; Path=/','Set-Cookie: session=…; Secure','Set-Cookie: __Host-session=…; Path=/; Secure; HttpOnly; SameSite=Lax','Set-Cookie: session=…; Domain=kapaa-kayak.example; Max-Age=315360000'],2,'Secure, HttpOnly, and SameSite protect; the __Host- prefix forces Secure and Path=/ and forbids Domain.',{whys:['Without protective flags, it rides plain HTTP, and scripts can read it.','Secure alone lets scripts read it and other sites send it.','Secure keeps it on HTTPS, HttpOnly hides it from page scripts, SameSite keeps other sites from sending it, and __Host- makes the browser refuse weaker copies.','Domain widens it to every subdomain, and ten years is far too long.'],imp:'core',c:'web-http'}]
   ]),
   SPOT('s8sp','Spot the problems: a raw request and response','Kapaʻa Kayak Rentals’ old booking site, captured by the shop’s own test proxy while Kai signed in. Tap every line that weakens the site or its visitors, then Check.',[
     ['POST http://shop.kapaa-kayak.example/login HTTP/1.1','Plain HTTP: the password in this form crosses the network as readable text. Serve the form over HTTPS and redirect port 80 to 443.'],
     ['Host: shop.kapaa-kayak.example',null],
     ['Content-Type: application/x-www-form-urlencoded',null],
     ['user=kai&pass=********   (masked by the proxy)',null,'The proxy masked the password for this capture, and a form body is where a password belongs. The plain-HTTP request line is what exposes it.'],
     ['HTTP/1.1 302 Found',null,'A 302 after a sign-in is the normal redirect to the next page, here the bookings list.'],
     ['Location: /bookings',null],
     ['Server: Apache/2.4.29 (Ubuntu)','An exact, old version tells scanners which known flaws to try. Patch Apache, then hide the version with ServerTokens Prod.'],
     ['Set-Cookie: session=4f2a…; Path=/','The session cookie lacks Secure, HttpOnly, and SameSite: it rides plain HTTP, and page scripts can read it.'],
     ['Set-Cookie: lang=en; Path=/; Max-Age=31536000',null,'A language choice grants no access, so a year-long cookie with no extra flags exposes nothing worth stealing.'],
     ['Set-Cookie: remember=kai:7d1c…; Max-Age=315360000; HttpOnly','A sign-in token that lives ten years and lacks Secure, so a copy keeps working for a decade. Keep it to weeks, add Secure once the site is on HTTPS, and end it at sign-out.'],
     ['X-Content-Type-Options: nosniff',null],
     ['Cache-Control: no-store',null]
   ]),
   C('TLS: what the lock is made of','Apply',
     P('<b>TLS</b> gives a connection three guarantees: <b>encryption</b> (outsiders read nothing), <b>integrity</b> (any change is detected), and <b>server authentication</b> (the certificate proves which site answered). A short greeting, the <b>TLS handshake</b>, sets them up before any page moves. Its job ends at the wire: a hacked server, an infected browser, or a dishonest site sits outside what TLS promises.')),
   DETAIL('Data in transit and at rest',
     P('TLS protects data in transit. Once a report lands in Downloads it is data at rest, and disk encryption takes over (<a href="#freshman/f10">Keys, locks, and certificates</a>).')),
   SEQ('The TLS 1.3 greeting',[
     ['ClientHello, readable','The browser lists the TLS versions and <b>cipher suites</b> it supports, sends a key share, and names the site it wants (SNI). <b>Observer sees:</b> this hello, site name included.','amber'],
     ['ServerHello, readable','The server picks TLS 1.3 and one cipher suite and sends its own key share. <b>Observer sees:</b> this hello too.','amber'],
     ['Both sides derive keys','Each side mixes its own secret with the other’s key share and reaches the same fresh session keys, the paint-mixing trick (Diffie-Hellman) from <a href="#freshman/f10">Keys, locks, and certificates</a>. <b>Observer sees:</b> two shares that never reveal the keys.','l2'],
     ['Certificate and Finished, encrypted','The server sends its certificate chain, a signature made with its private key, and a Finished message, all encrypted. <b>Observer sees:</b> encrypted bytes.','ok'],
     {ask:'Does the certificate check pass?',tone:'muted',detail:'The name sits in the SAN list, today falls inside the valid dates, the chain reaches a trusted root, and the certificate’s public key verifies the signature.',branches:[['Yes','The browser sends its own Finished, and encrypted data flows: pages, passwords, and cookies. An observer sees the addresses, sizes, and timing; the content stays sealed.'],['No','The browser stops and shows a warning. Close the tab and report it.']]}
   ],{key:[['amber','Crosses readable'],['l2','Worked out on each side'],['ok','Crosses encrypted'],['muted','The browser’s check']],
     note:'Where both sides use Encrypted Client Hello (ECH), even the site name is hidden.',bloom:'Apply'}),
   DETAIL('TLS 1.2: the certificate in the clear',
     P('In TLS 1.2 the certificate crossed in the clear, so anyone watching read which certificate the server sent. TLS 1.3 encrypts it, leaving the site name and the two hellos as the only readable parts.')),
   SCALE('TLS versions, retired to preferred',{from:'Retired',to:'Preferred',bands:[
       ['SSL 2.0 and 3.0','The family’s old name. Broken designs, retired in 2011 and 2015','bad'],
       ['TLS 1.0 and 1.1','Weak hashes and old cipher modes; retired in 2021, and browsers refuse them','bad'],
       ['TLS 1.2','Acceptable with modern suites: ECDHE key exchange with AES-GCM or ChaCha20','amber',1.2],
       ['TLS 1.3','Preferred: fewer, stronger options, a faster greeting, and an encrypted certificate','ok',1.2]]},
     {intro:'People still say “SSL certificate”; the same certificate works with any TLS version.',
      note:'TLS 1.3 always uses a fresh key per session (<b>forward secrecy</b>), so a key stolen later cannot unlock recorded traffic.',
      caption:'Keep TLS 1.2 and 1.3, switch off everything older, then confirm the devices the business needs still connect.',bloom:'Apply'}),
   QUIZ('s8c2','Check yourself',[
     ['On Lauaʻe Café Wi-Fi, Nohea opens portal.kahikina-high.example over TLS 1.3. What can another customer watching the network read?',['The grades page and the session cookie','The password, once the page loads','The site name in the ClientHello, the server’s address, timing, and size','Nothing at all, not even the site name'],2,'SNI names the site in the clear unless ECH hides it.',{whys:['The page and the cookie travel encrypted after the hellos.','The password travels inside TLS, sealed from onlookers.','TLS 1.3 encrypts everything after the two hellos, while the site name in SNI, the server’s address, timing, and size stay visible.','SNI shows the site name unless ECH hides it.'],imp:'good',c:'crypto-tls'}]
   ]),
   C('Worked example: switch the old versions off','Apply',
     TIPS('<b>Apache, finding:</b> <code>SSLProtocol all <span style="white-space:nowrap">-SSLv3</span></code>. ‘all’ still includes TLS 1.0 and 1.1.<br><b>Fixed:</b> <code>SSLProtocol <span style="white-space:nowrap">-all</span> <span style="white-space:nowrap">+TLSv1.2</span> <span style="white-space:nowrap">+TLSv1.3</span></code> starts empty and adds the two good versions.',
          '<b>nginx, finding:</b> <code>ssl_protocols TLSv1 TLSv1.1 TLSv1.2;</code> keeps TLS 1.0 and 1.1 on and leaves TLS 1.3 out.<br><b>Fixed:</b> <code>ssl_protocols TLSv1.2 TLSv1.3;</code>',
          '<b>Prove it:</b> <code>curl -sI <span style="white-space:nowrap">--tlsv1.3</span> https://shop.<wbr>kapaa-kayak.<wbr>example</code> shows TLS 1.3 answers, and a TLS scanner run against your own server lists every version still on.'),
     P('A browser that meets only retired versions refuses the site with <code>ERR_<wbr>SSL_<wbr>VERSION_<wbr>OR_<wbr>CIPHER_<wbr>MISMATCH</code>, so an old server fails loudly for visitors too.')),
   C('Read a certificate','Apply',
     P('Worked example: on 20 October 2026, visitors to Kapaʻa Kayak Rentals report a warning. Makana, who runs the site, prints the certificate’s key fields:'),
     TERM('$ openssl x509 -in shop.pem -noout -subject -issuer -dates -ext subjectAltName\nsubject=CN=shop.kapaa-kayak.example\nissuer=C=US, O=Example Trust Services, CN=Example TLS CA R2\nnotBefore=Mar 20 00:00:00 2026 GMT\nnotAfter=Oct  5 23:59:59 2026 GMT\nX509v3 Subject Alternative Name:\n    DNS:shop.kapaa-kayak.example, DNS:kapaa-kayak.example'),
     TIPS('<b>Dates:</b> notAfter, 5 October, has passed, so every visitor sees an expired warning. Renew now, then automate renewal (certbot renew or the host’s tool).',
          'A date warning on every site at once points at the device’s own clock, so check the clock first.',
          'A server that sends the leaf alone shows as an unknown issuer on some devices; send the full chain.')),
   ANATOMY('A certificate, field by field',[
     {name:'Certificate',tag:'shop.kapaa-kayak.example',tone:'l2',
      trail:['Signature','<span class="mono">ecdsa-<wbr>with-<wbr>SHA256</span>: the issuer’s signature over every field; any change breaks it'],
      children:[
       {name:'Subject and SAN',tone:'l1',text:'<span class="mono">CN=shop.<wbr>kapaa-kayak.<wbr>example</span><br>SAN: <span class="mono">DNS:shop.<wbr>kapaa-kayak.<wbr>example, DNS:kapaa-kayak.<wbr>example</span><br>Every name the site answers to'},
       {name:'Issuer',tone:'l3',text:'<span class="mono">CN=Example TLS CA R2</span><br>The CA that signed it; equal to the subject means self-signed'},
       {name:'Validity',tone:'amber',text:'<span class="mono">Mar 20 2026</span> to <span class="mono">Oct 5 2026</span>: 199 days'},
       {name:'Public key',tone:'l4',text:'<span class="mono">ECDSA P-256</span><br>The server proves it holds the private half by signing the greeting'}]}
   ],{intro:'A browser runs three checks on these fields; each failed check has its own warning.',
     facts:{head:['Warning (Chrome code)','Field behind it','Fix'],rows:[
       ['Name mismatch (ERR_<wbr>CERT_<wbr>COMMON_<wbr>NAME_<wbr>INVALID)','Subject Alternative Name','Reissue with every name the site uses'],
       ['Expired (ERR_<wbr>CERT_<wbr>DATE_<wbr>INVALID)','Validity: Not After','Renew, and automate renewal'],
       ['Untrusted issuer (ERR_<wbr>CERT_<wbr>AUTHORITY_<wbr>INVALID)','Issuer and the signature chain','Use a public CA and send the intermediate; for internal sites, IT installs the school’s private root on school devices']]},
     note:'The name check uses the Subject Alternative Name list; the subject CN is a leftover that browsers ignore.',
     bloom:'Apply'}),
   DETAIL('Certificate lifetimes',
     P('Public TLS certificates last at most 200 days since 15 March 2026 (100 from March 2027).')),
   QUIZ('s8c3','Check yourself',[
     ['A certificate’s SAN list reads <code>DNS:kapaa-kayak.example, DNS:shop.kapaa-kayak.example</code>. A visitor opens https://www.kapaa-kayak.example. What happens, and what fixes it?',['It loads, since the subject CN matches','A name-mismatch warning; reissue the certificate with www.kapaa-kayak.example in the SAN list','An expired warning; renew the certificate','A Not secure label; add HSTS'],1,'Browsers match the address against the SAN list only.',{whys:['Browsers ignore the subject CN and match the SAN list only.','Browsers match the address against the SAN list, and www.kapaa-kayak.example is missing from it, so a certificate reissued with it fixes the warning.','Nothing here points at the dates: the certificate is current, and the name is what fails to match.','Not secure marks plain HTTP, and this site uses HTTPS.'],imp:'core',c:'crypto-certificates'}]
   ]),
   MATCH('s8m','Warning to its cause','Tap an item on the left, then its match on the right.',[
     ['ERR_<wbr>CERT_<wbr>COMMON_<wbr>NAME_<wbr>INVALID on www.<wbr>kapaa-kayak.<wbr>example','The certificate covers only shop. and the bare domain','Reissue the certificate with every name the site uses.'],
     ['ERR_<wbr>CERT_<wbr>DATE_<wbr>INVALID on one site','The certificate ran past its last valid day','Renew it, and automate renewal.'],
     ['ERR_<wbr>CERT_<wbr>AUTHORITY_<wbr>INVALID on a new internal server','A self-signed certificate, or a CA outside this device’s trust store','Use a public CA, or have IT install the private root on school devices.'],
     ['Date warnings on every site, on one laptop only','The device’s date is set to 2019','Every certificate looks out of date to a device with the wrong date.'],
     ['ERR_<wbr>SSL_<wbr>VERSION_<wbr>OR_<wbr>CIPHER_<wbr>MISMATCH','The server offers only retired TLS versions','Turn on TLS 1.2 and 1.3.'],
     ['Not secure beside the address','The page loaded over plain HTTP','Serve it over HTTPS and redirect port 80.'],
     ['Warnings on every site, only on one café’s Wi-Fi','An on-path device is presenting its own certificates','Leave that network, then report it.']
   ],'Apply'),
   C('Who can open this file?','Apply',
     P('Cloud drives such as Google Drive and OneDrive share by link or by person. Under the shared responsibility model, these settings stay the customer’s job in every SaaS app: the provider runs the service, and the school decides who opens what.'),
     SCALE('Who a shared file reaches',{from:'Narrow',to:'Wide',bands:[
       ['Specific people','Named accounts, checked at sign-in. Check: each name still needs it, as Viewer unless the job is editing.','ok'],
       ['Organization','Any signed-in school account. Check: nothing private, such as grades or phone numbers.','l2'],
       ['Anyone with the link','No sign-in: whoever holds the link, even a forwarded copy. Check: public material only, with an end date.','amber'],
       ['Public on the web','Search engines can list it. Check: published on purpose, or closed today.','bad']]},
      {caption:'Choose the narrowest level that does the job.',bloom:'Apply'}),
     P('Worked example: Leilani, a club officer, reads each row of the club drive’s sharing report with four questions.'),
     TIPS('<b>Who can open it?</b> Anyone with the link suits a public flyer. Names, phone numbers, grades, and money call for specific people.',
          '<b>Who owns it?</b> A personal account’s file sits outside the school’s controls and leaves with its owner. Move it into a school account.',
          '<b>Can they edit?</b> Edit rights on a wide link let anyone change or wipe the file. Give Viewer unless the job needs more.',
          '<b>Is the job done?</b> Remove links for finished projects, or set an expiry date where the drive allows one.'),
     NOTE('Apps count too. A third-party add-on granted access to “all your Drive files” reads every file, so remove any app the club cannot explain.')),
   DETAIL('School-wide sharing limits',
     P('School admins can also limit sharing outside the school domain for every account at once.')),
   SPOT('s8sp2','Spot the problems: a club’s sharing report','The Kahikina High robotics club’s sharing report: file | owner | who can open it | since. School accounts show by username; outside accounts show in full, and “Club members” is a list of specific people. Club rule: club files live in school accounts, and anything with names, phone numbers, or money goes to specific people only. Tap every row that breaks the rule or opens more than the job needs, then Check.',[
     ['Event flyer.pdf | pua | Anyone with the link: view | 2026-10-01',null,'A flyer is meant for the public and holds no names, phone numbers, or money, so a view-only open link fits the job.'],
     ['Club budget 2026.xlsx | pua | Anyone with the link: edit | 2026-09-02','Money, open to anyone holding the link, who can also edit it. Share it with the officers by name.'],
     ['Meeting notes | keahi | Club members: comment | 2026-08-20',null,'Club members is a list of specific people, and comment access fits notes they all add to.'],
     ['Robot CAD/ | kaibuilds@mail.example | Club members: edit | 2025-11-12','Owned by a personal account outside the school: the school’s controls never reach it, and the files leave with Kai. Transfer ownership to a school account.'],
     ['Team roster 2024.xlsx | mele | Anyone with the link: view | 2024-03-11','Names and phone numbers behind a two-year-old open link. Restrict it to specific people, or delete it.'],
     ['Sign-up responses | leilani | 2 officers by name: edit | 2026-09-15',null],
     ['PDF joiner add-on, unverified publisher (app) | full access to all Drive files | 2026-05-14','An unknown app holds full access to every file in the drive. Remove its access.'],
     ['Practice schedule | kekoa | Everyone at the school: view | 2026-09-30',null,'A practice schedule holds no names, phone numbers, or money, and view-only access for the school fits the job.']
   ]),
   QUIZ('s8q','Check: web traffic',[
     ['Keahi runs <code>curl -sI https://shop.kapaa-kayak.example</code>, and the answer has no strict-transport-security line. What does adding that header do?',['Encrypts the cookies a second time','Tells browsers to use only HTTPS for this site, even when someone types http://','Hides the server’s version number','Blocks scripts from other sites'],1,'HSTS keeps returning visitors on HTTPS for the max-age it sets.',{whys:['Cookie flags protect cookies; HSTS is about HTTPS.','The header tells the browser to use HTTPS for this site for max-age seconds, so a typed http:// is upgraded before any request leaves.','ServerTokens Prod hides the version; HSTS is about HTTPS.','CSP decides which scripts run; HSTS forces HTTPS.'],imp:'good',c:'web-http'}],
     ['The nginx server for Hilo Lehua Clinic reads <code>ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;</code> What is the finding?',['TLS 1.3 is too new for patients','TLS 1.1, a retired version, is still on; remove it','TLS 1.2 must go too','Nothing: three versions reach the most visitors'],1,'Keep TLS 1.2 and 1.3 only, then confirm the devices the clinic needs still connect.',{whys:['TLS 1.3 is the preferred version; keep it on.','TLS 1.0 and 1.1 are retired, with weak hashes and ciphers, so 1.1 comes off and 1.2 and 1.3 remain.','TLS 1.2 stays acceptable with modern suites.','Reach is no reason to keep a retired version with weak hashes.'],imp:'core',c:'crypto-tls'}],
     ['A backup script on waimea-db runs <code>curl -k https://backup.waimea-feed.example/upload</code>. Why is that a finding?',['-k makes the transfer slower','-k turns off certificate checks, so any machine on the path can pose as the server and receive the backup','-k sends the data over plain HTTP','-k skips the upload'],1,'Fix the certificate problem itself, then remove -k.',{whys:['-k leaves speed alone; it skips the certificate check.','With the certificate check skipped, any machine on the path can show its own certificate, pose as the server, and receive the backup.','The URL still says https; -k drops only the certificate check.','The upload still runs, to whoever answers.'],imp:'core',c:'crypto-certificates'}],
     ['The shop’s server key leaks next year. Why does TLS 1.3’s forward secrecy still protect traffic recorded today?',['Each session used its own fresh key, which was never sent and is gone','The leaked key rotates itself','The CA re-encrypts old traffic','TLS 1.3 keeps no keys on the server'],0,'Fresh session keys come from the key shares, so the long-term key alone unlocks nothing recorded.',{whys:['Each session key came from fresh key shares, was never sent, and was erased afterwards, so the long-term key alone opens nothing recorded.','Keys stay as they are until someone replaces them; a leaked key stays leaked.','A CA signs certificates and stays out of the traffic.','The server keeps its long-term key; the session keys are what vanish.'],imp:'good',c:'crypto-tls'}],
     ['Keola finished a group project in OneDrive last spring, and its folder is still shared as “Anyone with the link can edit”. Best move?',['Leave it, since nobody remembers the link','Remove the link, or narrow it to specific people as Viewer','Rename the folder','Turn on sync on another device'],1,'Links keep working until someone removes them, and forwarded copies travel. Close them when the job ends.',{whys:['The link works for anyone who holds it, forwarded copies included.','The project is over, so removing the link, or narrowing it to named viewers, ends access that nobody needs now.','A renamed folder keeps the same link working.','Sync leaves the link and its holders as they are.'],imp:'core',c:'cloud-shared-responsibility'}],
     ['In the TLS 1.3 greeting, how does the server prove it owns the certificate it sent?',['It sends its private key along with the certificate','It signs the greeting with its private key, and the browser checks that signature with the public key in the certificate','It encrypts the page with the browser’s private key','The CA confirms it by email'],1,'A signature made with a private key is checked with the matching public key. <a href="#freshman/f10">Review: Keys, locks, and certificates</a>',{whys:['Sending the private key would let anyone pose as the server.','Only the holder of the private key can make a signature that the certificate’s public key verifies, and the key itself never leaves the server.','The browser’s private key stays with the browser; the server signs with its own.','The CA signed the certificate earlier and stays out of the greeting.'],imp:'core',c:'crypto-signatures'}],
     ['Kahikina High syncs its on-premises school accounts to its cloud suite through one sync account. Why does that account get the strongest protection?',['It copies email only','Whoever controls the join reaches the school’s own servers and its cloud at once','Sync accounts never sign in','The provider resets it every night'],1,'In a hybrid setup the join itself is the prize. <a href="#freshman/f11">Review: The web and the cloud in plain words</a>',{whys:['The sync carries sign-ins, which reach far more than email.','The sync account carries sign-ins between both sides, so whoever controls it reaches the school’s own servers and its cloud at once.','It signs in all the time to keep both sides matched.','Guarding it stays the school’s job, with no provider reset.'],imp:'core',c:'cloud-models'}]
   ]),
   LINKS('Go further',['mdn-http','moz-tls','owasp-headers'])
   ]},
 {id:'s9',title:'Check before you trust: messages, links, and files',bloom:'Apply',sum:'Worked checks on a suspicious email, a look-alike link, and an unknown file: read the headers, look up the domain and hash, and report it the right way.',
  can:'check a suspicious email by its headers, a link by its domain, and a file by its hash, and report each the right way',
  blocks:[
   C('Three questions before you act','Apply',
     P('Before you click, open, pay, or sign in, answer three questions while everything stays closed. <b>Who really sent it?</b> Read the headers. <b>Where does the link really go?</b> Look up its registered domain. <b>What is this file?</b> Hash it and look up the hash. Then report it, so one person’s check protects everyone.'),
     TIPS('<b>Triage a reported message in four moves:</b> keep the original; answer those three questions; decide; then act.',
          '<b>To act,</b> block the sender and domain, pull every copy from other mailboxes, and reset the password of anyone who typed one in.',
          '<b>The lure changes; the pattern stays:</b> an unusual request plus pressure to skip checking, by email, text, or phone (<a href="#freshman/f8">Threats and the people behind them</a>).')),
   ANATOMY('A phishing email, header to attachment',[
     {name:'Headers',tag:'who sent it',tone:'l2',children:[
       {name:'From',tag:'name, address',tone:'amber',text:'<span class="mono">"Hōkū Hardware IT" &lt;it@<wbr>hoku&#8209;hardware.<wbr>example&gt;</span><br>The quoted name is free text. The address can be forged too; DMARC says whether it was.'},
       {name:'Reply-To',tag:'where answers go',tone:'bad',text:'<span class="mono">help.desk@<wbr>free&#8209;mail.<wbr>example</span><br>A reply would leave the company for a free-mail box.'},
       {name:'Return-Path',tag:'the bounce address',tone:'amber',text:'<span class="mono">bounce@<wbr>bulk&#8209;post.<wbr>example</span><br>The sending system’s own domain. SPF checks this one.'},
       {name:'Authentication-Results',tag:'your server’s verdict',tone:'bad',text:'<span class="mono">spf=pass smtp.<wbr>mailfrom=<wbr>bulk&#8209;post.<wbr>example<br>dkim=none<br>dmarc=fail (p=none) header.<wbr>from=<wbr>hoku&#8209;hardware.<wbr>example</span><br>SPF passed for the wrong domain, so DMARC failed.'}]},
     {name:'Body',tag:'what it wants',tone:'l3',children:[
       {name:'Pressure',tone:'amber',text:'“Your mailbox closes in 2 hours unless you confirm.”'},
       {name:'Link text and target',tone:'bad',text:'Shows <b>Keep my mailbox</b>; leads to <span class="mono">hoku&#8209;hardware.<wbr>example.<wbr><b>mail&#8209;keep.<wbr>example</b></span>.'},
       {name:'Attachment',tone:'bad',text:'<span class="mono">Mailbox_<wbr>Policy.<wbr>pdf.<wbr>html</span>: a web page wearing a PDF name that draws a sign-in form.'}]}
   ],{bloom:'Apply',intro:'Worked example: at 7:41 a.m., this landed in Makana’s inbox at Hōkū Hardware in Kaimukī. Ask of each field: who wrote it?',
     label:'A phishing email split into headers (From, Reply-To, Return-Path, and Authentication-Results) and body (pressure, link text and target, and attachment), with the clues marked.',
     facts:{head:['Field','Written by','Trust it?'],rows:[
       ['Display name','The sender, freely','Only with other proof'],
       ['From address','The sender','Only with dmarc=pass'],
       ['Reply-To','The sender','When it stays in the sender’s own domain'],
       ['Authentication-Results','Your own mail server','Yes: the top one']]},
     key:[['bad','A clue in this message'],['amber','Worth a second look']]}),
   COMPARE('SPF, DKIM, and DMARC',[
     {name:'SPF',tag:'Sender Policy Framework',tone:'l1',rows:[
       ['Checks','That the sending server is allowed for the Return-Path domain'],
       ['Where it lives','A DNS TXT record on that domain: <span class="mono">v=spf1 … &#8209;all</span>'],
       ['Fail line','<span class="mono">spf=fail</span>: a server the domain never listed sent it'],
       ['Blind spot','It checks the bounce domain, which readers never see']],
      hook:'the list of trucks allowed to carry a company’s mail.'},
     {name:'DKIM',tag:'DomainKeys Identified Mail',tone:'l2',rows:[
       ['Checks','The d= domain’s signature, using the public key that domain publishes'],
       ['Where it lives','A signature header; its key in DNS at <span class="mono">selector.<wbr>_domainkey</span>'],
       ['Fail line','<span class="mono">dkim=fail</span>: the message changed after signing, or the signature is fake'],
       ['Blind spot','Any domain can sign its own mail, a look-alike included']],
      hook:'a wax seal on the envelope.'},
     {name:'DMARC',tag:'ties both to the From',tone:'l4',rows:[
       ['Checks','That SPF or DKIM passed for a domain matching the visible From, and sets the policy'],
       ['Where it lives','A DNS TXT record at <span class="mono">_dmarc.</span> plus the domain: <span class="mono">p=none</span> (report only), <span class="mono">quarantine</span>, or <span class="mono">reject</span>'],
       ['Fail line','<span class="mono">dmarc=fail</span>: nothing proved the From domain sent it'],
       ['Blind spot','A look-alike domain with its own records passes all three']],
      hook:'the rule that the seal must match the name on the letter.'}
   ],{bloom:'Apply',intro:'Your mail server runs all three and writes the verdicts into Authentication-Results. Read DMARC first: it speaks for the From you see.',
     note:'A pass proves which domain sent a message, never that the sender is honest.'}),
   DETAIL('DKIM versus S/MIME, and DMARC policies',
     P('DKIM is the sending domain’s server signing its mail. S/MIME (<a href="#sophomore/s4">Services and ports</a>) is one person’s certificate signing the message, so a DKIM pass names a domain, never a person.'),
     P('Owners move DMARC from p=none (report only) to quarantine (junk folder) to reject (refused) once their own mail passes.')),
   QUIZ('s9cy1','Check yourself',[
     ['A “Hilo Lehua Clinic” email shows: spf=pass smtp.mailfrom=news-blast.example; dkim=pass header.d=news-blast.example; dmarc=fail header.from=lehua-clinic.example. What does it tell you?',['The clinic sent it, because SPF and DKIM passed','The message was encrypted in transit','Only news-blast.example is proven','The clinic’s DKIM key failed'],2,'A pass counts for the From only when DMARC ties it there, so an unproven From stays suspect.',{whys:['Both passes vouch for news-blast.example alone, a different domain from the clinic.','These checks test who sent the mail; encryption in transit is a separate matter.','SPF and DKIM passed for news-blast.example, and DMARC failed because neither pass matches the clinic’s From domain, so the From stays unproven.','DKIM passed, for news-blast.example; the clinic’s own key never signed it.'],imp:'core',c:'threat-email-checks'}]
   ]),
   SPOT('s9sp','Spot the clues: an email with full headers','Kekoa keeps the books at Kona Hillside Roasters (kona-roasters.example), which Leilani owns. Use the worked example above. Tap every line that is a clue, then Check.',[
     ['Authentication-Results:',null],
     [' mx.kona-roasters.example;',null,'This names Kona Hillside Roasters’ own mail server, the one that ran the checks below and reports their results.'],
     [' spf=pass smtp.mailfrom=blast.example;','SPF passed only for blast.example, a domain unrelated to Kona Hillside Roasters.'],
     [' dkim=none; dmarc=fail (p=none)','DMARC failed: nothing signed for or sent from kona-roasters.example, so the From line is unproven.'],
     ['From: leilani@kona-roasters.example',null,'Anyone can type any From address, so this line looks right on every forged email too; the DMARC result above is what tests it.'],
     ['Reply-To: leilani.kr@quickmail.example','Answers go to an outside free-mail box, so a question to “Leilani” reaches whoever runs it.'],
     ['To: kekoa@kona-roasters.example',null],
     ['Date: Tue, 20 Oct 2026 07:52:10 -1000',null,'-1000 is Hawaiʻi time, and an early-morning send fits a real office, so the date matches a normal message.'],
     ['Subject: Hilo supplier invoice',null],
     ['Kekoa, the Hilo bean invoice is due.',null],
     ['Pay it to the new bank account today.','A payment change by email is the business email compromise tell. Call Leilani on a number you already have first.'],
     ['Keep this quiet; I can’t take calls.','Secrecy plus no call-back blocks the one check that stops this fraud.'],
     ['kona-roasters.example.inv-view.example','Registered domain: inv-view.example. The company name is only a subdomain.'],
     ['Viewer installs itself when you visit.','A page that installs software because you visited is a drive-by download. A real invoice opens as a PDF.'],
     ['Thanks, Leilani',null]
   ]),
   C('Check a link before you visit it','Apply',
     P('Worked example: the link in Makana’s email. Hover over it, or long-press it on a phone, and copy the target without visiting; turn phone link previews off, since they can load the page. Read the registered domain right to left (<a href="#freshman/f11">The web and the cloud in plain words</a>): <span class="mono">hoku&#8209;hardware.<wbr>example.<wbr><b>mail&#8209;keep.<wbr>example</b></span> belongs to mail-keep.example.'),
     TIPS('<b>Look-alike tricks:</b> a missing or swapped letter (hoku-hardwre), a digit (h0ku), paired letters (rn for m, vv for w), or an extra word (hoku-hardware-support).',
          '<b>The real name can sit inside a fake:</b> as a subdomain, in the path, or before an <span class="mono">@</span>, which browsers skip as a user name.',
          '<b>Letters from other alphabets</b> can copy Latin ones exactly; browsers show such risky names as <span class="mono">xn--</span> (punycode), so check any <span class="mono">xn--</span> address.',
          '<b>Look up the domain’s age</b> with RDAP: a days-old domain sending “account” mail is a strong phishing sign.',
          '<b>Check its reputation</b> on many blocklists. A <b>URL scanner</b> visits for you, reporting each redirect, the final address, a screenshot, and every domain contacted.',
          '<b>Public scans are visible to anyone,</b> so scan internal or personal links privately.',
          '<b>Short links and QR codes hide the target.</b> Preview the address first; most phone cameras show it before opening.'),
     NOTE('VirusTotal (files, links, and domains), urlscan.io (link visits), and URLVoid (domain reputation) are well-known services. Your school or employer may run its own; use the one IT names.')),
   DETAIL('RDAP versus WHOIS',
     P('RDAP replaced WHOIS for generic endings such as .com in January 2025.')),
   COMPARE('Two domains, two ages (RDAP lookup)',[
     {name:'hoku-hardware.example',tag:'the real shop',tone:'ok',rows:[
       ['Registered','2009-03-12: 17 years ago'],
       ['Registrar','An established registrar; expires 2027-03-12'],
       ['Name servers','ns1 and ns2.hoku-hardware.example: the shop’s own'],
       ['Registrant','REDACTED FOR PRIVACY'],
       ['Blocklists','On 0 of 30']],
      hook:'an old storefront on a long lease.'},
     {name:'hoku-hardwre.example',tag:'the look-alike',tone:'bad',rows:[
       ['Registered','2026-10-17: three days ago'],
       ['Registrar','A budget registrar; expires 2027-10-17: paid for one year'],
       ['Name servers','A free DNS host shared by thousands of sites'],
       ['Registrant','REDACTED FOR PRIVACY'],
       ['Blocklists','On 4 of 30']],
      hook:'a pop-up stall that opened this weekend.'}
   ],{bloom:'Apply',intro:'Worked example: an RDAP lookup on each domain, plus a blocklist check. Read the dates first.',
     note:'REDACTED is normal, since privacy rules hide most owners; age and blocklists do most of the work.'}),
   SPOT('s9sp2','Spot the look-alike links','Hōkū Hardware owns one domain: hoku-hardware.example. Links from one week of the shop’s email and texts. Tap every line whose registered domain belongs to someone else, then Check.',[
     ['shop.hoku-hardware.example/orders',null,'Read leftward from the first slash: the registered domain is hoku-hardware.example, and shop is the shop’s own subdomain.'],
     ['hoku-hardwre.example/login','A missing letter: hoku-hardwre.example, registered three days ago.'],
     ['h0ku-hardware.example/rewards','A zero in place of the o: h0ku-hardware.example.'],
     ['hoku-hardware.example/help',null],
     ['hoku-hardvvare.example/invoice','Two v’s pose as a w: hoku-hardvvare.example.'],
     ['hoku-hardware.example@sign-in.example/','Everything before the @ is a user name the browser skips; the host is sign-in.example.'],
     ['mail.hoku-hardware.example/?from=h0ku',null,'The registered domain is hoku-hardware.example; the h0ku after the ? is only a value in the address, which leaves the destination unchanged.'],
     ['hoku-hardware-support.example/reset','An extra word makes a separate domain: hoku-hardware-support.example.'],
     ['Text: hoku-hardware.example.go.example','Smishing: the shop name is a subdomain of go.example.'],
     ['www.hoku-hardware.example/stores',null]
   ]),
   C('Check a file without opening it','Apply',
     P('Worked example: Kekoa’s inbox also holds <span class="mono">Invoice_7731.zip</span> from a stranger. A <b>hash</b> names the file without running it (<a href="#freshman/f10">Keys, locks, and certificates</a>), and a hash lookup reveals nothing inside it. An upload hands the whole file to the service and its subscribers, so private documents get a hash lookup alone.'),
     TERM('PS> Get-FileHash .\\Invoice_7731.zip | Format-List\n\nAlgorithm : SHA256\nHash      : 9F2C4E7A1B6D03C58E2F7A94D1C06B3E85A2F19C47D0E6B3A8C51F92D74E0A61\nPath      : C:\\Users\\kekoa\\Downloads\\Invoice_7731.zip\n\nMulti-engine report for SHA-256 9F2C4E7A…74E0A61\nDetections    3 / 70 engines\nFirst seen    2026-10-19 21:40 UTC\nNames seen    Invoice_7731.zip, inv_7731.zip\nSignature     none\nSandbox       starts a script; contacts cdn-files.example')),
   QUIZ('s9cy2','Check yourself',[
     ['Malia needs to check a spreadsheet of club members’ phone numbers. Which check keeps that data private?',['Upload it to a public scanner','Look up its hash, and upload nothing','Rename it to something random, then upload it','Zip it first, then upload the zip file'],1,'Any upload, renamed or zipped, shares the whole file with the service and its subscribers.',{whys:['A public upload shares every member’s number with the service.','A hash is a fingerprint that keeps the contents secret, so a lookup checks the file while the numbers stay private.','A renamed upload still shares the whole file.','A zip still carries the whole file to the service.'],imp:'core',c:'det-sandboxes'}]
   ]),
   SEQ('Handle a suspicious attachment',[
     ['Stop','Leave it closed: skip Open, Enable Editing, and Enable Content.','amber'],
     ['Hash it','Get-FileHash on Windows or sha256sum on Linux.','l1'],
     ['Look up the hash','A multi-engine service shows detections, the first-seen date, and the names the file went by.','l2'],
     {ask:'Does a sandbox report exist?',detail:'A sandbox runs the file on an isolated machine and records what it did.',branches:[['Yes','Read it: files written, programs started, and domains contacted.'],['No','Leave it closed for IT; upload only a file that holds nothing private, and only when IT says so.']]},
     ['Report','Use the Report button, or send the message to IT as an attachment. Include the hash.','l3'],
     ['Record','Log the time in UTC, the sender, the subject, the hash, your verdict, and the action.','ok']
   ],{bloom:'Apply'}),
   SCALE('Reading a multi-engine scan result',{from:'Zero engines',to:'Most engines',bands:[
       ['0 of 70','Unknown, not clean: new and targeted files start here, so weigh the signer, how it arrived, and the first-seen date','muted',1.3],
       ['1 to 3','A cautious engine’s false positive, or a threat few engines know yet: read the detection names and sandbox report','amber'],
       ['4 to 15','Several engines agree: treat it as malicious, report it, and block the hash','bad'],
       ['16 or more','Known malware: block the hash and the sender, and search every mailbox and machine for copies','bad']]},
     {bloom:'Apply',key:[['muted','Unknown'],['amber','Unsettled'],['bad','Malicious']],
      note:'Results change by the hour, so recheck before you close the case.',
      caption:'Zero detections means only that no engine recognizes the file yet.'}),
   QUIZ('s9cy3','Check yourself',[
     ['A hash lookup on an unexpected attachment shows 3 of 70 engines, first seen yesterday, and no signer. Next step?',['Open it, since 67 engines call it clean','Upload copies to every scanner you can find','Rename it, then open it','Leave it closed and report it with the hash'],3,'A few detections on a day-old, unsigned file from a stranger are reason enough to stop.',{whys:['A few detections on a new, unsigned file are reason to stop, since most engines have yet to see it.','Every upload shares the file with another service.','Renaming leaves the file’s contents the same.','A day-old, unsigned file that some engines flag is suspect, so it stays closed, and the hash lets IT block every copy.'],imp:'core',c:'det-sandboxes'}]
   ]),
   C('Report it the right way','Apply',
     TIPS('<b>Email:</b> use the Report phishing button in your mail app; it sends IT the full message with its headers and clears it from your inbox.',
          '<b>When the app offers only Forward,</b> send the message to IT <i>as an attachment</i>; an ordinary forward drops the headers.',
          '<b>Text:</b> report it as junk in the messages app (in the US, also forward it to 7726, which spells SPAM), then delete it.',
          '<b>Check any “order” or “toll” notice in the real app,</b> which shows the company’s own record of your account.',
          '<b>Call:</b> hang up, call back on a number you already know, and tell IT what the caller wanted.',
          '<b>Already clicked or typed?</b> Report now; fast reports earn thanks and shrink the damage. Change the password from a clean device too (<a href="#freshman/f2">Safe and ethical online</a>).',
          '<b>Leave the testing to IT.</b> Replying, clicking to see what happens, and forwarding to friends all spread the risk.')),
   DETAIL('Threat intelligence and OSINT',
     P('Your report becomes <b>threat intelligence</b>: evidence about attackers that helps defenders decide what to do. The sender, domain, link, and hash are indicators that IT blocks and then searches for in every mailbox and log.'),
     P('Defenders also read shared advisories, such as CISA alerts, and <b>OSINT</b>, intelligence from public sources, including what their own organization shows the world.')),
   QUIZ('s9q','Check: what do you do next?',[
     ['An email from the principal’s real address passes DMARC, asks the office for gift cards today, and has a free-mail Reply-To. Next move?',['Call the principal on a known number','Buy them, since DMARC passed','Reply to ask whether it is real','Forward it to the staff as a warning'],0,'A taken-over mailbox sends from the real domain and passes every check; confirm, then report. <a href="#freshman/f8">Review: Threats and the people behind them</a>',{whys:['A number you already know reaches the real principal, which takes a taken-over mailbox out of the conversation.','A taken-over mailbox passes DMARC too, because it sends from the real domain.','A reply goes to the free-mail Reply-To, which the sender controls.','Forwarding spreads the lure; the report goes to IT.'],imp:'core',c:'threat-email-checks'}],
     ['A URL scan shows a link that redirects three times and ends at a copy of the Hōkū Hardware sign-in page on a domain registered two days ago. What next?',['Visit it yourself to confirm','Close the case, since the scanner visited safely','Report it so IT blocks the domain','Sign in with a made-up password to test it'],2,'Once a scan shows phishing, report it and leave the testing to IT.',{whys:['Visiting exposes your own device, and the scanner already visited for you.','The scan found phishing, so the case moves to blocking.','The scan already answered: a days-old domain serving your own sign-in page is phishing, and a report lets IT block it and warn staff.','Typing anything into a phishing page engages the attacker.'],imp:'core',c:'threat-email-checks'}],
     ['A text tells Nohea her Kahului parking fine is unpaid and links to a short address with a 24-hour deadline. What does she do?',['Tap the link and pay before the deadline passes','Reply STOP so the sender takes her off the list','Type the county’s real web address, then report the text','Forward it to friends so they can watch for it'],2,'Smishing hides its target in a short link; any reply, even STOP, confirms the number is live.',{whys:['The short link and the deadline are the smishing tells.','Replying STOP tells the sender the number is live.','Typing the county’s real address skips the sender’s link, so she sees the true record, and the report warns others.','Forwarding spreads the lure to more people.'],imp:'core',c:'sec-social-engineering'}],
     ['The bait reached Kekoa’s inbox; he left the link and file closed and reported it. Which kill-chain step did the attack reach?',['Weaponization','Delivery','Exploitation','Installation'],1,'Delivery is where the bait arrives, and a report there costs the least. <a href="#freshman/f8">Review: Threats and the people behind them</a>',{whys:['Weaponization happens before any contact with Kekoa.','Delivery is the step where bait arrives, and his report stopped the attack there, before any code ran.','Exploitation needs a click or a flaw, and he left both closed.','Installation needs code to run first.'],imp:'core',c:'threat-kill-chain'}],
     ['A link in Makana’s next email opens a perfect copy of the shop’s sign-in page on hoku-hardwre.example. He normally signs in with a passkey. Would the passkey have stopped this page?',['No: the page looks identical to the real one','Only with an SMS code added as well','Only when he signs in on a shop computer','Yes: it works only on hoku-hardware.example'],3,'Unlike a passkey, codes and passwords typed into a fake page can be relayed. <a href="#freshman/f10">Review: Keys, locks, and certificates</a>',{whys:['Looks fool people, while a passkey checks the site’s name.','The passkey already stops this page, and an SMS code can be relayed.','A passkey checks the site’s name on any device.','A passkey is tied to hoku-hardware.example, so on hoku-hardwre.example it declines to sign in and hands over nothing.'],imp:'core',c:'sec-passwords-mfa'}],
     ['That look-alike page shows a padlock. What does the padlock prove?',['A private connection to hoku-hardwre.example','Hōkū Hardware itself runs this site','The site passed a malware scan today','The domain has been registered for a year'],0,'Phishing pages carry padlocks too, so check the registered domain. <a href="#freshman/f11">Review: The web and the cloud in plain words</a>',{whys:['A padlock shows the connection is encrypted to whichever site is open, and here that site is the look-alike domain.','Free certificates let any site show a padlock.','A padlock covers the connection; malware scans are separate.','Domain age comes from RDAP, and the padlock covers the connection.'],imp:'core',c:'crypto-tls'}],
     ['After the phishing wave, the sign-in log shows one common password tried once against each of 60 staff accounts. Which control helps most?',['A lockout after 3 failures, not 5','Forced password changes every 30 days','MFA and a banned-password list','Renaming every account'],2,'Password spraying tries one password across many accounts to stay under lockout. <a href="#freshman/f3">Review: Security principles</a>',{whys:['Spraying tries once per account, so it stays under a threshold of 3 just as it does under 5.','Forced changes push users toward patterns.','MFA makes a guessed password fall short on its own, and a banned-password list removes the common passwords a spray tries.','Renamed accounts still face the same common password.'],imp:'core',c:'sec-passwords-mfa'}],
     ['A sandbox report says the file encrypted test documents and left a payment note. Which malware type is it, and what protects the shop?',['Spyware; a screen lock on every computer','Ransomware; offline backups, patching, and MFA','A worm; longer passwords for all staff','A rootkit; a new router'],1,'Ransomware wants money, so a clean offline backup removes most of its leverage. <a href="#freshman/f8">Review: Threats and the people behind them</a>',{whys:['Spyware watches and steals, and this one encrypted files.','Encrypted files plus a payment note mark ransomware, and an offline backup lets the shop restore without paying.','A worm spreads itself; encrypted files plus a payment note mark ransomware.','A rootkit hides other malware; encrypted files plus a payment note mark ransomware, and a new router restores nothing.'],imp:'core',c:'sec-malware-types'}],
     ['Why does a URL scanner or a sandbox open the link or file for you?',['It runs faster','It deletes the malware','It makes the link safe to click later','It runs on an isolated machine'],3,'Whatever the page or file does stays there, away from your device and accounts. <a href="#freshman/f4">Review: Computers, virtualization, and the network</a>',{whys:['Speed is a side issue, and isolation is the point.','A sandbox records behavior, and cleanup is a separate job.','Results change by the hour, so the link stays risky.','Whatever the link or file does happens on the isolated machine, away from your device and accounts.'],imp:'good',c:'det-sandboxes'}],
     ['Kalani’s mail app lacks a Report button. How does she send the suspicious email to IT?',['Forward it as an attachment','Paste its text into a new email','Send a screenshot alone','Reply to the sender and copy IT'],0,'A plain forward or a screenshot drops the headers IT needs to trace the sender.',{whys:['Forwarding as an attachment sends the original message whole, headers included, and IT needs those headers to trace the sender.','Pasted text drops the headers.','A screenshot drops the headers and the links.','Replying engages the sender.'],imp:'good',c:'threat-email-checks'}]
   ]),
   LINKS('Go further',['icann-lookup','dmarc-org','ftc-phishing'])
   ]},
 {id:'s10',title:'Read the logs: Windows, Linux, and network devices',bloom:'Apply',sum:'Worked reads of a Windows sign-in event, the event IDs a defender reads first, an auth.log line, and firewall and router log lines, plus the pipeline that counts them and the habits that keep logs trustworthy.',
  can:'read a Windows sign-in event, an auth.log line, and firewall and router log lines, count them with a pipeline, and keep logs trustworthy',
  blocks:[
   C('Where each system writes its story','Apply',
     P('Every sign-in, block, and change leaves a line somewhere. This unit reads lines from three places: a Windows PC at Kaimana Dental Clinic in Kailua, the makani-web server in Hilo, and the Site A router. Read the fields, convert the time, then decide whether it matters.'),
     CMDS('Read, follow, and filter',[
       ['sudo tail -n 50 /var/log/auth.log','The newest 50 lines. Logs grow at the bottom.'],
       ['sudo tail -f /var/log/auth.log','Follow the log: each new line prints as it lands. Ctrl+C stops. Older lines rotate into auth.log.1 and .gz files (zgrep reads those); tail -F keeps following after a rotation.'],
       ['sudo journalctl -u ssh -f','The same on a journal-only system such as Debian 12 or 13.'],
       ['sudo head -n 3 /var/log/ufw.log','The first, oldest lines: learn the format before you build a filter.'],
       ['sudo grep -c \'Failed password\' /var/log/auth.log','Count matching lines. -i ignores case, -n adds line numbers, -v keeps the lines without a match, -o prints only the match, -r searches a whole folder, and -E allows patterns such as useradd|usermod. Before you report a count, read a few hits in place (grep -n, then the lines around them).'],
       ['Get-WinEvent -FilterHashtable @{LogName=\'Security\';Id=4625} -MaxEvents 20','Windows: the 20 newest failed sign-ins. Run it from an elevated prompt.'],
       ['Get-WinEvent -FilterHashtable @{LogName=\'System\';Id=7045} -MaxEvents 20','Windows: the newest service installs. 7045 lives in the System log, so name that log.']
     ])),
   COMPARE('The event IDs a defender reads first',[
     {name:'Sign-ins',tag:'Security log',tone:'l1',
      rows:[['4624','Sign-in succeeded. Who, how (logon type), and from where?'],['4625','Sign-in failed. Who keeps failing, and why (SubStatus)?'],['4634 / 4647','Session ended / user chose sign-out. How long did it last?'],['4672','Admin-level sign-in (it also fires for SYSTEM and services). Should this account hold that power?'],['4740','Account locked out. Mistyped password, or a guessing attack?']],
      hook:'the front door: who came in, and who could not.'},
     {name:'Accounts and groups',tag:'Security log',tone:'l2',
      rows:[['4720 / 4726','User account created / deleted. Does the brief name it?'],['4728 / 4732','Member added to a global / local security group. Did someone just gain admin rights?']],
      hook:'the guest list: who exists, and who holds keys.'},
     {name:'New code and tampering',tag:'Security and System',tone:'bad',
      rows:[['4688','New process started. What ran? (The command line appears only once auditing turns it on: <a href="#junior/j2">Group Policy</a>.)'],['7045','Service installed, in the <b>System</b> log. Who added it, and what file does it run?'],['1102','Security log cleared. Who is hiding what? Forwarded copies keep the record.']],
      hook:'the alarm wires: new programs and erased tracks.'}
   ],{intro:'An event ID names what happened; the fields inside say who, how, and from where.',
     note:'Each Security-log ID except 1102 appears only when audit policy records its category (<a href="#sophomore/s2">Audit policy: turn the lights on</a>). 1102 and 7045 (System log) are always written.',bloom:'Apply'}),
   C('Read one failed sign-in','Apply',
     TERM('Event 4625, Security log, KAIMANA-FD1 (Event Viewer, General tab, trimmed)\nAn account failed to log on.\nLogon Type:              3\nAccount For Which Logon Failed:\n   Account Name:          keola\nFailure Information:\n   Failure Reason:        Unknown user name or bad password.\n   Status:                0xC000006D\n   Sub Status:            0xC000006A\nNetwork Information:\n   Workstation Name:      DESKTOP-4QX9T2\n   Source Network Address: 203.0.113.50\nDetails tab (XML): <TimeCreated SystemTime="2026-10-20T19:14:03.5123456Z" />'),
     ANATOMY(null,[
       {name:'Event 4625',tag:'Security log',tone:'l1',children:[
         {name:'Who, how, and from where',tone:'l2',grid:true,children:[
           {name:'TimeCreated',text:'19:14:03Z (UTC): 9:14:03 AM HST'},
           {name:'Account Name',text:'keola: the account tried'},
           {name:'Logon Type',text:'3: over the network'},
           {name:'Source Network Address',tone:'amber',text:'203.0.113.50: where it came from'},
           {name:'Workstation Name',tone:'muted',text:'The sender’s claim: a hint'}]},
         {name:'Why it failed',tone:'bad',grid:true,children:[
           {name:'0xC000006D',text:'Status: failed; read Sub Status'},
           {name:'0xC000006A',text:'Sub Status: real account, wrong password'},
           {name:'0xC0000064',text:'Sub Status: no such user'},
           {name:'0xC0000234',text:'Status: account locked out'}]}
       ]}
     ],{facts:{head:['Logon type','Means','Look closer when'],rows:[
       ['2','At the keyboard','a server room PC at 3 a.m.'],
       ['3','Over the network: a share, or a failed Remote Desktop try with NLA','the local Administrator signs in to many PCs, or one address tries many accounts'],
       ['4 / 5','Batch job / service start','a new account suddenly runs as one'],
       ['7','Screen unlock','rarely worth a look'],
       ['10','Remote Desktop','a service account, or an outside address'],
       ['11','Cached sign-in, offline','a laptop that never leaves the office']]},
      note:'Weigh Source Network Address over Workstation Name: the sender picks the name, and a NAT or VPN address can hide the true origin.'}),
     COMPARE('Brute force and password spray in 4625s',[
       {name:'Brute force',tag:'one door',tone:'amber',
        rows:[['Accounts','One account, many tries'],['Sub Status','0xC000006A on every try'],['Lockout','The run ends in 4740'],['What stops it','A lockout threshold and MFA']],
        hook:'many keys on one door.'},
       {name:'Password spray',tag:'every door',tone:'bad',
        rows:[['Accounts','Many names, about one try each, in seconds or spread over hours'],['Sub Status','0xC000006A and 0xC0000064 mixed'],['Lockout','Stays under it: no 4740'],['What stops it','MFA, banned common passwords, and an alert when one address touches many names']],
        hook:'one key on every door.'}
     ])),
   DETAIL('XML field names in a 4625',
     P('The XML names the same fields TargetUserName, LogonType, IpAddress, and SubStatus.')),
   QUIZ('s10ck1','Check yourself',[
     ['A 4625 shows Sub Status 0xC0000064. What does it tell you?',['The password was wrong','The account is locked out','The account name does not exist','The sign-in succeeded'],2,'0xC000006A, a real account with a wrong password, is the Sub Status to worry about.',{whys:['A wrong password on a real account shows 0xC000006A.','A lockout shows Status 0xC0000234.','0xC0000064 marks a name this PC has never heard of, so the guess missed every real account.','A success logs as 4624; every 4625 is a failure.'],imp:'core',c:'det-windows-events'}]
   ]),
   ANATOMY('One auth.log line',[
     {name:'Line from makani-web, Hilo',tag:'Ubuntu 24.04',tone:'l1',text:'<samp>2026-10-20T09:14:03.512345-10:00 makani-web sshd[2211]: Failed password for invalid user admin from 203.0.113.50 port 51122 ssh2</samp>',grid:true,children:[
       {name:'Date',tone:'l2',text:'2026-10-20'},
       {name:'Time',tone:'l2',text:'09:14:03.512345'},
       {name:'Offset',tone:'amber',text:'-10:00: UTC−10, Hawaiʻi'},
       {name:'Host',tone:'l2',text:'makani-web'},
       {name:'Program[pid]',tone:'l2',text:'sshd[2211]: SSH, process 2211'},
       {name:'Message',tone:'amber',text:'what happened, to whom, from where'}
     ]}
   ],{intro:'Linux writes sign-ins, sudo, and SSH events as one line each. The same parts appear on every syslog-style line; the timestamp is ISO 8601: date, time, then the offset from UTC.',
     facts:{head:['','What to know'],rows:[
       ['Older form','Oct 20 09:14:03 (older systems and FreeBSD) leaves out the year and the zone: note both yourself.'],
       ['Hawaiʻi time','UTC−10 all year, without daylight saving time: add 10 hours for UTC. 09:14 HST is 19:14 UTC.'],
       ['Ubuntu and Mint','/var/log/auth.log, or journalctl'],
       ['Debian 12 and 13','Journal only by default: journalctl -u ssh. On Debian 13 the program shows as sshd-session.'],
       ['invalid user','The name is unknown on this system, just like SubStatus 0xC0000064 on Windows.']]},
     caption:'Read the offset before you compare times.',bloom:'Apply'}),
   ANATOMY('Firewall and router block lines',[
     {name:'ufw on Mint or Ubuntu',tag:'/var/log/ufw.log; Debian: journalctl -k',tone:'l1',text:'<samp>[UFW BLOCK] IN=eth0 OUT= SRC=203.0.113.80 DST=10.0.5.20 … PROTO=TCP SPT=51544 DPT=23 … SYN</samp>',grid:true,children:[
       {name:'Action',text:'UFW BLOCK'},{name:'IN',text:'eth0: arrived here'},{name:'SRC / DST',text:'from 203.0.113.80 to 10.0.5.20'},{name:'DPT',text:'23: the port it wanted (Telnet)'}]},
     {name:'Windows Defender Firewall',tag:'pfirewall.log',tone:'l2',text:'<samp>2026-10-20 09:21:40 DROP TCP 203.0.113.80 10.0.5.31 51550 3389 … RECEIVE</samp>',grid:true,children:[
       {name:'Date and time',text:'local time'},{name:'Action',text:'DROP'},{name:'src-ip dst-ip',text:'203.0.113.80 to 10.0.5.31'},{name:'dst-port',text:'3389: Remote Desktop'}]},
     {name:'Cisco router, Site A',tag:'syslog',tone:'l3',text:'<samp>Oct 20 19:14:05.311: %SEC-6-IPACCESSLOGP: list EDGE-IN denied tcp 203.0.113.80(51544) -> 203.0.113.2(23), 1 packet</samp>',grid:true,children:[
       {name:'Oct 20 19:14:05.311',text:'router clock in UTC, no year; a leading * means never synced: doubt it'},{name:'SEC-6-<wbr>IPACCESS<wbr>LOGP',text:'facility, severity 6, and mnemonic'},{name:'EDGE-IN denied',text:'the ACL and its action'},{name:'203.0.113.2',text:'the router’s outside address, read before NAT'},{name:'(51544) -> (23)',text:'source port to the port it wanted'},{name:'1 packet',text:'then a count every 5 minutes'}]}
   ],{intro:'Three devices, one story: the same outside address knocked on Telnet and Remote Desktop.',
     note:'<b>Turn logging on before you need it.</b> Windows writes %SystemRoot%\\System32\\LogFiles\\Firewall\\pfirewall.log only after <samp>Set-NetFirewallProfile -Profile Domain,Private,Public -LogBlocked True</samp>. ufw logs blocks at its default low level: confirm Logging: on (low) in <code>sudo ufw status verbose</code>, or run <code>sudo ufw logging on</code>. Router: an ACL line logs only when it ends in <code>log</code>, so an explicit <samp>deny ip any any log</samp> makes the implicit final deny visible.',bloom:'Apply'}),
   TIPS('<b>A router ACL</b> checks packets against permit and deny lines top down: first match wins, and an unseen implicit deny drops the rest.',
        'File ACLs (f5, s2) list who may open a file; a router ACL filters packets by address and port instead.'),
   QUIZ('s10ck2','Check yourself',[
     ['<code>Oct 20 19:14:05.311: %SEC-6-IPACCESSLOGP: list EDGE-IN denied tcp 203.0.113.80(51544) -> 203.0.113.2(23), 1 packet</code>. Which port did the sender want?',['51544','6','23','1'],2,'Each address carries its port in parentheses: the sender’s first, then the one it wanted.',{whys:['51544 is the sender’s own port.','6 is the syslog severity.','In 203.0.113.2(23), the number in parentheses after the destination address is the port the sender asked for: 23, Telnet.','1 is the packet count.'],imp:'core',c:'det-firewall-logs'}]
   ]),
   SCALE('Syslog severity, 0 to 7',{x:['Severity','Name, with an example message'],y:['Level','0','1','2','3','4','5','6','7'],cells:[
     [['Emergency','System unusable','bad']],[['Alert','Act now','bad']],[['Critical','<code>%PORT_SECURITY-2-<wbr>PSECURE_VIOLATION</code>','bad']],[['Error','<code>%LINK-3-UPDOWN</code>: Gi0/1 down','amber']],
     [['Warning','<code>%DHCPD-4-<wbr>PING_CONFLICT</code>: address already in use','amber']],[['Notice','<code>%SYS-5-CONFIG_I</code>: configured by keola','l2']],[['Informational','<code>%SEC-6-<wbr>IPACCESSLOGP</code>: ACL deny','l2']],[['Debug','Troubleshooting only','muted']]]},
     {intro:'Linux, routers, and switches tag every syslog message with a severity. Lower numbers are more urgent.',
      note:'A central syslog server (UDP 514, or TLS on 6514) keeps a copy off the device. Routers send levels 0 to 6 by default (<samp>logging trap informational</samp>); confirm with <code>show logging</code> and keep it there, so ACL hits (level 6) arrive.',bloom:'Apply'}),
   C('Count instead of scroll','Apply',
     SEQ('A pipeline that shrinks the pile',[
       ['<code>grep \'Failed password\'</code> <code>/var/log/auth.log</code>','<samp>… Failed password for invalid user admin from 203.0.113.50 port 51122 ssh2<br>… Failed password for keola from 198.51.100.23 port 40218 ssh2</samp>'],
       ['<code>| grep -oE \'from [0-9.]+\'</code>','<samp>from 203.0.113.50<br>from 198.51.100.23</samp>'],
       ['<code>| awk \'{print $2}\'</code>','<samp>203.0.113.50<br>198.51.100.23</samp>'],
       ['<code>| sort</code>','<samp>198.51.100.23<br>203.0.113.50</samp>'],
       ['<code>| uniq -c</code>','<samp>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;3 198.51.100.23<br>&nbsp;&nbsp;&nbsp;&nbsp;412 203.0.113.50</samp>'],
       ['<code>| sort -rn | head</code>','<samp>&nbsp;&nbsp;&nbsp;&nbsp;412 203.0.113.50<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;3 198.51.100.23</samp>']
     ],{intro:'Each stage passes its output to the next.',
       note:'<b>Pull the address by pattern.</b> “invalid user” adds two words, so the address sits in a different field on different lines; <code>grep -o</code> prints only the part that matches, wherever it sits. <code>uniq -c</code> counts only neighbors, so <code>sort</code> comes first. Single quotes keep the shell’s hands off $, *, and !.'}),
     CMDS('Reading one pattern',[
       ['.','Any one character'],['*','The item before it, zero or more times'],['+','The item before it, one or more times (grep -E)'],['^ and $','Start and end of the line'],['[0-9]','One digit; inside [ ] a dot is a real dot, so [0-9.]+ matches 203.0.113.50'],['\\.','A real dot outside [ ]'],
       ['grep -E \'Failed password for (invalid user )?[a-z]+ from\'','Both line shapes: ( )? makes “invalid user ” optional. Without it, an invalid-user line fails, because “user” sits where “ from” should be.']
     ])),
   SCALE('Event, alert, incident',{from:'Raw',to:'Proven',bands:[
     ['Event','Anything a system records: 412 failed sign-ins are 412 events.','muted'],
     ['Alert','A rule says some events need a person: 20 failures from one address in 5 minutes.','amber'],
     ['Incident','Evidence confirms harm or a real threat to confidentiality, integrity, or availability: the same address then signs in (4624) and creates an account (4720).','bad',2]]},
     {note:'Triage decides what happens to each alert: <b>severity</b> (how bad if real) times <b>confidence</b> (how likely real). Confirm a true positive with the matching log line before you act; record a false positive so the rule gets tuned.',bloom:'Apply'}),
   QUIZ('s10ck3','Check yourself',[
     ['The pipeline prints <code>412 203.0.113.50</code> on top. Which line turns this alert into an incident on makani-web?',['A larger count from the same address','An Accepted password line for 203.0.113.50','<code>Invalid user admin from 203.0.113.50</code>','A Failed password line for keola from 198.51.100.23'],1,'The 412 failures already make a true positive, a real attack correctly flagged; proof of harm makes an incident.',{whys:['More failures grow the alert; a success proves harm.','A success from the same address shows the attack worked: an incident.','An unknown name is one more failed try.','A different address is a separate lead.'],imp:'core',c:'det-triage'}]
   ]),
   C('Record it, escalate it, and keep it','Apply',
     TERM('Indicators, KAIMANA-FD1 case (times in UTC)\ntype     value              first seen            source         confidence\nipv4     203.0.113.50       2026-10-20T19:14:03Z  4625 x 37      high\naccount  svc_update         2026-10-20T19:22:41Z  4720           high\nservice  UpdSvc (7045)      2026-10-20T19:23:05Z  System log     medium\n\nEscalation note:\n  Fired:   spray rule\n  Checked: 37 accounts tried, 6 real; 4624 for pua at 19:22Z\n  Unknown: what UpdSvc runs'),
     TIPS('An <b>indicator of compromise</b> (IOC) is an attack’s trace: an address, file hash, domain, account, or service. Record each one’s first-seen time and place.',
          'Share each indicator with its date so a teammate can search every other machine; indicators age fast.',
          'A good <b>escalation note</b> says what fired, what you checked, and what is still unknown.',
          '<b>Keep logs trustworthy.</b> Forward a copy to the SIEM or syslog server as each line is written, and alert on event 1102 and silent gaps.',
          'Size the Security log (20 MB by default) and keep logs as long as policy and law require.',
          '<b>One clock.</b> NTP keeps every device on the same time: check with <code>timedatectl</code>, <code>w32tm /query /status</code>, or <code>show ntp associations</code> on a router (<a href="#sophomore/s5">Cisco setup</a>).',
          'Proof of sync: <code>timedatectl</code> shows System clock synchronized: yes, and <code>show ntp associations</code> marks the server in use with an *.',
          '<b>Two logs 9 minutes apart</b> about one sign-in point at a clock first; Kerberos sign-ins fail once clocks drift past 5 minutes.',
          '<b>Recovery reads the logs too.</b> The earliest bad line sets the restore point: use the last backup before it, checked for the same indicators, then keep watching.')),
   MATCH('s10m','Event ID to meaning','Tap an event ID on the left, then its meaning on the right.',[
     ['4624','A sign-in succeeded','Windows writes 4624 for every successful sign-in, and its logon type says how, such as 10 for Remote Desktop.'],
     ['4625','A sign-in failed','Windows writes 4625 for every failed sign-in, and its Sub Status tells a wrong password (0xC000006A) from an unknown name (0xC0000064).'],
     ['4672','Special privileges assigned: an admin-level sign-in','Windows writes 4672 when a sign-in receives admin-level powers; it also fires for SYSTEM and services.'],
     ['4688','A new process started','Windows writes 4688 each time a program starts, so it shows what ran, once audit policy records it.'],
     ['4720','A user account was created','Windows writes 4720 when an account is created; an unapproved account is a classic way for an intruder to stay in.'],
     ['4732','A member was added to a local security group','Windows writes 4732 when an account joins a local group such as Administrators, often right after a 4720.'],
