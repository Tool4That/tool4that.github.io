  {term:'TCP and UDP',def:'The two layer 4 protocols: TCP sets up a connection and retransmits losses; UDP sends each datagram on its own, faster and without a delivery guarantee.',at:'freshman/f7'},
  {term:'TCP/IP model',def:'The four-layer model of the internet’s protocols: Link, Internet, Transport, and Application.',at:'freshman/f7'},
  {term:'tcpdump',def:'The command-line capture tool on Linux and BSD: one packet per line, with filters such as port 53 or host 10.1.20.30.',at:'junior/j7'},
  {term:'Technique (ATT&CK)',def:'The method used to reach a tactic’s goal, such as Scheduled Task; each has a T number.',at:'junior/j11'},
  {term:'Testing distribution',def:'A Linux distribution preloaded with security-testing tools, such as Kali Linux or Parrot OS. Testing a system someone else owns takes the owner’s written permission.',at:'freshman/f6'},
  {term:'Thread',def:'A path of execution inside a process that shares the process’s memory and permissions.',at:'sophomore/s4'},
  {term:'Threat',def:'Who or what might attack or harm a system, such as a phishing crew or a flood of traffic.',at:'freshman/f3'},
  {term:'Threat hunting',def:'Searching for an intruder from a hypothesis instead of an alert, then turning each search into a detection rule.',at:'junior/j12'},
  {term:'Threat intelligence',def:'Evidence about attackers, such as bad domains, hashes, and methods, that helps defenders decide what to do.',at:'sophomore/s9'},
  {term:'Threat modeling',def:'Asking what can go wrong with a design before it ships, then choosing controls for each threat.',at:'senior/se12'},
  {term:'Ticket-granting ticket (TGT)',def:'The Kerberos ticket a DC issues at sign-in; the user shows it to get service tickets without the password.',at:'junior/j1'},
  {term:'Tier 0',def:'The DCs and everything that controls them; Tier 0 admin accounts sign in only to Tier 0 machines.',at:'junior/j1'},
  {term:'Timeshift',def:'Mint’s system snapshot tool, which leaves home folders out by default.',at:'freshman/f6'},
  {term:'TLS',def:'The protocol behind the padlock (a slider icon in Chrome): it encrypts a connection and checks the server’s certificate. It replaced the retired SSL.',at:'freshman/f11'},
  {term:'TLS handshake',def:'The greeting before any page moves: both sides agree on a version and fresh keys, and the server proves its identity with its certificate.',at:'sophomore/s8'},
  {term:'toor',def:'FreeBSD’s spare UID 0 account, normal while its hash in master.passwd is *.',at:'senior/se1'},
  {term:'TPM (Trusted Platform Module)',def:'A security chip, or a protected part of the processor, that stores keys and records a fingerprint of each boot step; BitLocker uses it to release the drive key only to an untouched PC.',at:'freshman/f5'},
  {term:'Traceroute',def:'A tool (tracert on Windows) that lists each router on a path by sending probes with a rising TTL and reading the time-exceeded replies.',at:'sophomore/s7'},
  {term:'Traffic Light Protocol (TLP)',def:'Labels on shared intelligence (CLEAR, GREEN, AMBER, AMBER+STRICT, and RED) that set who may see it.',at:'junior/j11'},
  {term:'Triage',def:'Deciding what to handle first: alerts by severity and scope, or findings by impact, effort, and availability risk.',at:'junior/j5'},
  {term:'Trojan',def:'Malware that poses as wanted software.',at:'freshman/f3'},
  {term:'True negative',def:'Quiet on harmless activity: the tool was right to stay silent.',at:'freshman/f13'},
  {term:'True positive',def:'An alert on a real attack: the tool was right to fire.',at:'freshman/f13'},
  {term:'Trunk',def:'A link that carries many VLANs, tagging each frame with its VLAN ID.',at:'freshman/f7'},
  {term:'Trust store',def:'The list of root certificates a device or browser already trusts.',at:'freshman/f10'},
  {term:'TTL',def:'A packet counter each router lowers by one, so a looping packet eventually dies.',at:'freshman/f7'},
  {term:'TTPs (tactics, techniques, and procedures)',def:'How an attacker works; the indicators hardest for an attacker to change.',at:'junior/j11'},
  {term:'Type 1 hypervisor',def:'A hypervisor installed straight onto the hardware, such as ESXi, Hyper-V, or Proxmox VE.',at:'freshman/f4'},
  {term:'Type 2 hypervisor',def:'A hypervisor that runs as an app on a host OS, such as VirtualBox or VMware Workstation Pro.',at:'freshman/f4'},
  {term:'Type 7',def:'A reversible IOS password encoding that service password-encryption produces.',at:'sophomore/s5'},
  {term:'Typosquatting',def:'Registering a domain one slip away from a real one to catch mistakes and dress up phishing links.',at:'freshman/f8'},
  {term:'UAC (User Account Control)',def:'The Windows feature that runs administrators with standard rights and asks before a program gets full rights.',at:'freshman/f5'},
  {term:'UEFI',def:'Unified Extensible Firmware Interface: the code built into a PC that checks the hardware and starts the boot manager; it replaced the older BIOS.',at:'freshman/f5'},
  {term:'ufw',def:'Uncomplicated Firewall: the front end that writes Linux packet-filter rules on Ubuntu and Mint.',at:'sophomore/s3'},
  {term:'UID',def:'The number that identifies an account to the kernel: 0 is root, and people get 1000 and up.',at:'freshman/f6'},
  {term:'umask',def:'The permission bits new files and folders start without: 022 gives files 644, and 027 gives 640.',at:'junior/j3'},
  {term:'Update ring',def:'A group of machines that gets updates at the same stage: test, pilot, or broad.',at:'junior/j2'},
  {term:'updatedb',def:'The command that rebuilds the file-name index locate searches. It runs daily on a timer; run sudo updatedb to include files made since then.',at:'sophomore/s3'},
  {term:'UPnP',def:'A router feature that lets apps open port forwards on their own. Turn it off and forward only what the brief names.',at:'sophomore/s7'},
  {term:'URL scanner',def:'A service that visits a link in its own browser and reports the redirects, final address, screenshot, and domains contacted.',at:'sophomore/s9'},
  {term:'Use after free',def:'A memory flaw where a program keeps using memory it already handed back, so new data there can steer or crash it.',at:'senior/se2'},
  {term:'User Rights Assignment',def:'The policy section that grants privileges such as Allow log on locally and Debug programs to users and groups.',at:'junior/j2'},
  {term:'UTC (Coordinated Universal Time)',def:'The one reference clock logs are converted to, so events from many devices line up in true order.',at:'freshman/f13'},
  {term:'Vendor-neutral certification',def:'A certification that covers skills across many products, such as CompTIA’s or ISC2’s, rather than one vendor’s line.',at:'senior/se14'},
  {term:'Verification',def:'Checking that a change worked and that every required service and authorized user still works.',at:'freshman/f1'},
  {term:'Version control',def:'A system such as Git that keeps every version of a set of files, with who changed what, when, and why.',at:'senior/se10'},
  {term:'Virtual account',def:'A per-service identity (NT SERVICE\\name) that Windows manages; it uses the computer account on the network.',at:'junior/j1'},
  {term:'Virtual machine (VM)',def:'A whole computer running as a program inside another computer.',at:'freshman/f4'},
  {term:'Vishing',def:'Voice phishing: a call or voicemail posing as IT, a bank, or a boss.',at:'freshman/f8'},
  {term:'VLAN',def:'A group of switch ports that forms its own broadcast domain, usually with its own IP subnet.',at:'freshman/f7'},
  {term:'VLSM',def:'Carving one address block into subnets of different sizes, largest first.',at:'sophomore/s5'},
  {term:'Voice VLAN',def:'A separate VLAN for IP phones on an access port: the phone’s traffic crosses tagged in it while the PC behind the phone stays in the access VLAN.',at:'junior/j4'},
  {term:'VPN (virtual private network)',def:'An encrypted tunnel between two ends across a network someone else runs: remote access for one device, or site to site.',at:'freshman/f9'},
  {term:'VTP',def:'VLAN Trunking Protocol, which copies VLAN lists between switches in server and client modes.',at:'junior/j4'},
  {term:'VTP transparent mode',def:'A VTP setting in which a switch keeps its own VLAN list and ignores VLAN changes advertised by other switches.',at:'junior/j4'},
  {term:'VTY line',def:'A virtual terminal line that a remote Telnet or SSH session signs in through.',at:'sophomore/s5'},
  {term:'Vulnerability',def:'A weakness that a threat could use.',at:'freshman/f3'},
  {term:'Vulnerability management',def:'The ongoing loop of inventory, scan, rank, fix, verify, and report that keeps known flaws closed.',at:'junior/j5'},
  {term:'WAF (web application firewall)',def:'A filter in front of a web app that inspects whole requests, bodies included, and blocks known attack patterns.',at:'junior/j9'},
  {term:'WAN',def:'Wide area network: links that join distant sites, rented from a provider or run over the internet.',at:'freshman/f9'},
  {term:'Watering hole',def:'An attack that poisons a site one chosen group already trusts, to reach that group.',at:'freshman/f8'},
  {term:'WDigest',def:'An old sign-in package that, with UseLogonCredential set to 1, keeps plaintext passwords in LSASS memory.',at:'senior/se7'},
  {term:'Web root',def:'The folder a web server serves files from, such as C:\\inetpub\\wwwroot on IIS or /var/www/html on Apache.',at:'junior/j1'},
  {term:'Webshell',def:'A script planted in a web root that gives an attacker commands through the web server.',at:'sophomore/s2'},
  {term:'Whaling',def:'Phishing tailored to a leader, such as a principal or an owner.',at:'freshman/f8'},
  {term:'wheel',def:'The FreeBSD group whose members may su to root.',at:'senior/se1'},
  {term:'WHOIS',def:'The older lookup for domain registration data, replaced by RDAP for generic domain endings in January 2025.',at:'sophomore/s9'},
  {term:'Wildcard mask',def:'An ACL and OSPF mask in which 0 bits must match and 1 bits are ignored: the inverse of the subnet mask.',at:'junior/j4'},
  {term:'Windows Event Forwarding (WEF)',def:'Built-in forwarding that copies chosen events from many PCs to a collector server over WinRM.',at:'junior/j8'},
  {term:'Windows LAPS',def:'Built-in Windows feature that gives each machine its own random local admin password, rotates it, and stores it in AD or Entra ID.',at:'junior/j1'},
  {term:'WinRM (Windows Remote Management)',def:'The service behind PowerShell remoting, on ports 5985 and 5986.',at:'junior/j2'},
  {term:'WLAN',def:'Wireless LAN: access points carry the LAN over radio, so it reaches past the walls.',at:'freshman/f9'},
  {term:'Worm',def:'Malware that spreads from machine to machine across a network by itself.',at:'freshman/f8'},
  {term:'WPA3',def:'The current Wi-Fi security mode. Its SAE handshake resists offline password guessing; WPA2 with AES is the minimum for older devices.',at:'freshman/f9'},
  {term:'WPS',def:'Wi-Fi Protected Setup: joining by button or 8-digit PIN. The PIN is checked in two halves and falls in hours, so turn WPS off.',at:'sophomore/s7'},
  {term:'Write blocker',def:'A device or setting that lets a tool read an evidence disk and blocks every write to it.',at:'junior/j13'},
  {term:'XSS (cross-site scripting)',def:'A site shows visitor-supplied text without encoding it, so other visitors’ browsers run it as script. It comes stored, reflected, or DOM-based.',at:'junior/j9'},
  {term:'YAML',def:'A data format that shows structure with indentation and dashes, so one misplaced space changes the meaning.',at:'freshman/f12'},
  {term:'yescrypt',def:'The slow, salted password hash that current Debian, Ubuntu, and Mint store in /etc/shadow; its hashes start with $y$.',at:'sophomore/s3'},
  {term:'Zero trust',def:'A design that grants no trust for network location: every request is checked for identity, device health, and context, and gets the least access needed.',at:'senior/se11'},
  {term:'Zero-day',def:'A flaw attackers use before the vendor has a patch.',at:'freshman/f8'},
  {term:'Zone transfer',def:'A copy of a whole DNS zone sent to another server, which leaks the network map when it is open to any host.',at:'junior/j1'},
