     ['Which malware spreads from machine to machine across the network with nobody running it?',['Trojan','Worm','Spyware','Rootkit'],1,'A trojan needs someone to run it; a worm travels alone.',{whys:['A trojan spreads only when someone runs it.','A worm copies itself across the network to the next machine with no one running it, which is why patches and firewalls stop it first.','Spyware watches and sends data out, and it rides along with apps someone installs.','A rootkit hides other malware, and something else installs it.'],imp:'core',c:'sec-malware-types'}]
   ]),
   SEQ('The zero-day window',[
     ['Flaw exists','A bug ships inside the software, unnoticed so far.','muted'],
     ['Attackers use it','<b>Zero-day stretch begins: no patch exists.</b> Defense in depth, least privilege, segmentation, and behavior-based detection carry the load.','bad'],
     ['Vendor learns','A researcher or an attack report alerts the vendor, which builds a fix and may publish a workaround.','bad'],
     ['Patch ships','<b>Known-but-unpatched stretch begins: the fix exists.</b> CISA’s KEV catalog lists flaws used in attacks, so it shows what to patch first.','amber'],
     ['Patch installed','The window closes for this machine. Automatic updates close it fastest.','ok']
   ],{intro:'Two stretches leave a machine exposed, and different controls work in each.',
     key:[['bad','zero-day stretch'],['amber','known-but-unpatched stretch']],
     caption:'Most break-ins use the known-but-unpatched stretch, which is why fast patching matters.'}),
   PATH('The attack story in seven steps',[
     {name:'1. Reconnaissance',tag:'Before contact',tone:'l1',note:'Learns about the target: staff names, emails, and open services.'},
     {name:'2. Weaponization',tag:'Before contact',tone:'l1',note:'Builds the bait: a fake invoice with a hidden payload.'},
     {name:'3. Delivery',tag:'Infection: arrive',tone:'l2',note:'Sends it: an attachment, a link, a USB drive, or a poisoned site.'},
     {name:'4. Exploitation',tag:'Infection: run',tone:'l2',note:'Triggers a flaw or a click so the code runs.'},
     {name:'5. Installation',tag:'Infection: stay and hide',tone:'l3',note:'Plants itself to survive a restart and hides from view.'},
     {name:'6. Command and control',tag:'Infection: call home',tone:'l3',note:'Opens a channel back to the attacker’s server for orders.'},
     {name:'7. Actions on objectives',tag:'Infection: act',tone:'bad',note:'Does the job: steals data, encrypts files, or moves to the next machine.'}
   ],{intro:'Defenders split an intrusion into seven steps, called the kill chain. Breaking any one link stops the attack, and an earlier break, such as a report at delivery, costs less.'}),
   DETAIL('How to break each step',
     P('Each link opens the unit that teaches that break.'),
     TIPS('<b>Reconnaissance:</b> share less in public and close unneeded services (<a href="#sophomore/s4">Services and ports</a>).',
          '<b>Weaponization:</b> happens out of view, so watch threat reports (<a href="#junior/j11">Map the attack</a>).',
          '<b>Delivery:</b> mail filters, plus people who verify and report (<a href="#sophomore/s9">Check before you trust</a>).',
          '<b>Exploitation:</b> patching and standard accounts (<a href="#sophomore/s2">Windows 11 hardening</a>).',
          '<b>Installation:</b> endpoint detection and hunts for auto-start entries (<a href="#junior/j3">Debian and deeper Linux</a>).',
          '<b>Command and control:</b> outbound firewall rules and DNS filtering (<a href="#junior/j6">Network security design</a>).',
          '<b>Actions on objectives:</b> least privilege, offline backups, and a fast response (<a href="#freshman/f13">Watch, detect, and respond</a>).')),
   FLASH('f8fl','Trick and malware names',[
     ['Social engineering','Tricking a person into skipping a security check, through urgency, authority, fear, curiosity, or helpfulness.'],
     ['Vishing','Voice phishing: a call or voicemail posing as IT, a bank, or a boss.'],
     ['Smishing','Phishing by text message, usually with a short link.'],
     ['Whaling','Phishing tailored to a leader, such as a principal or an owner.'],
     ['Business email compromise (BEC)','A taken-over or imitated mailbox used to redirect payments.'],
     ['Tailgating','Following an authorized person through a secured door.'],
     ['Typosquatting','Registering a domain one slip away from a real one.'],
     ['Watering hole','Poisoning a site that one chosen group already trusts.'],
     ['Worm','Malware that spreads across the network by itself.'],
     ['Ransomware','Malware that encrypts files, often after copying them, and demands payment.'],
     ['Zero-day','A flaw attackers use before any patch exists.'],
     ['APT','Advanced persistent threat: a skilled, funded team that stays hidden for months.']
   ]),
   MATCH('f8m','Trick to its channel and its tell','Tap an item on the left, then its match on the right.',[
     ['Smishing','Text: a toll notice with a short link','Smishing is phishing by text message, and a fake toll notice with a short link is a common one.'],
     ['Vishing','Voice: “IT” asks you to read back the code just sent','Vishing is phishing by voice: a caller asks for the code that would let them sign in as you.'],
     ['Tailgating','In person: someone slips through the badge door behind you','Tailgating is following an authorized person through a secured door in person.'],
     ['Typosquatting','Web: a domain one letter off the real one','Typosquatting registers a misspelled copy of a real domain to catch typing slips and quick glances.'],
     ['Whaling','Email: a tailored legal notice sent only to the principal','Whaling aims at a leader who can approve payments or open records, with a message tailored to that one person.'],
     ['Shoulder surfing','In person: eyes on your keypad as you type a PIN','Shoulder surfing reads a screen or keypad by watching from nearby.']
   ],'Understand'),
   QUIZ('f8q','Check: threats',[
     ['A voice message that sounds exactly like Coach asks Kai to buy gift cards and text the codes. Best move?',['Buy them, since the voice matches','Reply to ask whether it is really Coach','Call Coach back on the number Kai already has, then report it','Forward it to the team'],2,'A perfect voice proves nothing; verify through a channel you already trust.',{whys:['A few seconds of audio can clone a voice, so a perfect match is easy to fake; only a call-back proves who it is.','A reply goes back to the same faker, who will simply say yes.','The number Kai already has reaches the real Coach, which takes the faker out of the conversation, and the report warns others.','Forwarding spreads the scam to more people.'],imp:'core',c:'sec-social-engineering'}],
     ['A delivery driver with full arms asks Ikaika to hold the server-room door. What is this, and what does Ikaika do?',['Tailgating: he politely points the driver to the front desk','Good manners: he holds it','Phishing: he reports the email','A watering hole: he reports the site'],0,'Each person badges in.',{whys:['Holding a secure door for someone is how tailgating works, and the front desk is where staff check visitors, so pointing him there keeps the kindness and the security.','Holding the door lets an unchecked person into the server room, which is exactly what tailgating aims for.','Phishing comes in messages, and this happens in person at a door.','A watering hole poisons a website people visit; this happens in person at a door, so it is tailgating.'],imp:'good',c:'sec-social-engineering'}],
     ['A vendor ships a patch today for a flaw attackers already use. The school installs it next month. What is that month?',['The zero-day stretch','A safe time, since a patch exists','The known-but-unpatched stretch, where most break-ins happen','Reconnaissance'],2,'Once the fix ships, every unpatched day is the stretch attackers use most.',{whys:['Zero-day means no patch exists yet, and that stretch ended the day the patch shipped.','A patch protects only the machines that install it, so the school stays exposed all month.','The fix exists but sits uninstalled while attackers already use the flaw, which makes this gap the time when most break-ins happen.','Reconnaissance is the attacker learning about a target, a step in an attack rather than a stretch of time.'],imp:'core',c:'threat-zero-day'}],
     ['An opened attachment adds an auto-start entry so its code survives a restart. Which kill-chain step is that?',['Delivery','Installation','Reconnaissance','Weaponization'],1,'Hunting auto-start entries breaks the installation link.',{whys:['Delivery is how the bait arrives, and the attachment was already open here.','Installation is the step where malware sets itself up to stay, and an auto-start entry is how it survives a restart.','Reconnaissance gathers information before the bait is sent, and this attachment was already open.','Weaponization builds the bait before it is sent, out of the victim’s view.'],imp:'core',c:'threat-kill-chain'}],
     ['A drive-by installs malware on a shared laptop at Mānoa Makerspace through its unpatched browser. The unpatched browser is the',['Threat','Risk','Control','Vulnerability'],3,'The weakness is the vulnerability; the drive-by crew is the threat. <a href="#freshman/f3">Review: Security principles</a>',{whys:['The threat is the crew behind the drive-by, the one who attacks.','Risk is how likely and how bad the harm is, a result of the threat and the weakness together.','A control lowers risk, such as automatic updates, and the unpatched browser is the gap a control would close.','The unpatched browser is the weakness the drive-by used, and a weakness you can fix is a vulnerability.'],imp:'core',c:'sec-threat-vuln-risk'}],
     ['Spyware copies the member list from that laptop and sends it out. Which CIA goal did it break?',['Confidentiality','Integrity','Availability','Non-repudiation'],0,'The right people alone should see the list. <a href="#freshman/f3">Review: Security principles</a>',{whys:['Confidentiality means only the right people see the data, and the list just went to outsiders.','Integrity breaks when data is changed, and here it was copied unchanged.','Availability breaks when data is out of reach, and the club can still use its list.','Non-repudiation proves who acted, a separate goal from the CIA triad.'],imp:'core',c:'sec-cia'}]
   ]),
   LINKS('Go further',['cisa-kev','eff','cisa'])
   ]},
 {id:'f4',title:'Computers, virtualization, and the network',bloom:'Remember',sum:'Computer parts that hold evidence, VMs and two kinds of hypervisor, isolation from light to strong, snapshots versus backups, checksums, and everyday networking words.',
  can:'name the parts of a computer that hold evidence, tell a snapshot from a backup, check a file with a checksum, and explain how a VM is isolated',
  blocks:[
   ANATOMY('Inside the box: the parts that hold evidence',[
     {name:'One computer',tag:'five parts, one defender fact each',tone:'l2',grid:true,children:[
       {name:'CPU',tag:'processor',tone:'l1',text:'Runs every instruction; a hidden crypto miner shows as unexplained CPU use.'},
       {name:'RAM',tag:'memory',tone:'amber',text:'Holds running programs, connections, and sign-ins. Gone at power-off.'},
       {name:'Storage',tag:'SSD or disk',tone:'ok',text:'Keeps the OS, files, and logs after power-off.'},
       {name:'Firmware and TPM',tag:'UEFI',tone:'l4',text:'Starts the machine; the TPM guards disk keys and records the boot.'},
       {name:'Network card',tag:'NIC',tone:'l3',text:'Its MAC address names the device in DHCP and switch records.'}]}
   ],{label:'One computer with five parts: CPU, RAM that empties at power-off, storage that keeps data, firmware with the TPM, and the network card with its MAC address.',
     key:[['amber','Gone at power-off'],['ok','Stays after power-off']],
     caption:'A running machine still holds evidence in RAM that a powered-off one has lost.'}),
   DETAIL('TPM, deleted files, and random MACs',
     TIPS('The <b>TPM</b> is a chip or a protected part of the processor.',
          'Deleted files can linger on a hard disk, while SSDs often clear them soon.',
          'Phones and laptops may use a random MAC on each Wi-Fi network.')),
C('Virtual machines in plain words','Understand',
     P('A <b>virtual machine</b> (VM) is a whole computer running as a program inside yours. The <b>hypervisor</b> pretends to be hardware, and the <b>guest</b> operating system runs on it as if on real hardware. Practice labs are usually VMs: you can copy, snapshot, and reset them in minutes.'),
     TIPS('<b>Checksum</b> (SHA-256): a fingerprint of a file. Compare a downloaded ISO\u2019s checksum to the publisher\u2019s value, so you know it arrived complete and unaltered.',
          'Older MD5 values still appear and catch a broken download; collisions make MD5 unfit to prove the file is unaltered.',
          'Keep the VM window and the host separate in your head: a command typed in the wrong window changes the wrong computer.')),
   DETAIL('Setting up your own VM',
     TIPS('Common free hypervisors: <b>Hyper-V</b> (built into Windows 11 Pro, Enterprise, and Education), <b>VirtualBox</b>, and <b>VMware Workstation Pro</b>.',
          'Every hypervisor needs the CPU\u2019s virtualization feature (Intel VT-x or AMD-V) enabled in the firmware settings.',
          'Check each guest\u2019s requirements first: Windows 11 needs at least 4 GB of RAM and 64 GB of storage, beyond what your host needs.')),
    STACK('Type 1 and type 2 hypervisors',[
     {name:'Type 1: bare metal',layers:[['VMs','Each guest OS: servers, desktops, and lab machines',1,'l1'],['Hypervisor','ESXi, Hyper-V, Proxmox VE, and KVM, straight on the hardware',2,'amber'],['Hardware','A server in a data center or a cloud',1,'l4']]},
     {name:'Type 2: hosted',layers:[['VMs','Your lab guests',1,'l1'],['Hypervisor app','VirtualBox and VMware Workstation Pro',1,'amber'],['Host OS','Windows, macOS, or Linux on your PC',1,'l2'],['Hardware','Your laptop or desktop',1,'l4']]}
   ],{note:'Patch and protect the <b>host OS</b> under a type 2 hypervisor first.',
     key:[['amber','Controls every VM above it'],['l2','So does the host OS under a type 2']]}),
    TIPS('Each <b>guest OS</b> needs its own updates, accounts, and firewall: to the network it is a separate computer.'),
    DETAIL('Hyper-V, ESXi, and Proxmox VE',
     TIPS('Hyper-V counts as type 1 even on Windows 11, because Windows itself runs on top of it once it is on.',
          'ESXi and Proxmox VE (built on Debian, web console on port 8006) are managed from a browser, so that console belongs on an admin-only network.')),
    SCALE('Isolation, from light to strong',{from:'Light, cheap',to:'Strong, costly',bands:[
       ['Process','Two apps under one account. Each gets its own memory, yet both can read the account’s files.','muted'],
       ['User account','A web app runs as its own low-rights account, so other accounts’ files stay out of reach.','l1'],
       ['Sandbox','Each browser tab or phone app gets a box with few rights.','l1'],
       ['Container','An app with its own files and network on a shared kernel. Light, though one kernel flaw reaches every container.','l2'],
       ['VM','A whole guest OS with its own kernel. Costs RAM and disk.','l3'],
       ['Own machine, own segment','A payroll server on its own network segment behind a firewall. Costs hardware and rules.','l4'],
       ['Air gap','Without any network link. Updates travel by hand, so a USB stick becomes the risk.','l4']]},
     {intro:'Isolation keeps trouble in one place from spreading. Pick the lightest wall that fits the risk.',
      caption:'A malware sample earns a VM on an isolated network, while a web app may need only its own account.'}),
QUIZ('f4c1','Check yourself',[
     ['Which hypervisor runs straight on the server hardware, without a desktop OS beneath it?',['VirtualBox','VMware Workstation Pro','ESXi','A container'],2,'Type 2 hypervisors run as apps on a host OS, so whoever controls that host reaches every guest.',{whys:['VirtualBox is a type 2 app that runs on a host OS.','VMware Workstation Pro is a type 2 app on a host OS.','ESXi is a type 1 hypervisor: it installs on the bare server and acts as its operating system, with no desktop OS beneath it.','A container shares the host’s kernel; it is an app, without a hypervisor of its own.'],imp:'good',c:'comp-virtualization'}],
     ['Two programs run under the same user account. Why does giving one of them its own low-rights account make a stronger wall?',['Programs under one account read each other’s files; a separate account keeps its files apart','Accounts use less memory','A separate account turns off the network','Programs under one account take turns to run'],0,'A second program under the same account opens the same files.',{whys:['Windows and Linux grant file access per account, so a program in its own low-rights account opens only its own files.','Memory use is beside the point; the wall comes from per-account file access.','The network stays on; a separate account separates files.','Both run at once; the account decides what each may open.'],imp:'core',c:'comp-isolation'}]
   ]),
COMPARE('Snapshot or backup: what is copied, and where the copy lives',[
     {name:'VM snapshot',tag:'Hypervisor',tone:'l2',
      svg:{label:'The VM disk and its snapshot sit side by side on one host disk.',
       body:'<rect x="12" y="4" width="176" height="66" rx="8" fill="none" stroke="var(--l2)" stroke-width="2"/><text x="100" y="18" text-anchor="middle" font-size="10" fill="var(--ink-2)">One host disk</text><rect x="26" y="26" width="66" height="34" rx="5" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="59" y="47" text-anchor="middle" font-size="10" fill="var(--ink)">VM disk</text><rect x="108" y="26" width="66" height="34" rx="5" fill="var(--paper)" stroke="var(--l2)" stroke-width="2" stroke-dasharray="4 3"/><text x="141" y="47" text-anchor="middle" font-size="10" fill="var(--ink)">Snapshot</text>'},
      rows:[['Copies','The whole VM’s disk state, plus its memory if you choose, at one moment.'],['Lives','Beside the VM’s disk, on the same host.'],['Good for','Take one before a risky change, then roll back in seconds.'],['Lost along with','That disk, that host, or the VM itself.']],
      hook:'an undo button for the whole VM.'},
     {name:'System snapshot',tag:'Timeshift, System Restore',tone:'l3',
      svg:{label:'System files are copied into a snapshot; home folders are skipped by default.',
       body:'<rect x="8" y="6" width="74" height="30" rx="5" fill="var(--paper)" stroke="var(--l3)" stroke-width="2"/><text x="45" y="25" text-anchor="middle" font-size="10" fill="var(--ink)">System files</text><path d="M86 21 H112" stroke="var(--l3)" stroke-width="2" marker-end="url(#arrow-l3)"/><rect x="118" y="6" width="74" height="30" rx="5" fill="var(--paper)" stroke="var(--l3)" stroke-width="2" stroke-dasharray="4 3"/><text x="155" y="25" text-anchor="middle" font-size="10" fill="var(--ink)">Snapshot</text><rect x="8" y="46" width="74" height="22" rx="5" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="45" y="61" text-anchor="middle" font-size="10" fill="var(--ink-2)">Home folders</text><text x="90" y="61" font-size="10" fill="var(--ink-2)">skipped by default</text>'},
      rows:[['Copies','System files and settings; home folders stay out by default.'],['Lives','Usually on the same computer, often on the same drive.'],['Good for','Undoing a bad update or a broken setting.'],['Lost along with','That drive. Your documents need a real backup too.']],
      hook:'an undo button for the operating system.'},
     {name:'Backup',tag:'Separate copy',tone:'ok',
      svg:{label:'A copy travels from the computer to a separate disk or an off-site location.',
       body:'<rect x="8" y="20" width="64" height="36" rx="5" fill="var(--paper)" stroke="var(--ok)" stroke-width="2"/><text x="40" y="42" text-anchor="middle" font-size="10" fill="var(--ink)">Computer</text><path d="M76 38 H116" stroke="var(--ok)" stroke-width="2" marker-end="url(#arrow-ok)"/><text x="96" y="31" text-anchor="middle" font-size="9" fill="var(--ink-2)">copy</text><rect x="124" y="20" width="68" height="36" rx="5" fill="var(--paper)" stroke="var(--ok)" stroke-width="2"/><text x="158" y="36" text-anchor="middle" font-size="10" fill="var(--ink)">Other disk</text><text x="158" y="49" text-anchor="middle" font-size="9" fill="var(--ink-2)">or off site</text>'},
      rows:[['Copies','Your files, or a full system image, as an independent copy.'],['Lives','On other media: an external disk, another server, or cloud storage, with one copy off site.'],['Good for','Recovering from a dead disk, theft, fire, or ransomware.'],['Trust it','Once a test restore brings the files back.']],
      hook:'a spare key kept at a friend’s house.'}
   ],{note:'<b>The 3-2-1 rule:</b> three copies of your data, on two kinds of storage, with one off site. Many organizations add one copy kept offline or unchangeable, so ransomware on the network leaves it intact.',
     caption:'A snapshot lives with the thing it protects. A backup lives somewhere else, so it survives losing the original.'}),
   C('Networking words','Remember',
     TIPS('<b>IP address</b> (192.168.1.20): a device’s number on the network. <b>Subnet mask</b> (255.255.255.0): which part is the network. <b>Default gateway</b>: the router that leads out.',
          '<b>DNS</b> turns names into addresses. <b>DHCP</b> hands each host an address, mask, gateway, and DNS server automatically.',
          'A Windows host whose DHCP request goes unanswered gives itself a 169.254.x.x address (APIPA) and an empty gateway, so that address points you at DHCP.',
          '<b>Switch</b> connects devices inside one network by MAC address; <b>router</b> connects networks by IP address. <a href="#freshman/f7">Networking fundamentals</a> compares them with hubs.',
          '<b>Port</b>: a numbered door on a device. 22 SSH, 23 Telnet, 80 HTTP, 443 HTTPS, 21 FTP, 3389 RDP, and 53 DNS.'),
     CMDS('Try these on any machine you own',[
       ['ipconfig /all','Windows: every adapter, IP, mask, gateway, DNS, and MAC.'],
       ['ip a','Linux: addresses on every interface (a is short for address).'],
       ['ping 1.1.1.1','Is the internet reachable by IP? (Ctrl+C to stop on Linux.)'],
       ['ping example.com','Does name resolution (DNS) work too?'],
       ['nslookup example.com','Ask DNS directly and see which server answered.'],
       ['tracert 1.1.1.1','Windows: the routers between you and the target. Linux: traceroute 1.1.1.1']
     ])),
   QUIZ('f4q','Check: machines and networks',[
     ['Why compare a downloaded ISO\u2019s SHA-256 checksum to the one on the publisher\u2019s site?',['To unlock the file','To confirm the file is complete and unaltered','To register the software','To speed up installation'],1,'A mismatch means a corrupt or tampered download: get it again from the official source.',{whys:['A checksum unlocks nothing; it is a fingerprint you compare.','SHA-256 changes completely when even one byte differs, so a match with the publisher’s value shows the file arrived whole and unchanged.','Registration is a license step; a checksum checks the file’s bytes.','Comparing a checksum adds a step and leaves install speed alone.'],imp:'core',c:'comp-integrity-hashing'}],
     ['Which device forwards traffic between two different networks?',['Switch','Router','Hub','Access point'],1,'Routers route between networks using IP. Switches forward inside a network using MAC addresses.',{whys:['A switch forwards inside one network, by MAC address.','A router reads each packet’s destination IP address and forwards it from one network into another.','A hub repeats every signal inside one network.','An access point links Wi-Fi devices into one network.'],imp:'core',c:'net-components'}],
     ['Port 22 is normally',['FTP','Telnet','SSH','HTTPS'],2,'Telnet on 23 sends everything in clear text, which makes it a classic finding.',{whys:['FTP uses port 21.','Telnet uses port 23 and sends everything as plain text.','SSH, the encrypted remote shell, listens on port 22 by default.','HTTPS uses port 443.'],imp:'core',c:'net-ports-protocols'}],
     ['A VM snapshot is',['A screenshot of the desktop','A saved copy of the VM\u2019s whole state you can return to','A backup of your email','A log of your commands'],1,'Snapshots on your own practice VMs let you break things fearlessly and roll back.',{whys:['A screenshot saves a picture; a snapshot saves the whole VM.','A snapshot records the VM’s disks and settings at one moment, so you can roll the whole machine back to it.','Email backups are a separate job; a snapshot belongs to one VM.','A command log records history; a snapshot is a state to return to.'],imp:'core',c:'comp-virtualization'}],
     ['Why does a snapshot fall short of a real backup?',['It is too small','It lives with the VM, so a lost disk or host loses both','Snapshots are impossible to restore','Backups are only for servers'],1,'Follow the 3-2-1 rule: three copies, two kinds of media, and one off site.',{whys:['Size is beside the point; where the copy lives decides.','A snapshot lives on the same disk or host as the VM, so one failed disk or lost host takes both.','Snapshots restore in seconds; that is their strength.','Any computer holding data worth keeping needs a backup.'],imp:'core',c:'comp-virtualization'}]
   ]),
   LINKS('Go further',['t4t-subnet','khan','netacad'])
  ]},
 {id:'f5',title:'First look at Windows',bloom:'Understand',sum:'The editions side by side, account types, UAC, NTFS permissions, each layer of a Windows PC and its guard, where users, policies, the firewall, updates, and Defender live, and your first commands.',
  can:'tell Windows editions and account types apart, read an NTFS permission, find users, policies, the firewall, updates, and Defender, and run your first commands',
  blocks:[
   COMPARE('Four Windows packages, one core',[
    {name:'Home',tag:'Windows 11',tone:'l1',rows:[
      ['Domain join','Local or Microsoft accounts only'],
      ['BitLocker','Device encryption on supported PCs, key backed up to the Microsoft account'],
      ['Policy consoles','Settings and PowerShell; the two consoles start at Pro'],
      ['Attack surface','Fewest features; managed one PC at a time'],
      ['Typical role','A family laptop']],hook:'one PC, one owner.'},
    {name:'Pro',tag:'Windows 11',tone:'l2',rows:[
      ['Domain join','Active Directory or Microsoft Entra ID'],
      ['BitLocker','Full management'],
      ['Policy consoles','<code>secpol.msc</code> and <code>gpedit.msc</code>'],
      ['Attack surface','Adds Remote Desktop hosting and Hyper-V, both off by default'],
      ['Typical role','A small business or home lab']],hook:'Home plus the admin tools.'},
    {name:'Enterprise or Education',tag:'Windows 11',tone:'l3',rows:[
      ['Domain join','The same, as a managed fleet'],
      ['BitLocker','Full, usually set by central policy'],
      ['Policy consoles','The same two, plus fleet settings'],
      ['Attack surface','Adds locks such as Credential Guard (walls off saved sign-in secrets), on by default'],
      ['Typical role','Company and school PCs']],hook:'Pro plus fleet locks.'},
    {name:'Windows Server',tag:'2022, 2025',tone:'l4',rows:[
      ['Domain join','Joins a domain or becomes a domain controller'],
      ['BitLocker','A feature you add'],
      ['Policy consoles','The same two; a domain controller adds Group Policy Management'],
      ['Attack surface','Grows with each role you add, such as DNS, DHCP, or a web server (IIS)'],
      ['Typical role','Domain controller, file, DNS, or web server']],hook:'serves the whole network.'}
   ],{intro:'<code>winver</code> shows edition, version (such as 24H2), and build. Windows 11 Home and Pro versions get fixes for 24 months, Enterprise and Education 36; an expired version is a finding.',
     caption:'Home and Pro differ most in a defender’s tools: domain join, BitLocker, and the policy consoles.',bloom:'Remember'}),
   DETAIL('Server Core',
     P('Server Core is a Windows Server install without the desktop: fewer parts, smaller attack surface.')),
   C('Windows terms','Remember',
     TIPS('<b>Account types.</b> <b>Local</b>: this PC only, stored in the <b>SAM</b> (Security Accounts Manager). <b>Microsoft</b>: an online sign-in identity. <b>Domain</b>: stored in Active Directory, valid domain-wide.',
          '<b>User Account Control (UAC).</b> Administrators run with standard rights; UAC prompts before granting elevation. It is on by default; leave it on.',
          '<b>NTFS permissions.</b> Files and folders carry an access control list (ACL): allow and deny entries per user or group. Folders pass entries down through <b>inheritance</b>.',
          '<b>SID.</b> Windows tracks each account by its security identifier; the name is only a label, so a renamed account keeps its SID, groups, and rights.',
          '<b>Registry.</b> Windows keeps its settings in one database: <b>HKLM</b> holds machine-wide settings, <b>HKCU</b> the signed-in user\u2019s.'),
     DETAIL('Registry keys and UAC settings',
       TIPS('Keys work like folders; values hold the data (a <b>DWORD</b> is a number).',
            'Group Policy writes into the Policies keys, so a value there outranks a toggle in Settings.',
            'UAC asks an administrator for consent and a standard user for an administrator\u2019s credentials.'),
       TIPS('Key: <code>HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System</code>.',
            '<code>EnableLUA</code> 1 keeps UAC on; a change to it takes effect after a restart.',
            '<code>ConsentPromptBehaviorAdmin</code> 5 is the default (consent for programs outside Windows), 2 is Always notify, and 0 elevates silently.',
            '<code>PromptOnSecureDesktop</code> 1 shows the prompt on the dimmed secure desktop.',
            '<code>FilterAdministratorToken</code> 1 turns on UAC’s Admin Approval Mode for the Built-in Administrator account; at 0, the default, its programs run with full rights, unprompted.',
            '<b>Administrator protection</b> (Windows 11, off by default): each elevation needs Windows Hello or a password and grants a short-lived admin token, discarded after the task.',
            'The slider (Run: <code>UserAccountControlSettings</code>), top to bottom: Always notify; Notify me only when apps try to make changes (default); the same without dimming; Never notify.',
            'The third level skips the secure desktop, the dimmed screen that isolates the prompt from other programs, so keep the default.'))),
   QUIZ('f5ck1','Check yourself',[
     ['UAC is turned off (EnableLUA = 0). Why does that matter?',['It is harmless','Every program an administrator starts gets full rights without a prompt, including malware','It turns off the firewall','It slows the PC down'],1,'Leave UAC on; with it off, Windows Security warns that overall security is reduced.',{whys:['UAC off removes the pause before admin rights, and malware counts on that.','UAC normally starts an admin’s programs with standard rights until a prompt is approved; with EnableLUA 0 that pause is gone, so malware gets full rights silently.','The firewall is a separate guard with its own switch; UAC controls elevation.','UAC shapes permission prompts rather than speed; the risk is silent elevation.'],imp:'core',c:'win-uac'}]
   ]),
    HIER('NTFS permissions: which entry wins',[
     ['Explicit Deny','Set on this file or folder','bad'],
     ['Explicit Allow','Set on this file or folder','ok'],
     ['Inherited Deny','From a parent folder','bad'],
     ['Inherited Allow','From a parent folder','ok'],
     ['Anything still ungranted','Refused: rights come only from Allow entries','muted']
   ],{top:'Checked first',bottom:'Checked last',
     intro:'Windows reads a file’s entries in this order and stops once every right you asked for is granted, or once an entry denies one.',
     note:'<b>Groups add up:</b> Allow entries for you and every group you belong to combine, so Read from one group plus Write from another gives both.',
     caption:'Explicit beats inherited, so an explicit Allow beats an inherited Deny. At the same level, Deny beats Allow.'}),
   DETAIL('Several folder levels',
     P('With several folder levels, rungs 3 and 4 repeat once per level, nearest folder first.')),
   C('What an operating system does','Understand',
     P('Every operating system runs programs, stores files, keeps the list of accounts, starts background services, and talks to the network.'),
     STACK('Layers of a Windows PC',[
      {name:'Layer',layers:[
        ['Apps (user mode)','Browsers, Office, and games<br>See: Task Manager, <code>appwiz.cpl</code>',1,'l1'],
        ['Services (user mode)','Background programs, such as Windows Update<br>See: <code>services.msc</code>',1,'l2'],
        ['Kernel and drivers (kernel mode)','The Windows core and each device’s code<br>See: <code>msinfo32</code>',1,'l3'],
        ['Boot manager','Loads Windows from the drive<br>See: <code>msinfo32</code>, Boot Device',1,'l4'],
        ['UEFI firmware','Built-in code that starts the PC<br>See: <code>msinfo32</code>, BIOS Mode',1,'l4'],
        ['Hardware','CPU, memory, drive, and the TPM (a chip or part of the CPU)<br>See: <code>tpm.msc</code>',1,'muted']]},
      {name:'Its guard',layers:[
        ['UAC','Asks before an app gets admin rights<br>See: User Account Control settings',1,'ok'],
        ['Service accounts','Each runs as an account, from all-powerful Local System to limited Local Service<br>See: <code>services.msc</code>, Log On As',1,'ok'],
        ['Memory integrity (HVCI)','Checks driver signatures walled off from the kernel, out of kernel malware’s reach<br>See: Windows Security › Core isolation',1,'ok'],
        ['Secure Boot','Starts only a boot manager signed with a trusted key<br>See: <code>msinfo32</code>, Secure Boot State',2,'ok'],
        ['TPM and BitLocker','The TPM holds the drive key; BitLocker keeps the drive scrambled for anyone else<br>See: Control Panel › BitLocker',1,'ok']]}
     ],{caption:'Malware that starts lower loads earlier and hides better, so Windows 11 requires Secure Boot support and TPM 2.0.'}),
     TIPS('<b>The TPM remembers:</b> it fingerprints each boot step and releases BitLocker’s key only when all match; a changed step asks for the 48-digit recovery key.'),
     DETAIL('Other systems and kernel mode',
       P('Learn the job first, and you can find its tool on any system. Linux keeps accounts and most settings in text files under <code>/etc</code>. The next unit adds macOS and FreeBSD (<a href="#freshman/f6">First look at Linux</a>).'),
       P('User-mode code asks the kernel for everything; kernel-mode code sees everything, so one bad driver outranks every app.'))),
   QUIZ('f5ck2','Check yourself',[
     ['A bootkit is malware that tries to load before Windows starts. Which guard refuses a boot manager without a trusted signature?',['UAC','The TPM','NTFS permissions','Secure Boot'],3,'The TPM records each boot step; Secure Boot does the blocking. UAC and NTFS permissions guard later layers.',{whys:['UAC guards admin rights inside a running Windows, long after boot.','The TPM records each boot step for BitLocker; Secure Boot does the refusing.','NTFS permissions guard files once Windows runs, a layer above boot.','Secure Boot starts only a boot manager signed with a trusted key.'],imp:'good',c:'host-disk-encryption'}]
   ]),
   C('The map of Windows security','Remember',
     P('Press <kbd>Win</kbd>+<kbd>R</kbd>, type a console name, and press Enter.'),
     CMDS('Consoles to memorize',[
       ['lusrmgr.msc','Local Users and Groups: add, disable, or delete users; see who is in Administrators. (On Home, use Settings or PowerShell instead.)'],
       ['secpol.msc','Local Security Policy: password, lockout, and audit policy, plus security options (including UAC).'],
       ['gpedit.msc','Local Group Policy Editor: hundreds of settings, including secpol’s.'],
       ['services.msc','Services: what runs in the background and how it starts.'],
       ['wf.msc','Windows Defender Firewall with Advanced Security: profiles and rules.'],
       ['eventvwr.msc','Event Viewer: logs; logons and account changes land in the Security log.'],
       ['taskschd.msc','Task Scheduler: a favorite hiding spot for malware.'],
       ['appwiz.cpl','Programs and Features: uninstall unauthorized software.'],
       ['ms-settings:windowsupdate','Settings > Windows Update (type it in Run).']
     ])),
   QUIZ('f5ck3','Check yourself',[
     ['Which console would you open to see tasks that run automatically on a schedule or at logon?',['lusrmgr.msc','appwiz.cpl','taskschd.msc','secpol.msc'],2,'Task Scheduler (plus Startup apps in Settings and Autoruns from Sysinternals) is where persistence hides.',{whys:['lusrmgr.msc manages local users and groups; scheduled tasks live in Task Scheduler.','appwiz.cpl lists and removes installed programs rather than schedules.','Task Scheduler lists every task with its trigger, such as a time or a logon.','secpol.msc sets password, lockout, and audit policy, a different job.'],imp:'core',c:'host-malware-persistence'}]
   ]),
   C('Your first PowerShell','Understand',
     P('Right-click Start and choose <b>Terminal (Admin)</b> or <b>Windows PowerShell (Admin)</b>. Confirm the UAC prompt: that is elevation. Run each line and read the output.'),
     CMDS('Read-only first (the machine stays unchanged)',[
       ['Get-LocalUser','Every local account, with Enabled true/false.'],
       ['Get-LocalGroupMember -Group Administrators','Who has admin. Compare to the scenario brief.'],
       ['net accounts','Password length, age, history, and lockout settings.'],
       ['Get-NetFirewallProfile | Select-Object Name,Enabled','Domain, Private, and Public profiles: all should be True.'],
       ['Get-MpComputerStatus | Select-Object AMServiceEnabled,RealTimeProtectionEnabled,AntivirusSignatureLastUpdated','Is Defender on and current?'],
       ['Get-Service | Where-Object Status -eq Running | Sort-Object DisplayName','What is running right now.'],
       ['Get-HotFix | Sort-Object InstalledOn -Descending | Select-Object -First 5','Most recent updates.'],
       ['whoami /groups','Your groups. An elevated session shows Mandatory Label\\High Mandatory Level.'],
       ['icacls C:\\Users\\Public','The ACL on a folder. (OI) flows to files, (CI) flows to subfolders, and (I) marks an inherited entry. (F), (M), (RX), (R), and (W) mean Full control, Modify, Read and execute, Read, and Write.'],
       ['Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System | Select-Object EnableLUA,ConsentPromptBehaviorAdmin','UAC: EnableLUA 1 means on; ConsentPromptBehaviorAdmin 5 is the default prompt.']
     ])),
    ANATOMY('Reading one PowerShell line',[
     {name:'One pipeline',tag:'read it left to right',tone:'l2',grid:true,
      text:'<span class="mono">Get-LocalUser | Where-Object Enabled -eq $true | Select-Object Name,<wbr>LastLogon</span>',
      children:[
        {name:'Cmdlet',tone:'l1',text:'<span class="mono">Get-LocalUser</span><br>a Verb-Noun command that outputs one object per account'},
        {name:'Pipe',tone:'muted',text:'<span class="mono">|</span><br>hands each object to the next cmdlet'},
        {name:'Filter',tone:'l3',text:'<span class="mono">Where-Object Enabled -eq $true</span><br>keeps the objects that pass the test; $true and $false mean yes and no'},
        {name:'Choose',tone:'l4',text:'<span class="mono">Select-Object Name,<wbr>LastLogon</span><br>keeps only the named properties for display'}]}
   ],{intro:'Each cmdlet passes whole objects, with all their properties, to the next one.',
     label:'A PowerShell pipeline split into four parts: the cmdlet Get-LocalUser, a pipe, a Where-Object filter that keeps enabled accounts, and a Select-Object step that keeps the Name and LastLogon properties.',
     facts:{head:['Piece','What it does'],rows:[
       ['<span class="mono">-Group Administrators</span>','A parameter and its value: the dash names the parameter'],
       ['<span class="mono">{$_.Enabled}</span>','A script block; <span class="mono">$_</span> is the current object'],
       ['<span class="mono">;</span>','Runs a second command after the first, on one line']]}}),
   C('Command Prompt tools you will meet','Understand',
     P('<b>Command Prompt</b> (<code>cmd.exe</code>) programs still ship in every Windows 11 and Windows Server: <code>sc.exe</code> for services, <code>netsh</code> for the network and the firewall, and <code>reg</code> for the registry. Learn to read them now; Sophomore uses them to make changes.'),
     CMDS('Read-only Command Prompt checks',[
       ['sc.exe query Spooler','One service and its STATE, such as 4 RUNNING. PowerShell twin: Get-Service Spooler.'],
       ['sc.exe qc Spooler','How it starts (START_TYPE), the program it runs (BINARY_PATH_NAME), and the account it runs as (SERVICE_START_NAME).'],
       ['netsh advfirewall show allprofiles','Each profile’s State (ON or OFF) and Firewall Policy, such as BlockInbound,AllowOutbound. Twin: Get-NetFirewallProfile.'],
       ['reg query HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System /v EnableLUA','One registry value, shown in hex: 0x1 means UAC is on. Twin: Get-ItemProperty, in the table above.']
     ]),
     NOTE('<b><code>sc</code> is an alias</b> (short name) for Set-Content in Windows PowerShell 5.1, built into Windows 11, so <code>sc query Spooler</code> writes a file named query. Type <code>sc.exe</code> there; plain <code>sc</code> works in Command Prompt. <code>Get-Alias sc</code> shows what it runs.',true)),
   QUIZ('f5ck4','Check yourself',[
     ['In Terminal (Windows PowerShell 5.1), Kai types <code>sc query Spooler</code>. No service status appears, and a new file named query sits in the folder. Why?',['The Print Spooler service is missing from this PC','In Windows PowerShell, sc is an alias of Set-Content, so it wrote Spooler into a file named query','sc works only on Windows Server','The command waits for a restart'],1,'In PowerShell, type sc.exe; Get-Alias sc shows what a short name runs.',{whys:['A missing service makes sc.exe print an error; a new file means another command ran.','sc is Set-Content’s alias in Windows PowerShell, so query became a file name and Spooler its text. sc.exe reaches the service tool.','sc.exe ships with Windows 11 too, and it runs the same way there.','sc.exe answers at once; the new file shows that Set-Content ran instead.'],imp:'good',c:'win-powershell'}]
   ]),
   MATCH('f5m','Parts of a PowerShell line','Tap a piece on the left, then its job on the right.',[
     ['<code>Get-LocalUser</code>','A Verb-Noun cmdlet that outputs objects','Cmdlets name an action and a thing.'],
     ['<code>|</code>','Hands each object to the next cmdlet','The pipe passes whole objects along.'],
     ['<code>Where-Object Enabled -eq $true</code>','Keeps only the objects that pass a test','A filter; $true means yes.'],
     ['<code>Select-Object Name,Enabled</code>','Keeps only the named properties','It chooses what to show.'],
     ['<code>-Group Administrators</code>','A parameter with its value','Parameters start with a dash.'],
     ['<code>;</code>','Runs a second command after the first','Two commands on one line.']
   ],'Understand'),
   FLASH('f5fl','Windows terms',[
     ['UAC','User Account Control: admins run with standard rights until an action needs elevation, then Windows prompts.'],
     ['ACL','Access control list: the allow and deny entries that decide who can do what to a file, folder, share, or registry key.'],
     ['Inheritance','A folder passes its permission entries down to the files and subfolders inside it.'],
     ['SID','Security identifier: the value Windows uses to identify an account or group. Names can change; SIDs stay fixed.'],
     ['Local account','An account that exists only on one computer.'],
     ['Domain account','An account stored in Active Directory that can sign in to any computer in the domain.'],
     ['secpol.msc','Local Security Policy: password, lockout, audit, and security options (Pro and above).'],
     ['Event Viewer','<code>eventvwr.msc</code>: drivers and services write to the System log, sign-ins and account changes to the Security log, and apps to the Application log.']
   ]),
   QUIZ('f5q','Check: Windows map',[
     ['Where do you change the minimum password length on a stand-alone Windows Pro machine?',['services.msc','secpol.msc > Account Policies > Password Policy','eventvwr.msc','wf.msc'],1,'Local Security Policy owns password and lockout policy. Group Policy Editor also reaches it.',{whys:['services.msc manages background services, so password rules sit in another console.','Local Security Policy holds Account Policies, where the minimum length lives.','Event Viewer reads the logs that record sign-ins; it sets no password rules.','wf.msc manages firewall profiles and rules, a separate guard from passwords.'],imp:'core',c:'host-password-policy'}],
     ['Which command shows who is a local administrator?',['Get-LocalUser','net accounts','Get-LocalGroupMember -Group Administrators','Get-Service'],2,'Get-LocalUser lists users; group membership is a separate question.',{whys:['Get-LocalUser lists every account, and group membership takes a separate command.','net accounts shows password and lockout settings, a policy view rather than a member list.','Admin power on a PC comes from membership in the local Administrators group, and this cmdlet lists exactly those members.','Get-Service lists background services, which answers a different question.'],imp:'core',c:'host-admin-groups'}],
     ['Your laptop runs Windows 11 Home and secpol.msc fails to open. Why?',['It is broken','Home leaves out Local Security Policy and the Group Policy Editor','You need to be online','You must reboot first'],1,'On Home, use net accounts and Settings, or practice on a Pro or evaluation VM.',{whys:['A healthy Home install behaves the same way, so the edition explains it rather than damage.','Microsoft ships secpol.msc and gpedit.msc with Pro, Enterprise, and Education, so even a healthy Home install lacks them.','Local Security Policy runs offline, so a network connection changes nothing here.','A restart keeps the same edition, so the console stays missing.'],imp:'good',c:'win-basics'}],
     ['A folder inherits "Everyone: Read" from its parent. You want only the Finance group in this one folder. Cleanest approach?',['Delete the parent folder','Disable inheritance on that folder (copying the entries), remove Everyone, and grant Finance','Add a Deny for Everyone on every file','Rename the folder'],1,'icacls folder /inheritance:d copies the inherited entries so you can edit them; /inheritance:r removes them.',{whys:['Deleting the parent destroys everything inside it, far beyond fixing one folder.','Copying the inherited entries gives this folder its own list, so you can remove Everyone here and leave the parent untouched.','A Deny for Everyone also blocks Finance, since Finance members belong to Everyone.','A new name keeps the same ACL, so Everyone keeps Read.'],imp:'core',c:'host-file-permissions-shares'}],
     ['Malia’s laptop uses BitLocker with a TPM. A thief pulls its drive and plugs it into another PC. What can the thief read?',['Only scrambled data, since the key stays sealed in the laptop’s TPM','Every file, since the drive has no password of its own','Every file, since BitLocker unlocks the drive at startup on any PC','Every file, after taking ownership as an administrator on the other PC'],0,'Encryption protects the drive anywhere; NTFS permissions hold only while this Windows runs. Store the recovery key away from the PC.',{whys:['Away from its TPM, the drive stays scrambled until someone enters the recovery key.','BitLocker scrambles the whole drive, so the drive itself needs no password to stay safe.','BitLocker unlocks at startup only inside that laptop, where the TPM checks the boot chain.','Ownership changes NTFS permissions, and encrypted data stays scrambled whoever owns it.'],imp:'core',c:'host-disk-encryption'}]
   ]),
   LINKS('Go further',['ms-win-sec','ms-uac','ms-icacls','ms-ps','t4t-ld-win11','t4t-lr-win'])
  ]},
 {id:'f6',title:'First look at Linux',bloom:'Understand',sum:'Distributions, the layers of a Linux machine, the folder tree, ten everyday commands, reading a command line, the three user files, and macOS and FreeBSD as Unix cousins.',
  can:'name the layers of a Linux machine, find your way through the folder tree, run ten everyday commands, and read the three user files',
  blocks:[
   C('Linux in one minute','Understand',
     TIPS('<b>Linux</b> is the kernel; a <b>distribution</b> (distro) bundles it with tools, a package manager, and a desktop.',
          '<b>Almost everything is a file,</b> and permissions decide who may read, write, or execute each one.',
          '<b>Ubuntu</b> builds on <b>Debian</b>. <b>Ubuntu LTS</b> (long-term support) arrives every two years and gets five years of standard security updates.',
          '<b>Linux Mint</b> is built on Ubuntu LTS (LMDE, its alternate edition, on Debian): same apt and .deb packages, plus <b>Timeshift</b> for system snapshots.',
          'All three share <code>apt</code>, <code>systemd</code>, and /etc, so most commands here work on each.',
          '<b>Kali Linux</b> and <b>Parrot OS</b> are security-testing distributions. Testing a system someone else owns without written permission is a crime (<a href="#senior/se5">Power and responsibility</a>).'),
     DETAIL('How Debian, Ubuntu, and Mint differ',
       TIPS('<b>Debian</b> is community-run and the base for many others; <b>Ubuntu</b>, from Canonical, builds on it, so Debian commands work there too.',
            'Ubuntu LTS suits machines you keep running.',
            'Mint has its own desktop (Cinnamon by default) and tools, such as <b>Update Manager</b> for updates. It disables Snap by default; Ubuntu installs some apps as Snaps.')),
     DETAIL('Testing distributions',
       P('Kali and Parrot come preloaded with security-testing tools for professionals who hold written permission to test. To a defender they are evidence: a device named <code>kali</code> or <code>parrot</code> on the router’s list, or testing-tool packages on a school laptop, is a finding to report.'))),
   STACK('Layers of a Linux machine',[
     {name:'One Linux machine, top layer first',layers:[
       ['Apps and desktop','Browsers, editors, and server programs, such as a web server<br>Check: <code>sudo ss -tulnp</code> lists every program listening on the network',1,'l1'],
       ['Shell and tools','bash, sudo, everyday commands, and the account files<br>Check: <code>/etc/passwd</code>, <code>/etc/sudoers</code>, and <code>getent group sudo</code>',1,'l2'],
       ['systemd and services','Starts, watches, and restarts every background service<br>Check: <code>systemctl list-units --type=service</code>',1,'l3'],
       ['Kernel','Runs processes, guards memory, and decides every file request by user and group numbers<br>Check: <code>uname -r</code> (version) and <code>sysctl -a</code> (settings)',1,'l4'],
       ['Hardware and firmware','Processor, memory, disks, and network cards, plus the UEFI firmware and GRUB boot loader that start the kernel. Secure Boot works as on Windows<br>Check: <code>lsblk</code>, <code>ip link</code>, and <code>mokutil --sb-state</code>',1,'muted']]}
   ],{note:'<b>Above the kernel, nearly every setting is a text file under /etc:</b> read the file and you know the setting, whichever desktop tool last changed it.'}),
   HIER('The folder tree from /',
     {name:'/',note:'The root: every absolute path starts here',tone:'l4',children:[
       {name:'/etc',note:'Settings as text files: passwd, shadow, sudoers, and ssh/',tone:'ok'},
       {name:'/home',note:'One folder per person, such as /home/keola. Hidden dotfiles (.bashrc and .ssh/) hold aliases and keys',tone:'amber'},
       {name:'/root',note:'root’s own home. Check its .ssh/ and its shell history',tone:'ok'},
       {name:'/var/log',note:'Logs: on Ubuntu and Mint, auth.log records sign-ins and every sudo; Debian 12 and later keep them in the journal (journalctl)',tone:'ok'},
       {name:'/tmp',note:'Scratch space everyone can write, often emptied at reboot. With /dev/shm, a favorite drop spot',tone:'amber'},
       {name:'/usr/bin',note:'Programs from the package manager. A changed file here is serious',tone:'l2'},
       {name:'/usr/local',note:'Software installed by hand, outside the package manager. Explain each item',tone:'amber'},
       {name:'/proc',note:'A live, in-memory view of the kernel and every process',tone:'l2'}]},
     {note:'<b>Absolute or relative:</b> an absolute path starts at / and works from anywhere (<code>cd /etc/ssh</code>). A relative path starts where you stand (<code>cd ssh</code> works only inside /etc). In a path, <code>.</code> is here, <code>..</code> one level up, and <code>~</code> your home.',
      key:[['amber','Spots intruders favor for hiding files'],['ok','Settings, root’s home, and logs to read'],['l2','Programs and the live process view']],
      caption:'Read /etc, /home, and /var/log first; then explain everything in /tmp and /usr/local.'}),
   C('Ten commands that get you anywhere','Understand',
     P('Open a terminal (<kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>T</kbd> on Mint and Ubuntu). The prompt ends with <code>$</code> for a normal user. <code>sudo</code> runs one command as the superuser (root); it asks for <b>your</b> password.'),
     CMDS('Navigate and read',[
       ['pwd','Print working directory: where am I?'],
       ['ls -la','List everything here, including hidden dotfiles, with permissions and owners.'],
       ['cd /etc','Change directory. cd alone goes home; cd .. goes up one.'],
       ['cat /etc/hostname','Print a file. For long files: less /etc/passwd (q to quit).'],
       ['man ls','The manual for any command. Press q to leave.'],
       ['sudo -l','What am I allowed to run with sudo?'],
       ['whoami','Which user am I right now?'],
       ['id','My user id, group id, and groups.'],
       ['history','Commands I have typed. Great for your change log.'],
       ['clear','Clean screen. Ctrl+C cancels a running command.']
     ])),
   ANATOMY('Reading one command line',[
     {name:'One command line',tag:'read it left to right',tone:'l2',grid:true,
      text:'sudo grep --ignore-case \'failed password\' /var/log/auth.log | wc -l &gt; failed.txt',
      children:[
        {name:'sudo',tag:'1 power',tone:'bad',text:'runs the next program as root'},
        {name:'grep',tag:'2 program',tone:'l2',text:'searches text'},
        {name:'--ignore-case',tag:'3 long option',tone:'l3',text:'match upper and lower case alike'},
        {name:'\'failed password\'',tag:'4 argument',tone:'l1',text:'what to find; quotes keep two words together'},
        {name:'/var/log/<wbr>auth.log',tag:'5 argument',tone:'l1',text:'the file to search'},
        {name:'|',tag:'6 pipe',tone:'amber',text:'hands grep’s output to the next program'},
        {name:'wc',tag:'7 program',tone:'l2',text:'counts words and lines'},
        {name:'-l',tag:'8 short option',tone:'l3',text:'count lines only'},
        {name:'&gt; failed.txt',tag:'9 redirection',tone:'l4',text:'writes the answer into a file'}]}
   ],{intro:'The program comes first, then options that change how it works, then arguments it acts on.',
     key:[['bad','Runs as root'],['amber','Hands output to the next program']],
     note:'Short options can share one dash (<code>-la</code>), and <code>&gt;&gt;</code> adds to a file’s end where <code>&gt;</code> replaces it. <b>sudo raises grep alone.</b> The pipe and the redirection run as you, so <code>&gt; failed.txt</code> must land in a folder you can write.'}),
   C('The three user files','Understand',
     TIPS('<b>/etc/shadow</b>: password hashes, readable only by root and the shadow group; wider read access hands every hash to an attacker.',
          '<b>Shadow hash field:</b> <code>!</code> or <code>*</code> alone blocks password sign-ins; <code>!</code> before a hash marks a locked password.',
          '<b>/etc/group</b>: group memberships. On Mint, Ubuntu, and Debian, <b>sudo</b> members are administrators; some setups use <b>wheel</b> or a custom group instead, so check <code>sudo -l</code> and <code>/etc/sudoers</code>.'),
     CMDS('Look first, change later',[
       ['awk -F: \'$3 >= 1000 && $3 < 65534 {print $1}\' /etc/passwd','Human accounts: field 3 (UID) between 1000 and 65533.'],
       ['awk -F: \'$3 == 0 {print $1}\' /etc/passwd','Every UID-0 account. Only root should print.'],
       ['getent group sudo','Who can become root. Compare to the scenario brief\u2019s administrator list.'],
       ['sudo head -n 5 /etc/shadow','First five password entries (needs root).'],
       ['ls -l /etc/shadow /etc/passwd','Expect -rw-r----- root shadow and -rw-r--r-- root root.']
     ])),
    ANATOMY('One line of /etc/passwd, and the three user files',[
     {name:'One line of /etc/passwd',tag:'seven fields, split by colons',tone:'l2',grid:true,
      text:'malia:x:1000:1000:Malia Kealoha:/home/malia:/bin/bash',
      children:[
        {name:'malia',tag:'1',tone:'l2',text:'user name'},
        {name:'x',tag:'2',tone:'l2',text:'the hash lives in /etc/shadow; any other value here is a finding'},
        {name:'1000',tag:'3',tone:'bad',text:'UID: 0 is root; people get 1000 and up'},
        {name:'1000',tag:'4',tone:'l2',text:'primary group ID (GID)'},
        {name:'Malia Kealoha',tag:'5',tone:'l2',text:'comment, often the full name'},
        {name:'/home/malia',tag:'6',tone:'l2',text:'home directory'},
        {name:'/bin/bash',tag:'7',tone:'l2',text:'login shell; nologin turns sign-ins away'}]}
   ],{intro:'Every account has one line like this; the fields always come in the same order, so the third field is always the UID.',
     label:'One line of /etc/passwd split into seven fields: user name malia, x, UID 1000, GID 1000, comment Malia Kealoha, home /home/malia, and shell /bin/bash.',
     facts:{head:['','Holds','Check for'],rows:[
       ['/etc/passwd','Every account: name, UID, GID, home, and shell. Everyone can read it (644).','A second account with UID 0'],
       ['/etc/shadow','Password hashes and password aging. Only root and the shadow group read it (640).','An empty hash field: that account signs in without a password'],
       ['/etc/group','Each group and its members. Everyone can read it (644).','Extra names in the sudo group']]},
     key:[['bad','Check this field first']],
     caption:'Field 3 matters most: any UID 0 account has root power, whatever its name; a second one is a backdoor.'}),
   ANATOMY('Reading a permission string: -rw-r----- root shadow',[
     {name:'ls -l /etc/shadow',tag:'one line of output',tone:'l2',grid:true,
      text:'-rw-r----- 1 root shadow 1203 Oct 18 09:12 /etc/shadow',
      children:[
        {name:'<code>-</code>',tag:'type',tone:'muted',text:'a regular file (d is a directory, l a link)'},
        {name:'<code>rw-</code>',tag:'owner',tone:'l1',text:'root reads and writes'},
        {name:'<code>r--</code>',tag:'group',tone:'l3',text:'the shadow group reads'},
        {name:'<code>---</code>',tag:'other',tone:'l4',text:'everyone else: shut out'},
        {name:'root',tag:'owner',tone:'l1',text:'the user who owns the file'},
        {name:'shadow',tag:'group',tone:'l3',text:'the group that owns the file'}]}
   ],{intro:'After the type character come three sets of three letters: owner, group, and everyone else. A dash marks a missing right.',
     label:'The permission string -rw-r----- split into the file type, rw- for the owner root, r-- for the group shadow, and --- for everyone else.',
     facts:{head:['','Value','On a file','On a directory'],rows:[
       ['r','4','Read its contents','List the names inside'],
       ['w','2','Change its contents','Add, delete, and rename entries (together with x)'],
       ['x','1','Run it as a program','Enter it and reach what is inside']]},
     key:[['l1','Owner'],['l3','Group'],['l4','Everyone else']],
     note:'<b>Octal is the sum per set:</b> <code>rw-</code> is 4 + 2 = 6, <code>r--</code> is 4, and <code>---</code> is 0. So <code>-rw-r-----</code> is 640, and /etc/passwd’s <code>-rw-r--r--</code> is 644.'}),
   TIPS('An <b>s</b> in the owner’s x spot, as in /usr/bin/passwd (<code>-rwsr-xr-x</code>), is SUID: the program runs with its owner’s rights, here root’s.'),
   COMPARE('Four operating systems, one set of questions',[
     {name:'Windows',tag:'Microsoft',tone:'l1',rows:[
       ['Accounts live in','The SAM database on each PC; Active Directory for a whole domain'],
       ['Admin power','The Administrators group, with UAC prompting before elevation'],
       ['Firewall','Windows Defender Firewall'],
       ['Logs live in','Event logs, read in Event Viewer'],
       ['Support life','A set time per Windows 11 version; Windows Server, about 10 years']],
      hook:'databases and consoles; <code>winver</code> shows the edition, version, and build.'},
     {name:'Linux',tag:'Debian, Ubuntu, and Mint',tone:'l2',rows:[
       ['Accounts live in','Text files: /etc/passwd, /etc/shadow, and /etc/group'],
       ['Admin power','root (UID 0), borrowed one command at a time through sudo'],
       ['Firewall','nftables in the kernel, often driven by ufw'],
       ['Logs live in','The systemd journal and text files under /var/log'],
       ['Support life','Ubuntu LTS and Mint: five years; Debian: about three, then two more of LTS']],
      hook:'everything is a text file; <code>cat /etc/os-release</code> shows the release.'},
     {name:'macOS',tag:'Apple’s Unix',tone:'l3',rows:[
       ['Accounts live in','A directory database (Open Directory); /etc/passwd there lists only system accounts'],
       ['Admin power','The admin group, borrowed through sudo as on Linux'],
       ['Firewall','The application firewall, in System Settings'],
       ['Logs live in','The unified log, read in the Console app'],
       ['Support life','The newest release gets every fix; older ones, security fixes for a while']],
      hook:'Unix underneath, Apple’s databases on top; <code>sw_vers</code> shows the release.'},
     {name:'FreeBSD',tag:'a separate Unix family',tone:'l4',rows:[
       ['Accounts live in','Text files: /etc/master.passwd and /etc/group'],
       ['Admin power','root, reached through su by members of the wheel group'],
       ['Firewall','pf, ipfw, or ipf; pick one per host'],
       ['Logs live in','Text files under /var/log, such as auth.log and messages'],
       ['Support life','Each release has a published end-of-life date']],
      hook:'one project builds the whole system; <code>freebsd-version</code> shows the release.'}
   ],{note:'<b>Check the release first:</b> past its end date it stops getting security fixes, so every new hole stays open. <a href="#junior/j3">Debian and deeper Linux</a> lines up the commands side by side.'}),
   QUIZ('f6cy','Check yourself',[
     ['On a Mac, /etc/passwd lists only system accounts. Where do its people’s accounts live?',['The SAM database','/etc/shadow','A directory database (Open Directory)','/etc/master.passwd'],2,'Each system answers the same questions; learn where each one keeps the answer.',{whys:['The SAM database holds Windows accounts.','/etc/shadow holds Linux password hashes.','A Mac keeps /etc/passwd for system accounts alone and stores people’s accounts in Open Directory, its own account database.','/etc/master.passwd is FreeBSD’s account file.'],imp:'good',c:'lin-macos'}]
   ]),
   DETAIL('macOS guards',
   COMPARE('macOS guards: Gatekeeper, SIP, and FileVault',[
     {name:'Gatekeeper',tag:'checks apps',tone:'l2',rows:[
       ['Protects','You, as you open a downloaded app'],
       ['Stops','Apps from unidentified developers or missing Apple’s check (notarization)'],
       ['Status','<code>spctl --status</code> reports <code>assessments enabled</code>']],
      hook:'a door check of every app’s ID.'},
     {name:'SIP',tag:'System Integrity Protection',tone:'l3',rows:[
       ['Protects','System files and folders, even from root'],
       ['Stops','Malware with admin rights from rewriting the operating system'],
       ['Status','<code>csrutil status</code> ends in <code>enabled.</code>']],
      hook:'a lock that root’s key leaves shut.'},

   FLASH('f7fl','Networking terms',[

     ['Application','Top, layer 7: programs hand their data in here first, such as web (HTTP, HTTPS), names (DNS), remote shells (SSH), and address requests (DHCP).'],
     ['Presentation','Layer 6, right under the programs: the data takes its format (encoding, encryption, and compression) before any conversation carries it.'],
     ['Session','Layer 5: once the data has its format, this layer opens, keeps, and closes the conversation that carries it, just above transport.'],

     ['Network','Layer 3, under the ports: IP addresses and routing carry the data between networks. Routers work here.'],
     ['Data link','Layer 2: once routing picks the next hop, frames and MAC addresses carry the data across one local network. Switches work here.'],

   ],null,{layers:true}),
   ORDER('f7o2','TCP/IP drill: the four layers','Now the TCP/IP model, top (closest to the user) to bottom. Each item says which OSI layers it covers.',[

     ['Transport: Covers a single OSI layer','Second, right under the programs: TCP and UDP pick the program on each end with port numbers, the same job as OSI layer 4.'],
     ['Internet: Covers a single OSI layer','Third, under transport: IPv4, IPv6, and ICMP address and route each packet between networks, as OSI layer 3 does.'],
     ['Link: Covers two OSI layers','Bottom, closest to the wire: Ethernet, Wi-Fi, and the physical medium carry each packet across one link, so it covers OSI layers 2 and 1. Also called Network Access.']
   ]),
   ORDER('f7o3','OSI drill: encapsulation on the way out','A browser sends a request. Put the names of the data in the order they are wrapped as the request goes down the stack, starting closest to the user. The receiver unwraps them in reverse, from bits back up to data.',[
     ['Data','First, at the top three layers: the program’s message starts as plain data, before any header wraps it.'],

     ['Bits','Last: layer 1 has nothing left to wrap, so it sends the finished frame as signals on the medium.']

   MATCH('f7m1','OSI drill: who adds which header','Tap a layer on the left, then what that layer adds on the way out. A wrong pick explains where that answer belongs.',[

     ['Layer 4: Transport','Source and destination ports','TCP and UDP headers carry the ports that pick the program on each end.'],

     ['Layer 1: Physical','Signals that carry the bits','Voltage, light, or radio on the medium.']
   ],'Understand'),

   QUIZ('f7q','Check: networking foundations',[
     ['11111111.11111111.11111111.00000000 as a subnet mask is',['255.255.0.0','255.255.255.0','255.255.255.128','255.0.0.0'],1,'Eight ones per octet is 255. Three full octets of ones is /24.',{whys:['255.255.0.0 has two octets of ones (/16), and this mask has three.','Three octets of eight ones make 255.255.255, and the octet of zeros makes 0: a /24.','255.255.255.128 adds one more 1 bit in the last octet (/25), and here that octet is all zeros.','255.0.0.0 has one octet of ones (/8), and this mask has three.'],imp:'core',c:'net-ipv4-addressing'}],
     ['At which OSI layer does a switch forward frames using MAC addresses?',['Layer 1','Layer 2','Layer 3','Layer 4'],1,'Data link, layer 2. Routers make layer 3 decisions with IP addresses.',{whys:['Layer 1 moves raw bits over cables and radio, without reading any address.','Layer 2, data link, carries frames, and a switch forwards them by MAC address.','Layer 3 is where routers forward packets by IP address.','Layer 4 is transport, home to TCP and UDP ports.'],imp:'core',c:'net-osi-tcpip'}],
     ['Which layer of the TCP/IP model does IP belong to?',['Application','Transport','Internet','Network Access'],2,'IP is the Internet layer. TCP and UDP are Transport.',{whys:['Application is the top layer, home to protocols such as HTTP and DNS.','Transport holds TCP and UDP, which ride inside IP packets.','IP lives in the Internet layer, which addresses and routes packets between networks.','Network Access covers frames, MAC addresses, and the physical link below IP.'],imp:'core',c:'net-osi-tcpip'}],
     ['Which protocol is connection-oriented and retransmits lost data?',['UDP','TCP','IP','ARP'],1,'Reliable delivery takes a connection and acknowledgments; UDP skips both, sends, and forgets.',{whys:['UDP sends each datagram once and moves on, without a connection or resending.','TCP opens a connection with SYN, SYN-ACK, and ACK, numbers its bytes, and resends what goes missing.','IP addresses and routes packets; resending lost data is TCP’s job above it.','ARP finds the MAC address for an IPv4 address on the local network.'],imp:'core',c:'net-osi-tcpip'}],
     ['What does ARP do?',['Assigns IP addresses','Finds the MAC address that belongs to an IPv4 address on the local network','Encrypts traffic','Translates names to addresses'],1,'ARP maps IPv4 to MAC on the local segment. DHCP assigns addresses; DNS translates names.',{whys:['Handing out IP addresses is DHCP’s job.','ARP asks the local network who holds an IPv4 address and learns that device’s MAC.','ARP sends its questions and answers in the open; encryption is a separate job.','Translating names to addresses is DNS’s job.'],imp:'core',c:'net-mac-arp-switching'}],
     ['What does <code>enable secret</code> protect?',['Console access','Privileged EXEC (enable) mode, with a hashed password','SSH only','The running-config file'],1,'Use enable secret; enable password, kept in clear text, is a classic Config Audit finding.',{whys:['The console line has its own login; enable secret guards the step into privileged mode.','A hash is one-way, so a config reader still lacks the password to privileged EXEC, where changes are made.','SSH sign-in uses the vty lines and local usernames; enable secret guards privileged mode.','enable secret guards the mode where the config is read and changed, rather than the file itself.'],imp:'core',c:'cisco-device-hardening'}]
   ]),
