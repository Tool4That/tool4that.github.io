   C('Native VLAN, PortFast, and BPDU guard','Understand',
     P('<b>PortFast</b> belongs on edge ports with one end device, such as a PC or printer: it skips about 30 seconds of listening and learning. Trunks and switch-to-switch links keep those stages, so spanning tree can block loops.'),
     TIPS('<b>BPDU guard</b> shuts (err-disables) an edge port that receives a BPDU, a switch-to-switch message: a stray classroom switch stays offline until an admin checks it.',
          'Only the <b>native VLAN</b> crosses a trunk untagged; this network uses 99 and keeps it free of hosts.',
          '<b>VLAN 1</b> is every port’s default and carries switch control traffic, so users and management move to other VLANs.',
          'Unused ports park, shut down, in VLAN 999.')),
   DETAIL('Spanning tree states and the root bridge',
     SEQ('A port comes up: the spanning tree states',[
       {ask:'Is PortFast on this port?',branches:[['Yes, an edge port','It jumps straight to forwarding as the link comes up.'],['Otherwise','It walks through the states below first.']]},
       ['Blocking','Listens for BPDUs and forwards no user frames.','muted'],
       ['Listening','About 15 seconds: switches exchange BPDUs and settle the port’s role, still without user frames.','amber'],
       ['Learning','About 15 seconds more: the port fills its MAC address table, still without forwarding.','l2'],
       ['Forwarding','User frames flow, about 30 seconds after the link came up.','ok']
     ],{caption:'Without PortFast a port waits about 30 seconds; with it, an edge port forwards at once.',
       note:'These are the classic 802.1D states, used by PVST+, the default on a 2960. Rapid PVST+ folds blocking and listening into one discarding state and converges faster; PortFast still marks the edge ports.'}),
     TIPS('Spanning tree builds its loop-free layout around one switch, the <b>root bridge</b>, which switches elect by trading BPDUs (bridge protocol data units).',
          'Root bridge election: the lowest bridge priority wins, and the lowest MAC address breaks a tie.',
          'A stray switch with a lower priority could take over as root and redraw every path: one more reason edge ports refuse BPDUs.')),
   QUIZ('f7ck1','Check yourself',[
     ['Where does PortFast belong?',['On the trunk to the router, so the uplink comes up sooner','On every port, so the whole switch comes up sooner','On switch-to-switch links between closets','On access ports that connect one end device'],3,'Loops form between network devices, so only one-device edge ports skip listening and learning.',{whys:['A trunk links network devices, so it keeps the full spanning-tree process to catch loops.','PortFast everywhere would skip the loop check on the very links where loops form.','Links between switches are where loops form, so they keep the full spanning-tree process.','A port with one end device offers no path for a loop, so skipping listening and learning is safe there.'],imp:'good',c:'cisco-vlans-trunks'}]
   ]),
   FLASH('f7fl2','Two-site network vocabulary',[
     ['VLAN','Virtual LAN: a group of switch ports that forms its own broadcast domain. This network uses 10 STUDENTS, 20 TEACHERS, and 30 PRINCIPALS.'],
     ['Trunk','A link that carries many VLANs at once, tagging each frame with its VLAN. At Site A, SwA G0/1 to RtrA G0/0 is the trunk.'],
     ['802.1Q tag','A 4-byte field inserted after the source MAC address; its 12-bit VLAN ID names the frame’s VLAN on a trunk.'],
     ['Native VLAN','The one VLAN whose frames cross a trunk untagged. This network uses VLAN 99 and keeps it free of hosts.'],
     ['SVI','Switched virtual interface, such as <code>interface vlan 20</code>: gives the switch its own IP address inside a VLAN, for management or routing.'],
     ['Access port','A switch port in one VLAN that sends and receives untagged frames, for one end device.'],
     ['Router-on-a-stick','One router interface split into subinterfaces (<code>g0/0.10</code>, <code>g0/0.20</code>, and <code>g0/0.30</code>) routes between VLANs over a single trunk.'],
     ['PortFast','Moves an edge port straight to forwarding, skipping about 30 seconds of listening and learning. It belongs on edge ports only.'],
     ['BPDU guard','Shuts down (err-disables) an edge port the moment it receives a BPDU, the message switches send each other.'],
     ['SSH vs Telnet','Both give a remote command line. SSH (TCP 22) encrypts the session and the password; Telnet (TCP 23) sends both as plain text.']
   ]),
   MATCH('f7m4','Name the piece','Match each part of the school network to its job.',[
     ['Access port','Carries one VLAN untagged to one device','<code>switchport mode access</code> and <code>switchport access vlan 10</code>: the PC sees plain Ethernet frames.'],
     ['Trunk port','Carries many VLANs with tags','<code>switchport mode trunk</code>: each frame carries an 802.1Q tag that names its VLAN.'],
     ['Native VLAN','Crosses the trunk untagged','One VLAN per trunk travels without a tag; this network uses VLAN 99 and keeps hosts off it.'],
     ['SVI','Gives the switch an address in a VLAN','<code>interface vlan 20</code> with 10.1.20.2 lets admins reach SwA.'],
     ['Subinterface','The router’s address in one VLAN','<code>g0/0.10</code> with <code>encapsulation dot1Q 10</code> is RtrA’s gateway for Students.'],
     ['PortFast','Lets an edge port forward at once','It skips listening and learning on ports that connect one end device.'],
     ['BPDU guard','Shuts an edge port that hears a switch','A BPDU on an edge port means a switch is plugged in, so the port goes err-disabled.'],
     ['SSH','Encrypted remote console','SSH protects the session and the password; Telnet sends both as plain text.']
   ]),
   QUIZ('f7q2','Why each rule exists',[
     ['Why do user VLANs use numbers above 1?',['VLAN 1 is reserved for traffic between routers','Every port starts in VLAN 1, and control traffic uses it','Routers ignore VLAN 1, so its hosts lack a gateway','VLANs above 1 skip spanning tree and come up sooner'],1,'VLAN 1 stays for defaults; Students, Teachers, and Principals get 10, 20, and 30.',{whys:['VLAN 1 is every switch port’s starting VLAN, a switch default rather than a router link.','Every port starts in VLAN 1 and control protocols use it, so user traffic gets its own numbered VLANs.','Routers route VLAN 1 like any other VLAN; the reason is the switch default and its control traffic.','Every VLAN runs spanning tree the same way, so the number leaves start-up time unchanged.'],imp:'core',c:'cisco-vlans-trunks'}],
     ['What does a trunk carry?',['Many VLANs, each frame tagged with its VLAN ID','Every VLAN, with frames left untagged to save space','Management and control traffic between switches only','Routed packets, each one tagged with its subnet'],0,'Only the native VLAN crosses a trunk untagged; every other frame carries its 802.1Q tag.',{whys:['An 802.1Q tag in each frame names its VLAN, so one link carries many and the far end sorts them.','Only the native VLAN crosses untagged; every other VLAN keeps its tag so the far switch can sort frames.','Management and control traffic cross trunks too, alongside the user VLANs a trunk mainly carries.','A trunk carries frames tagged by VLAN; routing between subnets happens at a router or an SVI.'],imp:'core',c:'cisco-vlans-trunks'}],
     ['What makes the native VLAN different?',['It carries the most traffic','It is the one VLAN with an SVI','Its frames cross the trunk untagged','It is always VLAN 999'],2,'This network’s native VLAN is 99, kept free of hosts; VLAN 999 parks unused ports.',{whys:['The native VLAN is defined by its untagged frames, whatever its traffic volume.','Any VLAN can have an SVI; the native VLAN stands out for its untagged frames.','Native VLAN frames cross the trunk untagged, so this network keeps VLAN 99 free of hosts.','The native VLAN number is a choice: this network uses 99, and 999 is the separate parking VLAN.'],imp:'core',c:'cisco-vlans-trunks'}],
     ['What is the difference between <code>vlan 20</code> and <code>interface vlan 20</code>?',['<code>vlan 20</code> names the VLAN; <code>interface vlan 20</code> assigns its ports','<code>vlan 20</code> creates the layer 2 VLAN; <code>interface vlan 20</code> gives the switch an address in it','<code>interface vlan 20</code> creates the VLAN and its address in one step','<code>vlan 20</code> holds the IP address; <code>interface vlan 20</code> holds the name'],1,'Create the VLAN first, then the SVI that gives the switch an address inside it.',{whys:['Ports join a VLAN in their own interface settings; interface vlan 20 gives the switch an address.','The VLAN is the layer 2 broadcast domain; the SVI is the layer 3 address the switch answers on inside it.','They are two separate steps: vlan 20 makes the VLAN, and interface vlan 20 adds the address.','It is the other way around: the IP address belongs on interface vlan 20.'],imp:'core',c:'cisco-vlans-trunks'}],
     ['Why choose SSH over Telnet for remote management?',['SSH encrypts the session and the password','SSH runs faster than Telnet on slow links','Telnet reaches only devices on the same subnet','SSH logs in with a username alone'],0,'Anyone who captures a Telnet session reads the password. SSH (TCP 22) encrypts the whole session.',{whys:['SSH encrypts the whole session, password included, so a capture shows only scrambled data.','Speed is about the same; the real difference is encryption, since Telnet sends clear text.','Telnet crosses subnets just as SSH does; its weakness is the clear-text session.','SSH still asks for a password or key with the username; what it adds is encryption.'],imp:'core',c:'cisco-device-hardening'}],
     ['Spaced review from Computers, virtualization, and the network: which TCP port does SSH use?',['21','22','23','443'],1,'SSH listens on TCP 22. Telnet uses 23, FTP control uses 21, and HTTPS uses 443.',{whys:['TCP 21 is FTP’s control port.','TCP 22 is SSH’s well-known port, so an SSH client connects there unless told otherwise.','TCP 23 is Telnet, the clear-text protocol SSH replaces.','TCP 443 is HTTPS, encrypted web traffic.'],imp:'good',c:'net-ports-protocols'}]
   ]),

  ]},

   QUIZ('f9ck2','Check yourself',[
     ['Three laptops at Mānoa Bakery all show as 203.0.113.9 on the internet. What makes this work?',['DNS gives each laptop the same name','NAT with port overload, tracked in the router’s table','The laptops share one MAC address','A VPN merges the three laptops'],1,'Servers see only the public address; the router’s translation table knows which laptop sent what.',{whys:['DNS turns names into addresses; sharing one public address is the router’s job.','NAT with port overload gives each conversation its own outside port, so replies find the right laptop.','Each laptop keeps its own MAC, and MAC addresses stay on the local network anyway.','A VPN is an encrypted tunnel; the shared public address comes from the shop router’s NAT.'],imp:'core',c:'net-nat'}]
   ]),
   C('A safer home or shop network','Understand',
     P('The home router is most families’ only firewall. Harden one you own or have permission to manage, and leave every other network as you found it.'),
     TIPS('Change the admin password printed on the label, and keep the firmware updated.',
          'Choose WPA3, or WPA2/WPA3 mode for older devices, with a long passphrase.',
          'Turn off WPS, UPnP (which lets apps open port forwards on their own), and admin access from the internet.',
          'Give visitors a <b>guest network</b> and smart devices (cameras and TVs) a third one. Each reaches the internet while staff laptops stay out of reach.')),
   DETAIL('A shop example',
     P('At Hōkū Hardware in Kaimukī, customers join <code>Hoku-Guest</code>, the cameras join <code>Hoku-Devices</code>, and the till and office PCs stay on <code>Hoku-Staff</code>. A hacked camera reaches only the internet.')),
   PATH('From a name to an address',[
     {name:'Hosts file',tag:'on the laptop',tone:'amber',note:'A short local list, read first: a line here beats DNS',via:'Missing from the list'},
     {name:'Local cache',tag:'on the laptop',tone:'amber',note:'Answers from earlier lookups, each kept for its TTL',via:'Missing from the cache'},
     {name:'Resolver',tag:'recursive DNS server',tone:'l2',note:'Run by the school or provider; a home router passes questions to one',via:'Cache empty: asks a root server'},

   DETAIL('DNS logs',
     P('Nearly every connection, malware’s too, starts with a lookup, so DNS logs are a defender’s favorite record. <a href="#junior/j7">Read the wire</a> shows how analysts spot poisoned answers.')),
   C('VPN: a private tunnel across someone else’s network','Understand',
     P('A <b>VPN</b> (virtual private network) wraps traffic in an encrypted tunnel to a VPN server. Anyone on the path sees scrambled data headed for that server.'),
     TIPS('<b>Remote access</b> joins one laptop to a site, as when Pua works from home; <b>site to site</b> joins two offices’ routers into one network.',
          '<b>It protects</b> data crossing links others run, such as café Wi-Fi. Past the VPN server, traffic travels as usual, so HTTPS still matters.',
          '<b>It still needs MFA:</b> a stolen password walks straight in. Also land the tunnel in a limited network zone.')),
   COMPARE('Flood, fake, or listen in: DoS and DDoS, spoofing, and on-path',[
     {name:'Flood',tag:'DoS and DDoS · availability',tone:'bad',
      rows:[['The attacker changes','Traffic volume: one source (DoS), or a botnet of thousands of hijacked devices (DDoS)'],['The victim notices','A slow or dead site and a leaping traffic graph; a DDoS comes from addresses worldwide'],['First defense','Rate limits and the provider’s flood protection; blocking the source can stop a DoS, and a DDoS plan names who to call']],
      hook:'a crowd blocking the shop door.'},
     {name:'Fake',tag:'Spoofing · trust',tone:'amber',

      hook:'a forged return address.'},
     {name:'Listen in',tag:'On-path · confidentiality',tone:'l4',

   FLASH('f9fl','Network words',[
     ['LAN and WAN','A LAN joins one building over links you own; a WAN joins sites over links you rent, or over the internet.'],
     ['MAN','A metropolitan area network: town- or county-sized, such as a county fiber ring.'],
     ['WLAN','A wireless LAN: access points carry the LAN over radio, so it reaches past the walls.'],
     ['Topology','The shape of the links: star, bus, ring, or mesh.'],
     ['SSID','The name a Wi-Fi network broadcasts. Anyone can copy it, which is how an evil twin works.'],
     ['WPA3','The current Wi-Fi security mode; its SAE handshake resists offline password guessing.'],
     ['Loopback','127.0.0.1 or ::1, named localhost: traffic that stays inside the machine.'],
     ['PAT','Port address translation, the kind of NAT that lets many inside hosts share one public address by port.'],
     ['Resolver','The DNS server that does the asking for you and caches each answer for its TTL.'],
     ['VPN','An encrypted tunnel across a network someone else runs.'],
     ['DDoS','A flood from many hijacked devices at once, so blocking one address fails.'],
     ['Spoofing','Forging an identity field, such as a source IP, a MAC address, or an email sender.'],
     ['On-path attack','A stranger sits between two parties and reads or changes what passes.']
   ]),
   MATCH('f9m','Address to how far it travels','Tap an address, then how far traffic from it can travel.',[
     ['::1','This host only','Loopback: the traffic turns around inside the machine.'],
     ['169.254.7.9','This link only','Link-local: routers drop it. On Windows it means DHCP went unanswered.'],
     ['192.168.1.20','Inside one home, school, or business','A private range: NAT swaps it for a public address at the edge.'],
     ['100.64.12.5','Inside the provider’s network','100.64.0.0/10 is carrier-grade NAT (CGNAT), shared by the provider’s customers.'],
     ['203.0.113.80','Anywhere on the internet','A public address is unique worldwide; this page uses 203.0.113.x to stand for one.']
   ],'Remember'),
   QUIZ('f9q','Check: networks around you',[
     ['Which kind of network joins a Hilo office to a Līhuʻe office?',['LAN','WLAN','MAN','WAN'],3,'Distance sets the network type, and links someone else owns call for encryption.',{whys:['A LAN covers one building or campus, such as a single office.','A WLAN is a wireless LAN, so it also stays within one site.','A MAN spans one city, and these offices sit on different islands.','A WAN joins distant sites over links someone else owns, like these two island offices.'],imp:'core',c:'net-network-types'}],
     ['In a star, the cable to one desk breaks. What happens?',['Every device drops','Only that desk drops','Traffic flows the other way around','Nothing: another path takes over'],1,'A star’s weak point is its center: one failed switch drops every device.',{whys:['Everyone drops only when the center fails, since each desk has its own cable to it.','In a star each device has its own link to the center, so one broken cable drops one desk.','Traffic turning around describes a ring, where devices sit in a loop.','Another path taking over describes a mesh; a star gives each desk one path.'],imp:'good',c:'net-network-types'}],
     ['Which link could a stranger in the parking lot most likely reach?',['NFC','Infrared','Wi-Fi','The Ethernet jack in the office'],2,'The farther a link reaches, the more strangers can reach it.',{whys:['NFC reaches a few centimeters, about the distance of a tap.','Infrared needs a clear line of sight, so walls stop it.','Wi-Fi radio carries past the walls, so someone outside can reach it.','An Ethernet jack needs someone inside the building with a cable.'],imp:'good',c:'net-network-types'}],
     ['A laptop needs the address for a name. Where does it look first?',['A root server','The resolver','Its own hosts file and cache','The authoritative server'],2,'Lookups start on your own machine, the first place a false answer can be planted.',{whys:['Root servers come late in a full lookup, after the resolver starts asking around.','The resolver gets the question only when the hosts file and cache lack the answer.','Its own hosts file and cache cost no trip across the network, so the laptop looks there before asking anyone.','The authoritative server is the last stop: the one that owns the name.'],imp:'good',c:'net-dns-dhcp'}],
     ['A firewall on the internet edge logs an inbound packet with source 192.168.0.5. What does that suggest?',['Normal web traffic','A spoofed source address','A DNS lookup','A VPN tunnel starting'],1,'Set the edge firewall to drop internet packets that claim private or loopback sources.',{whys:['Normal web traffic from the internet carries public source addresses.','Private addresses stay inside sites, so one arriving from the internet is almost always forged.','A DNS reply from the internet carries a public server address.','A VPN tunnel from outside also starts from a public address.'],imp:'core',c:'threat-network-attacks'}],
     ['On café Wi-Fi, Keola’s browser shows a certificate warning for his school portal. What is the safe move?',['Stop and disconnect, then use cellular data or a VPN','Click through: the café is busy','Turn Bluetooth off and retry','Refresh until the warning goes away'],0,'On public Wi-Fi, a certificate warning can mean an evil twin or another on-path trick: stop.',{whys:['Stopping and switching to cellular data or a VPN keeps the sign-in away from a possible on-path trick.','A busy café is a good hiding place for an evil twin, so clicking through can hand over the password.','Bluetooth is a separate radio; the warning concerns the Wi-Fi path.','Refreshing hides the warning at best, and the risk on this network stays the same.'],imp:'core',c:'threat-wireless-attacks'}],
     ['Look back: a laptop sends a packet to 203.0.113.80, outside its own network. Which MAC does the frame carrying it go to?',['The server’s MAC','The switch’s MAC','The DNS resolver’s MAC','Its default gateway’s MAC'],3,'A frame travels one link; the gateway carries traffic off it. <a href="#freshman/f7">Review: Networking fundamentals and Cisco basics</a>',{whys:['The server sits on another network, and a frame travels only the local link.','A switch passes frames along by MAC address and is rarely their destination.','The resolver answers name lookups; delivery to another network goes through the gateway.','Traffic for another network goes to the default gateway first, so the frame carries its MAC.'],imp:'core',c:'net-mac-arp-switching'}],
     ['Look back: as a packet crosses routers to a web server, which field stays the same the whole way (NAT aside)?',['The source MAC','The destination MAC','The destination IP','The TTL'],2,'Every hop gets a new frame and a lower TTL. <a href="#freshman/f7">Review: Networking fundamentals and Cisco basics</a>',{whys:['The source MAC changes at every router, which builds a new frame.','The destination MAC also changes at every hop, naming the next device.','The destination IP rides end to end, so every router can route toward it.','The TTL drops by one at every router.'],imp:'core',c:'net-osi-tcpip'}]
   ]),

 {id:'f10',title:'Keys, locks, and certificates',bloom:'Understand',sum:'One shared key or a key pair, data in its three states, signatures that prove who sent a file, certificates as signed ID cards, and why passkeys resist phishing.',
  can:'tell a shared key from a key pair, say which key locks and which signs, read a certificate as a signed ID card, and explain why a passkey resists phishing',
  blocks:[
   C('What keys do','Understand',
     P('<b>Encryption</b> scrambles data so only someone with the right <b>key</b>, a long number, can read it. Encrypt with someone’s <b>public key</b>, and only their <b>private key</b> opens it; sign with your private key, and anyone with your public key can check it.'),
     NOTE('A leaked private key is an emergency: whoever holds it reads messages meant for its owner and signs as its owner. Replace the key and have its certificate revoked.',true)),
   COMPARE('One key or a key pair',[
     {name:'One shared key',tag:'Symmetric',tone:'l2',
      svg:{label:'Two copies of the same key: the sender holds one and the receiver holds the other.',body:'<circle cx="24" cy="28" r="10" fill="none" stroke="var(--l2)" stroke-width="3"/><path d="M34 28 H80 M68 28 V38 M76 28 V36" fill="none" stroke="var(--l2)" stroke-width="3"/><circle cx="124" cy="28" r="10" fill="none" stroke="var(--l2)" stroke-width="3"/><path d="M134 28 H180 M168 28 V38 M176 28 V36" fill="none" stroke="var(--l2)" stroke-width="3"/><text x="50" y="64" text-anchor="middle" font-size="11" fill="var(--ink-2)">Sender</text><text x="150" y="64" text-anchor="middle" font-size="11" fill="var(--ink-2)">Receiver</text>'},
      rows:[['Keys used','One secret key'],['Speed','Fast: suits whole disks and video streams'],['Who holds what','Both sides hold it, so it must first reach the other side safely'],['Everyday use','BitLocker disk encryption and the bulk of every HTTPS session'],['Everyday names','AES']],
      hook:'one house key, copied for a friend.'},
     {name:'A key pair',tag:'Asymmetric',tone:'l3',
      svg:{label:'An open padlock anyone can snap shut, beside the one private key that opens it.',body:'<path d="M42 30 V16 a11 11 0 0 1 22 0" fill="none" stroke="var(--l3)" stroke-width="3"/><rect x="30" y="30" width="44" height="26" rx="5" fill="var(--paper)" stroke="var(--l3)" stroke-width="2.5"/><circle cx="52" cy="42" r="3.5" fill="var(--l3)"/><circle cx="124" cy="28" r="10" fill="none" stroke="var(--l3)" stroke-width="3"/><path d="M134 28 H180 M168 28 V38 M176 28 V36" fill="none" stroke="var(--l3)" stroke-width="3"/><text x="52" y="70" text-anchor="middle" font-size="11" fill="var(--ink-2)">Public: anyone</text><text x="150" y="64" text-anchor="middle" font-size="11" fill="var(--ink-2)">Private: owner</text>'},
      rows:[['Keys used','A public and a private key, made together'],['Speed','Slower: kept for small jobs'],['Who holds what','Anyone holds the public key; the owner alone holds the private key'],['Everyday use','Sharing a session key safely, signing updates, and SSH key sign-in'],['Everyday names','RSA and elliptic-curve keys']],
      hook:'a padlock anyone can close, with one key that opens it.'}
   ]),
   QUIZ('f10cy1','Check yourself',[
     ['Pua wants to send Mele a file only Mele can open. Which key does Pua use to encrypt it?',['Pua’s private key','Mele’s public key','Mele’s private key','Pua’s public key'],1,'To keep a file secret for someone, lock it with their public key.',{whys:['Pua’s private key makes signatures, which anyone can check with her public key, so it keeps the file open to all.','Anyone may lock with Mele’s public key, and only Mele’s private key unlocks the result, so only Mele can open it.','Mele’s private key stays with Mele alone, so Pua has no copy to use.','Pua’s public key locks files that only Pua can open, the reverse of what she wants.'],imp:'core',c:'crypto-keys'}]
   ]),
   COMPARE('Data at rest, in transit, and in use',[
     {name:'At rest',tag:'Stored',tone:'l1',rows:[['Example','Files on a laptop disk, USB drive, or cloud folder'],['Threat','A stolen laptop or a discarded drive'],['Control','Disk encryption (BitLocker, FileVault, or LUKS) and file permissions']]},
     {name:'In transit',tag:'Moving',tone:'l2',rows:[['Example','A sign-in crossing café Wi-Fi, or mail moving between servers'],['Threat','Someone on the path reads or changes it'],['Control','TLS (the S in HTTPS), SSH, and VPNs']]},
     {name:'In use',tag:'Open',tone:'l3',rows:[['Example','A document open on screen and in memory'],['Threat','Shoulder surfing, screen capture, or malware reading memory'],['Control','Screen lock, privacy screens, memory protection, and a clean machine']]}
   ],{intro:'Name the state, and the control follows.'}),
   SEQ('Sign a file, check a file',[
     ['Hash','The publisher hashes the file, for example with SHA-256.','l1'],
     ['Sign','The publisher signs that hash with its private key, making the signature.','l2'],
     ['Ship','The file travels with its signature and the publisher’s certificate.','l2'],
     ['Hash again','Your computer hashes the file it received.','l3'],
     ['Verify','It checks that the certificate leads to a trusted root and names the expected publisher. Then it uses the certificate’s public key to check the signature against the new hash.','l3'],
     {ask:'Do both checks pass?',branches:[['Yes','The file is unchanged since the named publisher signed it. Install it.'],['No','Stop: the file changed, or the signer is unknown or unexpected. Delete it and get a fresh copy from the official source.']]}
   ],{intro:'A <b>hash</b> is a one-way, fixed-length fingerprint of data, like the checksum from <a href="#freshman/f4">Computers, virtualization, and the network</a>. A <b>digital signature</b> is a hash signed with a private key.'}),
   DETAIL('Collisions and code signing',
     P('A hash runs one way only: the fingerprint holds too little to rebuild the file. A <b>collision</b> is two different inputs with one fingerprint, which is why MD5 and SHA-1 are retired for signatures and SHA-256 does the job today.'),
     P('A hash proves a file unchanged only when the expected value comes from a trusted place, and a signature supplies that trust. <b>Code signing</b> applies this to programs, so Windows names a verified publisher and apt refuses packages whose repository signature fails.')),
   QUIZ('f10cy2','Check yourself',[
     ['What does a valid signature on an installer prove?',['The program is free of malware','It came from the holder of the signing key and is unchanged since signing','The file traveled over an encrypted connection','The publisher is a large, well-known company'],1,'Signatures vouch for origin and integrity; judging whether the program is safe stays your job.',{whys:['A signed program can still do harm: the signature tells you who signed it, and judging the program stays your job.','Only the signer’s private key makes that signature, and any change to the file breaks it, so a valid one shows who signed and that the file is unchanged.','Encrypted travel is the job of TLS; a signature checks the file itself, even offline.','Anyone with a signing key can sign, from a big company to one person.'],imp:'core',c:'crypto-signatures'}]
   ]),
   COMPARE('Encrypt, hash, or sign',[
     {name:'Encrypt',tag:'Hide it',tone:'l2',rows:[['Undo it?','Yes, with the right key'],['Key used','A shared key, or the recipient’s public key'],['Proves','Only key holders can read it'],['Everyday example','BitLocker on a laptop disk']],hook:'a locked box.'},
     {name:'Hash',tag:'Fingerprint it',tone:'l3',rows:[['Undo it?','Never: it runs one way'],['Key used','None'],['Proves','The data is unchanged, when the expected value comes from a trusted place'],['Everyday example','A SHA-256 check on a download']],hook:'a fingerprint.'},
     {name:'Sign',tag:'Vouch for it',tone:'l4',rows:[['Undo it?','Not needed: the file stays readable'],['Key used','The signer’s private key signs; their public key checks'],['Proves','Who signed it, and that it is unchanged since'],['Everyday example','A signed Windows or apt update']],hook:'a wax seal.'}
   ],{note:'<b>Salts.</b> A random <b>salt</b> added to each password before hashing gives equal passwords different hashes, so precomputed tables fail.'}),
   C('Certificates: signed ID cards','Understand',
     P('A <b>certificate</b> binds a public key to a name, such as shop.hoku-hardware.example, and a <b>certificate authority</b> (CA) signs it to vouch for that link. A browser accepts it when three checks pass. The name matches the address, today falls inside its valid dates, and its signatures lead back to a trusted root.'),
     TIPS('Common warnings: <b>expired</b> (past its Not After date), <b>name mismatch</b>, and <b>self-signed or unknown issuer</b>, where the chain ends before a trusted root.',
          'Each warning means the browser cannot prove which server answered, so whatever you send could reach an impostor. Close the page and report it.')),
   HIER('The chain of trust',
     {name:'Trust store on your device',note:'The roots that ship with the operating system or browser',tone:'l4',children:[
       {name:'Root certificate (from a root CA)',note:'Self-signed; the CA keeps its private key offline',tone:'l3',children:[
         {name:'Intermediate CA',note:'Signed by the root; signs sites’ certificates every day',tone:'l2',children:[
           {name:'Leaf: shop.hoku-hardware.example',note:'Signed by the intermediate; holds the shop’s public key',tone:'l1'}]}]},
       {name:'Unknown root certificate added to one laptop',note:'Trusted by this machine alone: a serious finding',tone:'bad'}]},
     {caption:'Whoever adds a root to a device’s trust store can pose as any site to that device.'}),
   DETAIL('PKI, private CAs, and certificate lifetimes',
     TIPS('<b>Public key infrastructure</b> (PKI) is the whole system: CAs, certificates, trust stores, and revocation for keys that leaked.',
          'A name mismatch means the certificate’s Subject Alternative Name list omits this address.',
          'Schools and companies also run private CAs for internal sites and Wi-Fi sign-in, and place those roots on their own devices alone.'),
     P('Leaf: at most 200 days since March 2026, shrinking to 100 days in 2027 and 47 days by 2029, so renewal is automated. Intermediate: about 5 to 10 years. Root: often 20 years or more, though major browsers now retire roots whose keys are older than about 15 years.')),
   QUIZ('f10cy3','Check yourself',[
     ['Kalani’s laptop trusts a root called “Free WiFi Inspection Root” that appeared last week, unknown to IT. Why does it matter?',['It matters only for Wi-Fi sign-in pages','Whoever holds that root’s key can pose as any site to that laptop','It is harmless, since a root signs only other certificates','It replaces the laptop’s antivirus'],1,'An unexpected root in the trust store is a serious finding.',{whys:['A root vouches for every site, far beyond Wi-Fi sign-in pages.','A trusted root can vouch for any name, so its key holder can make a certificate for any site, and the laptop accepts it.','Signing other certificates is exactly the danger: a root signs for any name.','Roots vouch for sites; antivirus is a separate tool.'],imp:'core',c:'crypto-certificates'}]
   ]),
   C('Proving it is you','Understand',
     P('A <b>passkey</b> is a key pair made for one site. Its private key stays in your device or password manager, and your face, fingerprint, or PIN unlocks it. The browser uses it only on the real site’s name, so a look-alike site gets nothing it can use.'),
     NOTE('<b>Push fatigue:</b> a flood of unexpected approval prompts means someone already has your password. Deny every one, report it, and change the password. Number matching, where you type the number the sign-in screen shows, ends the trick.')),
   SCALE('Sign-in strength',{from:'Weakest',to:'Strongest',bands:[
       ['Password only','Beaten by phishing, reuse across sites, and guessing','bad'],
       ['SMS code','Beaten by a fake page that relays the code, and by a SIM swap that moves your number','amber'],
       ['App code','Beaten by a fake page that relays the code within its 30 seconds','amber'],
       ['Number-matching push','Stops push fatigue; a convincing fake page can still relay the sign-in','l2'],
       ['Passkey or security key','Phishing fails, because the key works only on the real site. What still beats it: a stolen signed-in session, so sign out of shared devices and keep malware off','ok',1.8]]},
     {caption:'Use the strongest method a site offers.'}),
   DETAIL('Sign-in factors and Windows Hello',
     P('Multi-factor authentication (MFA) asks for two or more different kinds of proof: something you know, something you have, or something you are.'),
     P('<b>Windows Hello</b> and Windows Hello for Business: a PIN, face, or fingerprint unlocks a key held in this PC’s TPM. That key stays on the PC, so a stolen PIN is useless on any other device. Windows Hello also unlocks the passkeys saved on this PC.')),
   DETAIL('Agreeing on a key in public',
     TIPS('<b>HTTPS uses both:</b> key-pair math proves the server and agrees on a fresh shared key, which carries the rest of the conversation.',
          '<b>Paint mixing.</b> Each person mixes a secret color into one public color, swaps mixtures openly, then adds their secret to the other’s; the results match.',
          'A watcher sees only the mixtures, which resist unmixing. Diffie-Hellman does this with numbers, letting two strangers’ computers agree on a session key publicly.',
          '<b>Forward secrecy.</b> TLS 1.3 makes fresh keys for every session, so a server key stolen next year unlocks nothing recorded today.',
          'Browsers and many sites mix in ML-KEM, a quantum-resistant method, so traffic recorded today stays private from future quantum computers when both sides use it.',
          '<b>Slow hashes</b> such as yescrypt and bcrypt make every guess cost time.',
          '<b>S/MIME</b> uses certificates to sign and encrypt single email messages end to end, so only the recipient reads them.',
          'Retired: DES, RC4, and MD5 or SHA-1 for signatures.')),
   FLASH('f10fl','Key words',[
     ['Symmetric encryption','One shared key locks and unlocks. Fast; AES is the everyday name.'],
     ['Key pair','A public key anyone may hold and a private key only the owner keeps.'],
     ['Public key','Encrypts a message for its owner and checks the owner’s signatures.'],
     ['Private key','Decrypts messages sent to its owner and makes signatures. It stays with the owner.'],
     ['Hash','A fixed-length, one-way fingerprint of data, such as SHA-256.'],
     ['Salt','A random value stored beside each password hash, so equal passwords hash differently.'],
     ['Digital signature','A hash signed with a private key: it proves who signed and that nothing changed.'],
     ['Certificate','A signed record that binds a public key to a name; when a trusted CA signs it, browsers accept it.'],
     ['Certificate authority (CA)','An issuer that signs certificates to vouch for them.'],
     ['Trust store','The list of root certificates a device already trusts.'],
     ['Passkey','A key pair for one site, kept in your device or password manager and never sent to the site, that works only on the real site’s name.'],
     ['Data in transit','Data moving across a network, protected by TLS, SSH, or a VPN.']
   ]),
   MATCH('f10m','Goal to the tool','Tap an item on the left, then its match on the right.',[
     ['Keep a message secret so only Leilani can read it','Encrypt it with Leilani’s public key','Anyone may lock with Leilani’s public key, and only her private key opens the result.'],
     ['Prove an update came from Keola, unchanged','Sign its hash with Keola’s private key','Only Keola holds his private key, so the signature proves it came from him, and signing the hash ties it to this exact file.'],
     ['Check that a download arrived unaltered','Hash it and compare with the publisher’s value','The same file always gives the same hash, so a match with the publisher’s value shows nothing changed.'],
     ['Make two equal passwords store as different hashes','Add a unique salt to each before hashing','A unique salt changes what gets hashed, so equal passwords give different hashes and precomputed tables stop working.'],
     ['Lock a whole laptop disk quickly','One shared key (AES), as BitLocker uses','A shared-key (symmetric) cipher such as AES is fast, which suits encrypting a whole disk.'],
     ['Check Keola’s signature on that update','Keola’s public key','A signature made with Keola’s private key is checked with his public key, which anyone may hold.']
   ],'Understand'),
   QUIZ('f10q','Check: keys and trust',[
     ['A laptop is stolen from a car in Kahului. Which control protects the files on its disk?',['TLS','A VPN','Disk encryption such as BitLocker','Number-matching push'],2,'Name the data’s state first (at rest, in transit, or in use); the control follows.',{whys:['TLS protects data in transit, such as a sign-in, and these files sit on a disk.','A VPN protects data in transit too, and these files sit on a disk.','Files on a disk are data at rest, and disk encryption keeps them unreadable to whoever holds the stolen laptop.','Number matching protects sign-ins, and a thief reads the disk directly.'],imp:'core',c:'host-disk-encryption'}],
     ['A browser warns that the certificate for portal.lehua-clinic.example expired yesterday. Best move?',['Click through, since it is one day','Close the page and report it to the clinic','Install the certificate yourself','Switch to plain HTTP'],1,'Treat every certificate warning alike: the server’s identity is unproven.',{whys:['An expired certificate leaves the server’s identity unproven, even one day late.','Only the clinic can renew its certificate, so closing the page keeps you safe, and your report tells the owner to fix it.','Only the site’s owner can renew its certificate, and installing one yourself changes trust on your own device.','Plain HTTP drops encryption entirely, which leaves you worse off than the warning.'],imp:'core',c:'crypto-certificates'}],
     ['Which sign-in method leaves a perfect look-alike sign-in page with nothing it can use?',['SMS code','App code','Passkey','A password with symbols'],2,'Anything typed into a fake page can be relayed; a passkey stays bound to the real site.',{whys:['A fake page can ask for the SMS code and relay it to the real site.','A fake page can relay an app code within its 30 seconds.','A passkey is tied to the real site’s name, so on a look-alike name it declines to sign in, which leaves the page nothing to steal.','A fake page captures any password typed into it, symbols included.'],imp:'core',c:'sec-passwords-mfa'}],
     ['Approval prompts keep arriving on Healani’s phone at 2 a.m. What do they mean, and what does she do?',['The app is updating, so she approves one','Someone has her password: she denies them all, reports it, and changes the password','Her phone storage is full','She approves one to make them stop'],1,'Number matching ends push fatigue, because you type the number the sign-in screen shows.',{whys:['App updates arrive without sign-in prompts, and approving one hands the attacker the sign-in.','A prompt appears only after someone enters her password, so the password is stolen: denying blocks each attempt, and a new password ends them.','Full storage brings storage warnings, and these are sign-in prompts.','Approving one to stop them lets the attacker in.'],imp:'core',c:'sec-passwords-mfa'}],
     ['Two students choose the same password, yet the stored hashes differ. Why?',['Each password got its own salt','The system made an error','Every hash is random','One password was encrypted'],0,'Salts defeat precomputed tables, since a unique salt changes what gets hashed.',{whys:['The system adds a unique random salt to each password before hashing, so equal passwords produce different hashes.','Different hashes for equal passwords are the salt doing its job.','Hashes repeat: the same input always gives the same hash, so the difference comes from the salt.','Passwords are stored as hashes, and the salt, rather than encryption, makes the hashes differ.'],imp:'core',c:'crypto-salted-hashes'}],
     ['Kanoa’s Linux ISO finishes downloading, and its SHA-256 value matches the one on the official site. What does the match tell him?',['The file arrived complete and unaltered','The download traveled over an encrypted connection','The file will install faster','The ISO is the newest release'],0,'A hash proves integrity only against a trusted expected value. <a href="#freshman/f4">Review: Computers, virtualization, and the network</a>',{whys:['Any change to a file changes its SHA-256 value, so a match means the copy equals the publisher’s file.','Encrypted travel is the job of TLS; a hash checks the content after it lands.','A hash leaves install speed unchanged.','A hash matches one exact file, whichever release it is.'],imp:'core',c:'comp-integrity-hashing'}],
     ['An email from the “principal” asks the office to switch a vendor’s bank details today. What is it, and what stops it?',['Whaling, stopped by a spam filter','Business email compromise, stopped by a call-back on a known number before any payment change','Smishing, stopped by deleting the text','A drive-by, stopped by a browser update'],1,'Payment changes get a second check through a trusted channel. <a href="#freshman/f8">Review: Threats and the people behind them</a>',{whys:['Whaling targets a leader, while this mail poses as one, and spam filters often pass it.','BEC asks for a payment change by email, so a call-back on a number already on file reaches the real person before any money moves.','Smishing comes by text, and this is an email.','A drive-by installs malware through a page visit, and this email asks for a payment change.'],imp:'core',c:'sec-social-engineering'}]
   ]),
   LINKS('Go further',['fido-passkeys','nist-63b','eff'])
   ]},
 {id:'f11',title:'The web and the cloud in plain words',bloom:'Understand',sum:'How a browser and a server talk, how to read who owns a link, what the padlock promises and what it leaves out, and who secures what in the cloud.',
  can:'describe a request and a response, find the registered domain in a link, say what the padlock promises and leaves out, and name who secures what in the cloud',
  blocks:[
   C('How a browser and a server talk','Understand',
     P('<b>HTTP</b> (port 80) sends each request and response as readable text: anyone on the path can read or change it, passwords and session cookies included. <b>HTTPS</b> (port 443) wraps the same conversation in <b>TLS</b>, which keeps it private and detects tampering. An observer still sees the server’s address and name, when you connected, and how much data moved.')),
   ANATOMY('One request, one response',[
     {name:'Request',tag:'browser to server',tone:'l2',children:[
       {name:'Request line',tone:'l1',text:'<span class="mono">GET /grades HTTP/1.1</span><br>method, path, and version'},
       {name:'Headers',tone:'l1',text:'<span class="mono">Host: portal.<wbr>kahikina&#8209;high.<wbr>example<br>Cookie: session=…</span><br>which site, and proof you signed in'},
       {name:'Body',tone:'muted',text:'Empty for GET; a POST carries the form fields, password included'}]},
     {name:'Response',tag:'server to browser',tone:'l3',children:[
       {name:'Status line',tone:'ok',text:'<span class="mono">HTTP/1.1 200 OK</span><br>a three-digit status code and a short phrase'},
       {name:'Headers',tone:'l3',text:'<span class="mono">Content&#8209;Type: text/html<br>Set&#8209;Cookie: session=…</span><br>what follows, and what to remember'},
       {name:'Body',tone:'muted',text:'The page, image, or file itself'}]}
   ],{label:'A request with its request line, headers, and body, and the response with its status line, headers, and body.',
     facts:{head:['Family','Means','Example'],rows:[
       ['1xx','A note before the real answer','100 Continue'],
       ['2xx','It worked','200 OK'],
       ['3xx','Look elsewhere','301 Moved Permanently'],
       ['4xx','The request was refused or wrong','403 Forbidden, 404 Not Found'],
       ['5xx','The server failed','500 Internal Server Error']]}}),
   ANATOMY('Reading a link: the part that decides who owns it',[
     {name:'One link',tag:'read the host right to left',tone:'l2',grid:true,
      text:'<span class="mono">https://portal.kahikina-high.example/grades?term=fall</span>',
      children:[
        {name:'https://',tag:'scheme',tone:'muted',text:'how to connect; the s means TLS'},
        {name:'portal.',tag:'subdomain',tone:'l1',text:'any name the owner picks'},
        {name:'kahikina-high.example',tag:'the owner',tone:'ok',text:'the ending (sometimes two parts, like .co.uk) plus the one name before it'},
        {name:'/grades',tag:'path',tone:'l3',text:'which page on that site'},
        {name:'?term=fall',tag:'query',tone:'l3',text:'extra details for that page'}]}
   ],{intro:'Find where the host ends (the first /, ?, or # after <span class="mono">https://</span>), then read leftward: the ending, then the name before it.',
     label:'The link https://portal.kahikina-high.example/grades?term=fall split into scheme, subdomain, registered domain, path, and query, with the registered domain marked as the owner.',
     facts:{head:['Look-alike trick','Example (registered domain in bold)'],rows:[
       ['School name as a subdomain','<span class="mono">kahikina&#8209;high.<wbr>example.<wbr><b>grade&#8209;check.<wbr>example</b></span>'],
       ['An extra word','<span class="mono"><b>kahikina&#8209;high&#8209;login.<wbr>example</b></span>'],
       ['A swapped letter (l for i)','<span class="mono"><b>kahikina&#8209;hlgh.<wbr>example</b></span>'],
       ['School name in the path','<span class="mono"><b>login&#8209;help.<wbr>example</b>/<wbr>kahikina&#8209;high.<wbr>example</span>']]},
     key:[['ok','The registered domain: the owner']],
     caption:'Everything left of the registered domain, and everything after its slash, is written by that domain’s owner.'}),
   SPOT('f11sp','Which domain is each link really on?','Kahikina High uses one domain: kahikina-high.example. Tap every link whose registered domain is something else, then Check.',[
     ['https://portal.kahikina-high.example/grades',null,'Registered domain: kahikina-high.example, the school’s own. portal. is a subdomain the school made.'],
     ['https://kahikina-high.example.grade-check.example/signin','Registered domain: grade-check.example. The school name is only a subdomain here.'],
     ['https://www.kahikina-high.example/calendar?week=12',null,'Registered domain: kahikina-high.example. www. is the school’s subdomain, and the path and query follow the host.'],
     ['https://kahikina-high-login.example/','Registered domain: kahikina-high-login.example, a separate name anyone can register.'],
     ['http://kahikina-hlgh.example/portal','Registered domain: kahikina-hlgh.example, with an l in place of the i, over plain HTTP too.'],
     ['https://login-help.example/kahikina-high.example/','Registered domain: login-help.example. The school name sits in the path, which login-help.example’s owner writes.'],
     ['https://mail.kahikina-high.example/inbox?from=kahikina-high-login.example',null,'Registered domain: kahikina-high.example. The look-alike name sits in the query, after the host ends, so it decides nothing about the owner.']
   ]),
   COMPARE('Three address bars',[
     {name:'portal.kahikina-high.example',tag:'HTTPS with a padlock',tone:'ok',rows:[['Private?','Yes: TLS hides the page and the password'],['Right domain?','Yes: the school’s registered domain'],['Safe to sign in?','Yes']],hook:'the right door, locked.'},
     {name:'kahikina-high-login.example',tag:'HTTPS with a padlock',tone:'bad',rows:[['Private?','Yes: certificates are free and take minutes'],['Right domain?','No: a stranger’s look-alike'],['Safe to sign in?','No: the password goes privately to the stranger']],hook:'a locked door on the wrong house.'},
     {name:'http://portal.kahikina-high.example',tag:'HTTP, marked Not secure',tone:'amber',rows:[['Private?','No: anyone on the network reads it'],['Right domain?','Yes'],['Safe to sign in?','No: the password crosses the Wi-Fi as plain text']],hook:'the right door, wide open.'}
   ],{note:'The padlock proves two things: the connection is private, and the server holds a valid certificate for that exact name. Who runs the site stays outside its promise.',
     caption:'Sign in only when both say yes: a padlock and the right registered domain.'}),
   QUIZ('f11c1','Check yourself',[
     ['A sign-in page loads over HTTPS (a padlock, or the slider icon in Chrome). What does that prove?',['The people running the site are honest','The site is free of malware','The school approved the site','The connection to that exact domain is private, and the domain holds a valid certificate'],3,'Certificates are free, so phishing pages carry padlocks too; check the registered domain as well.',{whys:['The padlock says nothing about who runs the site; phishing pages carry one too.','TLS protects the connection; the site itself can still serve malware.','Certificates are free for anyone, with no school approval involved.','TLS keeps the connection private, and the certificate shows the server holds that exact name; who runs the site is separate.'],imp:'core',c:'crypto-tls'}],
     ['Which link is really on kahikina-high.example?',['https://kahikina-high.example.grade-check.example/','https://kahikina-high-login.example/','https://grades.kahikina-high.example/report?id=7','https://login-help.example/kahikina-high.example/'],2,'Read the host right to left from where it ends: the ending plus the one name before it.',{whys:['The host ends in grade-check.example; the school name is a subdomain.','kahikina-high-login.example is a separate name anyone can register.','Read from where the host ends: the registered domain is kahikina-high.example, and grades. is a subdomain the school made.','The registered domain is login-help.example; the school name sits in the path.'],imp:'core',c:'web-urls'}]
   ]),
   C('Browser habits that stop most trouble','Understand',
     TIPS('<b>A certificate warning on a familiar site</b> may mean interception, most often on public Wi-Fi.',
          'Close the tab, try again from a trusted network, and tell your teacher or IT staff.',
          '<b>Updates</b>: restart the browser when it asks, so the fix loads.',
          '<b>Extensions</b>: install few, only from the official store, with permissions that fit the job.',
          '<b>Password manager</b>: it fills a password only on the site that saved it, so an empty box on a familiar page signals a look-alike domain.',
          '<b>Browser sync</b> carries saved passwords and history to every signed-in device, so that account needs MFA.')),
   DETAIL('Chrome, updates, and extensions',
     TIPS('Chrome shows a slider icon in place of the padlock, with the same meaning; plain HTTP still reads Not secure.',
          'Chrome now asks before it opens a public site over plain HTTP.',
          'Updates matter because the browser is the most-attacked app on most computers.',
          'A wallpaper extension asking to “read and change all your data on all websites” wants far more than wallpaper needs, so skip it.')),
   C('The cloud: someone else’s computers, rented','Understand',
     P('<b>The cloud</b> is computing (servers, storage, databases, and finished apps) usually rented on demand from a provider’s data centers. <b>On premises</b> means the organization owns the hardware in its own building.'),
     P('A <b>public cloud</b> shares the provider’s hardware among many customers, a <b>private cloud</b> serves one organization, and a <b>hybrid cloud</b> joins the two. The join itself, such as the account that syncs sign-ins, is a prize: whoever controls it reaches both sides.')),
   STACK('Who manages what: on premises, IaaS, PaaS, and SaaS',[
     {name:'On premises',layers:[['Data','',1,'ok'],['Identity','',1,'ok'],['App','',1,'l3'],['Runtime','',1,'l3'],['OS','',1,'l3'],['VM layer','',1,'l3'],['Hardware','',1,'l3'],['Physical network','',1,'l3'],['Building','',1,'l3']]},
     {name:'IaaS',layers:[['Data','',1,'ok'],['Identity','',1,'ok'],['App','',1,'l3'],['Runtime','',1,'l3'],['OS','You patch it and set its firewall',1,'l3'],['Provider','VM layer down',4,'muted']]},
     {name:'PaaS',layers:[['Data','',1,'ok'],['Identity','',1,'ok'],['App','Your code',1,'l3'],['Provider','Runtime down',6,'muted']]},
     {name:'SaaS',layers:[['Data','',1,'ok'],['Identity','Accounts and sharing',1,'ok'],['Provider','App down',7,'muted']]}
   ],{intro:'<b>IaaS</b> rents virtual machines and networks, <b>PaaS</b> runs your code on a managed platform, and <b>SaaS</b> is a finished browser app. <b>Identity</b> means who gets in: accounts, MFA, and permissions.',
     note:'Providers secure the cloud; customers secure what they put in it: the <b>shared responsibility model</b>.',
     key:[['ok','Always yours: data and identity'],['l3','You manage'],['muted','The provider manages']],
     caption:'Move right and the provider runs more, yet data and identity stay yours in every column.'}),
   DETAIL('Cloud models side by side',
     P('You pay for cloud computing as you use it and control it from a web console, a command line, or code. On premises, the organization does every job, from swapping a failed disk to patching the operating system.'),
     P('Cloud capacity grows in minutes and arrives as a monthly bill; on premises keeps the data physically in hand and keeps working when the internet link drops. Many organizations run both.'),
     P('The security ideas stay the same everywhere: identity, least privilege, patching, logging, and backups. What changes is who does each job, and how fast one wrong setting reaches the whole internet. Most cloud breaches start on the customer’s side: storage left public, keys in code, accounts without MFA, and too-wide permissions.'),
   COMPARE('Public, private, and hybrid cloud',[
     {name:'Public cloud',tag:'shared hardware',tone:'l2',rows:[['Who uses the hardware','Many customers, kept apart by the provider’s hypervisors and accounts'],['Where it lives','The provider’s data centers'],['Who runs it','The provider runs the hardware; each customer runs its own settings'],['Typical user','A startup that needs ten servers today and two next week']],hook:'renting one unit in a huge apartment building.'},
     {name:'Private cloud',tag:'one organization',tone:'l3',rows:[['Who uses the hardware','One organization only'],['Where it lives','Its own data center or a hosting company’s'],['Who runs it','The organization, including hypervisor patches, plus physical security in its own building'],['Typical user','A hospital with strict rules on where patient data lives']],hook:'a house built for one family.'},
     {name:'Hybrid cloud',tag:'both, joined',tone:'l4',rows:[['Who uses the hardware','The organization in its building, plus the public cloud'],['Where it lives','Both places at once'],['Who runs it','Both sides, joined by a VPN, a sync account, or a shared sign-in'],['Typical user','A school district that keeps its old servers and moves email to the cloud']],hook:'a house plus a rented storage unit across town.'}
   ],{caption:'Public shares the hardware, private dedicates it, and hybrid joins the two.'})),
   QUIZ('f11c2','Check yourself',[
     ['Kaimana Dental Clinic sets a cloud storage folder to public, and patient files leak. Whose job was that setting?',['The cloud provider’s','The clinic’s: who may open its data stays with the customer in every model','The internet provider’s','Split equally: the provider and the clinic each own half of every setting'],1,'Providers secure buildings, hardware, and hypervisors. The customer decides who may open its data.',{whys:['The provider secures buildings and hardware; sharing settings are the customer’s.','In every model the customer decides who may open its data, so the public setting was the clinic’s to make and to fix.','The internet provider carries traffic and has no say over storage settings.','Each job has one owner, and this setting belongs to the clinic.'],imp:'core',c:'cloud-shared-responsibility'}]
   ]),
   C('Cloud files and office suites','Understand',
     P('In a cloud office suite, such as <b>Microsoft 365</b> or <b>Google Workspace</b>, one account opens mail, files, and calls, so it is the prize. Three ways in, and what stops each:'),
     TIPS('<b>A fake sign-in page</b> on a look-alike domain: passkeys and security keys stop it; codes and pushes relay through, so read the registered domain.',
          '<b>“Enable Content”</b> on a document runs a <b>macro</b>, a small program inside the file; leave it alone in unexpected files.',
          '<b>An app asking to read your mail or files</b>: treat an unknown add-on wanting full access like a macro; admins limit which apps connect.')),
   DETAIL('Enable Editing, Enable Content, and the Mark of the Web',
     TIPS('Internet downloads carry a Windows tag, the <b>Mark of the Web</b> (<a href="#sophomore/s2">Windows 11 hardening</a>), so Office opens them in Protected View behind a yellow <b>Enable Editing</b> bar.',
          'The same tag makes Office block the file’s macros outright, shown by a red Security Risk bar.',
          'Enable Editing leaves that sandbox; Enable Content runs the code. Leave both alone on an unexpected file.')),
   COMPARE('Sync, backup, and a share link',[
     {name:'Sync',tag:'OneDrive, Drive, Dropbox, Box, and iCloud',tone:'l2',rows:[['Copies','The live folder, to every device and the cloud, in seconds'],['A deletion','Deletes everywhere; the recycle bin and version history restore it for a while'],['Ransomware','Encrypted files sync too; version history restores the old ones'],['Who can open it','You, on each signed-in device']],hook:'one notebook that every device writes in.'},
     {name:'Backup',tag:'a separate copy',tone:'ok',rows:[['Copies','Files as they were at backup time, onto separate storage'],['A deletion','The backup keeps its copy'],['Ransomware','An offline or unchangeable copy stays clean'],['Who can open it','Whoever holds that backup account or disk']],hook:'a photocopy kept in another building.'},
     {name:'Share link',tag:'Anyone with the link, or Specific people',tone:'amber',rows:[['Copies','Nothing: it opens a door to the original'],['A deletion','The link stops working'],['Ransomware','Visitors see the scrambled file'],['Who can open it','Anyone with the link: whoever gets it, forwarded or leaked. Specific people: only those named, once signed in.']],hook:'a key anyone can copy once it is handed out.'}
   ],{note:'Keep school files in the school’s account, protect that account with MFA, and remove share links when a project ends. Snapshots versus backups: <a href="#freshman/f4">Computers, virtualization, and the network</a>.'}),
   MATCH('f11m','Codes and clouds','Tap an item on the left, then its match on the right.',[
     ['200','It worked','2xx means success.'],
     ['301','The page moved: look elsewhere','3xx sends the browser to another address.'],
     ['403','You lack the rights to see it','4xx: the server refused the request.'],
     ['404','Nothing lives at that path','4xx: the request named something missing.'],
     ['500','The server failed','5xx: the fault sits on the server’s side.'],
     ['A rented Ubuntu VM that you patch','IaaS','You run the operating system and everything above it.'],
     ['A platform that runs your web app’s code','PaaS','The provider patches the OS and runtime; your code and data stay yours.'],
     ['School email and documents in a browser','SaaS','The provider runs the app; accounts and sharing stay yours.']
   ],'Understand'),
   QUIZ('f11q','Check: web and cloud',[
     ['On café Wi-Fi in Kīhei, your usual grade portal shows a certificate warning. Best move?',['Close the tab and try again later from a trusted network, then report it','Click Advanced and continue, since you know the site','Turn off certificate warnings','Sign in fast before the warning returns'],0,'A certificate warning on a familiar site is an alarm to act on rather than click past.',{whys:['A warning on a familiar site points at this network, which may be intercepting; leave and report it.','Continuing hands your password to whatever is intercepting.','Turning warnings off removes your alarm for every site.','Speed changes nothing; the connection itself is suspect.'],imp:'core',c:'crypto-certificates'}],
     ['Ransomware encrypts the files in Keahi’s synced OneDrive folder. What happens to the cloud copies?',['They stay safe, because sync is a backup','The provider deletes the account','The encrypted versions sync too; version history or a separate backup restores them','Sync pauses whenever ransomware runs'],2,'Sync is a mirror rather than a backup; recovery comes from version history or a copy kept apart.',{whys:['Sync copies every change, damage included, so it is a mirror, unlike a backup.','The provider keeps the account; the files simply sync encrypted.','Sync mirrors every change, damage included, while version history and a separate backup keep the older, clean copies.','Sync copies ransomware’s changes like any edit.'],imp:'core',c:'comp-virtualization'}],
     ['A Word file on a shared drive shows a yellow bar with “Enable Content”. What does that button do?',['Checks the spelling','Saves the file to OneDrive','Turns on Protected View','Lets a macro, a small program inside the file, run'],3,'Leave Enable Content alone on unexpected files, and ask IT if a school file truly needs macros.',{whys:['Spelling tools live elsewhere; this bar is about running code.','Saving is separate; this button runs the file’s macros.','Protected View is the safe sandbox, and this button runs code instead.','That button runs the file’s macros with your rights.'],imp:'core',c:'threat-email-checks'}],
     ['Staff at Waimea Feed and Supply visit one fishing-club forum every day. An intruder quietly plants harmful code on that forum to reach them. What is this attack called?',['Smishing','Tailgating','A watering hole','Whaling'],2,'A watering hole’s weapon is often a drive-by download. <a href="#freshman/f8">Review: Threats and the people behind them</a>',{whys:['Smishing arrives as a text message.','Tailgating follows someone through a door in person.','A watering hole poisons a site that one chosen group already trusts and visits, here the fishing-club forum.','Whaling aims a crafted message at one senior leader.'],imp:'good',c:'threat-web-delivery'}],
     ['Why does a passkey hold up against a look-alike sign-in page?',['It is bound to the real domain, so it signs in only there','It is longer than any password','It changes every hour','The school server stores it'],0,'A look-alike domain gets nothing to steal from a passkey. <a href="#freshman/f10">Review: Keys, locks, and certificates</a>',{whys:['A passkey is a key pair bound to the domain that created it, so the browser never offers it to a look-alike.','Length stops guessing, yet a fake page could still collect a password.','A passkey stays the same; its strength is the domain binding.','The private key stays on your device; the site holds the public half.'],imp:'core',c:'sec-passwords-mfa'}]
   ]),
   LINKS('Go further',['mdn-http','nist-cloud','eff'])
   ]},
 {id:'f12',title:'Code you can read',bloom:'Understand',sum:'What a script is, how loops and conditions read in Bash, PowerShell, and Python, readable scripts versus built programs, and the data formats tools speak.',
  can:'read a loop and a condition in Bash, PowerShell, and Python, tell a script from a built program, and recognize JSON, YAML, and CSV',
  blocks:[
   C('What a script is','Understand',
     P('A <b>script</b> is a text file of commands that a program called an <b>interpreter</b> reads and runs, line by line. Before you run any script, say what each line does and what it changes.'),
     TIPS('<b>Variable</b>: a named box for a value, such as <code>name="keola"</code>.',
          '<b>Condition</b>: a test that chooses: <i>if</i> this is true, run these lines.',
          '<b>Loop</b>: repeats the same lines for each item, such as each line of a file.',
          '<b>Shebang</b>: a Unix script’s first line, <code>#!</code> plus its interpreter, such as <code>#!/bin/bash</code> or <code>#!/usr/bin/env python3</code>.'),
     NOTE('<b>Read it before you run it.</b> A script runs with your rights, and under sudo with root’s. Stop and ask about any line you cannot explain. A one-liner that pipes a downloaded script straight into a shell runs code nobody read.',true)),
   DETAIL('More about scripts',
     P('Defenders write scripts to repeat one check across many accounts or machines, and to sift logs too long to read by eye.'),
     TIPS('<b>Function</b>: a named step you can reuse, such as <code>print()</code>.',
          '<b>Input and output</b>: what the script reads (files and typed answers) and what it writes (the screen, a file, or a setting).',
          'Intruders favor PowerShell because admins do: every Windows PC has it and trusts it. PowerShell started by a document or download deserves a closer look.',

     {name:'Readable script',tag:'Python, Bash, PowerShell, and JavaScript',tone:'l2',

   TIPS('<b>Cracked software is a delivery channel</b>: a stranger modified the program to remove its licence check, and malware often rides along.',
        'Unlicensed software on a lab machine is a finding twice: a policy breach and an unknown binary.'),
   DETAIL('Licences and open source',
     P('Every program carries a <b>licence</b>: the rules its author set for copying and use. <b>Open source</b> licences (MIT, GPL, Apache) let anyone read, run, and change the code, which is why defenders can audit Linux, OpenSSH, and Python line by line. <b>Proprietary</b> licences keep the source private and sell the right to run the built program. Both are legitimate; the choice shapes who can check the code and who is paid to fix it.'),
     TIPS('<b>Licences shape security.</b> Open licences let anyone fix a flaw, so fixes spread fast; a single-vendor licence makes that vendor\u2019s patch schedule everyone\u2019s risk.',
          'Each licence model carries trade-offs, so procurement (the team that buys software) asks about both.')),
   QUIZ('f12cy','Check yourself',[
     ['A built program ships without its source. What do you check instead?',['Its file name and folder','Its size and save date','Its icon and product name','Its hash and its signature'],3,'When only machine code ships, check who signed it and whether its hash is known good or bad.',{whys:['Anyone can rename or move a file, so its name proves nothing.','Size and date are easy to change, so they leave the maker unknown.','An icon and a product name are easy to copy from a real program.','The signature names who made it, and the hash matches a known-good or known-bad list.'],imp:'core',c:'comp-integrity-hashing'}]
   ]),

   C('Ten lines to read: count_failed.py','Understand',
     P('This script counts failed sign-ins per address in a Linux sign-in log. Read it without running it: what does it open, repeat, test, and print?'),
     TERM('# Count failed sign-ins per address. Reads only.\nfrom collections import Counter\ncounts = Counter()\nwith open("auth.log") as log:\n    for line in log:\n        if "Failed password" in line:\n            words = line.split()\n            ip = words[words.index("from") + 1]\n            counts[ip] += 1\nprint(counts.most_common(3))')),
   ANATOMY('A ten-line Python script, part by part',[
     {name:'Setup',tag:'lines 1 to 3',tone:'muted',text:'A comment Python skips, an import of a ready-made tally (Counter), and an empty one to fill'},
     {name:'Open the file',tag:'line 4',tone:'l1',text:'<code>with</code> <code>open("auth.log")</code> <code>as log:</code> opens the log to read and closes it afterward',children:[
       {name:'Loop',tag:'line 5',tone:'l3',text:'<code>for line in log:</code> runs once per line',children:[
         {name:'Condition',tag:'line 6',tone:'l4',text:'Lets through only lines that hold “Failed password”'},
         {name:'Count',tag:'lines 7 to 9',tone:'amber',text:'Runs only for those lines: split the line, take the word after “from”, and add 1 to that address'}]}]},
     {name:'Output',tag:'line 10',tone:'ok',text:'<code>print(counts.most_common(3))</code> prints the three addresses with the most failures'}
   ],{intro:'Each indent sits inside the line above it: the open file holds the loop, and the loop holds the test.',
     note:'On a log with 41 failures from 203.0.113.45 and 3 from 198.51.100.7, it prints <code>[(\'203.0.113.45\', 41),</code> <code>(\'198.51.100.7\', 3)]</code>. It opens one file to read, and it writes and changes nothing.',
     key:[['l1','Open'],['l3','Loop'],['l4','Condition'],['amber','Count'],['ok','Output']]}),
   QUIZ('f12cy2','Check yourself',[
     ['count_failed.py reads a log with three “Failed password” lines from 198.51.100.7 and one “Accepted password” line from 192.0.2.10. What does it print?',['<code>[(\'198.51.100.7\', 3)]</code>','<code>[(\'198.51.100.7\', 3), (\'192.0.2.10\', 1)]</code>','<code>[(\'192.0.2.10\', 1)]</code>','<code>4</code>'],0,'The condition keeps “Failed password” lines alone, so the accepted sign-in stays out of the counter.',{whys:['Only “Failed password” lines count, so 198.51.100.7 shows 3 failures.','The accepted sign-in fails the “Failed password” test, so 192.0.2.10 stays out.','This keeps the one line the script skips and drops the three it counts.','The script prints each address with its count, rather than one total.'],imp:'core',c:'comp-scripting'}]
   ]),
   COMPARE('JSON, YAML, and CSV',[
     {name:'JSON',tag:'braces and quotes',tone:'l2',rows:[
       ['One record','<code>{"name": "keola",</code><br><code>&nbsp;"admin": false,</code><br><code>&nbsp;"groups": ["staff", "lab"]}</code>'],
       ['Objects','Braces around <code>"key": value</code> pairs, split by commas'],

       ['One record','<code># approved in the brief</code><br><code>name: keola</code><br><code>admin: false</code><br><code>groups:</code><br><code>&nbsp;&nbsp;- staff</code><br><code>&nbsp;&nbsp;- lab</code>'],
       ['Objects','<code>key: value</code>, one per line; indentation shows what sits inside what'],

       ['Strings','Quotes optional; quote anything that could pass for a number, true, or false'],

   ],{note:'All three are plain text, so <code>cat</code> or any text editor reads them before a tool acts on them.'}),
   MATCH('f12m','Match the line to what it does','Tap a line on the left, then what it does.',[
     ['<code>#!/bin/bash</code>','Names the interpreter that runs the script','The shebang: #! and then the interpreter’s path.'],
     ['<code>for u in $(cat users.txt); do</code>','Repeats the lines up to done once per name','A Bash loop; done closes it.'],
     ['<code>if u not in ok:</code>','Runs the indented lines only for names missing from the list','A Python condition; the indent marks the block.'],
     ['<code>$ok = Get-Content brief.txt</code>','Stores the file’s lines in a variable','PowerShell variables start with $.'],
     ['<code>counts[ip] += 1</code>','Adds one to that address’s tally','The counter line in count_failed.py.'],
     ['<code>from collections import Counter</code>','Borrows a ready-made tool from Python’s library','An import brings in code someone else wrote.'],
     ['<code>echo "Not in brief: $u"</code>','Prints a line with the name filled in','echo is Bash’s output line; $u becomes the name.']
   ],'Understand'),
   QUIZ('f12q','Check: predict the output',[
     ['users.txt holds keola, malia, and svc_update. brief.txt holds keola alone. What does the Bash version print?',['Not in brief: keola','Not in brief: malia, then Not in brief: svc_update','Not in brief: svc_update','Nothing: every name passes'],1,'keola is in the brief; malia and svc_update fail the test, so the output line runs twice.',{whys:['keola is in the brief, so the test passes keola and prints nothing for it.','malia and svc_update are missing from the brief, so the line prints once for each.','malia is missing from the brief too, so she prints before svc_update.','Only keola is in the brief, so two names fail the test and print.'],imp:'core',c:'comp-scripting'}],
     ['What does this Python print?<br><code>for n in [3, 5, 7]:<br>&nbsp;&nbsp;if n &gt; 4:<br>&nbsp;&nbsp;&nbsp;&nbsp;print(n)</code>',['3, 5, and 7','5 and 7, each on its own line','7 alone','3 alone'],1,'The loop visits each number, the condition passes those above 4, and print runs once for each.',{whys:['3 is below 4, so the condition skips it.','The condition lets 5 and 7 through, and print puts each on its own line.','5 is above 4 too, so it prints before 7.','3 fails the test of being above 4, so print skips it.'],imp:'core',c:'comp-scripting'}],
     ['Which format allows no comments and puts every key in double quotes?',['YAML','CSV','JSON','All three of them'],2,'JSON uses braces, brackets, and quoted keys. YAML allows # comments, and CSV rarely needs quotes.',{whys:['YAML allows # comments and leaves most keys unquoted.','CSV is rows split by commas, without keys or comments.','JSON’s rules require double quotes around every key and give it no comment syntax, so JSON alone fits both clues.','YAML and CSV break both rules, so JSON alone fits.'],imp:'good',c:'comp-data-formats'}],
     ['Code that starts with <code>package main</code> and checks <code>if err != nil</code> most likely reaches a machine as',['a text script an interpreter reads','one built, self-contained program file','a YAML settings file','a CSV export'],1,'Those are Go marks, and Go builds one large self-contained file.',{whys:['Bash and Python ship as text; package main marks Go, which is built.','package main and if err != nil mark Go, which builds one self-contained file.','YAML holds settings as key: value lines, without code such as if.','CSV holds rows of data split by commas, without code.'],imp:'good',c:'comp-scripting'}],
     ['A checkout page holds <code>&lt;script src="https://cdn.kapaa-kayak.example/pay.js"&gt;</code>. What does src show a defender?',['Where the page’s code loads from','Where the shopper’s card number goes','Which browser runs the page','Who signed the script'],0,'src names where the code comes from; <code>fetch</code> calls and form URLs show where data goes.',{whys:['The browser loads the script from the address in src, so src names the outside site that controls the page’s code.','Card data goes where form URLs and fetch calls point, which src leaves out.','src names a file’s address, and every browser loads it the same way.','A signature check needs the file itself; src shows only its address.'],imp:'good',c:'comp-scripting'}],
     ['In <code>grep -i \'failed\' /var/log/auth.log | wc -l</code>, what does <code>|</code> do?',['Saves the output in a file named wc','Sends grep’s output into wc as its input','Runs wc first, then grep','Marks the end of the command'],1,'A pipe hands the left program’s output to the right one, so wc counts the matching lines. <a href="#freshman/f6">Review: First look at Linux</a>',{whys:['The pipe passes text to the next program rather than to a file.','| hands grep’s matching lines to wc, which counts them.','A pipe reads left to right, so grep feeds wc.','The line ends where the text ends; | joins two programs.'],imp:'core',c:'lin-shell'}],
     ['In <code>Get-LocalUser | Where-Object Enabled -eq $true</code>, what does the PowerShell pipe hand to Where-Object?',['Whole user objects, one at a time','Lines of plain text','A file on disk','The first user alone'],0,'PowerShell pipes pass whole objects, so Where-Object tests the Enabled property directly; a Bash pipe passes text. <a href="#freshman/f5">Review: First look at Windows</a>',{whys:['PowerShell pipes whole objects, so Where-Object reads the Enabled property.','Plain text is what a Bash pipe passes; PowerShell passes objects.','Pipes pass data from command to command in memory, without a file.','Every user passes along, one at a time, so the filter sees them all.'],imp:'good',c:'win-powershell'}]
