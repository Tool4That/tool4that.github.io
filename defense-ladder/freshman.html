    if(e.key!=='Tab') return;
    const f=panelFocusables(); if(!f.length) return;
    const first=f[0], last=f[f.length-1], a=document.activeElement;
    if(!navPanel.contains(a)){ e.preventDefault(); (e.shiftKey?last:first).focus(); }
    else if(e.shiftKey&&a===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&a===last){ e.preventDefault(); first.focus(); }
  });
  document.addEventListener('focusin',e=>{ if(menuOpen&&!navPanel.contains(e.target)){ const f=panelFocusables(); if(f[0]) f[0].focus(); } });
  /* Back and Forward close the Menu and open their view */
  addEventListener('popstate',()=>closeMenu(false));
  addEventListener('hashchange',()=>closeMenu(false));
  addEventListener('scroll',()=>{ if(!barTick){ barTick=true; requestAnimationFrame(barScroll); } },{passive:true});
  if(railEl) railEl.addEventListener('focusin',showBar);
  if(wideMQ){ const f=()=>{ closeMenu(false); showBar(); navMark(); }; if(wideMQ.addEventListener) wideMQ.addEventListener('change',f); else if(wideMQ.addListener) wideMQ.addListener(f); }
  addEventListener('pagehide',navFlush);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') navFlush(); });
  navBooted=true;
}

/* =====================================================================
   LEARNING FLOW AND SHARED COMPUTERS (UX plan, Phase 3, 2026-10-21)
   Sections: a unit of five or more blocks splits at block boundaries into three to six sections, by block count
   and size (a Deeper detail panel, a "Check yourself" quiz, and the Go further links stay with the block before
   them). One section shows at a time, with "Back to:" and "Continue to:", "Section N of M", and "In this unit"
   grouped by section. Every block still renders when the unit opens (a hidden section skips layout), so drills,
   ids, and progress work as before; print and "Show the whole unit" show every section. A #grade/unit link opens
   section 1; the history entry keeps the section shown (Back, Forward, and a reload return to it); "_nav" keeps
   each unit's last section, which Continue, the grade buttons, and My progress "Open" reopen.
   COMPARE on phones (below 600 px) offers "Compare by row": each attribute with its values from every column.
   "Terms in this unit" lists the glossary entries whose "at" names the unit, once the glossary has arrived.
   Shared computers: a banner on a new visit (a sessionStorage flag) when saved progress exists; Start fresh and
   "Finish on this computer" show the progress code with Copy, then clear after a confirming second tap. Shared
   computer mode keeps reflections in sessionStorage only. When a write to localStorage fails, a calm notice
   appears, and reflections and builders say "Not saved". Read aloud uses speechSynthesis where it exists.
   ===================================================================== */
const FLOW_KEY=KEY+'-flow', CMP_KEY=KEY+'-cmp', SHARED_KEY=KEY+'-shared', SESS_SEEN=KEY+'-visit', SESS_REFLECT=KEY+'-reflect';
const flowPlans=new WeakMap();
let flowCur=null, flowResume=null, flowWholeOn=false, flowCmp='col', flowDockEl=null, flowNoticeShown=false, flowJustCleared=false;
function flowLsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function flowLsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function flowSsGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function flowSsSet(k,v){ try{ if(v==null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); return true; }catch(e){ return false; } }
let flowShared=flowLsGet(SHARED_KEY)==='1';

/* ---- sections: the plan for a unit (cached), then the controls ---- */
function flowLabel(b){ return b.title?titleText(b.title):b.t==='planner'?'Session planner':b.t==='timer'?'Practice timer':ACT_NAME[b.t]||'More practice'; }
function flowGlue(b){ return b.t==='detail'||b.t==='links'||(b.t==='quiz'&&/^check yourself/i.test(titleText(b.title))); }
function flowPlan(U){
  const bl=U.blocks, n=bl.length;
  let p=flowPlans.get(bl); if(p) return p;
  if(n<5){ p=[bl.map((b,i)=>i)]; flowPlans.set(bl,p); return p; }
  const chunks=[];
  bl.forEach((b,i)=>{ if(i&&flowGlue(b)) chunks[chunks.length-1].push(i); else chunks.push([i]); });
  const wt=bl.map(b=>{ let s=0; try{ s=JSON.stringify(b).length; }catch(e){} return Math.max(700,s); });
  const cw=chunks.map(c=>c.reduce((a,i)=>a+wt[i],0)), W=cw.reduce((a,x)=>a+x,0), m=chunks.length;
  const k=Math.min(m,Math.min(6,Math.max(3,Math.ceil(n/5),Math.round(W/7000))));
  /* contiguous groups of chunks, with the heaviest group as light as possible */
  const pre=[0]; cw.forEach(x=>pre.push(pre[pre.length-1]+x));
  const best=[], cut=[];
  for(let g=0;g<=k;g++){ best.push(new Array(m+1).fill(Infinity)); cut.push(new Array(m+1).fill(0)); }
  best[0][0]=0;
  for(let g=1;g<=k;g++) for(let j=g;j<=m;j++) for(let i=g-1;i<j;i++){
    const v=Math.max(best[g-1][i],pre[j]-pre[i]);
    if(v<best[g][j]){ best[g][j]=v; cut[g][j]=i; }
  }
  p=[]; let j=m;
  for(let g=k;g>0;g--){ const i=cut[g][j]; p.unshift([].concat(...chunks.slice(i,j))); j=i; }
  flowPlans.set(bl,p); return p;
}
/* the section a unit opens at: its last section for Continue, a grade button, and My progress "Open"; the
   history entry's section for Back, Forward, a reload, and a redraw; section 1 for a #grade/unit link */
function flowStart(U,n){
  let k=0;
  if(flowResume===U.id){ const s=navState().sec; k=(s&&s[U.id])|0; }
  else{ let st=null; try{ st=history.state; }catch(e){} if(st&&Array.isArray(st.dlsec)&&st.dlsec[0]===U.id) k=st.dlsec[1]|0; }
  flowResume=null;
  return Math.min(Math.max(0,k),n-1);
}
function flowUnit(L,U,uh){
  flowTerms(L,U,uh);
  const groups=flowPlan(U), n=groups.length, pre='sec-'+U.id+'-';
  const sxOf=[]; groups.forEach((g,k)=>g.forEach(i=>{ sxOf[i]=k; }));
  const F={L,U,groups,n,pre,sxOf,k:0,titles:groups.map(g=>flowLabel(U.blocks[g[0]])),osh:[]};
  flowCur=F;
  if(flowSpeech) U.blocks.forEach((b,i)=>{ const nd=document.getElementById(pre+i); if(nd) flowRaAdd(nd); });
  if(n<2){ flowResume=null; return; }
  U.blocks.forEach((b,i)=>{ const nd=document.getElementById(pre+i); if(nd) nd.dataset.sx=sxOf[i]; });
  groups.forEach((g,k)=>{ const f=document.getElementById(pre+g[0]); if(f&&f.classList.contains('card')) f.dataset.sxh=`Section ${k+1} of ${n}`; });
  /* "Section N of M" under the unit summary, with a segment per section */
  const pos=el('div','sxpos');
  pos.innerHTML='<p class="sxp"><span class="sxk"></span> <span class="sxt"></span></p><ol class="sxseg" aria-hidden="true">'+groups.map(()=>'<li></li>').join('')+'</ol>';
  uh.appendChild(pos);
  F.pos=pos;
  /* Back to and Continue to, at the end of the section (the top of the unit control by the pager) */
  const foot=main.querySelector('.ufoot');
  const nav=el('nav','sxnav');nav.setAttribute('aria-label','Sections of this unit');
  nav.innerHTML='<p class="sxn"></p><div class="sxbtns"><button class="btn sec sxb" type="button"></button><button class="btn sxc" type="button"></button></div><button class="tbtn sxall" type="button"></button><p class="sr sxsay" role="status"></p>';
  nav.querySelector('.sxb').addEventListener('click',()=>flowGo(F.k-1));
  nav.querySelector('.sxc').addEventListener('click',()=>flowGo(F.k+1));
  const all=nav.querySelector('.sxall');
  all.textContent=flowWholeOn?'Show one section at a time':'Show the whole unit';
  all.addEventListener('click',()=>{ flowWhole(!flowWholeOn); const f=document.getElementById(F.pre+F.groups[F.k][0]); if(f) jumpTo(f); });
  if(foot){ foot.insertBefore(nav,foot.firstChild); F.next=[...foot.querySelectorAll(':scope>.row>.btn')].find(b=>!b.classList.contains('sec'))||null; }
  F.nav=nav;
  /* In this unit, grouped by section */
  const d=main.querySelector('details.outline'), ol=d&&d.querySelector('ol.olist');
  if(ol){
    const lists=groups.map((g,k)=>{
      const h=el('p','osh');h.id='osh-'+U.id+'-'+k;
      h.innerHTML=`<span class="osn">Section ${k+1}: ${esc(F.titles[k])}</span><span class="osg"></span>`;
      const o=el('ol','olist');o.setAttribute('role','list');o.setAttribute('aria-labelledby',h.id);
      d.insertBefore(h,ol);d.insertBefore(o,ol);F.osh.push(h);
      return o;
    });
    [...ol.children].forEach(li=>{ const a=li.querySelector('a.oj'); const i=a?+a.dataset.jump.slice(pre.length):0; lists[sxOf[i]||0].appendChild(li); });
    ol.remove();
    d.dataset.ns=n;
  }
  flowApply(flowStart(U,n),{quiet:true});
}
function flowApply(k,o){
  const F=flowCur; if(!F||F.n<2) return;
  o=o||{};
  k=Math.min(Math.max(0,k|0),F.n-1);
  const moved=F.k!==k; F.k=k;
  for(let i=0;i<F.U.blocks.length;i++){ const nd=document.getElementById(F.pre+i); if(nd) nd.classList.toggle('sx-off',F.sxOf[i]!==k); }
  F.pos.querySelector('.sxk').textContent=`Section ${k+1} of ${F.n}:`;
  F.pos.querySelector('.sxt').textContent=F.titles[k];
  F.nav.querySelector('.sxn').textContent=`Section ${k+1} of ${F.n}`;
  const bk=F.nav.querySelector('.sxb'), cn=F.nav.querySelector('.sxc');
  bk.hidden=k===0; if(k>0) bk.innerHTML='<span aria-hidden="true">← </span>Back to: '+esc(F.titles[k-1]);
  cn.hidden=k===F.n-1; if(k<F.n-1) cn.innerHTML='Continue to: '+esc(F.titles[k+1])+'<span aria-hidden="true"> →</span>';
  /* the unit pager waits for the last section ("Continue to" leads until then) */
  const uf=main.querySelector('.ufoot'); if(uf) uf.classList.toggle('sx-more',k<F.n-1);
  F.osh.forEach((h,j)=>{ h.classList.toggle('on',j===k); if(j===k) h.setAttribute('aria-current','step'); else h.removeAttribute('aria-current'); });
  flowMark();
  /* a revealed section's wide tables and terminal excerpts get their scroll role, name, and cue */
  requestAnimationFrame(()=>{ if(flowCur!==F||F.k!==k) return; F.U.blocks.forEach((b,i)=>{ if(F.sxOf[i]!==k) return; const nd=document.getElementById(F.pre+i); if(nd) nd.querySelectorAll('.v-facts,.v-scroll,table.cmds,pre.term').forEach(markScroll); }); });
  if(o.quiet) return;
  flowRaStop();
  flowStateWrite(o.push);
  flowRemember();
  if(moved){ const s=F.nav.querySelector('.sxsay'); s.textContent=''; requestAnimationFrame(()=>{ s.textContent=`Section ${k+1} of ${F.n}: ${F.titles[k]}`; }); }
}
/* Back to and Continue to: the section shows, its first block lands below the bar, and focus moves to its heading */
function flowGo(k){
  const F=flowCur; if(!F||k<0||k>=F.n) return;
  navHold=false;
  flowApply(k,{push:true});
  const f=document.getElementById(F.pre+F.groups[k][0]);
  if(f) jumpTo(f);
}
/* a block in another section (an outline entry, say) opens its section first */
function flowReveal(nd){
  const F=flowCur; if(!F||F.n<2||!nd||nd.dataset.sx==null) return;
  const k=+nd.dataset.sx; if(k!==F.k) flowApply(k,{push:true});
}
/* a Review link inside a quiz that names the open unit opens the lesson before the quiz: the nearest block before
   it that is neither a quiz nor Go further links */
function flowLesson(a){
  const F=flowCur; if(!F||current.page!=='level') return false;
  const q=a.closest('.card.quiz'), top=q&&q.closest('[id^="sec-"]');
  if(!top||top.id.indexOf(F.pre)!==0) return false;
  let j=+top.id.slice(F.pre.length)-1;
  while(j>=0&&/^(quiz|links)$/.test(F.U.blocks[j].t)) j--;
  const t=j>=0&&document.getElementById(F.pre+j); if(!t) return false;
  flowReveal(t); jumpTo(t);
  return true;
}
function flowWhole(on){
  flowWholeOn=!!on; flowLsSet(FLOW_KEY,on?'all':null);
  if(on) document.documentElement.dataset.flow='all'; else delete document.documentElement.dataset.flow;
  main.querySelectorAll('.sxall').forEach(b=>{ b.textContent=on?'Show one section at a time':'Show the whole unit'; });
}
/* each section's segment and outline heading follow its activities */
function flowMark(){
  const F=flowCur; if(!F||F.n<2||!F.pos||!F.pos.isConnected) return;
  const segs=F.pos.querySelectorAll('.sxseg li');
  F.groups.forEach((g,k)=>{
    const ids=g.map(i=>F.U.blocks[i].id).filter(Boolean), done=ids.length>0&&ids.every(isDone);
    const c=(k===F.k?'on':'')+(done?' done':''); if(segs[k]&&segs[k].className!==c) segs[k].className=c;
    const h=F.osh[k], gl=h&&h.querySelector('.osg');
    if(gl){ const t=done?'<span aria-hidden="true">✓</span><span class="sr">, done</span>':''; if(gl.innerHTML!==t) gl.innerHTML=t; }
  });
}
/* a section change by a tap (Back to, Continue to, an outline entry, a Review link) pushes a history entry, so Back
   steps back through the sections; a restore or a redraw replaces the entry */
function flowStateWrite(push){
  const F=flowCur; if(!F||F.n<2) return;
  try{
    const s=history.state;
    if(s&&Array.isArray(s.dlsec)&&s.dlsec[0]===F.U.id&&s.dlsec[1]===F.k&&!s.dlmenu) return;
    const st=Object.assign({},s&&typeof s==='object'?s:null); delete st.dlmenu; st.dlsec=[F.U.id,F.k];
    if(push&&s&&Array.isArray(s.dlsec)&&s.dlsec[0]===F.U.id) history.pushState(st,''); else history.replaceState(st,'');
  }catch(e){}
}
/* Back or Forward to another section of the open unit shows that section */
function flowPop(){
  const F=flowCur; if(!F||F.n<2||current.page!=='level') return;
  let st=null; try{ st=history.state; }catch(e){}
  if(!st||!Array.isArray(st.dlsec)||st.dlsec[0]!==F.U.id) return;
  const k=Math.min(Math.max(0,st.dlsec[1]|0),F.n-1);
  if(k===F.k) return;
  flowApply(k);
  const f=document.getElementById(F.pre+F.groups[k][0]); if(f) jumpTo(f);
}
function flowRemember(){
  const F=flowCur; if(!F||F.n<2) return;
  const id=F.U.id, k=F.k;
  navSave(s=>{ if(((s.sec&&s.sec[id])|0)===k) return false; s.sec=Object.assign({},s.sec); if(k) s.sec[id]=k; else delete s.sec[id]; });
}
/* after each view: the section goes into the history entry, and speech stops */
function flowAfterRender(){
  flowRaStop();
  if(current.page!=='level'||waiting){ flowCur=null; flowResume=null; return; }
  flowStateWrite();
}

/* ---- Terms in this unit: the glossary entries whose "at" names the unit (they fill when the glossary arrives) ---- */
/* the unit's own words (lower case), for ordering its terms by first appearance */
const flowTextCache=new WeakMap();
function flowUnitText(U){
  let t=flowTextCache.get(U); if(t!=null) return t;
  const out=[];
  const walk=x=>{ if(typeof x==='string') out.push(x); else if(Array.isArray(x)) x.forEach(walk); else if(x&&typeof x==='object') Object.keys(x).forEach(k=>{ if(k!=='id'&&k!=='t') walk(x[k]); }); };
  walk([U.title,U.sum,U.blocks]);
  t=plain(out.join(' ')).toLowerCase();
  flowTextCache.set(U,t);
  return t;
}
function flowTermAt(text,term){
  const t=plain(term).toLowerCase(), alts=[t,t.replace(/\s*\(.*\)\s*$/,''),(/\(([^)]+)\)/.exec(t)||[])[1]].filter(x=>x&&x.length>1);
  let best=Infinity; alts.forEach(a=>{ const i=text.indexOf(a); if(i>=0&&i<best) best=i; });
  return best;
}
/* the unit's terms in the order the unit first uses them (then A to Z) */
function flowTermsList(at){
  const [lv,un]=at.split('/'), L=levelById(lv), U=L&&L.units.find(u=>u.id===un);
  const list=GLOSSARY.filter(g=>g.at===at), az=(a,b)=>a.term.localeCompare(b.term,'en',{sensitivity:'base'});
  if(!U) return list.sort(az);
  const text=flowUnitText(U), pos=new Map(list.map(g=>[g,flowTermAt(text,g.term)]));
  return list.sort((a,b)=>(pos.get(a)-pos.get(b))||az(a,b));
}
const TERMS_KEY=KEY+'-terms';
function flowTerms(L,U,uh){
  const at=L.id+'/'+U.id;
  if(LADDER.glossary&&!GLOSSARY.some(g=>g.at===at)) return;
  const d=el('details','uterms');d.dataset.at=at;
  d.innerHTML='<summary>Terms in this unit<span class="tcount"></span></summary><div class="tbody"></div>';
  /* closed by default (phones since 2026-10-24, every screen since concision pass 4), so the lesson starts on the
     first screen and defines each term where it is used; the student's own choice, open or closed, is kept (per device) */
  const tWant=()=>flowLsGet(TERMS_KEY)==='open';
  d.open=tWant();
  d.addEventListener('toggle',()=>{ if(d.open) flowTermsFill(d); if(d.dataset.ready&&d.open!==tWant()) flowLsSet(TERMS_KEY,d.open?'open':'closed'); });
  const s=uh.querySelector('.sum'); if(s) s.after(d); else uh.appendChild(d);
  flowTermsCount(d);
  d.dataset.ready='1';
}
function flowTermsCount(d){
  const c=d.querySelector('.tcount'), body=d.querySelector('.tbody');
  if(!LADDER.glossary){
    c.textContent=' (loading)';
    if(!body.firstChild){ const p=el('p','twait');p.setAttribute('role','status');p.textContent='Loading the terms… They arrive with the glossary.';body.appendChild(p); }
    return;
  }
  const n=flowTermsList(d.dataset.at).length;
  if(!n){ d.remove(); return; }
  c.textContent=` (${n})`;
  if(d.open) flowTermsFill(d);
}
function flowTermsFill(d){
  if(!LADDER.glossary||d.dataset.filled) return;
  const body=d.querySelector('.tbody'); body.innerHTML='';
  const list=flowTermsList(d.dataset.at), FIRST=5;
  const mk=arr=>{ const dl=el('dl','tlist'); arr.forEach(g=>dl.append(el('dt',null,g.term),el('dd',null,g.def))); return dl; };
  body.appendChild(mk(list.slice(0,FIRST)));
  if(list.length>FIRST){ const all=el('details','tall'); all.appendChild(el('summary',null,esc(`All ${list.length} terms`))); all.appendChild(mk(list.slice(FIRST))); body.appendChild(all); }
  const more=el('p','tmore'), a=el('a',null,'Every term, in the Glossary'); a.href='#glossary'; more.appendChild(a);
  body.appendChild(more);
  d.dataset.filled='1';
}
function flowTermsArrived(){ main.querySelectorAll('details.uterms').forEach(flowTermsCount); }

/* ---- COMPARE by row on phones: each attribute with its values from every column (the same data) ---- */
/* COMPARE offers "Compare by row" wherever its columns stack (a phone, or a column too narrow for them side by side;
   the column counts follow the container queries on .v-cmp) */
const CMP_COLS=(n,w)=>n===2?(w>=520?2:1):n===3?(w>=780?3:1):n===4?(w>=780?4:w>=520?2:1):1;
const cmpObs=typeof ResizeObserver==='function'?new ResizeObserver(es=>es.forEach(e=>{
  const fig=e.target, w=e.contentRect.width; if(!w||!fig.flowN) return;
  fig.classList.toggle('cmp-stack',CMP_COLS(fig.flowN,w)<fig.flowN);
})):null;
function flowCmpToggle(w,b){
  if(!b.cols||b.cols.length<2) return;
  const grid=w.querySelector('.v-cmp'); if(!grid) return;
  grid.flowCols=b.cols;
  const fig=grid.parentElement; fig.flowN=b.cols.length;
  const bar=el('div','cmp-tg'), btn=el('button','tbtn cmp-b');btn.type='button';
  btn.textContent=flowCmp==='row'?'View by column':'Compare by row';
  btn.addEventListener('click',()=>{ flowCmpSet(flowCmp==='row'?'col':'row'); try{ btn.focus({preventScroll:true}); }catch(e){} });
  bar.appendChild(btn); grid.before(bar);
  if(flowCmp==='row') flowCmpRows(grid);
  if(cmpObs) cmpObs.observe(fig);
}
function flowCmpRows(grid){
  const nx=grid.nextElementSibling; if(nx&&nx.classList.contains('v-rows')) return;
  const cols=grid.flowCols; if(!cols) return;
  const K=Math.max(0,...cols.map(c=>(c.rows||[]).length));
  let h='';
  for(let i=0;i<K;i++){
    const have=cols.filter(c=>(c.rows||[])[i]); if(!have.length) continue;
    const key=have[0].rows[i][0], same=have.every(c=>plain(c.rows[i][0])===plain(key));
    h+=`<div class="v-row"><p class="v-rowh">${key}</p><dl>`+have.map(c=>`<div class="v-kv" style="${toneCss(c.tone,'l2')}"><dt>${c.name}${same?'':': '+c.rows[i][0]}</dt><dd>${c.rows[i][1]}</dd></div>`).join('')+'</dl></div>';
  }
  const hk=cols.filter(c=>c.hook);
  if(hk.length) h+='<div class="v-row"><p class="v-rowh">Remember it as</p><dl>'+hk.map(c=>`<div class="v-kv" style="${toneCss(c.tone,'l2')}"><dt>${c.name}</dt><dd>${c.hook}</dd></div>`).join('')+'</dl></div>';
  grid.after(el('div','v-rows',h));
}
function flowCmpSet(m){
  flowCmp=m==='row'?'row':'col';
  flowLsSet(CMP_KEY,flowCmp==='row'?'row':null);
  document.documentElement.dataset.cmp=flowCmp;
  if(flowCmp==='row') main.querySelectorAll('.v-cmp').forEach(flowCmpRows);
  main.querySelectorAll('.cmp-b').forEach(b=>{ b.textContent=flowCmp==='row'?'View by column':'Compare by row'; });
}

/* ---- reflections: where the text is kept, and who can see it ---- */
function flowSess(){ try{ const v=JSON.parse(flowSsGet(SESS_REFLECT)||'{}'); return v&&typeof v==='object'&&!Array.isArray(v)?v:{}; }catch(e){ return {}; } }
function flowSessClear(){ flowSsSet(SESS_REFLECT,null); }
function flowReflectText(id){
  if(flowShared){ const s=flowSess(); if(typeof s[id]==='string') return s[id]; }
  const v=store.get(id); return v&&typeof v.text==='string'?v.text:'';
}

/* ---- shared computers: Shared computer mode, Finish on this computer, and the new-visit banner ---- */
function flowSharedSet(on){
  store.load();
  const s=flowSess(), ch={};
  if(on){
    /* reflections already saved here move into this tab (completion stays) */
    Object.keys(MEM).forEach(id=>{ const v=MEM[id]; if(v&&typeof v==='object'&&typeof v.text==='string'&&id!==NAV){ if(typeof s[id]!=='string') s[id]=v.text; ch[id]=Object.assign({},v); delete ch[id].text; } });
    if(!flowSsSet(SESS_REFLECT,JSON.stringify(s))) return false;

    /* this tab's reflections move back into the browser's progress */
    Object.keys(s).forEach(id=>{ if(typeof s[id]!=='string') return; const v=store.get(id); ch[id]=Object.assign({},v&&typeof v==='object'?v:null,{text:s[id],done:!!(v&&v.done)||s[id].trim().length>0}); });

/* Start fresh and Finish on this computer run in a modal dialog: the progress code with Copy first, then Clear (a
   second tap confirms) or Keep everything; Escape keeps everything, and focus returns to the button that opened it.
   Where <dialog> is missing, the same steps show in place (host), as before. after(result) runs on close. */
function flowFinish(title,opener,host,after){
  const d=el('dialog','fdlg');
  if(typeof d.showModal!=='function'){
    opener.hidden=true;
    flowFinishPanel(host,res=>{ if(res==='kept'){ host.hidden=true; host.innerHTML=''; opener.hidden=false; try{ opener.focus(); }catch(e){} } if(after) after(res); });
    return;
  }
  const h=el('h2',null,esc(title)); h.id='fdlgT'; d.setAttribute('aria-labelledby',h.id);
  const body=el('div','fin');
  d.append(h,body); document.body.appendChild(d);
  let res='kept', ended=false;
  /* the end runs once, right away for Keep everything and OK (the close event itself comes a task later) */
  const end=()=>{
    if(ended) return; ended=true;
    if(d.open) d.close();
    d.remove();
    const back=opener&&opener.isConnected&&!opener.hidden?opener:(current.page==='level'&&main.querySelector('.uhead h2'))||main;
    try{ back.focus({preventScroll:true}); }catch(e){}
    if(after) after(res);
  };
  d.addEventListener('close',end);
  d.showModal();
  flowFinishPanel(body,r=>{
    if(r==='kept'){ end(); return; }
    res='cleared';
    body.innerHTML='';
    const p=el('p','fin-s fin-done');p.setAttribute('role','status');body.appendChild(p);
    flowSay(p,'This browser is clear and ready for you.');
    const r2=el('div','row'), ok=el('button','btn sm','OK');ok.type='button';r2.appendChild(ok);body.appendChild(r2);
    ok.addEventListener('click',end);

  });
}

/* ---- Read aloud: each top-level card, where speechSynthesis exists (a local voice when one is installed) ---- */
const flowSpeech=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance==='function'?speechSynthesis:null;
let flowRaBtn=null;
/* a card's name for its Read aloud button: its heading, without the thinking-level badge */
function flowRaTitle(nd){ const h=nd.querySelector(':scope>h3,:scope>h4'); if(!h) return ''; const k=h.cloneNode(true); k.querySelectorAll('.blm,.imp,.sr').forEach(x=>x.remove()); return k.textContent.replace(/\s+/g,' ').trim(); }
function flowRaName(b,stop){ b.textContent=stop?'Stop reading':'Read aloud'; if(b.dataset.t) b.setAttribute('aria-label',(stop?'Stop reading: ':'Read aloud: ')+b.dataset.t); }
function flowRaAdd(nd){
  if(!flowSpeech||!nd.classList||!nd.classList.contains('card')||nd.querySelector(':scope>.ra-row')) return;
  const r=el('div','ra-row'), b=el('button','tbtn ra','Read aloud');b.type='button';
  b.dataset.t=flowRaTitle(nd); flowRaName(b,false);

}
function flowRaStop(){
  if(!flowSpeech) return;
  const b=flowRaBtn; flowRaBtn=null;
  try{ flowSpeech.cancel(); }catch(e){}
  if(b) flowRaName(b,false);
}
function flowRaVoice(){
  let vs=[]; try{ vs=flowSpeech.getVoices()||[]; }catch(e){}
  const lang=(document.documentElement.lang||'en').slice(0,2).toLowerCase();
  return vs.find(v=>v.localService&&String(v.lang).slice(0,2).toLowerCase()===lang)||vs.find(v=>v.localService)||null;
}
/* what Read aloud says: a copy of the card without its buttons (a drill's own lines, items, and steps stay), badges,
   hidden or screen-reader-only text, and the inside of closed panels. Each list item, option, line, and block is its
   own part, and a part splits into sentences only after ".", "!", or "?" and a space (so 192.168.1.1 stays whole). */
const RA_BLOCK=/^(P|DIV|LI|UL|OL|DL|DT|DD|TR|TD|TH|TABLE|THEAD|TBODY|H[1-6]|PRE|FIGURE|FIGCAPTION|DETAILS|SUMMARY|LABEL|BLOCKQUOTE|SECTION|BUTTON)$/;
function flowRaParts(card){
  const k=card.cloneNode(true);
  k.querySelectorAll('details:not([open])').forEach(d=>[...d.children].forEach(x=>{ if(x.tagName!=='SUMMARY') x.remove(); }));
  k.querySelectorAll('.blm,.imp,.ra-row,[hidden],[aria-hidden="true"],.sr,.sl-tag,.msel,.scroll-cue,svg,input,textarea,select,script,style').forEach(x=>x.remove());
  k.querySelectorAll('button').forEach(x=>{ if(!x.matches('.sl,.mi,.oi')) x.remove(); });
  const parts=[]; let buf='';
  /* a lone item number ("1.") stays with the sentence after it */
  const flush=()=>{ const t=buf.replace(/\s+/g,' ').trim(); buf=''; let lead=''; if(t) t.replace(/([.!?])\s+/g,'$1\u0001').split('\u0001').forEach(s=>{ s=s.trim(); if(!s) return; if(/^\d+[.)]$/.test(s)){ lead+=s+' '; return; } parts.push(lead+s); lead=''; }); if(lead) parts.push(lead.trim()); };
  const walk=n=>{
    if(n.nodeType===3){ buf+=n.nodeValue; return; }
    if(n.nodeType!==1) return;
    if(n.tagName==='BR'){ buf+=' '; return; }
    const blk=RA_BLOCK.test(n.tagName)||n.classList.contains('opt')||n.classList.contains('sl-t')||n.classList.contains('tln');
    if(blk) flush();
    n.childNodes.forEach(walk);
    if(blk) flush();
  };
  walk(k);
  return parts;
}
function flowRaToggle(card,b){
  if(flowRaBtn===b){ flowRaStop(); return; }
  flowRaStop();
  const parts=flowRaParts(card);
  if(!parts.length) return;
  const v=flowRaVoice();
  flowRaBtn=b; flowRaName(b,true);
  parts.forEach((s,i)=>{
    const u=new SpeechSynthesisUtterance(s);
    if(v){ u.voice=v; u.lang=v.lang; }
    u.addEventListener('error',()=>{ if(flowRaBtn===b) flowRaStop(); });
    if(i===parts.length-1) u.addEventListener('end',()=>{ if(flowRaBtn===b){ flowRaBtn=null; flowRaName(b,false); } });
    try{ flowSpeech.speak(u); }catch(e){}
  });
}

/* ---- boot: device preferences, the storage check, the dock before #main, and the new-visit banner ---- */
const SEEN_AT=KEY+'-seen', VISIT_GAP=30*60*1000;
let flowBannerDue=false, flowActed=false, lastInput='none';

function quietFocus(n){ if(!n||lastInput==='key') return; n.classList.add('qfocus'); n.addEventListener('blur',()=>n.classList.remove('qfocus'),{once:true}); }

/* when this browser last showed the course: a new tab counts as a new visit 30 minutes or more after it */
function flowSeen(){ flowLsSet(SEEN_AT,String(Date.now())); }
/* a line's text for a spot drill: in a URL, hyphens stay joined (U+2011) and the line may break after "/" and "." */
const SPOT_PROMPT=/^\s*(?:PS[^>]*>|\$|[A-Za-z]:\\[^>]*>|[A-Za-z][\w.-]*(?:\([\w-]+\))?[#>]|[\w.-]+@[\w.-]+:[^\s$#]*[$#])\s/;
function spotText(t){ return esc(t).replace(/(?:https?:\/\/|www\.)[^\s<]+/g,u=>u.replace(/-/g,'‑').replace(/([\/.])/g,'$1<wbr>')); }
function flowBoot(){
  const de=document.documentElement;
  flowCmp=flowLsGet(CMP_KEY)==='row'?'row':'col'; de.dataset.cmp=flowCmp;
  flowWholeOn=flowLsGet(FLOW_KEY)==='all'; if(flowWholeOn) de.dataset.flow='all';

     progress offers Keep my progress or Start fresh; the first view decides (the Continue card offers Start fresh) */
  const fresh=!flowSsGet(SESS_SEEN); flowSsSet(SESS_SEEN,'1');
  const last=+flowLsGet(SEEN_AT)||0;
  flowBannerDue=fresh&&Date.now()-last>=VISIT_GAP&&Object.keys(MEM).some(k=>k!==NAV&&MEM[k]!=null);
  flowSeen();
  addEventListener('pagehide',()=>{ flowRaStop(); flowSeen(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flowSeen(); });
  const act=e=>{ flowActed=true; lastInput=e.type==='keydown'?'key':'pointer'; };
  document.addEventListener('keydown',act,true);
  document.addEventListener('pointerdown',act,true);
}

/* ---- glossary (the Glossary rail page) ----

LADDER.addGlossary([
  {term:'3-2-1 rule',def:'Three copies of your data, on two kinds of storage, with one copy off site.',at:'freshman/f4'},
  {term:'802.1Q tag',def:'A 4-byte field in a frame on a trunk whose 12-bit VLAN ID names the frame’s VLAN.',at:'freshman/f7'},
  {term:'802.1X',def:'Port-based network access control: a device proves itself through EAP before the switch port or SSID lets it on.',at:'junior/j6'},
  {term:'AAA',def:'Authentication, authorization, and accounting: proving who you are, deciding what you may do, and recording what you did.',at:'freshman/f3'},
  {term:'ABAC (attribute-based access control)',def:'Rules decide access from attributes of the user, the resource, and the request, such as network, time, or tag.',at:'junior/j10'},
  {term:'Absolute path',def:'A path that starts at / and works from any folder, such as /etc/ssh. A relative path starts from the folder you are in.',at:'freshman/f6'},
  {term:'Access log',def:'A web server’s record of every request, one line each: client, time, request, status, size, referrer, and agent.',at:'junior/j9'},
  {term:'Access port',def:'A switch port in one VLAN that passes untagged frames to one end device.',at:'freshman/f7'},
  {term:'Access token',def:'What Windows builds at sign-in: the user’s SID, group SIDs, privileges, and integrity level. Each process carries a copy.',at:'junior/j8'},
  {term:'access-class',def:'The line command that filters which source addresses may open a session to the device itself.',at:'junior/j4'},
  {term:'ACL (access control list)',def:'A list of allow and deny entries that decides who can do what to a file, folder, share, or registry key; on a router, the permit and deny lines that filter packets.',at:'freshman/f5'},
  {term:'ACL (network)',def:'On a router, switch, or cloud subnet: an ordered list of permit and deny lines for packets, read top down; the first match wins, and an implicit deny ends the list.',at:'junior/j4'},
  {term:'Active Directory (AD)',def:'The Windows Server directory that stores a domain’s users, groups, and computers in one place.',at:'sophomore/s2'},
  {term:'Active reconnaissance',def:'Probing a target’s systems directly, such as port scans or guessed paths, which shows up in its logs.',at:'junior/j11'},
  {term:'adm group',def:'The Debian-family group that reads system logs under /var/log, without root power.',at:'sophomore/s3'},
  {term:'Administrative distance (AD)',def:'A trust rank that picks between route sources for the same prefix: connected 0, static 1, and OSPF 110.',at:'junior/j4'},
  {term:'Advanced audit policy',def:'About 60 audit subcategories under Advanced Audit Policy Configuration, finer than the nine basic categories.',at:'junior/j2'},

  {term:'AIDE',def:'A Linux file integrity checker that compares every watched file with a database of hashes built on a clean day.',at:'junior/j3'},
  {term:'Air gap',def:'A system without any network link, so data moves only by hand.',at:'freshman/f4'},
  {term:'Alert',def:'A notice raised when a rule decides that some events need a person’s look.',at:'sophomore/s10'},
  {term:'Alert fatigue',def:'Worn-down attention after too many false positives, when analysts start skimming or ignoring alerts.',at:'senior/se13'},
  {term:'Alias (PowerShell)',def:'A short name for a cmdlet, such as del for Remove-Item or sc for Set-Content in Windows PowerShell 5.1; Get-Alias shows what each one runs.',at:'freshman/f5'},
  {term:'Alternate data stream (ADS)',def:'A hidden second stream of data attached to a file on an NTFS drive; Windows keeps the Mark of the Web in one called Zone.Identifier.',at:'sophomore/s2'},
  {term:'AMSI (Antimalware Scan Interface)',def:'Hands scripts and commands to the antivirus after they are decoded, just before they run.',at:'junior/j2'},
  {term:'Anti-CSRF token',def:'A secret value a site places in its own forms and checks on every change request; other sites cannot read it.',at:'junior/j9'},
  {term:'Anti-malware',def:'The layers that work with the virus scanner, such as download reputation, unwanted-app blocking, real-time scanning, and controlled folder access.',at:'freshman/f13'},
  {term:'Antivirus',def:'Software that checks files and programs against detection signatures and suspicious actions, then blocks, quarantines, or reports them.',at:'freshman/f13'},
  {term:'API (application programming interface)',def:'A set of addresses a program calls to get or change data, usually over HTTP with JSON.',at:'senior/se10'},
  {term:'APIPA',def:'A self-assigned 169.254.x.x address that a Windows host takes when its DHCP request goes unanswered.',at:'freshman/f4'},
  {term:'App Control for Business',def:'Windows’ kernel-enforced application control (formerly WDAC): code runs only when the policy trusts its publisher, path, hash, or installer.',at:'senior/se8'},
  {term:'AppArmor',def:'The mandatory access control on Ubuntu, Mint, and Debian that confines each profiled program to the files it needs, even when it runs as root.',at:'junior/j3'},
  {term:'Application control',def:'Letting only approved programs run, by publisher, path, or hash: App Control for Business and AppLocker.',at:'junior/j8'},
  {term:'AppLocker',def:'The older Windows application control, with rules per user or group; it still works, while new features go to App Control.',at:'senior/se8'},
  {term:'Approval gate',def:'A step in an automated playbook that waits for a person before a disruptive action, such as isolating a server.',at:'senior/se13'},
  {term:'apt',def:'The package manager on Debian, Ubuntu, and Mint that installs, updates, and removes .deb packages.',at:'freshman/f6'},
  {term:'APT (advanced persistent threat)',def:'A skilled, well-funded team, often state-backed, that targets chosen organizations and stays hidden for months.',at:'freshman/f8'},
  {term:'Argument',def:'A value you type after a command or script name, such as brief.txt in ./audit_users.sh brief.txt. A Bash script reads the first one as $1.',at:'sophomore/s11'},
  {term:'ARP',def:'The protocol that finds the MAC address for an IPv4 address on the local network.',at:'freshman/f7'},
  {term:'ARP spoofing',def:'Forged ARP replies that claim another host’s IP address, often the gateway’s, to put the sender on-path.',at:'junior/j7'},
  {term:'AS-REP roasting',def:'Cracking offline the reply a domain controller sends for an account set to skip Kerberos pre-authentication.',at:'senior/se7'},
  {term:'ASLR (address space layout randomization)',def:'An OS guard that loads code and data at shuffled addresses, so an intruder cannot predict where they sit.',at:'senior/se2'},
  {term:'ASR rules (attack surface reduction)',def:'Defender rules that block risky behavior, such as Office starting child processes, in Audit, Block, or Warn mode.',at:'junior/j8'},
  {term:'at job',def:'A command queued to run once at a set time, listed with atq.',at:'junior/j3'},
  {term:'Attack surface',def:'Every account, service, port, and program an attacker could reach on a system.',at:'freshman/f1'},
  {term:'Audit mode',def:'A policy state that logs what a rule would block while blocking nothing, used to tune rules before enforcing them.',at:'senior/se8'},
  {term:'Audit policy',def:'The Windows settings that decide which Success and Failure events go to the Security log.',at:'sophomore/s2'},
  {term:'Audit user ID (auid)',def:'The ID of the person who signed in, which auditd keeps on every process that person starts, even after su or sudo. Services have it unset, and cron jobs carry their owner’s ID.',at:'senior/se9'},
  {term:'auditd',def:'The Linux audit daemon that records the security events its rules ask for.',at:'junior/j3'},
  {term:'Auditor',def:'An independent checker who tests controls against a standard and reports gaps; external auditors work for an outside firm.',at:'senior/se12'},
  {term:'auth.log',def:'The Ubuntu and Mint log file for sign-ins, sudo, and SSH. Debian 12 and later keep the same lines in the systemd journal (<code>journalctl -u ssh</code>).',at:'sophomore/s10'},
  {term:'Authentication-Results',def:'The header your own mail server adds with its SPF, DKIM, and DMARC verdicts.',at:'sophomore/s9'},
  {term:'Authorization',def:'Permission from a system’s owner, ideally in writing, to access or change it; inside a computer, the rights an account holds.',at:'freshman/f1'},
  {term:'authorized_keys',def:'The per-user file of SSH public keys that may sign in without that user’s password.',at:'sophomore/s3'},
  {term:'AutoPlay',def:'The Windows prompt that offers to open a drive or disc when it connects; turning it off removes one easy click for a planted USB stick.',at:'sophomore/s2'},
  {term:'Autostate',def:'The rule that keeps an SVI down until its VLAN exists and a port carrying it is up.',at:'sophomore/s5'},
  {term:'Availability check',def:'A lab test that confirms a required service or authorized account still works after your changes.',at:'freshman/f1'},
  {term:'Backdoor',def:'A hidden way back into a system, such as a netcat listener, an extra SSH key, or a rogue user.',at:'freshman/f3'},
  {term:'Backup',def:'An independent copy on separate media that survives the loss of the original and earns trust after a test restore.',at:'freshman/f4'},
  {term:'Base system (FreeBSD)',def:'The kernel and core userland the FreeBSD project maintains, patched with freebsd-update (or pkg on a pkgbase install).',at:'senior/se1'},
  {term:'Baseline',def:'A record of how a system looks before you change it: its users, services, ports, software, and settings.',at:'freshman/f1'},
  {term:'Beaconing',def:'Small, regular check-ins from an infected host to its controller; it shows as evenly spaced flows.',at:'junior/j7'},
  {term:'Bearer token',def:'A token sent in the Authorization header; whoever holds it acts as its owner until it expires.',at:'senior/se10'},
  {term:'Behavior detection',def:'Detection that flags actions departing from normal: it catches new tricks and raises more false alarms.',at:'freshman/f13'},
  {term:'BitLocker',def:'Windows drive encryption that keeps a lost or stolen drive unreadable; the TPM unlocks it at startup, and a 48-digit recovery key opens it when the boot chain changes.',at:'freshman/f5'},
  {term:'BitLocker To Go',def:'BitLocker for removable drives, so a USB stick that leaves the building stays unreadable without its password or recovery key.',at:'sophomore/s2'},
  {term:'Block Public Access',def:'An S3 setting, for one bucket or a whole account, that overrides any policy or ACL that would make storage public.',at:'junior/j10'},
  {term:'blocklistd',def:'The FreeBSD daemon that blocks an address in pf after repeated failed logins (blacklistd before FreeBSD 15).',at:'senior/se1'},
  {term:'Blue team',def:'The defenders who harden systems, watch alerts, and respond to incidents.',at:'freshman/f13'},
  {term:'BOLA (broken object-level authorization)',def:'An API that returns any object whose id a caller asks for without checking ownership: the IDOR of APIs.',at:'senior/se10'},
  {term:'BPDU',def:'The message switches exchange to run spanning tree.',at:'freshman/f7'},
  {term:'BPDU guard',def:'A setting that err-disables an edge port the moment a BPDU arrives.',at:'freshman/f7'},
  {term:'Broadcast address',def:'The last address of a subnet, with every host bit set to 1.',at:'sophomore/s5'},
  {term:'Broadcast domain',def:'The set of devices that receive one another’s broadcasts; each VLAN is one.',at:'freshman/f7'},
  {term:'Broken access control',def:'The server lets a user reach data or actions beyond their rights, often because it checks sign-in but not ownership.',at:'junior/j9'},
  {term:'Bucket policy',def:'A resource policy attached to a storage bucket that names who may do what with its objects.',at:'junior/j10'},
  {term:'Buffer overflow',def:'Data written past the end of a fixed-size space in memory, overwriting what sits beside it; it crashes a program or lets an intruder steer it.',at:'senior/se2'},
  {term:'Bug bounty',def:'A program in which an organization invites testing under written rules and rewards valid reports; its rules are the authorization.',at:'senior/se5'},
  {term:'Built program',def:'Machine code made from source ahead of time, as with C and Go; also called a compiled program or a binary. Check its hash and signature, since its source stays behind.',at:'freshman/f12'},
  {term:'Business email compromise (BEC)',def:'A taken-over or imitated mailbox used to redirect payments or payroll.',at:'freshman/f8'},
  {term:'Carrier-grade NAT (CGNAT)',def:'A provider’s NAT in 100.64.0.0/10 that lets many customers share one public address.',at:'freshman/f9'},
  {term:'CDP',def:'Cisco Discovery Protocol, which announces a device’s model, IOS version, and addresses to its neighbors.',at:'sophomore/s5'},
  {term:'Certificate',def:'A signed record that binds a public key to a name; browsers accept it when the name matches the address, the dates are current, and the chain reaches a trusted root.',at:'freshman/f10'},
  {term:'Certificate authority (CA)',def:'An issuer that signs certificates to vouch that a key belongs to a name.',at:'freshman/f10'},
  {term:'cgroup',def:'A Linux kernel group that limits and counts the CPU, memory, and other resources its processes use.',at:'senior/se9'},
  {term:'chage',def:'The command that views or sets password aging for an existing Linux account.',at:'sophomore/s3'},
  {term:'Chain of custody',def:'The record of everyone who held an item of evidence: when, why, and its seal number and hash at each handoff.',at:'junior/j13'},
  {term:'Change log',def:'One line per change: the time, the machine, what changed, and how to undo it.',at:'freshman/f1'},
  {term:'Channel binding',def:'Ties a sign-in to the TLS session it travels in, so a sign-in relayed through another connection fails.',at:'junior/j1'},
  {term:'Checksum (hash)',def:'A fixed-length fingerprint of a file that changes when any byte of the file changes.',at:'freshman/f4'},
  {term:'chroot',def:'Changing what one process sees as the root folder (/). It narrows the view only: root inside a chroot can leave it.',at:'senior/se9'},
  {term:'CIA triad',def:'The three goals of security: confidentiality, integrity, and availability.',at:'freshman/f3'},
  {term:'CIPA',def:'The US law that requires internet filtering and a safety policy at schools and libraries taking E-rate discounts.',at:'senior/se12'},
  {term:'Cipher suite',def:'The set of methods one TLS connection uses for key exchange, encryption, and integrity checks.',at:'sophomore/s8'},
  {term:'ClamAV',def:'A free antivirus scanner for Linux (clamscan) that matches files against known-malware signatures.',at:'junior/j3'},
  {term:'Classful network',def:'An address block sized by its first octet: class A /8, class B /16, or class C /24.',at:'senior/se6'},
  {term:'Cmdlet',def:'A PowerShell command named Verb-Noun, such as Get-LocalUser.',at:'freshman/f5'},
  {term:'Command and control (C2)',def:'The channel that malware uses to check in with an attacker’s server and receive orders.',at:'freshman/f8'},
  {term:'Command injection',def:'Untrusted input starts extra operating-system commands because the app passed it to a shell.',at:'junior/j9'},
  {term:'Command option',def:'A switch that changes how a command works: one dash and a letter (-l) or two dashes and a word (--ignore-case).',at:'freshman/f6'},
  {term:'Command Prompt',def:'cmd.exe, the older Windows command line. Its commands (dir, del) and tools (sc.exe, netsh, and reg) take their own option styles, such as /s or start= disabled, in place of PowerShell parameters.',at:'freshman/f5'},
  {term:'Compensating control',def:'A substitute control that covers the same risk when the ideal control cannot run, recorded as such.',at:'senior/se12'},
  {term:'Complain mode',def:'An AppArmor mode that logs what a profile would block (apparmor="ALLOWED") and blocks nothing; enforce mode blocks.',at:'senior/se9'},
  {term:'Compliance',def:'Meeting the laws, standards, and contracts that apply to an organization, and proving it with evidence.',at:'senior/se12'},
  {term:'Condition',def:'Code that tests whether something is true and runs its lines only when it is.',at:'freshman/f12'},
  {term:'Conditional Access',def:'Microsoft Entra ID rules that allow, block, or demand more proof based on the user, device, location, and app.',at:'junior/j10'},
  {term:'Confidence (alert)',def:'How likely an alert is to be real, judged from the rule’s track record and the evidence behind it.',at:'junior/j12'},
  {term:'Configuration drift',def:'A difference between what the code describes and what actually runs, usually from a change made by hand.',at:'senior/se10'},
  {term:'Configuration register',def:'A router setting, shown by show version, that decides how it boots: 0x2102 loads the saved startup-config, and 0x2142 skips it for password recovery.',at:'sophomore/s5'},
  {term:'Consent phishing',def:'A fake app asks you to grant it access to your mail or files, then uses that access without needing your password.',at:'junior/j10'},
  {term:'Constrained Language Mode',def:'A PowerShell mode that blocks .NET calls, Add-Type, and COM objects; application control enforces it.',at:'junior/j2'},
  {term:'Container',def:'An app packed with its own files and network that shares the host’s kernel: lighter than a VM, with a thinner wall.',at:'freshman/f4'},
  {term:'Containment',def:'The response phase that stops the spread, such as isolating a host, disabling an account, or blocking an address.',at:'freshman/f13'},
  {term:'Control flag (PAM)',def:'The second field of a PAM line (required, requisite, sufficient, or optional) that sets what a module’s pass or fail means.',at:'sophomore/s3'},
  {term:'Controlled folder access',def:'A Defender feature that lets only trusted programs change protected folders such as Documents, which blunts ransomware.',at:'senior/se8'},
  {term:'COPPA',def:'The US law that requires verifiable parental consent before sites and apps collect personal information from children under 13.',at:'senior/se12'},
  {term:'Crafted packet',def:'A packet built by hand with flags a normal stack never sends, such as SYN+FIN, null, or Xmas; the edge drops it.',at:'junior/j7'},
  {term:'Credential Guard',def:'Keeps NTLM hashes and Kerberos TGTs in an isolated process, walled off by virtualization, that even SYSTEM cannot read.',at:'senior/se7'},
  {term:'Credential stuffing',def:'Trying email and password pairs leaked from one site on many other sites.',at:'freshman/f2'},
  {term:'Cron',def:'The scheduler that runs commands on a minute, hour, day, month, and weekday pattern.',at:'junior/j3'},
  {term:'CSP (Content-Security-Policy)',def:'A response header that lists where a page may load scripts and other content from.',at:'sophomore/s8'},
  {term:'CSRF (cross-site request forgery)',def:'Another site makes your browser send a request to a site you are signed in to, with your cookie attached.',at:'junior/j9'},
  {term:'CSV',def:'Comma-separated values: a table in plain text, with one record per line.',at:'freshman/f12'},
  {term:'curl',def:'A command-line tool that sends one web request and prints the answer; <code>curl -sI</code> shows only the response headers.',at:'sophomore/s8'},
  {term:'CVE',def:'A public identifier for one known vulnerability, used to say which flaw a patch closes.',at:'sophomore/s1'},
  {term:'CVSS (Common Vulnerability Scoring System)',def:'A 0 to 10 severity score for a flaw; version 4.0 is current.',at:'junior/j5'},
  {term:'DAC (discretionary access control)',def:'Each object’s owner decides who may use it, as with file permissions.',at:'junior/j10'},
  {term:'Data classification',def:'Labeling data (public, internal, confidential, or restricted) so people and tools know how to handle it.',at:'senior/se12'},
  {term:'Data events',def:'Audit-log entries for reads and writes of individual objects, such as each download; often off unless someone turns them on.',at:'junior/j10'},
  {term:'Data minimization',def:'Collecting only the personal data a job needs, keeping it only as long as needed, and sharing it only with those who need it.',at:'freshman/f2'},
  {term:'DCSync',def:'Using directory replication rights to copy password hashes from a DC; 4662 events from an account that is not a DC reveal it.',at:'senior/se7'},
  {term:'Deauthentication flood',def:'Forged Wi-Fi disconnect frames that knock clients off, often to push them toward an evil twin.',at:'junior/j6'},
  {term:'debsums',def:'A Debian tool that checks installed package files against the hashes their packages shipped.',at:'junior/j3'},
  {term:'Default Domain Policy',def:'The GPO linked at the domain that carries password and lockout policy for every domain account.',at:'sophomore/s2'},
  {term:'Default gateway',def:'The router a host sends traffic to when the destination sits on another network.',at:'freshman/f4'},
  {term:'Default route',def:'The 0.0.0.0/0 route that catches every destination missing from the routing table.',at:'junior/j4'},
  {term:'Defender exclusion',def:'A path, process, or file type that Microsoft Defender skips during scans.',at:'senior/se7'},
  {term:'Defense in depth',def:'Layered, separate controls, so another layer still protects when one fails.',at:'freshman/f3'},
  {term:'Deny by default',def:'Blocking everything, then allowing only what is needed; a failed check blocks.',at:'freshman/f3'},
  {term:'Detection coverage',def:'Which attacker techniques your logs and tested rules can catch, checked technique by technique, often against ATT&CK.',at:'senior/se13'},
  {term:'Detection rule',def:'A saved search that names the logs to read, what to match, how many matches count, and what to do when it fires.',at:'senior/se13'},
  {term:'Detection signature',def:'A known-bad pattern, such as a malware file’s hash or a telltale string, that a detection tool matches. A digital signature is a different idea: it proves who signed a file.',at:'freshman/f13'},
  {term:'DHCP',def:'The service that hands hosts an address, mask, gateway, and DNS server automatically.',at:'freshman/f4'},
  {term:'DHCP relay',def:'A gateway setting (ip helper-address) that forwards DHCP broadcasts to a server on another subnet.',at:'junior/j4'},
  {term:'DHCP snooping',def:'A switch feature that lets DHCP server replies in only on trusted ports.',at:'junior/j4'},
  {term:'Diamond model',def:'A way to describe one intrusion event by four linked corners: adversary, capability, infrastructure, and victim.',at:'junior/j11'},
  {term:'Diff',def:'The exact lines that changed between two versions of a file: minus lines removed, plus lines added.',at:'senior/se10'},
  {term:'Digital forensics',def:'Collecting and analyzing digital evidence to show what happened, when, and by whose account, in a form that holds up to review.',at:'junior/j13'},
  {term:'Digital signature',def:'A hash signed with a private key, proving who signed and that nothing changed since.',at:'freshman/f10'},
  {term:'Directory listing',def:'A web server feature that shows every file in a folder to any visitor when the folder has no index page.',at:'junior/j1'},
  {term:'Display manager',def:'The login-screen program (GDM on Ubuntu, LightDM on Mint) that also holds the automatic-login and guest-session settings.',at:'sophomore/s3'},
  {term:'Display name',def:'The free-text name shown beside an email address; the sender types whatever it likes.',at:'sophomore/s9'},
  {term:'Distinguished name (DN)',def:'The full path that names one directory object, read right to left: CN=PC-07,OU=Workstations,DC=example,DC=com.',at:'junior/j1'},
  {term:'Distribution',def:'A Linux kernel bundled with tools, a package manager, and a desktop, such as Debian, Ubuntu, or Linux Mint.',at:'freshman/f6'},
  {term:'DKIM (DomainKeys Identified Mail)',def:'A signature on an email, checked with the public key that the signing (d=) domain publishes in DNS.',at:'sophomore/s9'},
  {term:'DLP (data loss prevention)',def:'Tools and rules that spot sensitive data leaving by email, USB, upload, or print, then warn, block, or log.',at:'senior/se12'},
  {term:'DMARC',def:'A DNS policy that checks whether SPF or DKIM passed for the domain in the visible From, and tells receiving servers to report, quarantine, or reject mail that fails.',at:'sophomore/s9'},
  {term:'DMZ',def:'A separate network for servers the internet must reach, so a compromise there still faces a firewall before the inside.',at:'junior/j6'},
  {term:'DMZ host',def:'A home-router setting that sends every unsolicited inbound connection to one inside device. Keep it off.',at:'sophomore/s7'},
  {term:'DNS',def:'The service that turns names into IP addresses.',at:'freshman/f4'},
  {term:'DNS cache poisoning',def:'Planting a false answer in a resolver’s cache, so a correct name leads to the wrong address.',at:'junior/j7'},
  {term:'DNS record',def:'One fact stored in DNS, by type: A and AAAA (addresses), CNAME (alias), MX (mail), NS (name servers), TXT (policies), and PTR (address to name).',at:'sophomore/s7'},
  {term:'DNS resolver',def:'The recursive DNS server that asks the root, top-level domain, and authoritative servers for you and caches each answer for its TTL.',at:'freshman/f9'},
  {term:'DNS sinkhole',def:'A resolver setting that answers known-bad domains with an address the defenders control, exposing infected hosts.',at:'senior/se11'},
  {term:'DnsAdmins',def:'An AD group whose members can load code into the DNS service, which makes it an admin group by another road.',at:'sophomore/s2'},
  {term:'DNSSEC',def:'Signatures on DNS records that let a validating resolver prove an answer is the zone owner’s, unchanged.',at:'senior/se11'},
  {term:'doas',def:'A small alternative to sudo whose rules live in /usr/local/etc/doas.conf on FreeBSD.',at:'senior/se1'},
  {term:'Dockerfile',def:'The recipe for a container image: base image, packages, files, settings, user, and port.',at:'junior/j10'},
  {term:'Domain account',def:'An account stored in Active Directory that can sign in to any computer in the domain.',at:'freshman/f5'},
  {term:'Domain controller (DC)',def:'A Windows Server that holds Active Directory and checks domain sign-ins.',at:'sophomore/s2'},
  {term:'DoS and DDoS',def:'Denial of service: a flood or crash that takes a service down. A DDoS comes from many hijacked devices at once, so blocking one address fails.',at:'freshman/f9'},
  {term:'Double tagging',def:'A VLAN-hopping trick that works when the attacker’s access VLAN equals the trunk’s native VLAN.',at:'junior/j4'},
  {term:'Drive-by download',def:'Malware pushed onto a computer just by visiting a page, usually through an outdated browser or a bad ad.',at:'freshman/f8'},
  {term:'Drop-in directory',def:'A folder such as sudoers.d or sshd_config.d whose files add to, or override, a main configuration file.',at:'junior/j3'},
  {term:'DSRM administrator',def:'The one local account on a domain controller, kept to repair Active Directory.',at:'junior/j1'},
  {term:'DTP',def:'Dynamic Trunking Protocol, which lets a switch port negotiate becoming a trunk.',at:'junior/j4'},
  {term:'Duplex mismatch',def:'One end of a link sending and receiving at once (full duplex) while the other takes turns (half): the link stays up but slow, with collisions and CRC errors.',at:'sophomore/s5'},
  {term:'DWORD',def:'A 32-bit number stored as a registry value, the type most security switches use.',at:'freshman/f5'},
  {term:'Dynamic analysis',def:'Running a suspicious file in a disposable, isolated sandbox and recording what it does.',at:'junior/j13'},
  {term:'Dynamic ARP inspection',def:'A switch feature that checks ARP packets on untrusted ports against the DHCP snooping table to stop ARP poisoning.',at:'junior/j4'},
  {term:'EAP-TLS',def:'An 802.1X method in which each device signs in with its own certificate and private key.',at:'junior/j6'},
  {term:'Edition (Windows)',def:'One Windows core packaged with a different set of features: Home, Pro, Enterprise, Education, or Server.',at:'freshman/f5'},
  {term:'EDR (endpoint detection and response)',def:'A tool that records processes, connections, and file changes on each computer for a central console, and can isolate a computer.',at:'freshman/f13'},
  {term:'Egress filtering',def:'Allowing only the outbound traffic a site needs, so malware cannot call home freely.',at:'junior/j6'},
  {term:'Elevated prompt',def:'A PowerShell or Command Prompt window opened with Run as administrator, needed for commands that change the machine.',at:'freshman/f5'},
  {term:'Email header',def:'A line above a message’s body that records who sent it, where replies go, the route it took, or how your mail server checked it.',at:'sophomore/s9'},
  {term:'enable secret',def:'The IOS line that guards privileged mode with a hashed password; enable password keeps it in clear text.',at:'freshman/f7'},
  {term:'Encapsulation',def:'Wrapping data from the layer above in each layer’s own header on the way down the stack.',at:'freshman/f7'},
  {term:'Encoding',def:'Rewriting data in another alphabet, such as base64, which anyone can reverse without a key.',at:'sophomore/s6'},
  {term:'Encrypted DNS (DoT and DoH)',def:'DNS sent inside TLS on port 853 (DoT) or inside HTTPS (DoH), hiding lookups on the way to the resolver.',at:'senior/se11'},
  {term:'Encryption',def:'Scrambling data so that only holders of the key can read it.',at:'sophomore/s6'},
  {term:'Endpoint',def:'Any device a person uses or a service runs on: a laptop, a server, a phone, or a tablet.',at:'freshman/f13'},
  {term:'Ephemeral port',def:'The temporary high port a client picks for one conversation: 49152–65535 on Windows, 32768–60999 on Linux.',at:'sophomore/s4'},
  {term:'Eradication',def:'The response phase that removes every trace of the intruder and closes the way in.',at:'freshman/f13'},
  {term:'Err-disabled',def:'A port state in which the switch has shut the port for a violation until an admin removes the cause and cycles the port.',at:'freshman/f7'},
  {term:'Escalation note',def:'The hand-off to a senior analyst: what fired, what was checked, and what is still unknown.',at:'sophomore/s10'},
  {term:'Event ID',def:'The number that identifies a kind of logged Windows event, such as 4624 for a successful sign-in.',at:'freshman/f3'},
  {term:'Evidence',def:'The files, logs, and settings an investigation question depends on, kept unchanged until the question is answered.',at:'freshman/f1'},
  {term:'Evil twin',def:'A fake access point that copies a real network’s name, so whoever joins it sends traffic through a stranger.',at:'freshman/f9'},
  {term:'Execution policy',def:'The PowerShell setting that decides which script files may start. It is a safety catch rather than a lock: typed commands still run, and unless Group Policy sets it, anyone can bypass it for one run.',at:'sophomore/s11'},
  {term:'Exit code',def:'The number a command leaves when it ends; Bash keeps it in $?. 0 means success. Any other number reports a failure or a “no”, such as grep finding no match.',at:'sophomore/s11'},
  {term:'Exploit framework',def:'A toolkit that packages known exploits and payloads for quick use; patching and egress filtering remove most of its reach.',at:'junior/j11'},
  {term:'Exploit protection',def:'Windows settings such as DEP, ASLR, and CFG that make memory bugs crash rather than run an intruder’s code.',at:'senior/se8'},
  {term:'Fail open',def:'A setting that lets traffic pass when an inline device fails, trading protection for uptime.',at:'junior/j6'},
  {term:'fail2ban',def:'A Linux service that reads logs and blocks an address in the firewall after repeated failed sign-ins.',at:'sophomore/s3'},
  {term:'False negative',def:'A real attack met with silence: a miss.',at:'freshman/f13'},
  {term:'False positive',def:'An alert on something harmless.',at:'freshman/f13'},
  {term:'FERPA',def:'The US law that protects student education records at schools funded by the Education Department.',at:'senior/se12'},
  {term:'File capability',def:'One slice of root’s power, such as cap_net_raw, granted to a single program file. getcap -r / lists them; cap_setuid on an interpreter equals root.',at:'sophomore/s3'},
  {term:'File integrity monitoring (FIM)',def:'Recording known-good hashes of important files and alerting when one changes; the change log separates approved edits from tampering.',at:'junior/j3'},
  {term:'File signature',def:'The first bytes of a file, which give its real type whatever its name: MZ for a Windows program, %PDF for a PDF, and PK for a ZIP.',at:'junior/j13'},
  {term:'File sync',def:'Keeping one folder the same on every device and in the cloud; deletions and ransomware damage sync too.',at:'freshman/f11'},
  {term:'FileVault',def:'macOS full-disk encryption: the disk stays unreadable until someone signs in.',at:'freshman/f6'},
  {term:'Filtered port',def:'A port whose probes get no reply because a firewall dropped them. Closed ports answer RST, and open ports answer SYN-ACK.',at:'sophomore/s7'},
  {term:'Firewall profile',def:'One of the three Windows Defender Firewall rule sets (Domain, Private, and Public), chosen by the network’s category.',at:'sophomore/s2'},
  {term:'Flatpak',def:'A cross-distribution app package format that Mint enables, listed with flatpak list.',at:'sophomore/s3'},
  {term:'Flow record',def:'A one-line summary of a conversation (addresses, ports, bytes, and times) without the contents, exported as NetFlow or IPFIX.',at:'junior/j7'},
  {term:'Forensic image',def:'A bit-for-bit copy of a disk, including empty and deleted space, proved exact by matching hashes.',at:'junior/j13'},
  {term:'Forward secrecy',def:'Fresh keys for every session, so a server key stolen later unlocks none of the traffic recorded earlier.',at:'sophomore/s8'},
  {term:'FTPS',def:'Classic FTP wrapped in TLS, on 21 (explicit) or 990 (implicit) plus a data range. A different program from SFTP.',at:'sophomore/s4'},
  {term:'Gatekeeper',def:'The macOS guard that checks who signed a downloaded app, and whether Apple checked it, before it opens.',at:'freshman/f6'},
  {term:'Gateway of last resort',def:'The show ip route line that names the default route’s next hop.',at:'junior/j4'},
  {term:'GELI',def:'FreeBSD’s full-disk encryption, which protects a disk that is off or stolen.',at:'senior/se1'},
  {term:'gMSA (group managed service account)',def:'An AD service account whose long password Windows rotates automatically.',at:'senior/se7'},
  {term:'Golden image',def:'A hardened, generalized Windows template that an organization copies onto many machines.',at:'sophomore/s2'},
  {term:'Golden ticket',def:'A Kerberos TGT forged with a stolen krbtgt key; it works for any account until krbtgt is reset twice.',at:'senior/se7'},
  {term:'GPO (Group Policy Object)',def:'A named bundle of settings linked to a site, domain, or OU that applies to the computers and users under it.',at:'sophomore/s2'},
  {term:'GRUB password',def:'A superuser password in GRUB’s configuration that guards boot-line edits and recovery mode, which otherwise opens a root shell.',at:'senior/se9'},
  {term:'GTFOBins',def:'A public catalog of ordinary Unix programs that can open a shell or write files when given sudo or SUID. Auditors check sudo rules and SUID files against it.',at:'junior/j3'},
  {term:'Guest OS',def:'The operating system inside a VM, which needs its own updates, accounts, and firewall.',at:'freshman/f4'},
  {term:'Hardcoded secret',def:'A password or key typed into a script or settings file, where everyone who reads the file can see it.',at:'sophomore/s11'},
  {term:'Hardening',def:'Shrinking a system’s attack surface by removing what is unneeded and securely configuring what remains.',at:'freshman/f1'},
  {term:'HIPAA',def:'The US law that protects health information held by health care providers, health plans, clearinghouses, and their business associates.',at:'senior/se12'},
  {term:'Honeypot',def:'A decoy system or share with no real job, so any touch on it is a high-confidence alert. A decoy account or file is a honeytoken.',at:'senior/se11'},
  {term:'Host isolation',def:'Cutting a computer off from every connection except its EDR console while it keeps running, so memory evidence survives.',at:'junior/j12'},
  {term:'Host OS',def:'The operating system under a type 2 hypervisor; whoever controls it controls every guest.',at:'freshman/f4'},
  {term:'Host route',def:'A /32 route that matches exactly one address.',at:'senior/se6'},
  {term:'Hosts file',def:'A local file of name-to-address pairs that the system reads before DNS.',at:'junior/j3'},
  {term:'HST (Hawaiʻi Standard Time)',def:'UTC−10 all year, without daylight saving time: add 10 hours for UTC.',at:'sophomore/s10'},
  {term:'HSTS (Strict-Transport-Security)',def:'A response header that tells browsers to reach a site over HTTPS only, for a set time.',at:'sophomore/s8'},
  {term:'HTTP',def:'The request-and-response language of the web, sent as readable text on port 80.',at:'freshman/f11'},
  {term:'HttpOnly',def:'A cookie flag that hides the cookie from page scripts.',at:'sophomore/s8'},
  {term:'HTTPS',def:'HTTP inside TLS on port 443: private and protected against tampering.',at:'freshman/f11'},
  {term:'Hybrid cloud',def:'On-premises systems joined to a public cloud; the join itself is a high-value target.',at:'freshman/f11'},
  {term:'Hybrid join',def:'A PC joined to Active Directory and registered in Microsoft Entra ID, so it takes GPOs and signs in to cloud apps.',at:'junior/j1'},
  {term:'Hypervisor',def:'Software that runs virtual machines, such as Hyper-V, VirtualBox, or VMware Workstation Pro.',at:'freshman/f4'},
  {term:'IaaS',def:'Infrastructure as a Service: rented VMs and networks; the customer runs the OS and everything above it.',at:'freshman/f11'},
  {term:'IAM (identity and access management)',def:'The cloud service that holds users, roles, and the policies that say what each may do.',at:'junior/j10'},
  {term:'ICMP',def:'The IP helper protocol that carries error and test messages, such as ping.',at:'freshman/f7'},
  {term:'Identity provider (IdP)',def:'The service that checks who you are and issues signed tokens to apps, such as Microsoft Entra ID or Google.',at:'junior/j10'},
  {term:'IDOR (insecure direct object reference)',def:'A request names a record by its id, and the server returns it without checking that it belongs to the requester.',at:'junior/j9'},
  {term:'IDS (intrusion detection system)',def:'A sensor that watches a host or traffic and raises alerts. HIDS runs on a host; NIDS watches the network.',at:'freshman/f13'},
  {term:'Immutable audit rules',def:'Audit rules locked with auditctl -e 2: nothing can change or stop them until the next reboot.',at:'senior/se9'},
  {term:'Immutable flag',def:'A file attribute (chattr +i on Linux, schg on FreeBSD) that blocks every change, even by root, until it is cleared.',at:'senior/se1'},
  {term:'Implicit deny',def:'The hidden last line of every ACL that drops every packet no earlier line matched.',at:'junior/j4'},
  {term:'Incident',def:'An event, or a set of events, that harms or truly threatens confidentiality, integrity, or availability; often an alert that evidence confirms.',at:'sophomore/s10'},
  {term:'Incident response',def:'The planned work of handling an incident: preparation, identification, containment, eradication, recovery, and lessons learned.',at:'freshman/f13'},
  {term:'Incident timeline',def:'Events from every source merged into one list in UTC order, showing the first sign of the intruder, each step, and the gaps.',at:'junior/j13'},
  {term:'Indicator of compromise (IOC)',def:'A clue an attack leaves, such as an address, a file hash, a domain, or an account name, recorded with when and where it was found.',at:'sophomore/s10'},
  {term:'inetd',def:'A super-server that listens on several ports and starts the matching program for each connection.',at:'sophomore/s4'},
  {term:'Infrastructure as code (IaC)',def:'Servers, networks, storage, and permissions described in reviewed text files that a tool builds exactly as written.',at:'senior/se10'},
  {term:'Ingress filtering',def:'Dropping packets at the edge whose source address could not have come from that side, such as loopback or inside addresses arriving from the internet.',at:'junior/j7'},
  {term:'Inherent risk',def:'The risk before any control is in place; compare it with residual risk, the part left after one.',at:'senior/se12'},
  {term:'Inheritance (NTFS)',def:'A folder passing its permission entries down to the files and subfolders inside it.',at:'freshman/f5'},
  {term:'Insider threat',def:'Harm from someone who already holds valid access, whether careless or malicious.',at:'freshman/f8'},
  {term:'Instance metadata service (IMDS)',def:'A link-local service at 169.254.169.254 that tells a cloud VM about itself, including its role’s short-lived credentials.',at:'senior/se10'},
  {term:'Integrity level',def:'A label on each process (Low, Medium, High, or System); a process cannot change objects labeled above it.',at:'junior/j8'},
  {term:'Internal segmentation',def:'Splitting the inside network into zones with rules between them, so one infected device reaches little.',at:'junior/j6'},
  {term:'Interpreter',def:'The program that reads a script and runs it, such as bash, python3, or powershell.exe (pwsh in PowerShell 7).',at:'freshman/f12'},
  {term:'Investigation question',def:'A lab question about what happened on the machine, answered exactly in the format it asks for.',at:'freshman/f1'},
  {term:'IP forwarding',def:'A kernel setting that lets a host route packets between networks.',at:'junior/j3'},
  {term:'IPAM (IP address management)',def:'One source of truth for every subnet, fixed address, DHCP pool, and DNS name, with the owner of each.',at:'senior/se6'},
  {term:'IPS (intrusion prevention system)',def:'A sensor that sits in the path and blocks what matches a rule. HIPS runs on a host; NIPS sits inline on the network.',at:'freshman/f13'},
  {term:'IPsec',def:'A suite that protects IP packets: IKE agrees on keys, and ESP encrypts and authenticates each packet.',at:'junior/j6'},
  {term:'iptables',def:'The older Linux firewall rule language. On current Debian and Ubuntu, iptables-nft loads its rules into nftables.',at:'junior/j3'},
  {term:'ISO 8601 timestamp',def:'A date and time written largest unit first, with the offset from UTC: 2026-10-20T09:14:03-10:00.',at:'sophomore/s10'},
  {term:'ISO/IEC 27001',def:'The international standard for an information security management system; outside auditors can certify it.',at:'senior/se12'},
  {term:'Isolation',def:'Keeping trouble in one place from spreading: separate accounts, sandboxes, containers, VMs, segments, or an air gap.',at:'freshman/f4'},
  {term:'JEA (Just Enough Administration)',def:'A PowerShell remoting endpoint that allows only listed commands, run as a temporary account.',at:'junior/j2'},
  {term:'JSON',def:'A data format of braces, brackets, and quoted keys, used in API answers, cloud policies, and audit events.',at:'freshman/f12'},
  {term:'Jump server',def:'One hardened, logged machine that admins pass through to manage others; servers and network devices accept admin connections only from it.',at:'senior/se8'},
  {term:'Kerberoasting',def:'Requesting service tickets for user accounts with SPNs and cracking their passwords offline.',at:'senior/se7'},
  {term:'Kerberos',def:'The ticket-based sign-in protocol Active Directory uses by default.',at:'senior/se7'},
  {term:'Kernel',def:'The core of the operating system that talks to the hardware and runs processes; Linux is a kernel.',at:'freshman/f6'},
  {term:'Kernel thread',def:'Work the kernel runs inside itself, shown in brackets by ps, such as [kworker/0:1]. It runs from no program file, so /proc/PID/exe stays empty.',at:'junior/j3'},
  {term:'KEV catalog (Known Exploited Vulnerabilities)',def:'CISA’s list of flaws attackers are known to use, which sets patch priority.',at:'junior/j5'},
  {term:'Key pair',def:'A public key anyone may hold and a matching private key only its owner keeps.',at:'freshman/f10'},
  {term:'Key protector',def:'One way to unlock a BitLocker drive, such as the TPM or a 48-digit recovery password; Get-BitLockerVolume lists them.',at:'sophomore/s2'},
  {term:'Kill chain',def:'Seven steps of an intrusion, from reconnaissance to actions on objectives; breaking any one stops the attack.',at:'freshman/f8'},
  {term:'krbtgt',def:'The built-in, disabled AD account whose key signs every ticket-granting ticket; Windows keeps it, so leave it in place.',at:'sophomore/s2'},
  {term:'LAN',def:'Local area network: devices in one building or campus, joined by links the owner controls.',at:'freshman/f9'},
  {term:'LD_PRELOAD',def:'An environment variable naming a library the loader puts into a program ahead of all others; malware uses it to change what trusted calls do.',at:'junior/j3'},
  {term:'LDAP signing',def:'Signs each LDAP message on port 389 so tampering shows; when a DC requires it, the DC refuses unsigned binds and simple binds sent without TLS.',at:'junior/j1'},
  {term:'LDAPS',def:'LDAP inside TLS on TCP 636, protecting directory sign-ins and queries; each domain controller needs a valid certificate.',at:'sophomore/s4'},
  {term:'Least privilege',def:'Giving every account and program only the access its job needs.',at:'freshman/f3'},
  {term:'Linux namespace',def:'A kernel feature that gives a process its own view of something shared, such as the process list, network, or hostname. Containers are built from namespaces and cgroups.',at:'senior/se9'},
  {term:'Live response',def:'Collecting volatile evidence from a running, isolated computer before anyone cleans or restarts it.',at:'senior/se8'},
  {term:'Living off the land',def:'Attacking with programs the system already trusts, such as certutil or rundll32, instead of new tools.',at:'junior/j8'},
  {term:'LLDP',def:'Link Layer Discovery Protocol (IEEE 802.1AB): a vendor-neutral way for a device to announce its name, model, and port to the device at the other end of the cable.',at:'sophomore/s5'},
  {term:'LLMNR and NBT-NS',def:'Fallback name lookups sent to every host on the local network (LLMNR by multicast, NBT-NS by broadcast), which an attacker on the LAN can answer to capture password hashes.',at:'senior/se7'},
  {term:'Local account',def:'An account stored on one computer and usable only there.',at:'freshman/f5'},
  {term:'Local Security Policy (secpol.msc)',def:'The console for one machine’s password, lockout, audit, user rights, and Security Options settings, on Pro editions and above.',at:'freshman/f5'},
  {term:'Lock file',def:'A file that pins every dependency, nested ones included, to an exact version and often a hash.',at:'junior/j9'},
  {term:'Log forwarding',def:'Sending a copy of each log record to a central server as it is written, so erasing the local log leaves the copy.',at:'sophomore/s10'},
  {term:'Log retention',def:'How long logs are kept before deletion, set by policy and law.',at:'sophomore/s10'},
  {term:'Login class',def:'A named FreeBSD policy group in /etc/login.conf that sets password aging and login limits for its members.',at:'senior/se1'},
  {term:'login.defs',def:'The Linux file that sets password-aging defaults for accounts created afterward.',at:'sophomore/s3'},
  {term:'Logon type',def:'The number in a Windows sign-in event that says how the sign-in happened: 2 at the keyboard, 3 over the network, and 10 by Remote Desktop.',at:'sophomore/s10'},
  {term:'Longest-prefix match',def:'The rule that a router forwards on the most specific matching route.',at:'junior/j4'},
  {term:'Loop',def:'Code that repeats the same lines for each item, such as each line of a file.',at:'freshman/f12'},
  {term:'Loopback address',def:'127.0.0.1 or ::1, named <b>localhost</b>: traffic that turns around inside the same machine.',at:'freshman/f9'},
  {term:'LSA protection (RunAsPPL)',def:'Runs LSASS as a protected process, so only Microsoft-signed protected code can read its memory or load into it.',at:'senior/se7'},
  {term:'LSASS',def:'The Windows process that checks sign-ins and holds credentials in memory.',at:'senior/se7'},
  {term:'LSDOU',def:'The order Windows applies policy: Local, Site, Domain, then OUs from parent to child; the last one applied wins a conflict.',at:'junior/j2'},
  {term:'LTS',def:'Long-term support: an Ubuntu release, every two years, with five years of standard security updates.',at:'freshman/f6'},
  {term:'LUKS',def:'Linux full-disk encryption: the partition stays unreadable without the passphrase while the machine is off.',at:'sophomore/s3'},
  {term:'MAC address',def:'A 48-bit hardware address that carries a frame to the next device on the local link.',at:'freshman/f7'},
  {term:'MAC filtering',def:'Admitting only listed hardware addresses. It stops accidents only, because any device can copy an allowed MAC.',at:'sophomore/s7'},
  {term:'MAC flooding',def:'Filling a switch’s MAC table with fake source addresses so it floods frames out every port; a per-port MAC limit stops it.',at:'junior/j4'},
  {term:'Machine Owner Key (MOK)',def:'A key the machine’s owner enrolls through shim so that Secure Boot trusts code the owner signed, such as a custom kernel module.',at:'senior/se9'},
  {term:'Macro',def:'A small program inside an Office file; Office blocks macros in files from the internet.',at:'freshman/f11'},
  {term:'MAN',def:'Metropolitan area network: a town- or county-sized network, such as a fiber ring joining a district’s schools.',at:'freshman/f9'},
  {term:'Managed installer',def:'An App Control option that trusts whatever a named deployment tool, such as Intune, installs.',at:'senior/se8'},
  {term:'Mandatory access control',def:'Rules the system policy sets, above any file owner’s choice, that limit what a program may touch even when it runs as root. AppArmor and SELinux are the Linux examples.',at:'junior/j3'},
  {term:'Mark of the Web',def:'A tag Windows adds to files that arrived from the internet or email, so SmartScreen checks tagged programs before they run and Office opens tagged documents in Protected View with macros blocked.',at:'freshman/f11'},
  {term:'master.passwd',def:'The FreeBSD file that holds password hashes and login classes, readable only by root.',at:'senior/se1'},
  {term:'Member server',def:'A Windows Server joined to a domain that keeps its own local accounts and also accepts domain accounts.',at:'sophomore/s2'},
  {term:'Memory image',def:'A capture of a running computer’s RAM, holding processes, connections, and keys that vanish at power-off.',at:'junior/j13'},
  {term:'Memory integrity (HVCI)',def:'A Windows feature that uses virtualization to run the kernel’s code checks in a walled-off space beyond the kernel’s reach, so the checks hold even against malware inside the kernel.',at:'freshman/f5'},
  {term:'Memory leak',def:'A program that keeps reserving memory and never returns it; use climbs until the service slows and crashes.',at:'senior/se2'},
  {term:'Memory-safe language',def:'A language that checks lengths and frees memory for the programmer, such as Go, Rust, Python, or Java, which rules out most overflows.',at:'senior/se2'},
