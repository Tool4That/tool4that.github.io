 {id:'f13',title:'Watch, detect, and respond',bloom:'Understand',sum:'The tools that watch hosts and networks, the four detection outcomes, who works in a security operations center, and the phases of incident response.',
  can:'name the tools that watch hosts and networks, classify an alert as one of the four outcomes, describe who works in a SOC, and list the phases of incident response',
  blocks:[
   C('Tools that watch for you','Understand',
     P('An <b>endpoint</b> is any device a person uses or a service runs on, such as a laptop or a server. Three tools do most of the watching. <b>Antivirus</b> asks: is this file bad? <b>EDR</b> (endpoint detection and response) asks: what does this chain of actions mean? A <b>SIEM</b> (security information and event management) links related events from many machines into one alert.'),
     TIPS('Antivirus checks for <b>detection signatures</b>, such as malware hashes, and suspicious actions. Its detection record (threat, path, action, and time) is evidence.',
          'A <b>detection signature</b> is a known-bad pattern; a <a href="#freshman/f10">digital signature</a> proves who signed. Same word, different jobs.')),
   DETAIL('Layers on one endpoint',
     TIPS('<b>Anti-malware</b> adds layers beyond scanning, such as download reputation and controlled folder access against ransomware. Each stops a different infection step; keep every layer on.',
          'Real-time scanning checks each file as it arrives, and unwanted-app blocking stops bundled extras; both are layers a defender confirms are on.',
          '<b>Endpoint security</b> layers patches, host firewall, anti-malware, EDR, disk encryption, least privilege, and logging on one device; each covers a different gap (<a href="#freshman/f3">defense in depth</a>).')),
   COMPARE('Antivirus, EDR, and SIEM',[
     {name:'Antivirus',tag:'one computer',tone:'l1',
      rows:[['Sees','Files and programs on one computer'],['Records live','In that computer’s detection history'],['Typical alert','“Trojan in Downloads\\invoice.exe: quarantined”'],['Can do','Block, quarantine, or delete the file']],
      hook:'a wanted poster at the door.'},
     {name:'EDR',tag:'every computer',tone:'l2',
      rows:[['Sees','Each process, its parent and children, connections, and file changes'],['Records live','A central console with weeks of history'],['Typical alert','“Word started PowerShell, which then reached an outside address”'],['Can do','Isolate the computer, stop a process, and search the history']],
      hook:'a security camera with a rewind button.'},
     {name:'SIEM',tag:'the whole network',tone:'l3',
      rows:[['Sees','Logs from computers, servers, firewalls, switches, and cloud apps'],['Records live','One central store, apart from the machines it watches'],['Typical alert','“Ten failed sign-ins, then a success: same account, same address”'],['Can do','Alert, search, and build a timeline']],
      hook:'the control room that watches every camera.'}
   ]),
   SCALE('Where a detector runs and what it does',{
     x:['What it does','Detect: watch and alert','Prevent: sit in the path and block'],
     y:['Where it runs','On one host','On the network'],
     cells:[
       [['HIDS','Host intrusion detection: reads one computer’s logs and files, and alerts.','l1'],['HIPS','Host intrusion prevention: blocks a risky action, such as banning an address after many failed SSH sign-ins.','l2']],
       [['NIDS','Network intrusion detection: reads a copy of traffic from a SPAN port or a tap. It only alerts, so an attack flows on until someone acts; if it fails, traffic keeps flowing.','l3'],['NIPS','Network intrusion prevention: sits inline and drops what matches a rule. If it fails, or a rule is wrong, real traffic can stop.','amber']]]},
     {intro:'An <b>IDS</b> (intrusion detection system) watches and alerts; an <b>IPS</b> (intrusion prevention system) can also block.',
      note:'<b>Placement decides what a sensor sees.</b> A host tool sees its own computer. A network sensor sees only traffic on the links it copies or sits on, and only the outside of encrypted traffic.'}),
    TIPS('New prevent rules start in alert-only mode and switch to block once normal traffic passes cleanly.'),
   QUIZ('f13ck1','Check yourself',[
     ['A sensor reads a copy of traffic from a SPAN port. What happens to the traffic if the sensor crashes?',['It keeps flowing','All traffic stops','Only encrypted traffic stops','The switch reboots'],0,'A copy-reading sensor only watches; an inline sensor can block, and can stop traffic when it fails.',{whys:['A SPAN sensor reads a copy, so traffic keeps flowing when the sensor fails.','Only an inline device can stop traffic, and this sensor sits off to the side.','The sensor reads a copy of all traffic, encrypted or plain, so all of it flows on.','The crash stays inside the sensor, and the switch keeps sending the copy.'],imp:'core',c:'det-ids-ips'}]
   ]),
   C('Reading one IDS alert','Understand',
     TERM('10/14/2026-19:12:44.512031  [**] [1:900101:1] Old file-sharing exploit attempt [**] [Classification: Attempted Administrator Privilege Gain] [Priority: 1] {TCP} 203.0.113.44:50122 -> 10.20.0.15:445\n10/14/2026-19:40:05.207714  [**] [1:900233:2] DNS query to an outside resolver [**] [Classification: Potential Corporate Privacy Violation] [Priority: 3] {UDP} 10.20.0.31:53311 -> 198.51.100.9:53'),
     TIPS('From Hilo Lehua Clinic’s sensor, left to right: <b>time</b> (UTC), <b>rule id</b>, <b>message</b>, class, <b>priority</b> (1 is most urgent), protocol, <b>source -> destination</b> with ports.',
          'Line 1: an outside address attacked file sharing on HILO-FS01 (10.20.0.15), port 445. Ask why the firewall allowed it, then whether the server is patched.',
          'Line 2: a laptop bypassed the clinic’s DNS server; misconfigured apps and malware do that. Every alert is a question for a person or playbook.')),
   SCALE('Four detection outcomes',{
     x:['What the tool did','Alerted','Stayed quiet'],
     y:['What really happened','Real attack','Harmless'],
     cells:[
       [['True positive','A student opened a phishing link, and EDR flagged the download.','ok'],['False negative','An intruder signed in with a stolen teacher password, and every rule stayed quiet: a miss.','bad']],
       [['False positive','The nightly backup copied 40 GB off-site and tripped a “data leaving” rule.','amber'],['True negative','Students signed in as usual, and the tools stayed quiet.','muted']]]},
     {note:'<b>“True” or “false” grades the tool; “positive” or “negative” says whether it alerted.</b> Too many false positives bury real alerts; every false negative is an unseen attack. Tuning a rule trades one mistake for the other.'}),
   QUIZ('f13ck2','Check yourself',[
     ['A phishing email reached an inbox, and the tools stayed silent. Which outcome is that?',['True negative','False positive','False negative','True positive'],2,'Ask whether it alerted (positive or negative), then whether it was right (true or false).',{whys:['True negative is silence on harmless activity, and this was a real attack.','False positive is an alert on something harmless, and here the tools stayed silent.','A real attack met silence: the tool was wrong (false) and quiet (negative).','True positive takes an alert, and the tools stayed silent.'],imp:'core',c:'det-outcomes'}]
   ]),
   VENN('Signature and behavior detection',[
     {name:'Detection signatures',tone:'l1',items:['known malware files, matched by fingerprint','fast and precise, with few false alarms','an update teaches it each new threat']},
     {name:'Behavior',tone:'l3',items:['new malware and brand-new tricks','a trusted tool used in an odd way','more false alarms, so people review them']}
   ],{overlaps:[{sets:'AB',name:'Both',items:['a known ransomware strain: its file matches a signature, and its mass file changes look odd']}],
     caption:'Strong tools use both kinds of detection.'}),
   DETAIL('Known and unknown threats',
     P('A <b>known</b> threat already has a detection signature, so updated tools stop most of them; a known flaw may still sit unpatched (<a href="#freshman/f8">the zero-day window</a>). An <b>unknown</b> threat needs behavior detection and layers that limit the damage.'),
     P('For every threat, ask: would our tools recognize it, and which layer would still limit the harm? Keep the two signatures apart: a <a href="#freshman/f10">digital signature</a> proves who signed a file.')),
   PATH('From log line to analyst',[
     {name:'Sources',tag:'many devices',tone:'l1',note:'Each device writes its own logs.',via:'forwarded'},
     {name:'Collect',tag:'one store: the SIEM',tone:'l1',note:'Copies leave each device at once, so wiping one machine leaves the copy safe.',via:'stored'},
     {name:'Normalize',tag:'one format',tone:'l1',note:'Same fields on every record (time, host, user, event, and source address), all times in UTC.',via:'searchable'},

/* =====================================================================
   STORAGE (per-viewer, this browser only; degrades to memory if blocked)
   ===================================================================== */
const KEY='defense-ladder-v1';
let MEM={};
/*@engine 2026-10-21 fast-open merge-save tick-merge progress-code progressive ux1 nav2 flow3 fix4*/
/* progress is keyed by activity id. A save reads what is stored now (another tab may have saved since),
   lays this tab's changed ids over it, and writes the result, so two open tabs keep each other's work. */
function readSaved(){
  try{ const r=localStorage.getItem(KEY); const v=r?JSON.parse(r):{}; return v&&typeof v==='object'&&!Array.isArray(v)?v:{}; }
  catch(e){ return null; }
}
const store={
  load(){ const v=readSaved(); if(v) MEM=v; return MEM; },
  save(ids){
    const cur=readSaved();
    if(cur){ ids.forEach(id=>{ if(MEM[id]===undefined) delete cur[id]; else cur[id]=MEM[id]; }); MEM=cur; }
    try{ localStorage.setItem(KEY,JSON.stringify(MEM)); store.ok=true; }catch(e){ store.ok=false; }
    if(store.onHealth) store.onHealth();
  },
  get(id){ return MEM[id]; },
  set(id,v){ MEM[id]=v; this.save([id]); },
  setMany(o){ Object.assign(MEM,o); this.save(Object.keys(o)); },
  clear(){ MEM={}; try{ localStorage.setItem(KEY,'{}'); store.ok=true; }catch(e){ store.ok=false; } }
};
store.load();
/* another tab saved: take its progress, so this tab's unit dots stay current */
window.addEventListener('storage',e=>{
  if(e.key!==KEY&&e.key!==null) return;
  store.load(); refreshChrome();
  if(current.page==='progress'&&progressRedraw) progressRedraw();
});

/* theme */
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  themeBtn.textContent='Theme: '+(t||'auto');
}
let theme=(function(){ try{return localStorage.getItem(KEY+'-theme')||'auto';}catch(e){return 'auto';} })();
applyTheme(theme);
themeBtn.addEventListener('click',()=>{
  theme = theme==='auto'?'light':theme==='light'?'dark':'auto';
  try{localStorage.setItem(KEY+'-theme',theme);}catch(e){}
  applyTheme(theme);
});
/* reading width on laptops and desktops (920 px and up): Wide, the default, lets the column grow to about

/* chevron icon for a level (stacked chevrons = grade) */
function chevSvg(n,color){
  const w=16,gap=5; let p='';
  for(let i=0;i<4;i++){
    const on=i<n;
    p+=`<path d="M2 ${4+i*gap} L8 ${1+i*gap} L14 ${4+i*gap}" fill="none" stroke="${on?color:'var(--line)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  return `<svg width="${w}" height="26" viewBox="0 0 16 26" aria-hidden="true">${p}</svg>`;
}

const PAGES=[['plan','Study plan'],['scorecard','Hardening scorecard'],['progress','My progress'],['glossary','Glossary'],['about','About & links']];
let current={level:homeLevel(), unit:homeUnit(), page:'level'};

function levelById(id){return LEVELS.find(l=>l.id===id);}
/* progressive loading: GRADE_INDEX (beside LADDER) names every grade and its unit ids before the grade's
   script arrives. gradeList() is the rail order: each grade's data once it is here, its index entry until then,
   then any level added at run time that the index lacks. */
function gradeList(){ return GRADE_INDEX.map(g=>levelById(g.id)||g).concat(LEVELS.filter(l=>!GRADE_INDEX.some(g=>g.id===l.id))); }
function gradeInfo(id){ return levelById(id)||GRADE_INDEX.find(g=>g.id===id); }
function firstUnit(id){ const L=levelById(id); return L?L.units[0].id:gradeInfo(id).unitIds[0]; }
/* a view waits for the data it needs: a grade's units need that grade, My progress needs every grade, and the
   Glossary needs the glossary (the last script). The study plan, the scorecard, and About need only the core. */
let waiting=false,scrollOnArrive=false;
function viewReady(){
  if(current.page==='level') return !!levelById(current.level);
  if(current.page==='progress') return LADDER.allLevels();
  if(current.page==='glossary') return LADDER.allLevels()&&LADDER.glossary;
  return true;
}

  row.appendChild(a); h.appendChild(row); main.appendChild(h);

}
function renderWaiting(){

  const name=g?g.grade:((PAGES.find(p=>p[0]===current.page)||[])[1]||'This page');

/* names stay whole. In code and terminal lines, a name of up to 20 characters that holds punctuation

    case 'seq': return renderSeq(b,inCard);
    case 'hier': return renderHier(b,inCard);
    case 'venn': return renderVenn(b,inCard);
    case 'scale': return renderScale(b,inCard);
    default: return el('div');
  }
}

function renderCard(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">${b.bloom}</span>`));
  b.parts.forEach(p=>c.appendChild(renderBlock(p,null,true)));
  return c;
}
/* the longest command picks the layout: up to 48 characters, the table shows two columns once its box has room;
   longer commands always stack, each on its own line with its meaning beneath (CSS: .cmdw and the container queries) */
/* ---- "docs": the Study Map entry for each command on a row (its options and the vendor's documentation), online in a
   new tab. CMD_REF (written by curriculum/cli/dl_cmd_refs.js) keys rows by an FNV-1a hash of the command text. ---- */
function cmdKey(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(36);}
function cmdLink(id,text){
  const a=el('a',null,esc(text)), name=id.slice(id.indexOf('/')+1);
  a.href=HUB+'study-map/#cmd='+encodeURIComponent(id); a.target='_blank'; a.rel='noopener noreferrer';
  a.title=name+': options and vendor documentation in the Study Map (online)';
  if(text!==name) a.setAttribute('aria-label',name+' docs: options and vendor documentation in the Study Map, online, new tab');
  return a;
}
function cmdDocs(code,cmd){
  const r=code&&typeof CMD_REF!=='undefined'?CMD_REF.m[cmdKey(String(cmd))]:null;
  if(!r) return;
  const ids=r.map(i=>CMD_REF.ids[i]), sup=el('sup','docs');
  if(ids.length===1){ sup.appendChild(cmdLink(ids[0],'docs')); code.after(sup); return; }
  const b=el('button','docs-b','docs'), list=el('span','docs-l');
  b.type='button'; b.setAttribute('aria-expanded','false'); b.setAttribute('aria-label','docs for the '+ids.length+' commands on this line');
  list.hidden=true;
  ids.forEach((id,i)=>{ if(i) list.appendChild(document.createTextNode(' · ')); list.appendChild(cmdLink(id,id.slice(id.indexOf('/')+1))); });
  b.addEventListener('click',()=>{ const open=list.hidden; list.hidden=!open; b.setAttribute('aria-expanded',String(open)); });
  sup.appendChild(b); code.after(sup,list);
}
function renderCmds(b){
  const wrap=el('div','cmdw');
  if(b.title) wrap.appendChild(el('p',null,`<b>${b.title}</b>`));
  const n=Math.max(...b.rows.map(([cmd])=>String(cmd).length));
  const t=el('table','cmds'+(n<=16?' cmds-s':n<=24?' cmds-m':n<=32?' cmds-l':n<=48?' cmds-x':''));
  b.rows.forEach(([cmd,why])=>{
    const tr=el('tr');
    const td=el('td',null,`<code>${esc(cmd)}</code>`);
    cmdDocs(td.firstChild,cmd);
    tr.appendChild(td);
    tr.appendChild(el('td',null,why));
    t.appendChild(tr);
  });
  wrap.appendChild(t);
  return wrap;
}
/* a line with a run of three or more spaces is a row of columns (command output): it keeps its columns, and the
   excerpt scrolls sideways (a named region with a cue) when such a row is wider than the box */
function renderTerm(b){
  const p=el('pre','term');
  p.innerHTML=String(b.text).split('\n').map(l=>`<span class="tln${/\S {3,}\S/.test(l)?' tab':''}">${esc(l)||' '}</span>`).join('');
  return p;
}
/* ---- deeper detail: a collapsed panel of lookup facts; parts are any blocks (no id, so no progress) ---- */
function renderDetail(b){
  const d=el('details','deeper');
  d.appendChild(el('summary',null,'Deeper detail: '+b.title));
  b.parts.forEach(p=>d.appendChild(renderBlock(p,null,true)));
  return d;
}

/* =====================================================================
   VISUAL BLOCKS (the constructor notes near the top describe the data)
   ===================================================================== */
const TONES={l1:['--l1','--tint1'],l2:['--l2','--tint2'],l3:['--l3','--tint3'],l4:['--l4','--tint4'],muted:['--ink-3','--paper-2'],ok:['--ok','--ok-bg'],bad:['--bad','--bad-bg'],amber:['--amber','--amber-bg']};
const toneCss=(t,d)=>{const k=TONES[t]||TONES[d]||TONES.l2;return `--c:var(${k[0]});--bgc:var(${k[1]})`;};
const plain=s=>String(s==null?'':s).replace(/<br\s*\/?>/gi,'; ').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
const attrq=s=>plain(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
const andList=a=>{a=a.filter(x=>x!==''&&x!=null);return a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+', and '+a[a.length-1];};
const dot=s=>{s=String(s==null?'':s).trim();return !s||/[.!?:]$/.test(plain(s))?s:s+'.';};
const asList=x=>x==null||x===''?[]:Array.isArray(x)?x:[x];
let visSeq=0;

/* SVG presentation attributes holding var(...) move into style, where every browser reads them */
function svgVarAttrs(body){
  return body.replace(/<([a-zA-Z][\w-]*)((?:[^>"']|"[^"]*"|'[^']*')*?)(\/?)>/g,(m,tag,attrs,sl)=>{
    const st=[];
    attrs=attrs.replace(/\s(fill|stroke|stop-color|color)\s*=\s*"(var\([^"]*\))"/g,(x,n,v)=>{st.push(n+':'+v);return '';});
    if(!st.length) return m;
    if(/\sstyle\s*=\s*"/.test(attrs)) attrs=attrs.replace(/\sstyle\s*=\s*"([^"]*)"/,(x,v)=>` style="${v.replace(/;?\s*$/,';')}${st.join(';')}"`);
    else attrs+=` style="${st.join(';')}"`;
    return `<${tag}${attrs}${sl}>`;
  });
}
/* an author's {body,label,view,width} drawing, with its own arrowhead markers */
function svgHtml(svg){
  if(!svg) return '';
  const s=typeof svg==='string'?{body:svg}:svg;
  const uid='v'+(++visSeq), used=new Set();
  let body=String(s.body||'').replace(/url\(#arrow(?:-([a-z0-9]+))?\)/g,(m,t)=>{const k=t&&TONES[t]?t:'';used.add(k);return `url(#${uid}-arrow${k?'-'+k:''})`;});
  body=svgVarAttrs(body);
  const defs=[...used].map(k=>`<marker id="${uid}-arrow${k?'-'+k:''}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" style="fill:var(${k?TONES[k][0]:'--ink-3'})"/></marker>`).join('');
  const a11y=s.label?`role="img" aria-label="${attrq(s.label)}"`:'aria-hidden="true"';
  const size=(s.width?` width="${s.width}"`:'')+(s.height?` height="${s.height}"`:'');
  return `<svg viewBox="${s.view||'0 0 200 74'}"${size} ${a11y} focusable="false">${defs?'<defs>'+defs+'</defs>':''}${body}</svg>`;
}
/* shared frame: card or in-card heading, intro, figure, note, caption, key, and the text version */
function visShell(b,inCard,figHtml,altAuto){
  const o=b.o||{};
  const wrap=el('div',inCard?'v-in':'card');
  if(b.title) wrap.appendChild(el(inCard?'h4':'h3',null,inCard?b.title:`${b.title}<span class="blm">${o.bloom||'Understand'}</span>`));
  if(o.intro) wrap.appendChild(el('p','v-why',o.intro));
  const fig=el('figure','vis');
  let h=figHtml;
  if(o.note) h+=`<p class="v-note">${o.note}</p>`;
  h+=`<figcaption class="v-cap">${o.caption||b.title||''}</figcaption>`;
  if(o.key&&o.key.length) h+=`<div class="v-key">${o.key.map(([t,l])=>`<span style="${toneCss(t)}">${l}</span>`).join('')}</div>`;
  const alt=o.alt?(Array.isArray(o.alt)?'<ol>'+o.alt.map(x=>`<li>${x}</li>`).join('')+'</ol>':`<p>${o.alt}</p>`):altAuto;
  h+=`<details class="v-alt"><summary>Read it as text</summary>${alt}</details>`;
  fig.innerHTML=h;
  wrap.appendChild(fig);
  return wrap;
}

/* ---- COMPARE ----
   Side by side, each column is a subgrid over the same rows (heading, drawing, each labelled row, and the memory
   hook), so the rows line up across the columns. */
function renderCompare(b,inCard){
  const cols=b.cols||[], hn=inCard?'h5':'h4';
  const K=Math.max(0,...cols.map(c=>(c.rows||[]).length)), hasSvg=cols.some(c=>c.svg), hasHook=cols.some(c=>c.hook);
  const R=1+(hasSvg?1:0)+K+(hasHook?1:0), dr=hasSvg?3:2;
  const html=`<div class="v-cmp v-n${cols.length}">`+cols.map(c=>
    `<div class="v-col" style="${toneCss(c.tone,'l2')};--r:${R};--k:${K||1};--dr:${dr}"><${hn} class="v-colh"><span>${c.name}</span>${c.tag?`<span class="v-tag">${c.tag}</span>`:''}</${hn}>`+
    svgHtml(c.svg)+
    ((c.rows||[]).length?'<dl>'+c.rows.map(([k,v])=>`<div class="v-kv"><dt>${k}</dt><dd>${v}</dd></div>`).join('')+'</dl>':'')+
    (c.hook?`<div class="v-mem">Remember it as: ${c.hook}</div>`:'')+'</div>').join('')+'</div>';
  const alt=cols.map(c=>`<p><b>${dot(c.name+(c.tag?', '+c.tag:''))}</b> `+(c.rows||[]).map(([k,v])=>`${k}: ${dot(v)}`).join(' ')+
    (c.svg&&c.svg.label?' '+dot(c.svg.label):'')+(c.hook?' Remember it as: '+dot(c.hook):'')+'</p>').join('');
  const shell=visShell(b,inCard,html,alt);
  flowCmpToggle(shell,b);
  return shell;
}
/* ---- ANATOMY ---- */
function anatBox(x){
  if(x.core) return `<div class="v-core">${x.name||''}${x.sub?`<div class="v-sub">${x.sub}</div>`:''}</div>`;
  const fld=(f,cls)=>f&&f.length?`<div class="${cls}"><b>${f[0]}</b>${f.slice(1).join('<br>')}</div>`:'';
  const kids=(x.children||[]).map(anatBox).join('');
  /* tiles are at least as wide as their longest word or name (up to 30 characters; code is wider per character), so
     each one stays on one line */
  const CODE=/<(code|samp|kbd)\b[^>]*>[\s\S]*?<\/\1>|<span class="mono">[\s\S]*?<\/span>/g;
  const longest=s=>Math.min(30,Math.max(0,...s.replace(/<[^>]*>/g,' ').split(/\s+/).map(w=>w.length)));
  const need=Math.max(longest((kids.match(CODE)||[]).join(' '))*.48,longest(kids.replace(CODE,' '))*.42,longest((x.children||[]).map(c=>c.name||'').join(' '))*.5);
  const tmin=need?`--tmin:${(need+1.2).toFixed(1)}rem`:'';
  const inner=(x.panel?`<div class="v-panel"><b>${x.panel[0]}</b>${x.panel.slice(1).join(' · ')}</div>`:'')+(kids?(x.grid?`<div class="v-grid" style="${tmin}">${kids}</div>`:kids):'');
  const body=(x.head||x.trail)?`<div class="v-arow">${fld(x.head,'v-hdr')}<div class="v-inner">${inner}</div>${fld(x.trail,'v-trl')}</div>`:(inner?`<div class="v-inner">${inner}</div>`:'');
  return `<div class="v-box" style="${toneCss(x.tone,'l2')}"><div class="v-blabel"><span>${x.name||''}</span>${x.tag?`<span class="v-tag">${x.tag}</span>`:''}</div>`+
    (x.text?`<div class="v-btxt">${x.text}</div>`:'')+body+svgHtml(x.svg)+'</div>';
}
function anatAlt(x){
  if(x.core) return `<li>${x.name||''}${x.sub?': '+x.sub:''}</li>`;
  const f=(a)=>a&&a.length?` ${a[0]}: ${dot(andList(a.slice(1).map(plain)))}`:'';
  const kids=(x.children||[]).map(anatAlt).join('');
  return `<li><b>${x.name||''}</b>${x.tag?' ('+x.tag+')':''}.${x.text?' '+dot(plain(x.text)):''}${f(x.head)}${f(x.panel)}${f(x.trail)}${kids?' Inside it:<ul>'+kids+'</ul>':''}</li>`;
}
function anatSay(x){
  const k=(x.children||[]).filter(c=>c.name);
  if(!k.length) return plain(x.name);
  if(k.length===1&&!x.grid) return plain(x.name)+' contains '+anatSay(k[0]);
  return plain(x.name)+' contains '+andList(k.map(c=>plain(c.name)));
}
function renderAnatomy(b,inCard){
  const o=b.o||{}, boxes=b.boxes||[];
  const label=o.label||dot(boxes.map(anatSay).join('; '));
  const strip=o.strip?`<div class="v-strip" aria-hidden="true"><b>${o.strip[0]}</b><code>${o.strip[1]}</code></div>`:'';
  const F=o.facts;
  const facts=F?`<div class="v-facts"><table><thead><tr>${F.head.map((h,i)=>i||h?`<th scope="col">${h}</th>`:'<td></td>').join('')}</tr></thead><tbody>`+
    F.rows.map(r=>'<tr>'+r.map((c,i)=>i?`<td>${c}</td>`:`<th scope="row">${c}</th>`).join('')+'</tr>').join('')+'</tbody></table></div>':'';
  const html=`<div class="v-anat${F?' v-hasfacts':''}"><div><div class="v-boxes" role="img" aria-label="${attrq(label)}">${boxes.map(anatBox).join('')}</div>${strip}</div>${facts}</div>`;
  const alt='<ul>'+boxes.map(anatAlt).join('')+'</ul>'+(o.strip?`<p>${o.strip[0]}: ${o.strip[2]||o.strip[1]}</p>`:'');
  return visShell(b,inCard,html,alt);
}

/* ---- STACK ---- */
function renderStack(b,inCard){
  const S=b.stacks||[];
  const sum=s=>(s.layers||[]).reduce((n,l)=>n+(l[2]||1),0);
  const rows=Math.max(1,...S.map(sum));
  const first=[];
  let h=`<div class="v-stack" style="grid-template-columns:repeat(${S.length},minmax(0,1fr));grid-template-rows:auto repeat(${rows},minmax(2.6em,auto))">`;
  const alt=[];
  S.forEach((s,ci)=>{
    h+=`<div class="v-sth" style="grid-column:${ci+1};grid-row:1">${s.name||''}</div>`;
    let r=0, num=(s.layers||[]).length; const li=[];
    (s.layers||[]).forEach(l=>{
      const sp=l[2]||1;
      h+=`<div class="v-layer" style="${toneCss(l[3]||s.tone,'l2')};grid-column:${ci+1};grid-row:${r+2} / span ${sp}"><b>${s.numbered?`<span class="v-num">${num}</span>`:''}<span>${l[0]}</span></b>${l[1]?`<small>${l[1]}</small>`:''}</div>`;
      if(ci===0) for(let k=0;k<sp;k++) first[r+k]=plain(l[0]);
      let t=(s.numbered?num+' ':'')+l[0]+(l[1]?' ('+l[1]+')':'');
      if(ci>0&&S[0]){const cov=[...new Set(first.slice(r,r+sp).filter(Boolean))];if(cov.length) t+=`, lining up with ${andList(cov)} in ${plain(S[0].name)}`;}
      li.push(`<li>${t}</li>`);
      r+=sp; num--;
    });
    alt.push(`<p><b>${s.name||''}</b>, top to bottom:</p><ul>${li.join('')}</ul>`);
  });
  h+='</div>';
  return visShell(b,inCard,h,alt.join(''));
}

/* ---- PATH ---- */
function renderPath(b,inCard){
  const H=b.hops||[];
  const arrow='<svg width="22" height="14" viewBox="0 0 22 14" aria-hidden="true" focusable="false"><path d="M1 7 H15" style="stroke:var(--ink-2);stroke-width:2;fill:none"/><path d="M13 2 L21 7 L13 12 z" style="fill:var(--ink-2)"/></svg>';
  /* side by side (three hops from 600 px, four from 900 px, five from 1000 px of figure width), hop names, tags, and
     notes line up across the hops */
  const pc=H.length>1?` style="--pc:repeat(${H.length-1},minmax(0,1fr) 64px) minmax(0,1fr)"`:'';
  let h=`<div class="v-path${H.length<=3?' v-row':H.length===4?' v-row4':H.length===5?' v-row5':''}"${pc}>`;
  const alt=[];
  H.forEach((x,i)=>{
    const notes=asList(x.note);
    h+=`<div class="v-hop" style="${toneCss(x.tone,'l2')}"><b>${x.name}</b>${x.tag?`<span class="v-tag">${x.tag}</span>`:''}`+
      (notes.length===1?`<div>${notes[0]}</div>`:notes.length?'<ul>'+notes.map(n=>`<li>${n}</li>`).join('')+'</ul>':'')+'</div>';
    if(i<H.length-1) h+=`<div class="v-arr">${arrow}${x.via?`<span>${x.via}</span>`:''}</div>`;
    alt.push(`<li><b>${x.name}</b>${x.tag?' ('+x.tag+')':''}.${notes.length?' '+notes.map(dot).join(' '):''}${x.via&&i<H.length-1?' Then: '+dot(x.via):''}</li>`);
  });
  h+='</div>';
  return visShell(b,inCard,h,'<ol>'+alt.join('')+'</ol>');
}

/* ---- SEQ ---- */
function renderSeq(b,inCard){
  const alt=[];
  const items=(b.steps||[]).map((s,i)=>{
    if(Array.isArray(s)){
      alt.push(`<li><b>${s[0]}</b>${s[1]?': '+s[1]:''}</li>`);
      return `<li style="${toneCss(s[2],'l2')}"><span class="v-sn">${i+1}</span><span class="v-sl">${s[0]}</span>${s[1]?`<span class="v-sd">${s[1]}</span>`:''}</li>`;
    }
    const br=s.branches||[];
    alt.push(`<li><b>Decision: ${s.ask}</b>${s.detail?' '+dot(s.detail):''} ${br.map(([k,v])=>`${k}: ${dot(v)}`).join(' ')}</li>`);
    return `<li class="v-dec" style="${toneCss(s.tone,'amber')}"><span class="v-sn"><span>${i+1}</span></span><span class="v-sl">${s.ask}</span>${s.detail?`<span class="v-sd">${s.detail}</span>`:''}`+
      (br.length?`<div class="v-br">${br.map(([k,v])=>`<div><b>${k}</b>${v}</div>`).join('')}</div>`:'')+'</li>';
  });
  return visShell(b,inCard,`<ol class="v-seq">${items.join('')}</ol>`,'<ol>'+alt.join('')+'</ol>');
}

/* ---- HIER ---- */
function hierNode(x){
  const k=x.children||[];
  return `<li><span class="v-node" style="${toneCss(x.tone,'l2')}"><b>${x.name}</b>${x.note?`<small>${x.note}</small>`:''}</span>${k.length?'<ul>'+k.map(hierNode).join('')+'</ul>':''}</li>`;
}
function hierAlt(x){
  const k=x.children||[];
  return `<li>${x.name}${x.note?': '+x.note:''}${k.length?'<ul>'+k.map(hierAlt).join('')+'</ul>':''}</li>`;
}
function renderHier(b,inCard){
  const o=b.o||{}, R=b.root;
  if(Array.isArray(R)){
    const top=o.top||'Wins', bottom=o.bottom||'Yields';
    const h=`<div class="v-ladder"><div class="v-axis" aria-hidden="true"><span>${top}</span><i></i><span>${bottom}</span></div><ol>`+
      R.map((r,i)=>`<li style="${toneCss(r[2],'l2')}"><span class="v-num">${i+1}</span><span><b>${r[0]}</b>${r[1]?`<small>${r[1]}</small>`:''}</span></li>`).join('')+'</ol></div>';
    const alt=`<p>From the top (${top}) to the bottom (${bottom}):</p><ol>`+R.map(r=>`<li>${r[0]}${r[1]?': '+r[1]:''}</li>`).join('')+'</ol>';
    return visShell(b,inCard,h,alt);
  }
  return visShell(b,inCard,`<ul class="v-tree">${hierNode(R)}</ul>`,`<ul>${hierAlt(R)}</ul>`);
}

/* ---- VENN ---- */
function renderVenn(b,inCard){
  const o=b.o||{}, S=(b.sets||[]).slice(0,3), three=S.length===3;
  const G=three?{vb:'0 0 300 270',c:[[115,100],[185,100],[150,160]],r:72,nm:[[60,22],[240,22],[150,258]],reg:{A:[82,82],B:[218,82],C:[150,207],AB:[150,74],AC:[110,150],BC:[190,150],ABC:[150,122]}}
               :{vb:'0 0 300 200',c:[[110,108],[190,108]],r:80,nm:[[70,18],[230,18]],reg:{A:[68,108],B:[232,108],AB:[150,108]}};
  const idx={A:0,B:1,C:2}, deft=['l1','l3','l2'];
  const regs=[];
  S.forEach((s,i)=>{ if((s.items||[]).length) regs.push({k:'ABC'[i],name:plain(s.name)+' only',items:s.items}); });
  (o.overlaps||[]).forEach(v=>{
    const k=String(v.sets||'').toUpperCase().split('').filter(c=>idx[c]!=null&&idx[c]<S.length).sort().join('');
    if(k.length<2||!G.reg[k]||!(v.items||[]).length) return;
    regs.push({k,name:v.name||(k.length===3?'All three':andList(k.split('').map(c=>plain(S[idx[c]].name)))),items:v.items});
  });
  let svg=`<svg viewBox="${G.vb}" role="img" aria-label="${attrq('Overlapping circles for '+andList(S.map(s=>plain(s.name)))+'; the numbered regions are listed beside the drawing.')}" focusable="false">`;
  S.forEach((s,i)=>{const k=TONES[s.tone]||TONES[deft[i]];svg+=`<circle cx="${G.c[i][0]}" cy="${G.c[i][1]}" r="${G.r}" style="fill:var(${k[0]});fill-opacity:.14;stroke:var(${k[0]});stroke-width:2"/>`;});
  S.forEach((s,i)=>{svg+=`<text x="${G.nm[i][0]}" y="${G.nm[i][1]}" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-weight:700">${esc(plain(s.name))}</text>`;});
  regs.forEach((r,n)=>{const [x,y]=G.reg[r.k];svg+=`<circle cx="${x}" cy="${y}" r="11" style="fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5"/><text x="${x}" y="${y+4}" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-weight:700">${n+1}</text>`;});
  svg+='</svg>';
  const list=`<ol class="v-regions">${regs.map((r,n)=>`<li><span class="v-num">${n+1}</span><span><b>${r.name}:</b> ${andList(r.items)}</span></li>`).join('')}</ol>`;
  const alt=`<p>Sets: ${andList(S.map(s=>plain(s.name)))}.</p><ul>${regs.map(r=>`<li>${r.name}: ${dot(andList(r.items))}</li>`).join('')}</ul>`;
  return visShell(b,inCard,`<div class="v-venn">${svg}${list}</div>`,alt);
}

/* ---- SCALE ---- */
function renderScale(b,inCard){
  const p=b.spec||{};
  if(p.cells){
    const X=p.x||[''], Y=p.y||[''], nc=X.length-1;
    const cell=c=>Array.isArray(c)?c:[c,'',''];
    let h=`<div class="v-scroll"><table class="v-mx" style="min-width:${(4.6+nc*6.4).toFixed(1)}em"><colgroup><col style="width:4.6em">${'<col>'.repeat(nc)}</colgroup><thead><tr><td></td><th scope="colgroup" colspan="${nc}" class="v-ax">${X[0]}</th></tr>`+
      `<tr><th scope="col" class="v-ax">${Y[0]}</th>${X.slice(1).map(t=>`<th scope="col" class="v-xt">${t}</th>`).join('')}</tr></thead><tbody>`;
    const alt=[];
    p.cells.forEach((row,ri)=>{
      h+=`<tr><th scope="row" class="v-yt">${Y[ri+1]||''}</th>`;
      row.forEach((c,ci)=>{
        const [t,n,tone]=cell(c);
        h+=`<td class="v-cell" style="${toneCss(tone,'l2')}"><b>${t}</b>${n?`<small>${n}</small>`:''}</td>`;
        alt.push(`<li>${Y[0]} ${plain(Y[ri+1]||'')}, ${X[0]} ${plain(X[ci+1]||'')}: <b>${t}</b>${n?' ('+n+')':''}</li>`);
      });
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    return visShell(b,inCard,h,'<ul>'+alt.join('')+'</ul>');
  }
  const B=p.bands||[];
  const h=`<div class="v-range${B.length>5?' v-many':''}"><div class="v-ends" aria-hidden="true"><span>${p.from||''}</span><i></i><span>${p.to||''}</span></div><div class="v-bands">`+
    B.map(([l,n,t,w])=>`<div class="v-band" style="${toneCss(t,'l2')};--w:${+w||1}"><b>${l}</b>${n?`<small>${n}</small>`:''}</div>`).join('')+'</div></div>';
  const alt=`<p>From ${p.from||'the start'} to ${p.to||'the end'}:</p><ol>`+B.map(([l,n])=>`<li>${l}${n?': '+n:''}</li>`).join('')+'</ol>';
  return visShell(b,inCard,h,alt);
}

/* ---- quiz: a growth check ----
   An item is [question, options, correctIndex, why], with an optional fifth element {whys, imp, c}: whys holds one
   reason per option (why it is right, or why another answer fits better), imp is 'core' (Core skill) or 'good'
   (Good to know), and c names the item's Study Map concept. Only a Check button grades: "I'm sure" or "I'm guessing";
   choosing an option, or moving through the options with the arrow keys, never grades. The first checked answer
   and its confidence set the item's result: Strong (right and sure), Revisit (right on a guess), or Explore (worth
   learning next). After a check every option opens its reason, which never changes the result. "Try this quiz again"
   stores each later attempt apart: it never lowers a result, raises it to Revisit at most on the first check's day,
   and to Strong only on another day. The end of the quiz lists "Where to invest next". Saved as {done, score, total,
   r}; older {done, score, total} records keep their completion and score, which only ever rise. ---- */
const RESULT=['Explore','Revisit','Strong'];
/* today's calendar day in this browser, as YYYYMMDD: a later check on another day can make an item Strong */
function quizDay(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function quizMeta(it){ const m=it&&it[4]; return m&&typeof m==='object'&&!Array.isArray(m)?m:{}; }
/* r[i] is [first answer, sure (1 or 0), result (0 to 2), later attempts, the first check's day (YYYYMMDD)]. Later
   attempts ([answer, sure, day], the last five) sit apart and never change the first answer. An older
   [answer, sure, result] record reads as checked on an earlier day. */
function quizRecord(b){
  const s=store.get(b.id);
  const rec=s&&typeof s==='object'&&!Array.isArray(s)?Object.assign({},s):{};
  const r=Array.isArray(rec.r)?rec.r.slice(0,b.items.length):[];
  for(let i=0;i<b.items.length;i++){
    const x=r[i], n=b.items[i][1].length, okAns=a=>Number.isInteger(a)&&a>=0&&a<n;
    if(!(Array.isArray(x)&&okAns(x[0]))){ r[i]=null; continue; }
    const later=Array.isArray(x[3])?x[3].filter(a=>Array.isArray(a)&&okAns(a[0])).slice(-5).map(a=>[a[0],a[1]?1:0,Number.isInteger(a[2])?a[2]:0]):[];
    r[i]=[x[0],x[1]?1:0,Math.max(0,Math.min(2,x[2]|0)),later,Number.isInteger(x[4])?x[4]:0];
  }
  rec.r=r;
  return rec;
}
/* the first check sets the item's result. A later attempt never lowers it; on the first check's calendar day it raises
   the result to Revisit at most, and Strong needs a later check on another day (spaced retrieval). quizCapped tells
   the caller that this attempt was right and sure, and Strong now waits for another day. */
let quizCapped=false;
function quizSaveItem(b,qi,ans,sure){
  store.load();
  const rec=quizRecord(b), today=quizDay();
  const nat=ans===b.items[qi][2]?(sure?2:1):0;
  const was=rec.r[qi];
  quizCapped=false;
  if(!was) rec.r[qi]=[ans,sure?1:0,nat,[],today];
  else{
    const sameDay=!!was[4]&&was[4]===today, lv=sameDay?Math.min(nat,1):nat;
    quizCapped=sameDay&&nat>lv&&was[2]<nat;
    rec.r[qi]=[was[0],was[1],Math.max(was[2],lv),was[3].concat([[ans,sure?1:0,today]]).slice(-5),was[4]];
  }
  const T=b.items.length, n=rec.r.filter(Boolean).length, right=rec.r.filter(x=>x&&x[2]>=1).length;
  if(n===T){
    if(!(rec.total>0)||!(rec.score>=0)||right/T>=rec.score/rec.total){ rec.score=right; rec.total=T; }
    rec.done=true;
  }
  store.set(b.id,rec);
  refreshChrome();
  return rec;
}
/* an item that waits for another day: a later attempt was right and sure, and the result is still short of Strong */
function quizWaits(it,x){ return !!x&&x[2]<2&&Array.isArray(x[3])&&x[3].some(a=>a[0]===it[2]&&a[1]); }
const shortText=(s,n)=>{ s=plain(s); if(s.length<=n) return s; const k=s.lastIndexOf(' ',n); return s.slice(0,k>20?k:n)+'…'; };
/* the unit that teaches an item: its first #grade/unit link, or the unit this quiz sits in */
function teachLink(it){
  const m=quizMeta(it);
  const src=[it[3]].concat(Array.isArray(m.whys)?m.whys:[]).join(' ');
  const x=/href="#([a-z]+)\/([a-z]+[0-9]+)"[^>]*>([^<]*)</.exec(src);
  if(x){
    const L=levelById(x[1]), U=L&&L.units.find(u=>u.id===x[2]);
    return {href:'#'+x[1]+'/'+x[2],text:'Review: '+(U?U.title:plain(x[3]).replace(/^Review:\s*/,''))};
  }
  if(current.page==='level'){
    const L=levelById(current.level), U=L&&L.units.find(u=>u.id===current.unit);
    if(U) return {href:'#'+L.id+'/'+U.id,text:'Review: '+U.title};
  }
  return null;
}

  const groups=[], by={};

function quizInvest(b,r,box){

  const seen={},list=[];

    const x=r[qi]; if(!x||x[2]>=2) return;
    const m=quizMeta(it), key=m.c?'c:'+m.c:'q:'+qi, imp=IMP_RANK[m.imp]!=null?IMP_RANK[m.imp]:1, wait=quizWaits(it,x);

    seen[key]={qi,lv:x[2],imp,m,it,wait}; list.push(seen[key]);
  });
  list.sort((a,c)=>a.imp-c.imp||a.lv-c.lv||a.qi-c.qi);
  box.innerHTML='';
  box.hidden=false;
  box.appendChild(el('h4',null,'Where to invest next'));

      const mine=shown[qi]?shown[qi][0]:-1;
      const lab=oi===correct?'Why it is right:':oi===mine?'What this option does:':'Why another answer fits better:';
      let w=String(whys[oi]);
      if(oi===correct) w=w.replace(/^Right[:,.]?\s*/,'').replace(/^[a-z]/,ch=>ch.toUpperCase());
      ow.innerHTML=`<b>${lab}</b> ${w}`;
      ow.hidden=false;
    }
    /* first: the answer shown; lv: the map's result; att: null for a first check (or a restore), 'later' for a later
       attempt, and 'wait' for a later attempt right and sure on the first check's day */
    function showChecked(first,lv,att){
      labs.forEach((l,k)=>{ l.classList.toggle('right',k===correct); l.classList.toggle('wrong',k===first[0]&&first[0]!==correct); });
      whyBox.hidden=false;
      openWhy(first[0]); if(first[0]!==correct) openWhy(correct);
      sure.hidden=true;guess.hidden=true;
      const nat=first[0]===correct?(first[1]?2:1):0;
      res.className='pill qres lv'+lv;
      let t;
      if(!att) t=RESULT[lv]+': '+(lv>nat?'raised on a later try.':DESC[lv])+(quizWaits(it,first)?' A check on another day can make it Strong.':'');
      else{ const d=DESC[nat]; t=d.charAt(0).toUpperCase()+d.slice(1)+' Your map '+(lv>nat?'keeps ':'shows ')+RESULT[lv]+(att==='wait'?' until a check on another day makes it Strong.':'.'); }
      res.textContent=t+(whys?' Choose any other option to read its reason.':'');
    }
    function check(isSure){
      const sel=labs.findIndex(l=>l.querySelector('input').checked);
      if(sel<0){ res.className='pill qres'; res.textContent='Choose an answer first, then check it.'; return; }
      const had=!!quizRecord(b).r[qi];
      const rec=quizSaveItem(b,qi,sel,isSure);
      shown[qi]=[sel,isSure?1:0];
      showChecked(shown[qi],rec.r[qi][2],had?(quizCapped?'wait':'later'):null);
      labs[sel].querySelector('input').focus();
      drawFoot();
    }
    sure.addEventListener('click',()=>check(true));
    guess.addEventListener('click',()=>check(false));
    const was=rec0.r[qi];
    if(was&&!fresh){ shown[qi]=was; labs[was[0]].querySelector('input').checked=true; showChecked(was,was[2],null); }
    c.appendChild(q1);
  });
  again.addEventListener('click',()=>{ const n=renderQuiz(b,true); renderReplace(c,n); const f=n.querySelector('input[type=radio]'); if(f) f.focus(); });
  foot.append(score,again);
  c.append(foot,invest);
  function drawFoot(){
    const rec=quizRecord(b), r=rec.r, T=b.items.length;
    const n=r.filter(Boolean).length, cnt=[0,0,0];
    r.forEach(x=>{ if(x) cnt[x[2]]++; });
    again.hidden=!shown.some(Boolean);
    if(!n&&rec.done&&rec.total){ score.textContent=`Completed earlier with ${rec.score} of ${rec.total} right. Check each item to build your map.`; score.className='pill ok'; }
    else if(!n){ score.textContent=`${T} item${T===1?'':'s'} to check`; score.className='pill'; }
    else { score.textContent=(n<T?`Checked ${n} of ${T}. `:'Your map: ')+`Strong ${cnt[2]}, Revisit ${cnt[1]}, Explore ${cnt[0]}`; score.className='pill'+(cnt[2]===T?' ok':''); }
    if(n===T) quizInvest(b,r,invest); else invest.hidden=true;
  }
  drawFoot();
  return c;
}

/* ---- match: choose an item, then its partner; every step updates the status. A matched pair reads "Pair N" on both
   items, the pressed item reads "Selected", and a miss shows its status and reason right under the tapped partner
   (the status line reads the reason to screen readers too) ---- */
function renderMatch(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">${b.bloom||'Understand'}</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));
  const grid=el('div','match');
  const left=b.pairs.map((p,i)=>({txt:p[0],i}));
  const right=shuffle(b.pairs.map((p,i)=>({txt:p[1],i})));
  const N=b.pairs.length;
  let sel=null, matched=0, note=null;
  const colL=el('div','mcol'), colR=el('div','mcol');
  colL.setAttribute('role','group');colL.setAttribute('aria-label','Items');
  colR.setAttribute('role','group');colR.setAttribute('aria-label','Partners');
  const mk=(o,side,col)=>{ const btn=el('button','mi',`<span class="mt">${o.txt}</span>`);btn.type='button';btn.setAttribute('aria-pressed','false');btn.addEventListener('click',()=>pick(side,o.i,btn));btn.addEventListener('animationend',()=>btn.classList.remove('shake'));col.appendChild(btn);return btn; };
  left.forEach(o=>mk(o,'L',colL));
  right.forEach(o=>mk(o,'R',colR));
  grid.append(colL,colR);
  c.appendChild(grid);
  const status=el('div','row');const pill=el('span','pill');pill.setAttribute('role','status');status.appendChild(pill);c.appendChild(status);
  const explain=b.pairs.some(p=>p[2]);
  const say=(t,cls,extra)=>{ pill.textContent=t; if(extra){ const s=el('span','sr'); s.textContent=' '+extra; pill.appendChild(s); } pill.className='pill'+(cls?' '+cls:''); };
  const press=(btn,on)=>{
    btn.classList.toggle('sel',on); btn.setAttribute('aria-pressed',on?'true':'false');
    let t=btn.querySelector('.msel');
    if(on&&!t){ t=el('span','msel','Selected'); t.setAttribute('aria-hidden','true'); btn.appendChild(t); }
    else if(!on&&t) t.remove();
  };
  /* each tap clears the last miss: its shake and its note */
  const calm=()=>{ grid.querySelectorAll('.mi.shake').forEach(x=>x.classList.remove('shake')); if(note){ note.remove(); note=null; } };
  function pick(side,i,btn){
    if(btn.classList.contains('done')) return;
    calm();
    if(sel&&sel.btn===btn){ press(btn,false); sel=null; say(`${matched} of ${N} matched.`); return; }
    if(!sel||sel.side===side){
      if(sel) press(sel.btn,false);
      sel={side,i,btn}; press(btn,true);
      say(`Selected. Now choose its partner in the other column. ${matched} of ${N} matched.`);
      return;
    }
    if(sel.i===i){
      press(sel.btn,false);
      matched++;
      [sel.btn,btn].forEach(x=>{ x.classList.add('done'); x.setAttribute('aria-disabled','true'); x.removeAttribute('aria-pressed'); x.insertAdjacentHTML('beforeend',`<span class="mpair"><span aria-hidden="true">✓ </span>Pair ${matched}</span>`); });
      sel=null;
      if(matched===N){ say('All matched','ok'); store.set(b.id,{done:true}); refreshChrome(); }
      else say(`Matched. ${matched} of ${N} matched.`,'ok');
    } else {
      const a=sel.btn;
      press(a,false); a.classList.add('shake'); btn.classList.add('shake');
      setTimeout(()=>{ a.classList.remove('shake'); btn.classList.remove('shake'); },500);
      const ri=side==='R'?i:sel.i, p=b.pairs[ri];
      sel=null;
      const st=`Try a different pair. ${matched} of ${N} matched.`;
      say(st,'',explain?plain(`${p[1]} goes with ${p[0]}. ${p[2]||''}`):'');
      note=el('div','mnote');
      const sb=el('b',null,esc(st));sb.setAttribute('aria-hidden','true');note.appendChild(sb);
      if(explain) note.appendChild(el('div','why',`<b>${p[1]}</b> goes with <b>${p[0]}</b>. ${p[2]||''}`));
      btn.after(note);
    }
  }
  if(isDone(b.id)) say('Completed before. Play again anytime.','ok'); else say(`${N} pairs to match.`);
  return c;
}

/* ---- spot the problem: each line is a button (pressed = flagged); after Check each line's reason opens right
   under it. A line is [text, null | why it weakens the system, optional why a safe line is fine]. ---- */
function renderSpot(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Analyze</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));
  const box=el('div','spot');
  const list=el('div','sp-lines');
  list.setAttribute('role','group');list.setAttribute('aria-label','Lines to review. Press a line to flag it.');
  const flagged=new Set();
  let checked=false;
  const row=el('div','row');
  const check=el('button','btn sm','Check');check.type='button';
  const reset=el('button','btn sec sm','Reset');reset.type='button';
  const pill=el('span','pill');pill.setAttribute('role','status');
  const say=(t,cls)=>{ pill.textContent=t; pill.className='pill'+(cls?' '+cls:''); };
  const rows=b.lines.map((ln,i)=>{
    const L=Array.isArray(ln)?ln:[ln,null];
    const text=String(L[0]==null?'':L[0]), why=L[1], fine=L[2];
    const btn=el('button','sl');btn.type='button';btn.setAttribute('aria-pressed','false');
    btn.innerHTML=`<span class="sl-t">${spotText(text)||' '}</span><span class="sl-tag"></span>`;
    const ex=el('div','sl-why');ex.hidden=true;
    btn.addEventListener('click',()=>{
      if(checked) return;
      const on=!flagged.has(i);
      if(on) flagged.add(i); else flagged.delete(i);
      btn.classList.toggle('flag',on);
      btn.setAttribute('aria-pressed',on?'true':'false');
      btn.querySelector('.sl-tag').textContent=on?'Flagged':'';
      say(`${flagged.size} line${flagged.size===1?'':'s'} flagged`);
    });
    const r=el('div','sp-row');r.append(btn,ex);list.appendChild(r);
    return {btn,ex,why,fine,text};
  });
  box.appendChild(list);
  c.appendChild(box);
  row.append(check,reset,pill);
  c.appendChild(row);
  c.appendChild(el('div','legend','After Check, each finding’s reason opens right under its line.'));
  check.addEventListener('click',()=>{
    checked=true;box.dataset.checked='1';
    let hits=0,total=0;
    rows.forEach((r,i)=>{
      const on=flagged.has(i), tag=r.btn.querySelector('.sl-tag');
      r.btn.className='sl';r.btn.setAttribute('aria-disabled','true');
      if(r.why){
        total++;
        if(on){ hits++; r.btn.classList.add('hit'); tag.textContent='✓ Found'; }
        else { r.btn.classList.add('miss'); tag.textContent='Finding: read why'; }
        r.ex.innerHTML=r.why; r.ex.className='sl-why is-find'; r.ex.hidden=false;
      } else if(on){
        r.btn.classList.add('false'); tag.textContent='Safe line';
        r.ex.innerHTML=r.fine||(SPOT_PROMPT.test(r.text)?'A prompt line names the command; the evidence is in the output under it.':'This line is safe as written.'); r.ex.className='sl-why'; r.ex.hidden=false;
      } else tag.textContent='';
    });
    const falses=[...flagged].filter(i=>!rows[i].why).length;
    say(`Found ${hits} of ${total} findings`+(falses?`; ${falses} safe line${falses>1?'s':''} flagged`:''),hits===total&&!falses?'ok':'');
    if(hits===total&&!falses){ store.set(b.id,{done:true}); refreshChrome(); }
  });
  reset.addEventListener('click',()=>{ const n=renderSpot(b); renderReplace(c,n); const f=n.querySelector('.sl'); if(f) f.focus(); });
  if(isDone(b.id)) say('Completed before.','ok');
  return c;
}
/* a redrawn block keeps its place: its outline id, its section, and its Read aloud button */
function renderReplace(oldNode,newNode){
  if(oldNode.id&&!newNode.id) newNode.id=oldNode.id;
  ['sx','sxh'].forEach(k=>{ if(oldNode.dataset[k]!=null) newNode.dataset[k]=oldNode.dataset[k]; });
  if(oldNode.classList.contains('sx-off')) newNode.classList.add('sx-off');
  oldNode.replaceWith(newNode);
  if(newNode.parentElement===main) flowRaAdd(newNode);
}

/* ---- order / sequence: tap steps into place, then Check. Every step shows its reason after a check. On the first
   failed check a step to move says only which way it goes ("Comes earlier" or "Comes later"); from the second failed
   check on it names the step where it belongs, and the full order opens on request. Marks stay with their step, so
   taking one step out clears only its own mark; the full order stays until the next Check. Focus stays on the list
   after every tap. ---- */
/* a layer stack (o.layers) is built from the top down and numbered the same way, so the first pick is layer N
   (layer 7 for OSI) and each number names the layer that belongs there; other orders number their steps from 1 */
function renderOrder(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">${b.bloom||'Apply'}</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));
  const N=b.items.length, L=!!(b.o&&b.o.layers), noun=L?'layer':'step', num=pos=>L?N-pos:pos+1;
  const wrap=el('div','ord');
  const poolH=el('h4',null,L?'Layers (tap to add, from the top down)':'Steps (tap to add in order)');
  const pool=el('div','pool');
  const seqH=el('h4',null,L?'Your stack, top to bottom':'Your sequence');
  const seq=el('div','seq');
  wrap.append(poolH,pool,seqH,seq);
  c.appendChild(wrap);
  const order=shuffle(b.items.map((it,i)=>({it,i})));
  /* marks: each step's result from the last Check, by step; fails: the failed checks so far */
  let chosen=[], marks=new Map(), fails=0;
  const grp=i=>(b.items[i][2]!=null?b.items[i][2]:i);
  const spots=ci=>b.items.map((x,k)=>k).filter(k=>grp(k)===grp(ci));
  const row=el('div','row');
  const check=el('button','btn sm','Check order');check.type='button';
  const reset=el('button','btn sec sm','Reset');reset.type='button';
  const count=el('span','pill ocount');count.setAttribute('aria-live','polite');
  const pill=el('span','pill');pill.setAttribute('role','status');
  row.append(check,reset,count,pill);
  c.appendChild(row);
  const whyWrap=el('div');c.appendChild(whyWrap);
  /* after a redraw, focus goes to the button now at the tapped spot (or the nearest one) */
  function refocus(box,k){
    const bs=[...box.querySelectorAll('button.oi')];
    const t=bs[Math.min(k,bs.length-1)]||(box===pool?seq:pool).querySelector('button.oi')||check;
    t.focus();
  }
  function drawPool(){
    pool.innerHTML='';
    order.forEach(o=>{
      if(chosen.includes(o.i)) return;
      const btn=el('button','oi',`<span class="n" aria-hidden="true">+</span><span><span class="sr">Add: </span>${o.it[0]}</span>`);
      btn.type='button';
      btn.addEventListener('click',()=>{ const k=[...pool.querySelectorAll('button.oi')].indexOf(btn); chosen.push(o.i); redraw(); refocus(pool,k); });
      pool.appendChild(btn);
    });
    if(!pool.children.length) pool.appendChild(el('p','sum',`Every ${noun} is placed. Check the order, or tap a ${noun} below to take it out.`));
  }
  function drawSeq(){
    seq.innerHTML='';
    chosen.forEach((ci,pos)=>{
      const it=b.items[ci], m=marks.get(ci);
      const w=el('div','ost');
      const btn=el('button','oi'+(m?(m.ok?' ok':' off'):''),`<span class="n" aria-hidden="true">${num(pos)}</span><span><span class="sr">${L?'Layer':'Step'} ${num(pos)}: </span>${it[0]}</span>`);
      btn.type='button';btn.title='Tap to take it out';
      btn.addEventListener('click',()=>{ chosen.splice(pos,1); marks.delete(ci); redraw(); refocus(seq,pos); });
      w.appendChild(btn);
      if(m){
        const lead=m.ok?'In place.':(m.dir==='earlier'?(L?'Sits higher':'Comes earlier'):m.dir==='later'?(L?'Sits lower':'Comes later'):'Belongs at another '+noun)+(m.at?`: ${noun} ${m.at}.`:'.');
        const r=el('div','oreason'+(m.ok?' ok':''),`<b>${lead}</b> ${it[1]}`);
        r.id=b.id+'-or'+ci; btn.setAttribute('aria-describedby',r.id);
        w.appendChild(r);
      }
      seq.appendChild(w);
    });
    count.textContent=`Placed ${chosen.length} of ${N}`;
  }
  /* a change to the sequence clears the last check's message ("Completed before." stays); marks on the steps left in
     place and the full order stay until the next Check */
  function redraw(){
    drawPool(); drawSeq();
    if(pill.textContent!=='Completed before.'){ pill.textContent=''; pill.className='pill'; }
  }
  check.addEventListener('click',()=>{
    if(chosen.length<N){ pill.textContent=`Place every ${noun} first: ${N-chosen.length} to go`; pill.className='pill'; return; }
    const res=chosen.map((ci,pos)=>({ci,pos,ps:spots(ci)}));
    res.forEach(x=>{ x.ok=x.ps.includes(x.pos); });
    const ok=res.every(x=>x.ok), right=res.filter(x=>x.ok).length;
    if(!ok) fails++;
    marks=new Map();
    res.forEach(x=>{
      const lo=Math.min(...x.ps), hi=Math.max(...x.ps);
      /* a layer's reason already names its layer, so only steps get the "belongs at" hint */
      marks.set(x.ci,{ok:x.ok,dir:x.ok?null:x.pos<lo?'later':x.pos>hi?'earlier':null,at:!x.ok&&fails>1&&!L?x.ps.map(num).join(' or '):''});
    });
    drawSeq();
    whyWrap.innerHTML='';
    if(ok){ pill.textContent='Perfect order'; pill.className='pill ok'; store.set(b.id,{done:true}); refreshChrome(); whyWrap.appendChild(el('p','sum',`Each ${noun} shows why it sits where it does.`)); }
    else{
      pill.textContent=`${right} of ${N} ${noun}s in place`; pill.className='pill';
      whyWrap.appendChild(el('p','sum',L?'Each layer shows its reason, which names its layer, and each layer to move says whether it sits higher or lower. Tap it to take it out, place it again, and check.':fails>1?'Each step shows its reason, and each step to move now names the step where it belongs. Tap it to take it out, place it again, and check.':'Each step shows its reason, and each step to move says whether it comes earlier or later. Tap it to take it out, place it again, and check.'));
      if(fails>1){
        const d=el('details','ofull');d.innerHTML='<summary>Show the full order with every reason</summary>';
        b.items.forEach((it,i)=>d.appendChild(el('div','why',`<b>${L?'':num(i)+'. '}${it[0]}.</b> ${it[1]}`)));
        whyWrap.appendChild(d);
      }
    }
  });
  reset.addEventListener('click',()=>{ chosen=[]; marks=new Map(); whyWrap.innerHTML=''; pill.textContent=''; pill.className='pill'; redraw(); const f=pool.querySelector('button.oi'); if(f) f.focus(); });
  redraw();
  if(isDone(b.id)){ pill.textContent='Completed before.'; pill.className='pill ok'; }
  return c;
}

/* ---- Move your progress: a progress code carries completed activities between browsers, devices, and saved copies.
   Code: DL1-<entries>-<check>. Entries are the activity ids in sorted order, joined by ".", each written as one
   base-36 digit (how many leading characters it shares with the previous id) and the rest of the id; then
   *score/total for a quiz, +steps (base-36 step numbers) for a lab, and ~ for an activity still in progress.
   <check> is the 32-bit FNV-1a hash of "DL1-<entries>" in base 36, six characters. The code holds activity ids,
   quiz scores, and lab steps only: reflections, checklists, plans, and the scorecard stay in this browser. ---- */
/* My progress redraws its totals when another tab saves (the storage listener calls it while that page is open) */
let progressRedraw=null;
const PCODE_V=1;
const PCODE_ID=/^[a-z][a-z0-9]{0,30}$/;
function pcodeCheck(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return (h%2176782336).toString(36).padStart(6,'0');}
function progressEntries(src){
  const out={};
  Object.keys(src).sort().forEach(id=>{
    const v=src[id];
    if(!PCODE_ID.test(id)||!v||typeof v!=='object') return;
    const ticks=Array.isArray(v.ticks)?[...new Set(v.ticks.filter(n=>Number.isInteger(n)&&n>=0&&n<36))].sort((a,b)=>a-b):[];
    if(!v.done&&!ticks.length) return;
    const e={done:!!v.done};
    if(Number.isInteger(v.score)&&Number.isInteger(v.total)&&v.total>0&&v.score>=0&&v.score<=v.total){e.score=v.score;e.total=v.total;}
    if(ticks.length) e.ticks=ticks;
    out[id]=e;
  });
  return out;
}
function makeProgressCode(){
  let prev='';
  const parts=Object.entries(progressEntries(MEM)).map(([id,e])=>{
    let k=0; while(k<35&&k<prev.length&&prev[k]===id[k]) k++;

    return k.toString(36)+id.slice(k)+(e.score!=null?'*'+e.score+'/'+e.total:'')+(e.ticks?'+'+e.ticks.map(n=>n.toString(36)).join(''):'')+(e.done?'':'~');
  });

function readProgressCode(text){
  const s=String(text||'').replace(/\s+/g,'');
  if(!s) return {error:'Paste a progress code first.'};
  const damaged={error:'This code is incomplete or changed. Copy the whole code again, from DL1- to its last character.'};
  /* the code is found inside whatever was pasted (quotes or a "Code:" label from a chat or email are fine);
     text that starts like a code but ends early counts as a damaged code. A code is lower case after DL; a paste
     that changed the case still reads, and the checksum still guards it */
  const m=/DL(\d+)-([a-z0-9.*\/+~]*)-([a-z0-9]{6})(?![a-z0-9])/i.exec(s);
  if(!m) return /DL\d+-/i.test(s)?damaged:{error:'This text reads differently from a progress code. A code starts with DL1- and comes from My progress on Defense Ladder.'};
  if(+m[1]>PCODE_V) return {error:'This code comes from a newer Defense Ladder. Open the newest copy of the page and paste the code there.'};
  if(+m[1]!==PCODE_V) return {error:'This code uses an older format this page reads differently. Make a fresh code on the other browser and paste that one.'};
  m[2]=m[2].toLowerCase();m[3]=m[3].toLowerCase();
  if(pcodeCheck('DL'+m[1]+'-'+m[2])!==m[3]) return damaged;
  const out={}; let prev='';
  for(const part of m[2]?m[2].split('.'):[]){
    const p=/^([0-9a-z])([a-z0-9]*)(?:\*(\d{1,3})\/(\d{1,3}))?(?:\+([0-9a-z]{1,36}))?(~)?$/.exec(part);
    if(!p) return damaged;
    const k=parseInt(p[1],36);
    if(k>prev.length) return damaged;
    const id=prev.slice(0,k)+p[2];
    if(!PCODE_ID.test(id)||out[id]) return damaged;
    prev=id;
    const e={done:!p[6]};
    if(p[3]!=null&&+p[4]>0&&+p[3]<=+p[4]){e.score=+p[3];e.total=+p[4];}
    if(p[5]) e.ticks=[...new Set([...p[5]].map(c=>parseInt(c,36)))].sort((a,b)=>a-b);
    out[id]=e;
  }
  return {entries:out};
}
/* what an import adds: completions, lab steps, and better quiz scores; it never removes or lowers anything */
function planProgressMerge(entries){
  store.load();
  const labSteps={},gradeOf={};
  LEVELS.forEach(l=>l.units.forEach(u=>u.blocks.forEach(b=>{ if(b.id) gradeOf[b.id]=l.grade; if(b.t==='lab') labSteps[b.id]=b.steps.length; })));
  const changes={},added={},improved=[],other=[];let same=0;
  Object.entries(entries).forEach(([id,e])=>{
    const cur=MEM[id]&&typeof MEM[id]==='object'&&!Array.isArray(MEM[id])?MEM[id]:null;
    const next=Object.assign({},cur||{});
    let changed=false;
    if(e.ticks){
      const have=Array.isArray(next.ticks)?next.ticks:[];
      const t=new Set(have.concat(e.ticks.filter(n=>labSteps[id]==null||n<labSteps[id])));
      if(t.size>have.length){next.ticks=[...t].sort((a,b)=>a-b);changed=true;}
    }
    const done=e.done||(labSteps[id]!=null&&Array.isArray(next.ticks)&&next.ticks.length>=labSteps[id]);
    if(done&&!next.done){next.done=true;changed=true;}
    if(e.score!=null&&(!(next.total>0)||e.score/e.total>next.score/next.total)){next.score=e.score;next.total=e.total;changed=true;}
    if(!changed){same++;return;}
    changes[id]=next;
    if(!gradeOf[id]) other.push(id);
    else if(next.done&&!(cur&&cur.done)) added[gradeOf[id]]=(added[gradeOf[id]]||0)+1;
    else improved.push(id);
  });
  return {changes,added,improved,other,same,total:Object.keys(entries).length};
}

    if(!t||e.button||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey) return;

    if(t.matches('a.tu')&&menuEntry()){ e.preventDefault(); try{ history.replaceState(null,'',location.pathname+location.search+t.getAttribute('href')); }catch(x){} route(); }
  },true);
  document.addEventListener('keydown',e=>{
    if(!menuOpen) return;
