 {id:'j13',title:'Evidence that holds up: forensics, timelines, and sandboxes',bloom:'Analyze',sum:'Collect evidence in the right order, prove a copy is exact, read a process list from a memory image, merge many logs into one timeline, and read a sandbox report without running malware yourself.',
  can:'collect evidence in order, prove a copy is exact, read a process list from memory, build a timeline from many logs, and read a sandbox report',
  blocks:[
   C('Evidence that holds up','Analyze',
     P('Forensics answers what happened, when, and by whose account, in a form that survives a skeptical review. On October 14, an alert fired on HILO-WS03, the reception PC at Hilo Lehua Clinic. Keola collects the evidence; Kai analyzes it. Four rules:'),
     TIPS('<b>Most fragile first.</b> Collect what vanishes soonest.',
          '<b>Work on a copy.</b> Image the original once; analyze only the image.',
          '<b>Prove the copy.</b> Matching SHA-256 hashes show the image is exact (<a href="#sophomore/s6">hashing</a>).',
          '<b>Record every hand.</b> A chain-of-custody form lists who held each item, when, why, and its seal and hash.')),
   SCALE('Order of volatility (RFC 3227 order)',{from:'Gone first',to:'Lasts longest',bands:[
     ['1. CPU registers and cache','Change every instant; few tools capture them, so responders note them and move on.','bad'],
     ['2. Memory','Running processes, network connections, and ARP and routing tables. Gone at power-off.','bad',1.3],
     ['3. Temp files and swap','Temp folders, the page file, and swap. Overwritten within hours.','amber'],
     ['4. Disk','Files, deleted space, and local logs. Lasts weeks unless wiped.','l2'],
     ['5. Remote logs','Copies on the SIEM or syslog server, kept for the retention period.','l3'],
     ['6. Backups and archives','Offline copies that last months or years.','l4']]},
     {intro:'RFC 3227, the classic evidence-collection guide, sets the order: collect from most volatile to least.',
      note:'<b>Pulling the plug erases bands 1 and 2.</b> Each collection step changes a running machine a little, so run trusted tools from your own USB drive and log each one with its UTC time.',
      bloom:'Analyze'}),
   QUIZ('j13ck1','Check yourself',[
     ['HILO-WS03 is still running and may hold injected code. What do you capture first?',['Memory','The disk image','The Temp folder','Last night’s backup'],0,'In RFC 3227 order, memory comes before temp files and disk, and power-off erases it.',{whys:['Memory vanishes at power-off, so it comes first.','Disk lasts weeks, so it comes after memory.','Temp files come after memory in RFC 3227 order.','Backups last longest, so they come last.'],imp:'core',c:'det-forensics'}]
   ]),
   C('Image, hash, and hand off','Apply',
     SEQ(null,[
       ['Attach a write blocker','It lets the imaging tool read the evidence disk and blocks every write.','l1'],
       ['Image the disk','Copy every sector, including empty and deleted space, into one file on a separate, wiped drive.','l1'],
       ['Hash both','SHA-256 of the source disk and of the image.','l2'],
       {ask:'Do the hashes match?',branches:[['Yes','Record both on the custody form'],['No','Stop, note it, and re-image before anyone analyzes']]},
       ['Seal and label','Evidence bag, seal number, case number, item number, UTC time, and collector.','l3'],
       ['Sign the handoff','Each new holder signs with the time, the reason, and the seal number.','l3'],
       ['Store','A locked evidence locker with its own access log.','l4'],
       ['Re-hash before analysis','A match proves nothing changed since collection. Analyze the copy, never the original.','l4']
     ],{caption:'Copy, prove, and document: a gap anywhere lets anyone question the evidence.',bloom:'Apply'}),
     TERM('$ sudo sha256sum /dev/sdb\n9c1e5b7a0f…d40c44af  /dev/sdb\n$ sudo dd if=/dev/sdb of=/cases/2026-031/item1.img bs=4M status=progress\n256060514304 bytes (256 GB, 238 GiB) copied, 1912 s, 134 MB/s\n$ sha256sum /cases/2026-031/item1.img\n9c1e5b7a0f…d40c44af  /cases/2026-031/item1.img'),
     P('<code>if=</code> is the input (read) and <code>of=</code> the output (written). Swapped, dd overwrites the evidence without asking; the write blocker is the safety net.')),
   DETAIL('Imaging and analysis apps: FTK Imager and Autopsy',

   ORDER('j13o','Rank the evidence by volatility','Keola reaches the reception PC while it is still running. Tap the six sources from most volatile (collect first) to least, in RFC 3227 order. Each comes from a different band.',[
     ['The CPU’s registers and cache','Band 1, first: they change every instant, so they vanish before any other source.'],
     ['The process list and open connections in RAM','Band 2: memory outlasts the registers by moments, yet power-off wipes it, sooner than anything stored on disk.'],
     ['The page file and the Temp folder','Band 3: these live on disk, yet Windows overwrites them within hours, sooner than the rest of the disk.'],
     ['The PC’s SSD','Band 4: the rest of the disk lasts weeks unless wiped, longer than temp files and shorter than copies kept on other systems.'],
     ['Firewall logs already forwarded to the SIEM','Band 5: these copies already sit on the SIEM, out of the PC’s reach, and last for the retention period.'],
     ['Last month’s offline backup','Band 6, last: an offline backup changes least of all, so it can wait until every other source is safe.']
   ],'Analyze'),
   SPOT('j13sp','Find the gap in a custody form','Item 1 is the SSD from HILO-WS03. Tap every line that breaks the chain of custody, then Check.',[
     ['Case 2026-031 · Item 1: 256 GB SSD from HILO-WS03 · Oct 14',null],
     ['19:40 UTC  Removed after the memory capture · Keola',null,'Memory came first and the disk second, in volatility order, and the line names the time and the person.'],
     ['21:15 UTC  Source and image SHA-256 9c1e…44af · match',null,'Both hashes use SHA-256 and match, so the image was an exact copy at 21:15. The trouble starts with the later re-hash.'],
     ['21:18 UTC  Sealed in bag 0417 and labeled · Keola',null],
     ['21:21 UTC  Keola → Mele · to the lab · both signed',null,'A complete handoff: who gave it, who took it, when, why, and both signatures.'],
     ['22:53 UTC  Logged into evidence locker 3 by Noelani','No line records Mele handing the item to Noelani. For 92 minutes nobody can say who held it.'],
     ['Oct 15 08:05 UTC  Noelani → Kai · for analysis · both signed',null],
     ['Oct 15 08:06 UTC  Seal check: bag 0471 intact','The seal number differs from the 0417 recorded at collection. A typo or a different bag, it needs an explanation and initials before analysis.'],
     ['Oct 15 08:20 UTC  Re-hash of the working image: 9c1e…44b0','This hash differs from the 9c1e…44af taken at collection, so the image changed or the wrong file was hashed. Stop, record it, and make a new working copy from the verified master image, or re-image the sealed SSD through a write blocker.']
   ]),
   QUIZ('j13q','Check: evidence',[
     ['The source disk’s SHA-256 ends in 44af. Kai hashes the image with MD5 and gets 32 hex characters. Does that prove the copy is exact?',['Yes: any hash proves a copy','Only if the file sizes match too','No: hash the image with SHA-256 and compare like with like','No: hashes never prove a copy'],2,'Different algorithms give unrelated values. Compare SHA-256 with SHA-256. <a href="#sophomore/s6">Review: Investigation questions and the change log</a>',{whys:['Different algorithms give unrelated values, so compare like with like.','Equal sizes still allow different content.','Only the same algorithm gives comparable values: a SHA-256 of the image that ends in 44af proves the copy exact.','Matching hashes of one algorithm do prove an exact copy.'],imp:'core',c:'det-forensics'}],
     ['At 19:30 UTC the local Security log on HILO-WS03 was cleared (1102). Where does the timeline still find the 19:03 4688 event?',['In the copy forwarded to the collector and the SIEM','Nowhere: clearing erased it','In the page file','In the firewall log'],0,'Clearing erases only the local copy; forwarded events survive, and the 1102 reaches the collector too. <a href="#junior/j8">Review: Windows: logons, tokens, and the event trail</a>',{whys:['Forwarded copies on the collector and SIEM survive a local clear.','Clearing erases only the local copy.','The page file holds memory scraps, apart from the event log.','The firewall log records traffic, apart from process events.'],imp:'core',c:'det-timelines'}],
     ['In the memory listing, notepad.exe (PID 7012, PPID 6512) owns an open connection to 203.0.113.77:443. What does that most likely mean?',['Notepad is checking for updates','The System process borrowed the port','Port 443 is normal for every program','Code is hiding inside Notepad: keep the image and treat the address as an indicator'],3,'Follow each PPID to its parent: here PID 6512, upd.exe, runs from the Temp folder.',{whys:['Notepad rarely goes online, and its parent runs from Temp.','The System process owns the port 445 line; this one belongs to notepad.','Port 443 suits browsers; notepad holding it is odd.','A temp-folder parent plus an outside connection marks injected code.'],imp:'core',c:'det-memory'}],
     ['A sandbox ran an attachment for 240 seconds and reports no activity: “no threats found.” What do you conclude?',['The file is safe, so release it','It stayed quiet in that run only, so keep it blocked','The hash must be wrong','Run it on a staff PC to check'],1,'A quiet run leaves the question open; static triage and reputation come next.',{whys:['A quiet run proves little, so releasing the file is a gamble.','Samples can wait or detect a sandbox, so keep it blocked.','The hash names the file; the quiet run is about behavior.','Running it on a staff PC risks the clinic.'],imp:'core',c:'det-sandboxes'}],
     ['makani-web logged 2026-10-14T09:11:05-10:00. Where does it sit on a UTC timeline?',['09:11:05Z','19:11:05Z','23:11:05Z','Oct 13, 23:11:05Z'],1,'HST is UTC−10: add 10 hours. <a href="#sophomore/s10">Review: Read the logs: Windows, Linux, and network devices</a>',{whys:['This keeps the local time and drops the offset.','HST is UTC−10: add 10 hours for 19:11:05Z.','This adds 14 hours.','This subtracts 10 hours, the wrong way.'],imp:'core',c:'det-timelines'}],
     ['A patient’s lab-results file at the clinic looks suspicious. Which first step keeps the patient’s privacy?',['Upload it to a free public sandbox','Email it to a friend who knows malware','Look up its hash, then use a private sandbox if needed','Open it on the reception PC'],2,'A hash reveals nothing private. Free public sandboxes publish every upload.',{whys:['Free public sandboxes publish every upload.','Emailing it spreads private data and malware.','A hash lookup reveals nothing private.','Opening it at reception risks infection.'],imp:'core',c:'det-sandboxes'}]

 {id:'j12',title:'Respond to an incident: triage, contain, and recover',bloom:'Analyze',sum:'Read an alert field by field, weigh severity and confidence, choose a containment that keeps the evidence, remove every foothold, and restore from a backup you can trust.',

   QUIZ('j12ck1','Check yourself',[
     ['A rule with many past false alarms fires on the clinic file server: severity High, confidence Low. What fits?',['Close it, since confidence is low','Shut the server down','Investigate now: prove or clear it fast','Wait until it fires again'],2,'High severity earns a fast look even when the rule is noisy.',{whys:['Low confidence with high severity still earns a fast look.','Shutting down loses evidence before anything is proven.','High severity earns a fast look: prove or clear it.','Waiting gives a real attack time to spread.'],imp:'core',c:'det-triage'}]
   ]),
   C('Confirm, then scope','Analyze',
     TIPS('<b>Confirm it.</b> Open the raw events behind the alert. Each one either supports the rule or clears it.',
          '<b>Scope it.</b> Write one line: which hosts, which accounts, and since when. Follow every account and address to the next host.',
          '<b>Record the indicators.</b> Hashes, file paths, domains, and addresses, each with where and when it was found.',
          '<b>Set severity, then write it down.</b> Times in UTC, from the first minute; this log becomes the timeline.')),
   SPOT('j12sp','Spot what the responder missed','Before the case reached Keola, a first responder triaged the clinic alert and wrote the notes below its four raw events. Tap every raw event the notes ignore and every note the events disprove, then Check.',[
     ['ALERT  severity High · confidence Medium · HILO-WS03 · pua · 4 events',null],
     ['RAW 1  19:03:52Z  4688  powershell.exe -nop -w hidden …  creator WINWORD.EXE',null,'The notes already discuss this event, in the template note below; that note’s explanation is the line to question.'],
     ['RAW 2  19:03:58Z  4688  …\\AppData\\Local\\Temp\\upd.exe  creator powershell.exe','The download ran: a program from a temp folder, started by the hidden PowerShell. The notes never mention it.'],
     ['RAW 3  19:04:10Z  firewall  ALLOW 10.20.0.42:50412 → 203.0.113.77:443','An outside connection seconds later, a likely call home. Block the address and search every host for it.'],
     ['RAW 4  19:11:05Z  makani-web  sshd: Accepted password for pua from 10.20.0.42','Pua’s account reached a second server from the reception PC. Scope now covers two hosts and one account to reset.'],
     ['NOTE   Checked Defender history: no detection',null,'This note is accurate: Defender found nothing, since upd.exe was new and matched no signature. The events disprove the verdict, and this fact still stands.'],

   COMPARE('Four ways to contain',[
     {name:'Isolate the host',tag:'EDR network isolation',tone:'l2',rows:[['Stops','The PC reaching anything except the EDR console'],['Keeps','Memory, processes, and disk stay live for capture; live outside connections drop, so note them first when nothing is spreading'],['Costs','One PC out of service; the user moves to a spare']],hook:'a locked room with the lights on.'},
     {name:'Disable the account',tag:'directory or local',tone:'l3',rows:[['Stops','New sign-ins with the stolen password on every machine'],['Keeps','All evidence; also end open sessions'],['Costs','The person waits for a reset; a shared or service account can break apps']],hook:'a cancelled key.'},
     {name:'Block at the firewall',tag:'outside address or domain',tone:'l1',rows:[['Stops','Traffic to and from 203.0.113.77 for every host'],['Keeps','All evidence on the hosts'],['Costs','Little, yet the intruder can switch addresses, and inside traffic still flows']],hook:'a closed road.'},
     {name:'Shut down',tag:'power off',tone:'bad',rows:[['Stops','Everything on that machine'],['Keeps','Only the disk: memory, connections, and injected code are gone (<a href="#junior/j13">order of volatility</a>)'],['Costs','Lost evidence, and an encrypted disk needs its recovery key to open again']],hook:'burning the notebook.'}
   ],{intro:'Containment stops the spread before cleanup starts.',
     note:'<b>The clinic used three:</b> isolate HILO-WS03, disable pua’s account and end its sessions (it reached makani-web), and block 203.0.113.77 at the firewall.',
     bloom:'Analyze'}),
   DETAIL('When to isolate, and short- and long-term containment',
     P('When harm is spreading, as with ransomware, isolate first; when the host is quiet, record its connections, then isolate (as in <a href="#junior/j3">Debian and deeper Linux</a>).'),
     P('Short-term containment buys time; long-term containment, such as a temporary rule set, keeps check-in running while the fix is prepared.')),
   QUIZ('j12ck3','Check yourself',[
     ['Why does the team isolate HILO-WS03 instead of shutting it down?',['It keeps the memory evidence that power-off erases','Shutting down is slower','A shut-down PC can still spread malware','Isolation removes the malware'],0,'Memory comes early in RFC 3227 order and vanishes at power-off. <a href="#junior/j13">Review: Evidence that holds up: forensics, timelines, and sandboxes</a>',{whys:['Isolation keeps memory, which power-off erases.','Speed is beside the point; evidence is the reason.','A powered-off PC spreads nothing; the cost is lost memory.','Isolation stops traffic; eradication removes the malware.'],imp:'core',c:'det-containment'}]
   ]),
   C('Isolation: the lightest wall that holds','Analyze',
     P('Use the ladder from <a href="#freshman/f4">Computers, virtualization, and the network</a>: process, user account, sandbox, container, VM, own machine on its own segment, and air gap.'),
     P('<b>Two kinds of sandbox.</b> An <b>app sandbox</b>, such as a browser tab’s box or Office Protected View, is a light wall. An <b>analysis sandbox</b>, like the one in <a href="#junior/j13">Evidence that holds up</a>, is a disposable VM on an isolated network, so it sits at the VM level.'),
     TIPS('<b>Each containment works at one level.</b> EDR host isolation and the quarantine VLAN work at the network level: the PC keeps running and its traffic stops.',
          'Disabling the account works at the account level; the firewall block works at the network edge.',
          '<b>Before an incident</b>, the same ladder is design: guest Wi-Fi apart from clinic PCs, and the booking server in its own segment.',
          '<b>Choose the lightest level that contains the risk.</b> An unknown attachment opens in Protected View; a PC calling home gets host isolation; an unknown sample goes to an analysis sandbox.')),
   DETAIL('Containers, segments, and the quarantine VLAN',
     P('A container shares the host kernel, so its wall is thinner than a VM’s (<a href="#junior/j10">Cloud security: identity, storage, and logs</a>). Segments and the quarantine VLAN come from <a href="#junior/j6">Network security design</a>.')),

     {name:'Accounts',tone:'l3',children:[{name:'New local admin',note:'svc_update, created 19:06 UTC (4720, then 4732), possible because pua was a local admin',tone:'bad'},{name:'Reset passwords',note:'Pua’s, everywhere it works, and end every session',tone:'amber'}]},
     {name:'Way in',tone:'l3',children:[{name:'Patched entry point',note:'Patch Office, block macros in files from the internet by policy, and remove pua’s local admin rights',tone:'ok'}]}
   ]},{intro:'Eradication removes every trace and closes the door the intruder used.',

   QUIZ('j12ck2','Check yourself',[
     ['The team deleted upd.exe and closed the case. Two days later 203.0.113.77 is contacted again. What did they miss?',['A disk cleanup','The firewall log rotation','The scheduled task and Run key that restart it','The browser history'],2,'Persistence brings the file back. Remove every branch of the tree.',{whys:['A disk cleanup leaves the startup entries in place.','Log rotation leaves persistence untouched.','The task and Run key restart upd.exe: remove every branch.','Browser history records sites visited, apart from startup entries.'],imp:'core',c:'det-containment'}]
   ]),
   PATH('Restore from the last clean backup',[
     {name:'Last clean backup',tag:'Oct 14, 01:00 HST',tone:'ok',note:'The newest backup taken before the first sign of the intruder.',via:'data lost: about 8 hours, inside a one-day RPO'},
     {name:'First sign of the intruder',tag:'Oct 14, 09:20 HST',tone:'bad',note:'The timeline shows pua’s account, from HILO-WS03, copying upd.exe into a shared folder on HILO-FS01. The Oct 15 backup ran after this, so it may hold the intruder’s files.',via:'HILO-FS01 taken offline: downtime starts, and the RTO caps it'},
     {name:'Restore',tag:'onto a rebuilt server',tone:'l2',note:'Rebuild HILO-FS01 from a known-good image, patch it, then restore the data from the clean backup.',via:'then'},
     {name:'Verify',tag:'before staff return',tone:'l3',note:'Hashes match the backup catalog, a scan is clean, staff open sample files, and every reset account works.',via:'service verified: downtime ends'},
     {name:'Watch',tag:'the next 30 days',tone:'l4',note:'Extra logging, plus alerts on the case indicators: 203.0.113.77, cdn-update.example, and the hash of upd.exe.'}
   ],{intro:'Recovery returns systems to service and watches for a return. The first sign of the intruder decides which backup you trust.',
     note:'<b>RPO</b> (recovery point objective) is how much recent data the business accepts losing; <b>RTO</b> (recovery time objective) is how long it can be down. Nightly backups allow up to a day of loss, and only a timed restore test proves the RTO. A mirrored disk or spare server copies a deletion or encryption too, so redundancy never replaces a backup.',
     key:[['ok','Trusted'],['bad','Compromised']],
     caption:'Restoring a backup that already holds the intruder restarts the incident.',bloom:'Analyze'}),
   SEQ('Ransomware: the first hour',[
     ['Isolate','Take infected machines off the network (EDR isolation, or unplug the cable and turn off Wi-Fi) and leave them powered on: memory holds evidence, sometimes even keys.','bad'],
     ['Call the incident lead','The lead opens the case, assigns a scribe for a UTC log, and directs everything after.','l2'],
     {ask:'Can any infected machine reach the backups?',detail:'A backup share an infected PC can write to is encrypted next.',branches:[['Yes','Disconnect it now and lock down the offline or immutable copies'],['No','Confirm the last offline copy exists and opens']]},
     ['Preserve evidence','Photograph the ransom note, keep the note and a few encrypted files, capture memory, and export logs. Delete and wipe nothing.','l3'],
     ['Identify and scope','Name the strain from the note and the new file extension (look it up from a clean device), and find the first host and account.','l3'],
     ['Notify','Leadership, legal counsel, the cyber insurer, and law enforcement. Paying or contacting the criminals waits for legal advice.','l4']
   ],{bloom:'Analyze'}),
   ORDER('j12o','Order the first-hour steps','At 08:10 the office manager at Kona Hillside Roasters finds files renamed .locked and a ransom note on two PCs and the shared drive. Tap the first-hour steps in order.',[
     ['Unplug the network cables of the two PCs, turn off their Wi-Fi, and leave them on','First: every minute on the network lets the ransomware reach more files, and leaving the PCs on keeps their memory for the capture later.'],
     ['Phone the incident lead, who starts a UTC log and directs the next steps','Second, once the spread stops: a one-minute call puts one person in charge before anyone touches the backups or the evidence, so the UTC log records every later step.'],
     ['Disconnect the USB backup drive attached to the file server','Third: the backup is the way back, so it comes off the file server before the encryption reaches it, ahead of the slower evidence work.'],
     ['Photograph the note and capture memory on one infected PC','Fourth: with the spread stopped and the backup safe, the team preserves evidence before anything is cleaned, while the PCs left on still hold their memory.'],
     ['Look up the strain by the .locked extension from a clean laptop','Fifth: the photographed note and the .locked extension name the strain, which points to the first infected host and any known fix.'],
     ['Brief the owner, who brings in legal counsel and the insurer','Last: the owner, legal counsel, and the insurer decide with the facts the earlier steps gathered, and payment decisions wait for legal advice.']
   ],'Analyze'),
   SEQ('A hunt from hypothesis to finding',[
     ['Hypothesis','“If the intruder reached other clinic PCs, each would carry a new scheduled task.”','l1'],
     ['Pick the data','Event 4698 from every PC in the SIEM, plus each PC’s task list.','l2'],
     ['Search','Every 4698 since October 1, grouped by task name and host.','l2'],
     ['Compare to baseline','The known list holds the tasks Windows, Office, and the clinic’s apps create when they update; anything else needs an owner and a reason.','l3'],
     {ask:'Anything unexplained?',branches:[['Found','Open an incident and scope it'],['Clean','Record the hunt and turn the search into a detection rule']]}
   ],{intro:'A hunt starts from a hypothesis instead of an alert: it assumes a rule missed something (a false negative) and goes looking.',
     note:'Signatures catch the known; a hunt looks for the unknown by its behavior.',
     bloom:'Analyze'}),
   C('Runbooks and playbooks','Apply',
     P('A <b>runbook</b> is the step-by-step procedure for one task, such as “isolate a host in the EDR console” or “reset an account and end its sessions.” A <b>playbook</b> is the plan for one kind of incident, with decision points and who to call, and it calls runbooks along the way. The first-hour sequence above is a playbook.'),
     TIPS('Each use ends in <b>lessons learned</b>: what worked, what to change, and an owner for each change. Senior year writes the full playbook and after-action report (<a href="#senior/se13">Run the response</a>).')),
   QUIZ('j12q','Check: respond',[
     ['The SIEM alert on HILO-WS03 marked a real attack. Which detection outcome was it?',['False positive','True negative','False negative','True positive'],3,'Real attack, and the tool alerted. Closing it as harmless was a person’s mistake, not the tool’s. <a href="#freshman/f13">Review: Watch, detect, and respond</a>',{whys:['A false positive is an alert on something harmless.','A true negative is silence on harmless activity.','A false negative is a missed attack, and this one alerted.','A real attack that alerted is a true positive.'],imp:'core',c:'det-outcomes'}],
     ['Pua’s password also opened makani-web. Which containment step covers that?',['Block 203.0.113.77','Disable pua’s account and end its sessions','Isolate HILO-WS03 again','Shut down makani-web'],1,'An account problem needs an account control, on every machine at once.',{whys:['Blocking one address leaves the stolen password working.','Disabling pua and ending sessions stops the password everywhere.','HILO-WS03 is already isolated, and the account reaches other machines.','Shutting one server leaves the account working elsewhere.'],imp:'core',c:'det-containment'}],
     ['Backups run nightly at 01:00 and ransomware strikes at 15:00. If the 01:00 backup is clean, how much work is lost at most?',['1 hour','14 hours','24 hours','None'],1,'Everything since the last clean backup is lost; nightly backups only meet a one-day or longer RPO.',{whys:['1 hour assumes hourly backups.','01:00 to 15:00 is 14 hours of lost work.','24 hours counts a full day, and the clean copy ran at 01:00.','All work after 01:00 is lost.'],imp:'good',c:'det-containment'}],
     ['The first sign of the intruder on HILO-FS01 is Oct 14 at 09:20 HST. Which backup do you restore?',['Oct 14, 01:00 HST','Oct 15, 01:00 HST, the newest','Oct 14, 12:00 HST','Any: backups are always clean'],0,'Pick the newest backup taken before the first sign. A later one may hold the intruder’s files.',{whys:['Oct 14, 01:00 is the newest backup before the first sign.','Oct 15 ran after the first sign and may hold the intruder.','Oct 14, 12:00 ran after 09:20.','Backups copy whatever was there, intruder included.'],imp:'core',c:'det-containment'}],
     ['Defender showed no detection for upd.exe, yet EDR flagged Word starting PowerShell. Why?',['Defender was turned off','EDR reads signatures faster','PowerShell is always malware','upd.exe was new, so no signature matched; the behavior rule caught it'],3,'Signatures catch the known; behavior catches the unfamiliar. <a href="#junior/j8">Review: Windows: logons, tokens, and the event trail</a>',{whys:['Defender was on; the file was simply new.','EDR caught behavior, apart from signature speed.','PowerShell is a normal admin tool; its parent made it odd.','A new file matches no signature; the behavior rule caught it.'],imp:'good',c:'det-endpoint-tools'}],
     ['A hunt for new scheduled tasks across clinic PCs finds nothing unexplained. What is the useful output?',['A record of the hunt and a new detection rule','Nothing: the hunt failed','Deleting every scheduled task','Turning off 4698 auditing'],0,'A clean hunt still leaves a rule, so the next one alerts.',{whys:['The record shows what was checked and when, and the new rule watches for the same trick from now on.','A clean hunt still pays off as a rule.','Deleting every task breaks normal apps.','Turning off 4698 blinds the next hunt.'],imp:'good',c:'det-hunting'}],
     ['The clinic wants to know what upd.exe does when it runs. Which wall fits?',['Office Protected View on the reception PC','HILO-WS03, now isolated by the EDR','A separate user account on Kai’s laptop','An analysis sandbox: a disposable VM on an isolated network'],3,'A live sample needs at least the VM level, on a network that reaches nothing real. <a href="#junior/j13">Review: Evidence that holds up: forensics, timelines, and sandboxes</a>',{whys:['Protected View is a light app sandbox for documents.','An isolated PC still has a real disk.','A second account shares Kai’s real disk.','A disposable VM on an isolated network fits a live sample.'],imp:'good',c:'comp-isolation'}],
     ['The card payment terminal shares the reception VLAN with HILO-WS03. Which is the lightest wall that keeps a compromised reception PC away from it?',['A separate user account on the terminal','Its own segment, with firewall rules that allow only the payment service','A full air gap','An app sandbox on the reception PC'],1,'The risk is network reach, so the wall works at the network level. <a href="#junior/j6">Review: Network security design: firewalls, zones, VPNs, and Wi-Fi</a>',{whys:['A user account wall leaves the network path open.','Its own segment, with only payments allowed, blocks the reach.','An air gap stops the payments too.','An app sandbox limits one app, apart from network reach.'],imp:'good',c:'comp-isolation'}],
     ['Which of these is a runbook?',['The ransomware first-hour plan with its decisions','The severity-by-confidence matrix','“Isolate a host in the EDR console,” step by step','The incident report'],2,'A runbook covers one task; a playbook covers one kind of incident and calls runbooks.',{whys:['A first-hour plan with decisions is a playbook.','The matrix guides triage.','A step-by-step procedure for one task is a runbook.','The report records what happened.'],imp:'good',c:'det-rules-playbooks'}]
   ]),

 {id:'j5',title:'Evaluate a configuration',bloom:'Evaluate',sum:'Read a config or a system like an auditor: rank findings by impact, exposure, and known exploitation, and explain the order from those criteria.',
  can:'rank the findings on a system by impact, exposure, and known exploitation, and defend the order from those criteria',
  blocks:[
   C('Thinking like an auditor','Analyze',
     P('At this grade, the question becomes which finding to fix first. Rank by <b>impact</b> (how much an attacker gains) and <b>effort</b> (how fast you fix it). A domain admin backdoor outranks a missing login banner, though both are findings.'),
     DETAIL('The same ranking on network devices',
       P('<a href="#senior/se6">Cisco: audit and extend the two-site network</a> applies this ranking to a full audit of SwB and RtrB.'))),
    SCALE('Triage: impact first, effort second, availability always',{
     x:['Effort to fix','Quick','Slow'],
     y:['Impact','High','Medium','Low'],
     cells:[
       [['1. First','A second UID 0 account, a reverse-shell cron job, extra admins, a blank, guest, or shared password, root SSH login, or the firewall or antivirus turned off','l4'],['2. Second','Tracing how a backdoor got in: cron, systemd units, startup files, and new accounts','l4']],
       [['3. Third','A weak password policy, SMBv1 left on, or an insecure service the brief leaves out','l3'],['4. Fourth','Missing updates and over-broad shares','l2']],
       [['5. Fifth','A login banner, a screen-lock timeout, and audit logging','l1'],['6. Last','Hunting unauthorized media files across the disk','muted']]]},
     {intro:'Read the rows from the top: impact decides first. Within a row, the quicker fix goes first because it removes risk sooner.',
      note:'<b>Availability can veto any cell.</b> Before each fix, ask whether it stops a required service or locks out an authorized user. If it does, harden and restrict instead: an outage is worse than a finding left for later.',
      caption:'Highest impact, lowest effort, and lowest availability risk first.',
      bloom:'Analyze'}),
   ORDER('j5o','Rank the findings on one machine','Order these from fix-first to fix-last by impact, assuming each one falls outside the required services. The first four share the top tier, so any order among them counts.',[
     ['A second account with UID 0','Top tier: a second UID 0 account already holds full root control, so every lower finding waits until it is gone.',0],
     ['A reverse-shell cron job calling out to the internet','Top tier: the backdoor is calling out right now, an active intrusion, so it goes before anything that is only a possible way in.',0],
     ['Guest account enabled with blank password','Top tier: anyone can sign in with no password today, so it ranks with the active compromises.',0],
     ['SSH permits root login with a password','Top tier: it opens a remote path straight to root, so it shares the top with the three open doors beside it.',0],
     ['Automatic updates off and 40 missing patches','After the top four: each missing patch needs a working exploit, so the patches wait until the open doors are closed.'],
     ['Missing login banner and 15-minute screen lock','Last: a banner and a screen lock matter only with someone at the keyboard or a legal question, so they follow every higher-impact fix.']
   ]),
   QUIZ('j5q','Check: judgment',[
     ['Two findings: (a) Telnet running, required by the brief for a legacy device; (b) a netcat listener on 1337 absent from the brief. Which do you remove?',['Both','Only (b); harden and restrict (a)','Only (a)','Neither'],1,'Required services get hardened and restricted, and they stay in place. The unlisted listener is malware.',{whys:['Telnet is required, so removing it causes an outage.','The brief requires Telnet for a legacy device, so it stays and gets restricted, while the unlisted listener is a backdoor.','Telnet is the required one, and the listener is the backdoor.','The listener is unlisted, so it goes.'],imp:'core',c:'host-scenario-brief'}],
     ['Your maintenance window closes in ten minutes. Which usually reduces the most risk per minute?',['Writing a login banner','Confirming only authorized admins remain and the firewall and antivirus are on','Renaming the Administrator account','Reading the whole config again'],1,'High-impact areas first. Cheap, high-value checks beat cosmetic ones under time pressure.',{whys:['A banner is cosmetic.','Extra admins, a disabled firewall, and disabled antivirus are top ways in, and each takes a minute to check.','Renaming adds little against a determined attacker.','Rereading spends the window without a fix.'],imp:'core',c:'host-triage'}],
     ['A teammate wants to delete a user to "be safe," but the brief lists that user as authorized. Your call?',['Delete it','Keep it; deleting an authorized user breaks something the business needs','Disable it, then delete it','Rename it'],1,'Authorized means protected. Disabling it is also wrong here; leave it and secure it.',{whys:['Deleting an authorized user breaks the business.','The brief lists the user as authorized, so the account stays, and you secure it with a strong password and the right groups.','Disabling it blocks an authorized user, too.','Renaming changes a label and leaves the risk.'],imp:'core',c:'host-user-audit'}],
     ['Why rank findings at all instead of fixing them top to bottom?',['It looks professional','Time is limited and impact varies; ranking removes the most risk soonest','The firewall requires it','It is irrelevant'],1,'Triage is the skill. Highest impact, lowest effort, and lowest availability risk first.',{whys:['Ranking is for risk, and looks are a side effect.','With limited time and findings of very different impact, fixing the worst first removes the most risk before time runs out.','A firewall filters traffic, and the order is your call.','Ranking is the core skill under time pressure.'],imp:'core',c:'host-triage'}]
   ]),
   QUIZ('j5q2','Check: weigh the risk',[
     ['Two findings on a domain controller: an extra member of Domain Admins, and a missing login banner. You have five minutes. Which first, and why?',['The banner: it takes one minute','The extra Domain Admin: it is an administrator on every joined computer','Both at once','Whichever the brief lists first'],1,'Impact decides first. The extra admin is a domain-wide open door, and the banner is cosmetic.',{whys:['Quick is good, and impact decides first.','Domain Admins is an administrator on every joined computer, so the extra member is a domain-wide open door, while the banner is cosmetic.','Five minutes covers one high-impact fix best.','Impact sets the order, whatever the brief’s list order.'],imp:'core',c:'host-triage'}],
     ['SSH allows root login with a password, and the server faces the internet. Name the vulnerability, a likely threat, and the risk.',['Vulnerability: the bots; threat: the setting; risk: low','Vulnerability: SSH itself; threat: the firewall; risk: minimal','Vulnerability: the internet; threat: root; risk: medium','Vulnerability: the root-login setting; threat: password-guessing bots; risk: likely and severe'],3,'A vulnerability is the weakness you control, a threat is who would use it, and risk is how likely and how bad.',{whys:['The bots are the threat, and the setting is the weakness.','SSH is a needed service, and the setting is the weakness.','The internet is the path, and the root-login setting is the weakness.','The setting is the weakness you control, bots that guess passwords are the actor, and an internet-facing root login makes the risk both likely and severe.'],imp:'core',c:'sec-threat-vuln-risk'}],
     ['The firewall already blocks port 1337, and a netcat listener still runs on it. Is removing the listener worth the time?',['Yes: the firewall is one layer, and a rule change, a local user, or a pivot can still reach the listener, so remove it and its starter','The firewall covers it, so leave it','Only when the brief mentions netcat','Only after every other finding'],0,'Defense in depth: each layer assumes the others can fail, and a blocked backdoor is still a backdoor.',{whys:['Each layer assumes the others can fail: a rule change, a local user, or a pivot still reaches the listener, so the backdoor itself goes.','One layer can change or be bypassed.','Any unexplained listener is a backdoor.','A backdoor ranks near the top.'],imp:'core',c:'sec-defense-in-depth'}],
     ['Automatic updates are off with 40 missing patches, and a second UID 0 account exists. Why does the UID 0 account still come first?',['Patches matter only on servers','The patches need a reboot first','It gives total control today, while the missing patches wait for an attacker to exploit a known CVE','UID 0 accounts slow the machine'],2,'Known CVEs make missing patches a real risk, yet an extra root account is already a compromise.',{whys:['Patches matter on every machine.','A reboot is one step in patching, and impact sets the order.','A second UID 0 account puts root in someone’s hands today, while missing patches still wait for an exploit.','Speed is beside the point, and UID 0 is root.'],imp:'core',c:'host-triage'}]
   ]),
   C('Vulnerability management: find, rank, fix, and prove','Analyze',
     P('Hardening fixes one machine once; <b>vulnerability management</b> keeps a whole site fixed.'),
     SEQ('The vulnerability loop',[
       ['Inventory','List every device and app version; unlisted means unscanned.'],
       ['Scan','Run approved scans and match advisories to the inventory.'],
       ['Rank','Inputs: CVE ID, CVSS v4.0 base score, CISA KEV listing, and internet exposure. Known-exploited, exposed flaws jump the queue.','amber'],
       {ask:'Is a patch out?',branches:[['Yes','Back up, test, and patch within the time the rank sets.'],['No (zero-day)','Limit exposure, apply any workaround, and watch for the behavior.']]},
       ['Verify','Rescan: a closed ticket alone proves nothing.'],
       ['Report','Record fixes, leftovers, and who accepted the remaining risk.'],
       ['Repeat','New devices and flaws keep coming.','muted']
     ],{bloom:'Analyze',caption:'Rank by exploitation and exposure before raw score; prove each fix with a rescan.'}),
     SCALE('Likelihood by impact',{x:['Impact','Minor','Moderate','Major','Severe'],y:['Chance','Almost certain','Likely','Possible','Rare'],
       cells:[
         [['USB','Med','l2'],['','High','amber'],['','Crit','bad'],['','Crit','bad']],
         [['','Med','l2'],['','High','amber'],['','High','amber'],['Web','Crit','bad']],
         [['','Low','muted'],['','Med','l2'],['Pwd','High','amber'],['','High','amber']],
         [['','Low','muted'],['','Low','muted'],['Flood','Med','l2'],['','Med','l2']]]},
       {bloom:'Analyze',intro:'Four Hōkū Hardware findings and the CIA goals at stake. <b>Web:</b> a KEV-listed web server flaw (all three). <b>Pwd:</b> one admin password shared by the registers (confidentiality). <b>USB:</b> lost staff USB drives, all encrypted (confidentiality). <b>Flood:</b> a flooded server closet, with offsite backups (availability).',
        key:[['bad','Crit: act now'],['amber','High: this cycle'],['l2','Med: plan it'],['muted','Low: accept or batch']],
        note:'<b>Controls move a dot.</b> Encryption pulled USB to Minor; offsite backups pulled Flood from Severe to Major. Each is a second layer: defense in depth (<a href="#freshman/f3">Security principles</a>).',
        caption:'Fix Web, then Pwd; USB and Flood already carry their controls.'}),
      DETAIL('Control types in the grid',
        P('Encryption is a technical preventive control; offsite backups are a technical corrective control.'))),
   ORDER('j5o2','Rank five scan findings for Hōkū Hardware','Each line: a made-up CVE ID (2099 avoids real ones), CVSS v4.0 score, KEV status, and exposure. Order them from fix first to fix last.',[
     ['CVE-2099-4417 · 7.5 · in KEV · public web server','First: KEV means attackers already use it, and a public web server lets anyone online reach it with no help from staff.'],
     ['CVE-2099-1093 · 8.8 · in KEV · staff web browsers','Second: also in KEV, yet it needs a staff member to click, which slows it compared with the open server in step 1.'],
     ['CVE-2099-7350 · 9.1 · not in KEV · register server, inside only','Third: its score tops both above, yet it sits outside KEV and only inside machines reach it, so the flaws in active use go first.'],
     ['CVE-2099-2268 · 6.3 · not in KEV · back-office file server, inside only','Fourth: inside only like step 3, with a lower score, so it follows step 3 on the schedule.'],
     ['CVE-2099-5821 · 9.8 · not in KEV · lab PC with no network','Last: the top score, yet with no network nothing can reach it, so it waits for the next update.']
   ],'Analyze'),
   QUIZ('j5q3','Interleaved review: Junior',[
     ['A 4624 shows logon type 10 for malia. How did she sign in?',['At the keyboard','As a service','Over Remote Desktop','By a scheduled task'],2,'Type 2 is the keyboard; type 10 is Remote Desktop. <a href="#junior/j8">Review: Windows: logons, tokens, and the event trail</a>',{whys:['Type 2 is a sign-in at the keyboard.','Services sign in with their own logon type.','Windows logs Remote Desktop sign-ins as logon type 10, while type 2 marks the keyboard.','Scheduled tasks sign in with their own logon type.'],imp:'core',c:'det-windows-events'}],
     ['sudoers gives kai <code>ALL=(ALL) NOPASSWD: ALL</code>, but kai only restarts the web service. Best fix?',['Allow only that one restart command','Leave it, since kai is trusted','Delete kai','Give kai a longer password'],0,'Least privilege grants the one job and nothing more. <a href="#sophomore/s3">Review: Debian-family hardening</a>',{whys:['Least privilege grants the one job: a sudoers line that names the restart command by full path keeps kai working without full root.','Trust is a poor reason for extra power.','kai needs to work, so trim the rights instead.','NOPASSWD skips the password entirely.'],imp:'core',c:'lin-sudo-root'}],
     ['ACL line 10 permits 10.1.20.0 0.0.0.255 to any; line 20 denies host 10.1.20.5. What happens to 10.1.20.5?',['Denied by line 20','Dropped by the implicit deny','Permitted by line 10','Only logged'],2,'The first match wins, so line 20 never applies; put the specific deny first. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>',{whys:['Line 10 matches first, so the check stops there.','The implicit deny catches only unmatched traffic.','ACL lines are checked top down and the first match wins, so line 10 permits the host before line 20 is read.','The ACL permits it, and logging is separate.'],imp:'core',c:'cisco-acls'}],
     ['A partner school sends a TLP:GREEN report. Where may it go?',['Your community, but no public site','Anywhere, even the school website','Only the person it was sent to','Nowhere'],0,'TLP:GREEN stays within your community; AMBER narrows sharing to your own organization. <a href="#junior/j11">Review: Map the attack: kill chain, ATT&amp;CK, and threat intelligence</a>',{whys:['TLP:GREEN may travel across your community, such as partner schools, and stays off public sites.','Public sites need TLP:CLEAR.','Sharing with one person alone is narrower than GREEN.','GREEN allows community sharing.'],imp:'good',c:'threat-intel'}],
     ['A former intern’s account sits in Domain Admins, and an audit needs its history. Best action?',['Delete it now, since the intern left','Remove it from Domain Admins and disable it','Leave it until the audit is done','Rename it and reset its password'],1,'Remove access instead of deleting when an audit needs the history. <a href="#junior/j1">Review: Windows Server and Active Directory</a>',{whys:['Deleting the account loses its history.','Removing the membership ends the admin power, and disabling stops sign-ins, while the account and its history stay for the audit.','Waiting leaves an admin account open.','Renaming keeps the admin power.'],imp:'core',c:'win-active-directory'}],
     ['Which line keeps a search box safe from SQL injection?',['<code>cur.execute("SELECT * FROM items WHERE name = \'" + q + "\'")</code>','<code>cur.execute(f"SELECT * FROM items WHERE name = \'{q}\'")</code>','<code>cur.execute("SELECT * FROM items WHERE name = ?", (q,))</code>','The first line, after stripping quotes from q by hand'],2,'Placeholders keep input as data; joining strings or escaping by hand lets crafted input rewrite the query. <a href="#junior/j9">Review: Web attacks in the logs</a>',{whys:['Joining with + lets input rewrite the query.','An f-string joins input the same way.','The ? placeholder sends q as a separate value, so the database treats it as data and runs the query as written.','Hand-escaping misses cases.'],imp:'core',c:'web-secure-coding'}],
     ['Fifty 4625 events for malia in one minute, all SubStatus 0xC000006A, all from 203.0.113.50. What is it?',['Guesses at user names that do not exist','Password guessing against malia’s real account','A password spray across many users','A clock mismatch on the server'],1,'Many tries on one real name are brute force, which lockout and MFA stop. <a href="#sophomore/s10">Review: Read the logs: Windows, Linux, and network devices</a>',{whys:['Unknown names log a different substatus.','SubStatus 0xC000006A means the name exists and the password was wrong, and fifty tries on one name is brute force.','A spray hits many users once each.','Clock trouble logs different codes.'],imp:'core',c:'det-windows-events'}],
     ['Why hash both the original drive and its image?',['To shrink the image for storage','To encrypt the evidence at rest','To prove the copy matches','To speed up later analysis'],2,'Matching hashes prove the copy is exact, so the original stays untouched. <a href="#junior/j13">Review: Evidence that holds up: forensics, timelines, and sandboxes</a>',{whys:['Hashing leaves the size unchanged.','A hash is a fingerprint, and encryption is separate.','Matching hashes prove the image is a bit-for-bit copy, so you work on the copy and the original stays untouched.','Hashing adds a step, and speed stays the same.'],imp:'core',c:'det-forensics'}],
     ['Hōkū Hardware moves its web shop into a DMZ. Which rule set fits?',['The internet reaches the shop on 443 alone, and the shop reaches the inside only on the one database port it needs','The internet reaches the shop on every port, since the DMZ sits outside','The inside network has no path to the shop at all','The shop reaches the inside on any port, so updates work'],0,'A DMZ limits break-in damage by giving each side only the access it needs. <a href="#junior/j6">Review: Network security design: firewalls, zones, VPNs, and Wi-Fi</a>',{whys:['The internet gets only the shop’s service on 443, and the shop gets only the one inside port it needs, so a break-in stays boxed in.','Every open port widens the attack surface.','The shop needs its one database port.','Any-port access lets a break-in spread.'],imp:'core',c:'net-firewall-design'}],
     ['Which event shows the decoded text of a PowerShell script block, even when the command arrived base64-encoded?',['4688','7045','1102','4104'],3,'Forward 4104 from the PowerShell Operational log so the record outlives the intruder. <a href="#junior/j2">Review: Group Policy</a>',{whys:['4688 records a new process.','7045 records a new service.','1102 records the audit log being cleared.','Script block logging writes 4104 after PowerShell unpacks the base64, so the event holds the decoded text.'],imp:'core',c:'win-script-logging'}],
     ['Hilo Lehua Clinic backs up at 00:00, 06:00, 12:00, and 18:00. Ransomware strikes at 17:00, and the 12:00 backup is clean. How much work is lost at most?',['5 hours','11 hours','17 hours','None'],0,'The RPO says whether the clinic can accept that much loss. <a href="#junior/j12">Review: Respond to an incident: triage, contain, and recover</a>',{whys:['Everything since the last clean backup is lost, and 12:00 to 17:00 is 5 hours.','11 hours counts from the 06:00 backup.','17 hours counts from midnight.','Work since the last clean backup is lost, 5 hours here.'],imp:'core',c:'det-containment'}],
     ['The brief never mentions a backup agent running on HILO-FS01. What do you do?',['Remove it, since the brief leaves it out','Stop its service and see who complains','Leave it alone and log nothing','Find out what it does and ask the owner first'],3,'Anything off the brief is suspect, and suspect means investigate: find what starts it, who owns it, and what it does, then ask the owner before you remove a backup, management, or monitoring agent. <a href="#sophomore/s1">Review: Read the scenario brief first</a>',{whys:['Removing a backup agent can break recovery.','Stopping it first risks an outage before you know its job.','An unknown agent needs a look and a log entry.','An unknown agent may be a backup, management, or monitoring tool, so you find what it does and let the owner decide before anything is removed.'],imp:'core',c:'host-prohibited-files-software'}],
     ['An identity policy allows a download, and the bucket policy explicitly denies it. Result?',['Allowed: the identity policy wins','Denied: a Deny in any policy outranks every Allow','Allowed for admins only','It depends on the region'],1,'An explicit Deny in any policy beats every Allow. <a href="#junior/j10">Review: Cloud security: identity, storage, and logs</a>',{whys:['An explicit Deny beats any Allow.','Cloud policy evaluation lets an explicit Deny in any policy override every Allow.','Admins follow the same Deny.','Policy logic is the same in every region.'],imp:'core',c:'cloud-iam-storage'}],
     ['A root crontab line reads <code>* * * * * /tmp/.x/u.sh</code>. Your verdict?',['A normal update job','Harmless, since /tmp empties at boot','Log rotation','Root persistence; remove and trace it'],3,'A hidden root script every minute is persistence; trace what planted it. <a href="#junior/j3">Review: Debian and deeper Linux</a>',{whys:['Update jobs run from system paths, and rarely every minute.','Cron reruns it every minute, reboot or not.','Log rotation runs from system paths, once a day.','A hidden script in /tmp that root runs every minute is persistence, so you remove it and trace what planted it.'],imp:'core',c:'host-malware-persistence'}],
     ['Which shows how much data went to 203.0.113.60 last night, keeping the least private data?',['A full packet capture','A flow record','The DHCP lease table','A firewall screenshot'],1,'Flows keep who talked to whom, when, and how many bytes, without contents. <a href="#junior/j7">Review: Read the wire: captures, flows, and network attacks</a>',{whys:['A full capture keeps every byte of content.','Flow records keep who talked to whom, when, and how many bytes, without the contents, which answers the question with the least private data.','DHCP leases map addresses to devices.','A screenshot shows rules, and traffic totals live in flows.'],imp:'core',c:'det-captures'}]
   ]),

  ]}
 ]
});

<script>
'use strict';
/* ---- glossary (the Glossary rail page) ----
   Kept alphabetical. Each entry links to the unit where the ladder first teaches the term;
   'at' is a #grade/unit anchor. def may hold <b> and <code>. */
LADDER.addGlossary([
  {term:'3-2-1 rule',def:'Three copies of your data, on two kinds of storage, with one copy off site.',at:'freshman/f4'},
  {term:'802.1Q tag',def:'A 4-byte field in a frame on a trunk whose 12-bit VLAN ID names the frame’s VLAN.',at:'freshman/f7'},
  {term:'802.1X',def:'Port-based network access control: a device proves itself through EAP before the switch port or SSID lets it on.',at:'junior/j6'},
  {term:'AAA',def:'Authentication, authorization, and accounting: proving who you are, deciding what you may do, and recording what you did.',at:'freshman/f3'},
  {term:'ABAC (attribute-based access control)',def:'Rules decide access from attributes of the user, the resource, and the request, such as network, time, or tag.',at:'junior/j10'},
  {term:'Absolute path',def:'A path that starts at / and works from any folder, such as /etc/ssh. A relative path starts from the folder you are in.',at:'freshman/f6'},
  {term:'Access log',def:'A web server’s record of every request, one line each: client, time, request, status, size, referrer, and agent.',at:'junior/j9'},
  {term:'Access port',def:'A switch port in one VLAN that passes untagged frames to one end device.',at:'freshman/f7'},
  {term:'Access token',def:'What Windows builds at sign-in: the user’s SID, group SIDs, privileges, and integrity level. Each process carries a copy.',at:'junior/j8'},
  {term:'access-class',def:'The line command that filters which source addresses may open a session to the device itself.',at:'junior/j4'},
  {term:'ACL (access control list)',def:'A list of allow and deny entries that decides who can do what to a file, folder, share, or registry key; on a router, the permit and deny lines that filter packets.',at:'freshman/f5'},
  {term:'ACL (network)',def:'On a router, switch, or cloud subnet: an ordered list of permit and deny lines for packets, read top down; the first match wins, and an implicit deny ends the list.',at:'junior/j4'},
  {term:'Active Directory (AD)',def:'The Windows Server directory that stores a domain’s users, groups, and computers in one place.',at:'sophomore/s2'},
  {term:'Active reconnaissance',def:'Probing a target’s systems directly, such as port scans or guessed paths, which shows up in its logs.',at:'junior/j11'},
  {term:'adm group',def:'The Debian-family group that reads system logs under /var/log, without root power.',at:'sophomore/s3'},
  {term:'Administrative distance (AD)',def:'A trust rank that picks between route sources for the same prefix: connected 0, static 1, and OSPF 110.',at:'junior/j4'},
  {term:'Advanced audit policy',def:'About 60 audit subcategories under Advanced Audit Policy Configuration, finer than the nine basic categories.',at:'junior/j2'},
  {term:'After-action report',def:'The written review after an incident or drill: summary, timeline, scope, root cause, response, and improvements with owners and dates.',at:'senior/se13'},
  {term:'AIDE',def:'A Linux file integrity checker that compares every watched file with a database of hashes built on a clean day.',at:'junior/j3'},
  {term:'Air gap',def:'A system without any network link, so data moves only by hand.',at:'freshman/f4'},
  {term:'Alert',def:'A notice raised when a rule decides that some events need a person’s look.',at:'sophomore/s10'},
  {term:'Alert fatigue',def:'Worn-down attention after too many false positives, when analysts start skimming or ignoring alerts.',at:'senior/se13'},
  {term:'Alias (PowerShell)',def:'A short name for a cmdlet, such as del for Remove-Item or sc for Set-Content in Windows PowerShell 5.1; Get-Alias shows what each one runs.',at:'freshman/f5'},
  {term:'Alternate data stream (ADS)',def:'A hidden second stream of data attached to a file on an NTFS drive; Windows keeps the Mark of the Web in one called Zone.Identifier.',at:'sophomore/s2'},
  {term:'AMSI (Antimalware Scan Interface)',def:'Hands scripts and commands to the antivirus after they are decoded, just before they run.',at:'junior/j2'},
  {term:'Anti-CSRF token',def:'A secret value a site places in its own forms and checks on every change request; other sites cannot read it.',at:'junior/j9'},
  {term:'Anti-malware',def:'The layers that work with the virus scanner, such as download reputation, unwanted-app blocking, real-time scanning, and controlled folder access.',at:'freshman/f13'},
  {term:'Antivirus',def:'Software that checks files and programs against detection signatures and suspicious actions, then blocks, quarantines, or reports them.',at:'freshman/f13'},
  {term:'API (application programming interface)',def:'A set of addresses a program calls to get or change data, usually over HTTP with JSON.',at:'senior/se10'},
  {term:'APIPA',def:'A self-assigned 169.254.x.x address that a Windows host takes when its DHCP request goes unanswered.',at:'freshman/f4'},
  {term:'App Control for Business',def:'Windows’ kernel-enforced application control (formerly WDAC): code runs only when the policy trusts its publisher, path, hash, or installer.',at:'senior/se8'},
  {term:'AppArmor',def:'The mandatory access control on Ubuntu, Mint, and Debian that confines each profiled program to the files it needs, even when it runs as root.',at:'junior/j3'},
  {term:'Application control',def:'Letting only approved programs run, by publisher, path, or hash: App Control for Business and AppLocker.',at:'junior/j8'},
  {term:'AppLocker',def:'The older Windows application control, with rules per user or group; it still works, while new features go to App Control.',at:'senior/se8'},
  {term:'Approval gate',def:'A step in an automated playbook that waits for a person before a disruptive action, such as isolating a server.',at:'senior/se13'},
  {term:'apt',def:'The package manager on Debian, Ubuntu, and Mint that installs, updates, and removes .deb packages.',at:'freshman/f6'},
  {term:'APT (advanced persistent threat)',def:'A skilled, well-funded team, often state-backed, that targets chosen organizations and stays hidden for months.',at:'freshman/f8'},
  {term:'Argument',def:'A value you type after a command or script name, such as brief.txt in ./audit_users.sh brief.txt. A Bash script reads the first one as $1.',at:'sophomore/s11'},
  {term:'ARP',def:'The protocol that finds the MAC address for an IPv4 address on the local network.',at:'freshman/f7'},
  {term:'ARP spoofing',def:'Forged ARP replies that claim another host’s IP address, often the gateway’s, to put the sender on-path.',at:'junior/j7'},
  {term:'AS-REP roasting',def:'Cracking offline the reply a domain controller sends for an account set to skip Kerberos pre-authentication.',at:'senior/se7'},
  {term:'ASLR (address space layout randomization)',def:'An OS guard that loads code and data at shuffled addresses, so an intruder cannot predict where they sit.',at:'senior/se2'},
  {term:'ASR rules (attack surface reduction)',def:'Defender rules that block risky behavior, such as Office starting child processes, in Audit, Block, or Warn mode.',at:'junior/j8'},
  {term:'at job',def:'A command queued to run once at a set time, listed with atq.',at:'junior/j3'},
  {term:'Attack surface',def:'Every account, service, port, and program an attacker could reach on a system.',at:'freshman/f1'},
  {term:'Audit mode',def:'A policy state that logs what a rule would block while blocking nothing, used to tune rules before enforcing them.',at:'senior/se8'},
  {term:'Audit policy',def:'The Windows settings that decide which Success and Failure events go to the Security log.',at:'sophomore/s2'},
  {term:'Audit user ID (auid)',def:'The ID of the person who signed in, which auditd keeps on every process that person starts, even after su or sudo. Services have it unset, and cron jobs carry their owner’s ID.',at:'senior/se9'},
  {term:'auditd',def:'The Linux audit daemon that records the security events its rules ask for.',at:'junior/j3'},
  {term:'Auditor',def:'An independent checker who tests controls against a standard and reports gaps; external auditors work for an outside firm.',at:'senior/se12'},
  {term:'auth.log',def:'The Ubuntu and Mint log file for sign-ins, sudo, and SSH. Debian 12 and later keep the same lines in the systemd journal (<code>journalctl -u ssh</code>).',at:'sophomore/s10'},
  {term:'Authentication-Results',def:'The header your own mail server adds with its SPF, DKIM, and DMARC verdicts.',at:'sophomore/s9'},
  {term:'Authorization',def:'Permission from a system’s owner, ideally in writing, to access or change it; inside a computer, the rights an account holds.',at:'freshman/f1'},
  {term:'authorized_keys',def:'The per-user file of SSH public keys that may sign in without that user’s password.',at:'sophomore/s3'},
  {term:'AutoPlay',def:'The Windows prompt that offers to open a drive or disc when it connects; turning it off removes one easy click for a planted USB stick.',at:'sophomore/s2'},
  {term:'Autostate',def:'The rule that keeps an SVI down until its VLAN exists and a port carrying it is up.',at:'sophomore/s5'},
  {term:'Availability check',def:'A lab test that confirms a required service or authorized account still works after your changes.',at:'freshman/f1'},
  {term:'Backdoor',def:'A hidden way back into a system, such as a netcat listener, an extra SSH key, or a rogue user.',at:'freshman/f3'},
  {term:'Backup',def:'An independent copy on separate media that survives the loss of the original and earns trust after a test restore.',at:'freshman/f4'},
  {term:'Base system (FreeBSD)',def:'The kernel and core userland the FreeBSD project maintains, patched with freebsd-update (or pkg on a pkgbase install).',at:'senior/se1'},
  {term:'Baseline',def:'A record of how a system looks before you change it: its users, services, ports, software, and settings.',at:'freshman/f1'},
  {term:'Beaconing',def:'Small, regular check-ins from an infected host to its controller; it shows as evenly spaced flows.',at:'junior/j7'},
  {term:'Bearer token',def:'A token sent in the Authorization header; whoever holds it acts as its owner until it expires.',at:'senior/se10'},
  {term:'Behavior detection',def:'Detection that flags actions departing from normal: it catches new tricks and raises more false alarms.',at:'freshman/f13'},
  {term:'BitLocker',def:'Windows drive encryption that keeps a lost or stolen drive unreadable; the TPM unlocks it at startup, and a 48-digit recovery key opens it when the boot chain changes.',at:'freshman/f5'},
  {term:'BitLocker To Go',def:'BitLocker for removable drives, so a USB stick that leaves the building stays unreadable without its password or recovery key.',at:'sophomore/s2'},
  {term:'Block Public Access',def:'An S3 setting, for one bucket or a whole account, that overrides any policy or ACL that would make storage public.',at:'junior/j10'},
  {term:'blocklistd',def:'The FreeBSD daemon that blocks an address in pf after repeated failed logins (blacklistd before FreeBSD 15).',at:'senior/se1'},
  {term:'Blue team',def:'The defenders who harden systems, watch alerts, and respond to incidents.',at:'freshman/f13'},
  {term:'BOLA (broken object-level authorization)',def:'An API that returns any object whose id a caller asks for without checking ownership: the IDOR of APIs.',at:'senior/se10'},
  {term:'BPDU',def:'The message switches exchange to run spanning tree.',at:'freshman/f7'},
  {term:'BPDU guard',def:'A setting that err-disables an edge port the moment a BPDU arrives.',at:'freshman/f7'},
  {term:'Broadcast address',def:'The last address of a subnet, with every host bit set to 1.',at:'sophomore/s5'},
  {term:'Broadcast domain',def:'The set of devices that receive one another’s broadcasts; each VLAN is one.',at:'freshman/f7'},
  {term:'Broken access control',def:'The server lets a user reach data or actions beyond their rights, often because it checks sign-in but not ownership.',at:'junior/j9'},
  {term:'Bucket policy',def:'A resource policy attached to a storage bucket that names who may do what with its objects.',at:'junior/j10'},
  {term:'Buffer overflow',def:'Data written past the end of a fixed-size space in memory, overwriting what sits beside it; it crashes a program or lets an intruder steer it.',at:'senior/se2'},
  {term:'Bug bounty',def:'A program in which an organization invites testing under written rules and rewards valid reports; its rules are the authorization.',at:'senior/se5'},
  {term:'Built program',def:'Machine code made from source ahead of time, as with C and Go; also called a compiled program or a binary. Check its hash and signature, since its source stays behind.',at:'freshman/f12'},
  {term:'Business email compromise (BEC)',def:'A taken-over or imitated mailbox used to redirect payments or payroll.',at:'freshman/f8'},
  {term:'Carrier-grade NAT (CGNAT)',def:'A provider’s NAT in 100.64.0.0/10 that lets many customers share one public address.',at:'freshman/f9'},
  {term:'CDP',def:'Cisco Discovery Protocol, which announces a device’s model, IOS version, and addresses to its neighbors.',at:'sophomore/s5'},
  {term:'Certificate',def:'A signed record that binds a public key to a name; browsers accept it when the name matches the address, the dates are current, and the chain reaches a trusted root.',at:'freshman/f10'},
  {term:'Certificate authority (CA)',def:'An issuer that signs certificates to vouch that a key belongs to a name.',at:'freshman/f10'},
  {term:'cgroup',def:'A Linux kernel group that limits and counts the CPU, memory, and other resources its processes use.',at:'senior/se9'},
  {term:'chage',def:'The command that views or sets password aging for an existing Linux account.',at:'sophomore/s3'},
  {term:'Chain of custody',def:'The record of everyone who held an item of evidence: when, why, and its seal number and hash at each handoff.',at:'junior/j13'},
  {term:'Change log',def:'One line per change: the time, the machine, what changed, and how to undo it.',at:'freshman/f1'},
  {term:'Channel binding',def:'Ties a sign-in to the TLS session it travels in, so a sign-in relayed through another connection fails.',at:'junior/j1'},
  {term:'Checksum (hash)',def:'A fixed-length fingerprint of a file that changes when any byte of the file changes.',at:'freshman/f4'},
  {term:'chroot',def:'Changing what one process sees as the root folder (/). It narrows the view only: root inside a chroot can leave it.',at:'senior/se9'},
  {term:'CIA triad',def:'The three goals of security: confidentiality, integrity, and availability.',at:'freshman/f3'},
  {term:'CIPA',def:'The US law that requires internet filtering and a safety policy at schools and libraries taking E-rate discounts.',at:'senior/se12'},
  {term:'Cipher suite',def:'The set of methods one TLS connection uses for key exchange, encryption, and integrity checks.',at:'sophomore/s8'},
  {term:'ClamAV',def:'A free antivirus scanner for Linux (clamscan) that matches files against known-malware signatures.',at:'junior/j3'},
  {term:'Classful network',def:'An address block sized by its first octet: class A /8, class B /16, or class C /24.',at:'senior/se6'},
  {term:'Cmdlet',def:'A PowerShell command named Verb-Noun, such as Get-LocalUser.',at:'freshman/f5'},
  {term:'Command and control (C2)',def:'The channel that malware uses to check in with an attacker’s server and receive orders.',at:'freshman/f8'},
  {term:'Command injection',def:'Untrusted input starts extra operating-system commands because the app passed it to a shell.',at:'junior/j9'},
  {term:'Command option',def:'A switch that changes how a command works: one dash and a letter (-l) or two dashes and a word (--ignore-case).',at:'freshman/f6'},
  {term:'Command Prompt',def:'cmd.exe, the older Windows command line. Its commands (dir, del) and tools (sc.exe, netsh, and reg) take their own option styles, such as /s or start= disabled, in place of PowerShell parameters.',at:'freshman/f5'},
  {term:'Compensating control',def:'A substitute control that covers the same risk when the ideal control cannot run, recorded as such.',at:'senior/se12'},
  {term:'Complain mode',def:'An AppArmor mode that logs what a profile would block (apparmor="ALLOWED") and blocks nothing; enforce mode blocks.',at:'senior/se9'},
  {term:'Compliance',def:'Meeting the laws, standards, and contracts that apply to an organization, and proving it with evidence.',at:'senior/se12'},
  {term:'Condition',def:'Code that tests whether something is true and runs its lines only when it is.',at:'freshman/f12'},
  {term:'Conditional Access',def:'Microsoft Entra ID rules that allow, block, or demand more proof based on the user, device, location, and app.',at:'junior/j10'},
  {term:'Confidence (alert)',def:'How likely an alert is to be real, judged from the rule’s track record and the evidence behind it.',at:'junior/j12'},
  {term:'Configuration drift',def:'A difference between what the code describes and what actually runs, usually from a change made by hand.',at:'senior/se10'},
  {term:'Configuration register',def:'A router setting, shown by show version, that decides how it boots: 0x2102 loads the saved startup-config, and 0x2142 skips it for password recovery.',at:'sophomore/s5'},
  {term:'Consent phishing',def:'A fake app asks you to grant it access to your mail or files, then uses that access without needing your password.',at:'junior/j10'},
  {term:'Constrained Language Mode',def:'A PowerShell mode that blocks .NET calls, Add-Type, and COM objects; application control enforces it.',at:'junior/j2'},
  {term:'Container',def:'An app packed with its own files and network that shares the host’s kernel: lighter than a VM, with a thinner wall.',at:'freshman/f4'},
  {term:'Containment',def:'The response phase that stops the spread, such as isolating a host, disabling an account, or blocking an address.',at:'freshman/f13'},
  {term:'Control flag (PAM)',def:'The second field of a PAM line (required, requisite, sufficient, or optional) that sets what a module’s pass or fail means.',at:'sophomore/s3'},
  {term:'Controlled folder access',def:'A Defender feature that lets only trusted programs change protected folders such as Documents, which blunts ransomware.',at:'senior/se8'},
  {term:'COPPA',def:'The US law that requires verifiable parental consent before sites and apps collect personal information from children under 13.',at:'senior/se12'},
  {term:'Crafted packet',def:'A packet built by hand with flags a normal stack never sends, such as SYN+FIN, null, or Xmas; the edge drops it.',at:'junior/j7'},
  {term:'Credential Guard',def:'Keeps NTLM hashes and Kerberos TGTs in an isolated process, walled off by virtualization, that even SYSTEM cannot read.',at:'senior/se7'},
  {term:'Credential stuffing',def:'Trying email and password pairs leaked from one site on many other sites.',at:'freshman/f2'},
  {term:'Cron',def:'The scheduler that runs commands on a minute, hour, day, month, and weekday pattern.',at:'junior/j3'},
  {term:'CSP (Content-Security-Policy)',def:'A response header that lists where a page may load scripts and other content from.',at:'sophomore/s8'},
  {term:'CSRF (cross-site request forgery)',def:'Another site makes your browser send a request to a site you are signed in to, with your cookie attached.',at:'junior/j9'},
  {term:'CSV',def:'Comma-separated values: a table in plain text, with one record per line.',at:'freshman/f12'},
  {term:'curl',def:'A command-line tool that sends one web request and prints the answer; <code>curl -sI</code> shows only the response headers.',at:'sophomore/s8'},
  {term:'CVE',def:'A public identifier for one known vulnerability, used to say which flaw a patch closes.',at:'sophomore/s1'},
  {term:'CVSS (Common Vulnerability Scoring System)',def:'A 0 to 10 severity score for a flaw; version 4.0 is current.',at:'junior/j5'},
  {term:'DAC (discretionary access control)',def:'Each object’s owner decides who may use it, as with file permissions.',at:'junior/j10'},
  {term:'Data classification',def:'Labeling data (public, internal, confidential, or restricted) so people and tools know how to handle it.',at:'senior/se12'},
  {term:'Data events',def:'Audit-log entries for reads and writes of individual objects, such as each download; often off unless someone turns them on.',at:'junior/j10'},
  {term:'Data minimization',def:'Collecting only the personal data a job needs, keeping it only as long as needed, and sharing it only with those who need it.',at:'freshman/f2'},
  {term:'DCSync',def:'Using directory replication rights to copy password hashes from a DC; 4662 events from an account that is not a DC reveal it.',at:'senior/se7'},
  {term:'Deauthentication flood',def:'Forged Wi-Fi disconnect frames that knock clients off, often to push them toward an evil twin.',at:'junior/j6'},
  {term:'debsums',def:'A Debian tool that checks installed package files against the hashes their packages shipped.',at:'junior/j3'},
  {term:'Default Domain Policy',def:'The GPO linked at the domain that carries password and lockout policy for every domain account.',at:'sophomore/s2'},
  {term:'Default gateway',def:'The router a host sends traffic to when the destination sits on another network.',at:'freshman/f4'},
  {term:'Default route',def:'The 0.0.0.0/0 route that catches every destination missing from the routing table.',at:'junior/j4'},
  {term:'Defender exclusion',def:'A path, process, or file type that Microsoft Defender skips during scans.',at:'senior/se7'},
  {term:'Defense in depth',def:'Layered, separate controls, so another layer still protects when one fails.',at:'freshman/f3'},
  {term:'Deny by default',def:'Blocking everything, then allowing only what is needed; a failed check blocks.',at:'freshman/f3'},
  {term:'Detection coverage',def:'Which attacker techniques your logs and tested rules can catch, checked technique by technique, often against ATT&CK.',at:'senior/se13'},
  {term:'Detection rule',def:'A saved search that names the logs to read, what to match, how many matches count, and what to do when it fires.',at:'senior/se13'},
  {term:'Detection signature',def:'A known-bad pattern, such as a malware file’s hash or a telltale string, that a detection tool matches. A digital signature is a different idea: it proves who signed a file.',at:'freshman/f13'},
  {term:'DHCP',def:'The service that hands hosts an address, mask, gateway, and DNS server automatically.',at:'freshman/f4'},
  {term:'DHCP relay',def:'A gateway setting (ip helper-address) that forwards DHCP broadcasts to a server on another subnet.',at:'junior/j4'},
  {term:'DHCP snooping',def:'A switch feature that lets DHCP server replies in only on trusted ports.',at:'junior/j4'},
  {term:'Diamond model',def:'A way to describe one intrusion event by four linked corners: adversary, capability, infrastructure, and victim.',at:'junior/j11'},
  {term:'Diff',def:'The exact lines that changed between two versions of a file: minus lines removed, plus lines added.',at:'senior/se10'},
  {term:'Digital forensics',def:'Collecting and analyzing digital evidence to show what happened, when, and by whose account, in a form that holds up to review.',at:'junior/j13'},
  {term:'Digital signature',def:'A hash signed with a private key, proving who signed and that nothing changed since.',at:'freshman/f10'},
  {term:'Directory listing',def:'A web server feature that shows every file in a folder to any visitor when the folder has no index page.',at:'junior/j1'},
  {term:'Display manager',def:'The login-screen program (GDM on Ubuntu, LightDM on Mint) that also holds the automatic-login and guest-session settings.',at:'sophomore/s3'},
  {term:'Display name',def:'The free-text name shown beside an email address; the sender types whatever it likes.',at:'sophomore/s9'},
  {term:'Distinguished name (DN)',def:'The full path that names one directory object, read right to left: CN=PC-07,OU=Workstations,DC=example,DC=com.',at:'junior/j1'},
  {term:'Distribution',def:'A Linux kernel bundled with tools, a package manager, and a desktop, such as Debian, Ubuntu, or Linux Mint.',at:'freshman/f6'},
  {term:'DKIM (DomainKeys Identified Mail)',def:'A signature on an email, checked with the public key that the signing (d=) domain publishes in DNS.',at:'sophomore/s9'},
  {term:'DLP (data loss prevention)',def:'Tools and rules that spot sensitive data leaving by email, USB, upload, or print, then warn, block, or log.',at:'senior/se12'},
  {term:'DMARC',def:'A DNS policy that checks whether SPF or DKIM passed for the domain in the visible From, and tells receiving servers to report, quarantine, or reject mail that fails.',at:'sophomore/s9'},
  {term:'DMZ',def:'A separate network for servers the internet must reach, so a compromise there still faces a firewall before the inside.',at:'junior/j6'},
  {term:'DMZ host',def:'A home-router setting that sends every unsolicited inbound connection to one inside device. Keep it off.',at:'sophomore/s7'},
  {term:'DNS',def:'The service that turns names into IP addresses.',at:'freshman/f4'},
  {term:'DNS cache poisoning',def:'Planting a false answer in a resolver’s cache, so a correct name leads to the wrong address.',at:'junior/j7'},
  {term:'DNS record',def:'One fact stored in DNS, by type: A and AAAA (addresses), CNAME (alias), MX (mail), NS (name servers), TXT (policies), and PTR (address to name).',at:'sophomore/s7'},
  {term:'DNS resolver',def:'The recursive DNS server that asks the root, top-level domain, and authoritative servers for you and caches each answer for its TTL.',at:'freshman/f9'},
  {term:'DNS sinkhole',def:'A resolver setting that answers known-bad domains with an address the defenders control, exposing infected hosts.',at:'senior/se11'},
  {term:'DnsAdmins',def:'An AD group whose members can load code into the DNS service, which makes it an admin group by another road.',at:'sophomore/s2'},
  {term:'DNSSEC',def:'Signatures on DNS records that let a validating resolver prove an answer is the zone owner’s, unchanged.',at:'senior/se11'},
  {term:'doas',def:'A small alternative to sudo whose rules live in /usr/local/etc/doas.conf on FreeBSD.',at:'senior/se1'},
