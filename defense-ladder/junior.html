/* ---- Move your progress: a progress code carries completed activities between browsers, devices, and saved copies.
   Code: DL1-<entries>-<check>. Entries are the activity ids in sorted order, joined by ".", each written as one
   base-36 digit (how many leading characters it shares with the previous id) and the rest of the id; then
   *score/total for a quiz, +steps (base-36 step numbers) for a lab, and ~ for an activity still in progress.
   <check> is the 32-bit FNV-1a hash of "DL1-<entries>" in base 36, six characters. The code holds activity ids,
   quiz scores, and lab steps only: reflections, checklists, plans, and the scorecard stay in this browser. ---- */
/* My progress redraws its totals when another tab saves (the storage listener calls it while that page is open) */
let progressRedraw=null;
const PCODE_V=1;
const PCODE_ID=/^[a-z][a-z0-9]{0,30}$/;
function pcodeCheck(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return (h%2176782336).toString(36).padStart(6,'0');}
function progressEntries(src){
  const out={};
  Object.keys(src).sort().forEach(id=>{
    const v=src[id];
    if(!PCODE_ID.test(id)||!v||typeof v!=='object') return;
    const ticks=Array.isArray(v.ticks)?[...new Set(v.ticks.filter(n=>Number.isInteger(n)&&n>=0&&n<36))].sort((a,b)=>a-b):[];
    if(!v.done&&!ticks.length) return;
    const e={done:!!v.done};
    if(Number.isInteger(v.score)&&Number.isInteger(v.total)&&v.total>0&&v.score>=0&&v.score<=v.total){e.score=v.score;e.total=v.total;}
    if(ticks.length) e.ticks=ticks;
    out[id]=e;
  });
  return out;
}
function makeProgressCode(){
  let prev='';
  const parts=Object.entries(progressEntries(MEM)).map(([id,e])=>{
    let k=0; while(k<35&&k<prev.length&&prev[k]===id[k]) k++;
    prev=id;
    return k.toString(36)+id.slice(k)+(e.score!=null?'*'+e.score+'/'+e.total:'')+(e.ticks?'+'+e.ticks.map(n=>n.toString(36)).join(''):'')+(e.done?'':'~');
  });
  const body='DL'+PCODE_V+'-'+parts.join('.');
  return {code:body+'-'+pcodeCheck(body),count:parts.length};
}
function readProgressCode(text){
  const s=String(text||'').replace(/\s+/g,'');
  if(!s) return {error:'Paste a progress code first.'};
  const damaged={error:'This code is incomplete or changed. Copy the whole code again, from DL1- to its last character.'};
  /* the code is found inside whatever was pasted (quotes or a "Code:" label from a chat or email are fine);
     text that starts like a code but ends early counts as a damaged code. A code is lower case after DL; a paste
     that changed the case still reads, and the checksum still guards it */
  const m=/DL(\d+)-([a-z0-9.*\/+~]*)-([a-z0-9]{6})(?![a-z0-9])/i.exec(s);
  if(!m) return /DL\d+-/i.test(s)?damaged:{error:'This text reads differently from a progress code. A code starts with DL1- and comes from My progress on Defense Ladder.'};
  if(+m[1]>PCODE_V) return {error:'This code comes from a newer Defense Ladder. Open the newest copy of the page and paste the code there.'};
  if(+m[1]!==PCODE_V) return {error:'This code uses an older format this page reads differently. Make a fresh code on the other browser and paste that one.'};
  m[2]=m[2].toLowerCase();m[3]=m[3].toLowerCase();
  if(pcodeCheck('DL'+m[1]+'-'+m[2])!==m[3]) return damaged;
  const out={}; let prev='';
  for(const part of m[2]?m[2].split('.'):[]){
    const p=/^([0-9a-z])([a-z0-9]*)(?:\*(\d{1,3})\/(\d{1,3}))?(?:\+([0-9a-z]{1,36}))?(~)?$/.exec(part);
    if(!p) return damaged;
    const k=parseInt(p[1],36);
    if(k>prev.length) return damaged;
    const id=prev.slice(0,k)+p[2];
    if(!PCODE_ID.test(id)||out[id]) return damaged;
    prev=id;
    const e={done:!p[6]};
    if(p[3]!=null&&+p[4]>0&&+p[3]<=+p[4]){e.score=+p[3];e.total=+p[4];}
    if(p[5]) e.ticks=[...new Set([...p[5]].map(c=>parseInt(c,36)))].sort((a,b)=>a-b);
    out[id]=e;
  }
  return {entries:out};
}
/* what an import adds: completions, lab steps, and better quiz scores; it never removes or lowers anything */
function planProgressMerge(entries){
  store.load();
  const labSteps={},gradeOf={};
  LEVELS.forEach(l=>l.units.forEach(u=>u.blocks.forEach(b=>{ if(b.id) gradeOf[b.id]=l.grade; if(b.t==='lab') labSteps[b.id]=b.steps.length; })));
  const changes={},added={},improved=[],other=[];let same=0;
  Object.entries(entries).forEach(([id,e])=>{
    const cur=MEM[id]&&typeof MEM[id]==='object'&&!Array.isArray(MEM[id])?MEM[id]:null;
    const next=Object.assign({},cur||{});
    let changed=false;
    if(e.ticks){
      const have=Array.isArray(next.ticks)?next.ticks:[];
      const t=new Set(have.concat(e.ticks.filter(n=>labSteps[id]==null||n<labSteps[id])));
      if(t.size>have.length){next.ticks=[...t].sort((a,b)=>a-b);changed=true;}
    }
    const done=e.done||(labSteps[id]!=null&&Array.isArray(next.ticks)&&next.ticks.length>=labSteps[id]);
    if(done&&!next.done){next.done=true;changed=true;}
    if(e.score!=null&&(!(next.total>0)||e.score/e.total>next.score/next.total)){next.score=e.score;next.total=e.total;changed=true;}
    if(!changed){same++;return;}
    changes[id]=next;
    if(!gradeOf[id]) other.push(id);
    else if(next.done&&!(cur&&cur.done)) added[gradeOf[id]]=(added[gradeOf[id]]||0)+1;
    else improved.push(id);
  });
  return {changes,added,improved,other,same,total:Object.keys(entries).length};
}

function renderMove(onMerged){
  const c=el('div','card mv');
  c.appendChild(el('h3',null,'Move your progress'));
  c.appendChild(el('p','sum','Your progress lives in this browser. A progress code carries it to another browser, another device, or a saved copy of this page: make the code here, then paste it into My progress there. The code lists completed activities, quiz scores, and lab steps only; your reflections, checklists, and notes stay here.'));
  // export
  c.appendChild(el('h4',null,'Take your progress with you'));
  const outRow=el('div','row');
  const make=el('button','btn sm','Show my progress code');
  const copy=el('button','btn sec sm','Copy code');copy.hidden=true;
  const outPill=el('span','pill');outPill.setAttribute('role','status');outPill.hidden=true;
  outRow.append(make,copy,outPill);
  const out=el('textarea','mv-code');out.readOnly=true;out.hidden=true;out.setAttribute('aria-label','Your progress code');out.spellcheck=false;
  make.addEventListener('click',()=>{
    store.load();
    const r=makeProgressCode();
    outPill.hidden=false;
    if(!r.count){out.hidden=true;copy.hidden=true;outPill.textContent='Complete an activity first; the code then carries it.';outPill.className='pill';return;}
    out.value=r.code;out.hidden=false;copy.hidden=false;
    outPill.textContent=`${r.count} activit${r.count===1?'y':'ies'} in this code`;outPill.className='pill ok';
    make.textContent='Refresh my progress code';
  });
  copy.addEventListener('click',()=>copyFromBox(out,outPill));
  c.append(outRow,out);
  // import
  c.appendChild(el('h4',null,'Bring progress here'));
  c.appendChild(el('p','sum','Paste a code from another browser or device. You see what it adds before anything changes, and merging keeps everything already saved here.'));
  const inp=el('textarea','mv-code');inp.placeholder='DL1-...';inp.setAttribute('aria-label','Progress code to bring here');inp.spellcheck=false;
  const inRow=el('div','row');
  const check=el('button','btn sm','Check this code');
  const merge=el('button','btn sm','Merge into this browser');merge.hidden=true;
  inRow.append(check,merge);
  const prev=el('div','mv-prev');prev.setAttribute('role','status');prev.hidden=true;
  /* the preview's plan is only shown; Merge plans again from the parsed entries against what is stored then,
     so a save from another tab between Check and Merge is kept */
  let plan=null,entries=null;
  const say=(html,bad)=>{prev.hidden=false;prev.innerHTML=html;prev.className='mv-prev'+(bad?' note warn':'');};
  inp.addEventListener('input',()=>{plan=null;entries=null;merge.hidden=true;});
  check.addEventListener('click',()=>{
    plan=null;entries=null;merge.hidden=true;
    const r=readProgressCode(inp.value);
    if(r.error){say(esc(r.error),true);return;}
    entries=r.entries;
    plan=planProgressMerge(r.entries);
    const n=Object.keys(plan.changes).length;
    const items=[];
    Object.entries(plan.added).forEach(([g,k])=>items.push(`<li>${g}: ${k} completed activit${k===1?'y':'ies'} to add</li>`));
    if(plan.improved.length) items.push(`<li>${plan.improved.length} lab${plan.improved.length===1?'':'s'} or quiz score${plan.improved.length===1?'':'s'} to bring forward</li>`);
    if(plan.other.length) items.push(`<li>${plan.other.length} activit${plan.other.length===1?'y':'ies'} from another edition of the page, kept for when you open that edition</li>`);
    const head=`This code holds ${plan.total} activit${plan.total===1?'y':'ies'}. `+(plan.same?`${plan.same} already match${plan.same===1?'es':''} this browser. `:'');
    if(!n){say(esc(head)+'Everything in it is already here.');return;}
    say(esc(head)+'Merging adds:<ul>'+items.join('')+'</ul>');
    merge.hidden=false;
  });
  merge.addEventListener('click',()=>{
    if(!entries) return;
    plan=planProgressMerge(entries);
    const n=Object.keys(plan.changes).length;
    store.setMany(plan.changes);
    plan=null;entries=null;merge.hidden=true;inp.value='';
    say(`Merged ${n} activit${n===1?'y':'ies'} into this browser. The totals above include them now.`);
    if(onMerged) onMerged();
    refreshChrome();
  });
  c.append(inp,inRow,prev);
  return c;
}

/* =====================================================================
   NAVIGATION (UX plan, Phase 2, 2026-10-21)
   Phones (below 920 px): a slim sticky bar (the course, the grade, "Unit N of M", and a Menu button) that hides
   while the reader scrolls down and returns on the way up; with reduced motion it stays in place. The Menu is a
   modal dialog: the four grades (two by two, each with its count of units done), the open grade's units as a
   numbered list with each unit's status, and the pages, Theme, and Width. Focus stays inside it, and Escape or
   Close returns focus to the Menu button. Laptops (920 px and up): the rail lists the open grade's units under it.
   A unit's status shows as a glyph and as text: done (every activity complete), in progress (opened, or partly
   complete), or not started. The progress store keeps, under "_nav": the last unit, the last unit of each grade,
   the units opened, and each grade whose intro the student has seen or opened. A visit without an address offers
   "Continue: <unit>" on the landing view, a grade button reopens that grade's last unit, and My progress opens
   each grade at its first unfinished unit.
   ===================================================================== */
const NAV='_nav';
const ST_GLYPH={done:'✓',part:'◐',none:'○'}, ST_TEXT={done:'done',part:'in progress',none:'ready to start'};
const ACT_NAME={quiz:'Quiz',match:'Match',spot:'Spot the problem',order:'Order',flash:'Flashcards',lab:'Lab',reflect:'Reflection',builder:'Builder',planner:'Planner',timer:'Timer'};
const VIS_TYPES=['compare','anatomy','stack','path','seq','hier','venn','scale'];
const navPanel=document.getElementById('navPanel'), menuBtn=document.getElementById('menuBtn'), mbar=document.querySelector('.mbar');

function navState(){ let v=null; try{ v=store.get(NAV); }catch(e){} return v&&typeof v==='object'&&!Array.isArray(v)?v:{}; }
/* a change to "_nav" reads what is stored now, applies the change, and saves it through the merging store */
function navSave(fn){
  if(navHold) return;
  try{
    store.load();
    const s=JSON.parse(JSON.stringify(navState()));
    if(fn(s)===false) return;
    store.set(NAV,s);
  }catch(e){}
}
/* a title's text (entities decoded, markup dropped) for text nodes and attributes; a template never runs or loads anything */
function titleText(h){ const t=document.createElement('template'); t.innerHTML=String(h==null?'':h); return t.content.textContent.replace(/\s+/g,' ').trim(); }
function visitedSet(){ const s=navState(); const v=new Set(Array.isArray(s.v)?s.v:[]); visitedNow.forEach(x=>v.add(x)); return v; }
function gradeUnitIds(id){ const L=levelById(id); if(L) return L.units.map(u=>u.id); const g=GRADE_INDEX.find(x=>x.id===id); return g?g.unitIds:[]; }
function startedRec(id){ const v=store.get(id); return !!v&&typeof v==='object'&&((Array.isArray(v.ticks)&&v.ticks.length>0)||(Array.isArray(v.r)&&v.r.some(Boolean))); }
function blockState(id){ return isDone(id)?'done':startedRec(id)?'part':'none'; }
function unitState(U,seen){
  const ids=U.blocks.filter(b=>b.id).map(b=>b.id);
  const done=ids.filter(isDone).length, opened=!!seen&&seen.has(U.id);
  if(ids.length?done===ids.length:opened) return 'done';
  return done||opened||ids.some(startedRec)?'part':'none';

function nextUnit(L){ const seen=visitedSet(); return L.units.find(U=>unitState(U,seen)!=='done')||null; }
const READY={sophomore:'s0q',junior:'j0q',senior:'se0q'};
/* the lowest item from this grade's readiness check: Core skills first, Explore before Revisit */
function readinessLow(L){
  const qid=READY[L.id];if(!qid)return null;
  let b=null;L.units.forEach(u=>u.blocks.forEach(x=>{if(x.t==='quiz'&&x.id===qid)b=x;}));if(!b)return null;
  const rec=store.get(qid);const r=rec&&Array.isArray(rec.r)?rec.r:null;if(!r||!r.length)return null;
  const cand=[];b.items.forEach((it,i)=>{const res=r[i]&&r[i][2];if(res==null||res===2)return;const m=quizMeta(it);cand.push({it,res,core:m.imp==='core'?0:1,i});});
  if(!cand.length)return null;cand.sort((a,c)=>a.core-c.core||a.res-c.res||a.i-c.i);
  const link=teachLink(cand[0].it);return link?{link,res:RESULT[cand[0].res],core:cand[0].core===0}:null;
}

/* the grade the Menu lists: the open grade, or the grade of the last unit */

/* the rail and the Menu follow the view: counts, unit lists, status, and the bar's "Unit N of M" */
function navMark(){
  if(!navBooted) return;
  if(current.page==='level'&&levelById(current.level)) visitedNow.add(current.unit);
  const seen=visitedSet(), grades=gradeList();
  const lvs=document.querySelectorAll('#ladder .lv');

    if(n.textContent!==t) n.textContent=t;
  });
  /* the open grade's units list once, in #mtoc under the grade grid (the rail on laptops, the Menu on phones) */
  const mg=menuGradeId(), gi=gradeInfo(mg), ML=levelById(mg), lbl=document.getElementById('mtocLbl'), host=document.getElementById('mtocList');
  if(lbl&&gi) lbl.textContent=gi.grade+' units';
  if(host){
    let ol=host.querySelector('ol.toc');
    if(!ML){ const w=gi&&!inPart(gi.id)?gi.grade+' is in the online course, and in its own download.':'Loading '+(gi?gi.grade:'')+'…', p=host.querySelector('.wait');
      if(!p||p.textContent!==w){ host.innerHTML=''; host.appendChild(el('p','wait',esc(w))); } }
    else{ if(!ol||ol.dataset.g!==mg){ host.innerHTML=''; ol=unitList(ML); host.appendChild(ol); } markList(ol,seen); }
  }
  main.querySelectorAll('ol.toc').forEach(ol=>markList(ol,seen));
  markOutline();
  flowMark();
  navWhere();
  navPath();
  if(wideMQ&&wideMQ.matches) requestAnimationFrame(railToCurrent);

function navRefresh(){ navMark(); }
/* laptops: the rail scrolls (on its own) to keep the current unit in sight */
function railToCurrent(){
  const a=railEl&&railEl.querySelector('#mtoc a.tu[aria-current="page"]'); if(!a) return;
  const r=railEl.getBoundingClientRect(), c=a.getBoundingClientRect(), t=railEl.querySelector('.rail-tools'), tb=t?t.offsetHeight:0;

/* the bar's place: on a unit, a button ("Grade · Unit N of M ▾") that opens the Menu at the grade's unit list */
let menuFrom=null;

/* the path beside "Unit N of M": each unit of the grade as a square (done, in progress, or ready), the open one ringed;
   every other square links to its unit (a pointer shortcut: the list stays hidden from screen readers and out of the
   Tab order, since the bar's place, the Menu, and the rail list the same units with their names and status) */
function navPath(){
  const pth=main.querySelector('.uhead .upath'), L=current.page==='level'&&levelById(current.level);
  if(!pth||!L) return;
  const seen=visitedSet(), sts=L.units.map(U=>unitState(U,seen));

/* ---- the phone bar: it hides while the reader scrolls down and returns on the way up ---- */
let barY=-1, barTick=false, barQuietUntil=0;
function phoneNav(){ return !(wideMQ&&wideMQ.matches); }
function showBar(){ if(railEl) railEl.classList.remove('hid'); }
/* the app's own scrolls (a new view, a unit's top, an outline jump) keep the bar in place */
function barQuiet(){ barQuietUntil=(typeof performance!=='undefined'?performance.now():Date.now())+500; barY=-1; showBar(); }
function barScroll(){
  barTick=false;

  const chunks=[];
  bl.forEach((b,i)=>{ if(i&&flowGlue(b)) chunks[chunks.length-1].push(i); else chunks.push([i]); });
  const wt=bl.map(b=>{ let s=0; try{ s=JSON.stringify(b).length; }catch(e){} return Math.max(700,s); });
  const cw=chunks.map(c=>c.reduce((a,i)=>a+wt[i],0)), W=cw.reduce((a,x)=>a+x,0), m=chunks.length;

}

/* ---- Read aloud: each top-level card, where speechSynthesis exists (a local voice when one is installed) ---- */
const flowSpeech=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance==='function'?speechSynthesis:null;
let flowRaBtn=null;
/* a card's name for its Read aloud button: its heading, without the thinking-level badge */
function flowRaTitle(nd){ const h=nd.querySelector(':scope>h3,:scope>h4'); if(!h) return ''; const k=h.cloneNode(true); k.querySelectorAll('.blm,.imp,.sr').forEach(x=>x.remove()); return k.textContent.replace(/\s+/g,' ').trim(); }
function flowRaName(b,stop){ b.textContent=stop?'Stop reading':'Read aloud'; if(b.dataset.t) b.setAttribute('aria-label',(stop?'Stop reading: ':'Read aloud: ')+b.dataset.t); }
function flowRaAdd(nd){
  if(!flowSpeech||!nd.classList||!nd.classList.contains('card')||nd.querySelector(':scope>.ra-row')) return;
  const r=el('div','ra-row'), b=el('button','tbtn ra','Read aloud');b.type='button';

}
function flowRaStop(){
  if(!flowSpeech) return;
  const b=flowRaBtn; flowRaBtn=null;
  try{ flowSpeech.cancel(); }catch(e){}

}
function flowRaVoice(){
  let vs=[]; try{ vs=flowSpeech.getVoices()||[]; }catch(e){}
  const lang=(document.documentElement.lang||'en').slice(0,2).toLowerCase();
  return vs.find(v=>v.localService&&String(v.lang).slice(0,2).toLowerCase()===lang)||vs.find(v=>v.localService)||null;
}
/* what Read aloud says: a copy of the card without its buttons (a drill's own lines, items, and steps stay), badges,
   hidden or screen-reader-only text, and the inside of closed panels. Each list item, option, line, and block is its
   own part, and a part splits into sentences only after ".", "!", or "?" and a space (so 192.168.1.1 stays whole). */
const RA_BLOCK=/^(P|DIV|LI|UL|OL|DL|DT|DD|TR|TD|TH|TABLE|THEAD|TBODY|H[1-6]|PRE|FIGURE|FIGCAPTION|DETAILS|SUMMARY|LABEL|BLOCKQUOTE|SECTION|BUTTON)$/;
function flowRaParts(card){
  const k=card.cloneNode(true);
  k.querySelectorAll('details:not([open])').forEach(d=>[...d.children].forEach(x=>{ if(x.tagName!=='SUMMARY') x.remove(); }));
  k.querySelectorAll('.blm,.imp,.ra-row,[hidden],[aria-hidden="true"],.sr,.sl-tag,.msel,.scroll-cue,svg,input,textarea,select,script,style').forEach(x=>x.remove());
  k.querySelectorAll('button').forEach(x=>{ if(!x.matches('.sl,.mi,.oi')) x.remove(); });
  const parts=[]; let buf='';
  /* a lone item number ("1.") stays with the sentence after it */
  const flush=()=>{ const t=buf.replace(/\s+/g,' ').trim(); buf=''; let lead=''; if(t) t.replace(/([.!?])\s+/g,'$1\u0001').split('\u0001').forEach(s=>{ s=s.trim(); if(!s) return; if(/^\d+[.)]$/.test(s)){ lead+=s+' '; return; } parts.push(lead+s); lead=''; }); if(lead) parts.push(lead.trim()); };
  const walk=n=>{
    if(n.nodeType===3){ buf+=n.nodeValue; return; }
    if(n.nodeType!==1) return;
    if(n.tagName==='BR'){ buf+=' '; return; }
    const blk=RA_BLOCK.test(n.tagName)||n.classList.contains('opt')||n.classList.contains('sl-t')||n.classList.contains('tln');
    if(blk) flush();
    n.childNodes.forEach(walk);
    if(blk) flush();
  };
  walk(k);
  return parts;
}
function flowRaToggle(card,b){
  if(flowRaBtn===b){ flowRaStop(); return; }
  flowRaStop();
  const parts=flowRaParts(card);
  if(!parts.length) return;
  const v=flowRaVoice();
  flowRaBtn=b; flowRaName(b,true);
  parts.forEach((s,i)=>{
    const u=new SpeechSynthesisUtterance(s);
    if(v){ u.voice=v; u.lang=v.lang; }
    u.addEventListener('error',()=>{ if(flowRaBtn===b) flowRaStop(); });
    if(i===parts.length-1) u.addEventListener('end',()=>{ if(flowRaBtn===b){ flowRaBtn=null; flowRaName(b,false); } });
    try{ flowSpeech.speak(u); }catch(e){}
  });
}

function spotText(t){ return esc(t).replace(/(?:https?:\/\/|www\.)[^\s<]+/g,u=>u.replace(/-/g,'‑').replace(/([\/.])/g,'$1<wbr>')); }
function flowBoot(){
  const de=document.documentElement;

     ['A trace from KAILUA-WS07 shows hops 1 to 3 answering, then <code>* * *</code> on every line to the end. What can you conclude?',['The trouble starts at hop 4 or a firewall just past it, and the trace alone cannot say which','The destination server is down','Hop 3 drops all traffic','Every hop past 3 is under attack'],0,'Test the service itself, such as with Test-NetConnection and its port, before you call a server down. <a href="#sophomore/s7">Review: Network tools and a safer router</a>',{whys:['Replies stop after hop 3, so the trouble starts at hop 4 or a filter just past it, and the stars look the same for both.','Stars show only where replies stop.','Hop 3 answered, so it passed traffic on.','Stars fit a filter or a fault, and attacks are a separate question.'],imp:'core',c:'net-troubleshooting-tools'}],
     ['Visitors to https://booking.kapaa-kayak.example get a name-mismatch warning. Which certificate field lists every name the certificate covers?',['Subject Alternative Name (SAN)','Issuer','Valid to (notAfter)','Serial number'],0,'Reissue the certificate with booking.kapaa-kayak.example in the SAN list; browsers ignore the subject CN. <a href="#sophomore/s8">Review: Web traffic, HTTPS, and certificates</a>',{whys:['Browsers match the address against the SAN list, so a host missing from it brings the name-mismatch warning.','Issuer names the certificate authority.','notAfter sets the expiry.','The serial number identifies the certificate.'],imp:'core',c:'crypto-certificates'}],
     ['An email’s From shows <code>office@kahikina-high.example</code>, and its Return-Path shows <code>bounce@mail-relay.example</code>. What does that tell you?',['It is fake, since the two domains differ','It is real, since the Return-Path is only the bounce address','The Reply-To line settles who sent it','Another system sent it, and dmarc=pass for kahikina-high.example in Authentication-Results would prove the From'],3,'SPF checks the Return-Path; read your own server’s Authentication-Results before you trust the message. <a href="#sophomore/s9">Review: Check before you trust: messages, links, and files</a>',{whys:['Mailing services often send for a school, so the domains differ often.','SPF checks the Return-Path, and the From still needs DMARC.','Reply-To says where replies go.','A different Return-Path means another system sent it, and DMARC is the check that ties a pass to the visible From.'],imp:'core',c:'threat-email-checks'}],
     ['Event 4625 shows one failed sign-in for each of 40 different accounts, all from 203.0.113.50 within two minutes, and no 4740 follows. Which pattern is this?',['Brute force against one account','A user who forgot a password','A password spray','An account lockout'],2,'MFA, banned common passwords, and an alert when one address touches many names stop a spray. <a href="#sophomore/s10">Review: Read the logs: Windows, Linux, and network devices</a>',{whys:['Brute force hits one account many times.','One user would fail on one account.','One try each on 40 accounts from one address stays under the lockout threshold, which is the spray pattern and why no 4740 appears.','A lockout would log 4740.'],imp:'core',c:'det-windows-events'}],
     ['An audit script runs <code>grep "Failed" /var/log/auth.lg | sort</code>, with a typo in the file name. Without a safety line, it prints an empty report and carries on. What does <code>set -euo pipefail</code> change?',['The script stops there: pipefail passes grep’s failure on, and -e halts at a failed command','It corrects the file name','It hides the error so the report stays tidy','Nothing, since a pipeline reports only its last command in every mode'],0,'set -euo pipefail trades a quiet, wrong report for a loud stop; -u also stops at an unset variable. <a href="#sophomore/s11">Review: Scripts for defenders</a>',{whys:['pipefail makes the whole pipeline fail when grep fails, and -e then stops the script at that failure.','The shell runs the name exactly as typed.','These options make errors loud.','pipefail changes exactly that rule.'],imp:'good',c:'comp-scripting'}],
     ['The padlock shows in the browser on orders.manoa-bakery.example. What does it promise, and what does it leave out?',['That the page is honest; nothing is left out','That the connection to that host is encrypted and the certificate matches the name; it says nothing about who runs the site or what the page does','That the site is safe to type a password into','That the site has no malware'],1,'The padlock speaks to the connection and the host name alone, never to honesty. <a href="#freshman/f11">Review: The web and the cloud in plain words</a>',{whys:['Certificates prove a name and encrypt the link; they say nothing about honesty.','The padlock promises an encrypted connection to the named host, and anyone can get a certificate for a name they control, so it says nothing about who runs the site or what the page does.','A phishing page can carry a valid padlock; the name in the address bar decides where a password goes.','Malware checks come from other tools; the padlock speaks only about the connection.'],imp:'core',c:'crypto-certificates'}],
     ['Hilo Lehua Clinic runs MFA on remote access, a host firewall on every PC, nightly backups kept off site, and a logging server. Which principle is that, and why does it help when one control fails?',['Least privilege: each control limits one account','Defense in depth: the controls are layers, so an attacker who passes one still meets the next','Separation of duties: each control belongs to one person','Availability: four controls keep the clinic online'],1,'One failed control, such as a stolen password, still meets the firewall, the logs, and the backups. <a href="#freshman/f3">Review: Security principles</a>',{whys:['Least privilege limits what each account can reach; these four controls guard different stages of an attack.','Defense in depth stacks controls so an attacker who passes one, such as a stolen password, still meets the next, and the logs record the attempt.','Separation of duties is about people and approvals, and these are technical layers.','Backups serve availability; the pattern of four different layers is defense in depth.'],imp:'core',c:'sec-defense-in-depth'}]
   ])
  ]},
 {id:'j1',title:'Windows Server and Active Directory',bloom:'Apply',sum:'Domain controllers, users and groups in AD, device join, LDAPS, Kerberos beside NTLM, service identities, unique local admin passwords, account lifecycle, and the few server roles you will actually touch.',

   ],{intro:'Ask first: is this machine a domain controller, a domain member, or on its own?',
     note:'<b>Read the prefix.</b> <code>EXAMPLE\\malia</code> is a domain account; <code>PC-07\\malia</code> or <code>.\\malia</code> is a local account on that machine. The two are separate accounts with separate passwords, even with the same name.'}),
   QUIZ('j1ck1','Check yourself',[

   ]),

   HIER('Who holds admin power, and how far it reaches',
     {name:'Forest',note:'<b>Enterprise Admins</b> lives in the forest root domain and has full control of every domain in the forest. <b>Schema Admins</b> can change the directory schema.',tone:'l4',children:[
       {name:'Domain: example.com',note:'<b>Domain Admins</b>: full control of this domain, and a member of the local Administrators group on every computer joined to it. The built-in domain <b>Administrators</b> group: full control of the domain controllers and the directory.',tone:'l3',children:[
         {name:'Domain controllers',note:'Governed by the domain groups above.',tone:'l2'},
         {name:'Member server or desktop',note:'The <b>local Administrators</b> group: full control of this one machine. It holds Domain Admins plus any account added on the machine itself.',tone:'l1'}]}]},
     {intro:'Several groups have “admin” in the name, and each one reaches a different distance. An extra member in any of them is an administrator.',
      note:'<b>Audit every level.</b> <code>Get-ADGroupMember "Enterprise Admins"</code>, <code>"Domain Admins"</code>, and <code>"Administrators"</code> on a DC; <code>Get-LocalGroupMember Administrators</code> on each member server and desktop. Run the same check on Account Operators, Server Operators, Backup Operators, Print Operators, and DnsAdmins, which reach admin power by another road. Compare each list with the brief.',
      key:[['l4','Forest-wide'],['l3','Domain-wide'],['l2','Domain controllers'],['l1','One machine']]}),
   DETAIL('Privileged groups and server feature names',
     TIPS('<b>Admin by design:</b> Enterprise Admins, Domain Admins, Schema Admins, and Administrators. <b>Admin by another road:</b> Account Operators, Server Operators, Backup Operators, Print Operators, and DnsAdmins. Worth auditing too: Group Policy Creator Owners, whose members create GPOs that take effect once someone links them.',
          '<b>Tiers.</b> Tier 0: the DCs and anything that controls them; Tier 0 admins sign in only to Tier 0 machines. Tier 1: servers. Tier 2: workstations. Each admin keeps a separate account per tier, so a stolen workstation never holds a Domain Admins credential. Certificate Services is Tier 0: CA administrators, Cert Publishers, and anyone who can enroll in a template that lets the requester name any user and allows sign-in need the same audit as Domain Admins.',
          '<b>Feature names:</b> AD-Domain-Services, DNS, DHCP, Web-Server, Web-Ftp-Server (the FTP Server role service), FS-SMB1, RSAT-AD-Tools, and Windows-Defender. Defender can be installed yet passive beside another antivirus: <code>Get-MpComputerStatus | Select-Object AMRunningMode</code> reads Normal when it is the active protection. When the feature is missing, install it and restart before you scan.',
          '<b>Which kind of machine:</b> <code>(Get-CimInstance Win32_ComputerSystem).DomainRole</code> returns 0 or 1 for a workstation, 2 or 3 for a server, and 4 or 5 for a domain controller.')),
   C('LDAP: how programs ask AD questions','Understand',
     P('<b>LDAP</b> is how programs ask AD questions; <a href="#sophomore/s4">Services and ports</a> listed its ports. A plain simple bind sends the password readable. Requiring signing makes the DC refuse simple and unsigned binds on 389; new Windows Server 2025 domains require it by default. An old scanner or printer that only knows simple binds moves to LDAPS (636).')),
   DETAIL('Distinguished names and the three LDAP forms',
     ANATOMY('One distinguished name',[
      {name:'DC=example,DC=com',tag:'the domain example.com',tone:'l4',children:[
       {name:'OU=Workstations',tag:'a folder that GPOs link to',tone:'l3',children:[
        {core:true,name:'CN=PC-07',sub:'the object itself: a computer'}]}]}
     ],{strip:['Read right to left','CN=PC-07,<br>OU=Workstations,<br>DC=example,DC=com','CN=PC-07,OU=Workstations,DC=example,DC=com'],
      facts:{head:['Part','Names'],rows:[['CN','Common name: a user, computer, or group, and the built-in containers (CN=Users)'],['OU','Organizational unit: a folder you create'],['DC','Domain component: one label of the DNS name']]},
      intro:'Programs find every AD object by its distinguished name (DN): the path from the object up to the domain.',
      caption:'Each comma climbs one level: object, then OU, then the domain. CN=Users is a container rather than an OU.'}),
     COMPARE('LDAP, signed LDAP, and LDAPS',[
      {name:'Plain LDAP',tag:'389',tone:'bad',rows:[['Protects','Nothing'],['Still leaks','A simple bind sends the password readable, and anyone on the path can read or change answers']]},
      {name:'Signed LDAP',tag:'389',tone:'amber',rows:[['Protects','Each message from tampering; the sign-in uses Kerberos or NTLM, so no password crosses'],['Still leaks','Data, unless the client also seals (encrypts) it, which Windows clients usually do']]},
      {name:'LDAPS',tag:'636',tone:'ok',rows:[['Protects','Everything, inside TLS from the first byte, using the DC’s certificate'],['Still leaks','Who talks to whom; a relayed sign-in, until channel binding ties it to this TLS session']]}
     ],{caption:'Plain LDAP shows everything, signing stops tampering, and LDAPS hides the conversation too.'})),
   COMPARE('Remove from a group, disable, or delete: three different actions',[
     {name:'Remove from a group',tag:'Remove-ADGroupMember',tone:'l2',
      rows:[['Ends','The rights and access that group gives'],
            ['Keeps','The account, its password, its files, and its other groups'],
            ['Sign-in','Still works; the change applies at the next sign-in, with a new access token'],
            ['Undo','Add the member back'],
            ['Use it for','An authorized user who holds more privilege than the brief grants']],
      hook:'taking back a key and leaving the badge.'},
     {name:'Disable',tag:'Disable-ADAccount',tone:'amber',
      rows:[['Ends','Every new sign-in'],
            ['Keeps','The SID, the group memberships, and the files'],
            ['Sign-in','Blocked'],
            ['Undo','<code>Enable-ADAccount</code>'],
            ['Use it for','An unauthorized account the brief asks you to keep']],
      hook:'suspending the badge.'},
     {name:'Delete',tag:'Remove-ADUser',tone:'bad',
      rows:[['Ends','The account and its SID'],
            ['Sign-in','Gone, along with the account'],
            ['Afterward','A new account with the same name gets a new SID and starts from scratch'],
            ['Undo','The AD Recycle Bin, if it was on before the deletion; otherwise a slower restore from a domain controller backup'],
            ['Use it for','An unauthorized account the brief tells you to remove']],

   ],{note:'<b>Follow the brief.</b> Authorized users stay enabled; remove only their extra privilege. Unauthorized accounts are disabled or deleted, as the brief instructs. On a local machine the matching cmdlets are <code>Remove-LocalGroupMember</code>, <code>Disable-LocalUser</code>, and <code>Remove-LocalUser</code>.',
     bloom:'Apply'}),
   QUIZ('j1ck2','Check yourself',[
     ['The brief lists Domain Admins as: administrator, malia. You find administrator, malia, kanoa. Action?',['Delete kanoa','Remove kanoa from Domain Admins (delete only if kanoa is also an unauthorized account)','Leave it','Add everyone to be safe'],1,'Deleting an account the scenario expects elsewhere breaks availability for that person.',{whys:['Deleting removes an account the scenario may still need; the finding is the group membership.','Removing the membership takes the power and keeps the person’s account.','kanoa holds Domain Admins without a line in the brief, which is a finding.','Adding everyone hands every account full domain control, the opposite of least privilege.'],imp:'core',c:'host-admin-groups'}]
   ]),
   C('Accounts over time: joiner, mover, leaver','Apply',
     SEQ('Joiner, mover, leaver',[
      ['Joiner','HR confirms the hire and role: create the account with the role’s groups only, and force a password change at first sign-in.','l1'],
      ['Mover','HR records the new role: add the new groups and remove the old ones the same day (<b>remove from a group</b>).','l2'],
      ['Leaver','HR sends the last day: <b>disable</b> at the exit time, end open sessions, reset the password, and strip the groups.','amber'],
      ['Retention ends','<b>Delete</b> when the retention period in policy ends, after files and mail are handed over.','bad'],
      {ask:'Does an AD export match the HR list?',branches:[['Enabled, but gone from HR','Disable now, then ask HR and the manager'],['Groups beyond the role','Remove them and log the change']]}
     ],{intro:'Accounts follow people. Human resources (HR) knows when a person joins, moves, or leaves; the directory should change the same day.',
       note:'When an incident involves a staff member, HR handles the people side under policy and law, and security brings the evidence.'}),
     CMDS('Find the accounts time forgot',[
      ['Search-ADAccount -AccountInactive -TimeSpan 45.00:00:00 -UsersOnly','No sign-in for 45 days: leavers nobody disabled, and unused service accounts.'],
      ['Search-ADAccount -PasswordNeverExpires -UsersOnly','Passwords set never to expire; a service needing one moves to a gMSA.'],
      ['Get-ADUser keola -Properties MemberOf','Every group one account holds: compare with the role HR lists.']
     ])),
   C('How Windows checks a password over the network','Understand',
     COMPARE('NTLM and Kerberos',[
      {name:'NTLM',tag:'challenge and response',tone:'amber',rows:[
        ['Who checks the password','The server, which hands a domain account’s answer to a DC every time'],
        ['What crosses the wire','A challenge and a response computed from the password hash'],
        ['What it needs','Nothing extra: it works by IP address and in workgroups'],
        ['Port','Inside the protocol in use, such as SMB on 445'],
        ['DC event','4776: an NTLM credential check']],
       hook:'showing your ID at every door.'},
      {name:'Kerberos',tag:'tickets',tone:'l3',rows:[
        ['Who checks the password','The DC, once at sign-in; it then issues tickets that each server reads without asking the DC'],
        ['What crosses the wire','A timestamp locked with the password key, then tickets: never the password or its hash'],
        ['What it needs','Clocks within five minutes of the DC, DNS names (an IP address falls back to NTLM), and an SPN for each service'],
        ['Port','88 to the DC'],
        ['DC events','4768 ticket-granting ticket, 4769 service ticket, and 4771 failed pre-authentication']],
       hook:'a fair wristband: checked once, shown at every ride.'}
     ],{caption:'Kerberos is the default in a domain. NTLM steps in when a name, a clock, or an SPN is missing, so every 4776 has a reason worth finding.',bloom:'Understand'}),
     TIPS('<b>Refuse the old formats.</b> Security Options &gt; Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM &amp; NTLM. Windows 11 24H2 and Windows Server 2025 remove NTLMv1, so check the level on older releases and in mixed domains. Network security: Minimum session security for NTLM SSP based clients and servers = Require NTLMv2 session security and Require 128-bit encryption protects the traffic that follows the sign-in.',
          '<b>Relay.</b> An attacker who captures an NTLM exchange can forward it to another server and act as the victim.',
          'Requiring <b>SMB signing</b>, plus LDAP signing on a DC, blocks the forwarded sign-in: <code>Get-SmbServerConfiguration | Select-Object RequireSecuritySignature</code> should read True.',
          '<b>Anonymous enumeration.</b> A null session, an anonymous connection, can list accounts and shares; Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled closes it. Network access: Sharing and security model for local accounts = Classic lets local accounts sign in over the network as themselves (Guest only maps every one to Guest), and Network access: Restrict clients allowed to make remote calls to SAM limits who may list accounts remotely, Administrators alone by default since Windows 10 1607 and Server 2016.'),
     DETAIL('NTLM in four steps, and the SMB1 signing options',
       SEQ('NTLM in four steps',[
         ['Challenge','The server sends a random number.','l1'],
         ['Response','The client answers with a value computed from the challenge and the password hash; the password itself stays home.','l2'],
         ['Check','The server, or a domain controller for a domain account, computes the same value and compares the two.','l3'],
         {ask:'Which response format did the client send?',branches:[['LM or NTLMv1','Old formats that crack quickly: refuse them.'],['NTLMv2','The current format. In a domain, Kerberos (compared above) comes first, and NTLMv2 is the fallback.']]}
       ],{caption:'NTLM proves you know the password hash without sending it, and the format decides how hard a captured answer is to crack.'}),
       P('The “if client agrees” and “if server agrees” signing options matter only for SMB1; SMB2 and SMB3 sign whenever either side requires it.'))),
   C('Service identities and local admin passwords','Apply',
     COMPARE('Service identities',[
      {name:'LocalService',tone:'l1',rows:[['Local power','A standard user’s'],['On the network','Anonymous'],['Password','Windows; nobody knows it'],['Best use','A service that needs nothing from the network']]},
      {name:'NetworkService or virtual account',tag:'NT SERVICE\\name',tone:'l2',rows:[['Local power','A standard user’s; a virtual account adds its own SID for permissions'],['On the network','The computer account (PC-07$)'],['Password','Windows'],['Best use','One-machine services; IIS app pools run this way']]},
      {name:'gMSA',tone:'ok',rows:[['Local power','Only what you grant'],['On the network','Its own domain identity'],['Password','AD rotates it every 30 days; nobody knows it'],['Best use','A service that needs its own identity on several servers']]},
      {name:'Domain user account',tone:'amber',rows:[['Local power','Only what you grant'],['On the network','Its own domain identity'],['Password','A person sets it, and often never changes it'],['Best use','An old app that cannot run as a gMSA, with a long random password']]}
     ],{intro:'Every service runs as some account. Give it the least that works.'}),
     NOTE('<b>Avoid:</b> LocalSystem for a service that a lesser account can run (it holds full power over the machine), and above all a service account in Domain Admins, like svc_print in the spot below: one flaw in that service hands over the whole domain.',true),
     COMPARE('One shared local admin password, or Windows LAPS (built in)',[
      {name:'One shared password',tag:'cloned from an image',tone:'bad',rows:[['One leak opens','Every PC built from the image'],['Rotation','Rarely, by hand on each PC'],['Who can read it','Anyone ever told it'],['Audit trail','None'],['On DCs','The DSRM password, set once at promotion']]},
      {name:'Windows LAPS',tag:'built in',tone:'ok',rows:[['One leak opens','One PC, until the next rotation'],['Rotation','Every 30 days by default, and soon after each use'],['Who can read it','Only groups granted read on the computer object'],['Audit trail','Each read can be audited'],['Read it with','<code>Get-LapsADPassword</code> <code>KAILUA-WS07 -AsPlainText</code>'],['Backed up to','AD or Microsoft Entra ID'],['On DCs','Also manages the DSRM password']]}
     ],{intro:'When one image sets the same local Administrator password on every PC, one stolen password or hash opens them all.',
       caption:'LAPS gives each machine its own rotating local admin password, so one leak stays one machine.'}),
     DETAIL('Legacy Microsoft LAPS',
       P('Legacy Microsoft LAPS, the separate download, is deprecated; Windows LAPS ships in current Windows and Windows Server.'))),
   C('Server roles and features','Apply',
     CMDS('See and shrink the attack surface',[
       ['Get-WindowsFeature | Where-Object Installed','Every installed role and feature. Keep only the ones the brief justifies.'],
       ['Uninstall-WindowsFeature -Name Web-Ftp-Server','Example: remove the FTP Server role service when the brief omits it.'],
       ['Get-Service | Where-Object {$_.Status -eq "Running"} | Select-Object Name,DisplayName','Running services, same idea as the desktop.'],
       ['sc.exe \\\\HILO-FS01 qc Spooler','The Sophomore Command Prompt tools reach other servers: sc.exe takes a server name first.'],
       ['Get-SmbShare | Select-Object Name,Path,Description','File shares. Keep ADMIN$, C$, and IPC$, plus SYSVOL and NETLOGON on a DC, which Group Policy and logon scripts need; remove shares the scenario leaves unexplained with Remove-SmbShare.'],
       ['Get-DnsServerResourceRecord -ZoneName example.com','If it is a DNS server: look for stray records.']
     ]),
     TIPS('<b>A DNS server you keep.</b> Zone transfers to any host hand out the whole network map, and unsecured dynamic updates let anyone rewrite records, so close transfers and require secure updates. <b>A DHCP server you keep.</b> In a domain, a Windows DHCP server needs authorization in AD before it hands out addresses, so an unauthorized one is a rogue.'),
     DETAIL('Server Core: tools without a desktop',
       P('<b>Server Core</b> is the Windows Server install option without a desktop, and Microsoft recommends it. On it, sc.exe, netsh advfirewall, reg, and the <code>sconfig</code> menu (updates, network, and Remote Desktop) do the work of the consoles.'))),
   QUIZ('j1ck3','Check yourself',[
     ['A server runs the FTP Server role service (Web-Ftp-Server), which is absent from the brief. Best action?',['Keep it','Uninstall the role and confirm the web site (if required) still works','Only firewall it','Rename it'],1,'Remove extra roles to shrink the attack surface, then verify required services survive.',{whys:['A role outside the brief adds attack surface with no business use.','Removing the role shrinks the attack surface, and the check proves the site still works.','A firewall rule hides the service, yet the extra software stays installed and still needs care.','A new name changes the label and leaves the service running.'],imp:'core',c:'win-server-roles'}]
   ]),
   C('Web and database servers you keep','Understand',
     TIPS('<b>Keep the site, shrink what it shows.</b> Directory listing goes off, version banners go off, and default pages and sample apps go.',
          '<b>Anonymous read access stays only for a public site;</b> everyone else signs in.',
          '<b>Upload folders hold data only,</b> so nothing in them runs, and the web root (C:\\inetpub\\wwwroot on IIS, /var/www/html on Apache) holds only the site’s own files: a stray script there is a likely webshell.',
          '<b>A database used only by the site</b> listens on 127.0.0.1 and gives the site an account limited to its own database.',
          '<b>On IIS</b> keep World Wide Web Services. <a href="#senior/se2">Web application security</a> maps these habits to the OWASP Top 10, and the Apache settings sit in the <a href="#sophomore/s4">Services and ports</a> detail panel.'),
     DETAIL('Default shares, DNS, DHCP, and IIS',
       TIPS('<b>Default shares:</b> ADMIN$, C$ (and the other drive letters), and IPC$; a DC adds SYSVOL and NETLOGON.',
            '<b>DNS:</b> SecureSecondaries set to NoTransfer or TransferToZoneNameServer (TransferAnyServer leaks the zone), and DynamicUpdate set to Secure on AD-integrated zones. _msdcs.DOMAIN is the normal AD locator zone, and forwarders are normal.',
            '<b>DHCP:</b> an AD-joined DHCP server needs authorization in AD; <code>Get-DhcpServerInDC</code> lists the authorized ones.',
            '<b>Normal DC ports:</b> 53, 88, 135, 389, 445, 464, 636, 3268, 3269, 9389 (AD Web Services, which the AD PowerShell cmdlets use), and dynamic RPC.',
            '<b>IIS:</b> web root C:\\inetpub\\wwwroot; Anonymous Authentication (IUSR) stays for a public site; Directory Browsing off; Request Filtering can deny web requests for .exe and .ps1 files, and FTP Request Filtering can deny those extensions on upload; FTP SSL Settings require SSL when FTP must stay.'))),
   SPOT('j1sp','Read this server’s output','Brief: the domain admins are Administrator and malia; the server runs DNS and the company web site, with FTP and SMBv1 left out. Tap every line that breaks the brief, then Check.',[
     ['PS> Get-ADGroupMember "Domain Admins" | Select-Object Name',null],
     ['Administrator',null],
     ['malia',null,'The brief names malia as one of the two domain admins.'],
     ['svc_print','A service account in Domain Admins is an administrator everywhere in the domain. Remove it from the group and give it only the rights its service needs.'],
     ['PS> Get-ADGroupMember DnsAdmins | Select-Object Name',null],
     ['kawika','DnsAdmins can load code into the DNS service, which runs as SYSTEM: admin power by another road, and the brief gives admin power only to Administrator and malia. Remove kawika from DnsAdmins.'],
     ['PS> Get-WindowsFeature | Where-Object Installed | Select-Object Name',null],
     ['AD-Domain-Services',null],
     ['DNS',null,'The brief names DNS, and AD relies on it to find its domain controllers.'],
     ['Web-Server',null,'The brief says this server runs the company web site, so the web server role belongs.'],
     ['Web-Ftp-Server','The brief leaves FTP out: Uninstall-WindowsFeature -Name Web-Ftp-Server, then confirm the web site still answers.'],
     ['FS-SMB1','SMBv1 is the obsolete, wormable protocol that EternalBlue exploited. Remove it: Uninstall-WindowsFeature -Name FS-SMB1.']
   ]),
   SPOT('j1sp2','Spot the stale and over-powered accounts','Honua Logistics, 20 October 2026. HR lists the staff as malia, keola, pua, and kawika; kanoa left on 1 September; pua moved from Finance to Dispatch in August. Domain Admins: Administrator and malia. Tap every line that breaks the HR list or least privilege, then Check.',[
     ['PS> Search-ADAccount -AccountInactive -TimeSpan 45.00:00:00 -UsersOnly | Select-Object Name,Enabled,LastLogonDate',null],
     ['kanoa      True     8/29/2026 4:51:07 PM','kanoa left on 1 September and is still enabled. Disable the account now, reset the password, and strip its groups.'],
     ['Guest      False',null,'Guest is meant to stay unused, so it shows as inactive, and False means disabled: the safe state for Guest.'],
     ['svc_scan   True     3/2/2025 9:00:12 AM','An enabled service account unused for 19 months. Confirm with its owner, then disable it; a dormant account with a password is a door nobody watches.'],
     ['PS> Search-ADAccount -PasswordNeverExpires -UsersOnly | Select-Object Name',null],
     ['Guest',null,'Guest is disabled, so its never-expiring password opens nothing.'],
     ['svc_backup','A person-managed service password that never changes. Move the service to a gMSA, or set a long random password and rotate it.'],
     ['PS> (Get-ADUser pua -Properties MemberOf).MemberOf',null],
     ['CN=Dispatch,OU=Groups,DC=honua,DC=example',null,'pua works in Dispatch now, so this group is the access her move calls for.'],
     ['CN=Finance,OU=Groups,DC=honua,DC=example','pua moved to Dispatch in August and kept Finance: a mover’s old group. Remove pua from Finance.'],
     ['PS> Get-ADGroupMember "Domain Admins" | Select-Object Name',null],
     ['Administrator',null],
     ['malia',null],
     ['keola','The brief names only Administrator and malia. Remove keola from Domain Admins; if keola needs admin work, give a separate admin account for that tier.']
   ]),
   QUIZ('j1q','Check: server and AD',[
     ['The domain password policy is set in',['secpol.msc on each machine','the Default Domain Policy GPO','each user’s properties','the registry only'],1,'Group Policy at the domain level governs domain accounts; local policy governs only local ones.',{whys:['Local policy governs only local accounts; domain accounts follow the domain GPO.','The Default Domain Policy GPO sets password policy for every domain account.','User properties hold per-account flags, such as never-expire, rather than the policy.','The domain policy lives in a GPO; a registry edit touches one machine.'],imp:'core',c:'win-group-policy'}]
   ]),
   LINKS('Go further',['ms-winsrv','ms-win-sec','ms-laps','cis','stig','t4t-ld-winsrv','t4t-lr-win'])
  ]},
 {id:'j2',title:'Group Policy',bloom:'Apply',sum:'How GPOs enforce settings across a domain, the high-value ones, logging what runs, the ways admins reach a machine, update rings, domain time, and how to confirm they applied.',
  can:'explain how a GPO reaches a thousand machines, pick the high-value settings, log what runs, and read gpresult to see which policy won and which was filtered out',
  blocks:[
   C('One place to set a thousand machines','Understand',
     TIPS('A <b>Group Policy Object</b> (GPO) is a bundle of settings linked to the domain or an organizational unit. Settings flow down to the computers and users underneath.',
          'High-value areas: Account Policies, User Rights Assignment, Security Options, Audit Policy, and Administrative Templates for Windows components.',
          '<b>User Rights Assignment</b> grants privileges such as Allow log on locally, Access this computer from the network, and Debug programs, which opens any process’s memory, LSASS included.'),
     CMDS('Work with and verify GPOs',[
       ['gpmc.msc','Group Policy Management: create, link, and edit GPOs.'],
       ['gpupdate /force','Reapply policy now instead of waiting.'],
       ['gpresult /r','What policy is actually applied to this machine and user.'],
       ['Get-ADDefaultDomainPasswordPolicy','Confirm domain password settings after editing the Default Domain Policy.'],
       ['auditpol /get /category:*','Current audit policy. Enable logon and account-management auditing where the brief or good practice calls for it.'],
       ['reg query HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate\\AU','Read what a GPO wrote: most Administrative Templates settings write their values under a Policies key such as this one, and Not Configured removes them. A hand edit there lasts until Group Policy rewrites it: at gpupdate /force, when the GPO changes, or at every background refresh once Configure registry policy processing is set to Process even if the Group Policy objects have not changed. Change the GPO instead.']
     ]),
     DETAIL('Security Options and User Rights: targets and reach',
       TIPS('<b>Security Options</b> (one setting per row):<br>Accounts: Limit local account use of blank passwords to console logon only = Enabled.<br>Interactive logon: Don’t display last signed-in = Enabled.<br>Interactive logon: Do not require CTRL+ALT+DEL = Disabled (worded in the negative, so Disabled requires it).<br>Interactive logon: Machine inactivity limit = 900 seconds or fewer.<br>Network access: Do not allow anonymous enumeration of SAM accounts and shares = Enabled.<br>Network security: LAN Manager authentication level = Send NTLMv2 response only. Refuse LM &amp; NTLM.<br>Microsoft network client and server: Digitally sign communications (always) = Enabled.<br>User Account Control: Run all administrators in Admin Approval Mode = Enabled.<br>Shutdown: Allow system to be shut down without having to log on = Disabled (Windows 11 ships it Enabled).<br>Registry forms: DontDisplayLastUserName 1, DisableCAD 0, and ShutdownWithoutLogon 0 under HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System.<br>Check before you change: System cryptography: Use FIPS compliant algorithms stays as the brief sets it, because Microsoft’s baselines leave it off and turning it on can break Remote Desktop and older TLS connections.',
            '<b>User Rights Assignment:</b> Allow log on locally: Administrators and Users on a workstation, Administrators on a member server, and Administrators plus ENTERPRISE DOMAIN CONTROLLERS on a DC. Access this computer from the network: Administrators and Authenticated Users on a member server (plus ENTERPRISE DOMAIN CONTROLLERS on a DC); CIS narrows a workstation to Administrators and Remote Desktop Users. Deny log on through Remote Desktop Services: Guests, plus Local account on workstations and member servers. Debug programs: Administrators only. Act as part of the operating system: nobody. <code>whoami /priv</code> lists the current token’s privileges. A right reaches an account at its next sign-in, so sign out any session of an account you removed. Templates and secedit exports name holders by SID: *S-1-5-32-544 Administrators, *S-1-5-32-545 Users, *S-1-5-32-546 Guests, *S-1-1-0 Everyone, and *S-1-5-11 Authenticated Users.',
            'A right is a privilege, separate from a file permission.',
            'Some rights reach past file permissions entirely: Back up files and directories, Restore files and directories, and Take ownership of files or other objects.',
            'Debug programs reaches past them too: it opens any process’s memory, LSASS included.'))),
    HIER('Where a GPO links: domain and OUs hold the links, groups hold members',
     {name:'Domain: example.com',note:'GPO link: <b>Default Domain Policy</b>, the password and lockout policy for every domain account',tone:'l4',children:[
       {name:'OU: Domain Controllers',note:'GPO link: <b>Default Domain Controllers Policy</b>',tone:'l3',children:[
         {name:'Computer: DC1',tone:'l1'}]},
       {name:'OU: Workstations',note:'GPO link: Workstation Baseline',tone:'l3',children:[
         {name:'Computer: PC-07',note:'Sits in exactly one OU',tone:'l1'}]},
       {name:'OU: Staff',note:'GPO link: Staff Settings',tone:'l3',children:[
         {name:'User: malia',note:'Member of the groups Sales and VPN Users. Joining a group leaves the account in this OU.',tone:'l1'}]},
       {name:'Users (built-in container)',note:'A default container rather than an OU, so its objects get the site and domain GPOs alone. Default groups such as Domain Admins live here.',tone:'muted'}]},
     {intro:'An OU is a folder for users and computers, and policy follows the folder. A group is a membership list that grants rights and permissions.',
      note:'<b>GPOs link to sites, domains, and OUs.</b> Security filtering can narrow a linked GPO to the members of a group; the link itself stays on the site, domain, or OU. Fine-grained password policies are the one password setting that targets users or groups directly.',
      key:[['l4','Domain'],['l3','Organizational unit'],['l1','User or computer'],['muted','Default container']]}),
   HIER('Group Policy precedence: the last one applied wins',[
       ['Child OU','The GPO linked closest to the object; applied last','l4'],
       ['Parent OU','Applied before its child OUs','l3'],
       ['Domain','The Default Domain Policy and other domain-linked GPOs','l2'],
       ['Site','GPOs linked to the Active Directory site','l1'],
       ['Local','The machine’s own local policy; applied first','muted']],
     {top:'Wins a conflict, applied last',bottom:'Yields, applied first',
      intro:'Windows applies policy in the order Local, Site, Domain, then OU (LSDOU). The order decides only when two GPOs set the same setting differently.',
      note:'<b>Two switches change the order.</b> <b>Block Inheritance</b> on an OU stops GPOs from the containers above it. An <b>Enforced</b> link overrides Block Inheritance and beats conflicting GPOs linked lower down. Within one container, link order 1 has the highest precedence. <code>gpresult /r</code> lists the GPOs that applied.'}),
   SEQ('When Group Policy lands: startup, sign-in, and refresh',[
       ['Power on','<b>Computer Configuration</b> applies at startup, before anyone signs in.','l3'],
       ['Sign in','<b>User Configuration</b> applies for the person signing in.','l1'],
       ['Background refresh','Both halves refresh about every 90 minutes, plus a random offset of up to 30 minutes (every 5 minutes on domain controllers).','l2'],
       ['<code>gpupdate /force</code>','Reapplies every setting now; software installation and folder redirection wait for the next restart or sign-in.','amber'],
       ['<code>gpresult /r</code>','Reports what applied and which GPOs were filtered out.','ok']]),
   C('Basic and advanced audit policy','Apply',
     TIPS('<b>Basic</b> audit policy (Local Policies &gt; Audit Policy) has nine broad categories. <b>Advanced Audit Policy Configuration</b> (Security Settings, one level down) splits them into about 60 subcategories, so you record what matters without flooding the log.',
          'Set <b>Audit: Force audit policy subcategory settings (Windows Vista or later) to override audit policy category settings</b> = Enabled (Security Options), so a basic setting never overwrites the subcategories.',
          'Detailed Tracking &gt; <b>Audit Process Creation</b> = Success writes a 4688 for every new process. Then Administrative Templates &gt; System &gt; Audit Process Creation &gt; <b>Include command line in process creation events</b> = Enabled adds what was typed.',
          'Worth turning on as well: Logon, Account Lockout, User Account Management, Security Group Management, Audit Policy Change, and Other Object Access Events, which records scheduled tasks.',
          '<b>One route.</b> Microsoft advises choosing basic or advanced audit policy and using that one alone. auditpol /get shows the policy in force. On Pro and Server the secpol Advanced node writes the local GPO, and once a local or domain GPO defines advanced auditing, a refresh can replace values set only with auditpol, so set them in the GPO. Order: the Force setting, then the subcategories, then the read-back; a later category-wide auditpol /set rewrites every subcategory in that category.',
          '<b>When an event never shows, check its subcategory.</b> The detail panel at the end of this card maps each event ID to its subcategory.',
          'Some subcategories record one outcome only. Account Lockout writes Failure: the 4625s with 0xC0000234 against a locked account.',
          'Process Creation, Security Group Management, Audit Policy Change, and Security System Extension (4697, service installed) write Success.'),
     TERM('C:\\> auditpol /get /subcategory:"Process Creation"\nSystem audit policy\nCategory/Subcategory                      Setting\nDetailed Tracking\n  Process Creation                        Success\n\nEvent 4688, KAILUA-WS07 (trimmed)\nCreator Process Name:   C:\\Windows\\explorer.exe\nNew Process Name:       C:\\Windows\\System32\\gpupdate.exe\nToken Elevation Type:   %%1938\nProcess Command Line:   gpupdate.exe /force'),
     P('Without the command-line setting, that last line stays empty: you learn that gpupdate ran and miss how. %%1938 means a filtered token; %%1937 means an elevated one. Command lines can hold passwords typed as arguments, so limit who reads the Security log and its forwarded copies.'),
     DETAIL('Which subcategory writes each event',
       TIPS('Logon: 4624, 4625. Logoff: 4634, 4647. Special Logon: 4672.',
            'User Account Management: 4720, 4726, 4740 (the lockout itself), 4781 (an account renamed).',
            'Security Group Management: 4728, 4732. Process Creation: 4688.',
            'Other Object Access Events: 4698 (task created), off by default. Security System Extension: 4697 (service installed).',
            '4698 and 4697 both read in <a href="#junior/j8">Windows: logons, tokens, and the event trail</a>.'))),
   QUIZ('j2ck1','Check yourself',[
     ['A 4688 on KAILUA-WS07 shows the new process powershell.exe, yet Process Command Line is empty. Which setting adds it?',['Audit Process Creation = Failure','Turn on Script Execution','Audit Logon = Success','Include command line in process creation events = Enabled'],3,'Audit Process Creation = Success writes the 4688; the Administrative Templates setting adds the command line.',{whys:['Failure auditing records failed starts; the command line needs its own setting.','Turn on Script Execution sets the PowerShell execution policy, which leaves 4688 fields alone.','Audit Logon records sign-ins rather than what a new process was told to do.','Process creation auditing writes the 4688 itself; the command line comes from this separate Administrative Templates setting, which fills that empty field.'],imp:'core',c:'host-audit-logging'}]
   ]),
   COMPARE('Execution policy, AMSI, script block logging, and Constrained Language Mode',[
     {name:'Execution policy',tone:'muted',rows:[['Does','Decides which .ps1 files may start'],['GPO path','Windows PowerShell &gt; Turn on Script Execution'],['Stops','An accidental run of an unsigned downloaded script'],['Leaves open','Typed, pasted, and -EncodedCommand commands: not a security boundary']]},
     {name:'AMSI',tag:'on by default',tone:'l2',rows:[['Does','Hands each script, decoded, to the antivirus as it runs'],['GPO path','None needed: Defender uses it'],['Stops','Known-bad script text, even once unwrapped'],['Leaves open','Code missing from the antivirus signatures']]},
     {name:'Script block logging',tag:'event 4104',tone:'l3',rows:[['Does','Records the decoded text of each script block in Microsoft-Windows-PowerShell/Operational; suspicious-looking blocks log as Warning even while it is off'],['GPO path','Windows PowerShell &gt; Turn on PowerShell Script Block Logging'],['Stops','Nothing: it records'],['Leaves open','Everything, until someone reads or forwards the log']]},
     {name:'Constrained Language Mode',tone:'ok',rows:[['Does','Blocks .NET calls, Add-Type, and COM objects, which most attack scripts need'],['GPO path','None of its own: application control enforces it (<a href="#senior/se8">Senior</a>)'],['Stops','Untrusted scripts that reach into Windows'],['Leaves open','Scripts the allowlist trusts, which run in full language']]}
   ],{intro:'The two GPO settings sit under Administrative Templates &gt; Windows Components &gt; Windows PowerShell.',
     note:'<b>Transcription</b> (Turn on PowerShell Transcription) also writes each session to a text file. Point it at a share that is read-only for users. Windows PowerShell 2.0 predates AMSI and script logging, and current Windows 11 and Server 2025 ship without it. A <code>-Version 2</code> launch is therefore a red flag. PowerShell 7 (pwsh.exe) reads its own policy key, PowerShellCore, and logs to PowerShellCore/Operational. A Windows PowerShell setting alone leaves pwsh unlogged; its own policy must turn on Use Windows PowerShell Policy setting.',
     caption:'Execution policy is a safety catch, AMSI scans, script block logging records, and Constrained Language Mode limits; forward the 4104s so the record outlives the intruder.',bloom:'Apply'}),
   COMPARE('Ways admins reach a Windows machine',[
     {name:'RDP',tone:'l2',rows:[['Port','3389'],['4624 logon type','10'],['Reusable credentials on the target','Yes: a full sign-in leaves them in LSASS memory'],['Restrict it','NLA, plus Restricted Admin or Remote Credential Guard so credentials stay home; reach it through a VPN or gateway']]},
     {name:'PowerShell remoting (WinRM)',tone:'l3',rows:[['Port','5985 (HTTP, still encrypted by Kerberos) or 5986 (HTTPS)'],['4624 logon type','3'],['Reusable credentials on the target','No, unless CredSSP is turned on, which hands the password over'],['Restrict it','The Remote Management Users group, JEA (Just Enough Administration) endpoints, and a firewall scope of admin addresses']]},
     {name:'Admin shares and remote service creation',tone:'amber',rows:[['Port','445'],['4624 logon type','3, plus 7045 in the System log when a service is created'],['Reusable credentials on the target','No'],['Restrict it','Block 445 between workstations and keep extra local admins out; LAPS keeps each local password unique']]}
   ],{intro:'Intruders borrow the same three doors that admins use, and each door leaves its own mark in the log.',bloom:'Apply'}),
   PATH('A patch through its rings',[
     {name:'Release',tag:'second Tuesday',tone:'l1',note:['A cumulative update, named by its KB number, replaces the ones before it','Wrong here: waiting for the next month when a flaw is already exploited'],via:'approve'},
     {name:'Test ring',tag:'lab copies',tone:'l2',note:['A few machines that mirror real ones','Wrong here: a line-of-business app breaks'],via:'after a few days'},
     {name:'Pilot ring',tag:'IT and volunteers',tone:'l3',note:['About one in ten machines, every model represented','Wrong here: a driver fails on one model'],via:'after a week'},
     {name:'Broad ring',tag:'everyone',tone:'l4',note:['A deadline forces the install and restart','Wrong here: laptops off the network miss it'],via:'report'},
     {name:'Verified installed',tone:'ok',note:['<code>Get-HotFix</code> or the update report shows the KB','Wrong here: a pending restart, so the fix waits on the restart']}
   ],{intro:'Monthly fixes reach every PC in stages, so a bad update stops at a few machines.',
     note:'<b>The policy behind each ring:</b> Administrative Templates &gt; Windows Components &gt; Windows Update &gt; Manage updates offered from Windows Update &gt; Select when Quality Updates are received sets deferral days per ring, one GPO per OU or group; WSUS does the same with computer groups and approvals; Intune rings do it for Entra joined PCs. A flaw on CISA’s known-exploited list skips the waiting.',bloom:'Apply'}),
   HIER('Where domain time comes from',
     {name:'Outside source',note:'Two or more reliable NTP servers set on the PDC emulator alone, so one bad server cannot drag the domain: <code>w32tm /config</code> <code>/manualpeerlist:"192.0.2.123</code> <code>192.0.2.124"</code> <code>/syncfromflags:manual</code> <code>/reliable:yes</code> <code>/update</code>',tone:'l4',children:[
       {name:'PDC emulator DC',note:'KONA-DC01, the PDC emulator of the forest root domain: the clock every other DC follows',tone:'l3',children:[
         {name:'Other DCs',note:'Follow the domain hierarchy',tone:'l2',children:[
           {name:'Member servers and desktops',note:'Sync from a DC when they sign in and on a schedule',tone:'l1'}]}]}]},
     {note:'<code>w32tm /query /status</code> shows the source and the last sync. <b>Source: Local CMOS Clock</b> on the PDC emulator means the domain follows a motherboard clock. When a PC and its DC differ by more than five minutes, Kerberos rejects tickets and sign-ins fail (<a href="#junior/j1">NTLM and Kerberos</a>), and logs from different machines stop lining up. Point routers, switches, and Linux servers at the same source (<code>ntp server</code> on RtrA and SwA, <code>timedatectl</code> on servers) so every log shares one clock.',bloom:'Apply'}),
   QUIZ('j2ck2','Check yourself',[
     ['KONA-DC01 (the PDC emulator) came back seven minutes behind after a power cut; PCs that have not resynced fail sign-in with a clock skew error. <code>w32tm /query /status</code> on KONA-DC01 shows Source: Local CMOS Clock.<br>Best fix?',['Set every desktop to an internet time server','Switch the domain to NTLM','Point the PDC emulator at a reliable outside source, then resync','Raise the Kerberos tolerance to ten minutes'],2,'Fix time at the top of the tree, and the other DCs and members follow it.',{whys:['Desktops that pick their own servers break the hierarchy and drift apart from the DCs.','NTLM gives up Kerberos protections to hide a clock problem.','Every DC and member follows the PDC emulator, so fixing its source fixes everyone.','A wider tolerance hides the drift and leaves the PDC emulator on a motherboard clock.'],imp:'good',c:'win-kerberos'}]
   ]),
   ORDER('j2o','Order: enforce a domain password policy','Put the steps in order.',[
     ['Open Group Policy Management (gpmc.msc)','First, because every later step happens in this console: domain policy is edited here, while local secpol reaches only one machine.'],
     ['Edit the Default Domain Policy','Second: with the console open, pick the GPO that owns password and lockout policy for every domain account before you change any setting.'],
     ['Set Account Policies: minimum length, complexity, history, and max age','Inside that GPO, set the password rules first, from your organization’s policy; lockout in the next step guards these passwords.'],
     ['Set Account Lockout Policy: threshold, duration, and reset counter','Next, in the same GPO: lockout slows guessing against the passwords you just defined, and both must be saved before anything is applied.'],
     ['Run gpupdate /force on the DC','Only once every setting is saved does a refresh help: gpupdate /force applies them now instead of at the next refresh cycle.'],
     ['Verify with Get-ADDefaultDomainPasswordPolicy','Last, because it checks the result of everything above: it reads the policy that actually took effect after the refresh.']
   ]),
   QUIZ('j2q','Check: Group Policy',[
     ['A setting in the Default Domain Policy is missing on a workstation. First command?',['shutdown /r','gpupdate /force then gpresult /r','net accounts','ipconfig /flushdns'],1,'Force the refresh, then confirm what applied. gpresult /r shows which GPOs won.',{whys:['A restart interrupts the user and still skips the proof that gpresult gives.','gpupdate /force reapplies policy now, and gpresult /r shows which GPOs applied.','net accounts shows local password settings, only a small slice of policy.','Flushing DNS clears name lookups and leaves policy as it was.'],imp:'core',c:'win-group-policy'}],
     ['Which policy area would you use to stop a normal user from logging on locally to the DC?',['Password Policy','User Rights Assignment','Windows Update','Firewall'],1,'User Rights Assignment controls "Allow/Deny log on locally" and similar rights.',{whys:['Password Policy sets length and age rather than who may sign in where.','User Rights Assignment holds Allow and Deny log on locally.','Windows Update settings schedule patches, a separate job from sign-in rights.','The firewall filters network traffic, while signing in at the keyboard is a user right.'],imp:'core',c:'win-group-policy'}],
     ['Domain password policy belongs in',['each local machine’s secpol','the Default Domain Policy GPO','the hosts file','Task Scheduler'],1,'One GPO at the domain level governs every domain account.',{whys:['Local secpol covers one machine’s local accounts, and domain accounts follow the domain.','One GPO at the domain level governs every domain account.','The hosts file maps names to addresses and holds no policy.','Task Scheduler runs programs on triggers, a different job from policy.'],imp:'core',c:'host-password-policy'}],
     ['gpresult /r is for',['forcing a policy refresh','showing which policies are applied here','creating a GPO','editing the registry'],1,'It reports applied policy. gpupdate applies; gpresult reports.',{whys:['Forcing a refresh is gpupdate’s job; gpresult reports.','gpresult reports the outcome of policy: the GPOs that applied to this computer and user, and the ones filtered out.','You create GPOs in Group Policy Management (gpmc.msc).','gpresult reads and reports, leaving the registry as it is.'],imp:'core',c:'win-group-policy'}],
     ['KAILUA-WS07: execution policy AllSigned, script block logging on, Defender with AMSI on, and no application control. A 4104 Warning holds the decoded text of a command passed on the command line (<code>powershell -EncodedCommand</code> carries the command itself rather than a .ps1 file), and Defender logged no detection. Which control saw it, and what stopped it?',['Script block logging saw it; nothing stopped it','Execution policy stopped it, since AllSigned blocks unsigned code','AMSI stopped it, since 4104 records a block','Constrained Language Mode stopped it'],0,'A 4104 records; it never blocks.',{whys:['Script block logging recorded the decoded text, and it records rather than blocks.','Execution policy governs .ps1 files, and an -EncodedCommand line runs outside it.','AMSI blocks only text the antivirus recognizes, and Defender logged no detection.','Constrained Language Mode needs application control, which this PC lacks.'],imp:'core',c:'win-script-logging'}],
     ['On KAILUA-WS07, a domain PC, you set NoDriveTypeAutoRun with reg add under Policies\\Explorer. After gpupdate /force, reg query shows the value the Workstation Baseline GPO sets. What is the lasting fix?',['Run reg add again after every refresh','Change the setting in the Workstation Baseline GPO, then gpupdate /force and reg query to confirm','Delete the Policies key so Group Policy has nowhere to write','Turn off Group Policy processing on the PC'],1,'On a domain PC, Group Policy owns the Policies keys, so the GPO is where a change lasts.',{whys:['Each time Group Policy applies, as gpupdate /force just showed, it writes the GPO’s value again, so the hand edit keeps losing.','The GPO sets the value on every PC it reaches, and reg query proves the result.','Group Policy recreates the key the next time it applies.','Stopping policy processing drops every other baseline setting the domain pushes.'],imp:'core',c:'win-group-policy'}]
   ]),
   SPOT('j2sp','Why did the setting miss?','PC-07 should hide the last user name at sign-in, a setting in the GPO Workstation Baseline, linked to the OU Workstations. A second GPO, Kiosk Overrides, sets the opposite value and is meant for the kiosks alone. Here is gpresult /r from PC-07. Tap the lines that explain why the setting failed to apply, then Check.',[

     ['        Default Domain Policy',null,'The Default Domain Policy applies to every domain computer, and it holds account policy rather than this sign-in setting.'],
     ['    The following GPOs were not applied because they were filtered out',null],
     ['        Workstation Baseline',null,'This line only names the GPO that was skipped; the reason it skipped PC-07 is the Filtering line under it.'],
     ['            Filtering:  Denied (Security)','Security filtering leaves PC-07 out, so Workstation Baseline skips it. Add the computer, or Domain Computers, to the GPO’s security filter.'],
     ['        Local Group Policy',null],

   SPOT('j2sp2','Which policy won?','The Workstation Baseline GPO, linked to the OU Workstations, locks the screen after 10 minutes. On PC-12 the screen locks after 60. Here is gpresult /r from PC-12; applied GPOs are listed with the winning one first. Tap the lines that show which policy won and why, then Check.',[
     ['COMPUTER SETTINGS',null],
     ['    CN=PC-12,OU=Workstations,DC=example,DC=com',null,'PC-12 sits in the Workstations OU, so the baseline is linked to its container and ought to win over a plain domain link.'],
     ['    Last time Group Policy was applied: 11/1/2026 at 8:02:14 AM',null,'Policy applied this morning, so the machine holds current settings.'],
     ['    Applied Group Policy Objects',null],
     ['        Lab Overrides','Listed first, so it holds the highest precedence, and it sets 60 minutes. A GPO linked at the domain lands above an OU-linked GPO only when its link is Enforced; open the link in the Group Policy Management Console and decide whether Enforced belongs there.'],

     ['        Kiosk Lockdown',null,'This line only names a skipped GPO; the Filtering line under it gives the reason.'],
     ['            Filtering:  Denied (WMI Filter)',null,'The WMI filter excludes PC-12, so Kiosk Lockdown never touched the screen lock. Working as designed.'],
