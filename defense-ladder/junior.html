   ORDER('j4o','Troubleshoot a failed inter-VLAN ping, bottom up','A Students PC fails to ping a Teachers PC. Tap the checks in the order that follows the packet from the PC to the router.',[
     ['Check the PC’s IP address, mask, and default gateway','Start at the PC: a wrong gateway stops traffic before any switch sees it, so every later check would mislead.'],
     ['Check the access port’s VLAN','Next, the first switch port the frame meets: show vlan brief must place the PC’s port in the VLAN that matches its subnet, or the frame never reaches the trunk.'],
     ['Check the trunk’s allowed list and native VLAN','Then the trunk, the frame’s next stop on its way to the router: show interfaces trunk must list the VLAN as allowed and forwarding, with native 99 on both ends.'],
     ['Check that the router’s parent interface is up','At the router, the physical port comes before what rides on it: show ip interface brief must show g0/0 up/up, because every subinterface depends on it.'],
     ['Check each subinterface’s encapsulation and IP address','With g0/0 up, check the subinterfaces that ride on it: show running-config | section GigabitEthernet0/0 must show each dot1Q tag and gateway address matching its VLAN and subnet.'],
     ['Check the route table','Last, because the router lists a connected route only once its subinterfaces are up and addressed: show ip route then shows both subnets as C routes.']
   ]),
   QUIZ('j4q','Check: switching and routing',[
     ['Your extended ACL has only "deny tcp any any eq 23". Hosts lose all connectivity. Why?',['Telnet is required','The implicit deny any at the end drops everything else','ACLs work only on switches','The switch is off'],1,'Add permit ip any any after the deny so other traffic passes.',{whys:['Nothing here needs Telnet; the trouble is that the unseen deny at the end drops every other kind of traffic too.','Every ACL ends with an unseen deny any, so without a permit line all other traffic drops.','Routers apply ACLs on their interfaces, and this one is clearly working.','A switch that is off drops traffic with or without the ACL, and the ACL already explains the loss.'],imp:'core',c:'cisco-acls'}],
     ['Which command shows which ports belong to which VLAN?',['show ip route','show vlan brief','show running-config | include ip','show mac address-table'],1,'show vlan brief maps VLANs to access ports. show interfaces trunk shows the trunks.',{whys:['show ip route lists the router’s networks and next hops.','show vlan brief lists each VLAN with its access ports.','Filtering the running-config for ip shows address lines and leaves VLAN ports out.','show mac address-table maps learned MAC addresses to ports, a different question.'],imp:'good',c:'cisco-vlans-trunks'}]
   ]),
   QUIZ('j4q2','Interleaved review',[
     ['What separates <code>access-class 20 in</code> from <code>ip access-group 20 in</code>?',['They do the same job; <code>access-class</code> is the older spelling','<code>access-class</code> filters sessions to the device; <code>ip access-group</code> filters traffic through an interface','<code>access-class</code> takes standard ACLs; <code>ip access-group</code> takes extended ACLs only','<code>access-class</code> works on switches; <code>ip access-group</code> works on routers'],1,'Management access is a line setting, so ACL 20 goes on every VTY line with access-class.',{whys:['They do different jobs: one guards sessions to the device, the other filters traffic passing through.','access-class on VTY lines guards sessions to the device; ip access-group on an interface filters traffic routed through it.','Both commands accept standard ACLs; the difference is what they filter.','Both work on switches and routers; one sits on VTY lines, the other on interfaces.'],imp:'core',c:'cisco-acls'}],
     ['Why does 99 join the trunk’s allowed list (10,20,30,99)?',['VLAN 99 carries the Principals','The native VLAN must be the highest number listed','Listing 99 makes its frames tagged','The allowed list filters the native VLAN too'],3,'Listing 99 lets the untagged native VLAN cross the trunk to RtrA g0/0.99.',{whys:['VLAN 30 carries the Principals; 99 is the native VLAN, kept free of hosts.','The native VLAN can be any number, whatever its place in the list.','Native frames cross untagged either way; the list decides whether they cross at all.','The allowed list filters every VLAN, the native VLAN included, so 99 must be listed to cross.'],imp:'good',c:'cisco-vlans-trunks'}],
     ['From Sophomore: how do <code>vlan 20</code> and <code>interface vlan 20</code> differ?',['Both create the VLAN; the SVI form also lists its ports','The SVI creates the VLAN for you, so <code>vlan 20</code> is optional','The VLAN is a broadcast domain; the SVI is the switch’s address in it','The VLAN holds the IP address; the SVI holds the access ports'],2,'Create the VLAN first. The SVI reaches up/up only once VLAN 20 exists and an up port or trunk carries it.',{whys:['Only vlan 20 creates the VLAN; the SVI is an address, and ports join through their own settings.','The SVI needs the VLAN to exist first, so vlan 20 is required.','vlan 20 builds the broadcast domain; the SVI adds a layer 3 address in it so admins can reach the switch.','It is the other way around: the SVI holds the IP address.'],imp:'core',c:'cisco-vlans-trunks'}],
     ['From Sophomore: a teacher types <code>telnet 10.1.20.2</code>. What happens?',['A login prompt appears, since Telnet is on by default','The connection is refused: <code>transport input ssh</code> admits SSH alone','The switch upgrades the session to SSH automatically','Telnet connects and logs a warning to the console'],1,'transport input ssh makes the VTY lines accept SSH only, so Telnet gets connection refused.',{whys:['transport input ssh shuts Telnet out, so the switch refuses it before any prompt.','transport input ssh lets the VTY lines accept SSH alone, so Telnet is refused.','The client chooses the protocol, so the switch simply refuses the Telnet attempt.','The lines refuse Telnet outright, before any session or warning.'],imp:'core',c:'cisco-device-hardening'}],
     ['From Sophomore: a Students PC shows 10.1.10.70, mask 255.255.255.192, gateway 10.1.10.1. It reaches its neighbors and nothing beyond them. Why?',['The gateway must be the highest address in the subnet','The /26 mask makes its subnet 10.1.10.64 to 10.1.10.127, so the gateway at 10.1.10.1 sits outside it','A /26 holds too few hosts','The trunk drops VLAN 10'],1,'A host reaches its gateway only inside its own subnet. The VLAN is a /24, so the mask should read 255.255.255.0. <a href="#sophomore/s5">Review: Cisco: configure a switch and a router</a>',{whys:['A gateway can be any host address in the subnet; this network uses .1.','With a /26, the PC’s subnet spans 10.1.10.64 to 10.1.10.127, which leaves 10.1.10.1 out of reach.','A /26 still holds 62 hosts; the trouble is where the gateway falls.','The PC reaches its neighbors in VLAN 10, so the VLAN works; the gateway is what fails.'],imp:'core',c:'net-subnetting'}],
     ['From Sophomore: an ACL must match 10.1.10.64/26 and nothing else. Which line does it?',['<code>access-list 10 permit 10.1.10.64 255.255.255.192</code>','<code>access-list 10 permit 10.1.10.0 0.0.0.63</code>','<code>access-list 10 permit 10.1.10.64 0.0.0.63</code>','<code>access-list 10 permit 10.1.10.64 0.0.0.255</code>'],2,'A /26 spans 64 addresses, so the wildcard is 0.0.0.63, starting at the block’s own network address, 10.1.10.64. <a href="#sophomore/s5">Review: Cisco: configure a switch and a router</a>',{whys:['ACLs take a wildcard mask, and 255.255.255.192 is the subnet mask.','Starting at 10.1.10.0 matches .0 to .63, the wrong block.','Wildcard 0.0.0.63 covers 64 addresses, starting at the block’s network address, 10.1.10.64.','0.0.0.255 matches the whole /24, four times the /26.'],imp:'core',c:'cisco-acls'}]
   ]),
   QUIZ('j4q3','Check: hops, routes, and DHCP',[
     ['A Students PC at 10.1.10.20 pings 10.1.20.30 through RtrA. As the frame travels back down the trunk toward the Teachers PC, which addresses does it carry?',['Source MAC: the Students PC; source IP: 10.1.10.20','Source MAC: SwA; source IP: 10.1.10.1','Source MAC: RtrA; source IP: 10.1.10.20','Source MAC: RtrA; source IP: 10.1.20.1'],2,'The router builds a new frame, while the IP addresses ride through end to end.',{whys:['The Students PC’s MAC stays on the first link, since the router builds a new frame.','SwA passes frames along unchanged, and the sender’s IP stays 10.1.10.20.','The router builds a new frame with its own source MAC, while the source IP rides through unchanged.','The source IP stays the sender’s own 10.1.10.20; the router changes only the frame.'],imp:'core',c:'cisco-inter-vlan-routing'}],
     ['A router holds S 10.1.0.0/16, O 10.1.20.0/24 (learned through OSPF), and S* 0.0.0.0/0. Which route forwards a packet for 10.1.20.30?',['O 10.1.20.0/24, the longest matching prefix','S 10.1.0.0/16, because static routes have the lower AD','S* 0.0.0.0/0, the default route','All three, sharing the load'],0,'The longest prefix wins first. Administrative distance breaks ties only between routes to the same prefix.',{whys:['The /24 is the longest matching prefix, so the OSPF route wins.','Administrative distance breaks ties only between routes to the same prefix.','The default route is the last resort, used when nothing more specific matches.','The router picks the single most specific match for each packet.'],imp:'core',c:'cisco-troubleshooting'}],
     ['Site B’s PCs reach Site A, yet the internet stays out of reach. RtrB’s show ip route lists C, L, and S lines and reads “Gateway of last resort is not set”. What is missing?',['An L route for g0/2','PortFast on the trunk','A second static route to the other site','A default route toward the ISP'],3,'ip route 0.0.0.0 0.0.0.0 with the ISP’s next hop sets the gateway of last resort.',{whys:['L routes mark the router’s own interface addresses, and those are already there.','PortFast speeds start-up on access ports and leaves routing as it is.','Site A is already reachable, so that route works; the internet needs a default.','A default route toward the ISP sets the gateway of last resort for every network missing from the table.'],imp:'core',c:'cisco-troubleshooting'}],
     ['Students PCs get 169.254.x.x addresses, and the DHCP server sits in a server VLAN behind RtrA. What does g0/0.10 need?',['A second trunk','ip helper-address with the server’s address, so the router relays the broadcast','PortFast on g0/0.10','A /30 mask'],1,'Routers keep broadcasts inside each VLAN, and a relay on the gateway forwards the DHCP request to the server.',{whys:['A second trunk carries the same VLANs, and the broadcast still stops at the router.','Broadcasts stop at the VLAN’s edge, so ip helper-address on the gateway sends the DHCP request straight to the server.','PortFast speeds access ports, and the broadcast still stops at the router.','A /30 is for links between two routers, and the broadcast still stops at the router.'],imp:'good',c:'net-dns-dhcp'}],
     ['ipconfig is correct, the access port sits in the right VLAN, and the trunk carries that VLAN, yet the ping dies at RtrA, whose show ip route lacks the destination network. Which layer is at fault?',['Layer 1: the cable','Layer 2: the VLAN','Layer 3: the route','Layer 7: the application'],2,'Layers 1 and 2 checked out on the way up; a missing route is a layer 3 fault.',{whys:['The ping reached RtrA, so the cable works.','The access port and the trunk check out, so the VLAN works.','A destination missing from show ip route is a layer 3 fault.','Ping tests the network path, below any application.'],imp:'good',c:'cisco-troubleshooting'}],
     ['SwA runs ip dhcp snooping and ip dhcp snooping vlan 10,20,30. Which port gets ip dhcp snooping trust?',['Every Students access port','G0/1, the trunk toward RtrA, where the real DHCP answers arrive','The parked ports in VLAN 999','None, because trusting any port defeats snooping'],1,'Trust marks the ports where server messages may arrive.',{whys:['A trusted access port would let a rogue server on that jack answer clients.','The uplink carries the real server’s offers, so it is the one trusted port.','Parked ports are shut down and carry no DHCP at all.','With no trusted port, snooping drops the real server’s offers too, and clients fall back to 169.254.x.x.'],imp:'core',c:'threat-network-attacks'}],
     ['A spare switch from storage, in VTP server mode with the school’s domain name and a higher configuration revision, is trunked to SwA, which runs VTP server mode. What is the risk, and what prevents it?',['Its VLAN list can replace SwA’s, removing VLANs and leaving their ports inactive; vtp mode transparent on SwA prevents it','None, since VTP only ever adds VLANs','It becomes the root bridge; BPDU guard prevents it','It floods DHCP offers; DHCP snooping prevents it'],0,'A server or client adopts the advertisement with the higher revision, deletions included. A transparent switch keeps its own list.',{whys:['The higher revision wins, so the spare’s list replaces SwA’s; a transparent switch ignores it.','VTP copies the whole list, so a VLAN missing from it is removed.','Root election is spanning tree, a different protocol; the VTP risk remains.','VTP carries VLAN lists, not DHCP traffic.'],imp:'good',c:'cisco-vlans-trunks'}],
     ['Students ports Fa0/1 to Fa0/8 run PortFast and connect PCs. Which spanning-tree guard belongs on them?',['spanning-tree guard root, because it blocks rogue root claims','spanning-tree bpduguard enable, because no BPDU should ever arrive on a PC port','No guard, because PortFast is enough','spanning-tree mode rapid-pvst'],1,'BPDU guard fits edge ports; root guard fits switch-facing ports, where BPDUs are normal.',{whys:['Root guard still lets ordinary BPDUs through, so a switch plugged into the jack joins the topology.','BPDU guard err-disables the port at the first BPDU, which is exactly right for a PC port.','PortFast speeds the port up and does nothing about BPDUs.','The spanning-tree mode sets how fast the tree converges, for every port; it guards no port.'],imp:'core',c:'cisco-vlans-trunks'}],
     ['Students PCs get leases and ping 10.1.20.50 by address, yet no name resolves. The STUDENTS pool lists network and default-router only. What is missing?',['ip helper-address on g0/0.10','dns-server 10.1.20.50 in the pool','A second default-router line','ip dhcp excluded-address for the DNS server'],1,'Each line in the pool becomes one setting on the client.',{whys:['Leases already arrive, so the request is reaching the pool.','dns-server hands each client its resolver, the setting these clients lack.','The gateway works, since pings by address leave the subnet.','Excluding an address keeps it out of the pool; it gives clients no resolver.'],imp:'good',c:'net-dns-dhcp'}]
   ]),
   MATCH('j4m3','Attack and the switch defense','Tap a symptom, then the switch feature that stops its cause.',[
     ['Clients get a gateway address that belongs to no router','DHCP snooping, uplinks trusted','A rogue DHCP server answered first.'],
     ['A host’s port starts carrying several VLANs','Access mode plus switchport nonegotiate','DTP let the host negotiate a trunk.'],
     ['The gateway’s MAC address suddenly maps to a classroom PC','Dynamic ARP inspection','ARP poisoning sends traffic through the attacker.'],
     ['A switch on a classroom jack becomes the root bridge','BPDU guard on edge ports','Its BPDUs claimed root.'],
     ['A broadcast flood saturates every port','Storm control','A per-port limit drops the excess broadcasts.'],
     ['An unknown laptop appears on a Teachers port','Port security','It limits which MAC addresses may use the port.'],
     ['Hosts on an IPv4-only VLAN pick up an IPv6 default gateway that belongs to a classroom PC','RA guard on access ports','A rogue router advertisement made the PC their IPv6 gateway.']
   ],'Analyze'),
   REFLECT('j4r','Defend the Site A design','Explain to a new technician why Site A uses three VLANs, a native VLAN that carries no hosts, and an access list on the VTY lines. For each choice, write what breaks if it is left out, and one test that proves it is in place.'),

 {id:'j7',title:'Read the wire: captures, flows, and network attacks',bloom:'Analyze',sum:'Read capture excerpts, flow records, and IDS alerts the way an analyst does, and recognize scans, spoofing, on-path tricks, and floods from the traffic they leave. Capture only on networks you own or have written permission to watch; school networks forbid it, and these excerpts give you the same practice.',
  can:'read a capture excerpt, a flow record, and an IDS alert, and recognize a scan, spoofing, an on-path trick, and a flood from the traffic they leave',
  blocks:[
   C('Where a capture can see','Analyze',
     P('A capture copies every packet that crosses one network card: time, addresses, ports, flags, and payload. On a switched network that card hears its own traffic and broadcasts, so analysts collect from a <b>SPAN port</b> (the switch sends a copy) or a <b>network tap</b> (a device on the cable). A sniffer that suddenly hears other hosts points to MAC flooding or ARP spoofing (<a href="#junior/j4">Cisco: VLANs, routing, and ACLs</a>).'),
     NOTE('Capture only on networks you own or have written permission to watch: a capture holds other people’s messages, passwords, and files, and school networks forbid it. These excerpts give the same practice; at home, capture on your own lab VMs.',true),
     CMDS('Copy, capture, filter, and save',[
       ['monitor session 1 source interface g0/1 both','On SwA: copy the RtrA uplink, both directions (a SPAN session).'],
       ['monitor session 1 destination interface fa0/24','Send the copy to the sensor’s port; that port stops acting as a normal access port.'],
       ['sudo tcpdump -n -i eth0 port 53','DNS packets on eth0; -n prints raw addresses without lookups.'],
       ['sudo tcpdump -n -e arp','ARP only, with MAC addresses (-e).'],
       ['sudo tcpdump -n -w case12.pcap host 10.1.20.30','Save raw packets for Wireshark; hash the file and log it as evidence.'],
       ['tcpdump -n -r case12.pcap \'tcp port 23\'','Read the saved file back through a new filter.']
     ])),
   ANATOMY('One tcpdump line',[
     {name:'From a tap on RtrA’s internet link',tag:'tcpdump -n',tone:'l2',text:'<samp>09:14:03.514208 IP 203.0.113.50.40001 > 203.0.113.2.23: Flags [S], seq 1520375811, win 1024, length 0</samp>',grid:true,children:[
       {name:'Timestamp',tone:'l1',text:'The sensor’s clock, to the microsecond'},
       {name:'Source',tone:'amber',text:'Address, then port 40001 after the last dot'},
       {name:'Destination',tone:'l3',text:'RtrA’s outside address, port 23 (Telnet)'},
       {name:'Flags',tone:'bad',text:'[S]: SYN, a request to open'},
       {name:'seq',tone:'l4',text:'The reply’s ack is this plus one'},
       {name:'win and length',tone:'muted',text:'A tiny window, typical of scanners; length 0: no data'}]}
   ],{intro:'One line is one packet.',
     facts:{head:['Flags','Means'],rows:[
       ['[S]','SYN: open a connection'],['[S.]','SYN-ACK: the port is open'],['[.]','ACK alone'],['[P.]','Data pushed, with ACK'],['[F.]','FIN: a polite close'],['[R] or [R.]','Reset: a closed port, or a connection cut off'],
       ['[FS], [none], or [FPU]','SYN+FIN, null, or Xmas: a normal stack never sends these; they come from a packet-crafting tool such as hping3, and the edge drops them']]},
     bloom:'Analyze'}),
   QUIZ('j7ck1','Check yourself',[
     ['<code>IP 10.1.20.5.23 > 10.1.10.37.50122: Flags [S.], seq 811, ack 1520375812</code>. What does this line prove?',['Port 23 on 10.1.20.5 is open: it answered a SYN with SYN-ACK','10.1.10.37 runs Telnet','The connection is finished','The port is filtered'],0,'[S.] is SYN-ACK, the open-port reply; ack is the client’s sequence number plus one.',{whys:['[S.] is SYN-ACK, the reply an open port sends to a SYN.','The SYN-ACK comes from port 23 on 10.1.20.5, so 10.1.20.5 is the Telnet host.','SYN-ACK is the second step of the handshake, so the connection is just starting.','A filtered port sends nothing back, and this one answered.'],imp:'core',c:'net-handshake'}]
   ]),
   ANATOMY('Three panes of a protocol analyzer',[
     {name:'Display filter',tone:'l1',text:'<code>ip.addr==10.1.20.5 &amp;&amp; tcp.port==23</code> keeps matching packets and hides the rest'},
     {name:'Packet list',tone:'l2',text:'One row per packet: No., Time, Source, Destination, Protocol, Length, and Info (<samp>Telnet Data …</samp>)'},
     {name:'Packet details: Ethernet II',tag:'layer 2',tone:'l4',head:['Ethernet','Dst 3c:a9:f4:12:7b:5e','Src 00:1a:2b:3c:4d:01 (RtrA)'],children:[
       {name:'Internet Protocol Version 4',tag:'layer 3',tone:'l3',head:['IPv4','Src 10.1.20.5','Dst 10.1.10.37','TTL 254'],children:[
         {name:'Transmission Control Protocol',tag:'layer 4',tone:'l2',head:['TCP','Src port 23','Dst port 50122','Flags 0x018 (PSH, ACK)'],children:[
           {core:true,name:'Telnet',sub:'<samp>Password:</samp>, then each keystroke, in clear text'}]}]}]}
   ],{intro:'Wireshark, the free graphical analyzer, decodes the packets tcpdump saves.',
     strip:['Bytes pane','3c a9 f4 12 7b 5e …','the raw hex of the selected packet, starting with the destination MAC.'],
     note:'The details pane unwraps the frame in the order <a href="#freshman/f7">encapsulation</a> built it. Filters such as <code>arp</code>, <code>dns</code>, and <code>tcp.flags.syn==1 &amp;&amp; tcp.flags.ack==0</code> shrink thousands of packets to the dozen that matter; Follow, then TCP Stream, reads one conversation as text.',
     bloom:'Analyze'}),
   COMPARE('The same sign-in over Telnet and SSH',[
     {name:'Telnet',tag:'TCP 23 · clear text',tone:'bad',
      rows:[['Packet list','Dozens of tiny Telnet Data packets, one per keystroke'],['TCP Stream','<samp>Username: keola</samp>, <samp>Password:</samp> and every character typed, then each command'],['A sniffer gets','The account, the password, and the session'],['Fix','Telnet off; <code>transport input ssh</code> on every VTY line']],
      hook:'a postcard: whoever handles it reads it.'},
     {name:'SSH',tag:'TCP 22 · encrypted',tone:'ok',
      rows:[['Packet list','Version banners, a key exchange, then Encrypted packets'],['TCP Stream','<samp>SSH-2.0-Cisco-1.25</samp>, then scrambled bytes'],['A sniffer gets','Who talked, when, and how much'],['Still check','The host key on first connect; a changed-key warning means stop and verify']],
      hook:'a sealed envelope.'}
   ],{caption:'Encryption leaves a sniffer only the envelope: addresses, ports, times, and sizes.',bloom:'Analyze'}),
   C('Flow records: who talked to whom','Analyze',
     P('A <b>flow record</b> (NetFlow or IPFIX) sums up one conversation in one line: who, to whom, which port, how many bytes, and how long, without the contents. Routers and firewalls export them. Site A edge, Hawaiʻi time (UTC−10):'),
     TERM('Start     Src IP:Port          Dst IP:Port          Pkts   Bytes   Dur\n02:00:04  10.1.20.40:50514     198.51.100.70:22     3.1M   4.1 G   2h11m\n02:13:40  10.1.10.37:51870     203.0.113.99:443     9      1.2 K   0.4s\n02:18:40  10.1.10.37:51902     203.0.113.99:443     9      1.2 K   0.4s\n02:23:40  10.1.10.37:51933     203.0.113.99:443     9      1.2 K   0.4s\n09:14:03  203.0.113.50:40001   203.0.113.2:21       1      44      0s\n09:14:03  203.0.113.50:40001   203.0.113.2:22       1      44      0s\n... 1,022 more from 203.0.113.50 to new ports within 4 s'),
     TIPS('<b>One source, many ports, one packet each:</b> 203.0.113.50 scanned 1,024 ports in 4 seconds.',
          '<b>Small, regular, every 5 minutes:</b> 10.1.10.37 checks in with 203.0.113.99 like a clock, the shape of malware <b>beaconing</b> to its controller. Next: look up the address and the laptop’s processes.',
          '<b>Gigabytes out at night:</b> the first line looks like data theft. Before you escalate, check the change log: it names the nightly backup from 10.1.20.40 to the off-site provider at 198.51.100.70, so record it as normal.')),
   COMPARE('Full capture and flow record',[
     {name:'Full capture',tag:'pcap',tone:'l3',
      rows:[['Holds','Every packet, payload included'],['Size','Gigabytes per busy hour'],['Kept','Days, often only around an alert'],['Privacy','Holds messages and passwords: tight access, a written reason'],['Answers','What exactly crossed? Which password went in clear text?'],['Misses','The inside of encrypted traffic']],
      hook:'the recording of the call.'},
     {name:'Flow record',tag:'NetFlow, IPFIX',tone:'l2',
      rows:[['Holds','One line per conversation: addresses, ports, bytes, and times'],['Size','Megabytes per day'],['Kept','Months'],['Privacy','Contents stay out, though who talked to whom is still personal'],['Answers','Who talked to whom, when, and how much? Which host beacons?'],['Misses','Every word: it proves a conversation happened']],
      hook:'the phone bill.'}
   ],{caption:'Flows find the conversation across months; a capture proves what was said, for the days it is kept.',bloom:'Analyze'}),
   QUIZ('j7ck2','Check yourself',[
     ['Did HILO-FS01 send large uploads to any outside address in the last three months? Which source answers that?',['Full capture','Flow records','The ARP cache','A trace'],1,'Flows are small enough to keep for months; full capture rarely reaches back that far.',{whys:['Full capture is huge, so it rarely reaches back three months.','Flow records log bytes per conversation and are small enough to keep for months.','The ARP cache lists local MAC addresses for a few minutes.','A trace maps the path to one host right now.'],imp:'core',c:'det-captures'}]
   ]),
   ANATOMY('One network IDS alert line',[
     {name:'Alert from the sensor’s outside tap',tag:'fast alert format',tone:'l2',text:'<samp>10/27/2026-19:14:07.204118 [**] [1:900412:3] Telnet sign-in attempt from outside [**] [Classification: Attempted User Privilege Gain] [Priority: 2] {TCP} 203.0.113.50:40011 -> 203.0.113.2:23</samp>',grid:true,children:[
       {name:'Timestamp',tone:'l1',text:'10/27/2026-19:14:07, UTC'},

       {name:'Message',tone:'amber',text:'What the rule thinks it saw'},
       {name:'Classification',tone:'l4',text:'The kind of attack'},
       {name:'Priority',tone:'bad',text:'1 is the most urgent'},
       {name:'{TCP} and endpoints',tone:'l2',text:'Protocol, then address:port on each side'}]}

     facts:{head:['Ask','Where the answer lives'],rows:[

       {name:'Same Wi-Fi',tone:'l3',children:[

       {name:'Name lookup',tone:'l3',children:[
