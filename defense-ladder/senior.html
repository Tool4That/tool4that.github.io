   C('A host route to 8.8.8.8','Apply',
     CMDS('On RtrA (RtrB uses its own ISP next hop, 198.51.100.1)',[
       ['interface g0/1','The ISP uplink. Then: ip address 203.0.113.2 255.255.255.252 and no shutdown.'],
       ['ip route 8.8.8.8 255.255.255.255 203.0.113.1','A static host route: the /32 mask matches 8.8.8.8 and nothing else.'],
       ['show ip route 8.8.8.8','Verify: Routing entry for 8.8.8.8/32, Known via "static", distance 1.'],
       ['show ip route static','The same route in the table, under the header 8.0.0.0/32 is subnetted, 1 subnets: S 8.8.8.8 [1/0] via 203.0.113.1.']
     ]),
     P('The router installs a static route only while it can reach the next hop. Here that hop sits in the connected subnet 203.0.113.0/30 on G0/1, so when G0/1 goes down, the route leaves the table. A static route has administrative distance (AD) 1, so it beats a routing protocol’s route to the same prefix. A longer prefix still wins first (<a href="#junior/j4">Reading the routing table</a>).'),
     NOTE('203.0.113.0/24 and 198.51.100.0/24 are documentation ranges that stand in for real ISP addresses; 8.8.8.8 is a well-known public DNS resolver.'),
     DETAIL('Edge ACLs and Senior device hardening',TIPS('<b>Edge ACLs are stateless.</b> Unlike the host firewalls in Sophomore, which track connections, an interface ACL judges each packet on its own, so an inbound ACL on the ISP uplink permits the published service plus the replies inside hosts need (established TCP, echo replies, and DNS answers) ahead of its final deny. <a href="#junior/j4">How a router reads an ACL</a> still applies.','<b>Edge ACL keywords:</b> <code>permit tcp any any established</code> (replies carrying ACK or RST), <code>permit icmp any any echo-reply</code>, <code>permit udp host 8.8.8.8 eq domain any</code> (DNS answers from that resolver), and <code>deny ip any any log</code>. An inbound ACL on the outside interface reads addresses before NAT translates them; a stateful zone-based firewall takes over where state matters.','<b>Edge interfaces:</b> no ip proxy-arp, no ip directed-broadcast, no ip redirects, no ip unreachables, and no ip mask-reply.','<b>AAA:</b> create a local user first, then <code>aaa new-model</code>, so the next login has an account to use.','<b>Resilient configuration:</b> secure boot-image, secure boot-config, and configuration change logging (archive, then log config).','<b>Switch defenses:</b> ip dhcp snooping with trusted uplinks (ip dhcp snooping trust), ip arp inspection on the user VLANs, and storm-control broadcast level 5 on edge ports.'))),
   C('Share the route through OSPF (concept)','Understand',
     CMDS('On RtrA (RtrB: the same, with 10.2.0.0)',[
       ['router ospf 1','Starts OSPF process 1; the number stays local to this router.'],
       ['network 10.0.0.0 0.0.0.3 area 0','Runs OSPF on the inter-site link, G0/2, so RtrA and RtrB become neighbors.'],
       ['network 10.1.0.0 0.0.255.255 area 0','Advertises every Site A subnet: 10.1.10.0, 10.1.20.0, and 10.1.30.0.'],
       ['passive-interface g0/0.10','Advertises the Students subnet while sending no hellos to its hosts. Repeat for g0/0.20 and g0/0.30.'],
       ['redistribute static subnets','Shares the static /32 to 8.8.8.8 with RtrB as an external route.'],
       ['no ip route 10.2.0.0 255.255.0.0 10.0.0.2','In global configuration: OSPF now learns the Site B subnets, so the Junior static route goes. Left in place, redistribute static would advertise it too. On RtrB: no ip route 10.1.0.0 255.255.0.0 10.0.0.1.'],
       ['show ip ospf neighbor','Verify: RtrB reaches FULL on G0/2.'],
       ['show ip route ospf','On RtrB: the Site A subnets as O routes.'],
       ['show ip protocols','Each routing protocol with the settings an audit checks: router ID, networks each process covers, passive interfaces, what it redistributes, and the neighbors it learns from.']
     ]),
     TERM('RtrA# show ip protocols\n...\nRouting Protocol is "ospf 1"\n  ...\n  Router ID 203.0.113.2\n  It is an autonomous system boundary router\n Redistributing External Routes from,\n    static, includes subnets in redistribution\n  ...\n  Routing for Networks:\n    10.0.0.0 0.0.0.3 area 0\n    10.1.0.0 0.0.255.255 area 0\n  Passive Interface(s):\n    GigabitEthernet0/0.10\n    GigabitEthernet0/0.20\n    GigabitEthernet0/0.30\n  Routing Information Sources:\n    Gateway         Distance      Last Update\n    198.51.100.2         110      00:14:07\n  Distance: (default is 110)'),
     TIPS('“includes subnets in redistribution” confirms the subnets keyword from the commands above.'),
     PATH('How 8.8.8.8 reaches RtrB’s table',[
       {name:'RtrA',tag:'S 8.8.8.8 [1/0]',tone:'l3',note:['Its static route, via 203.0.113.1','In the table while G0/1 is up'],via:'redistribute static subnets'},
       {name:'External LSA',tag:'type 5 · E2',tone:'amber',note:['RtrA, now an ASBR (a router that brings outside routes into OSPF), floods 8.8.8.8/32 into area 0 as a link-state advertisement (LSA)','A redistributed route starts at metric 20, and E2 (external type 2) keeps that cost unchanged'],via:'Across 10.0.0.0/30'},
       {name:'RtrB',tag:'backup path',tone:'l4',note:['O E2 8.8.8.8 [110/20] via 10.0.0.1, under 8.0.0.0/32 is subnetted','Its own static (AD 1) beats this copy (AD 110), so the copy waits as the backup','Enters the table when RtrB’s own static leaves it, as when its G0/1 uplink fails']}
     ],{}),
     NOTE('<b>Why <code>subnets</code> matters.</b> On classic IOS, <code>redistribute static</code> without <code>subnets</code> carries only classful networks, so a /32 stays home (IOS warns “% Only classful networks will be redistributed”). IOS XE adds <code>subnets</code> automatically. The detail panel below lists the classful ranges.'),
     DETAIL('OSPF behind the scenes',TIPS('Hello every 10 seconds and dead after 40 on Ethernet.','Neighbors form only when both ends share the subnet, mask, area, timers, and authentication, and each router-id is unique. Area 0 is the backbone.','Neighbor states: DOWN, INIT, 2WAY, EXSTART, EXCHANGE, LOADING, and FULL. Multi-access links elect a DR and a BDR.','Without a router-id command or a loopback, the router ID is the highest IPv4 address on an up interface when OSPF started: 203.0.113.2 on G0/1 here, and 198.51.100.2 on RtrB, which is why RtrB appears under that address as the information source.','<code>router-id</code> sets the name; <code>clear ip ospf process</code> applies a change. <code>passive-interface default</code>, then <code>no passive-interface</code> on the links, is the tidy pattern.','An ASBR brings outside routes in as type 5 LSAs; an E2 route keeps its seed metric, 20 by default.','Classful ranges behind the <code>subnets</code> keyword: first octet 1 to 126 is class A (/8), 128 to 191 class B (/16), and 192 to 223 class C (/24), so 8.8.8.8/32 sits inside class A 8.0.0.0/8. IOS XE adds <code>subnets</code> for you.')),
     DETAIL('Practice: Lockdown Range and Config Audit',NOTE('<b>Practice it.</b> <a href="'+RES['t4t-lr-ios'][1]+'" target="_blank" rel="noopener noreferrer">Lockdown Range: Cisco IOS</a>, Level 4 (Two sites), hands you a finished Site A and a factory-default SwB and RtrB: build the host route, the OSPF neighbor, and redistribute static subnets, then shut RtrB G0/1 and watch O E2 8.8.8.8/32 take over. <a href="'+RES['t4t-audit'][1]+'" target="_blank" rel="noopener noreferrer">Config Audit</a>’s Site B switch and Site B router scenarios drill the audit below.'))),
   QUIZ('se6ck1','Check yourself',[
     ['RtrB learns 10.1.20.0/24 through OSPF but still holds the Junior static 10.1.0.0/16 via 10.0.0.1. An auditor wants the static kept as a backup. Judge it.',['Remove it: OSPF’s /24s win by longest prefix, and the /16 rides the same link, so it backs up nothing when that link fails','Keep it: AD 1 wins for all of Site A','Keep it: OSPF wins while the link is up, so it waits as a backup','Remove both and rely on the default route'],0,'Longest prefix decides before AD. The /16 also hides an OSPF fault when only the adjacency drops. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>',{whys:['Longest prefix decides before AD, so the OSPF /24s already carry the traffic; the /16 uses the same link, so it fails together with them.','AD breaks ties only for the same prefix, and the OSPF /24s win by being longer.','The /16 rides the same link as OSPF, so it fails with it and backs up nothing.','The OSPF routes do real work, and a default route alone loses the inside networks.'],imp:'good',c:'cisco-config-audit'}]
   ]),
   SPOT('se6sp','Audit SwB and RtrB','Excerpts from Site B. Compare each line with the finished-network table, tap every line that breaks the design or weakens security, then Check.',[
     ['SwB# show running-config',null],
     ['interface FastEthernet0/1',null],
     [' switchport access vlan 10',null],
     [' switchport mode access',null],
     [' spanning-tree portfast',null],
     [' spanning-tree bpduguard enable',null],
     ['interface GigabitEthernet0/1',null],
     [' switchport trunk native vlan 10','The native VLAN is 10, the Students VLAN, while RtrB expects 99. Students frames cross untagged and land in RtrB’s VLAN 99, so Students lose their gateway, and a Students host could double-tag its way into other VLANs. Fix: switchport trunk native vlan 99.'],
     [' switchport trunk allowed vlan 10,20,99','VLAN 30 is missing, so Principals frames stop at SwB and Principals lose their gateway. Fix: switchport trunk allowed vlan add 30.'],
     [' switchport mode trunk',null],
     [' spanning-tree portfast trunk','PortFast on the uplink trunk skips the listening and learning that guard against loops. PortFast belongs on the Fa edge ports, as on Fa0/1 above. Fix: no spanning-tree portfast trunk.'],
     ['SwB# show ip interface brief | include Vlan',null],
     ['Vlan1      10.2.1.2     YES manual up     up','SwB’s management address sits on Vlan1, the default VLAN, outside the Teachers subnet that the design and ACL 20 expect. Fix: interface vlan 20 with 10.2.20.2, ip default-gateway 10.2.20.1, and shutdown on interface vlan 1.'],
     ['RtrB# show running-config',null],
     ['ip ssh version 2',null],
     ['interface GigabitEthernet0/0.99',null],
     [' encapsulation dot1Q 99 native',null,'RtrB already matches the design here, with native VLAN 99; the mismatch sits on SwB’s side.'],
     ['router ospf 1',null],
     [' redistribute static','Without subnets, classic IOS redistributes only classful networks, so the /32 to 8.8.8.8 stays on RtrB and RtrA goes without its backup path. Fix: redistribute static subnets (IOS XE adds subnets for you).'],
     [' passive-interface GigabitEthernet0/0.10',null,'passive-interface keeps OSPF hellos off the user VLANs while still advertising them, as the design calls for.'],
     [' passive-interface GigabitEthernet0/0.20',null],
     [' passive-interface GigabitEthernet0/0.30',null],
     [' network 10.0.0.0 0.0.0.3 area 0',null],
     [' network 10.2.0.0 0.0.255.255 area 0',null],
     ['ip route 8.8.8.8 255.255.255.255 198.51.100.1',null,'The host route to 8.8.8.8 is part of the design; the fault is the redistribute line, which keeps it from reaching RtrA.'],
     ['access-list 20 permit 10.1.20.0 0.0.0.255',null],
     ['access-list 20 permit 10.2.20.0 0.0.0.255',null],
     ['access-list 20 permit 10.2.10.0 0.0.0.255','10.2.10.0/24 is the Site B Students subnet, so every Students PC there can open a session to RtrB. Fix: ip access-list standard 20, then remove that entry by its sequence number.'],
     ['line vty 0 4',null],
     [' access-class 20 in',null],
     [' login local',null],
     [' transport input ssh',null],
     ['line vty 5 15','Lines 5 to 15 run without access-class 20 in, so once five sessions hold lines 0 to 4, the next session, from any source, lands on these unfiltered lines. Fix: access-class 20 in under line vty 5 15.'],
     [' login local',null],
     [' transport input telnet ssh','Telnet sends the session and the password as plain text. Fix: transport input ssh.'],
     ['RtrB# show ntp associations   ~10.1.20.50   .INIT.   16   -   64   0   0.000   0.000   15937.   (* sys.peer, ~ configured)','No * means RtrB runs without a time source (the check from <a href="#sophomore/s5">Cisco: configure a switch and a router</a>); .INIT., stratum 16, and reach 0 mean it never synced, so Site B log times drift. Check that RtrB reaches 10.1.20.50 on UDP 123 (a route, and an ACL that admits it), then confirm show ntp status reads synchronized.'],
     ['SwB# show interfaces fa0/24 switchport   Administrative Mode: dynamic desirable   Operational Mode: trunk','Fa0/24 is an unused port that negotiates with DTP, and whatever is plugged in formed a trunk: switch spoofing, a host that reaches every VLAN the trunk carries. It is live, so it comes right after the backup: note the device with show mac address-table interface fa0/24, shut the port, then set switchport mode access and switchport access vlan 999.']
   ]),
   ORDER('se6o','Remediate with the least downtime','You found the faults on SwB and RtrB. Tap the fixes in the order that keeps the network up and lets you undo each one: a saved copy first, then the live attack on Fa0/24, then your own access (the VTY lines first, then SwB’s management address), then the outages (the one that also opens an attack first), then the latent risks with the backup path as the last fix, then the verified save.',[
     ['Save a backup of the running-config','First, before any change: copy running-config flash:pre-audit.cfg on each device, so every later step can roll back.'],
     ['Note the device with show mac address-table interface fa0/24, shut Fa0/24, then park it (access mode, VLAN 999)','A live switch-spoofing trunk is an attack under way, so it closes before every other fix.'],
     ['Fix the VTY lines (ACL 20 on every range, SSH only) from a Teachers PC session while the console stays open','ACL 20 decides who reaches each device, so it leads the access fixes. A wrong access-class locks out every new session, your next login included, though the session you are typing in stays up; the open console is the way back in.'],
     ['Move SwB management from Vlan1 to interface vlan 20 from the console','Next, because the address you manage SwB by changes: make this move on the console, with the VTY lines already right from step 3, and confirm 10.2.20.2 answers before shutting Vlan1.'],
     ['Set native VLAN 99 on SwB G0/1 to match RtrB','First of the outages, because it is the largest and it also opens an attack: Students lose their gateway, and the mismatch opens double tagging. RtrB already has encapsulation dot1Q 99 native, so switchport trunk native vlan 99 on SwB G0/1 closes the gap; check show interfaces trunk at once.'],
     ['Add VLAN 30 to the trunk’s allowed list','Next, the remaining outage: switchport trunk allowed vlan add 30 restores the Principals gateway, and add keeps the rest of the list.'],
     ['Move PortFast off the trunk','A latent loop risk with no outage today, so it follows the outages: no spanning-tree portfast trunk on G0/1.'],
     ['Restore NTP on RtrB (a route and an ACL that admit 10.1.20.50 on UDP 123), then confirm show ntp status reads synchronized','After the outages, with the other latent risks: every log timeline depends on it, yet nothing is down today, so it waits until service is back.'],
     ['Add subnets to redistribute static','Only the other site’s backup path depends on it, so it is the last fix: redistribute static subnets.'],
     ['Verify with pings and show ip route','After the last fix, because only a test of the whole set proves it: ping across VLANs and sites, and read show ip route on both routers before calling it done.'],
     ['Save with copy running-config startup-config','Last, after the test: only a verified configuration becomes the one that survives a reload.']
   ]),
   QUIZ('se6q','Mixed review across the ladder',[
     ['RtrA holds a static route and an O E2 route to 8.8.8.8/32. Which one goes in its routing table?',['The O E2 route, because OSPF is dynamic','The static route: AD 1 beats AD 110','Both, sharing the load','Whichever has the lower metric'],1,'For the same prefix, AD picks between sources first; metrics compare routes from one source only.',{whys:['Being dynamic counts for little: for the same prefix the lower AD wins, and static is 1.','For the same prefix the source with the lower administrative distance wins: static 1 beats OSPF 110.','Two sources for one prefix compete on AD, so only the winner goes in the table.','Metrics compare routes from the same source; between sources, AD decides first.'],imp:'core',c:'cisco-troubleshooting'}],
     ['Which keyword lets classic IOS redistribute the /32 into OSPF?',['<code>metric-type 1</code>','<code>default-information originate</code>','<code>classful</code>','<code>subnets</code>'],3,'<code>redistribute static subnets</code> carries subnets and host routes. IOS XE adds the keyword automatically.',{whys:['metric-type 1 changes how the outside cost is counted, rather than which routes are carried.','default-information originate advertises a default route, a different job.','Classful is the limit itself: without subnets, classic IOS carries only classful networks and leaves the /32 behind.','redistribute static subnets carries subnets and host routes, the /32 included.'],imp:'good',c:'cisco-inter-vlan-routing'}],
     ['RtrB’s G0/1 uplink fails. How does RtrB reach 8.8.8.8 now?',['Through the O E2 route from RtrA, via 10.0.0.1','Through its static route, which stays in the table','Through SwB’s default gateway, 10.2.20.1','Through the native VLAN to SwB'],0,'The backup path at work: the static leaves, and the OSPF copy takes over.',{whys:['The static route leaves with its failed next hop, and the OSPF copy from RtrA takes over via 10.0.0.1.','A static route whose exit fails drops out of the table.','SwB’s default gateway points up at RtrB itself, so it leads straight back to RtrB.','The native VLAN stays on the trunk between SwB and RtrB.'],imp:'good',c:'cisco-troubleshooting'}],
     ['SwB’s <code>interface vlan 20</code> reads down/down although it has <code>no shutdown</code>. What do you check first?',['<code>show ip ssh</code>: SSH must run before the SVI comes up','<code>show vlan brief</code>: VLAN 20 must exist with an up port','<code>show ip route</code>: the SVI needs a route to its gateway','<code>show ip ospf neighbor</code>: the SVI waits for a neighbor'],1,'From Sophomore: the SVI depends on the VLAN.',{whys:['SSH and the SVI are independent; the SVI depends on its VLAN.','The SVI comes up once VLAN 20 exists and an up port or trunk carries it, so check show vlan brief.','The SVI has to be up before routes through it matter, so routing comes later.','An SVI comes up without OSPF; neighbors depend on the SVI, rather than the reverse.'],imp:'core',c:'cisco-interfaces-verify'}],
     ['Where does native VLAN 99 get configured?',['On the switch trunk only; the router follows it','On the router only; it routes the VLANs','On both ends: the switch trunk and the router subinterface','On every access port in VLAN 99'],2,'From Junior: both ends must agree, and VLAN 99 carries no hosts.',{whys:['The router needs the setting too, or the native frames land in the wrong place.','The switch trunk needs the setting as well, since one end alone mismatches.','Untagged frames land in whichever VLAN each end calls native, so the switch trunk and the router subinterface both name VLAN 99.','Access ports carry hosts, and VLAN 99 stays free of hosts.'],imp:'core',c:'cisco-vlans-trunks'}],
     ['Which of these lines is a finding?',['<code>spanning-tree portfast</code> on Fa0/1','<code>spanning-tree bpduguard enable</code> on Fa0/1','<code>spanning-tree portfast trunk</code> on G0/1','<code>switchport mode access</code> on Fa0/1'],2,'From Freshman: PortFast and BPDU guard belong on edge ports. The uplink trunk keeps the full spanning tree process.',{whys:['PortFast on an edge access port is part of the design, so this line passes the audit.','BPDU guard on an edge port is part of the design: it shuts the port if a switch appears, so this line passes the audit.','PortFast on the uplink trunk skips the loop check where loops can form, so it is a finding.','Access mode on an edge port is part of the design, since it stops trunk negotiation, so this line passes the audit.'],imp:'core',c:'cisco-config-audit'}],
     ['Where does <code>access-class 20 in</code> go?',['Under every VTY line range','Under interface g0/0','Under router ospf 1','On the VLAN 20 SVI'],0,'It goes on vty 0 15 on the switches, and on every listed range on the routers.',{whys:['access-class filters who opens a session to the device, so it goes on the VTY lines.','An interface takes ip access-group, which filters traffic passing through.','router ospf holds routing settings, apart from session filtering.','The SVI is the switch’s address; session filtering lives on the lines.'],imp:'core',c:'cisco-acls'}],
     ['A user connects to the SwB console. In what order do the messages appear?',['The login banner, then the MOTD, then the password prompt','The MOTD, then the login banner, then the password prompt','The password prompt, then the MOTD and the login banner','The MOTD alone, then the password prompt, then the login banner'],1,'From Sophomore: the MOTD shows first, then the login banner. A line password makes the prompt read Password:.',{whys:['The MOTD comes before the login banner.','IOS shows the MOTD to every connection as soon as it opens, and the login banner only as sign-in begins, so the login banner sits right above the prompt.','Both banners appear before the prompt, so the user reads them before signing in.','The login banner shows before the password prompt, right after the MOTD.'],imp:'good',c:'cisco-basic-config'}],
     ['An audit of SwB must close both VLAN-hopping routes. Which pair of settings does it?',['PortFast and BPDU guard on the trunks','Management on VLAN 1, and DTP on every port','A longer enable secret, and Telnet off','Access mode on every edge port, and a native VLAN that carries no hosts on every trunk'],3,'Switch spoofing needs a port that negotiates a trunk; double tagging needs the sender’s VLAN to be the native VLAN. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>',{whys:['PortFast and BPDU guard belong on edge ports, and VLAN hopping needs a different defense.','Management on VLAN 1 and DTP everywhere are the very openings VLAN hopping uses.','A longer enable secret and Telnet off harden sign-in, and VLAN hopping needs a different defense.','Access mode stops switch spoofing, and a host-free native VLAN stops double tagging.'],imp:'core',c:'cisco-config-audit'}],
     ['Which command confirms on RtrA that OSPF covers 10.0.0.0/30 and the Site A subnets, keeps the user subinterfaces passive, and redistributes static routes with subnets?',['show ip route','show ip protocols','show ip ospf neighbor','show running-config | include ip route'],1,'show ip protocols lists the networks, the passive interfaces, and the redistribution line in one place.',{whys:['The routing table shows the results, without the passive interfaces or the redistribution setting.','It lists Routing for Networks, Passive Interface(s), and the redistribution line together.','show ip ospf neighbor shows the neighbor and its state, without the settings behind them.','That filter shows only the static routes.'],imp:'good',c:'cisco-troubleshooting'}],
     ['An auditor finds CDP running on RtrA G0/1, the ISP uplink. The brief keeps CDP between RtrA and SwA. Judge the finding.',['A finding: no cdp enable on G0/1 stops RtrA announcing its IOS release to the provider’s side, and the SwA link keeps CDP','Harmless, because CDP stays on one link','A finding: no cdp run is the only fix','Harmless, because the ISP uses other vendors'],0,'CDP stays on one link, and that link leads outside the school.',{whys:['Per-port control closes the leak where it faces outsiders and keeps CDP where the brief wants it.','One link is enough: the device at the other end of the uplink belongs to someone else.','no cdp run would also stop CDP on the SwA link the brief keeps.','Any device that captures frames reads CDP, whatever its vendor.'],imp:'good',c:'cisco-config-audit'}],
     ['show version on RtrB ends with “Configuration register is 0x2142”. Judge it.',['A finding: the next reload skips the startup-config, so RtrB comes up unconfigured; set config-register 0x2102','Normal for a router with SSH','Harmless until the IOS image changes','A finding, fixed with copy running-config startup-config'],0,'0x2142 is the password-recovery setting that skips the saved configuration at boot. 0x2102 restores the normal boot.',{whys:['The register decides what loads at the next boot, and 0x2142 skips the saved configuration.','SSH has nothing to do with the boot setting; 0x2102 is the normal value.','The register applies at every reload, whatever the image.','Saving writes the startup-config, and 0x2142 still skips it at the next boot.'],imp:'good',c:'cisco-config-audit'}]
   ]),
   REFLECT('se6r','Defend your design','Justify three choices: management on Teachers or a dedicated VLAN, native VLAN 99 carrying no hosts, and the ACL on every VTY line. Name one trade-off for each.'),
   REFLECT('se6r2','Extend the design to a third site','Site C needs Students for 100 hosts, Teachers for 40, and Principals for 10, carved from 10.3.0.0/24. Plan the subnets with VLSM (variable-length subnet masks): give each subnet the smallest mask that fits its hosts, and carve the largest first so each block starts on its own boundary. Note each gateway. Then write the extended ACL, and the interface and direction it goes on, for this policy: Students may browse the Teachers web server at 10.3.0.140 and reach nothing else in Teachers. Last, weigh static summary routes against OSPF for three sites, with one trade-off each. <a href="'+RES['t4t-subnet'][1]+'" target="_blank" rel="noopener noreferrer">Subnet Sprint</a>’s Plan tab (VLSM plan) drills the subnet math.'),
   LINKS('Go further',['t4t-lr-ios','t4t-audit','t4t-tickets','t4t-ios','t4t-ld-ios','pt','netacad'])
  ]},
 {id:'se11',title:'Design the defended network: zero trust, deception, and visibility',bloom:'Create',sum:'Replace trust by location with checks on every request, add decoys and sinkholes, choose where to capture and what to log, and defend a zero trust redesign of the two-site network.',
  can:'replace trust by location with a check on every request, add decoys and sinkholes, choose where to capture and what to log, and defend a zero trust redesign',
  blocks:[
   COMPARE('Trust by location, or verify every request',[
     {name:'Trust by location',tag:'castle and moat',tone:'amber',
      rows:[['Trust comes from','Where the device sits: inside the firewall or on the VPN counts as trusted'],['One stolen password reaches','Everything that account can reach inside, often every server on a flat subnet'],['Remote work','A VPN that drops the laptop onto the inside network'],['What gets logged','Traffic crossing the edge; moves between inside hosts go unseen']],
      hook:'a castle gate: once inside, every door is open.'},
     {name:'Verify every request',tag:'zero trust',tone:'ok',
      rows:[['Trust comes from','Who is asking, the device’s health, and the context, checked for each app and each session'],['One stolen password reaches','Little by itself: MFA, a managed and healthy device, and least privilege per app still stand in the way'],['Remote work','An access proxy publishes one app at a time; the network itself stays closed'],['What gets logged','Every allow and every deny, with user, device, app, and reason']],
      hook:'a badge reader on every door.'}
   ],{intro:'Both designs still use firewalls. They differ in what earns access.',
     note:'Zero trust is a design approach rather than a product. Three habits sum it up: verify explicitly, grant the least access for the shortest time, and assume a breach is under way, so segment and log.',bloom:'Evaluate'}),
   PATH('One request through a policy check',[
     {name:'User and device',tag:'Leilani · school laptop',tone:'l1',note:['Opens the grades app from home','Brings her sign-in token and a device health report'],via:'Request'},
     {name:'Enforcement point',tag:'PEP · access proxy',tone:'l2',note:['Holds the request; the app stays hidden from the internet','Asks the decision point'],via:'Who, on what device, for which app?'},
     {name:'Decision point',tag:'PDP · policy engine',tone:'l3',note:['Identity: signed in at the IdP with MFA','Device: managed, patched, and EDR running','Context: usual place, hour, and behavior'],via:'Allow or deny'},
     {name:'Back at the PEP',tag:'PEP enforces',tone:'amber',note:['Allow: a session to this one app, for a limited time','Deny: nothing behind the proxy answers','The PEP and PDP send each decision to the central log: user, device, app, result, and reason'],via:'Session'},
     {name:'Grades app',tag:'one app only',tone:'ok',note:['Accepts only proxied sessions']}
   ],{intro:'The enforcement point (PEP) stands in front of the app, and the decision point (PDP) decides.',bloom:'Evaluate'}),
   QUIZ('se11ck1','Check yourself',[
     ['Which change moves the two-site network closest to zero trust first?',['Each app behind a PEP, with the PDP checking MFA, device health, and context','A larger edge firewall with deeper inspection of everything that crosses the perimeter','Longer VPN sessions, so people sign in less often','One flat inside network behind a strong perimeter'],0,'Zero trust moves the check from the edge to every request, and the PDP logs each decision.',{whys:['Zero trust checks each request rather than the network it comes from, and a PEP with a PDP behind it is where that check happens.','A bigger perimeter still trusts whatever gets inside.','Longer sessions stretch trust out, the opposite of checking every request.','A flat inside network trusts by location, the very model zero trust replaces.'],imp:'core',c:'net-zero-trust'}]
   ]),
   C('One strong sign-in feeds every decision','Evaluate',
     P('Single sign-on supplies the PDP’s first input. The identity provider (IdP) from <a href="#junior/j10">Cloud security: identity, storage, and logs</a> signs each person in once. It then vouches for them to every app with a signed token (SAML or OpenID Connect).'),
     TIPS('<b>Gains:</b> one place to require MFA, one log of every sign-in, fewer passwords to reuse, and one switch that removes a departing user from every app.',
          '<b>Risks:</b> the IdP becomes the prize and a single point of failure. A stolen session token skips both the password and the MFA prompt, and a careless consent grant (consent phishing) hands an outside app standing access.',
          '<b>Weigh it:</b> SSO earns its place when the IdP gets phishing-resistant MFA (passkeys or security keys), short token lifetimes, an alert on one token used from two addresses, and admin approval for new apps. It also needs, for the day the IdP is down, two emergency (break-glass) admin accounts kept outside SSO and Conditional Access, with long passphrases or security keys in a safe and an alert on any use.')),
   C('Manage the network through one door','Evaluate',
     P('Junior let any Teachers PC reach the VTY lines (<code>access-class 20</code>). A <b>jump server</b> narrows that to one hardened machine in its own management VLAN (40 MGMT, 10.1.40.0/24 at Site A, added to the trunk allowed lists). Admins reach it by SSH with MFA, it records each session, and every router and switch accepts SSH only from its address.'),
     TIPS('<b>Windows servers:</b> <a href="#senior/se8">Windows: allow only what you trust</a> builds the same door, reached by Remote Desktop or WinRM. Remote Credential Guard keeps the admin’s password on the admin workstation.',
          '<b>Linux servers:</b> ufw or nftables allows 22/tcp only from 10.1.40.10, and admins hop with ProxyJump in <code>~/.ssh/config</code> (<a href="#senior/se9">Linux: confine services and prove it</a>).'),
     CMDS('On every router and switch',[
       ['ip access-list standard MGMT-ONLY','A named ACL for the management plane.'],
       ['permit host 10.1.40.10','The jump server alone; the implicit deny drops every other source.'],
       ['line vty 0 15','Every VTY line at once, so no range is left open.'],
       ['access-class MGMT-ONLY in','Applies it, beside <code>transport input ssh</code> and <code>login local</code> or AAA.']
     ]),
     TIPS('<b>Gains:</b> one audited path, MFA in front of every device, and management ports closed to every other address, so a phished Teachers laptop reaches no VTY line.',
          '<b>New risks:</b> the jump server is a single point of failure and the top target. Keep it patched, free of email and browsing, reachable only from admin workstations (an outbound ACL on RtrA g0/0.40 that admits their SSH and the replies it needs), and alerted on any sign-in outside a change window; keep the console or an out-of-band path for the day it is down.',
          '<b>The rest of the management plane:</b> SSH version 2 only, SNMPv3 in place of community strings, AAA with a local fallback account, logs to 10.1.20.50, and NTP from one source, so every device’s log lines up.')),
   C('Decoys and dead ends','Evaluate',
     COMPARE(null,[
       {name:'Honeypot',tag:'a decoy',tone:'l3',
        rows:[['Imitates','A server, share, or account with no real job, such as a decoy file share or the unused account svc_backup_old; a decoy account or file is a honeytoken'],['Catches','Anyone who touches it: an intruder exploring, or a stolen credential in use. Real users have no reason to go there, so nearly every alert is real'],['Sits','Inside, among real hosts, isolated, so it leads nowhere, and holding fake data only'],['Misses','Anything that never touches it']],
        hook:'a marked bill in the till.'},
       {name:'DNS sinkhole',tag:'a dead end',tone:'l2',
        rows:[['Imitates','The answer for a known-bad domain: the resolver returns an address the defenders control'],['Catches','Infected hosts calling home: each lookup and connection names its source, while the real controller stays out of reach'],['Sits','On the inside resolvers, fed by a blocklist, with the sinkhole server logging who arrives'],['Misses','Domains the list has yet to name, traffic sent straight to an IP address, and lookups that skip your resolver']],
        hook:'a wrong number that rings at the help desk.'}
     ],{bloom:'Evaluate'}),
     TERM('decoy     21:47:12Z  sign-in  user=svc_backup_old  from=10.1.10.61  result=FAIL  (decoy account)\ndecoy     21:47:40Z  SMB      share=Payroll-Archive on 10.1.20.77  from=10.1.10.61  files listed=3\nresolver  21:52:40Z  10.1.10.61  A? upd-check.cdn-fast.example -> 10.1.20.251 (sinkhole) list=malware-c2\nsinkhole  21:52:41Z  10.1.10.61:51022 -> 10.1.20.251:443  SNI=upd-check.cdn-fast.example  repeats every 300 s'),
     TIPS('<b>Weigh the evidence:</b> one Students PC touched the decoy account, the decoy share, and the sinkhole within six minutes. Each alone is a strong lead to scope, after the change log rules out an approved scan; three independent signs together confirm it, so contain 10.1.10.61 now (<a href="#junior/j12">Respond to an incident: triage, contain, and recover</a>).',
          '<b>The sinkhole cut the call, not the infection.</b> The beacon keeps repeating until the PC is cleaned.')),
   QUIZ('se11ck2','Check yourself',[
     ['The decoy account svc_backup_old signs in from 10.2.10.45 at 21:47. What does that tell you?',['Nothing: decoys are noisy','The decoy needs a stronger password','A high-confidence lead, since no one has a real use for it: scope 10.2.10.45, then contain it','Little: a decoy account draws failed sign-ins from scanners all day, so tune its alert down and move on'],2,'Any use of a decoy is suspicious, and the response follows the playbook. <a href="#junior/j12">Review: Respond to an incident: triage, contain, and recover</a>',{whys:['A decoy has no real job, so it stays quiet until someone uses it.','A stronger password misses the point: any use at all is the alarm.','A decoy has no real use, so any sign-in is a high-confidence lead to scope and contain.','This is a successful sign-in rather than scanner noise, and a decoy’s alert stays loud.'],imp:'core',c:'det-deception'}]
   ]),
   C('Sign the answer, or hide the question','Evaluate',
     COMPARE(null,[
       {name:'DNSSEC',tag:'signed answers',tone:'l3',
        rows:[['Protects','Authenticity: the zone owner signs its records, and a validating resolver checks the chain of signatures up to the root'],['Stops','Forged or altered answers: a validating resolver returns SERVFAIL instead of the lie, so cache poisoning fails'],['Still allows','Anyone on the path to read every lookup, and an unsigned zone has nothing to check'],['Read it','<code>dig +dnssec</code>: RRSIG records show the zone is signed; the <code>ad</code> flag shows the resolver validated the answer']]},
       {name:'Encrypted DNS',tag:'DoT or DoH',tone:'l2',
        rows:[['Protects','Privacy and integrity between the device and its resolver: TLS on port 853 (DoT) or inside HTTPS on 443 (DoH)'],['Stops','The café Wi-Fi, or an on-path host, reading or changing lookups on that hop'],['Still allows','The resolver to see everything and to pass on a forged answer from upstream; DoH set inside an app can also skip the school’s filtering resolver and its sinkhole'],['Read it','The device’s resolver setting, and outbound 853 or known DoH hosts in the firewall log']]}
     ],{note:'<b>The defender’s choice:</b> validate DNSSEC on the school resolvers, offer DoT or DoH to those resolvers yourself, published for laptops off site like any app, and let egress rules allow DNS only to them, so the sinkhole keeps working.',bloom:'Evaluate'})),
   DETAIL('A signed, validated answer in dig',
     TERM('$ dig +dnssec hoku-hardware.example A @10.1.20.50\n;; ->>HEADER<<- opcode: QUERY, status: NOERROR, id: 40112\n;; flags: qr rd ra ad; QUERY: 1, ANSWER: 2, AUTHORITY: 0, ADDITIONAL: 1\nhoku-hardware.example.  300  IN  A      203.0.113.80\nhoku-hardware.example.  300  IN  RRSIG  A 13 2 300 20261110000000 20261013000000 41783 hoku-hardware.example. kq3V...')),
   C('Where to watch, and what may leave','Evaluate',
     TIPS('<b>Flows at every boundary:</b> RtrA and RtrB export NetFlow or IPFIX to one collector, kept for months. Flows still work on encrypted traffic, since they record only who, where, when, and how much.',
          '<b>Full capture at the choke points, for days:</b> inside the NAT on the internet uplink, so alerts name real hosts, and on the DMZ-to-inside link, where the one allowed path runs.',
          '<b>Host agents where encryption hides the rest:</b> servers first; a capture shows only the envelope of a TLS session.',
          '<b>Egress as a detector:</b> allow web through the proxy, DNS (plain or encrypted) only to the school resolvers, NTP from the time source, and mail from the mail server; deny and log the rest. Each new service then needs a rule and a change-log line: that is the cost.')),
   HIER('Nested zones, the same at every site',
     {name:'Internet',note:'Untrusted.<br><b>Control:</b> the provider’s upstream scrubbing for floods',tone:'muted',children:[
       {name:'Perimeter',note:'The edge of each site.<br><b>Control:</b> ingress filtering, then a stateful firewall or NGFW<br><b>Watch:</b> NetFlow from each edge router',tone:'amber',children:[
         {name:'DMZ at Site A',note:'The public portal.<br><b>Control:</b> only 443 in, and one path inside, app to database<br><b>Watch:</b> an inline IPS, alert-only until tuned',tone:'l2'},
         {name:'Link between sites',note:'Site A and Site B.<br><b>Control:</b> a route-based IPsec tunnel (a tunnel interface that carries OSPF), with OSPF authentication<br><b>Watch:</b> flows on the tunnel',tone:'l2'},
         {name:'Inside: Students, Teachers, and Principals VLANs',note:'<b>Control:</b> 802.1X admits each device; ACLs between VLANs<br><b>Watch:</b> a SPAN copy of each uplink, inside the NAT',tone:'l3',children:[
           {name:'Sensitive segment',note:'The records server and the management VLAN.<br><b>Control:</b> a PEP in front of each app, and device management only from the jump server<br><b>Watch:</b> host agents, a decoy account, and a decoy share',tone:'l4'}]}]}]},
     {intro:'The zones from <a href="#junior/j6">Network security design: firewalls, zones, VPNs, and Wi-Fi</a>, nested: inner zones get tighter controls and closer watching.',bloom:'Evaluate'}),
   SPOT('se11sp','Audit a two-site redesign','A consultant’s redesign of Site A, Site B, and the link between them claims zero trust. Tap every line that trusts by location, weakens the PEP or the PDP, blinds the defenders, or turns a defense into a new risk, then Check.',[
     ['Link: a route-based IPsec tunnel between RtrA and RtrB, carrying OSPF with authentication',null],
     ['Remote staff: the VPN lands in the Teachers VLAN at Site A, with access to both sites','Trust by location: one stolen password plus the VPN reaches every Teachers subnet. Publish each app through the PEP instead, with MFA and a device check.'],
     ['PEP: an access proxy in front of the grades and records apps',null],
     ['PDP rule 1: a sign-in at the IdP with MFA, from a managed device that passes its health check',null,'This is the zero-trust rule itself: every request proves who is asking (MFA) and what it runs on (a healthy managed device).'],
     ['IdP: any staff member may approve a new app’s access to mail and files','Consent phishing: one tricked click hands an outside app standing access to a mailbox. Require admin approval for new apps.'],
     ['PDP rule 2: any request from 10.0.0.0/8 skips MFA and the device check','The inside range earns trust by location, so a phished laptop on any VLAN walks past the PDP. Apply rule 1 to every request.'],
     ['Decisions: the PEP keeps its allow and deny log on its own disk','An intruder who takes the proxy can erase it unseen. Send every decision to the central log at 10.1.20.50, with NTP-synced time.'],
     ['Management: SSH to RtrA, RtrB, SwA, and SwB only from the jump server 10.1.40.10, with MFA there and every session recorded',null,'One hardened door for device management, with MFA and recorded sessions, is the design working; the risk is using that same server for email and browsing.'],
     ['The jump server: also the network admin’s desk for email and browsing','One phishing click there exposes every device password typed on it. Keep it for admin work only.'],
     ['Decoy: a file share in the Principals VLAN holding a real copy of last year’s records, to look convincing','A decoy holds fake data only; real records in it turn the trap into the breach. Fill it with believable fakes, and isolate it.'],
     ['Decoy account svc_backup_old: any sign-in raises a priority 1 alert',null,'A decoy account has no real use, so any sign-in is a high-confidence alert, which is the reason it exists.'],
     ['DNS: the school resolvers validate DNSSEC and sinkhole every domain on the malware blocklist',null],
     ['Egress: outbound any to any, so updates never break','Malware calls home freely, and nothing is logged. Allow the needed services; deny and log the rest.'],
     ['Visibility: RtrA and RtrB export NetFlow to the collector, kept 13 months; full capture on the uplink inside the NAT, kept 7 days',null]
   ]),
   QUIZ('se11q','Check: design judgment',[
     ['The school puts twelve apps behind single sign-on. Which control matters most?',['Number matching on push prompts, with 30-day session tokens so people sign in less','A second IdP, so each app keeps a backup sign-in','A separate VPN for each app, so one stolen password opens only one of them','Passkeys or security keys at the IdP, short token lifetimes, and an alert on its sign-in log'],3,'The IdP is the prize: guard it hardest and watch its log. <a href="#junior/j10">Review: Cloud security: identity, storage, and logs</a>',{whys:['Number matching still yields to a fake sign-in page, and a 30-day token is a long prize for a thief.','A second IdP is a second prize to guard.','Separate VPNs add burden and leave the IdP, the real prize, as weak as before.','One sign-in opens twelve apps, so phishing-resistant keys, short tokens, and a watched log guard the prize.'],imp:'core',c:'crypto-sso'}],
     ['The sinkhole log shows the Principals file server calling it 40 times overnight and two Students PCs once each. Which do you isolate first?',['The Students PCs, since two infected hosts outnumber one','The file server: it holds records and beacons all night','None: the sinkhole already stopped them','Whichever called first, since it has been infected the longest'],1,'Rank by role, then by count. The sinkhole cut the channel, not the infection.',{whys:['Two PCs calling once each matter less than a records server beaconing all night.','Rank by role, then by count: the file server holds records and called 40 times.','The sinkhole cut the channel, and the infection is still on the hosts.','Role and volume rank the risk, rather than who called first.'],imp:'good',c:'det-deception'}],
     ['The school wants poisoned answers rejected and lookups hidden on café Wi-Fi, while keeping the sinkhole. Which plan fits?',['DNSSEC validation on the school resolvers, and DoT or DoH from every device, on site or off, to those same resolvers','DoH in every browser to a large public resolver, which encrypts every lookup and validates DNSSEC too','DNSSEC alone, since it also encrypts lookups','A longer TTL on every record'],0,'DNSSEC and encrypted DNS work together; point both at your own resolvers. <a href="#junior/j7">Review: Read the wire: captures, flows, and network attacks</a>',{whys:['DNSSEC proves who wrote the answer, encrypted DNS hides the question, and your own resolvers keep the sinkhole in the path.','A public resolver skips the school’s resolvers, so the sinkhole drops out of the path.','DNSSEC signs answers and leaves lookups readable.','A longer TTL keeps answers cached longer, poisoned ones included.'],imp:'good',c:'net-dns-dhcp'}],
     ['Sinkhole hits from three Students PCs drop to zero overnight, and the school resolver logs no lookups from them, yet flows show each PC sending HTTPS to a public DoH resolver, then HTTPS every 300 s to an outside address. What most likely happened, and what comes next?',['The infections cleared; the HTTPS every 300 s is only a browser update check','The sinkhole server crashed','DNSSEC broke the lookups','The malware switched to DNS over HTTPS around the sinkhole to reach its controller: contain the PCs, then block DoH at the egress'],3,'Allowing DNS only to the school resolvers, plus a DoH block list, puts the sinkhole back in the path.',{whys:['A beacon every 300 s to an outside address is a controller check-in, a sign of active infection.','A crashed sinkhole leaves lookups at the school resolver, and these PCs stopped asking it.','Broken DNSSEC shows failed lookups at the school resolver, and these PCs went around it.','The malware moved to DNS over HTTPS around the sinkhole, so contain the PCs and block DoH at the egress.'],imp:'core',c:'det-deception'}],
     ['Site B has one uplink and an office that must never lose payroll. Which sensor plan fits?',['An inline IPS that fails closed and blocks on every new rule from day one, so nothing slips past','A stateless ACL alone, since it reads applications','A SPAN-fed IDS, with the NGFW’s IPS in alert-only mode until tuned and set to fail open','No sensor, since encryption hides everything'],2,'Detect first, block once tuned, and keep the only link up if the sensor fails. <a href="#junior/j6">Review: Network security design: firewalls, zones, VPNs, and Wi-Fi</a>',{whys:['Failing closed on the only uplink cuts payroll whenever the sensor fails or misfires.','A stateless ACL reads addresses and ports, rather than applications.','Detect first, block once tuned, and fail open so the only link stays up.','Encryption hides contents, while addresses, timing, and volume stay visible to a sensor.'],imp:'core',c:'det-ids-ips'}],
     ['Most uplink traffic is TLS. What can a Wireshark capture there still prove?',['The passwords inside each session','Who talked to whom, when, and how much, plus the server name unless Encrypted Client Hello hides it','Nothing useful','The pages and files each user opened, since Wireshark decrypts TLS once it captures the whole handshake'],1,'Encryption hides the contents, not the envelope; pair the capture with flows and host agents. <a href="#junior/j7">Review: Read the wire: captures, flows, and network attacks</a>',{whys:['TLS encrypts the passwords inside each session.','Encryption hides the contents, while the envelope still shows who, when, how much, and often the server name.','The envelope is still useful: who talked to whom, when, and how much.','Capturing the handshake leaves the keys hidden, so the contents stay encrypted.'],imp:'good',c:'det-captures'}],
     ['The Site A portal faces a reflection flood of 20 Gbit/s on a 1 Gbit/s uplink. Which response works?',['A deny rule on RtrA’s outside interface for every reflector address in the flood','Rebooting the web server','A longer DNS TTL','The provider’s upstream scrubbing, arranged before the day it is needed'],3,'Once the link is full, filtering at your end comes too late; the flood must be dropped upstream. <a href="#junior/j7">Review: Read the wire: captures, flows, and network attacks</a>',{whys:['Once the link is full, rules at your end come too late: the flood has already used the bandwidth.','Rebooting the server leaves the full uplink as it was.','A longer TTL changes caching, and the uplink stays full.','The provider can drop the flood before it fills your link, and that deal has to exist before the day.'],imp:'core',c:'threat-network-attacks'}],
     ['After the build, an approved nmap -sT scan of the Site A portal’s public address from outside shows 443 open and 22 filtered. Does the edge match the DMZ design?',['Yes: only 443 answers, and filtered means the firewall drops probes to 22 without a reply','No: a port the design blocks should show as closed, with the firewall sending a reset to every probe','No: filtered means 22 is open','The scan proves nothing'],0,'Open answers SYN-ACK, closed answers RST, and filtered gets nothing back, or at most an ICMP unreachable. <a href="#sophomore/s7">Review: Network tools and a safer router</a>',{whys:['443 answers and 22 gets silence, which is exactly what the DMZ design promised.','Filtered is a fine result for a blocked port, since the firewall may drop probes silently.','Filtered means probes got no reply, which is the opposite of open.','An approved scan from outside is the very test that proves the edge matches.'],imp:'good',c:'net-scan-results'}],
     ['Zero trust checks every app request. Is 802.1X on SwB’s ports still worth it?',['No: once the PDP checks every app request, a device on the wire reaches nothing that matters, so 802.1X adds nothing','Only for printers','Yes: it keeps unknown laptops off the wire before they can try ARP spoofing; DAI and snooping guard admitted ones','Only on trunks'],2,'Layers cover different gaps: 802.1X guards the port; DAI and snooping guard the segment; the PEP and PDP guard each app. <a href="#junior/j6">Review: Network security design: firewalls, zones, VPNs, and Wi-Fi</a>',{whys:['Zero trust stacks layers, and a device on the wire can still attack its neighbors, for example with ARP spoofing.','Every laptop port benefits, since unknown laptops are the threat.','802.1X keeps unknown laptops off the wire, while DAI, snooping, and the PDP guard the other layers.','Trunks link switches, and 802.1X guards the access ports where people plug in.'],imp:'core',c:'net-nac'}]
   ]),
   REFLECT('se11r','Defend your zero trust design','Redesign the two-site network so Students, Teachers, and office staff reach only what they need. Sketch the zones as nested rings, then decide:<br>1. Where the PEP sits, and what the PDP checks for each role.<br>2. How you guard the IdP, and what staff do the day it is down.<br>3. How admins reach RtrA, RtrB, SwA, and SwB.<br>4. One decoy, and where the sinkhole answers.<br>5. Your outbound allow list.<br>6. Which capture point gives visibility, what you keep there, and for how long.<br>7. Whether Site B reaches the internet through its own uplink or only through Site A (one edge to watch, but Site A becomes a single point of failure).<br>For each choice, name the attack it stops and the cost or single point of failure it adds.'),
   LINKS('Go further',['nist-800-207','cisa-ztmm','nist-800-41'])
   ]},
 {id:'se12',title:'Governance, risk, and compliance',bloom:'Evaluate',sum:'Choose a treatment and an owner for each risk, model threats before you build, label data and stop it leaving, match rules to the data they cover, see who checks whom, and pick a framework that fits a small organization.',
  can:'choose a treatment and an owner for each risk, model threats before you build, label data and stop it leaving, match rules to data, and pick a framework that fits',
  blocks:[
   C('Decide, own, and prove it','Evaluate',
     P('In Junior you plotted findings on likelihood by impact (<a href="#junior/j5">Evaluate a configuration</a>). Governance comes next: someone decides what to do about each risk, owns that choice, and keeps evidence that it happened. Two settings recur: <b>Waimea Feed and Supply</b>, a six-person store in Waimea that takes orders online, and <b>Kahikina High</b>, which holds student records.'),
     TIPS('<b>Risk register:</b> one row per risk, with its likelihood, impact, treatment, owner, and review date.',
          '<b>Residual risk</b> is what remains after a control. Rate it again; that second rating is what the owner accepts.',
          '<b>Risk appetite</b> is how much risk leaders will carry for a goal.')),
   COMPARE('Four ways to treat a risk',[
     {name:'Reduce',tag:'add a control',tone:'l2',rows:[['Means','Lower the likelihood or the impact'],['Example','MFA on the order site’s admin page'],['Who decides','The risk owner approves and funds it'],['What remains','Residual risk, rated again']],hook:'lock the door.'},
     {name:'Avoid',tag:'drop the activity',tone:'l3',rows:[['Means','Stop doing the thing that creates the risk'],['Example','Shut down the old customer forum instead of patching it'],['Who decides','Management, since it changes how the business runs'],['What remains','That risk is gone, along with some convenience']],hook:'skip the trip.'},
     {name:'Transfer',tag:'share the cost',tone:'l4',rows:[['Means','Move the money impact by insurance or contract'],['Example','Cyber insurance that pays for breach notices and recovery'],['Who decides','The owner signs the policy or contract'],['What remains','Downtime, reputation, and the duty to protect data']],hook:'buy insurance.'},
     {name:'Accept',tag:'on the record',tone:'amber',rows:[['Means','Carry it on purpose, in writing, until a review date'],['Example','An old back-office PC past its last update, isolated until its March replacement'],['Who decides','The owner or management, always above the technician'],['What remains','All of it, watched until the review']],hook:'sign and watch.'}
   ],{bloom:'Evaluate',
     note:'A risk with an unrecorded decision is still an open risk. Most real rows combine two treatments: insurance (transfer) plus tested offline backups (reduce) for ransomware.'}),
   C('Who decides, who records','Evaluate',
     P('Leaders set security policy, fund controls, assign owners, accept the remaining risk, and sign the authorization for testing and change. In an incident they also make the business calls, such as taking the order site offline, based on the risk the response team explains. A technician lays out clear options with cost, risk, and business effect, then carries out the decision and records it.'),
     TERM('RISK ACCEPTANCE   R-04   Waimea Feed and Supply\nRisk:      back-office PC runs an OS past end of support\nOptions:   (a) replace now, $1,900\n           (b) own VLAN, internet blocked, replace in March\nDecision:  (b)   residual risk: Medium, accepted\nOwner:     Healani (owner)    signed 2026-10-05\nPrepared:  Kekoa (IT)         review 2027-03-01')),
   QUIZ('se12cy1','Check yourself',[
     ['The owner declines to fund MFA for the order site this year. What does a professional do?',['Turn MFA on anyway; security outranks budget','Delete the row, since nothing will change','Record the options, the owner’s decision, and a review date','Mark it Reduce, since MFA may come next year'],2,'Leaders own risk decisions; you make the options clear and keep the record.',{whys:['Leaders own risk decisions, so turning it on anyway oversteps.','Deleting the row erases the record.','Leaders own risk decisions, so your part is to record the options, the owner’s choice to accept the risk for now, and a date to review it.','Reduce means a control goes in, and this risk is accepted for now.'],imp:'core',c:'gov-risk'}]
   ]),
   SCALE('Inherent risk, residual risk, and appetite',{from:'Low risk',to:'High risk',bands:[
     ['Low','Accept and review each year','ok'],
     ['Medium','<b>R-04 residual:</b> own VLAN, internet blocked. Under the line, so Healani signs to accept it.','l2',1.5],
     ['Appetite line','Healani set it: Medium is the most the store carries','muted',0.8],
     ['High','<b>R-04 inherent:</b> an unsupported PC on the office network. Over the line, so treat it first.','bad',1.5]]},
     {bloom:'Evaluate',intro:'One risk, rated twice: <b>inherent risk</b>, before any control, and residual risk, after one.',
      note:'A residual rating still over the line needs another treatment (a second control, avoid, or transfer) before anyone signs.'}),
   SCALE('CIA trade-offs',{x:['Property','C','I','A'],y:['Control','Lock out','Encrypt','Back up','MFA'],
     cells:[[['Helps','slows guessing','ok'],['Neutral','','muted'],['Strains','locks out staff','amber']],
       [['Helps','stolen disk stays locked','ok'],['Helps','flags altered data','ok'],['Strains','lost key, lost data','amber']],
       [['Strains','more copies to guard','amber'],['Helps','restores a clean copy','ok'],['Helps','recovers from failure','ok']],
       [['Helps','stolen password fails','ok'],['Helps','fewer takeovers','ok'],['Strains','lost phone blocks sign-in','amber']]]},
     {bloom:'Evaluate',intro:'C is confidentiality, I is integrity, and A is availability. Read across a row: most controls help one property and strain another.',
      key:[['ok','Helps this property'],['amber','Strains this property'],['muted','Neutral: little effect']],
      note:'Shrink each strain with a second control: lockout after about 10 tries for a few minutes (an outsider can trigger lockouts on purpose), keys kept in escrow, backups encrypted, and printed recovery codes for MFA.'}),
   C('Judge a control set','Evaluate',
     P('In Freshman you sorted controls by type (administrative, technical, or physical) and by job (prevent, detect, or correct) (<a href="#freshman/f3">Security principles</a>). Now judge a whole set: a strong set covers each job and more than one type, so one failure leaves another layer standing. That is defense in depth.'),
     TIPS('<b>Gap check:</b> a store with a firewall, antivirus, and a password policy prevents a lot and detects little. Add alerts on admin sign-ins and a tested restore.',
          '<b>Compensating control:</b> when the ideal control cannot run, a substitute covers the same risk and goes on the record. The old PC above is past its last update, so its own VLAN with internet blocked stands in.')),
   C('Model threats before you build','Evaluate',
     P('<b>Threat modeling</b> asks four questions before a system ships: what are we building, what can go wrong, what will we do about it, and did we do a good job? A data-flow sketch answers the first. <b>STRIDE</b> answers the second with six prompts, one for each property a design must keep. Below, the store models its new online order form.')),
   COMPARE('Six questions before you build (STRIDE)',[
     {name:'Who did it?',tag:'S and R',tone:'l1',rows:[
       ['Spoofing','Breaks <b>authentication</b>. A reused password lets someone order on a ranch customer’s account. <b>Control:</b> passkeys or MFA, plus new-device alerts.'],
       ['Repudiation','Breaks <b>non-repudiation</b>. A buyer says “I never ordered 40 bags,” and the log holds only an order number. <b>Control:</b> log account, time, and source address to a server staff can only append to.']],hook:'fake who, or deny what.'},
     {name:'The data',tag:'T and I',tone:'l2',rows:[
       ['Tampering','Breaks <b>integrity</b>. An order arrives with its price changed in the browser. <b>Control:</b> the server recalculates every price from its own catalog.'],
       ['Information disclosure','Breaks <b>confidentiality</b>. Changing the order number in the link shows another customer’s home address. <b>Control:</b> check on every request that the order belongs to the signed-in account.']],hook:'change it, or see it.'},
     {name:'Service and power',tag:'D and E',tone:'l3',rows:[
       ['Denial of service','Breaks <b>availability</b>. Thousands of fake orders fill the queue before delivery day. <b>Control:</b> rate limits, a bot check, and a per-account order cap.'],
       ['Elevation of privilege','Breaks <b>authorization</b>. A customer account opens the staff discount page. <b>Control:</b> role checks on the server for every staff page.']],hook:'stop it, or take it over.'}
   ],{bloom:'Evaluate',
     note:'STRIDE finds threats; it leaves the ranking to you. Put each threat on the register and score it like any other risk.'}),
   SCALE('Data labels: public, internal, confidential, restricted',{from:'Share freely',to:'Tightest handling',bands:[
     ['Public','Bell schedule and lunch menu. Post anywhere.','ok'],
     ['Internal','Staff meeting notes. Staff accounts only; outside sharing needs approval.','l2'],
     ['Confidential','Student records: grades and attendance. Need to know, encrypted, and school accounts only.','amber'],
     ['Restricted','Health and special-education files. Named people only, every view logged, and kept on school systems.','bad']]},
     {bloom:'Evaluate',intro:'Kahikina High labels every file. The label, rather than the file name, tells people and tools how to handle it.',
      note:'Label by the most sensitive thing inside: a class list with one allergy note is Restricted. Over-labeling everything trains people to ignore labels.'}),
   C('Stop it leaving: data loss prevention','Evaluate',
     P('<b>Data loss prevention (DLP)</b> tools find sensitive data as it leaves by email, USB drive, cloud upload, or printer, then warn, block, or log. They recognize it by its label, by patterns such as student ID or card numbers, and by fingerprints of known files. DLP protects confidentiality, depends on good labels, and raises false positives (<a href="#freshman/f13">Watch, detect, and respond</a>) that analysts review and tune.')),
   COMPARE('A labeled file tries to leave',[
     {name:'Email',tag:'to a personal address',tone:'bad',rows:[['Action','<b>Block</b>, with a pop-up that names the label'],['Record','Logged with sender and recipient'],['What flips it','A district address: the email passes and is logged']]},
     {name:'USB drive',tag:'school-encrypted',tone:'amber',rows:[['Action','<b>Warn</b>: Pua types a reason, then the copy runs'],['Record','Logged with her reason and the drive serial'],['What flips it','A personal drive: blocked']]},
     {name:'Cloud upload',tag:'school cloud folder',tone:'ok',rows:[['Action','<b>Log</b>: the upload passes'],['Record','Logged with the folder and file name'],['What flips it','A personal storage site: blocked']]}
   ],{bloom:'Evaluate',intro:'<b>The file:</b> Pua exports period 3 grades to grades-p3.xlsx, labeled Confidential: student records. The label travels inside the file, and DLP also counts 32 student ID numbers.',
     note:'<b>False positive:</b> a math worksheet of 32 nine-digit practice numbers matched the student ID pattern and was blocked. Analysts tuned the rule to need the label or a student name nearby; alerts dropped from 40 a week to 6, and a test leak still triggered.',
     caption:'The label sets the rule, and the destination sets the action: block, warn, or log.'}),
   C('Which rules apply','Evaluate',
     P('<b>Compliance</b> means meeting the rules that apply to you and proving it with evidence. Laws come from governments; standards such as PCI DSS come through contracts. Each rule covers certain data held by certain organizations, so start by asking what data you hold. Legal staff make the final call.')),
   COMPARE('Which rule protects which data',[
     {name:'FERPA',tag:'school records',tone:'l1',rows:[['Who','Schools funded by the US Education Department'],['Covers','Student education records, such as grades and attendance'],['Expects','Written parent consent (the student’s own at 18) before most outside sharing']]},
     {name:'COPPA',tag:'children under 13',tone:'l2',rows:[['Who','Sites and apps aimed at children under 13, or that know they collect from them'],['Covers','Personal information from children under 13'],['Expects','Verifiable parental consent before collecting, and a written security program']]},
     {name:'HIPAA',tag:'health',tone:'l3',rows:[['Who','Providers, health plans, clearinghouses, and their business associates'],['Covers','Protected health information'],['Expects','A written risk analysis, access controls, and audit logs']]},
     {name:'Hawaiʻi 487N',tag:'breach notice',tone:'amber',rows:[['Who','Businesses and agencies holding Hawaiʻi residents’ personal information'],['Covers','A name plus a Social Security, license, or financial account number'],['Expects','Notice to each person without unreasonable delay; over 1,000 people adds the state Office of Consumer Protection and the credit bureaus']]}
   ],{bloom:'Evaluate',intro:'FERPA and COPPA both touch students: FERPA binds the school, and COPPA binds the site or app.',
     note:'Schools on E-rate follow <b>CIPA</b>, a filtering law: it expects an internet filter and a safety policy. Rules stack: Hilo Lehua Clinic follows HIPAA and the Hawaiʻi law. Encrypted data whose key stays safe is usually exempt from breach notice.'}),
   QUIZ('se12cy2','Check yourself',[
     ['Mānoa Makerspace lets campers aged 9 to 12 make their own accounts on its site to post projects. Which rule sets the consent it needs?',['FERPA','COPPA','CIPA','HIPAA'],1,'COPPA covers personal information from children under 13 and expects verifiable parental consent.',{whys:['FERPA binds schools and their records.','COPPA covers personal information collected online from children under 13, and campers aged 9 to 12 fall under it.','CIPA is a school filtering law.','HIPAA covers health information.'],imp:'good',c:'gov-compliance'}]
   ]),
   VENN('Compliant and secure',[
     {name:'Compliant',tone:'l2',items:['Passed the March audit, while remote access still takes a password alone']},
     {name:'Secure',tone:'ok',items:['Passkeys and tested offline backups, with no written policy to show an auditor']}
   ],{overlaps:[{sets:'AB',items:['MFA on remote access, its sign-in log reviewed weekly, and the review notes kept as evidence']}],
     bloom:'Evaluate',intro:'An audit checks evidence against a minimum at one moment. An intruder tests the whole system every day.',
     note:'Compliance sets the floor. Aim for the overlap: controls that work and leave evidence that they work.'}),
   HIER('Who checks whom',{name:'Board or owner',note:'Sets risk appetite; hears audit reports directly',tone:'l4',children:[

       {name:'Compliance',note:'Owns the rules and gathers evidence',tone:'l2'},
