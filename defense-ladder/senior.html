    {bloom:'Evaluate',intro:'Audit reports go up to the board, around management, so the people who run a control never grade it.',
     note:'Auditors ask for evidence: logs, configs, change records, and sign-offs. Separation of duties applies here too: whoever makes a change has someone else approve it.'}),
   C('Pick a framework that fits','Evaluate',
     P('A framework is a ready-made map of what a security program covers. Choose by who you are, what customers or contracts demand, and what your team can keep up.'),
     DETAIL('NIST publishes several, each answering one question',TIPS('<b>CSF 2.0</b>: what outcomes','<b>SP 800-53</b>: which controls exist','<b>SP 800-37</b>: how a federal system gets approved to run','<b>SP 800-63B-4</b>: how to sign people in','<b>SP 800-61 Rev. 3</b>: how to respond','<b>SP 800-207</b>: zero trust'))),
   COMPARE('Frameworks side by side',[
     {name:'NIST CSF 2.0',tone:'l1',rows:[['For','Any organization: six functions of outcomes'],['Required by','Your own choice: voluntary'],['Certification','Self-assessed with current and target profiles'],['Small-store fit','A shared map; light on exact steps']]},
     {name:'CIS Controls v8.1',tone:'l2',rows:[['For','Any organization: 18 prioritized controls'],['Required by','Your own choice: voluntary'],['Certification','Self-assessed by Implementation Group'],['Small-store fit','Implementation Group 1 is the starting set']]},
     {name:'ISO/IEC 27001',tone:'l3',rows:[['For','Organizations running a security management system'],['Required by','Your own choice; customers often ask for it'],['Certification','Yes, by an accredited auditor'],['Small-store fit','Heavy for six people; common for vendors']]},
     {name:'PCI DSS v4.0.1',tone:'amber',rows:[['For','Anyone who stores, processes, or sends card data'],['Required by','Card brands, by contract: an industry standard, not a law'],['Certification','Validated yearly by questionnaire or assessor report'],['Small-store fit','Shrinks when a processor takes the cards']]}
   ],{bloom:'Evaluate',
     note:'<b>RMF:</b> US federal systems follow the NIST Risk Management Framework, a seven-step loop in which a senior official signs to accept the remaining risk.'}),
   DETAIL('RMF steps and ISO/IEC 27001 audits',
     P('The RMF’s seven steps are prepare, categorize, select, implement, assess, authorize, and monitor. For <b>ISO/IEC 27001 certification</b>, an accredited body audits the management system and its chosen controls (ISO/IEC 27002 lists 93), then returns each year.')),
   QUIZ('se12cy3','Check yourself',[
     ['Which starting framework fits Waimea Feed and Supply, six staff and no IT department?',['ISO/IEC 27001 certification','The NIST RMF authorization loop','PCI DSS alone','CIS Controls Implementation Group 1'],3,'IG1 is a short, ranked list a small team can finish; the CSF gives it a shared map.',{whys:['ISO 27001 is heavy for six people.','The RMF is for US federal systems.','PCI DSS covers card data alone.','IG1 is a short, ranked set of safeguards that a small team without IT staff can finish.'],imp:'core',c:'gov-frameworks'}]
   ]),
   C('Rules people follow every day','Evaluate',
     TIPS('<b>AI tools:</b> a good rule names the approved tool and account, the data labels allowed in a prompt, and a human check before anything leaves. Review: <a href="#freshman/f2">Safe and ethical online</a> and the prompt-injection panel in <a href="#junior/j9">Web attacks in the logs</a>.',
          '<b>Access models:</b> RBAC fits stable jobs; ABAC adds conditions such as class roster, time, or device; MAC (mandatory access control) fits a central policy nobody may override, such as an AppArmor profile or classification labels; DAC leaves sharing to owners (<a href="#junior/j10">Cloud security: identity, storage, and logs</a>).')),
   SPOT('se12sp','Find the weak entries in a risk register','An excerpt of Waimea Feed and Supply’s register (likelihood × impact · treatment · owner · review). Tap every weak entry, then Check.',[
     ['R-01 Old customer forum, unused since 2024, unpatched · Likely × Major · Avoid: forum taken offline and deleted · Healani (owner) · 2027-04',null,'Avoid fits a risk you can remove: deleting the unused forum takes the risk away, and the owner signs off with a review date.'],
     ['R-02 Hackers · Possible × Major · Reduce: “be careful” · IT · no date','A vague risk that lacks a real control, a named owner, and a review date. Name the asset and the threat, pick a control, and assign a person.'],
     ['R-03 Order-site plugin on the KEV list, facing the internet · Rare × Severe · Accept · Kekoa (IT) · 2027-10','Free scanners and exploit frameworks find exposed KEV flaws within days, so the likelihood is Likely, and only the owner can accept risk. Patch it (reduce). <a href="#junior/j11">Review: Map the attack</a>'],
     ['R-04 Back-office PC past end of support · Possible × Moderate · Accept: own VLAN, internet blocked, replace in March · Healani · 2027-03',null,'Accepting is sound here: the owner accepts it, the PC sits on its own VLAN with the internet blocked, and a replacement date ends the risk.'],
     ['R-05 Owner’s mailbox taken over by phishing · Likely × Major · Reduce: MFA codes by text message · Healani · 2027-04','Text codes can be phished and relayed. The account that approves payments needs phishing-resistant sign-in, such as a passkey. <a href="#freshman/f10">Review: Keys, locks, and certificates</a>'],
     ['R-06 Cloned voice of the owner rushes a supplier payment · Possible × Major · Reduce: call back on the number in the supplier file before any change · Makana (bookkeeper) · 2027-04',null,'A call-back on a number already in the supplier file is the control that defeats a cloned voice, and a named person owns it.'],
     ['R-07 Zero-day in the order-site software · Possible × Severe · Reduce: “patch it when it happens” · Kekoa · 2027-04','A zero-day has no patch yet. Reduce the damage with layers: a web application firewall, a least-privilege database account, monitoring, and offline backups. <a href="#freshman/f8">Review: Threats and the people behind them</a>'],
     ['R-08 Ransomware on the file share · Possible × Severe · Transfer: cyber insurance · Healani · 2027-04','Insurance pays costs, yet the store still cannot fill orders. Pair it with reduce: tested offline backups and least privilege on the share.'],
     ['R-09 Staff names and roles on the website feed phishing · Likely × Minor · Reduce: role mailboxes (orders@) in place of names, plus phishing training · Healani · 2027-04',null]
   ]),
   QUIZ('se12q','Check: governance judgment',[
     ['Kahikina High’s DLP raises three alerts one morning: (1) the registrar sends the Confidential enrollment file to the district office through the approved transfer, (2) a vendor’s test file of made-up nine-digit numbers reaches the IT inbox, and (3) a teacher’s email of a Confidential class roster to a personal address is blocked. Which alert needs follow-up with a person, and why?',['Alert 1: it moved the most student records at once','Alert 2: nine-digit numbers in an inbox mean student IDs leaked','Alert 3: a labeled roster headed to a personal address','All three equally: each one matched a DLP rule'],2,'Judge the label, the data, and the destination together; only alert 3 breaks policy. <a href="#freshman/f13">Review: Watch, detect, and respond</a>',{whys:['An approved transfer is a false positive, so record a narrow exception.','Fake numbers that match a pattern are a false positive, so tune it.','The roster is labeled Confidential and was headed to a personal address, a real policy break even though DLP blocked it, so a person follows up.','Two of the three alerts are false positives: an approved route and fake test numbers.'],imp:'core',c:'gov-data-classification'}],
     ['Waimea Feed and Supply staff want an AI chat assistant to draft customer emails. Which rule balances use and risk?',['Business account; training off; Public or Internal data only; a person reads each draft','Business account; training off; any data; a person reads each draft','Staff’s free accounts; Public or Internal data only; a person reads each draft','Business account; training off; Public or Internal data only; routine replies auto-send'],0,'Name the tool, limit the data by label, and keep a person in the loop. <a href="#freshman/f2">Review: Safe and ethical online</a>',{whys:['A business account with training off keeps the data in the shop’s control, the label limit keeps Confidential data out, and a person catches mistakes.','Any data lets Confidential files into the tool.','Free accounts sit outside the business’s control.','Auto-send removes the person who checks each draft.'],imp:'core',c:'threat-ai-tools'}],
     ['Kahikina High wants teachers to see grades only for students in their own classes, during the term, from school devices. Which model fits?',['DAC: each teacher shares what they like','RBAC alone: a Teacher role sees every grade','ABAC: rules on the class roster, the date, and the device','No model; trust the teachers'],2,'Roster, time, and device are attributes; RBAC alone would give every teacher every grade. <a href="#junior/j10">Review: Cloud security: identity, storage, and logs</a>',{whys:['DAC lets owners share freely, so grades spread.','One Teacher role would see every grade, beyond each teacher’s own classes.','ABAC writes rules on attributes, and the class roster, the date, and the device are attributes of the user, the time, and the device.','Trust alone leaves the grades open.'],imp:'core',c:'gov-access-models'}],
     ['Hilo Lehua Clinic passed its HIPAA audit in March. In June an intruder signed in to remote access, which took a password alone, with a stolen password. What explains it?',['The audit checked a minimum at one moment; password-only remote access was a gap MFA closes','Passing the audit moved the breach risk to the auditor','The intruder must have used a zero-day, since audited controls held','The clinic fell out of compliance after March, so the audit is void'],0,'Compliant and secure overlap and still differ. Aim for controls that work and leave evidence.',{whys:['An audit checks a minimum set of controls at one moment, and password-only remote access slipped through as a gap that MFA closes.','The risk stays with the clinic.','A stolen password against password-only access explains it.','The audit stays valid, and compliance is a minimum.'],imp:'core',c:'gov-compliance'}],
     ['After the lockout threshold drops to 3 tries, Monday’s help-desk queue triples with locked-out staff. Which judgment fits?',['Keep 3: confidentiality outranks everything','Remove lockout and rely on long passwords','Set about 10 tries with a short lockout, plus MFA','Keep 3, and lock accounts for a full day'],2,'Lockout at 3 traded availability for confidentiality; a second control offsets the strain. <a href="#freshman/f3">Review: Security principles</a>',{whys:['Confidentiality is one of three goals.','Removing lockout leaves guessing open.','About 10 tries still stops guessing, a short lockout keeps staff working, and MFA covers the guesses that remain.','A full-day lockout keeps staff out even longer.'],imp:'core',c:'host-lockout-policy'}],
     ['A STRIDE review lists elevation of privilege for the store’s file server. Which evidence would show it happening?',['Event 4732 adds the clerk to local Administrators; the clerk’s next sign-in logs 4672','Event 4672 logs the owner’s usual admin sign-in at 09:00','Event 4624 logs the clerk’s usual sign-in at 08:00','Event 4625 logs the clerk mistyping a password once'],0,'An account that should hold no admin rights joined an admin group and then received special privileges: a climb to admin. <a href="#junior/j8">Review: Windows: logons, tokens, and the event trail</a>',{whys:['4732 shows the clerk joining local Administrators, and 4672 shows the next sign-in receiving admin privileges: a climb to admin.','The owner’s usual admin sign-in is expected.','A usual sign-in is normal.','One mistyped password is normal.'],imp:'good',c:'gov-threat-modeling'}],
     ['Hawaiʻi\u2019s breach-notice law requires organizations to tell affected people when their personal data is exposed. The feed store\u2019s developer says the rule slows the new order app; the owner says it protects customers. Which judgment weighs both?',['The law is a cost; build first and add notification later if a breach happens','The law is a design input: logging and data labels built in now make notification possible and cut what a breach exposes','The law applies to large companies alone, so the store skips it','The law makes the app illegal'],1,'A rule adds little work when designed in and much when bolted on later. <a href="#senior/se12">Review: Governance, risk, and compliance</a>',{whys:['Notification after a breach needs logs and an inventory of what was exposed, and those have to be built in beforehand.','Treating the rule as a design input means the app logs access, labels personal data, and collects less of it, so a breach exposes less and a notice can be accurate.','Breach-notice laws cover organizations of every size that hold personal data.','The law regulates how data is handled; the app stays legal when it handles data as the law describes.'],imp:'good',c:'gov-compliance'}]
   ]),
   REFLECT('se12r','A framework and a threat model for the feed store','Waimea Feed and Supply has six staff, an online order form, and card payments through a processor. Pick one framework, name the first three things you would do with it, and defend why it beats the other three for this store. Then list three STRIDE threats for the order form, each with the property it breaks and one control.'),
   LINKS('Go further',['nist-csf','cis-controls','nist-rmf','iso-27001','pci-ssc','owasp-threat-model','ed-ferpa','ftc-coppa','hhs-hipaa'])
   ]},
 {id:'se3',title:'Create: your own checklist',bloom:'Create',sum:'Build a per-OS hardening checklist from standards and vendor documentation: the single biggest speed multiplier.',
  can:'build a per-OS hardening checklist from standards and vendor documentation, and refine it after every practice session',
  blocks:[
   C('Why you build it yourself','Create',
     P('A checklist your team writes from <b>general documentation</b> (CIS Benchmarks, vendor docs, and DISA STIGs) makes the knowledge yours. A copied list gives steps without reasons, so when something breaks you are left guessing which step did it.'),
     P('Which framework to build from is a governance choice (<a href="#senior/se12">Governance, risk, and compliance</a>); this checklist turns that choice into exact settings.'),
     NOTE('Cite a source for every line (a CIS recommendation number, a Microsoft Learn page, or a man page), so you can re-check it when versions change. Check each source’s license and terms of use before you share anything copied from it.')),
    HIER('From framework to checklist line',[
     ['Framework: NIST CSF 2.0','Outcomes in six Functions: Govern, Identify, Protect, Detect, Respond, and Recover. It leaves the settings to you.','l1'],
     ['Controls: CIS Controls v8.1','18 prioritized controls with safeguards, for a whole organization and any product. They say what to do first.','l2'],
     ['Configuration guides: CIS Benchmarks, DISA STIGs, and vendor baselines','Numbered settings per product and version. STIGs are written for US Department of Defense systems.','l3'],
     ['Your checklist','One line per setting: what to check, the command or panel, the value, and the source it came from.','l4']
   ],{top:'Broad: what to achieve',bottom:'Exact: what to set',bloom:'Understand',
     intro:'Take exact settings from the configuration guides, and use the rungs above them to check that your list covers every area.'}),
   DETAIL('Benchmark levels, STIG categories, and rung mapping',
     P('CIS Benchmarks offer Level 1 and Level 2 profiles, and STIGs rate findings from CAT I (most severe) to CAT III. Vendor baselines, such as Microsoft’s security baselines, often ship as importable policy.'),
     P('Each rung maps onto the one above it: CIS Benchmark recommendations point to CIS Controls safeguards, and CIS maps the Controls to NIST CSF 2.0. A strong checklist line can cite a benchmark number and the control it serves.')),
   BUILDER('se3b','Checklist builder','Fill each section for one operating system. Export the text, then refine it after every practice session. Everything you type here stays in this browser.',[
     ['os','Operating system this checklist is for','e.g. Windows 11, Windows Server 2025, Linux Mint, Ubuntu, Debian, or FreeBSD'],
     ['first','First five minutes (orientation)','Read the scenario brief and investigation questions, and answer the questions before any change; note users, admins, and required services; record a baseline; snapshot if allowed; assign roles; start the change log.'],
     ['accounts','Account management and access control','List authorized users and admins; remove or disable the rest; strip extra admins; disable guest; set a password on every account; force resets on compromised accounts.'],
     ['policy','Password and lockout policy','Minimum length, history, age, and complexity per your policy; lockout threshold, duration, and reset window. Where to set it on this OS, and which standard you follow.'],
     ['firewall','Firewall','Default deny inbound, allow outbound, and open only required ports. The exact tool and commands for this OS.'],
     ['services','Services, startup, and persistence','Enumerate listening ports and running services; remove or disable insecure ones outside the brief; check scheduled tasks, cron, and rc.conf for persistence.'],
     ['updates','Patching and malware defenses','Patch the OS; enable automatic updates; confirm antivirus on and current (where applicable).'],
     ['files','Files, shares, and unauthorized software','Fix shares and dangerous permissions; find unauthorized media; uninstall unauthorized or remote-access software.'],
     ['forensics','Investigation approach','How you will find and answer: search, hash, and read logs; answer in the exact format; leave everything else untouched.'],
     ['verify','Verify and sweep','Re-run your baseline commands and compare; confirm every required service and user still works; mop up low-impact items (banners, screen lock, and logging).']
   ]),
   REFLECT('se3r','Which release is this line for?','Pick five lines from your checklist. For each, name the release it targets and how you would confirm the current default before acting: new installs of Windows 11 22H2 and later already lock out repeated wrong passwords, and 24H2 already requires SMB signing. Which line would you have called a finding on a machine that already had it right?'),
   DETAIL('Security templates and release defaults',P('On Windows a checklist can become a <b>security template</b>: <code>secedit /export</code> captures the current policy, you edit it, <code>secedit /configure</code> applies it, and <code>secedit /analyze</code> compares a machine against it, so the baseline is repeatable and auditable.'),TIPS('<b>[System Access] keys:</b> MinimumPasswordLength, PasswordComplexity (1 on), PasswordHistorySize, MaximumPasswordAge, MinimumPasswordAge, LockoutBadCount, LockoutDuration, ResetLockoutCount, ClearTextPassword (0 keeps reversible encryption off), and AllowAdministratorLockout (1 brings the built-in Administrator under lockout).','<b>Commands:</b> <code>secedit /export /cfg C:\\Temp\\secpol.cfg</code> (create C:\\Temp first); <code>secedit /configure /db C:\\Temp\\new.sdb /cfg FILE /areas SECURITYPOLICY</code> with a new database each run, because /configure adds the template to whatever that database already holds; <code>secedit /analyze</code> to compare.','<b>Release defaults:</b> new Windows 11 22H2 and later installs lock out after 10 attempts for 10 minutes; 24H2 requires SMB signing and removes NTLMv1, Windows PowerShell 2.0, and Defender Application Guard; the August 2026 preview update removes WMIC from 24H2 and 25H2 (and 26H1 follows in September), with PowerShell\u2019s Get-CimInstance in its place; Windows Server 2025 signs all outbound SMB, and new AD deployments require LDAP signing. Read the current value before calling it a finding.')),
   LINKS('Go further',['cis','cis-controls','stig','ms-baselines','ubuntu-sec','fbsd'])
  ]},
 {id:'se13',title:'Run the response: detections, playbooks, and the after-action review',bloom:'Create',sum:'Write and tune detection rules, judge detection coverage, automate a playbook, brief the right people, set recovery targets, and write the report that improves the next response.',
  can:'write and tune a detection rule, judge coverage, automate a playbook, brief the right people, set recovery targets, and write the report that improves the next response',
  blocks:[
   C('Build the response before you need it','Create',
     P('Preparation, the first phase in <a href="#freshman/f13">Watch, detect, and respond</a>, is everything ready before the alert. After one case in <a href="#junior/j12">Respond to an incident</a>, you now build what speeds the next: rules, playbooks, a call list, recovery targets, and an after-action report.')),
   ANATOMY('One detection rule',[
     {name:'Rule: many failed sign-ins from one address',tag:'Hōkū Hardware SIEM',tone:'l2',
      head:['What and where','Log source: Windows Security 4625 from every PC and server, forwarded to the SIEM','Match: logon type 3 or 10, grouped by source address'],
      trail:['When it fires','Threshold: 10 or more in 10 minutes','Severity: Medium; High if a 4624 from the same address follows','Tested on last week’s logs: fired on all three attacks, with 7 false positives'],
      grid:true,children:[
        {name:'ATT&CK tag',tone:'l1',text:'v20: T1110 Brute Force; sub-techniques .001 Password Guessing and .003 Password Spraying'},
        {name:'Known false positives',tone:'amber',text:'The scanner at 10.30.0.15 in its Sunday window; a phone with an old saved password'},
        {name:'Response',tone:'l3',text:'The sign-in playbook: block the address, check each named account, and reset any that later signed in'}
      ]}
   ],{
     caption:'A rule is a saved search with a job description; a missing field leaves the analyst guessing.',bloom:'Create'}),
   C('Write it once, test it twice','Create',
     P('<b>Sigma</b>, an open, YAML-based format that converts to many SIEMs, lets teams share rules. This pair counts 4625s per address:'),
     TERM('title: Failed sign-in\nname: failed_logon\nlogsource: {product: windows, service: security}\ndetection:\n  selection: {EventID: 4625, LogonType: [3, 10]}\n  condition: selection\n---\ntitle: Many failed sign-ins from one address\ncorrelation:\n  type: event_count\n  rules: [failed_logon]\n  group-by: [IpAddress]\n  timespan: 10m\n  condition: {gte: 10}\nlevel: medium\ntags: [attack.t1110]'),
     P('Before it goes live, <b>back-test</b> it: run it on attack logs (it must fire) and on a normal week (count the false positives).')),
   SCALE('Tuning one threshold',{from:'3 failures in 10 minutes',to:'50 failures',bands:[
     ['3','212 false positives · 0 missed','bad'],
     ['5','61 false positives · 0 missed','amber'],
     ['10','7 false positives · 0 missed','ok',1.3],
     ['20','1 false positive · 1 missed: the slow spray','amber'],
     ['50','0 false positives · 2 missed: both sprays','bad']]},
     {intro:'Last week’s sign-in logs held three attacks: 300 guesses at one account, a 40-name spray, and a slow spray of 12 tries per 10 minutes. Misses are false negatives.',
      note:'Low thresholds bury analysts (<b>alert fatigue</b>); high ones hide quiet attacks. A missed spray at a store that takes cards outweighs seven extra alerts a week. For slower sprays, add a second signal: many names from one address per hour.',
      caption:'Pick the threshold where misses stay at zero, then trim false positives with narrow, written exclusions.',bloom:'Evaluate'}),
   QUIZ('se13ck1','Check yourself',[
     ['To catch sprays slower than 10 tries in 10 minutes, what adds coverage without burying analysts?',['Add a rule: one address failing on 8+ names in an hour','Lower the threshold to 3','Lower the threshold to 5','Exclude every address that also has a successful sign-in'],0,'Lower thresholds bury analysts in alerts, and excluding addresses with a success hides the sprays that worked.',{whys:['A second signal catches the slow spray and keeps the noise low.','Threshold 3 buried analysts in 212 false positives.','Threshold 5 still raised 61 false positives.','This hides the sprays that worked.'],imp:'core',c:'det-rules-playbooks'}]
   ]),
   SPOT('se13sp','Tune the noisy rule','At threshold 3 the rule raised 212 false positives last week. Tap each proposed change that would hide a real attack or weaken the alert, then Check.',[
     ['Threshold 3 to 10 in 10 minutes',null,'Tested on last week’s logs, 10 in 10 minutes still fired on all three attacks and cut the false positives from 212 to 7.'],
     ['Exclude scanner 10.30.0.15 only, Sun 02:00 to 04:00',null,'One known host in its scheduled window: a spray from any other address, or from the scanner at any other hour, still fires.'],
     ['Exclude all of 10.30.0.0/16, the store network','An intruder on a staff PC sits inside that range, so guessing from a compromised PC would never alert. Exclude one known host, not a whole network.'],
     ['Threshold to 50 to end the noise','On last week’s logs, 50 misses both sprays: two false negatives.'],
     ['High severity if a 4624 follows from that address',null],
     ['Drop the ATT&CK tag to shorten alerts','Coverage checks and searches by technique depend on the tag.'],
     ['One alert per address per hour, with the count',null,'Grouping by address trims repeat alerts, and the count keeps the size of each attack in view.'],
     ['Pause the rule nights and weekends','Intruders favor quiet hours, and with few staff signing in, alerts then are the clearest.'],
     ['Rerun the change on last week before saving',null]
   ]),
   C('Judge coverage, then pivot','Evaluate',
     TIPS('<b>Coverage.</b> For each ATT&amp;CK technique (<a href="#junior/j11">Map the attack</a>), ask: is the log collected, does a rule match it, and has a test proved it fires?',
          'Any missing piece is a gap. Check sub-techniques too: a parent tag can hide an uncovered child.',
          '<b>Rank the gaps by threat.</b> Techniques named in current intelligence about groups that hit clinics and small shops come first.',
          '<b>Close a gap two ways.</b> Hunt for it now (<a href="#junior/j12">a hunt starts from a hypothesis</a>), then turn the search into a rule.',
          '<b>Diamond pivots:</b> the beacon address (infrastructure) finds every PC that called it (victim); the macro’s behavior (capability) finds every other PC it ran on.')),
   SCALE('Indicators and behavior',{from:'Easy for the intruder to change',to:'Hard to change',bands:[
     ['File hash','One rebuild changes it; block for hours','muted'],
     ['IP address','Swapped in minutes; expire in days','l1'],
     ['Domain','A new one costs little; expire in weeks','l2'],
     ['Tool','Weeks to rebuild; detect its traits','l3'],
     ['Behavior','Word starting PowerShell, a steady beacon; rules last','ok',1.3]]},
     {intro:'An indicator is a trace, such as a hash or an address; a detection is a rule on what the tool does.',
      caption:'Block the cheap ones briefly; detect the expensive ones for good.',bloom:'Evaluate'}),
   SEQ('An automated playbook with a human gate',[
     ['Alert','EDR flags a file on a Hōkū Hardware PC.','l1'],
     ['Enrich','Add the host’s owner, role, and criticality from the inventory, plus the signed-in user.','l2'],
     ['Look up','Check the file hash, and the domain it came from, in threat intelligence; an unknown file goes to a private sandbox (<a href="#junior/j13">dynamic analysis</a>).','l2'],
     {ask:'Known bad, on a workstation?',detail:'Unknown means unproven: a new file matches no signature.',branches:[['Yes: automatic','Isolate the PC and open a ticket at once'],['No, or a server: a person approves','Send to an analyst with the enrichment attached; isolating a server or disabling an account waits for that approval']]},
     ['Close with a note','Record what ran, who approved it, and the result, so the report can quote it.','l3']
   ],{intro:'A SOAR tool turns the runbooks inside a playbook (<a href="#junior/j12">runbooks and playbooks</a>) into code that runs in seconds.',
     note:'A wrong automated action repeats at machine speed: a step that disables any account after five failures lets an outsider lock out the whole staff on purpose.',
     caption:'Automate the lookups and the reversible actions; gate the disruptive ones.',bloom:'Evaluate'}),
   QUIZ('se13ck2','Check yourself',[
     ['A proposed SOAR step disables any account after five failed sign-ins. Its weakness?',['Five failures is too high a bar to stop password guessing','An outsider can lock out every staff member on purpose','It drops the ATT&CK tag','Disabled accounts leave no log entry'],1,'Gate account and server actions behind an approval.',{whys:['Five is a low bar, so an outsider trips it with ease.','Anyone can fail five sign-ins on any name and lock out the staff.','The tag matters for coverage; the lockout is the danger.','The danger is the lockout, apart from logging.'],imp:'core',c:'det-rules-playbooks'}]
   ]),
   HIER('Who needs to know',{name:'Incident lead',note:'Calls each branch: who is told, when, and by whom',tone:'l4',children:[
     {name:'Management',note:'Decides business trade-offs: take booking offline, bring in outside help, and approve the cost',tone:'l3'},
     {name:'Legal counsel',note:'Decides notification duties (HIPAA’s breach rule and Hawaiʻi 487N for a clinic, 487N for a store; <a href="#senior/se12">Governance</a>), what goes in writing, and when to call law enforcement',tone:'l3'},
     {name:'HR',note:'Decides any part involving an employee, such as a misused account or a policy breach, handled by policy and law',tone:'l3'},
     {name:'Communications',note:'Decides the one voice for staff, customers, and the press, in words legal has cleared',tone:'l3'},
     {name:'Outside contacts',note:'Called when needed: cyber insurer, IT provider, law enforcement, and partners whose data is involved',tone:'l2'}
   ]},{
     note:'Write the list before the incident, with a backup contact for each branch, and keep a printed copy: email and the phone directory may be down too.',
     caption:'Responders bring the facts; each stakeholder owns its own decision.',bloom:'Evaluate'}),
   QUIZ('se13ck3','Check yourself',[
     ['Patient contact details may have left the clinic. Who must hear first?',['Communications, to post an update','HR, to discipline the front desk','Legal counsel and management','The insurer only'],2,'Legal counsel advises on notification duties, management decides, and communications speaks in cleared words.',{whys:['Communications speaks only in words legal has cleared.','HR handles employee matters later, by policy.','Legal counsel advises on duties, and management decides.','The insurer is one outside contact among several.'],imp:'core',c:'det-after-action'}]
   ]),
   SCALE('Recovery targets against the measured result',{x:['Measure','RPO: data lost','RTO: time down'],y:['Result','Target','Spring drill','Second drill, after the fixes'],
     cells:[[['1 hour','Set in advance by management','l2'],['4 hours','Set in advance by management','l2']],
       [['Not tested','The drill restored a test copy','muted'],['5 h 20 min','Over by 1 h 20 min: no restore had ever been timed','bad']],
       [['40 min','Inside: hourly snapshots; last good copy 08:00, encryption at 08:40','ok'],['3 h 30 min','Inside: down 08:40, verified 12:10 HST, 30 min to spare','ok']]]},
     {intro:'In <a href="#junior/j12">Junior</a> you read RPO and RTO after the fact. Here Hilo Lehua Clinic sets them for its booking system and tests them in two drills.',
     note:'RPO looks back to the last good copy; RTO looks forward to verified service. Copies must come at least as often as the RPO. Only a timed restore test proves an RTO. Keep one copy offline or immutable, out of ransomware’s reach.',
     key:[['ok','Inside the target'],['bad','Over the target']],
     caption:'A target means something only beside a measured result.',bloom:'Create'}),
   C('The after-action review','Create',
     P('Within two weeks the team meets without blame and asks what in the plan failed, rather than who. Each lesson in the report becomes a change to preparation.'),
     HIER('The after-action report',[
       ['Summary','Five lines for leaders: what happened, impact, status, and the top fix','l4'],
       ['Timeline','UTC, one line per event, each with its source (<a href="#junior/j13">one timeline</a>)','l3'],
       ['Scope and impact','Hosts, accounts, data, and downtime against the RTO','l3'],
       ['Root cause','How the intruder got in and why it worked, placed on the kill chain','l3'],
       ['Response','What was done, what worked, and what slowed the team','l3'],
       ['Improvements','Each with an owner and a due date','ok'],
       ['Appendix','Indicators, plus the evidence list with hashes and custody forms (<a href="#junior/j13">chain of custody</a>)','l2']
     ],{top:'Read by all',bottom:'Read by few',intro:'Facts carry their evidence; guesses are marked as guesses.',caption:'Summary first for readers who stop there; improvements with owners, so the report changes something.',bloom:'Create'})),
   REFLECT('se13r','Write the after-action summary for a clinic ransomware drill','Hilo Lehua Clinic ran a hands-on ransomware drill on a test copy of its booking system. Facts: the EDR alert came at 07:55 HST and sat unread for 17 minutes; the front desk found .locked files at 08:12; the insurer’s number on the call list was out of date; the restore took 5 hours 20 minutes against a 4-hour RTO, since nobody had timed one. Chain: a macro document from the internet, a scheduled task for persistence, then encryption of the booking server. Write:<br>1. The five-line summary.<br>2. Three timeline lines in UTC (HST is UTC−10).<br>3. Three improvements, each with an owner and a due date.<br>4. One point that still needs confirming.<br>5. A three-row coverage table for the chain: ATT&CK v20 technique, log source, rule, tested, and gap.'),
   QUIZ('se13q','Check: run the response',[
     ['Waimea Feed and Supply’s coverage table, ATT&CK v20. T1110.003 Password Spraying: 4625 collected, rule, tested. T1053.005 Scheduled Task: 4698 collected, rule, not yet tested. T1021.001 Remote Desktop Protocol: 4624 collected, rule, tested. T1048 Exfiltration Over Alternative Protocol: firewall logs record drops only; no flow or proxy logs, no rule. An advisory says crews that hit small shops use all four. Which is a blind spot today, one that no rule or hunt can see until a log source is added?',['T1053.005 Scheduled Task','T1048 Exfiltration Over Alternative Protocol','T1021.001 Remote Desktop Protocol','T1110.003 Password Spraying'],1,'Add flow or proxy logs, hunt with them, then write the rule. <a href="#junior/j11">Review: Map the attack: kill chain, ATT&amp;CK, and threat intelligence</a>',{whys:['T1053.005 has a rule, just untested: a smaller gap.','Without flow or proxy logs, an allowed transfer out stays invisible.','T1021.001 is collected, ruled, and tested.','T1110.003 is collected, ruled, and tested.'],imp:'core',c:'det-rules-playbooks'}],
     ['The playbook’s lookup finds no match for a new file in antivirus or threat intelligence. Best automated next step?',['Close it: no match means clean','Delete the file on every PC','Send it to a private sandbox and alert an analyst','Isolate every PC in the store until the file is known'],2,'A new file matches no signature, so unknown means unproven. <a href="#junior/j13">Review: Evidence that holds up: forensics, timelines, and sandboxes</a>',{whys:['An unknown file is unproven, so closing it is a gamble.','Deleting everywhere disrupts work on a guess.','A private sandbox tests it, and an analyst decides.','Isolating every PC stops the store over an unknown.'],imp:'good',c:'det-sandboxes'}],
     ['Management sets a 1-hour RPO for the booking system. Backups run nightly at 01:00. Does the plan meet it?',['Yes, since a backup exists','No: up to a day of bookings could be lost','Yes, if the restore takes under an hour','No: the RTO is too short'],1,'Copies must come at least as often as the RPO; hourly snapshots to protected storage fit. <a href="#junior/j12">Review: Respond to an incident: triage, contain, and recover</a>',{whys:['Having a backup counts only when its timing meets the RPO.','Nightly copies can lose a day: copies must come as often as the RPO.','Restore time is the RTO, a separate target.','The RTO is a separate target from the RPO.'],imp:'core',c:'det-containment'}],
     ['Which line belongs in the report’s timeline?',['The intruder was probably a gang from overseas','Things went badly at first','Around mid-morning on October 14, the booking server slowed down for front-desk staff','2026-10-14T19:04Z: EDR behavior alert on HILO-WS03 (SIEM alert 2026-10-14-0193)'],3,'One event, a full UTC timestamp, and its source. Guesses go elsewhere, marked as guesses.',{whys:['A guess belongs outside the timeline, marked as one.','A feeling lacks a time and a source.','A vague local time lacks a UTC stamp and a source.','It holds one event with a full UTC timestamp and names its source, so a reader can place it and check it.'],imp:'good',c:'det-after-action'}],
     ['Which improvement is written so it gets done?',['Keola times a quarterly booking-database restore; due January 31','Time a restore of the booking database every quarter','Keola reviews the backups by January 31','IT tests the booking restores more often and more carefully, starting soon'],0,'Only the first names a measurable action, an owner, and a date.',{whys:['It names a measurable action, an owner, and a due date.','It leaves out the owner and the due date.','“Reviews” is hard to measure, so its finish stays unclear.','“More often” and “soon” leave the action, owner, and date open.'],imp:'core',c:'det-after-action'}],
     ['At 19:30 UTC the Security log on HILO-WS03 was cleared (1102); forwarded copies kept the earlier events. Which improvement goes in the report?',['A SIEM alert on every 1102','A larger local Security log','Only IT may open Event Viewer','Keep local logs for 90 days'],0,'Any local log falls to one clear by an admin-level intruder. <a href="#sophomore/s10">Review: Read the logs: Windows, Linux, and network devices</a>',{whys:['An alert on 1102 flags the next clear as it happens.','An admin-level intruder clears any local log, large or small.','An intruder with admin rights opens Event Viewer anyway.','Local logs fall to one clear by an admin-level intruder.'],imp:'good',c:'det-rules-playbooks'}],
     ['The clinic case began with a macro in a document from the internet. Which improvement breaks the kill chain earliest?',['Faster restores','A SIEM rule that fires on ransom notes','Block macros from the internet by policy','Longer log retention'],2,'It stops the attack at exploitation, before installation; the others act later. <a href="#junior/j11">Review: Map the attack: kill chain, ATT&amp;CK, and threat intelligence</a>',{whys:['Restores act at the end, after the damage.','A ransom-note rule fires after encryption.','Blocking macros stops the attack at exploitation, the earliest step here.','Retention helps the investigation, later.'],imp:'core',c:'threat-kill-chain'}],
     ['A laptop checks in with 203.0.113.99 every 5 minutes. You block the address, and next week the intruder moves. Which detection keeps working?',['The blocklist entry','A rule on the beacon’s domain name, wherever it points next','Clearing the DNS cache','A rule on small, regular check-ins to any outside address'],3,'Addresses are cheap to change; the beacon’s rhythm comes with the tool. <a href="#junior/j7">Review: Read the wire: captures, flows, and network attacks</a>',{whys:['The intruder simply moves to a new address.','A domain is cheap to replace too.','Clearing the cache leaves the beacon running.','The beacon’s rhythm comes with the tool, so the rule lasts.'],imp:'core',c:'threat-intel'}],
     ['Kai would block the beacon 203.0.113.99 and close the case. Keola would first search flow and DNS logs for every host that contacted it. Your judgment?',['Keola: the address leads to other infected hosts','Kai: the block cuts every PC off from the intruder','Kai, once antivirus clears the first laptop','Equal: either one finds every infected host'],0,'Pivot from infrastructure to victim: every host that called the beacon joins the case. <a href="#junior/j11">Review: Map the attack: kill chain, ATT&amp;CK, and threat intelligence</a>',{whys:['Following the address finds every host that called it.','A block cuts off one address while other infected hosts stay unknown.','One laptop’s scan covers one laptop.','Kai’s block stops one address; Keola’s pivot finds the other hosts.'],imp:'good',c:'threat-intel'}]
   ]),
   QUIZ('se13q2','Interleaved review: Senior',[
     ['pf.conf reads: <code>pass in on $ext_if proto tcp to port 80 keep state</code>, then <code>block in all</code>. What happens to a new inbound web connection?',['It passes: the first match wins','It is blocked: the last match wins','It passes because of keep state','pf refuses to load the file'],1,'Mark the pass rule quick, or put block in all first. <a href="#senior/se1">Review: FreeBSD</a>',{whys:['pf applies the last matching rule unless one is marked quick.','The last match, block in all, wins.','keep state tracks connections a rule already allowed.','The file loads fine; the rule order is the issue.'],imp:'good',c:'bsd-freebsd'}],
     ['On KONA-DC01, one account signed in on KAILUA-WS07 requests service tickets (4769) for 25 service accounts in one minute, each with encryption type 0x17 (RC4). Which change keeps the requested tickets from being cracked?',['Sync the domain clocks','Lower the domain lockout threshold to 3 failures','Ignore it: tickets are normal','Use a gMSA or a long random service password'],3,'Kerberoasting cracks a short service password offline, beyond the reach of lockout. <a href="#senior/se7">Review: Windows: credentials and the domain attack surface</a>',{whys:['Clock sync matters for Kerberos sign-in, apart from cracking.','Lockout guards online guessing; this cracking happens offline.','Many RC4 tickets for one requester mark Kerberoasting.','A gMSA or long random password defeats offline cracking.'],imp:'good',c:'win-credential-theft'}],
     ['Before switching application control to block mode on the front-desk PCs, what comes first?',['Run audit mode and review the would-be blocks','Turn off Defender so the two tools never conflict','Block everything and wait for complaints','Remove the staff accounts'],0,'Audit mode only logs, so needed apps get rules before anything breaks. <a href="#senior/se8">Review: Windows: allow only what you trust</a>',{whys:['Audit mode logs would-be blocks, so needed apps get rules first.','Defender and application control work side by side.','Blocking first breaks needed apps.','Removing staff accounts stops the business.'],imp:'core',c:'win-app-control'}],
     ['Two setups for one web service. A: User=root inside a chroot that holds only the binary and its libraries. B: no chroot, User=makai, with ProtectSystem=strict and NoNewPrivileges=yes. A teammate calls A safer. Your judgment?',['Agreed: with only the binary and its libraries inside, a taken-over process finds nothing to use','B: its own account and a read-only system limit a takeover, and root can leave a chroot','Equal: each setup adds one wall','A, once the chroot sits on its own partition'],1,'A chroot changes only which folder looks like /, so root inside it can break out. <a href="#senior/se9">Review: Linux: confine services and prove it</a>',{whys:['Root inside a chroot can break out.','An unprivileged account and a read-only system still hold after a takeover.','A chroot changes only which folder looks like /.','A partition leaves root’s escape route open.'],imp:'good',c:'lin-confinement'}],
     ['Changing the number in /invoice?id=1043 shows another customer’s invoice. Which fix holds?',['Server-side check that the user owns invoice 1043','Hide the number in the page','Encode the output','Add a WAF rule that blocks any request naming invoice'],0,'Broken access control is fixed on the server, on every request. <a href="#senior/se2">Review: Web application security</a>',{whys:['The server checks ownership on every request.','Hidden numbers stay guessable.','Output encoding fights script injection, a different flaw.','A WAF rule blocks a word while the access check stays missing.'],imp:'core',c:'web-access-control'}],
     ['A commit added an API key; the next commit deleted the line. Enough?',['Yes: the line is gone','Yes, if the repository is private','No: delete the whole repository','No: revoke the key and issue a new one'],3,'Keep the new key in a secret store, and scan commits before merging. <a href="#senior/se10">Review: Design for the cloud: code, functions, and APIs</a>',{whys:['Git keeps every commit, so clones still hold the key.','Private repositories still get cloned, and clones keep the key.','Deleting the repository leaves the key valid in every clone.','Revoking ends the key’s power everywhere.'],imp:'core',c:'cloud-logs'}],
     ['SSH to SwB works from a PC in the Students VLAN. Which change limits who may open a session?',['<code>transport input telnet</code>','An <code>access-class</code> ACL under the VTY lines','A login banner','<code>ip ssh version 2</code> on SwB'],1,'<code>access-class</code> filters who may open a session to the device itself. <a href="#senior/se6">Review: Cisco: audit and extend the two-site network</a>',{whys:['Telnet sends passwords in clear text.','<code>access-class</code> filters who may open a session to the device.','A banner only warns.','SSH version 2 hardens the protocol, and anyone can still reach the lines.'],imp:'good',c:'cisco-device-hardening'}],
     ['A sign-in attempt hits a decoy file server known only to IT. Why treat it as high confidence?',['The decoy logs more fields than real servers do','It came from outside','No legitimate user has a reason to touch it','Decoys block the attack'],2,'A decoy has no business use, so any touch is suspicious and false positives stay rare. <a href="#senior/se11">Review: Design the defended network: zero trust, deception, and visibility</a>',{whys:['The fields logged matter less: any touch is suspicious.','Inside addresses can touch a decoy too.','A decoy has no business use, so any touch is suspicious.','Decoys detect and leave the blocking to other tools.'],imp:'good',c:'det-deception'}],
     ['Hilo Lehua Clinic buys cyber insurance to cover ransomware costs. Which risk treatment is that?',['Reduce','Avoid','Accept','Transfer'],3,'Insurance moves the cost to someone else; the risk can still happen, so the controls stay. <a href="#senior/se12">Review: Governance, risk, and compliance</a>',{whys:['Reduce adds controls to lower the risk.','Avoid drops the risky activity entirely.','Accept takes the risk as it is.','Insurance moves the cost to someone else: transfer.'],imp:'good',c:'gov-risk'}],
     ['A checklist line must hold up under review. Which source backs it best?',['A forum answer with hundreds of upvotes on that setting','A video tutorial','Vendor docs or a CIS Benchmark for that exact release','A teammate’s memory'],2,'A reviewer can check a published source for that exact version; memory and forum posts drift. <a href="#senior/se3">Review: Create: your own checklist</a>',{whys:['Upvotes measure popularity, apart from version-exact accuracy.','Videos drift from the exact release.','Vendor docs or a CIS Benchmark for that release can be checked.','Memory drifts, and a reviewer has only your word.'],imp:'good',c:'host-baselines'}],
     ['Block Public Access is off, and a bucket policy allows <code>s3:GetObject</code> with <code>"Principal": "*"</code>. Who can download its files?',['Only the account owner','Signed-in staff','Anyone on the internet','Nobody until it is published'],2,'<code>"Principal": "*"</code> means anyone, signed in or not, and GetObject lets them download. <a href="#junior/j10">Review: Cloud security: identity, storage, and logs</a>',{whys:['Principal * means everyone, beyond the account owner.','Principal * includes people who never signed in.','Principal * with GetObject lets anyone on the internet download.','The policy is live now; publishing is already done.'],imp:'core',c:'cloud-iam-storage'}],
     ['Kekoa hands the HILO-WS03 disk to Pua for analysis. What goes on the custody form?',['Who handed it over, who took it, when, why, and its seal and hash','Kekoa’s guess about the intruder','Only the disk’s brand and size','A note that both work on the same team'],0,'Recording every hand that held the item lets the evidence hold up later. <a href="#junior/j13">Review: Evidence that holds up: forensics, timelines, and sandboxes</a>',{whys:['Every hand, time, reason, seal, and hash keep the chain whole.','A guess belongs in the analysis, apart from custody.','Brand and size leave out who held the disk.','Team membership leaves out the handoff record.'],imp:'core',c:'det-forensics'}],
     ['Sysmon event 10 shows an unknown program opening lsass.exe. What does it mark?',['A routine Windows update step','A failed sign-in','A printer job','A possible credential read'],3,'Credential dumpers read LSASS memory, so an unknown process doing it is high priority. <a href="#junior/j8">Review: Windows: logons, tokens, and the event trail</a>',{whys:['Updates touch files, apart from LSASS memory.','A failed sign-in is a 4625.','A printer job prints; reading LSASS is a credential thief’s move.','Credential dumpers read LSASS memory.'],imp:'core',c:'win-credential-theft'}]
   ]),
   LINKS('Go further',['nist-61r3','mitre-attack','sigma-rules','cisa-ttx'])
   ]},
 {id:'se4',title:'Create: roles, timing, and the runbook',bloom:'Create',sum:'Turn a small team and a fixed time window into a system: who does what, when, and how you hand off.',
  can:'turn a small team and a fixed window into a system: who does what, when, and how you hand off',
  blocks:[
   C('A team is a design, built on purpose','Create',
     TIPS('<b>Assign machines to people:</b> usually one or two per machine, plus one owner for the network devices. Everyone should be able to cover a second machine.',
          '<b>One scribe per machine</b> keeps <a href="#sophomore/s6">the change log</a>, and the runbook names each machine’s scribe.',
          '<b>A timekeeper</b> calls the clock: halfway, a quarter left, and fifteen minutes left (freeze changes; verify every required service and user still works).',
          '<b>Plan the session, roughly:</b> the brief, investigation questions, baseline, and accounts in the first fifteen to twenty minutes; the bulk on high-value areas; verification and low-impact items last.',
          '<b>Debrief every run.</b> What did we miss, what broke, and what goes on the checklist. The debrief is the real practice.')),
   DETAIL('The same structure at work',
     P('The same structure runs real maintenance windows and incident response: a lead, a scribe, a clock, and a written plan (NIST CSF 2.0 calls that last part Respond). <a href="#senior/se13">Run the response</a> showed how to build that plan for a real incident.')),
   PLANNER('se4pl'),
   TIMER('se4tm'),
   REFLECT('se4r','Write your team’s one-page runbook','In your own words: the order of operations for the first twenty minutes, who owns each machine and the network devices, who keeps the log, and the three checks the timekeeper calls out. Keep it to one page. Print it. Rehearse it.',['The first twenty minutes are listed in order, with the investigation questions before any change.','Every machine and the network devices have one named owner, and the log has one named keeper.','The three checks the timekeeper calls out are written with their times.','It fits on one page and has been read aloud once.']),
   LINKS('Go further',['nist-csf','cis-controls','t4t-range'])
  ]},
 {id:'se14',title:'Your path: roles, certifications, and practice',bloom:'Create',sum:'Map security work roles, see which certifications fit which stage, pick safe places to practice, and write a two-year plan of your own.',
  can:'map security work roles, choose certifications in order, pick safe places to practice, and write a two-year plan of your own',
  blocks:[
   C('Build your own path','Create',
     P('<b>Blue, red, and purple.</b> This site teaches blue-team work (<a href="#freshman/f13">Watch, detect, and respond</a>). Red teams are adults hired under written rules of engagement (<a href="#freshman/f1">How hands-on defense practice works</a>) to imitate attackers.'),
     P('<b>Purple work</b> joins the two. Take a detection you wrote, ask what activity should trigger it, have an authorized tester run it in a lab, and tune the rule until it fires.')),
   HIER('Where defenders work',{name:'NICE Framework work role categories',note:'The US government’s map of cybersecurity jobs',tone:'l4',children:[
     {name:'Oversight and Governance',note:'Security Control Assessment; Privacy Compliance · <a href="#junior/j5">Evaluate a configuration</a>, <a href="#senior/se12">Governance, risk, and compliance</a>',tone:'l3'},
     {name:'Design and Development',note:'Cybersecurity Architecture; Secure Software Development · <a href="#senior/se10">Design for the cloud</a>, <a href="#senior/se11">Design the defended network</a>',tone:'l3'},
     {name:'Implementation and Operation',note:'Systems Administration; Network Operations · <a href="#sophomore/s2">Windows 11 hardening</a>, <a href="#sophomore/s3">Debian-family hardening</a>, <a href="#senior/se6">Cisco: audit and extend</a>',tone:'l2'},
     {name:'Protection and Defense',note:'Defensive Cybersecurity; Incident Response; Threat Analysis · <a href="#sophomore/s10">Read the logs</a>, <a href="#junior/j11">Map the attack</a>, <a href="#junior/j12">Respond to an incident</a>, <a href="#senior/se13">Run the response</a>',tone:'l2'},
     {name:'Investigation',note:'Digital Evidence Analysis; Cybercrime Investigation · <a href="#junior/j13">Evidence that holds up</a>',tone:'l1'}]},
    {bloom:'Create',
     note:'These are five of the seven 2024 NICE Framework categories; intelligence and effects belong to other training paths. Role names change between versions; check the live list before one goes on a résumé.',
     caption:'Pick one of the five categories first, then read its roles’ tasks on the NICE site to choose skills and certifications.'}),
   STACK('The certification ladder',[
     {name:'Defensive ladder',numbered:true,layers:[
       ['Experience required','ISC2 CISSP, ISACA CISM (security management), and ISACA CISA (IT audit): each asks for about five years of paid work. ISACA’s CISA differs from CISA, the US agency.',1,'l4'],
       ['Specialist','GIAC GSEC and other GIAC exams (usually employer-funded) and CompTIA CySA+ for analysts.',1,'l3'],
       ['Core','CompTIA Security+, Network+, and Linux+, and Cisco CCNA: the common first-job set.',1,'l2'],
       ['Entry','CompTIA Tech+ and A+, ISC2 Certified in Cybersecurity (CC), and Cisco CCST Networking and CCST Cybersecurity.',1,'l1']]},
     {name:'Offense branch',layers:[
       ['Authorization and adult accounts required','EC-Council CEH, GIAC GPEN and GWAPT, and OffSec OSCP, for testers under contract. CREST accredits testing firms and certifies their staff. It starts from Core.',3,'amber']]}
   ],{bloom:'Create',
     alt:['<b>Defensive ladder</b>, from rung 1 at the bottom to rung 4 at the top:','1 Entry: CompTIA Tech+ and A+, ISC2 Certified in Cybersecurity (CC), and Cisco CCST Networking and CCST Cybersecurity','2 Core: CompTIA Security+, Network+, and Linux+, and Cisco CCNA: the common first-job set','3 Specialist: GIAC GSEC and other GIAC exams (usually employer-funded) and CompTIA CySA+ for analysts','4 Experience required: ISC2 CISSP, ISACA CISM (security management), and ISACA CISA (IT audit), each asking for about five years of paid work; ISACA’s CISA differs from CISA, the US agency','<b>Offense branch</b>, beside rungs 2 to 4, with authorization and adult accounts required: EC-Council CEH, GIAC GPEN and GWAPT, and OffSec OSCP, for testers under contract. CREST accredits testing firms and certifies their staff. It starts from Core'],
     intro:'Start at rung 1 and climb; each rung assumes the one below. Entry fits high school.',
     note:'Vendors set minimum ages, parental-consent rules, and prices, and these change; check them with an adult before booking, and ask your school about free vouchers.'}),
   C('Choose certifications in order','Evaluate',
     TIPS('<b>Match the strand you finished.</b> A+ builds on <a href="#freshman/f4">Computers, virtualization, and the network</a>; Network+ and CCNA on the Cisco strand through <a href="#junior/j4">Cisco: VLANs, routing, and ACLs</a>.',
          'Linux+ builds on <a href="#sophomore/s3">Debian-family hardening</a> through <a href="#senior/se9">Linux: confine services and prove it</a>; Security+ on <a href="#freshman/f3">Security principles</a> through <a href="#senior/se12">Governance, risk, and compliance</a>.',
          '<b>One at a time.</b> Each exam takes weeks of study. Pick the one that unlocks your next step (a job or college program) before one that only looks impressive.')),
   DETAIL('Vendors, upkeep, experience gates, and testers',
     TIPS('<b>Vendor-neutral or vendor.</b> Vendor-neutral exams (CompTIA, ISC2) travel across employers; vendor exams (Cisco) prove one product line.',
          '<b>Count the upkeep.</b> Most certifications expire after about three years unless you earn continuing-education credits, and the top bands charge yearly fees.',
          '<b>Experience gates are real.</b> Pass CISSP early and you become an Associate of ISC2 until the work years arrive; plan for the job first.',
          '<b>Hiring a tester?</b> A buyer checks the firm’s accreditation (CREST is one), the written scope, and its insurance before anyone signs.')),
   COMPARE('Practice platforms',[
     {name:'This site',tag:'start here',tone:'ok',rows:[['What you practice','Lockdown Range and Lockdown Drills: harden, investigate, and verify'],['Cost','Free; runs in your browser'],['Age terms','Runs without an account'],['Fits','Every grade']]},
     {name:'picoCTF',tag:'Carnegie Mellon',tone:'l1',rows:[['What you practice','Beginner puzzles in forensics, crypto, and logs'],['Cost','Free'],['Age terms','Student accounts; check them with an adult'],['Fits','Freshman and up']]},
     {name:'Guided courses',tag:'TryHackMe, pwn.college',tone:'l2',rows:[['What you practice','TryHackMe’s SOC and fundamentals paths; pwn.college’s Linux and basics modules'],['Cost','Free tiers; some paths paid'],['Age terms','Minimum ages and consent rules differ; read them first'],['Fits','Sophomore to Senior']]},
     {name:'Offense-centered',tag:'Hack The Box, VulnHub',tone:'amber',rows:[['What you practice','Hack The Box Sherlocks and SOC modules; mostly attack practice'],['Cost','Hack The Box: free tier and paid plans; VulnHub: free'],['Age terms','Adult accounts or a supervised club'],['Fits','After Senior; VulnHub images only on an isolated network you own']]}
   ],{bloom:'Evaluate',
     note:'Practice only on targets the platform provides: its rules are your authorization. A target outside the platform is someone else’s system, whatever a forum says.'}),
   REFLECT('se14r2','Predict one change','Pick one defense you learned here and write how it will have changed by the time you graduate: the attack it faces, the tool that replaces it, or the job that owns it. Name the trend you base the prediction on, and one sign that would tell you the prediction was wrong.'),
   REFLECT('se14r','Your two-year plan','Plan the next two years:<br>1. The NICE category you aim at, and one role in it.<br>2. Two certifications, in order, and why that order.<br>3. One practice platform per term, and the defensive path you will follow there.<br>4. One purple exercise for a detection you wrote: what should trigger it, who runs the test, and how you will know it worked.<br>5. The adult who will check the plan with you.'),
   LINKS('Go further',['nice','t4t-range','t4t-drills','pico','comptia-certs','isc2-cc','netacad'])
   ]},
 {id:'se5',title:'Power and responsibility',bloom:'Evaluate',sum:'You can now break and defend real systems. The whole point of the training is choosing how to use it.',
  can:'draw the line you hold, explain why permission rather than ability decides, and choose how to use what you can now do',
  blocks:[
   C('The line you hold','Evaluate',
     P('Everything in this ladder gives you real capability: hardening skills can disable a real system, and investigation skills can expose a real person. Labs are systems built to be changed. Outside them, <b>authorization is the entire difference between a security professional and a criminal</b>, and the law judges actions as well as intent.'),
     TIPS('<b>Can and should are separate questions.</b> Permission comes only from the system’s owner, or someone with authority over it.',
          'Get explicit, written authorization before touching any system someone else owns. "I was only curious" fails as a defense.',
          'Handle other people’s data as carefully as your own: minimize, protect, and contain it. Investigation answers go in the report and only there.',
          'Report weaknesses privately, to the owner alone, and leave them unexploited.',
          '<b>The stricter rule wins.</b> If your school or employer bans something a course or club allows, follow the ban.',
          '<b>Academic integrity is the same muscle.</b> Do your own work on graded labs and quizzes, cite your sources, and ask when the rules are unclear.',
          'The reputation you build now follows you into every clearance, job, and team. Guard it.')),
    VENN('Can and may: professional work lives in the overlap',[
     {name:'Capability',tone:'amber',items:['testing a site because a recruiter asked','confirming a flaw “just once”','any system or method outside the written scope']},
     {name:'Authorization',tone:'l3',items:['authorized tasks you have yet to learn (practice them in a lab first, or ask for help)']}
   ],{overlaps:[{sets:'AB',name:'Capability and authorization',items:['hardening the machines you are assigned','testing listed systems with listed methods inside the agreed time window','practicing on systems you own or on lab apps you run locally']}],
     bloom:'Evaluate',
     note:'<b>Scope is part of the permission.</b> It names which systems, which methods, and which time window. A step outside any one of them lands in the capability-only region, with or without a contract.',
     key:[['amber','Capability: what your skills make possible'],['l3','Authorization: what the owner has allowed, in writing']]}),
   QUIZ('se5cy1','Check yourself',[
     ['A recruiter asks you to "test" a company’s site before an interview to prove your skills. The offer comes without a contract or scope. You',['Do it to impress them','Decline without written authorization and scope','Do a little and stop','Ask a friend to do it'],1,'A professional insists on written permission and a defined scope before any test.',{whys:['Only the owner’s written permission authorizes a test.','Testing without the owner’s written authorization and scope is unauthorized access, however the offer is framed, so authorization comes first.','A little testing is still unauthorized.','A friend doing it is still unauthorized.'],imp:'core',c:'eth-cyber-ethics'}]
   ]),
   SPOT('se5sp','In scope or out?','Rules of engagement: systems 10.20.0.0/24 only; methods: configuration review and authenticated vulnerability scans; window: Saturday 08:00 to 12:00. Tap every proposed action outside that scope, then Check.',[
     ['Scan 10.20.0.15 with credentials at 09:00 Saturday',null,'An authenticated scan is a listed method, 10.20.0.15 sits inside 10.20.0.0/24, and 09:00 falls inside the window.'],
     ['Review the firewall configuration on 10.20.0.1 at 10:30 Saturday',null,'10.20.0.1 sits inside 10.20.0.0/24 even though it is the firewall, and configuration review is a listed method at 10:30, inside the window.'],
     ['Scan 10.20.1.7, a printer on the next subnet, at 09:30 Saturday','10.20.1.7 sits outside 10.20.0.0/24. Ask the owner to add it first.'],
     ['Try the default password on a web login at 10.20.0.40 at 10:00 Saturday','Password guessing is a method the agreement leaves out, even on a listed system.'],
     ['Finish a scan of 10.20.0.22 at 12:30 Saturday','The window closed at 12:00. Stop at the deadline and schedule the rest.'],
     ['Phone the help desk as a manager to test its procedures','Social engineering sits outside the listed methods.'],
     ['Read the configuration of 10.20.0.30 at 11:00 Saturday',null,'Reading a configuration is configuration review, on a listed system, at 11:00, an hour before the window closes.'],
     ['Copy a customer list from 10.20.0.40 to prove access','Copying data goes beyond configuration review, and it exposes PII. Report the access instead.']
   ]),
   SEQ('You found a flaw: what now',[
     ['Stop','Close the page or tool at the first sign, and keep no copies of anything you saw.'],
     ['Tell a trusted adult','A teacher, the IT staff, or a parent helps you report it safely.'],
     ['Find the owner’s channel','A security contact page, or the security.txt file at /.well-known/security.txt on the site.'],
     ['Report privately','What you saw, where, and when, with minimal detail and no data attached.'],
     ['Wait','Give the owner time to fix it; coordinated disclosure often allows weeks or months.'],
     ['Follow up','Ask politely through the same channel. Details go public only with the owner’s agreement.']
   ],{bloom:'Evaluate',intro:'Found a flaw by accident? Your next hour decides whether you helped or trespassed.',
     note:'Bug-bounty programs set minimum ages; check the terms with an adult before you join one. A program’s written rules are its authorization, and probing outside them is unauthorized access.'}),
   QUIZ('se5q','Check: judgment under temptation',[
     ['You notice your school’s grade portal has an obvious access-control flaw. The right move is',['Fix it yourself','Report it to the IT staff and leave the system untouched','Show your friends','Use it once, just to confirm'],1,'Accessing a system beyond your authorization is unauthorized access, regardless of motive.',{whys:['Fixing it yourself is unauthorized access.','The school owns the portal, so the owner fixes it, and your report gets it fixed while you stay within the law.','Showing friends spreads the flaw.','Using it once is unauthorized access.'],imp:'core',c:'eth-disclosure'}],
     ['An investigation question in a lab reveals a real-looking Social Security number. You',['Post it as a funny find','Answer only what the question asks and keep the data in the answer','Save it for later','Message it to a teammate'],1,'Treat even scenario data as real PII. Minimize it, contain it, and keep it within the answer.',{whys:['Posting it spreads PII.','The question needs only its answer, so the data stays inside it, which keeps PII contained even in practice.','Saving a copy spreads PII.','Messaging it spreads PII.'],imp:'core',c:'eth-online-safety'}],
     ['Your team wrote a script that automates twenty hardening fixes. Before running it on a machine you are authorized to harden, you',['Run it right away; it worked last time','Read and understand every line, test it on a snapshot or copy first, and confirm every change is within your authorization and the brief','Download a bigger script from a forum and run that instead','Run it on every machine on the school network to save time'],1,'Understand each line, test where mistakes are cheap, stay within scope, and log what it changed.',{whys:['Each machine differs, so test again first.','A script makes many changes at once, so reading it, testing it on a copy, and checking scope catch mistakes where they are cheap.','An unknown script can do anything.','Other machines sit outside your authorization.'],imp:'core',c:'comp-scripting'}],
     ['Your course says lab write-ups must be your own work. A friend offers last year’s graded write-up.',['Copy it and change a few words','Decline; do the lab yourself and cite any sources you used','Copy it if you understand it','Submit it as a group'],1,'If you are unsure what is allowed, ask the instructor first.',{whys:['Changing a few words is still copying.','Your own work, with sources cited, is what the course asks for and what shows what you learned.','Understanding it leaves it someone else’s work.','A group label leaves it someone else’s work.'],imp:'good',c:'eth-cyber-ethics'}],
     ['Ordering from Kona Hillside Roasters, you mistype the number in your order page’s address and see another customer’s order. What now?',['Try a few more numbers to be sure it is real','Post a warning online so customers know','Stop, keep no copies, and report privately with an adult’s help','Email the shop a list of the orders you could see'],2,'Report through the shop’s security contact or security.txt, with minimal detail; more checking would be unauthorized access.',{whys:['More tries is unauthorized access.','A public post exposes customers.','You saw another customer’s data by accident, so stopping there and reporting privately keeps it to one look and lets the shop fix the flaw.','A list of orders spreads the data.'],imp:'core',c:'eth-disclosure'}]
   ]),
   REFLECT('se5r','Your own code','Write the three rules you will hold yourself to as your skills grow. Make them yours, in your words. These matter more than any command on this page.'),
   LINKS('Go further',['eff','cisa','nist-csf','nice','ncl'])
  ]}
 ]
});

<script>
'use strict';
/* ---- glossary (the Glossary rail page) ----
   Kept alphabetical. Each entry links to the unit where the ladder first teaches the term;
   'at' is a #grade/unit anchor. def may hold <b> and <code>. */
LADDER.addGlossary([
  {term:'3-2-1 rule',def:'Three copies of your data, on two kinds of storage, with one copy off site.',at:'freshman/f4'},
  {term:'802.1Q tag',def:'A 4-byte field in a frame on a trunk whose 12-bit VLAN ID names the frame’s VLAN.',at:'freshman/f7'},
  {term:'802.1X',def:'Port-based network access control: a device proves itself through EAP before the switch port or SSID lets it on.',at:'junior/j6'},
  {term:'AAA',def:'Authentication, authorization, and accounting: proving who you are, deciding what you may do, and recording what you did.',at:'freshman/f3'},
  {term:'ABAC (attribute-based access control)',def:'Rules decide access from attributes of the user, the resource, and the request, such as network, time, or tag.',at:'junior/j10'},
  {term:'Absolute path',def:'A path that starts at / and works from any folder, such as /etc/ssh. A relative path starts from the folder you are in.',at:'freshman/f6'},
  {term:'Access log',def:'A web server’s record of every request, one line each: client, time, request, status, size, referrer, and agent.',at:'junior/j9'},
  {term:'Access port',def:'A switch port in one VLAN that passes untagged frames to one end device.',at:'freshman/f7'},
  {term:'Access token',def:'What Windows builds at sign-in: the user’s SID, group SIDs, privileges, and integrity level. Each process carries a copy.',at:'junior/j8'},
  {term:'access-class',def:'The line command that filters which source addresses may open a session to the device itself.',at:'junior/j4'},
  {term:'ACL (access control list)',def:'A list of allow and deny entries that decides who can do what to a file, folder, share, or registry key; on a router, the permit and deny lines that filter packets.',at:'freshman/f5'},
  {term:'ACL (network)',def:'On a router, switch, or cloud subnet: an ordered list of permit and deny lines for packets, read top down; the first match wins, and an implicit deny ends the list.',at:'junior/j4'},
  {term:'Active Directory (AD)',def:'The Windows Server directory that stores a domain’s users, groups, and computers in one place.',at:'sophomore/s2'},
  {term:'Active reconnaissance',def:'Probing a target’s systems directly, such as port scans or guessed paths, which shows up in its logs.',at:'junior/j11'},
  {term:'adm group',def:'The Debian-family group that reads system logs under /var/log, without root power.',at:'sophomore/s3'},
  {term:'Administrative distance (AD)',def:'A trust rank that picks between route sources for the same prefix: connected 0, static 1, and OSPF 110.',at:'junior/j4'},
  {term:'Advanced audit policy',def:'About 60 audit subcategories under Advanced Audit Policy Configuration, finer than the nine basic categories.',at:'junior/j2'},
  {term:'After-action report',def:'The written review after an incident or drill: summary, timeline, scope, root cause, response, and improvements with owners and dates.',at:'senior/se13'},
  {term:'AIDE',def:'A Linux file integrity checker that compares every watched file with a database of hashes built on a clean day.',at:'junior/j3'},
  {term:'Air gap',def:'A system without any network link, so data moves only by hand.',at:'freshman/f4'},
  {term:'Alert',def:'A notice raised when a rule decides that some events need a person’s look.',at:'sophomore/s10'},
  {term:'Alert fatigue',def:'Worn-down attention after too many false positives, when analysts start skimming or ignoring alerts.',at:'senior/se13'},
  {term:'Alias (PowerShell)',def:'A short name for a cmdlet, such as del for Remove-Item or sc for Set-Content in Windows PowerShell 5.1; Get-Alias shows what each one runs.',at:'freshman/f5'},
  {term:'Alternate data stream (ADS)',def:'A hidden second stream of data attached to a file on an NTFS drive; Windows keeps the Mark of the Web in one called Zone.Identifier.',at:'sophomore/s2'},
  {term:'AMSI (Antimalware Scan Interface)',def:'Hands scripts and commands to the antivirus after they are decoded, just before they run.',at:'junior/j2'},
  {term:'Anti-CSRF token',def:'A secret value a site places in its own forms and checks on every change request; other sites cannot read it.',at:'junior/j9'},
  {term:'Anti-malware',def:'The layers that work with the virus scanner, such as download reputation, unwanted-app blocking, real-time scanning, and controlled folder access.',at:'freshman/f13'},
  {term:'Antivirus',def:'Software that checks files and programs against detection signatures and suspicious actions, then blocks, quarantines, or reports them.',at:'freshman/f13'},
  {term:'API (application programming interface)',def:'A set of addresses a program calls to get or change data, usually over HTTP with JSON.',at:'senior/se10'},
  {term:'APIPA',def:'A self-assigned 169.254.x.x address that a Windows host takes when its DHCP request goes unanswered.',at:'freshman/f4'},
  {term:'App Control for Business',def:'Windows’ kernel-enforced application control (formerly WDAC): code runs only when the policy trusts its publisher, path, hash, or installer.',at:'senior/se8'},
  {term:'AppArmor',def:'The mandatory access control on Ubuntu, Mint, and Debian that confines each profiled program to the files it needs, even when it runs as root.',at:'junior/j3'},
  {term:'Application control',def:'Letting only approved programs run, by publisher, path, or hash: App Control for Business and AppLocker.',at:'junior/j8'},
  {term:'AppLocker',def:'The older Windows application control, with rules per user or group; it still works, while new features go to App Control.',at:'senior/se8'},
  {term:'Approval gate',def:'A step in an automated playbook that waits for a person before a disruptive action, such as isolating a server.',at:'senior/se13'},
  {term:'apt',def:'The package manager on Debian, Ubuntu, and Mint that installs, updates, and removes .deb packages.',at:'freshman/f6'},
  {term:'APT (advanced persistent threat)',def:'A skilled, well-funded team, often state-backed, that targets chosen organizations and stays hidden for months.',at:'freshman/f8'},
  {term:'Argument',def:'A value you type after a command or script name, such as brief.txt in ./audit_users.sh brief.txt. A Bash script reads the first one as $1.',at:'sophomore/s11'},
  {term:'ARP',def:'The protocol that finds the MAC address for an IPv4 address on the local network.',at:'freshman/f7'},
  {term:'ARP spoofing',def:'Forged ARP replies that claim another host’s IP address, often the gateway’s, to put the sender on-path.',at:'junior/j7'},
  {term:'AS-REP roasting',def:'Cracking offline the reply a domain controller sends for an account set to skip Kerberos pre-authentication.',at:'senior/se7'},
  {term:'ASLR (address space layout randomization)',def:'An OS guard that loads code and data at shuffled addresses, so an intruder cannot predict where they sit.',at:'senior/se2'},
  {term:'ASR rules (attack surface reduction)',def:'Defender rules that block risky behavior, such as Office starting child processes, in Audit, Block, or Warn mode.',at:'junior/j8'},
  {term:'at job',def:'A command queued to run once at a set time, listed with atq.',at:'junior/j3'},
  {term:'Attack surface',def:'Every account, service, port, and program an attacker could reach on a system.',at:'freshman/f1'},
  {term:'Audit mode',def:'A policy state that logs what a rule would block while blocking nothing, used to tune rules before enforcing them.',at:'senior/se8'},
  {term:'Audit policy',def:'The Windows settings that decide which Success and Failure events go to the Security log.',at:'sophomore/s2'},
  {term:'Audit user ID (auid)',def:'The ID of the person who signed in, which auditd keeps on every process that person starts, even after su or sudo. Services have it unset, and cron jobs carry their owner’s ID.',at:'senior/se9'},
  {term:'auditd',def:'The Linux audit daemon that records the security events its rules ask for.',at:'junior/j3'},
  {term:'Auditor',def:'An independent checker who tests controls against a standard and reports gaps; external auditors work for an outside firm.',at:'senior/se12'},
  {term:'auth.log',def:'The Ubuntu and Mint log file for sign-ins, sudo, and SSH. Debian 12 and later keep the same lines in the systemd journal (<code>journalctl -u ssh</code>).',at:'sophomore/s10'},
  {term:'Authentication-Results',def:'The header your own mail server adds with its SPF, DKIM, and DMARC verdicts.',at:'sophomore/s9'},
  {term:'Authorization',def:'Permission from a system’s owner, ideally in writing, to access or change it; inside a computer, the rights an account holds.',at:'freshman/f1'},
  {term:'authorized_keys',def:'The per-user file of SSH public keys that may sign in without that user’s password.',at:'sophomore/s3'},
  {term:'AutoPlay',def:'The Windows prompt that offers to open a drive or disc when it connects; turning it off removes one easy click for a planted USB stick.',at:'sophomore/s2'},
  {term:'Autostate',def:'The rule that keeps an SVI down until its VLAN exists and a port carrying it is up.',at:'sophomore/s5'},
