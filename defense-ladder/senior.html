/* ---- Move your progress: a progress code carries completed activities between browsers, devices, and saved copies.
   Code: DL1-<entries>-<check>. Entries are the activity ids in sorted order, joined by ".", each written as one
   base-36 digit (how many leading characters it shares with the previous id) and the rest of the id; then
   *score/total for a quiz, +steps (base-36 step numbers) for a lab, and ~ for an activity still in progress.
   <check> is the 32-bit FNV-1a hash of "DL1-<entries>" in base 36, six characters. The code holds activity ids,
   quiz scores, and lab steps only: reflections, checklists, plans, and the scorecard stay in this browser. ---- */
/* My progress redraws its totals when another tab saves (the storage listener calls it while that page is open) */
let progressRedraw=null;
const PCODE_V=1;
const PCODE_ID=/^[a-z][a-z0-9]{0,30}$/;
function pcodeCheck(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return (h%2176782336).toString(36).padStart(6,'0');}
function progressEntries(src){
  const out={};
  Object.keys(src).sort().forEach(id=>{
    const v=src[id];
    if(!PCODE_ID.test(id)||!v||typeof v!=='object') return;
    const ticks=Array.isArray(v.ticks)?[...new Set(v.ticks.filter(n=>Number.isInteger(n)&&n>=0&&n<36))].sort((a,b)=>a-b):[];
    if(!v.done&&!ticks.length) return;
    const e={done:!!v.done};
    if(Number.isInteger(v.score)&&Number.isInteger(v.total)&&v.total>0&&v.score>=0&&v.score<=v.total){e.score=v.score;e.total=v.total;}
    if(ticks.length) e.ticks=ticks;
    out[id]=e;
  });
  return out;
}
function makeProgressCode(){
  let prev='';
  const parts=Object.entries(progressEntries(MEM)).map(([id,e])=>{
    let k=0; while(k<35&&k<prev.length&&prev[k]===id[k]) k++;
    prev=id;
    return k.toString(36)+id.slice(k)+(e.score!=null?'*'+e.score+'/'+e.total:'')+(e.ticks?'+'+e.ticks.map(n=>n.toString(36)).join(''):'')+(e.done?'':'~');
  });
  const body='DL'+PCODE_V+'-'+parts.join('.');
  return {code:body+'-'+pcodeCheck(body),count:parts.length};
}
function readProgressCode(text){
  const s=String(text||'').replace(/\s+/g,'');
  if(!s) return {error:'Paste a progress code first.'};
  const damaged={error:'This code is incomplete or changed. Copy the whole code again, from DL1- to its last character.'};
  /* the code is found inside whatever was pasted (quotes or a "Code:" label from a chat or email are fine);
     text that starts like a code but ends early counts as a damaged code. A code is lower case after DL; a paste
     that changed the case still reads, and the checksum still guards it */
  const m=/DL(\d+)-([a-z0-9.*\/+~]*)-([a-z0-9]{6})(?![a-z0-9])/i.exec(s);
  if(!m) return /DL\d+-/i.test(s)?damaged:{error:'This text reads differently from a progress code. A code starts with DL1- and comes from My progress on Defense Ladder.'};
  if(+m[1]>PCODE_V) return {error:'This code comes from a newer Defense Ladder. Open the newest copy of the page and paste the code there.'};
  if(+m[1]!==PCODE_V) return {error:'This code uses an older format this page reads differently. Make a fresh code on the other browser and paste that one.'};
  m[2]=m[2].toLowerCase();m[3]=m[3].toLowerCase();
  if(pcodeCheck('DL'+m[1]+'-'+m[2])!==m[3]) return damaged;
  const out={}; let prev='';
  for(const part of m[2]?m[2].split('.'):[]){
    const p=/^([0-9a-z])([a-z0-9]*)(?:\*(\d{1,3})\/(\d{1,3}))?(?:\+([0-9a-z]{1,36}))?(~)?$/.exec(part);
    if(!p) return damaged;
    const k=parseInt(p[1],36);
    if(k>prev.length) return damaged;
    const id=prev.slice(0,k)+p[2];
    if(!PCODE_ID.test(id)||out[id]) return damaged;
    prev=id;
    const e={done:!p[6]};
    if(p[3]!=null&&+p[4]>0&&+p[3]<=+p[4]){e.score=+p[3];e.total=+p[4];}
    if(p[5]) e.ticks=[...new Set([...p[5]].map(c=>parseInt(c,36)))].sort((a,b)=>a-b);
    out[id]=e;
  }
  return {entries:out};
}
/* what an import adds: completions, lab steps, and better quiz scores; it never removes or lowers anything */
function planProgressMerge(entries){
  store.load();
  const labSteps={},gradeOf={};
  LEVELS.forEach(l=>l.units.forEach(u=>u.blocks.forEach(b=>{ if(b.id) gradeOf[b.id]=l.grade; if(b.t==='lab') labSteps[b.id]=b.steps.length; })));
  const changes={},added={},improved=[],other=[];let same=0;
  Object.entries(entries).forEach(([id,e])=>{
    const cur=MEM[id]&&typeof MEM[id]==='object'&&!Array.isArray(MEM[id])?MEM[id]:null;
    const next=Object.assign({},cur||{});
    let changed=false;
    if(e.ticks){
      const have=Array.isArray(next.ticks)?next.ticks:[];
      const t=new Set(have.concat(e.ticks.filter(n=>labSteps[id]==null||n<labSteps[id])));
      if(t.size>have.length){next.ticks=[...t].sort((a,b)=>a-b);changed=true;}
    }
    const done=e.done||(labSteps[id]!=null&&Array.isArray(next.ticks)&&next.ticks.length>=labSteps[id]);
    if(done&&!next.done){next.done=true;changed=true;}
    if(e.score!=null&&(!(next.total>0)||e.score/e.total>next.score/next.total)){next.score=e.score;next.total=e.total;changed=true;}
    if(!changed){same++;return;}
    changes[id]=next;
    if(!gradeOf[id]) other.push(id);
    else if(next.done&&!(cur&&cur.done)) added[gradeOf[id]]=(added[gradeOf[id]]||0)+1;
    else improved.push(id);
  });
  return {changes,added,improved,other,same,total:Object.keys(entries).length};
}

function renderMove(onMerged){
  const c=el('div','card mv');
  c.appendChild(el('h3',null,'Move your progress'));
  c.appendChild(el('p','sum','Your progress lives in this browser. A progress code carries it to another browser, another device, or a saved copy of this page: make the code here, then paste it into My progress there. The code lists completed activities, quiz scores, and lab steps only; your reflections, checklists, and notes stay here.'));
  // export
  c.appendChild(el('h4',null,'Take your progress with you'));
  const outRow=el('div','row');
  const make=el('button','btn sm','Show my progress code');
  const copy=el('button','btn sec sm','Copy code');copy.hidden=true;
  const outPill=el('span','pill');outPill.setAttribute('role','status');outPill.hidden=true;
  outRow.append(make,copy,outPill);
  const out=el('textarea','mv-code');out.readOnly=true;out.hidden=true;out.setAttribute('aria-label','Your progress code');out.spellcheck=false;
  make.addEventListener('click',()=>{
    store.load();
    const r=makeProgressCode();
    outPill.hidden=false;
    if(!r.count){out.hidden=true;copy.hidden=true;outPill.textContent='Complete an activity first; the code then carries it.';outPill.className='pill';return;}
    out.value=r.code;out.hidden=false;copy.hidden=false;
    outPill.textContent=`${r.count} activit${r.count===1?'y':'ies'} in this code`;outPill.className='pill ok';
    make.textContent='Refresh my progress code';
  });
  copy.addEventListener('click',()=>copyFromBox(out,outPill));
  c.append(outRow,out);
  // import
  c.appendChild(el('h4',null,'Bring progress here'));
  c.appendChild(el('p','sum','Paste a code from another browser or device. You see what it adds before anything changes, and merging keeps everything already saved here.'));
  const inp=el('textarea','mv-code');inp.placeholder='DL1-...';inp.setAttribute('aria-label','Progress code to bring here');inp.spellcheck=false;
  const inRow=el('div','row');
  const check=el('button','btn sm','Check this code');
  const merge=el('button','btn sm','Merge into this browser');merge.hidden=true;
  inRow.append(check,merge);
  const prev=el('div','mv-prev');prev.setAttribute('role','status');prev.hidden=true;
  /* the preview's plan is only shown; Merge plans again from the parsed entries against what is stored then,
     so a save from another tab between Check and Merge is kept */
  let plan=null,entries=null;
  const say=(html,bad)=>{prev.hidden=false;prev.innerHTML=html;prev.className='mv-prev'+(bad?' note warn':'');};
  inp.addEventListener('input',()=>{plan=null;entries=null;merge.hidden=true;});
  check.addEventListener('click',()=>{
    plan=null;entries=null;merge.hidden=true;
    const r=readProgressCode(inp.value);
    if(r.error){say(esc(r.error),true);return;}
    entries=r.entries;
    plan=planProgressMerge(r.entries);
    const n=Object.keys(plan.changes).length;
    const items=[];
    Object.entries(plan.added).forEach(([g,k])=>items.push(`<li>${g}: ${k} completed activit${k===1?'y':'ies'} to add</li>`));
    if(plan.improved.length) items.push(`<li>${plan.improved.length} lab${plan.improved.length===1?'':'s'} or quiz score${plan.improved.length===1?'':'s'} to bring forward</li>`);
    if(plan.other.length) items.push(`<li>${plan.other.length} activit${plan.other.length===1?'y':'ies'} from another edition of the page, kept for when you open that edition</li>`);
    const head=`This code holds ${plan.total} activit${plan.total===1?'y':'ies'}. `+(plan.same?`${plan.same} already match${plan.same===1?'es':''} this browser. `:'');
    if(!n){say(esc(head)+'Everything in it is already here.');return;}
    say(esc(head)+'Merging adds:<ul>'+items.join('')+'</ul>');
    merge.hidden=false;
  });
  merge.addEventListener('click',()=>{
    if(!entries) return;
    plan=planProgressMerge(entries);
    const n=Object.keys(plan.changes).length;
    store.setMany(plan.changes);
    plan=null;entries=null;merge.hidden=true;inp.value='';
    say(`Merged ${n} activit${n===1?'y':'ies'} into this browser. The totals above include them now.`);
    if(onMerged) onMerged();
    refreshChrome();
  });
  c.append(inp,inRow,prev);
  return c;
}

/* =====================================================================
   NAVIGATION (UX plan, Phase 2, 2026-10-21)
   Phones (below 920 px): a slim sticky bar (the course, the grade, "Unit N of M", and a Menu button) that hides
   while the reader scrolls down and returns on the way up; with reduced motion it stays in place. The Menu is a
   modal dialog: the four grades (two by two, each with its count of units done), the open grade's units as a
   numbered list with each unit's status, and the pages, Theme, and Width. Focus stays inside it, and Escape or
   Close returns focus to the Menu button. Laptops (920 px and up): the rail lists the open grade's units under it.
   A unit's status shows as a glyph and as text: done (every activity complete), in progress (opened, or partly
   complete), or not started. The progress store keeps, under "_nav": the last unit, the last unit of each grade,
   the units opened, and each grade whose intro the student has seen or opened. A visit without an address offers
   "Continue: <unit>" on the landing view, a grade button reopens that grade's last unit, and My progress opens
   each grade at its first unfinished unit.
   ===================================================================== */
const NAV='_nav';
const ST_GLYPH={done:'✓',part:'◐',none:'○'}, ST_TEXT={done:'done',part:'in progress',none:'ready to start'};
const ACT_NAME={quiz:'Quiz',match:'Match',spot:'Spot the problem',order:'Order',flash:'Flashcards',lab:'Lab',reflect:'Reflection',builder:'Builder',planner:'Planner',timer:'Timer'};
const VIS_TYPES=['compare','anatomy','stack','path','seq','hier','venn','scale'];
const navPanel=document.getElementById('navPanel'), menuBtn=document.getElementById('menuBtn'), mbar=document.querySelector('.mbar');

function navState(){ let v=null; try{ v=store.get(NAV); }catch(e){} return v&&typeof v==='object'&&!Array.isArray(v)?v:{}; }
/* a change to "_nav" reads what is stored now, applies the change, and saves it through the merging store */
function navSave(fn){
  if(navHold) return;
  try{
    store.load();
    const s=JSON.parse(JSON.stringify(navState()));
    if(fn(s)===false) return;
    store.set(NAV,s);
  }catch(e){}
}
/* a title's text (entities decoded, markup dropped) for text nodes and attributes; a template never runs or loads anything */
function titleText(h){ const t=document.createElement('template'); t.innerHTML=String(h==null?'':h); return t.content.textContent.replace(/\s+/g,' ').trim(); }
function visitedSet(){ const s=navState(); const v=new Set(Array.isArray(s.v)?s.v:[]); visitedNow.forEach(x=>v.add(x)); return v; }
function gradeUnitIds(id){ const L=levelById(id); if(L) return L.units.map(u=>u.id); const g=GRADE_INDEX.find(x=>x.id===id); return g?g.unitIds:[]; }
function startedRec(id){ const v=store.get(id); return !!v&&typeof v==='object'&&((Array.isArray(v.ticks)&&v.ticks.length>0)||(Array.isArray(v.r)&&v.r.some(Boolean))); }
function blockState(id){ return isDone(id)?'done':startedRec(id)?'part':'none'; }
function unitState(U,seen){
  const ids=U.blocks.filter(b=>b.id).map(b=>b.id);
  const done=ids.filter(isDone).length, opened=!!seen&&seen.has(U.id);
  if(ids.length?done===ids.length:opened) return 'done';
  return done||opened||ids.some(startedRec)?'part':'none';

function nextUnit(L){ const seen=visitedSet(); return L.units.find(U=>unitState(U,seen)!=='done')||null; }
const READY={sophomore:'s0q',junior:'j0q',senior:'se0q'};
/* the lowest item from this grade's readiness check: Core skills first, Explore before Revisit */
function readinessLow(L){
  const qid=READY[L.id];if(!qid)return null;
  let b=null;L.units.forEach(u=>u.blocks.forEach(x=>{if(x.t==='quiz'&&x.id===qid)b=x;}));if(!b)return null;
  const rec=store.get(qid);const r=rec&&Array.isArray(rec.r)?rec.r:null;if(!r||!r.length)return null;
  const cand=[];b.items.forEach((it,i)=>{const res=r[i]&&r[i][2];if(res==null||res===2)return;const m=quizMeta(it);cand.push({it,res,core:m.imp==='core'?0:1,i});});
  if(!cand.length)return null;cand.sort((a,c)=>a.core-c.core||a.res-c.res||a.i-c.i);
  const link=teachLink(cand[0].it);return link?{link,res:RESULT[cand[0].res],core:cand[0].core===0}:null;
}

/* the grade the Menu lists: the open grade, or the grade of the last unit */

/* the rail and the Menu follow the view: counts, unit lists, status, and the bar's "Unit N of M" */
function navMark(){
  if(!navBooted) return;
  if(current.page==='level'&&levelById(current.level)) visitedNow.add(current.unit);
  const seen=visitedSet(), grades=gradeList();
  const lvs=document.querySelectorAll('#ladder .lv');

    if(n.textContent!==t) n.textContent=t;
  });
  /* the open grade's units list once, in #mtoc under the grade grid (the rail on laptops, the Menu on phones) */
  const mg=menuGradeId(), gi=gradeInfo(mg), ML=levelById(mg), lbl=document.getElementById('mtocLbl'), host=document.getElementById('mtocList');
  if(lbl&&gi) lbl.textContent=gi.grade+' units';
  if(host){
    let ol=host.querySelector('ol.toc');
    if(!ML){ const w=gi&&!inPart(gi.id)?gi.grade+' is in the online course, and in its own download.':'Loading '+(gi?gi.grade:'')+'…', p=host.querySelector('.wait');
      if(!p||p.textContent!==w){ host.innerHTML=''; host.appendChild(el('p','wait',esc(w))); } }
    else{ if(!ol||ol.dataset.g!==mg){ host.innerHTML=''; ol=unitList(ML); host.appendChild(ol); } markList(ol,seen); }
  }
  main.querySelectorAll('ol.toc').forEach(ol=>markList(ol,seen));
  markOutline();
  flowMark();
  navWhere();
  navPath();
  if(wideMQ&&wideMQ.matches) requestAnimationFrame(railToCurrent);

function navRefresh(){ navMark(); }
/* laptops: the rail scrolls (on its own) to keep the current unit in sight */
function railToCurrent(){
  const a=railEl&&railEl.querySelector('#mtoc a.tu[aria-current="page"]'); if(!a) return;
  const r=railEl.getBoundingClientRect(), c=a.getBoundingClientRect(), t=railEl.querySelector('.rail-tools'), tb=t?t.offsetHeight:0;

/* the bar's place: on a unit, a button ("Grade · Unit N of M ▾") that opens the Menu at the grade's unit list */
let menuFrom=null;

/* the path beside "Unit N of M": each unit of the grade as a square (done, in progress, or ready), the open one ringed;
   every other square links to its unit (a pointer shortcut: the list stays hidden from screen readers and out of the
   Tab order, since the bar's place, the Menu, and the rail list the same units with their names and status) */
function navPath(){
  const pth=main.querySelector('.uhead .upath'), L=current.page==='level'&&levelById(current.level);
  if(!pth||!L) return;
  const seen=visitedSet(), sts=L.units.map(U=>unitState(U,seen));

/* ---- the phone bar: it hides while the reader scrolls down and returns on the way up ---- */
let barY=-1, barTick=false, barQuietUntil=0;
function phoneNav(){ return !(wideMQ&&wideMQ.matches); }
function showBar(){ if(railEl) railEl.classList.remove('hid'); }
/* the app's own scrolls (a new view, a unit's top, an outline jump) keep the bar in place */
function barQuiet(){ barQuietUntil=(typeof performance!=='undefined'?performance.now():Date.now())+500; barY=-1; showBar(); }
function barScroll(){
  barTick=false;

  const chunks=[];
  bl.forEach((b,i)=>{ if(i&&flowGlue(b)) chunks[chunks.length-1].push(i); else chunks.push([i]); });
  const wt=bl.map(b=>{ let s=0; try{ s=JSON.stringify(b).length; }catch(e){} return Math.max(700,s); });
  const cw=chunks.map(c=>c.reduce((a,i)=>a+wt[i],0)), W=cw.reduce((a,x)=>a+x,0), m=chunks.length;

}

/* ---- Read aloud: each top-level card, where speechSynthesis exists (a local voice when one is installed) ---- */
const flowSpeech=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance==='function'?speechSynthesis:null;
let flowRaBtn=null;
/* a card's name for its Read aloud button: its heading, without the thinking-level badge */
function flowRaTitle(nd){ const h=nd.querySelector(':scope>h3,:scope>h4'); if(!h) return ''; const k=h.cloneNode(true); k.querySelectorAll('.blm,.imp,.sr').forEach(x=>x.remove()); return k.textContent.replace(/\s+/g,' ').trim(); }
function flowRaName(b,stop){ b.textContent=stop?'Stop reading':'Read aloud'; if(b.dataset.t) b.setAttribute('aria-label',(stop?'Stop reading: ':'Read aloud: ')+b.dataset.t); }
function flowRaAdd(nd){
  if(!flowSpeech||!nd.classList||!nd.classList.contains('card')||nd.querySelector(':scope>.ra-row')) return;
  const r=el('div','ra-row'), b=el('button','tbtn ra','Read aloud');b.type='button';
  b.dataset.t=flowRaTitle(nd); flowRaName(b,false);
  b.addEventListener('click',()=>flowRaToggle(nd,b));
  r.appendChild(b);nd.appendChild(r);
}
function flowRaStop(){
  if(!flowSpeech) return;
  const b=flowRaBtn; flowRaBtn=null;
  try{ flowSpeech.cancel(); }catch(e){}
  if(b) flowRaName(b,false);
}
function flowRaVoice(){
  let vs=[]; try{ vs=flowSpeech.getVoices()||[]; }catch(e){}
  const lang=(document.documentElement.lang||'en').slice(0,2).toLowerCase();
  return vs.find(v=>v.localService&&String(v.lang).slice(0,2).toLowerCase()===lang)||vs.find(v=>v.localService)||null;
}
/* what Read aloud says: a copy of the card without its buttons (a drill's own lines, items, and steps stay), badges,
   hidden or screen-reader-only text, and the inside of closed panels. Each list item, option, line, and block is its
   own part, and a part splits into sentences only after ".", "!", or "?" and a space (so 192.168.1.1 stays whole). */
const RA_BLOCK=/^(P|DIV|LI|UL|OL|DL|DT|DD|TR|TD|TH|TABLE|THEAD|TBODY|H[1-6]|PRE|FIGURE|FIGCAPTION|DETAILS|SUMMARY|LABEL|BLOCKQUOTE|SECTION|BUTTON)$/;
function flowRaParts(card){
  const k=card.cloneNode(true);
  k.querySelectorAll('details:not([open])').forEach(d=>[...d.children].forEach(x=>{ if(x.tagName!=='SUMMARY') x.remove(); }));
  k.querySelectorAll('.blm,.imp,.ra-row,[hidden],[aria-hidden="true"],.sr,.sl-tag,.msel,.scroll-cue,svg,input,textarea,select,script,style').forEach(x=>x.remove());
  k.querySelectorAll('button').forEach(x=>{ if(!x.matches('.sl,.mi,.oi')) x.remove(); });
  const parts=[]; let buf='';
  /* a lone item number ("1.") stays with the sentence after it */
  const flush=()=>{ const t=buf.replace(/\s+/g,' ').trim(); buf=''; let lead=''; if(t) t.replace(/([.!?])\s+/g,'$1\u0001').split('\u0001').forEach(s=>{ s=s.trim(); if(!s) return; if(/^\d+[.)]$/.test(s)){ lead+=s+' '; return; } parts.push(lead+s); lead=''; }); if(lead) parts.push(lead.trim()); };
  const walk=n=>{
    if(n.nodeType===3){ buf+=n.nodeValue; return; }
    if(n.nodeType!==1) return;
    if(n.tagName==='BR'){ buf+=' '; return; }
    const blk=RA_BLOCK.test(n.tagName)||n.classList.contains('opt')||n.classList.contains('sl-t')||n.classList.contains('tln');
    if(blk) flush();
    n.childNodes.forEach(walk);
    if(blk) flush();
  };
  walk(k);
  return parts;
}
function flowRaToggle(card,b){
  if(flowRaBtn===b){ flowRaStop(); return; }
  flowRaStop();
  const parts=flowRaParts(card);
  if(!parts.length) return;
  const v=flowRaVoice();
  flowRaBtn=b; flowRaName(b,true);
  parts.forEach((s,i)=>{
    const u=new SpeechSynthesisUtterance(s);
    if(v){ u.voice=v; u.lang=v.lang; }
    u.addEventListener('error',()=>{ if(flowRaBtn===b) flowRaStop(); });
    if(i===parts.length-1) u.addEventListener('end',()=>{ if(flowRaBtn===b){ flowRaBtn=null; flowRaName(b,false); } });
    try{ flowSpeech.speak(u); }catch(e){}
  });
}

/* ---- boot: device preferences, the storage check, the dock before #main, and the new-visit banner ---- */
const SEEN_AT=KEY+'-seen', VISIT_GAP=30*60*1000;
let flowBannerDue=false, flowActed=false, lastInput='none';
/* a heading the app focuses after a tap or on a first load shows no ring; after a key press it shows one */
function quietFocus(n){ if(!n||lastInput==='key') return; n.classList.add('qfocus'); n.addEventListener('blur',()=>n.classList.remove('qfocus'),{once:true}); }
/* a notice in the dock leads a deep link's first view until the student acts (a tap or a key) */
function flowDockLeads(){ return !flowActed&&!!flowDockEl&&flowDockEl.childElementCount>0; }
/* when this browser last showed the course: a new tab counts as a new visit 30 minutes or more after it */
function flowSeen(){ flowLsSet(SEEN_AT,String(Date.now())); }
/* a line's text for a spot drill: in a URL, hyphens stay joined (U+2011) and the line may break after "/" and "." */
const SPOT_PROMPT=/^\s*(?:PS[^>]*>|\$|[A-Za-z]:\\[^>]*>|[A-Za-z][\w.-]*(?:\([\w-]+\))?[#>]|[\w.-]+@[\w.-]+:[^\s$#]*[$#])\s/;
function spotText(t){ return esc(t).replace(/(?:https?:\/\/|www\.)[^\s<]+/g,u=>u.replace(/-/g,'‑').replace(/([\/.])/g,'$1<wbr>')); }
function flowBoot(){
  const de=document.documentElement;
  flowCmp=flowLsGet(CMP_KEY)==='row'?'row':'col'; de.dataset.cmp=flowCmp;
  flowWholeOn=flowLsGet(FLOW_KEY)==='all'; if(flowWholeOn) de.dataset.flow='all';
  flowDockEl=el('div','fdock');flowDockEl.id='flowDock';flowDockEl.setAttribute('role','region');flowDockEl.setAttribute('aria-label','Notices');flowDockEl.hidden=true;
  main.before(flowDockEl);
  store.onHealth=flowHealth;
  if(!flowProbe()) store.ok=false;
  if(store.ok===false) flowNotice();
  /* a new visit (this tab's first page load, 30 minutes or more after this browser last showed the course) with saved
     progress offers Keep my progress or Start fresh; the first view decides (the Continue card offers Start fresh) */
  const fresh=!flowSsGet(SESS_SEEN); flowSsSet(SESS_SEEN,'1');
  const last=+flowLsGet(SEEN_AT)||0;
  flowBannerDue=fresh&&Date.now()-last>=VISIT_GAP&&Object.keys(MEM).some(k=>k!==NAV&&MEM[k]!=null);
  flowSeen();
  addEventListener('pagehide',()=>{ flowRaStop(); flowSeen(); });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flowSeen(); });
  const act=e=>{ flowActed=true; lastInput=e.type==='keydown'?'key':'pointer'; };
  document.addEventListener('keydown',act,true);
  document.addEventListener('pointerdown',act,true);
}

 {id:'se0',title:'Ready for Senior?',bloom:'Review',sum:'Eighteen questions on what Freshman, Sophomore, and Junior taught. Your first check on each one builds your map (Strong, Revisit, or Explore) and a list of where to invest next. Every unit stays open.',

   QUIZ('se0q','Ready for Senior?',[
     ['Which wildcard mask matches the subnet 10.1.20.64/26 in an ACL?',['0.0.0.64','0.0.0.255','0.0.0.63','255.255.255.192'],2,'Subtract each mask octet from 255: 255.255.255.192 becomes 0.0.0.63. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>',{whys:['0.0.0.64 copies the network’s last octet.','0.0.0.255 matches a whole /24.','An ACL wildcard is the subnet mask flipped: 255 minus each octet of 255.255.255.192 gives 0.0.0.63.','That is the subnet mask, which an ACL flips.'],imp:'core',c:'cisco-acls'}],
     ['A capture shows 203.0.113.70 sending SYN packets to 200 different ports on makani-web within 3 seconds. What is it?',['A SYN flood against one service','A port scan looking for open services','Normal web browsing','A rogue DHCP server'],1,'In a scan, SYN-ACK replies mark the open ports, and RSTs mark the closed ones. <a href="#junior/j7">Review: Read the wire: captures, flows, and network attacks</a>',{whys:['A SYN flood hammers one port, often from many sources.','One source touching 200 ports in 3 seconds is looking for open services, which is a port scan.','Browsing uses a few ports, such as 443.','DHCP hands out addresses.'],imp:'core',c:'net-scan-results'}],
     ['Where does an extended ACL that blocks Students’ Telnet to the Site B servers belong, and why?',['Close to the destination, so it filters only what you mean','On every interface in both directions','On the VTY lines, as an access-class','Close to the source, inbound on the Students subinterface, so unwanted traffic stops early'],3,'Extended ACLs go near the source; a standard ACL reads the source alone, so it goes near the destination. <a href="#junior/j4">Review: Cisco: VLANs, routing, and ACLs</a>',{whys:['Close to the destination fits a standard ACL.','Every interface multiplies the work and the mistakes.','access-class limits VTY sign-ins alone.','An extended ACL reads source, destination, and port, so it matches exactly near the source and stops the traffic before it crosses the network.'],imp:'core',c:'cisco-acls'}],
     ['Hilo Lehua Clinic wants alerts on its patient-portal link, and that link must keep carrying business traffic even if the sensor fails. Which sensor fits?',['An IDS fed by a SPAN or TAP copy','An inline IPS set to fail closed','An inline IPS that blocks on every new rule','A host firewall on the portal server alone'],0,'A copy-fed sensor’s false positive drops nothing; inline sensors can block, and can stop the link. <a href="#junior/j6">Review: Network security design: firewalls, zones, VPNs, and Wi-Fi</a>',{whys:['A SPAN or TAP sends the sensor a copy, so a sensor crash leaves the real link carrying traffic.','Fail closed stops the link when the sensor fails.','Blocking on new rules risks dropping business traffic.','A host firewall guards one server, and the alerts belong on the link.'],imp:'core',c:'det-ids-ips'}],
     ['kanoa sits in Domain Admins, and the brief lists kanoa as a standard user. How far does that admin power reach?',['Nowhere until kanoa signs in at the DC','Only the domain controller','Every computer joined to the domain, because Domain Admins sits in each machine’s local Administrators group','Only kanoa’s own PC'],2,'Domain Admins holds full control of the domain, so an extra member is an administrator everywhere. <a href="#junior/j1">Review: Windows Server and Active Directory</a>',{whys:['Domain Admin power applies at once.','Domain Admins reaches every joined machine.','Domain Admins is placed in every joined machine’s local Administrators group, so kanoa is an admin on all of them.','The group reaches far beyond one PC.'],imp:'core',c:'win-active-directory'}],
     ['malia joins the Finance group, and no GPO in the domain uses security filtering. Which GPOs apply to malia’s user account now?',['Every GPO linked to the Finance group','Only the Default Domain Controllers Policy','Only local policy until malia signs out','The same as before: policy follows the account’s OU, while a group grants rights and permissions'],3,'Security filtering is the one way a group narrows a linked GPO. <a href="#junior/j2">Review: Group Policy</a>',{whys:['GPOs link to sites, domains, and OUs.','That policy targets domain controllers.','Joining a group leaves policy as it was.','GPOs link to sites, domains, and OUs, and joining a group leaves the account in its OU, so the same GPOs apply.'],imp:'core',c:'win-group-policy'}],
     ['You run sudo sysctl -w net.ipv4.conf.all.rp_filter=1. What happens after a reboot?',['The value stays, because sysctl -w writes a file','The value resets unless a file in /etc/sysctl.d sets it','The machine stops routing','The kernel refuses the change'],1,'sysctl -w changes the running kernel; a line in /etc/sysctl.d makes the value return at every boot. <a href="#junior/j3">Review: Debian and deeper Linux</a>',{whys:['sysctl -w changes the running kernel alone.','sysctl -w changes only the running kernel, and a file in /etc/sysctl.d sets the value again at every boot.','rp_filter checks source addresses, and routing goes on.','The kernel accepts it at once.'],imp:'core',c:'host-misc-hardening'}],
     ['You delete a cron line that runs <code>/bin/bash -c \'… 203.0.113.9:4444 …\'</code>, a reverse shell. What comes next?',['Hunt for how it got there: other cron locations, systemd units, and shell startup files','Block port 4444 and keep the line','Reboot and move on','Reinstall cron'],0,'Persistence rarely travels alone. <a href="#junior/j3">Review: Debian and deeper Linux</a>',{whys:['Whatever planted the line can plant it again, and persistence often hides in several places, so you hunt them all.','Keeping the line keeps the backdoor.','A reboot leaves other persistence running.','Reinstalling cron leaves the planter in place.'],imp:'core',c:'host-malware-persistence'}],
     ['KAILUA-WS07 logs a 4624 at 03:12 with Logon Type 10 for svc_backup, a service account. What is it?',['A service starting at boot','A scheduled task running on time','A sign-in at the keyboard','A Remote Desktop sign-in by a service account, which needs a closer look'],3,'Read the source address, find the 1149 just before it, and disable the account while you check. <a href="#junior/j8">Review: Windows: logons, tokens, and the event trail</a>',{whys:['Services start with their own logon type.','Scheduled tasks use their own logon type.','Type 2 is a sign-in at the keyboard.','Type 10 is Remote Desktop, and a service account runs its jobs without a desktop session, least of all at 03:12, so it needs a closer look.'],imp:'core',c:'det-windows-events'}],
     ['Three findings: a NOPASSWD sudoers line for an unlisted user, 12 missing patches, and a missing login banner. In what order do you fix them?',['Any order, since all three are findings','The sudoers backdoor, then the patches, then the banner','The patches, then the sudoers line, then the banner','The banner, then the patches, then the sudoers line'],1,'Impact decides the order, and cosmetic items come last. <a href="#junior/j5">Review: Evaluate a configuration</a>',{whys:['Ordering by impact cuts the most risk first.','Impact decides: the root backdoor works today, the patches wait for an exploit, and the banner is cosmetic.','The backdoor gives root now, while patches wait for an exploit.','Cosmetic items come last.'],imp:'core',c:'host-triage'}],
     ['Removing SMB would close a finding, but the brief says staff use the HR share. What is the best call?',['Keep SMB, then harden and restrict it','Leave it fully open, since the brief requires it','Remove SMB, since security comes first','Move the share to a USB drive'],0,'Availability can veto any fix: harden and restrict the required service instead of causing an outage. <a href="#junior/j5">Review: Evaluate a configuration</a>',{whys:['The brief makes SMB required, so it stays, and hardening and restricting it closes the finding without an outage.','Required means kept, and it still gets hardened.','Removing a required service causes an outage.','A USB drive spreads the data and drops its controls.'],imp:'core',c:'host-services'}],
     ['Ransomware runs on HILO-WS03 at Hilo Lehua Clinic. Which first step contains it and keeps the evidence?',['Shut it down at once','Wipe and reinstall it','Isolate it from the network and leave it running','Restore last night’s backup onto it'],2,'Contain first; eradication and recovery follow. <a href="#junior/j12">Review: Respond to an incident: triage, contain, and recover</a>',{whys:['Shutdown erases memory evidence.','Wiping destroys evidence before you learn how it got in.','Isolation cuts its reach to other machines, and leaving it on keeps the memory evidence a shutdown would erase.','Restoring onto an infected machine invites reinfection.'],imp:'core',c:'det-containment'}],
     ['Hōkū Hardware’s access log shows <code>"GET /download?file=../../../../etc/passwd HTTP/1.1" 200 2381</code>. What does the line tell you?',['The check held, since a 200 marks a refused request','Path traversal that likely worked: the server sent back about a text file’s worth of bytes, so escalate','A scan for missing pages, answered with nothing','Nothing, since access logs leave out GET requests'],1,'Each ../ climbs one folder; a 400 or 403 means the check held, and a 404 means nothing was served. <a href="#junior/j9">Review: Web attacks in the logs</a>',{whys:['A 200 means the server sent the file.','A 200 with about 2,400 bytes means the server sent back a file the size of /etc/passwd, so the traversal likely worked.','A missing page returns 404.','Access logs record GET requests.'],imp:'core',c:'web-access-logs'}],
     ['An app nobody in IT approved, “Calendar Pro”, holds consent to the Mail.Read scope for 20 staff mailboxes at Hilo Lehua Clinic. What is this, and what is the fix?',['A normal SAML sign-in, so leave it','MFA fatigue, so require a passkey','An expired token, so staff sign in again','Consent phishing through OAuth: revoke the consent and let only admin-approved apps connect'],3,'OAuth grants an app scopes, such as Mail.Read, to act for you; SAML and OIDC prove identity. <a href="#junior/j10">Review: Cloud security: identity, storage, and logs</a>',{whys:['SAML proves identity, and this app holds mail access.','MFA fatigue floods approval prompts.','An expired token ends a session, and this consent stays.','An unapproved app holding Mail.Read is consent phishing, so revoking the consent cuts its access, and admin approval stops the next one.'],imp:'core',c:'crypto-sso'}],
     ['Event 4698 on KAILUA-WS07 shows a new scheduled task, “PrinterHelper”, that runs a file from the Public folder at every sign-in. Where does it sit on the kill chain, and which ATT&amp;CK tactic does it show?',['Installation; Persistence','Delivery; Initial Access','Reconnaissance; Discovery','Actions on objectives; Impact'],0,'Hunt new tasks, services, and Run keys, then trace what created this one. <a href="#junior/j11">Review: Map the attack: kill chain, ATT&amp;CK, and threat intelligence</a>',{whys:['A task that relaunches code at every sign-in keeps the foothold through restarts: Installation on the kill chain, Persistence in ATT&amp;CK.','Delivery and Initial Access come earlier.','Reconnaissance and Discovery gather information.','Impact disrupts or destroys.'],imp:'core',c:'threat-kill-chain'}],
     ['Kekoa reaches a running file server that may hold injected code. Which pair follows RFC 3227 order, collected first to last?',['The disk image, then memory','Remote logs on the SIEM, then the page file','Memory, then the page file and Temp folder','Last month’s backup, then the disk image'],2,'Most volatile first: memory, then temp files and swap, then disk, then remote logs and backups. <a href="#junior/j13">Review: Evidence that holds up: forensics, timelines, and sandboxes</a>',{whys:['The disk lasts longer than memory.','Remote logs on the SIEM outlast the page file, so the page file comes first.','RFC 3227 collects the most volatile first, and memory vanishes at power-off, while the page file and Temp last a little longer.','Backups last longest of all.'],imp:'core',c:'det-forensics'}],
     ['A Mint lab runs an FTP server that the brief never mentions and an SSH server the brief requires. Which pair of actions fits?',['Remove both: fewer services is safer','Harden both: the brief trusts the machine','Remove FTP, since nothing requires it; keep SSH and harden it with keys, no root login, and a limited group','Keep FTP, since removing software needs permission; turn SSH off until the owner confirms'],2,'A service the brief leaves out and nobody needs is removed; a required service stays and gets hardened. <a href="#sophomore/s4">Review: Services and ports</a>',{whys:['Removing a required service fails an availability check; the brief requires SSH.','FTP sends passwords in the clear and nothing requires it, so hardening it keeps a risk the brief never asked for.','The brief decides: unrequired and insecure by design means remove; required means keep and harden.','The brief already answered: FTP is unrequired and SSH is required, so turning SSH off breaks a requirement.'],imp:'core',c:'host-services'}],
     ['An email to the front desk at Kona Hillside Roasters reads From: payroll@konahillside.example, and its Received headers show it arrived from mail.bulk-sender.example with Authentication-Results: spf=fail dkim=none. What do you conclude, and what comes first?',['The payroll system sent it; open the attachment','The From address is forged: report it through the agreed channel and leave the attachment alone','The mail server is broken; forward the email to IT to test','Nothing can be concluded without the attachment'],1,'Anyone can type a From line; Received headers and authentication results show where it came from. <a href="#sophomore/s9">Review: Check before you trust: messages, links, and files</a>',{whys:['A From line proves nothing; the headers show a different sending server that failed SPF and carried no DKIM signature.','The authentication results show the sending server is not allowed to send for that domain, so the From line is forged; reporting without opening anything is the first move.','A failed SPF check describes the sender, and forwarding spreads the attachment.','The headers already answer the question; the attachment is what the sender wants opened.'],imp:'core',c:'threat-email-checks'}]
   ])
  ]},
 {id:'se1',title:'FreeBSD',bloom:'Evaluate',sum:'A different Unix: where the files live, how services and the firewall work, how to map your Linux habits across, and how to judge the guards on its boot.',
  can:'find your way around FreeBSD, run its services and firewall, map your Linux habits across, and judge the guards on its boot',
  blocks:[
   C('Translate your Linux instincts','Analyze',
     P('FreeBSD is a Unix in its own right, distinct from Linux.'),
    STACK('Base system and packages: two layers, two update paths',[
       {name:'Debian, Ubuntu, and Mint',layers:[['One package collection','Kernel, core tools, and applications alike<br>Patch it all: <code>apt upgrade</code><br>Config: <code>/etc</code>',2,'muted']]},
       {name:'FreeBSD',layers:[
         ['Packages and ports','Third-party software, such as sudo, bash, and nginx<br>Patch: <code>pkg update &amp;&amp; pkg upgrade</code><br>Files: <code>/usr/local</code><br>Config: <code>/usr/local/etc</code>',1,'l2'],
         ['Base system','Kernel and core userland, such as sh, sshd, and pf<br>Patch: <code>freebsd-update</code><br>Config: <code>/etc</code>',1,'l4']]}
     ],{note:'On a <b>pkgbase</b> system, installed from base packages (FreeBSD 15 and later), <code>pkg upgrade -r FreeBSD-base</code> patches the base instead. <b>Ports</b> build third-party software from source; <b>packages</b> arrive prebuilt through <code>pkg</code>.',
       caption:'Patch both layers, each with its own tool, and look for third-party configuration, such as sudoers, under /usr/local/etc.',
       key:[['l4','Base system, maintained by the FreeBSD project'],['l2','Third-party packages and ports'],['muted','One collection for everything (Debian family)']],
       alt:['Debian, Ubuntu, and Mint: one package collection holds the kernel, the core tools, and the applications. apt update then apt upgrade patches all of it, and configuration lives in /etc.',
            'FreeBSD, top layer: packages and ports, the third-party software such as sudo, bash, and nginx. pkg update then pkg upgrade patches it; its files live under /usr/local and its configuration under /usr/local/etc.',
            'FreeBSD, bottom layer: the base system, meaning the kernel and core userland such as sh, sshd, and pf. freebsd-update fetch install patches it (pkg upgrade -r FreeBSD-base on a pkgbase install), and its configuration lives in /etc.']}),
     CMDS('FreeBSD essentials',[
       ['cat /etc/passwd','Same format as Linux. Hunt for UID 0: root, and on some releases toor, a spare superuser with login disabled (* in master.passwd). Any other UID 0 account is a finding.'],
       ['pw groupshow wheel','Who can su to root. Compare to the scenario brief.'],
       ['pw groupmod wheel -d kawika','Remove kawika from wheel.'],
       ['pw lock keola','Lock an account (pw unlock keola reverses it).'],
       ['sysrc -a','Show rc.conf settings (what is enabled at boot).'],
       ['service -e','List enabled services.'],
       ['service sshd restart','Start, stop, or restart a service by name.'],
       ['sockstat -4 -l','Listening IPv4 sockets with the owning process (FreeBSD’s answer to ss).'],
       ['pkg info','Installed packages. pkg which /path traces a file to its package.'],
       ['freebsd-update fetch install','Patch the base system.'],
       ['vi /etc/pf.conf','Firewall rules.']
     ])),
    COMPARE('Linux habit, FreeBSD equivalent',[
     {name:'Linux',tag:'Debian, Ubuntu, and Mint',tone:'muted',
      svg:{label:'On Linux, systemctl asks systemd to enable or start a service, and systemd reads that service’s unit file.',view:'0 0 250 74',
       body:'<g fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"><rect x="1" y="14" width="72" height="28" rx="5"/><rect x="89" y="14" width="72" height="28" rx="5"/><rect x="177" y="14" width="72" height="28" rx="5"/></g><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="37" y="32">systemctl</text><text x="125" y="32">systemd</text><text x="213" y="32">unit files</text></g><g fill="none" stroke="var(--ink-3)" stroke-width="1.5"><path d="M74 28 H86" marker-end="url(#arrow)"/><path d="M162 28 H174" marker-end="url(#arrow)"/></g><text x="125" y="62" font-size="10" text-anchor="middle" fill="var(--ink-2)">one manager starts and watches every service</text>'},
      rows:[['Enable at boot','<code>systemctl enable ssh</code>'],['Start now','<code>systemctl start ssh</code>'],['Install software','<code>apt install</code>'],['Patch','<code>apt upgrade</code>, kernel included'],['Listening ports','<code>ss -tulnp</code>'],['Accounts','<code>useradd</code>, <code>usermod</code>, and <code>passwd</code>'],['Admin power','The sudo group'],['Firewall','ufw, nftables, or iptables'],
            ['Password hashes','<code>/etc/shadow</code>'],['Password policy','<code>/etc/login.defs</code> and pam_pwquality'],['Lockout','pam_faillock locks the account'],['Logs','<code>journalctl</code>, or <code>/var/log/auth.log</code>'],['Scheduled jobs','cron, at, and systemd timers'],['Startup persistence','systemd units, <code>/etc/rc.local</code>, and shell files such as <code>.bashrc</code> and <code>.profile</code>'],['Root-equivalent groups','docker, lxd, and disk']],
      hook:'one manager, systemd, runs every service.'},
     {name:'FreeBSD',tag:'Base system plus pkg',tone:'l4',
      svg:{label:'On FreeBSD, sysrc writes a YES switch into /etc/rc.conf, and at boot rc runs the rc.d script of every service set to YES.',view:'0 0 250 74',
       body:'<g fill="var(--paper)" stroke="var(--l4)" stroke-width="1.5"><rect x="1" y="14" width="72" height="28" rx="5"/><rect x="89" y="14" width="72" height="28" rx="5"/><rect x="177" y="14" width="72" height="28" rx="5"/></g><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="37" y="32">sysrc</text><text x="125" y="32">/etc/rc.conf</text><text x="213" y="32">rc.d scripts</text></g><g fill="none" stroke="var(--l4)" stroke-width="1.5"><path d="M74 28 H86" marker-end="url(#arrow-l4)"/><path d="M162 28 H174" marker-end="url(#arrow-l4)"/></g><text x="125" y="62" font-size="10" text-anchor="middle" fill="var(--ink-2)">at boot, rc runs each service set to YES</text>'},
      rows:[['Enable at boot','<code>sysrc sshd_enable=YES</code>'],['Start now','<code>service sshd start</code>'],['Install software','<code>pkg install</code>'],['Patch','<code>freebsd-update fetch install</code> for the base, <code>pkg upgrade</code> for packages'],['Listening ports','<code>sockstat -4 -l</code>'],['Accounts','<code>pw useradd</code>, <code>pw usermod</code>, and <code>passwd</code>'],['Admin power','The wheel group (for su to root)'],['Firewall','pf (<code>/etc/pf.conf</code>), ipfw, or ipf (IPFILTER), all in the base system: one per host'],
            ['Password hashes','<code>/etc/master.passwd</code> (600 root:wheel), edited with <code>vipw</code>, which rebuilds the databases (pwd_mkdb)'],['Password policy','A login class in <code>/etc/login.conf</code> (rebuild with <code>cap_mkdb</code>) and pam_passwdqc'],['Lockout','blocklistd blocks the address in pf (named blacklistd before FreeBSD 15)'],['Logs','<code>/var/log/auth.log</code>, <code>messages</code>, and <code>security</code>; OpenBSM audit trails, read with <code>praudit</code>'],['Scheduled jobs','cron (<code>/var/cron/tabs</code>), at, and periodic (<code>/etc/periodic</code> and <code>/usr/local/etc/periodic</code>)'],['Startup persistence','rc.d scripts in <code>/etc/rc.d</code> and <code>/usr/local/etc/rc.d</code>, <code>/etc/rc.local</code>, and both shell families: <code>.shrc</code>, <code>.profile</code>, and <code>.cshrc</code>'],['Root-equivalent groups','operator, which can read the raw disks and so the password hashes']],
      hook:'a list of YES switches in /etc/rc.conf, read at every boot.'}
   ],{note:'A Linux command on FreeBSD usually returns “command not found”: your cue to translate the habit, then read the FreeBSD man page.',
     caption:'The jobs match, and the tools differ.',
     alt:['Enable a service at boot: systemctl enable ssh on Linux; sysrc sshd_enable=YES on FreeBSD, which writes the setting into /etc/rc.conf.',
          'Start a service now: systemctl start ssh on Linux; service sshd start on FreeBSD.',
          'Install software: apt install on Linux; pkg install on FreeBSD.',
          'Patch: apt upgrade on Linux, kernel included; on FreeBSD, freebsd-update fetch install for the base system and pkg upgrade for packages.',
          'List listening ports with their processes: ss -tulnp on Linux; sockstat -4 -l on FreeBSD.',
          'Manage accounts: useradd, usermod, and passwd on Linux; pw useradd, pw usermod, and passwd on FreeBSD.',
          'Admin power: the sudo group on Debian, Ubuntu, and Mint; the wheel group, which may su to root, on FreeBSD.',
          'Firewall: ufw, nftables, or iptables on Linux; pf (rules in /etc/pf.conf), ipfw, or ipf on FreeBSD, one per host.',
          'Password hashes: /etc/shadow on Linux; /etc/master.passwd (mode 600, root:wheel) on FreeBSD, edited with vipw, which rebuilds the password databases with pwd_mkdb.',
          'Password policy: /etc/login.defs and pam_pwquality on Linux; a login class in /etc/login.conf, rebuilt with cap_mkdb, and pam_passwdqc on FreeBSD.',
          'Lockout: pam_faillock locks the account on Linux; on FreeBSD, blocklistd blocks the attacking address in pf (named blacklistd before FreeBSD 15).',
          'Logs: journalctl or /var/log/auth.log on Linux; /var/log/auth.log, messages, and security on FreeBSD, plus OpenBSM audit trails, read with praudit.',
          'Scheduled jobs: cron, at, and systemd timers on Linux; cron (/var/cron/tabs), at, and periodic (/etc/periodic and /usr/local/etc/periodic) on FreeBSD.',
          'Startup persistence: systemd units, /etc/rc.local, and shell files such as .bashrc and .profile on Linux; rc.d scripts in /etc/rc.d and /usr/local/etc/rc.d, /etc/rc.local, and both shell families (.shrc, .profile, and .cshrc) on FreeBSD.',
          'Root-equivalent groups: docker, lxd, and disk on Linux; operator on FreeBSD, which can read the raw disks and so the password hashes.',
          'The service model: on Linux, systemctl asks systemd, which reads unit files and watches every service. On FreeBSD, sysrc writes YES switches into /etc/rc.conf, and at boot rc runs the rc.d script of every service set to YES.']}),
   COMPARE('su, sudo, and doas on FreeBSD: three doors to root',[
     {name:'su',tag:'Base system',tone:'l4',
      svg:{label:'su: you type root’s password and get a root shell that runs every command.',
       body:'<rect x="2" y="22" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/><text x="21" y="40" text-anchor="middle" font-size="11" fill="var(--ink)">you</text><path d="M42 36 H118" fill="none" stroke="var(--l4)" stroke-width="2" marker-end="url(#arrow-l4)"/><text x="80" y="28" text-anchor="middle" font-size="9" fill="var(--ink-2)">root’s password</text><rect x="122" y="10" width="74" height="54" rx="6" fill="var(--paper)" stroke="var(--l4)" stroke-width="2"/><text x="159" y="34" text-anchor="middle" font-size="11" fill="var(--ink)">root shell</text><text x="159" y="50" text-anchor="middle" font-size="9" fill="var(--ink-2)">every command</text>'},
      rows:[['Asks for','The <b>target</b> account’s password: root’s'],['Who may use it','Members of the <b>wheel</b> group'],['Gives','A whole root shell, until you type <code>exit</code>'],['Take it away','<code>pw groupmod wheel -d kawika</code>']],
      hook:'borrowing the master key.'},
     {name:'sudo',tag:'Package, if installed',tone:'l2',
      svg:{label:'sudo: you type your own password, and the sudoers rules allow one command at a time.',
       body:'<rect x="2" y="22" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/><text x="21" y="40" text-anchor="middle" font-size="11" fill="var(--ink)">you</text><path d="M42 36 H118" fill="none" stroke="var(--l2)" stroke-width="2" marker-end="url(#arrow-l2)"/><text x="80" y="28" text-anchor="middle" font-size="9" fill="var(--ink-2)">your password</text><rect x="122" y="10" width="74" height="54" rx="6" fill="var(--paper)" stroke="var(--l2)" stroke-width="2"/><text x="159" y="34" text-anchor="middle" font-size="11" fill="var(--ink)">sudoers</text><text x="159" y="50" text-anchor="middle" font-size="9" fill="var(--ink-2)">one command</text>'},
      rows:[['Asks for','Your <b>own</b> password'],['Who may use it','Whoever <code>/usr/local/etc/sudoers</code> names. The wheel group counts only where a <code>%wheel</code> line is switched on.'],['Gives','One command at a time, as the rules allow'],['Take it away','Delete the user’s lines with <code>visudo</code>']],
      hook:'a guest list for specific rooms.'},
     {name:'doas',tag:'Package, if installed',tone:'l3',
      svg:{label:'doas: you type your own password, unless a rule says nopass, and the rules in doas.conf allow one command at a time.',
       body:'<rect x="2" y="22" width="38" height="28" rx="6" fill="var(--paper)" stroke="var(--ink-3)" stroke-width="1.5"/><text x="21" y="40" text-anchor="middle" font-size="11" fill="var(--ink)">you</text><path d="M42 36 H118" fill="none" stroke="var(--l3)" stroke-width="2" marker-end="url(#arrow-l3)"/><text x="80" y="28" text-anchor="middle" font-size="9" fill="var(--ink-2)">your password</text><rect x="122" y="10" width="74" height="54" rx="6" fill="var(--paper)" stroke="var(--l3)" stroke-width="2"/><text x="159" y="34" text-anchor="middle" font-size="11" fill="var(--ink)">doas.conf</text><text x="159" y="50" text-anchor="middle" font-size="9" fill="var(--ink-2)">one command</text>'},
      rows:[['Asks for','Your <b>own</b> password, unless a rule says <code>nopass</code>'],['Who may use it','Whoever <code>/usr/local/etc/doas.conf</code> permits; <code>permit persist :wheel</code> is a sane rule'],['Gives','One command at a time, as the rules allow'],['Take it away','Delete the user’s rules from <code>doas.conf</code>'],['Watch for','<code>permit nopass NAME</code>: a silent root backdoor']],
      hook:'a short list taped to a third door.'}
   ],{intro:'Each door is separate: taking someone out of wheel closes su and leaves their sudoers and doas rules open, so check all three.',
     note:'<b>Power belongs to UID 0, whatever the name:</b> every UID 0 account is a superuser.'}),
   C('A minimal pf firewall','Apply',
     TERM('# /etc/pf.conf  (default deny inbound, allow outbound, permit SSH)\next_if = "em0"\nset skip on lo\nblock in all\npass out all keep state\npass in on $ext_if proto tcp to ($ext_if) port 22 keep state'),
     TIPS('Load and enable: <code>pfctl -f /etc/pf.conf</code> then <code>pfctl -e</code>. Check rules with <code>pfctl -sr</code>.',
          'Open only the ports the brief needs. The idea matches ufw; the syntax is new.'),
     DETAIL('FreeBSD settings, flags, and pf commands',TIPS('<b>login.conf:</b> in the default class, the capabilities passwordtime=60d, login-retries=5, and login-backoff=10, each line ending in :\\, then <code>cap_mkdb /etc/login.conf</code>; <code>pw usershow NAME -P</code> shows the class. <b>pam_passwdqc</b> in /etc/pam.d/passwd: min=disabled,disabled,disabled,12,10 max=64 similar=deny retry=3 enforce=everyone.',
          '<b>blocklistd:</b> <code>sysrc blocklistd_enable=YES</code>; the /etc/blocklistd.conf line ssh stream * * * 3 24h; UseBlocklist yes in sshd_config; and anchor "blocklistd/*" in on $ext_if in pf.conf. FreeBSD 14 uses the names blacklistd, blacklistctl, and UseBlacklist.',
          '<b>Console and rc.conf:</b> console none unknown off insecure in /etc/ttys; clear_tmp_enable=YES, syslogd_flags="-ss", and sendmail_enable=NONE.',
          '<b>pf:</b> find the interface with <code>ifconfig</code> (em0 or vtnet0); <code>pfctl -nf</code> parses without loading, -f loads, -e enables, -sr shows rules, -si status, -ss states, -sa everything, -sA anchors, and -a \'*\' -sr every anchor’s rules; <code>pfctl -a \'blocklistd/22\' -t port22 -T show</code> lists the blocked addresses. Watch blocks with <code>tcpdump -n -e -ttt -i pflog0</code> (pflog_enable=YES).',
          '<b>Patching and processes:</b> <code>freebsd-version -kru</code>; <code>pkg which /bin/sh</code> names a FreeBSD-base package on pkgbase; <code>pkg audit -F</code>; <code>pkg check -s -a</code>; <code>procstat -b PID</code>; <code>sockstat -46l</code> and <code>sockstat -46c</code>.',
          '<b>Kernel:</b> security.bsd.see_other_uids=0, see_other_gids=0, unprivileged_read_msgbuf=0, unprivileged_proc_debug=0, kern.randompid=1, net.inet.ip.forwarding=0, net.inet.tcp.blackhole=2, and net.inet.udp.blackhole=1 in /etc/sysctl.conf, applied with <code>service sysctl restart</code>; kern_securelevel_enable=YES and kern_securelevel=1 come last.',
          '<b>Audit and doas:</b> auditd_enable=YES, flags:lo,aa,ad,ex in /etc/security/audit_control, and <code>praudit /var/audit/current</code>. In doas.conf, permit persist :wheel is sane and permit nopass NAME is a backdoor. Package configs live under /usr/local/etc.'))),
    PATH('pf reads every rule, and the last match decides',[
     {name:'A new SSH connection arrives',tag:'TCP 22, inbound',tone:'muted',note:'pf checks it against the rules from top to bottom.',via:'next rule'},
     {name:'block in all',tag:'Rule 1: matches',tone:'bad',note:'Verdict so far: <b>block</b>. pf keeps reading.',via:'next rule'},
     {name:'pass out all keep state',tag:'Rule 2: other traffic',tone:'muted',note:'This rule covers outbound traffic, and the packet is inbound.',via:'next rule'},
     {name:'pass in on $ext_if proto tcp to ($ext_if) port 22 keep state',tag:'Rule 3: matches',tone:'ok',note:'Verdict now: <b>pass</b>, and as the last rule, it stands.',via:'end of the rules'},
     {name:'Verdict: pass',tag:'The last match wins',tone:'ok',note:'pf records the connection in its state table, so the replies and later packets skip the rules.'}
   ],{bloom:'Apply',
     note:'A rule marked <code>quick</code> decides on the spot and ends the search. <b>Linux flips the order:</b> iptables and ufw stop at the <b>first</b> matching rule, so these three lines there would block SSH.',
     caption:'A TCP port 80 packet matches only rule 1, so it stays blocked. In pf, broad rules go first, exceptions after.',
     key:[['bad','A matching rule that blocks'],['ok','A matching rule that passes'],['muted','The packet, and a rule for other traffic']],
     alt:['A new inbound SSH connection (TCP port 22) arrives, and pf checks it against every rule from top to bottom.',
          'Rule 1, block in all, matches. The verdict so far is block, and pf keeps reading.',
          'Rule 2, pass out all keep state, covers outbound traffic, so this inbound packet passes it by.',
          'Rule 3, pass in on $ext_if proto tcp to ($ext_if) port 22 keep state, matches. The verdict is now pass.',
          'At the end of the rules, the last match wins: the packet passes, and pf records the connection in its state table, so the replies and later packets skip the rules.',
          'A packet for TCP port 80 matches only rule 1, so it is blocked.',
          'A rule marked quick decides at once and ends the search, and packets of a recorded connection skip the rules. iptables and ufw use the first match instead, so the same three lines there would block SSH.']}),
   QUIZ('se1cy','Check yourself',[
     ['Brief: SSH open, and the guessing range 203.0.113.0/24 blocked. File A: <code>pass in quick on $ext_if proto tcp to port 22 keep state</code>, then <code>block in all</code>, then <code>block in on $ext_if from 203.0.113.0/24</code>. File B: <code>block in all</code>, then <code>pass in on $ext_if proto tcp to port 22 keep state</code>, then <code>block in on $ext_if from 203.0.113.0/24</code>. Which is safer, and why?',['A: block in all follows the pass, so the range stays blocked along with everything else','B: the last match decides, so its final block stops the range; in A the quick pass ends the search first','Both block the range','Neither allows SSH'],1,'A quick rule decides on the spot, so later rules never see the packet.',{whys:['In A the quick pass ends the search, so SSH from the range gets through.','B’s final block is the last match for the range, so it decides.','In A the quick pass lets the range reach SSH before any block.','Both files pass SSH, through quick in A and the pass rule in B.'],imp:'core',c:'bsd-freebsd'}]
   ]),

      rows:[['Run a service','<code>service sshd start</code>'],['Load the pf rules','<code>pfctl -f /etc/pf.conf</code>'],['Turn pf filtering on','<code>pfctl -e</code>'],['Check it','<code>service sshd status</code>, <code>pfctl -sr</code>, and <code>pfctl -si</code>']],

   ],{bloom:'Apply',intro:'A finished change flips both switches.',
     note:'<code>pfctl -f</code> loads a ruleset and leaves filtering as it was; <code>pfctl -e</code> turns filtering on with whatever rules are loaded. To run a service once while it stays disabled at boot, use <code>service sshd onestart</code>.',
     caption:'Check both columns after every change: <code>pfctl -si</code> shows Status: Enabled, and <code>sysrc -a</code> shows what the next boot will do.'}),
   PATH('From power on to sign-in',[
     {name:'Firmware',tag:'UEFI or BIOS',tone:'l1',note:['Guard: a setup password and a locked boot order, so nobody boots a USB stick','The FreeBSD loader is unsigned, so Secure Boot stays off unless you enroll your own keys'],via:'starts the loader'},
     {name:'Loader',tag:'/boot/loader.conf',tone:'l2',note:['Guard: <code>password=</code> locks the loader prompt, and <code>bootlock_password=</code> asks before any boot','<code>autoboot_delay</code> sets how long the menu waits'],via:'loads the kernel'},
     {name:'Kernel',tag:'securelevel -1',tone:'muted',note:'Gap: nothing is locked yet, so root may change any file',via:'starts init'},
     {name:'rc',tag:'securelevel raised to 1',tone:'l4',note:['Guard: /etc/rc.conf raises <code>kern.securelevel</code> from <code>kern_securelevel_enable="YES"</code> and <code>kern_securelevel="1"</code>','It can only go up until a reboot'],via:'starts sign-in'},
     {name:'Single-user and sign-in',tag:'single-user: still -1',tone:'amber',note:['Gap: single-user mode (<code>boot -s</code>) opens before rc runs, so flagged files can change there, which is also how updates get in','Guard: single-user mode gives a root shell at the console unless /etc/ttys marks the console <code>insecure</code>; then it asks for root’s password','Trade-off: recovering a lost root password then needs boot media']}
   ],{bloom:'Evaluate',intro:'Each hop hands control to the next and has its own guard. Someone at the keyboard tries the weakest one.',
     note:'These guards stop a person at the keyboard; disk encryption (GELI on FreeBSD) protects the disk once it leaves the room.',
     caption:'Guard every hop: a locked loader means little if the firmware boots any USB stick.'}),
COMPARE('Hunting on any Unix',[
     {name:'Linux',tag:'Debian, Ubuntu, and Mint',tone:'muted',
      rows:[['Swapped system binary','<code>debsums -c</code> lists files that differ from their packages'],['Hidden firewall rules','<code>ufw status</code> leaves out /etc/ufw/before.rules; read the loaded set with <code>iptables -S</code> or <code>nft list ruleset</code>'],['Immutable files','<code>chattr +i</code> blocks every change, even by root; <code>lsattr</code> shows the i'],['Hash a file','<code>sha256sum</code> and <code>md5sum</code>']]},
     {name:'FreeBSD',tag:'Base system plus pkg',tone:'l4',
      rows:[['Swapped system binary','<code>pkg check -s -a</code> for packages; <code>freebsd-update IDS</code> for the base'],['Hidden firewall rules','<code>pfctl -sr</code> shows an anchor as one line; <code>pfctl -sA</code> lists anchors, and <code>pfctl -a \'*\' -sr</code> prints their rules'],['Immutable files','<code>chflags schg</code>, shown by <code>ls -lo</code>; at securelevel 1 or higher the flag stays until a single-user reboot, so clear flags first and raise securelevel last'],['Hash a file','<code>sha256</code> and <code>md5</code>; recent releases also accept the GNU names']]}
   ],{bloom:'Analyze',
     note:'Account fixes on an immutable file fail with a misleading error, such as <code>useradd: cannot open /etc/passwd</code>, <code>Authentication token manipulation error</code>, or <code>Operation not permitted</code>: check the flags first.',
     caption:'Trust the loaded ruleset and the package database over the summary.'}),
   QUIZ('se1q','Check: FreeBSD',[
     ['Which group lets a user su to root on FreeBSD?',['sudo','wheel','admin','root'],1,'sudo, if present, is configured separately from wheel.',{whys:['sudo is the admin group on Mint and Ubuntu; FreeBSD uses wheel for su.','FreeBSD’s su lets only wheel members become root, so wheel membership is the list to audit.','admin is the admin group on macOS.','root is the account itself rather than a group that grants su.'],imp:'core',c:'bsd-freebsd'}],
     ['How do you enable a service at boot on FreeBSD?',['systemctl enable','edit /etc/rc.conf (or sysrc name_enable=YES)','update-rc.d','chkconfig on'],1,'rc.conf plus the service command. FreeBSD runs without systemd.',{whys:['systemctl belongs to systemd on Linux; FreeBSD uses rc.conf.','rc.conf, or sysrc, sets name_enable=YES for every boot.','update-rc.d comes from Debian-family Linux.','chkconfig comes from older Red Hat Linux.'],imp:'core',c:'bsd-freebsd'}],
     ['The default rules file for pf is',['/etc/ufw/rules','/etc/pf.conf','/etc/iptables.rules','/etc/firewalld'],1,'/etc/pf.conf, loaded with pfctl -f and enabled with pfctl -e.',{whys:['ufw is a Linux firewall front end.','pf reads /etc/pf.conf at boot, and pfctl -f loads it again after each edit.','iptables is an older Linux firewall.','firewalld is a Linux firewall manager.'],imp:'good',c:'bsd-freebsd'}],
     ['Listening sockets with their process on FreeBSD:',['ss -tulnp','sockstat -4 -l','netstat only','lsof is the only option'],1,'sockstat -4 -l is the FreeBSD habit; ss is Linux-only.',{whys:['ss is a Linux tool.','sockstat ships with every FreeBSD install and names the owning process beside each socket; -4 -l keeps the IPv4 listeners.','netstat lists sockets, and sockstat adds the owning process.','lsof works where installed, and sockstat ships with the base system.'],imp:'good',c:'bsd-freebsd'}]
   ]),
   QUIZ('se1q2','Check: read FreeBSD like an auditor',[
     ['pf.conf holds, in order: block in all; pass in on $ext_if proto tcp to port 22 keep state; block in on $ext_if proto tcp to port 22. What happens to a new inbound SSH connection?',['Passed: rule 2 matched first','Passed: keep state overrides later rules','Blocked: the last matching rule decides','Passed: pf skips rules for SSH'],2,'pf keeps reading after a match; a quick keyword on rule 2 would end the search there.',{whys:['pf keeps reading after rule 2, so a later match can change the verdict.','keep state remembers a connection once it passes; a new one meets every rule first.','Rule 3 is the last match, so pf blocks it.','pf checks SSH against every rule, like any other traffic.'],imp:'core',c:'bsd-freebsd'}],
     ['/etc/master.passwd shows toor:$6$Qx…:0:0::0:0:Bourne-again Superuser:/root: What does that tell you?',['toor holds a real password hash, so a second root login is open','It is normal: toor always holds a hash','toor is locked','toor is an ordinary user'],0,'toor is normal only while its hash field is *.',{whys:['A real hash on a UID 0 account opens a second root login.','toor ships with * in place of a hash, its login turned off.','A locked login shows * or !, and this field holds a real hash.','UID 0 makes toor a superuser, whatever its name.'],imp:'core',c:'lin-sudo-root'}],
     ['A teammate ran pkg upgrade and reports the FreeBSD server fully patched. Your call?',['Agree: pkg upgrade patches everything','Reboot to finish the patch','Reinstall the base','Check first: pkg upgrade patches packages, and the base needs freebsd-update unless the system uses pkgbase'],3,'Two layers, two update paths. freebsd-version -kru shows what the base runs now.',{whys:['pkg upgrade patches packages, and the base needs freebsd-update.','A reboot finishes a patch already installed; this base patch is still missing.','A reinstall costs hours; freebsd-update patches the base in place.','Packages and the base update separately, unless pkgbase joins them.'],imp:'core',c:'bsd-freebsd'}],
     ['The brief says the owner may need to recover a forgotten root password at the console. Do you mark the console insecure in /etc/ttys?',['Yes, on every machine','Check first: insecure protects single-user mode, and recovery then needs boot media, so confirm the owner accepts that','Leave /etc/ttys alone on every machine','Delete /etc/ttys'],1,'Weigh the control against the requirement it touches, and record the decision.',{whys:['Each machine follows its own brief, and this one needs console recovery.','insecure guards single-user mode, and recovery then needs boot media, so the owner decides.','An untouched /etc/ttys leaves a root shell at the console for anyone at the keyboard.','Deleting /etc/ttys breaks the console and decides nothing.'],imp:'good',c:'bsd-freebsd'}],
     ['HILO-FS01, a FreeBSD file server, keeps its system files flagged schg. Raise securelevel to 1 or 2?',['Yes, always: freebsd-update clears the flags itself','Weigh it: at 1 or higher even root cannot clear schg, but each update needs a single-user reboot; choose it when the owner accepts that downtime','No: at 1, root can still clear schg','Raise it to 3; chflags still works for updates'],1,'Tamper resistance against update downtime: record the choice and the owner’s sign-off.',{whys:['At 1 or higher, schg holds even against root and freebsd-update, so each update waits for a single-user reboot.','Tamper resistance costs a single-user reboot for each update, so weigh it with the owner.','At 1 and above, root loses the power to clear schg; that is the gain.','Higher levels lock more, so 3 holds schg in place too.'],imp:'good',c:'bsd-freebsd'}]
   ]),

  ]},
 {id:'se7',title:'Windows: credentials and the domain attack surface',bloom:'Evaluate',sum:'How credentials get stolen and reused, which guards to weigh around them, how Kerberos gets attacked and a fallen domain recovered, and where attackers dig in after the baseline.',
  can:'explain how credentials get stolen and reused, weigh the guards around them, describe a Kerberos attack and a domain recovery, and find where attackers dig in',
  blocks:[
   PATH('From the LAN to a password in hand',[
    {name:'Attacker on the LAN',tag:'starts empty-handed',tone:'bad',note:'Listens for name lookups DNS failed to answer',via:'answers LLMNR or NBT-NS'},
    {name:'Victim connects',tag:'NTLMv2 hash captured',tone:'amber',note:'The victim’s machine sends its NTLM response to the fake server',via:'cracks it or relays it'},
    {name:'A foothold',tag:'admin on one machine',tone:'amber',note:'Reads LSASS memory, where WDigest set to 1 leaves plaintext passwords',via:'reuses what it finds'},
    {name:'Domain credentials',tag:'the goal',tone:'bad',note:'A cached domain admin password or hash opens every machine'}
   ],{note:'<b>Close each hop:</b> LLMNR and NetBIOS over TCP/IP off; NTLMv2 only, with SMB signing required (<a href="#junior/j1">Junior</a>); WDigest UseLogonCredential 0; NoLMHash 1; RestrictAnonymous 1; and LSA protection (RunAsPPL 1).'}),
   C('Pass-the-hash: one theft, three machines','Evaluate',
     P('NTLM accepts the hash itself as proof (<a href="#junior/j1">Windows Server and Active Directory</a>), so a copied hash signs in like the password, uncracked. Follow one theft at Honua Logistics and judge which control breaks each hop.'),
     PATH('Two stolen hashes, three machines',[
      {name:'KAILUA-WS07',tag:'the foothold',tone:'amber',note:['An intruder with admin rights copies two hashes: the shared local Administrator’s from the SAM, and adm_keola’s from LSASS memory, left from a help-desk visit','<b>Evidence:</b> Sysmon 10 with TargetImage lsass.exe from an unknown program, or a Defender alert','<b>Breaks it:</b> Credential Guard walls off adm_keola’s domain hash; LSA protection blocks the read itself'],via:'same local hash'},
      {name:'KAILUA-WS12',tag:'a second PC',tone:'amber',note:['The same local password, so the same hash, opens it','<b>Evidence:</b> 4624 logon type 3, NTLM, KAILUA-WS12\\Administrator, from 10.0.5.31','<b>Breaks it:</b> Windows LAPS, and deny network sign-in for local accounts'],via:'admin hash from WS07'},
      {name:'HONUA-SRV1',tag:'the server',tone:'bad',note:['A server admin’s hash opens the server','<b>Evidence:</b> 4624 type 3 with NTLM from a workstation, and a 4776 on KONA-DC01, for an account that should arrive from the admin network by Kerberos','<b>Breaks it:</b> admin accounts sign in only to admin machines (<a href="#senior/se8">Senior: allow only what you trust</a>)']}
     ],{note:'<b>Why the built-in Administrator:</b> UAC remote restrictions hand every other local admin a filtered token over the network, so only the -500 account opens KAILUA-WS12 by default. LocalAccountTokenFilterPolicy 1 under Policies\\System lifts that filter for every local admin, so treat it as a finding; FilterAdministratorToken 1 filters the built-in Administrator too.'}),
     COMPARE('LSA protection, Credential Guard, and Protected Users',[
      {name:'LSA protection',tag:'RunAsPPL',tone:'l2',rows:[
        ['Guards','The LSASS process: only protected, Microsoft-signed code may open it'],
        ['Blocks','Ordinary admin tools reading LSASS'],
        ['Leaves open','Secrets still in LSASS, within reach of a bad kernel driver']]},
      {name:'Credential Guard',tag:'VBS',tone:'l3',rows:[
        ['Guards','Domain hashes and TGTs, moved into the walled-off LSAIso process'],
        ['Blocks','Reading those secrets, even as SYSTEM'],
        ['Leaves open','Local SAM accounts, which LAPS covers']]},
      {name:'Protected Users',tag:'AD group',tone:'ok',rows:[
        ['Guards','The account, wherever it signs in'],
        ['Blocks','NTLM, weak DES and RC4 keys, delegation, and cached sign-in'],
        ['Leaves open','Local, service, and computer accounts']]}
     ],{note:'Stack all three on admin accounts and admin workstations. On Windows 11 Pro, which lacks Credential Guard, LSA protection carries more of the load, backed by the ASR rule that blocks credential stealing from LSASS.',bloom:'Evaluate'})),
   DETAIL('UAC remote restrictions',
     P('<b>Why the built-in Administrator:</b> UAC remote restrictions hand every other local admin a filtered token over the network, so only the -500 account opens KAILUA-WS12 by default.')),
   DETAIL('Costs and defaults of the three guards',
     TIPS('<b>LSA protection:</b> unsigned LSA plug-ins, such as old smart-card drivers or password filters, stop loading, so audit first. It is on by default for new Windows 11 22H2 and later installs that are domain or Entra joined and can run memory integrity.',
          '<b>Credential Guard:</b> Enterprise and Education only; a few old sign-in methods stop working or ask for the password each time. It is on by default since Windows 11 22H2 on licensed PCs that meet the hardware needs, never on DCs; msinfo32 lists it under Virtualization-based security Services Running.',
          '<b>Protected Users:</b> starts empty. NTLM-only apps fail, TGTs last four hours, and members cannot sign in offline on laptops, so add admin accounts first, test, then widen.')),
   QUIZ('se7ck1','Check yourself',[
     ['Credential Guard is on across Honua’s PCs, yet a pass-the-hash sign-in as KAILUA-WS12\\Administrator still succeeds. Why?',['Local SAM accounts sit outside it; LAPS closes that gap','It stays off on workstations until someone turns it on','The hash was cracked first, and it cannot stop a password','The sign-in used Kerberos, which it leaves unguarded'],0,'Credential Guard isolates domain hashes and TGTs, while the local SAM stays outside it.',{whys:['Local SAM accounts sit outside Credential Guard; LAPS gives each PC’s local Administrator its own password, so one hash opens one PC.','It is on by default on licensed Windows 11 PCs that meet the hardware needs.','Pass-the-hash uses the hash itself, so no cracking happens.','Local accounts sign in with NTLM, so Kerberos plays no part.'],imp:'core',c:'win-credential-theft'}]
   ]),
   C('Kerberos and the attacks it invites','Analyze',
    SEQ('A Kerberos sign-in',[
     ['Pre-authentication','The user proves the password to the domain controller with a timestamp encrypted by the password’s key. <b>Attack here:</b> AS-REP roasting, against accounts that skip this step; a 4768 with Pre-Authentication Type 0 shows it.','l1'],
     ['Ticket-granting ticket (TGT)','The DC returns a TGT, encrypted with the krbtgt account’s key. <b>Attack here:</b> a golden ticket, a TGT forged with a stolen krbtgt key; service tickets (4769) for an account with no 4768 on any DC show it.','l2'],
     ['Service ticket','The user shows the TGT and asks for a ticket to a service named by its SPN; the DC encrypts that ticket with the service account’s key. <b>Attack here:</b> Kerberoasting; a burst of 4769 events from one account, for many services it never uses, shows it. Ticket Encryption Type 0x17 (RC4) makes it stand out, but 2026 updates make DCs issue AES (0x12) by default, so the burst is the sign.','l3'],
     ['Access','The service reads the ticket and grants access.','l4']
    ]),
    TIPS('<b>AS-REP roasting:</b> an account that skips pre-authentication hands anyone a reply encrypted with its password key, to crack offline. Require pre-authentication.',
         '<b>Kerberoasting:</b> any domain user can request a service ticket for an account with an SPN, then crack its password offline.',
         'Give service accounts long random passwords, or use group managed service accounts (gMSA), whose passwords Windows rotates.',
         '<b>Retire RC4 and DES:</b> <i>Network security: Configure encryption types allowed for Kerberos</i> = AES128, AES256, and Future encryption types (SupportedEncryptionTypes 0x7FFFFFF8) takes them off a machine’s list. Test older systems first.',
         'The ticket a DC issues follows the service account’s own setting, so set both; <code>klist</code> shows each cached ticket’s KerbTicket Encryption Type.',
         '<b>Unconstrained delegation</b> lets a server keep users’ TGTs; keep it to the domain controllers.')),
   C('Replay, relay, and a fallen domain','Evaluate',
     TIPS('<b>Replay</b> resends a captured sign-in later (<a href="#junior/j7">Read the wire</a>); <b>relay</b> forwards it live to a different server (<a href="#junior/j1">Windows Server and Active Directory</a>).',
          'Kerberos defeats replay: a timestamp sealed inside each authenticator, refused when clocks differ by more than five minutes, plus a cache of recent authenticators. Domain time is a security control.',
          'The five-minute window is the replay budget: fix drifting clocks at the source, and the window stays at five minutes whatever the error log says.',
          'Signing and channel binding defeat relay: require SMB signing, LDAP signing, and LDAP channel binding, and prefer Kerberos, whose tickets name the one service they open.',
          '<b>Control of krbtgt or of replication rights is control of the domain.</b> The krbtgt key mints a golden ticket for anyone.',
          '<b>DCSync</b> uses replication rights to copy every password hash from a DC.',
          '<b>DCSync evidence:</b> 4662 events on a DC carrying the Replicating Directory Changes All right for a non-DC account, with Directory Service Access auditing on.',
          '<b>Recovery after a confirmed DC compromise</b>, with the incident team: (1) work only from clean admin workstations; (2) reset krbtgt twice, at least ten hours and full replication apart, since DCs still accept the previous key; (3) reset every Tier 0 and service account password and the DSRM password; (4) remove rights, group members, GPOs, and trusts nobody approved; (5) rebuild compromised DCs from known-good media rather than cleaning them. After weeks of intruder control, a fresh forest can cost less than proving the old one clean.')),
   QUIZ('se7ck2','Check yourself',[
     ['After a confirmed domain compromise, a teammate resets the krbtgt password once and closes the case. Your judgment?',['Correct: one reset invalidates every ticket signed with the old key','Restore last week’s DC backup, from before the intruder’s changes began','Delete and recreate krbtgt so that no copy of the old key survives','Reset it a second time after replication and the ticket lifetime pass'],3,'Reset krbtgt again once replication and the ten-hour ticket lifetime pass, then reset Tier 0 and service accounts.',{whys:['DCs still accept the previous key, so one reset leaves stolen tickets working.','A backup brings back the same stolen krbtgt key and may hold the intruder’s earlier changes.','Windows keeps krbtgt as a built-in account; a second reset retires the old key.','DCs accept the current and previous krbtgt keys, so only a second reset, after replication and ticket expiry, pushes the stolen key out.'],imp:'core',c:'win-kerberos'}]
   ]),
