<title>Defense Ladder</title>
<style>
:root{
  --bg:#EEF3F5; --paper:#FFFFFF; --paper-2:#F6F9FA; --ink:#10283A; --ink-2:#4A6072; --ink-3:#7A8E9B;
  --line:#CFDAE1; --line-2:#E3EAEF;
  --l1:#2A9DB5; --l2:#0B6E8C; --l3:#0E4F6E; --l4:#14213D;
  --amber:#F2B134; --amber-ink:#5A3E00; --ok:#2E7D4F; --ok-bg:#E4F3EA; --bad:#C8402E; --bad-bg:#FBE6E2;
  --code-bg:#10283A; --code-ink:#E6F0F5; --code-cmd:#9EE7FF;
  --accent:var(--l1); --focus:#F2B134;
  --tint1:#E3F3F7; --tint2:#DDEEF4; --tint3:#E1E9F1; --tint4:#E4E7EF; --amber-bg:#FCF1D9;
  --radius:10px; --shadow:0 1px 2px rgba(16,40,58,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A24; --paper:#13283A; --paper-2:#17303F; --ink:#E6EEF3; --ink-2:#A9BCC9; --ink-3:#7F95A5;
    --line:#27465A; --line-2:#1F3A4B;
    --l1:#4FC3DB; --l2:#3AA6C6; --l3:#6FA8D8; --l4:#A9B9E8;
    --amber:#F2B134; --amber-ink:#2B1D00; --ok:#5CC98A; --ok-bg:#153324; --bad:#F08A7A; --bad-bg:#3E1A14;
    --code-bg:#0A1620; --code-ink:#D8E6EE; --code-cmd:#8EDFFF;
    --tint1:#12354A; --tint2:#15344A; --tint3:#18304A; --tint4:#1B2C47; --amber-bg:#3A2E12;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A24; --paper:#13283A; --paper-2:#17303F; --ink:#E6EEF3; --ink-2:#A9BCC9; --ink-3:#7F95A5;
  --line:#27465A; --line-2:#1F3A4B;
  --l1:#4FC3DB; --l2:#3AA6C6; --l3:#6FA8D8; --l4:#A9B9E8;
  --amber:#F2B134; --amber-ink:#2B1D00; --ok:#5CC98A; --ok-bg:#153324; --bad:#F08A7A; --bad-bg:#3E1A14;
  --code-bg:#0A1620; --code-ink:#D8E6EE; --code-cmd:#8EDFFF;
  --tint1:#12354A; --tint2:#15344A; --tint3:#18304A; --tint4:#1B2C47; --amber-bg:#3A2E12;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI","SF Pro Text",-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
code,kbd,pre,.mono{font-family:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
a{color:var(--l2);text-decoration-thickness:1px;text-underline-offset:2px}
sup.docs{margin-left:.3rem;font-size:.72rem;line-height:1}
sup.docs a,.docs-b{display:inline-block;padding:.4rem .25rem;margin:-.4rem 0;color:var(--l2);font:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.docs-b{background:none;border:0;cursor:pointer}
.docs-l{display:block;margin-top:3px;font-size:.82rem}
.docs-l[hidden]{display:none}
:root[data-theme="dark"] a{color:var(--l1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--l1)}}
button{font:inherit;color:inherit}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.01em;margin:0}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.rail,.main{min-width:0}
.rail{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 14px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.25rem;font-weight:800}
.brand .tag{color:var(--ink-2);font-size:.9rem}
.ladder{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ladder::-webkit-scrollbar{display:none}
.lv{flex:1 0 auto;min-width:112px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);cursor:pointer;text-align:left}
.lv svg{flex:none}
.lv .lv-t{display:flex;flex-direction:column;line-height:1.15}
.lv .lv-g{font-weight:700;font-size:.92rem}
.lv .lv-p{font-size:.75rem;color:var(--ink-2)}
.lv[aria-current="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.pages{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.pg{flex:none;padding:6px 11px;border:1px solid var(--line);background:transparent;border-radius:999px;font-size:.88rem;cursor:pointer;color:var(--ink-2)}
.pg[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rail-foot{display:none}

.main{padding:18px 16px 60px;max-width:76ch;width:100%}
@media (min-width:920px){
  .app{grid-template-columns:260px minmax(0,1fr)}
  .rail{position:sticky;top:0;height:100vh;height:100dvh;border-bottom:0;border-right:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;overflow:auto}
  .brand{flex-direction:column;align-items:flex-start;gap:2px}
  .brand h1{font-size:1.45rem}
  .ladder{flex-direction:column;margin-top:22px;overflow:visible}
  .lv{min-width:0;padding:10px 12px}
  .pages{flex-direction:column;margin-top:18px;overflow:visible;gap:4px}
  .pg{text-align:left;border-radius:8px}
  .rail-foot{display:block;margin-top:auto;padding-top:18px;font-size:.78rem;color:var(--ink-3);line-height:1.4}
  .main{padding:34px 40px 80px;max-width:calc(76ch + 80px)}
}

/* ---------- level header ---------- */
.lvhead{border-left:6px solid var(--accent);padding:4px 0 4px 16px;margin-bottom:18px}
.lvhead .grade{font-size:2rem;font-weight:800}
.lvhead .range{color:var(--ink-2);font-size:1.05rem}
.bloom{display:flex;gap:4px;margin:12px 0 10px;max-width:420px}
.bloom span{flex:1;height:22px;border-radius:5px;background:var(--line-2);font-size:.68rem;display:flex;align-items:center;justify-content:center;color:var(--ink-3);border:1px solid var(--line)}
.bloom span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .bloom span.on{color:#0C1A24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bloom span.on{color:#0C1A24}}
.bloom-cap{font-size:.8rem;color:var(--ink-2)}
.intro{margin-top:8px}
details.mentor{margin-top:10px;border:1px dashed var(--line);border-radius:var(--radius);padding:8px 12px;background:var(--paper-2)}
details.mentor summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details.mentor ul{margin:8px 0 2px;padding-left:20px}
details.deeper{margin:12px 0;border:1px solid var(--line);border-left:4px solid var(--accent,var(--l2));border-radius:0 var(--radius) var(--radius) 0;padding:8px 12px;background:var(--paper-2);overflow-wrap:anywhere}
details.deeper>summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
details.deeper[open]>summary{margin-bottom:6px}
details.deeper ul{margin:6px 0 2px;padding-left:20px}
@media print{details.deeper{break-inside:avoid}}
/* unit opening speed: blocks below the fold skip layout and paint until they near the viewport; print lays out every block */
.main>.card,.main>details.deeper{content-visibility:auto;contain-intrinsic-size:auto 800px}
@media print{.main>.card,.main>details.deeper{content-visibility:visible;contain-intrinsic-size:none}}
.uhead h2:focus{outline:none}
.uhead h2:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:4px}
/* Move your progress */
.mv h4{font-size:1rem;margin:16px 0 4px}
.mv p{margin:6px 0}
textarea.mv-code{font:600 .85rem/1.45 ui-monospace,Consolas,monospace;word-break:break-all;min-height:4.5em}
.mv-prev{margin:8px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2)}
.mv-prev ul{margin:6px 0 0;padding-left:20px}
/* progressive loading: a grade whose script is still arriving keeps full-contrast text and shows "(loading)"
   in its range line (and so in its accessible name) with a dashed border; the note and Reload row a waiting view shows */
.lv.wait{border-style:dashed}.lv.wait .lv-p::after{content:" (loading)"}
.waitnote{margin-top:10px;color:var(--ink-2)}
.waitrow{margin-top:8px}

.units{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin-bottom:12px;scrollbar-width:thin}
.unit{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.9rem;display:flex;align-items:center;gap:7px}
.unit[aria-current="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
:root[data-theme="dark"] .unit[aria-current="true"]{color:#0C1A24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .unit[aria-current="true"]{color:#0C1A24}}
.unit .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.unit .dot.part{background:var(--amber)}
.unit .dot.full{background:var(--ok)}
.unit[aria-current="true"] .dot{outline:2px solid rgba(255,255,255,.6)}

/* ---------- content ---------- */
.uhead{margin:6px 0 14px}
.uhead h2{font-size:1.45rem}
.uhead .sum{color:var(--ink-2);margin-top:4px}
.blm{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);margin-left:8px;vertical-align:middle}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h3{font-size:1.08rem;margin-bottom:8px}
.card h3 .blm{margin-left:8px}
.card ul,.card ol{margin:0 0 .6em;padding-left:22px}
.card li{margin:.25em 0}
.note{border-left:4px solid var(--amber);background:var(--paper-2);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.warn{border-left-color:var(--bad)}
/* command tables (see renderCmds): each row stacks, the command on its own line in a code box and its meaning
   beneath, indented; a table of short commands shows two columns once it has room (the container queries below) */
.cmdw{container-type:inline-size}
table.cmds{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 4px;display:block;overflow-x:auto}
table.cmds>tbody,table.cmds tr,table.cmds td{display:block}
table.cmds tr{border-top:1px solid var(--line-2);padding:7px 0}
table.cmds td{padding:0}
table.cmds td+td{padding:4px 0 0 1.25rem}
table.cmds code{background:var(--code-bg);color:var(--code-cmd);padding:2px 7px;border-radius:5px;font-size:.84rem}
table.cmds td:first-child code{display:inline-block;max-width:100%;white-space:pre-wrap;overflow-wrap:break-word;padding-left:calc(7px + 2ch);text-indent:-2ch}
pre.term{background:var(--code-bg);color:var(--code-ink);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:.84rem;line-height:1.5;margin:8px 0}
p code,li code,.why code{background:var(--line-2);padding:1px 5px;border-radius:4px;font-size:.88em}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pill{font-size:.8rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}

/* quiz */
.q{padding:10px 0;border-top:1px solid var(--line-2)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:600;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin:5px 0;cursor:pointer;background:var(--paper-2)}
.opt input{margin-top:4px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.right span::after{content:" \2713  Correct";font-weight:700;color:var(--ok);white-space:nowrap}
.opt.wrong span::after{content:" \2717  Your answer";font-weight:700;color:var(--bad);white-space:nowrap}
.why{font-size:.9rem;color:var(--ink-2);margin:6px 0 0;padding:8px 10px;background:var(--paper-2);border-radius:8px;border:1px dashed var(--line)}

/* flashcards */
.flash{perspective:1000px}
.fc{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);min-height:150px;padding:18px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:1.05rem;position:relative}
.fc .side{font-size:.72rem;color:var(--ink-3);position:absolute;top:8px;left:12px}
.fc .cnt{font-size:.72rem;color:var(--ink-3);position:absolute;top:8px;right:12px}
.fc.back{background:var(--paper);border-color:var(--accent)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper-2);cursor:pointer;font-size:.92rem;text-align:left}
.mi.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mi.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);cursor:default}
.mi.shake{border-color:var(--bad)}

/* spot */
.spot pre{margin:0;padding:0;background:var(--code-bg);border-radius:8px;overflow-x:auto;font-size:.84rem}
.sl{display:block;padding:4px 12px;color:var(--code-ink);cursor:pointer;border-left:4px solid transparent;white-space:pre}
.sl:hover{background:rgba(255,255,255,.06)}
.sl.flag{border-left-color:var(--amber);background:rgba(242,177,52,.14)}
.sl.hit{border-left-color:var(--ok);background:rgba(46,125,79,.25)}
.sl.miss{border-left-color:var(--bad);background:rgba(200,64,46,.25)}
.sl.false{border-left-color:var(--bad);text-decoration:line-through;opacity:.8}
.spot .legend{font-size:.8rem;color:var(--ink-2);margin-top:6px}

/* order */
.ord .pool,.ord .seq{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.oi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper-2);cursor:pointer;text-align:left;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.oi .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.75rem;display:flex;align-items:center;justify-content:center;font-weight:700}
.oi.ok{border-color:var(--ok);background:var(--ok-bg)}
.oi.off{border-color:var(--bad);background:var(--bad-bg)}
.ord h4{font-size:.85rem;color:var(--ink-2);margin:12px 0 0;font-weight:600}

/* lab */
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-2)}
.step:first-of-type{border-top:0}
.step input{margin-top:5px;width:18px;height:18px;flex:none}
.step .st{flex:1}
.step code{display:inline-block;margin-top:4px;background:var(--code-bg);color:var(--code-cmd);padding:3px 8px;border-radius:5px;font-size:.84rem;white-space:pre-wrap;word-break:break-word}
.step.done .st{color:var(--ink-3);text-decoration:line-through}
.step.done code{opacity:.6}
.step .hint{color:var(--ink-2)}

/* builder, planner, reflect */
textarea,input[type=text],input[type=number],input[type=search],select{font:inherit;color:var(--ink);background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
.bsec{margin:10px 0}
.bsec label{display:block;font-weight:600;margin-bottom:4px}
.bsec .hint{font-size:.85rem;color:var(--ink-2);margin-bottom:6px}
dl.gloss dt{font-weight:700;margin-top:10px}
dl.gloss dd{margin:2px 0 0 0;color:var(--ink-2)}
dl.gloss dd a{display:inline-block;max-width:100%}
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl-grid label{display:block;font-size:.85rem;color:var(--ink-2)}
.plan-out{white-space:pre-wrap;font-size:.86rem}
.timer{font-size:2.4rem;font-weight:800;letter-spacing:.02em;margin:6px 0}

/* links */
.lk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-2)}
.lk:first-of-type{border-top:0}
.lk .k{flex:none;font-size:.7rem;padding:3px 7px;border-radius:5px;margin-top:3px;min-width:74px;text-align:center;font-weight:600}
.k.vendor{background:#0B6E8C;color:#fff}
.k.standard{background:#2E7D4F;color:#fff}
.k.community{background:#7A5C00;color:#fff}
.k.practice{background:#6B3FA0;color:#fff}
.k.tool4that{background:var(--amber);color:var(--amber-ink)}
.lk .d{font-size:.9rem;color:var(--ink-2)}

/* study plan timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.ph{position:relative;padding:0 0 16px}
.ph::before{content:"";position:absolute;left:-19px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--accent)}
.ph.ms::before{border-color:var(--ok);background:var(--ok)}
.ph h3{font-size:1.05rem}
.ph .when{color:var(--ink-2);font-size:.9rem}
.ph ul{margin:6px 0 8px;padding-left:20px;font-size:.93rem}

/* hardening areas and scorecard */
table.areas td:first-child{white-space:normal}
table.areas small{color:var(--ink-2)}
.sc-lbl{display:block;font-weight:600;margin-bottom:6px}
.pl-len{display:block;font-size:.85rem;color:var(--ink-2);margin:4px 0 10px;max-width:16rem}

/* progress page */
.prog{display:grid;gap:10px}
.pbar{height:10px;background:var(--line-2);border-radius:999px;overflow:hidden;margin:6px 0}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prow b{font-size:1rem}
.prow small{color:var(--ink-2)}

/* ---------- visual blocks: COMPARE, ANATOMY, STACK, PATH, SEQ, HIER, VENN, SCALE ----------
   Each block sets --c (line colour) and --bgc (tint) from a tone; layouts answer to the
   figure's own width (container queries), so a visual reflows the same in a card or alone. */
.vis{margin:0;container-type:inline-size;container-name:vis;overflow-wrap:break-word}
.v-in{margin:12px 0 4px}
.v-in>h4{font-size:1rem;margin:0 0 6px}
.v-why{color:var(--ink-2);font-size:.95rem;margin:0 0 12px}
.v-cap{color:var(--ink-2);font-size:.9rem;margin-top:10px}
details.v-alt{margin-top:8px;font-size:.9rem;color:var(--ink-2)}
details.v-alt summary{cursor:pointer;color:var(--l2);font-weight:600}
:root[data-theme="dark"] details.v-alt summary{color:var(--l1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) details.v-alt summary{color:var(--l1)}}
details.v-alt ol,details.v-alt ul{margin:6px 0 2px;padding-left:22px}
details.v-alt p{margin:6px 0 0}
.v-tag{font-size:.75rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.v-note{margin:12px 0 0;padding:8px 12px;border-radius:8px;background:var(--paper-2);border:1px solid var(--line-2);font-size:.9rem}
.v-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--ink-2);margin-top:8px}
.v-key span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:2px solid var(--c);background:var(--bgc)}
.vis svg{max-width:100%}
.vis code{background:var(--line-2);padding:1px 5px;border-radius:4px;font-size:.88em;white-space:nowrap}
/* compare */
.v-cmp{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.v-col{border:2px solid var(--c);border-radius:10px;background:var(--bgc);padding:10px 12px;min-width:0}
.v-colh{margin:0;font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.v-col>svg{display:block;width:100%;height:auto;max-height:120px;margin:8px 0 6px}
.v-col dl{margin:0;font-size:.88rem}
.v-col dt{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-top:8px}
.v-col dd{margin:1px 0 0}
.v-mem{margin-top:10px;padding:6px 8px;border-radius:6px;background:var(--paper);border-left:4px solid var(--c);font-size:.86rem}
@container vis (min-width:520px){.v-cmp.v-n2,.v-cmp.v-n4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container vis (min-width:780px){.v-cmp.v-n3{grid-template-columns:repeat(3,minmax(0,1fr))}.v-cmp.v-n4{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* anatomy */
.v-anat{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.v-boxes{display:grid;gap:10px;min-width:0}
.v-box{border:2px solid var(--c);border-radius:8px;background:var(--bgc);padding:8px;min-width:0;container-type:inline-size;container-name:vbox}
.v-blabel{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;font-size:.82rem;font-weight:700;margin:0 2px 6px}
.v-btxt{font-size:.82rem;margin:0 2px 6px}
.v-arow{display:flex;flex-direction:column;gap:6px}
.v-hdr,.v-trl{border:1.5px dashed var(--c);border-radius:6px;padding:6px 8px;font-size:.78rem;line-height:1.35;background:var(--paper);min-width:0}
.v-hdr b,.v-trl b,.v-panel b{display:block;font-size:.72rem;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.v-inner{flex:1;min-width:0;display:grid;gap:8px}
.v-panel{border:1.5px dashed var(--c);border-radius:8px;background:var(--paper);padding:8px;font-size:.82rem}
.v-core{border:2px solid var(--ink-3);border-radius:6px;padding:10px;text-align:center;font-weight:700;background:var(--paper)}
.v-sub{font-weight:400;font-size:.8rem;color:var(--ink-2)}
.v-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,max(88px,var(--tmin,0px))),1fr));gap:6px}
.v-grid>.v-box{background:var(--paper);padding:6px;text-align:center;font-size:.78rem}
.v-grid>.v-box>.v-blabel{justify-content:center;margin:0 0 2px}
.v-grid>.v-box>.v-btxt{margin:0}
.v-box>svg{display:block;margin:4px auto 0;height:auto}
.v-strip{margin-top:10px;border-top:2px solid var(--l4);padding-top:8px;display:flex;align-items:center;gap:10px;font-size:.8rem;min-width:0}
.v-strip b{white-space:nowrap}
.v-strip code{font:600 .85rem ui-monospace,Consolas,monospace;letter-spacing:.12em;white-space:nowrap;overflow:hidden;flex:1;min-width:0;background:none;padding:0}
.v-facts{font-size:.9rem;min-width:0}
.v-facts table{width:100%;border-collapse:collapse}
.v-facts th,.v-facts td{text-align:left;vertical-align:top;padding:6px;border-bottom:1px solid var(--line-2)}
.v-facts thead th{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.v-facts tbody th{font-weight:600}
/* header and trailer sit beside the children once this box itself has room (each nesting level decides alone) */
@container vbox (min-width:400px){.v-arow{flex-direction:row;align-items:stretch}.v-hdr,.v-trl{flex:none;max-width:30%}}
@container vis (min-width:480px){.v-facts tbody th{white-space:nowrap}}
@container vis (min-width:700px){.v-anat.v-hasfacts{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
/* stack */
.v-stack{display:grid;gap:4px 8px}
.v-sth{font-size:.8rem;font-weight:700;text-align:center;color:var(--ink-2);padding-bottom:2px}
.v-layer{border:2px solid var(--c);background:var(--bgc);border-radius:7px;padding:5px 8px;min-width:0;display:flex;flex-direction:column;justify-content:center;font-size:.86rem;line-height:1.3}
.v-layer b{display:flex;gap:6px;align-items:baseline}
.v-layer .v-num{flex:none;font-size:.72rem;min-width:1.5em;height:1.5em;border-radius:50%;background:var(--paper);border:1.5px solid var(--c);display:inline-flex;align-items:center;justify-content:center}
.v-layer small{color:var(--ink-2);font-size:.78rem}
/* path */
.v-path{display:flex;flex-direction:column;align-items:stretch}
.v-hop{border:2px solid var(--c);background:var(--bgc);border-radius:10px;padding:8px 10px;min-width:0;font-size:.86rem}
.v-hop>b{display:block;font-size:.95rem}
.v-hop ul{margin:4px 0 0;padding-left:18px}
.v-hop li{margin:.1em 0}
.v-arr{display:flex;align-items:center;gap:8px;padding:2px 0 2px 18px;color:var(--ink-2);font-size:.78rem;min-width:0}
.v-arr svg{flex:none;transform:rotate(90deg)}
@container vis (min-width:600px){
  .v-path.v-row{flex-direction:row;align-items:stretch}
  .v-path.v-row .v-hop{flex:1 1 0}
  .v-path.v-row .v-arr{flex:0 0 64px;flex-direction:column;justify-content:center;padding:0 2px;text-align:center;gap:2px}
  .v-path.v-row .v-arr svg{transform:none}
}
@container vis (min-width:900px){
  .v-path.v-row4{flex-direction:row;align-items:stretch}
  .v-path.v-row4 .v-hop{flex:1 1 0}
  .v-path.v-row4 .v-arr{flex:0 0 64px;flex-direction:column;justify-content:center;padding:0 2px;text-align:center;gap:2px}
  .v-path.v-row4 .v-arr svg{transform:none}
}
/* seq */
ol.v-seq{list-style:none;margin:0;padding:0;position:relative}
.v-seq>li{position:relative;padding:0 0 12px 40px;min-width:0}
.v-seq>li::before{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
.v-seq>li:last-child::before{display:none}
.v-seq .v-sn{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--bgc);border:2px solid var(--c);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.v-seq .v-sl{font-weight:700;display:block;padding-top:3px}
.v-seq .v-sd{font-size:.9rem;color:var(--ink-2)}
.v-seq .v-dec .v-sn{border-radius:4px;transform:rotate(45deg);width:20px;height:20px;left:4px;top:4px}
.v-seq .v-dec .v-sn span{transform:rotate(-45deg)}
.v-br{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:6px}
.v-br>div{border:1.5px solid var(--c);background:var(--bgc);border-radius:8px;padding:6px 8px;font-size:.88rem}
.v-br>div b{display:block;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
@container vis (min-width:480px){.v-br{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}}
/* hier */
ul.v-tree,ul.v-tree ul{list-style:none;margin:0;padding:0}
ul.v-tree ul{margin-left:12px;padding-left:14px}
.v-tree li{margin:6px 0 0;position:relative;min-width:0}
.v-tree ul>li::before{content:"";position:absolute;left:-14px;top:16px;width:12px;border-top:2px solid var(--line)}
.v-tree ul>li::after{content:"";position:absolute;left:-14px;top:-6px;bottom:0;border-left:2px solid var(--line)}
.v-tree ul>li:last-child::after{bottom:auto;height:24px}
.v-node{display:inline-block;max-width:100%;border:2px solid var(--c);background:var(--bgc);border-radius:8px;padding:5px 10px;font-size:.88rem}
.v-node small{display:block;color:var(--ink-2);font-size:.8rem}
.v-ladder{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px}
.v-ladder .v-axis{display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:.72rem;font-weight:700;color:var(--ink-2);text-align:center;width:4.6em}
.v-ladder .v-axis i{flex:1;width:2px;background:var(--line);margin:4px 0;position:relative}
.v-ladder .v-axis i::before{content:"";position:absolute;top:-2px;left:-5px;border:6px solid transparent;border-top:0;border-bottom:9px solid var(--line)}
.v-ladder ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.v-ladder li{border:2px solid var(--c);background:var(--bgc);border-radius:8px;padding:6px 10px;font-size:.88rem;display:flex;gap:10px;align-items:baseline}
.v-ladder li .v-num{flex:none;font-weight:700;font-size:.8rem;color:var(--ink-2)}
.v-ladder li small{display:block;color:var(--ink-2);font-size:.8rem}
/* venn */
.v-venn{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:center}
.v-venn svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.v-regions{list-style:none;margin:0;padding:0;font-size:.88rem;display:grid;gap:6px}
.v-regions li{display:flex;gap:8px;align-items:flex-start}
.v-regions .v-num{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-2);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
@container vis (min-width:600px){.v-venn{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* scale */
.v-range{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px}
.v-ends{display:flex;flex-direction:column;align-items:center;justify-content:space-between;width:4.6em;font-size:.74rem;font-weight:700;color:var(--ink-2);text-align:center}
.v-ends i{flex:1;width:2px;min-height:24px;background:var(--line);margin:4px 0 10px;position:relative}
.v-ends i::after{content:"";position:absolute;bottom:-9px;left:-5px;border:6px solid transparent;border-bottom:0;border-top:9px solid var(--line)}
.v-bands{display:flex;flex-direction:column;gap:4px;min-width:0}
.v-band{border:2px solid var(--c);background:var(--bgc);border-radius:7px;padding:6px 8px;font-size:.86rem;min-width:0}
.v-band small{display:block;color:var(--ink-2);font-size:.8rem}
/* a scale lines its bands up in a row once each band has room for its longest word: at 560px for up to five
   bands, at 760px for six or more (v-many) */
@container vis (min-width:560px){

  .v-range:not(.v-many) .v-ends i{height:2px;width:auto;min-height:0;margin:0 14px 0 10px}
  .v-range:not(.v-many) .v-ends i::after{bottom:auto;top:-5px;left:auto;right:-9px;border:6px solid transparent;border-right:0;border-left:9px solid var(--line)}
  .v-range:not(.v-many) .v-bands{flex-direction:row}.v-range:not(.v-many) .v-band{flex:var(--w,1) 1 0;min-width:min-content;overflow-wrap:break-word}
}
@container vis (min-width:760px){
  .v-range.v-many{grid-template-columns:minmax(0,1fr)}
  .v-range.v-many .v-ends{flex-direction:row;width:auto}
  .v-range.v-many .v-ends i{height:2px;width:auto;min-height:0;margin:0 14px 0 10px}
  .v-range.v-many .v-ends i::after{bottom:auto;top:-5px;left:auto;right:-9px;border:6px solid transparent;border-right:0;border-left:9px solid var(--line)}
  .v-range.v-many .v-bands{flex-direction:row}.v-range.v-many .v-band{flex:var(--w,1) 1 0;min-width:min-content;overflow-wrap:break-word}
}
table.v-mx{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:4px;font-size:.84rem}
.v-mx th{font-size:.74rem;font-weight:700;color:var(--ink-2);text-align:center;vertical-align:middle;padding:2px;overflow-wrap:anywhere}
.v-mx th.v-ax{color:var(--ink);text-align:left}
.v-mx thead th.v-ax[colspan]{text-align:center}
.v-cell{border:2px solid var(--c);background:var(--bgc);border-radius:7px;padding:6px 8px;vertical-align:top;overflow-wrap:anywhere}
.v-cell b{display:block}
.v-cell small{display:block;color:var(--ink-2);font-size:.8rem}

.foot{margin-top:36px;font-size:.8rem;color:var(--ink-3);line-height:1.5}
.theme{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 11px;font-size:.8rem;cursor:pointer;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
/* ---- UX pass (2026-10-21): contrast, rem text, a two-tone focus ring, touch targets, wrapping without sideways
   scrolling, the rail tools (theme and reading width), and the growth-check views ---- */
:root{--ok:#256B42;--bad:#A3321F;--line-ctl:#6F8593;--l1s:#187589;--l2s:#0B6E8C;--l3s:#0E4F6E;--l4s:#14213D;--railh:0px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--line-ctl:#5D7A8E;--l1s:var(--l1);--l2s:var(--l2);--l3s:var(--l3);--l4s:var(--l4)}}
:root[data-theme="dark"]{--line-ctl:#5D7A8E;--l1s:var(--l1);--l2s:var(--l2);--l3s:var(--l3);--l4s:var(--l4)}
[hidden]{display:none !important}
body{font-size:1rem}
.main{overflow-wrap:break-word}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--ink)}
.bloom span,.fc .side,.fc .cnt,.rail-foot,.foot,.step.done .st{color:var(--ink-2)}
.opt,.unit,.lv,.pg,.btn.sec,.mi,.oi,.tbtn,textarea,input[type=text],input[type=number],input[type=search],select{border-color:var(--line-ctl)}
.unit[aria-current="true"],.bloom span.on{background:var(--accent-strong,var(--accent));border-color:var(--accent-strong,var(--accent))}

.lvi{display:flex;flex:1 0 auto;min-width:0}
.lvi>.lv{flex:1 1 auto}
.pgi{display:flex;flex:none}
.lv[aria-current="page"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.pg[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.brand{padding-right:104px}
.rail-tools{position:absolute;top:10px;right:12px;display:flex;gap:6px;align-items:center}
.tbtn{border:1px solid var(--line-ctl);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:.8rem;cursor:pointer;white-space:nowrap}
#widthBtn{display:none}
@media (min-width:920px){

  .pgi>.pg{flex:1 1 auto}

.unum{margin:0 0 2px;font-size:.85rem;font-weight:600;color:var(--ink-2)}
.units,.uhead{scroll-margin-top:calc(var(--railh) + 8px)}
/* wrapping instead of sideways scrolling: code wraps at its spaces, and keepNames keeps each name whole (a long
   path breaks only after a \ or /); a word breaks mid-letter only when it is wider than its whole box */
pre.term{white-space:break-spaces;overflow-wrap:break-word}
pre.term .tln{display:block;padding-left:2ch;text-indent:-2ch}
.vis code{white-space:normal}
main code{overflow-wrap:break-word}
.nb{white-space:nowrap}
.any{overflow-wrap:anywhere}
.v-tag{white-space:normal;overflow-wrap:anywhere;min-width:0}

.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}

.v-facts,.v-scroll{overflow-x:auto;max-width:100%}
.scroll-cue{font-size:.8rem;color:var(--ink-2);margin:4px 0 0}
/* COMPARE and PATH side by side keep their rows aligned (subgrid) */
@container vis (min-width:520px){

.v-hop>b{grid-row:1}.v-hop>.v-tag{grid-row:2}.v-hop>div,.v-hop>ul{grid-row:3}
/* quiz: growth check */
.qhelp{font-size:.9rem;color:var(--ink-2)}
.imp{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:700;vertical-align:middle;white-space:nowrap;background:var(--tint2);color:var(--ink);border:1px solid var(--l2)}

/* two columns for a table of short commands, once its box leaves the meanings about 18rem (40 characters a line):
   the command column is exactly as wide as its longest command, so every command sits on one line
   (cmds-s: up to 16 characters, cmds-m: 24, cmds-l: 32, cmds-x: 48). Both cells take the same padding, so a
   command and its meaning start on one baseline. */
@container (min-width:28rem){
  table.cmds-s{display:grid;grid-template-columns:max-content minmax(0,1fr)}

@container (min-width:32rem){
  table.cmds-m{display:grid;grid-template-columns:max-content minmax(0,1fr)}

@container (min-width:36rem){

<body>
<div class="app">
  <nav class="rail" aria-label="Course">
    <div class="mbar"><div class="mwho">
    <div class="brand">
      <h1>Defense Ladder</h1>
      <span class="tag">Cybersecurity fundamentals, from first command to team lead</span>
    </div>
    <p class="where" id="where"></p></div>
    <button class="mbtn" id="menuBtn" type="button" aria-expanded="false" aria-controls="navPanel"><svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 1h16M1 7h16M1 13h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Menu</button>
    </div>
    <div class="npanel" id="navPanel">
    <div class="mhead"><h2 class="mtitle" id="navTitle">Menu</h2><button class="tbtn mclose" id="menuClose" type="button">Close</button></div>
    <h2 class="mlbl">Grades</h2>
    <div class="ladder" id="ladder" role="list" aria-label="Grades"></div>
    <div class="pages" id="pages" role="list" aria-label="Pages"></div>
    <div class="rail-tools"><button class="tbtn" id="themeBtn" type="button">Theme: auto</button><button class="tbtn" id="widthBtn" type="button">Width: Wide</button><button class="tbtn" id="textBtn" type="button">Text: Default</button></div>
    <div class="rail-foot">Unofficial practice, independent of, and unendorsed by, Microsoft, Canonical, Linux Mint, the FreeBSD Project, and Cisco. Progress stays in this browser.</div>
    </div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<script>
/* ===================== Defense Ladder =====================
   Single-file, offline cybersecurity course: four grades, Freshman to Senior.
   Content model: LEVELS -> units -> blocks. Interactive blocks carry an id;
   progress for each id is kept in localStorage (if available).
   Learning design: Bloom's revised taxonomy (Anderson & Krathwohl, 2001):
   Remember, Understand, Apply, Analyze, Evaluate, Create.
   Frameworks: NICE Workforce Framework (work roles), CIS Critical Security
   Controls v8.1 (hardening areas), NIST Cybersecurity Framework 2.0.
   ========================================================== */
'use strict';

/* ---- block constructors ---- */
const C=(title,bloom,...parts)=>({t:'c',title,bloom,parts});
const P=(html)=>({t:'p',html});
const TIPS=(...items)=>({t:'tips',items});
const CMDS=(title,rows)=>({t:'cmds',title,rows});
const TERM=(text)=>({t:'term',text});
const NOTE=(html,warn)=>({t:'note',html,warn:!!warn});
const FLASH=(id,title,cards)=>({t:'flash',id,title,cards});
const QUIZ=(id,title,items)=>({t:'quiz',id,title,items});
const MATCH=(id,title,intro,pairs,bloom)=>({t:'match',id,title,intro,pairs,bloom});
const SPOT=(id,title,intro,lines)=>({t:'spot',id,title,intro,lines});
const ORDER=(id,title,intro,items,bloom,o)=>({t:'order',id,title,intro,items,bloom,o:o||{}});
const LAB=(id,title,intro,steps)=>({t:'lab',id,title,intro,steps});
const REFLECT=(id,title,prompt,checks)=>({t:'reflect',id,title,prompt,checks});
const BUILDER=(id,title,intro,sections)=>({t:'builder',id,title,intro,sections});
const PLANNER=(id)=>({t:'planner',id});
const TIMER=(id)=>({t:'timer',id});
const LINKS=(title,keys)=>({t:'links',title,keys});
const DETAIL=(title,...parts)=>({t:'detail',title,parts});
const TYPEIN=(id,title,intro,code,accept,why,o)=>({t:'typein',id,title,intro,code,accept,why,o:o||{}});

/* ---- visual block constructors (data only; the renderers draw them) ----
   Use one on its own in a unit's blocks (it becomes a card with the title as its heading),
   or inside C(...) as a part (pass null as the title, or a title for a small subheading).
   Every visual draws only with the colour tokens, reflows to a phone's width, prints a
   caption, and ends with a "Read it as text" alternative built from the same data.

   Tones (colour of a column, box, layer, or cell): 'l1', 'l2', 'l3', 'l4' (the ladder
   blues, light to deep), 'muted', 'ok', 'bad', and 'amber'. Colour is always a second cue:
   every coloured thing also carries a written label.

   Options shared by every visual (the last argument, o; all optional):
     intro:   a sentence above the figure that says what to notice.
     caption: the figure caption (defaults to the title).
     note:    a boxed aside under the figure.
     key:     [[tone,'what this colour means'], ...], a written legend.
     label:   a one-sentence summary for screen readers (generated when left out).
     alt:     the "Read it as text" content, replacing the generated text: an HTML
              string, or an array of strings for a numbered list.
     bloom:   the Bloom level badge on the card (default 'Understand').
   Text fields accept the same small HTML as cards (<b>, <code>, <br>).

   svg (COMPARE columns, ANATOMY boxes): {body:'<path .../>', label:'what it shows',
     view:'0 0 200 74', width:46, height:16}. body is inner SVG markup drawn in a 200 x 74
     box unless view says otherwise; it fills the column's width unless width and height
     (pixels) fix its size. Colour it with tokens, such as stroke="var(--l2)". Arrowheads:
     marker-end="url(#arrow)" (ink grey) or url(#arrow-l2), url(#arrow-ok), and so on for
     any tone; each figure gets its own copies. With a label the drawing is announced
     (role="img"); without one it is decoration (aria-hidden).

   COMPARE(title, cols, o): two to four things side by side.
     cols: [{name, tag, tone, svg, rows:[[label,text],...], hook}, ...]
     hook prints as "Remember it as: ...".
     COMPARE('TCP and UDP',[
       {name:'TCP',tag:'Layer 4',tone:'l2',rows:[['Sets up','A connection with a three-way handshake'],['Delivers','In order, retransmitting losses']],hook:'a phone call'},
       {name:'UDP',tag:'Layer 4',tone:'l3',rows:[['Sets up','Nothing: each datagram travels alone'],['Delivers','Fast, without a delivery guarantee']],hook:'a postcard'}
     ],{caption:'Both carry port numbers; they differ in how much they promise.'})

   ANATOMY(title, boxes, o): labelled boxes nested inside each other.
     boxes: [box, ...], drawn top to bottom. A box is
       {name, tag, tone, head:['Header title','line',...], trail:['Trailer title','line',...],
        panel:['Panel title','text',...], text, svg, children:[box,...], grid:true}
     head and trail sit left and right of the children (above and below on phones);
     panel is a dashed note inside the box; grid:true lays the children out as small tiles.
     {core:true, name, sub} is the solid innermost box (the payload).
     Extra options: strip:['Label','text','text version'] (a band under the boxes, such as bits;
     the optional third item replaces the text in "Read it as text"), and
     facts:{head:['','Column A','Column B'], rows:[['Row','a','b'],...]} (a table beside the boxes).
     ANATOMY('An IP packet',[
       {name:'Packet',tag:'Layer 3',tone:'l3',head:['IP header','Source IP','Destination IP','TTL'],
        children:[{core:true,name:'Payload',sub:'a TCP segment or a UDP datagram'}]}
     ],{caption:'The IP header travels in front of the payload.'})

   STACK(title, stacks, o): ordered layers, top first; several stacks line up row by row.
     stacks: [{name, tone, numbered:true, layers:[[label, note, span, tone], ...]}, ...]
     span (default 1) is how many rows of the other stacks a layer covers; numbered counts
     from the bottom layer (1) upward.
     STACK('OSI and TCP/IP',[
       {name:'OSI',numbered:true,layers:[['Application','',1,'l1'],['Presentation','',1,'l1'],['Session','',1,'l1'],['Transport','TCP, UDP',1,'l2'],['Network','IP',1,'l3'],['Data link','Ethernet',1,'l4'],['Physical','Signals',1,'l4']]},
       {name:'TCP/IP',layers:[['Application','HTTP, DNS, SSH',3,'l1'],['Transport','TCP, UDP',1,'l2'],['Internet','IPv4, IPv6',1,'l3'],['Link','Ethernet, Wi-Fi',2,'l4']]}
     ],{caption:'TCP/IP folds three OSI layers into Application and two into Link.'})

   PATH(title, hops, o): left-to-right hops (top to bottom on phones). Up to three hops sit side by side
     once the figure is 600px wide, four once it is 900px wide; five or more always run top to bottom.
     hops: [{name, tag, tone, note:'text' or ['line',...], via:'label on the arrow to the next hop'}, ...]
     PATH('A web request leaves the LAN',[
       {name:'Laptop',tag:'10.0.1.20',tone:'l1',note:'Sends to its default gateway',via:'Frame to the gateway MAC'},
       {name:'Switch',tag:'Layer 2',tone:'l2',note:'Reads the destination MAC',via:'Out one port'},
       {name:'Router',tag:'Layer 3',tone:'l3',note:'Reads the destination IP'}
     ],{caption:'Each hop reads the address that belongs to its layer.'})

   SEQ(title, steps, o): numbered steps; any step can be a decision.
     steps: [[label, detail], ..., {ask:'Question?', detail, branches:[['Yes','then...'],['No','then...']]}]
     SEQ('Handle a listening port',[
       ['List listeners','ss -tulnp or netstat -ano'],
       ['Name the program','Match each port to its process'],
       {ask:'Does the brief require it?',branches:[['Yes','Harden and keep it'],['No','Stop, disable, and remove it']]}
     ],{caption:'Explain every port before you move on.'})

   HIER(title, root, o): a tree, or a precedence ladder.
     Tree: root = {name, note, tone, children:[...same shape...]}
     Ladder: root = [[name, note, tone], ...], the strongest first; o.top and o.bottom
     name the two ends (defaults 'Wins' and 'Yields').
     HIER('Group Policy order',[['Organizational unit','Applied last','l4'],['Domain','','l3'],['Site','','l2'],['Local','Applied first','l1']],
       {top:'Wins',bottom:'Yields',caption:'The last policy applied wins a conflict.'})

   VENN(title, sets, o): two or three overlapping sets.
     sets: [{name, tone, items:['only in this set',...]}, ...]; names stay short (16 characters or so).
     o.overlaps: [{sets:'AB', items:[...]}, {sets:'ABC', items:[...]}]; A, B, and C follow the order of sets.
     VENN('Authentication factors',[
       {name:'Something you know',tone:'l1',items:['Password','PIN']},
       {name:'Something you have',tone:'l3',items:['Security key','Phone app']}
     ],{overlaps:[{sets:'AB',items:['Multi-factor sign-in uses both']}],caption:'Two different factors make MFA.'})

   SCALE(title, spec, o): a range of bands, or a matrix.
     Range: spec = {from:'Low end', to:'High end', bands:[[label, note, tone, weight], ...]}
     (weight, default 1, sets a band's share of the width).
     Matrix: spec = {x:['Axis name','low tick',...,'high tick'], y:['Axis name','top tick',...,'bottom tick'],
       cells:[[cell, ...], ...]} with rows top first and columns left first; a cell is
       [title, note, tone] or a string.
     SCALE('Impact and effort',{x:['Effort','Low','High'],y:['Impact','High','Low'],
       cells:[[['Do first','Quick wins','ok'],['Plan','Big projects','l2']],[['Fill in','Small tidy-ups','muted'],['Question','Costly, small gain','amber']]]},
       {caption:'Start top left: high impact for little effort.'})
*/
const COMPARE=(title,cols,o)=>({t:'compare',title,cols,o:o||{}});
const ANATOMY=(title,boxes,o)=>({t:'anatomy',title,boxes,o:o||{}});
const STACK=(title,stacks,o)=>({t:'stack',title,stacks,o:o||{}});
const PATH=(title,hops,o)=>({t:'path',title,hops,o:o||{}});
const SEQ=(title,steps,o)=>({t:'seq',title,steps,o:o||{}});
const HIER=(title,root,o)=>({t:'hier',title,root,o:o||{}});
const VENN=(title,sets,o)=>({t:'venn',title,sets,o:o||{}});
const SCALE=(title,spec,o)=>({t:'scale',title,spec,o:o||{}});

/* ---- Tool4That hub (edit these if paths change) ---- */
const HUB='https://freeapp4that.store/';

/* ---- master resource list: key -> [name, url, one-line why, kind] ----
   kinds: vendor (makers of the software, their own docs and training),
   standard (consensus or government frameworks and benchmarks),
   community (free, well-regarded), practice (hands-on platforms),
   tool4that (practice tools on this site) */
const RES={
  'netacad':['Cisco Networking Academy','https://www.netacad.com/','Free self-paced courses from Cisco, from networking basics to cybersecurity. Needs a free account.','vendor'],
  'pt':['Cisco Packet Tracer','https://www.netacad.com/cisco-packet-tracer','Cisco’s free network simulator: build and configure virtual routers, switches, and PCs with the real IOS command line. Download after a free NetAcad sign-up.','vendor'],
  'ms-win-sec':['Microsoft Learn: Windows security','https://learn.microsoft.com/en-us/windows/security/','Primary source for Defender, firewall, account policy, BitLocker, and audit settings.','vendor'],
  'ms-uac':['Microsoft Learn: User Account Control','https://learn.microsoft.com/en-us/windows/security/application-security/application-control/user-account-control/','How UAC works, every UAC policy setting, its default, and its registry value.','vendor'],
  'ms-icacls':['Microsoft Learn: icacls','https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/icacls','Command reference for viewing and changing NTFS permissions, including inheritance flags.','vendor'],
  'ms-baselines':['Microsoft security baselines','https://learn.microsoft.com/en-us/windows/security/operating-system-security/device-management/windows-security-configuration-framework/windows-security-baselines','Microsoft’s recommended security settings for Windows and Windows Server. A good seed for your own checklist.','vendor'],
  'ms-ps':['PowerShell documentation','https://learn.microsoft.com/en-us/powershell/','Every cmdlet, with examples. Search a cmdlet name plus "Microsoft Learn".','vendor'],
  'ms-sysint':['Sysinternals (Autoruns, Process Explorer, TCPView)','https://learn.microsoft.com/en-us/sysinternals/','Free Microsoft tools for finding persistence and odd processes.','vendor'],
  'ms-winsrv':['Windows Server documentation','https://learn.microsoft.com/en-us/windows-server/','Active Directory, Group Policy, DNS, DHCP, IIS, roles, and features.','vendor'],
  'ubuntu-sec':['Ubuntu security','https://ubuntu.com/security','Canonical’s security hub: Ubuntu Security Notices, the CVE tracker, and platform security features.','vendor'],
  'ubuntu-server':['Ubuntu Server documentation','https://ubuntu.com/server/docs','Services, networking, users, ufw, and SSH, written by the vendor.','vendor'],

const PART='senior';
function inPart(id){ return !PART||PART===id; }
/* the first lesson: the first grade this page holds, from its index entry before its data arrives */

/* ---- progressive loading ----
   The page arrives as five scripts, in order: this core (the block constructors, RES, the study plan, the
   hardening areas, the Freshman grade, the app, and boot), then one script each for Sophomore, Junior, and
   Senior, then the glossary. Each later script calls LADDER.addLevel or LADDER.addGlossary, so the first lesson
   draws as soon as this script has run. GRADE_INDEX names every grade and its unit ids before the grade's data
   arrives, so the rail, the pager, #grade/unit links, and the study plan know every grade from the start; a view
   that needs data still on its way shows a short "Loading" status and draws when the data arrives. */
const LADDER={
  live:false,glossary:false,
  addLevel(lv){
    const rank=id=>{const i=GRADE_INDEX.findIndex(g=>g.id===id);return i<0?GRADE_INDEX.length:i;};
    const had=LEVELS.findIndex(l=>l.id===lv.id); if(had>=0) LEVELS.splice(had,1);
    let at=LEVELS.findIndex(l=>rank(l.id)>rank(lv.id)); if(at<0) at=LEVELS.length;
    LEVELS.splice(at,0,lv);
    if(LADDER.live) dataArrived();
  },
  addGlossary(list){
    list.forEach(g=>GLOSSARY.push(g));
    LADDER.glossary=true;
    if(LADDER.live) glossaryArrived();
  },
  allLevels(){ return GRADE_INDEX.every(g=>!inPart(g.id)||LEVELS.some(l=>l.id===g.id)); }
};

/* progress is keyed by activity id. A save reads what is stored now (another tab may have saved since),
   lays this tab's changed ids over it, and writes the result, so two open tabs keep each other's work. */
function readSaved(){
  try{ const r=localStorage.getItem(KEY); const v=r?JSON.parse(r):{}; return v&&typeof v==='object'&&!Array.isArray(v)?v:{}; }
  catch(e){ return null; }
}
const store={
  load(){ const v=readSaved(); if(v) MEM=v; return MEM; },
  save(ids){
    const cur=readSaved();
    if(cur){ ids.forEach(id=>{ if(MEM[id]===undefined) delete cur[id]; else cur[id]=MEM[id]; }); MEM=cur; }
    try{ localStorage.setItem(KEY,JSON.stringify(MEM)); store.ok=true; }catch(e){ store.ok=false; }
    if(store.onHealth) store.onHealth();
  },
  get(id){ return MEM[id]; },
  set(id,v){ MEM[id]=v; this.save([id]); },
  setMany(o){ Object.assign(MEM,o); this.save(Object.keys(o)); },
  clear(){ MEM={}; try{ localStorage.setItem(KEY,'{}'); store.ok=true; }catch(e){ store.ok=false; } }
};

const TONES={l1:['--l1','--tint1'],l2:['--l2','--tint2'],l3:['--l3','--tint3'],l4:['--l4','--tint4'],muted:['--ink-3','--paper-2'],ok:['--ok','--ok-bg'],bad:['--bad','--bad-bg'],amber:['--amber','--amber-bg']};

    if(!st.length) return m;

/* ---- ANATOMY ---- */
function anatBox(x){

  const fld=(f,cls)=>f&&f.length?`<div class="${cls}"><b>${f[0]}</b>${f.slice(1).join('<br>')}</div>`:'';
  const kids=(x.children||[]).map(anatBox).join('');
  /* tiles are at least as wide as their longest word or name (up to 30 characters; code is wider per character), so

  const CODE=/<(code|samp|kbd)\b[^>]*>[\s\S]*?<\/\1>|<span class="mono">[\s\S]*?<\/span>/g;
  const longest=s=>Math.min(30,Math.max(0,...s.replace(/<[^>]*>/g,' ').split(/\s+/).map(w=>w.length)));
  const need=Math.max(longest((kids.match(CODE)||[]).join(' '))*.48,longest(kids.replace(CODE,' '))*.42,longest((x.children||[]).map(c=>c.name||'').join(' '))*.5);

  const body=(x.head||x.trail)?`<div class="v-arow">${fld(x.head,'v-hdr')}<div class="v-inner">${inner}</div>${fld(x.trail,'v-trl')}</div>`:(inner?`<div class="v-inner">${inner}</div>`:'');
  return `<div class="v-box" style="${toneCss(x.tone,'l2')}"><div class="v-blabel"><span>${x.name||''}</span>${x.tag?`<span class="v-tag">${x.tag}</span>`:''}</div>`+
    (x.text?`<div class="v-btxt">${x.text}</div>`:'')+body+svgHtml(x.svg)+'</div>';
}
function anatAlt(x){
  if(x.core) return `<li>${x.name||''}${x.sub?': '+x.sub:''}</li>`;
  const f=(a)=>a&&a.length?` ${a[0]}: ${dot(andList(a.slice(1).map(plain)))}`:'';
  const kids=(x.children||[]).map(anatAlt).join('');
  return `<li><b>${x.name||''}</b>${x.tag?' ('+x.tag+')':''}.${x.text?' '+dot(plain(x.text)):''}${f(x.head)}${f(x.panel)}${f(x.trail)}${kids?' Inside it:<ul>'+kids+'</ul>':''}</li>`;

function anatSay(x){

function renderAnatomy(b,inCard){

/* ---- STACK ---- */

/* ---- quiz: a growth check ----
   An item is [question, options, correctIndex, why], with an optional fifth element {whys, imp, c}: whys holds one
   reason per option (why it is right, or why another answer fits better), imp is 'core' (Core skill) or 'good'
   (Good to know), and c names the item's Study Map concept. Only a Check button grades: "I'm sure" or "I'm guessing";
   choosing an option, or moving through the options with the arrow keys, never grades. The first checked answer
   and its confidence set the item's result: Strong (right and sure), Revisit (right on a guess), or Explore (worth
   learning next). After a check every option opens its reason, which never changes the result. "Try this quiz again"
   stores each later attempt apart: it never lowers a result, raises it to Revisit at most on the first check's day,
   and to Strong only on another day. The end of the quiz lists "Where to invest next". Saved as {done, score, total,
   r}; older {done, score, total} records keep their completion and score, which only ever rise. ---- */
const RESULT=['Explore','Revisit','Strong'];
/* today's calendar day in this browser, as YYYYMMDD: a later check on another day can make an item Strong */
function quizDay(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function quizMeta(it){ const m=it&&it[4]; return m&&typeof m==='object'&&!Array.isArray(m)?m:{}; }
/* r[i] is [first answer, sure (1 or 0), result (0 to 2), later attempts, the first check's day (YYYYMMDD)]. Later
   attempts ([answer, sure, day], the last five) sit apart and never change the first answer. An older
   [answer, sure, result] record reads as checked on an earlier day. */
function quizRecord(b){
  const s=store.get(b.id);
  const rec=s&&typeof s==='object'&&!Array.isArray(s)?Object.assign({},s):{};
  const r=Array.isArray(rec.r)?rec.r.slice(0,b.items.length):[];
  for(let i=0;i<b.items.length;i++){
    const x=r[i], n=b.items[i][1].length, okAns=a=>Number.isInteger(a)&&a>=0&&a<n;
    if(!(Array.isArray(x)&&okAns(x[0]))){ r[i]=null; continue; }
    const later=Array.isArray(x[3])?x[3].filter(a=>Array.isArray(a)&&okAns(a[0])).slice(-5).map(a=>[a[0],a[1]?1:0,Number.isInteger(a[2])?a[2]:0]):[];
    r[i]=[x[0],x[1]?1:0,Math.max(0,Math.min(2,x[2]|0)),later,Number.isInteger(x[4])?x[4]:0];
  }
  rec.r=r;
  return rec;
}
/* the first check sets the item's result. A later attempt never lowers it; on the first check's calendar day it raises
   the result to Revisit at most, and Strong needs a later check on another day (spaced retrieval). quizCapped tells
   the caller that this attempt was right and sure, and Strong now waits for another day. */
let quizCapped=false;
function quizSaveItem(b,qi,ans,sure){
  store.load();
  const rec=quizRecord(b), today=quizDay();
  const nat=ans===b.items[qi][2]?(sure?2:1):0;
  const was=rec.r[qi];
  quizCapped=false;
  if(!was) rec.r[qi]=[ans,sure?1:0,nat,[],today];
  else{
    const sameDay=!!was[4]&&was[4]===today, lv=sameDay?Math.min(nat,1):nat;
    quizCapped=sameDay&&nat>lv&&was[2]<nat;
    rec.r[qi]=[was[0],was[1],Math.max(was[2],lv),was[3].concat([[ans,sure?1:0,today]]).slice(-5),was[4]];
  }
  const T=b.items.length, n=rec.r.filter(Boolean).length, right=rec.r.filter(x=>x&&x[2]>=1).length;
  if(n===T){
    if(!(rec.total>0)||!(rec.score>=0)||right/T>=rec.score/rec.total){ rec.score=right; rec.total=T; }
    rec.done=true;
  }
  store.set(b.id,rec);
  refreshChrome();
  return rec;
}
/* an item that waits for another day: a later attempt was right and sure, and the result is still short of Strong */
function quizWaits(it,x){ return !!x&&x[2]<2&&Array.isArray(x[3])&&x[3].some(a=>a[0]===it[2]&&a[1]); }
const shortText=(s,n)=>{ s=plain(s); if(s.length<=n) return s; const k=s.lastIndexOf(' ',n); return s.slice(0,k>20?k:n)+'…'; };
/* the unit that teaches an item: its first #grade/unit link, or the unit this quiz sits in */
function teachLink(it){
  const m=quizMeta(it);
  const src=[it[3]].concat(Array.isArray(m.whys)?m.whys:[]).join(' ');
  const x=/href="#([a-z]+)\/([a-z]+[0-9]+)"[^>]*>([^<]*)</.exec(src);
  if(x){
    const L=levelById(x[1]), U=L&&L.units.find(u=>u.id===x[2]);
    return {href:'#'+x[1]+'/'+x[2],text:'Review: '+(U?U.title:plain(x[3]).replace(/^Review:\s*/,''))};
  }
  if(current.page==='level'){
    const L=levelById(current.level), U=L&&L.units.find(u=>u.id===current.unit);
    if(U) return {href:'#'+L.id+'/'+U.id,text:'Review: '+U.title};
  }
  return null;
}

function smapName(id){ const s=String(id||''); return SMAP_NAMES[s]||s.replace(/^[a-z]+-/,'').replace(/-/g,' ').replace(/^./,c=>c.toUpperCase()); }
/* "Where to invest next": items short of Strong (items that share a Study Map concept make one entry); Core skills
   first, then items without a tag, then Good to know; Explore before Revisit. Each entry leads with its concept's
   name and keeps the question as a second line; entries sit under the unit that teaches them, and a unit's group
   sits where its first entry falls. */
const IMP_RANK={core:0,good:2};
function investGroups(list,unitOf){
  const groups=[], by={};
  list.forEach(e=>{ const u=unitOf(e)||null, k=u?u.href:''; if(!by[k]){ by[k]={u,items:[]}; groups.push(by[k]); } by[k].items.push(e); });
  return groups;
}
function investEntry(e){
  const li=el('li');
  const imp=e.imp===0?'<span class="imp imp-core">Core skill</span>':e.imp===2?'<span class="imp imp-good">Good to know</span>':'';
  const q=shortText(e.it[0],120);
  li.innerHTML=`<span class="iname">${e.m.c?esc(smapName(e.m.c)):q}</span> <span class="lvtag">${RESULT[e.lv]}</span>${imp}`+
    (e.m.c?`<span class="iq">${q}</span>`:'')+
    (e.wait?'<span class="inote">Right and sure on a later try: a check on another day makes it Strong.</span>':'');
  if(e.m.c){
    const go=el('span','go'), s=el('a',null,esc('Study Map: '+smapName(e.m.c)+' (online)'));
    s.href=HUB+'study-map/#c='+encodeURIComponent(e.m.c); s.target='_blank'; s.rel='noopener noreferrer';
    go.appendChild(s); li.appendChild(go);
  }
  return li;
}
function investGroupEl(g){
  const li=el('li','ig'), h=el('p','igh');
  if(g.u){ const a=el('a',null,esc(titleText(g.u.text))); a.href=g.u.href; h.appendChild(a); } else h.textContent='More to review';
  const ul=el('ul','ies'); g.items.forEach(e=>ul.appendChild(investEntry(e)));
  li.append(h,ul);
  return li;
}
function quizInvest(b,r,box){
  if(/^check yourself/i.test(titleText(b.title))){ quizReread(b,r,box); return; }
  const seen={},list=[];
  b.items.forEach((it,qi)=>{
    const x=r[qi]; if(!x||x[2]>=2) return;
    const m=quizMeta(it), key=m.c?'c:'+m.c:'q:'+qi, imp=IMP_RANK[m.imp]!=null?IMP_RANK[m.imp]:1, wait=quizWaits(it,x);
    if(seen[key]){ const e=seen[key]; e.lv=Math.min(e.lv,x[2]); e.imp=Math.min(e.imp,imp); e.wait=e.wait&&wait; return; }
    seen[key]={qi,lv:x[2],imp,m,it,wait}; list.push(seen[key]);
  });
  list.sort((a,c)=>a.imp-c.imp||a.lv-c.lv||a.qi-c.qi);
  box.innerHTML='';
  box.hidden=false;
  box.appendChild(el('h4',null,'Where to invest next'));
  if(!list.length){ box.appendChild(el('p',null,'Every answer here is Strong. Carry it into the next unit.')); return; }
  box.appendChild(el('p','sum','Start at the top: Core skills come first, then the rest. Each entry names its concept, under the unit that teaches it.'));
  const ol=el('ol','igs');
  investGroups(list,e=>teachLink(e.it)).forEach(g=>ol.appendChild(investGroupEl(g)));
  box.appendChild(ol);
}
/* a "Check yourself" quiz points back at the block right before it while an answer is short of Strong */
function quizReread(b,r,box){
  box.innerHTML='';
  const L=current.page==='level'?levelById(current.level):null, U=L&&L.units.find(u=>u.id===current.unit), i=U?U.blocks.indexOf(b):-1;
  if(!r.some(x=>x&&x[2]<2)||i<1){ box.hidden=true; return; }
  const id='sec-'+U.id+'-'+(i-1);
  const a=el('a','reread-go',esc('Re-read: '+flowLabel(U.blocks[i-1])));
  a.href='#'+L.id+'/'+U.id;
  a.addEventListener('click',e=>{ if(e.button||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey) return; e.preventDefault(); const t=document.getElementById(id); if(t){ flowReveal(t); jumpTo(t); } });
  box.className='invest reread';
  box.hidden=false;
  box.appendChild(a);
}
function renderQuiz(b,fresh){
  const c=el('div','card quiz');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Check</span>`));
  c.appendChild(el('p','sum qhelp','Choose an answer, then check it: “I’m sure” or “I’m guessing”. Then every option shows its reason.'));
  const rec0=quizRecord(b);
  const shown=new Array(b.items.length).fill(null);
  const foot=el('div','row qfoot');
  const score=el('span','pill');score.setAttribute('role','status');
  const again=el('button','btn sec sm','Try this quiz again');again.type='button';
  const invest=el('div','invest');invest.hidden=true;
  const DESC=['worth learning next; the reasons are open on the options above.','right on a guess, so it is worth another look.','right, and you were sure.'];
  b.items.forEach((it,qi)=>{
    const [q,opts,correct,why]=it, meta=quizMeta(it);
    const whys=Array.isArray(meta.whys)&&meta.whys.length===opts.length?meta.whys:null;
    const q1=el('div','q');q1.setAttribute('role','group');
    const qt=el('div','qt',`${qi+1}. ${q}`);qt.id=b.id+'-q'+qi;q1.setAttribute('aria-labelledby',qt.id);
    if(meta.imp==='core'||meta.imp==='good') qt.appendChild(el('span','imp imp-'+meta.imp,meta.imp==='core'?'Core skill':'Good to know'));
    q1.appendChild(qt);
    const labs=opts.map((opt,oi)=>{
      const lab=el('label','opt');
      lab.innerHTML=`<input type="radio" name="${b.id}-${qi}" value="${oi}"><span class="ot">${opt}</span>`;
      const ow=el('span','owhy');ow.hidden=true;lab.appendChild(ow);
      lab.querySelector('input').addEventListener('change',()=>{ if(shown[qi]) openWhy(oi); });
      q1.appendChild(lab);
      return lab;
    });
    const row=el('div','row qrow');
    const sure=el('button','btn sm','Check: I’m sure');sure.type='button';
    const guess=el('button','btn sec sm','Check: I’m guessing');guess.type='button';
    const res=el('span','pill qres');res.setAttribute('role','status');
    row.append(sure,guess,res);
    const whyBox=el('div','why',why);whyBox.hidden=true;
    q1.append(row,whyBox);
    /* the correct option's reason drops a leading "Right:"; the student's own other choice reads "What this option does:" */
    function openWhy(oi){
      if(!whys) return;
      const ow=labs[oi].querySelector('.owhy');
      const mine=shown[qi]?shown[qi][0]:-1;
      const lab=oi===correct?'Why it is right:':oi===mine?'What this option does:':'Why another answer fits better:';
      let w=String(whys[oi]);
      if(oi===correct) w=w.replace(/^Right[:,.]?\s*/,'').replace(/^[a-z]/,ch=>ch.toUpperCase());
      ow.innerHTML=`<b>${lab}</b> ${w}`;
      ow.hidden=false;
    }
    /* first: the answer shown; lv: the map's result; att: null for a first check (or a restore), 'later' for a later
       attempt, and 'wait' for a later attempt right and sure on the first check's day */
    function showChecked(first,lv,att){
      labs.forEach((l,k)=>{ l.classList.toggle('right',k===correct); l.classList.toggle('wrong',k===first[0]&&first[0]!==correct); });
      whyBox.hidden=false;
      openWhy(first[0]); if(first[0]!==correct) openWhy(correct);
      sure.hidden=true;guess.hidden=true;
      const nat=first[0]===correct?(first[1]?2:1):0;
      res.className='pill qres lv'+lv;
      let t;
      if(!att) t=RESULT[lv]+': '+(lv>nat?'raised on a later try.':DESC[lv])+(quizWaits(it,first)?' A check on another day can make it Strong.':'');
      else{ const d=DESC[nat]; t=d.charAt(0).toUpperCase()+d.slice(1)+' Your map '+(lv>nat?'keeps ':'shows ')+RESULT[lv]+(att==='wait'?' until a check on another day makes it Strong.':'.'); }
      res.textContent=t+(whys?' Choose any other option to read its reason.':'');
    }
    function check(isSure){
      const sel=labs.findIndex(l=>l.querySelector('input').checked);
      if(sel<0){ res.className='pill qres'; res.textContent='Choose an answer first, then check it.'; return; }
      const had=!!quizRecord(b).r[qi];
      const rec=quizSaveItem(b,qi,sel,isSure);
      shown[qi]=[sel,isSure?1:0];
      showChecked(shown[qi],rec.r[qi][2],had?(quizCapped?'wait':'later'):null);
      labs[sel].querySelector('input').focus();
      drawFoot();
    }
    sure.addEventListener('click',()=>check(true));
    guess.addEventListener('click',()=>check(false));
    const was=rec0.r[qi];
    if(was&&!fresh){ shown[qi]=was; labs[was[0]].querySelector('input').checked=true; showChecked(was,was[2],null); }
    c.appendChild(q1);
  });
  again.addEventListener('click',()=>{ const n=renderQuiz(b,true); renderReplace(c,n); const f=n.querySelector('input[type=radio]'); if(f) f.focus(); });
  foot.append(score,again);
  c.append(foot,invest);
  function drawFoot(){
    const rec=quizRecord(b), r=rec.r, T=b.items.length;
    const n=r.filter(Boolean).length, cnt=[0,0,0];
    r.forEach(x=>{ if(x) cnt[x[2]]++; });

    else if(!n){ score.textContent=`${T} item${T===1?'':'s'} to check`; score.className='pill'; }
    else { score.textContent=(n<T?`Checked ${n} of ${T}. `:'Your map: ')+`Strong ${cnt[2]}, Revisit ${cnt[1]}, Explore ${cnt[0]}`; score.className='pill'+(cnt[2]===T?' ok':''); }
    if(n===T) quizInvest(b,r,invest); else invest.hidden=true;

}

/* ---- match: choose an item, then its partner; every step updates the status. A matched pair reads "Pair N" on both
   items, the pressed item reads "Selected", and a miss shows its status and reason right under the tapped partner
   (the status line reads the reason to screen readers too) ---- */
function renderMatch(b){

/* ---- spot the problem: each line is a button (pressed = flagged); after Check each line's reason opens right
   under it. A line is [text, null | why it weakens the system, optional why a safe line is fine]. ---- */
function renderSpot(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">Analyze</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));
  const box=el('div','spot');
  const list=el('div','sp-lines');
  list.setAttribute('role','group');list.setAttribute('aria-label','Lines to review. Press a line to flag it.');
  const flagged=new Set();
  let checked=false;
  const row=el('div','row');
  const check=el('button','btn sm','Check');check.type='button';
  const reset=el('button','btn sec sm','Reset');reset.type='button';
  const pill=el('span','pill');pill.setAttribute('role','status');
  const say=(t,cls)=>{ pill.textContent=t; pill.className='pill'+(cls?' '+cls:''); };
  const rows=b.lines.map((ln,i)=>{
    const L=Array.isArray(ln)?ln:[ln,null];
    const text=String(L[0]==null?'':L[0]), why=L[1], fine=L[2];
    const btn=el('button','sl');btn.type='button';btn.setAttribute('aria-pressed','false');
    btn.innerHTML=`<span class="sl-t">${spotText(text)||' '}</span><span class="sl-tag"></span>`;
    const ex=el('div','sl-why');ex.hidden=true;
    btn.addEventListener('click',()=>{
      if(checked) return;
      const on=!flagged.has(i);
      if(on) flagged.add(i); else flagged.delete(i);
      btn.classList.toggle('flag',on);
      btn.setAttribute('aria-pressed',on?'true':'false');
      btn.querySelector('.sl-tag').textContent=on?'Flagged':'';
      say(`${flagged.size} line${flagged.size===1?'':'s'} flagged`);
    });
    const r=el('div','sp-row');r.append(btn,ex);list.appendChild(r);
    return {btn,ex,why,fine,text};
  });
  box.appendChild(list);
  c.appendChild(box);
  row.append(check,reset,pill);
  c.appendChild(row);
  c.appendChild(el('div','legend','After Check, each finding’s reason opens right under its line.'));
  check.addEventListener('click',()=>{
    checked=true;box.dataset.checked='1';
    let hits=0,total=0;
    rows.forEach((r,i)=>{
      const on=flagged.has(i), tag=r.btn.querySelector('.sl-tag');
      r.btn.className='sl';r.btn.setAttribute('aria-disabled','true');
      if(r.why){
        total++;
        if(on){ hits++; r.btn.classList.add('hit'); tag.textContent='✓ Found'; }
        else { r.btn.classList.add('miss'); tag.textContent='Finding: read why'; }
        r.ex.innerHTML=r.why; r.ex.className='sl-why is-find'; r.ex.hidden=false;
      } else if(on){
        r.btn.classList.add('false'); tag.textContent='Safe line';
        r.ex.innerHTML=r.fine||(SPOT_PROMPT.test(r.text)?'A prompt line names the command; the evidence is in the output under it.':'This line is safe as written.'); r.ex.className='sl-why'; r.ex.hidden=false;
      } else tag.textContent='';
    });
    const falses=[...flagged].filter(i=>!rows[i].why).length;
    say(`Found ${hits} of ${total} findings`+(falses?`; ${falses} safe line${falses>1?'s':''} flagged`:''),hits===total&&!falses?'ok':'');
    if(hits===total&&!falses){ store.set(b.id,{done:true}); refreshChrome(); }
  });
  reset.addEventListener('click',()=>{ const n=renderSpot(b); renderReplace(c,n); const f=n.querySelector('.sl'); if(f) f.focus(); });
  if(isDone(b.id)) say('Completed before.','ok');
  return c;
}
/* a redrawn block keeps its place: its outline id, its section, and its Read aloud button */
function renderReplace(oldNode,newNode){
  if(oldNode.id&&!newNode.id) newNode.id=oldNode.id;
  ['sx','sxh'].forEach(k=>{ if(oldNode.dataset[k]!=null) newNode.dataset[k]=oldNode.dataset[k]; });
  if(oldNode.classList.contains('sx-off')) newNode.classList.add('sx-off');
  oldNode.replaceWith(newNode);
  if(newNode.parentElement===main) flowRaAdd(newNode);
}

/* ---- order / sequence: tap steps into place, then Check. Every step shows its reason after a check. On the first
   failed check a step to move says only which way it goes ("Comes earlier" or "Comes later"); from the second failed
   check on it names the step where it belongs, and the full order opens on request. Marks stay with their step, so
   taking one step out clears only its own mark; the full order stays until the next Check. Focus stays on the list
   after every tap. ---- */
/* a layer stack (o.layers) is built from the top down and numbered the same way, so the first pick is layer N
   (layer 7 for OSI) and each number names the layer that belongs there; other orders number their steps from 1 */
function renderOrder(b){
  const c=el('div','card');
  c.appendChild(el('h3',null,`${b.title}<span class="blm">${b.bloom||'Apply'}</span>`));
  if(b.intro) c.appendChild(el('p','sum',b.intro));
  const N=b.items.length, L=!!(b.o&&b.o.layers), noun=L?'layer':'step', num=pos=>L?N-pos:pos+1;
  const wrap=el('div','ord');
  const poolH=el('h4',null,L?'Layers (tap to add, from the top down)':'Steps (tap to add in order)');
  const pool=el('div','pool');
  const seqH=el('h4',null,L?'Your stack, top to bottom':'Your sequence');
  const seq=el('div','seq');
  wrap.append(poolH,pool,seqH,seq);
  c.appendChild(wrap);
  const order=shuffle(b.items.map((it,i)=>({it,i})));
  /* marks: each step's result from the last Check, by step; fails: the failed checks so far */
  let chosen=[], marks=new Map(), fails=0;
  const grp=i=>(b.items[i][2]!=null?b.items[i][2]:i);
  const spots=ci=>b.items.map((x,k)=>k).filter(k=>grp(k)===grp(ci));
  const row=el('div','row');
  const check=el('button','btn sm','Check order');check.type='button';
  const reset=el('button','btn sec sm','Reset');reset.type='button';
  const count=el('span','pill ocount');count.setAttribute('aria-live','polite');
  const pill=el('span','pill');pill.setAttribute('role','status');
  row.append(check,reset,count,pill);
  c.appendChild(row);
  const whyWrap=el('div');c.appendChild(whyWrap);
  /* after a redraw, focus goes to the button now at the tapped spot (or the nearest one) */
  function refocus(box,k){
    const bs=[...box.querySelectorAll('button.oi')];
    const t=bs[Math.min(k,bs.length-1)]||(box===pool?seq:pool).querySelector('button.oi')||check;
    t.focus();
  }
  function drawPool(){
    pool.innerHTML='';
    order.forEach(o=>{
      if(chosen.includes(o.i)) return;
      const btn=el('button','oi',`<span class="n" aria-hidden="true">+</span><span><span class="sr">Add: </span>${o.it[0]}</span>`);
      btn.type='button';
      btn.addEventListener('click',()=>{ const k=[...pool.querySelectorAll('button.oi')].indexOf(btn); chosen.push(o.i); redraw(); refocus(pool,k); });
      pool.appendChild(btn);
    });
    if(!pool.children.length) pool.appendChild(el('p','sum',`Every ${noun} is placed. Check the order, or tap a ${noun} below to take it out.`));
  }
  function drawSeq(){
    seq.innerHTML='';
    chosen.forEach((ci,pos)=>{
      const it=b.items[ci], m=marks.get(ci);
      const w=el('div','ost');
      const btn=el('button','oi'+(m?(m.ok?' ok':' off'):''),`<span class="n" aria-hidden="true">${num(pos)}</span><span><span class="sr">${L?'Layer':'Step'} ${num(pos)}: </span>${it[0]}</span>`);
      btn.type='button';btn.title='Tap to take it out';
      btn.addEventListener('click',()=>{ chosen.splice(pos,1); marks.delete(ci); redraw(); refocus(seq,pos); });
      w.appendChild(btn);
      if(m){
        const lead=m.ok?'In place.':(m.dir==='earlier'?(L?'Sits higher':'Comes earlier'):m.dir==='later'?(L?'Sits lower':'Comes later'):'Belongs at another '+noun)+(m.at?`: ${noun} ${m.at}.`:'.');
        const r=el('div','oreason'+(m.ok?' ok':''),`<b>${lead}</b> ${it[1]}`);
        r.id=b.id+'-or'+ci; btn.setAttribute('aria-describedby',r.id);
        w.appendChild(r);
      }
      seq.appendChild(w);
    });
    count.textContent=`Placed ${chosen.length} of ${N}`;
  }
  /* a change to the sequence clears the last check's message ("Completed before." stays); marks on the steps left in
     place and the full order stay until the next Check */
  function redraw(){
    drawPool(); drawSeq();
    if(pill.textContent!=='Completed before.'){ pill.textContent=''; pill.className='pill'; }
  }
  check.addEventListener('click',()=>{
    if(chosen.length<N){ pill.textContent=`Place every ${noun} first: ${N-chosen.length} to go`; pill.className='pill'; return; }
    const res=chosen.map((ci,pos)=>({ci,pos,ps:spots(ci)}));
    res.forEach(x=>{ x.ok=x.ps.includes(x.pos); });
    const ok=res.every(x=>x.ok), right=res.filter(x=>x.ok).length;
    if(!ok) fails++;
    marks=new Map();
    res.forEach(x=>{
      const lo=Math.min(...x.ps), hi=Math.max(...x.ps);
      /* a layer's reason already names its layer, so only steps get the "belongs at" hint */
      marks.set(x.ci,{ok:x.ok,dir:x.ok?null:x.pos<lo?'later':x.pos>hi?'earlier':null,at:!x.ok&&fails>1&&!L?x.ps.map(num).join(' or '):''});
    });
    drawSeq();
    whyWrap.innerHTML='';
    if(ok){ pill.textContent='Perfect order'; pill.className='pill ok'; store.set(b.id,{done:true}); refreshChrome(); whyWrap.appendChild(el('p','sum',`Each ${noun} shows why it sits where it does.`)); }
    else{
      pill.textContent=`${right} of ${N} ${noun}s in place`; pill.className='pill';
      whyWrap.appendChild(el('p','sum',L?'Each layer shows its reason, which names its layer, and each layer to move says whether it sits higher or lower. Tap it to take it out, place it again, and check.':fails>1?'Each step shows its reason, and each step to move now names the step where it belongs. Tap it to take it out, place it again, and check.':'Each step shows its reason, and each step to move says whether it comes earlier or later. Tap it to take it out, place it again, and check.'));
      if(fails>1){
        const d=el('details','ofull');d.innerHTML='<summary>Show the full order with every reason</summary>';
        b.items.forEach((it,i)=>d.appendChild(el('div','why',`<b>${L?'':num(i)+'. '}${it[0]}.</b> ${it[1]}`)));
        whyWrap.appendChild(d);
      }
    }
  });
  reset.addEventListener('click',()=>{ chosen=[]; marks=new Map(); whyWrap.innerHTML=''; pill.textContent=''; pill.className='pill'; redraw(); const f=pool.querySelector('button.oi'); if(f) f.focus(); });
  redraw();
  if(isDone(b.id)){ pill.textContent='Completed before.'; pill.className='pill ok'; }
  return c;
}
