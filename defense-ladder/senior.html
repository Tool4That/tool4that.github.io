   ]},
 {id:'se2',title:'Web application security',bloom:'Evaluate',sum:'The OWASP Top 10, memory safety, and secure coding: harden a small web stack, rank web findings, and choose the fix that closes each one.',
  can:'rank web findings against the OWASP Top 10, harden a small web stack, and choose the fix that closes each one',
  blocks:[
   C('What to know','Understand',
     TIPS('Learn the <b>OWASP Top 10 (2025)</b> by name and idea; the detail panel below gives each one line.',
          '<b>Injection:</b> untrusted input changes a query or command, such as a quote that breaks a SQL statement.',
          '<b>Security misconfiguration:</b> a setting left unsafe, such as directory listing, sample apps, or verbose errors.',
          '<b>Server:</b> remove default pages and sample apps, and run the service as a low-privileged user.',
          '<b>Credentials:</b> replace default admin passwords, keep secrets out of world-readable config files, and limit database accounts to what the app needs.',
          'Practice safely on a deliberately vulnerable app you run locally, and only ever on systems you own.'),
    COMPARE('Who are you, what may you do, and what did you do?',[
     {name:'Authentication',tag:'Who are you?',tone:'l1',
      svg:{label:'An ID card: authentication checks who you are.',
       body:'<rect x="62" y="10" width="76" height="52" rx="6" fill="var(--paper)" stroke="var(--l1)" stroke-width="2"/><circle cx="84" cy="30" r="9" fill="none" stroke="var(--l1)" stroke-width="2"/><path d="M71 54 Q84 38 97 54" fill="none" stroke="var(--l1)" stroke-width="2"/><path d="M106 26 H130 M106 36 H130 M106 46 H122" fill="none" stroke="var(--ink-3)" stroke-width="2"/>'},
      rows:[['Job','Proves the identity a user claims, with a password, a passkey, or a second factor'],['Fails as','<b>A07</b> Authentication Failures: guessable or reused passwords, missing MFA, and sessions that stay valid forever'],['Example','A login form that accepts <code>admin</code> and <code>admin</code>']],
      hook:'showing your ID at the door.'},
     {name:'Authorization',tag:'What may you do?',tone:'l3',
      svg:{label:'Three doors: the badge opens Shop and Orders, and Admin stays locked for this user.',
       body:'<g fill="var(--paper)" stroke-width="2"><rect x="12" y="4" width="44" height="48" rx="3" stroke="var(--l3)"/><rect x="78" y="4" width="44" height="48" rx="3" stroke="var(--l3)"/><rect x="144" y="4" width="44" height="48" rx="3" stroke="var(--bad)"/></g><rect x="159" y="18" width="14" height="11" rx="2" fill="var(--bad)"/><path d="M162 18 V14 A4 4 0 0 1 170 14 V18" fill="none" stroke="var(--bad)" stroke-width="2"/><g font-size="11" text-anchor="middle" fill="var(--ink)"><text x="34" y="32">open</text><text x="100" y="32">open</text><text x="166" y="44">locked</text></g><g font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink-2)"><text x="34" y="69">Shop</text><text x="100" y="69">Orders</text><text x="166" y="69">Admin</text></g>'},
      rows:[['Job','Decides what that identity may use (pages, records, and actions), checked on the server for every request'],['Fails as','<b>A01</b> Broken Access Control, number one in 2025'],['Example','An admin panel anyone can open, or changing <code>?id=101</code> to <code>?id=102</code> to read someone else’s order']],
      hook:'the rooms your badge opens.'},
     {name:'Accounting',tag:'What did you do?',tone:'l4',
      svg:{label:'A log: each line records a time, a user, and an action.',
       body:'<rect x="10" y="4" width="180" height="66" rx="6" fill="var(--paper)" stroke="var(--l4)" stroke-width="2"/><g font-size="12" font-family="ui-monospace,Consolas,monospace" fill="var(--ink)"><text x="20" y="24">10:02 keola login</text><text x="20" y="43">10:03 keola view 101</text><text x="20" y="62">10:05 keola export</text></g>'},
      rows:[['Job','Records who did what, and when, so someone can review it and get an alert'],['Fails as','<b>A09</b> Security Logging and Alerting Failures'],['Example','Failed logins and admin actions that pass without a log entry or an alert']],
      hook:'the visitor log at the front desk.'}
   ],{intro:'A page anyone reaches <b>without logging in</b> is an authorization failure: the server skipped the question “may this person use it?”',
     note:'“Authorization” also means the system owner’s written permission to test or change a system (<a href="#freshman/f3">Security principles</a>; <a href="#senior/se5">Power and responsibility</a>).',
     caption:'AAA: three questions, three OWASP failures.'}),
     CMDS('Harden a small web stack (Apache on Debian/Ubuntu)',[
       ['sudo apt update && sudo apt upgrade','Patch the OS, the web server (Apache/nginx), the language runtime, and the app packages first.'],
       ['sudo find /var/www -type f -perm -o+w 2>/dev/null','World-writable web files: tighten them.'],
       ['sudo chown -R root:www-data /var/www/html && sudo chmod -R g-w,o-w /var/www/html','Root owns the content and alone writes it; the web server group only reads it. Give the service write access only to the folders the app must write to.'],
       ['sudo nano /etc/apache2/apache2.conf','In the &lt;Directory /var/www/&gt; block change "Options Indexes FollowSymLinks" to "Options FollowSymLinks" to turn off directory listing.'],
       ['sudo nano /etc/apache2/conf-available/security.conf','Set ServerTokens Prod and ServerSignature Off, then sudo apachectl configtest && sudo systemctl reload apache2.'],
       ['sudo grep -rn AllowOverride /etc/apache2/','Expect AllowOverride None, Ubuntu’s default for /var/www, so Apache ignores .htaccess files (<a href="#sophomore/s4">Services and ports</a> explains why); move any rule a site needs into its site file.'],
       ['grep -ri "password" /var/www 2>/dev/null','Hunt for credentials left in source or config.'],
       ['sudo ss -tulnp | grep -E ":80|:443|:3306"','Confirm only the expected web and database ports listen, and bind the database to localhost if only the app uses it.']
     ]),
     DETAIL('The OWASP Top 10 (2025) in one line each',TIPS('<b>A01 Broken access control:</b> users reach data or actions beyond their rights.','<b>A02 Security misconfiguration:</b> unsafe settings, sample apps, directory listing, and verbose errors.','<b>A03 Software supply chain failures:</b> compromised or unvetted dependencies and build pipelines.','<b>A04 Cryptographic failures:</b> weak or absent encryption for sensitive data.','<b>A05 Injection:</b> untrusted input changes a query or command, as in SQL injection, command injection, and cross-site scripting.','<b>A06 Insecure design:</b> the design itself leaves out a needed control.','<b>A07 Authentication failures:</b> guessable passwords, absent MFA, and sessions that live too long.','<b>A08 Software or data integrity failures:</b> unsigned updates, and untrusted data treated as code.','<b>A09 Security logging and alerting failures:</b> attacks pass unrecorded or unnoticed.','<b>A10 Mishandling of exceptional conditions:</b> errors that fail open or leak details.'))),
   DETAIL('Reading a web file’s permissions',
    ANATOMY('Reading a web file’s permissions',[
     {name:'-rw-r--r--  root  www-data  index.html',tag:'ls -l output',tone:'l2',grid:true,
      children:[
        {name:'Type',tone:'muted',text:'<code>-</code><br>a regular file (<code>d</code> marks a directory)'},
        {name:'Owner',tone:'l4',text:'<code>rw-</code><br>root: read and write'},
        {name:'Group',tone:'l3',text:'<code>r--</code><br>www-data: read'},
        {name:'Other',tone:'l1',text:'<code>r--</code><br>every other account: read'}]}
   ],{intro:'The command table above leaves the web files in this state. Read the mode in four parts: the type, then three triplets of read (r), write (w), and execute (x), for the owner, the group, and everyone else.',
     label:'The ls -l line for index.html, owned by root with group www-data, split into four parts: type -, owner rw-, group r--, and other r--.',
     strip:['Mode','- rw- r-- r--','type, then owner rw-, group r--, and other r--: mode 644.'],
     facts:{head:['','Owner','Group','Other'],rows:[
       ['Who','root','www-data, the group Apache’s workers run in','Every other account'],
       ['Bits','<code>rw-</code>','<code>r--</code>','<code>r--</code>'],
       ['Octal','6 (4 + 2)','4','4'],
       ['Can','Read and change the file','Read it, so Apache can serve it','Read it']]},
     note:'<code>find -perm -o+w</code> lists files whose <b>other</b> triplet holds <code>w</code>: any account can change them. <code>chmod g-w,o-w</code> takes <code>w</code> away from group and other and leaves the owner’s bits as they are. On a directory, <code>r</code> lists its entries, <code>w</code> adds or deletes them, and <code>x</code> lets you enter it. Grant the group write access only on folders the app writes to, such as uploads.',
     caption:'Root owns the content and alone can change it; Apache reads it through the www-data group. A hijacked web server gets read access only, and the files stay as root wrote them.',
     alt:['Type: - means a regular file; d marks a directory.',
          'Owner, root: rw-, read and write (octal 6).',
          'Group, www-data, the group Apache’s workers run in: r--, read only (octal 4), enough to serve the file.',
          'Other, every other account: r--, read only (octal 4).',
          'Together the mode is 644. find -perm -o+w lists files where other holds w; chmod g-w,o-w removes write from group and other and leaves the owner’s bits as they are.',
          'On a directory, r lists its entries, w adds or deletes them, and x lets you enter it. Give the group write access only on folders the app writes to, such as uploads.']})),
   QUIZ('se2c1','Check yourself',[
     ['Directory listing shows every file under /files to any visitor. Fix on Apache?',['Add Indexes to Options','Remove Indexes from Options for that directory and set correct permissions','Rename the folder','Leave it as is, it is fine'],1,'Turn off directory listing and make sure only intended files are served.',{whys:['Adding Indexes turns listing on, the opposite of the fix.','With Indexes gone, Apache stops listing the folder, and correct permissions keep the remaining files private.','A new name still lists every file.','Listing hands visitors a map of your files: a misconfiguration.'],imp:'core',c:'web-server-hardening'}]
   ]),
   C('Memory safety: when input outgrows its space','Evaluate',
     P('Web apps rest on code written in <b>C</b>: the web server and the TLS, image, and database libraries. C copies data into a fixed-size <b>buffer</b> and leaves the length check to the programmer. Skip it, and long input spills into the memory next door: a <b>buffer overflow</b> that crashes the program or lets an intruder steer it.'),
     P('Read C as in <a href="#freshman/f12">Code you can read</a>: flag <code>gets</code>, <code>strcpy</code>, and <code>sprintf</code>, and look for their length-checked partners, <code>fgets</code> for gets and <code>snprintf</code> for the other two.')),
   ANATOMY('A buffer and its neighbors',[
     {name:'Without a length check',tag:'strcpy(name, input)',tone:'bad',text:'<span style="display:flex;flex-wrap:wrap;gap:4px;align-items:center"><code>k</code><code>o</code><code>n</code><code>a</code><code>-</code><code>b</code><code>l</code><code>e</code><span style="width:4px;height:1.6em;background:var(--ink)"></span><code style="background:var(--bad-bg);border:1px solid var(--bad)">nd-d</code><code style="background:var(--bad-bg);border:1px solid var(--bad)">ark!</code></span><small>Past the wall: the saved data, then the return spot</small>'},
     {name:'With a length check',tag:'snprintf(name, sizeof name, "%s", input)',tone:'ok',text:'<span style="display:flex;flex-wrap:wrap;gap:4px;align-items:center"><code>k</code><code>o</code><code>n</code><code>a</code><code>-</code><code>b</code><code>l</code><code>\\0</code><span style="width:4px;height:1.6em;background:var(--ink)"></span><code style="background:var(--ok-bg);border:1px solid var(--ok)">intact</code><code style="background:var(--ok-bg);border:1px solid var(--ok)">intact</code></span>'}
   ],{intro:'Both rows copy the 16 characters of <code>kona-blend-dark!</code> into <code>char name[8]</code>, eight boxes; <code>\\0</code> is the end mark.',
     label:'Without a length check, kona-ble fills the eight-byte buffer and nd-dark! overwrites its neighbors; with one, kona-bl plus the end mark fill it, leaving the neighbors intact.',
     facts:{head:['Guard','What it does'],rows:[
       ['Stack canary','A check value between the buffer and the saved data; an overflow must change it first, so the program spots the change and stops itself, a crash instead of a takeover'],
       ['ASLR','Shuffles where code and data load, so addresses are hard to predict'],
       ['NX (DEP on Windows)','Marks data memory non-executable, so bytes in a buffer never run as code'],
       ['Memory-safety family','Overflow, use after free, and leak. Go, Rust, and Python rule out overflow and use after free in everyday code; leaks still need watching.']]},
     key:[['bad','Overwritten'],['ok','Kept in bounds']],
     alt:['<b>Without a length check</b> (strcpy): boxes 0 to 7 get k, o, n, a, -, b, l, and e. Past box 7, the saved data gets nd-d, and the return spot, where the code goes next, gets ark!.','<b>With a length check</b> (snprintf): boxes 0 to 6 get k, o, n, a, -, b, and l, and box 7 gets the end mark. The neighbors stay intact; the input is cut short.'],
     note:'Guards turn most overflows into crashes, and a crash is still an outage and a clue: repeated <code>segfault</code> lines in <code>dmesg</code> after long inputs mean patch and report. Best fixes first: patch the library, use length-checked calls, and write new code in a memory-safe language.',bloom:'Evaluate'}),
   QUIZ('se2c2','Check yourself',[
     ['A C service on makani-web logs <code>segfault</code> lines after long names, and its source uses <code>strcpy</code> into an 8-byte buffer. Best response?',['None: ASLR and canaries cover it','Restart the service every night','Patch to a length-checked copy','Block long names at the firewall'],2,'A crash from the guards is still an outage and a flaw: ship the patch and report it.',{whys:['The guards turn the overflow into a crash; the flaw and the outage remain.','Restarts hide the crash and keep the overflow.','A length-checked copy such as snprintf keeps a long name inside the 8-byte buffer, which fixes the flaw itself.','A firewall sees ports and addresses, while the name rides inside allowed traffic.'],imp:'good',c:'web-secure-coding'}]
   ]),
   C('Secure by habit','Evaluate',
     P('Most web flaws share one cause: data from outside is trusted. Three habits stop most of them: <b>validate</b> input, use <b>parameters</b>, and <b>encode output</b>.'),
     P('A <b>web application firewall</b> (WAF) blocks requests that match attack patterns, so it misses flaws that look like normal use, such as an IDOR. Encoded tricks can slip past its patterns too. Fix the code first; the WAF is the second layer.')),
   SEQ('One form field, start to finish',[
     ['Validate','Allow only what fits: the order number is digits, and the note is plain text of 200 characters at most. <b>Stops</b> odd input early, such as <code>../</code> in the order number.','l1'],
     ['Use a parameter','The query carries the value separately. <b>Stops</b> SQL injection.','l2'],
     ['Check ownership','Order 1042 must belong to the signed-in customer, or the answer is 403. <b>Stops</b> broken access control (IDOR).','l3'],
     ['Store','Through a least-privilege database account. Errors <b>fail closed</b>: refuse the request, show a short message, and log the details. <b>Stops</b> one flaw reaching every table, a failed check letting a request through, and error pages that leak details.','l3'],
     ['Encode on output','Escape it for HTML, a URL, or JavaScript, wherever it lands. <b>Stops</b> XSS.','l4']
   ],{intro:'Kalani traces one order’s delivery-note field at Kona Hillside Roasters. Input steps guard the server; the output step guards the next visitor.',
     bloom:'Evaluate'}),

     {bloom:'Evaluate',intro:'Kalani’s review of kona-roasters.example. <b>IDOR:</b> <code>/orders?id=</code> returns any customer’s order. <b>SQLi:</b> a quote in search draws a 500. <b>Old lib:</b> the old image library behind uploads has a published flaw. <b>CSP:</b> the Content Security Policy header is missing, so XSS lacks its second layer; output encoding already blocks the known XSS. <b>CSRF:</b> the email change, a POST, lacks a token, and the cookie is SameSite=Lax. <b>Path:</b> every path traversal probe drew a 400, so the check held.',
      alt:['<b>IDOR</b>: chance Almost certain, impact Severe: Crit.','<b>SQLi</b>: chance Likely, impact Severe: Crit.','<b>Old lib</b> (an old image library): chance Likely, impact Major: High.','<b>CSP</b>: chance Possible, impact Moderate: Med.','<b>CSRF</b>: chance Rare, impact Major: Med.','<b>Path</b> (path traversal): chance Rare, impact Severe: Med.'],
      key:[['bad','Crit: fix now'],['amber','High: this cycle'],['l2','Med: plan it'],['muted','Low: accept or batch']],
      note:'<b>A WAF moves a finding down, never left.</b> A rule can lower SQLi’s chance while the parameter fix ships; the impact stays. SameSite already pulled CSRF to Rare; the token still goes on the list.',
      caption:'Fix IDOR and SQLi now, then the old library; the other three already carry a partial control.'}),
   DETAIL('Earlier units behind this grid',
     P('Recognition first came in <a href="#junior/j9">Web attacks in the logs</a>; the grid is the one from <a href="#junior/j5">Evaluate a configuration</a>.')),
   QUIZ('se2q','Check: web hardening',[
     ['A small company web app has an admin panel anyone can reach without logging in. This is',['SQL injection','Broken access control','A firewall issue','Expected behavior'],1,'Reaching things beyond your permissions is broken access control, number one in the OWASP Top 10 (2025).',{whys:['SQL injection needs input that changes a query; here the panel simply opens.','The server lets anyone use the panel before checking who they are and what they may do, and that missing check is the flaw.','A firewall filters traffic; the app decides who may use a page.','An admin panel open to anyone is a top finding.'],imp:'core',c:'web-access-control'}],
     ['Where should you practice web attacks and fixes?',['A random live website','A deliberately vulnerable app you run locally (for example OWASP Juice Shop)','Your school portal','A classmate’s site'],1,'Only systems you own or are authorized to test. Juice Shop is built for exactly this.',{whys:['Testing a site you lack permission for is illegal and can harm its owners.','You own the local copy, and Juice Shop was built to be attacked, so your practice harms nobody.','The school owns the portal; testing it takes its written permission.','A classmate’s site takes its owner’s written permission too.'],imp:'core',c:'eth-cyber-ethics'}],
     ['A database account used by the web app has full admin rights to every database. Better posture?',['Leave it, it works','Grant only the privileges, on only the database, the app needs','Delete the database','Share the admin password with the team'],1,'Least privilege applies to database accounts too. Limit scope and privileges to the app’s actual needs.',{whys:['It works today, yet one app flaw would reach every database.','Least privilege caps what one app flaw can reach: the app’s own database, with only the rights the app uses.','Deleting it destroys the data; scope the account instead.','Sharing the password spreads the risk and erases accountability.'],imp:'core',c:'web-db-least-privilege'}],
     ['Customers of kona-roasters.example read others’ orders by changing <code>?id=</code>. Which fix closes the hole?',['Long random order ids','Hiding other customers’ order links','A WAF rule against counting ids','An ownership check on the server'],3,'Slowing guesses leaves the read allowed; only a server-side ownership check closes it. <a href="#junior/j9">Review: Web attacks in the logs</a>',{whys:['Random ids slow guessing, yet a known id still opens.','Hidden links still work when someone types the id.','A WAF rule slows the walk; the read is still allowed.','The server checks that each order belongs to the signed-in customer, so every other id is refused, however it arrived.'],imp:'core',c:'web-access-control'}],
     ['A new WAF rule blocks every quote probe against the search box. Can the team close the SQL injection ticket?',['Yes: the WAF blocks the attack','No: parameterize, and keep the WAF','Yes, after a week of clean WAF logs','No: remove the WAF, it hides attacks'],1,'A WAF buys time; the flaw stays in the code until the query takes a parameter.',{whys:['A WAF matches patterns, and encoded probes slip past; the flaw stays.','A parameter keeps the search text as data, which fixes the code, and the WAF stays as a second layer.','Quiet logs leave the query joining input into SQL.','The WAF lowers the chance while the fix ships; keep it.'],imp:'core',c:'web-secure-coding'}]
   ]),

 {id:'se10',title:'Design for the cloud: code, functions, and APIs',bloom:'Create',sum:'Review infrastructure as code before it ships, choose between VMs, containers, and functions, protect API tokens, and design a small cloud app that fails safely.',
  can:'review infrastructure as code before it ships, choose between VMs, containers, and functions, protect API tokens, and design a small cloud app that fails safely',
  blocks:[
   C('Text files that build the cloud','Create',
     P('<b>Infrastructure as code</b> (IaC) describes servers, networks, storage, and permissions in text files (CloudFormation YAML or Terraform), and a tool builds exactly that. Each change is reviewed before it runs, and <b>drift</b>, a hand change in the console, shows on the next run. The risks: one bad line deploys everywhere at once, and a secret in a file reaches anyone who can read the repository.'),
     P('The files live in <b>version control</b> (Git), where a <b>pull request</b> asks a teammate to approve the <b>diff</b>, the exact lines that changed, before it merges. Deleting a secret in a later commit leaves it in the history, as <a href="#junior/j10">Cloud security: identity, storage, and logs</a> showed, so revoke it instead.')),
   ANATOMY('Reading one diff',[
     {name:'infra/signup.yaml',tag:'one hunk, as Git prints it',tone:'l2',text:'<pre style="margin:0;padding:8px 10px;background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:.8rem/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left"><span style="display:block">--- a/infra/signup.yaml</span><span style="display:block">+++ b/infra/signup.yaml</span><span style="display:block">@@ -12,6 +12,6 @@</span><span style="display:block">   SignupDb:</span><span style="display:block">     Type: AWS::RDS::DBInstance</span><span style="display:block">     Properties:</span><span style="display:block">       StorageEncrypted: true</span><span style="display:block;background:var(--bad-bg)">-      MasterUserPassword: \'{{resolve:secretsmanager:makerspace/db}}\'</span><span style="display:block;background:var(--ok-bg)">+      MasterUserPassword: Workshop2026!</span><span style="display:block">       MasterUsername: signup_admin</span></pre>'},
     {name:'Its parts',tag:'read top down',tone:'l1',children:[
       {name:'--- a/ and +++ b/',tag:'file header',tone:'muted',text:'The same file before (a) and after (b)'},
       {name:'@@ -12,6 +12,6 @@',tag:'hunk header',tone:'muted',text:'Six old and six new lines, both from line 12: one line swapped for another'},
       {name:'A leading space',tag:'context',tone:'l1',text:'Unchanged lines, for orientation'},
       {name:'A leading -',tag:'removed',tone:'bad',text:'A reference to the secrets manager, the safe form, leaves'},
       {name:'A leading +',tag:'added',tone:'ok',text:'A real password arrives',children:[
         {name:'Finding',tag:'request changes',tone:'amber',text:'The password is now in Git history for good: rotate it'}]}]}
   ],{intro:'Red lines leave and green lines arrive; the color shows the change, never the verdict, so read removed lines as closely as added ones.',
     label:'A diff hunk for infra/signup.yaml: file header, hunk header, context lines, a removed secret reference, and an added plain-text password.',
     alt:['File header: --- a/infra/signup.yaml and +++ b/infra/signup.yaml, the file before and after.','Hunk header: @@ -12,6 +12,6 @@, six old lines and six new lines from line 12.','Context lines, each starting with a space: SignupDb:, Type: AWS::RDS::DBInstance, Properties:, StorageEncrypted: true, and MasterUsername: signup_admin.','Removed line: - MasterUserPassword: {{resolve:secretsmanager:makerspace/db}}, a reference to the secrets manager.','Added line: + MasterUserPassword: Workshop2026!, a real password. Finding: request changes, and rotate it.'],
     note:'<code>{{resolve:secretsmanager:…}}</code> has CloudFormation fetch the password from the secrets manager at deploy time, so the file never holds it.',
     key:[['bad','Removed'],['ok','Added'],['amber','Finding']],
     bloom:'Evaluate'}),
   PATH('From change to running cloud',[
     {name:'Write',tag:'a branch',tone:'ok',note:['Kekoa edits the YAML; a secret scan runs before each commit'],via:'Opens a pull request'},
     {name:'Peer review',tag:'pull request',tone:'ok',note:['Leilani reads the diff'],via:'Approved'},
     {name:'Automated scan',tag:'pipeline',tone:'amber',note:['An IaC scanner flags public storage, open admin ports, and wildcards; a secret scanner reads every line'],via:'Checks pass'},
     {name:'Plan',tag:'preview (a change set)',tone:'amber',note:['Lists what will be created, changed, or replaced; a “replace the database” stops here'],via:'A person approves the plan'},
     {name:'Apply',tag:'running cloud',tone:'bad',note:['The pipeline’s role builds it']}
   ],{intro:'Each hop is a gate, and the same finding costs more the later it is caught.',
     note:'Protect the main branch so changes merge only after review, and let only the pipeline apply, with a role’s short-lived credentials instead of a stored key. Run a plan on a schedule so drift shows up.',
     key:[['ok','Cheap: a comment'],['amber','Rework: a new push'],['bad','An incident: exposure, rollback, and rotated secrets']],
     bloom:'Evaluate'}),
   QUIZ('se10c1','Check yourself',[
     ['The change set for a one-line rename shows <span class="mono">Modify  SignupDb  AWS::RDS::DBInstance  Replacement: True</span>. Best call?',['Apply: a rename changes only a label','Apply at night, when sign-ups are few','Stop: keep the name, or back up first','Skip the plan and apply it by hand'],2,'The preview exists to catch this: replacing the database erases every sign-up.',{whys:['Replacement: True means a new database, so every sign-up is erased.','Night timing still erases every sign-up.','Replacement: True means a new, empty database, so stop: keep the old name, or snapshot the data and plan the move first.','Skipping the plan removes the gate that caught this.'],imp:'core',c:'cloud-iac'}]
   ]),
   C('Pick the compute','Create',
     P('A <b>serverless function</b> runs a short piece of code only when an event arrives: a web request, a file upload, or a timer. Two classic findings: a role allowed every action on every resource, which turns one bug into control of the account, and a public function URL without sign-in.')),
   COMPARE('VM, container, and function',[
     {name:'VM',tag:'IaaS',tone:'l1',rows:[['You patch','Guest OS, runtime, and app'],['When idle','The whole OS keeps running, and billing'],['Scales','Add VMs, in minutes'],['Top setting','Admin ports closed to 0.0.0.0/0; the metadata service set to require tokens (IMDSv2, below)']]},
     {name:'Container',tag:'shared kernel',tone:'l2',rows:[['You patch','The image: rebuild on a fresh base, redeploy'],['When idle','Keeps running unless scaled to zero'],['Scales','More copies, in seconds'],['Top setting','Run as non-root, never --privileged, and use a pinned, scanned image']]},
     {name:'Function',tag:'serverless',tone:'l3',rows:[['You patch','Your code and packages; move off retired runtimes'],['When idle','Nothing runs; billing is per call and by run time, in milliseconds'],['Scales','One copy per concurrent event, up to the account’s limit or a lower one you set'],['Top setting','A narrow execution role, and sign-in on any function URL']]}
   ],{note:'Shared responsibility shifts as you move right: the provider takes over the guest OS, then the runtime and the scaling. Your code, its role, its secrets, its data, and its exposure stay yours in every column.',
     caption:'The less you run, the less you patch; pick by how often the code runs.',bloom:'Evaluate'}),
   DETAIL('Cloud tools as single Go files',
     P('Many of the cloud tools in this unit ship as single Go files (<a href="#freshman/f12">Code you can read</a>).')),
   QUIZ('se10c2','Check yourself',[
     ['The makerspace shrinks each uploaded waiver PDF, a few dozen times a day, 20 seconds each. Which compute fits best?',['A VM kept on for full OS control','A container left running all day','A VM that a timer wakes hourly','A function run on each upload'],3,'An event job that runs seconds a day suits a function; its code, packages, and role stay yours.',{whys:['A VM runs, and bills, all day for 20-second jobs.','A container left on idles all day between uploads.','A timer leaves each waiver waiting up to an hour.','A function runs only when an upload arrives, so nothing idles or bills between jobs, and its role can stay as narrow as one bucket.'],imp:'core',c:'cloud-iac'}]
   ]),
   C('A server that fetches for you','Evaluate',
     P('Some apps fetch a URL a user supplies, such as a profile picture from a link. If the server fetches any address, someone can aim it inward: <b>server-side request forgery</b> (SSRF). In the cloud the prize is the <b>instance metadata service</b> at 169.254.169.254, a link-local address every VM reaches, which hands the VM’s role credentials to requests from inside.')),
   PATH('A request that should never reach the metadata service',[
     {name:'Avatar link',tag:'user input',tone:'l1',note:['A sign-up form offers “picture from a link”','<b>Break 1:</b> allow only https to approved image hosts, refuse private and link-local addresses after the DNS lookup, and follow no redirects'],via:'The server fetches it'},
     {name:'Web server',tag:'makerspace VM',tone:'amber',note:['Outbound log: <span class="mono">GET http://169.254.169.254/… 401</span>','<b>Break 2:</b> IMDSv2 answers only requests carrying a session token. Getting one takes a PUT with a special header, beyond what a simple fetch sends; a hop limit of 1 keeps the token on the VM'],via:'Would ask for credentials'},
     {name:'Metadata service',tag:'169.254.169.254',tone:'bad',note:['Holds short-lived credentials for the VM’s role','<b>Break 3:</b> a least-privilege role, so even leaked credentials write one bucket and nothing else']}
   ],{intro:'Three independent breaks: the first two each stop the chain, and the third caps what leaked credentials can do; together they survive one failing.',
     note:'Detect it too: alert when the avatar fetcher’s log shows 169.254.169.254 or any private address (the SDK’s own credential calls are normal), and on the VM role’s credentials used from outside the account (the audit trail from <a href="#junior/j10">Cloud security: identity, storage, and logs</a>). Egress filtering backs up the allow-list for other internal hosts; security groups never see metadata traffic, so IMDSv2 guards that hop.',
     bloom:'Evaluate'}),
   QUIZ('se10c3','Check yourself',[
     ['The outbound log shows <span class="mono">GET http://169.254.169.254/… 401</span> right after someone submitted an avatar link. The VM requires IMDSv2. What now?',['Nothing: the 401 shows it failed','Turn IMDSv2 off to stop the errors','Add the allow-list and egress rules','Block that visitor, close the ticket'],2,'Break 2 held, and break 1 is missing: add it, then check the role’s activity in the audit trail.',{whys:['IMDSv2 held, yet the server still fetches other internal addresses.','Turning IMDSv2 off would hand over the role’s credentials.','IMDSv2 was the second break; the allow-list and egress rules add the missing first one, so the server stops fetching internal addresses.','Anyone can submit the same link; the flaw stays in the fetcher.'],imp:'core',c:'web-owasp'}]
   ]),
   C('APIs and tokens','Evaluate',
     P('An <b>API</b> is a set of HTTP addresses that return data, usually JSON, instead of pages. Each request carries proof of identity, most often a <b>bearer token</b> in a header: whoever holds it acts as its owner until it expires. So tokens stay short-lived, scoped to one job, sent only over TLS, and kept out of URLs, which land in access logs (<a href="#junior/j9">Web attacks in the logs</a>). The top API risk is <b>broken object-level authorization</b> (BOLA): the IDOR again, one object id at a time. A <b>rate limit</b> slows the walk; only a per-object ownership check closes it.')),
   ANATOMY('One API request and response',[
     {name:'Request',tag:'POST /api/v1/signups',tone:'l2',children:[
       {name:'Authorization: Bearer eyJhbGciOi…',tag:'token',tone:'amber',text:'Proof of identity; whoever holds it is the caller'}]},
     {name:'Response',tag:'from the function',tone:'l3',children:[
       {name:'201 Created',tag:'status',tone:'ok',text:'The sign-up was saved'}]}
   ],{intro:'It uses the layout from <a href="#freshman/f11">The web and the cloud in plain words</a>, plus a token going in. Read it like an access-log line, and log only the safe half.',
     label:'An API request carrying a bearer token, and a 201 Created response, beside a table of what to log and what never to log.',
     facts:{head:['Log this','Never log this'],rows:[
       ['Time, request id, method, path, and status','The token or API key itself'],
       ['The caller: the token’s user, or a key’s last four characters','Passwords and session cookies'],
       ['Source address and response size','Request bodies that hold personal data']]},
     bloom:'Evaluate'}),
   SPOT('se10sp','Review a pull request of infrastructure code (YAML)','Kekoa’s pull request for the Mānoa Makerspace sign-up app, trimmed to its hunks (+ added, - removed). Tap every line that should block the merge, then Check.',[
     ['@@ -8,6 +8,7 @@ Resources:  WaiverBucket (AWS::S3::Bucket)',null],
     ['-        BlockPublicAcls: true',null,'The minus marks a removed line: this is the old, safe setting. The problem is the + line that replaces it.'],
     ['+        BlockPublicAcls: false','Turns off a guard: S3 now accepts requests that set a public ACL on the bucket or a waiver, and signed waivers hold names and signatures. Keep all four Block Public Access settings on.'],
     ['+      VersioningConfiguration: {Status: Enabled}',null,'Versioning keeps older copies of each waiver, so a deleted or overwritten file comes back.'],
     ['@@ -31,8 +32,12 @@ Resources:  AppServer (AWS::EC2::Instance)',null],
     ['+      MetadataOptions: {HttpTokens: optional, HttpPutResponseHopLimit: 1}','Tokens optional keeps IMDSv1 on, so one SSRF fetch reaches the role’s credentials. Require tokens.'],
     ['+  AppServerSg:  Type: AWS::EC2::SecurityGroup',null],
     ['+        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}',null,'A public sign-up app serves HTTPS to everyone, so 443 open to the internet is its job.'],
     ['+        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: 0.0.0.0/0}','SSH open to the whole internet. Use the provider’s console session, which opens no port, or allow 22 only from one admin host.'],
     ['@@ -52,6 +57,16 @@ Resources:  ExportFunction (AWS::Lambda::Function)',null],
     ['+      Runtime: python3.12',null],
     ['+          DB_PASSWORD: Workshop2026!','A plain password in the repo and in the function’s settings. Have the function fetch it from the secrets manager at run time, and let its role read that one secret.'],
     ['+  ExportRole:  Type: AWS::IAM::Role',null],
     ['+            Action: \'*\'','Every action. Name only the few the export needs, such as reading the database secret and writing to the export bucket.'],
     ['+            Resource: \'*\'','Every resource in the account. Name the one secret and the one bucket by their ARNs.'],
     ['+  ExportUrl:  Type: AWS::Lambda::Url',null],
     ['+      AuthType: NONE   # URL for the weekly export','Every sign-up, open to anyone holding the link. Set AuthType: AWS_IAM, so only signed requests from allowed staff identities get through.'],
     ['+      TargetFunctionArn: !GetAtt ExportFunction.Arn',null]
   ]),
   C('Design it to fail safely','Create',
     P('Five questions turn this unit into one plan that says what happens on the design’s worst day:'),
     TIPS('<b>Who runs it?</b> One identity per part, each with a role that names its actions and resources; people sign in through SSO with MFA.',
          '<b>Where do secrets live?</b> In a secrets manager, fetched at run time; the repository holds references only.',
          '<b>What faces the internet?</b> Only the sign-up page on 443; storage stays private, and any function URL requires sign-in.',
          '<b>What fails closed?</b> A down database or an expired token returns a short, friendly error and never skips a check; details go to the log, and a retry queue holds the sign-up.',
          '<b>What caps the damage?</b> A concurrency limit and a billing alert, so a flood of calls costs a warning instead of a fortune; audit logs and alerts from <a href="#junior/j10">Cloud security: identity, storage, and logs</a> stay on.')),
   REFLECT('se10r','Design the cloud side of a Mānoa makerspace sign-up app','Mānoa Makerspace (manoa-makerspace.example) wants workshop sign-ups: name, email, the workshop, and a signed waiver PDF, with a weekly export for staff. Write a one-page design:<br>1. VM, container, or function for each part, and why.<br>2. Every identity and its exact permissions; where each secret lives; which buckets stay private.<br>3. Where SSRF could creep in, and your three breaks.<br>4. What the API logs and never logs; which audit events alert.<br>5. The gates from change to running cloud.<br>6. Fail safely: when the database is down or a token expires, what the visitor sees and what reaches the log.<br>7. One trade-off you accepted, and why.'),
   QUIZ('se10q','Check: design choices',[
     ['A developer sends the API token as <code>?token=…</code> in the URL to save time. Verdict?',['Fine: TLS encrypts the whole URL','Fine, if the token never expires','Move it to a cookie with no flags','Move it to the Authorization header'],3,'TLS guards only the wire; keep tokens short-lived too, so any leak expires fast.',{whys:['TLS hides the URL on the wire, but logs and history store it.','A token that never expires makes any leak last forever.','A cookie without flags rides plain HTTP and is readable by scripts.','Access logs, browser history, and referrers record URLs and leave the Authorization header out, so the token stops leaking there.'],imp:'core',c:'web-http'}],
     ['An API log shows one token reading <span class="mono">/api/v1/signups/1001</span> through <span class="mono">/1400</span> in a minute, every answer a 200. The ownership check ships tomorrow. What runs tonight?',['Wait for tomorrow’s fix','Revoke that token, then rate-limit','Rotate every staff password','Switch ids to random strings'],1,'Contain first; after the ownership check ships, review the 400 sign-ups the token read, since they hold personal data.',{whys:['Waiting lets the walk run all night.','Revoking the token ends this walk tonight, and a per-token rate limit slows the next one until the ownership check ships.','One token is doing the reading, so passwords are beside the point.','Random ids slow guessing, and the token still reads whatever it finds.'],imp:'core',c:'web-access-control'}],
     ['The deploy pipeline keeps a long-lived admin access key in its settings. Safer design?',['Rotate the admin key once a year','A short-lived role for this stack','Share the key with the reviewers','Keep the key; hide the settings page'],1,'A role’s short-lived credentials leave nothing in settings to leak. <a href="#junior/j10">Review: Cloud security: identity, storage, and logs</a>',{whys:['Yearly rotation leaves an admin key in settings all year.','A role hands out short-lived credentials on demand, so nothing sits in settings to leak, and scoping it to one stack caps the damage.','Sharing spreads the key further.','A hidden page still holds the key for any reader.'],imp:'core',c:'cloud-iam-storage'}],
     ['Kekoa’s commit with <code>Workshop2026!</code> already merged. He deletes the line in a new commit and calls it fixed. Verdict?',['Fixed: the file no longer holds it','Fixed, once the branch is deleted','Not yet: make the repo private','Not yet: rotate it and check logs'],3,'Rotate first, read the database sign-in logs, then clean the history and add a pre-commit scan. <a href="#junior/j10">Review: Cloud security: identity, storage, and logs</a>',{whys:['Git keeps the old commit, so the password is still readable.','Clones and the merged history still hold it.','Every existing clone still holds a working password.','History and every clone still hold the password, so only rotating it ends its use; the sign-in logs then show whether anyone used it.'],imp:'core',c:'cloud-logs'}],
     ['A function calls the payment API with <span class="mono">requests.post(url, json=data, verify=False)</span>, because the test server’s certificate failed. Ship it?',['Yes: the traffic still uses HTTPS','Yes, once the tests pass','No: it accepts any certificate','No: test over plain HTTP instead'],2,'Fix the test certificate or the trust store, and keep verification on. <a href="#freshman/f10">Review: Keys, locks, and certificates</a>',{whys:['HTTPS without verification accepts an impostor’s certificate.','Passing tests say nothing about who answers in production.','With verification off, any certificate passes, so a machine on the path can pose as the payment API with its own.','Plain HTTP drops encryption too, which is worse.'],imp:'core',c:'crypto-certificates'}],
     ['A code change breaks the avatar-link allow-list. Which network control still keeps the web server away from the makerspace’s internal admin server?',['Egress filtering on the app tier','An inbound rule allowing only 443','A WAF rule on the sign-up page','Rate limits on the avatar field'],0,'A WAF and rate limits judge only incoming requests; outbound rules govern where the server reaches. <a href="#junior/j6">Review: Network security design: firewalls, zones, VPNs, and Wi-Fi</a>',{whys:['Outbound rules on the app tier refuse what the code forgot to: the server reaches only the approved image hosts and its database.','Inbound rules judge visitors, apart from where the server reaches.','A WAF checks incoming requests only.','Rate limits slow requests and leave destinations open.'],imp:'good',c:'net-firewall-design'}]
   ]),
   LINKS('Go further',['owasp-api','owasp-ssrf','aws-imds','aws-iam-bp'])
   ]},

   ],{intro:'One plan, two sites: the same VLAN numbers, names, and rules, with 10.1 addresses at Site A and 10.2 at Site B. Audit each device against this table.',

     P('An audit compares the network with its documents, so keep them true. The <b>baseline set</b> has five parts: the diagram, the address plan, the saved configurations, a list of normal listeners and flows, and the change log. Update them in the same change window as the device, so an anomaly stands out.'),

         facts:{head:['Record','Who updates it','The audit question'],rows:[
