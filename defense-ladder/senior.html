   C('After the baseline: where attackers dig in','Analyze',TIPS('<b>Defender on is step one.</b> Attackers add exclusions rather than switch it off: read Get-MpPreference for ExclusionPath, ExclusionProcess, and ExclusionExtension next.','Exclusions live in two places: local preferences (Remove-MpPreference clears them) and Group Policy (HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows Defender\\Exclusions), which holds until the policy is Not Configured. Check both.','PUA protection, cloud protection, attack surface reduction (ASR) rules, controlled folder access, and network protection add layers beyond real-time scanning.','<b>Persistence beyond tasks and Run keys:</b> services, WMI event subscriptions, PowerShell profiles, and odd parent-child process chains. Autoruns from Sysinternals lists every auto-start place at once.','<b>Writable service files.</b> Whoever can replace the file a SYSTEM service runs becomes SYSTEM, so Everyone or Users holding write access on a service binary or its folder is a finding. Read it with icacls, as in <a href="#freshman/f5">Freshman</a>.')),
   C('Sysinternals from the command line','Apply',
     P('Five signed Sysinternals tools sweep a machine fast from Command Prompt or PowerShell. Each is a single download; pass <code>-accepteula</code> the first time so the command runs on its own, without the licence dialog.'),
     CMDS('One tool for each question',[
       ['sigcheck -accepteula -u -e C:\\Windows\\System32','Lists the unsigned executable images in a folder (-u unsigned, -e executables only). An unsigned binary among signed Windows files is a lead; add -h for hashes.'],
       ['autorunsc -accepteula -a * -s -h -m','Every auto-start entry (-a *) with its signature checked (-s), its hashes (-h), and the verified Microsoft entries hidden (-m), so what remains is what to read. Add -c for CSV.'],
       ['accesschk -accepteula -uwcqv "Authenticated Users" *','The services (-c) that Authenticated Users can change (-w): a weak permission that lets a standard user reconfigure a SYSTEM service and take it over.'],
       ['accesschk -accepteula -s -w Users "C:\\Program Files"','Files and folders under Program Files that Users can write (-s recurse). Whoever can replace a service’s program runs as that service.'],
       ['streams -accepteula -s C:\\Users\\Public','Alternate data streams under a folder (-s recurse): a Zone.Identifier marks a download, and a hidden stream can carry a payload. Use -d to delete a stream.'],
       ['tcpvcon -accepteula -a -c','Every TCP and UDP endpoint (-a), as CSV (-c), each tied to the process that owns it, so you match a connection to the program behind it.']
     ]),
     NOTE('<b>Sysinternals Live, for reading:</b> <code>\\\\live.sysinternals.com\\tools\\autorunsc.exe -accepteula -a *</code> runs a tool straight from Microsoft’s file share without installing it. It needs internet and the WebClient service, and many locked-down networks block it, so the dependable route is to download the tool, verify it, and run it locally.'),
     TIPS('<b>Check what you run.</b> Verify a tool before you trust its output: <code>sigcheck</code> or <code>Get-AuthenticodeSignature</code> on the program reads Valid and names Microsoft.',
          'Download Sysinternals from Microsoft, and confirm each tool’s signature once it lands.',
          '<code>-accepteula</code> accepts the licence once so the command finishes on its own, and the setting then sticks for that account.')),
   QUIZ('se7ck3','Check yourself',[
     ['Defender reports real-time protection on, yet a known tool ran from C:\\Users\\Public\\tools. What do you check next?',['The exclusions in Get-MpPreference','Windows Update history','The DNS cache','The screen saver'],0,'Attackers add exclusions rather than switch Defender off.',{whys:['An exclusion lets a tool run while real-time protection still reads On.','Update history lists fixes; Defender reports On, so check what it skips.','The DNS cache lists recent lookups rather than the folders Defender skips.','The screen saver locks an idle PC and leaves Defender’s scanning as it was.'],imp:'core',c:'host-antivirus'}]
   ]),
   C('A rogue service: weigh disable against delete','Evaluate',
     TERM('C:\\> sc qc PrintAssist\n[SC] QueryServiceConfig SUCCESS\n\nSERVICE_NAME: PrintAssist\n        TYPE               : 10  WIN32_OWN_PROCESS\n        START_TYPE         : 2   AUTO_START\n        ERROR_CONTROL      : 1   NORMAL\n        BINARY_PATH_NAME   : C:\\ProgramData\\Print Assist\\pa.exe -k svc\n        LOAD_ORDER_GROUP   :\n        TAG                : 0\n        DISPLAY_NAME       : Print Assist Service\n        DEPENDENCIES       :\n        SERVICE_START_NAME : LocalSystem'),
     TIPS('<b>Weigh each line.</b> AUTO_START as LocalSystem, a program under ProgramData, and an unquoted path with a space.',
          'Windows reads an unquoted path left to right, so it tries C:\\ProgramData\\Print.exe first; standard users can create files in C:\\ProgramData, so one planted file runs as SYSTEM.',
          '<b>Disable or delete.</b> <code>sc.exe stop</code> plus <code>start= disabled</code> is reversible and keeps the entry for questions. <code>sc.exe delete</code> removes the persistence, while the program file and whatever installed it remain. When the brief rules the service out and your evidence is recorded, delete it, remove the file, and look for what would put it back: the 7045 for its install, a scheduled task, or a Run key.',
          '<b>Fix a service you keep.</b> A service the brief needs gets a quoted path and a folder that only SYSTEM and Administrators can write (the drill below).')),
   SPOT('se7sp','Spot the openings','Excerpts from a member server, where the HealthAgent service runs as SYSTEM from C:\\Program Files\\HealthAgent. Tap every line an attacker could use, then Check.',[
    ['PS> icacls "C:\\Program Files\\HealthAgent"',null],
    ['C:\\Program Files\\HealthAgent NT AUTHORITY\\SYSTEM:(OI)(CI)(F)',null,'The service itself runs as SYSTEM, and it needs full control of its own folder.'],
    ['                               BUILTIN\\Administrators:(OI)(CI)(F)',null,'Administrators already control the whole server, so Full here grants them nothing new.'],
    ['                               BUILTIN\\Users:(OI)(CI)(M)','Users can modify the folder of a service that runs as SYSTEM, so any user can swap its program and become SYSTEM. Remove the Modify grant.'],
    ['PS> Get-MpPreference | Select-Object ExclusionPath',null],
    ['{C:\\Users\\Public}','Defender skips a folder every user can write to: a ready-made malware drop. Remove the exclusion.'],
    ['PS> Get-ADUser -Filter * -Properties DoesNotRequirePreAuth,ServicePrincipalName | Select-Object Name,DoesNotRequirePreAuth,ServicePrincipalName',null],
    ['malia      False   {}',null,'False means malia must pre-authenticate, and {} means no SPN, so neither roasting attack applies.'],
    ['svc_sql    False   {MSSQLSvc/db1.example.com:1433}','A user account with an SPN is a Kerberoasting target. Give it a long random password, or move the service to a gMSA.'],
    ['keola      True    {}','Pre-authentication is off for keola, so anyone can request an AS-REP and crack it offline. Set DoesNotRequirePreAuth to False.']
   ]),
   QUIZ('se7q','Check: weigh the change',[
    ['The brief names a legacy lab instrument that signs in with NTLMv1. Do you set the LAN Manager authentication level to refuse LM and NTLM today?',['Set it to send LM','Check first: confirm the device and plan its replacement, because the setting would lock it out','Remove the device from the brief','Yes, at once'],1,'A secure setting that breaks a required device is an outage; raise the level once the owner accepts the plan.',{whys:['Sending LM weakens every machine to suit one device.','The brief requires the instrument, so refusing NTLM today is an outage; confirm it, plan its replacement, then raise the level.','The brief describes the business; editing it hides the requirement rather than meeting it.','Changing it today breaks a required device, and that is an outage.'],imp:'core',c:'win-auth-internals'}],
    ['Why does WDigest UseLogonCredential = 1 matter?',['It speeds up sign-in','It encrypts the SAM','It turns on Kerberos','LSASS then keeps plaintext passwords in memory for any admin-level tool to read'],3,'Set it to 0 so only hashes stay in memory, and add LSA protection.',{whys:['WDigest decides what LSASS keeps in memory rather than how fast sign-in runs.','The SAM stays as it is; this value decides whether plaintext stays in memory.','Kerberos runs on its own; this value controls plaintext passwords in memory.','Plaintext in memory skips cracking entirely: any tool with admin rights reads the real password and can reuse it anywhere.'],imp:'core',c:'win-credential-theft'}],
    ['A service account with an SPN has had the same 12-character password for years. Best fix?',['Add the account to Domain Admins','Keep it, since services need stable passwords','Move it to a gMSA, or give it a long random password and update the service’s stored credentials','Delete the SPN'],2,'Kerberoasting cracks short service passwords offline; change the stored credentials with the password so the service keeps running.',{whys:['Domain Admins makes a cracked password open the whole domain.','A short, unchanged password is exactly what Kerberoasting cracks offline.','Kerberoasting guesses the password offline from a ticket; a gMSA’s long, rotating password or a long random one outlasts that guessing.','Deleting the SPN breaks the service’s Kerberos sign-ins.'],imp:'core',c:'win-credential-theft'}],
    ['Within two minutes, five PCs log a 4624 type 3 with NTLM for their own local Administrator, all from 10.0.5.31. Which change stops this spread next time?',['Lower the lockout threshold to three failed sign-ins','Rename every Administrator account so the shared name no longer works','Windows LAPS, plus deny network sign-in for local accounts','Block SMB to the DC, since it checks every NTLM sign-in'],2,'One shared password means one hash opens every PC. <a href="#junior/j1">Review: Windows Server and Active Directory</a>',{whys:['A stolen hash works on the first try, so lockout stays quiet.','A new name keeps the same password hash, and the hash is what opens each PC.','LAPS gives each PC its own password, and the deny right blocks local accounts over the network.','Each PC checks its own local accounts, so the DC plays no part here.'],imp:'core',c:'win-laps'}],
    ['Which plan hardens Honua’s admin accounts with the least risk to everyone else?',['Add every account today, since the group shuts off NTLM and weak Kerberos keys for all','Test admin accounts’ daily tasks, then add them; leave out accounts used offline on laptops','Add the service accounts first, since they are the accounts attackers roast most','Turn on WDigest so old web apps keep working, then add the admin accounts'],1,'Protected Users removes NTLM, RC4, delegation, and cached sign-in: office admins lose little; road-laptop accounts lose offline sign-in.',{whys:['Adding everyone breaks NTLM-only apps and offline sign-in on laptops.','Protected Users turns off NTLM and cached sign-in, so testing admins’ daily tasks first and leaving out offline laptop accounts keeps everyone else working.','Service accounts stay out of Protected Users; a gMSA protects them instead.','WDigest keeps plaintext passwords in memory, the opposite of hardening.'],imp:'good',c:'win-credential-theft'}],
    ['A vendor asks Honua to raise the Kerberos clock tolerance from 5 to 15 minutes because its badge appliance drifts. Your call?',['Accept it, since Kerberos tickets are encrypted anyway','Accept it, but set it for the appliance’s account alone','Refuse; point the appliance at the domain’s time source','Switch the appliance to NTLM, which ignores the clock'],2,'The five-minute window is the replay budget, set by one domain-wide policy for every account. <a href="#junior/j2">Review: Group Policy</a>',{whys:['Encryption leaves a resent request valid; the time window is what limits replay.','The tolerance is one domain-wide policy, so it widens for every account.','Fixing the appliance’s clock keeps the five-minute replay window.','NTLM brings back relay and pass-the-hash.'],imp:'good',c:'win-kerberos'}],
    ['sc.exe qc on HONUA-SRV1 shows UpdOrchestrator2: AUTO_START, LocalSystem, and C:\\Users\\Public\\upd\\orc.exe. The brief names no such service, and a teammate needs the program’s path for the report. Which plan holds up best?',['sc.exe delete it at once and answer from memory','Record the path and hash, stop and delete the service, remove the file, then look for a task or Run key that would recreate it','Disable it and leave the file, since a disabled service is harmless','Change its display name so users stop noticing it'],1,'Evidence first, then removal, then the hunt for what planted it.',{whys:['Memory makes weak evidence, and the delete removes the record a question may need.','The record answers the report, the delete and file removal end the persistence, and the hunt finds its way back in.','A disabled service keeps its file and its entry, so anything with admin rights can turn it back on.','A new label leaves the program running as LocalSystem at every boot.'],imp:'core',c:'host-malware-persistence'}],
    ['On HONUA-SRV1, accesschk -uwcqv "Authenticated Users" * lists the ReportAgent service as RW for Authenticated Users. What does that let a standard user do?',['Nothing, since the service already runs as SYSTEM','Point the service at their own program, which then starts as SYSTEM','Read the service’s process memory','Rename the service in the console'],1,'A standard user who can reconfigure a SYSTEM service owns SYSTEM; tighten the permissions so only administrators change it.',{whys:['Running as SYSTEM is the reason a user who can change the service gains SYSTEM.','Write access to the service’s configuration lets the user set its program to their own, which the service then runs as SYSTEM.','Reading LSASS memory is a separate attack; this finding is about who may reconfigure the service.','A rename changes a label and leaves the program and its account as they were.'],imp:'core',c:'host-file-permissions-shares'}],
    ['A teammate wants to run autorunsc straight from \\\\live.sysinternals.com\\tools on a hardened server that has no internet. Your call?',['Run it, since Sysinternals Live ships inside Windows','Copy the signed tool across, verify its signature, and run it locally, because the share needs internet and the WebClient service','Run it, since the share reaches the tools without a network','Skip it, since these tools have no command-line form'],1,'Sysinternals Live fetches each tool over the network, which a hardened host blocks; the download-and-verify route still works offline.',{whys:['Sysinternals Live is a Microsoft file share reached over the internet, rather than a feature built into Windows.','The share needs internet and the WebClient service, so on an offline host you copy the signed tool across, check its signature, and run it there.','The \\\\live.sysinternals.com path is a network share, so it needs the network the host blocks.','Each of these tools is a command-line program, so the claim is false.'],imp:'good',c:'crypto-signatures'}]
   ]),
   DETAIL('Credential-protection registry values',TIPS('<b>HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa:</b> LimitBlankPasswordUse 1, RestrictAnonymous 1, RestrictAnonymousSAM 1, NoLMHash 1, LmCompatibilityLevel 5 (0 sends LM and NTLMv1), EveryoneIncludesAnonymous 0, and RunAsPPL 1 (LSA protection).','<b>WDigest:</b> HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\WDigest UseLogonCredential 0.','<b>LLMNR:</b> HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\DNSClient EnableMulticast 0. <b>NetBIOS over TCP/IP:</b> NetbiosOptions 2 in each adapter’s Tcpip_ key under HKLM\\SYSTEM\\CurrentControlSet\\Services\\NetBT\\Parameters\\Interfaces; the SetTcpipNetbios method with TcpipNetbiosOptions 2 writes it for you.','<b>SMB signing:</b> Set-SmbServerConfiguration and Set-SmbClientConfiguration -RequireSecuritySignature $true. <b>LDAP on a DC:</b> NTDS\\Parameters LDAPServerIntegrity 2 and LdapEnforceChannelBinding 2.')),
   DETAIL('AD queries, hunting, Linux persistence, and Defender settings',TIPS('<b>AD attack-surface queries:</b> Search-ADAccount -PasswordNeverExpires; Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00; Get-ADUser -Filter {DoesNotRequirePreAuth -eq $true}; Get-ADUser -Filter {PasswordNotRequired -eq $true}; Get-ADUser -Filter {ServicePrincipalName -like "*"} -Properties ServicePrincipalName; Get-ADUser -Filter {AdminCount -eq 1}; Get-ADComputer -Filter {TrustedForDelegation -eq $true}. Fix flags with Set-ADAccountControl, and update a service’s stored credentials whenever its password changes.','<b>Hunting:</b> WMI subscriptions with Get-CimInstance -Namespace root\\subscription (__EventFilter, CommandLineEventConsumer, and __FilterToConsumerBinding); PowerShell profiles at $PROFILE.AllUsersAllHosts and $PROFILE.CurrentUserAllHosts; process chains with Get-CimInstance Win32_Process (ParentProcessId and CommandLine); autorunsc.exe from Sysinternals.','<b>Linux:</b> <a href="#junior/j3">Where persistence hides on Linux</a> maps the same places.','<b>Defender:</b> Get-MpPreference ExclusionPath, ExclusionProcess, and ExclusionExtension; ASR rule GUIDs from Microsoft’s reference.','<b>Advanced auditing:</b> auditpol /set /subcategory:"Process Creation" /success:enable, plus the ScriptBlockLogging policy key; subcategories worth turning on include Logon, Account Lockout, User Account Management, Security Group Management, Process Creation, and Audit Policy Change.','<b>AutoRun:</b> NoDriveTypeAutoRun 255 and NoAutorun 1 block USB-drop attacks. <b>OpenSSH Server</b> installs as a capability (Get-WindowsCapability -Online), and its firewall rule opens port 22; harden it as in <a href="#sophomore/s3">Debian-family hardening</a>.')),
   LINKS('Go further',['ms-credguard','ms-lsa-protect','ms-protected-users','ms-win-sec','ms-sysint','ms-baselines','t4t-ld-win11','t4t-ld-winsrv','t4t-lr-win'])
  ]},
 {id:'se8',title:'Windows: allow only what you trust',bloom:'Evaluate',sum:'Judge application control, attack surface reduction rules, admin tiers, and endpoint telemetry, then design a Windows baseline that a small business can run.',
  can:'judge application control, attack surface reduction, admin tiers, and endpoint telemetry, and design a Windows baseline a small business can run',
  blocks:[
   C('Allow what you trust','Evaluate',
     P('Kaimana Dental Clinic in Kailua has two dentists, a front desk (KAIMANA-FD1), and six Windows 11 Pro PCs, all Microsoft Entra joined and managed by Intune. Antivirus asks whether a file is known bad; <b>application control</b> asks whether it is on the list, so a brand-new tool with no signature still fails to run. <a href="#junior/j8">Windows: logons, tokens, and the event trail</a> named the rule types; here you weigh them.'),
     COMPARE('Four ways to recognize an allowed program',[
      {name:'Publisher',tag:'signature',tone:'ok',rows:[
        ['Survives an update','Yes: same signer, at or above the rule’s minimum version'],
        ['Can be gamed by','Anything else that publisher signed, including a flawed older build still above that minimum'],
        ['Best use','Signed commercial software, such as the clinic’s charting app']]},
      {name:'Path',tag:'folder',tone:'amber',rows:[
        ['Survives an update','Yes, while the update lands in the same folder'],
        ['Can be gamed by','Anyone who can write to that folder'],
        ['Best use','Folders only admins can write to, such as C:\\Program Files; never Downloads or Temp']]},
      {name:'Hash',tag:'one exact file',tone:'l2',rows:[
        ['Survives an update','No: each new build needs a new rule'],
        ['Can be gamed by','Almost nothing: only that exact file runs'],
        ['Best use','An unsigned tool that rarely changes, such as the X-ray sensor’s calibration utility']]},
      {name:'Managed installer',tag:'trust whatever your deployment tool installs',tone:'l3',rows:[
        ['Survives an update','Yes, when the same tool delivers it'],
        ['Can be gamed by','Whoever controls the deployment tool, so guard Intune admin roles like Tier 0'],
        ['Best use','Apps pushed by Intune or Configuration Manager; an app that updates itself still needs a publisher rule']]}
     ],{bloom:'Evaluate'}),
     COMPARE('App Control for Business and AppLocker',[
      {name:'App Control for Business',tag:'formerly WDAC',tone:'l2',rows:[
        ['Enforced','By the kernel, for the whole device'],
        ['Editions','Pro, Enterprise, and Education'],
        ['Covers','Drivers, DLLs, scripts, and installers'],
        ['PowerShell','Constrained Language Mode'],
        ['Path rule on a staff-writable folder','Ignored'],
        ['New features','Yes']]},
      {name:'AppLocker',tag:'the older option',tone:'muted',rows:[
        ['Enforced','Per user or group'],
        ['Editions','Not covered here'],
        ['Covers','Not covered here'],
        ['PowerShell','Not covered here'],
        ['Path rule on a staff-writable folder','Allowed, and a few C:\\Windows subfolders let users write'],
        ['New features','No']]}
     ],{note:'Both offer an audit mode; start every new policy there.',bloom:'Evaluate'})),
   QUIZ('se8ck1','Check yourself',[
     ['The charting app updates itself monthly into C:\\ProgramData\\ChartApp, a folder staff can write to; every build is signed by its vendor. Which App Control rule fits?',['A hash rule for today’s build','A path rule on C:\\ProgramData\\ChartApp','No rule yet, since audit mode already lets the app run','A publisher rule for the vendor’s signature'],3,'A signed app that updates itself needs a publisher rule; disabling the staff-writable path check lets anyone writing there run anything.',{whys:['A hash rule matches one exact build, so every monthly update breaks it.','Staff can write to that folder, so App Control ignores the rule and the app stays blocked.','Audit mode blocks nothing, and enforcement will block the app until a rule exists.','A publisher rule follows the vendor’s signature through every update.'],imp:'core',c:'win-app-control'}]
   ]),
   C('Stop the behavior: ASR rules and exploit protection','Evaluate',
     TIPS('<b>Host intrusion prevention</b> (HIPS) blocks an action as it happens, whichever file performs it: app control decides which programs may run; HIPS decides what running programs may do.',
          'HIPS sees only its own host, so pair it with network sensors (<a href="#senior/se11">Design the defended network</a>).',
          '<b>Start with the standard rules.</b> Microsoft names three ASR rules that rarely break anything: block credential stealing from LSASS, block abuse of exploited vulnerable signed drivers, and block persistence through WMI event subscription. Office rules (child processes, executable content from email, and obfuscated scripts) follow after an audit period.',
          '<b>Built-ins attackers borrow</b> (<a href="#junior/j8">living off the land</a>): the front desk never needs mshta or wmic, and App Control’s recommended block rules deny both by name. ASR stops Office from launching them, and 4688 and Sysmon 1 show any that remain. Block what the office never uses; watch what IT still needs.'),
     DETAIL('Windows builds it in',TIPS('<b>Attack surface reduction (ASR) rules</b>','<b>Exploit protection:</b> DEP, ASLR, and CFG make memory bugs crash instead of running code.','<b>Network protection:</b> blocks any program from reaching low-reputation hosts.','<b>Controlled folder access:</b> only trusted programs change protected folders such as Documents.')),
     COMPARE('Audit mode and block mode',[
      {name:'Audit mode',tone:'amber',rows:[
        ['App control','Everything runs; each program the policy would refuse is logged: 3076 (App Control) or 8003 (AppLocker)'],
        ['ASR rules','The action runs; 1122 in the Defender Operational log'],
        ['Use it','First, on a pilot PC, through a full business cycle such as month-end billing']]},
      {name:'Block mode',tone:'ok',rows:[
        ['App control','Untrusted code is refused (App Control calls this enforced mode): 3077 or 8004'],
        ['ASR rules','The action is stopped, with a notice to the user; 1121'],
        ['Use it','Once audit shows only gaps you have closed with allow rules']]},
      {name:'Warn mode',tag:'ASR only',tone:'l2',rows:[
        ['App control','No such mode: audit or enforce'],
        ['ASR rules','The block appears, and the user may unblock that action for 24 hours; the LSASS rule has no Warn'],
        ['Use it','Briefly, for a rule a few staff hit for a real reason, while you write a narrow exclusion']]}
     ],{note:'Audit mode protects nothing. A policy left in audit for a year is a log, not a control, so give every pilot an end date.',bloom:'Evaluate'})),
   ORDER('se8o','Roll out application control without breaking the front desk','The front desk books patients, bills insurance, and opens X-rays on KAIMANA-FD1. Tap the steps in a safe order.',[
     ['List every program the front desk runs, with its publisher and folder','First, because every rule later comes from this list: you can allow only what you have named, including month-end and insurance tools.'],
     ['Write a base policy: Windows, Microsoft-signed apps, Intune as managed installer, and publisher rules for the clinic’s vendors','Built from the list: it names the vendors that get publisher rules, which survive their updates.'],
     ['Deploy it in audit mode to KAIMANA-FD1 alone','Before anything is blocked, the new policy runs in audit on one pilot PC, so its gaps show up as events instead of outages.'],
     ['Collect the 3076 events through a full billing cycle','Audit mode has to be running to write these events, and only a full billing cycle reaches the rare month-end tasks.'],
     ['Add a rule for each needed program: publisher first, a hash for the unsigned X-ray utility','Each 3076 from the cycle names a program the policy missed, so the rules follow the evidence; never a path rule on a folder staff can write to.'],
     ['Switch KAIMANA-FD1 to enforce, with a rollback plan and the staff told','Only once the added rules close every gap does enforcement start, on the same pilot PC; 3077 events now mark real blocks.'],
     ['Watch the 3077 events and the calls for a week, and close each gap','3077 events appear only under enforcement, and each one is a missing rule or a catch to settle before going wider.'],
     ['Extend enforcement to the other five PCs','Last, because the policy is now proven on the busiest desk, so the other five PCs get the same tested policy.']
   ],'Evaluate'),
   C('Admins in tiers, through one door','Evaluate',
     HIER('Three admin tiers',
      {name:'Honua Logistics admin accounts',note:'keola holds one account per tier',tone:'muted',children:[
       {name:'Tier 0: identity',note:'Holds KONA-DC01, AD, Entra Connect, the certificate server, and DC backups. adm0_keola signs in only on Tier 0 machines and from his admin workstation',tone:'bad',children:[
        {name:'Never signs in to a server or a staff PC',tone:'muted'}]},
       {name:'Tier 1: servers',note:'Holds HONUA-SRV1 and its apps. adm1_keola signs in through the jump server',tone:'amber',children:[
        {name:'Never signs in to a staff PC',tone:'muted'}]},
       {name:'Tier 2: workstations',note:'Holds KAILUA-WS07 and every staff PC. adm2_keola does help-desk work; LAPS owns each local admin',tone:'l2',children:[
        {name:'Never holds rights on a server or a DC',tone:'muted'}]}]},
      {intro:'A password is only as safe as the least-guarded machine it was typed on, so higher tiers never sign in lower (<a href="#junior/j1">Windows Server and Active Directory</a> introduced Tier 0).'}),
     TIPS('<b>Enforce it.</b> GPOs on lower tiers give higher-tier groups <i>Deny log on locally</i>, <i>Deny log on through Remote Desktop Services</i>, and <i>Deny access to this computer from the network</i>.',
          'Authentication policy silos tie Tier 0 accounts to Tier 0 machines, and Tier 0 accounts join Protected Users.',
          'A 4624 for adm0_keola on KAILUA-WS07 is a violation to investigate.'),
     PATH('Admin work through a jump server',[
      {name:'Admin workstation',tag:'HONUA-PAW1',tone:'l1',note:'A privileged access workstation (PAW): admin work only, with app control enforced and email and browsing kept off',via:'Remote Desktop with Remote Credential Guard'},
      {name:'MFA',tag:'second factor',tone:'l2',note:'A security key or an authenticator prompt before the session opens',via:'session allowed'},
      {name:'Jump server',tag:'HONUA-JMP1',tone:'l3',note:'Patched first, records every session, reachable only from admin workstations',via:'Remote Desktop or WinRM'},
      {name:'Servers',tag:'HONUA-SRV1',tone:'ok',note:'The firewall accepts 3389 and 5985 only from HONUA-JMP1'}
     ],{note:'<b>Blocked:</b> keola’s everyday laptop, which reads email, reaching HONUA-SRV1 directly; one phishing click there would expose every admin password typed on it. <b>Weigh it:</b> the jump server is now the top target and a single point of failure, so patch it first and keep a documented break-glass path. <a href="#senior/se11">Design the defended network</a> builds the same door for routers and switches.'}),
     COMPARE('Credential Guard and Remote Credential Guard',[
      {name:'Credential Guard',tag:'the PC you sit at',tone:'l3',rows:[
        ['Protects','Domain hashes and TGTs held on this PC'],
        ['Secret stays','In LSAIso, walled off on this PC'],
        ['Stops','A memory read here, even as SYSTEM']]},
      {name:'Remote Credential Guard',tag:'the PC you reach',tone:'l2',rows:[
        ['Protects','The admin’s sign-in over Remote Desktop'],
        ['Secret stays','On the admin workstation; the far end sends its Kerberos requests back there'],
        ['Stops','Theft from the jump server’s memory']]}
     ],{intro:'Near-twin names, two different machines (<a href="#senior/se7">Windows: credentials and the domain attack surface</a> taught Credential Guard).',
       note:'<b>Turn it on:</b> the far end enables Remote host allows delegation of nonexportable credentials; the admin connects with <code>mstsc /remoteGuard</code> (Kerberos, inside a domain).',bloom:'Evaluate'})),
   DETAIL('Restricted Admin mode',
     P('The alternative to /remoteGuard, <code>mstsc /restrictedAdmin</code>, works for Administrators only, and the session reaches the network as the far end’s own computer.')),
   QUIZ('se8ck2','Check yourself',[
     ['The help desk asks to use adm0_keola on KAILUA-WS07 to fix a printer driver, because adm2_keola lacks one right. Your call?',['Allow it once, since a single quick sign-in leaves little exposure','Add adm2_keola to Domain Admins so it has every right it needs','Have keola type the adm0 password himself so the help desk never sees it','Refuse; grant the missing right to the Tier 2 account instead'],3,'Higher tiers never sign in lower, whoever types the password and however briefly.',{whys:['One Tier 0 sign-in on a staff PC can leave that password there for theft.','Domain Admins would make the help desk account Tier 0.','Whoever types it, a Tier 0 password typed on a staff PC can be stolen there.','A Tier 0 password never touches a staff PC, so close the gap where it is: one more right on the Tier 2 account.'],imp:'core',c:'win-admin-tiers'}]
   ]),
   C('Watch and record: antivirus, EDR, and Sysmon','Evaluate',
     COMPARE('Antivirus, EDR, and Sysmon',[
      {name:'Antivirus',tone:'l1',rows:[
        ['Judges','A file: known bad or not (<a href="#freshman/f13">Watch, detect, and respond</a>)'],
        ['Console and alerts','Its own'],
        ['Response','Quarantines the file'],
        ['Cost','Varies by product']]},
      {name:'EDR',tone:'l2',rows:[
        ['Judges','The chain: every process, parent, command line, connection, and file change'],
        ['Console and alerts','Yes, in a console (Microsoft Defender for Endpoint is one example)'],
        ['Response','One click kills a process or isolates the PC'],
        ['Cost','A license and someone on call']]},
      {name:'Sysmon',tone:'l3',rows:[
        ['Judges','Records much of the same chain; whoever reads the log judges it'],
        ['Console and alerts','None'],
        ['Response','None'],
        ['Cost','Free, and the log helps only once it is forwarded and read']]}
     ]),
     TIPS('<b>Weigh it for the clinic:</b> antivirus alone misses a trusted tool used badly; EDR sees the chain but needs someone to answer its alerts, so a two-dentist clinic pairs it with a managed service or an IT contractor on call. Sysmon suits a lab, or a team that already runs a SIEM.'),
     TERM('EDR alert  High  KAIMANA-FD1  2026-10-22T20:14:09Z\nTitle:   Suspicious process chain from an Office document\nTree:    EXPLORER.EXE\n           └ WINWORD.EXE  C:\\Users\\makana\\Downloads\\claim-form.docm\n               └ powershell.exe -nop -w hidden -enc JABjAD0A…\n                   └ connect 203.0.113.44:443\nASR:     Block all Office applications from creating child processes (Audit: allowed)\nActions: [Isolate device] [Collect investigation package] [Stop and quarantine]'),
     P('Read it top down: makana opened the saved attachment, Word started hidden PowerShell, and PowerShell reached an outside address at 10:14 in Kailua. The ASR rule saw it but was still in audit mode, so nothing stopped it. Antivirus found nothing in the file; the chain is the finding.')),
   QUIZ('se8ck3','Check yourself',[
     ['Kainoa, the clinic’s IT contractor, installs Sysmon on all six PCs and says the clinic now has EDR. Evaluate the claim.',['True: Sysmon is a Microsoft tool that logs processes, so it counts','True, once its log holds a week of history to compare against','False: Sysmon records events but has no console, alerts, or response actions','False: Sysmon logs only network connections, never process starts'],2,'Sysmon is telemetry, and it helps only once its log is forwarded and read.',{whys:['Sysmon logs processes, and EDR adds a console, alerts, and response actions.','A week of history adds context; EDR still means a console, alerts, and response.','Sysmon is telemetry, and EDR adds the console, alerts, and response actions.','Sysmon event 1 records process starts, so this reason fails.'],imp:'good',c:'det-endpoint-tools'}]
   ]),
   SEQ('Live response on one Windows PC: what to collect first',[
     ['Isolate in the EDR','The network is cut except the EDR console; power and memory stay. Note the live outside connections from the alert first.'],
     ['Capture volatile state with read-only built-ins','<code>Get-CimInstance</code> <code>Win32_Process</code> for parent ids and command lines (Windows PowerShell’s Get-Process omits the parent), <code>Get-NetTCPConnection</code>, <code>Get-ScheduledTask</code>, and <code>quser</code>, each saved to the evidence drive'],
     ['Export the logs','<code>wevtutil epl Security</code> <code>E:\\case\\FD1-Sec.evtx</code>, then System, PowerShell Operational, Sysmon, and Defender Operational'],
     ['Hash every export','<code>Get-FileHash</code> <code>-Algorithm SHA256</code> on each file, recorded in the case notes'],
     ['Hand off with the custody form','Who, when, why, and each hash (<a href="#junior/j13">Evidence that holds up</a>)']
   ],{intro:'A PC that may be spreading gets isolated first; then record before anything changes.',
     note:'Isolation keeps memory intact; pulling the plug loses it, and on a BitLocker laptop it can lock the disk without the escrowed recovery key. Write to an evidence drive, never to the suspect C: drive. Eradicate, recover, and lessons follow in <a href="#junior/j12">Respond to an incident</a> and <a href="#senior/se13">Run the response</a>.'}),
   ANATOMY('A defended laptop',[
     {name:'KAIMANA-FD1',tag:'Windows 11 Pro, Microsoft Entra joined',tone:'l2',grid:true,children:[
      {name:'Firmware',tone:'l4',text:'UEFI, Secure Boot, and TPM 2.0; memory integrity on'},
      {name:'Patching',tone:'l3',text:'Intune update rings for Windows, plus browser and vendor apps'},
      {name:'Accounts',tone:'l1',text:'Staff sign in as standard users; Windows LAPS owns the local admin'},
      {name:'Joined to',tone:'l2',text:'Domain, Entra, or hybrid; dsregcmd /status shows which, so you know whether GPOs or Intune set the rest'},
      {name:'Firewall',tone:'l3',text:'Defender Firewall on in every profile; inbound only what the brief needs'},
      {name:'Defender and EDR',tone:'ok',text:'Real-time and cloud protection, Tamper Protection, and the EDR sensor'},
      {name:'BitLocker',tone:'ok',text:'TPM protector; recovery key escrowed to Entra ID'},
      {name:'App control and ASR',tone:'amber',text:'App Control enforced; standard ASR rules in block'},
      {name:'USB control',tone:'amber',text:'Removable storage read-only, writable only with BitLocker To Go'},
      {name:'Logging',tone:'l1',text:'4688 with command lines, script block logging, and Sysmon, all forwarded'}]}
   ],{intro:'Endpoint security is layers on one device, each covering a gap the others leave.',
     caption:'Ten layers, one front-desk PC: a stolen laptop meets BitLocker, a macro meets ASR, and an unknown program meets app control.',bloom:'Evaluate'}),
   C('Weigh the baseline for a small office','Evaluate',
     TIPS('<b>Edition and release:</b> Pro at least, since Home lacks BitLocker management, domain join, and the policy consoles, and a release past its support date gets no fixes (<a href="#freshman/f5">First look at Windows</a>). Credential Guard needs Enterprise or Education.',
          '<b>Build and patch:</b> one hardened image, firmware checked before setup, BitLocker turned on per PC after deployment, and updates in rings: a pilot PC first, the rest days later (<a href="#sophomore/s2">Windows 11 hardening</a>).',
          '<b>Accounts and identity:</b> Windows LAPS everywhere; in a domain, quarterly checks for stale or never-expiring accounts, gMSAs for services, and LDAP signing required (<a href="#junior/j1">Windows Server and Active Directory</a>).',
          '<b>One policy source per setting:</b> GPOs in a domain, Intune on Entra-joined PCs; two sources that disagree leave a gap (<a href="#junior/j2">Group Policy</a>).',
          '<b>PowerShell stays, made visible:</b> script block logging, AMSI, and Constrained Language Mode through app control. Execution policy is a safety catch, not a lock (<a href="#junior/j2">Group Policy</a>).',
          '<b>Logs leave the PC:</b> forward the key events to a collector, a SIEM, or the EDR console, so a cleared log still leaves a copy (<a href="#junior/j8">Windows: logons, tokens, and the event trail</a>).',
          '<b>USB:</b> blocking all storage breaks the weekly X-ray referral; read-only plus BitLocker To Go keeps the referral and stops stray copies.')),
   QUIZ('se8q','Check: weigh the control',[
     ['After a full billing cycle in audit on KAIMANA-FD1, the only 3076 events are the unsigned X-ray calibration utility, unchanged for years, and a game in Downloads. Next step?',['Add a hash rule for the utility, then enforce; the game gets blocked','Stay in audit another quarter, since rare tasks may still be missing','Add a path rule for Downloads so staff downloads keep working too','Turn the policy off, since flagging a game shows it is too strict'],0,'Once a full billing cycle in audit shows only known gaps, close the needed ones with rules and enforce.',{whys:['A hash rule fits a stable unsigned tool, and enforcement then stops the game.','A full billing cycle already showed the rare tasks, and audit protects nothing meanwhile.','A path rule on Downloads lets anything staff save there run.','Flagging a game is the policy doing its job.'],imp:'core',c:'win-app-control'}],
     ['A teammate wants every ASR rule left in Warn mode for good, because Warn never breaks work. Your judgment?',['Agree: Warn shows the same block screen, so few staff click past it','Disagree: Warn lets the tricked user click through; move to Block','Agree, and set app control to Warn too so both behave the same way','Disagree: Audit records the same events and never interrupts staff'],1,'Use Warn briefly, while you write a narrow exclusion, then move to Block.',{whys:['In Warn mode the tricked user can unblock the action with one click.','Warn hands the choice to the person being tricked, so Block is the end state.','App control offers only audit and enforce, with no Warn mode.','Audit records the action and stops nothing.'],imp:'good',c:'win-app-control'}],
     ['Three proposals for reaching HONUA-SRV1: (a) Remote Desktop from any staff PC, (b) an admin workstation, MFA, and a logged jump server, (c) one shared admin laptop that also reads email. Which is defensible?',['(a)','(c)','(b)','Any, if passwords are long'],2,'One hardened, logged door with MFA, reached only from admin machines.',{whys:['Remote Desktop from any staff PC exposes admin passwords on every desk.','Email on an admin laptop invites the phishing click that exposes admin passwords.','Admin passwords then touch only hardened admin machines, MFA guards the door, and the jump server logs every session.','Long passwords still get stolen from a PC’s memory, so where you type them matters.'],imp:'core',c:'win-admin-tiers'}],
     ['Antivirus scanned claim-form.docm and found nothing, yet the EDR alert above fired. How can both be right?',['The antivirus definitions are out of date, so it missed a known file','Antivirus judged the file; EDR judged the chain of behavior it started','EDR compares file hashes against a larger list than antivirus uses','The alert is a false positive, since a file that passed a scan is clean'],1,'A trusted tool used badly passes a file check; EDR judges the behavior.',{whys:['The file holds a trusted tool used badly, which current definitions also pass.','The .docm holds a trusted tool used badly, so a file check passes it; Word starting hidden PowerShell that reaches outside is behavior, and EDR watches behavior.','EDR checks hashes too, yet its edge is judging behavior.','A clean scan shows only that the file passed the known-bad check.'],imp:'core',c:'det-endpoint-tools'}],
     ['KAIMANA-FD1 is calling 203.0.113.44 every minute. Healani, the office manager, wants to pull the power to be safe. What do you do?',['Isolate it in the EDR, keep it powered, then capture volatile state','Pull the power as she asks, since that stops the calls at once','Reboot it, which ends the malicious process and the calls along with it','Run a full antivirus scan first, then decide from what it finds'],0,'The EDR alert already records the live connection to 203.0.113.44, so isolate now and keep memory.',{whys:['Isolation stops the calls and keeps memory for capture.','Pulling the power erases memory and can lock the BitLocker disk.','A reboot also erases memory, the evidence of what ran.','The PC keeps calling out during the scan, and antivirus already missed this file.'],imp:'core',c:'det-containment'}],
     ['The new reception PC shipped with Windows 11 Home. What do you weigh before the baseline?',['Nothing: Home and Pro share the same security features','Move it to Pro or above, which has the management Home lacks','Keep Home and turn on Credential Guard to make up the gap','Keep Home, since a newer Home build beats an older Pro build'],1,'Edition decides which controls you can turn on; managed Entra ID join starts at Pro. <a href="#freshman/f5">Review: First look at Windows</a>',{whys:['Home lacks BitLocker management, domain join, and the policy consoles.','BitLocker management, domain join, and the policy consoles start at Pro, and the baseline relies on all three.','Credential Guard runs only on Enterprise or Education.','Edition decides which controls exist, and a newer build keeps Home’s gaps.'],imp:'good',c:'win-basics'}],
     ['A contractor says the execution policy is Restricted, so PowerShell is safe. Evaluate.',['Correct: Restricted stops every script, typed or saved, from running','Correct, when UAC is on, since scripts then need admin approval','Wrong: remove PowerShell entirely, the only safe choice left','Wrong: execution policy is a safety catch, not a security boundary'],3,'Constrained Language Mode through app control, script block logging, and AMSI do the real work. <a href="#junior/j2">Review: Group Policy</a>',{whys:['Typed commands still run under Restricted, and anyone can bypass it for one session.','UAC asks about admin rights, and execution policy stays a safety catch either way.','Admins depend on PowerShell; logging, AMSI, and Constrained Language Mode make it visible and limited.','Execution policy prevents accidents and leaves attackers an easy bypass.'],imp:'core',c:'win-script-logging'}],
     ['You exported Security.evtx from KAIMANA-FD1 to the evidence drive. What makes it hold up later?',['Renaming it with the case number and the date it was exported','Its SHA-256 hash recorded at export, plus a custody form','Keeping it on the suspect PC, where it was originally written','Zipping it with a password so no one can open it unnoticed'],1,'Hash at export, then record every hand-off on the chain-of-custody form: who, when, and why. <a href="#junior/j13">Review: Evidence that holds up</a>',{whys:['A name says nothing about whether the contents changed.','The SHA-256 hash proves the copy is unchanged, and the form records who held it.','The suspect PC is where the file may still change.','A password hides the contents and proves nothing about changes.'],imp:'core',c:'det-forensics'}],
     ['Kaimana wants only its own managed PCs to open the clinic’s cloud email. Which control decides that at sign-in?',['A stronger password policy for every clinic mailbox','A firewall rule on each clinic PC that allows only the clinic’s mail traffic','A Conditional Access rule requiring a compliant, Entra-joined PC','An MFA prompt on every sign-in, from any device'],2,'Passwords and MFA prove the person; Conditional Access also checks the device. <a href="#junior/j10">Review: Cloud security: identity, storage, and logs</a>',{whys:['A password policy proves the person rather than the device.','A firewall on clinic PCs guards those PCs, while other devices sign in from elsewhere.','Conditional Access checks the device’s join and compliance before it issues the token.','MFA proves the person from any device, so personal phones still get in.'],imp:'good',c:'win-device-join'}]
   ]),
   REFLECT('se8r','Design the baseline for Kaimana Dental Clinic from the Windows Range','Write the baseline for the six PCs at Kaimana Dental Clinic, the two-dentist practice from the Windows Range.<br>1. For each layer of the defended laptop: the setting you choose, the threat it stops, its cost to the clinic, and how you check it works.<br>2. Who holds admin rights, and on which accounts.<br>3. Which events leave the PCs, and where they go.<br>4. Which control you defer for now, and the risk you accept by waiting.'),
   LINKS('Go further',['ms-appcontrol','ms-asr','ms-privaccess','ms-sysint','ms-win-sec','t4t-lr-win'])
   ]},
 {id:'se9',title:'Linux: confine services and prove it',bloom:'Evaluate',sum:'Weigh the walls you can put around a Linux service, from accounts to containers, guard the boot and the mounts, and choose the audit rules that prove the walls hold.',
  can:'weigh the walls around a Linux service from accounts to containers, guard the boot and the mounts, and choose audit rules that prove the walls hold',
  blocks:[
   C('Walls around one service','Evaluate',
     P('Every service on makani-web will meet a flaw someday. <a href="#sophomore/s3">Debian-family hardening</a> shrank what runs; this unit limits how far a broken one reaches. Choose each wall for the risk in the brief, and write down what it stops, what it costs, and which check proves it.')),
   PATH('A broken web process meets each wall',[
     {name:'makai-api worker',tag:'runs as makai',tone:'bad',note:'A flaw in the stock API lets an intruder run code as makai.',via:'reads and writes files'},
     {name:'User permissions',tag:'makai owns only /var/lib/makai',tone:'l1',note:['Stops: reading /etc/shadow, the homes, and the site files','Leaves open: anything world-readable or world-writable, such as /tmp'],via:'runs a dropped file'},
     {name:'AppArmor profile',tag:'enforce mode',tone:'l3',note:['Stops: running files from /tmp and /dev/shm, and reads outside its listed paths','Leaves open: whatever the profile allows'],via:'tries to gain root'},
     {name:'systemd sandbox',tag:'directives in the unit',tone:'l2',note:['Stops: SUID programs raising privileges (NoNewPrivileges), and writes outside ReadWritePaths (ProtectSystem=strict)','Leaves open: the network and the kernel'],via:'tries to call home'},
     {name:'Egress rule',tag:'nftables output chain',tone:'ok',note:['Stops: new outbound connections from makai, except to the database and the resolver, and logs each drop','Leaves open: replies on allowed connections']}
   ],{bloom:'Evaluate',note:'Ubuntu leaves apache2, nginx, and your own app without an enforced AppArmor profile: you write one, test it in complain mode, then enforce it.',
     caption:'Walls stop different moves. The intruder needs all to fail; the defender needs one to hold and log the attempt.'}),
   COMPARE('Service account, chroot, container, and VM',[
     {name:'Service account',tag:'User=makai',tone:'l1',rows:[
      ['Separate','Which files it may read and write'],
      ['Shared','The file tree, the process list, the network, and the kernel'],
      ['How the wall weakens','World-writable files, a sudo rule, or a root-owned script it can edit'],
      ['Check','<code>sudo -l -U makai</code>; <code>ps -o user= -C makai-api</code>']]},
     {name:'chroot',tag:'a new /',tone:'amber',rows:[
      ['Separate','What the process sees as /'],
      ['Shared','Users, processes, the network, and the kernel'],
      ['How the wall weakens','A change of view, not a security boundary; root inside can leave'],
      ['Check','<code>sudo ls -l /proc/PID/root</code> and the process user, never root']]},
     {name:'Container',tag:'namespaces and cgroups',tone:'l3',rows:[
      ['Separate','Its own process list, network, hostname, and file tree, with CPU and memory limits'],
      ['Shared','The host kernel: one kernel flaw reaches every container'],
      ['How the wall weakens','<code>--privileged</code>, the host’s / or docker.sock mounted inside, or root inside'],
      ['Check','<code>docker inspect NAME</code>: Privileged, Mounts, and User']]},
     {name:'VM',tag:'its own kernel',tone:'l4',rows:[
      ['Separate','A whole kernel, memory, and virtual hardware'],
      ['Shared','The hypervisor and the physical machine'],
      ['How the wall weakens','Shared folders, a shared clipboard, or a bridge onto the server network'],
      ['Check','The VM settings: shared folders off, network on its own segment']]}
   ],{bloom:'Evaluate',intro:'Stronger walls cost more memory, start-up time, and upkeep. Pick the lightest wall that holds for the risk, as on <a href="#junior/j12">the isolation ladder</a>: a stock API earns its own account plus a sandbox; members’ untrusted code earns a VM.',
     caption:'Only the VM brings its own kernel.'}),
   DETAIL('FreeBSD jails, network segments, and air gaps',
     P('A FreeBSD jail sits at the container level: its own processes, users, and address on one shared kernel. Past the VM, the wall moves to the network: <a href="#junior/j6">its own segment behind a firewall</a>, and at the top an air gap, where updates by hand make the USB stick the risk.')),
   QUIZ('se9cy','Check yourself',[
     ['A vendor says its service is safe because it runs as root inside a chroot. Your judgment?',['Safe: a chroot is a sealed box','Weak: a chroot changes the view, and root inside can leave; run it as its own user in a systemd sandbox','Safe when the chroot folder is small','Safe once the chroot holds no shell or compiler'],1,'A chroot hides the rest of the tree from a non-root process; it never limits root.',{whys:['A chroot changes what the process sees as /, and root inside can leave.','A chroot changes the view; its own user plus a systemd sandbox limits the reach.','Size changes nothing: root can leave a chroot of any size.','Fewer tools help a little, and root inside can still leave.'],imp:'core',c:'comp-isolation'}]
   ]),
   C('Sandbox the unit and score it','Evaluate',
     P('<code>systemd-analyze security makai-api</code> scores how much of the system a service can reach, from 10 (all of it) toward 0. Each line names a directive and what its absence exposes.'),
     TERM('$ systemd-analyze security makai-api.service   (trimmed)\n  NAME              DESCRIPTION                                   EXPOSURE\n✗ NoNewPrivileges=  Service processes may acquire new privileges      0.2\n✗ ProtectSystem=    Service has full access to the OS file hierarchy  0.2\n✗ ProtectHome=      Service has full access to home directories       0.2\n✗ PrivateTmp=       Service has access to other software\'s temporary files  0.2\n✓ User=/DynamicUser= Service runs under a static non-root user identity\n→ Overall exposure level for makai-api.service: 9.2 UNSAFE'),
     SCALE('How exposed is this unit?',{from:'Wide reach',to:'Small reach',bands:[
      ['9.6 UNSAFE','A bare unit running as root','bad'],
      ['9.2 UNSAFE','User=makai alone: no root, yet the whole file tree, every socket type, and every system call stay in reach','bad'],
      ['About 7 MEDIUM','+ NoNew<wbr>Privileges, Protect<wbr>System=strict, Protect<wbr>Home, and Private<wbr>Tmp','amber',1.3],
      ['About 4 OK','+ an empty Capability<wbr>Bounding<wbr>Set and Restrict<wbr>Address<wbr>Families','l3',1.2],
      ['About 2 OK','+ System<wbr>Call<wbr>Filter=<wbr>@system-service','ok',1.1]]},
      {bloom:'Evaluate',intro:'Each step adds directives to the one before.',
       note:'Add them in a drop-in (<code>sudo systemctl edit makai-api</code>), restart, and test the app after each one. <code>ProtectSystem=strict</code> makes the whole tree read-only, so add <code>ReadWritePaths=/var/lib/makai</code> for the data the app writes. Scores vary a little by systemd version.',
       caption:'The score measures reach, never the app’s bugs: stop at the lowest score where the app still passes its tests.'})),
   QUIZ('se9cy2','Check yourself',[
     ['makai-api drops from 9.2 to 2.1 in systemd-analyze security. What has that proved?',['The app has no flaws','Every attack is now logged','AppArmor is enforcing','A flaw now reaches far less of the system; the app still needs patches and tests'],3,'The score measures reach, never bugs.',{whys:['A lower score shrinks reach; the app’s bugs stay until patched.','The score covers sandbox directives; auditd does the logging.','systemd-analyze scores the unit’s directives, separate from AppArmor.','A flaw now reaches less, and the app still needs patches and tests.'],imp:'good',c:'lin-confinement'}]
   ]),
   C('Judge the profile, not its mode alone','Evaluate',
     COMPARE('Complain and enforce',[
      {name:'Complain',tag:'watches',tone:'amber',rows:[
       ['What happens','The action runs; the log notes what the profile would block'],
       ['Log line','<code>apparmor="ALLOWED"</code>'],
       ['aa-status','Listed under “profiles are in complain mode”'],
       ['When','While you test the profile against the app’s normal work']]},
      {name:'Enforce',tag:'blocks',tone:'ok',rows:[
       ['What happens','The action outside the profile fails, and the log records it'],
       ['Log line','<code>apparmor="DENIED"</code>'],
       ['aa-status','Listed under “profiles are in enforce mode”'],
       ['When','Once normal work logs zero ALLOWED lines: <code>sudo aa-enforce /etc/apparmor.d/usr.local.bin.makai-api</code>']]}
     ],{bloom:'Evaluate',caption:'An ALLOWED line is a block that never happened.'}),
     TIPS('<b>Read the rules.</b> <code>/** rwix,</code> lets the program read, write, and run anything, so the profile confines nothing. A tight one names paths: <code>/var/lib/makai/** rw,</code> and <code>deny /tmp/** x,</code>.',
          '<b>Weigh every generated rule.</b> <code>aa-logprof</code> (and <code>audit2allow</code> on SELinux) turns logged denials into allow rules. A denial logged during an attack becomes a permanent hole if you accept it unread.',
          '<b>“unconfined but have a profile defined”</b> in <code>aa-status</code> means the process started before its profile loaded: restart it.')),
   COMPARE('Which audit rule proves the wall held?',[
     {name:'Path watch',tag:'one file or folder',tone:'l2',rows:[
      ['Rule','<code>-w /etc/apparmor.d -p wa -k mac</code>'],
      ['Proves','Who changed a wall (profiles here; add /etc/systemd/system), and when'],
      ['Noise','Low: those folders rarely change'],
      ['Query','<code>sudo ausearch -k mac -i</code>'],
      ['Gap or cost','Records changes only (writes and attribute changes); pair it with the execve rule to see what ran afterward']]},
     {name:'Syscall rule',tag:'execve by real users',tone:'l3',rows:[
      ['Rule','<code>-a always,exit</code> <code>-F arch=b64</code> <code>-S execve</code> <code>-F auid>=1000</code> <code>-F auid!=unset</code> <code>-k exec</code>'],
      ['Proves','Every program a signed-in person started, even after sudo: the audit user ID (auid) follows the person'],
      ['Noise','High on busy hosts; the auid filter drops services and root’s cron jobs'],
      ['Query','<code>sudo aureport -x --summary</code>; <code>sudo ausearch -k exec -ua 1001 -i</code>'],
      ['Gap or cost','Programs makai-api starts (auid unset): add a rule with <code>-F uid=makai</code>']]},
     {name:'Lock the rules',tag:'fixed until reboot',tone:'l4',rows:[
      ['Rule','<code>-e 2</code> as the last line'],
      ['Proves','The rules stay as loaded until a reboot; a change attempt fails and is logged'],
      ['Noise','None'],
      ['Query','<code>sudo auditctl -s</code> shows <code>enabled 2</code>'],
      ['Gap or cost','Every rule change needs a reboot, which shows in <code>journalctl --list-boots</code>']]}
   ],{bloom:'Evaluate',intro:'<a href="#junior/j3">Debian and deeper Linux</a> watched one folder. Rules live in /etc/audit/rules.d/ and load with <code>sudo augenrules --load</code>.',
     note:'Add the execve rule again with <code>arch=b32</code>, or 32-bit programs slip past it.',
     caption:'Watch, record, then lock.'}),
   QUIZ('se9cy3','Check yourself',[
     ['Which audit rule shows that someone loosened the makai-api AppArmor profile?',['<code>-w /etc/apparmor.d -p wa -k mac</code>','The execve rule filtered on auid','<code>-e 2</code>','<code>auditctl -s</code>'],0,'A path watch on the profile folder records who wrote to it; the execve rule records programs run.',{whys:['A path watch on /etc/apparmor.d records who wrote to the profiles, and when.','The execve rule records programs people start, rather than file changes.','-e 2 locks the rule set; the path watch does the recording.','auditctl -s reports auditd’s status, such as enabled 2; a path watch is what records writes to the profiles.'],imp:'good',c:'lin-auditd'}]
   ]),
   C('Close the way out','Evaluate',
     TERM('# /etc/nftables.conf (excerpt): makai may reach only its database and the resolver\ntable inet egress {\n  chain out {\n    type filter hook output priority 0; policy accept;\n    ct state established,related accept\n    meta skuid makai ip daddr 10.0.20.15 tcp dport 5432 accept\n    meta skuid makai ip daddr 10.0.20.53 meta l4proto { tcp, udp } th dport 53 accept\n    meta skuid makai log prefix "makai-egress " drop\n  }\n}'),
     TIPS('<b>Pair it with the network.</b> The host rule covers one service; <a href="#junior/j6">egress filtering</a> at the firewall covers every host.')),
   DETAIL('Egress: host rule or systemd unit rule',
     COMPARE('Host rule or unit rule?',[
      {name:'Unit rule',tone:'l2',rows:[
        ['Written as','<code>IPAddressDeny=any</code>, with <code>IPAddressAllow=</code> naming the database, the resolver, and every address its clients come from, such as <code>localhost</code> behind a reverse proxy'],
        ['Direction','Both'],
        ['Logs','Nothing'],
        ['Lives','With the service']]},
      {name:'Host rule',tone:'l3',rows:[
        ['Written as','<code>meta skuid makai</code> in nftables; <code>-m owner --uid-owner makai</code> in iptables'],
        ['Direction','Outbound only'],
        ['Logs','Each drop'],
        ['Lives','With the other firewall rules']]}
     ])),
   C('Weigh the rest of the baseline','Evaluate',
     TIPS('<b>Disk encryption guards a powered-off disk.</b> LUKS protects a stolen laptop or drive; a running server’s disk sits unlocked, so LUKS does nothing against a remote intruder.',
          '<b>A server that reboots unattended</b> needs a TPM-bound key or a network unlock, with the recovery passphrase kept off the host.',
          '<b>Lock the account or block the address.</b> faillock stops guessing at one account, and anyone can use it to lock out the owner.',
          'fail2ban blocks the guessing address and misses a slow spray from many.',
          '<b>Keys only.</b> On an SSH server, <code>PasswordAuthentication no</code> removes the guessing; fail2ban then just trims log noise.',
          '<b>Removable storage.</b> A server in a locked rack gets USB storage blocked (details below); a lab PC where students carry files keeps it, scanned.')),
   DETAIL('TPM unlock tools on Ubuntu and Mint',
     P('A TPM-bound key comes from Clevis on Ubuntu 24.04 and Mint 22, or from <code>systemd-cryptenroll --tpm2-device=auto</code> where the initramfs is dracut, as on newer Ubuntu releases.')),
   DETAIL('The same trade-offs on Windows',
     TIPS('<b>App control</b> has the same pair as complain and enforce: audit mode and block mode (<a href="#senior/se8">Windows: allow only what you trust</a>).',
          '<b>BitLocker</b> does the same job as LUKS, and Windows weighs the lockout trade with its <b>account lockout threshold</b>.',
          '<b>Removable storage:</b> Windows uses Group Policy’s Removable Storage Access settings (<a href="#sophomore/s2">Windows 11 hardening</a>), weighed again in <a href="#senior/se8">Windows: allow only what you trust</a>.',
          '<b>One baseline, two systems.</b> AppArmor limits what a running program may touch; app control decides which programs may run at all, so they cover different moves.',
          'auditd execve rules and process-creation events both record what ran.')),
   C('Guard the boot and the mounts','Apply',
     CMDS('The boot chain on Ubuntu and Mint',[
      ['shim','Microsoft-signed, so Secure Boot firmware starts it; it then checks the distribution-signed GRUB and kernel'],
      ['mokutil','<code>mokutil --sb-state</code> prints SecureBoot enabled or disabled. A Machine Owner Key (MOK) lets you sign your own modules'],
      ['superusers','The GRUB superuser and the hash from <code>grub-mkpasswd-pbkdf2</code> go in /etc/grub.d/40_custom; then <code>sudo update-grub</code>'],
      ['recovery','Recovery mode opens a root shell without a password, so GRUB needs its own; mark the normal entry <code>--unrestricted</code> so unattended reboots still start'],
      ['grub.cfg','Holds the password hash; GRUB reads it before Linux starts, so <code>sudo chmod 600 /boot/grub/grub.cfg</code> hides it from local users and booting still works. Recheck the mode after each update-grub']]),
     CMDS('Mounts on /tmp, /var/tmp, and /dev/shm, and USB storage',[
      ['nodev','Device files there reach no hardware'],
      ['nosuid','SUID and SGID bits there do nothing'],
      ['noexec','Files there cannot run directly (one layer, never the wall)'],
      ['findmnt','<code>findmnt /tmp</code> shows the options in force; set them in /etc/fstab, then remount'],
      ['modprobe.d','usb-storage.conf here with <code>install usb-storage</code> <code>/bin/false</code> leaves USB drives unusable while keyboards still work']])),
   C('Prove it every night','Create',
     P('Turn the checks into a script that prints one line per weak wall, then logs a closing line. An empty result plus the closing line is the proof; alert when the closing line goes missing.'),
     TERM('#!/bin/bash\n# wallcheck.sh: one line per weak wall; run as root\nsystemd-analyze security --no-pager | awk \'NR>1 && $1 ~ /^makai/ && $2 > 5 {print "EXPOSED", $1, $2}\'\n[ "$(aa-status --complaining)" -eq 0 ] || echo "COMPLAIN profiles loaded"\nauditctl -s | grep -q \'^enabled 2\' || echo "audit rules unlocked"\nfor m in /tmp /var/tmp /dev/shm; do\n  o=$(findmnt -no OPTIONS "$m")\n  for f in nodev nosuid noexec; do [[ $o == *$f* ]] || echo "$m lacks $f"; done\ndone\nmokutil --sb-state | grep -q enabled || echo "Secure Boot off"\nlogger -t wallcheck done   # closing line: its absence means the check stopped'),
     TIPS('<b>Score only the services you sandboxed.</b> Stock services such as ssh and cron score high by design, so the first check keeps just the makai units.',
          '<b>Run it from a systemd timer.</b> It logs each run to the journal, and <code>Persistent=true</code> catches a run missed while the server was off.',
          '<b>Own the timer.</b> A timer is also a persistence spot: keep it root-owned in /etc/systemd/system and record it in the change log.',
          '<b>Send output somewhere you trust.</b> <code>logger -t wallcheck</code> puts each line in syslog, which forwards it off the host before an intruder can edit it.')),
   SPOT('se9sp','Audit a unit file and an AppArmor status','Malia hardened makai-api, the stock API that runs on makani-web, and pasted the unit and the AppArmor status for review. Tap every line that weakens a wall or shows one failing, then Check.',[
     ['# /etc/systemd/system/makai-api.service   [Service] section',null],
     ['User=makai',null],
     ['ExecStart=/usr/local/bin/makai-api --port 8000',null],
     ['EnvironmentFile=/home/kai/makai.env','A file kai can edit sets the service’s environment, such as LD_PRELOAD. Move it to /etc/makai, owned by root.'],
     ['NoNewPrivileges=yes',null,'Keeps the service and its children from gaining power through SUID programs: a wall that holds.'],
     ['ProtectSystem=strict',null,'Mounts the whole file tree read-only for the service; ReadWritePaths should then open its data folder alone.'],
     ['ReadWritePaths=/','Makes the whole tree writable again, undoing ProtectSystem=strict. Name only /var/lib/makai.'],
     ['AmbientCapabilities=CAP_SYS_ADMIN','Hands the service near-root power; port 8000 needs no capability at all.'],
     ['PrivateTmp=yes',null],
     ['$ sudo aa-status   (trimmed)',null],
     ['36 profiles are in enforce mode.',null,'Enforce mode blocks what each profile forbids: the state you want. The finding is the profile listed under complain mode.'],
     ['1 profiles are in complain mode.',null],
     ['   /usr/local/bin/makai-api','The internet-facing service is in complain mode, so its profile blocks nothing. Enforce it after testing.'],
     ['1 processes are unconfined but have a profile defined.',null],
     ['   /usr/sbin/chronyd (612)','Started before its profile loaded, so it runs unconfined. Restart it.'],
     ['$ sudo journalctl -k | grep apparmor   (trimmed)',null],
     ['apparmor="ALLOWED" operation="exec" profile="/usr/local/bin/makai-api" name="/dev/shm/.k"','The service ran a hidden file from /dev/shm, and complain mode let it. Record the evidence, then treat the host as compromised.']
   ]),
   REFLECT('se9r','Defend your confinement plan for a Hilo web server','Plan the confinement for Hilo Lehua Clinic’s appointment site: one web app and one database on an Ubuntu server in a locked closet.<br>1. Choose your walls: the account, the systemd directives, the AppArmor profile, one egress rule, two audit rules, and the boot and mount settings.<br>2. For each wall: what it stops, what it costs the clinic, and one wallcheck.sh line that prints only when the wall is weak.<br>3. One wall you left out, and why its cost outweighs the risk it covers.'),
   QUIZ('se9q','Check: weigh the wall',[
     ['Mānoa Makerspace wants to run members’ untrusted code. Containers or VMs?',['Containers: lighter and just as strong','A VM per job: containers share the host kernel, so one kernel flaw reaches the host','A chroot per job','Root containers, to avoid errors'],1,'Untrusted code earns the wall with its own kernel.',{whys:['Containers share the host kernel, so one kernel flaw reaches the host.','A VM brings its own kernel, so a kernel flaw stays inside the VM.','A chroot changes the view alone, and root inside can leave.','Root inside a container weakens the wall further.'],imp:'core',c:'comp-isolation'}],
     ['After <code>-e 2</code>, Keola needs a new audit rule during an incident. What does it cost?',['Nothing: auditctl -a adds it','A reboot: locked rules change only at boot, and the reboot shows in journalctl --list-boots','Nothing: <code>augenrules --load</code> replaces the locked set','Nothing: stop auditd, add the rule, and start it again'],1,'That cost is the point: an intruder with root cannot quietly turn auditing off.',{whys:['Locked rules refuse auditctl -a until the next boot.','A reboot is the price, and journalctl --list-boots records it.','augenrules --load also waits for a reboot once the rules are locked.','Stopping auditd counts as a change, and the lock holds until a reboot.'],imp:'good',c:'lin-auditd'}],
     ['The owner asks whether LUKS on makani-web stops a remote intruder. Your answer?',['Yes: the files are encrypted','Yes, as long as the TPM holds the key','No: a running server’s disk is unlocked; LUKS protects a disk that is off or stolen','Partly: it hides files from users without sudo'],2,'Encryption at rest guards the powered-off disk; a TPM key only unlocks it at boot.',{whys:['A running server’s disk is unlocked, so encryption hides nothing from a remote intruder.','A TPM unlocks the disk at boot, so it stays open while the server runs.','LUKS guards a disk that is off or stolen; a running server’s disk is open.','File permissions decide what each user reads; LUKS stays out of that.'],imp:'core',c:'host-disk-encryption'}],
     ['makani-web sees a slow SSH password spray from 400 addresses. Strongest fix?',['fail2ban with a lower maxretry','faillock deny=3 on every account','Keys only: PasswordAuthentication no','Move SSH to another port'],2,'With no password to guess, the spray has nothing to win; fail2ban misses slow, spread guessing, and faillock locks real users out.',{whys:['fail2ban counts per address, and a slow spray spread over 400 addresses keeps each one under its limit.','faillock locks real users out while the spray keeps going.','With keys only, the spray has no password to guess and wins nothing.','A new port trims log noise, and one scan finds it again.'],imp:'core',c:'host-login-policy'}],
     ['A kiosk PC at Kahikina High shows a GRUB menu with no password. Why does that matter?',['It only slows booting','Secure Boot covers it','Only a firmware password matters, since GRUB runs after it','Anyone at the keyboard can pick recovery mode or edit the boot line for a root shell'],3,'Set a GRUB superuser password and keep the normal entry unrestricted.',{whys:['A GRUB menu without a password hands recovery mode to anyone at the keyboard.','Secure Boot checks signatures, and a signed GRUB still opens recovery mode.','The firmware password guards setup; GRUB runs next and needs its own.','Recovery mode or an edited boot line gives a root shell, so GRUB needs a password.'],imp:'good',c:'host-disk-encryption'}],
     ['The makai-egress log shows drops to 203.0.113.9:443 every 60 seconds. Which control from Junior covers every other host too?',['Egress filtering at the firewall: allow only needed outbound services, deny and log the rest','A guest VLAN','WPA3','NAT'],0,'A 60-second rhythm is a beacon; the host rule caught one service. <a href="#junior/j6">Review: Network security design: firewalls, zones, VPNs, and Wi-Fi</a>',{whys:['Egress filtering at the firewall covers every host: allow needed outbound, deny and log the rest.','A guest VLAN separates visitors and leaves server traffic as it was.','WPA3 protects Wi-Fi, and the beacon leaves over the wired network.','NAT rewrites addresses and lets outbound connections out.'],imp:'core',c:'net-firewall-design'}],
     ['The same log puts the beacon on makani-web, which is quiet and spreading nothing. First containment step?',['Shut it down now','Record its connections, then isolate the host','Kill the beaconing process, then keep watching','Reboot to clear memory'],1,'Its egress rule already drops the beacon, so record its connections, then isolate it; a host whose calls still get out, or that is spreading, gets isolated first, as in the live response of <a href="#senior/se8">Windows: allow only what you trust</a>. Keep it powered on, because power-off loses memory. <a href="#junior/j12">Review: Respond to an incident: triage, contain, and recover</a>',{whys:['Shutting it down loses the memory evidence.','Its egress rule already drops the beacon, so record its connections, then isolate it.','Killing the process destroys evidence while the host stays on the network.','A reboot clears memory, the evidence you need.'],imp:'core',c:'det-containment'}]
   ]),
